###############################################################################
# ZenOS-AI — Authentik Plugin (STUB — nothing real built yet)
#
#   zen_root_authentik   <- internal broker (NOT MCP-exposed)
#
# Placeholder only — no rest_command, no network call, nothing that reaches a
# real endpoint. Exists so zen_dojotools_identity's resolve_caller_identity
# has a real call-site with a stable contract, so wiring real OIDC later is a
# drop-in swap, not a redesign.
#
# caller_token is checked for JWT-like shape (override attempted vs not) but
# shape is not proof — always resolves to the default agent regardless. See
# feedback_caller_id_not_authenticated.
#
# sim_mode is THE flip point (_sim_mode literal below). Consumers thread it
# through their own output rather than re-derive "is this real." See
# project_sp1_acl_candidates.
#
# This is a public tool. No real names/emails/PII anywhere in this file.
###############################################################################

script:
  zen_root_authentik:
    alias: Zen Root — Authentik Broker (Internal, STUB)
    description: >
      Stub only — no real Authentik/OIDC call exists anywhere in this script.
      Detects JWT-like shape on caller_token (override attempted vs not) but
      does not validate it — always resolves to the default agent cabinet
      regardless. Returns sim_mode: true (the single flip point for this
      whole file — see header comment). Not MCP-exposed.
    mode: parallel
    max: 10
    fields:
      caller_token:
        name: Caller Token
        description: >-
          Optional. If present and JWT-shaped, flagged as an override attempt
          in the response (override_attempted: true, token_shape: jwt_like) —
          but NOT validated or honored yet, no signature verification exists.
          Resolution always falls back to the default agent cabinet regardless.
        selector:
          text:
    sequence:
      - variables:
          # ── THE flip point. Literal, not computed. See header comment. ──
          _sim_mode: true
      - variables:
          _token: "{{ caller_token | default('') | string | trim }}"
          _token_shape: >-
            {%- if _token == '' -%}none
            {%- elif _token is match('^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$') -%}jwt_like
            {%- else -%}present_unrecognized_shape
            {%- endif -%}
      - variables:
          response:
            status: success
            tool: zen_root_authentik
            sim_mode: "{{ _sim_mode }}"
            override_attempted: "{{ _token_shape != 'none' }}"
            token_shape: "{{ _token_shape }}"
            resolved_identity:
              entity_id: "{{ states('sensor.zen_default_ai_user_cabinet_resolved') }}"
              auth_method: "{{ 'shunt_default_agent' if _sim_mode else 'oidc_client_credentials' }}"
            note: >-
              {%- if not _sim_mode -%}
                sim_mode is false but this script has no real implementation past the flip point — this state should not be reachable yet.
              {%- elif _token_shape == 'jwt_like' -%}
                sim_mode — token looks JWT-shaped (override attempted) but cannot be verified yet, no signature check exists. Still resolving to the default agent cabinet.
              {%- elif _token_shape == 'present_unrecognized_shape' -%}
                sim_mode — a caller_token was sent but doesn't look like a real ticket. Resolving to the default agent cabinet.
              {%- else -%}
                sim_mode — no Authentik integration exists yet. Always resolves to the default agent cabinet.
              {%- endif -%}
            caller_token: "{{ _token }}"
      - stop: "authentik broker done"
        response_variable: response
