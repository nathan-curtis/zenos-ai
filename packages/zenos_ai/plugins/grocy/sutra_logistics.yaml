###############################################################################
# ZenOS-AI Sutra: Logistics Report
# Version: 1.1.0
#
# Scripts:
#   zen_sutra_logistics — KFC manifest provider for household logistics signals.
#
# Two KFC components, refreshed daily_midnight + daily_noon:
#   logistics_intake    — items waiting at catalog intake location (Kitchen Island)
#   logistics_volatile  — stock about to expire or already overdue
#
# Battery KFC component moved to zen_stack_battery (battery_health).
# Seeded via existing tools — no new API calls required.
# Wired by: zen_dojotools_manifest mode=bootstrap_kfc
#
# HALMark: PENDING
###############################################################################

script:
  zen_sutra_logistics:
    alias: Zen Sutra Logistics
    description: >-
      Logistics Report KFC provider (v1.1.0). Declares two dojo components:
      intake (items at Kitchen Island), volatile (expiring/overdue stock).
      Refreshed at noon and midnight. Battery KFC lives in zen_stack_battery.
      mode=kfc_manifest: returns component definitions for bootstrap_kfc.
      mode=tool_manifest: self-description.
    mode: parallel
    fields:
      mode:
        description: kfc_manifest | tool_manifest | help
        selector:
          select:
            options:
            - kfc_manifest
            - tool_manifest
            - help
      component:
        description: Filter to a single KFC component key (for live drawer resolution)
        selector:
          text:
      caller_token:
        description: Opaque correlation token
        selector:
          text:
    sequence:
    - variables:
        _mode_norm: >-
          {{ (mode | default('help') if mode is defined and mode | string | trim != '' else 'help')
             | string | trim | lower }}
        _component_filter: "{{ component | default('') | string | trim | lower if component is defined else '' }}"
        tool_name: zen_sutra_logistics
        tool_version: 1.1.0

    # ── tool_manifest ──────────────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ _mode_norm == 'tool_manifest' }}"
        sequence:
        - variables:
            final_response:
              status: ok
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              tier: sutras
              domain: logistics
              kfc_manifest: true
              kfc_components:
              - logistics_intake
              - logistics_volatile
              preferred_state:
                stripe: 2
                impact: soft
                required_labels: ['dojotools']
                setup_steps: ['zen_dojotools_manifest mode=bootstrap_kfc']
        - stop: tool_manifest
          response_variable: final_response

    # ── kfc_manifest ───────────────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ _mode_norm == 'kfc_manifest' }}"
        sequence:
        - variables:
            _kfc_defs:
            - kata_key: logistics_intake
              friendly_name: Catalog Intake Semaphore
              label: Logistics Intake
              component_summary: >-
                Items currently sitting at the catalog intake location (Kitchen Island).
                Non-empty means physical items are waiting to be shelved or processed.
              component_instructions: >-
                You will receive a stock_list_by_location result. Work only from
                the data provided.

                result.items is a list of products at the intake location.

                If result.items is empty or missing or result.total_items == 0:
                urgency=0, attention=null, watchlist=[], error=null,
                general_inference: "Intake location clear."

                If items present:
                urgency=3. attention: "Items waiting at Kitchen Island — need shelving."
                watchlist: list each item name. general_inference: short summary of
                what is there and how many items total.
              tool: zen_sutra_logistics
              seed:
                tool: zen_dojotools_inventory
                params:
                  mode: stock_list_by_location
                  location: Kitchen Island
              trigger_subscriptions: daily_midnight,daily_noon
              drift_threshold: 12
              emission_cooldown_minutes: 720
              delay_seconds: 0
              meta:
                enabled: true
                requires:
                  cert: ''
                  level: 0

            - kata_key: logistics_volatile
              friendly_name: Stock Spoilage & Expiry
              label: Logistics Volatile
              component_summary: >-
                Household stock that is overdue (past best-before) or expiring soon.
                Surfaces the "filet mignon is about to spoil" class of alerts.
              component_instructions: >-
                You will receive a stock_list_volatile result. Work only from the data provided.

                result has keys: overdue_products (list), due_dates (dict), expiring_products (list).

                If all lists are empty: urgency=0, attention=null, watchlist=[], error=null,
                general_inference: "No stock expiry issues."

                If overdue_products present:
                urgency=4. attention: "Overdue stock — past best-before date."
                watchlist: list each overdue product name.

                Else if expiring_products present:
                urgency=3. attention: "Items expiring soon."
                watchlist: expiring product names + days remaining where available.

                general_inference: concise summary. Prioritize food and perishables.
                Never mention products not in the data.
              tool: zen_sutra_logistics
              seed:
                tool: zen_dojotools_inventory
                params:
                  mode: stock_list_volatile
              trigger_subscriptions: daily_midnight,daily_noon
              drift_threshold: 12
              emission_cooldown_minutes: 720
              delay_seconds: 5
              meta:
                enabled: true
                requires:
                  cert: ''
                  level: 0

        - variables:
            _kfc_filtered: >-
              {%- if _component_filter == '' -%}
                {{ _kfc_defs }}
              {%- else -%}
                {{ _kfc_defs | selectattr('kata_key', 'equalto', _component_filter) | list }}
              {%- endif -%}
            final_response:
              status: ok
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              mode: kfc_manifest
              kfc: '{{ _kfc_filtered }}'
              count: '{{ _kfc_filtered | length }}'
        - stop: kfc_manifest
          response_variable: final_response

    # ── help / unknown ─────────────────────────────────────────────────────────
    - variables:
        final_response:
          status: info
          tool: '{{ tool_name }}'
          version: '{{ tool_version }}'
          mode: help
          description: >-
            Logistics Report KFC provider. Declares dojo components for intake
            and volatile stock. Battery KFC component lives in zen_stack_battery.
            Run via bootstrap_kfc — not called directly by agents.
          modes:
            kfc_manifest: Returns KFC component definitions for bootstrap_kfc wiring
            tool_manifest: Self-description
    - stop: help
      response_variable: final_response
