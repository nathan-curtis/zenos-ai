          \ 'chores_execute',\n  'tasks_complete',\n  'units_add',\n  'unit_conversions_add',\n  'stock_open_item',\n  'stock_undo_booking',\n  'shopping_add_product',\n  'shopping_remove_product',\n  'shopping_clear_list',\n  'recipes_add_to_shopping',\n  'recipes_consume',\n  'recipes_copy',\n  'tasks_undo',\n  'chores_undo',\n  'stock_add_by_barcode',\n  'stock_consume_by_barcode',\n  'batteries_charge',\n  'batteries_charge_undo',\n  'battery_replace'\n] %}\n  create\n{%
