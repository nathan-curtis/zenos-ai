          mode_norm == 'units_update' %}\n  {{\n    {\n      \"name\": (unit_norm if
          has_unit_name else none),\n      \"name_plural\": (unit_norm if has_unit_name else none),\n      \"description\": (note_in if has_note else
          none)\n    }\n  }}\n{% elif mode_norm in ['shopping_add_product','shopping_remove_product'] %}\n  {{\n    {\n      \"product_id\": product_id_resolved,\n      \"product_amount\": amt_in,\n      \"shopping_list_id\": (list_in | int if list_in is not none else none)\n    }\n  }}\n{% elif mode_norm == 'shopping_clear_list' %}\n  {{\n    {\n      \"done_only\": done_only_in,\n      \"shopping_list_id\": (list_in | int if list_in is not none else none)\n    }\n  }}\n{% elif mode_norm == 'recipes_add_to_shopping' %}\n  {{\n    {\n      \"shopping_list_id\": (list_in | int if list_in is not none else none)\n    }\n  }}\n{% elif mode_norm == 'stock_open_item' %}\n  {{\n    {\n      \"amount\": amt_in,\n      \"best_before_date\": (bbd_in if bbd_in is not none else none),\n      \"allow_subproduct_substitution\": false\n    }\n  }}\n{% elif mode_norm == 'stock_entry_update' %}\n  {% if current_entry_base is mapping %}\n    {% set ns = namespace(o={}) %}\n    {% if has_explicit_amount %}{% set ns.o = ns.o | combine({\"amount\": amt_in}) %}{% endif %}\n    {% if bbd_in is not none %}{% set ns.o = ns.o | combine({\"best_before_date\": bbd_in}) %}{% endif %}\n    {% if location_id_resolved is not none %}{% set ns.o = ns.o | combine({\"location_id\": location_id_resolved}) %}{% endif %}\n    {% if price_in is not none %}{% set ns.o = ns.o | combine({\"price\": price_in}) %}{% endif %}\n    {% if note_in | trim != '' %}{% set ns.o = ns.o | combine({\"note\": note_in}) %}{% endif %}\n    {{ current_entry_base | combine(ns.o) }}\n  {% else %}\n    {{ none }}\n  {% endif %}\n{% elif mode_norm == 'stock_add_by_barcode' %}\n  {{\n    {\n      \"amount\": amt_in,\n      \"best_before_date\": (bbd_in if bbd_in is not none else none),\n      \"transaction_type\": \"purchase\",\n      \"price\": (price_in if price_in is not none else none),\n      \"location_id\": (location_id_resolved if location_id_resolved is not none else none)\n    }\n  }}\n{% elif mode_norm == 'stock_consume_by_barcode' %}\n  {{ {\"amount\": amt_in} }}\n{% elif mode_norm == 'batteries_charge' %}\n  {{ {\"tracked_time\": none, \"amount\": (amt_in | int(1))} }}\n{% elif mode_norm in ['locations_delete', 'unit_conversions_delete', 'stock_undo_booking', 'tasks_undo', 'chores_undo', 'batteries_charge_undo'] %}\n  {{ '{\"confirm\":true}' }}\n{% else %}\n  {{ payload_obj }}\n{% endif %}"
    - variables:
        payload_data: "{{\n  {\n    \"action_type\": action_type,\n    \"endpoint\":
          final_endpoint\n  }\n  | combine(\n      {\"payload\": effective_payload}\n
          \     if effective_payload is not none else {}\n    )\n}}"
    - alias: Endpoint Resolution Check
      choose:
      - conditions:
        - alias: 'Error: Endpoint not Resolved'
          condition: template
          value_template: "{{\n  (final_endpoint is none)\n  and mode_norm not in ['catalog_find_product', 'catalog_search', 'catalog_add_product', 'catalog_delete_product', 'catalog_audit', 'locations_reparent_bulk', 'locations_delete_safe', 'locations_hierarchy_rebuild', 'stock_register_asset', 'stock_area_summary', 'stock_area_volatile', 'stock_area_inventory', 'chores_by_area', 'room_brief', 'chores_add', 'chores_tag', 'products_tag', 'catalog_find_by_tag', 'object_lens', 'chores_delete', 'chores_edit', 'tasks_add', 'tasks_tag', 'update_product_meta', 'provision_bom', 'catalog_import_bom', 'product_refs_get', 'product_ref_add', 'product_ref_remove', 'bulk_tag', 'bulk_location_move', 'bulk_label_add', 'bulk_label_remove', 'bulk_stock_add', 'catalog_find_by_barcode', 'by_anchor', 'batteries_due', 'battery_status', 'battery_overdue', 'battery_replace', 'stock_audit_perishable']\n}}\n"
        sequence:
        - variables:
            final_response:
              status: error
              message: Unable to resolve endpoint for case
              mode: '{{ mode_norm }}'
              item: '{{ item_norm }}'
              location: '{{ loc_norm }}'
              resolved:
                product_id: '{{ product_id_resolved }}'
                location_id: '{{ location_id_resolved }}'
                shopping_location_id: '{{ shopping_location_id_resolved }}'
                chore_id: '{{ chore_id_resolved }}'
                task_id: '{{ task_id_resolved }}'
              coaching:
              - If this is an item question, pass item or product_id.
              - If this is a location question, pass location or location_id.
              - For purchases, provide item or product_id and amount.
        - stop: Resolution Failed
          response_variable: final_response
    - alias: 'PC sync — snapshot child current parent'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'locations_metadata_set'\n             and location_id_resolved is not none\n             and parent_lid_resolved is not none }}"
        sequence:
        - action: script.zen_sutra_grocy
          response_variable: child_snapshot_raw
          data:
            action_type: read
            endpoint: /objects/locations?limit=500&offset=0
        - variables:
            child_old_parent_lid: "{{ child_snapshot_raw['result']['content'] | selectattr('id', 'equalto', location_id_resolved | int) | map(attribute='userfields.grocy_parent_location_id') | first | default(none, true) | int(none) }}"
    - variables:
        _deleted_loc_parent_id: "{{ none }}"
    - alias: 'Pre-fetch — snapshot parent before delete'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm in ['locations_delete', 'locations_delete_safe'] and location_id_resolved is not none }}"
        sequence:
        - action: script.zen_sutra_grocy
          response_variable: _del_snap_raw
          data:
            action_type: read
            endpoint: /objects/locations?limit=500&offset=0
        - variables:
            _deleted_loc_parent_id: "{{ _del_snap_raw['result']['content'] | selectattr('id', 'equalto', location_id_resolved | int) | map(attribute='userfields.grocy_parent_location_id') | first | default(none, true) | int(none) }}"
    - alias: catalog_find_by_barcode — dedicated handler
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'catalog_find_by_barcode' }}"
        sequence:
        - if: "{{ not has_barcode }}"
          then:
          - variables:
              final_response:
                status: error
                message: barcode is required for catalog_find_by_barcode.
                coaching:
                - "{'mode':'catalog_find_by_barcode','barcode':'9780375826696'}"
          - stop: barcode required
            response_variable: final_response
        - action: script.zen_sutra_grocy
          response_variable: _cfbb_raw
          continue_on_error: true
          data:
            action_type: read
            endpoint: "/stock/products/by-barcode/{{ barcode_norm }}"
        - variables:
            _cfbb_content: >-
              {%- set r = _cfbb_raw if _cfbb_raw is mapping else {} -%}
              {%- set rr = r.get('result', none) -%}
              {%- set c = rr.get('content', none) if rr is mapping else none -%}
              {{ c | tojson if c is mapping else (c | string | trim if c is not none else '{}') }}
        - variables:
            _cfbb_data: "{{ _cfbb_content if _cfbb_content is mapping else (_cfbb_content | from_json(none) if _cfbb_content is string and _cfbb_content | trim | length > 0 else {}) }}"
        - variables:
            _cfbb_pid: "{{ _cfbb_data.get('product', {}).get('id') | int(0) if _cfbb_data is mapping else 0 }}"
            _cfbb_name: "{{ (_cfbb_data.get('product', {}).get('name') or '') | string | trim if _cfbb_data is mapping else '' }}"
        - variables:
            final_response:
              status: "{{ 'found' if _cfbb_pid | int(0) > 0 else 'not_found' }}"
              barcode: "{{ barcode_norm }}"
              product_id: "{{ _cfbb_pid | int(0) }}"
              product_name: "{{ _cfbb_name }}"
        - stop: catalog_find_by_barcode done
          response_variable: final_response
    - alias: batteries_due — fetch + bucket by charge status
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'batteries_due' }}"
        sequence:
        - action: script.zen_sutra_grocy
          response_variable: _bd_raw
          continue_on_error: true
          data:
            action_type: read
            endpoint: /batteries
        - variables:
            _bd_list: >-
              {%- set r = _bd_raw if _bd_raw is mapping else {} -%}
              {%- set c = r.get('result', {}).get('content', []) -%}
              {{ c if c is sequence and c is not string else [] }}
            _bd_now: "{{ now().strftime('%Y-%m-%dT%H:%M:%S') }}"
        - variables:
            _bd_overdue: >-
              {%- set ns = namespace(b=[]) -%}
              {%- for b in _bd_list -%}
                {%- set nxt = b.get('next_estimated_charge_time', '') or '' -%}
                {%- if nxt | trim != '' and nxt < _bd_now -%}
                  {%- set ns.b = ns.b + [b] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.b }}
            _bd_due_today: >-
              {%- set ns = namespace(b=[]) -%}
              {%- set _today = now().strftime('%Y-%m-%d') -%}
              {%- for b in _bd_list -%}
                {%- set nxt = b.get('next_estimated_charge_time', '') or '' -%}
                {%- if nxt | trim != '' and nxt >= _bd_now and nxt[:10] == _today -%}
                  {%- set ns.b = ns.b + [b] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.b }}
            _bd_due_soon: >-
              {%- set ns = namespace(b=[]) -%}
              {%- set _today = now().strftime('%Y-%m-%d') -%}
              {%- set _soon = (now() + timedelta(days=7)).strftime('%Y-%m-%d') -%}
              {%- for b in _bd_list -%}
                {%- set nxt = b.get('next_estimated_charge_time', '') or '' -%}
                {%- if nxt | trim != '' and nxt >= _bd_now and nxt[:10] != _today and nxt[:10] <= _soon -%}
                  {%- set ns.b = ns.b + [b] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.b }}
            _bd_ok: >-
              {%- set ns = namespace(b=[]) -%}
              {%- set _soon = (now() + timedelta(days=7)).strftime('%Y-%m-%d') -%}
              {%- for b in _bd_list -%}
                {%- set nxt = b.get('next_estimated_charge_time', '') or '' -%}
                {%- if nxt | trim == '' or nxt[:10] > _soon -%}
                  {%- set ns.b = ns.b + [b] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.b }}
        - variables:
            final_response:
              status: success
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: batteries_due
              total: '{{ _bd_list | length }}'
              overdue: '{{ _bd_overdue }}'
              due_today: '{{ _bd_due_today }}'
              due_soon: '{{ _bd_due_soon }}'
              ok: '{{ _bd_ok }}'
              generated: '{{ _bd_now }}'
        - stop: batteries_due done
          response_variable: final_response

    - alias: battery_status — low-battery triage by area with Grocy stock cross-ref
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'battery_status' }}"
        sequence:
        - variables:
            _bs_all_plus: >-
              {{ integration_entities('battery_notes')
                 | select('match', 'sensor\\..*_battery_plus')
                 | list }}
        - variables:
            _bs_low: >-
              {%- set ns = namespace(devs=[]) -%}
              {%- for ent in _bs_all_plus -%}
                {%- if state_attr(ent, 'battery_low') == true -%}
                  {%- set _aid = area_id(ent) | default('', true) -%}
                  {%- set _dn  = state_attr(ent, 'device_name') | default('', true) -%}
                  {%- set _taq = state_attr(ent, 'battery_type_and_quantity') | default('', true) -%}
                  {%- set _pct = states(ent) | int(none) -%}
                  {%- set ns.devs = ns.devs + [{'entity_id': ent, 'device_name': _dn, 'battery_type_and_quantity': _taq, 'battery_pct': _pct, 'area_id': _aid}] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.devs }}
        - variables:
            _bs_by_area: >-
              {%- set ns = namespace(m={}) -%}
              {%- for d in _bs_low -%}
                {%- set _aid = d.get('area_id', '') -%}
                {%- set _existing = ns.m.get(_aid, {'devices': [], 'types_needed': []}) -%}
                {%- set _devs = _existing.get('devices', []) + [d] -%}
                {%- set _types = _existing.get('types_needed', []) -%}
                {%- set _taq = d.get('battery_type_and_quantity', '') -%}
                {%- set _types_new = _types if _taq in _types or _taq == '' else _types + [_taq] -%}
                {%- set ns.m = ns.m | combine({_aid: {'devices': _devs, 'types_needed': _types_new}}) -%}
              {%- endfor -%}
              {{ ns.m }}
            _bs_unique_types: >-
              {%- set ns = namespace(types=[]) -%}
              {%- for d in _bs_low -%}
                {%- set _taq = d.get('battery_type_and_quantity', '') -%}
                {%- if _taq != '' and _taq not in ns.types -%}
                  {%- set ns.types = ns.types + [_taq] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.types }}
        - variables:
            _bs_stock: {}
        - repeat:
            for_each: "{{ _bs_unique_types }}"
            sequence:
            - action: script.zen_sutra_grocy
              response_variable: _bs_prod_raw
              continue_on_error: true
              data:
                action_type: read
                endpoint: "/objects/products?query%5B%5D=name={{ repeat.item | urlencode }}&limit=5"
            - variables:
                _bs_prod_list: >-
                  {%- set r = _bs_prod_raw if _bs_prod_raw is mapping else {} -%}
                  {%- set c = r.get('result', {}).get('content', []) -%}
                  {{ c if c is sequence and c is not string else [] }}
                _bs_prod_id: >-
                  {%- set r = _bs_prod_raw if _bs_prod_raw is mapping else {} -%}
                  {%- set c = r.get('result', {}).get('content', []) -%}
                  {%- set _list = c if c is sequence and c is not string else [] -%}
                  {{ (_list | first | default({})).get('id', none) if _list | length > 0 else none }}
            - choose:
              - conditions:
                - condition: template
                  value_template: "{{ _bs_prod_id is not none }}"
                sequence:
                - action: script.zen_sutra_grocy
                  response_variable: _bs_stock_raw
                  continue_on_error: true
                  data:
                    action_type: read
                    endpoint: "/stock/products/{{ _bs_prod_id }}"
                - variables:
                    _bs_stock_amt: >-
                      {%- set r = _bs_stock_raw if _bs_stock_raw is mapping else {} -%}
                      {%- set c = r.get('result', {}).get('content', {}) -%}
                      {%- set _d = c if c is mapping else {} -%}
                      {{ _d.get('stock_amount', none) }}
                - variables:
                    _bs_stock: "{{ _bs_stock | combine({repeat.item: {'product_id': _bs_prod_id, 'stock_amount': _bs_stock_amt}}) }}"
        - variables:
            final_response:
              status: success
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: battery_status
              total_low: '{{ _bs_low | length }}'
              all_ok: '{{ _bs_low | length == 0 }}'
              areas: '{{ _bs_by_area }}'
              stock: '{{ _bs_stock }}'
              generated: '{{ now().isoformat() }}'
        - stop: battery_status done
          response_variable: final_response

    - alias: battery_overdue — devices not replaced in N days
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'battery_overdue' }}"
        sequence:
        - variables:
            _bo_days: "{{ days_threshold | default(180) | int(180) }}"
            _bo_all_plus: >-
              {{ integration_entities('battery_notes')
                 | select('match', 'sensor\\..*_battery_plus')
                 | list }}
        - variables:
            _bo_overdue: >-
              {%- set ns = namespace(devs=[]) -%}
              {%- for ent in _bo_all_plus -%}
                {%- set _lrt = state_attr(ent, 'battery_last_replaced') | default('', true) -%}
                {%- if _lrt and _lrt | trim != '' and as_datetime(_lrt) is not none -%}
                  {%- set _dsr = (now() - as_datetime(_lrt)).days -%}
                  {%- if _dsr > _bo_days -%}
                    {%- set _aid = area_id(ent) | default('', true) -%}
                    {%- set _dn  = state_attr(ent, 'device_name') | default('', true) -%}
                    {%- set _taq = state_attr(ent, 'battery_type_and_quantity') | default('', true) -%}
                    {%- set _pct = states(ent) | int(none) -%}
                    {%- set ns.devs = ns.devs + [{'entity_id': ent, 'device_name': _dn, 'battery_type_and_quantity': _taq, 'battery_pct': _pct, 'area_id': _aid, 'last_replaced': _lrt | string, 'days_since_replaced': _dsr}] -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.devs | sort(attribute='days_since_replaced', reverse=true) }}
        - variables:
            final_response:
              status: success
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: battery_overdue
              days_threshold: '{{ _bo_days }}'
              overdue_count: '{{ _bo_overdue | length }}'
              devices: '{{ _bo_overdue }}'
              generated: '{{ now().isoformat() }}'
        - stop: battery_overdue done
          response_variable: final_response

    - alias: battery_replace — atomic Battery Notes log + Grocy stock consume
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'battery_replace' }}"
        sequence:
        - variables:
            _br_entity: "{{ ha_entity_id | default('') | string | trim if ha_entity_id is defined else '' }}"
        - if: "{{ _br_entity == '' }}"
          then:
          - variables:
              final_response:
                status: error
                tool: '{{ tool_name }}'
                version: '{{ tool_version }}'
                case: battery_replace
                message: "ha_entity_id is required. Provide the Battery Notes source entity (e.g. sensor.office_remote_battery_plus)."
          - stop: battery_replace — ha_entity_id required
            response_variable: final_response
        - variables:
            _br_battery_type: "{{ state_attr(_br_entity, 'battery_type_and_quantity') | default('', true) }}"
            _br_device_name: "{{ state_attr(_br_entity, 'device_name') | default(_br_entity, true) }}"
            _br_replaced_at: "{{ now().isoformat() }}"
        - action: battery_notes.set_battery_replaced
          continue_on_error: true
          data:
            source_entity_id: "{{ _br_entity }}"
            datetime_replaced: "{{ _br_replaced_at }}"
        - variables:
            _br_grocy_consumed: none
            _br_has_item: "{{ item is defined and item | default('') | string | trim != '' }}"
        - if: "{{ _br_has_item }}"
          then:
          - action: script.zen_sutra_grocy
            response_variable: _br_prod_raw
            continue_on_error: true
            data:
              action_type: read
              endpoint: "/objects/products?query%5B%5D=name={{ item_norm | urlencode }}&limit=5"
          - variables:
              _br_prod_list: >-
                {%- set r = _br_prod_raw if _br_prod_raw is mapping else {} -%}
                {%- set c = r.get('result', {}).get('content', []) -%}
                {{ c if c is sequence and c is not string else [] }}
              _br_prod_id: >-
                {%- set r = _br_prod_raw if _br_prod_raw is mapping else {} -%}
                {%- set c = r.get('result', {}).get('content', []) -%}
                {%- set _list = c if c is sequence and c is not string else [] -%}
                {{ (_list | first | default({})).get('id', none) if _list | length > 0 else none }}
              _br_prod_name: >-
                {%- set r = _br_prod_raw if _br_prod_raw is mapping else {} -%}
                {%- set c = r.get('result', {}).get('content', []) -%}
                {%- set _list = c if c is sequence and c is not string else [] -%}
                {{ (_list | first | default({})).get('name', item_norm) if _list | length > 0 else item_norm }}
          - if: "{{ _br_prod_id is not none }}"
            then:
            - action: script.zen_sutra_grocy
              response_variable: _br_consume_raw
              continue_on_error: true
              data:
                action_type: create
                endpoint: "/stock/products/{{ _br_prod_id }}/consume"
                payload: "{{ {'amount': (amt_in | int(1)), 'transaction_type': 'consume'} }}"
            - variables:
                _br_grocy_consumed:
                  product: '{{ _br_prod_name }}'
                  product_id: '{{ _br_prod_id }}'
                  amount: '{{ amt_in | int(1) }}'
        - variables:
            final_response:
              status: success
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: battery_replace
              replaced: true
              entity_id: '{{ _br_entity }}'
              device_name: '{{ _br_device_name }}'
              battery_type: '{{ _br_battery_type }}'
              replaced_at: '{{ _br_replaced_at }}'
              grocy_consumed: '{{ _br_grocy_consumed }}'
        - stop: battery_replace done
          response_variable: final_response

    - alias: stock_audit_perishable — find never-expires stock in perishable locations
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'stock_audit_perishable' }}"
        sequence:
        - variables:
            _sap_all_locs: []
            _sap_locs_page: 1
            _sap_locs_done: false
        - repeat:
            while: "{{ not _sap_locs_done and _sap_locs_page <= 20 }}"
            sequence:
            - action: script.zen_sutra_grocy
              response_variable: _sap_locs_raw
              continue_on_error: true
              data:
                action_type: read
                endpoint: "objects/locations?limit=500&offset={{ (_sap_locs_page - 1) * 500 }}&query%5B%5D=active=1"
            - variables:
                _sap_locs_page_items: "{{ (_sap_locs_raw.get('result', {}).get('content') or []) if _sap_locs_raw is mapping else [] }}"
                _sap_all_locs: "{{ _sap_all_locs + _sap_locs_page_items }}"
                _sap_locs_page: "{{ _sap_locs_page + 1 }}"
                _sap_locs_done: "{{ _sap_locs_page_items | length < 500 }}"
        - variables:
            _sap_all_stock: []
            _sap_stock_page: 1
            _sap_stock_done: false
        - repeat:
            while: "{{ not _sap_stock_done and _sap_stock_page <= 20 }}"
            sequence:
            - action: script.zen_sutra_grocy
              response_variable: _sap_stock_raw
              continue_on_error: true
              data:
                action_type: read
                endpoint: "objects/stock?limit=500&offset={{ (_sap_stock_page - 1) * 500 }}"
            - variables:
                _sap_stock_page_items: "{{ (_sap_stock_raw.get('result', {}).get('content') or []) if _sap_stock_raw is mapping else [] }}"
                _sap_all_stock: "{{ _sap_all_stock + _sap_stock_page_items }}"
                _sap_stock_page: "{{ _sap_stock_page + 1 }}"
                _sap_stock_done: "{{ _sap_stock_page_items | length < 500 }}"
        - variables:
            _sap_never_products: []
            _sap_never_page: 1
            _sap_never_done: false
        - repeat:
            while: "{{ not _sap_never_done and _sap_never_page <= 20 }}"
            sequence:
            - action: script.zen_sutra_grocy
              response_variable: _sap_never_raw
              continue_on_error: true
              data:
                action_type: read
                endpoint: "objects/products?limit=500&offset={{ (_sap_never_page - 1) * 500 }}&query%5B%5D=default_best_before_days=-1"
            - variables:
                _sap_never_page_items: "{{ (_sap_never_raw.get('result', {}).get('content') or []) if _sap_never_raw is mapping else [] }}"
                _sap_never_products: "{{ _sap_never_products + _sap_never_page_items }}"
                _sap_never_page: "{{ _sap_never_page + 1 }}"
                _sap_never_done: "{{ _sap_never_page_items | length < 500 }}"
        - variables:
            _sap_perishable_ids: >-
              {%- set ns = namespace(ids=[]) -%}
              {%- for loc in _sap_all_locs -%}
                {%- if (loc.get('active') | int(1)) == 1 and (loc.get('userfields') or {}).get('catalog_class') == 'perishable_storage' -%}
                  {%- set ns.ids = ns.ids + [loc.id | int] -%}
                  {%- set _children_raw = (loc.get('userfields') or {}).get('grocy_child_location_ids') -%}
                  {%- if _children_raw and _children_raw | trim not in ['', '[]', 'null'] -%}
                    {%- set _children = _children_raw if (_children_raw is sequence and _children_raw is not string) else (_children_raw | from_json(none) | default([])) -%}
                    {%- for cid in (_children if _children is sequence else []) -%}
                      {%- if cid | string | trim | regex_search('^-?\d+$') -%}
                        {%- set _co = _sap_all_locs | selectattr('id', 'equalto', cid | int) | list | first | default(none) -%}
                        {%- set _co2 = _sap_all_locs | selectattr('id', 'equalto', cid | string) | list | first | default(_co) -%}
                        {%- set _child = _co2 if _co2 is mapping else (_co if _co is mapping else {}) -%}
                        {%- if (_child.get('userfields') or {}).get('catalog_class') != 'non_perishable' -%}
                          {%- set ns.ids = ns.ids + [cid | int] -%}
                        {%- endif -%}
                      {%- endif -%}
                    {%- endfor -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.ids | unique | list }}
            _sap_never_ids: >-
              {{ _sap_never_products | map(attribute='id') | map('int') | list }}
        - variables:
            _sap_violations: >-
              {%- set ns = namespace(items=[]) -%}
              {%- for entry in _sap_all_stock -%}
                {%- set lid = entry.get('location_id') | int(0) -%}
                {%- set pid = entry.get('product_id') | int(0) -%}
                {%- if lid in _sap_perishable_ids and pid in _sap_never_ids -%}
                  {%- set prod = _sap_never_products | selectattr('id', 'equalto', pid) | list | first | default(none) -%}
                  {%- set prod2 = _sap_never_products | selectattr('id', 'equalto', pid | string) | list | first | default(prod) -%}
                  {%- set loc = _sap_all_locs | selectattr('id', 'equalto', lid) | list | first | default(none) -%}
                  {%- set loc2 = _sap_all_locs | selectattr('id', 'equalto', lid | string) | list | first | default(loc) -%}
                  {%- set _prod = prod2 if prod2 is mapping else (prod if prod is mapping else {}) -%}
                  {%- set _loc = loc2 if loc2 is mapping else (loc if loc is mapping else {}) -%}
                  {%- set ns.items = ns.items + [{
                    'product_id': pid,
                    'product_name': _prod.get('name', 'Unknown'),
                    'location_id': lid,
                    'location_name': _loc.get('name', 'Unknown'),
                    'amount': entry.get('amount'),
                    'best_before_date': entry.get('best_before_date'),
                    'fix': "update_product_meta item='" ~ _prod.get('name', 'Unknown') ~ "' best_before_days=N"
                  }] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.items }}
        - variables:
            final_response:
              status: ok
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              mode: stock_audit_perishable
              perishable_location_ids: '{{ _sap_perishable_ids }}'
              never_expires_product_count: '{{ _sap_never_ids | length }}'
              violations:
                count: '{{ _sap_violations | length }}'
                items: '{{ _sap_violations }}'
                summary: >-
                  {{ 'No violations — all products in perishable locations have expiry tracking.'
                     if _sap_violations | length == 0 else
                     (_sap_violations | length | string) ~ ' product(s) marked never-expires (-1) stocked at a perishable location. Use fix command to add expiry tracking.' }}
        - stop: stock_audit_perishable done
          response_variable: final_response

    - alias: Call Grocy API (if not barred by endpoint)
      choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm not in [''catalog_find_product'', ''catalog_search'', ''catalog_add_product'', ''catalog_delete_product'', ''locations_reparent_bulk'', ''locations_delete_safe'', ''locations_hierarchy_rebuild'', ''stock_register_asset'', ''stock_area_summary'', ''stock_area_volatile'', ''stock_area_inventory'', ''chores_by_area'', ''room_brief'', ''chores_add'', ''chores_tag'', ''products_tag'', ''catalog_find_by_tag'', ''object_lens'', ''chores_delete'', ''chores_edit'', ''tasks_add'', ''tasks_tag'', ''update_product_meta'', ''provision_bom'', ''product_refs_get'', ''product_ref_add'', ''product_ref_remove'', ''catalog_find_by_barcode'', ''by_anchor'', ''batteries_due'', ''battery_status'', ''battery_overdue'', ''battery_replace'', ''stock_audit_perishable''] }}'
          alias: Not 'catalog_find_product'
        sequence:
        - action: script.zen_sutra_grocy
          response_variable: grocy_response
          data: '{{ payload_data }}'
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm == ''locations_add'' }}'
          alias: Capture new location id
        sequence:
        - variables:
            location_id_resolved: "{% if grocy_response is mapping and 'result' in grocy_response
              and grocy_response['result'] is mapping and 'content' in grocy_response['result']
              and grocy_response['result']['content'] is mapping %}\n  {% if 'created_object_id'
              in grocy_response['result']['content'] %}\n    {{ grocy_response['result']['content']['created_object_id']
              }}\n  {% elif 'id' in grocy_response['result']['content'] %}\n    {{ grocy_response['result']['content']['id']
              }}\n  {% else %}\n    {{ none }}\n  {% endif %}\n{% else %}\n  {{ none }}\n{% endif %}"
      alias: Resolve new Location ID
    - alias: 'locations_add — inherit parent homeassistant_area if not provided'
      choose:
      - conditions:
        - condition: template
          value_template: >-
            {{ mode_norm == 'locations_add'
               and not has_area_id
               and parent_lid_resolved is not none }}
        sequence:
        - action: script.zen_sutra_grocy
          response_variable: _inherit_area_raw
          continue_on_error: true
          data:
            action_type: read
            endpoint: /objects/locations/{{ parent_lid_resolved }}
        - variables:
            _parent_area: >-
              {%- set _c = _inherit_area_raw['result']['content']
                 if (_inherit_area_raw is mapping
                     and _inherit_area_raw.get('result', {})
                              .get('content') is mapping)
                 else {} -%}
              {{ _c.get('userfields', {}).get('homeassistant_area', none) }}
        - variables:
            area_id_norm: >-
              {{ _parent_area
                 if (_parent_area is string and _parent_area | length > 0)
                 else area_id_norm }}
            has_area_id: >-
              {{ true
                 if (_parent_area is string and _parent_area | length > 0)
                 else has_area_id }}
    - alias: Add Location Metadata if necessary
      choose:
      - conditions:
        - alias: locations_add → apply metadata
          condition: template
          value_template: "{{ mode_norm == 'locations_add'\n   and location_id_resolved
            is not none\n   and (\n     parent_lid_resolved is not none\n     or has_area_id\n
            \    or placement_priority_in is not none\n     or has_note\n   ) }}"
        sequence:
        - action: script.zen_sutra_grocy
          response_variable: metadata_response
          data:
            action_type: update
            endpoint: /userfields/locations/{{ location_id_resolved }}
            payload: "{{\n  dict(\n    (\n      [\n        ('grocy_parent_location_id',
              parent_lid_resolved),\n        ('homeassistant_area', area_id_norm if
              has_area_id else none),\n        ('grocy_location_subclass', loc_sub_norm),\n
              \       ('placement_priority', placement_priority_in),\n        ('note',
              note_in if has_note else none)\n      ]\n      | selectattr(1)\n      |
              list\n    )\n  )\n}}"
    - alias: 'PC sync — register child with new parent'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm in ['locations_metadata_set', 'locations_add']\n             and parent_lid_resolved is not none\n             and location_id_resolved is not none }}"
        sequence:
        - action: script.zen_sutra_grocy
          response_variable: js_register_raw
          data:
            action_type: read
            endpoint: /objects/locations?limit=500&offset=0
        - variables:
            _js_new_kids: "{{ js_register_raw['result']['content'] | selectattr('userfields.grocy_parent_location_id', 'equalto', parent_lid_resolved | string) | map(attribute='id') | map('int') | unique | sort | list }}"
        - action: script.zen_sutra_grocy
          data:
            action_type: update
            endpoint: /userfields/locations/{{ parent_lid_resolved }}
            payload: "{{ dict([('grocy_child_location_ids', '[' ~ (_js_new_kids | join(',')) ~ ']')]) }}"
    - alias: 'PC sync — evict child from old parent'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'locations_metadata_set'\n             and parent_lid_resolved is not none\n             and child_old_parent_lid is defined\n             and child_old_parent_lid is not none\n             and (child_old_parent_lid | int) != (parent_lid_resolved | int) }}"
        sequence:
        - action: script.zen_sutra_grocy
          response_variable: js_evict_raw
          data:
            action_type: read
            endpoint: /objects/locations?limit=500&offset=0
        - variables:
            _js_old_kids: "{{ js_evict_raw['result']['content'] | selectattr('userfields.grocy_parent_location_id', 'equalto', child_old_parent_lid | string) | map(attribute='id') | map('int') | unique | sort | list }}"
        - action: script.zen_sutra_grocy
          data:
            action_type: update
            endpoint: /userfields/locations/{{ child_old_parent_lid }}
            payload: "{{ dict([('grocy_child_location_ids', '[' ~ (_js_old_kids | join(',')) ~ ']')]) }}"
    - alias: 'PC sync — evict deleted child from parent'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'locations_delete' and _deleted_loc_parent_id is not none }}"
        sequence:
        - action: script.zen_sutra_grocy
          response_variable: js_del_evict_raw
          data:
            action_type: read
            endpoint: /objects/locations?limit=500&offset=0
        - variables:
            _js_del_kids: "{{ js_del_evict_raw['result']['content'] | selectattr('userfields.grocy_parent_location_id', 'equalto', _deleted_loc_parent_id | string) | map(attribute='id') | map('int') | unique | sort | list }}"
        - action: script.zen_sutra_grocy
          data:
            action_type: update
            endpoint: /userfields/locations/{{ _deleted_loc_parent_id }}
            payload: "{{ dict([('grocy_child_location_ids', '[' ~ (_js_del_kids | join(',')) ~ ']')]) }}"
    - alias: 'Location embed — write homeassistant_area into main locations table'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'locations_metadata_set'
                             and location_id_resolved is not none
                             and has_area_id }}"
        sequence:
        - action: script.zen_sutra_grocy
          response_variable: _le_loc_raw
          continue_on_error: true
          data:
            action_type: read
            endpoint: "/objects/locations/{{ location_id_resolved }}"
        - variables:
            _le_loc_obj: >-
              {%- set _c = _le_loc_raw.get('result', {}).get('content', {}) -%}
              {{ _c if _c is mapping else {} }}
        - if: "{{ _le_loc_obj | length > 0 }}"
          then:
            - variables:
                _le_uf_base: >-
                  {{ _le_loc_obj.get('userfields', {}) if _le_loc_obj.get('userfields') is mapping else {} }}
            - variables:
                _le_uf_merged: "{{ _le_uf_base | combine({'homeassistant_area': area_id_norm}) }}"
            - variables:
                _le_loc_patch: >-
                  {%- set ns = namespace(p={}) -%}
                  {%- for k, v in _le_loc_obj.items() -%}
                    {%- if k not in ['userfields', 'row_created_timestamp'] -%}
                      {%- set ns.p = ns.p | combine({k: v}) -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {%- set ns.p = ns.p | combine({'userfields': _le_uf_merged}) -%}
                  {{ ns.p | tojson }}
            - action: script.zen_sutra_grocy
              response_variable: _le_embed_raw
              continue_on_error: true
              data:
                action_type: update
                endpoint: "/objects/locations/{{ location_id_resolved }}"
                payload: "{{ _le_loc_patch }}"
    - alias: 'stock_register_asset — 1-call physical asset registration'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'stock_register_asset' }}"
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ location_id_resolved is none }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: stock_register_asset
                  message: location or location_id is required.
                  coaching:
                  - Provide location name or location_id.
            - stop: Asset Location Required
              response_variable: final_response
        - action: script.zen_sutra_grocy
          response_variable: _asset_dupe_raw
          data:
            action_type: read
            endpoint: objects/products?query%5B%5D=name={{ item_norm }}
        - variables:
            _asset_dupe_list: "{{ _asset_dupe_raw['result']['content'] | default([]) }}"
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _asset_dupe_list | length > 0 and not confirm_action_in }}"
            sequence:
            - variables:
                final_response:
                  status: dupe_guard
                  mode: stock_register_asset
                  message: A product with this name already exists.
                  candidates: "{{ _asset_dupe_list | map(attribute='name') | list }}"
                  candidate_ids: "{{ _asset_dupe_list | map(attribute='id') | list }}"
                  coaching:
                  - To stock an existing product, use stock_buy_product instead.
                  - To register a new asset with this name, add confirm_action true.
            - stop: Asset Dupe Guard
              response_variable: final_response
        - variables:
            _asset_desc_parts: "{{ ([note_in] if note_in is string and note_in | length > 0 else [])
              + (['Brand: ' ~ brand] if brand is defined and brand else [])
              + (['Serial: ' ~ sku] if sku is defined and sku else [])
              + (['Est. value: $' ~ price_in] if price_in is not none else []) }}"
            _asset_desc: "{{ _asset_desc_parts | join(' | ') }}"
        - action: script.zen_sutra_grocy
          response_variable: _asset_create_raw
          data:
            action_type: post
            endpoint: /objects/products
            payload: "{{ {'name': item_norm, 'description': _asset_desc, 'location_id': location_id_resolved, 'qu_id_purchase': unit_id_resolved, 'qu_id_stock': unit_id_resolved} }}"
        - variables:
            _asset_pid: "{% set c = _asset_create_raw['result']['content'] | default({}) %}
              {{ c.get('created_object_id', c.get('id', none)) | int(none) }}"
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _asset_pid is none }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: stock_register_asset
                  message: Grocy product creation failed.
                  coaching:
                  - Check Grocy connection and try again.
            - stop: Asset Create Failed
              response_variable: final_response
        - action: script.zen_sutra_grocy
          response_variable: _asset_stock_raw
          data:
            action_type: post
            endpoint: /stock/products/{{ _asset_pid }}/add
            payload: "{{ {'amount': 1, 'location_id': location_id_resolved, 'best_before_date': '2999-12-31', 'transaction_type': 'purchase'} }}"
        - variables:
            _asset_hazmat_logged: false
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ hazmat_class_in is not none }}"
            sequence:
            - action: script.zen_sutra_grocy
              response_variable: _asset_loc_raw
              data:
                action_type: read
                endpoint: /objects/locations/{{ location_id_resolved }}
            - variables:
                _asset_loc_area: "{{ _asset_loc_raw['result']['content']['userfields']['homeassistant_area'] | default(none, true) }}"
            - choose:
              - conditions:
                - condition: template
                  value_template: "{{ _asset_loc_area is not none and _asset_loc_area | length > 0 }}"
                sequence:
                - action: script.zen_dojotools_room_manager
                  data:
                    mode: set
                    area: "{{ _asset_loc_area }}"
                    safety: "{{ {'name': item_norm ~ ' (hazmat)', 'type': 'other', 'location_note': hazmat_class_in ~ ' — see Grocy location ' ~ location_id_resolved, 'grocy_location_id': location_id_resolved | string} }}"
                - variables:
                    _asset_hazmat_logged: true
        - variables:
            final_response:
              status: success
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              mode: stock_register_asset
              result:
                product_id: '{{ _asset_pid }}'
                name: '{{ item_norm }}'
                location_id: '{{ location_id_resolved }}'
                stocked: 1
                best_before_date: '2999-12-31'
                hazmat_logged: '{{ _asset_hazmat_logged }}'
        - stop: Asset Registration Complete
          response_variable: final_response

    - alias: 'catalog_add_product — create product with 0 stock'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'catalog_add_product' }}"
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ location_id_resolved is none }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: catalog_add_product
                  message: location or location_id is required.
                  coaching:
                  - Provide location name or location_id (default storage location for new stock).
            - stop: Product Location Required
              response_variable: final_response
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ unit_id_resolved is none }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: catalog_add_product
                  message: unit is required — product cannot be created without a stock unit (qu_id_stock would be null, blocking all stock operations).
                  coaching:
                  - Provide unit= (e.g. unit=each, unit=gram, unit=sheet, unit=pack).
                  - Use mode=units_list to see available units and their IDs.
            - stop: Product Stock Unit Required
              response_variable: final_response
        - action: script.zen_sutra_grocy
          response_variable: _cprod_dupe_raw
          data:
            action_type: read
            endpoint: objects/products?query%5B%5D=name={{ item_norm }}
        - variables:
            _cprod_dupe_list: "{{ _cprod_dupe_raw['result']['content'] | default([]) }}"
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _cprod_dupe_list | length > 0 and not confirm_action_in }}"
            sequence:
            - variables:
                final_response:
                  status: dupe_guard
                  mode: catalog_add_product
                  message: A product with this name already exists.
                  candidates: "{{ _cprod_dupe_list | map(attribute='name') | list }}"
                  candidate_ids: "{{ _cprod_dupe_list | map(attribute='id') | list }}"
                  coaching:
                  - To add stock to an existing product use stock_buy_product.
                  - To create with the same name pass confirm_action true.
            - stop: Product Dupe Guard
              response_variable: final_response
        - variables:
            _cprod_desc_parts: "{{ ([note_in] if note_in is string and note_in | length > 0 else [])
              + (['Brand: ' ~ brand] if brand is defined and brand else [])
              + (['SKU: ' ~ sku] if sku is defined and sku else [])
              + (['Est. value: $' ~ price_in] if price_in is not none else []) }}"
            _cprod_desc: "{{ _cprod_desc_parts | join(' | ') }}"
        - action: script.zen_sutra_grocy
          response_variable: _cprod_create_raw
          data:
            action_type: post
            endpoint: /objects/products
            payload: "{{ {'name': item_norm, 'description': _cprod_desc, 'location_id': location_id_resolved, 'qu_id_purchase': unit_id_resolved, 'qu_id_stock': unit_id_resolved} | combine({'parent_product_id': parent_product_id_resolved} if parent_product_id_resolved is not none else {}) }}"
        - variables:
            _cprod_pid: "{% set c = _cprod_create_raw['result']['content'] | default({}) %}
              {{ c.get('created_object_id', c.get('id', none)) | int(none) }}"
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _cprod_pid is none }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: catalog_add_product
                  message: Grocy product creation failed.
                  coaching:
                  - Check Grocy connection and try again.
            - stop: Product Create Failed
              response_variable: final_response
        - variables:
            final_response:
              status: success
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              mode: catalog_add_product
              result:
                product_id: '{{ _cprod_pid }}'
                name: '{{ item_norm }}'
                location_id: '{{ location_id_resolved }}'
                stocked: 0
              ha_labels_warning: "Product created without ha_labels — not visible to zen_dojotools_plant mode=managed or label queries. Call products_tag with ha_labels=<root_label> to register it."
              varietal_hint: "To link as a brand/varietal under a parent product later: update_product_meta item='{{ item_norm }}' parent_product='<base name>'"
        - stop: Product Catalog Add Complete
          response_variable: final_response
    - alias: 'catalog_delete_product — delete product, gated on no-stock or confirm'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'catalog_delete_product' }}"
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ product_id_resolved is none }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: catalog_delete_product
                  message: product_id or item is required.
                  coaching:
                  - Pass item=<name> or product_id=<id> to identify the product.
            - stop: Product ID Required
              response_variable: final_response
        - action: script.zen_sutra_grocy
          response_variable: _cdel_stock_raw
          data:
            action_type: read
            endpoint: "/stock/products/{{ product_id_resolved }}"
        - variables:
            _cdel_content: >-
              {{ _cdel_stock_raw['result']['content']
                 if (_cdel_stock_raw is mapping
                     and _cdel_stock_raw.get('result', {}).get('content') is mapping)
                 else {} }}
        - variables:
            _cdel_stock_amt: "{{ _cdel_content.get('stock_amount', 0) | float(0) }}"
            _cdel_product_name: "{{ _cdel_content.get('product', {}).get('name', item_norm) }}"
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _cdel_stock_amt > 0 and pid_keep_in is not none }}"
            sequence:
            - action: script.zen_sutra_grocy
              response_variable: _cdel_merge_raw
              data:
                action_type: create
                endpoint: "/stock/products/{{ pid_keep_in }}/merge/{{ product_id_resolved }}"
                payload: "{}"
            - variables:
                final_response:
                  status: merged
                  mode: catalog_delete_product
                  message: Stock merged into target product; source product deleted.
                  removed_product_id: "{{ product_id_resolved }}"
                  removed_product_name: "{{ _cdel_product_name }}"
                  merged_into_product_id: "{{ pid_keep_in }}"
                  stock_amount_transferred: "{{ _cdel_stock_amt }}"
            - stop: Product Merged and Deleted
              response_variable: final_response
          - conditions:
            - condition: template
              value_template: "{{ _cdel_stock_amt > 0 and not confirm_action_in }}"
            sequence:
            - variables:
                final_response:
                  status: stock_guard
                  mode: catalog_delete_product
                  message: "Product has stock. Merge into another product or confirm to delete."
                  product_id: "{{ product_id_resolved }}"
                  name: "{{ _cdel_product_name }}"
                  stock_amount: "{{ _cdel_stock_amt }}"
                  coaching:
                  - "To merge stock into another product: add product_id_keep=<target_id>"
                  - "To delete and discard stock: confirm_action=true"
                  - "To consume remaining stock first: stock_consume item=<name> amount=<n>"
            - stop: Stock Guard
              response_variable: final_response
        - action: script.zen_sutra_grocy
          response_variable: _cdel_children_raw
          data:
            action_type: read
            endpoint: "/objects/products?query%5B%5D=parent_product_id={{ product_id_resolved }}"
        - variables:
            _cdel_children: "{{ _cdel_children_raw['result']['content'] | default([]) }}"
            _cdel_child_count: "{{ _cdel_children | length }}"
            _cdel_child_names: "{{ _cdel_children | map(attribute='name') | list }}"
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _cdel_child_count | int > 0 and not confirm_action_in }}"
            sequence:
            - variables:
                final_response:
                  status: parent_guard
                  mode: catalog_delete_product
                  message: "Product is a parent with {{ _cdel_child_count }} child product(s). Reparent or confirm to orphan."
                  product_id: "{{ product_id_resolved }}"
                  name: "{{ _cdel_product_name }}"
                  child_count: "{{ _cdel_child_count }}"
                  children: "{{ _cdel_child_names }}"
                  coaching:
                  - "To reassign a child to a new parent: update_product_meta item='<child>' parent_product='<new parent>'"
                  - "To clear a child's parent link: update_product_meta item='<child>' parent_product_id=0"
                  - "To delete anyway (children will lose parent link): confirm_action=true"
            - stop: Parent Guard
              response_variable: final_response
        - action: script.zen_sutra_grocy
          response_variable: _cdel_raw
          data:
            action_type: delete
            endpoint: "/objects/products/{{ product_id_resolved }}"
            payload: "{}"
        - variables:
            final_response:
              status: success
              mode: catalog_delete_product
              result:
                product_id: "{{ product_id_resolved }}"
                name: "{{ _cdel_product_name }}"
                had_stock: "{{ _cdel_stock_amt > 0 }}"
                stock_amount_at_delete: "{{ _cdel_stock_amt }}"
        - stop: Product Deleted
          response_variable: final_response
    - alias: 'catalog_audit — paginated product health scan (2000-product cap, ~160KB max var)'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'catalog_audit' }}"
        sequence:
        - variables:
            _ca_offset: 0
            _ca_page_size: 500
            _ca_done: false
            _ca_total: 0
            _ca_compact: []
        - repeat:
            count: 4
            sequence:
            - choose:
              - conditions:
                - condition: template
                  value_template: "{{ not _ca_done }}"
                sequence:
                - variables:
                    _ca_fetch_endpoint: "/objects/products?limit={{ _ca_page_size }}&offset={{ _ca_offset }}"
                - action: script.zen_sutra_grocy
                  response_variable: _ca_page_raw
                  data:
                    action_type: read
                    endpoint: "{{ _ca_fetch_endpoint }}"
                - variables:
                    _ca_page_items: "{{ _ca_page_raw['result']['content'] | default([]) }}"
                - variables:
                    _ca_done: "{{ (_ca_page_items | length) < _ca_page_size }}"
                    _ca_offset: "{{ _ca_offset + _ca_page_size }}"
                    _ca_total: "{{ _ca_total + (_ca_page_items | length) }}"
                    _ca_compact: >-
                      {%- set ns = namespace(out=_ca_compact) -%}
                      {%- for p in _ca_page_items -%}
                        {%- set _uf = p.userfields if p.userfields is mapping else {} -%}
                        {%- set ns.out = ns.out + [{'id': p.id, 'name': p.name, 'pid': p.parent_product_id | default(none,true), 'qu': p.qu_id_stock | default(none,true), 'loc': p.location_id | default(none,true), 'lbl': _uf.ha_labels | default('',true), 'area': _uf.homeassistant_area | default('',true)}] -%}
                      {%- endfor -%}
                      {{ ns.out }}
        - variables:
            _ca_all_ids: "{{ _ca_compact | map(attribute='id') | list }}"
        - variables:
            _ca_result: >-
              {%- set all_ids = _ca_compact | map(attribute='id') | list -%}
              {%- set ns = namespace(orp=[], lbl=[], area=[], loc=[], qu=[]) -%}
              {%- for p in _ca_compact -%}
                {%- if p.pid is not none and p.pid | int(none) is not none and p.pid | int not in all_ids -%}
                  {%- set ns.orp = ns.orp + [{'id': p.id, 'name': p.name, 'declared_parent_id': p.pid | int, 'fix': 'update_product_meta item=' ~ p.name ~ ' parent_product=<new parent>'}] -%}
                {%- endif -%}
                {%- if (p.lbl | default('', true)) == '' -%}
                  {%- set ns.lbl = ns.lbl + [{'id': p.id, 'name': p.name, 'fix': 'products_tag item=' ~ p.name ~ ' ha_labels=<root_label>'}] -%}
                {%- endif -%}
                {%- if (p.area | default('', true)) == '' -%}
                  {%- set ns.area = ns.area + [{'id': p.id, 'name': p.name, 'fix': 'products_tag item=' ~ p.name ~ ' homeassistant_area_id=<area_id>'}] -%}
                {%- endif -%}
                {%- if p.loc is none -%}
                  {%- set ns.loc = ns.loc + [{'id': p.id, 'name': p.name, 'fix': 'set_default_location_for_product item=' ~ p.name ~ ' location=<location>'}] -%}
                {%- endif -%}
                {%- if p.qu is none -%}
                  {%- set ns.qu = ns.qu + [{'id': p.id, 'name': p.name, 'fix': 'update_product_meta item=' ~ p.name ~ ' unit=each'}] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ {
                'total_products': _ca_total,
                'issues_found': (ns.orp|length) + (ns.lbl|length) + (ns.area|length) + (ns.loc|length) + (ns.qu|length),
                'orphaned_children': {'count': ns.orp|length, 'items': ns.orp},
                'no_labels':         {'count': ns.lbl|length, 'items': ns.lbl},
                'no_area':           {'count': ns.area|length, 'items': ns.area},
                'no_location':       {'count': ns.loc|length, 'items': ns.loc},
                'no_unit':           {'count': ns.qu|length,  'items': ns.qu}
              } }}
        - variables:
            final_response:
              status: success
              tool: "{{ tool_name }}"
              version: "{{ tool_version }}"
              case: catalog_audit
              result: "{{ _ca_result }}"
        - stop: Catalog Audit Complete
          response_variable: final_response
    - alias: 'locations_reparent_bulk — bulk reparent'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'locations_reparent_bulk' }}"
        sequence:
        - variables:
            _bulk_child_ids: "{{ child_lids_in | list if child_lids_in is iterable and child_lids_in is not string else child_lids_in | from_json | list }}"
            _bulk_parent_lid: "{{ parent_lid_resolved | int(none) }}"
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _bulk_parent_lid is none or _bulk_child_ids | length == 0 }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  version: '{{ tool_version }}'
                  mode: locations_reparent_bulk
                  message: parent_location_id and child_location_ids are required
                  coaching:
                  - parent_location_id must be an explicit numeric ID
                  - child_location_ids must be a JSON array e.g. "[201,202,203]"
            - stop: Reparent Bulk Guard
              response_variable: final_response
        # Read parent location once — we need its homeassistant_area for inheritance
        - action: script.zen_sutra_grocy
          response_variable: _rb_parent_raw
          data:
            action_type: read
            endpoint: /objects/locations/{{ _bulk_parent_lid }}
        - variables:
            _rb_parent_area: >-
              {%- set c = _rb_parent_raw.get('result', {}).get('content', {}) if _rb_parent_raw is mapping else {} -%}
              {%- set c = c if c is mapping else {} -%}
              {{ c.get('userfields', {}).get('homeassistant_area', '') | string | lower | trim }}
        - repeat:
            for_each: "{{ _bulk_child_ids }}"
            sequence:
            - action: script.zen_sutra_grocy
              response_variable: _rb_snap_raw
              data:
                action_type: read
                endpoint: /objects/locations?limit=500&offset=0
            - variables:
                _rb_child_snap: >-
                  {{ _rb_snap_raw['result']['content'] | selectattr('id', 'equalto', repeat.item | int) | list | first | default({}) }}
            - variables:
                _rb_old_parent: "{{ _rb_child_snap.get('userfields', {}).get('grocy_parent_location_id', none) | int(none) }}"
                _rb_child_area: "{{ _rb_child_snap.get('userfields', {}).get('homeassistant_area', '') | string | lower | trim }}"
            # Determine area to write: parent's area if set; else keep child's unless confirm_action clears it
            - variables:
                _rb_area_to_write: >-
                  {%- if _rb_parent_area != '' -%}{{ _rb_parent_area }}
                  {%- elif _rb_child_area != '' and not confirm_action_in -%}{{ _rb_child_area }}
                  {%- else -%}{{ _rb_parent_area }}{%- endif -%}
                _rb_already_parented: "{{ _rb_old_parent is not none and (_rb_old_parent | int) == (_bulk_parent_lid | int) }}"
            - variables:
                _rb_area_already_set: "{{ _rb_child_area == _rb_area_to_write }}"
            # Write grocy_parent_location_id only if not already correct (idempotency)
            - choose:
              - conditions:
                - condition: template
                  value_template: "{{ not _rb_already_parented }}"
                sequence:
                - action: script.zen_sutra_grocy
                  data:
                    action_type: update
                    endpoint: /userfields/locations/{{ repeat.item }}
                    payload: "{{ dict([('grocy_parent_location_id', _bulk_parent_lid)]) }}"
            # Write homeassistant_area if it needs to change
            - choose:
              - conditions:
                - condition: template
                  value_template: "{{ not _rb_area_already_set }}"
                sequence:
                - action: script.zen_sutra_grocy
                  data:
                    action_type: update
                    endpoint: /userfields/locations/{{ repeat.item }}
                    payload: "{{ dict([('homeassistant_area', _rb_area_to_write)]) }}"
            # Sync parent's child list
            - action: script.zen_sutra_grocy
              response_variable: _rb_js_reg_raw
              data:
                action_type: read
                endpoint: /objects/locations?limit=500&offset=0
            - variables:
                _rb_new_kids: "{{ _rb_js_reg_raw['result']['content'] | selectattr('userfields.grocy_parent_location_id', 'equalto', _bulk_parent_lid | string) | map(attribute='id') | map('int') | unique | sort | list }}"
            - action: script.zen_sutra_grocy
              data:
                action_type: update
                endpoint: /userfields/locations/{{ _bulk_parent_lid }}
                payload: "{{ dict([('grocy_child_location_ids', '[' ~ (_rb_new_kids | join(',')) ~ ']')]) }}"
            # Evict from old parent's child list if parent actually changed
            - choose:
              - conditions:
                - condition: template
                  value_template: "{{ not _rb_already_parented and _rb_old_parent is not none and (_rb_old_parent | int) != (_bulk_parent_lid | int) }}"
                sequence:
                - action: script.zen_sutra_grocy
                  response_variable: _rb_evict_raw
                  data:
                    action_type: read
                    endpoint: /objects/locations?limit=500&offset=0
                - variables:
                    _rb_old_kids: "{{ _rb_evict_raw['result']['content'] | selectattr('userfields.grocy_parent_location_id', 'equalto', _rb_old_parent | string) | map(attribute='id') | map('int') | unique | sort | list }}"
                - action: script.zen_sutra_grocy
                  data:
                    action_type: update
                    endpoint: /userfields/locations/{{ _rb_old_parent }}
                    payload: "{{ dict([('grocy_child_location_ids', '[' ~ (_rb_old_kids | join(',')) ~ ']')]) }}"
        - variables:
            final_response:
              status: success
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              mode: locations_reparent_bulk
              result:
                parent_id: '{{ _bulk_parent_lid }}'
                parent_area: '{{ _rb_parent_area }}'
                children_processed: '{{ _bulk_child_ids | length }}'
                child_ids: '{{ _bulk_child_ids }}'
                area_inherited: "{{ _rb_parent_area != '' }}"
        - stop: Reparent Bulk Complete
          response_variable: final_response
    - alias: 'locations_delete_safe — stock-safe delete'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'locations_delete_safe' and location_id_resolved is not none }}"
        sequence:
        - action: script.zen_sutra_grocy
          response_variable: _ds_stock_raw
          data:
            action_type: read
            endpoint: /stock/locations/{{ location_id_resolved }}/entries
        - variables:
            _ds_stock_list: "{{ _ds_stock_raw['result']['content'] | default([]) }}"
            _ds_has_stock: "{{ (_ds_stock_list | list | length) > 0 }}"
            _ds_orphan_to: "{{ orphan_to_lid_in | int(none) }}"
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _ds_has_stock and _ds_orphan_to is none }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  version: '{{ tool_version }}'
                  mode: locations_delete_safe
                  message: Location has stock — provide orphan_to to transfer before delete
                  details:
                    location_id: '{{ location_id_resolved }}'
                    stock_count: '{{ _ds_stock_list | length }}'
                  coaching:
                  - Use locations_delete_safe with orphan_to=<destination_id>
                  - Or transfer stock manually first then use locations_delete
            - stop: Delete Safe Blocked
              response_variable: final_response
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _ds_has_stock and _ds_orphan_to is not none }}"
            sequence:
            - repeat:
                for_each: "{{ _ds_stock_list | map(attribute='product_id') | unique | list }}"
                sequence:
                - action: script.zen_sutra_grocy
                  data:
                    action_type: create
                    endpoint: /stock/products/{{ repeat.item }}/transfer
                    payload: "{{ {'amount': (_ds_stock_list | selectattr('product_id', 'equalto', repeat.item) | map(attribute='amount') | map('float') | sum), 'location_id_from': location_id_resolved | int, 'location_id_to': _ds_orphan_to} }}"
        - action: script.zen_sutra_grocy
          response_variable: _ds_del_raw
          data:
            action_type: delete
            endpoint: /objects/locations/{{ location_id_resolved }}
            payload: "{{ {} }}"
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _deleted_loc_parent_id is not none }}"
            sequence:
            - action: script.zen_sutra_grocy
              response_variable: _ds_evict_raw
              data:
                action_type: read
                endpoint: /objects/locations?limit=500&offset=0
            - variables:
                _ds_evict_kids: "{{ _ds_evict_raw['result']['content'] | selectattr('userfields.grocy_parent_location_id', 'equalto', _deleted_loc_parent_id | string) | map(attribute='id') | map('int') | unique | sort | list }}"
            - action: script.zen_sutra_grocy
              data:
                action_type: update
                endpoint: /userfields/locations/{{ _deleted_loc_parent_id }}
                payload: "{{ dict([('grocy_child_location_ids', '[' ~ (_ds_evict_kids | join(',')) ~ ']')]) }}"
        - variables:
            final_response:
              status: success
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              mode: locations_delete_safe
              result:
                location_id: '{{ location_id_resolved }}'
                stock_transferred: '{{ _ds_has_stock }}'
                orphan_to: '{{ _ds_orphan_to }}'
                deleted: true
        - stop: Delete Safe Complete
          response_variable: final_response
    - alias: 'locations_hierarchy_rebuild — rebuild parent-child lists from ground truth'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'locations_hierarchy_rebuild' }}"
        sequence:
        - action: script.zen_sutra_grocy
          response_variable: _hr_raw
          data:
            action_type: read
            endpoint: /objects/locations?limit=500&offset=0
        - variables:
            _hr_locs: "{{ _hr_raw['result']['content'] | default([], true) }}"
        - variables:
            _hr_all_pids: >-
              {{ _hr_locs
                 | selectattr('userfields.grocy_parent_location_id', 'defined')
                 | selectattr('userfields.grocy_parent_location_id', 'ne', none)
                 | selectattr('userfields.grocy_parent_location_id', 'ne', '')
                 | map(attribute='userfields.grocy_parent_location_id')
                 | map('int')
                 | unique
                 | list }}
        - variables:
            _hr_plans: >-
              {%- set ns = namespace(plans=[]) -%}
              {%- for pid_int in _hr_all_pids -%}
                {%- set pid_str = pid_int | string -%}
                {%- set derived = _hr_locs
                    | selectattr('userfields.grocy_parent_location_id', 'defined')
                    | selectattr('userfields.grocy_parent_location_id', 'equalto', pid_str)
                    | map(attribute='id') | map('int') | sort | list -%}
                {%- set parent = _hr_locs | selectattr('id', 'equalto', pid_int) | list | first | default(none) -%}
                {%- set cur_raw = (parent.userfields.grocy_child_location_ids | default('[]', true))
                    if (parent is not none and parent.userfields is defined) else '[]' -%}
                {%- set current = cur_raw | from_json | map('int') | sort | list -%}
                {%- if derived != current -%}
                  {%- set ns.plans = ns.plans + [{
                    'parent_id': pid_int,
                    'parent_name': (parent.name if parent is not none else '?'),
                    'derived': derived,
                    'current': current}] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.plans }}
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ dry_run_in }}"
            sequence:
            - variables:
                final_response:
                  status: dry_run
                  mode: locations_hierarchy_rebuild
                  parents_to_update: "{{ _hr_plans | length }}"
                  total_parents_scanned: "{{ _hr_all_pids | length }}"
                  plan: "{{ _hr_plans }}"
            - stop: Hierarchy Rebuild Dry Run
              response_variable: final_response
        - repeat:
            for_each: "{{ _hr_plans }}"
            sequence:
            - action: script.zen_sutra_grocy
              data:
                action_type: update
                endpoint: /userfields/locations/{{ repeat.item.parent_id }}
                payload: "{{ dict([('grocy_child_location_ids', '[' ~ (repeat.item.derived | join(',')) ~ ']')]) }}"
        - variables:
            final_response:
              status: success
              mode: locations_hierarchy_rebuild
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              parents_scanned: "{{ _hr_all_pids | length }}"
              parents_updated: "{{ _hr_plans | length }}"
              total_children_registered: "{{ _hr_plans | map(attribute='derived') | map('length') | sum }}"
        - stop: Hierarchy Rebuild Complete
          response_variable: final_response
    - alias: 'stock_area_summary — bulk product count + location_tree for a HA area (RM chain target)'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'stock_area_summary' }}"
        sequence:
        - variables:
            _sas_area_id: "{{ area_id_norm }}"
        - variables:
            _sas_hh_cab: >-
              {{ label_entities('Zen Household Cabinet')
                 | select('match', 'sensor\\.') | list | first | default('') }}
        - variables:
            _sas_spatial: >-
              {%- set _cv = state_attr(_sas_hh_cab, 'variables') -%}
              {%- set _cv = _cv if _cv is mapping else {} -%}
              {%- set _topo = _cv.get('room_topology', {}) -%}
              {%- set _topo = _topo.get('value', _topo) if _topo is mapping else {} -%}
              {%- set _topo = _topo | from_json if _topo is string and _topo | trim not in ['', 'none', 'null', 'None'] else _topo -%}
              {{ _topo.get(_sas_area_id, none) }}
        - variables:
            _sas_anchor_id: >-
              {{ (_sas_spatial.grocy_location_id | string | trim)
                 if (_sas_spatial is mapping
                     and _sas_spatial.grocy_location_id | default(none, true) is not none)
                 else none }}
        - variables:
            _sas_safety: >-
              {{ _sas_spatial.get('safety', []) if _sas_spatial is mapping else [] }}
        - action: script.zen_sutra_grocy
          response_variable: _sas_locs_raw
          data:
            action_type: read
            endpoint: /objects/locations?limit=500&offset=0
        - variables:
            _sas_all_locs: "{{ _sas_locs_raw['result']['content'] | default([], true) }}"
        - variables:
            _sas_area_locs: >-
              {{ _sas_all_locs
                 | selectattr('userfields.homeassistant_area', 'defined')
                 | selectattr('userfields.homeassistant_area', 'search', '(?i)^' ~ _sas_area_id ~ '$')
                 | list }}
        - variables:
            _sas_pg_offset: 0
            _sas_pg_done: false
            _sas_loc_counts: {}
        - repeat:
            while: "{{ not _sas_pg_done }}"
            sequence:
              - action: script.zen_sutra_grocy
                response_variable: _sas_pg_raw
                continue_on_error: true
                data:
                  action_type: read
                  endpoint: "/objects/products?limit=200&offset={{ _sas_pg_offset }}"
              - variables:
                  _sas_pg_len: >-
                    {%- set _pg = _sas_pg_raw['result']['content']
                                  if _sas_pg_raw is mapping and 'result' in _sas_pg_raw
                                     and _sas_pg_raw['result']['content'] is sequence
                                  else [] -%}
                    {{ _pg | length }}
                  _sas_loc_counts: >-
                    {%- set _pg = _sas_pg_raw['result']['content']
                                  if _sas_pg_raw is mapping and 'result' in _sas_pg_raw
                                     and _sas_pg_raw['result']['content'] is sequence
                                  else [] -%}
                    {%- set ns = namespace(lc=_sas_loc_counts) -%}
                    {%- for p in _pg -%}
                      {%- set _lid = p.location_id | default(0, true) | int(0) -%}
                      {%- if _lid > 0 -%}
                        {%- set ns.lc = ns.lc | combine({_lid | string: (ns.lc.get(_lid | string, 0) + 1)}) -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {{ ns.lc }}
                  _sas_pg_offset: "{{ (_sas_pg_offset | int) + 200 }}"
              - variables:
                  _sas_pg_done: "{{ _sas_pg_len | int < 200 }}"
        - variables:
            _sas_counts: >-
              {%- set ns_lc = namespace(lc=_sas_loc_counts) -%}
              {%- set ns = namespace(counts=[]) -%}
              {%- for loc in _sas_area_locs -%}
                {%- set _lid = loc.id | int -%}
                {%- set _pid_raw = loc.userfields.grocy_parent_location_id | default(none, true) -%}
                {%- set _pid = _pid_raw | int(none) if _pid_raw not in [none, '', '0', 0] else none -%}
                {%- set _count = ns_lc.lc.get(_lid | string, 0) | int -%}
                {%- set ns.counts = ns.counts + [{
                  'id': _lid,
                  'name': loc.name,
                  'parent_id': _pid,
                  'subclass': loc.userfields.grocy_location_subclass | default('', true),
                  'is_anchor': (loc.id | string) == (_sas_anchor_id | string),
                  'item_count': _count
                }] -%}
              {%- endfor -%}
              {{ ns.counts }}
        - variables:
            _sas_all_locs_map: >-
              {%- set ns = namespace(m={}) -%}
              {%- for l in _sas_all_locs -%}
                {%- set ns.m = ns.m | combine({l.id | string: l.name}) -%}
              {%- endfor -%}
              {{ ns.m }}
        - variables:
            _sas_annotated: >-
              {%- set ns = namespace(nodes=[]) -%}
              {%- for c in _sas_counts | sort(attribute='name') -%}
                {%- set pname = _sas_all_locs_map.get(c.parent_id | string, none) if c.parent_id is not none else none -%}
                {%- set ns.nodes = ns.nodes + [c | combine({'parent_name': pname})] -%}
              {%- endfor -%}
              {{ ns.nodes }}
            _sas_anchor_int: "{{ _sas_anchor_id | int(0) }}"
        - variables:
            _sas_location_tree: >-
              {%- set ns = namespace(roots=[]) -%}
              {%- set _has_anchor = _sas_annotated | selectattr('is_anchor') | list | length > 0 -%}
              {%- set _area_ids = _sas_annotated | map(attribute='id') | list -%}
              {%- for c0 in _sas_annotated if (c0.is_anchor if _has_anchor else c0.parent_id not in _area_ids) -%}
                {%- set ns_l1 = namespace(children=[]) -%}
                {%- for c1 in _sas_annotated if c1.parent_id == c0.id and not c1.is_anchor -%}
                  {%- set ns_l2 = namespace(children=[]) -%}
                  {%- for c2 in _sas_annotated if c2.parent_id == c1.id -%}
                    {%- set ns_l2.children = ns_l2.children + [{'id': c2.id, 'name': c2.name, 'subclass': c2.subclass, 'item_count': c2.item_count}] -%}
                  {%- endfor -%}
                  {%- set ns_l1.children = ns_l1.children + [{'id': c1.id, 'name': c1.name, 'subclass': c1.subclass, 'item_count': c1.item_count, 'children': ns_l2.children}] -%}
                {%- endfor -%}
                {%- set ns.roots = ns.roots + [{'id': c0.id, 'name': c0.name, 'is_anchor': c0.is_anchor, 'subclass': c0.subclass, 'item_count': c0.item_count, 'children': ns_l1.children}] -%}
              {%- endfor -%}
              {{ ns.roots }}
        - variables:
            final_response:
              status: success
              mode: stock_area_summary
              area_id: "{{ _sas_area_id }}"
              locations: "{{ _sas_annotated | sort(attribute='item_count', reverse=true) }}"
              location_tree: "{{ _sas_location_tree }}"
              anchor_location_id: "{{ _sas_anchor_id }}"
              total_locations: "{{ _sas_area_locs | length }}"
              stocked_locations: "{{ _sas_counts | selectattr('item_count', 'gt', 0) | list | length }}"
              total_items: "{{ _sas_counts | map(attribute='item_count') | sum }}"
              hazmat_safety: "{{ _sas_safety }}"
              tool: "{{ tool_name }}"
              version: "{{ tool_version }}"
        - stop: Area Inventory Summary
          response_variable: final_response
    - alias: 'stock_area_volatile — volatile items (overdue/due_soon/expiring) filtered to a HA area'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'stock_area_volatile' }}"
        sequence:
        - variables:
            _sav_area_id: "{{ area_id_norm }}"
        - action: script.zen_sutra_grocy
          response_variable: _sav_locs_raw
          data:
            action_type: read
            endpoint: /objects/locations?limit=500&offset=0
        - variables:
            _sav_area_loc_ids: >-
              {%- set _all = _sav_locs_raw['result']['content'] | default([], true) -%}
              {{ _all
                 | selectattr('userfields.homeassistant_area', 'defined')
                 | selectattr('userfields.homeassistant_area', 'search', '(?i)^' ~ _sav_area_id ~ '$')
                 | map(attribute='id') | map('int') | list }}
        - action: script.zen_sutra_grocy
          response_variable: _sav_vol_raw
          data:
            action_type: read
            endpoint: stock/volatile
        - variables:
            _sav_vol_content: >-
              {{ _sav_vol_raw['result']['content'] | default({}, true) }}
        - variables:
            final_response: >-
              {%- set _ov_all = _sav_vol_content.overdue_products | default([], true) -%}
              {%- set _ds_all = _sav_vol_content.due_dates | default([], true) -%}
              {%- set _ex_all = _sav_vol_content.expiring_products | default([], true) -%}
              {%- set ns = namespace(ov=[], ds=[], ex=[]) -%}
              {%- for i in _ov_all -%}
                {%- if i.location_id | default(none, true) | int(0) in _sav_area_loc_ids -%}
                  {%- set ns.ov = ns.ov + [i] -%}
                {%- endif -%}
              {%- endfor -%}
              {%- for i in _ds_all -%}
                {%- if i.location_id | default(none, true) | int(0) in _sav_area_loc_ids -%}
                  {%- set ns.ds = ns.ds + [i] -%}
                {%- endif -%}
              {%- endfor -%}
              {%- for i in _ex_all -%}
                {%- if i.location_id | default(none, true) | int(0) in _sav_area_loc_ids -%}
                  {%- set ns.ex = ns.ex + [i] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ {
                'status': 'success',
                'mode': 'stock_area_volatile',
                'area_id': _sav_area_id,
                'location_ids': _sav_area_loc_ids,
                'overdue': ns.ov,
                'due_soon': ns.ds,
                'expiring': ns.ex,
                'counts': {
                  'overdue': ns.ov | length,
                  'due_soon': ns.ds | length,
                  'expiring': ns.ex | length
                },
                'tool': tool_name,
                'version': tool_version
              } }}
        - stop: Area Volatile Stock
          response_variable: final_response
    - alias: 'chores_by_area — maintenance chores for products stocked in a HA area'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'chores_by_area' }}"
        sequence:
        - variables:
            _cba_area_id: "{{ homeassistant_area_id | default('') | string | trim | lower }}"
        - action: script.zen_sutra_grocy
          response_variable: _cba_locs_raw
          data:
            action_type: read
            endpoint: /objects/locations?limit=500&offset=0
        - variables:
            _cba_area_loc_ids: >-
              {{ _cba_locs_raw['result']['content'] | default([], true)
                 | selectattr('userfields.homeassistant_area', 'defined')
                 | selectattr('userfields.homeassistant_area', 'equalto', _cba_area_id)
                 | map(attribute='id') | map('int') | list }}
        - action: script.zen_sutra_grocy
          response_variable: _cba_defs_raw
          data:
            action_type: read
            endpoint: /objects/chores?limit=500&offset=0
        - variables:
            _cba_all_chores: "{{ _cba_defs_raw['result']['content'] | default([], true) }}"
        - variables:
            _cba_tagged_ids: >-
              {{ _cba_all_chores
                 | selectattr('userfields', 'defined')
                 | selectattr('userfields.homeassistant_area', 'defined')
                 | selectattr('userfields.homeassistant_area', 'equalto', _cba_area_id)
                 | map(attribute='id') | map('int') | list }}
        - variables:
            _cba_linked: >-
              {{ _cba_all_chores
                 | selectattr('product_id', 'defined')
                 | rejectattr('product_id', 'equalto', none)
                 | rejectattr('product_id', 'equalto', '')
                 | list }}
        - action: script.zen_sutra_grocy
          response_variable: _cba_state_raw
          data:
            action_type: read
            endpoint: /chores
        - variables:
            _cba_state: "{{ _cba_state_raw['result']['content'] | default([], true) }}"
        - variables:
            _cba_results: "{{ [] }}"
        - variables:
            _cba_results: >-
              {%- set ns = namespace(r=_cba_results) -%}
              {%- for c in _cba_all_chores -%}
                {%- if (c.id | int) in _cba_tagged_ids -%}
                  {%- set _pid = c.get('product_id', none) -%}
                  {%- if _pid is none or _pid | string | trim == '' -%}
                    {%- set _st = _cba_state | selectattr('chore_id', 'equalto', c.id | string) | list | first | default({}) -%}
                    {%- set ns.r = ns.r + [{'chore_id': c.id | int, 'name': c.name, 'product_id': none, 'product_amount': 0, 'is_due': _st.get('is_due', false) | bool, 'next_execution': _st.get('next_estimated_execution_time', none), 'last_tracked': _st.get('last_tracked_time', none), 'area_location_ids': [], 'discovery': 'tagged'}] -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.r }}
        - repeat:
            for_each: "{{ _cba_linked }}"
            sequence:
            - action: script.zen_sutra_grocy
              response_variable: _cba_ploc_raw
              continue_on_error: true
              data:
                action_type: read
                endpoint: /stock/products/{{ repeat.item.product_id }}/entries
            - variables:
                _cba_plocs: "{{ (_cba_ploc_raw['result']['content'] | default([], true)) if _cba_ploc_raw is mapping and _cba_ploc_raw.get('status') == 'success' else [] }}"
            - variables:
                _cba_in_area: >-
                  {{ _cba_plocs
                     | selectattr('location_id', 'defined')
                     | selectattr('location_id', 'in', _cba_area_loc_ids)
                     | list }}
            - variables:
                _cba_state_entry: >-
                  {{ _cba_state
                     | selectattr('chore_id', 'equalto', repeat.item.id | string)
                     | list | first | default({}) }}
            - variables:
                _cba_results: >-
                  {%- if _cba_in_area | length > 0 or (repeat.item.id | int) in _cba_tagged_ids -%}
                    {{ _cba_results + [{
                      'chore_id': repeat.item.id | int,
                      'name': repeat.item.name,
                      'product_id': repeat.item.product_id | int,
                      'product_amount': repeat.item.product_amount | default(1, true) | float,
                      'is_due': _cba_state_entry.get('is_due', false) | bool,
                      'next_execution': _cba_state_entry.get('next_estimated_execution_time', none),
                      'last_tracked': _cba_state_entry.get('last_tracked_time', none),
                      'area_location_ids': _cba_in_area | map(attribute='location_id') | map('int') | unique | list,
                      'discovery': 'product' if _cba_in_area | length > 0 else 'tagged'
                    }] }}
                  {%- else -%}
                    {{ _cba_results }}
                  {%- endif -%}
        - variables:
            final_response:
              status: success
              mode: chores_by_area
              area_id: "{{ _cba_area_id }}"
              chores: "{{ _cba_results }}"
              total: "{{ _cba_results | length }}"
              due_count: "{{ _cba_results | selectattr('is_due') | list | length }}"
              tool: "{{ tool_name }}"
              version: "{{ tool_version }}"
        - stop: Chores By Area
          response_variable: final_response
    - alias: 'room_brief — chores + stock summary for a HA area in one call'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'room_brief' }}"
        sequence:
        - variables:
            _rb_area: "{{ homeassistant_area_id | default('') | string | trim | lower }}"
        - action: script.zen_sutra_grocy
          response_variable: _rb_locs_raw
          data:
            action_type: read
            endpoint: /objects/locations?limit=500&offset=0
        - variables:
            _rb_area_loc_ids: >-
              {{ _rb_locs_raw['result']['content'] | default([], true)
                 | selectattr('userfields.homeassistant_area', 'defined')
                 | selectattr('userfields.homeassistant_area', 'equalto', _rb_area)
                 | map(attribute='id') | map('int') | list }}
        - action: script.zen_sutra_grocy
          response_variable: _rb_chore_defs_raw
          data:
            action_type: read
            endpoint: /objects/chores?limit=500&offset=0
        - action: script.zen_sutra_grocy
          response_variable: _rb_chore_state_raw
          data:
            action_type: read
            endpoint: /chores
        - variables:
            _rb_stock_pg_offset: 0
            _rb_stock_pg_done: false
            _rb_stock_in_area: []
        - repeat:
            while: "{{ not _rb_stock_pg_done }}"
            sequence:
              - action: script.zen_sutra_grocy
                response_variable: _rb_stock_pg_raw
                continue_on_error: true
                data:
                  action_type: read
                  endpoint: "/objects/stock?limit=200&offset={{ _rb_stock_pg_offset }}"
              - variables:
                  _rb_stock_pg_len: >-
                    {%- set _pg = _rb_stock_pg_raw['result']['content']
                                  if _rb_stock_pg_raw is mapping and 'result' in _rb_stock_pg_raw
                                     and _rb_stock_pg_raw['result']['content'] is sequence
                                  else [] -%}
                    {{ _pg | length }}
                  _rb_stock_in_area: >-
                    {%- set _pg = _rb_stock_pg_raw['result']['content']
                                  if _rb_stock_pg_raw is mapping and 'result' in _rb_stock_pg_raw
                                     and _rb_stock_pg_raw['result']['content'] is sequence
                                  else [] -%}
                    {{ _rb_stock_in_area + (_pg
                       | selectattr('location_id', 'defined')
                       | selectattr('location_id', 'in', _rb_area_loc_ids)
                       | list) }}
                  _rb_stock_pg_offset: "{{ (_rb_stock_pg_offset | int) + 200 }}"
              - variables:
                  _rb_stock_pg_done: "{{ _rb_stock_pg_len | int < 200 }}"
        - variables:
            _rb_pg_offset: 0
            _rb_pg_done: false
            _rb_labeled_ids: []
        - repeat:
            while: "{{ not _rb_pg_done }}"
            sequence:
              - action: script.zen_sutra_grocy
                response_variable: _rb_pg_raw
                continue_on_error: true
                data:
                  action_type: read
                  endpoint: "/objects/products?limit=200&offset={{ _rb_pg_offset }}"
              - variables:
                  _rb_pg_len: >-
                    {%- set _pg = _rb_pg_raw['result']['content']
                                  if _rb_pg_raw is mapping and 'result' in _rb_pg_raw
                                     and _rb_pg_raw['result']['content'] is sequence
                                  else [] -%}
                    {{ _pg | length }}
                  _rb_labeled_ids: >-
                    {%- set _pg = _rb_pg_raw['result']['content']
                                  if _rb_pg_raw is mapping and 'result' in _rb_pg_raw
                                     and _rb_pg_raw['result']['content'] is sequence
                                  else [] -%}
                    {%- set ns = namespace(ids=_rb_labeled_ids) -%}
                    {%- for p in _pg -%}
                      {%- set uf = p.get('userfields', {}) if p.get('userfields') is mapping else {} -%}
                      {%- set _ha = (uf.get('homeassistant_area', '') | default('', true)) | string | trim -%}
                      {%- set _hl = (uf.get('ha_labels', '') | default('', true)) | string | trim -%}
                      {%- set _hl_list = _hl.split(',') | map('trim') | list -%}
                      {%- if _ha == _rb_area or _rb_area in _hl_list -%}
                        {%- set ns.ids = ns.ids + [p.id | int] -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {{ ns.ids }}
                  _rb_pg_offset: "{{ (_rb_pg_offset | int) + 200 }}"
              - variables:
                  _rb_pg_done: "{{ _rb_pg_len | int < 200 }}"
        - variables:
            _rb_chore_state: "{{ _rb_chore_state_raw['result']['content'] | default([], true) }}"
        - variables:
            _rb_area_product_ids: >-
              {%- set _from_stock = _rb_stock_in_area | map(attribute='product_id') | map('int') | list -%}
              {{ (_from_stock + _rb_labeled_ids) | unique | list }}
        - variables:
            _rb_chores: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for c in _rb_chore_defs_raw['result']['content'] | default([], true) -%}
                {%- set _area_tagged = c.userfields is mapping and c.userfields.get('homeassistant_area') == _rb_area -%}
                {%- set _product_in_area = c.get('product_id') | int(-1) in _rb_area_product_ids -%}
                {%- if _area_tagged or _product_in_area -%}
                  {%- set _st = _rb_chore_state | selectattr('chore_id', 'equalto', c.id | string) | list | first | default({}) -%}
                  {%- set ns.out = ns.out + [{'chore_id': c.id | int, 'name': c.name, 'is_due': _st.get('is_due', false) | bool, 'next_execution': _st.get('next_estimated_execution_time', none)}] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out }}
        - variables:
            final_response:
              status: success
              mode: room_brief
              area_id: "{{ _rb_area }}"
              chores: "{{ _rb_chores }}"
              chores_due: "{{ _rb_chores | selectattr('is_due') | list | length }}"
              stock_total_items: "{{ _rb_stock_in_area | map(attribute='amount') | sum }}"
              stock_unique_products: "{{ _rb_stock_in_area | map(attribute='product_id') | unique | list | length }}"
              stocked_location_ids: "{{ _rb_stock_in_area | map(attribute='location_id') | unique | list }}"
              tool: "{{ tool_name }}"
              version: "{{ tool_version }}"
        - stop: Room Brief
          response_variable: final_response
    - alias: 'chores_add — create a new Grocy chore'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'chores_add' }}"
        sequence:
        - variables:
            _ca_name: "{{ item | default('') | string | trim }}"
            _ca_period_type: "{{ period_type | default('dynamic-regular') | string | trim }}"
            _ca_period_days: "{{ period_days | default(7) | int }}"
            _ca_product_id: "{{ product_id | default(none, true) }}"
            _ca_product_amount: "{{ product_amount | default(1) | float }}"
            _ca_note: "{{ note | default(none, true) }}"
        - action: script.zen_sutra_grocy
          response_variable: _ca_raw
          data:
            action_type: create
            endpoint: /objects/chores
            payload: >-
              {%- set p = {
                  'name': _ca_name,
                  'period_type': _ca_period_type,
                  'period_days': _ca_period_days,
                  'active': 1
                } -%}
              {%- if _ca_product_id is not none -%}
                {%- set p = p | combine({'product_id': _ca_product_id | int,
                                         'product_amount': _ca_product_amount,
                                         'consume_product_on_execution': 1}) -%}
              {%- endif -%}
              {%- if _ca_note is not none -%}
                {%- set p = p | combine({'description': _ca_note}) -%}
              {%- endif -%}
              {{ p | tojson }}
        - variables:
            _ca_created_id: >-
              {%- set _c = _ca_raw.get('result', {}).get('content', '') -%}
              {%- set _c = _c | from_json if _c is string and _c | trim not in ['', 'none', 'null'] else _c -%}
              {{ (_c.get('created_object_id', _c.get('id', none)) | int(none))
                 if _c is mapping else none }}
        - variables:
            final_response:
              status: success
              mode: chores_add
              chore_id: "{{ _ca_created_id }}"
              name: "{{ _ca_name }}"
              product_id: "{{ _ca_product_id }}"
              product_amount: "{{ _ca_product_amount }}"
              period_type: "{{ _ca_period_type }}"
              period_days: "{{ _ca_period_days }}"
              tool: "{{ tool_name }}"
              version: "{{ tool_version }}"
        - stop: Chore Created
          response_variable: final_response
    - alias: 'chores_tag — set homeassistant_area and/or entity_id userfields on a chore'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'chores_tag' }}"
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ chore_id_resolved is none }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: chores_tag
                  message: Chore not found — pass item=<name> or chore_id=<id>
            - stop: Chore Not Found
              response_variable: final_response
        - variables:
            _ct_area: "{{ homeassistant_area_id | default(none, true) }}"
            _ct_entity: "{{ homeassistant_entity_id | default(none, true) }}"
        - variables:
            _ct_payload: >-
              {%- set p = {} -%}
              {%- if _ct_area is not none -%}{%- set p = p | combine({'homeassistant_area': _ct_area}) -%}{%- endif -%}
              {%- if _ct_entity is not none -%}{%- set p = p | combine({'homeassistant_entity_id': _ct_entity}) -%}{%- endif -%}
              {{ p | tojson }}
        - action: script.zen_sutra_grocy
          response_variable: _ct_raw
          data:
            action_type: update
            endpoint: /userfields/chores/{{ chore_id_resolved }}
            payload: "{{ _ct_payload }}"
        - variables:
            final_response:
              status: "{{ 'success' if _ct_raw.get('result', {}).get('content', none) is not none else 'ok' }}"
              mode: chores_tag
              chore_id: "{{ chore_id_resolved }}"
              homeassistant_area: "{{ _ct_area }}"
              homeassistant_entity_id: "{{ _ct_entity }}"
              tool: "{{ tool_name }}"
              version: "{{ tool_version }}"
        - stop: Chore Tagged
          response_variable: final_response
    - alias: 'products_tag — set ZenOS userfields on a product'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'products_tag' }}"
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ product_id_resolved is none }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: products_tag
                  message: Product not found — pass item=<name> or product_id=<id>
            - stop: Product Not Found
              response_variable: final_response
        - variables:
            _pt_area: "{{ homeassistant_area_id | default(none, true) }}"
            _pt_hazmat: "{{ hazmat_class | default(none, true) }}"
            _pt_safety: "{{ safety_type | default(none, true) }}"
            _pt_asset: "{{ asset_type | default(none, true) }}"
            _pt_labels: "{{ ha_labels | default(none, true) }}"
            _pt_author: "{{ book_author | default(none, true) }}"
            _pt_isbn: "{{ book_isbn | default(none, true) }}"
            _pt_series: "{{ book_series | default(none, true) }}"
            _pt_genre: "{{ book_genre | default(none, true) }}"
            _pt_loan_borrower: "{{ book_loan_borrower | default(none) }}"
            _pt_loan_date: "{{ book_loan_date | default(none) }}"
            _pt_loan_due: "{{ book_loan_due | default(none) }}"
            _pt_loan_home_loc: "{{ book_loan_home_location_id | default(none) }}"
            _pt_lib_loan_borrower: "{{ library_loan_borrower | default(none, true) }}"
            _pt_lib_loan_date: "{{ library_loan_date | default(none, true) }}"
            _pt_lib_loan_due: "{{ library_loan_due | default(none, true) }}"
            _pt_lib_loan_home_loc: "{{ library_loan_home_location_id | default(none, true) }}"
        - variables:
            _pt_lib_meta: >-
              {%- set _v = library_meta | default(none, true) -%}
              {%- if _v is none or _v == 'None' or (_v is string and _v | trim == '') -%}{{ none }}
              {%- elif _v is mapping -%}{{ _v | tojson }}
              {%- else -%}{{ _v | string | trim }}
              {%- endif -%}
        - variables:
            _pt_payload: >-
              {%- set p = {} -%}
              {%- if _pt_area is not none -%}{%- set p = p | combine({'homeassistant_area': _pt_area}) -%}{%- endif -%}
              {%- if _pt_hazmat is not none -%}{%- set p = p | combine({'hazmat_class': _pt_hazmat}) -%}{%- endif -%}
              {%- if _pt_safety is not none -%}{%- set p = p | combine({'zen_safety_type': _pt_safety}) -%}{%- endif -%}
              {%- if _pt_asset is not none -%}{%- set p = p | combine({'zen_asset_type': _pt_asset}) -%}{%- endif -%}
              {%- if _pt_labels is not none -%}{%- set p = p | combine({'ha_labels': _pt_labels}) -%}{%- endif -%}
              {%- if _pt_author is not none -%}{%- set p = p | combine({'book_author': _pt_author}) -%}{%- endif -%}
              {%- if _pt_isbn is not none -%}{%- set p = p | combine({'book_isbn': _pt_isbn}) -%}{%- endif -%}
              {%- if _pt_series is not none -%}{%- set p = p | combine({'book_series': _pt_series}) -%}{%- endif -%}
              {%- if _pt_genre is not none -%}{%- set p = p | combine({'book_genre': _pt_genre}) -%}{%- endif -%}
              {%- if _pt_loan_borrower is not none -%}{%- set p = p | combine({'book_loan_borrower': _pt_loan_borrower}) -%}{%- endif -%}
              {%- if _pt_loan_date is not none -%}{%- set p = p | combine({'book_loan_date': _pt_loan_date}) -%}{%- endif -%}
              {%- if _pt_loan_due is not none -%}{%- set p = p | combine({'book_loan_due': _pt_loan_due}) -%}{%- endif -%}
              {%- if _pt_loan_home_loc is not none -%}{%- set p = p | combine({'book_loan_home_location_id': _pt_loan_home_loc}) -%}{%- endif -%}
              {%- if _pt_lib_meta is not none -%}{%- set p = p | combine({'library_meta': _pt_lib_meta}) -%}{%- endif -%}
              {%- if _pt_lib_loan_borrower is not none -%}{%- set p = p | combine({'library_loan_borrower': _pt_lib_loan_borrower}) -%}{%- endif -%}
              {%- if _pt_lib_loan_date is not none -%}{%- set p = p | combine({'library_loan_date': _pt_lib_loan_date}) -%}{%- endif -%}
              {%- if _pt_lib_loan_due is not none -%}{%- set p = p | combine({'library_loan_due': _pt_lib_loan_due}) -%}{%- endif -%}
              {%- if _pt_lib_loan_home_loc is not none -%}{%- set p = p | combine({'library_loan_home_location_id': _pt_lib_loan_home_loc}) -%}{%- endif -%}
              {{ p | tojson }}
        - action: script.zen_sutra_grocy
          response_variable: _pt_raw
          data:
            action_type: update
            endpoint: "/userfields/products/{{ product_id_resolved }}"
            payload: "{{ _pt_payload }}"
        - action: script.zen_sutra_grocy
          response_variable: _pt_prod_raw
          continue_on_error: true
          data:
            action_type: read
            endpoint: "/objects/products/{{ product_id_resolved }}"
        - variables:
            _pt_prod_obj: >-
              {%- set _c = _pt_prod_raw.get('result', {}).get('content', {}) -%}
              {{ _c if _c is mapping else {} }}
        - if: "{{ _pt_prod_obj | length > 0 }}"
          then:
            - variables:
                _pt_uf_base: >-
                  {{ _pt_prod_obj.get('userfields', {}) if _pt_prod_obj.get('userfields') is mapping else {} }}
            - variables:
                _pt_uf_merged: >-
                  {%- set ns = namespace(u=_pt_uf_base) -%}
                  {%- if _pt_area is not none -%}{%- set ns.u = ns.u | combine({'homeassistant_area': _pt_area}) -%}{%- endif -%}
                  {%- if _pt_hazmat is not none -%}{%- set ns.u = ns.u | combine({'hazmat_class': _pt_hazmat}) -%}{%- endif -%}
                  {%- if _pt_safety is not none -%}{%- set ns.u = ns.u | combine({'zen_safety_type': _pt_safety}) -%}{%- endif -%}
                  {%- if _pt_asset is not none -%}{%- set ns.u = ns.u | combine({'zen_asset_type': _pt_asset}) -%}{%- endif -%}
                  {%- if _pt_labels is not none -%}{%- set ns.u = ns.u | combine({'ha_labels': _pt_labels}) -%}{%- endif -%}
                  {%- if _pt_author is not none -%}{%- set ns.u = ns.u | combine({'book_author': _pt_author}) -%}{%- endif -%}
                  {%- if _pt_isbn is not none -%}{%- set ns.u = ns.u | combine({'book_isbn': _pt_isbn}) -%}{%- endif -%}
                  {%- if _pt_series is not none -%}{%- set ns.u = ns.u | combine({'book_series': _pt_series}) -%}{%- endif -%}
                  {%- if _pt_genre is not none -%}{%- set ns.u = ns.u | combine({'book_genre': _pt_genre}) -%}{%- endif -%}
                  {%- if _pt_loan_borrower is not none -%}{%- set ns.u = ns.u | combine({'book_loan_borrower': _pt_loan_borrower}) -%}{%- endif -%}
                  {%- if _pt_loan_date is not none -%}{%- set ns.u = ns.u | combine({'book_loan_date': _pt_loan_date}) -%}{%- endif -%}
                  {%- if _pt_loan_due is not none -%}{%- set ns.u = ns.u | combine({'book_loan_due': _pt_loan_due}) -%}{%- endif -%}
                  {%- if _pt_loan_home_loc is not none -%}{%- set ns.u = ns.u | combine({'book_loan_home_location_id': _pt_loan_home_loc}) -%}{%- endif -%}
                  {%- if _pt_lib_meta is not none -%}{%- set ns.u = ns.u | combine({'library_meta': _pt_lib_meta}) -%}{%- endif -%}
                  {%- if _pt_lib_loan_borrower is not none -%}{%- set ns.u = ns.u | combine({'library_loan_borrower': _pt_lib_loan_borrower}) -%}{%- endif -%}
                  {%- if _pt_lib_loan_date is not none -%}{%- set ns.u = ns.u | combine({'library_loan_date': _pt_lib_loan_date}) -%}{%- endif -%}
                  {%- if _pt_lib_loan_due is not none -%}{%- set ns.u = ns.u | combine({'library_loan_due': _pt_lib_loan_due}) -%}{%- endif -%}
                  {%- if _pt_lib_loan_home_loc is not none -%}{%- set ns.u = ns.u | combine({'library_loan_home_location_id': _pt_lib_loan_home_loc}) -%}{%- endif -%}
                  {{ ns.u }}
            - variables:
                _pt_prod_patch: >-
                  {%- set ns = namespace(p={}) -%}
                  {%- for k, v in _pt_prod_obj.items() -%}
                    {%- if k not in ['userfields', 'row_created_timestamp'] -%}
                      {%- if not (k in ['qu_id_purchase', 'qu_id_price'] and v is none) -%}
                        {%- set ns.p = ns.p | combine({k: v}) -%}
                      {%- endif -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {%- set ns.p = ns.p | combine({'userfields': _pt_uf_merged}) -%}
                  {{ ns.p | tojson }}
            - action: script.zen_sutra_grocy
              response_variable: _pt_embed_raw
              continue_on_error: true
              data:
                action_type: update
                endpoint: "/objects/products/{{ product_id_resolved }}"
                payload: "{{ _pt_prod_patch }}"
        - variables:
            final_response:
              status: ok
              mode: products_tag
              product_id: "{{ product_id_resolved }}"
              tagged:
                homeassistant_area: "{{ _pt_area }}"
                hazmat_class: "{{ _pt_hazmat }}"
                zen_safety_type: "{{ _pt_safety }}"
                zen_asset_type: "{{ _pt_asset }}"
                ha_labels: "{{ _pt_labels }}"
                book_author: "{{ _pt_author }}"
                book_isbn: "{{ _pt_isbn }}"
                book_series: "{{ _pt_series }}"
                book_genre: "{{ _pt_genre }}"
              ha_labels_warning: "{{ 'ha_labels not set in this call — product remains invisible to zen_dojotools_plant mode=managed. Call products_tag again with ha_labels=<root_label> to register.' if _pt_labels is none else none }}"
              tool: "{{ tool_name }}"
              version: "{{ tool_version }}"
        - stop: Product Tagged
          response_variable: final_response
    # ── Lens bus: by_anchor — player_hint emission ───────────────────────────
    # Supports anchor_type=area_id only. Finds products with media_role set at
    # locations whose homeassistant_area matches the anchor. Emits player_hint
    # evidence items — "here is something TO PLAY ON in this room."
    - alias: 'by_anchor — lens player_hint for physical media equipment'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'by_anchor' }}"
        sequence:
        - variables:
            _ba_type: "{{ anchor_type | default('', true) | string | trim | lower }}"
            _ba_ids_raw: >-
              {%- set raw = anchor_ids | default('', true) -%}
              {%- if raw is sequence and raw is not string -%}{{ raw | list }}
              {%- elif raw is string and raw | trim != '' -%}{{ raw | trim | from_json(none) or [] }}
              {%- else -%}{{ [] }}{%- endif -%}
        - variables:
            _ba_ids: "{{ _ba_ids_raw if _ba_ids_raw is sequence and _ba_ids_raw is not string else [] }}"
        - if: "{{ _ba_type != 'area_id' or _ba_ids | length == 0 }}"
          then:
          - variables:
              final_response:
                status: ok
                evidence: []
                count: 0
                anchor_type: "{{ _ba_type }}"
                message: "Inventory lens supports anchor_type: area_id (physical media equipment in room)."
          - stop: by_anchor unsupported anchor
            response_variable: final_response
        # Fetch all locations — build area_id → location_id set
        - action: script.zen_dojotools_inventory
          response_variable: _iba_locs_raw
          continue_on_error: true
          data:
            mode: locations_list
            per_page: 200
        - variables:
            _iba_locs: >-
              {%- set r = _iba_locs_raw.get('result', []) if _iba_locs_raw is mapping else [] -%}
              {{ r if r is sequence and r is not string else [] }}
            _iba_area_loc_ids: >-
              {%- set ba_ids_lower = _ba_ids | map('lower') | list -%}
              {%- set ns = namespace(ids=[]) -%}
              {%- set locs = _iba_locs_raw.get('result', []) if _iba_locs_raw is mapping else [] -%}
              {%- for loc in locs if loc is mapping -%}
                {%- set loc_area = loc.get('userfields', {}).get('homeassistant_area', '') | string | lower | trim -%}
                {%- if loc_area != '' and loc_area in ba_ids_lower -%}
                  {%- set ns.ids = ns.ids + [loc.get('id') | int(-1)] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.ids }}
            _iba_loc_name_map: >-
              {%- set ns = namespace(d={}) -%}
              {%- set locs = _iba_locs_raw.get('result', []) if _iba_locs_raw is mapping else [] -%}
              {%- for loc in locs if loc is mapping -%}
                {%- set ns.d = ns.d | combine({loc.get('id') | string: loc.get('name', '')}) -%}
              {%- endfor -%}
              {{ ns.d }}
        # Fetch all products — filter for media_role in-memory
        - variables:
            _iba_offset: 0
            _iba_all_players: []
            _iba_page_done: false
        - repeat:
            until: "{{ _iba_page_done or _iba_offset >= 100000 }}"
            sequence:
              - action: script.zen_sutra_grocy
                response_variable: _iba_page_raw
                continue_on_error: true
                data:
                  action_type: read
                  endpoint: "/objects/products?limit=500&offset={{ _iba_offset }}"
              - variables:
                  _iba_page_size: >-
                    {{ _iba_page_raw['result']['content'] | length
                       if _iba_page_raw is mapping and 'result' in _iba_page_raw
                          and _iba_page_raw['result']['content'] is sequence
                       else 0 }}
                  _iba_page_players: >-
                    {%- set _raw = _iba_page_raw['result']['content']
                        if _iba_page_raw is mapping and 'result' in _iba_page_raw
                           and _iba_page_raw['result']['content'] is sequence
                        else [] -%}
                    {%- set ns = namespace(r=[]) -%}
                    {%- for p in _raw if p is mapping -%}
                      {%- set uf = p.get('userfields', {}) if p.get('userfields') is mapping else {} -%}
                      {%- set mrole = (uf.get('media_role', '') or '') | string | trim -%}
                      {%- if mrole != '' -%}
                        {%- set lid = p.get('location_id') | int(-1) -%}
                        {%- if lid >= 0 and lid in _iba_area_loc_ids -%}
                          {%- set mfmts_raw = (uf.get('media_formats', '') or '') | string | trim -%}
                          {%- set mfmts = mfmts_raw.split(',') | map('trim') | reject('equalto', '') | list if mfmts_raw != '' else [] -%}
                          {%- set mtypes = ['music_recording'] if mrole in ['turntable','cassette_deck','cd_player','radio'] else (['video'] if mrole in ['dvd_player','blu_ray_player','projector'] else (['book'] if mrole == 'e_reader' else (['game','video','music_recording'] if mrole == 'game_console' else (['book','periodical'] if mrole == 'reading_nook' else ['music_recording','video','book','game'])))) -%}
                          {%- set loc_name = (_iba_loc_name_map if _iba_loc_name_map is mapping else {}).get(lid | string, '') -%}
                          {%- set ns.r = ns.r + [{'product_id': p.get('id') | int, 'product_name': p.get('name', ''), 'media_role': mrole, 'media_formats': mfmts, 'media_types': mtypes, 'location_id': lid, 'location_name': loc_name, 'entity_id': (uf.get('homeassistant_entity_id', '') or '') | string | trim}] -%}
                        {%- endif -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {{ ns.r }}
              - variables:
                  _iba_all_players: >-
                    {{ (_iba_all_players | list) + (_iba_page_players if _iba_page_players is sequence else []) }}
                  _iba_page_done: "{{ (_iba_page_size | int(0)) < 500 }}"
                  _iba_offset: "{{ (_iba_offset | int) + 500 }}"
        # Build anchor_contexts + evidence items
        - variables:
            _iba_anchor_contexts: >-
              {%- set ns = namespace(ctx=[]) -%}
              {%- for aid in _ba_ids -%}
                {%- set ns.ctx = ns.ctx + [{'type': _ba_type, 'id': aid | string | trim, 'confidence': 'explicit', 'provider': 'inventory'}] -%}
              {%- endfor -%}
              {{ ns.ctx }}
            _iba_room: "{{ _ba_ids | first | string if _ba_ids | length > 0 else '' }}"
        - variables:
            _iba_evidence: >-
              {%- set ns = namespace(ev=[]) -%}
              {%- for p in _iba_all_players if p is mapping -%}
                {%- set eid = 'grocy:product:' ~ (p.get('product_id') | string) -%}
                {%- set hint = {'player_type': p.get('media_role'), 'media_formats': p.get('media_formats', []), 'media_types': p.get('media_types', []), 'dumb': p.get('entity_id', '') == '', 'entity_id': p.get('entity_id') or none, 'area': _iba_room, 'location_name': p.get('location_name', ''), 'product_name': p.get('product_name', '')} -%}
                {%- set ns.ev = ns.ev + [{'evidence_id': eid, 'leaf_type': 'player_hint', 'content_redacted': false, 'anchor_contexts': _iba_anchor_contexts, 'stack': {'provider': 'inventory', 'object_type': 'product', 'evidence_id': eid, 'lens_mode': 'by_anchor'}, 'player_hint': hint, 'content': {'product_id': p.get('product_id') | int, 'product_name': p.get('product_name', ''), 'media_role': p.get('media_role'), 'media_formats': p.get('media_formats', []), 'media_types': p.get('media_types', []), 'location_id': p.get('location_id') | int, 'location_name': p.get('location_name', ''), 'area': _iba_room}}] -%}
              {%- endfor -%}
              {{ ns.ev }}
        - variables:
            final_response:
              status: ok
              evidence: "{{ _iba_evidence }}"
              count: "{{ _iba_evidence | length }}"
              anchor_type: "{{ _ba_type }}"
        - stop: by_anchor done
          response_variable: final_response

    - alias: 'catalog_find_by_tag — find products by ZenOS userfield tags'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'catalog_find_by_tag' }}"
        sequence:
        - variables:
            _cft_sf: "{{ (safety_type | default('')) | trim }}"
            _cft_af: "{{ (asset_type  | default('')) | trim }}"
            _cft_hf: "{{ (homeassistant_area_id | default('')) | trim }}"
            _cft_lf: "{{ (ha_labels | default('')) | trim }}"
            _cft_ai: "{{ (area_id | trim) if area_id is string else '' }}"
            _cft_so: "{{ safety_only | default(false) | bool }}"
            _cft_offset: 0
            _cft_all_src: []
            _cft_page_done: false
        - repeat:
            until: "{{ _cft_page_done or _cft_offset >= 100000 }}"
            sequence:
              - action: script.zen_sutra_grocy
                response_variable: _cft_page_raw
                continue_on_error: true
                data:
                  action_type: read
                  endpoint: "/objects/products?limit=500&offset={{ _cft_offset }}"
              - variables:
                  # Filter-in-memory: iterate Python response_variable directly, render matches only.
                  # Never renders the full product list — safe for 100k+ products.
                  _cft_page_size: >-
                    {{ _cft_page_raw['result']['content'] | length
                       if _cft_page_raw is mapping and 'result' in _cft_page_raw
                          and _cft_page_raw['result']['content'] is sequence
                       else 0 }}
                  _cft_page_matches: >-
                    {%- set _raw = _cft_page_raw['result']['content']
                        if _cft_page_raw is mapping and 'result' in _cft_page_raw
                           and _cft_page_raw['result']['content'] is sequence
                        else [] -%}
                    {%- set ns = namespace(r=[]) -%}
                    {%- for p in _raw if p is mapping -%}
                      {%- set uf = p.get('userfields', {}) if p.get('userfields') is mapping else {} -%}
                      {%- set _st = uf.get('zen_safety_type', none) -%}
                      {%- set _at = uf.get('zen_asset_type', none) -%}
                      {%- set _hl = (uf.get('ha_labels', '') | default('', true)) | string | trim -%}
                      {%- set _ntags = (p.get('tags', '') | default('', true)) | string | trim -%}
                      {%- if _st is not none or _at is not none or _hl != '' or _ntags != '' -%}
                        {%- set _ha = uf.get('homeassistant_area', none) -%}
                        {%- set _hz = uf.get('hazmat_class', none) -%}
                        {%- set _all_tags = (_hl.split(',') + _ntags.split(',')) | map('trim') | reject('equalto', '') | list -%}
                        {%- set _pass_so = (not _cft_so) or (_st is not none or _hz is not none) -%}
                        {%- set _s = _cft_sf == '' or _st == _cft_sf -%}
                        {%- set _a = _cft_af == '' or _at == _cft_af -%}
                        {%- set _h = _cft_hf == '' or _ha == _cft_hf -%}
                        {%- set ns_lf = namespace(match=false) -%}
                        {%- for _lf in _cft_lf.split(',') | map('trim') | list -%}
                          {%- if _lf != '' and _lf in _all_tags -%}{%- set ns_lf.match = true -%}{%- endif -%}
                        {%- endfor -%}
                        {%- set _l = _cft_lf == '' or ns_lf.match -%}
                        {%- set _ai = _cft_ai == '' or _ha == _cft_ai or _cft_ai in _all_tags -%}
                        {%- if _pass_so and _s and _a and _h and _l and _ai -%}
                          {%- set ns.r = ns.r + [{'id': p.id, 'name': p.name,
                            'zen_safety_type': _st, 'zen_asset_type': _at,
                            'hazmat_class': _hz, 'homeassistant_area': _ha,
                            'ha_labels': _hl, 'native_tags': _ntags,
                            'location_id': p.get('location_id'),
                            'book_author': uf.get('book_author', none),
                            'book_isbn': uf.get('book_isbn', none),
                            'book_series': uf.get('book_series', none),
                            'book_genre': uf.get('book_genre', none),
                            'library_meta': uf.get('library_meta', none),
                            'library_loan_borrower': uf.get('library_loan_borrower', none),
                            'library_loan_date': uf.get('library_loan_date', none),
                            'library_loan_due': uf.get('library_loan_due', none),
                            'library_loan_home_location_id': uf.get('library_loan_home_location_id', none)}] -%}
                        {%- endif -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {{ ns.r }}
              - variables:
                  _cft_all_src: >-
                    {%- set _prev = _cft_all_src if _cft_all_src is sequence and _cft_all_src is not string else [] -%}
                    {%- set _cur = _cft_page_matches if _cft_page_matches is sequence else [] -%}
                    {{ (_prev | list) + (_cur | list) }}
                  _cft_page_done: "{{ (_cft_page_size | int(0)) < 500 }}"
                  _cft_offset: "{{ (_cft_offset | int) + 500 }}"
        - variables:
            _cft_results: >-
              {{ _cft_all_src if _cft_all_src is sequence else [] }}
        - variables:
            final_response:
              status: ok
              mode: catalog_find_by_tag
              filters:
                safety_type: "{{ _cft_sf | default(none, true) }}"
                asset_type: "{{ _cft_af | default(none, true) }}"
                homeassistant_area_id: "{{ _cft_hf | default(none, true) }}"
                ha_labels: "{{ _cft_lf | default(none, true) }}"
              count: "{{ _cft_results | length }}"
              products: "{{ _cft_results }}"
              tool: "{{ tool_name }}"
              version: "{{ tool_version }}"
        - stop: catalog_find_by_tag done
          response_variable: final_response
    - alias: 'catalog_search — unified name + tag search'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'catalog_search' }}"
        sequence:
        - variables:
            _cs_q: "{{ (item | default('') | string | trim | lower) }}"
            _cs_offset: 0
            _cs_all: []
            _cs_page_done: false
        - if:
          - condition: template
            value_template: "{{ _cs_q == '' }}"
          then:
          - variables:
              final_response:
                status: error
                mode: catalog_search
                message: item (search query) is required for catalog_search
                tool: "{{ tool_name }}"
                version: "{{ tool_version }}"
          - stop: catalog_search error
            response_variable: final_response
        - repeat:
            until: "{{ _cs_page_done or _cs_offset >= 100000 }}"
            sequence:
            - action: script.zen_sutra_grocy
              response_variable: _cs_raw
              continue_on_error: true
              data:
                action_type: read
                endpoint: "/objects/products?limit=500&offset={{ _cs_offset }}"
            - variables:
                _cs_page_size: >-
                  {{ _cs_raw['result']['content'] | length
                     if _cs_raw is mapping and 'result' in _cs_raw
                        and _cs_raw['result']['content'] is sequence
                     else 0 }}
                _cs_page_matches: >-
                  {%- set _pg = _cs_raw['result']['content']
                                if _cs_raw is mapping and 'result' in _cs_raw
                                   and _cs_raw['result']['content'] is sequence
                                else [] -%}
                  {%- set ns = namespace(r=[]) -%}
                  {%- for p in _pg if p is mapping -%}
                    {%- set _name_match = _cs_q in (p.name | default('', true) | string | lower) -%}
                    {%- set uf = p.get('userfields', {}) if p.get('userfields') is mapping else {} -%}
                    {%- set _hl = (uf.get('ha_labels', '') | default('', true)) | string | trim -%}
                    {%- set _ntags = (p.get('tags', '') | default('', true)) | string | trim -%}
                    {%- set _author = (uf.get('book_author', '') | default('', true)) | string | trim | lower -%}
                    {%- set _all_tags = (_hl.split(',') + _ntags.split(',')) | map('trim') | map('lower') | reject('equalto', '') | list -%}
                    {%- set ns_tm = namespace(match=false) -%}
                    {%- for t in _all_tags if _cs_q in t -%}{%- set ns_tm.match = true -%}{%- endfor -%}
                    {%- set _tag_match = ns_tm.match -%}
                    {%- set _author_match = _author != '' and _cs_q in _author -%}
                    {%- if _name_match or _tag_match or _author_match -%}
                      {%- set _src = 'name' if _name_match else ('author' if _author_match else 'tag') -%}
                      {%- set ns.r = ns.r + [{'id': p.id, 'name': p.name,
                        'match_source': _src,
                        'ha_labels': _hl, 'native_tags': _ntags,
                        'location_id': p.get('location_id'),
                        'book_author': uf.get('book_author', none),
                        'book_isbn': uf.get('book_isbn', none),
                        'book_series': uf.get('book_series', none),
                        'book_genre': uf.get('book_genre', none),
                        'library_meta': uf.get('library_meta', none),
                        'library_loan_borrower': uf.get('library_loan_borrower', none),
                        'library_loan_date': uf.get('library_loan_date', none),
                        'library_loan_due': uf.get('library_loan_due', none),
                        'library_loan_home_location_id': uf.get('library_loan_home_location_id', none)}] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ ns.r }}
            - variables:
                _cs_all: >-
                  {%- set _prev = _cs_all if _cs_all is sequence and _cs_all is not string else [] -%}
                  {%- set _cur = _cs_page_matches if _cs_page_matches is sequence else [] -%}
                  {{ (_prev | list) + (_cur | list) }}
                _cs_page_done: "{{ (_cs_page_size | int(0)) < 500 }}"
                _cs_offset: "{{ (_cs_offset | int) + 500 }}"
        - variables:
            final_response:
              status: ok
              mode: catalog_search
              query: "{{ _cs_q }}"
              count: "{{ _cs_all | length }}"
              products: "{{ _cs_all }}"
              tool: "{{ tool_name }}"
              version: "{{ tool_version }}"
        - stop: catalog_search done
          response_variable: final_response
    - alias: 'bulk_stock_add: add stock for a BOM list of products'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'bulk_stock_add' }}"
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ not confirm_action_in }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: bulk_stock_add
                  message: confirm_action=true is required for bulk_stock_add.
            - stop: Confirm Required
              response_variable: final_response
        - variables:
            _bsa_raw: >-
              {{ bom_in | from_json
                 if bom_in is string and bom_in | trim not in ['', 'none', 'null']
                 else bom_in | default([], true) }}
        - variables:
            _bsa_items: >-
              {%- if _bsa_raw is sequence and _bsa_raw is not mapping -%}
                {{ _bsa_raw | list }}
              {%- else -%}[]
              {%- endif -%}
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _bsa_items | length == 0 }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: bulk_stock_add
                  message: "bom required - JSON array of {name: X} or {product_id: N} objects."
            - stop: No Items
              response_variable: final_response
        - variables:
            _bsa_default_amount: "{{ amount | default(1, true) | float(1) }}"
            _bsa_lid: "{{ location_id_resolved | int(0) }}"
            _bsa_price: "{{ price | default(none, true) }}"
            _bsa_bbd: "{{ best_before_date | default(none, true) }}"
            _bsa_results: []
            _bsa_added: 0
            _bsa_failed: 0
        - repeat:
            for_each: "{{ _bsa_items }}"
            sequence:
              - variables:
                  _bsai_name: "{{ repeat.item.get('name', '') | string | trim }}"
                  _bsai_pid: "{{ repeat.item.get('product_id', repeat.item.get('id', 0)) | int(0) }}"
                  _bsai_amount: "{{ repeat.item.get('amount', _bsa_default_amount) | float(_bsa_default_amount) }}"
              - if: "{{ _bsai_pid | int(0) == 0 and _bsai_name != '' }}"
                then:
                  - action: script.zen_sutra_grocy
                    response_variable: _bsai_exact_raw
                    data:
                      action_type: read
                      endpoint: "objects/products?query%5B%5D=name={{ _bsai_name }}"
                  - variables:
                      _bsai_pid: >-
                        {%- set _raw = _bsai_exact_raw['result']['content'] | default(none, true) -%}
                        {%- set _dl = _raw if _raw is sequence and _raw is not string else [] -%}
                        {%- set _norm = _bsai_name | lower -%}
                        {%- set ns = namespace(found=0) -%}
                        {%- for p in _dl if p is mapping -%}
                          {%- if p['name'] | default('', true) | lower == _norm -%}
                            {%- set ns.found = p['id'] | default(0) | int(0) -%}
                          {%- endif -%}
                        {%- endfor -%}
                        {{ ns.found }}
              - if: "{{ _bsai_pid | int(0) == 0 and _bsai_name != '' }}"
                then:
                  - action: script.zen_sutra_grocy
                    response_variable: _bsai_fuzzy_raw
                    data:
                      action_type: read
                      endpoint: "objects/products?query%5B%5D=name~{{ _bsai_name }}"
                  - variables:
                      _bsai_pid: >-
                        {%- set _raw = _bsai_fuzzy_raw['result']['content'] | default(none, true) -%}
                        {%- set _dl = _raw if _raw is sequence and _raw is not string else [] -%}
                        {%- set _norm = _bsai_name | lower -%}
                        {%- set ns = namespace(found=0) -%}
                        {%- for p in _dl if p is mapping -%}
                          {%- if p['name'] | default('', true) | lower == _norm -%}
                            {%- set ns.found = p['id'] | default(0) | int(0) -%}
                          {%- endif -%}
                        {%- endfor -%}
                        {{ ns.found }}
              - if: "{{ _bsai_pid | int(0) > 0 }}"
                then:
                  - variables:
                      _bsai_payload: >-
                        {%- set p = {'amount': _bsai_amount} -%}
                        {%- if _bsa_lid > 0 -%}{%- set p = p | combine({'location_id': _bsa_lid}) -%}{%- endif -%}
                        {%- if _bsa_price is not none and _bsa_price | string | trim not in ['', 'none', 'null'] -%}
                          {%- set p = p | combine({'price': _bsa_price | float}) -%}
                        {%- endif -%}
                        {%- if _bsa_bbd is not none and _bsa_bbd | string | trim not in ['', 'none', 'null'] -%}
                          {%- set p = p | combine({'best_before_date': _bsa_bbd | string}) -%}
                        {%- endif -%}
                        {{ p | tojson }}
                  - action: script.zen_sutra_grocy
                    response_variable: _bsai_add_raw
                    continue_on_error: true
                    data:
                      action_type: create
                      endpoint: "/stock/products/{{ _bsai_pid | int }}/add"
                      payload: "{{ _bsai_payload }}"
                  - variables:
                      _bsai_ok: >-
                        {%- set _r = _bsai_add_raw['result'] | default({}, true) -%}
                        {{ _r['status_code'] | default(200) | int < 300 }}
                  - variables:
                      _bsa_results: >-
                        {{ (_bsa_results if _bsa_results is sequence else [])
                           + [{'name': _bsai_name, 'product_id': _bsai_pid | int,
                               'amount': _bsai_amount,
                               'status': 'added' if _bsai_ok else 'failed',
                               'reason': '' if _bsai_ok else 'grocy api error'}] }}
                      _bsa_added: "{{ _bsa_added | int + 1 if _bsai_ok else _bsa_added | int }}"
              - if: "{{ _bsai_pid | int(0) == 0 }}"
                then:
                  - variables:
                      _bsa_results: >-
                        {{ (_bsa_results if _bsa_results is sequence else [])
                           + [{'name': _bsai_name, 'status': 'failed', 'reason': 'product not found'}] }}
                      _bsa_failed: "{{ _bsa_failed | int + 1 }}"
        - variables:
            final_response:
              status: success
              mode: bulk_stock_add
              summary:
                total: "{{ _bsa_items | length }}"
                added: "{{ _bsa_added | int }}"
                failed: "{{ _bsa_failed | int }}"
              items: "{{ _bsa_results }}"
        - stop: Bulk Stock Add Complete
          response_variable: final_response

    - alias: 'bulk_label_add: append label slugs to ha_labels on BOM list'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm in ['bulk_label_add', 'bulk_label_remove'] }}"
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ not confirm_action_in }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: "{{ mode_norm }}"
                  message: confirm_action=true is required.
            - stop: Confirm Required
              response_variable: final_response
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ (ha_labels | default('', true)) | trim == '' }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: "{{ mode_norm }}"
                  message: ha_labels required — comma-separated slugs to add or remove.
            - stop: No Labels
              response_variable: final_response
        - variables:
            _bl_raw: >-
              {{ bom_in | from_json
                 if bom_in is string and bom_in | trim not in ['', 'none', 'null']
                 else bom_in | default([], true) }}
        - variables:
            _bl_items: >-
              {%- if _bl_raw is sequence and _bl_raw is not mapping -%}
                {{ _bl_raw | list }}
              {%- else -%}[]
              {%- endif -%}
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _bl_items | length == 0 }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: "{{ mode_norm }}"
                  message: "bom required - JSON array of {name: X} or {product_id: N} objects."
            - stop: No Items
              response_variable: final_response
        - variables:
            _bl_target_slugs: >-
              {{ ((ha_labels | default('', true)) | string | trim | lower
                 | replace(' ', '')).split(',') | reject('equalto', '') | list }}
            _bl_results: []
            _bl_updated: 0
            _bl_skipped: 0
            _bl_failed: 0
        - repeat:
            for_each: "{{ _bl_items }}"
            sequence:
              - variables:
                  _bli_name: "{{ repeat.item.get('name', '') | string | trim }}"
                  _bli_pid: "{{ repeat.item.get('product_id', repeat.item.get('id', 0)) | int(0) }}"
              - if: "{{ _bli_pid | int(0) == 0 and _bli_name != '' }}"
                then:
                  - action: script.zen_sutra_grocy
                    response_variable: _bli_exact_raw
                    data:
                      action_type: read
                      endpoint: "objects/products?query%5B%5D=name={{ _bli_name }}"
                  - variables:
                      _bli_pid: >-
                        {%- set _raw = _bli_exact_raw['result']['content'] | default(none, true) -%}
                        {%- set _dl = _raw if _raw is sequence and _raw is not string else [] -%}
                        {%- set _norm = _bli_name | lower -%}
                        {%- set ns = namespace(found=0) -%}
                        {%- for p in _dl if p is mapping -%}
                          {%- if p['name'] | default('', true) | lower == _norm -%}
                            {%- set ns.found = p['id'] | default(0) | int(0) -%}
                          {%- endif -%}
                        {%- endfor -%}
                        {{ ns.found }}
              - if: "{{ _bli_pid | int(0) == 0 and _bli_name != '' }}"
                then:
                  - action: script.zen_sutra_grocy
                    response_variable: _bli_fuzzy_raw
                    data:
                      action_type: read
                      endpoint: "objects/products?query%5B%5D=name~{{ _bli_name }}"
                  - variables:
                      _bli_pid: >-
                        {%- set _raw = _bli_fuzzy_raw['result']['content'] | default(none, true) -%}
                        {%- set _dl = _raw if _raw is sequence and _raw is not string else [] -%}
                        {%- set _norm = _bli_name | lower -%}
                        {%- set ns = namespace(found=0) -%}
                        {%- for p in _dl if p is mapping -%}
                          {%- if p['name'] | default('', true) | lower == _norm -%}
                            {%- set ns.found = p['id'] | default(0) | int(0) -%}
                          {%- endif -%}
                        {%- endfor -%}
                        {{ ns.found }}
              - if: "{{ _bli_pid | int(0) > 0 }}"
                then:
                  # Fetch current userfields to read existing ha_labels
                  - action: script.zen_sutra_grocy
                    response_variable: _bli_uf_raw
                    continue_on_error: true
                    data:
                      action_type: read
                      endpoint: "/userfields/products/{{ _bli_pid | int }}"
                  - variables:
                      _bli_current_labels: >-
                        {%- set _c = _bli_uf_raw['result']['content'] | default(none, true) -%}
                        {%- set _c = _c if _c is mapping else {} -%}
                        {{ ((_c['ha_labels'] | default('', true)) | string | trim | lower
                           | replace(' ', '')).split(',') | reject('equalto', '') | list }}
                  - variables:
                      _bli_new_labels: >-
                        {%- if mode_norm == 'bulk_label_remove' -%}
                          {{ _bli_current_labels | reject('in', _bl_target_slugs) | list }}
                        {%- else -%}
                          {{ (_bli_current_labels + _bl_target_slugs) | unique | list }}
                        {%- endif -%}
                  - variables:
                      _bli_changed: "{{ _bli_new_labels | sort | join(',') != _bli_current_labels | sort | join(',') }}"
                  - if: "{{ _bli_changed }}"
                    then:
                      - action: script.zen_sutra_grocy
                        response_variable: _bli_write_raw
                        continue_on_error: true
                        data:
                          action_type: update
                          endpoint: "/userfields/products/{{ _bli_pid | int }}"
                          payload: "{{ {'ha_labels': _bli_new_labels | join(',')} | tojson }}"
                      - variables:
                          _bli_ok: >-
                            {%- set _r = _bli_write_raw['result'] | default({}, true) -%}
                            {{ _r['status_code'] | default(200) | int < 300 }}
                      - variables:
                          _bl_results: >-
                            {{ (_bl_results if _bl_results is sequence else [])
                               + [{'name': _bli_name, 'product_id': _bli_pid | int,
                                   'status': 'updated' if _bli_ok else 'failed',
                                   'labels_before': _bli_current_labels | join(','),
                                   'labels_after': _bli_new_labels | join(',') if _bli_ok else _bli_current_labels | join(',')}] }}
                          _bl_updated: "{{ _bl_updated | int + 1 if _bli_ok else _bl_updated | int }}"
                  - if: "{{ not _bli_changed }}"
                    then:
                      - variables:
                          _bl_results: >-
                            {{ (_bl_results if _bl_results is sequence else [])
                               + [{'name': _bli_name, 'product_id': _bli_pid | int,
                                   'status': 'skipped', 'reason': 'no change needed'}] }}
                          _bl_skipped: "{{ _bl_skipped | int + 1 }}"
              - if: "{{ _bli_pid | int(0) == 0 }}"
                then:
                  - variables:
                      _bl_results: >-
                        {{ (_bl_results if _bl_results is sequence else [])
                           + [{'name': _bli_name, 'status': 'failed', 'reason': 'product not found'}] }}
                      _bl_failed: "{{ _bl_failed | int + 1 }}"
        - variables:
            final_response:
              status: success
              mode: "{{ mode_norm }}"
              operation: "{{ 'remove' if mode_norm == 'bulk_label_remove' else 'add' }}"
              target_slugs: "{{ _bl_target_slugs }}"
              summary:
                total: "{{ _bl_items | length }}"
                updated: "{{ _bl_updated | int }}"
                skipped: "{{ _bl_skipped | int }}"
                failed: "{{ _bl_failed | int }}"
              items: "{{ _bl_results }}"
        - stop: Bulk Label Op Complete
          response_variable: final_response

