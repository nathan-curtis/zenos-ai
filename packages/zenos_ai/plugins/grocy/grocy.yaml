          \ {% elif grocy_product is not none %}\n    {{ [ grocy_product ] }}\n  {%
          else %}\n    []\n  {% endif %}\n{% elif mode_norm == 'chores_find' and has_item_name
          %}\n  {{ content | selectattr('name','search','(?i)' ~ item_norm) | list }}\n{%
          elif mode_norm == 'tasks_find' and has_item_name %}\n  {{ content | selectattr('name','search','(?i)'
          ~ item_norm) | list }}\n{% elif mode_norm == 'locations_find' %}\n  {% if location_id_resolved is not none %}\n    {{ content | selectattr('id','equalto', location_id_resolved | int) | list }}\n  {% elif has_loc_name and parent_lid_resolved is not none %}\n    {{ content | selectattr('name','search','(?i)' ~ loc_norm) | list | selectattr('userfields.grocy_parent_location_id','equalto', parent_lid_resolved | string) | list }}\n  {% elif has_loc_name %}\n    {{ content | selectattr('name','search','(?i)' ~ loc_norm) | list }}\n  {% elif has_item_name and parent_lid_resolved is not none %}\n    {{ content | selectattr('name','search','(?i)' ~ item_norm) | list | selectattr('userfields.grocy_parent_location_id','equalto', parent_lid_resolved | string) | list }}\n  {% elif has_item_name %}\n    {{ content | selectattr('name','search','(?i)' ~ item_norm) | list }}\n  {% elif parent_lid_resolved is not none %}\n    {{ content | selectattr('userfields.grocy_parent_location_id','equalto', parent_lid_resolved | string) | list }}\n  {% else %}\n    {{ [] }}\n  {% endif %}\n{% elif mode_norm == 'locations_get_by_area' %}\n  {{ content | selectattr('userfields.homeassistant_area','search','(?i)^' ~ area_id_norm ~ '$') | list }}\n{% elif mode_norm == 'units_find' and
          has_unit_name %}\n  {{ content | selectattr('name','equalto', unit_norm) |
          list }}
{% elif mode_norm == 'product_groups_find' and has_item_name %}\n  {{ content | selectattr('name','search','(?i)' ~ item_norm) | list }}
{% elif mode_norm == 'stock_list_volatile' %}
  {%- set _ov_raw = (content.overdue_products  | default([]))[:limit | int(25)] -%}
  {%- set _ds_raw = (content.due_dates          | default([]))[:limit | int(25)] -%}
  {%- set _ex_raw = (content.expiring_products  | default([]))[:limit | int(25)] -%}
  {%- set ns = namespace(ov=[], ds=[], ex=[]) -%}
