    - alias: "Guard: null qu_id_stock on stock add"
      choose:
      - conditions:
        - alias: Product has null stock unit
          condition: template
          value_template: |-
            {{ mode_norm in ['stock_buy_product', 'stock_add_purchase']
               and grocy_product is mapping
               and 'qu_id_stock' in grocy_product
               and grocy_product.get('qu_id_stock') is none }}
        sequence:
        - variables:
            final_response:
              status: error
              message: >-
                Product '{{ grocy_product.name | default(product_id_resolved | string) }}'
                (id={{ product_id_resolved }}) has null qu_id_stock.
                Set a unit before adding stock.
              product_id: '{{ product_id_resolved }}'
              coaching:
              - "No stock history: mode=update_product_meta product_id={{ product_id_resolved }} unit_id=<id>"
              - "Has stock history: delete and recreate with unit_id= at creation."
              - "Ensure 'each' or 'Piece' is active in Grocy quantity units."
        - stop: "Null unit guard — stock add blocked"
          response_variable: final_response
    # Tare-weight products: Grocy reads the amount of an add as the NEW TOTAL
    # weight (container + what is in it), and refuses one at or below tare +
    # current stock ("The amount cannot be lower or equal than the defined tare
    # weight + current stock amount."). So a purchase of N is sent as
    # tare_weight + current stock + N, which Grocy books as exactly N.
    - alias: "Tare-weight products: send a purchase as the new total weight"
      if:
      - condition: template
        value_template: >-
          {{ mode_norm in ['stock_buy_product', 'stock_add_purchase', 'stock_consume', 'stock_inventory_adjust']
             and product_id_resolved is not none
             and (product_id_resolved | string) not in ['', 'None'] }}
      then:
      - action: script.zen_sutra_grocy
        response_variable: _tare_probe
        continue_on_error: true
        data:
          action_type: read
          endpoint: "/stock/products/{{ product_id_resolved }}"
      - variables:
          _tare_c: >-
            {{ (_tare_probe['result']['content']
                if _tare_probe is mapping and _tare_probe.get('result') is mapping
                   and _tare_probe['result'].get('content') is mapping else {}) }}
          tare_on: >-
            {{ ((_tare_c.get('product', {}) or {}).get('enable_tare_weight_handling', 0) | int(0)) == 1 }}
          tare_w: >-
            {{ ((_tare_c.get('product', {}) or {}).get('tare_weight', 0) | float(0)) }}
          tare_new_total: >-
            {{ (((_tare_c.get('product', {}) or {}).get('tare_weight', 0) | float(0))
                + (_tare_c.get('stock_amount', 0) | float(0)) + amt_in) | round(4) }}
