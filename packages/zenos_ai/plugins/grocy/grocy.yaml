          \ {{\n    {\n      \"name\": new_name_norm\n    }\n  }}\n{% elif mode_norm == 'shopping_locations_rename' %}\n  {{\n    {\n      \"name\": new_name_norm\n    }\n  }}\n{% elif mode_norm == 'locations_update_description' %}\n  {{\n    {\n      \"description\": note_in\n    }\n  }}\n{% elif mode_norm
          in ['shopping_add_missing','shopping_add_overdue','shopping_add_expired']
          %}\n  {% if list_in is not none %}\n    {{ {\"list_id\": (list_in | int)}
          }}\n  {% else %}\n    {{ {} }}\n  {% endif %}  \n{% elif mode_norm == 'unit_conversions_add'
          %}\n  {%- set _to_qu = (to_unit_id_in | int(none)) if to_unit_id_in is not none else (to_location_id_resolved | int(none)) -%}\n  {%- set _quc = {\"from_qu_id\": unit_id_resolved | int, \"to_qu_id\": _to_qu | int, \"factor\": amt_in | float} -%}\n  {%- if product_id_resolved is not none -%}{%- set _quc = _quc | combine({\"product_id\": product_id_resolved | int}) -%}{%- endif -%}\n  {{ _quc }}\n{% elif mode_norm == 'units_add'
          %}\n  {{\n    {\n      \"name\": unit_norm,\n      \"name_plural\": unit_norm,\n
          \     \"description\": (note_in if has_note else none)\n    }\n  }}\n{% elif
          mode_norm == 'units_update' %}\n  {{\n    {\n      \"name\": (unit_norm if
          has_unit_name else none),\n      \"name_plural\": (unit_norm if has_unit_name else none),\n      \"description\": (note_in if has_note else
          none)\n    }\n  }}\n{% elif mode_norm in ['shopping_add_product','shopping_remove_product'] %}\n  {{\n    {\n      \"product_id\": product_id_resolved,\n      \"product_amount\": amt_in,\n      \"shopping_list_id\": (list_in | int if list_in is not none else none)\n    }\n  }}\n{% elif mode_norm == 'shopping_clear_list' %}\n  {{\n    {\n      \"done_only\": done_only_in,\n      \"shopping_list_id\": (list_in | int if list_in is not none else none)\n    }\n  }}\n{% elif mode_norm == 'recipes_add_to_shopping' %}\n  {{\n    {\n      \"shopping_list_id\": (list_in | int if list_in is not none else none)\n    }\n  }}\n{% elif mode_norm == 'stock_open_item' %}\n  {{\n    {\n      \"amount\": amt_in,\n      \"best_before_date\": (bbd_in if bbd_in is not none else none),\n      \"allow_subproduct_substitution\": false\n    }\n  }}\n{% elif mode_norm == 'stock_entry_update' %}\n  {% if current_entry_base is mapping %}\n    {% set ns = namespace(o={}) %}\n    {% if has_explicit_amount %}{% set ns.o = ns.o | combine({\"amount\": amt_in}) %}{% endif %}\n    {% if bbd_in is not none %}{% set ns.o = ns.o | combine({\"best_before_date\": bbd_in}) %}{% endif %}\n    {% if location_id_resolved is not none %}{% set ns.o = ns.o | combine({\"location_id\": location_id_resolved}) %}{% endif %}\n    {% if price_in is not none %}{% set ns.o = ns.o | combine({\"price\": price_in}) %}{% endif %}\n    {% if note_in | trim != '' %}{% set ns.o = ns.o | combine({\"note\": note_in}) %}{% endif %}\n    {% set b = current_entry_base %}\n    {{ {\"amount\": b.get('amount'), \"best_before_date\": b.get('best_before_date'), \"purchased_date\": b.get('purchased_date'), \"location_id\": b.get('location_id'), \"shopping_location_id\": b.get('shopping_location_id'), \"price\": b.get('price'), \"open\": b.get('open', 0), \"note\": b.get('note')} | combine(ns.o) }}\n  {% else %}\n    {{ none }}\n  {% endif %}\n{% elif mode_norm == 'stock_add_by_barcode' %}\n  {{\n    {\n      \"amount\": amt_in,\n      \"best_before_date\": (bbd_in if bbd_in is not none else none),\n      \"transaction_type\": \"purchase\",\n      \"purchased_date\": (purchase_date_in if (purchase_date_in is match('^\\d{4}-\\d{2}-\\d{2}$')) else none),\n      \"price\": (price_in if price_in is not none else none),\n      \"location_id\": (location_id_resolved if location_id_resolved is not none else none)\n    }\n  }}\n{% elif mode_norm == 'stock_consume_by_barcode' %}\n  {{ {\"amount\": amt_in} }}\n{% elif mode_norm == 'batteries_charge' %}\n  {{ {\"tracked_time\": none, \"amount\": (amt_in | int(1))} }}\n{% elif mode_norm in ['locations_delete', 'unit_conversions_delete', 'stock_undo_booking', 'tasks_undo', 'chores_undo', 'batteries_charge_undo'] %}\n  {{ '{\"confirm\":true}' }}\n{% else %}\n  {{ payload_obj }}\n{% endif %}"
    - variables:
        payload_data: "{{\n  {\n    \"action_type\": action_type,\n    \"endpoint\":
          final_endpoint\n  }\n  | combine(\n      {\"payload\": effective_payload}\n
          \     if effective_payload is not none else {}\n    )\n}}"
    - alias: Endpoint Resolution Check
      choose:
      - conditions:
        - alias: 'Error: Endpoint not Resolved'
          condition: template
          value_template: "{{\n  (final_endpoint is none)\n  and mode_norm not in ['catalog_find_product', 'catalog_search', 'catalog_add_product', 'catalog_delete_product', 'catalog_audit', 'locations_reparent_bulk', 'locations_delete_safe', 'locations_hierarchy_rebuild', 'stock_register_asset', 'stock_area_summary', 'stock_area_volatile', 'stock_area_inventory', 'chores_by_area', 'chores_due', 'room_brief', 'chores_add', 'chores_tag', 'products_tag', 'catalog_find_by_tag', 'object_lens', 'chores_delete', 'chores_edit', 'tasks_add', 'tasks_tag', 'update_product_meta', 'provision_bom', 'catalog_import_bom', 'product_refs_get', 'product_ref_add', 'product_ref_remove', 'bulk_tag', 'bulk_location_move', 'bulk_label_add', 'bulk_label_remove', 'bulk_stock_add', 'bulk_stock_reconcile_recent', 'bulk_product_ref_add', 'catalog_find_by_barcode', 'by_anchor', 'batteries_due', 'battery_status', 'battery_overdue', 'battery_replace', 'stock_audit_perishable', 'stock_bbd_audit', 'product_unit_repair', 'product_unit_audit', 'stock_waste_expired', 'receipt_intake']\n}}\n"
        sequence:
        - variables:
            final_response:
              status: error
              reason: >-
                {%- set ns = namespace(r=[]) -%}
                {%- if loc_norm | string | trim != '' and location_id_resolved is none -%}
                  {%- set ns.r = ns.r + ["location '" ~ loc_norm ~ "' matched no Grocy location (find it with locations_find, or pass location_id)"] -%}
                {%- endif -%}
                {%- if item_norm | string | trim != '' and product_id_resolved is none and chore_id_resolved is none and task_id_resolved is none -%}
                  {%- set ns.r = ns.r + ["item '" ~ item_norm ~ "' matched no product, chore or task (try catalog_find_product / chores_find / tasks_find, or pass the id)"] -%}
                {%- endif -%}
                {%- if ns.r | length == 0 -%}
                  {%- set ns.r = (["stock_list_by_location needs location or location_id"] if mode_norm == 'stock_list_by_location' and loc_norm | string | trim == '' else ["a required input for " ~ mode_norm ~ " is missing (see mode=help for what it needs)"]) -%}
                {%- endif -%}
                guarded: {{ ns.r | join('; ') }}
              message: Unable to resolve endpoint for case
              mode: '{{ mode_norm }}'
              item: '{{ item_norm }}'
              location: '{{ loc_norm }}'
              resolved:
                product_id: '{{ product_id_resolved }}'
                location_id: '{{ location_id_resolved }}'
                shopping_location_id: '{{ shopping_location_id_resolved }}'
                chore_id: '{{ chore_id_resolved }}'
                task_id: '{{ task_id_resolved }}'
              coaching:
              - If this is an item question, pass item or product_id.
              - If this is a location question, pass location or location_id.
              - For purchases, provide item or product_id and amount.
        - stop: Resolution Failed
          response_variable: final_response
    - alias: 'PC sync — snapshot child current parent'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'locations_metadata_set'\n             and location_id_resolved is not none\n             and parent_lid_resolved is not none }}"
        sequence:
        - action: script.zen_sutra_grocy
          response_variable: child_snapshot_raw
          data:
            action_type: read
            endpoint: /objects/locations?limit=500&offset=0
        - variables:
            child_old_parent_lid: "{{ child_snapshot_raw['result']['content'] | selectattr('id', 'equalto', location_id_resolved | int) | map(attribute='userfields.grocy_parent_location_id') | first | default(none, true) | int(none) }}"
    - variables:
        _deleted_loc_parent_id: "{{ none }}"
    - alias: 'Pre-fetch — snapshot parent before delete'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm in ['locations_delete', 'locations_delete_safe'] and location_id_resolved is not none }}"
        sequence:
        - action: script.zen_sutra_grocy
          response_variable: _del_snap_raw
          data:
            action_type: read
            endpoint: /objects/locations?limit=500&offset=0
        - variables:
            _deleted_loc_parent_id: "{{ _del_snap_raw['result']['content'] | selectattr('id', 'equalto', location_id_resolved | int) | map(attribute='userfields.grocy_parent_location_id') | first | default(none, true) | int(none) }}"
    - alias: catalog_find_by_barcode — dedicated handler
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'catalog_find_by_barcode' }}"
        sequence:
        - if: "{{ not has_barcode }}"
          then:
          - variables:
              final_response:
                status: error
                message: barcode is required for catalog_find_by_barcode.
                coaching:
                - "{'mode':'catalog_find_by_barcode','barcode':'9780375826696'}"
          - stop: barcode required
            response_variable: final_response
        - action: script.zen_sutra_grocy
          response_variable: _cfbb_raw
          continue_on_error: true
          data:
            action_type: read
            endpoint: "/stock/products/by-barcode/{{ barcode_norm }}"
        - variables:
            _cfbb_content: >-
              {%- set r = _cfbb_raw if _cfbb_raw is mapping else {} -%}
              {%- set rr = r.get('result', none) -%}
              {%- set c = rr.get('content', none) if rr is mapping else none -%}
              {{ c | tojson if c is mapping else (c | string | trim if c is not none else '{}') }}
        - variables:
            _cfbb_data: "{{ _cfbb_content if _cfbb_content is mapping else (_cfbb_content | from_json(none) if _cfbb_content is string and _cfbb_content | trim | length > 0 else {}) }}"
        - variables:
            _cfbb_pid: "{{ _cfbb_data.get('product', {}).get('id') | int(0) if _cfbb_data is mapping else 0 }}"
            _cfbb_name: "{{ (_cfbb_data.get('product', {}).get('name') or '') | string | trim if _cfbb_data is mapping else '' }}"
        - variables:
            final_response:
              status: "{{ 'found' if _cfbb_pid | int(0) > 0 else 'not_found' }}"
              barcode: "{{ barcode_norm }}"
              product_id: "{{ _cfbb_pid | int(0) }}"
              product_name: "{{ _cfbb_name }}"
        - stop: catalog_find_by_barcode done
          response_variable: final_response
    - alias: batteries_due — fetch + bucket by charge status
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'batteries_due' }}"
        sequence:
        - action: script.zen_sutra_grocy
          response_variable: _bd_raw
          continue_on_error: true
          data:
            action_type: read
            endpoint: /batteries
        - variables:
            _bd_list: >-
              {%- set r = _bd_raw if _bd_raw is mapping else {} -%}
              {%- set c = r.get('result', {}).get('content', []) -%}
              {{ c if c is sequence and c is not string else [] }}
            _bd_now: "{{ now().strftime('%Y-%m-%dT%H:%M:%S') }}"
        - variables:
            _bd_overdue: >-
              {%- set ns = namespace(b=[]) -%}
              {%- for b in _bd_list -%}
                {%- set nxt = b.get('next_estimated_charge_time', '') or '' -%}
                {%- if nxt | trim != '' and nxt < _bd_now -%}
                  {%- set ns.b = ns.b + [b] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.b }}
            _bd_due_today: >-
              {%- set ns = namespace(b=[]) -%}
              {%- set _today = now().strftime('%Y-%m-%d') -%}
              {%- for b in _bd_list -%}
                {%- set nxt = b.get('next_estimated_charge_time', '') or '' -%}
                {%- if nxt | trim != '' and nxt >= _bd_now and nxt[:10] == _today -%}
                  {%- set ns.b = ns.b + [b] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.b }}
            _bd_due_soon: >-
              {%- set ns = namespace(b=[]) -%}
              {%- set _today = now().strftime('%Y-%m-%d') -%}
              {%- set _soon = (now() + timedelta(days=7)).strftime('%Y-%m-%d') -%}
              {%- for b in _bd_list -%}
                {%- set nxt = b.get('next_estimated_charge_time', '') or '' -%}
                {%- if nxt | trim != '' and nxt >= _bd_now and nxt[:10] != _today and nxt[:10] <= _soon -%}
                  {%- set ns.b = ns.b + [b] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.b }}
            _bd_ok: >-
              {%- set ns = namespace(b=[]) -%}
              {%- set _soon = (now() + timedelta(days=7)).strftime('%Y-%m-%d') -%}
              {%- for b in _bd_list -%}
                {%- set nxt = b.get('next_estimated_charge_time', '') or '' -%}
                {%- if nxt | trim == '' or nxt[:10] > _soon -%}
                  {%- set ns.b = ns.b + [b] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.b }}
        - variables:
            final_response:
              status: success
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: batteries_due
              total: '{{ _bd_list | length }}'
              overdue: '{{ _bd_overdue }}'
              due_today: '{{ _bd_due_today }}'
              due_soon: '{{ _bd_due_soon }}'
              ok: '{{ _bd_ok }}'
              generated: '{{ _bd_now }}'
        - stop: batteries_due done
          response_variable: final_response

    - alias: battery_status — low-battery triage by area with Grocy stock cross-ref
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'battery_status' }}"
        sequence:
        - variables:
            _bs_all_plus: >-
              {{ integration_entities('battery_notes')
                 | select('match', 'sensor\\..*_battery_plus')
                 | list }}
        - variables:
            _bs_low: >-
              {%- set ns = namespace(devs=[]) -%}
              {%- for ent in _bs_all_plus -%}
                {%- if state_attr(ent, 'battery_low') == true -%}
                  {%- set _aid = area_id(ent) | default('', true) -%}
                  {%- set _dn  = state_attr(ent, 'device_name') | default('', true) -%}
                  {%- set _taq = state_attr(ent, 'battery_type_and_quantity') | default('', true) -%}
                  {%- set _pct = states(ent) | int(none) -%}
                  {%- set ns.devs = ns.devs + [{'entity_id': ent, 'device_name': _dn, 'battery_type_and_quantity': _taq, 'battery_pct': _pct, 'area_id': _aid}] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.devs }}
        - variables:
            _bs_by_area: >-
              {%- set ns = namespace(m={}) -%}
              {%- for d in _bs_low -%}
                {%- set _aid = d.get('area_id', '') -%}
                {%- set _existing = ns.m.get(_aid, {'devices': [], 'types_needed': []}) -%}
                {%- set _devs = _existing.get('devices', []) + [d] -%}
                {%- set _types = _existing.get('types_needed', []) -%}
                {%- set _taq = d.get('battery_type_and_quantity', '') -%}
                {%- set _types_new = _types if _taq in _types or _taq == '' else _types + [_taq] -%}
                {%- set ns.m = ns.m | combine({_aid: {'devices': _devs, 'types_needed': _types_new}}) -%}
              {%- endfor -%}
              {{ ns.m }}
            _bs_unique_types: >-
              {%- set ns = namespace(types=[]) -%}
              {%- for d in _bs_low -%}
                {%- set _taq = d.get('battery_type_and_quantity', '') -%}
                {%- if _taq != '' and _taq not in ns.types -%}
                  {%- set ns.types = ns.types + [_taq] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.types }}
        - variables:
            _bs_stock: {}
        - repeat:
            for_each: "{{ _bs_unique_types }}"
            sequence:
            - action: script.zen_sutra_grocy
              response_variable: _bs_prod_raw
              continue_on_error: true
              data:
                action_type: read
                endpoint: "/objects/products?query%5B%5D=name={{ repeat.item | urlencode }}&limit=5"
            - variables:
                _bs_prod_list: >-
                  {%- set r = _bs_prod_raw if _bs_prod_raw is mapping else {} -%}
                  {%- set c = r.get('result', {}).get('content', []) -%}
                  {{ c if c is sequence and c is not string else [] }}
                _bs_prod_id: >-
                  {%- set r = _bs_prod_raw if _bs_prod_raw is mapping else {} -%}
                  {%- set c = r.get('result', {}).get('content', []) -%}
                  {%- set _list = c if c is sequence and c is not string else [] -%}
                  {{ (_list | first | default({})).get('id', none) if _list | length > 0 else none }}
            - choose:
              - conditions:
                - condition: template
                  value_template: "{{ _bs_prod_id is not none }}"
                sequence:
                - action: script.zen_sutra_grocy
                  response_variable: _bs_stock_raw
                  continue_on_error: true
                  data:
                    action_type: read
                    endpoint: "/stock/products/{{ _bs_prod_id }}"
                - variables:
                    _bs_stock_amt: >-
                      {%- set r = _bs_stock_raw if _bs_stock_raw is mapping else {} -%}
                      {%- set c = r.get('result', {}).get('content', {}) -%}
                      {%- set _d = c if c is mapping else {} -%}
                      {{ _d.get('stock_amount', none) }}
                - variables:
                    _bs_stock: "{{ _bs_stock | combine({repeat.item: {'product_id': _bs_prod_id, 'stock_amount': _bs_stock_amt}}) }}"
        - variables:
            final_response:
              status: success
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: battery_status
              total_low: '{{ _bs_low | length }}'
              all_ok: '{{ _bs_low | length == 0 }}'
              areas: '{{ _bs_by_area }}'
              stock: '{{ _bs_stock }}'
              generated: '{{ now().isoformat() }}'
        - stop: battery_status done
          response_variable: final_response

    - alias: battery_overdue — devices not replaced in N days
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'battery_overdue' }}"
        sequence:
        - variables:
            _bo_days: "{{ days_threshold | default(180) | int(180) }}"
            _bo_all_plus: >-
              {{ integration_entities('battery_notes')
                 | select('match', 'sensor\\..*_battery_plus')
                 | list }}
        - variables:
            _bo_overdue: >-
              {%- set ns = namespace(devs=[]) -%}
              {%- for ent in _bo_all_plus -%}
                {%- set _lrt = state_attr(ent, 'battery_last_replaced') | default('', true) -%}
                {%- if _lrt and _lrt | trim != '' and as_datetime(_lrt) is not none -%}
                  {%- set _dsr = (now() - as_datetime(_lrt)).days -%}
                  {%- if _dsr > _bo_days -%}
                    {%- set _aid = area_id(ent) | default('', true) -%}
                    {%- set _dn  = state_attr(ent, 'device_name') | default('', true) -%}
                    {%- set _taq = state_attr(ent, 'battery_type_and_quantity') | default('', true) -%}
                    {%- set _pct = states(ent) | int(none) -%}
                    {%- set ns.devs = ns.devs + [{'entity_id': ent, 'device_name': _dn, 'battery_type_and_quantity': _taq, 'battery_pct': _pct, 'area_id': _aid, 'last_replaced': _lrt | string, 'days_since_replaced': _dsr}] -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.devs | sort(attribute='days_since_replaced', reverse=true) }}
        - variables:
            final_response:
              status: success
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: battery_overdue
              days_threshold: '{{ _bo_days }}'
              overdue_count: '{{ _bo_overdue | length }}'
              devices: '{{ _bo_overdue }}'
              generated: '{{ now().isoformat() }}'
        - stop: battery_overdue done
          response_variable: final_response

    - alias: battery_replace — atomic Battery Notes log + Grocy stock consume
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'battery_replace' }}"
        sequence:
        - variables:
            _br_entity: "{{ ha_entity_id | default('') | string | trim if ha_entity_id is defined else '' }}"
        - if: "{{ _br_entity == '' }}"
          then:
          - variables:
              final_response:
                status: error
                tool: '{{ tool_name }}'
                version: '{{ tool_version }}'
                case: battery_replace
                message: "ha_entity_id is required. Provide the Battery Notes source entity (e.g. sensor.office_remote_battery_plus)."
          - stop: battery_replace — ha_entity_id required
            response_variable: final_response
        - variables:
            _br_battery_type: "{{ state_attr(_br_entity, 'battery_type_and_quantity') | default('', true) }}"
            _br_device_name: "{{ state_attr(_br_entity, 'device_name') | default(_br_entity, true) }}"
            _br_replaced_at: "{{ now().isoformat() }}"
        - action: battery_notes.set_battery_replaced
          continue_on_error: true
          data:
            source_entity_id: "{{ _br_entity }}"
            datetime_replaced: "{{ _br_replaced_at }}"
        - variables:
            _br_grocy_consumed: none
            _br_has_item: "{{ item is defined and item | default('') | string | trim != '' }}"
        - if: "{{ _br_has_item }}"
          then:
          - action: script.zen_sutra_grocy
            response_variable: _br_prod_raw
            continue_on_error: true
            data:
              action_type: read
              endpoint: "/objects/products?query%5B%5D=name={{ item_norm | urlencode }}&limit=5"
          - variables:
              _br_prod_list: >-
                {%- set r = _br_prod_raw if _br_prod_raw is mapping else {} -%}
                {%- set c = r.get('result', {}).get('content', []) -%}
                {{ c if c is sequence and c is not string else [] }}
              _br_prod_id: >-
                {%- set r = _br_prod_raw if _br_prod_raw is mapping else {} -%}
                {%- set c = r.get('result', {}).get('content', []) -%}
                {%- set _list = c if c is sequence and c is not string else [] -%}
                {{ (_list | first | default({})).get('id', none) if _list | length > 0 else none }}
              _br_prod_name: >-
                {%- set r = _br_prod_raw if _br_prod_raw is mapping else {} -%}
                {%- set c = r.get('result', {}).get('content', []) -%}
                {%- set _list = c if c is sequence and c is not string else [] -%}
                {{ (_list | first | default({})).get('name', item_norm) if _list | length > 0 else item_norm }}
          - if: "{{ _br_prod_id is not none }}"
            then:
            - action: script.zen_sutra_grocy
              response_variable: _br_consume_raw
              continue_on_error: true
              data:
                action_type: create
                endpoint: "/stock/products/{{ _br_prod_id }}/consume"
                payload: "{{ {'amount': (amt_in | int(1)), 'transaction_type': 'consume'} }}"
            - variables:
                _br_grocy_consumed:
                  product: '{{ _br_prod_name }}'
                  product_id: '{{ _br_prod_id }}'
                  amount: '{{ amt_in | int(1) }}'
        - variables:
            final_response:
              status: success
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: battery_replace
              replaced: true
              entity_id: '{{ _br_entity }}'
              device_name: '{{ _br_device_name }}'
              battery_type: '{{ _br_battery_type }}'
              replaced_at: '{{ _br_replaced_at }}'
              grocy_consumed: '{{ _br_grocy_consumed }}'
        - stop: battery_replace done
          response_variable: final_response

    # --- product_unit_audit (#10779): read only. A product whose stock or purchase unit is
    #     not a real unit cannot take stock writes. The Sutra slims product lists to id and
    #     name, so the units are found with filters on the raw columns instead: the empty
    #     values ('', None, null, 0), each id missing from the unit list, and any id above
    #     the highest unit. One-time check; not scheduled.
    - alias: product_unit_audit — products whose unit is not a real unit (read only)
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'product_unit_audit' }}"
        sequence:
        - action: script.zen_sutra_grocy
          response_variable: _pua_units_raw
          continue_on_error: true
          data:
            action_type: read
            endpoint: "/objects/quantity_units?limit=500&offset=0"
        - variables:
            _pua_units_ok: "{{ _pua_units_raw is mapping and _pua_units_raw.get('status') == 'success' }}"
            _pua_unit_ids: >-
              {%- set c = _pua_units_raw.get('result', {}).get('content') if _pua_units_raw is mapping else none -%}
              {{ (c | map(attribute='id') | map('int') | list) if c is sequence and c is not string else [] }}
        - if: "{{ not _pua_units_ok or _pua_unit_ids | count == 0 }}"
          then:
          - variables:
              final_response:
                status: error
                mode: product_unit_audit
                message: "Could not read Grocy's units, so nothing can be checked."
                tool: "{{ tool_name }}"
                version: "{{ tool_version }}"
          - stop: product_unit_audit no units
            response_variable: final_response
        - variables:
            _pua_probes: >-
              {%- set ids = _pua_unit_ids -%}
              {%- set mx = ids | max -%}
              {%- set ns = namespace(p=[]) -%}
              {%- for f in ['qu_id_stock', 'qu_id_purchase'] -%}
                {%- for c in ['', 'None', 'null', '0'] -%}
                  {%- set ns.p = ns.p + [{'field': f, 'op': '%3D', 'value': c, 'why': 'stored ' ~ (c | tojson) ~ ', not a unit'}] -%}
                {%- endfor -%}
                {%- for g in range(1, mx) if g not in ids -%}
                  {%- set ns.p = ns.p + [{'field': f, 'op': '%3D', 'value': g | string, 'why': 'unit ' ~ g ~ ' no longer exists'}] -%}
                {%- endfor -%}
                {%- set ns.p = ns.p + [{'field': f, 'op': '%3E', 'value': mx | string, 'why': 'a unit above ' ~ mx ~ ', which does not exist'}] -%}
              {%- endfor -%}
              {{ ns.p }}
            _pua_hits: {}
            _pua_errors: []
        - repeat:
            for_each: "{{ _pua_probes }}"
            sequence:
            - action: script.zen_sutra_grocy
              response_variable: _pua_pr
              continue_on_error: true
              data:
                action_type: read
                endpoint: "objects/products?query%5B%5D={{ repeat.item.field }}{{ repeat.item.op }}{{ repeat.item.value | urlencode }}&limit=500"
            - variables:
                _pua_hits: >-
                  {%- set c = _pua_pr.get('result', {}).get('content') if _pua_pr is mapping and _pua_pr.get('status') == 'success' else none -%}
                  {%- set ns = namespace(h=_pua_hits) -%}
                  {%- if c is sequence and c is not string -%}
                    {%- for r in c if r is mapping and r.get('id') is not none and not ((r.get('name') or '') | string).endswith(' (retired #' ~ (r.id | string) ~ ')') -%}
                      {%- set k = r.id | string -%}
                      {%- set prev = ns.h.get(k, {'id': r.id | int, 'name': r.get('name', ''), 'problems': []}) -%}
                      {%- set ns.h = dict(ns.h, **{k: dict(prev, problems=prev.problems + [repeat.item.field ~ ': ' ~ repeat.item.why])}) -%}
                    {%- endfor -%}
                  {%- endif -%}
                  {{ ns.h }}
                _pua_errors: >-
                  {{ _pua_errors + ([repeat.item.field ~ repeat.item.op ~ repeat.item.value]
                     if not (_pua_pr is mapping and _pua_pr.get('status') == 'success') else []) }}
        - variables:
            _pua_rows: []
        - repeat:
            for_each: "{{ _pua_hits.values() | list | sort(attribute='id') }}"
            sequence:
            - action: script.zen_sutra_grocy
              response_variable: _pua_stk
              continue_on_error: true
              data:
                action_type: read
                endpoint: "objects/stock?query%5B%5D=product_id%3D{{ repeat.item.id }}&limit=500"
            - variables:
                _pua_rows: >-
                  {%- set sk = _pua_stk.get('result', {}).get('content') if _pua_stk is mapping and _pua_stk.get('status') == 'success' else none -%}
                  {%- set ns = namespace(a=0) -%}
                  {%- if sk is sequence and sk is not string -%}{%- for s in sk if s is mapping -%}{%- set ns.a = ns.a + (s.get('amount', 0) | float(0)) -%}{%- endfor -%}{%- endif -%}
                  {{ _pua_rows + [{'id': repeat.item.id, 'name': repeat.item.name, 'problems': repeat.item.problems,
                                   'on_hand': ns.a | round(3) if sk is sequence and sk is not string else none}] }}
        - variables:
            final_response:
              status: success
              mode: product_unit_audit
              read_only: true
              count: "{{ _pua_rows | count }}"
              products: "{{ _pua_rows }}"
              checks: "{{ _pua_probes | count }}"
              check_errors: "{{ _pua_errors }}"
              checked_at: "{{ now().isoformat() }}"
              fix: "product_unit_repair product_id=<id> unit_id=<unit>: preview, then confirm_action=true."
              tool: "{{ tool_name }}"
              version: "{{ tool_version }}"
        - stop: product_unit_audit done
          response_variable: final_response

    # --- product_unit_repair (#10779): reconcile a product whose unit is not a real unit onto
    #     a new product, and move every reference to it. See the v5.13.0 header note.
    - alias: product_unit_repair — reconcile a no-unit product onto a new one
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'product_unit_repair' }}"
        sequence:
        - if: "{{ product_id_resolved is none or unit_id_resolved is none }}"
          then:
          - variables:
              final_response:
                status: error
                mode: product_unit_repair
                message: "product_unit_repair needs product_id (or item) and unit_id, the unit to give it (units_list shows them)."
                tool: "{{ tool_name }}"
                version: "{{ tool_version }}"
          - stop: product_unit_repair input
            response_variable: final_response
        # ---------------- read ----------------
        - action: script.zen_sutra_grocy
          response_variable: _pr_prod_raw
          continue_on_error: true
          data: {action_type: read, endpoint: "/objects/products/{{ product_id_resolved }}"}
        - action: script.zen_sutra_grocy
          response_variable: _pr_units_raw
          continue_on_error: true
          data: {action_type: read, endpoint: "/objects/quantity_units?limit=500&offset=0"}
        - action: script.zen_sutra_grocy
          response_variable: _pr_uf_raw
          continue_on_error: true
          data: {action_type: read, endpoint: "/userfields/products/{{ product_id_resolved }}"}
        - variables:
            _pr_hh: >-
              {%- set roles = ['zen_vault_cabinet', 'zen_system_cabinet', 'zen_dojo_cabinet', 'zen_kata_cabinet', 'zen_household_cabinet', 'zen_family_cabinet', 'zen_ai_user_cabinet', 'zen_user_cabinet'] -%}
              {%- set ns = namespace(c='') -%}
              {%- for e in label_entities('zen_index_cabinet') | select('match', 'sensor[.]') | sort if ns.c == '' -%}
                {%- set l = labels(e) -%}
                {%- if (l | select('in', roles) | list | count) == 0 and (l | select('match', '^zen_.*history_cabinet$') | list | count) == 0 -%}{%- set ns.c = e -%}{%- endif -%}
              {%- endfor -%}
              {{ ns.c }}
            _pr_house: "{{ states('sensor.zen_default_household_cabinet_resolved') }}"
            _pr_jkey: "product_unit_repair_{{ product_id_resolved | int }}"
            _pr_p: >-
              {%- set c = _pr_prod_raw.get('result', {}).get('content') if _pr_prod_raw is mapping and _pr_prod_raw.get('status') == 'success' else none -%}
              {{ c if c is mapping else {} }}
            _pr_unit_ids: >-
              {%- set c = _pr_units_raw.get('result', {}).get('content') if _pr_units_raw is mapping else none -%}
              {{ (c | map(attribute='id') | map('int') | list) if c is sequence and c is not string else [] }}
            _pr_ufs: >-
              {%- set c = _pr_uf_raw.get('result', {}).get('content') if _pr_uf_raw is mapping and _pr_uf_raw.get('status') == 'success' else none -%}
              {%- set ns = namespace(d={}) -%}
              {%- if c is mapping -%}{%- for k, v in c.items() if v is not none and (v | string | trim) != '' -%}{%- set ns.d = dict(ns.d, **{k: v}) -%}{%- endfor -%}{%- endif -%}
              {{ ns.d }}
        - variables:
            _pr_unit: "{{ unit_id_resolved | int(0) }}"
            _pr_j: >-
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
              {%- set j = (CABS.cabinet_drawer_value(_pr_hh, _pr_jkey) | from_json) if _pr_hh not in ['', 'unknown', 'unavailable'] else none -%}
              {{ j if j is mapping else {} }}
            _pr_broken: >-
              {%- set ids = _pr_unit_ids -%}
              {%- set s = _pr_p.get('qu_id_stock') -%}{%- set pu = _pr_p.get('qu_id_purchase') -%}
              {{ s is none or (s | int(0)) not in ids or pu is none or (pu | int(0)) not in ids }}
        - variables:
            _pr_orig_name: >-
              {{ _pr_j.get('name') if _pr_j.get('name') else (_pr_p.get('name', '') | regex_replace(' [(]retired #[0-9]+[)]$', '')) }}
            _pr_refusal: >-
              {%- if _pr_p | count == 0 -%}product {{ product_id_resolved }} could not be read from Grocy
              {%- elif _pr_unit not in _pr_unit_ids -%}unit {{ unit_id_resolved }} is not a Grocy unit (units_list shows them)
              {%- elif not _pr_broken and _pr_j | count == 0 -%}product {{ product_id_resolved }} already has real units; change them with update_product_meta
              {%- elif _pr_j.get('status') == 'done' -%}product {{ product_id_resolved }} was already repaired: it is now product {{ _pr_j.get('new_id') }}
              {%- elif _pr_j | count > 0 and (_pr_j.get('unit') | int(0)) != _pr_unit -%}a repair of this product is in progress with unit {{ _pr_j.get('unit') }}; run it again with that unit
              {%- endif -%}
        - if: "{{ _pr_refusal != '' }}"
          then:
          - variables:
              final_response: {status: error, mode: product_unit_repair, product_id: "{{ product_id_resolved }}", message: "{{ _pr_refusal }}", tool: "{{ tool_name }}", version: "{{ tool_version }}"}
          - stop: product_unit_repair refused
            response_variable: final_response
        # ---------------- map references (Grocy) ----------------
        - variables:
            _pr_q: "query%5B%5D=product_id%3D{{ product_id_resolved | int }}"
            _pr_gref: {}
        - repeat:
            for_each:
            - {kind: stock, ep: "objects/stock"}
            - {kind: barcode, ep: "objects/product_barcodes"}
            - {kind: chore, ep: "objects/chores"}
            - {kind: recipe_ingredient, ep: "objects/recipes_pos"}
            - {kind: shopping_list, ep: "objects/shopping_list"}
            - {kind: meal_plan, ep: "objects/meal_plan"}
            - {kind: child_product, ep: "objects/products", field: parent_product_id}
            sequence:
            - action: script.zen_sutra_grocy
              response_variable: _pr_r
              continue_on_error: true
              data:
                action_type: read
                endpoint: "{{ repeat.item.ep }}?query%5B%5D={{ repeat.item.get('field', 'product_id') }}%3D{{ product_id_resolved | int }}&limit=500"
            - variables:
                _pr_gref: >-
                  {%- set ok = _pr_r is mapping and _pr_r.get('status') == 'success' -%}
                  {%- set c = _pr_r.get('result', {}).get('content') if ok else none -%}
                  {{ dict(_pr_gref, **{repeat.item.kind: ((c | list) if c is sequence and c is not string else none)}) }}
        # user objects whose fields hold a product id: live entities are repointed,
        # history entities keep the old id, anything else is manual.
        - action: script.zen_sutra_grocy
          response_variable: _pr_ufd_raw
          continue_on_error: true
          data: {action_type: read, endpoint: "objects/userfields?limit=500"}
        - action: script.zen_sutra_grocy
          response_variable: _pr_ue_raw
          continue_on_error: true
          data: {action_type: read, endpoint: "objects/userentities?limit=500"}
        - variables:
            _pr_uo_live: ['depreciable_asset']
            _pr_uo_history: ['receipt', 'receipt_line']
            _pr_uo_fields: >-
              {%- set c = _pr_ufd_raw.get('result', {}).get('content') if _pr_ufd_raw is mapping else none -%}
              {%- set ents = _pr_ue_raw.get('result', {}).get('content') if _pr_ue_raw is mapping else none -%}
              {%- set ns = namespace(o=[]) -%}
              {%- if c is sequence and c is not string and ents is sequence and ents is not string -%}
                {%- for f in c if f is mapping and (f.get('entity') or '') is match('^userentity-') and (f.get('name') or '') is search('product_id') -%}
                  {%- set en = f.entity[11:] -%}
                  {%- set e = ents | selectattr('name', 'eq', en) | list | first | default({}) -%}
                  {%- set ns.o = ns.o + [{'entity': en, 'entity_id': e.get('id'), 'field': f.name}] -%}
                {%- endfor -%}
              {%- endif -%}
              {{ ns.o }}
            _pr_uo_refs: []
        - repeat:
            for_each: "{{ _pr_uo_fields | rejectattr('entity', 'in', _pr_uo_history) | list }}"
            sequence:
            - action: script.zen_sutra_grocy
              response_variable: _pr_uol
              continue_on_error: true
              data:
                action_type: read
                endpoint: "objects/userobjects?query%5B%5D=userentity_id%3D{{ repeat.item.entity_id }}&limit=500"
            - variables:
                _pr_uo_ids: >-
                  {%- set c = _pr_uol.get('result', {}).get('content') if _pr_uol is mapping else none -%}
                  {{ (c | map(attribute='id') | list) if c is sequence and c is not string else [] }}
                _pr_uo_ent: "{{ repeat.item }}"
            - repeat:
                for_each: "{{ _pr_uo_ids }}"
                sequence:
                - action: script.zen_sutra_grocy
                  response_variable: _pr_uov
                  continue_on_error: true
                  data:
                    action_type: read
                    endpoint: "/userfields/userentity-{{ _pr_uo_ent.entity }}/{{ repeat.item }}"
                - variables:
                    _pr_uo_refs: >-
                      {%- set c = _pr_uov.get('result', {}).get('content') if _pr_uov is mapping else none -%}
                      {%- set hit = c is mapping and (c.get(_pr_uo_ent.field) | string | trim) == (product_id_resolved | int | string) -%}
                      {{ _pr_uo_refs + ([{'entity': _pr_uo_ent.entity, 'object_id': repeat.item, 'field': _pr_uo_ent.field,
                                          'action': 'repoint' if _pr_uo_ent.entity in _pr_uo_live else 'manual'}] if hit else []) }}
        # ---------------- map references (cabinets, Mealie) ----------------
        - variables:
            _pr_cab_hits: >-
              {%- set pid = product_id_resolved | int -%}
              {%- set rx = '"(grocy_product_id|machine_product_id|product_id)": ?"?' ~ pid ~ '"?[,} ]' -%}
              {%- set ns = namespace(m=[]) -%}
              {%- for cab in label_entities('zen_cabinet') | select('match', 'sensor[.]') | list -%}
                {%- set labs = labels(cab) -%}
                {%- if 'zen_kata_cabinet' not in labs and (labs | select('search', 'history') | list | count) == 0 -%}
                  {%- set vars = state_attr(cab, 'variables') -%}
                  {%- if vars is mapping -%}
                    {%- for k, d in vars.items() if not (k | string).startswith('product_unit_repair_') -%}
                      {%- set js = d | tojson | replace('\\', '') -%}
                      {%- if js is search(rx) -%}{%- set ns.m = ns.m + [{'cabinet': cab, 'drawer': k | string}] -%}{%- endif -%}
                    {%- endfor -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.m }}
        - variables:
            _pr_rm: >-
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
              {%- set pid = product_id_resolved | int -%}
              {%- set ns = namespace(r=[]) -%}
              {%- for hit in _pr_cab_hits if hit.drawer == 'room_topology' -%}
                {%- set topo = CABS.cabinet_drawer_value(hit.cabinet, 'room_topology') | from_json -%}
                {%- if topo is mapping -%}
                  {%- for area, room in topo.items() if room is mapping -%}
                    {%- for s in (room.get('safety') or []) if s is mapping and (s.get('grocy_product_id') | string | trim) == (pid | string) -%}
                      {%- set ns.r = ns.r + [{'area': area, 'entry': s}] -%}
                    {%- endfor -%}
                  {%- endfor -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.r }}
        # autovac_fleet: a hit under a robot that is not the active one is a retired robot's
        # catalog (history, stays on the retired product). spa_config: Spa Manager re-provisions.
        - variables:
            _pr_cab_keep: >-
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
              {%- set pid = product_id_resolved | int -%}
              {%- set rx = '"(grocy_product_id|machine_product_id|product_id)": ?"?' ~ pid ~ '"?[,} ]' -%}
              {%- set ns = namespace(k=[]) -%}
              {%- for hit in _pr_cab_hits if hit.drawer == 'autovac_fleet' -%}
                {%- set fv = CABS.cabinet_drawer_value(hit.cabinet, 'autovac_fleet') | from_json -%}
                {%- if fv is mapping and fv.get('robots') is mapping -%}
                  {%- set act = fv.get('active_robot_key') -%}
                  {%- set live = namespace(n=0) -%}
                  {%- for rk, rv in fv.robots.items() if rk == act and ((rv | tojson | replace('\\', '')) is search(rx)) -%}{%- set live.n = live.n + 1 -%}{%- endfor -%}
                  {%- if live.n == 0 -%}{%- set ns.k = ns.k + [hit] -%}{%- endif -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.k }}
            _pr_spa_preset: >-
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
              {%- set ns = namespace(p='') -%}
              {%- for hit in _pr_cab_hits if hit.drawer == 'spa_config' -%}
                {%- set sv = CABS.cabinet_drawer_value(hit.cabinet, 'spa_config') | from_json -%}
                {%- if sv is mapping -%}
                  {%- if sv.get('preset') -%}{%- set ns.p = sv.preset -%}{%- endif -%}
                  {%- for k, v in sv.items() if v is mapping and v.get('preset') and ns.p == '' -%}{%- set ns.p = v.preset -%}{%- endfor -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.p }}
        - variables:
            _pr_spa: "{{ _pr_spa_preset != '' and states('script.zen_dojotools_spamaster') in ['on', 'off'] }}"
            _pr_cab_manual: >-
              {%- set keep = _pr_cab_keep | map(attribute='drawer') | list -%}
              {{ _pr_cab_hits | rejectattr('drawer', 'eq', 'room_topology') | rejectattr('drawer', 'in', keep)
                   | rejectattr('drawer', 'eq', 'spa_config' if _pr_spa else '__none__') | list
                 + (_pr_cab_hits | selectattr('drawer', 'eq', 'room_topology') | list if _pr_rm | count == 0 else []) }}
            _pr_kitchen: "{{ states('script.zen_dojotools_kitchen') in ['on', 'off'] }}"
            _pr_foods: []
            _pr_food_done: false
        - if: "{{ _pr_kitchen }}"
          then:
          - repeat:
              count: 40
              sequence:
              - if: "{{ not _pr_food_done }}"
                then:
                - action: script.zen_dojotools_kitchen
                  response_variable: _pr_fp
                  continue_on_error: true
                  data: {mode: run, case: foods_list, page: "{{ repeat.index }}", perPage: 50}
                - variables:
                    _pr_fitems: >-
                      {%- set rw = _pr_fp.get('raw') if _pr_fp is mapping else none -%}
                      {%- set c = (((rw.get('api') or {}).get('result') or {}).get('content')) if rw is mapping else none -%}
                      {{ (c.get('items') or []) | list if c is mapping else [] }}
                - variables:
                    _pr_foods: >-
                      {%- set ns = namespace(f=_pr_foods) -%}
                      {%- for f in _pr_fitems if f is mapping -%}
                        {%- set ex = f.get('extras') if f.get('extras') is mapping else {} -%}
                        {%- if (ex.get('grocy_product_id') | string | trim) == (product_id_resolved | int | string) -%}
                          {%- set ns.f = ns.f + [{'food_id': f.get('id'), 'name': f.get('name')}] -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {{ ns.f }}
                    _pr_food_done: "{{ _pr_fitems | count < 50 }}"
        # ---------------- plan ----------------
        - variables:
            _pr_read_errors: >-
              {%- set ns = namespace(e=[]) -%}
              {%- for k, v in _pr_gref.items() if v is none -%}{%- set ns.e = ns.e + [k] -%}{%- endfor -%}
              {{ ns.e }}
            _pr_stock: "{{ _pr_gref.get('stock') or [] }}"
            _pr_manual: >-
              {{ (_pr_uo_refs | selectattr('action', 'eq', 'manual') | list)
                 + (_pr_cab_manual | map('combine', {'action': 'manual'}) | list) }}
        - variables:
            _pr_stock_total: "{{ _pr_stock | map(attribute='amount') | map('float', 0) | sum | round(4) }}"
            _pr_opened: "{{ _pr_stock | selectattr('open', 'defined') | selectattr('open', 'eq', 1) | list | count }}"
            _pr_refs: >-
              {{ {'stock_entries': _pr_stock | count,
                  'barcodes': (_pr_gref.get('barcode') or []) | count, 'chores': (_pr_gref.get('chore') or []) | count,
                  'recipe_ingredients': (_pr_gref.get('recipe_ingredient') or []) | count,
                  'shopping_list': (_pr_gref.get('shopping_list') or []) | count, 'meal_plan': (_pr_gref.get('meal_plan') or []) | count,
                  'child_products': (_pr_gref.get('child_product') or []) | map(attribute='id') | list,
                  'user_objects': _pr_uo_refs, 'room_safety': _pr_rm | map(attribute='area') | list,
                  'mealie_foods': _pr_foods, 'spa_reprovision': _pr_spa_preset if _pr_spa else none,
                  'history_kept': _pr_cab_keep, 'manual': _pr_manual} }}
            _pr_certs: >-
              {{ ['zenos.knowledge.inventory_schema_edit:1']
                 + (['zenos.spatial.room_topology_edit:1'] if _pr_rm | count > 0 else [])
                 + (['Kitchen foods_tag'] if _pr_foods | count > 0 else []) }}
        - if: "{{ _pr_read_errors | count > 0 or _pr_manual | count > 0 or not confirm_action_in or dry_run_in }}"
          then:
          - variables:
              final_response:
                status: "{{ 'blocked' if (_pr_read_errors | count > 0 or _pr_manual | count > 0) else 'preview' }}"
                mode: product_unit_repair
                dry_run: true
                message: >-
                  {%- if _pr_read_errors | count > 0 -%}Nothing was changed: these references could not be read, so the map is incomplete: {{ _pr_read_errors | join(', ') }}.
                  {%- elif _pr_manual | count > 0 -%}Nothing was changed: {{ _pr_manual | count }} reference(s) have no handler (manual). Fix or remove them, then run again.
                  {%- else -%}Preview only. Nothing was changed. Pass confirm_action=true to repair.{%- endif -%}
                product_id: "{{ product_id_resolved }}"
                product: "{{ _pr_orig_name }}"
                unit: "{{ (_pr_units_raw.result.content | selectattr('id', 'eq', _pr_unit) | map(attribute='name') | list | first) if _pr_units_raw is mapping else _pr_unit }}"
                in_progress: "{{ _pr_j.get('steps', {}) }}"
                stock_total: "{{ _pr_stock_total }}"
                opened_entries: "{{ _pr_opened }}"
                references: "{{ _pr_refs }}"
                certs_needed: "{{ _pr_certs }}"
                steps:
                - "rename this product '{{ _pr_orig_name }} (retired #{{ product_id_resolved }})'"
                - "create '{{ _pr_orig_name }}' with the unit set, copying fields, userfields, barcodes and parent"
                - "rebook {{ _pr_stock | count }} stock entr(ies) ({{ _pr_stock_total }}) with their own dates, price, location, store and note; zero this product by inventory correction"
                - "repoint every reference above; receipt lines and stock history stay on the retired product"
                - "set the retired product inactive and verify"
                tool: "{{ tool_name }}"
                version: "{{ tool_version }}"
          - stop: product_unit_repair preview
            response_variable: final_response
        # ---------------- execute (journaled; a rerun continues) ----------------
        # Journals never stay where they do not belong: any left in the household cabinet
        # (5.13.0/5.13.1 wrote them there) and any finished one in scratch are removed first.
        - repeat:
            for_each: >-
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
              {%- set ns = namespace(k=[]) -%}
              {%- set hv = state_attr(_pr_house, 'variables') if _pr_house not in ['', 'unknown', 'unavailable'] else none -%}
              {%- if hv is mapping -%}
                {%- for k in hv.keys() if (k | string).startswith('product_unit_repair_') -%}{%- set ns.k = ns.k + [{'cab': _pr_house, 'key': k}] -%}{%- endfor -%}
              {%- endif -%}
              {%- set sv = state_attr(_pr_hh, 'variables') if _pr_hh != '' else none -%}
              {%- if sv is mapping -%}
                {%- for k in sv.keys() if (k | string).startswith('product_unit_repair_') and k != _pr_jkey -%}
                  {%- set v = CABS.cabinet_drawer_value(_pr_hh, k) | from_json -%}
                  {%- if v is mapping and v.get('status') == 'done' -%}{%- set ns.k = ns.k + [{'cab': _pr_hh, 'key': k}] -%}{%- endif -%}
                {%- endfor -%}
              {%- endif -%}
              {{ ns.k }}
            sequence:
            - action: script.zen_sutra_filecabinet
              continue_on_error: true
              data: {mode: delete, key: "{{ repeat.item.key }}", volume_entity_id: "{{ repeat.item.cab }}"}
        - variables:
            _pr_steps: "{{ _pr_j.get('steps', {}) }}"
            _pr_snap: "{{ _pr_j.get('stock') if _pr_j.get('stock') is sequence else _pr_stock }}"
            _pr_new: "{{ _pr_j.get('new_id') | int(0) }}"
            _pr_fail: ''
        # No journal but the product is already renamed: a run stopped before its journal
        # was written. Take over the new product only when it is unambiguous.
        - if: "{{ _pr_j | count == 0 and (_pr_p.get('name', '') | string).endswith(' (retired #' ~ (product_id_resolved | int) ~ ')') }}"
          then:
          - action: script.zen_sutra_grocy
            response_variable: _pr_adopt_raw
            continue_on_error: true
            data:
              action_type: read
              endpoint: "objects/products?query%5B%5D=name%3D{{ _pr_orig_name | urlencode }}&limit=500"
          - variables:
              _pr_adopt_ids: >-
                {%- set c = _pr_adopt_raw.get('result', {}).get('content') if _pr_adopt_raw is mapping and _pr_adopt_raw.get('status') == 'success' else none -%}
                {{ (c | map(attribute='id') | list) if c is sequence and c is not string else [] }}
          - if: "{{ _pr_adopt_ids | count == 1 }}"
            then:
            - action: script.zen_sutra_grocy
              response_variable: _pr_adopt_p
              continue_on_error: true
              data: {action_type: read, endpoint: "/objects/products/{{ _pr_adopt_ids[0] }}"}
            - action: script.zen_sutra_grocy
              response_variable: _pr_adopt_s
              continue_on_error: true
              data: {action_type: read, endpoint: "objects/stock?query%5B%5D=product_id%3D{{ _pr_adopt_ids[0] }}&limit=500"}
            - variables:
                _pr_adopt_ok: >-
                  {%- set ap = _pr_adopt_p.get('result', {}).get('content') if _pr_adopt_p is mapping else none -%}
                  {%- set st = _pr_adopt_s.get('result', {}).get('content') if _pr_adopt_s is mapping and _pr_adopt_s.get('status') == 'success' else none -%}
                  {{ ap is mapping and (ap.get('qu_id_stock') | int(0)) == _pr_unit and st is sequence and st is not string and st | count == 0 }}
            - if: "{{ _pr_adopt_ok }}"
              then:
              - variables:
                  _pr_new: "{{ _pr_adopt_ids[0] | int }}"
                  _pr_steps: "{{ dict(_pr_steps, renamed=true) }}"
          - if: "{{ _pr_new == 0 }}"
            then:
            - variables:
                final_response:
                  status: error
                  mode: product_unit_repair
                  product_id: "{{ product_id_resolved }}"
                  message: "Nothing was changed: this product is already renamed '(retired)' but has no journal, and no single product named '{{ _pr_orig_name }}' with this unit and no stock was found to continue with. Check the products with that name by hand."
                  tool: "{{ tool_name }}"
                  version: "{{ tool_version }}"
            - stop: product_unit_repair adopt refused
              response_variable: final_response
        - variables:
            _pr_jwrite: >-
              {{ {'old_id': product_id_resolved | int, 'name': _pr_orig_name, 'unit': _pr_unit, 'new_id': _pr_new if _pr_new > 0 else none,
                  'stock': _pr_snap, 'steps': _pr_steps, 'status': 'in_progress', 'updated_at': now().isoformat()} }}
        - action: script.zen_sutra_filecabinet
          response_variable: _pr_jw
          continue_on_error: true
          data: {mode: upsert, write_mode: replace, key: "{{ _pr_jkey }}", volume_entity_id: "{{ _pr_hh }}", value: "{{ _pr_jwrite | tojson }}"}
        # No journal, no repair: every later step relies on it to continue safely.
        - if: "{{ not (_pr_jw is mapping and (_pr_jw.get('status') == 'success' or (_pr_jw.get('result') is mapping and _pr_jw.result.get('status') == 'success'))) }}"
          then:
          - variables:
              final_response:
                status: error
                mode: product_unit_repair
                product_id: "{{ product_id_resolved }}"
                message: "Nothing was changed: the repair journal could not be written to {{ _pr_hh }}, and the repair does not run without it. Run it again."
                journal_answer: "{{ _pr_jw.get('message', _pr_jw.get('status')) if _pr_jw is mapping else 'no answer' }}"
                tool: "{{ tool_name }}"
                version: "{{ tool_version }}"
          - stop: product_unit_repair journal not written
            response_variable: final_response
        # 1. rename the old product (frees the name)
        - if: "{{ not _pr_steps.get('renamed') }}"
          then:
          - action: script.zen_sutra_grocy
            response_variable: _pr_w
            continue_on_error: true
            data:
              action_type: update
              endpoint: "/objects/products/{{ product_id_resolved }}"
              payload: >-
                {%- set s = _pr_p.get('qu_id_stock') -%}
                {%- set body = {'name': _pr_orig_name ~ ' (retired #' ~ (product_id_resolved | int) ~ ')'} -%}
                {#- A deleted but numeric stock unit: align the other units to it so Grocy's
                    default-conversion trigger has nothing to add (5.13.1). -#}
                {%- if s is not none and (s | int(0)) > 0 -%}
                  {%- set body = dict(body, qu_id_purchase=s | int, qu_id_consume=s | int, qu_id_price=s | int) -%}
                {%- endif -%}
                {{ body | tojson }}
          - variables:
              _pr_steps: "{{ dict(_pr_steps, renamed=(_pr_w is mapping and _pr_w.get('status') == 'success')) }}"
              _pr_fail: "{{ '' if (_pr_w is mapping and _pr_w.get('status') == 'success') else 'rename: ' ~ (_pr_w.get('result', {}).get('content', {}).get('error_message', '') if _pr_w is mapping else 'no answer') }}"
        # 2. create the new product
        - if: "{{ _pr_fail == '' and _pr_new == 0 }}"
          then:
          - action: script.zen_sutra_grocy
            response_variable: _pr_w
            continue_on_error: true
            data:
              action_type: create
              endpoint: /objects/products
              payload: >-
                {%- set ns = namespace(d={}) -%}
                {%- for k, v in _pr_p.items() if k not in ['id', 'row_created_timestamp', 'userfields', 'name', 'qu_id_stock', 'qu_id_purchase', 'qu_id_consume', 'qu_id_price'] -%}
                  {%- set ns.d = dict(ns.d, **{k: v}) -%}
                {%- endfor -%}
                {{ dict(ns.d, name=_pr_orig_name, active=1, qu_id_stock=_pr_unit, qu_id_purchase=_pr_unit, qu_id_consume=_pr_unit, qu_id_price=_pr_unit) | tojson }}
          - variables:
              _pr_new: "{{ (_pr_w.get('result', {}).get('content', {}).get('created_object_id') | int(0)) if _pr_w is mapping and _pr_w.get('status') == 'success' else 0 }}"
          - variables:
              _pr_fail: "{{ '' if _pr_new > 0 else 'create: ' ~ (_pr_w.get('result', {}).get('content', {}).get('error_message', '') if _pr_w is mapping else 'no answer') }}"
          - action: script.zen_sutra_filecabinet
            continue_on_error: true
            data: {mode: upsert, write_mode: replace, key: "{{ _pr_jkey }}", volume_entity_id: "{{ _pr_hh }}", value: "{{ dict(_pr_jwrite, new_id=(_pr_new if _pr_new > 0 else none), steps=_pr_steps, updated_at=now().isoformat()) | tojson }}"}
        # 3. userfields
        - if: "{{ _pr_fail == '' and not _pr_steps.get('userfields') and _pr_ufs | count > 0 }}"
          then:
          - action: script.zen_sutra_grocy
            response_variable: _pr_w
            continue_on_error: true
            data: {action_type: update, endpoint: "/userfields/products/{{ _pr_new }}", payload: "{{ _pr_ufs | tojson }}"}
          - variables:
              _pr_steps: "{{ dict(_pr_steps, userfields=(_pr_w is mapping and _pr_w.get('status') == 'success')) }}"
              _pr_fail: "{{ '' if (_pr_w is mapping and _pr_w.get('status') == 'success') else 'userfields: ' ~ (_pr_w.get('result', {}).get('content', {}).get('error_message', '') if _pr_w is mapping else 'no answer') }}"
        # 4. rebook stock on the new product, entry by entry (journaled per entry)
        - variables:
            _pr_added: "{{ _pr_j.get('added') if _pr_j.get('added') is sequence else [] }}"
        - if: "{{ _pr_fail == '' and not _pr_steps.get('stock_added') }}"
          then:
          - repeat:
              for_each: "{{ _pr_snap }}"
              sequence:
              - if: "{{ _pr_fail == '' and (repeat.item.id | string) not in (_pr_added | map('string') | list) }}"
                then:
                - action: script.zen_sutra_grocy
                  response_variable: _pr_w
                  continue_on_error: true
                  data:
                    action_type: create
                    endpoint: "/stock/products/{{ _pr_new }}/add"
                    payload: >-
                      {%- set e = repeat.item -%}
                      {{ {'amount': e.amount | float, 'best_before_date': e.best_before_date, 'purchased_date': e.purchased_date,
                          'price': e.price, 'location_id': e.location_id, 'shopping_location_id': e.shopping_location_id,
                          'note': e.note, 'transaction_type': 'purchase'} | tojson }}
                - variables:
                    _pr_added: "{{ _pr_added + ([repeat.item.id] if (_pr_w is mapping and _pr_w.get('status') == 'success') else []) }}"
                    _pr_fail: "{{ '' if (_pr_w is mapping and _pr_w.get('status') == 'success') else 'stock entry ' ~ repeat.item.id ~ ': ' ~ (_pr_w.get('result', {}).get('content', {}).get('error_message', '') if _pr_w is mapping else 'no answer') }}"
                - action: script.zen_sutra_filecabinet
                  continue_on_error: true
                  data: {mode: upsert, write_mode: replace, key: "{{ _pr_jkey }}", volume_entity_id: "{{ _pr_hh }}", value: "{{ dict(_pr_jwrite, new_id=_pr_new, steps=_pr_steps, added=_pr_added, updated_at=now().isoformat()) | tojson }}"}
          - variables:
              _pr_steps: "{{ dict(_pr_steps, stock_added=(_pr_fail == '' and (_pr_added | count) == (_pr_snap | count))) }}"
        # 5. zero the old product by inventory correction
        - if: "{{ _pr_fail == '' and not _pr_steps.get('old_zeroed') and _pr_stock | count > 0 }}"
          then:
          - action: script.zen_sutra_grocy
            response_variable: _pr_w
            continue_on_error: true
            data: {action_type: create, endpoint: "/stock/products/{{ product_id_resolved }}/inventory", payload: "{{ {'new_amount': 0} | tojson }}"}
          - variables:
              _pr_steps: "{{ dict(_pr_steps, old_zeroed=(_pr_w is mapping and _pr_w.get('status') == 'success')) }}"
              _pr_fail: "{{ '' if (_pr_w is mapping and _pr_w.get('status') == 'success') else 'zero old stock: ' ~ (_pr_w.get('result', {}).get('content', {}).get('error_message', '') if _pr_w is mapping else 'no answer') }}"
        # 6. repoint Grocy references (idempotent: each row is re-read by product id)
        - if: "{{ _pr_fail == '' }}"
          then:
          - repeat:
              for_each: >-
                {%- set u = _pr_unit -%}
                {%- set ns = namespace(w=[]) -%}
                {%- for r in (_pr_gref.get('barcode') or []) -%}{%- set ns.w = ns.w + [{'ep': 'objects/product_barcodes/' ~ r.id, 'body': dict({'product_id': _pr_new}, **({'qu_id': u} if r.get('qu_id') is not none and (r.qu_id | int(0)) not in _pr_unit_ids else {}))}] -%}{%- endfor -%}
                {%- for r in (_pr_gref.get('chore') or []) -%}{%- set ns.w = ns.w + [{'ep': 'objects/chores/' ~ r.id, 'body': {'product_id': _pr_new}}] -%}{%- endfor -%}
                {%- for r in (_pr_gref.get('recipe_ingredient') or []) -%}{%- set ns.w = ns.w + [{'ep': 'objects/recipes_pos/' ~ r.id, 'body': {'product_id': _pr_new, 'qu_id': u}}] -%}{%- endfor -%}
                {%- for r in (_pr_gref.get('shopping_list') or []) -%}{%- set ns.w = ns.w + [{'ep': 'objects/shopping_list/' ~ r.id, 'body': {'product_id': _pr_new, 'qu_id': u}}] -%}{%- endfor -%}
                {%- for r in (_pr_gref.get('meal_plan') or []) -%}{%- set ns.w = ns.w + [{'ep': 'objects/meal_plan/' ~ r.id, 'body': {'product_id': _pr_new, 'product_qu_id': u}}] -%}{%- endfor -%}
                {%- for r in (_pr_gref.get('child_product') or []) -%}{%- set ns.w = ns.w + [{'ep': 'objects/products/' ~ r.id, 'body': {'parent_product_id': _pr_new}}] -%}{%- endfor -%}
                {%- for r in _pr_uo_refs | selectattr('action', 'eq', 'repoint') -%}{%- set ns.w = ns.w + [{'ep': 'userfields/userentity-' ~ r.entity ~ '/' ~ r.object_id, 'body': {r.field: _pr_new | string}}] -%}{%- endfor -%}
                {{ ns.w }}
              sequence:
              - if: "{{ _pr_fail == '' }}"
                then:
                - action: script.zen_sutra_grocy
                  response_variable: _pr_w
                  continue_on_error: true
                  data: {action_type: update, endpoint: "/{{ repeat.item.ep }}", payload: "{{ repeat.item.body | tojson }}"}
                - variables:
                    _pr_fail: "{{ '' if (_pr_w is mapping and _pr_w.get('status') == 'success') else 'repoint ' ~ repeat.item.ep ~ ': ' ~ (_pr_w.get('result', {}).get('content', {}).get('error_message', '') if _pr_w is mapping else 'no answer') }}"
        # 7. repoint Room Manager safety through Room Manager
        - if: "{{ _pr_fail == '' }}"
          then:
          - repeat:
              for_each: "{{ _pr_rm }}"
              sequence:
              - if: "{{ _pr_fail == '' }}"
                then:
                - action: script.zen_dojotools_room_manager
                  response_variable: _pr_w
                  continue_on_error: true
                  data:
                    mode: set
                    area: "{{ repeat.item.area }}"
                    safety: "{{ dict(repeat.item.entry, grocy_product_id=_pr_new) | tojson }}"
                    caller_token: "{{ caller_token | default('') }}"
                - variables:
                    _pr_fail: >-
                      {%- set r = _pr_w.get('result', _pr_w) if _pr_w is mapping else {} -%}
                      {{ '' if (r is mapping and (r.get('status') | string | lower) in ['success', 'ok']) else 'room safety ' ~ repeat.item.area ~ ': ' ~ ((r.get('message') or r.get('error') or r.get('status')) if r is mapping else 'no answer') }}
        # 8. repoint Mealie foods through Kitchen
        - if: "{{ _pr_fail == '' }}"
          then:
          - repeat:
              for_each: "{{ _pr_foods }}"
              sequence:
              - if: "{{ _pr_fail == '' }}"
                then:
                - action: script.zen_dojotools_kitchen
                  response_variable: _pr_w
                  continue_on_error: true
                  data: {mode: run, case: foods_tag, item_id: "{{ repeat.item.food_id }}", grocy_product_id: "{{ _pr_new }}", caller_token: "{{ caller_token | default('') }}"}
                - variables:
                    _pr_fail: >-
                      {%- set r = _pr_w if _pr_w is mapping else {} -%}
                      {%- set st = (r.get('status') or r.get('result', {}).get('status') or '') | string | lower -%}
                      {{ '' if st in ['success', 'ok'] else 'mealie food ' ~ repeat.item.food_id ~ ': ' ~ (r.get('message') or r.get('error') or st or 'no answer') }}
        # 8b. Spa Manager re-provisions its catalog (finds parts by name, so the new product)
        - if: "{{ _pr_fail == '' and _pr_spa and (_pr_cab_hits | selectattr('drawer', 'eq', 'spa_config') | list | count) > 0 }}"
          then:
          - action: script.zen_dojotools_spamaster
            response_variable: _pr_w
            continue_on_error: true
            data: {mode: consumables, action: repoint, config_json: "{{ {'old_product_id': product_id_resolved | int, 'new_product_id': _pr_new} | tojson }}", caller_token: "{{ caller_token | default('') }}"}
          - variables:
              _pr_fail: >-
                {%- set r = _pr_w.get('result', _pr_w) if _pr_w is mapping else {} -%}
                {%- set st = ((r.get('result') or r.get('status') or '') | string | lower) if r is mapping else '' -%}
                {{ '' if st in ['repointed', 'nothing_to_repoint'] else 'spa repoint: ' ~ (st if st else 'no answer') }}
        # 9. retire the old product
        - if: "{{ _pr_fail == '' and not _pr_steps.get('retired') }}"
          then:
          - action: script.zen_sutra_grocy
            response_variable: _pr_w
            continue_on_error: true
            data: {action_type: update, endpoint: "/objects/products/{{ product_id_resolved }}", payload: "{{ {'active': 0} | tojson }}"}
          - variables:
              _pr_steps: "{{ dict(_pr_steps, retired=(_pr_w is mapping and _pr_w.get('status') == 'success')) }}"
              _pr_fail: "{{ '' if (_pr_w is mapping and _pr_w.get('status') == 'success') else 'retire: ' ~ (_pr_w.get('result', {}).get('content', {}).get('error_message', '') if _pr_w is mapping else 'no answer') }}"
        # 10. verify: no live reference to the old id, stock moved
        - variables:
            _pr_left: {}
            _pr_new_total: -1
            _pr_cab_left: []
        - if: "{{ _pr_fail == '' }}"
          then:
          - repeat:
              for_each:
              - {kind: stock, ep: "objects/stock"}
              - {kind: barcode, ep: "objects/product_barcodes"}
              - {kind: chore, ep: "objects/chores"}
              - {kind: recipe_ingredient, ep: "objects/recipes_pos"}
              - {kind: shopping_list, ep: "objects/shopping_list"}
              - {kind: meal_plan, ep: "objects/meal_plan"}
              - {kind: child_product, ep: "objects/products", field: parent_product_id}
              sequence:
              - action: script.zen_sutra_grocy
                response_variable: _pr_r
                continue_on_error: true
                data:
                  action_type: read
                  endpoint: "{{ repeat.item.ep }}?query%5B%5D={{ repeat.item.get('field', 'product_id') }}%3D{{ product_id_resolved | int }}&limit=500"
              - variables:
                  _pr_left: >-
                    {%- set c = _pr_r.get('result', {}).get('content') if _pr_r is mapping and _pr_r.get('status') == 'success' else none -%}
                    {%- if not (c is sequence and c is not string) -%}{{ dict(_pr_left, **{repeat.item.kind: 'unreadable'}) }}
                    {%- elif c | count > 0 -%}{{ dict(_pr_left, **{repeat.item.kind: c | count}) }}
                    {%- else -%}{{ _pr_left }}{%- endif -%}
          - action: script.zen_sutra_grocy
            response_variable: _pr_r
            continue_on_error: true
            data: {action_type: read, endpoint: "objects/stock?query%5B%5D=product_id%3D{{ _pr_new }}&limit=500"}
          - variables:
              _pr_new_total: >-
                {%- set c = _pr_r.get('result', {}).get('content') if _pr_r is mapping else none -%}
                {{ (c | map(attribute='amount') | map('float', 0) | sum | round(4)) if c is sequence and c is not string else -1 }}
              _pr_cab_left: >-
                {%- set pid = product_id_resolved | int -%}
                {%- set rx = '"(grocy_product_id|machine_product_id|product_id)": ?"?' ~ pid ~ '"?[,} ]' -%}
                {%- set ns = namespace(m=[]) -%}
                {%- for cab in label_entities('zen_cabinet') | select('match', 'sensor[.]') | list -%}
                  {%- set labs = labels(cab) -%}
                  {%- if 'zen_kata_cabinet' not in labs and (labs | select('search', 'history') | list | count) == 0 -%}
                    {%- set vars = state_attr(cab, 'variables') -%}
                    {%- if vars is mapping -%}
                      {%- for k, d in vars.items() if not (k | string).startswith('product_unit_repair_') -%}
                        {%- set js = d | tojson | replace('\\', '') -%}
                        {%- if js is search(rx) -%}{%- set ns.m = ns.m + [{'cabinet': cab, 'drawer': k | string}] -%}{%- endif -%}
                      {%- endfor -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.m }}
        - variables:
            _pr_verified: >-
              {{ _pr_fail == '' and _pr_left | count == 0
                 and (_pr_new_total | float(-1)) == (_pr_snap | map(attribute='amount') | map('float', 0) | sum | round(4))
                 and (_pr_cab_left | rejectattr('drawer', 'in', _pr_cab_keep | map(attribute='drawer') | list) | list | count) == 0 }}
        # A verified repair keeps no journal; an unfinished one keeps it to continue from.
        - if: "{{ _pr_verified }}"
          then:
          - action: script.zen_sutra_filecabinet
            continue_on_error: true
            data: {mode: delete, key: "{{ _pr_jkey }}", volume_entity_id: "{{ _pr_hh }}"}
          else:
          - action: script.zen_sutra_filecabinet
            continue_on_error: true
            data:
              mode: upsert
              write_mode: replace
              key: "{{ _pr_jkey }}"
              volume_entity_id: "{{ _pr_hh }}"
              value: "{{ dict(_pr_jwrite, new_id=(_pr_new if _pr_new > 0 else none), steps=_pr_steps, added=_pr_added, status='in_progress', last_error=_pr_fail, updated_at=now().isoformat()) | tojson }}"
        - if: "{{ _pr_verified }}"
          then:
          - variables:
              final_response:
                status: success
                old_id: "{{ product_id_resolved | int }}"
                new_id: "{{ _pr_new }}"
                moved: "{{ _pr_snap | map(attribute='amount') | map('float', 0) | sum | round(4) }}"
          - stop: product_unit_repair done
            response_variable: final_response
        - variables:
            final_response:
              status: "{{ 'success' if _pr_verified else 'error' }}"
              mode: product_unit_repair
              old_id: "{{ product_id_resolved | int }}"
              new_id: "{{ _pr_new if _pr_new > 0 else none }}"
              product: "{{ _pr_orig_name }}"
              verified: "{{ _pr_verified }}"
              steps: "{{ _pr_steps }}"
              stock_moved: "{{ {'entries': _pr_snap | count, 'total': _pr_snap | map(attribute='amount') | map('float', 0) | sum | round(4), 'new_total': _pr_new_total} }}"
              references_left_on_old: "{{ _pr_left }}"
              cabinet_refs_left: "{{ _pr_cab_left }}"
              opened_entries_not_carried: "{{ _pr_opened }}"
              message: >-
                {%- if _pr_verified -%}Repaired: {{ _pr_orig_name }} is now product {{ _pr_new }} with real units; stock and every reference moved, and #{{ product_id_resolved | int }} is retired with its history.
                {%- else -%}Not finished: {{ _pr_fail if _pr_fail != '' else 'verification found references or stock left behind (see references_left_on_old, cabinet_refs_left, stock_moved)' }}. The journal ({{ _pr_jkey }}) keeps the progress: fix the cause and run the same call again to continue.{%- endif -%}
              tool: "{{ tool_name }}"
              version: "{{ tool_version }}"
        - stop: product_unit_repair done
          response_variable: final_response

    # --- stock_bbd_audit (#10778): read only. Stock whose best-before is its purchase
    #     date on a product whose default shelf life is 0 days: the pattern a missing
    #     best-before left behind (Grocy books "0 days" as expiring the day it was bought).
    #     Each row is a suspect, not a verdict: some things do expire the same day. Fix one
    #     with stock_entry_update entry_id=<id> best_before_date=<real date> after a person
    #     confirms the date. Nothing is changed here.
    - alias: stock_bbd_audit — best-before equal to purchase date on 0-day products
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'stock_bbd_audit' }}"
        sequence:
        - variables:
            _sba_stock: []
            _sba_pg: 1
            _sba_done: false
        - repeat:
            while: "{{ not _sba_done and _sba_pg <= 20 }}"
            sequence:
            - action: script.zen_sutra_grocy
              response_variable: _sba_raw
              continue_on_error: true
              data:
                action_type: read
                endpoint: "objects/stock?limit=500&offset={{ (_sba_pg - 1) * 500 }}"
            - variables:
                _sba_items: "{{ (_sba_raw.get('result', {}).get('content') or []) if _sba_raw is mapping else [] }}"
                _sba_stock: "{{ _sba_stock + _sba_items }}"
                _sba_pg: "{{ _sba_pg + 1 }}"
                _sba_done: "{{ _sba_items | length < 500 }}"
        - variables:
            _sba_prods: []
            _sba_ppg: 1
            _sba_pdone: false
        - repeat:
            while: "{{ not _sba_pdone and _sba_ppg <= 20 }}"
            sequence:
            - action: script.zen_sutra_grocy
              response_variable: _sba_praw
              continue_on_error: true
              data:
                action_type: read
                endpoint: "objects/products?limit=500&offset={{ (_sba_ppg - 1) * 500 }}"
            - variables:
                _sba_pitems: "{{ (_sba_praw.get('result', {}).get('content') or []) if _sba_praw is mapping else [] }}"
                _sba_prods: "{{ _sba_prods + _sba_pitems }}"
                _sba_ppg: "{{ _sba_ppg + 1 }}"
                _sba_pdone: "{{ _sba_pitems | length < 500 }}"
        - variables:
            _sba_pmap: >-
              {%- set ns = namespace(m={}) -%}
              {%- for q in _sba_prods if q is mapping -%}
                {%- set ns.m = dict(ns.m, **{(q.get('id') | string): {'name': q.get('name'), 'dbd': q.get('default_best_before_days', 0) | int(0)}}) -%}
              {%- endfor -%}
              {{ ns.m }}
        - variables:
            _sba_rows: >-
              {%- set ns = namespace(o=[]) -%}
              {%- for s in _sba_stock if s is mapping -%}
                {%- set pr = _sba_pmap.get(s.get('product_id') | string, {}) -%}
                {%- set bbd = (s.get('best_before_date') or '') | string -%}
                {%- set pd = (s.get('purchased_date') or '') | string -%}
                {%- if bbd[:10] != '' and bbd[:10] == pd[:10] and pr.get('dbd', 0) == 0 and (s.get('amount', 0) | float(0)) > 0 -%}
                  {%- set ns.o = ns.o + [{'entry_id': s.get('id'), 'stock_id': s.get('stock_id'), 'product_id': s.get('product_id'), 'product': pr.get('name'),
                                          'amount': s.get('amount'), 'purchased_date': pd[:10], 'best_before_date': bbd[:10], 'location_id': s.get('location_id')}] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.o | sort(attribute='purchased_date', reverse=true) | list }}
        - variables:
            final_response:
              status: success
              mode: stock_bbd_audit
              read_only: true
              count: "{{ _sba_rows | count }}"
              suspects: "{{ _sba_rows[:200] }}"
              truncated: "{{ _sba_rows | count > 200 }}"
              fix: "Confirm the real date with a person, then stock_entry_update entry_id=<entry_id> best_before_date=<YYYY-MM-DD> (or 2999-12-31 for something that does not expire). One entry at a time; quantities, location and purchase date are kept."
        - stop: stock_bbd_audit done
          response_variable: final_response

    # --- stock_waste_expired (#10762): expired stock, by stock entry. dry_run (the
    #     default) lists every expired entry with its product, amount, best-before and
    #     location; an entry that looks like a false date (#10778: best-before equal to the
    #     purchase date on a 0-day product) is listed as excluded and never wasted. To waste,
    #     pass dry_run=false, confirm_action=true and entry_ids=[the entries a person
    #     approved]: only those, and only while they are still expired and eligible, are
    #     consumed as spoiled by their own stock entry, so newer batches stay. Each is read
    #     back.
    - alias: stock_waste_expired — preview, then waste approved expired entries
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'stock_waste_expired' }}"
        sequence:
        - variables:
            _swe_dry: "{{ dry_run | default(true) | bool }}"
            _swe_ids: >-
              {%- set v = entry_ids | default([], true) if entry_ids is defined else [] -%}
              {%- set v = (v | from_json([])) if (v is string and v | trim | first in ['[', '{']) else v -%}
              {%- set v = (v | string).split(',') if v is string else v -%}
              {{ (v if (v is sequence and v is not string) else []) | map('trim') | map('int', 0) | select('gt', 0) | list }}
            _swe_today: "{{ now().strftime('%Y-%m-%d') }}"
            _swe_pid: "{{ product_id_resolved | int(0) if product_id_resolved is not none else 0 }}"
            _swe_lid: "{{ location_id_resolved | int(0) if location_id_resolved is not none else 0 }}"
        - if: "{{ not _swe_dry and (not confirm_action_in or _swe_ids | count == 0) }}"
          then:
          - variables:
              final_response:
                status: error
                mode: stock_waste_expired
                message: "Wasting needs dry_run=false, confirm_action=true and entry_ids=[...] (the entries a person approved from the preview). Nothing was changed."
          - stop: stock_waste_expired refused
            response_variable: final_response
        - variables:
            _swe_stock: []
            _swe_pg: 1
            _swe_done: false
        - repeat:
            while: "{{ not _swe_done and _swe_pg <= 20 }}"
            sequence:
            - action: script.zen_sutra_grocy
              response_variable: _swe_raw
              continue_on_error: true
              data:
                action_type: read
                endpoint: "objects/stock?limit=500&offset={{ (_swe_pg - 1) * 500 }}"
            - variables:
                _swe_items: "{{ (_swe_raw.get('result', {}).get('content') or []) if _swe_raw is mapping else [] }}"
                _swe_stock: "{{ _swe_stock + _swe_items }}"
                _swe_pg: "{{ _swe_pg + 1 }}"
                _swe_done: "{{ _swe_items | length < 500 }}"
        - variables:
            _swe_prods: []
            _swe_ppg: 1
            _swe_pdone: false
        - repeat:
            while: "{{ not _swe_pdone and _swe_ppg <= 20 }}"
            sequence:
            - action: script.zen_sutra_grocy
              response_variable: _swe_praw
              continue_on_error: true
              data:
                action_type: read
                endpoint: "objects/products?limit=500&offset={{ (_swe_ppg - 1) * 500 }}"
            - variables:
                _swe_pitems: "{{ (_swe_praw.get('result', {}).get('content') or []) if _swe_praw is mapping else [] }}"
                _swe_prods: "{{ _swe_prods + _swe_pitems }}"
                _swe_ppg: "{{ _swe_ppg + 1 }}"
                _swe_pdone: "{{ _swe_pitems | length < 500 }}"
        - variables:
            _swe_pmap: >-
              {%- set ns = namespace(m={}) -%}
              {%- for q in _swe_prods if q is mapping -%}
                {%- set ns.m = dict(ns.m, **{(q.get('id') | string): {'name': q.get('name'), 'dbd': q.get('default_best_before_days', 0) | int(0)}}) -%}
              {%- endfor -%}
              {{ ns.m }}
        - variables:
            _swe_rows: >-
              {%- set ns = namespace(o=[]) -%}
              {%- for s in _swe_stock if s is mapping -%}
                {%- set pr = _swe_pmap.get(s.get('product_id') | string, {}) -%}
                {%- set bbd = ((s.get('best_before_date') or '') | string)[:10] -%}
                {%- set pd = ((s.get('purchased_date') or '') | string)[:10] -%}
                {%- if bbd != '' and bbd < _swe_today and bbd != '2999-12-31' and (s.get('amount', 0) | float(0)) > 0
                       and (_swe_pid == 0 or (s.get('product_id') | int(0)) == _swe_pid)
                       and (_swe_lid == 0 or (s.get('location_id') | int(0)) == _swe_lid) -%}
                  {%- set suspect = bbd == pd and pr.get('dbd', 0) == 0 -%}
                  {%- set ns.o = ns.o + [{'entry_id': s.get('id') | int(0), 'stock_id': s.get('stock_id'), 'product_id': s.get('product_id') | int(0), 'product': pr.get('name'),
                                          'amount': s.get('amount') | float(0), 'best_before_date': bbd, 'purchased_date': pd, 'location_id': s.get('location_id'),
                                          'days_expired': ((strptime(_swe_today, '%Y-%m-%d') - strptime(bbd, '%Y-%m-%d')).days) if bbd is match('^[0-9]{4}-[0-9]{2}-[0-9]{2}$') else none,
                                          'eligible': not suspect,
                                          'excluded_because': ('best-before equals the purchase date on a 0-day product: likely a false date (stock_bbd_audit), not spoilage') if suspect else none}] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.o | sort(attribute='best_before_date') | list }}
        - if: "{{ _swe_dry }}"
          then:
          - variables:
              final_response:
                status: preview
                mode: stock_waste_expired
                dry_run: true
                message: "Preview only. Nothing was changed. To waste, pass dry_run=false, confirm_action=true and entry_ids=[the eligible entries a person approved]."
                summary:
                  expired: "{{ _swe_rows | count }}"
                  eligible: "{{ _swe_rows | selectattr('eligible') | list | count }}"
                  excluded: "{{ _swe_rows | rejectattr('eligible') | list | count }}"
                entries: "{{ _swe_rows[:200] }}"
                truncated: "{{ _swe_rows | count > 200 }}"
          - stop: stock_waste_expired preview
            response_variable: final_response
        - variables:
            _swe_go: "{{ _swe_rows | selectattr('eligible') | selectattr('entry_id', 'in', _swe_ids) | list }}"
            _swe_results: >-
              {%- set ok = _swe_rows | selectattr('eligible') | map(attribute='entry_id') | list -%}
              {%- set ns = namespace(o=[]) -%}
              {%- for i in _swe_ids if i not in ok -%}
                {%- set ns.o = ns.o + [{'entry_id': i, 'status': 'not_eligible', 'reason': 'not an expired, eligible entry right now (see the preview)'}] -%}
              {%- endfor -%}
              {{ ns.o }}
        - repeat:
            for_each: "{{ _swe_go }}"
            sequence:
              - action: script.zen_sutra_grocy
                response_variable: _swe_c_raw
                continue_on_error: true
                data:
                  action_type: create
                  endpoint: "/stock/products/{{ repeat.item.product_id }}/consume"
                  payload: "{{ {'amount': repeat.item.amount, 'spoiled': true, 'transaction_type': 'consume', 'stock_entry_id': repeat.item.stock_id} | tojson }}"
              - action: script.zen_sutra_grocy
                response_variable: _swe_rb_raw
                continue_on_error: true
                data:
                  action_type: read
                  endpoint: "objects/stock?query%5B%5D=id={{ repeat.item.entry_id }}"
              - variables:
                  _swe_http: "{{ ((_swe_c_raw.get('result', {}) or {}).get('status', 0) | int(0)) if _swe_c_raw is mapping else 0 }}"
                  _swe_left: >-
                    {%- set c = (_swe_rb_raw.get('result', {}) or {}).get('content') if _swe_rb_raw is mapping else none -%}
                    {%- set c = (c | select('mapping') | list) if (c is sequence and c is not string) else [] -%}
                    {{ (c | map(attribute='amount') | map('float', 0) | sum) if c | count > 0 else 0 }}
              - variables:
                  _swe_results: >-
                    {{ _swe_results + [repeat.item | combine({
                         'status': ('wasted' if (_swe_left | float(0)) < 0.0001 else 'unverified') if (200 <= (_swe_http | int(0)) < 300) else 'failed',
                         'http_status': _swe_http, 'amount_left': _swe_left,
                         'reason': ('' if (_swe_left | float(0)) < 0.0001 else 'the entry still holds stock after the consume') if (200 <= (_swe_http | int(0)) < 300) else ('grocy answered HTTP ' ~ _swe_http)})] }}
        - variables:
            final_response:
              status: "{{ 'success' if (_swe_results | selectattr('status', 'eq', 'wasted') | list | count) == (_swe_results | count) else ('partial' if (_swe_results | selectattr('status', 'eq', 'wasted') | list | count) > 0 else 'error') }}"
              mode: stock_waste_expired
              dry_run: false
              summary:
                asked: "{{ _swe_ids | count }}"
                wasted: "{{ _swe_results | selectattr('status', 'eq', 'wasted') | list | count }}"
                not_done: "{{ _swe_results | rejectattr('status', 'eq', 'wasted') | list | count }}"
              results: "{{ _swe_results }}"
        - stop: stock_waste_expired done
          response_variable: final_response

    - alias: stock_audit_perishable — find never-expires stock in perishable locations
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'stock_audit_perishable' }}"
        sequence:
        - variables:
            _sap_all_locs: []
            _sap_locs_page: 1
            _sap_locs_done: false
        - repeat:
            while: "{{ not _sap_locs_done and _sap_locs_page <= 20 }}"
            sequence:
            - action: script.zen_sutra_grocy
              response_variable: _sap_locs_raw
              continue_on_error: true
              data:
                action_type: read
                endpoint: "objects/locations?limit=500&offset={{ (_sap_locs_page - 1) * 500 }}&query%5B%5D=active=1"
            - variables:
                _sap_locs_page_items: "{{ (_sap_locs_raw.get('result', {}).get('content') or []) if _sap_locs_raw is mapping else [] }}"
                _sap_all_locs: "{{ _sap_all_locs + _sap_locs_page_items }}"
                _sap_locs_page: "{{ _sap_locs_page + 1 }}"
                _sap_locs_done: "{{ _sap_locs_page_items | length < 500 }}"
        - variables:
            _sap_all_stock: []
            _sap_stock_page: 1
            _sap_stock_done: false
        - repeat:
            while: "{{ not _sap_stock_done and _sap_stock_page <= 20 }}"
            sequence:
            - action: script.zen_sutra_grocy
              response_variable: _sap_stock_raw
              continue_on_error: true
              data:
                action_type: read
                endpoint: "objects/stock?limit=500&offset={{ (_sap_stock_page - 1) * 500 }}"
            - variables:
                _sap_stock_page_items: "{{ (_sap_stock_raw.get('result', {}).get('content') or []) if _sap_stock_raw is mapping else [] }}"
                _sap_all_stock: "{{ _sap_all_stock + _sap_stock_page_items }}"
                _sap_stock_page: "{{ _sap_stock_page + 1 }}"
                _sap_stock_done: "{{ _sap_stock_page_items | length < 500 }}"
        - variables:
            _sap_never_products: []
            _sap_never_page: 1
            _sap_never_done: false
        - repeat:
            while: "{{ not _sap_never_done and _sap_never_page <= 20 }}"
            sequence:
            - action: script.zen_sutra_grocy
              response_variable: _sap_never_raw
              continue_on_error: true
              data:
                action_type: read
                endpoint: "objects/products?limit=500&offset={{ (_sap_never_page - 1) * 500 }}&query%5B%5D=default_best_before_days=-1"
            - variables:
                _sap_never_page_items: "{{ (_sap_never_raw.get('result', {}).get('content') or []) if _sap_never_raw is mapping else [] }}"
                _sap_never_products: "{{ _sap_never_products + _sap_never_page_items }}"
                _sap_never_page: "{{ _sap_never_page + 1 }}"
                _sap_never_done: "{{ _sap_never_page_items | length < 500 }}"
        - variables:
            _sap_perishable_ids: >-
              {%- set ns = namespace(ids=[]) -%}
              {%- for loc in _sap_all_locs -%}
                {%- if (loc.get('active') | int(1)) == 1 and (loc.get('userfields') or {}).get('catalog_class') == 'perishable_storage' -%}
                  {%- set ns.ids = ns.ids + [loc.id | int] -%}
                  {%- set _children_raw = (loc.get('userfields') or {}).get('grocy_child_location_ids') -%}
                  {%- if _children_raw and _children_raw | trim not in ['', '[]', 'null'] -%}
                    {%- set _children = _children_raw if (_children_raw is sequence and _children_raw is not string) else (_children_raw | from_json(none) | default([])) -%}
                    {%- for cid in (_children if _children is sequence else []) -%}
                      {%- if cid | string | trim | regex_search('^-?\d+$') -%}
                        {%- set _co = _sap_all_locs | selectattr('id', 'equalto', cid | int) | list | first | default(none) -%}
                        {%- set _co2 = _sap_all_locs | selectattr('id', 'equalto', cid | string) | list | first | default(_co) -%}
                        {%- set _child = _co2 if _co2 is mapping else (_co if _co is mapping else {}) -%}
                        {%- if (_child.get('userfields') or {}).get('catalog_class') != 'non_perishable' -%}
                          {%- set ns.ids = ns.ids + [cid | int] -%}
                        {%- endif -%}
                      {%- endif -%}
                    {%- endfor -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.ids | unique | list }}
            _sap_never_ids: >-
              {{ _sap_never_products | map(attribute='id') | map('int') | list }}
        - variables:
            _sap_violations: >-
              {%- set ns = namespace(items=[]) -%}
              {%- for entry in _sap_all_stock -%}
                {%- set lid = entry.get('location_id') | int(0) -%}
                {%- set pid = entry.get('product_id') | int(0) -%}
                {%- if lid in _sap_perishable_ids and pid in _sap_never_ids -%}
                  {%- set prod = _sap_never_products | selectattr('id', 'equalto', pid) | list | first | default(none) -%}
                  {%- set prod2 = _sap_never_products | selectattr('id', 'equalto', pid | string) | list | first | default(prod) -%}
                  {%- set loc = _sap_all_locs | selectattr('id', 'equalto', lid) | list | first | default(none) -%}
                  {%- set loc2 = _sap_all_locs | selectattr('id', 'equalto', lid | string) | list | first | default(loc) -%}
                  {%- set _prod = prod2 if prod2 is mapping else (prod if prod is mapping else {}) -%}
                  {%- set _loc = loc2 if loc2 is mapping else (loc if loc is mapping else {}) -%}
                  {%- set ns.items = ns.items + [{
                    'product_id': pid,
                    'product_name': _prod.get('name', 'Unknown'),
                    'location_id': lid,
                    'location_name': _loc.get('name', 'Unknown'),
                    'amount': entry.get('amount'),
                    'best_before_date': entry.get('best_before_date'),
                    'fix': "update_product_meta item='" ~ _prod.get('name', 'Unknown') ~ "' best_before_days=N"
                  }] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.items }}
        - variables:
            final_response:
              status: ok
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              mode: stock_audit_perishable
              perishable_location_ids: '{{ _sap_perishable_ids }}'
              never_expires_product_count: '{{ _sap_never_ids | length }}'
              violations:
                count: '{{ _sap_violations | length }}'
                items: '{{ _sap_violations }}'
                summary: >-
                  {{ 'No violations — all products in perishable locations have expiry tracking.'
                     if _sap_violations | length == 0 else
                     (_sap_violations | length | string) ~ ' product(s) marked never-expires (-1) stocked at a perishable location. Use fix command to add expiry tracking.' }}
        - stop: stock_audit_perishable done
          response_variable: final_response

    - alias: Call Grocy API (if not barred by endpoint)
      choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm not in [''catalog_find_product'', ''catalog_search'', ''catalog_add_product'', ''catalog_delete_product'', ''locations_reparent_bulk'', ''locations_delete_safe'', ''locations_hierarchy_rebuild'', ''stock_register_asset'', ''stock_area_summary'', ''stock_area_volatile'', ''stock_area_inventory'', ''chores_by_area'', ''room_brief'', ''chores_add'', ''chores_tag'', ''products_tag'', ''catalog_find_by_tag'', ''object_lens'', ''chores_delete'', ''chores_edit'', ''tasks_add'', ''tasks_tag'', ''update_product_meta'', ''provision_bom'', ''product_refs_get'', ''product_ref_add'', ''product_ref_remove'', ''catalog_find_by_barcode'', ''by_anchor'', ''batteries_due'', ''battery_status'', ''battery_overdue'', ''battery_replace'', ''stock_audit_perishable'', ''stock_bbd_audit'', ''product_unit_repair'', ''product_unit_audit'', ''stock_waste_expired'', ''receipt_intake''] }}'
          alias: Not 'catalog_find_product'
        sequence:
        - action: script.zen_sutra_grocy
          response_variable: grocy_response
          data: '{{ payload_data }}'
    - variables:
        _seu_error: "{{ none }}"
        _seu_row: "{{ none }}"
    - alias: 'stock_entry_update: read the entry back and confirm the write persisted'
      if:
      - condition: template
        value_template: "{{ mode_norm == 'stock_entry_update' and current_entry_base is mapping }}"
      then:
      - action: script.zen_sutra_grocy
        response_variable: _seu_readback
        data:
          action_type: read
          endpoint: "stock/products/{{ current_entry_base.product_id }}/entries"
      - variables:
          _seu_write_status: "{{ grocy_response.get('status') if grocy_response is mapping else 'error' }}"
          _seu_rows: "{{ (_seu_readback['result']['content'] | default([])) if _seu_readback is mapping and _seu_readback.get('result') is mapping else [] }}"
          _seu_want: >-
            {{ {'best_before_date': (bbd_in if bbd_in is not none else current_entry_base.best_before_date) | string,
                'location_id': (location_id_resolved if location_id_resolved is not none else current_entry_base.location_id) | int(0),
                'amount': (amt_in if has_explicit_amount else current_entry_base.amount) | float(0),
                'purchased_date': current_entry_base.purchased_date | string} }}
      - variables:
          _seu_row: >-
            {% set by_id = _seu_rows | selectattr('id', 'equalto', current_entry_base.id | int) | list %}
            {% set by_sid = _seu_rows | selectattr('stock_id', 'equalto', current_entry_base.stock_id) | list %}
            {% set by_match = _seu_rows | selectattr('best_before_date', 'equalto', _seu_want.best_before_date) | list %}
            {{ (by_id + by_sid + by_match) | first | default(none) }}
      - variables:
          _seu_error: >-
            {% if _seu_write_status != 'success' %}
              {{ {'code': 'STOCK_ENTRY_WRITE_FAILED', 'message': 'Grocy rejected the stock entry update. Nothing was changed.', 'entry_id': current_entry_base.id, 'details': grocy_response} }}
            {% elif _seu_row is not mapping %}
              {{ {'code': 'STOCK_ENTRY_UNVERIFIED', 'message': 'The stock entry could not be found after the write, so the change is not confirmed.', 'entry_id': current_entry_base.id} }}
            {% elif _seu_row.best_before_date | string != _seu_want.best_before_date
                 or _seu_row.location_id | int(0) != _seu_want.location_id
                 or _seu_row.purchased_date | string != _seu_want.purchased_date
                 or (_seu_row.amount | float(0)) < _seu_want.amount - 0.0001 %}
              {{ {'code': 'STOCK_ENTRY_NOT_PERSISTED', 'message': 'Grocy accepted the call but the entry does not show the requested values.', 'entry_id': current_entry_base.id, 'expected': _seu_want, 'persisted': _seu_row} }}
            {% else %}
              {{ none }}
            {% endif %}
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm == ''locations_add'' }}'
          alias: Capture new location id
        sequence:
        - variables:
            location_id_resolved: "{% if grocy_response is mapping and 'result' in grocy_response
              and grocy_response['result'] is mapping and 'content' in grocy_response['result']
              and grocy_response['result']['content'] is mapping %}\n  {% if 'created_object_id'
              in grocy_response['result']['content'] %}\n    {{ grocy_response['result']['content']['created_object_id']
              }}\n  {% elif 'id' in grocy_response['result']['content'] %}\n    {{ grocy_response['result']['content']['id']
              }}\n  {% else %}\n    {{ none }}\n  {% endif %}\n{% else %}\n  {{ none }}\n{% endif %}"
      alias: Resolve new Location ID
    - alias: 'locations_add — inherit parent homeassistant_area if not provided'
      choose:
      - conditions:
        - condition: template
          value_template: >-
            {{ mode_norm == 'locations_add'
               and not has_area_id
               and parent_lid_resolved is not none }}
        sequence:
        - action: script.zen_sutra_grocy
          response_variable: _inherit_area_raw
          continue_on_error: true
          data:
            action_type: read
            endpoint: /objects/locations/{{ parent_lid_resolved }}
        - variables:
            _parent_area: >-
              {%- set _c = _inherit_area_raw['result']['content']
                 if (_inherit_area_raw is mapping
                     and _inherit_area_raw.get('result', {})
                              .get('content') is mapping)
                 else {} -%}
              {{ _c.get('userfields', {}).get('homeassistant_area', none) }}
        - variables:
            area_id_norm: >-
              {{ _parent_area
                 if (_parent_area is string and _parent_area | length > 0)
                 else area_id_norm }}
            has_area_id: >-
              {{ true
                 if (_parent_area is string and _parent_area | length > 0)
                 else has_area_id }}
    - alias: Add Location Metadata if necessary
      choose:
      - conditions:
        - alias: locations_add → apply metadata
          condition: template
          value_template: "{{ mode_norm == 'locations_add'\n   and location_id_resolved
            is not none\n   and (\n     parent_lid_resolved is not none\n     or has_area_id\n
            \    or placement_priority_in is not none\n     or has_note\n   ) }}"
        sequence:
        - action: script.zen_sutra_grocy
          response_variable: metadata_response
          data:
            action_type: update
            endpoint: /userfields/locations/{{ location_id_resolved }}
            payload: "{{\n  dict(\n    (\n      [\n        ('grocy_parent_location_id',
              parent_lid_resolved),\n        ('homeassistant_area', area_id_norm if
              has_area_id else none),\n        ('grocy_location_subclass', loc_sub_norm),\n
              \       ('placement_priority', placement_priority_in),\n        ('note',
              note_in if has_note else none)\n      ]\n      | selectattr(1)\n      |
              list\n    )\n  )\n}}"
    - alias: 'PC sync — register child with new parent'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm in ['locations_metadata_set', 'locations_add']\n             and parent_lid_resolved is not none\n             and location_id_resolved is not none }}"
        sequence:
        - action: script.zen_sutra_grocy
          response_variable: js_register_raw
          data:
            action_type: read
            endpoint: /objects/locations?limit=500&offset=0
        - variables:
            _js_new_kids: "{{ js_register_raw['result']['content'] | selectattr('userfields.grocy_parent_location_id', 'equalto', parent_lid_resolved | string) | map(attribute='id') | map('int') | unique | sort | list }}"
        - action: script.zen_sutra_grocy
          data:
            action_type: update
            endpoint: /userfields/locations/{{ parent_lid_resolved }}
            payload: "{{ dict([('grocy_child_location_ids', '[' ~ (_js_new_kids | join(',')) ~ ']')]) }}"
    - alias: 'PC sync — evict child from old parent'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'locations_metadata_set'\n             and parent_lid_resolved is not none\n             and child_old_parent_lid is defined\n             and child_old_parent_lid is not none\n             and (child_old_parent_lid | int) != (parent_lid_resolved | int) }}"
        sequence:
        - action: script.zen_sutra_grocy
          response_variable: js_evict_raw
          data:
            action_type: read
            endpoint: /objects/locations?limit=500&offset=0
        - variables:
            _js_old_kids: "{{ js_evict_raw['result']['content'] | selectattr('userfields.grocy_parent_location_id', 'equalto', child_old_parent_lid | string) | map(attribute='id') | map('int') | unique | sort | list }}"
        - action: script.zen_sutra_grocy
          data:
            action_type: update
            endpoint: /userfields/locations/{{ child_old_parent_lid }}
            payload: "{{ dict([('grocy_child_location_ids', '[' ~ (_js_old_kids | join(',')) ~ ']')]) }}"
    - alias: 'PC sync — evict deleted child from parent'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'locations_delete' and _deleted_loc_parent_id is not none }}"
        sequence:
        - action: script.zen_sutra_grocy
          response_variable: js_del_evict_raw
          data:
            action_type: read
            endpoint: /objects/locations?limit=500&offset=0
        - variables:
            _js_del_kids: "{{ js_del_evict_raw['result']['content'] | selectattr('userfields.grocy_parent_location_id', 'equalto', _deleted_loc_parent_id | string) | map(attribute='id') | map('int') | unique | sort | list }}"
        - action: script.zen_sutra_grocy
          data:
            action_type: update
            endpoint: /userfields/locations/{{ _deleted_loc_parent_id }}
            payload: "{{ dict([('grocy_child_location_ids', '[' ~ (_js_del_kids | join(',')) ~ ']')]) }}"
    - alias: 'Location embed — write homeassistant_area into main locations table'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'locations_metadata_set'
                             and location_id_resolved is not none
                             and has_area_id }}"
        sequence:
        - action: script.zen_sutra_grocy
          response_variable: _le_loc_raw
          continue_on_error: true
          data:
            action_type: read
            endpoint: "/objects/locations/{{ location_id_resolved }}"
        - variables:
            _le_loc_obj: >-
              {%- set _c = _le_loc_raw.get('result', {}).get('content', {}) -%}
              {{ _c if _c is mapping else {} }}
        - if: "{{ _le_loc_obj | length > 0 }}"
          then:
            - variables:
                _le_uf_base: >-
                  {{ _le_loc_obj.get('userfields', {}) if _le_loc_obj.get('userfields') is mapping else {} }}
            - variables:
                _le_uf_merged: "{{ _le_uf_base | combine({'homeassistant_area': area_id_norm}) }}"
            - variables:
                _le_loc_patch: >-
                  {%- set ns = namespace(p={}) -%}
                  {%- for k, v in _le_loc_obj.items() -%}
                    {%- if k not in ['userfields', 'row_created_timestamp'] -%}
                      {%- set ns.p = ns.p | combine({k: v}) -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {%- set ns.p = ns.p | combine({'userfields': _le_uf_merged}) -%}
                  {{ ns.p | tojson }}
            - action: script.zen_sutra_grocy
              response_variable: _le_embed_raw
              continue_on_error: true
              data:
                action_type: update
                endpoint: "/objects/locations/{{ location_id_resolved }}"
                payload: "{{ _le_loc_patch }}"
    - alias: 'stock_register_asset — 1-call physical asset registration'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'stock_register_asset' }}"
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ location_id_resolved is none }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: stock_register_asset
                  message: location or location_id is required.
                  coaching:
                  - Provide location name or location_id.
            - stop: Asset Location Required
              response_variable: final_response
        - action: script.zen_sutra_grocy
          response_variable: _asset_dupe_raw
          data:
            action_type: read
            endpoint: objects/products?query%5B%5D=name={{ item_norm }}
        - variables:
            _asset_dupe_list: "{{ _asset_dupe_raw['result']['content'] | default([]) }}"
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _asset_dupe_list | length > 0 and not confirm_action_in }}"
            sequence:
            - variables:
                final_response:
                  status: dupe_guard
                  mode: stock_register_asset
                  message: A product with this name already exists.
                  candidates: "{{ _asset_dupe_list | map(attribute='name') | list }}"
                  candidate_ids: "{{ _asset_dupe_list | map(attribute='id') | list }}"
                  coaching:
                  - To stock an existing product, use stock_buy_product instead.
                  - To register a new asset with this name, add confirm_action true.
            - stop: Asset Dupe Guard
              response_variable: final_response
        - variables:
            _asset_desc_parts: "{{ ([note_in] if note_in is string and note_in | length > 0 else [])
              + (['Brand: ' ~ brand] if brand is defined and brand else [])
              + (['Serial: ' ~ sku] if sku is defined and sku else [])
              + (['Est. value: $' ~ price_in] if price_in is not none else []) }}"
            _asset_desc: "{{ _asset_desc_parts | join(' | ') }}"
        - action: script.zen_sutra_grocy
          response_variable: _asset_create_raw
          data:
            action_type: post
            endpoint: /objects/products
            payload: "{{ {'name': item_norm, 'description': _asset_desc, 'location_id': location_id_resolved, 'qu_id_purchase': unit_id_resolved, 'qu_id_stock': unit_id_resolved} }}"
        - variables:
            _asset_pid: "{% set c = _asset_create_raw['result']['content'] | default({}) %}
              {{ c.get('created_object_id', c.get('id', none)) | int(none) }}"
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _asset_pid is none }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: stock_register_asset
                  message: Grocy product creation failed.
                  coaching:
                  - Check Grocy connection and try again.
            - stop: Asset Create Failed
              response_variable: final_response
        - action: script.zen_sutra_grocy
          response_variable: _asset_stock_raw
          data:
            action_type: post
            endpoint: /stock/products/{{ _asset_pid }}/add
            payload: "{{ {'amount': 1, 'location_id': location_id_resolved, 'best_before_date': '2999-12-31', 'transaction_type': 'purchase'} }}"
        - variables:
            _asset_hazmat_logged: false
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ hazmat_class_in is not none }}"
            sequence:
            - action: script.zen_sutra_grocy
              response_variable: _asset_loc_raw
              data:
                action_type: read
                endpoint: /objects/locations/{{ location_id_resolved }}
            - variables:
                _asset_loc_area: "{{ ((_asset_loc_raw['result']['content'].get('userfields') or {}) if _asset_loc_raw['result']['content'] is mapping else {}).get('homeassistant_area') | default(none, true) }}"
            - choose:
              - conditions:
                - condition: template
                  value_template: "{{ _asset_loc_area is not none and _asset_loc_area | length > 0 }}"
                sequence:
                - action: script.zen_dojotools_room_manager
                  data:
                    mode: set
                    area: "{{ _asset_loc_area }}"
                    safety: "{{ {'name': item_norm ~ ' (hazmat)', 'type': 'other', 'location_note': hazmat_class_in ~ ' — see Grocy location ' ~ location_id_resolved, 'grocy_location_id': location_id_resolved | string} }}"
                - variables:
                    _asset_hazmat_logged: true
        - variables:
            final_response:
              status: success
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              mode: stock_register_asset
              result:
                product_id: '{{ _asset_pid }}'
                name: '{{ item_norm }}'
                location_id: '{{ location_id_resolved }}'
                stocked: 1
                best_before_date: '2999-12-31'
                hazmat_logged: '{{ _asset_hazmat_logged }}'
        - stop: Asset Registration Complete
          response_variable: final_response

    - alias: 'catalog_add_product — create product with 0 stock'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'catalog_add_product' }}"
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ location_id_resolved is none }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: catalog_add_product
                  message: location or location_id is required.
                  coaching:
                  - Provide location name or location_id (default storage location for new stock).
            - stop: Product Location Required
              response_variable: final_response
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ unit_id_resolved is none }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: catalog_add_product
                  message: unit is required — product cannot be created without a stock unit (qu_id_stock would be null, blocking all stock operations).
                  coaching:
                  - Provide unit= (e.g. unit=each, unit=gram, unit=sheet, unit=pack).
                  - Use mode=units_list to see available units and their IDs.
            - stop: Product Stock Unit Required
              response_variable: final_response
        - action: script.zen_sutra_grocy
          response_variable: _cprod_dupe_raw
          data:
            action_type: read
            endpoint: objects/products?query%5B%5D=name={{ item_norm }}
        - variables:
            _cprod_dupe_list: "{{ _cprod_dupe_raw['result']['content'] | default([]) }}"
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _cprod_dupe_list | length > 0 and not confirm_action_in }}"
            sequence:
            - variables:
                final_response:
                  status: dupe_guard
                  mode: catalog_add_product
                  message: A product with this name already exists.
                  candidates: "{{ _cprod_dupe_list | map(attribute='name') | list }}"
                  candidate_ids: "{{ _cprod_dupe_list | map(attribute='id') | list }}"
                  coaching:
                  - To add stock to an existing product use stock_buy_product.
                  - To create with the same name pass confirm_action true.
            - stop: Product Dupe Guard
              response_variable: final_response
        - variables:
            _cprod_desc_parts: "{{ ([note_in] if note_in is string and note_in | length > 0 else [])
              + (['Brand: ' ~ brand] if brand is defined and brand else [])
              + (['SKU: ' ~ sku] if sku is defined and sku else [])
              + (['Est. value: $' ~ price_in] if price_in is not none else []) }}"
            _cprod_desc: "{{ _cprod_desc_parts | join(' | ') }}"
        - action: script.zen_sutra_grocy
          response_variable: _cprod_create_raw
          data:
            action_type: post
            endpoint: /objects/products
            payload: "{{ {'name': item_norm, 'description': _cprod_desc, 'location_id': location_id_resolved, 'qu_id_purchase': unit_id_resolved, 'qu_id_stock': unit_id_resolved} | combine({'parent_product_id': parent_product_id_resolved} if parent_product_id_resolved is not none else {}) }}"
        - variables:
            _cprod_pid: "{% set c = _cprod_create_raw['result']['content'] | default({}) %}
              {{ c.get('created_object_id', c.get('id', none)) | int(none) }}"
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _cprod_pid is none }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: catalog_add_product
                  message: Grocy product creation failed.
                  coaching:
                  - Check Grocy connection and try again.
            - stop: Product Create Failed
              response_variable: final_response
        - variables:
            final_response:
              status: success
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              mode: catalog_add_product
              result:
                product_id: '{{ _cprod_pid }}'
                name: '{{ item_norm }}'
                location_id: '{{ location_id_resolved }}'
                stocked: 0
              ha_labels_warning: "Product created without ha_labels — not visible to zen_dojotools_plant mode=managed or label queries. Call products_tag with ha_labels=<root_label> to register it."
              varietal_hint: "To link as a brand/varietal under a parent product later: update_product_meta item='{{ item_norm }}' parent_product='<base name>'"
        - stop: Product Catalog Add Complete
          response_variable: final_response
    - alias: 'catalog_delete_product — delete product, gated on no-stock or confirm'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'catalog_delete_product' }}"
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ product_id_resolved is none }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: catalog_delete_product
                  message: product_id or item is required.
                  coaching:
                  - Pass item=<name> or product_id=<id> to identify the product.
            - stop: Product ID Required
              response_variable: final_response
        - action: script.zen_sutra_grocy
          response_variable: _cdel_stock_raw
          data:
            action_type: read
            endpoint: "/stock/products/{{ product_id_resolved }}"
        - variables:
            _cdel_content: >-
              {{ _cdel_stock_raw['result']['content']
                 if (_cdel_stock_raw is mapping
                     and _cdel_stock_raw.get('result', {}).get('content') is mapping)
                 else {} }}
        - variables:
            _cdel_stock_amt: "{{ _cdel_content.get('stock_amount', 0) | float(0) }}"
            _cdel_product_name: "{{ _cdel_content.get('product', {}).get('name', item_norm) }}"
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _cdel_stock_amt > 0 and pid_keep_in is not none }}"
            sequence:
            - action: script.zen_sutra_grocy
              response_variable: _cdel_merge_raw
              data:
                action_type: create
                endpoint: "/stock/products/{{ pid_keep_in }}/merge/{{ product_id_resolved }}"
                payload: "{}"
            - variables:
                final_response:
                  status: merged
                  mode: catalog_delete_product
                  message: Stock merged into target product; source product deleted.
                  removed_product_id: "{{ product_id_resolved }}"
                  removed_product_name: "{{ _cdel_product_name }}"
                  merged_into_product_id: "{{ pid_keep_in }}"
                  stock_amount_transferred: "{{ _cdel_stock_amt }}"
            - stop: Product Merged and Deleted
              response_variable: final_response
          - conditions:
            - condition: template
              value_template: "{{ _cdel_stock_amt > 0 and not confirm_action_in }}"
            sequence:
            - variables:
                final_response:
                  status: stock_guard
                  mode: catalog_delete_product
                  message: "Product has stock. Merge into another product or confirm to delete."
                  product_id: "{{ product_id_resolved }}"
                  name: "{{ _cdel_product_name }}"
                  stock_amount: "{{ _cdel_stock_amt }}"
                  coaching:
                  - "To merge stock into another product: add product_id_keep=<target_id>"
                  - "To delete and discard stock: confirm_action=true"
                  - "To consume remaining stock first: stock_consume item=<name> amount=<n>"
            - stop: Stock Guard
              response_variable: final_response
        - action: script.zen_sutra_grocy
          response_variable: _cdel_children_raw
          data:
            action_type: read
            endpoint: "/objects/products?query%5B%5D=parent_product_id={{ product_id_resolved }}"
        - variables:
            _cdel_children: "{{ _cdel_children_raw['result']['content'] | default([]) }}"
            _cdel_child_count: "{{ _cdel_children | length }}"
            _cdel_child_names: "{{ _cdel_children | map(attribute='name') | list }}"
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _cdel_child_count | int > 0 and not confirm_action_in }}"
            sequence:
            - variables:
                final_response:
                  status: parent_guard
                  mode: catalog_delete_product
                  message: "Product is a parent with {{ _cdel_child_count }} child product(s). Reparent or confirm to orphan."
                  product_id: "{{ product_id_resolved }}"
                  name: "{{ _cdel_product_name }}"
                  child_count: "{{ _cdel_child_count }}"
                  children: "{{ _cdel_child_names }}"
                  coaching:
                  - "To reassign a child to a new parent: update_product_meta item='<child>' parent_product='<new parent>'"
                  - "To clear a child's parent link: update_product_meta item='<child>' parent_product_id=0"
                  - "To delete anyway (children will lose parent link): confirm_action=true"
            - stop: Parent Guard
              response_variable: final_response
        - action: script.zen_sutra_grocy
          response_variable: _cdel_raw
          data:
            action_type: delete
            endpoint: "/objects/products/{{ product_id_resolved }}"
            payload: "{}"
        - variables:
            final_response:
              status: success
              mode: catalog_delete_product
              result:
                product_id: "{{ product_id_resolved }}"
                name: "{{ _cdel_product_name }}"
                had_stock: "{{ _cdel_stock_amt > 0 }}"
                stock_amount_at_delete: "{{ _cdel_stock_amt }}"
        - stop: Product Deleted
          response_variable: final_response
    - alias: 'catalog_audit — paginated product health scan (2000-product cap, ~160KB max var)'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'catalog_audit' }}"
        sequence:
        - variables:
            _ca_offset: 0
            _ca_page_size: 500
            _ca_done: false
            _ca_total: 0
            _ca_compact: []
        - repeat:
            count: 4
            sequence:
            - choose:
              - conditions:
                - condition: template
                  value_template: "{{ not _ca_done }}"
                sequence:
                - variables:
                    _ca_fetch_endpoint: "/objects/products?limit={{ _ca_page_size }}&offset={{ _ca_offset }}"
                - action: script.zen_sutra_grocy
                  response_variable: _ca_page_raw
                  data:
                    action_type: read
                    endpoint: "{{ _ca_fetch_endpoint }}"
                - variables:
                    _ca_page_items: "{{ _ca_page_raw['result']['content'] | default([]) }}"
                - variables:
                    _ca_done: "{{ (_ca_page_items | length) < _ca_page_size }}"
                    _ca_offset: "{{ _ca_offset + _ca_page_size }}"
                    _ca_total: "{{ _ca_total + (_ca_page_items | length) }}"
                    _ca_compact: >-
                      {%- set ns = namespace(out=_ca_compact) -%}
                      {%- for p in _ca_page_items -%}
                        {%- set _uf = p.userfields if p.userfields is mapping else {} -%}
                        {%- set ns.out = ns.out + [{'id': p.id, 'name': p.name, 'pid': p.parent_product_id | default(none,true), 'qu': p.qu_id_stock | default(none,true), 'loc': p.location_id | default(none,true), 'lbl': _uf.ha_labels | default('',true), 'area': _uf.homeassistant_area | default('',true)}] -%}
                      {%- endfor -%}
                      {{ ns.out }}
        - variables:
            _ca_all_ids: "{{ _ca_compact | map(attribute='id') | list }}"
        - variables:
            _ca_result: >-
              {%- set all_ids = _ca_compact | map(attribute='id') | list -%}
              {%- set ns = namespace(orp=[], lbl=[], area=[], loc=[], qu=[]) -%}
              {%- for p in _ca_compact -%}
                {%- if p.pid is not none and p.pid | int(none) is not none and p.pid | int not in all_ids -%}
                  {%- set ns.orp = ns.orp + [{'id': p.id, 'name': p.name, 'declared_parent_id': p.pid | int, 'fix': 'update_product_meta item=' ~ p.name ~ ' parent_product=<new parent>'}] -%}
                {%- endif -%}
                {%- if (p.lbl | default('', true)) == '' -%}
                  {%- set ns.lbl = ns.lbl + [{'id': p.id, 'name': p.name, 'fix': 'products_tag item=' ~ p.name ~ ' ha_labels=<root_label>'}] -%}
                {%- endif -%}
                {%- if (p.area | default('', true)) == '' -%}
                  {%- set ns.area = ns.area + [{'id': p.id, 'name': p.name, 'fix': 'products_tag item=' ~ p.name ~ ' homeassistant_area_id=<area_id>'}] -%}
                {%- endif -%}
                {%- if p.loc is none -%}
                  {%- set ns.loc = ns.loc + [{'id': p.id, 'name': p.name, 'fix': 'set_default_location_for_product item=' ~ p.name ~ ' location=<location>'}] -%}
                {%- endif -%}
                {%- if p.qu is none -%}
                  {%- set ns.qu = ns.qu + [{'id': p.id, 'name': p.name, 'fix': 'update_product_meta item=' ~ p.name ~ ' unit=each'}] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ {
                'total_products': _ca_total,
                'issues_found': (ns.orp|length) + (ns.lbl|length) + (ns.area|length) + (ns.loc|length) + (ns.qu|length),
                'orphaned_children': {'count': ns.orp|length, 'items': ns.orp},
                'no_labels':         {'count': ns.lbl|length, 'items': ns.lbl},
                'no_area':           {'count': ns.area|length, 'items': ns.area},
                'no_location':       {'count': ns.loc|length, 'items': ns.loc},
                'no_unit':           {'count': ns.qu|length,  'items': ns.qu}
              } }}
        - variables:
            final_response:
              status: success
              tool: "{{ tool_name }}"
              version: "{{ tool_version }}"
              case: catalog_audit
              result: "{{ _ca_result }}"
        - stop: Catalog Audit Complete
          response_variable: final_response
    - alias: 'locations_reparent_bulk — bulk reparent'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'locations_reparent_bulk' }}"
        sequence:
        - variables:
            _bulk_child_ids: "{{ child_lids_in | list if child_lids_in is iterable and child_lids_in is not string else child_lids_in | from_json | list }}"
            _bulk_parent_lid: "{{ parent_lid_resolved | int(none) }}"
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _bulk_parent_lid is none or _bulk_child_ids | length == 0 }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  version: '{{ tool_version }}'
                  mode: locations_reparent_bulk
                  message: parent_location_id and child_location_ids are required
                  coaching:
                  - parent_location_id must be an explicit numeric ID
                  - child_location_ids must be a JSON array e.g. "[201,202,203]"
            - stop: Reparent Bulk Guard
              response_variable: final_response
        # Read parent location once — we need its homeassistant_area for inheritance
        - action: script.zen_sutra_grocy
          response_variable: _rb_parent_raw
          data:
            action_type: read
            endpoint: /objects/locations/{{ _bulk_parent_lid }}
        - variables:
            _rb_parent_area: >-
              {%- set c = _rb_parent_raw.get('result', {}).get('content', {}) if _rb_parent_raw is mapping else {} -%}
              {%- set c = c if c is mapping else {} -%}
              {{ c.get('userfields', {}).get('homeassistant_area', '') | string | lower | trim }}
        - repeat:
            for_each: "{{ _bulk_child_ids }}"
            sequence:
            - action: script.zen_sutra_grocy
              response_variable: _rb_snap_raw
              data:
                action_type: read
                endpoint: /objects/locations?limit=500&offset=0
            - variables:
                _rb_child_snap: >-
                  {{ _rb_snap_raw['result']['content'] | selectattr('id', 'equalto', repeat.item | int) | list | first | default({}) }}
            - variables:
                _rb_old_parent: "{{ _rb_child_snap.get('userfields', {}).get('grocy_parent_location_id', none) | int(none) }}"
                _rb_child_area: "{{ _rb_child_snap.get('userfields', {}).get('homeassistant_area', '') | string | lower | trim }}"
            # Determine area to write: parent's area if set; else keep child's unless confirm_action clears it
            - variables:
                _rb_area_to_write: >-
                  {%- if _rb_parent_area != '' -%}{{ _rb_parent_area }}
                  {%- elif _rb_child_area != '' and not confirm_action_in -%}{{ _rb_child_area }}
                  {%- else -%}{{ _rb_parent_area }}{%- endif -%}
                _rb_already_parented: "{{ _rb_old_parent is not none and (_rb_old_parent | int) == (_bulk_parent_lid | int) }}"
            - variables:
                _rb_area_already_set: "{{ _rb_child_area == _rb_area_to_write }}"
            # Write grocy_parent_location_id only if not already correct (idempotency)
            - choose:
              - conditions:
                - condition: template
                  value_template: "{{ not _rb_already_parented }}"
                sequence:
                - action: script.zen_sutra_grocy
                  data:
                    action_type: update
                    endpoint: /userfields/locations/{{ repeat.item }}
                    payload: "{{ dict([('grocy_parent_location_id', _bulk_parent_lid)]) }}"
            # Write homeassistant_area if it needs to change
            - choose:
              - conditions:
                - condition: template
                  value_template: "{{ not _rb_area_already_set }}"
                sequence:
                - action: script.zen_sutra_grocy
                  data:
                    action_type: update
                    endpoint: /userfields/locations/{{ repeat.item }}
                    payload: "{{ dict([('homeassistant_area', _rb_area_to_write)]) }}"
            # Sync parent's child list
            - action: script.zen_sutra_grocy
              response_variable: _rb_js_reg_raw
              data:
                action_type: read
                endpoint: /objects/locations?limit=500&offset=0
            - variables:
                _rb_new_kids: "{{ _rb_js_reg_raw['result']['content'] | selectattr('userfields.grocy_parent_location_id', 'equalto', _bulk_parent_lid | string) | map(attribute='id') | map('int') | unique | sort | list }}"
            - action: script.zen_sutra_grocy
              data:
                action_type: update
                endpoint: /userfields/locations/{{ _bulk_parent_lid }}
                payload: "{{ dict([('grocy_child_location_ids', '[' ~ (_rb_new_kids | join(',')) ~ ']')]) }}"
            # Evict from old parent's child list if parent actually changed
            - choose:
              - conditions:
                - condition: template
                  value_template: "{{ not _rb_already_parented and _rb_old_parent is not none and (_rb_old_parent | int) != (_bulk_parent_lid | int) }}"
                sequence:
                - action: script.zen_sutra_grocy
                  response_variable: _rb_evict_raw
                  data:
                    action_type: read
                    endpoint: /objects/locations?limit=500&offset=0
                - variables:
                    _rb_old_kids: "{{ _rb_evict_raw['result']['content'] | selectattr('userfields.grocy_parent_location_id', 'equalto', _rb_old_parent | string) | map(attribute='id') | map('int') | unique | sort | list }}"
                - action: script.zen_sutra_grocy
                  data:
                    action_type: update
                    endpoint: /userfields/locations/{{ _rb_old_parent }}
                    payload: "{{ dict([('grocy_child_location_ids', '[' ~ (_rb_old_kids | join(',')) ~ ']')]) }}"
        - variables:
            final_response:
              status: success
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              mode: locations_reparent_bulk
              result:
                parent_id: '{{ _bulk_parent_lid }}'
                parent_area: '{{ _rb_parent_area }}'
                children_processed: '{{ _bulk_child_ids | length }}'
                child_ids: '{{ _bulk_child_ids }}'
                area_inherited: "{{ _rb_parent_area != '' }}"
        - stop: Reparent Bulk Complete
          response_variable: final_response
    - alias: 'locations_delete_safe — stock-safe delete'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'locations_delete_safe' and location_id_resolved is not none }}"
        sequence:
        - action: script.zen_sutra_grocy
          response_variable: _ds_stock_raw
          data:
            action_type: read
            endpoint: /stock/locations/{{ location_id_resolved }}/entries
        - variables:
            _ds_stock_list: "{{ _ds_stock_raw['result']['content'] | default([]) }}"
            _ds_has_stock: "{{ (_ds_stock_list | list | length) > 0 }}"
            _ds_orphan_to: "{{ orphan_to_lid_in | int(none) }}"
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _ds_has_stock and _ds_orphan_to is none }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  version: '{{ tool_version }}'
                  mode: locations_delete_safe
                  message: Location has stock — provide orphan_to to transfer before delete
                  details:
                    location_id: '{{ location_id_resolved }}'
                    stock_count: '{{ _ds_stock_list | length }}'
                  coaching:
                  - Use locations_delete_safe with orphan_to=<destination_id>
                  - Or transfer stock manually first then use locations_delete
            - stop: Delete Safe Blocked
              response_variable: final_response
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _ds_has_stock and _ds_orphan_to is not none }}"
            sequence:
            - repeat:
                for_each: "{{ _ds_stock_list | map(attribute='product_id') | unique | list }}"
                sequence:
                - action: script.zen_sutra_grocy
                  data:
                    action_type: create
                    endpoint: /stock/products/{{ repeat.item }}/transfer
                    payload: "{{ {'amount': (_ds_stock_list | selectattr('product_id', 'equalto', repeat.item) | map(attribute='amount') | map('float') | sum), 'location_id_from': location_id_resolved | int, 'location_id_to': _ds_orphan_to} }}"
        - action: script.zen_sutra_grocy
          response_variable: _ds_del_raw
          data:
            action_type: delete
            endpoint: /objects/locations/{{ location_id_resolved }}
            payload: "{{ {} }}"
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _deleted_loc_parent_id is not none }}"
            sequence:
            - action: script.zen_sutra_grocy
              response_variable: _ds_evict_raw
              data:
                action_type: read
                endpoint: /objects/locations?limit=500&offset=0
            - variables:
                _ds_evict_kids: "{{ _ds_evict_raw['result']['content'] | selectattr('userfields.grocy_parent_location_id', 'equalto', _deleted_loc_parent_id | string) | map(attribute='id') | map('int') | unique | sort | list }}"
            - action: script.zen_sutra_grocy
              data:
                action_type: update
                endpoint: /userfields/locations/{{ _deleted_loc_parent_id }}
                payload: "{{ dict([('grocy_child_location_ids', '[' ~ (_ds_evict_kids | join(',')) ~ ']')]) }}"
        - variables:
            final_response:
              status: success
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              mode: locations_delete_safe
              result:
                location_id: '{{ location_id_resolved }}'
                stock_transferred: '{{ _ds_has_stock }}'
                orphan_to: '{{ _ds_orphan_to }}'
                deleted: true
        - stop: Delete Safe Complete
          response_variable: final_response
    - alias: 'locations_hierarchy_rebuild — rebuild parent-child lists from ground truth'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'locations_hierarchy_rebuild' }}"
        sequence:
        - action: script.zen_sutra_grocy
          response_variable: _hr_raw
          data:
            action_type: read
            endpoint: /objects/locations?limit=500&offset=0
        - variables:
            _hr_locs: "{{ _hr_raw['result']['content'] | default([], true) }}"
        - variables:
            _hr_all_pids: >-
              {{ _hr_locs
                 | selectattr('userfields.grocy_parent_location_id', 'defined')
                 | selectattr('userfields.grocy_parent_location_id', 'ne', none)
                 | selectattr('userfields.grocy_parent_location_id', 'ne', '')
                 | map(attribute='userfields.grocy_parent_location_id')
                 | map('int')
                 | unique
                 | list }}
        - variables:
            _hr_plans: >-
              {%- set ns = namespace(plans=[]) -%}
              {%- for pid_int in _hr_all_pids -%}
                {%- set pid_str = pid_int | string -%}
                {%- set derived = _hr_locs
                    | selectattr('userfields.grocy_parent_location_id', 'defined')
                    | selectattr('userfields.grocy_parent_location_id', 'equalto', pid_str)
                    | map(attribute='id') | map('int') | sort | list -%}
                {%- set parent = _hr_locs | selectattr('id', 'equalto', pid_int) | list | first | default(none) -%}
                {%- set cur_raw = (parent.userfields.grocy_child_location_ids | default('[]', true))
                    if (parent is not none and parent.userfields is defined) else '[]' -%}
                {%- set current = cur_raw | from_json | map('int') | sort | list -%}
                {%- if derived != current -%}
                  {%- set ns.plans = ns.plans + [{
                    'parent_id': pid_int,
                    'parent_name': (parent.name if parent is not none else '?'),
                    'derived': derived,
                    'current': current}] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.plans }}
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ dry_run_in }}"
            sequence:
            - variables:
                final_response:
                  status: dry_run
                  mode: locations_hierarchy_rebuild
                  parents_to_update: "{{ _hr_plans | length }}"
                  total_parents_scanned: "{{ _hr_all_pids | length }}"
                  plan: "{{ _hr_plans }}"
            - stop: Hierarchy Rebuild Dry Run
              response_variable: final_response
        - repeat:
            for_each: "{{ _hr_plans }}"
            sequence:
            - action: script.zen_sutra_grocy
              data:
                action_type: update
                endpoint: /userfields/locations/{{ repeat.item.parent_id }}
                payload: "{{ dict([('grocy_child_location_ids', '[' ~ (repeat.item.derived | join(',')) ~ ']')]) }}"
        - variables:
            final_response:
              status: success
              mode: locations_hierarchy_rebuild
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              parents_scanned: "{{ _hr_all_pids | length }}"
              parents_updated: "{{ _hr_plans | length }}"
              total_children_registered: "{{ _hr_plans | map(attribute='derived') | map('length') | sum }}"
        - stop: Hierarchy Rebuild Complete
          response_variable: final_response
    - alias: 'stock_area_summary — bulk product count + location_tree for a HA area (RM chain target)'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'stock_area_summary' }}"
        sequence:
        - variables:
            _sas_area_id: "{{ area_id_norm }}"
        - variables:
            _sas_hh_cab: >-
              {{ label_entities('Zen Household Cabinet')
                 | select('match', 'sensor\\.') | list | first | default('') }}
        - variables:
            _sas_spatial: >-
              {%- set _cv = state_attr(_sas_hh_cab, 'variables') -%}
              {%- set _cv = _cv if _cv is mapping else {} -%}
              {%- set _topo = _cv.get('room_topology', {}) -%}
              {%- set _topo = _topo.get('value', _topo) if _topo is mapping else {} -%}
              {%- set _topo = _topo | from_json if _topo is string and _topo | trim not in ['', 'none', 'null', 'None'] else _topo -%}
              {{ _topo.get(_sas_area_id, none) }}
        - variables:
            _sas_anchor_id: >-
              {{ (_sas_spatial.grocy_location_id | string | trim)
                 if (_sas_spatial is mapping
                     and _sas_spatial.grocy_location_id | default(none, true) is not none)
                 else none }}
        - variables:
            _sas_safety: >-
              {{ _sas_spatial.get('safety', []) if _sas_spatial is mapping else [] }}
        - action: script.zen_sutra_grocy
          response_variable: _sas_locs_raw
          data:
            action_type: read
            endpoint: /objects/locations?limit=500&offset=0
        - variables:
            _sas_all_locs: "{{ _sas_locs_raw['result']['content'] | default([], true) }}"
        - variables:
            _sas_area_locs: >-
              {{ _sas_all_locs
                 | selectattr('userfields.homeassistant_area', 'defined')
                 | selectattr('userfields.homeassistant_area', 'search', '(?i)^' ~ _sas_area_id ~ '$')
                 | list }}
        - variables:
            _sas_pg_offset: 0
            _sas_pg_done: false
            _sas_loc_counts: {}
        - repeat:
            while: "{{ not _sas_pg_done }}"
            sequence:
              - action: script.zen_sutra_grocy
                response_variable: _sas_pg_raw
                continue_on_error: true
                data:
                  action_type: read
                  endpoint: "/objects/products?limit=200&offset={{ _sas_pg_offset }}"
              - variables:
                  _sas_pg_len: >-
                    {%- set _pg = _sas_pg_raw['result']['content']
                                  if _sas_pg_raw is mapping and 'result' in _sas_pg_raw
                                     and _sas_pg_raw['result']['content'] is sequence
                                  else [] -%}
                    {{ _pg | length }}
                  _sas_loc_counts: >-
                    {%- set _pg = _sas_pg_raw['result']['content']
                                  if _sas_pg_raw is mapping and 'result' in _sas_pg_raw
                                     and _sas_pg_raw['result']['content'] is sequence
                                  else [] -%}
                    {%- set ns = namespace(lc=_sas_loc_counts) -%}
                    {%- for p in _pg -%}
                      {%- set _lid = p.location_id | default(0, true) | int(0) -%}
                      {%- if _lid > 0 -%}
                        {%- set ns.lc = ns.lc | combine({_lid | string: (ns.lc.get(_lid | string, 0) + 1)}) -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {{ ns.lc }}
                  _sas_pg_offset: "{{ (_sas_pg_offset | int) + 200 }}"
              - variables:
                  _sas_pg_done: "{{ _sas_pg_len | int < 200 }}"
        - variables:
            _sas_counts: >-
              {%- set ns_lc = namespace(lc=_sas_loc_counts) -%}
              {%- set ns = namespace(counts=[]) -%}
              {%- for loc in _sas_area_locs -%}
                {%- set _lid = loc.id | int -%}
                {%- set _pid_raw = loc.userfields.grocy_parent_location_id | default(none, true) -%}
                {%- set _pid = _pid_raw | int(none) if _pid_raw not in [none, '', '0', 0] else none -%}
                {%- set _count = ns_lc.lc.get(_lid | string, 0) | int -%}
                {%- set ns.counts = ns.counts + [{
                  'id': _lid,
                  'name': loc.name,
                  'parent_id': _pid,
                  'subclass': loc.userfields.grocy_location_subclass | default('', true),
                  'is_anchor': (loc.id | string) == (_sas_anchor_id | string),
                  'item_count': _count
                }] -%}
              {%- endfor -%}
              {{ ns.counts }}
        - variables:
            _sas_all_locs_map: >-
              {%- set ns = namespace(m={}) -%}
              {%- for l in _sas_all_locs -%}
                {%- set ns.m = ns.m | combine({l.id | string: l.name}) -%}
              {%- endfor -%}
              {{ ns.m }}
        - variables:
            _sas_annotated: >-
              {%- set ns = namespace(nodes=[]) -%}
              {%- for c in _sas_counts | sort(attribute='name') -%}
                {%- set pname = _sas_all_locs_map.get(c.parent_id | string, none) if c.parent_id is not none else none -%}
                {%- set ns.nodes = ns.nodes + [c | combine({'parent_name': pname})] -%}
              {%- endfor -%}
              {{ ns.nodes }}
            _sas_anchor_int: "{{ _sas_anchor_id | int(0) }}"
        - variables:
            _sas_location_tree: >-
              {%- set ns = namespace(roots=[]) -%}
              {%- set _has_anchor = _sas_annotated | selectattr('is_anchor') | list | length > 0 -%}
              {%- set _area_ids = _sas_annotated | map(attribute='id') | list -%}
              {%- for c0 in _sas_annotated if (c0.is_anchor if _has_anchor else c0.parent_id not in _area_ids) -%}
                {%- set ns_l1 = namespace(children=[]) -%}
                {%- for c1 in _sas_annotated if c1.parent_id == c0.id and not c1.is_anchor -%}
                  {%- set ns_l2 = namespace(children=[]) -%}
                  {%- for c2 in _sas_annotated if c2.parent_id == c1.id -%}
                    {%- set ns_l2.children = ns_l2.children + [{'id': c2.id, 'name': c2.name, 'subclass': c2.subclass, 'item_count': c2.item_count}] -%}
                  {%- endfor -%}
                  {%- set ns_l1.children = ns_l1.children + [{'id': c1.id, 'name': c1.name, 'subclass': c1.subclass, 'item_count': c1.item_count, 'children': ns_l2.children}] -%}
                {%- endfor -%}
                {%- set ns.roots = ns.roots + [{'id': c0.id, 'name': c0.name, 'is_anchor': c0.is_anchor, 'subclass': c0.subclass, 'item_count': c0.item_count, 'children': ns_l1.children}] -%}
              {%- endfor -%}
              {{ ns.roots }}
        - variables:
            final_response:
              status: success
              mode: stock_area_summary
              area_id: "{{ _sas_area_id }}"
              locations: "{{ _sas_annotated | sort(attribute='item_count', reverse=true) }}"
              location_tree: "{{ _sas_location_tree }}"
              anchor_location_id: "{{ _sas_anchor_id }}"
              total_locations: "{{ _sas_area_locs | length }}"
              stocked_locations: "{{ _sas_counts | selectattr('item_count', 'gt', 0) | list | length }}"
              total_items: "{{ _sas_counts | map(attribute='item_count') | sum }}"
              hazmat_safety: "{{ _sas_safety }}"
              tool: "{{ tool_name }}"
              version: "{{ tool_version }}"
        - stop: Area Inventory Summary
          response_variable: final_response
    - alias: 'stock_area_volatile — volatile items (overdue/due_soon/expiring) filtered to a HA area'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'stock_area_volatile' }}"
        sequence:
        - variables:
            _sav_area_id: "{{ area_id_norm }}"
        - action: script.zen_sutra_grocy
          response_variable: _sav_locs_raw
          data:
            action_type: read
            endpoint: /objects/locations?limit=500&offset=0
        - variables:
            _sav_area_loc_ids: >-
              {%- set _all = _sav_locs_raw['result']['content'] | default([], true) -%}
              {{ _all
                 | selectattr('userfields.homeassistant_area', 'defined')
                 | selectattr('userfields.homeassistant_area', 'search', '(?i)^' ~ _sav_area_id ~ '$')
                 | map(attribute='id') | map('int') | list }}
        - action: script.zen_sutra_grocy
          response_variable: _sav_vol_raw
          data:
            action_type: read
            endpoint: stock/volatile
        - variables:
            _sav_vol_content: >-
              {{ _sav_vol_raw['result']['content'] | default({}, true) }}
        - variables:
            final_response: >-
              {%- set _ov_all = _sav_vol_content.overdue_products | default([], true) -%}
              {%- set _ds_all = _sav_vol_content.due_dates | default([], true) -%}
              {%- set _ex_all = _sav_vol_content.expiring_products | default([], true) -%}
              {%- set ns = namespace(ov=[], ds=[], ex=[]) -%}
              {%- for i in _ov_all -%}
                {%- if i.location_id | default(none, true) | int(0) in _sav_area_loc_ids -%}
                  {%- set ns.ov = ns.ov + [i] -%}
                {%- endif -%}
              {%- endfor -%}
              {%- for i in _ds_all -%}
                {%- if i.location_id | default(none, true) | int(0) in _sav_area_loc_ids -%}
                  {%- set ns.ds = ns.ds + [i] -%}
                {%- endif -%}
              {%- endfor -%}
              {%- for i in _ex_all -%}
                {%- if i.location_id | default(none, true) | int(0) in _sav_area_loc_ids -%}
                  {%- set ns.ex = ns.ex + [i] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ {
                'status': 'success',
                'mode': 'stock_area_volatile',
                'area_id': _sav_area_id,
                'location_ids': _sav_area_loc_ids,
                'overdue': ns.ov,
                'due_soon': ns.ds,
                'expiring': ns.ex,
                'counts': {
                  'overdue': ns.ov | length,
                  'due_soon': ns.ds | length,
                  'expiring': ns.ex | length
                },
                'tool': tool_name,
                'version': tool_version
              } }}
        - stop: Area Volatile Stock
          response_variable: final_response
    - alias: 'chores_by_area — maintenance chores for products stocked in a HA area'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'chores_by_area' }}"
        sequence:
        - variables:
            _cba_area_id: "{{ area_id_norm }}"
        - if: "{{ _cba_area_id == '' }}"
          then:
          - variables:
              final_response:
                status: error
                mode: chores_by_area
                reason: "guarded: chores_by_area needs homeassistant_area_id (the HA area id, e.g. kitchen)"
                tool: "{{ tool_name }}"
                version: "{{ tool_version }}"
          - stop: chores_by_area needs an area
            response_variable: final_response
        - action: script.zen_sutra_grocy
          response_variable: _cba_locs_raw
          data:
            action_type: read
            endpoint: /objects/locations?limit=500&offset=0
        - variables:
            _cba_area_loc_ids: >-
              {{ _cba_locs_raw['result']['content'] | default([], true)
                 | selectattr('userfields.homeassistant_area', 'defined')
                 | selectattr('userfields.homeassistant_area', 'equalto', _cba_area_id)
                 | map(attribute='id') | map('int') | list }}
        - action: script.zen_sutra_grocy
          response_variable: _cba_defs_raw
          data:
            action_type: read
            endpoint: /objects/chores?limit=500&offset=0
        - variables:
            _cba_all_chores: "{{ _cba_defs_raw['result']['content'] | default([], true) }}"
        - variables:
            _cba_tagged_ids: >-
              {{ _cba_all_chores
                 | selectattr('userfields', 'defined')
                 | selectattr('userfields.homeassistant_area', 'defined')
                 | selectattr('userfields.homeassistant_area', 'equalto', _cba_area_id)
                 | map(attribute='id') | map('int') | list }}
            # A chore explicitly tagged to a DIFFERENT area must never leak into
            # this area's results just because its product happens to have stock
            # in a shared/bulk-supply location tagged to this area (bug: e.g.
            # "Empty office waste bin" is tagged homeassistant_area=office but
            # was appearing under kitchen because the generic trash-bag product
            # it references is bulk-stocked in a kitchen supply closet). The
            # chore's own explicit tag is authoritative and always wins over the
            # product/location fallback below.
            _cba_other_tagged_ids: >-
              {{ _cba_all_chores
                 | selectattr('userfields', 'defined')
                 | selectattr('userfields.homeassistant_area', 'defined')
                 | rejectattr('userfields.homeassistant_area', 'equalto', none)
                 | rejectattr('userfields.homeassistant_area', 'equalto', '')
                 | rejectattr('userfields.homeassistant_area', 'equalto', _cba_area_id)
                 | map(attribute='id') | map('int') | list }}
        - variables:
            _cba_linked: >-
              {{ _cba_all_chores
                 | selectattr('product_id', 'defined')
                 | rejectattr('product_id', 'equalto', none)
                 | rejectattr('product_id', 'equalto', '')
                 | rejectattr('id', 'in', _cba_other_tagged_ids)
                 | list }}
        - action: script.zen_sutra_grocy
          response_variable: _cba_state_raw
          data:
            action_type: read
            endpoint: /chores
        - variables:
            _cba_state: "{{ _cba_state_raw['result']['content'] | default([], true) }}"
        - variables:
            _cba_results: "{{ [] }}"
        - variables:
            _cba_results: >-
              {%- set ns = namespace(r=_cba_results) -%}
              {%- for c in _cba_all_chores -%}
                {%- if (c.id | int) in _cba_tagged_ids -%}
                  {%- set _pid = c.get('product_id', none) -%}
                  {%- if _pid is none or _pid | string | trim == '' -%}
                    {%- set _st = _cba_state | selectattr('chore_id', 'equalto', c.id | string) | list | first | default({}) -%}
                    {%- set ns.r = ns.r + [{'chore_id': c.id | int, 'name': c.name, 'product_id': none, 'product_amount': 0, 'is_due': _st.get('is_due', false) | bool, 'next_execution': _st.get('next_estimated_execution_time', none), 'last_tracked': _st.get('last_tracked_time', none), 'area_location_ids': [], 'discovery': 'tagged'}] -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.r }}
        - repeat:
            for_each: "{{ _cba_linked }}"
            sequence:
            - action: script.zen_sutra_grocy
              response_variable: _cba_ploc_raw
              continue_on_error: true
              data:
                action_type: read
                endpoint: /stock/products/{{ repeat.item.product_id }}/entries
            - variables:
                _cba_plocs: "{{ (_cba_ploc_raw['result']['content'] | default([], true)) if _cba_ploc_raw is mapping and _cba_ploc_raw.get('status') == 'success' else [] }}"
            - variables:
                _cba_in_area: >-
                  {{ _cba_plocs
                     | selectattr('location_id', 'defined')
                     | selectattr('location_id', 'in', _cba_area_loc_ids)
                     | list }}
            - variables:
                _cba_state_entry: >-
                  {{ _cba_state
                     | selectattr('chore_id', 'equalto', repeat.item.id | string)
                     | list | first | default({}) }}
            - variables:
                _cba_results: >-
                  {%- if _cba_in_area | length > 0 or (repeat.item.id | int) in _cba_tagged_ids -%}
                    {{ _cba_results + [{
                      'chore_id': repeat.item.id | int,
                      'name': repeat.item.name,
                      'product_id': repeat.item.product_id | int,
                      'product_amount': repeat.item.product_amount | default(1, true) | float,
                      'is_due': _cba_state_entry.get('is_due', false) | bool,
                      'next_execution': _cba_state_entry.get('next_estimated_execution_time', none),
                      'last_tracked': _cba_state_entry.get('last_tracked_time', none),
                      'area_location_ids': _cba_in_area | map(attribute='location_id') | map('int') | unique | list,
                      'discovery': 'product' if _cba_in_area | length > 0 else 'tagged'
                    }] }}
                  {%- else -%}
                    {{ _cba_results }}
                  {%- endif -%}
        - variables:
            final_response:
              status: success
              mode: chores_by_area
              area_id: "{{ _cba_area_id }}"
              chores: "{{ _cba_results }}"
              total: "{{ _cba_results | length }}"
              due_count: "{{ _cba_results | selectattr('is_due') | list | length }}"
              tool: "{{ tool_name }}"
              version: "{{ tool_version }}"
        - stop: Chores By Area
          response_variable: final_response
    - alias: 'chores_due — house-wide due/overdue chores, no area filter'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'chores_due' }}"
        sequence:
        - variables:
            _cd_include_all: "{{ include_all | default(false) | bool(false) }}"
        - action: script.zen_sutra_grocy
          response_variable: _cd_defs_raw
          data:
            action_type: read
            endpoint: /objects/chores?limit=500&offset=0
        - variables:
            _cd_all_chores: "{{ _cd_defs_raw['result']['content'] | default([], true) }}"
        - action: script.zen_sutra_grocy
          response_variable: _cd_state_raw
          data:
            action_type: read
            endpoint: /chores
        - variables:
            _cd_state: "{{ _cd_state_raw['result']['content'] | default([], true) }}"
        - variables:
            _cd_results: >-
              {%- set ns = namespace(r=[]) -%}
              {%- for c in _cd_all_chores -%}
                {%- set _st = _cd_state | selectattr('chore_id', 'equalto', c.id | string) | list | first | default({}) -%}
                {%- set _is_due = _st.get('is_due', false) | bool -%}
                {%- if _cd_include_all or _is_due -%}
                  {%- set ns.r = ns.r + [{
                    'chore_id': c.id | int,
                    'name': c.name,
                    'area': (c.get('userfields', {}) or {}).get('homeassistant_area', none) or 'unassigned',
                    'product_id': c.get('product_id', none),
                    'is_due': _is_due,
                    'next_execution': _st.get('next_estimated_execution_time', none),
                    'last_tracked': _st.get('last_tracked_time', none)
                  }] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.r }}
        - variables:
            final_response:
              status: success
              mode: chores_due
              include_all: "{{ _cd_include_all }}"
              chores: "{{ _cd_results }}"
              total: "{{ _cd_results | length }}"
              due_count: "{{ _cd_results | selectattr('is_due') | list | length }}"
              tool: "{{ tool_name }}"
              version: "{{ tool_version }}"
        - stop: Chores Due
          response_variable: final_response
    - alias: 'room_brief — chores + stock summary for a HA area in one call'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'room_brief' }}"
        sequence:
        - variables:
            _rb_area: "{{ area_id_norm }}"
        - if: "{{ _rb_area == '' }}"
          then:
          - variables:
              final_response:
                status: error
                mode: room_brief
                reason: "guarded: room_brief needs homeassistant_area_id (the HA area id, e.g. kitchen)"
                tool: "{{ tool_name }}"
                version: "{{ tool_version }}"
          - stop: room_brief needs an area
            response_variable: final_response
        - action: script.zen_sutra_grocy
          response_variable: _rb_locs_raw
          data:
            action_type: read
            endpoint: /objects/locations?limit=500&offset=0
        - variables:
            _rb_area_loc_ids: >-
              {{ _rb_locs_raw['result']['content'] | default([], true)
                 | selectattr('userfields.homeassistant_area', 'defined')
                 | selectattr('userfields.homeassistant_area', 'equalto', _rb_area)
                 | map(attribute='id') | map('int') | list }}
        - action: script.zen_sutra_grocy
          response_variable: _rb_chore_defs_raw
          data:
            action_type: read
            endpoint: /objects/chores?limit=500&offset=0
        - action: script.zen_sutra_grocy
          response_variable: _rb_chore_state_raw
          data:
            action_type: read
            endpoint: /chores
        - variables:
            _rb_stock_pg_offset: 0
            _rb_stock_pg_done: false
            _rb_stock_in_area: []
        - repeat:
            while: "{{ not _rb_stock_pg_done }}"
            sequence:
              - action: script.zen_sutra_grocy
                response_variable: _rb_stock_pg_raw
                continue_on_error: true
                data:
                  action_type: read
                  endpoint: "/objects/stock?limit=200&offset={{ _rb_stock_pg_offset }}"
              - variables:
                  _rb_stock_pg_len: >-
                    {%- set _pg = _rb_stock_pg_raw['result']['content']
                                  if _rb_stock_pg_raw is mapping and 'result' in _rb_stock_pg_raw
                                     and _rb_stock_pg_raw['result']['content'] is sequence
                                  else [] -%}
                    {{ _pg | length }}
                  _rb_stock_in_area: >-
                    {%- set _pg = _rb_stock_pg_raw['result']['content']
                                  if _rb_stock_pg_raw is mapping and 'result' in _rb_stock_pg_raw
                                     and _rb_stock_pg_raw['result']['content'] is sequence
                                  else [] -%}
                    {{ _rb_stock_in_area + (_pg
                       | selectattr('location_id', 'defined')
                       | selectattr('location_id', 'in', _rb_area_loc_ids)
                       | list) }}
                  _rb_stock_pg_offset: "{{ (_rb_stock_pg_offset | int) + 200 }}"
              - variables:
                  _rb_stock_pg_done: "{{ _rb_stock_pg_len | int < 200 }}"
        - variables:
            _rb_pg_offset: 0
            _rb_pg_done: false
            _rb_labeled_ids: []
        - repeat:
            while: "{{ not _rb_pg_done }}"
            sequence:
              - action: script.zen_sutra_grocy
                response_variable: _rb_pg_raw
                continue_on_error: true
                data:
                  action_type: read
                  endpoint: "/objects/products?limit=200&offset={{ _rb_pg_offset }}"
              - variables:
                  _rb_pg_len: >-
                    {%- set _pg = _rb_pg_raw['result']['content']
                                  if _rb_pg_raw is mapping and 'result' in _rb_pg_raw
                                     and _rb_pg_raw['result']['content'] is sequence
                                  else [] -%}
                    {{ _pg | length }}
                  _rb_labeled_ids: >-
                    {%- set _pg = _rb_pg_raw['result']['content']
                                  if _rb_pg_raw is mapping and 'result' in _rb_pg_raw
                                     and _rb_pg_raw['result']['content'] is sequence
                                  else [] -%}
                    {%- set ns = namespace(ids=_rb_labeled_ids) -%}
                    {%- for p in _pg -%}
                      {%- set uf = p.get('userfields', {}) if p.get('userfields') is mapping else {} -%}
                      {%- set _ha = (uf.get('homeassistant_area', '') | default('', true)) | string | trim -%}
                      {%- set _hl = (uf.get('ha_labels', '') | default('', true)) | string | trim -%}
                      {%- set _hl_list = _hl.split(',') | map('trim') | list -%}
                      {%- if _ha == _rb_area or _rb_area in _hl_list -%}
                        {%- set ns.ids = ns.ids + [p.id | int] -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {{ ns.ids }}
                  _rb_pg_offset: "{{ (_rb_pg_offset | int) + 200 }}"
              - variables:
                  _rb_pg_done: "{{ _rb_pg_len | int < 200 }}"
        - variables:
            _rb_chore_state: "{{ _rb_chore_state_raw['result']['content'] | default([], true) }}"
        - variables:
            _rb_area_product_ids: >-
              {%- set _from_stock = _rb_stock_in_area | map(attribute='product_id') | map('int') | list -%}
              {{ (_from_stock + _rb_labeled_ids) | unique | list }}
        - variables:
            _rb_chores: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for c in _rb_chore_defs_raw['result']['content'] | default([], true) -%}
                {%- set _area_tagged = c.userfields is mapping and c.userfields.get('homeassistant_area') == _rb_area -%}
                {%- set _product_in_area = c.get('product_id') | int(-1) in _rb_area_product_ids -%}
                {%- if _area_tagged or _product_in_area -%}
                  {%- set _st = _rb_chore_state | selectattr('chore_id', 'equalto', c.id | string) | list | first | default({}) -%}
                  {%- set ns.out = ns.out + [{'chore_id': c.id | int, 'name': c.name, 'product_id': (c.get('product_id') | int(-1) if c.get('product_id') not in [none, ''] else none), 'is_due': _st.get('is_due', false) | bool, 'next_execution': _st.get('next_estimated_execution_time', none)}] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out }}
        - variables:
            final_response:
              status: success
              mode: room_brief
              area_id: "{{ _rb_area }}"
              chores: "{{ _rb_chores }}"
              chores_due: "{{ _rb_chores | selectattr('is_due') | list | length }}"
              stock_total_items: "{{ _rb_stock_in_area | map(attribute='amount') | sum }}"
              stock_unique_products: "{{ _rb_stock_in_area | map(attribute='product_id') | unique | list | length }}"
              stocked_location_ids: "{{ _rb_stock_in_area | map(attribute='location_id') | unique | list }}"
              tool: "{{ tool_name }}"
              version: "{{ tool_version }}"
        - stop: Room Brief
          response_variable: final_response
    - alias: 'chores_add — create a new Grocy chore'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'chores_add' }}"
        sequence:
        - variables:
            _ca_name: "{{ item | default('') | string | trim }}"
            _ca_period_type: "{{ period_type | default('dynamic-regular') | string | trim }}"
            _ca_period_days: "{{ period_days | default(7) | int }}"
            _ca_product_id: "{{ product_id | default(none, true) }}"
            _ca_product_amount: "{{ product_amount | default(1) | float }}"
            _ca_note: "{{ note | default(none, true) }}"
        - action: script.zen_sutra_grocy
          response_variable: _ca_raw
          data:
            action_type: create
            endpoint: /objects/chores
            payload: >-
              {%- set p = {
                  'name': _ca_name,
                  'period_type': _ca_period_type,
                  'period_days': _ca_period_days,
                  'active': 1
                } -%}
              {%- if _ca_product_id is not none -%}
                {%- set p = p | combine({'product_id': _ca_product_id | int,
                                         'product_amount': _ca_product_amount,
                                         'consume_product_on_execution': 1}) -%}
              {%- endif -%}
              {%- if _ca_note is not none -%}
                {%- set p = p | combine({'description': _ca_note}) -%}
              {%- endif -%}
              {{ p | tojson }}
        - variables:
            _ca_created_id: >-
              {%- set _c = _ca_raw.get('result', {}).get('content', '') -%}
              {%- set _c = _c | from_json if _c is string and _c | trim not in ['', 'none', 'null'] else _c -%}
              {{ (_c.get('created_object_id', _c.get('id', none)) | int(none))
                 if _c is mapping else none }}
        - variables:
            final_response:
              status: success
              mode: chores_add
              chore_id: "{{ _ca_created_id }}"
              name: "{{ _ca_name }}"
              product_id: "{{ _ca_product_id }}"
              product_amount: "{{ _ca_product_amount }}"
              period_type: "{{ _ca_period_type }}"
              period_days: "{{ _ca_period_days }}"
              tool: "{{ tool_name }}"
              version: "{{ tool_version }}"
        - stop: Chore Created
          response_variable: final_response
    - alias: 'chores_tag — set homeassistant_area and/or entity_id userfields on a chore'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'chores_tag' }}"
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ chore_id_resolved is none }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: chores_tag
                  message: Chore not found — pass item=<name> or chore_id=<id>
            - stop: Chore Not Found
              response_variable: final_response
        - variables:
            _ct_area: "{{ homeassistant_area_id | default(none, true) }}"
            _ct_entity: "{{ homeassistant_entity_id | default(none, true) }}"
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _ct_area is none and _ct_entity is none }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: chores_tag
                  message: Nothing to tag — pass homeassistant_area_id and/or homeassistant_entity_id
            - stop: No Tag Fields Provided
              response_variable: final_response
        - variables:
            _ct_payload: >-
              {%- set p = {} -%}
              {%- if _ct_area is not none -%}{%- set p = p | combine({'homeassistant_area': _ct_area}) -%}{%- endif -%}
              {%- if _ct_entity is not none -%}{%- set p = p | combine({'homeassistant_entity_id': _ct_entity}) -%}{%- endif -%}
              {{ p | tojson }}
        - action: script.zen_sutra_grocy
          response_variable: _ct_raw
          data:
            action_type: update
            endpoint: /userfields/chores/{{ chore_id_resolved }}
            payload: "{{ _ct_payload }}"
        - variables:
            final_response:
              status: "{{ 'success' if _ct_raw.get('result', {}).get('content', none) is not none else 'ok' }}"
              mode: chores_tag
              chore_id: "{{ chore_id_resolved }}"
              homeassistant_area: "{{ _ct_area }}"
              homeassistant_entity_id: "{{ _ct_entity }}"
              tool: "{{ tool_name }}"
              version: "{{ tool_version }}"
        - stop: Chore Tagged
          response_variable: final_response
    - alias: 'products_tag — set ZenOS userfields on a product'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'products_tag' }}"
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ product_id_resolved is none }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: products_tag
                  message: Product not found — pass item=<name> or product_id=<id>
            - stop: Product Not Found
              response_variable: final_response
        - variables:
            _pt_area: "{{ homeassistant_area_id | default(none, true) }}"
            _pt_hazmat: "{{ hazmat_class | default(none, true) }}"
            _pt_safety: "{{ safety_type | default(none, true) }}"
            _pt_asset: "{{ asset_type | default(none, true) }}"
            _pt_labels: "{{ ha_labels | default(none, true) }}"
            _pt_author: "{{ book_author | default(none, true) }}"
            _pt_isbn: "{{ book_isbn | default(none, true) }}"
            _pt_series: "{{ book_series | default(none, true) }}"
            _pt_genre: "{{ book_genre | default(none, true) }}"
            _pt_loan_borrower: "{{ book_loan_borrower | default(none) }}"
            _pt_loan_date: "{{ book_loan_date | default(none) }}"
            _pt_loan_due: "{{ book_loan_due | default(none) }}"
            _pt_loan_home_loc: "{{ book_loan_home_location_id | default(none) }}"
            _pt_lib_loan_borrower: "{{ library_loan_borrower | default(none, true) }}"
            _pt_lib_loan_date: "{{ library_loan_date | default(none, true) }}"
            _pt_lib_loan_due: "{{ library_loan_due | default(none, true) }}"
            _pt_lib_loan_home_loc: "{{ library_loan_home_location_id | default(none, true) }}"
        - variables:
            _pt_lib_meta: >-
              {%- set _v = library_meta | default(none, true) -%}
              {%- if _v is none or _v == 'None' or (_v is string and _v | trim == '') -%}{{ none }}
              {%- elif _v is mapping -%}{{ _v | tojson }}
              {%- else -%}{{ _v | string | trim }}
              {%- endif -%}
        - variables:
            _pt_payload: >-
              {%- set p = {} -%}
              {%- if _pt_area is not none -%}{%- set p = p | combine({'homeassistant_area': _pt_area}) -%}{%- endif -%}
              {%- if _pt_hazmat is not none -%}{%- set p = p | combine({'hazmat_class': _pt_hazmat}) -%}{%- endif -%}
              {%- if _pt_safety is not none -%}{%- set p = p | combine({'zen_safety_type': _pt_safety}) -%}{%- endif -%}
              {%- if _pt_asset is not none -%}{%- set p = p | combine({'zen_asset_type': _pt_asset}) -%}{%- endif -%}
              {%- if _pt_labels is not none -%}{%- set p = p | combine({'ha_labels': _pt_labels}) -%}{%- endif -%}
              {%- if _pt_author is not none -%}{%- set p = p | combine({'book_author': _pt_author}) -%}{%- endif -%}
              {%- if _pt_isbn is not none -%}{%- set p = p | combine({'book_isbn': _pt_isbn}) -%}{%- endif -%}
              {%- if _pt_series is not none -%}{%- set p = p | combine({'book_series': _pt_series}) -%}{%- endif -%}
              {%- if _pt_genre is not none -%}{%- set p = p | combine({'book_genre': _pt_genre}) -%}{%- endif -%}
              {%- if _pt_loan_borrower is not none -%}{%- set p = p | combine({'book_loan_borrower': _pt_loan_borrower}) -%}{%- endif -%}
              {%- if _pt_loan_date is not none -%}{%- set p = p | combine({'book_loan_date': _pt_loan_date}) -%}{%- endif -%}
              {%- if _pt_loan_due is not none -%}{%- set p = p | combine({'book_loan_due': _pt_loan_due}) -%}{%- endif -%}
              {%- if _pt_loan_home_loc is not none -%}{%- set p = p | combine({'book_loan_home_location_id': _pt_loan_home_loc}) -%}{%- endif -%}
              {%- if _pt_lib_meta is not none -%}{%- set p = p | combine({'library_meta': _pt_lib_meta}) -%}{%- endif -%}
              {%- if _pt_lib_loan_borrower is not none -%}{%- set p = p | combine({'library_loan_borrower': _pt_lib_loan_borrower}) -%}{%- endif -%}
              {%- if _pt_lib_loan_date is not none -%}{%- set p = p | combine({'library_loan_date': _pt_lib_loan_date}) -%}{%- endif -%}
              {%- if _pt_lib_loan_due is not none -%}{%- set p = p | combine({'library_loan_due': _pt_lib_loan_due}) -%}{%- endif -%}
              {%- if _pt_lib_loan_home_loc is not none -%}{%- set p = p | combine({'library_loan_home_location_id': _pt_lib_loan_home_loc}) -%}{%- endif -%}
              {{ p | tojson }}
        - action: script.zen_sutra_grocy
          response_variable: _pt_raw
          data:
            action_type: update
            endpoint: "/userfields/products/{{ product_id_resolved }}"
            payload: "{{ _pt_payload }}"
        - action: script.zen_sutra_grocy
          response_variable: _pt_prod_raw
          continue_on_error: true
          data:
            action_type: read
            endpoint: "/objects/products/{{ product_id_resolved }}"
        - variables:
            _pt_prod_obj: >-
              {%- set _c = _pt_prod_raw.get('result', {}).get('content', {}) -%}
              {{ _c if _c is mapping else {} }}
        - if: "{{ _pt_prod_obj | length > 0 }}"
          then:
            - variables:
                _pt_uf_base: >-
                  {{ _pt_prod_obj.get('userfields', {}) if _pt_prod_obj.get('userfields') is mapping else {} }}
            - variables:
                _pt_uf_merged: >-
                  {%- set ns = namespace(u=_pt_uf_base) -%}
                  {%- if _pt_area is not none -%}{%- set ns.u = ns.u | combine({'homeassistant_area': _pt_area}) -%}{%- endif -%}
                  {%- if _pt_hazmat is not none -%}{%- set ns.u = ns.u | combine({'hazmat_class': _pt_hazmat}) -%}{%- endif -%}
                  {%- if _pt_safety is not none -%}{%- set ns.u = ns.u | combine({'zen_safety_type': _pt_safety}) -%}{%- endif -%}
                  {%- if _pt_asset is not none -%}{%- set ns.u = ns.u | combine({'zen_asset_type': _pt_asset}) -%}{%- endif -%}
                  {%- if _pt_labels is not none -%}{%- set ns.u = ns.u | combine({'ha_labels': _pt_labels}) -%}{%- endif -%}
                  {%- if _pt_author is not none -%}{%- set ns.u = ns.u | combine({'book_author': _pt_author}) -%}{%- endif -%}
                  {%- if _pt_isbn is not none -%}{%- set ns.u = ns.u | combine({'book_isbn': _pt_isbn}) -%}{%- endif -%}
                  {%- if _pt_series is not none -%}{%- set ns.u = ns.u | combine({'book_series': _pt_series}) -%}{%- endif -%}
                  {%- if _pt_genre is not none -%}{%- set ns.u = ns.u | combine({'book_genre': _pt_genre}) -%}{%- endif -%}
                  {%- if _pt_loan_borrower is not none -%}{%- set ns.u = ns.u | combine({'book_loan_borrower': _pt_loan_borrower}) -%}{%- endif -%}
                  {%- if _pt_loan_date is not none -%}{%- set ns.u = ns.u | combine({'book_loan_date': _pt_loan_date}) -%}{%- endif -%}
                  {%- if _pt_loan_due is not none -%}{%- set ns.u = ns.u | combine({'book_loan_due': _pt_loan_due}) -%}{%- endif -%}
                  {%- if _pt_loan_home_loc is not none -%}{%- set ns.u = ns.u | combine({'book_loan_home_location_id': _pt_loan_home_loc}) -%}{%- endif -%}
                  {%- if _pt_lib_meta is not none -%}{%- set ns.u = ns.u | combine({'library_meta': _pt_lib_meta}) -%}{%- endif -%}
                  {%- if _pt_lib_loan_borrower is not none -%}{%- set ns.u = ns.u | combine({'library_loan_borrower': _pt_lib_loan_borrower}) -%}{%- endif -%}
                  {%- if _pt_lib_loan_date is not none -%}{%- set ns.u = ns.u | combine({'library_loan_date': _pt_lib_loan_date}) -%}{%- endif -%}
                  {%- if _pt_lib_loan_due is not none -%}{%- set ns.u = ns.u | combine({'library_loan_due': _pt_lib_loan_due}) -%}{%- endif -%}
                  {%- if _pt_lib_loan_home_loc is not none -%}{%- set ns.u = ns.u | combine({'library_loan_home_location_id': _pt_lib_loan_home_loc}) -%}{%- endif -%}
                  {{ ns.u }}
            - variables:
                _pt_prod_patch: >-
                  {%- set ns = namespace(p={}) -%}
                  {%- for k, v in _pt_prod_obj.items() -%}
                    {%- if k not in ['userfields', 'row_created_timestamp'] -%}
                      {%- if not (k in ['qu_id_stock', 'qu_id_purchase', 'qu_id_consume', 'qu_id_price'] and (v is none or (v | string | trim) == '')) -%}
                        {%- set ns.p = ns.p | combine({k: v}) -%}
                      {%- endif -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {%- set ns.p = ns.p | combine({'userfields': _pt_uf_merged}) -%}
                  {{ ns.p | tojson }}
            - action: script.zen_sutra_grocy
              response_variable: _pt_embed_raw
              continue_on_error: true
              data:
                action_type: update
                endpoint: "/objects/products/{{ product_id_resolved }}"
                payload: "{{ _pt_prod_patch }}"
        - variables:
            final_response:
              status: ok
              mode: products_tag
              product_id: "{{ product_id_resolved }}"
              tagged:
                homeassistant_area: "{{ _pt_area }}"
                hazmat_class: "{{ _pt_hazmat }}"
                zen_safety_type: "{{ _pt_safety }}"
                zen_asset_type: "{{ _pt_asset }}"
                ha_labels: "{{ _pt_labels }}"
                book_author: "{{ _pt_author }}"
                book_isbn: "{{ _pt_isbn }}"
                book_series: "{{ _pt_series }}"
                book_genre: "{{ _pt_genre }}"
              ha_labels_warning: "{{ 'ha_labels not set in this call — product remains invisible to zen_dojotools_plant mode=managed. Call products_tag again with ha_labels=<root_label> to register.' if _pt_labels is none else none }}"
              tool: "{{ tool_name }}"
              version: "{{ tool_version }}"
        - stop: Product Tagged
          response_variable: final_response
    # ── Lens bus: by_anchor — player_hint emission ───────────────────────────
    # Supports anchor_type=area_id only. Finds products with media_role set at
    # locations whose homeassistant_area matches the anchor. Emits player_hint
    # evidence items — "here is something TO PLAY ON in this room."
    - alias: 'by_anchor — lens player_hint for physical media equipment'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'by_anchor' }}"
        sequence:
        - variables:
            _ba_type: "{{ anchor_type | default('', true) | string | trim | lower }}"
            _ba_ids_raw: >-
              {%- set raw = anchor_ids | default('', true) -%}
              {%- if raw is sequence and raw is not string -%}{{ raw | list }}
              {%- elif raw is string and raw | trim != '' -%}{{ raw | trim | from_json(none) or [] }}
              {%- else -%}{{ [] }}{%- endif -%}
        - variables:
            _ba_ids: "{{ _ba_ids_raw if _ba_ids_raw is sequence and _ba_ids_raw is not string else [] }}"
        - if: "{{ _ba_type != 'area_id' or _ba_ids | length == 0 }}"
          then:
          - variables:
              final_response:
                status: ok
                evidence: []
                count: 0
                anchor_type: "{{ _ba_type }}"
                message: "Inventory lens supports anchor_type: area_id (physical media equipment in room)."
          - stop: by_anchor unsupported anchor
            response_variable: final_response
        # Fetch all locations — build area_id → location_id set.
        # Calls the underlying primitive (script.zen_sutra_grocy) directly,
        # never a self-call to script.zen_dojotools_inventory
        # (mode=locations_list) — HA's script engine blocks that as
        # recursion ("Disallowed recursion detected") whenever by_anchor is
        # reached via a call chain already inside this same script (Room
        # Manager -> Lens Dispatch -> Media Manager -> Inventory ->
        # Inventory). Same pattern used two blocks below for products. Note the raw
        # primitive nests results under result.content (paginated Grocy
        # API shape), not result directly like the wrapper normalizes to.
        - action: script.zen_sutra_grocy
          response_variable: _iba_locs_raw
          continue_on_error: true
          data:
            action_type: read
            endpoint: "/objects/locations?limit=200&offset=0"
        - variables:
            _iba_locs: >-
              {%- set r = _iba_locs_raw['result']['content'] if _iba_locs_raw is mapping and 'result' in _iba_locs_raw and _iba_locs_raw['result']['content'] is sequence else [] -%}
              {{ r if r is sequence and r is not string else [] }}
            _iba_area_loc_ids: >-
              {%- set ba_ids_lower = _ba_ids | map('lower') | list -%}
              {%- set ns = namespace(ids=[]) -%}
              {%- set locs = _iba_locs_raw['result']['content'] if _iba_locs_raw is mapping and 'result' in _iba_locs_raw and _iba_locs_raw['result']['content'] is sequence else [] -%}
              {%- for loc in locs if loc is mapping -%}
                {%- set loc_area = loc.get('userfields', {}).get('homeassistant_area', '') | string | lower | trim -%}
                {%- if loc_area != '' and loc_area in ba_ids_lower -%}
                  {%- set ns.ids = ns.ids + [loc.get('id') | int(-1)] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.ids }}
            _iba_loc_name_map: >-
              {%- set ns = namespace(d={}) -%}
              {%- set locs = _iba_locs_raw['result']['content'] if _iba_locs_raw is mapping and 'result' in _iba_locs_raw and _iba_locs_raw['result']['content'] is sequence else [] -%}
              {%- for loc in locs if loc is mapping -%}
                {%- set ns.d = ns.d | combine({loc.get('id') | string: loc.get('name', '')}) -%}
              {%- endfor -%}
              {{ ns.d }}
        # Fetch all products — filter for media_role in-memory
        - variables:
            _iba_offset: 0
            _iba_all_players: []
            _iba_page_done: false
        - repeat:
            until: "{{ _iba_page_done or _iba_offset >= 100000 }}"
            sequence:
              - action: script.zen_sutra_grocy
                response_variable: _iba_page_raw
                continue_on_error: true
                data:
                  action_type: read
                  endpoint: "/objects/products?limit=500&offset={{ _iba_offset }}"
              - variables:
                  _iba_page_size: >-
                    {{ _iba_page_raw['result']['content'] | length
                       if _iba_page_raw is mapping and 'result' in _iba_page_raw
                          and _iba_page_raw['result']['content'] is sequence
                       else 0 }}
                  _iba_page_players: >-
                    {%- set _raw = _iba_page_raw['result']['content']
                        if _iba_page_raw is mapping and 'result' in _iba_page_raw
                           and _iba_page_raw['result']['content'] is sequence
                        else [] -%}
                    {%- set ns = namespace(r=[]) -%}
                    {%- for p in _raw if p is mapping -%}
                      {%- set uf = p.get('userfields', {}) if p.get('userfields') is mapping else {} -%}
                      {%- set mrole = (uf.get('media_role', '') or '') | string | trim -%}
                      {%- if mrole != '' -%}
                        {%- set lid = p.get('location_id') | int(-1) -%}
                        {%- if lid >= 0 and lid in _iba_area_loc_ids -%}
                          {%- set mfmts_raw = (uf.get('media_formats', '') or '') | string | trim -%}
                          {%- set mfmts = mfmts_raw.split(',') | map('trim') | reject('equalto', '') | list if mfmts_raw != '' else [] -%}
                          {%- set mtypes = ['music_recording'] if mrole in ['turntable','cassette_deck','cd_player','radio'] else (['video'] if mrole in ['dvd_player','blu_ray_player','projector'] else (['book'] if mrole == 'e_reader' else (['game','video','music_recording'] if mrole == 'game_console' else (['book','periodical'] if mrole == 'reading_nook' else ['music_recording','video','book','game'])))) -%}
                          {%- set loc_name = (_iba_loc_name_map if _iba_loc_name_map is mapping else {}).get(lid | string, '') -%}
                          {%- set ns.r = ns.r + [{'product_id': p.get('id') | int, 'product_name': p.get('name', ''), 'media_role': mrole, 'media_formats': mfmts, 'media_types': mtypes, 'location_id': lid, 'location_name': loc_name, 'entity_id': (uf.get('homeassistant_entity_id', '') or '') | string | trim}] -%}
                        {%- endif -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {{ ns.r }}
              - variables:
                  _iba_all_players: >-
                    {{ (_iba_all_players | list) + (_iba_page_players if _iba_page_players is sequence else []) }}
                  _iba_page_done: "{{ (_iba_page_size | int(0)) < 500 }}"
                  _iba_offset: "{{ (_iba_offset | int) + 500 }}"
        # Build anchor_contexts + evidence items
        - variables:
            _iba_anchor_contexts: >-
              {%- set ns = namespace(ctx=[]) -%}
              {%- for aid in _ba_ids -%}
                {%- set ns.ctx = ns.ctx + [{'type': _ba_type, 'id': aid | string | trim, 'confidence': 'explicit', 'provider': 'inventory'}] -%}
              {%- endfor -%}
              {{ ns.ctx }}
            _iba_room: "{{ _ba_ids | first | string if _ba_ids | length > 0 else '' }}"
        - variables:
            _iba_evidence: >-
              {%- set ns = namespace(ev=[]) -%}
              {%- for p in _iba_all_players if p is mapping -%}
                {%- set eid = 'grocy:product:' ~ (p.get('product_id') | string) -%}
                {%- set hint = {'player_type': p.get('media_role'), 'media_formats': p.get('media_formats', []), 'media_types': p.get('media_types', []), 'dumb': p.get('entity_id', '') == '', 'entity_id': p.get('entity_id') or none, 'area': _iba_room, 'location_name': p.get('location_name', ''), 'product_name': p.get('product_name', '')} -%}
                {%- set ns.ev = ns.ev + [{'evidence_id': eid, 'leaf_type': 'player_hint', 'content_redacted': false, 'anchor_contexts': _iba_anchor_contexts, 'stack': {'provider': 'inventory', 'object_type': 'product', 'evidence_id': eid, 'lens_mode': 'by_anchor'}, 'player_hint': hint, 'content': {'product_id': p.get('product_id') | int, 'product_name': p.get('product_name', ''), 'media_role': p.get('media_role'), 'media_formats': p.get('media_formats', []), 'media_types': p.get('media_types', []), 'location_id': p.get('location_id') | int, 'location_name': p.get('location_name', ''), 'area': _iba_room}}] -%}
              {%- endfor -%}
              {{ ns.ev }}
        - variables:
            final_response:
              status: ok
              evidence: "{{ _iba_evidence }}"
              count: "{{ _iba_evidence | length }}"
              anchor_type: "{{ _ba_type }}"
        - stop: by_anchor done
          response_variable: final_response

    - alias: 'catalog_find_by_tag — find products by ZenOS userfield tags'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'catalog_find_by_tag' }}"
        sequence:
        - variables:
            _cft_sf: "{{ (safety_type | default('')) | trim }}"
            _cft_af: "{{ (asset_type  | default('')) | trim }}"
            _cft_hf: "{{ (homeassistant_area_id | default('')) | trim }}"
            _cft_lf: "{{ (ha_labels | default('')) | trim }}"
            _cft_ai: "{{ (area_id | trim) if area_id is string else '' }}"
            _cft_so: "{{ safety_only | default(false) | bool }}"
            _cft_offset: 0
            _cft_all_src: []
            _cft_page_done: false
        - repeat:
            until: "{{ _cft_page_done or _cft_offset >= 100000 }}"
            sequence:
              - action: script.zen_sutra_grocy
                response_variable: _cft_page_raw
                continue_on_error: true
                data:
                  action_type: read
                  endpoint: "/objects/products?limit=500&offset={{ _cft_offset }}"
              - variables:
                  # Filter-in-memory: iterate Python response_variable directly, render matches only.
                  # Never renders the full product list — safe for 100k+ products.
                  _cft_page_size: >-
                    {{ _cft_page_raw['result']['content'] | length
                       if _cft_page_raw is mapping and 'result' in _cft_page_raw
                          and _cft_page_raw['result']['content'] is sequence
                       else 0 }}
                  _cft_page_matches: >-
                    {%- set _raw = _cft_page_raw['result']['content']
                        if _cft_page_raw is mapping and 'result' in _cft_page_raw
                           and _cft_page_raw['result']['content'] is sequence
                        else [] -%}
                    {%- set ns = namespace(r=[]) -%}
                    {%- for p in _raw if p is mapping -%}
                      {%- set uf = p.get('userfields', {}) if p.get('userfields') is mapping else {} -%}
                      {%- set _st = uf.get('zen_safety_type', none) -%}
                      {%- set _at = uf.get('zen_asset_type', none) -%}
                      {%- set _hl = (uf.get('ha_labels', '') | default('', true)) | string | trim -%}
                      {%- set _ntags = (p.get('tags', '') | default('', true)) | string | trim -%}
                      {%- if _st is not none or _at is not none or _hl != '' or _ntags != '' -%}
                        {%- set _ha = uf.get('homeassistant_area', none) -%}
                        {%- set _hz = uf.get('hazmat_class', none) -%}
                        {%- set _all_tags = (_hl.split(',') + _ntags.split(',')) | map('trim') | reject('equalto', '') | list -%}
                        {%- set _pass_so = (not _cft_so) or (_st is not none or _hz is not none) -%}
                        {%- set _s = _cft_sf == '' or _st == _cft_sf -%}
                        {%- set _a = _cft_af == '' or _at == _cft_af -%}
                        {%- set _h = _cft_hf == '' or _ha == _cft_hf -%}
                        {%- set ns_lf = namespace(match=false) -%}
                        {%- for _lf in _cft_lf.split(',') | map('trim') | list -%}
                          {%- if _lf != '' and _lf in _all_tags -%}{%- set ns_lf.match = true -%}{%- endif -%}
                        {%- endfor -%}
                        {%- set _l = _cft_lf == '' or ns_lf.match -%}
                        {%- set _ai = _cft_ai == '' or _ha == _cft_ai or _cft_ai in _all_tags -%}
                        {%- if _pass_so and _s and _a and _h and _l and _ai -%}
                          {%- set ns.r = ns.r + [{'id': p.id, 'name': p.name,
                            'zen_safety_type': _st, 'zen_asset_type': _at,
                            'hazmat_class': _hz, 'homeassistant_area': _ha,
                            'ha_labels': _hl, 'native_tags': _ntags,
                            'location_id': p.get('location_id'),
                            'book_author': uf.get('book_author', none),
                            'book_isbn': uf.get('book_isbn', none),
                            'book_series': uf.get('book_series', none),
                            'book_genre': uf.get('book_genre', none),
                            'library_meta': uf.get('library_meta', none),
                            'library_loan_borrower': uf.get('library_loan_borrower', none),
                            'library_loan_date': uf.get('library_loan_date', none),
                            'library_loan_due': uf.get('library_loan_due', none),
                            'library_loan_home_location_id': uf.get('library_loan_home_location_id', none)}] -%}
                        {%- endif -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {{ ns.r }}
              - variables:
                  _cft_all_src: >-
                    {%- set _prev = _cft_all_src if _cft_all_src is sequence and _cft_all_src is not string else [] -%}
                    {%- set _cur = _cft_page_matches if _cft_page_matches is sequence else [] -%}
                    {{ (_prev | list) + (_cur | list) }}
                  _cft_page_done: "{{ (_cft_page_size | int(0)) < 500 }}"
                  _cft_offset: "{{ (_cft_offset | int) + 500 }}"
        - variables:
            _cft_results: >-
              {{ _cft_all_src if _cft_all_src is sequence else [] }}
        - variables:
            final_response:
              status: ok
              mode: catalog_find_by_tag
              filters:
                safety_type: "{{ _cft_sf | default(none, true) }}"
                asset_type: "{{ _cft_af | default(none, true) }}"
                homeassistant_area_id: "{{ _cft_hf | default(none, true) }}"
                ha_labels: "{{ _cft_lf | default(none, true) }}"
              count: "{{ _cft_results | length }}"
              products: "{{ _cft_results }}"
              tool: "{{ tool_name }}"
              version: "{{ tool_version }}"
        - stop: catalog_find_by_tag done
          response_variable: final_response
    - alias: 'catalog_search — unified name + tag search'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'catalog_search' }}"
        sequence:
        - variables:
            _cs_q: "{{ (item | default('') | string | trim | lower) }}"
            _cs_offset: 0
            _cs_all: []
            _cs_page_done: false
        - if:
          - condition: template
            value_template: "{{ _cs_q == '' }}"
          then:
          - variables:
              final_response:
                status: error
                mode: catalog_search
                message: item (search query) is required for catalog_search
                tool: "{{ tool_name }}"
                version: "{{ tool_version }}"
          - stop: catalog_search error
            response_variable: final_response
        - repeat:
            until: "{{ _cs_page_done or _cs_offset >= 100000 }}"
            sequence:
            - action: script.zen_sutra_grocy
              response_variable: _cs_raw
              continue_on_error: true
              data:
                action_type: read
                endpoint: "/objects/products?limit=500&offset={{ _cs_offset }}"
            - variables:
                _cs_page_size: >-
                  {{ _cs_raw['result']['content'] | length
                     if _cs_raw is mapping and 'result' in _cs_raw
                        and _cs_raw['result']['content'] is sequence
                     else 0 }}
                _cs_page_matches: >-
                  {%- set _pg = _cs_raw['result']['content']
                                if _cs_raw is mapping and 'result' in _cs_raw
                                   and _cs_raw['result']['content'] is sequence
                                else [] -%}
                  {%- set ns = namespace(r=[]) -%}
                  {%- for p in _pg if p is mapping -%}
                    {%- set _name_match = _cs_q in (p.name | default('', true) | string | lower) -%}
                    {%- set uf = p.get('userfields', {}) if p.get('userfields') is mapping else {} -%}
                    {%- set _hl = (uf.get('ha_labels', '') | default('', true)) | string | trim -%}
                    {%- set _ntags = (p.get('tags', '') | default('', true)) | string | trim -%}
                    {%- set _author = (uf.get('book_author', '') | default('', true)) | string | trim | lower -%}
                    {%- set _all_tags = (_hl.split(',') + _ntags.split(',')) | map('trim') | map('lower') | reject('equalto', '') | list -%}
                    {%- set ns_tm = namespace(match=false) -%}
                    {%- for t in _all_tags if _cs_q in t -%}{%- set ns_tm.match = true -%}{%- endfor -%}
                    {%- set _tag_match = ns_tm.match -%}
                    {%- set _author_match = _author != '' and _cs_q in _author -%}
                    {%- if _name_match or _tag_match or _author_match -%}
                      {%- set _src = 'name' if _name_match else ('author' if _author_match else 'tag') -%}
                      {%- set ns.r = ns.r + [{'id': p.id, 'name': p.name,
                        'match_source': _src,
                        'ha_labels': _hl, 'native_tags': _ntags,
                        'location_id': p.get('location_id'),
                        'book_author': uf.get('book_author', none),
                        'book_isbn': uf.get('book_isbn', none),
                        'book_series': uf.get('book_series', none),
                        'book_genre': uf.get('book_genre', none),
                        'library_meta': uf.get('library_meta', none),
                        'library_loan_borrower': uf.get('library_loan_borrower', none),
                        'library_loan_date': uf.get('library_loan_date', none),
                        'library_loan_due': uf.get('library_loan_due', none),
                        'library_loan_home_location_id': uf.get('library_loan_home_location_id', none)}] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ ns.r }}
            - variables:
                _cs_all: >-
                  {%- set _prev = _cs_all if _cs_all is sequence and _cs_all is not string else [] -%}
                  {%- set _cur = _cs_page_matches if _cs_page_matches is sequence else [] -%}
                  {{ (_prev | list) + (_cur | list) }}
                _cs_page_done: "{{ (_cs_page_size | int(0)) < 500 }}"
                _cs_offset: "{{ (_cs_offset | int) + 500 }}"
        - variables:
            final_response:
              status: ok
              mode: catalog_search
              query: "{{ _cs_q }}"
              count: "{{ _cs_all | length }}"
              products: "{{ _cs_all }}"
              tool: "{{ tool_name }}"
              version: "{{ tool_version }}"
        - stop: catalog_search done
          response_variable: final_response
    # ── receipt_intake (#10780), part 1: parse the receipt, check the money in
    #    cents, find what Grocy's stock log already holds for it, and hand the item
    #    lines still to book to the bulk_stock_add engine below (this script is
    #    queued, so it never calls itself). Part 2, after the engine, records it.
    - variables:
        _ri_dry: "{{ dry_run | default(true) | bool }}"
        _ri_bom: []
        _bsa_plan: []
        _bsa_results: []
    - if: "{{ mode_norm == 'receipt_intake' }}"
      then:
        - variables:
            _ri_r: >-
              {%- set r = receipt_in -%}
              {%- set r = (r | from_json(none)) if r is string else r -%}
              {{ r if r is mapping else {} }}
        - variables:
            _ri_id: "{{ _ri_r.get('receipt_id', '') | string | trim }}"
            _ri_lines_in: "{{ (_ri_r.get('lines') | select('mapping') | list) if (_ri_r.get('lines') is sequence and _ri_r.get('lines') is not string) else [] }}"
        - if: "{{ not (_ri_id is match('^[A-Za-z0-9._-]{1,64}$')) or _ri_lines_in | count == 0 }}"
          then:
            - variables:
                final_response:
                  status: error
                  mode: receipt_intake
                  message: "receipt must be JSON with receipt_id (letters, digits, . _ -; up to 64) and a non-empty lines list. mode=help receipt_intake shows the shape."
            - stop: receipt_intake bad input
              response_variable: final_response
        - if: "{{ not _ri_dry and not confirm_action_in }}"
          then:
            - variables:
                final_response:
                  status: error
                  mode: receipt_intake
                  message: "Booking a receipt needs dry_run=false and confirm_action=true. Run it with dry_run (the default) first."
            - stop: receipt_intake confirm required
              response_variable: final_response
        # Lines, with the money in cents. amount x unit_price vs line_total, one cent of rounding.
        - variables:
            _ri_lines: >-
              {%- set ns = namespace(o=[]) -%}
              {%- for l in _ri_lines_in -%}
                {%- set n = l.get('line', loop.index) | int(loop.index) -%}
                {%- set ty = (l.get('type', 'item') | string | lower | trim) or 'item' -%}
                {%- set amt = l.get('amount', 1 if ty in ['discount', 'coupon'] else none) -%}
                {%- set up = l.get('unit_price') -%}
                {%- set lt = l.get('line_total') -%}
                {%- set amt_f = amt | float(-1) if amt is not none else -1 -%}
                {%- set up_c = ((up | float(0)) * 100) | round(0) | int if (up is not none and up | string | trim != '') else none -%}
                {%- set lt_c = ((lt | float(0)) * 100) | round(0) | int if (lt is not none and lt | string | trim != '') else none -%}
                {%- set lt_c = (0 if ty == 'free' and lt_c is none else lt_c) -%}
                {%- set up_c = (0 if ty == 'free' and up_c is none else up_c) -%}
                {%- set up_c = (((lt_c / amt_f) | round(0) | int) if (up_c is none and lt_c is not none and amt_f > 0) else up_c) -%}
                {%- set lt_c = (((up_c * amt_f) | round(0) | int) if (lt_c is none and up_c is not none and amt_f > 0) else lt_c) -%}
                {%- set errs = ([] if ty in ['item', 'free', 'discount', 'coupon'] else ["type must be item, free, discount or coupon"])
                     + ([] if ty in ['discount', 'coupon'] or amt_f > 0 else ['no count or weight printed: held, never guessed'])
                     + ([] if lt_c is not none else ['no line total or unit price'])
                     + ((['amount x unit price (' ~ ((up_c * amt_f) / 100) | round(2) ~ ') is not the line total (' ~ (lt_c / 100) | round(2) ~ ')'] if (up_c is not none and lt_c is not none and amt_f > 0 and ((up_c * amt_f) | round(0) - lt_c) | abs > 1) else []) if ty in ['item', 'free'] else [])
                     + (['a free line must total 0'] if (ty == 'free' and lt_c not in [none, 0]) else []) -%}
                {%- set ns.o = ns.o + [{'line': n, 'type': ty, 'description': (l.get('description') or l.get('name') or '') | string,
                                        'name': l.get('name'), 'product_id': l.get('product_id'),
                                        'amount': amt_f if amt_f > 0 else none, 'unit': l.get('unit'),
                                        'unit_price_c': up_c, 'line_total_c': lt_c,
                                        'best_before_date': l.get('best_before_date'), 'nonperishable': l.get('nonperishable'),
                                        'location_id': l.get('location_id'), 'note': l.get('note'),
                                        'errors': errs}] -%}
              {%- endfor -%}
              {{ ns.o }}
        # Receipt balance in cents: items - discounts = subtotal; subtotal + tax = total (two cents).
        - variables:
            _ri_items_c: "{{ _ri_lines | selectattr('type', 'in', ['item', 'free']) | map(attribute='line_total_c') | map('int', 0) | sum }}"
            _ri_linedisc_c: "{{ _ri_lines | selectattr('type', 'in', ['discount', 'coupon']) | map(attribute='line_total_c') | map('int', 0) | map('abs') | sum }}"
            _ri_hdisc_c: "{{ (((_ri_r.get('discounts', 0) | float(0)) | abs) * 100) | round(0) | int }}"
            _ri_sub_c: "{{ ((_ri_r.get('subtotal') | float(0)) * 100) | round(0) | int if _ri_r.get('subtotal') is not none else none }}"
            _ri_tax_c: "{{ ((_ri_r.get('tax', 0) | float(0)) * 100) | round(0) | int }}"
            _ri_tot_c: "{{ ((_ri_r.get('total') | float(0)) * 100) | round(0) | int if _ri_r.get('total') is not none else none }}"
        - variables:
            _ri_net_c: "{{ _ri_items_c - _ri_linedisc_c - _ri_hdisc_c }}"
        - variables:
            _ri_balance_errors: >-
              {{ (['lines come to ' ~ (_ri_net_c / 100) | round(2) ~ ' after discounts; the subtotal says ' ~ (_ri_sub_c / 100) | round(2)] if (_ri_sub_c is not none and (_ri_net_c - _ri_sub_c) | abs > 2) else [])
                 + (['subtotal + tax = ' ~ (((_ri_sub_c if _ri_sub_c is not none else _ri_net_c) + _ri_tax_c) / 100) | round(2) ~ '; the total says ' ~ (_ri_tot_c / 100) | round(2)] if (_ri_tot_c is not none and (((_ri_sub_c if _ri_sub_c is not none else _ri_net_c) + _ri_tax_c) - _ri_tot_c) | abs > 2) else []) }}
            _ri_balance: "{{ 'unchecked' if (_ri_sub_c is none and _ri_tot_c is none) else 'balanced' }}"
        - variables:
            _ri_balance: "{{ 'unbalanced' if _ri_balance_errors | count > 0 else _ri_balance }}"
            _ri_refused: "{{ _ri_balance_errors | count > 0 and not (allow_unbalanced | default(false) | bool) }}"
        # What Grocy already booked for this receipt (replay, resume).
        - action: script.zen_sutra_grocy
          response_variable: _ri_log_raw
          continue_on_error: true
          data:
            action_type: read
            endpoint: "objects/stock_log?query%5B%5D=note~rcpt:{{ _ri_id }}/L&query%5B%5D=transaction_type=purchase&query%5B%5D=undone=0&limit=500"
        - variables:
            _ri_log: >-
              {%- set c = (_ri_log_raw.get('result', {}) or {}).get('content') if _ri_log_raw is mapping else none -%}
              {{ (c | select('mapping') | list) if (c is sequence and c is not string) else [] }}
        - variables:
            _ri_booked: >-
              {%- set ns = namespace(m={}) -%}
              {%- for b in _ri_log -%}
                {%- set f = (b.get('note') or '') | string | regex_findall('rcpt:' ~ (_ri_id | replace('.', '\\.')) ~ '/L([0-9]+)') -%}
                {%- if f | count > 0 -%}
                  {%- set k = f[0] | string -%}
                  {%- set cur = ns.m.get(k, {'booking_ids': [], 'stock_ids': []}) -%}
                  {%- set ns.m = dict(ns.m, **{k: {'booking_ids': cur.booking_ids + [b.get('id')], 'stock_ids': (cur.stock_ids + [b.get('stock_id')]) | unique | list}}) -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.m }}
            _ri_obj: >-
              {%- set ns = namespace(o=0) -%}
              {%- for b in _ri_log -%}
                {%- set f = (b.get('note') or '') | string | regex_findall('rcpt:' ~ (_ri_id | replace('.', '\\.')) ~ '/L[0-9]+/R([0-9]+)') -%}
                {%- if f | count > 0 and ns.o == 0 -%}{%- set ns.o = f[0] | int(0) -%}{%- endif -%}
              {%- endfor -%}
              {{ ns.o }}
        # The receipt and receipt_line user entities (userfields_deploy creates them).
        - action: script.zen_sutra_grocy
          response_variable: _ri_ue_raw
          continue_on_error: true
          data:
            action_type: read
            endpoint: "objects/userentities?limit=500"
        - variables:
            _ri_ue: >-
              {%- set c = (_ri_ue_raw.get('result', {}) or {}).get('content') if _ri_ue_raw is mapping else none -%}
              {%- set c = (c | select('mapping') | list) if (c is sequence and c is not string) else [] -%}
              {{ {'receipt': (c | selectattr('name', 'eq', 'receipt') | map(attribute='id') | first | default(0)) | int(0),
                  'receipt_line': (c | selectattr('name', 'eq', 'receipt_line') | map(attribute='id') | first | default(0)) | int(0)} }}
        - if: "{{ not _ri_dry and not _ri_refused and (_ri_ue.receipt == 0 or _ri_ue.receipt_line == 0) }}"
          then:
            - variables:
                final_response:
                  status: error
                  mode: receipt_intake
                  message: "The receipt and receipt_line user entities are not in Grocy yet. Run inventory mode=userfields_deploy (schema 1.4.0), then retry. Nothing was written."
            - stop: receipt_intake schema missing
              response_variable: final_response
        # Find this receipt's object: from the booking notes, else among recent receipts.
        - if: "{{ not _ri_dry and not _ri_refused and _ri_obj | int(0) == 0 }}"
          then:
            - action: script.zen_sutra_grocy
              response_variable: _ri_objs_raw
              continue_on_error: true
              data:
                action_type: read
                endpoint: "objects/userobjects?query%5B%5D=userentity_id={{ _ri_ue.receipt }}&order=id:desc&limit=50"
            - variables:
                _ri_recent: >-
                  {%- set c = (_ri_objs_raw.get('result', {}) or {}).get('content') if _ri_objs_raw is mapping else none -%}
                  {{ ((c | select('mapping') | map(attribute='id') | list) if (c is sequence and c is not string) else []) | sort(reverse=true) | list }}
            - repeat:
                for_each: "{{ _ri_recent }}"
                sequence:
                  - if: "{{ _ri_obj | int(0) == 0 }}"
                    then:
                      - action: script.zen_sutra_grocy
                        response_variable: _ri_v_raw
                        continue_on_error: true
                        data:
                          action_type: read
                          endpoint: "/userfields/userentity-receipt/{{ repeat.item }}"
                      - variables:
                          _ri_obj: >-
                            {%- set c = (_ri_v_raw.get('result', {}) or {}).get('content') if _ri_v_raw is mapping else none -%}
                            {{ repeat.item if (c is mapping and (c.get('receipt_id') | string) == _ri_id) else 0 }}
        - if: "{{ not _ri_dry and not _ri_refused and _ri_obj | int(0) == 0 }}"
          then:
            - action: script.zen_sutra_grocy
              response_variable: _ri_new_raw
              continue_on_error: true
              data:
                action_type: create
                endpoint: /objects/userobjects
                payload: "{{ {'userentity_id': _ri_ue.receipt} | tojson }}"
            - variables:
                _ri_obj: "{{ (((_ri_new_raw.get('result', {}) or {}).get('content') or {}).get('created_object_id', 0) | int(0)) if _ri_new_raw is mapping else 0 }}"
            - if: "{{ _ri_obj | int(0) == 0 }}"
              then:
                - variables:
                    final_response:
                      status: error
                      mode: receipt_intake
                      message: "Grocy would not create the receipt record. Nothing was booked."
                - stop: receipt_intake no receipt object
                  response_variable: final_response
        # The item lines still to book, in the bulk engine's shape.
        - variables:
            _ri_bom: >-
              {%- set ns = namespace(o=[]) -%}
              {%- if not _ri_refused -%}
              {%- for l in _ri_lines if l.type in ['item', 'free'] and l.errors | count == 0 and (l.line | string) not in _ri_booked -%}
                {%- set tag = 'rcpt:' ~ _ri_id ~ '/L' ~ l.line ~ ('/R' ~ _ri_obj if _ri_obj | int(0) > 0 else '') -%}
                {%- set b = {'line_ref': l.line, 'amount': l.amount, 'price': ((l.unit_price_c | int(0)) / 100),
                             'purchase_date': _ri_r.get('purchase_date', ''), 'note': tag ~ ((' | ' ~ l.note) if l.note else '')} -%}
                {%- set b = dict(b, product_id=l.product_id) if l.product_id else dict(b, name=(l.name or l.description)) -%}
                {%- set b = dict(b, shopping_location_id=_ri_r.shopping_location_id) if _ri_r.get('shopping_location_id') else (dict(b, store=_ri_r.store) if _ri_r.get('store') else b) -%}
                {%- set nb = namespace(b=b) -%}
                {%- for k in ['unit', 'best_before_date', 'nonperishable', 'location_id'] if l.get(k) not in [none, ''] -%}{%- set nb.b = dict(nb.b, **{k: l.get(k)}) -%}{%- endfor -%}
                {%- set ns.o = ns.o + [nb.b] -%}
              {%- endfor -%}
              {%- endif -%}
              {{ ns.o }}

    - alias: 'bulk_stock_add: add stock for a BOM list of products'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'bulk_stock_add' or (mode_norm == 'receipt_intake' and (_ri_bom | default([])) | count > 0) }}"
        sequence:
        - variables:
            _bsa_dry_run: "{{ (_ri_dry if mode_norm == 'receipt_intake' else (dry_run | default(false))) | bool }}"
            _bsa_hold: "{{ true if mode_norm == 'receipt_intake' else (hold_invalid | default(false) | bool) }}"
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ not _bsa_dry_run and not confirm_action_in }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: bulk_stock_add
                  message: confirm_action=true is required for bulk_stock_add (unless dry_run=true).
            - stop: Confirm Required
              response_variable: final_response
        - variables:
            _bsa_raw: >-
              {%- if mode_norm == 'receipt_intake' -%}{{ _ri_bom }}
              {%- else -%}
              {{ bom_in | from_json
                 if bom_in is string and bom_in | trim not in ['', 'none', 'null']
                 else bom_in | default([], true) }}
              {%- endif -%}
        - variables:
            _bsa_items: >-
              {%- if _bsa_raw is sequence and _bsa_raw is not mapping -%}
                {{ _bsa_raw | select('mapping') | list }}
              {%- else -%}[]
              {%- endif -%}
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _bsa_items | length == 0 }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: bulk_stock_add
                  message: "bom required - JSON array of {name: X} or {product_id: N} objects."
            - stop: No Items
              response_variable: final_response
        # Call-level values; every one can be overridden per line.
        - variables:
            _bsa_default_amount: "{{ amount | default(1, true) | float(1) }}"
            _bsa_lid: "{{ location_id_resolved | int(0) }}"
            _bsa_price: "{{ price | default(none, true) }}"
            _bsa_bbd: "{{ (best_before_date | default('', true) | string | trim) if best_before_date is defined else '' }}"
            _bsa_pdate: "{{ purchase_date_in }}"
            _bsa_store: "{{ store_norm | string | trim }}"
            _bsa_slid: "{{ (slid_in | int(0)) if slid_in not in [none, '', 'None', 'none'] else 0 }}"
            _bsa_today: "{{ now().strftime('%Y-%m-%d') }}"
        # Reference data, read once.
        - action: script.zen_sutra_grocy
          response_variable: _bsa_sl_raw
          continue_on_error: true
          data:
            action_type: read
            endpoint: "objects/shopping_locations?limit=500&offset=0"
        - action: script.zen_sutra_grocy
          response_variable: _bsa_qu_raw
          continue_on_error: true
          data:
            action_type: read
            endpoint: "objects/quantity_units?limit=500&offset=0"
        - variables:
            _bsa_sls: >-
              {%- set c = (_bsa_sl_raw.get('result', {}) or {}).get('content') if _bsa_sl_raw is mapping else none -%}
              {{ c | select('mapping') | list if (c is sequence and c is not string) else [] }}
            _bsa_qus: >-
              {%- set c = (_bsa_qu_raw.get('result', {}) or {}).get('content') if _bsa_qu_raw is mapping else none -%}
              {%- set ns = namespace(m={}) -%}
              {%- for u in (c if (c is sequence and c is not string) else []) if u is mapping -%}
                {%- set ns.m = dict(ns.m, **{(u.get('id') | string): u.get('name')}) -%}
              {%- endfor -%}
              {{ ns.m }}
            _bsa_plan: []
        # ── Preflight: every line is resolved and checked before anything is written ──
        - repeat:
            for_each: "{{ _bsa_items }}"
            sequence:
              - variables:
                  _bsai: "{{ repeat.item }}"
                  _bsai_name: "{{ repeat.item.get('name', '') | string | trim }}"
                  _bsai_pid_in: "{{ repeat.item.get('product_id', repeat.item.get('id', 0)) | int(0) }}"
                  _bsai_rows: []
                  _bsai_cands: []
              - if: "{{ _bsai_pid_in > 0 }}"
                then:
                  - action: script.zen_sutra_grocy
                    response_variable: _bsai_byid_raw
                    continue_on_error: true
                    data:
                      action_type: read
                      endpoint: "objects/products/{{ _bsai_pid_in }}"
                  - variables:
                      _bsai_rows: >-
                        {%- set c = (_bsai_byid_raw.get('result', {}) or {}).get('content') if _bsai_byid_raw is mapping else none -%}
                        {{ [c] if (c is mapping and (c.get('id') | int(0)) == _bsai_pid_in) else [] }}
              - if: "{{ _bsai_pid_in == 0 and _bsai_name != '' }}"
                then:
                  - action: script.zen_sutra_grocy
                    response_variable: _bsai_fz_raw
                    continue_on_error: true
                    data:
                      action_type: read
                      endpoint: "objects/products?query%5B%5D=name~{{ _bsai_name }}"
                  - variables:
                      _bsai_fz: >-
                        {%- set c = (_bsai_fz_raw.get('result', {}) or {}).get('content') if _bsai_fz_raw is mapping else none -%}
                        {{ c | select('mapping') | list if (c is sequence and c is not string) else [] }}
                  - variables:
                      _bsai_rows: >-
                        {%- set n = _bsai_name | lower -%}
                        {%- set ns = namespace(r=[]) -%}
                        {%- for p in _bsai_fz if (p.get('name', '') | string | lower | trim) == n -%}{%- set ns.r = ns.r + [p] -%}{%- endfor -%}
                        {{ ns.r }}
                      _bsai_cands: "{{ _bsai_fz | map(attribute='name') | list | unique | list | sort | list }}"
              - variables:
                  _bsai_match: >-
                    {%- if _bsai_pid_in > 0 -%}{{ 'explicit' if _bsai_rows | count == 1 else 'not_found' }}
                    {%- elif _bsai_rows | count == 1 -%}exact
                    {%- elif _bsai_rows | count > 1 -%}ambiguous
                    {%- else -%}not_found{%- endif -%}
                  _bsai_p: "{{ _bsai_rows[0] if _bsai_rows | count == 1 else {} }}"
              # Line values: the line's own, else the call's.
              - variables:
                  _bsai_amount: "{{ _bsai.get('amount', _bsa_default_amount) | float(_bsa_default_amount) }}"
                  _bsai_price: >-
                    {%- set v = _bsai.get('price', none) -%}
                    {{ v if (v is not none and v | string | trim not in ['', 'none', 'null']) else _bsa_price }}
                  _bsai_pdate: "{{ (_bsai.get('purchase_date', _bsai.get('purchased_date', '')) | string | trim) or _bsa_pdate }}"
                  _bsai_bbd_in: "{{ (_bsai.get('best_before_date', '') | string | trim) or _bsa_bbd }}"
                  _bsai_store: "{{ (_bsai.get('store', '') | string | trim) or _bsa_store }}"
                  _bsai_slid_in: "{{ _bsai.get('shopping_location_id', 0) | int(0) or _bsa_slid }}"
                  _bsai_lid: "{{ _bsai.get('location_id', 0) | int(0) or _bsa_lid or (_bsai_p.get('location_id', 0) | int(0)) }}"
                  _bsai_nonper: "{{ _bsai.get('nonperishable', false) | bool(false) }}"
                  _bsai_note: "{{ _bsai.get('note', '') | string | trim }}"
                  _bsai_unit: "{{ _bsai.get('unit', '') | string | trim }}"
              - variables:
                  _bsai_pdate_eff: "{{ _bsai_pdate if _bsai_pdate != '' else _bsa_today }}"
                  _bsai_pdate_bad: "{{ _bsai_pdate != '' and (not (_bsai_pdate is match('^\\d{4}-\\d{2}-\\d{2}$')) or (_bsai_pdate | as_datetime) is none) }}"
                  _bsai_store_res: >-
                    {%- if _bsai_slid_in > 0 -%}
                      {%- set m = _bsa_sls | selectattr('id', 'eq', _bsai_slid_in) | list -%}
                      {{ {'id': _bsai_slid_in, 'name': m[0].name if m | count == 1 else none, 'how': 'explicit' if m | count == 1 else 'unknown_id'} }}
                    {%- elif _bsai_store != '' -%}
                      {%- set s = _bsai_store | lower -%}
                      {%- set ns = namespace(ex=[], pa=[]) -%}
                      {%- for l in _bsa_sls -%}
                        {%- set ln = l.get('name', '') | string | lower | trim -%}
                        {%- if ln == s -%}{%- set ns.ex = ns.ex + [l] -%}{%- elif s in ln -%}{%- set ns.pa = ns.pa + [l] -%}{%- endif -%}
                      {%- endfor -%}
                      {%- if ns.ex | count == 1 -%}{{ {'id': ns.ex[0].id, 'name': ns.ex[0].name, 'how': 'exact'} }}
                      {%- elif ns.ex | count == 0 and ns.pa | count == 1 -%}{{ {'id': ns.pa[0].id, 'name': ns.pa[0].name, 'how': 'partial'} }}
                      {%- else -%}{{ {'id': 0, 'name': none, 'how': 'ambiguous' if (ns.ex + ns.pa) | count > 1 else 'unknown', 'candidates': (ns.ex + ns.pa) | map(attribute='name') | list} }}
                      {%- endif -%}
                    {%- else -%}{{ {'id': 0, 'name': none, 'how': 'none'} }}
                    {%- endif -%}
              - variables:
                  _bsai_dbd: "{{ _bsai_p.get('default_best_before_days', 0) | int(0) }}"
                  _bsai_bbd_bad: "{{ _bsai_bbd_in != '' and (not (_bsai_bbd_in is match('^\\d{4}-\\d{2}-\\d{2}$')) or (_bsai_bbd_in | as_datetime) is none) }}"
              - variables:
                  _bsai_bbd: >-
                    {%- if _bsai_bbd_in != '' and not _bsai_bbd_bad -%}{{ _bsai_bbd_in }}
                    {%- elif _bsai_nonper or _bsai_dbd == -1 -%}2999-12-31
                    {%- elif _bsai_dbd > 0 and not _bsai_pdate_bad -%}{{ (strptime(_bsai_pdate_eff, '%Y-%m-%d') + timedelta(days=_bsai_dbd)).strftime('%Y-%m-%d') }}
                    {%- endif -%}
                  _bsai_bbd_how: >-
                    {%- if _bsai_bbd_in != '' and not _bsai_bbd_bad -%}explicit
                    {%- elif _bsai_nonper -%}nonperishable
                    {%- elif _bsai_dbd == -1 -%}product_never_expires
                    {%- elif _bsai_dbd > 0 -%}purchase_date_plus_{{ _bsai_dbd }}_days
                    {%- else -%}unknown{%- endif -%}
                  _bsai_qp: "{{ _bsai_p.get('qu_id_purchase') }}"
                  _bsai_qs: "{{ _bsai_p.get('qu_id_stock') }}"
              - variables:
                  _bsai_errors: >-
                    {{ ([] if _bsai_match in ['explicit', 'exact'] else
                          [('product ' ~ ('id ' ~ _bsai_pid_in if _bsai_pid_in > 0 else "'" ~ _bsai_name ~ "'") ~ (' matches several products (give product_id)' if _bsai_match == 'ambiguous' else ' not found'))])
                       + ([] if _bsai_amount > 0 else ['amount must be more than 0'])
                       + (['purchase_date must be a real YYYY-MM-DD date'] if _bsai_pdate_bad else [])
                       + (['purchase_date is in the future'] if (not _bsai_pdate_bad and _bsai_pdate_eff > _bsa_today) else [])
                       + (['best_before_date must be a real YYYY-MM-DD date'] if _bsai_bbd_bad else [])
                       + (['store ' ~ (("'" ~ _bsai_store ~ "' is ambiguous: " ~ (_bsai_store_res.get('candidates', []) | join(', '))) if _bsai_store_res.how == 'ambiguous' else ("'" ~ _bsai_store ~ "' not found (shopping_locations_list shows the stores)")) ] if _bsai_store_res.how in ['ambiguous', 'unknown'] else [])
                       + (['shopping_location_id ' ~ _bsai_slid_in ~ ' does not exist'] if _bsai_store_res.how == 'unknown_id' else [])
                       + ((['product has no purchase or stock unit (set qu_id_purchase / qu_id_stock first)'] if (_bsai_qp in [none, '', 0] or _bsai_qs in [none, '', 0]) else [])
                          + (['product is a parent with no stock of its own (no_own_stock); book a child product'] if (_bsai_p.get('no_own_stock', 0) | int(0)) == 1 else [])
                          + (["best-before unknown: the product's default is 0 days; give best_before_date, or nonperishable=true"] if _bsai_bbd_how == 'unknown' else [])
                          + ((["unit '" ~ _bsai_unit ~ "' is not the product's purchase unit ('" ~ (_bsa_qus.get(_bsai_qp | string) or '?') ~ "')"] if (_bsai_unit != '' and (_bsai_unit | lower) != ((_bsa_qus.get(_bsai_qp | string) or '') | string | lower)) else [])
                             + (["the product buys in '" ~ (_bsa_qus.get(_bsai_qp | string) or '?') ~ "' but stocks in '" ~ (_bsa_qus.get(_bsai_qs | string) or '?') ~ "'; a receipt line is not converted"] if (mode_norm == 'receipt_intake' and _bsai_qp not in [none, '', 0] and _bsai_qs not in [none, '', 0] and (_bsai_qp | string) != (_bsai_qs | string)) else []))
                          if _bsai_p | count > 0 else []) }}
                  _bsai_warnings: >-
                    {{ (['no purchase_date: today is used'] if _bsai_pdate == '' else [])
                       + (["store '" ~ _bsai_store ~ "' matched by part of its name: " ~ _bsai_store_res.name] if _bsai_store_res.how == 'partial' else [])
                       + (['similar products: ' ~ (_bsai_cands | reject('eq', _bsai_p.get('name')) | list | join(', '))] if (_bsai_cands | reject('eq', _bsai_p.get('name')) | list | count) > 0 else [])
                       + (['no store given'] if _bsai_store_res.how == 'none' else []) }}
              - variables:
                  _bsa_plan: >-
                    {{ _bsa_plan + [{
                         'line': repeat.index, 'name': _bsai_name,
                         'product_id': _bsai_p.get('id', _bsai_pid_in) | int(0), 'product': _bsai_p.get('name'), 'match': _bsai_match,
                         'amount': _bsai_amount,
                         'purchase_unit': _bsa_qus.get(_bsai_qp | string), 'stock_unit': _bsa_qus.get(_bsai_qs | string),
                         'price': (_bsai_price | float) if (_bsai_price is not none and _bsai_price | string | trim not in ['', 'none', 'null']) else none,
                         'purchased_date': _bsai_pdate_eff,
                         'shopping_location_id': _bsai_store_res.id if _bsai_store_res.id | int(0) > 0 else none, 'store': _bsai_store_res.name,
                         'best_before_date': _bsai_bbd if _bsai_bbd != '' else none, 'best_before_source': _bsai_bbd_how,
                         'location_id': _bsai_lid if _bsai_lid > 0 else none,
                         'note': _bsai_note if _bsai_note != '' else none,
                         'unit': _bsai_unit if _bsai_unit != '' else none,
                         'line_ref': _bsai.get('line_ref'),
                         'errors': _bsai_errors, 'warnings': _bsai_warnings}] }}
        - variables:
            _bsa_bad: "{{ _bsa_plan | selectattr('errors', 'ne', []) | list }}"
            _bsa_good: "{{ _bsa_plan | selectattr('errors', 'eq', []) | list }}"
        # Preview, or refuse when a line is wrong and hold_invalid is not set.
        - if: "{{ _bsa_dry_run or (_bsa_bad | count > 0 and not _bsa_hold) }}"
          then:
            - variables:
                final_response:
                  status: "{{ 'preview' if _bsa_dry_run else 'error' }}"
                  mode: bulk_stock_add
                  dry_run: "{{ _bsa_dry_run }}"
                  message: >-
                    {{ ('Preview: nothing was written. ' if _bsa_dry_run else 'Nothing was written: ')
                       ~ (_bsa_bad | count) ~ ' of ' ~ (_bsa_plan | count) ~ ' lines have errors.'
                       ~ (' Fix them, or pass hold_invalid=true to book the valid lines and hold the rest.' if _bsa_bad | count > 0 else '') }}
                  summary:
                    total: "{{ _bsa_plan | count }}"
                    ready: "{{ _bsa_good | count }}"
                    with_errors: "{{ _bsa_bad | count }}"
                  items: "{{ _bsa_plan }}"
            - if: "{{ mode_norm == 'bulk_stock_add' }}"
              then:
                - stop: Bulk Stock Add Preview
                  response_variable: final_response
        # ── Book the valid lines; each is verified against Grocy's booking record ──
        - variables:
            _bsa_results: "{{ _bsa_bad | map('combine', {'status': 'held'}) | list }}"
        - repeat:
            for_each: "{{ [] if _bsa_dry_run else _bsa_good }}"
            sequence:
              - variables:
                  _bw: "{{ repeat.item }}"
              - variables:
                  _bw_payload: >-
                    {%- set p = {'amount': _bw.amount, 'transaction_type': 'purchase', 'purchased_date': _bw.purchased_date, 'best_before_date': _bw.best_before_date} -%}
                    {%- if _bw.price is not none -%}{%- set p = dict(p, price=_bw.price) -%}{%- endif -%}
                    {%- if _bw.location_id is not none -%}{%- set p = dict(p, location_id=_bw.location_id) -%}{%- endif -%}
                    {%- if _bw.shopping_location_id is not none -%}{%- set p = dict(p, shopping_location_id=_bw.shopping_location_id) -%}{%- endif -%}
                    {%- if _bw.note is not none -%}{%- set p = dict(p, note=_bw.note) -%}{%- endif -%}
                    {{ p | tojson }}
              - action: script.zen_sutra_grocy
                response_variable: _bw_raw
                continue_on_error: true
                data:
                  action_type: create
                  endpoint: "/stock/products/{{ _bw.product_id }}/add"
                  payload: "{{ _bw_payload }}"
              - variables:
                  _bw_http: "{{ ((_bw_raw.get('result', {}) or {}).get('status', 0) | int(0)) if _bw_raw is mapping else 0 }}"
                  _bw_book: >-
                    {%- set c = (_bw_raw.get('result', {}) or {}).get('content') if _bw_raw is mapping else none -%}
                    {%- set c = [c] if c is mapping else c -%}
                    {{ (c | select('mapping') | selectattr('product_id', 'defined') | list) if (c is sequence and c is not string) else [] }}
              - variables:
                  _bw_mismatch: >-
                    {%- set ns = namespace(m=[]) -%}
                    {%- for b in _bw_book -%}
                      {%- if (b.get('purchased_date', '') | string)[:10] != _bw.purchased_date -%}{%- set ns.m = ns.m + ['purchased_date ' ~ b.get('purchased_date')] -%}{%- endif -%}
                      {%- if _bw.best_before_date is not none and (b.get('best_before_date', '') | string)[:10] != _bw.best_before_date -%}{%- set ns.m = ns.m + ['best_before_date ' ~ b.get('best_before_date')] -%}{%- endif -%}
                      {%- if _bw.shopping_location_id is not none and (b.get('shopping_location_id') | int(0)) != (_bw.shopping_location_id | int(0)) -%}{%- set ns.m = ns.m + ['shopping_location_id ' ~ b.get('shopping_location_id')] -%}{%- endif -%}
                    {%- endfor -%}
                    {{ ns.m | unique | list }}
                  _bw_amount_booked: "{{ _bw_book | map(attribute='amount') | map('float', 0) | sum }}"
              - variables:
                  _bw_status: >-
                    {%- if not (200 <= _bw_http < 300) -%}failed
                    {%- elif _bw_book | count == 0 -%}unverified
                    {%- elif _bw_mismatch | count > 0 or (_bw_amount_booked - _bw.amount) | abs > 0.0001 -%}mismatch
                    {%- else -%}added{%- endif -%}
              - variables:
                  _bsa_results: >-
                    {{ _bsa_results + [_bw | combine({
                         'status': _bw_status,
                         'http_status': _bw_http,
                         'booking_ids': _bw_book | map(attribute='id') | list,
                         'stock_ids': _bw_book | map(attribute='stock_id') | unique | list,
                         'amount_booked': _bw_amount_booked,
                         'mismatch': _bw_mismatch,
                         'reason': ('grocy answered HTTP ' ~ _bw_http) if _bw_status == 'failed' else ('grocy returned no booking record to verify' if _bw_status == 'unverified' else (('booked values differ: ' ~ (_bw_mismatch | join(', '))) if _bw_status == 'mismatch' else ''))})] }}
        - variables:
            final_response:
              status: "{{ 'success' if (_bsa_results | selectattr('status', 'eq', 'added') | list | count) == (_bsa_results | count) else ('partial' if (_bsa_results | selectattr('status', 'eq', 'added') | list | count) > 0 else 'error') }}"
              mode: bulk_stock_add
              dry_run: false
              summary:
                total: "{{ _bsa_results | count }}"
                added: "{{ _bsa_results | selectattr('status', 'eq', 'added') | list | count }}"
                held: "{{ _bsa_results | selectattr('status', 'eq', 'held') | list | count }}"
                failed: "{{ _bsa_results | selectattr('status', 'in', ['failed', 'unverified', 'mismatch']) | list | count }}"
              items: "{{ _bsa_results }}"
        - if: "{{ mode_norm == 'bulk_stock_add' }}"
          then:
            - stop: Bulk Stock Add Complete
              response_variable: final_response

    # ── receipt_intake (#10780), part 2: each line's outcome, and the receipt and
    #    its lines kept in Grocy (not on a dry run or a refused receipt).
    - if: "{{ mode_norm == 'receipt_intake' }}"
      then:
        - variables:
            _ri_eng: "{{ _bsa_results if (not _ri_dry and _bsa_results | count > 0) else _bsa_plan }}"
        - variables:
            _ri_out: >-
              {%- set ns = namespace(o=[]) -%}
              {%- for l in _ri_lines -%}
                {%- set k = l.line | string -%}
                {%- set e = (_ri_eng | selectattr('line_ref', 'defined') | selectattr('line_ref', 'eq', l.line) | list | first) | default({}) -%}
                {%- if l.type in ['discount', 'coupon'] -%}{%- set st, why = 'recorded', 'a ' ~ l.type ~ ': recorded on the receipt, not stocked' -%}
                {%- elif l.errors | count > 0 -%}{%- set st, why = 'held', l.errors | join('; ') -%}
                {%- elif k in _ri_booked -%}{%- set st, why = 'already_booked', 'booked before (Grocy stock log)' -%}
                {%- elif _ri_refused -%}{%- set st, why = 'not_booked', 'the receipt does not balance' -%}
                {%- elif e | count == 0 -%}{%- set st, why = 'held', 'not reached' -%}
                {%- elif _ri_dry -%}{%- set st, why = ('ready' if e.get('errors', []) | count == 0 else 'held'), (e.get('errors', []) | join('; ')) -%}
                {%- else -%}{%- set st, why = ({'added': 'booked', 'held': 'held'}.get(e.get('status'), e.get('status') or 'failed')), ((e.get('errors', []) | join('; ')) or e.get('reason', '')) -%}
                {%- endif -%}
                {%- set ns.o = ns.o + [{'line': l.line, 'type': l.type, 'description': l.description,
                     'product_id': e.get('product_id', l.product_id), 'product': e.get('product'),
                     'amount': l.amount, 'unit': l.unit, 'unit_price': ((l.unit_price_c / 100) if l.unit_price_c is not none else none),
                     'line_total': ((l.line_total_c / 100) if l.line_total_c is not none else none),
                     'status': st, 'reason': why,
                     'best_before_date': e.get('best_before_date'), 'purchase_unit': e.get('purchase_unit'),
                     'warnings': e.get('warnings', []),
                     'booking_ids': (_ri_booked.get(k, {}).get('booking_ids', []) if st == 'already_booked' else e.get('booking_ids', [])),
                     'stock_ids': (_ri_booked.get(k, {}).get('stock_ids', []) if st == 'already_booked' else e.get('stock_ids', []))}] -%}
              {%- endfor -%}
              {{ ns.o }}
        - variables:
            _ri_items_out: "{{ _ri_out | selectattr('type', 'in', ['item', 'free']) | list }}"
        - variables:
            _ri_n_booked: "{{ _ri_items_out | selectattr('status', 'in', ['booked', 'already_booked']) | list | count }}"
            _ri_n_held: "{{ _ri_items_out | rejectattr('status', 'in', ['booked', 'already_booked', 'ready']) | list | count }}"
        - variables:
            _ri_status: "{{ 'booked' if (_ri_n_booked == _ri_items_out | count) else ('partial' if _ri_n_booked > 0 else 'held') }}"
        # Keep the receipt and its lines (live runs only).
        - if: "{{ not _ri_dry and not _ri_refused and _ri_obj | int(0) > 0 }}"
          then:
            - action: script.zen_sutra_grocy
              response_variable: _ri_cur_raw
              continue_on_error: true
              data:
                action_type: read
                endpoint: "/userfields/userentity-receipt/{{ _ri_obj }}"
            - variables:
                _ri_cur: >-
                  {%- set c = (_ri_cur_raw.get('result', {}) or {}).get('content') if _ri_cur_raw is mapping else none -%}
                  {{ c if c is mapping else {} }}
                _ri_lmap: >-
                  {%- set c = (_ri_cur_raw.get('result', {}) or {}).get('content') if _ri_cur_raw is mapping else none -%}
                  {%- set m = (c.get('line_object_ids') or '{}') if c is mapping else '{}' -%}
                  {%- set m = (m | from_json({})) if m is string else m -%}
                  {{ m if m is mapping else {} }}
            - repeat:
                for_each: "{{ _ri_out }}"
                sequence:
                  - variables:
                      _ril_id: "{{ _ri_lmap.get(repeat.item.line | string, 0) | int(0) }}"
                  - if: "{{ _ril_id == 0 }}"
                    then:
                      - action: script.zen_sutra_grocy
                        response_variable: _ril_new_raw
                        continue_on_error: true
                        data:
                          action_type: create
                          endpoint: /objects/userobjects
                          payload: "{{ {'userentity_id': _ri_ue.receipt_line} | tojson }}"
                      - variables:
                          _ril_id: "{{ (((_ril_new_raw.get('result', {}) or {}).get('content') or {}).get('created_object_id', 0) | int(0)) if _ril_new_raw is mapping else 0 }}"
                      - variables:
                          _ri_lmap: "{{ dict(_ri_lmap, **{(repeat.item.line | string): _ril_id}) if _ril_id > 0 else _ri_lmap }}"
                  - if: "{{ _ril_id > 0 }}"
                    then:
                      - action: script.zen_sutra_grocy
                        continue_on_error: true
                        data:
                          action_type: update
                          endpoint: "/userfields/userentity-receipt_line/{{ _ril_id }}"
                          payload: >-
                            {{ {'receipt_object_id': _ri_obj | int, 'receipt_id': _ri_id, 'line': repeat.item.line,
                                'description': repeat.item.description, 'line_type': repeat.item.type,
                                'product_id': repeat.item.product_id, 'amount': repeat.item.amount, 'unit': repeat.item.unit,
                                'unit_price': repeat.item.unit_price, 'line_total': repeat.item.line_total,
                                'status': ('booked' if repeat.item.status == 'already_booked' else repeat.item.status), 'reason': ('' if repeat.item.status == 'already_booked' else repeat.item.reason),
                                'booking_ids': repeat.item.booking_ids | tojson, 'stock_ids': repeat.item.stock_ids | tojson,
                                'updated_at': now().isoformat()} | tojson }}
            - action: script.zen_sutra_grocy
              continue_on_error: true
              data:
                action_type: update
                endpoint: "/userfields/userentity-receipt/{{ _ri_obj }}"
                payload: >-
                  {{ {'receipt_id': _ri_id, 'store': (_bsa_plan | map(attribute='store') | reject('none') | first | default(_ri_cur.get('store') or _ri_r.get('store'))),
                      'shopping_location_id': (_bsa_plan | map(attribute='shopping_location_id') | reject('none') | first | default(_ri_cur.get('shopping_location_id') or _ri_r.get('shopping_location_id'))),
                      'purchase_date': _ri_r.get('purchase_date'), 'subtotal': _ri_r.get('subtotal'), 'tax': _ri_r.get('tax'),
                      'discounts': _ri_r.get('discounts'), 'total': _ri_r.get('total'), 'balance': _ri_balance, 'status': _ri_status,
                      'line_count': _ri_out | count, 'booked_count': _ri_n_booked, 'held_count': _ri_n_held,
                      'line_object_ids': _ri_lmap | tojson, 'source_ref': _ri_r.get('source_ref'), 'notes': _ri_r.get('notes'),
                      'updated_at': now().isoformat()} | tojson }}
        - variables:
            final_response:
              status: "{{ 'preview' if _ri_dry else ('error' if _ri_refused else ('success' if _ri_status == 'booked' else ('partial' if _ri_status == 'partial' else 'held'))) }}"
              mode: receipt_intake
              dry_run: "{{ _ri_dry }}"
              receipt_id: "{{ _ri_id }}"
              receipt_object_id: "{{ _ri_obj | int(0) if _ri_obj | int(0) > 0 else none }}"
              message: >-
                {{ ('Preview: nothing was written. ' if _ri_dry else '')
                   ~ (('Refused, nothing booked: ' ~ (_ri_balance_errors | join('; ')) ~ '. Fix the lines or totals, or pass allow_unbalanced=true.') if _ri_refused else
                      (_ri_n_booked ~ ' of ' ~ (_ri_items_out | count) ~ ' item lines booked' ~ (' (some before)' if (_ri_out | selectattr('status', 'eq', 'already_booked') | list | count) > 0 else '')
                       ~ ('; ' ~ _ri_n_held ~ ' held (see each line)' if _ri_n_held > 0 else '') ~ '.')) }}
              money:
                items: "{{ (_ri_items_c / 100) | round(2) }}"
                discounts: "{{ ((_ri_linedisc_c + _ri_hdisc_c) / 100) | round(2) }}"
                net: "{{ (_ri_net_c / 100) | round(2) }}"
                subtotal: "{{ (_ri_sub_c / 100) | round(2) if _ri_sub_c is not none else none }}"
                tax: "{{ (_ri_tax_c / 100) | round(2) }}"
                total: "{{ (_ri_tot_c / 100) | round(2) if _ri_tot_c is not none else none }}"
                balance: "{{ _ri_balance }}"
                problems: "{{ _ri_balance_errors }}"
              summary:
                lines: "{{ _ri_out | count }}"
                item_lines: "{{ _ri_items_out | count }}"
                booked_now: "{{ _ri_items_out | selectattr('status', 'eq', 'booked') | list | count }}"
                already_booked: "{{ _ri_items_out | selectattr('status', 'eq', 'already_booked') | list | count }}"
                ready: "{{ _ri_items_out | selectattr('status', 'eq', 'ready') | list | count }}"
                held: "{{ _ri_n_held }}"
                recorded_not_stocked: "{{ _ri_out | selectattr('status', 'eq', 'recorded') | list | count }}"
              lines: "{{ _ri_out }}"
        - stop: receipt_intake done
          response_variable: final_response

    # --- bulk_stock_reconcile_recent: reverses an erroneous duplicate booking
    #     (e.g. a receipt re-booked onto stock it was already booked to).
    #     stock_undo_booking can refuse ("subsequent dependent bookings"), and a
    #     blind stock_consume risks eating the ORIGINAL legitimate entries instead
    #     of the erroneous ones (Grocy consumes by soonest-expiry, not by
    #     recency). This uses Grocy's own
    #     stock_inventory_adjust (reconcile-to-a-measured-total) instead: for each
    #     product, sum only the entries created at/after since_timestamp (the
    #     erroneous-booking window) and subtract that from the
    #     current total. dry_run defaults true — this can preview any correction
    #     before writing anything. ---
    - alias: 'bulk_stock_reconcile_recent: reverse recent duplicate bookings for a BOM list'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'bulk_stock_reconcile_recent' }}"
        sequence:
        - variables:
            _bsr_dry_run: "{{ dry_run | default(true) | bool }}"
        - if: "{{ not _bsr_dry_run and not confirm_action_in }}"
          then:
          - variables:
              final_response:
                status: error
                mode: bulk_stock_reconcile_recent
                message: confirm_action=true is required when dry_run=false.
          - stop: Confirm Required
            response_variable: final_response
        - variables:
            _bsr_since: "{{ since_timestamp | default('', true) | string | trim }}"
        - if: "{{ _bsr_since == '' }}"
          then:
          - variables:
              final_response:
                status: error
                mode: bulk_stock_reconcile_recent
                message: since_timestamp is required (e.g. '2026-07-21 10:50:00') — the cutoff marking when the erroneous entries were created.
          - stop: No Cutoff
            response_variable: final_response
        - variables:
            _bsr_raw: >-
              {{ bom_in | from_json
                 if bom_in is string and bom_in | trim not in ['', 'none', 'null']
                 else bom_in | default([], true) }}
        - variables:
            _bsr_items: >-
              {%- if _bsr_raw is sequence and _bsr_raw is not mapping -%}
                {{ _bsr_raw | list }}
              {%- else -%}[]
              {%- endif -%}
        - if: "{{ _bsr_items | length == 0 }}"
          then:
          - variables:
              final_response:
                status: error
                mode: bulk_stock_reconcile_recent
                message: "bom required - JSON array of {product_id: N} or {name: X} objects."
          - stop: No Items
            response_variable: final_response
        - variables:
            _bsr_results: []
            _bsr_corrected: 0
            _bsr_skipped: 0
            _bsr_failed: 0
        - repeat:
            for_each: "{{ _bsr_items }}"
            sequence:
              - variables:
                  _bsri_name: "{{ repeat.item.get('name', '') | string | trim }}"
                  _bsri_pid: "{{ repeat.item.get('product_id', repeat.item.get('id', 0)) | int(0) }}"
              - if: "{{ _bsri_pid | int(0) == 0 and _bsri_name != '' }}"
                then:
                  - action: script.zen_sutra_grocy
                    response_variable: _bsri_exact_raw
                    data:
                      action_type: read
                      endpoint: "objects/products?query%5B%5D=name={{ _bsri_name }}"
                  - variables:
                      _bsri_pid: >-
                        {%- set _raw = _bsri_exact_raw['result']['content'] | default(none, true) -%}
                        {%- set _dl = _raw if _raw is sequence and _raw is not string else [] -%}
                        {%- set _norm = _bsri_name | lower -%}
                        {%- set ns = namespace(found=0) -%}
                        {%- for p in _dl if p is mapping -%}
                          {%- if p['name'] | default('', true) | lower == _norm -%}
                            {%- set ns.found = p['id'] | default(0) | int(0) -%}
                          {%- endif -%}
                        {%- endfor -%}
                        {{ ns.found }}
              - if: "{{ _bsri_pid | int(0) > 0 }}"
                then:
                  - action: script.zen_sutra_grocy
                    response_variable: _bsri_entries_raw
                    continue_on_error: true
                    data:
                      action_type: read
                      endpoint: "/stock/products/{{ _bsri_pid | int }}/entries"
                  - action: script.zen_sutra_grocy
                    response_variable: _bsri_details_raw
                    continue_on_error: true
                    data:
                      action_type: read
                      endpoint: "/stock/products/{{ _bsri_pid | int }}"
                  - variables:
                      _bsri_entries: >-
                        {%- set _raw = _bsri_entries_raw['result']['content'] | default(none, true) -%}
                        {{ _raw if _raw is sequence and _raw is not string else [] }}
                      _bsri_current: >-
                        {%- set _raw = _bsri_details_raw['result']['content'] | default({}, true) -%}
                        {{ (_raw.get('stock_amount', 0) if _raw is mapping else 0) | float(0) }}
                      _bsri_name_resolved: >-
                        {%- set _raw = _bsri_details_raw['result']['content'] | default({}, true) -%}
                        {{ (_raw.get('product', {}).get('name', '') if _raw is mapping else '') }}
                  - variables:
                      _bsri_recent_entries: >-
                        {{ _bsri_entries | selectattr('row_created_timestamp', 'ge', _bsr_since) | list }}
                  - variables:
                      _bsri_erroneous_amt: >-
                        {{ _bsri_recent_entries | map(attribute='amount') | map('float', 0) | sum }}
                  - if: "{{ _bsri_erroneous_amt <= 0 }}"
                    then:
                      - variables:
                          _bsr_results: >-
                            {{ _bsr_results + [{'product_id': _bsri_pid, 'name': _bsri_name_resolved, 'status': 'skipped', 'reason': 'no entries at/after since_timestamp'}] }}
                          _bsr_skipped: "{{ _bsr_skipped | int + 1 }}"
                    else:
                      - variables:
                          _bsri_corrected_total: "{{ [(_bsri_current - _bsri_erroneous_amt), 0] | max }}"
                      - if: "{{ _bsr_dry_run }}"
                        then:
                          - variables:
                              _bsr_results: >-
                                {{ _bsr_results + [{'product_id': _bsri_pid, 'name': _bsri_name_resolved, 'status': 'preview', 'current_amount': _bsri_current, 'erroneous_amount': _bsri_erroneous_amt, 'corrected_amount': _bsri_corrected_total, 'matched_entries': _bsri_recent_entries | length}] }}
                        else:
                          - action: script.zen_sutra_grocy
                            response_variable: _bsri_adjust_raw
                            continue_on_error: true
                            data:
                              action_type: create
                              endpoint: "/stock/products/{{ _bsri_pid | int }}/inventory"
                              payload: "{{ {'new_amount': _bsri_corrected_total} | tojson }}"
                          - variables:
                              _bsri_ok: >-
                                {%- set _r = _bsri_adjust_raw['result'] | default({}, true) -%}
                                {{ _r['status_code'] | default(200) | int < 300 }}
                          - variables:
                              _bsr_results: >-
                                {{ _bsr_results + [{'product_id': _bsri_pid, 'name': _bsri_name_resolved, 'status': ('corrected' if _bsri_ok else 'failed'), 'current_amount': _bsri_current, 'erroneous_amount': _bsri_erroneous_amt, 'corrected_amount': _bsri_corrected_total, 'matched_entries': _bsri_recent_entries | length}] }}
                              _bsr_corrected: "{{ _bsr_corrected | int + 1 if _bsri_ok else _bsr_corrected | int }}"
                              _bsr_failed: "{{ _bsr_failed | int + 1 if not _bsri_ok else _bsr_failed | int }}"
                else:
                  - variables:
                      _bsr_results: >-
                        {{ _bsr_results + [{'name': _bsri_name, 'status': 'failed', 'reason': 'product not found'}] }}
                      _bsr_failed: "{{ _bsr_failed | int + 1 }}"
        - variables:
            final_response:
              status: success
              mode: bulk_stock_reconcile_recent
              dry_run: "{{ _bsr_dry_run }}"
              since_timestamp: "{{ _bsr_since }}"
              summary:
                total: "{{ _bsr_items | length }}"
                corrected: "{{ _bsr_corrected | int }}"
                skipped: "{{ _bsr_skipped | int }}"
                failed: "{{ _bsr_failed | int }}"
              items: "{{ _bsr_results }}"
        - stop: Bulk Stock Reconcile Recent Complete
          response_variable: final_response

    - alias: 'bulk_label_add: append label slugs to ha_labels on BOM list'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm in ['bulk_label_add', 'bulk_label_remove'] }}"
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ not confirm_action_in }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: "{{ mode_norm }}"
                  message: confirm_action=true is required.
            - stop: Confirm Required
              response_variable: final_response
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ (ha_labels | default('', true)) | trim == '' }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: "{{ mode_norm }}"
                  message: ha_labels required — comma-separated slugs to add or remove.
            - stop: No Labels
              response_variable: final_response
        - variables:
            _bl_raw: >-
              {{ bom_in | from_json
                 if bom_in is string and bom_in | trim not in ['', 'none', 'null']
                 else bom_in | default([], true) }}
        - variables:
            _bl_items: >-
              {%- if _bl_raw is sequence and _bl_raw is not mapping -%}
                {{ _bl_raw | list }}
              {%- else -%}[]
              {%- endif -%}
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _bl_items | length == 0 }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: "{{ mode_norm }}"
                  message: "bom required - JSON array of {name: X} or {product_id: N} objects."
            - stop: No Items
              response_variable: final_response
        - variables:
            _bl_target_slugs: >-
              {{ ((ha_labels | default('', true)) | string | trim | lower
                 | replace(' ', '')).split(',') | reject('equalto', '') | list }}
            _bl_results: []
            _bl_updated: 0
            _bl_skipped: 0
            _bl_failed: 0
        - repeat:
            for_each: "{{ _bl_items }}"
            sequence:
              - variables:
                  _bli_name: "{{ repeat.item.get('name', '') | string | trim }}"
                  _bli_pid: "{{ repeat.item.get('product_id', repeat.item.get('id', 0)) | int(0) }}"
              - if: "{{ _bli_pid | int(0) == 0 and _bli_name != '' }}"
                then:
                  - action: script.zen_sutra_grocy
                    response_variable: _bli_exact_raw
                    data:
                      action_type: read
                      endpoint: "objects/products?query%5B%5D=name={{ _bli_name }}"
                  - variables:
                      _bli_pid: >-
                        {%- set _raw = _bli_exact_raw['result']['content'] | default(none, true) -%}
                        {%- set _dl = _raw if _raw is sequence and _raw is not string else [] -%}
                        {%- set _norm = _bli_name | lower -%}
                        {%- set ns = namespace(found=0) -%}
                        {%- for p in _dl if p is mapping -%}
                          {%- if p['name'] | default('', true) | lower == _norm -%}
                            {%- set ns.found = p['id'] | default(0) | int(0) -%}
                          {%- endif -%}
                        {%- endfor -%}
                        {{ ns.found }}
              - if: "{{ _bli_pid | int(0) == 0 and _bli_name != '' }}"
                then:
                  - action: script.zen_sutra_grocy
                    response_variable: _bli_fuzzy_raw
                    data:
                      action_type: read
                      endpoint: "objects/products?query%5B%5D=name~{{ _bli_name }}"
                  - variables:
                      _bli_pid: >-
                        {%- set _raw = _bli_fuzzy_raw['result']['content'] | default(none, true) -%}
                        {%- set _dl = _raw if _raw is sequence and _raw is not string else [] -%}
                        {%- set _norm = _bli_name | lower -%}
                        {%- set ns = namespace(found=0) -%}
                        {%- for p in _dl if p is mapping -%}
                          {%- if p['name'] | default('', true) | lower == _norm -%}
                            {%- set ns.found = p['id'] | default(0) | int(0) -%}
                          {%- endif -%}
                        {%- endfor -%}
                        {{ ns.found }}
              - if: "{{ _bli_pid | int(0) > 0 }}"
                then:
                  # Fetch current userfields to read existing ha_labels
                  - action: script.zen_sutra_grocy
                    response_variable: _bli_uf_raw
                    continue_on_error: true
                    data:
                      action_type: read
                      endpoint: "/userfields/products/{{ _bli_pid | int }}"
                  - variables:
                      _bli_current_labels: >-
                        {%- set _c = _bli_uf_raw['result']['content'] | default(none, true) -%}
                        {%- set _c = _c if _c is mapping else {} -%}
                        {{ ((_c['ha_labels'] | default('', true)) | string | trim | lower
                           | replace(' ', '')).split(',') | reject('equalto', '') | list }}
                  - variables:
                      _bli_new_labels: >-
                        {%- if mode_norm == 'bulk_label_remove' -%}
                          {{ _bli_current_labels | reject('in', _bl_target_slugs) | list }}
                        {%- else -%}
                          {{ (_bli_current_labels + _bl_target_slugs) | unique | list }}
                        {%- endif -%}
                  - variables:
                      _bli_changed: "{{ _bli_new_labels | sort | join(',') != _bli_current_labels | sort | join(',') }}"
                  - if: "{{ _bli_changed }}"
                    then:
                      - action: script.zen_sutra_grocy
                        response_variable: _bli_write_raw
                        continue_on_error: true
                        data:
                          action_type: update
                          endpoint: "/userfields/products/{{ _bli_pid | int }}"
                          payload: "{{ {'ha_labels': _bli_new_labels | join(',')} | tojson }}"
                      - variables:
                          _bli_ok: >-
                            {%- set _r = _bli_write_raw['result'] | default({}, true) -%}
                            {{ _r['status_code'] | default(200) | int < 300 }}
                      - variables:
                          _bl_results: >-
                            {{ (_bl_results if _bl_results is sequence else [])
                               + [{'name': _bli_name, 'product_id': _bli_pid | int,
                                   'status': 'updated' if _bli_ok else 'failed',
                                   'labels_before': _bli_current_labels | join(','),
                                   'labels_after': _bli_new_labels | join(',') if _bli_ok else _bli_current_labels | join(',')}] }}
                          _bl_updated: "{{ _bl_updated | int + 1 if _bli_ok else _bl_updated | int }}"
                  - if: "{{ not _bli_changed }}"
                    then:
                      - variables:
                          _bl_results: >-
                            {{ (_bl_results if _bl_results is sequence else [])
                               + [{'name': _bli_name, 'product_id': _bli_pid | int,
                                   'status': 'skipped', 'reason': 'no change needed'}] }}
                          _bl_skipped: "{{ _bl_skipped | int + 1 }}"
              - if: "{{ _bli_pid | int(0) == 0 }}"
                then:
                  - variables:
                      _bl_results: >-
                        {{ (_bl_results if _bl_results is sequence else [])
                           + [{'name': _bli_name, 'status': 'failed', 'reason': 'product not found'}] }}
                      _bl_failed: "{{ _bl_failed | int + 1 }}"
        - variables:
            final_response:
              status: success
              mode: "{{ mode_norm }}"
              operation: "{{ 'remove' if mode_norm == 'bulk_label_remove' else 'add' }}"
              target_slugs: "{{ _bl_target_slugs }}"
              summary:
                total: "{{ _bl_items | length }}"
                updated: "{{ _bl_updated | int }}"
                skipped: "{{ _bl_skipped | int }}"
                failed: "{{ _bl_failed | int }}"
              items: "{{ _bl_results }}"
        - stop: Bulk Label Op Complete
          response_variable: final_response

    - alias: 'bulk_product_ref_add: append one ticket/doc ref to a BOM list of products'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'bulk_product_ref_add' }}"
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ not confirm_action_in }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: bulk_product_ref_add
                  message: confirm_action=true is required.
            - stop: Confirm Required
              response_variable: final_response
        - variables:
            _bpr_ref_type: "{{ ref_type | default('') | string | trim | lower }}"
            _bpr_id_int: "{{ ref_id | default(none) | int(none) if ref_id is defined and ref_id is not none else none }}"
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _bpr_ref_type not in ['ticket', 'doc'] or _bpr_id_int is none }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: bulk_product_ref_add
                  message: 'Required: ref_type (ticket|doc); ref_id (integer ID).'
            - stop: Missing Ref Fields
              response_variable: final_response
        - variables:
            _bpr_raw: >-
              {{ bom_in | from_json
                 if bom_in is string and bom_in | trim not in ['', 'none', 'null']
                 else bom_in | default([], true) }}
        - variables:
            _bpr_items: >-
              {%- if _bpr_raw is sequence and _bpr_raw is not mapping -%}
                {{ _bpr_raw | list }}
              {%- else -%}[]
              {%- endif -%}
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _bpr_items | length == 0 }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: bulk_product_ref_add
                  message: "bom required - JSON array of {name: X} or {product_id: N} objects."
            - stop: No Items
              response_variable: final_response
        - variables:
            _bpr_field: "{{ 'zen_ticket_refs' if _bpr_ref_type == 'ticket' else 'zen_doc_refs' }}"
            _bpr_results: []
            _bpr_updated_count: 0
            _bpr_already: 0
            _bpr_failed: 0
        - repeat:
            for_each: "{{ _bpr_items }}"
            sequence:
              - variables:
                  _bpri_name: "{{ repeat.item.get('name', '') | string | trim }}"
                  _bpri_pid: "{{ repeat.item.get('product_id', repeat.item.get('id', 0)) | int(0) }}"
              - if: "{{ _bpri_pid | int(0) == 0 and _bpri_name != '' }}"
                then:
                  - action: script.zen_sutra_grocy
                    response_variable: _bpri_exact_raw
                    data:
                      action_type: read
                      endpoint: "objects/products?query%5B%5D=name={{ _bpri_name }}"
                  - variables:
                      _bpri_pid: >-
                        {%- set _raw = _bpri_exact_raw['result']['content'] | default(none, true) -%}
                        {%- set _dl = _raw if _raw is sequence and _raw is not string else [] -%}
                        {%- set _norm = _bpri_name | lower -%}
                        {%- set ns = namespace(found=0) -%}
                        {%- for p in _dl if p is mapping -%}
                          {%- if p['name'] | default('', true) | lower == _norm -%}
                            {%- set ns.found = p['id'] | default(0) | int(0) -%}
                          {%- endif -%}
                        {%- endfor -%}
                        {{ ns.found }}
              - if: "{{ _bpri_pid | int(0) == 0 and _bpri_name != '' }}"
                then:
                  - action: script.zen_sutra_grocy
                    response_variable: _bpri_fuzzy_raw
                    data:
                      action_type: read
                      endpoint: "objects/products?query%5B%5D=name~{{ _bpri_name }}"
                  - variables:
                      _bpri_pid: >-
                        {%- set _raw = _bpri_fuzzy_raw['result']['content'] | default(none, true) -%}
                        {%- set _dl = _raw if _raw is sequence and _raw is not string else [] -%}
                        {%- set _norm = _bpri_name | lower -%}
                        {%- set ns = namespace(found=0) -%}
                        {%- for p in _dl if p is mapping -%}
                          {%- if p['name'] | default('', true) | lower == _norm -%}
                            {%- set ns.found = p['id'] | default(0) | int(0) -%}
                          {%- endif -%}
                        {%- endfor -%}
                        {{ ns.found }}
              - if: "{{ _bpri_pid | int(0) > 0 }}"
                then:
                  - action: script.zen_sutra_grocy
                    response_variable: _bpri_uf_raw
                    continue_on_error: true
                    data:
                      action_type: read
                      endpoint: "/userfields/products/{{ _bpri_pid | int }}"
                  - variables:
                      _bpri_uf: >-
                        {{ _bpri_uf_raw.get('result', {}).get('content', {})
                           if _bpri_uf_raw is mapping and _bpri_uf_raw.get('status') == 'success'
                           else {} }}
                  - variables:
                      _bpri_existing_raw: "{{ _bpri_uf.get(_bpr_field, '[]') if _bpri_uf is mapping else '[]' }}"
                  - variables:
                      _bpri_existing: >-
                        {%- set r = _bpri_existing_raw -%}
                        {{ (r | from_json) if r is string and r | trim not in ('', 'None') else (r if r is sequence else []) }}
                  - variables:
                      _bpri_already_present: "{{ _bpr_id_int in (_bpri_existing | list) }}"
                  - variables:
                      _bpri_updated: >-
                        {%- set _ns = namespace(refs=_bpri_existing | list) -%}
                        {%- if _bpr_id_int not in _ns.refs -%}
                          {%- set _ns.refs = _ns.refs + [_bpr_id_int] -%}
                        {%- endif -%}
                        {{ _ns.refs }}
                  - if: "{{ not _bpri_already_present }}"
                    then:
                      - action: script.zen_sutra_grocy
                        response_variable: _bpri_write_raw
                        continue_on_error: true
                        data:
                          action_type: update
                          endpoint: "/userfields/products/{{ _bpri_pid | int }}"
                          payload: '{{ {_bpr_field: _bpri_updated | tojson} | tojson }}'
                      - variables:
                          _bpri_write_http: >-
                            {{ _bpri_write_raw['result']['status'] | int(0)
                               if _bpri_write_raw is mapping and 'result' in _bpri_write_raw else 0 }}
                          _bpri_ok: "{{ _bpri_write_http in [200, 204] }}"
                      - event: zen_inventory_ref_logged
                        event_data:
                          ref_type: "{{ _bpr_ref_type }}"
                          ref_id: "{{ _bpr_id_int }}"
                          product_id: "{{ _bpri_pid | int }}"
                          field: "{{ _bpr_field }}"
                          refs: "{{ _bpri_updated }}"
                          status: "{{ 'ok' if _bpri_ok else 'warn' }}"
                      - variables:
                          _bpr_results: >-
                            {{ (_bpr_results if _bpr_results is sequence else [])
                               + [{'name': _bpri_name, 'product_id': _bpri_pid | int,
                                   'status': 'updated' if _bpri_ok else 'failed'}] }}
                          _bpr_updated_count: "{{ _bpr_updated_count | int + 1 if _bpri_ok else _bpr_updated_count | int }}"
                          _bpr_failed: "{{ _bpr_failed | int if _bpri_ok else _bpr_failed | int + 1 }}"
                  - if: "{{ _bpri_already_present }}"
                    then:
                      - variables:
                          _bpr_results: >-
                            {{ (_bpr_results if _bpr_results is sequence else [])
                               + [{'name': _bpri_name, 'product_id': _bpri_pid | int,
                                   'status': 'already_present'}] }}
                          _bpr_already: "{{ _bpr_already | int + 1 }}"
              - if: "{{ _bpri_pid | int(0) == 0 }}"
                then:
                  - variables:
                      _bpr_results: >-
                        {{ (_bpr_results if _bpr_results is sequence else [])
                           + [{'name': _bpri_name, 'status': 'failed', 'reason': 'product not found'}] }}
                      _bpr_failed: "{{ _bpr_failed | int + 1 }}"
        - variables:
            final_response:
              status: success
              mode: bulk_product_ref_add
              ref_type: "{{ _bpr_ref_type }}"
              ref_id: "{{ _bpr_id_int }}"
              summary:
                total: "{{ _bpr_items | length }}"
                updated: "{{ _bpr_updated_count | int }}"
                already_present: "{{ _bpr_already | int }}"
                failed: "{{ _bpr_failed | int }}"
              items: "{{ _bpr_results }}"
        - stop: Bulk Product Ref Add Complete
          response_variable: final_response

    - alias: 'bulk_tag: apply userfield tags to a BOM list of products'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'bulk_tag' }}"
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ not confirm_action_in }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: bulk_tag
                  message: confirm_action=true is required for bulk_tag.
            - stop: Confirm Required
              response_variable: final_response
        - variables:
            _bt_raw: >-
              {{ bom_in | from_json
                 if bom_in is string and bom_in | trim not in ['', 'none', 'null']
                 else bom_in | default([], true) }}
        - variables:
            _bt_items: >-
              {%- if _bt_raw is sequence and _bt_raw is not mapping -%}
                {{ _bt_raw | list }}
              {%- else -%}[]
              {%- endif -%}
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _bt_items | length == 0 }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: bulk_tag
                  message: "bom required — JSON array of {name: X} or {product_id: N} objects."
            - stop: No Items
              response_variable: final_response
        - variables:
            _bt_labels: "{{ ha_labels | default(none, true) }}"
            _bt_asset: "{{ asset_type | default(none, true) }}"
            _bt_safety: "{{ safety_type | default(none, true) }}"
            _bt_area: "{{ homeassistant_area_id | default(none, true) }}"
            _bt_author: "{{ book_author | default(none, true) }}"
            _bt_isbn: "{{ book_isbn | default(none, true) }}"
            _bt_series: "{{ book_series | default(none, true) }}"
            _bt_genre: "{{ book_genre | default(none, true) }}"
            _bt_results: []
            _bt_updated: 0
            _bt_failed: 0
        - repeat:
            for_each: "{{ _bt_items }}"
            sequence:
              - variables:
                  _bti_name: "{{ repeat.item.get('name', '') | string | trim }}"
                  _bti_pid: "{{ repeat.item.get('product_id', repeat.item.get('id', 0)) | int(0) }}"
              - if: "{{ _bti_pid | int(0) == 0 and _bti_name != '' }}"
                then:
                  - action: script.zen_sutra_grocy
                    response_variable: _bti_exact_raw
                    data:
                      action_type: read
                      endpoint: "objects/products?query%5B%5D=name={{ _bti_name }}"
                  - variables:
                      _bti_pid: >-
                        {%- set _raw = _bti_exact_raw['result']['content'] | default(none, true) -%}
                        {%- set _dl = _raw if _raw is sequence and _raw is not string else [] -%}
                        {%- set _norm = _bti_name | lower -%}
                        {%- set ns = namespace(found=0) -%}
                        {%- for p in _dl if p is mapping -%}
                          {%- if p['name'] | default('', true) | lower == _norm -%}
                            {%- set ns.found = p['id'] | default(0) | int(0) -%}
                          {%- endif -%}
                        {%- endfor -%}
                        {{ ns.found }}
              - if: "{{ _bti_pid | int(0) == 0 and _bti_name != '' }}"
                then:
                  - action: script.zen_sutra_grocy
                    response_variable: _bti_fuzzy_raw
                    data:
                      action_type: read
                      endpoint: "objects/products?query%5B%5D=name~{{ _bti_name }}"
                  - variables:
                      _bti_pid: >-
                        {%- set _raw = _bti_fuzzy_raw['result']['content'] | default(none, true) -%}
                        {%- set _dl = _raw if _raw is sequence and _raw is not string else [] -%}
                        {%- set _norm = _bti_name | lower -%}
                        {%- set ns = namespace(found=0) -%}
                        {%- for p in _dl if p is mapping -%}
                          {%- if p['name'] | default('', true) | lower == _norm -%}
                            {%- set ns.found = p['id'] | default(0) | int(0) -%}
                          {%- endif -%}
                        {%- endfor -%}
                        {{ ns.found }}
              - if: "{{ _bti_pid | int(0) > 0 }}"
                then:
                  - variables:
                      _bti_uf: >-
                        {%- set p = {} -%}
                        {%- if _bt_labels is not none -%}{%- set p = p | combine({'ha_labels': _bt_labels}) -%}{%- endif -%}
                        {%- if _bt_asset is not none -%}{%- set p = p | combine({'zen_asset_type': _bt_asset}) -%}{%- endif -%}
                        {%- if _bt_safety is not none -%}{%- set p = p | combine({'zen_safety_type': _bt_safety}) -%}{%- endif -%}
                        {%- if _bt_area is not none -%}{%- set p = p | combine({'homeassistant_area': _bt_area}) -%}{%- endif -%}
                        {%- if _bt_author is not none -%}{%- set p = p | combine({'book_author': _bt_author}) -%}{%- endif -%}
                        {%- if _bt_isbn is not none -%}{%- set p = p | combine({'book_isbn': _bt_isbn | string}) -%}{%- endif -%}
                        {%- if _bt_series is not none -%}{%- set p = p | combine({'book_series': _bt_series}) -%}{%- endif -%}
                        {%- if _bt_genre is not none -%}{%- set p = p | combine({'book_genre': _bt_genre}) -%}{%- endif -%}
                        {{ p | tojson }}
                  - action: script.zen_sutra_grocy
                    response_variable: _bti_tag_raw
                    continue_on_error: true
                    data:
                      action_type: update
                      endpoint: "/userfields/products/{{ _bti_pid | int }}"
                      payload: "{{ _bti_uf }}"
                  - variables:
                      _bti_ok: >-
                        {%- set _r = _bti_tag_raw['result'] | default({}, true) -%}
                        {{ _r['status_code'] | default(200) | int < 300 }}
                  - variables:
                      _bt_results: >-
                        {{ (_bt_results if _bt_results is sequence else [])
                           + [{'name': _bti_name, 'product_id': _bti_pid | int,
                               'status': 'updated' if _bti_ok else 'failed',
                               'reason': '' if _bti_ok else 'grocy api error'}] }}
                      _bt_updated: "{{ _bt_updated | int + 1 if _bti_ok else _bt_updated | int }}"
              - if: "{{ _bti_pid | int(0) == 0 }}"
                then:
                  - variables:
                      _bt_results: >-
                        {{ (_bt_results if _bt_results is sequence else [])
                           + [{'name': _bti_name, 'status': 'failed', 'reason': 'product not found'}] }}
                      _bt_failed: "{{ _bt_failed | int + 1 }}"
        - variables:
            final_response:
              status: success
              mode: bulk_tag
              summary:
                total: "{{ _bt_items | length }}"
                updated: "{{ _bt_updated | int }}"
                failed: "{{ _bt_failed | int }}"
              items: "{{ _bt_results }}"
        - stop: Bulk Tag Complete
          response_variable: final_response

