          stock_bbd_audit:
            intent: "Read only (#10778). Stock whose best-before equals its purchase date on a product with a 0-day default shelf life: what a missing best-before left behind. Suspects, not verdicts. Fix one with stock_entry_update entry_id=<id> best_before_date=<real date> after a person confirms it."
            needs: []
            example: "{'mode':'stock_bbd_audit'}"
          stock_waste_expired:
            intent: "Expired stock by stock entry (#10762). dry_run (default true) lists each expired entry: product, entry_id, amount, best-before, location, days expired; an entry that looks like a false date (stock_bbd_audit) is excluded and never wasted. To waste: dry_run=false, confirm_action=true, entry_ids=[the approved entries]; only those, still expired and eligible, are consumed as spoiled from their own entry (newer batches stay), each read back."
            optional: [item or product_id (one product), location or location_id (one place), entry_ids, dry_run, confirm_action]
            example: "{'mode':'stock_waste_expired'}  then  {'mode':'stock_waste_expired','dry_run':false,'confirm_action':true,'entry_ids':[977,1000]}"
          stock_audit_perishable:
            intent: Audit — find stock in perishable locations with default_best_before_days=-1 (never-expires products that need expiry tracking). Reverse complement of coaching — catches existing violations in live stock.
            needs: []
            does: /objects/locations + /objects/stock + /objects/products (paginated, template cross-ref)
            example: "{'mode':'stock_audit_perishable'}"
            best_before_days_defaults:
              guidance: >-
                When a human asks what best_before_days to set, use these as starting points.
                Always defer to the product label if available. These are reasonable defaults
                for products without a printed date or when cataloging in bulk.
              canned_goods: 1825
              canned_goods_note: Tomatoes, beans, chili, broth — 5 years is the USDA guidance for low-acid canned goods
              jarred_sauces: 730
              jarred_sauces_note: Pasta sauces, pesto, simmer sauces, curry paste, coconut cream — 2 years sealed
              pickled_and_preserved: 730
              pickled_and_preserved_note: Jalapeños, olives, peppers, relish, tahini — 2 years sealed
              condiments: 365
              condiments_note: Mayo, mustard, salsa, hot sauce — 1 year (refrigerate after opening)
              dry_spices_and_seasonings: 1095
              dry_spices_and_seasonings_note: Ground spices lose potency in 2-3 years; whole spices last longer
              cooking_oils: 730
              cooking_oils_note: Olive oil, avocado oil — 2 years unopened; 6 months after opening
              wine: 1825
              wine_note: Table wine 3-5 years; fine wine longer — use label guidance
              beer_and_canned_drinks: 365
              beer_and_canned_drinks_note: 1 year for most; IPAs closer to 90 days
              dry_pasta_and_rice: 1825
              dry_pasta_and_rice_note: 5 years dry — effectively indefinite if sealed
              never_expires_candidates: [batteries, filters, paper_products, cleaning_supplies, tools]
              never_expires_note: Set best_before_days=-1 for non-food items in perishable locations (e.g. fridge water filters)
          locations_reparent_bulk:
            intent: "Bulk-set parent on child locations. Idempotent — safe to re-run. Inherits parent homeassistant_area to each child. Preserves child area if parent has none (unless confirm_action=true clears it)."
            needs:
            - parent_location_id
            - child_location_ids
            optional:
            - confirm_action (true = allow blanking child homeassistant_area when parent has none)
            does: "GET parent area → per child: read current state, skip if already correct, PUT grocy_parent_location_id + homeassistant_area if changed, sync child lists"
            example: "{'mode':'locations_reparent_bulk','parent_location_id':15,'child_location_ids':'[201,202,203]'}"
          locations_audit:
            intent: Scan all locations, report HA area mismatches and parent/child integrity issues.
            needs: []
            does: GET /objects/locations?limit=500&offset=0
            example: "{'mode':'locations_audit'}"
          stock_register_asset:
            intent: "1-call asset registration: create product, stock 1 unit BBD=never, set meta. Dupe-guards. hazmat_class triggers lean RM safety[] log."
            needs:
            - item
            - location
            optional:
            - note
            - brand
            - sku
            - price
            - hazmat_class
            - confirm_action
            example: "{'mode':'stock_register_asset','item':'Power Drill','location':'Garage','note':'18V cordless, model XR20V','brand':'DeWalt'}"
          locations_delete_safe:
            intent: Delete a location, transferring any stock to orphan_to first if needed.
            needs:
            - location_id
            optional:
            - orphan_to
            does: GET stock/locations/{id}/entries + optional transfer + DELETE
            example: "{'mode':'locations_delete_safe','location_id':261,'orphan_to':141}"
          locations_hierarchy_rebuild:
            intent: Rebuild grocy_child_location_ids for all parent locations from ground truth. Fixes stale lists after bulk imports or direct API edits.
            needs: []
            optional: [dry_run]
            does: GET all locations, derive children per parent, PUT corrected lists
            example: "{'mode':'locations_hierarchy_rebuild'}"
          stock_area_summary:
            intent: Containers + item counts for a HA area. Returns flat locations list + location_tree (3-level hierarchy). Includes RM anchor + hazmat safety.
            needs: [homeassistant_area_id]
            optional: []
            does: GET locations by area, GET all products in single bulk call, count by default location_id per location, build location_tree from grocy_parent_location_id userfield, read RM spatial for anchor + safety
            note: "Area membership flows via default location: product.location_id → location.homeassistant_area_id → HA area. Products do NOT need a direct area_id. To add a product to an area summary, set its default location to any location in that area."
            example: "{'mode':'stock_area_summary','homeassistant_area_id':'kitchen'}"
          stock_area_volatile:
            intent: Volatile items (overdue/due_soon/expiring) stored in a HA area. Filters whole-house volatile by room location membership.
            needs: [homeassistant_area_id]
            optional: []
            does: GET locations by area, GET /stock/volatile, filter slim items by default location_id membership, return overdue/due_soon/expiring lists + counts
            example: "{'mode':'stock_area_volatile','homeassistant_area_id':'kitchen'}"
          chores_by_area:
            intent: Chores for a HA area. Two discovery paths - product stocked in area, or chore userfield homeassistant_area tagged directly.
            needs: [homeassistant_area_id]
            optional: []
            does: GET locations + chore defs + chore state. Path 1 = product entries in area locs. Path 2 = userfields.homeassistant_area match. discovery field shows which path.
            example: "{'mode':'chores_by_area','homeassistant_area_id':'powder_room'}"
          chores_due:
            intent: House-wide due/overdue chores — every chore, no area filter, tagged with its homeassistant_area (or 'unassigned') where known. Use this for a whole-home overview; use chores_by_area when scoped to one room.
            needs: []
            optional: [include_all (default false — only is_due chores; set true to return every chore regardless of due status)]
            does: GET chore defs + chore state (same computed /chores join as chores_by_area, without the area filter step), attach userfields.homeassistant_area per chore.
            example: "{'mode':'chores_due'}"
          room_brief:
            intent: Chores + stock summary for a HA area in one call. Use instead of chores_by_area + stock_area_summary to save a round trip.
            needs: [homeassistant_area_id]
            reads: chores_by_area + stock_area_summary combined
            example: "{'mode':'room_brief','homeassistant_area_id':'kitchen'}"
          userfields_list:
            intent: List all Grocy userfield schema definitions.
            needs: []
            optional: [entity]
            reads: GET /objects/userfields
          userfields_deploy:
            intent: Idempotent deploy of canonical ZenOS userfield schema. Creates missing fields, skips existing. Stamps schema_version to household cabinet.
            needs: []
            writes: POST /objects/userfields (per missing field)
            notes:
              - schema_version stamped to household cabinet grocy_schema key
          userfields_repair:
            intent: "Diff live Grocy schema vs canonical. Reports ok/missing/type_drift/caption_drift/unknown + version delta. Fixes missing + patches caption drift unless dry_run=true."
            needs: []
            optional: [dry_run]
            reads: GET /objects/userfields
            notes:
              - caption_drift detected when canonical caption is not contained in existing caption — patched via PUT /objects/userfields/{id}
              - type_drift to a text type is fixed (values are kept, Grocy stores them as text); any other type change is reported only, fix by hand
          userfields_delete:
            intent: Delete a userfield schema definition by ID. Warns if canonical. Preview without confirm_action.
            needs: [field_id]
            optional: [confirm_action]
            writes: "DELETE /objects/userfields/{id}"
            notes:
              - Deleting orphans all stored values for that field. IRREVERSIBLE.
          userfields_create:
            intent: Create a new userfield schema definition on a Grocy entity. Idempotent — returns already_exists if the same entity+name already exists.
            needs: [entity, field_name, field_caption]
            optional: [field_type (default text-single-line)]
            writes: POST /objects/userfields
          userentities_list:
            intent: List all custom Grocy userentity types (ERP object type registry).
            needs: []
            reads: GET /objects/userentities
          userentities_create:
            intent: Create a new custom Grocy userentity (ERP object type). Use item as the snake_case name slug.
            needs: [item (snake_case name), field_caption (display caption)]
            optional: [note (description)]
            writes: POST /objects/userentities
            notes:
              - "entity_qualifier in response: userentity-{name} — use this for userfields ops"
          userentities_delete:
            intent: Delete a custom userentity by ID. IRREVERSIBLE — removes all userobjects and stored values. Requires confirm_action.
            needs: [userentity_id, confirm_action]
            writes: DELETE /objects/userentities/{id}
          userobjects_list:
            intent: List userobjects. Filter to one type by passing userentity_id.
            needs: []
            optional: [userentity_id]
            reads: GET /objects/userobjects
          userobjects_create:
            intent: Create a new userobject under a custom userentity.
            needs: [userentity_id]
            writes: POST /objects/userobjects
            notes:
              - Use userentity_values_set to write field values after creation
          userobjects_delete:
            intent: Delete a userobject by ID. Requires confirm_action.
            needs: [userobject_id, confirm_action]
            writes: DELETE /objects/userobjects/{id}
          userentity_values_get:
            intent: Read all userfield values for a specific userobject.
            needs:
              - "entity (userentity-{name} form)"
              - userobject_id
            reads: "GET /userfields/{entity}/{userobject_id}"
          userentity_values_set:
            intent: Write userfield values for a specific userobject. Pass all fields to update as a JSON dict.
            needs:
              - "entity (userentity-{name} form)"
              - userobject_id
              - values_json
            writes: "PUT /userfields/{entity}/{userobject_id}"
          product_refs_get:
            intent: Get all ticket/doc refs for a product.
            needs: [item OR product_id]
            returns: "{product_id, ticket_refs: [], doc_refs: []}"
          product_ref_add:
            intent: Append a Zammad ticket or Paperless doc ID to a product’s ref array. Fires zen_inventory_ref_logged event.
            needs: [item OR product_id, ref_type (ticket|doc), ref_id (int)]
            returns: "{status ok|warn, product_id, ref_type, ref_id, refs_updated, already_present}"
          product_ref_remove:
            intent: Remove a ticket or doc ID from a product’s ref array.
            needs: [item OR product_id, ref_type (ticket|doc), ref_id (int)]
            returns: "{status ok|warn, refs_updated, was_present}"
          by_anchor:
            intent: "Lens bus entry point. anchor_type=area_id returns player_hint evidence for every product in that area with media_role set. Tells agents what physical playback hardware exists in a room."
            needs: [anchor_type (area_id), anchor_ids (JSON array of area slugs)]
            does: "Scan all products for media_role userfield at locations whose homeassistant_area matches anchor_ids. Emits player_hint evidence: {player_type, media_formats, media_types, dumb, entity_id, area, location_name}."
            returns: "{status, evidence[], count, anchor_type}"
            example: "{‘mode’:’by_anchor’,’anchor_type’:’area_id’,’anchor_ids’:’[\"living_room\"]’}"
          register:
            intent: Enroll Inventory as a Lens bus provider in the household lens_registry cabinet key. Run once after deploy or if registry is reset.
            needs: []
            does: Writes {consumes:[area_id], returns:[player_hint], script:script.zen_dojotools_inventory, anchor_mode:by_anchor, department:inventory} to lens_registry.
            returns: "{status ok, provider, registry_entry}"
            example: "{‘mode’:’register’}"
          unregister:
            intent: Remove Inventory from lens_registry.
            needs: []
            returns: "{status ok, message}"
            example: "{‘mode’:’unregister’}"
    - alias: 'Mode: Help'
      choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm == ''help'' }}'
          alias: 'Mode: HELP'
        sequence:
        - variables:
            _inv_help_message: >-
              {%- set ns = namespace(out='Deterministic, construct-safe intent router for Grocy -- explicit household intents to explicit Grocy API calls, all names resolved to IDs, no implicit mutation. ') -%}
              {%- for k, v in cases.items() if v is mapping -%}
                {%- set need = (v.get('needs', []) | join(' ')) -%}
                {%- set ns.out = ns.out ~ 'mode=' ~ k ~ (' ' ~ need if need else '') ~ ' -- ' ~ (v.get('intent', '') | string) ~ ' ' -%}
              {%- endfor -%}
              {{ ns.out | trim }}
        - variables:
            help_json: "{{\n  {\n    \"status\": \"help\",\n    \"message\": _inv_help_message,\n    \"tool\": tool_name | default(''),\n    \"version\":
              tool_version | default(''),\n    \"overview\":\n      \"Zen DojoTools
              Inventory is a deterministic, construct-safe intent router for Grocy.
              It converts explicit household intents into explicit Grocy API calls.
              All names are resolved to IDs, all writes are intentional, and no implicit
              mutation or inference is performed. Grocy is treated as the canonical
              authority for products, locations, and quantity units.\",\n\n    \"read_this_first\":
              [\n      \"This tool does exactly what you tell it to do—nothing more,
              nothing less.\",\n      \"Every write is intentional. Every ID is resolved
              before execution.\",\n      \"If an operation is blocked, it is because
              Grocy would reject it or the intent was ambiguous.\",\n      \"Errors
              include coaching because guessing would be irresponsible.\",\n      \"If
              you skipped help and hit an error, the help already explained it.\"\n
              \   ],\n    \n    \"operating_model\": {\n      \"resolution_rules\":
              [\n        \"Names are resolved to IDs before any operation\",\n        \"Exact
              matches are preferred; partial matches are fallback\",\n        \"Multiple
              matches cause the operation to stop\"\n      ],\n      \"write_rules\":
              [\n        \"All write operations require explicit case selection\",\n
              \       \"Required fields are enforced per case\",\n        \"No implicit
              create, merge, or delete ever occurs\"\n      ],\n      \"unit_governance\":
              [\n        \"Quantity units are treated as first-class objects\",\n        \"Stock
              operations require resolvable quantity units\",\n        \"Unit creation
              or modification must be explicit\",\n        \"This tool never invents,
              guesses, or normalizes units\"\n      ],\n      \"safety_guards\": [\n
              \       \"Ambiguous intent is rejected\",\n        \"Unsupported Grocy
              behaviors are blocked\",\n        \"This tool never fabricates state or
              guesses outcomes\"\n      ],\n      \"mental_model\": [\n        \"Think
              of this as a controlled command router, not a chat interface\",\n        \"If
              Grocy needs it, you must supply it\",\n        \"If Grocy forbids it,
              this tool will stop you first\"\n      ]\n    },\n\n    \"cases\": {\n\n
              \     \"catalog_list_products\": {\n        \"intent\": \"List all products
              in the Grocy catalog.\",\n        \"needs\": [],\n        \"reads\": \"GET
              /objects/products\"\n      },\n\n      \"catalog_add_product\": {\n        \"intent\": \"Create a new product in the catalog with 0 starting stock. Use for spare parts / consumables that exist in the catalog but have not been purchased yet. Unlike stock_register_asset (which sets stock=1), this leaves stock at 0.\",\n        \"needs\": [\"item\", \"location OR location_id\"],\n        \"optional\": [\"note\", \"brand\", \"sku\", \"parent_product OR parent_product_id\"],\n        \"writes\": \"POST /objects/products\",\n        \"notes\": [\"Stock starts at 0 — use stock_buy_product to add units later\", \"Dupe guard: existing product triggers dupe_guard with candidate_ids\", \"VARIETALS: For brand/flavor variants (e.g. Envy Apple, Red Delicious), create the generic parent first (catalog_add_product item='Apple'), then link: catalog_add_product item='Envy Apple' parent_product='Apple'. Or reparent later: update_product_meta item='Envy Apple' parent_product='Apple'.\"]\n      },\n\n      \"catalog_find_product\": {\n        \"intent\":
              \"Find catalog products by name.\",\n        \"needs\": [\"item\"],\n
              \       \"reads\": \"GET /objects/products (filtered locally by name)\"\n
              \     },\n\n      \"get_product_meta\": {\n        \"intent\": \"Retrieve
              canonical product metadata.\",\n        \"needs\": [\"item OR product_id\"],\n
              \       \"reads\": \"GET /objects/products/{productId}\"\n      },\n\n
              \     \"rename_product\": {\n        \"intent\": \"Rename a product (display
              name only).\",\n        \"needs\": [\"item OR product_id\", \"new_name\"],\n
              \       \"writes\": \"PUT /objects/products/{productId}\",\n        \"notes\":
              [\"Product ID and stock are unaffected\"]\n      },\n\n      \"update_product_meta\":
              {\n        \"intent\": \"Update declarative product metadata. Pass amount to set min_stock_amount.\",\n        \"needs\":
              [\"item OR product_id\"],\n        \"writes\": \"PUT /objects/products/{productId}\",\n
              \       \"supported_fields\": [\"note\", \"brand\", \"sku\", \"unit/unit_id\", \"amount=min_stock_amount\", \"parent_product OR parent_product_id\"],\n        \"constraints\":
              [\"No stock semantics are modified\"],\n        \"notes\": [\"parent_product accepts product name (resolves to ID) or use parent_product_id directly\", \"VARIETALS: link a brand/flavor variant to its base: update_product_meta item='Envy Apple' parent_product='Apple'\"]\n      },\n\n      \"set_default_location_for_product\":
              {\n        \"intent\": \"Set the default storage location for new purchases.\",\n
              \       \"needs\": [\"item OR product_id\", \"location OR location_id\"],\n
              \       \"writes\": \"PUT /objects/products/{productId}\"\n      },\n\n
              \     \"products_merge\": {\n        \"intent\": \"Merge two products
              into one canonical product.\",\n        \"needs\": [\"product_id_keep\",
              \"product_id_remove\"],\n        \"writes\": \"POST /stock/products/{productIdToKeep}/merge/{productIdToRemove}\",\n
              \       \"notes\": [\n          \"Moves all stock and history\",\n          \"Source
              product is deleted\",\n          \"This action is irreversible\"\n        ]\n
              \     },\n\n      \"stock_list_by_location\": {\n        \"intent\": \"List
              all stock entries stored in a specific location.\",\n        \"needs\":
              [\"location OR location_id\"],\n        \"reads\": \"GET /stock/locations/{locationId}/entries\"\n
              \     },\n\n      \"stock_check_item\": {\n        \"intent\": \"Check
              whether an item exists in stock.\",\n        \"needs\": [\"item OR product_id\"],\n
              \       \"reads\": \"GET /stock/products/{productId}/entries\"\n      },\n\n
              \     \"stock_where_is_item\": {\n        \"intent\": \"Determine which
              locations contain an item.\",\n        \"needs\": [\"item OR product_id\"],\n
              \       \"reads\": \"GET /stock/products/{productId}/locations\"\n      },\n\n
              \     \"stock_entries_for_item\": {\n        \"intent\": \"Return detailed
              stock entries for an item.\",\n        \"needs\": [\"item OR product_id\"],\n
              \       \"reads\": \"GET /stock/products/{productId}/entries\"\n      },\n\n
              \     \"stock_add_purchase\": {\n        \"intent\": \"Add purchased quantity
              of an existing product into inventory.\",\n        \"needs\": [\"item
              OR product_id\"],\n        \"writes\": \"POST /stock/products/{productId}/add\",\n
              \       \"notes\": [\n          \"Product must already exist\",\n          \"Quantity
              unit must be resolvable\"\n        ]\n      },\n\n      \"stock_buy_product\":
              {\n        \"intent\": \"Create a product if missing, then purchase it
              into inventory.\",\n        \"needs\": [\"item OR product_id\"],\n        \"writes\":
              [\n          \"POST /objects/products (if missing)\",\n          \"POST
              /stock/products/{productId}/add\"\n        ],\n        \"notes\": [\n
              \         \"Location is required when creating a new product\",\n          \"Quantity
              unit must be resolvable\",\n          \"Optional post-purchase inventory
              report may be returned\"\n        ]\n      },\n\n      \"stock_consume\":
              {\n        \"intent\": \"Consume quantity of an item from inventory.\",\n
              \       \"needs\": [\"item OR product_id\"],\n        \"writes\": \"POST
              /stock/products/{productId}/consume\"\n      },\n\n      \"stock_inventory_adjust\":
              {\n        \"intent\": \"Reconcile inventory to a measured total amount.\",\n
              \       \"needs\": [\"item OR product_id\", \"amount\"],\n        \"writes\":
              \"POST /stock/products/{productId}/inventory\"\n      },\n\n      \"stock_transfer_location\":
              {\n        \"intent\": \"Transfer stock quantity between locations.\",\n
              \       \"needs\": [\n          \"item OR product_id\",\n          \"location
              OR location_id\",\n          \"to_location OR to_location_id\"\n        ],\n
              \       \"writes\": \"POST /stock/products/{productId}/transfer\",\n        \"blocked_conditions\":
              [\n          \"Tare-weight products are not supported for transfer\"\n
              \       ]\n      },\n\n      \"units_list\": {\n        \"intent\": \"List
              all quantity units defined in Grocy.\",\n        \"needs\": [],\n        \"reads\":
              \"GET /objects/quantity_units\"\n      },\n\n      \"units_find\": {\n
              \       \"intent\": \"Find a quantity unit by exact name.\",\n        \"needs\":
              [\"unit\"],\n        \"reads\": \"GET /objects/quantity_units (filtered
              locally by name)\",\n        \"constraints\": [\n          \"Exact match
              only\",\n          \"Multiple matches block execution\"\n        ]\n      },\n\n
              \     \"units_add\": {\n        \"intent\": \"Create a new quantity unit.\",\n
              \       \"needs\": [\"unit\"],\n        \"optional\": [\"note\"],\n        \"writes\":
              \"POST /objects/quantity_units\",\n        \"constraints\": [\n          \"Unit
              name must not already exist\",\n          \"Pluralization is not inferred\",\n
              \         \"No implicit conversions are created\"\n        ]\n      },\n\n
              \     \"units_update\": {\n        \"intent\": \"Update an existing quantity
              unit.\",\n        \"needs\": [\"unit_id\"],\n        \"optional\": [\"unit\",
              \"note\"],\n        \"writes\": \"PUT /objects/quantity_units/{unitId}\",\n
              \       \"constraints\": [\n          \"unit_id is required\",\n          \"Renames
              must differ from current name\",\n          \"No stock math is affected\"\n
              \       ]\n      },\n\n      \"shopping_add_product\": {\"intent\": \"Add a specific product to a shopping list.\", \"needs\": [\"item OR product_id\"], \"optional\": [\"amount\", \"list_id\"], \"writes\": \"POST /stock/shoppinglist/add-product\"},\n      \"shopping_remove_product\": {\"intent\": \"Remove a product from a shopping list.\", \"needs\": [\"item OR product_id\"], \"optional\": [\"amount\", \"list_id\"], \"writes\": \"POST /stock/shoppinglist/remove-product\"},\n      \"shopping_clear_list\": {\"intent\": \"Clear a shopping list.\", \"optional\": [\"list_id\", \"done_only\"], \"writes\": \"POST /stock/shoppinglist/clear\"},\n      \"recipes_list\": {\"intent\": \"List all Grocy recipes.\", \"reads\": \"GET /objects/recipes\"},\n      \"recipes_fulfillment\": {\"intent\": \"What recipes can I make with current stock?\", \"reads\": \"GET /recipes/fulfillment\"},\n      \"recipe_check_fulfillment\": {\"intent\": \"Can I make a specific recipe?\", \"needs\": [\"item OR recipe_id\"], \"reads\": \"GET /recipes/{recipeId}/fulfillment\"},\n      \"recipes_add_to_shopping\": {\"intent\": \"Add missing recipe ingredients to shopping list.\", \"needs\": [\"item OR recipe_id\"], \"optional\": [\"list_id\"], \"writes\": \"POST /recipes/{recipeId}/add-not-fulfilled-products-to-shoppinglist\"},\n      \"recipes_consume\": {\"intent\": \"Mark recipe as made and consume stock ingredients.\", \"needs\": [\"item OR recipe_id\"], \"writes\": \"POST /recipes/{recipeId}/consume\"},\n      \"recipes_copy\": {\"intent\": \"Duplicate a recipe.\", \"needs\": [\"item OR recipe_id\"], \"writes\": \"POST /recipes/{recipeId}/copy\"},\n      \"stock_overview\": {\"intent\": \"Overview of all products currently in stock.\", \"reads\": \"GET /stock\"},\n      \"stock_list_volatile\": {\"intent\": \"List products due soon, overdue, or expired.\", \"reads\": \"GET /stock/volatile\"},\n      \"stock_get_product_details\": {\"intent\": \"Get stock-context details for a product (amount, value, best_before).\", \"needs\": [\"item OR product_id\"], \"reads\": \"GET /stock/products/{productId}\"},\n      \"stock_open_item\": {\"intent\": \"Mark a product as opened.\", \"needs\": [\"item OR product_id\"], \"optional\": [\"amount\", \"best_before_date\"], \"writes\": \"POST /stock/products/{productId}/open\"},\n      \"stock_entry_update\": {\"intent\": \"Edit a specific stock entry (best_before_date, location, price).\", \"needs\": [\"entry_id\"], \"optional\": [\"amount\", \"best_before_date\", \"location\", \"price\"], \"writes\": \"PUT /stock/entry/{entryId}\", \"notes\": [\"Get entry_id via stock_entries_for_item\"]},\n      \"stock_undo_booking\": {\"intent\": \"Undo a stock booking.\", \"needs\": [\"booking_id\"], \"writes\": \"POST /stock/bookings/{bookingId}/undo\"},\n      \"tasks_undo\": {\"intent\": \"Undo a completed task.\", \"needs\": [\"item OR task_id\"], \"writes\": \"POST /tasks/{taskId}/undo\"},
      \"tasks_add\": {\"intent\": \"Create a new Grocy task.\", \"needs\": [\"item\"], \"optional\": [\"note\", \"best_before_date\"], \"writes\": \"POST /objects/tasks\"},\n      \"chores_undo\": {\"intent\": \"Undo a chore execution.\", \"needs\": [\"execution_id\"], \"notes\": [\"execution_id is the execution ID, not the chore_id\"], \"writes\": \"POST /chores/executions/{executionId}/undo\"},\n      \"catalog_find_by_barcode\": {\"intent\": \"Find a product by barcode.\", \"needs\": [\"barcode\"], \"reads\": \"GET /stock/products/by-barcode/{barcode}\"},\n      \"stock_add_by_barcode\": {\"intent\": \"Purchase into stock by barcode.\", \"needs\": [\"barcode\"], \"optional\": [\"amount\", \"location\", \"price\", \"best_before_date\"], \"writes\": \"POST /stock/products/by-barcode/{barcode}/add\"},\n      \"stock_consume_by_barcode\": {\"intent\": \"Consume from stock by barcode.\", \"needs\": [\"barcode\"], \"optional\": [\"amount\"], \"writes\": \"POST /stock/products/by-barcode/{barcode}/consume\"},\n      \"batteries_list\": {\"intent\": \"List all tracked rechargeable batteries.\", \"reads\": \"GET /batteries\"},\n      \"batteries_get\": {\"intent\": \"Get details for a specific battery.\", \"needs\": [\"battery_id\"], \"reads\": \"GET /batteries/{batteryId}\"},\n      \"batteries_charge\": {\"intent\": \"Record a charge cycle for a battery.\", \"needs\": [\"battery_id\"], \"optional\": [\"amount\"], \"writes\": \"POST /batteries/{batteryId}/charge\"},\n      \"batteries_due\": {\"intent\": \"List rechargeable batteries bucketed by charge status: overdue, due_today, due_soon, ok. Use for maintenance triage.\", \"reads\": \"GET /batteries (shaped)\"},\n      \"batteries_journal\": {\"intent\": \"List charge cycle history across all batteries. Optional battery_id to filter to one device.\", \"optional\": [\"battery_id\", \"page\", \"per_page\"], \"reads\": \"GET /objects/battery_charge_cycles\"},\n      \"batteries_charge_undo\": {\"intent\": \"Undo a specific charge cycle. entry_id = the charge cycle ID (from batteries_journal).\", \"needs\": [\"entry_id\"], \"writes\": \"POST /batteries/charge-cycles/{id}/undo\"},\n      \"battery_status\": {\"intent\": \"Low-battery triage across the house. Groups HA Battery Notes devices by area with Grocy stock cross-reference. Template-only — no Grocy call for reading.\", \"reads\": \"HA Battery Notes sensors + Grocy /stock/products\"},\n      \"battery_overdue\": {\"intent\": \"Devices not replaced in N days. Requires days_threshold.\", \"needs\": [\"days_threshold\"], \"reads\": \"HA Battery Notes sensors (template)\"},\n      \"battery_replace\": {\"intent\": \"Atomic: log battery replacement in Battery Notes AND consume from Grocy stock. ha_entity_id required. item optional (Grocy product name for stock consume).\", \"needs\": [\"ha_entity_id\"], \"optional\": [\"item\", \"amount\"], \"writes\": \"battery_notes.set_battery_replaced + /stock/products/{id}/consume\"}\n    },\n\n    \"hints\": {\n      \"location_metadata\":
              \"Apply homeassistant metadata to grocy fields and grocy location id pointers
              to cabinet drawers, use labels liberally. These are the things that bind
              Grocy data to HA to become searchable by the Hyperindex.\",\n      \"unit_interop\":
              \"Grocy is the canonical authority for quantity units. External systems
              (e.g., Mealie) should reference Grocy unit IDs or normalized names. Unit
              reconciliation must be explicit and governed; this tool will not guess
              mappings.\",\n      \"task_routing\": \"For tasks/chores tied to a product or location, prefer zen_dojotools_inventory over zen_dojotools_todo. Inventory Task = todo attached to asset/location. Inventory Chore = task that also performs a stock action on execution.\"\n    },\n\n    \"big_asks\": {\n      \"new thing here (physical asset, permanent)\": \"stock_register_asset — 1-call registration, add hazmat_class if applicable\",\n      \"new thing here (consumable, first time in catalog)\": \"stock_buy_product — creates product and stocks it in one call\",\n      \"got more X / restocked\": \"stock_add_purchase\",\n      \"where is X?\": \"stock_check_item\",\n      \"whats in the [room]?\": \"room_brief(homeassistant_area_id=area). stock_area_summary for stock-only depth.\",\n      \"we used / consumed X\": \"stock_consume\",\n      \"need to buy X / running low\": \"shopping_add_product\",\n      \"whats expiring / going bad?\": \"stock_list_volatile\",\n      \"mark chore done\": \"chores_execute(item=<name>)\",\n      \"mark task done\": \"tasks_complete(item=<name>)\", \"tag chore/task to room\": \"chores_tag or tasks_tag\",\n      \"chores in [room]?\": \"chores_by_area(homeassistant_area_id=area)\"\n    },\n\n    \"why_operations_fail\": {\n      \"missing_required_fields\":
              \"Each case declares its own required inputs. If one is missing, execution
              stops.\",\n      \"ambiguous_matches\": \"If a name resolves to more than
              one object, the tool refuses to guess.\",\n      \"unit_errors\": \"Stock
              math requires a resolvable quantity unit. Units are governed objects in
              Grocy. If a unit does not exist or resolves ambiguously, the operation
              stops. Use units_list or units_add explicitly. 'each' must exist.\",\n
              \     \"location_constraints\": \"Grocy enforces location rules. This
              tool mirrors them exactly.\",\n      \"irreversible_actions\": \"Destructive
              operations (merge, consume, adjust) are guarded deliberately.\"\n    },\n\n
              \   \"examples\": {\n      \"check_inventory\": \"{'mode':'stock_check_item','item':'coffee'}\",\n
              \     \"where_is_item\": \"{'mode':'stock_where_is_item','item':'coffee'}\",\n
              \     \"list_items_in_location\": \"{'mode':'stock_list_by_location','location':'Pantry'}\",\n
              \     \"purchase_existing_product\": \"{'mode':'stock_add_purchase','item':'coffee','amount':1,'location':'Pantry'}\",\n
              \     \"create_and_purchase_new_product\": \"{'mode':'stock_buy_product','item':'chickens','amount':87000,'location':'Garage','note':'no
              questions'}\",\n      \"consume_item\": \"{'mode':'stock_consume','item':'coffee','amount':1}\",\n
              \     \"transfer_item\": \"{'mode':'stock_transfer_location','item':'coffee','location':'Pantry','to_location':'Kitchen'}\",\n
              \     \"complete_task\": \"{'mode':'tasks_complete','item':'Take out trash'}\",\n
              \     \"execute_chore\": \"{'mode':'chores_execute','item':'Clean litter
              box'}\",\n      \"set_location_metadata\": \"{'mode':'locations_metadata_set','location':'Coffee
              Drawer','parent_location':'Kitchen','area_id':'kitchen','location_subclass':'drawer','placement_priority':10}\",\n
              \     \"list_units\": \"{'mode':'units_list'}\",\n      \"add_unit\":
              \"{'mode':'units_add','unit':'can','note':'Standard grocery can'}\",\n
              \     \"find_unit\": \"{'mode':'units_find','unit':'can'}\"\n    },\n\n
              \   \"final_note\": [\n      \"Strict by design — prevents silent data corruption.\",\n      \"Names resolve before writes. Ambiguous matches stop execution.\",\n      \"Errors coach you back — no need to re-read help to fix a mistake.\"\n    ]\n  }\n}}"
        - variables:
            help_json: "{{ help_json | combine({'cases': cases}) }}"
        - variables:
            room_integration_block:
              description: "Grocy locations mirror your home structure. Each RM room (zen_dojotools_room_manager) has grocy_location_id pointing to its Grocy anchor. Bidirectional: RM to Grocy via grocy_location_id; Grocy to RM via homeassistant_area userfield."
              home_tree: "Your Home (root) → Wing/Floor/Zone (IDs vary) → Rooms → Containers → Products"
              place_object_pattern:
                - "1. zen_dojotools_room_manager mode=get area=X → read domain_routing.grocy for anchor ID"
                - "2. locations_find(parent_location_id=anchor) → all containers in room (add location= to name-filter)"
                - "3. locations_add(location=name, parent_location_id=anchor) if container missing"
                - "4. catalog_find_product(item=name) → verify exists; create if needed"
                - "5. stock_buy_product or stock_inventory_adjust to register item at container"
              find_object_pattern:
                - "stock_where_is_item(item=name) → returns location_id of each stock entry"
                - "location.userfields.homeassistant_area = RM area_id; use locations_get_by_area(homeassistant_area_id=area) for reverse anchor lookup"
                - "stock_list_by_location(location_id=anchor) → all items in a room"
              key_room_anchors: "IDs are household-specific. Discover yours: locations_list(per_page=200)."
              safety_equipment: "safety[] on RM rooms has grocy_location_id pinning each item to a specific Grocy container within that room."
        - variables:
            help_json: "{{ help_json | combine({'room_integration': room_integration_block}) }}"
        - variables:
            scenarios_block:
              primitives:
                stock_lifecycle:
                  acquire: "stock_buy_product or stock_add_purchase — put sealed units into storage location"
                  open_into_service: "stock_open_item — move sealed unit to default_consume_location, stamp opened_date and best_before = today + due_days_after_open"
                  consume: "stock_consume or chores_execute — remove the in-service unit (it is used up)"
                  transfer: "stock_transfer_location — move units between locations, FIFO by stock entry age"
                product_configuration:
                  default_purchase_location: "location_id on product — where stock_buy_product and stock_add_purchase land by default"
                  default_consume_location: "update_product_meta to_location_id=X — where chores_execute and stock_consume pull from"
                  move_on_open: "update_product_meta move_on_open=true — stock_open_item auto-moves unit to default_consume_location on open"
                  due_days_after_open: "update_product_meta due_days_after_open=N — best_before = open_date + N days, stamped at open time"
                  min_stock_amount: "update_product_meta amount=N — restock warning threshold shown in stock overview and volatile reports"
                location_model:
                  storage_location: "where sealed/spare units live (pantry shelf, cabinet, bin)"
                  install_location: "set as default_consume_location — where the in-service unit lives (slot, tank, tray, dock)"
                  naming: "parent asset name + slot role, e.g. 'Kitchen Refrigerator - Water Filter Slot'"
                chores:
                  create: "chores_add item=name period_days=N product_id=X — recurring task linked to a consumable product"
                  execute: "chores_execute — consumes 1 unit from default_consume_location, stamps today as last-done, next_due = today + period_days"
                  tag: "chores_tag homeassistant_area_id=area — surfaces the chore in room_brief and chores_by_area queries"
              scenarios:
                installable_consumable:
                  description: >-
                    Generic model for any consumable that installs into a slot and needs periodic
                    replacement: filters, cartridges, bulbs, batteries, bags, pads.
                    One product type, two locations (install slot + spare storage), one chore.
                  decisions:
                    what_is_the_product: "Name it, brand it, SKU it. One product = one consumable type. Use stock_buy_product to create and stock in one call."
                    where_does_it_install: "Create a location for the slot (e.g. 'Fridge - Water Filter Slot'), parent under the asset. Set this as default_consume_location via update_product_meta to_location_id."
                    where_are_spares_stored: "Create a location for spare stock (e.g. 'Pantry - Water Filters'), parent under the nearest cabinet or pantry. This is the product's default purchase location."
                    how_many_to_keep: "Set min_stock_amount = restock alert threshold (e.g. 1 spare). Aim to keep preferred level (e.g. 2 spares) at the storage location."
                    how_long_does_it_last: "Set due_days_after_open = service life in days (e.g. 180 for a 6-month filter). Grocy stamps this as best_before on open."
                  setup_sequence:
                    - "1. locations_add — install slot, parent under the asset"
                    - "2. locations_add — spare storage, parent under nearby cabinet or pantry"
                    - "3. stock_buy_product amount=N location_id=<storage> — create product and stock initial spares"
                    - "4. update_product_meta product_id=X to_location_id=<slot> move_on_open=true due_days_after_open=N"
                    - "5. chores_add item='Replace X' product_id=X period_days=N"
                    - "6. chores_tag homeassistant_area_id=area — enables room_brief and chores_by_area discovery"
                    - "7. stock_open_item product_id=X — put first spare into service: moves to slot, stamps due date"
                    - "8. stock_add_purchase amount=N location_id=<storage> — top up spares to preferred level if needed"
                  replacement_cycle:
                    trigger: "Chore due date reached, or spare count at or below min_stock_amount"
                    step_1: "chores_execute chore_id=X — consumes 1 unit from install slot, stamps today, calculates next_due = today + period_days"
                    step_2: "stock_open_item product_id=X — opens next spare: Grocy moves it from storage to slot, stamps best_before = today + due_days_after_open"
                    step_3: "stock_check_item product_id=X — verify spare count at storage location"
                    step_4: "shopping_add_product product_id=X — queue restock if spare count <= min_stock_amount"
                    fifo_note: "stock_open_item always opens the oldest sealed unit first (FIFO by stock entry creation date)"
                  restock_cycle:
                    trigger: "Spare count at or below min_stock_amount after a replacement"
                    step_1: "shopping_add_product product_id=X — add to Grocy shopping list"
                    step_2: "stock_add_purchase amount=N location_id=<storage> — receive purchased spares into storage"
                  stock_accounting:
                    total_physical: "1 installed at slot + N spares at storage = total product stock"
                    installed_unit: "1 unit at install/slot location — status: opened, best_before = replacement due date"
                    spare_units: "N units at storage location — status: sealed, awaiting service"
                    how_to_see_breakdown: "stock_entries_for_item product_id=X — shows each unit's location_id, opened_date, and best_before"
        - variables:
            help_json: "{{ help_json | combine({'scenarios': scenarios_block}) }}"
        - variables:
            agent_superpowers_block:
              you_own: >-
                Full household ERP — stock levels, shopping lists, chores, locations, product catalog,
                recipes, batteries, asset registration, userfields, userentities. You are the ground
                truth for what exists, where it lives, and how much is left.
              boundary: >-
                Physical item circulation (loan/return/browse books/games/music/video/art) belongs to
                zen_dojotools_library section=catalog. Inventory owns the Grocy product (the Work —
                what something IS); Library owns the catalog_item userobject (the Item — the physical
                copy on a shelf). Scan a barcode → Inventory creates the product → Library catalogs
                the copy. Never try to do loan/return through Inventory directly.
              location_superpowers: >-
                locations_reparent_bulk now inherits homeassistant_area from parent automatically
                and is idempotent — run it again on an already-correct location and it's a safe no-op.
                This is the stamping mechanism that makes room-aware queries (stock_area_summary,
                chores_by_area, library area_id lens) light up for child locations.
              quickstart: "configure a shelf → locations_metadata_set + catalog_class. Tag a machine → provision_bom. Find what's in a room → room_brief homeassistant_area_id=X. Queue shopping → shopping_add_missing."
              player_setup:
                what: >-
                  Register any physical playback device or space as a Lens player. The Lens bus
                  will surface it as a player_hint on any area_id query — agents see what can play
                  what in each room without asking. Two userfields do it all: media_role + media_formats.
                how: >-
                  1. Create or find the Grocy product for the device/space.
                  2. Set media_role (pick from role_catalog below).
                  3. Set media_formats (CSV of what physical media it accepts).
                  4. Set the product default location to a Grocy location with homeassistant_area stamped.
                  5. If the device has an HA entity, set homeassistant_entity_id on the product — makes dumb=false so agents can control it (turn on lamp, wake Xbox, etc).
                  6. Done — Lens dispatcher fans out automatically on every area_id query.
                role_catalog:
                  turntable: {plays: [music_recording], formats: [vinyl, 7-inch, 12-inch], note: Dumb unless connected to smart amp. Set homeassistant_entity_id to amp/receiver entity if available.}
                  cassette_deck: {plays: [music_recording], formats: [cassette], note: Almost always dumb. Still surfaces so agent knows the room has tape capability.}
                  cd_player: {plays: [music_recording], formats: [cd], note: Dumb or smart depending on integration. Set entity_id if it has one.}
                  dvd_player: {plays: [video], formats: [dvd, cd], note: Dumb standalone. For smart players use game_console or digital_player.}
                  blu_ray_player: {plays: [video], formats: [blu_ray, dvd, cd], note: Dumb standalone. Upscaling players count here.}
                  projector: {plays: [video], formats: [digital, hdmi], note: "Set entity_id if smart (Epson/BenQ HA integrations). media_formats=digital."}
                  e_reader: {plays: [book, periodical], formats: [digital], note: "Kindle/Kobo as a product. Set entity_id if HA-integrated. Tells agent a digital reader is in the room."}
                  radio: {plays: [music_recording], formats: [am_fm, digital], note: "Smart radios may have HA entity. media_formats=am_fm or digital."}
                  digital_player: {plays: [music_recording, video, book, game], formats: [digital], note: "Catch-all for smart streaming devices (Chromecast/Fire Stick/Apple TV) not better described by another role. Prefer game_console for consoles."}
                  game_console: {plays: [game, video, music_recording], formats: [xbox_one, xbox_360, ps5, ps4, switch, blu_ray, dvd, cd, digital], note: "Resolves as disc player AND game player. Set homeassistant_entity_id to the HA media_player entity (Xbox integration). Most powerful multi-role player."}
                  reading_nook: {plays: [book, periodical], formats: [physical, digital], note: "A SPACE not a device. Create as a Grocy product for the chair/nook/corner. Set homeassistant_entity_id to the reading lamp if smart — agent turns it on when delivering a book. Lives next to the shelf; agent connects the dots."}
                formats_reference: "vinyl, cassette, cd, dvd, blu_ray, digital, am_fm, hdmi, xbox_one, xbox_360, ps5, ps4, switch, physical — use physical for any dumb format not listed"
        - variables:
            help_json: "{{ help_json | combine({'agent_superpowers': agent_superpowers_block}) }}"
        - variables:
            suggested_constructs_block:
              personal_inventory:
                description: >-
                  Each person (human or AI persona) gets a canonical personal inventory location in Grocy.
                  A virtual parent location called People (ID 550) groups all person-root locations.
                  Person-root locations are children of People and represent that person's physical
                  or conceptual inventory space (shelves, bins, desk, bag, etc.).
                setup:
                  - "Create parent: locations_add location='People' (done — ID 550)"
                  - "Create person root: locations_add location='<Member>\\'s Inventory' parent_location_id=<people_id>"
                  - "Wire to profile: zen_dojotools_profile_editor mode=write inventory_root=<location_id>"
                  - "Wire AI persona: zen_dojotools_persona_editor mode=write inventory_root=<location_id>"
                live_roots:
                  - "<Member A> → location <id> (<Member A>'s Inventory, parent: People <people_id>)"
                  - "<Member B> → location <id> (<Member B>'s Inventory, parent: People <people_id>)"
                  - "<AI persona> → location <id> (<Persona>'s Inventory, parent: People <people_id>)"
                why: >-
                  Used by Library lending (checkout target), future agent workspace, and any tool that
                  needs to resolve where a person's possessions live. Profile and persona editors both
                  expose inventory_root as a first-class field — wire once, used everywhere.
              bookshelf_virtual_stack:
                description: >-
                  Physical bookcases become a virtual library by tagging parent bookcase locations with
                  homeassistant_labels=bookshelf. The Library tool (zen_dojotools_library section=books)
                  discovers all bookshelf-tagged locations and recurses their children via
                  grocy_child_location_ids: tag the parent once, the whole shelf tree joins the library.
                setup:
                  - "Tag bookcase: products_tag item='Left Twin Bookcase' ha_labels='bookshelf' (or locations_metadata_set with ha_labels)"
                  - "Tag books: products_tag item='Book Title' ha_labels='book'"
                  - "Rebuild hierarchy if needed: locations_hierarchy_rebuild"
                live_bookcases:
                  - "Left Twin (ID 109) — tag with ha_labels=bookshelf"
                  - "Right Twin (ID 110) — tag with ha_labels=bookshelf"
                discovery: >-
                  Library mode=status checks for bookshelf-tagged locations. If found but no books tagged,
                  returns onboarding suggestion. If neither exists, returns setup instructions.
              lending_library_flow:
                description: >-
                  A managed lending library built on top of personal inventory roots and bookshelf stacks.
                  Books live in bookshelf-tagged locations. Checkout moves a book to the borrower's
                  inventory root. Return moves it back to the product's default_location_id.
                checkout:
                  - "stock_transfer_location item='Book' to_location_id=<borrower inventory.root_location_id>"
                  - "products_tag item='Book' ha_labels='book,loaned'"
                  - "stock_entry_update entry_id=<id> best_before_date=<return_date> note='Loaned to {person}'"
                return_flow:
                  - "stock_transfer_location item='Book' to_location_id=<product default_location_id>"
                  - "products_tag item='Book' ha_labels='book'  (drop loaned tag)"
                overdue_detection: >-
                  Native Grocy volatile report (stock_list_volatile) surfaces loaned books automatically
                  when best_before_date < today — no custom query needed.
                entry_point: "zen_dojotools_library section=books — modes: status | browse | checkout | return | overdue | setup"
        - variables:
            help_json: "{{ help_json | combine({'suggested_constructs': suggested_constructs_block}) }}"
        - variables:
            systems_block:
              perishable_storage:
                overview: >-
                  A classification system that tags Grocy locations as perishable storage (fridges,
                  pantries, freezers) and enforces expiry tracking discipline on the products stored
                  in them. Two mechanisms: a real-time coach (fires when buying/moving stock) and an
                  audit (scans all live stock for violations). Together they catch violations as they
                  happen and find ones that already exist.
                catalog_class_values:
                  perishable_storage: >-
                    Tag on a Grocy location. Marks it as a zone where perishable goods live.
                    Triggers coaching when a never-expires product (default_best_before_days=-1) is
                    purchased or moved into this location. Children of this location inherit the flag
                    automatically via a one-level parent walk — tag the fridge, all fridge shelves
                    and drawers are implicitly covered without manual tagging.
                  non_perishable: >-
                    Explicit override. Place on a sub-location inside a perishable parent to suppress
                    the inheritance. Use for zones that hold non-food items inside a perishable
                    container — fridge water filter slots, ice maker, consumables bin, etc. Short-
                    circuits before the parent walk so the check is cheap. Set via
                    locations_metadata_set catalog_class=non_perishable.
                  __intake__: >-
                    Unrelated to perishable system. Marks the catalog intake staging location
                    (Kitchen Island). Drives the logistics KFC intake component.
                hierarchy_and_inheritance:
                  rule: >-
                    When coaching or audit evaluates a destination location, it checks:
                    (1) Does the location itself have catalog_class=perishable_storage? Yes → perishable.
                    (2) Does the location itself have catalog_class=non_perishable? Yes → not perishable (short-circuit).
                    (3) Does the location's grocy_parent_location_id point to a location with
                        catalog_class=perishable_storage? Yes → perishable (inherited).
                    (4) Otherwise → not perishable.
                  depth: One level only. Grandchild locations do not inherit from grandparent.
                  what_to_tag: >-
                    Tag the root containers: refrigerators, freezers and pantries. Sub-locations
                    inherit automatically. Only override with non_perishable where needed.
                coaching:
                  when_it_fires: >-
                    On stock_buy_product, stock_add_purchase, or stock_transfer_location when ALL:
                    (1) the product has default_best_before_days=-1 (never expires), AND
                    (2) the destination location resolves as perishable_storage (direct or inherited).
                  what_it_returns: >-
                    A coaching[] list on the response with a message recommending the agent either
                    set a best_before_date on this stock entry or run update_product_meta
                    best_before_days=N to enable expiry tracking for the product going forward.
                  cost: >-
                    Lazy — only fetches location userfields when the product is already -1.
                    Zero overhead on normal (non-never-expires) purchases.
                audit:
                  mode: stock_audit_perishable
                  what_it_does: >-
                    Paginated cross-reference: loads all locations, all raw stock entries, and all
                    never-expires products. Builds perishable_location_ids set from tagged locations
                    plus their children (excluding non_perishable children). Returns every stock entry
                    where a never-expires product sits in a perishable location as a violation.
                  response_shape:
                    perishable_location_ids: List of Grocy location IDs currently classified as perishable
                    never_expires_product_count: How many products in catalog have default_best_before_days=-1
                    violations.count: Number of never-expires products currently stocked in perishable locations
                    violations.items: >-
                      Each item has product_id, product_name, location_id, location_name, amount,
                      best_before_date, and a fix command ready to copy-paste.
                  how_to_act_on_violations: >-
                    For each violation, decide: is this product genuinely perishable (food in a fridge)?
                    → run the fix command: update_product_meta item='X' best_before_days=N where N
                    comes from the best_before_days_defaults table in the cases.stock_audit_perishable
                    help entry. Or is it a non-food item in a perishable zone (filter, battery, etc.)?
                    → either set best_before_days=-1 is already correct (leave it) or tag its location
                    non_perishable to silence it permanently.
                management_workflow:
                  tag_a_new_perishable_location: >-
                    locations_metadata_set location='Name' catalog_class=perishable_storage
                    Children inherit immediately — no need to tag sub-locations unless overriding.
                  suppress_a_sub_location: >-
                    locations_metadata_set location='Name' catalog_class=non_perishable
                    Use for non-food sub-zones inside a tagged parent (fridge slots, consumables bins).
                  fix_a_violation: >-
                    update_product_meta item='Product Name' best_before_days=N
                    This enables expiry tracking for all future purchases of that product.
                    Does not retroactively set best_before on existing stock entries — those keep
                    best_before_date=2999-12-31 (Grocy's never-expires sentinel). Update them
                    individually with stock_entry_update if needed.
                  run_the_audit: "zen_dojotools_inventory mode=stock_audit_perishable"
        - variables:
            help_json: "{{ help_json | combine({'systems': systems_block}) }}"
        - variables:
            help_json: >-
              {{ help_json | combine({
                'domain': 'inventory',
                'peers': {'finance': 'zen_dojotools_finance'},
                'see_also': 'zen_dojotools_manifest mode=domains name=inventory'
              }) }}
        # A bare call (no mode passed) gets the compact list: operation names
        # only, from the same cases dict. The full catalogue (~100k chars) is
        # for an explicit mode=help.
        - variables:
            final_response: >-
              {%- if mode is not defined -%}
                {{ {'status': 'help', 'mode': 'help', 'tool': 'zen_dojotools_inventory',
                    'about': 'Household inventory ERP: stock, shopping, catalog, locations, chores, tasks, recipes, batteries.',
                    'modes': (cases.keys() | list | sort) if cases is mapping else [],
                    'more': 'mode=help for every mode with needs/optional/example'} }}
              {%- else -%}
                {{ {'status': 'help', 'message': help_json.get('message', ''), 'help': help_json} }}
              {%- endif -%}
        - stop: Help Mode
          response_variable: final_response
    - alias: Trap Grocy Not Configured
      choose:
      - conditions:
        - condition: template
          value_template: "{{ (states('input_text.grocy_url') | default('', true) | trim) in ['', 'unknown', 'unavailable'] }}"
          alias: 'Error: Grocy URL unset'
        sequence:
        - variables:
            final_response:
              status: error
              message: "Grocy is not configured — input_text.grocy_url is not set. Set it in Settings > Helpers (or Developer Tools > States) to your Grocy instance's base URL, e.g. https://grocy.home.example.com, then retry."
              mode: '{{ mode_norm }}'
        - stop: Grocy Not Configured
          response_variable: final_response
    - alias: Trap Early Preflight Errors
      choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm not in cases }}'
          alias: 'Error: Case Not Recognized'
        sequence:
        - variables:
            final_response:
              status: error
              message: Invalid case
              mode: '{{ mode_norm }}'
              hint: Call with mode=help to see valid cases.
        - stop: Invalid Case
          response_variable: final_response
      - conditions:
        - alias: 'Error: locations_add requires a name'
          condition: template
          value_template: "{{ mode_norm == 'locations_add'\n and not has_loc_name }}"
        sequence:
        - variables:
            final_response:
              status: error
              message: locations_add requires a location name
              mode: '{{ mode_norm }}'
              coaching:
              - Provide a location name using the location field.
              - Example "{'mode':'locations_add','location':'Coffee Drawer'}"
        - stop: Missing Location Name
          response_variable: final_response
    # ── Cert-gate: inventory_schema_edit. Level 1 for schema and location
    # structure changes, level 2 for anything that deletes or merges.
    # Stock, products, chores, tasks, shopping and batteries stay ungated.
    # userfields_deploy/userfields_repair are ungated too: they only converge
    # Grocy to the canonical schema defined in this file, never to caller
    # input, and repair runs itself on boot and daily (see register). ──
    - variables:
        _inv_schema_l1: ['userfields_create', 'userentities_create', 'locations_add', 'locations_rename', 'locations_update_description', 'locations_metadata_set', 'locations_reparent_bulk', 'locations_hierarchy_rebuild', 'units_add', 'units_update', 'unit_conversions_add', 'product_unit_repair', 'shopping_locations_rename']
        _inv_schema_l2: ['userfields_delete', 'userentities_delete', 'locations_delete', 'locations_delete_safe', 'unit_conversions_delete', 'catalog_delete_product', 'products_merge']
    - if: "{{ mode_norm in _inv_schema_l1 or mode_norm in _inv_schema_l2 }}"
      then:
      - variables:
          _inv_cert_level_req: "{{ 2 if mode_norm in _inv_schema_l2 else 1 }}"
      - action: script.zen_dojotools_identity
        response_variable: _inv_id_raw
        continue_on_error: true
        data:
          mode: resolve_caller_identity
          required_cert: zenos.knowledge.inventory_schema_edit
          required_cert_level: "{{ _inv_cert_level_req }}"
          caller_token: "{{ caller_token | default('') }}"
      - variables:
          _inv_id_fields: >-
            {%- import 'zenos_ai/zen_os_1.jinja' as OS -%}
            {%- set _raw = OS.resolve_identity_fields(_inv_id_raw) -%}
            {{- (_raw | from_json) if _raw is string else _raw -}}
      - if: "{{ _inv_id_fields.policy_status != 'allowed' or not _inv_id_fields.authorized }}"
        then:
        - variables:
            _inv_cd_raw: >-
              {%- import 'zenos_ai/zen_os_1.jinja' as OS -%}
              {{ OS.cert_denial(_inv_id_fields.policy_status, _inv_id_fields.authorized, _inv_id_fields.cert_level, 'zenos.knowledge.inventory_schema_edit', _inv_cert_level_req | int, mode_norm, _inv_id_fields.block_reason) -}}
        - variables:
            final_response: >-
              {{ ((_inv_cd_raw | from_json) if _inv_cd_raw is string else _inv_cd_raw) | combine({'tool': 'zen_dojotools_inventory', 'mode': mode_norm}) }}
        - stop: Cert Denied
          response_variable: final_response
    - variables:
        payload_obj: "{% if payload_in is none %}\n  {{ none }}\n{% elif payload_in
          is mapping %}\n  {{ payload_in }}\n{% else %}\n  {% set s = (payload_in |
          string | trim) %}\n  {% if s == '' %}\n    {{ none }}\n  {% else %}\n    {{
          s | from_json }}\n  {% endif %}\n{% endif %}"
    - variables:
        product_id_resolved: '{{ pid_in }}'
        parent_product_id_resolved: '{{ parent_product_id_in }}'
        product_id_keep_resolved: '{{ pid_keep_in }}'
        product_id_remove_resolved: '{{ pid_remove_in }}'
        location_id_resolved: '{{ lid_in }}'
        to_location_id_resolved: '{{ to_lid_in }}'
        shopping_location_id_resolved: '{{ slid_in }}'
        parent_lid_resolved: '{{ parent_lid_in }}'
        chore_id_resolved: '{{ cid_in }}'
        task_id_resolved: '{{ tid_in }}'
        unit_id_resolved: '{{ uid_in }}'
        purchase_unit_id_resolved: '{{ purchase_uid_in }}'
        grocy_product: '{{ none }}'
        product_matches: '{{ [] }}'
    - alias: Resolve Locations
      choose:
      - conditions:
        - alias: Resolve Locations
          condition: template
          value_template: "{{ location_id_resolved is none\n   and has_loc_name\n   and
            mode_norm in [\n     'stock_list_by_location',\n     'locations_add',\n     'stock_register_asset',\n     'catalog_add_product',\n
            \    'stock_add_purchase',\n     'stock_buy_product',\n     'stock_transfer_location',\n
            \    'stock_add_by_barcode',\n     'stock_entry_update',\n
            \    'locations_metadata_set',\n     'locations_rename',\n     'locations_update_description',\n     'locations_delete',\n     'locations_delete_safe'\n
            \  ] }}"
        sequence:
        - action: script.zen_sutra_grocy
          response_variable: locations_all
          data:
            action_type: read
            endpoint: /objects/locations?limit=500
        - variables:
            locations_all_list: "{{ locations_all['result']['content'] if locations_all is mapping and 'result' in locations_all else [] }}"
            location_id_resolved: "{{\n  (locations_all_list\n    | selectattr('name','equalto',
              loc_norm)\n    | map(attribute='id')\n    | first)\n  | default(\n      (locations_all_list\n
              \       | selectattr('name','search','(?i)' ~ loc_norm)\n        | map(attribute='id')\n
              \       | first)\n    )\n  | default(location_id_resolved)\n}}"
    - alias: Resolve Parent Product
      choose:
      - conditions:
        - condition: template
          value_template: "{{ parent_product_id_resolved is none and has_parent_product_name and mode_norm in ['catalog_add_product','update_product_meta'] }}"
        sequence:
        - action: script.zen_sutra_grocy
          response_variable: _pprod_raw
          data:
            action_type: read
            endpoint: objects/products?query%5B%5D=name={{ parent_product_norm }}
        - variables:
            parent_product_id_resolved: "{{\n  (_pprod_raw['result']['content'] | default([])\n    | selectattr('name','equalto', parent_product_norm)\n    | map(attribute='id') | first)\n  | default(\n      (_pprod_raw['result']['content'] | default([])\n        | selectattr('name','search','(?i)' ~ parent_product_norm)\n        | map(attribute='id') | first)\n  ) | default(none) | int(none)\n}}"
    - alias: Resolve To Location
      choose:
      - conditions:
        - alias: Resolve To Location
          condition: template
          value_template: "{{ mode_norm == 'stock_transfer_location'\n   and (to_location_id_resolved
            is none)\n   and (has_to_loc_name) }}"
        sequence:
        - action: script.zen_sutra_grocy
          response_variable: locations_all
          data:
            action_type: read
            endpoint: /objects/locations?limit=500
        - variables:
            locations_all_list: "{{ locations_all['result']['content'] if locations_all is mapping and 'result' in locations_all else [] }}"
            to_location_id_resolved: "{{\n  (locations_all_list\n    | selectattr('name','equalto',
              to_loc_norm)\n    | map(attribute='id') | first)\n  | default(\n      (locations_all_list\n
              \       | selectattr('name','search','(?i)' ~ to_loc_norm)\n        |
              map(attribute='id') | first)\n    )\n  | default(to_location_id_resolved)\n}}"
    - alias: Resolve Shopping Locations
      choose:
      - conditions:
        - alias: Resolve Shopping Locations
          condition: template
          value_template: "{{ mode_norm in ['stock_add_purchase','stock_buy_product']\n
            \  and (shopping_location_id_resolved is none)\n   and (has_store_name)
            }}"
        sequence:
        - action: script.zen_sutra_grocy
          response_variable: shopping_locations_all
          data:
            action_type: read
            endpoint: /objects/shopping_locations
        - variables:
            shopping_locations_all_list: "{{ shopping_locations_all['result']['content'] if shopping_locations_all is mapping and 'result' in shopping_locations_all else [] }}"
            shopping_location_id_resolved: "{{\n  (shopping_locations_all_list\n    |
              selectattr('name','equalto', store_norm)\n    | map(attribute='id') |
              first)\n  | default(\n      (shopping_locations_all_list\n        | selectattr('name','search','(?i)'
              ~ store_norm)\n        | map(attribute='id') | first)\n    )\n  | default(shopping_location_id_resolved)\n}}"
    - alias: Resolve Parent Location
      choose:
      - conditions:
        - alias: Resolve Parent Location
          condition: template
          value_template: "{{ mode_norm == 'locations_metadata_set'\n   and parent_lid_in
            is none\n   and has_parent_loc_name }}"
        sequence:
        - action: script.zen_sutra_grocy
          response_variable: parent_locations_all
          data:
            action_type: read
            endpoint: /objects/locations?limit=500
        - variables:
            parent_locations_list: "{{ parent_locations_all['result']['content'] if parent_locations_all is mapping and 'result' in parent_locations_all else [] }}"
            parent_lid_resolved: "{{\n  (parent_locations_list\n    | selectattr('name','equalto',
              parent_loc_norm)\n    | map(attribute='id') | first)\n  | default(\n      parent_locations_list\n
              \       | selectattr('name','search','(?i)' ~ parent_loc_norm)\n        |
              map(attribute='id') | first\n    )\n}}"
    - alias: Resolve Product
      choose:
      - conditions:
        - alias: Resolve Product (canonical)
          condition: template
          value_template: "{{\n  mode_norm in [\n                 'catalog_find_product','stock_check_item','stock_where_is_item',\n
            \                'stock_entries_for_item','stock_add_purchase','stock_buy_product',\n
            \                'stock_consume','stock_inventory_adjust','stock_transfer_location',\n
            \                'get_product_meta','rename_product',\n                 'update_product_meta','set_default_location_for_product',\n                 'stock_get_product_details','stock_open_item',\n                 'shopping_add_product','shopping_remove_product',\n                 'stock_entry_update','catalog_delete_product','product_refs_get','product_ref_add','product_ref_remove',\n                 'products_tag'\n
            \               ]\n            and (product_id_resolved is none)\n            and
            (has_item_name)\n}}"
        sequence:
        - action: script.zen_sutra_grocy
          response_variable: products_exact
          data:
            action_type: read
            endpoint: objects/products?query%5B%5D=name={{ item_norm }}
        - variables:
            exact_matches: "{{ products_exact['result']['content'] if products_exact is mapping and 'result' in products_exact else [] }}"
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ exact_matches | length == 0 }}'
              alias: Fallback partial match
            sequence:
            - action: script.zen_sutra_grocy
              response_variable: products_like
              data:
                action_type: read
                endpoint: objects/products?query%5B%5D=name~{{ item_norm }}
            - variables:
                product_matches: "{{ products_like['result']['content'] if products_like is mapping and 'result' in products_like else [] }}"
          - conditions:
            - condition: template
              value_template: '{{ exact_matches | length > 0 }}'
            sequence:
            - variables:
                product_matches: '{{ exact_matches }}'
        - variables:
            grocy_product: '{{ product_matches | first }}'
            product_id_resolved: '{{ grocy_product.id | default(product_id_resolved)
              }}'
    - alias: Resolve Recipe
      choose:
      - conditions:
        - alias: Resolve Recipe by name
          condition: template
          value_template: "{{ mode_norm in [\n     'recipe_check_fulfillment',\n     'recipes_add_to_shopping',\n
            \    'recipes_consume',\n     'recipes_copy'\n   ]\n   and recipe_id_resolved
            is none\n   and has_item_name }}"
        sequence:
        - action: script.zen_sutra_grocy
          response_variable: recipes_all
          data:
            action_type: read
            endpoint: /objects/recipes
        - variables:
            recipes_all_list: "{{ recipes_all['result']['content'] if recipes_all is mapping and 'result' in recipes_all else [] }}"
            recipe_id_resolved: "{{\n  (recipes_all_list\n    | selectattr('name','equalto',
              item_norm)\n    | map(attribute='id')\n    | first)\n  | default(\n      (recipes_all_list\n
              \       | selectattr('name','search','(?i)' ~ item_norm)\n        | map(attribute='id')\n
              \       | first)\n    )\n  | default(none)\n}}"
    - alias: Pre Auto-Change Case Guards
      choose:
      - conditions:
        - condition: template
          value_template: "{{ product_matches is defined\n   and product_matches | length
            > 1 }}"
          alias: 'Guard: ambiguous product match'
        sequence:
        - variables:
            matches_out: "{% set ns = namespace(items=[]) %}\n{% for p in (product_matches
              | sort(attribute='name'))[:10] %}\n  {% set ns.items = ns.items + [\n
              \   {\n      \"id\": p.id,\n      \"name\": p.name\n    }\n  ] %}\n{%
              endfor %}\n{{ ns.items }}"
            final_response:
              status: error
              message: Multiple possible matches for product name
              mode: '{{ mode_norm }}'
              details:
                item: '{{ item_norm }}'
                matches_total: '{{ product_matches | length }}'
                matches: '{{ matches_out }}'
              coaching:
              - Multiple products match this name
              - Re-run with product_id
              - Or be more specific (brand, type)
        - stop: Product Match Ambiguous
          response_variable: final_response
    - alias: Auto-Change Cases
      choose:
      - conditions:
        - alias: 'Auto-upgrade: purchase → buy_product'
          condition: template
          value_template: "{{ mode_norm == 'stock_add_purchase'\n                and
            product_id_resolved is none\n                and has_item_name }}"
        sequence:
        - variables:
            mode_norm: stock_buy_product
            mode: stock_buy_product
            auto_upgraded: true
    - alias: Resolve Unit
      choose:
      - conditions:
        - alias: Resolve Unit
          condition: template
          value_template: "{{ mode_norm in [\n      'stock_buy_product',\n      'stock_add_purchase',\n     'stock_register_asset',\n
            \     'stock_consume',\n      'stock_inventory_adjust',\n      'stock_transfer_location',\n
            \     'units_find',\n      'units_update',\n      'catalog_add_product',\n
            \     'update_product_meta'\n   ]\n   and unit_id_resolved
            is none\n   and (has_unit_name) }}\n"
        sequence:
        - action: script.zen_sutra_grocy
          response_variable: units_all
          data:
            action_type: read
            endpoint: /objects/quantity_units?limit=500&offset=0
        - variables:
            units_all_list: "{{ units_all['result']['content'] if units_all is mapping and 'result' in units_all else [] }}"
            unit_id_resolved: "{{\n  (units_all_list\n    | selectattr('name','equalto',
              unit_norm)\n    | map(attribute='id')\n    | first\n    | default(none))\n}}"
        alias: Resolve Unit (required for stock math)
    - choose:
      - conditions:
        - alias: Create default unit "each"
          condition: template
          value_template: "{{ unit_norm == 'each'\n   and unit_id_resolved is none\n   and mode_norm in [\n     'stock_buy_product',\n     'stock_add_purchase',\n     'stock_consume',\n     'stock_inventory_adjust',\n     'stock_transfer_location',\n     'stock_register_asset',\n     'catalog_add_product',\n     'update_product_meta'\n   ] }}"
        sequence:
        - action: script.zen_sutra_grocy
          response_variable: unit_created
          data:
            action_type: post
            endpoint: /objects/quantity_units
            payload: "{{\n  {\n    \"name\": \"each\",\n    \"name_plural\": \"each\",\n
              \   \"description\": \"Default unit for countable items\"\n  }\n}}"
        - variables:
            unit_id_resolved: "{% if unit_created is mapping and 'result' in unit_created and unit_created['result'] is mapping and 'content' in unit_created['result'] %}\n  {{ unit_created['result']['content']['id'] | default(none) }}\n{% else %}\n  {{ none }}\n{% endif %}"
      alias: Create Default Unit 'each' if not present
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ unit_norm == 'each'\n   and unit_id_resolved is none\n
            \  and mode_norm in ['stock_buy_product', 'stock_register_asset', 'catalog_add_product', 'update_product_meta'] }}"
          alias: 'Error: Failed to create default unit'
        sequence:
        - variables:
            final_response:
              status: error
              message: Failed to create default quantity unit 'each'
              coaching:
              - Ensure Grocy allows unit creation
              - You may need to create the 'each' unit manually first
        - stop: Unit Creation Failed
          response_variable: final_response
      alias: 'Trap Error: Failed to create ''each'''
    - alias: Create Product if missing ('Buy It')
      choose:
      - conditions:
        - alias: 'Buy: Create product if missing'
          condition: template
          value_template: "{{ mode_norm == 'stock_buy_product'\n   and (product_id_resolved
            is none)\n   and (has_item_name) }}"
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ mode_norm == 'stock_buy_product'\n   and product_id_resolved
                is none\n   and location_id_resolved is none }}"
              alias: 'Error: location required.'
            sequence:
            - variables:
                final_response:
                  status: error
                  message: 'Cannot create product: location is required by Grocy.'
                  mode: '{{ mode_norm }}'
                  item: '{{ item_norm }}'
                  coaching:
                  - Provide a location or location_id when buying a new product.
                  - Example: '{''case'':''stock_buy_product'',''item'':''{{ item_norm
                      }}'',''location'':''Pantry'',''amount'':1}'
                  - Grocy requires location_id when creating products.
            - stop: Product Create Blocked
              response_variable: final_response
          - conditions:
              condition: template
              value_template: "{{ mode_norm in [\n      'stock_buy_product',\n      'stock_add_purchase',\n
                \     'stock_consume',\n      'stock_inventory_adjust',\n      'stock_transfer_location'\n
                \  ]\n   and unit_id_resolved is none }}"
            alias: 'Error: Unit required.'
            sequence:
            - variables:
                final_response:
                  status: error
                  message: 'Cannot perform stock operation: quantity unit is required.'
                  mode: '{{ mode_norm }}'
                  item: '{{ item_norm }}'
                  details:
                    unit:
                      name: '{{ unit_norm if has_unit_name else none }}'
                      id: '{{ unit_id_resolved }}'
                  coaching:
                  - Provide a unit or unit_id for this operation.
                  - 'Example: {''case'':''{{ mode_norm }}'',''item'':''{{ item_norm
                    }}'',''unit'':''each'',''location'':''Pantry'',''amount'':1}'
                  - Unit name must exactly match a Grocy quantity unit.
            - stop: Unit Missing
              response_variable: final_response
        - action: script.zen_sutra_grocy
          response_variable: product_created
          data:
            action_type: post
            endpoint: /objects/products
            payload: "{{\n  {\n    \"name\": item_norm,\n    \"location_id\": location_id_resolved,\n
              \   \"qu_id_stock\": unit_id_resolved,\n    \"qu_id_purchase\": unit_id_resolved,\n
              \   \"description\": (note_in if has_note else none)\n  }\n}}"
        - variables:
            product_id_resolved: "{% if product_created['result']['content']['id'] is defined
              %}\n  {{ product_created['result']['content']['id'] }}\n{% elif product_created['result']['content']['created_object_id']
              is defined %}\n  {{ product_created['result']['content']['created_object_id'] }}\n{%
              else %}\n  {{ none }}\n{% endif %}"
            grocy_product: '{{ product_created["result"]["content"] | default(none) }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ product_id_resolved is none }}'
              alias: 'Error: Buy blocked after create attempt'
            sequence:
            - variables:
                missing_location: '{{ (location_id_resolved is none) and not has_loc_name
                  }}'
                final_response:
                  status: error
                  message: "{% if missing_location %}\n  Purchase failed: a location
                    is required for stock_buy_product.\n{% else %}\n  Failed to create
                    product in catalog (no product id returned).\n{% endif %}"
                  mode: '{{ mode_norm }}'
                  item: '{{ item_norm }}'
                  details:
                    location:
                      name: '{{ loc_norm if has_loc_name else none }}'
                      id: '{{ location_id_resolved }}'
                    product_create_result: '{{ product_created["result"] | default(none)
                      }}'
                  coaching:
                  - "{% if missing_location %}\n  Provide a location (or location_id)
                    when buying a new product.\n  Example:\n  {'mode':'stock_buy_product','item':'{{
                    item_norm }}','amount':1,'location':'Pantry'}\n{% else %}\n  Ensure
                    Grocy allows product creation and returns an id.\n{% endif %}"
                  - Grocy may enforce location_id on stock purchase writes.
                  - If the item name is unusual, try simplifying it.
            - stop: Buy Flow Failed
              response_variable: final_response
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'stock_transfer_location'\n   and grocy_product
            is mapping\n   and grocy_product.tare_weight_enabled | default(false) }}"
          alias: 'Error: Tare-weight transfer not allowed'
        sequence:
        - variables:
            final_response:
              status: error
              message: Transfer not supported for tare-weight products
              mode: '{{ mode_norm }}'
              product_id: '{{ product_id_resolved }}'
              coaching:
              - This product uses tare-weight handling.
              - Grocy does not support transfers for tare-weight products.
              - Physically move it, re-weigh, then use stock_inventory_adjust.
        - stop: Tare Transfer Blocked
          response_variable: final_response
      alias: 'Trap Error: Tare Weight Transfer Attempt'
    - alias: Resolve Chores
      choose:
      - conditions:
        - alias: Resolve Chores
          condition: template
          value_template: "{{ mode_norm in ['chores_find','chores_execute','chores_delete','chores_edit']\n   and
            (chore_id_resolved is none)\n   and (has_item_name) }}"
        sequence:
        - action: script.zen_sutra_grocy
          response_variable: chores_all
          data:
            action_type: read
            endpoint: /objects/chores
        - variables:
            chores_all_list: "{{ chores_all['result']['content'] if chores_all is mapping and 'result' in chores_all else [] }}"
            chore_id_resolved: "{{\n  (chores_all_list\n    | selectattr('name','equalto',
              item_norm)\n    | map(attribute='id') | first)\n  | default(\n      (chores_all_list\n
              \       | selectattr('name','search','(?i)' ~ item_norm)\n        | map(attribute='id')
              | first)\n    )\n  | default(chore_id_resolved)\n}}"
    - alias: Resolve Tasks
      choose:
      - conditions:
        - alias: Resolve Tasks
          condition: template
          value_template: "{{ mode_norm in ['tasks_find','tasks_complete','tasks_undo']\n   and (task_id_resolved
            is none)\n   and (has_item_name) }}"
        sequence:
        - action: script.zen_sutra_grocy
          response_variable: tasks_all
          data:
            action_type: read
            endpoint: /objects/tasks
        - variables:
            tasks_all_list: "{{ tasks_all['result']['content'] if tasks_all is mapping and 'result' in tasks_all else [] }}"
            task_id_resolved: "{{\n  (tasks_all_list\n    | selectattr('name','equalto',
              item_norm)\n    | map(attribute='id') | first)\n  | default(\n      (tasks_all_list\n
              \       | selectattr('name','search','(?i)' ~ item_norm)\n        | map(attribute='id')
              | first)\n    )\n  | default(task_id_resolved)\n}}"
    - variables:
        current_entry_base: "{{ none }}"
    - alias: Pre-fetch Entry for stock_entry_update
      choose:
      - conditions:
        - alias: Pre-fetch via product entries (product known)
          condition: template
          value_template: "{{ mode_norm == 'stock_entry_update'
            and entry_id_in is not none
            and product_id_resolved is not none }}"
        sequence:
        - action: script.zen_sutra_grocy
          response_variable: entry_fetch_raw
          data:
            action_type: read
            endpoint: "stock/products/{{ product_id_resolved }}/entries"
        - variables:
            entry_fetch_list: "{{ entry_fetch_raw['result']['content'] | default([]) }}"
        - variables:
            current_entry_base: "{{ (entry_fetch_list
              | selectattr('id', 'equalto', entry_id_in | int)
              | list | first) | default(none) }}"
      - conditions:
        - alias: Pre-fetch via direct stock table query (entry_id only, no product)
          condition: template
          value_template: "{{ mode_norm == 'stock_entry_update'
            and entry_id_in is not none
            and product_id_resolved is none }}"
        sequence:
        - action: script.zen_sutra_grocy
          response_variable: entry_fetch_raw
          data:
            action_type: read
            endpoint: "objects/stock?query[]=id={{ entry_id_in }}"
        - variables:
            entry_fetch_list: "{{ entry_fetch_raw['result']['content'] | default([]) }}"
        - variables:
            current_entry_base: "{{ entry_fetch_list | first | default(none) }}"
    - alias: Guards Before Endpoint Resolution
      choose:
      - conditions:
        - alias: 'Guard: invalid location rename'
          condition: template
          value_template: "{{ (mode_norm == 'locations_rename'\n   and (\n     not has_new_name\n
            \    or new_name_norm == loc_norm\n   ))\n   or (mode_norm == 'shopping_locations_rename' and not has_new_name)\n   or (mode_norm == 'shopping_locations_rename' and shopping_location_id_resolved is none) }}\n"
        sequence:
        - variables:
            final_response:
              status: error
              message: Invalid rename request
              mode: '{{ mode_norm }}'
              details:
                current_name: '{{ loc_norm }}'
                requested_name: '{{ new_name_norm }}'
              coaching:
              - New name must be provided
              - New name must differ from the current name
        - stop: Rename Guard Failed
          response_variable: final_response
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'stock_add_purchase'\n   and product_id_resolved
            is none }}"
          alias: 'Guard: purchase requires existing product'
        sequence:
        - variables:
            final_response:
              status: error
              message: Product not found in catalog
              mode: '{{ mode_norm }}'
              details:
                item: '{{ item_norm }}'
                location: '{{ loc_norm }}'
                price: '{{ price_in }}'
              coaching:
              - stock_add_purchase requires an existing catalog product
              - Use stock_buy_product to create-and-purchase
              - Or provide an explicit product_id
        - stop: Purchase Guard Failed
          response_variable: final_response
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'products_merge'\n   and (\n     product_id_keep_resolved
            is none\n     or product_id_remove_resolved is none\n     or product_id_keep_resolved
            == product_id_remove_resolved\n   ) }}"
          alias: 'Guard: invalid product merge'
        sequence:
        - variables:
            final_response:
              status: error
              message: Invalid product merge request
              mode: '{{ mode_norm }}'
              details:
                product_id_keep: '{{ product_id_keep_resolved }}'
                product_id_remove: '{{ product_id_remove_resolved }}'
              coaching:
              - product_id_keep and product_id_remove are required
              - IDs must be different
              - This action is irreversible
        - stop: Product Merge Guard Failed
          response_variable: final_response
      - conditions:
        - alias: 'Guard: invalid product rename'
          condition: template
          value_template: "{{ mode_norm == 'rename_product'\n   and (\n     not has_new_name\n
            \    or new_name_norm == grocy_product.name\n   ) }}\n"
        sequence:
        - variables:
            final_response:
              status: error
              message: Invalid product rename
              mode: '{{ mode_norm }}'
              details:
                current_name: '{{ grocy_product.name }}'
                requested_name: '{{ new_name_norm }}'
              coaching:
              - New name must be provided
              - New name must differ from current name
        - stop: Product Rename Guard Failed
          response_variable: final_response
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'set_default_location_for_product'\n   and
            location_id_resolved is none }}"
          alias: 'Guard: default location requires location'
        sequence:
        - variables:
            final_response:
              status: error
              message: Default location requires a valid location
              mode: '{{ mode_norm }}'
              coaching:
              - Provide location or location_id
              - Example:
                  mode: set_default_location_for_product
                  item: Coffee
                  location: Pantry
        - stop: Default Location Guard Failed
          response_variable: final_response
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'units_update'\n   and unit_id_resolved is
            none }}"
          alias: 'Guard: unit must exist for unit_update'
        sequence:
        - variables:
            final_response:
              status: error
              message: Quantity unit not found
              mode: units_update
              details:
                unit: '{{ unit_norm }}'
              coaching:
              - Provide a valid unit_id
              - Use units_list or units_find to discover unit IDs
        - stop: Unit Update Blocked
          response_variable: final_response
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'unit_conversions_delete' and not entry_id_in }}"
          alias: 'Guard: entry_id required for unit_conversions_delete'
        sequence:
        - variables:
            final_response:
              status: error
              mode: unit_conversions_delete
              message: entry_id required — get the conversion row ID from unit_conversions_list
              coaching:
              - "Run mode=unit_conversions_list (optionally unit_id=X) to find the row ID"
              - "Pass that integer as entry_id to this mode"
        - stop: Conversion Delete Guard Failed
          response_variable: final_response
      - conditions:
        - alias: "Guard: global unit conversion requires confirm_action"
          condition: template
          value_template: |-
            {{ mode_norm == 'unit_conversions_add'
               and product_id_resolved is none
               and not confirm_action_in }}
        sequence:
        - variables:
            final_response:
              status: error
              mode: unit_conversions_add
              message: >-
                Global unit conversions (no product_id) affect all products in Grocy.
                Pass confirm_action=true to proceed, or add product_id to scope it
                to a single product.
              coaching:
              - "Per-product (recommended): add product_id=<id> — scopes conversion to that product only"
              - "Global (careful): add confirm_action=true — applies to ALL products using these units"
              - "Run unit_conversions_list to check for existing conversions before adding"
        - stop: Global Conversion Confirm Required
          response_variable: final_response
      - conditions:
        - alias: 'Guard: stock_entry_update entry not found'
          condition: template
          value_template: "{{ mode_norm == 'stock_entry_update'
            and entry_id_in is not none
            and current_entry_base is none }}"
        sequence:
        - variables:
            final_response:
              status: error
              message: "Stock entry {{ entry_id_in }} not found"
              mode: '{{ mode_norm }}'
              coaching:
              - "Get valid entry IDs via: {'mode':'stock_entries_for_item','item':'...'}"
              - "Pass the same item or product_id when calling stock_entry_update"
        - stop: Entry Not Found
          response_variable: final_response
      - conditions:
        - alias: 'Guard: locations_add dupe check'
          condition: template
          value_template: "{{ mode_norm == 'locations_add'
            and has_loc_name
            and not confirm_action_in
            and (locations_all_list | default([]))
              | selectattr('name', 'search', '(?i)' ~ loc_norm)
              | list | length > 0 }}"
        sequence:
        - variables:
            _dupe_matches: "{{ (locations_all_list | default([]))
              | selectattr('name', 'search', '(?i)' ~ loc_norm)
              | list }}"
        - variables:
            final_response:
              status: dupe_guard
              mode: locations_add
              message: Similar location names already exist.
              candidates: "{{ _dupe_matches | map(attribute='name') | list }}"
              candidate_ids: "{{ _dupe_matches | map(attribute='id') | list }}"
              coaching:
              - To use an existing location, reference it by name or ID instead.
              - "To create anyway: add confirm_action: true to your request."
              - "Example: {'mode':'locations_add','location':'{{ loc_norm }}','confirm_action':true}"
              - Run mode=help for location taxonomy and naming guidance.
        - stop: Location Dupe Guard
          response_variable: final_response
      - conditions:
        - alias: 'Guard: units_add idempotent check'
          condition: template
          value_template: "{{ mode_norm == 'units_add' and has_unit_name }}"
        sequence:
        - action: script.zen_sutra_grocy
          response_variable: _units_preflight_raw
          data:
            action_type: read
            endpoint: /objects/quantity_units
        - action: script.zen_sutra_grocy
          response_variable: _units_preflight_inactive_raw
          data:
            action_type: read
            endpoint: "/objects/quantity_units?query%5B%5D=active%3D0"
        - variables:
            _units_preflight_list: >-
              {{ ((_units_preflight_raw['result']['content'] if _units_preflight_raw is mapping and 'result' in _units_preflight_raw else [])
                 + (_units_preflight_inactive_raw['result']['content'] if _units_preflight_inactive_raw is mapping and 'result' in _units_preflight_inactive_raw else []))
                 | unique(attribute='id') | list }}
            _units_preflight_matches: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for u in _units_preflight_list -%}
                {%- if u.name | lower == unit_norm -%}{%- set ns.out = ns.out + [u] -%}{%- endif -%}
              {%- endfor -%}
              {{ ns.out }}
        - variables:
            _units_preflight_found: "{{ _units_preflight_matches | length > 0 }}"
            _units_preflight_match: "{{ _units_preflight_matches | first | default({}) }}"
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _units_preflight_found and (_units_preflight_match.get('active', 1) | int) == 0 }}"
            sequence:
            # Unit exists but inactive — reactivate it
            - action: script.zen_sutra_grocy
              continue_on_error: true
              response_variable: _units_reactivate_raw
              data:
                action_type: put
                endpoint: "/objects/quantity_units/{{ _units_preflight_match.id }}"
                payload: "{{ _units_preflight_match | combine({'active': 1, 'description': note_in if note_in else (_units_preflight_match.get('description') or '')}) | tojson }}"
            - variables:
                final_response:
                  status: reactivated
                  mode: units_add
                  unit_id: "{{ _units_preflight_match.id }}"
                  unit: "{{ _units_preflight_match.name }}"
                  message: "Unit '{{ _units_preflight_match.name }}' was inactive — reactivated."
            - stop: Unit Reactivated
              response_variable: final_response
          - conditions:
            - condition: template
              value_template: "{{ _units_preflight_found }}"
            sequence:
            - variables:
                final_response:
                  status: already_exists
                  mode: units_add
                  unit_id: "{{ _units_preflight_match.id }}"
                  unit: "{{ _units_preflight_match.name }}"
                  message: "Unit '{{ unit_norm }}' already exists."
                  coaching:
                  - Unit already exists. Reference it by name or unit_id.
                  - "To update: {'mode':'units_update','unit_id':{{ _units_preflight_match.id }},'note':'...'}"
            - stop: Unit Already Exists
              response_variable: final_response
    - variables:
        limit: "{% if cases[mode_norm].paging is defined %}\n  {{\n    (\n      per_page_in\n
          \     if per_page_in is number\n      else cases[mode_norm].paging.default.perPage\n
          \   ) | int\n  }}\n{% else %}\n  {{ none }}\n{% endif %}"
        page_effective: "{% if cases[mode_norm].paging is defined %}\n  {{\n    (\n
          \     page_in\n      if page_in is number\n      else cases[mode_norm].paging.default.pageNumber\n
          \   ) | int\n  }}\n{% else %}\n  {{ none }}\n{% endif %}"
        offset: "{% if limit is not none and page_effective is not none %}\n  {{ (page_effective
          - 1) * limit }}\n{% else %}\n  {{ none }}\n{% endif %}"
