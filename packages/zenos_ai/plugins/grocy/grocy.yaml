      \"tasks_add\": {\"intent\": \"Create a new Grocy task.\", \"needs\": [\"item\"], \"optional\": [\"note\", \"best_before_date\"], \"writes\": \"POST /objects/tasks\"},\n      \"chores_undo\": {\"intent\": \"Undo a chore execution.\", \"needs\": [\"execution_id\"], \"notes\": [\"execution_id is the execution ID, not the chore_id\"], \"writes\": \"POST /chores/executions/{executionId}/undo\"},\n      \"catalog_find_by_barcode\": {\"intent\": \"Find a product by barcode.\", \"needs\": [\"barcode\"], \"reads\": \"GET /stock/products/by-barcode/{barcode}\"},\n      \"stock_add_by_barcode\": {\"intent\": \"Purchase into stock by barcode.\", \"needs\": [\"barcode\"], \"optional\": [\"amount\", \"location\", \"price\", \"best_before_date\"], \"writes\": \"POST /stock/products/by-barcode/{barcode}/add\"},\n      \"stock_consume_by_barcode\": {\"intent\": \"Consume from stock by barcode.\", \"needs\": [\"barcode\"], \"optional\": [\"amount\"], \"writes\": \"POST /stock/products/by-barcode/{barcode}/consume\"},\n      \"batteries_list\": {\"intent\": \"List all tracked rechargeable batteries.\", \"reads\": \"GET /batteries\"},\n      \"batteries_get\": {\"intent\": \"Get details for a specific battery.\", \"needs\": [\"battery_id\"], \"reads\": \"GET /batteries/{batteryId}\"},\n      \"batteries_charge\": {\"intent\": \"Record a charge cycle for a battery.\", \"needs\": [\"battery_id\"], \"optional\": [\"amount\"], \"writes\": \"POST /batteries/{batteryId}/charge\"},\n      \"batteries_due\": {\"intent\": \"List rechargeable batteries bucketed by charge status: overdue, due_today, due_soon, ok. Use for maintenance triage.\", \"reads\": \"GET /batteries (shaped)\"},\n      \"batteries_journal\": {\"intent\": \"List charge cycle history across all batteries. Optional battery_id to filter to one device.\", \"optional\": [\"battery_id\", \"page\", \"per_page\"], \"reads\": \"GET /objects/battery_charge_cycles\"},\n      \"batteries_charge_undo\": {\"intent\": \"Undo a specific charge cycle. entry_id = the charge cycle ID (from batteries_journal).\", \"needs\": [\"entry_id\"], \"writes\": \"POST /batteries/charge-cycles/{id}/undo\"},\n      \"battery_status\": {\"intent\": \"Low-battery triage across the house. Groups HA Battery Notes devices by area with Grocy stock cross-reference. Template-only — no Grocy call for reading.\", \"reads\": \"HA Battery Notes sensors + Grocy /stock/products\"},\n      \"battery_overdue\": {\"intent\": \"Devices not replaced in N days. Requires days_threshold.\", \"needs\": [\"days_threshold\"], \"reads\": \"HA Battery Notes sensors (template)\"},\n      \"battery_replace\": {\"intent\": \"Atomic: log battery replacement in Battery Notes AND consume from Grocy stock. ha_entity_id required. item optional (Grocy product name for stock consume).\", \"needs\": [\"ha_entity_id\"], \"optional\": [\"item\", \"amount\"], \"writes\": \"battery_notes.set_battery_replaced + /stock/products/{id}/consume\"}\n    },\n\n    \"hints\": {\n      \"location_metadata\":
              \"Apply homeassistant metadata to grocy fields and grocy location id pointers
              to cabinet drawers, use labels liberally. These are the things that bind
