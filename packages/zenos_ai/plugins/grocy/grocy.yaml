    - alias: 'tasks_add — create a new Grocy task'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'tasks_add' }}"
        sequence:
        - variables:
            _ta_name: "{{ item | default('') | string | trim }}"
            _ta_note: "{{ note | default(none, true) }}"
            _ta_due: "{{ best_before_date | default(none, true) }}"
            _ta_area: "{{ homeassistant_area_id | default(none, true) }}"
        - action: script.zen_dojotools_grocy_advanced
          response_variable: _ta_raw
          data:
            action_type: create
            endpoint: /objects/tasks
            payload: >-
              {%- set p = {'name': _ta_name, 'done': 0} -%}
              {%- if _ta_note is not none -%}
                {%- set p = p | combine({'description': _ta_note}) -%}
              {%- endif -%}
              {%- if _ta_due is not none -%}
                {%- set p = p | combine({'due_date': _ta_due ~ ' 00:00:00'}) -%}
              {%- endif -%}
