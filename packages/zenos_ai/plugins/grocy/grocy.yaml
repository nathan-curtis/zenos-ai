        - alias: Create default unit "each"
          condition: template
          value_template: "{{ unit_norm == 'each'\n   and unit_id_resolved is none\n   and mode_norm in [\n     'stock_buy_product',\n     'stock_add_purchase',\n     'stock_consume',\n     'stock_inventory_adjust',\n     'stock_transfer_location',\n     'stock_register_asset',\n     'catalog_add_product',\n     'update_product_meta'\n   ] }}"
        sequence:
        - action: script.zen_sutra_grocy
          response_variable: unit_created
          data:
            action_type: post
            endpoint: /objects/quantity_units
            payload: "{{\n  {\n    \"name\": \"each\",\n    \"name_plural\": \"each\",\n
              \   \"description\": \"Default unit for countable items\"\n  }\n}}"
        - variables:
            unit_id_resolved: "{% if unit_created is mapping and 'result' in unit_created and unit_created['result'] is mapping and 'content' in unit_created['result'] %}\n  {{ unit_created['result']['content']['id'] | default(none) }}\n{% else %}\n  {{ none }}\n{% endif %}"
      alias: Create Default Unit 'each' if not present
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ unit_norm == 'each'\n   and unit_id_resolved is none\n
            \  and mode_norm in ['stock_buy_product', 'stock_register_asset', 'catalog_add_product', 'update_product_meta'] }}"
          alias: 'Error: Failed to create default unit'
        sequence:
        - variables:
            final_response:
              status: error
              message: Failed to create default quantity unit 'each'
              coaching:
              - Ensure Grocy allows unit creation
              - You may need to create the 'each' unit manually first
        - stop: Unit Creation Failed
          response_variable: final_response
      alias: 'Trap Error: Failed to create ''each'''
    - alias: Create Product if missing ('Buy It')
      choose:
      - conditions:
        - alias: 'Buy: Create product if missing'
          condition: template
          value_template: "{{ mode_norm == 'stock_buy_product'\n   and (product_id_resolved
            is none)\n   and (has_item_name) }}"
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ mode_norm == 'stock_buy_product'\n   and product_id_resolved
                is none\n   and location_id_resolved is none }}"
              alias: 'Error: location required.'
            sequence:
            - variables:
                final_response:
                  status: error
                  message: 'Cannot create product: location is required by Grocy.'
                  mode: '{{ mode_norm }}'
                  item: '{{ item_norm }}'
                  coaching:
                  - Provide a location or location_id when buying a new product.
                  - Example: '{''case'':''stock_buy_product'',''item'':''{{ item_norm
                      }}'',''location'':''Pantry'',''amount'':1}'
                  - Grocy requires location_id when creating products.
            - stop: Product Create Blocked
              response_variable: final_response
          - conditions:
              condition: template
              value_template: "{{ mode_norm in [\n      'stock_buy_product',\n      'stock_add_purchase',\n
                \     'stock_consume',\n      'stock_inventory_adjust',\n      'stock_transfer_location'\n
                \  ]\n   and unit_id_resolved is none }}"
            alias: 'Error: Unit required.'
            sequence:
            - variables:
                final_response:
                  status: error
                  message: 'Cannot perform stock operation: quantity unit is required.'
                  mode: '{{ mode_norm }}'
                  item: '{{ item_norm }}'
                  details:
                    unit:
                      name: '{{ unit_norm if has_unit_name else none }}'
                      id: '{{ unit_id_resolved }}'
                  coaching:
                  - Provide a unit or unit_id for this operation.
                  - 'Example: {''case'':''{{ mode_norm }}'',''item'':''{{ item_norm
                    }}'',''unit'':''each'',''location'':''Pantry'',''amount'':1}'
                  - Unit name must exactly match a Grocy quantity unit.
            - stop: Unit Missing
              response_variable: final_response
        - action: script.zen_sutra_grocy
          response_variable: product_created
          data:
            action_type: post
            endpoint: /objects/products
            payload: "{{\n  {\n    \"name\": item_norm,\n    \"location_id\": location_id_resolved,\n
              \   \"qu_id_stock\": unit_id_resolved,\n    \"qu_id_purchase\": unit_id_resolved,\n
              \   \"description\": (note_in if has_note else none)\n  }\n}}"
        - variables:
            product_id_resolved: "{% if product_created['result']['content']['id'] is defined
              %}\n  {{ product_created['result']['content']['id'] }}\n{% elif product_created['result']['content']['created_object_id']
              is defined %}\n  {{ product_created['result']['content']['created_object_id'] }}\n{%
              else %}\n  {{ none }}\n{% endif %}"
            grocy_product: '{{ product_created["result"]["content"] | default(none) }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ product_id_resolved is none }}'
              alias: 'Error: Buy blocked after create attempt'
            sequence:
            - variables:
                missing_location: '{{ (location_id_resolved is none) and not has_loc_name
                  }}'
                final_response:
                  status: error
                  message: "{% if missing_location %}\n  Purchase failed: a location
                    is required for stock_buy_product.\n{% else %}\n  Failed to create
                    product in catalog (no product id returned).\n{% endif %}"
                  mode: '{{ mode_norm }}'
                  item: '{{ item_norm }}'
                  details:
                    location:
                      name: '{{ loc_norm if has_loc_name else none }}'
                      id: '{{ location_id_resolved }}'
                    product_create_result: '{{ product_created["result"] | default(none)
                      }}'
                  coaching:
                  - "{% if missing_location %}\n  Provide a location (or location_id)
                    when buying a new product.\n  Example:\n  {'mode':'stock_buy_product','item':'{{
                    item_norm }}','amount':1,'location':'Pantry'}\n{% else %}\n  Ensure
                    Grocy allows product creation and returns an id.\n{% endif %}"
                  - Grocy may enforce location_id on stock purchase writes.
                  - If the item name is unusual, try simplifying it.
            - stop: Buy Flow Failed
              response_variable: final_response
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'stock_transfer_location'\n   and grocy_product
            is mapping\n   and grocy_product.tare_weight_enabled | default(false) }}"
          alias: 'Error: Tare-weight transfer not allowed'
        sequence:
        - variables:
            final_response:
              status: error
              message: Transfer not supported for tare-weight products
              mode: '{{ mode_norm }}'
              product_id: '{{ product_id_resolved }}'
              coaching:
              - This product uses tare-weight handling.
              - Grocy does not support transfers for tare-weight products.
              - Physically move it, re-weigh, then use stock_inventory_adjust.
        - stop: Tare Transfer Blocked
          response_variable: final_response
      alias: 'Trap Error: Tare Weight Transfer Attempt'
    - alias: Resolve Chores
      choose:
      - conditions:
        - alias: Resolve Chores
          condition: template
          value_template: "{{ mode_norm in ['chores_find','chores_execute','chores_delete','chores_edit']\n   and
            (chore_id_resolved is none)\n   and (has_item_name) }}"
        sequence:
        - action: script.zen_sutra_grocy
          response_variable: chores_all
          data:
            action_type: read
            endpoint: /objects/chores
        - variables:
            chores_all_list: "{{ chores_all['result']['content'] if chores_all is mapping and 'result' in chores_all else [] }}"
            chore_id_resolved: "{{\n  (chores_all_list\n    | selectattr('name','equalto',
              item_norm)\n    | map(attribute='id') | first)\n  | default(\n      (chores_all_list\n
              \       | selectattr('name','search','(?i)' ~ item_norm)\n        | map(attribute='id')
              | first)\n    )\n  | default(chore_id_resolved)\n}}"
    - alias: Resolve Tasks
      choose:
      - conditions:
        - alias: Resolve Tasks
          condition: template
          value_template: "{{ mode_norm in ['tasks_find','tasks_complete','tasks_undo']\n   and (task_id_resolved
            is none)\n   and (has_item_name) }}"
        sequence:
        - action: script.zen_sutra_grocy
          response_variable: tasks_all
          data:
            action_type: read
            endpoint: /objects/tasks
        - variables:
            tasks_all_list: "{{ tasks_all['result']['content'] if tasks_all is mapping and 'result' in tasks_all else [] }}"
            task_id_resolved: "{{\n  (tasks_all_list\n    | selectattr('name','equalto',
              item_norm)\n    | map(attribute='id') | first)\n  | default(\n      (tasks_all_list\n
              \       | selectattr('name','search','(?i)' ~ item_norm)\n        | map(attribute='id')
              | first)\n    )\n  | default(task_id_resolved)\n}}"
    - variables:
        current_entry_base: "{{ none }}"
    - alias: Pre-fetch Entry for stock_entry_update
      choose:
      - conditions:
        - alias: Pre-fetch via product entries (product known)
          condition: template
          value_template: "{{ mode_norm == 'stock_entry_update'
            and entry_id_in is not none
            and product_id_resolved is not none }}"
        sequence:
        - action: script.zen_sutra_grocy
          response_variable: entry_fetch_raw
          data:
            action_type: read
            endpoint: "stock/products/{{ product_id_resolved }}/entries"
        - variables:
            entry_fetch_list: "{{ entry_fetch_raw['result']['content'] | default([]) }}"
        - variables:
            current_entry_base: "{{ (entry_fetch_list
              | selectattr('id', 'equalto', entry_id_in | int)
              | list | first) | default(none) }}"
      - conditions:
        - alias: Pre-fetch via direct stock table query (entry_id only, no product)
          condition: template
          value_template: "{{ mode_norm == 'stock_entry_update'
            and entry_id_in is not none
            and product_id_resolved is none }}"
        sequence:
        - action: script.zen_sutra_grocy
          response_variable: entry_fetch_raw
          data:
            action_type: read
            endpoint: "objects/stock?query[]=id={{ entry_id_in }}"
        - variables:
            entry_fetch_list: "{{ entry_fetch_raw['result']['content'] | default([]) }}"
        - variables:
            current_entry_base: "{{ entry_fetch_list | first | default(none) }}"
    - alias: Guards Before Endpoint Resolution
      choose:
      - conditions:
        - alias: 'Guard: invalid location rename'
          condition: template
          value_template: "{{ mode_norm == 'locations_rename'\n   and (\n     not has_new_name\n
            \    or new_name_norm == loc_norm\n   ) }}\n"
        sequence:
        - variables:
            final_response:
              status: error
              message: Invalid rename request
              mode: '{{ mode_norm }}'
              details:
                current_name: '{{ loc_norm }}'
                requested_name: '{{ new_name_norm }}'
              coaching:
              - New name must be provided
              - New name must differ from the current name
        - stop: Rename Guard Failed
          response_variable: final_response
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'stock_add_purchase'\n   and product_id_resolved
            is none }}"
          alias: 'Guard: purchase requires existing product'
        sequence:
        - variables:
            final_response:
              status: error
              message: Product not found in catalog
              mode: '{{ mode_norm }}'
              details:
                item: '{{ item_norm }}'
                location: '{{ loc_norm }}'
                price: '{{ price_in }}'
              coaching:
              - stock_add_purchase requires an existing catalog product
              - Use stock_buy_product to create-and-purchase
              - Or provide an explicit product_id
        - stop: Purchase Guard Failed
          response_variable: final_response
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'products_merge'\n   and (\n     product_id_keep_resolved
            is none\n     or product_id_remove_resolved is none\n     or product_id_keep_resolved
            == product_id_remove_resolved\n   ) }}"
          alias: 'Guard: invalid product merge'
        sequence:
        - variables:
            final_response:
              status: error
              message: Invalid product merge request
              mode: '{{ mode_norm }}'
              details:
                product_id_keep: '{{ product_id_keep_resolved }}'
                product_id_remove: '{{ product_id_remove_resolved }}'
              coaching:
              - product_id_keep and product_id_remove are required
              - IDs must be different
              - This action is irreversible
        - stop: Product Merge Guard Failed
          response_variable: final_response
      - conditions:
        - alias: 'Guard: invalid product rename'
          condition: template
          value_template: "{{ mode_norm == 'rename_product'\n   and (\n     not has_new_name\n
            \    or new_name_norm == grocy_product.name\n   ) }}\n"
        sequence:
        - variables:
            final_response:
              status: error
              message: Invalid product rename
              mode: '{{ mode_norm }}'
              details:
                current_name: '{{ grocy_product.name }}'
                requested_name: '{{ new_name_norm }}'
              coaching:
              - New name must be provided
              - New name must differ from current name
        - stop: Product Rename Guard Failed
          response_variable: final_response
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'set_default_location_for_product'\n   and
            location_id_resolved is none }}"
          alias: 'Guard: default location requires location'
        sequence:
        - variables:
            final_response:
              status: error
              message: Default location requires a valid location
              mode: '{{ mode_norm }}'
              coaching:
              - Provide location or location_id
              - Example:
                  mode: set_default_location_for_product
                  item: Coffee
                  location: Pantry
        - stop: Default Location Guard Failed
          response_variable: final_response
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'units_update'\n   and unit_id_resolved is
            none }}"
          alias: 'Guard: unit must exist for unit_update'
        sequence:
        - variables:
            final_response:
              status: error
              message: Quantity unit not found
              mode: units_update
              details:
                unit: '{{ unit_norm }}'
              coaching:
              - Provide a valid unit_id
              - Use units_list or units_find to discover unit IDs
        - stop: Unit Update Blocked
          response_variable: final_response
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'unit_conversions_delete' and not entry_id_in }}"
          alias: 'Guard: entry_id required for unit_conversions_delete'
        sequence:
        - variables:
            final_response:
              status: error
              mode: unit_conversions_delete
              message: entry_id required — get the conversion row ID from unit_conversions_list
              coaching:
              - "Run mode=unit_conversions_list (optionally unit_id=X) to find the row ID"
              - "Pass that integer as entry_id to this mode"
        - stop: Conversion Delete Guard Failed
          response_variable: final_response
      - conditions:
        - alias: "Guard: global unit conversion requires confirm_action"
          condition: template
          value_template: |-
            {{ mode_norm == 'unit_conversions_add'
               and product_id_resolved is none
               and not confirm_action_in }}
        sequence:
        - variables:
            final_response:
              status: error
              mode: unit_conversions_add
              message: >-
                Global unit conversions (no product_id) affect all products in Grocy.
                Pass confirm_action=true to proceed, or add product_id to scope it
                to a single product.
              coaching:
              - "Per-product (recommended): add product_id=<id> — scopes conversion to that product only"
              - "Global (careful): add confirm_action=true — applies to ALL products using these units"
              - "Run unit_conversions_list to check for existing conversions before adding"
        - stop: Global Conversion Confirm Required
          response_variable: final_response
      - conditions:
        - alias: 'Guard: stock_entry_update entry not found'
          condition: template
          value_template: "{{ mode_norm == 'stock_entry_update'
            and entry_id_in is not none
            and current_entry_base is none }}"
        sequence:
        - variables:
            final_response:
              status: error
              message: "Stock entry {{ entry_id_in }} not found"
              mode: '{{ mode_norm }}'
              coaching:
              - "Get valid entry IDs via: {'mode':'stock_entries_for_item','item':'...'}"
              - "Pass the same item or product_id when calling stock_entry_update"
        - stop: Entry Not Found
          response_variable: final_response
      - conditions:
        - alias: 'Guard: locations_add dupe check'
          condition: template
          value_template: "{{ mode_norm == 'locations_add'
            and has_loc_name
            and not confirm_action_in
            and (locations_all_list | default([]))
              | selectattr('name', 'search', '(?i)' ~ loc_norm)
              | list | length > 0 }}"
        sequence:
        - variables:
            _dupe_matches: "{{ (locations_all_list | default([]))
              | selectattr('name', 'search', '(?i)' ~ loc_norm)
              | list }}"
        - variables:
            final_response:
              status: dupe_guard
              mode: locations_add
              message: Similar location names already exist.
              candidates: "{{ _dupe_matches | map(attribute='name') | list }}"
              candidate_ids: "{{ _dupe_matches | map(attribute='id') | list }}"
              coaching:
              - To use an existing location, reference it by name or ID instead.
              - "To create anyway: add confirm_action: true to your request."
              - "Example: {'mode':'locations_add','location':'{{ loc_norm }}','confirm_action':true}"
              - Run mode=help for location taxonomy and naming guidance.
        - stop: Location Dupe Guard
          response_variable: final_response
      - conditions:
        - alias: 'Guard: units_add idempotent check'
          condition: template
          value_template: "{{ mode_norm == 'units_add' and has_unit_name }}"
        sequence:
        - action: script.zen_sutra_grocy
          response_variable: _units_preflight_raw
          data:
            action_type: read
            endpoint: /objects/quantity_units
        - action: script.zen_sutra_grocy
          response_variable: _units_preflight_inactive_raw
          data:
            action_type: read
            endpoint: "/objects/quantity_units?query%5B%5D=active%3D0"
        - variables:
            _units_preflight_list: >-
              {{ ((_units_preflight_raw['result']['content'] if _units_preflight_raw is mapping and 'result' in _units_preflight_raw else [])
                 + (_units_preflight_inactive_raw['result']['content'] if _units_preflight_inactive_raw is mapping and 'result' in _units_preflight_inactive_raw else []))
                 | unique(attribute='id') | list }}
            _units_preflight_matches: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for u in _units_preflight_list -%}
                {%- if u.name | lower == unit_norm -%}{%- set ns.out = ns.out + [u] -%}{%- endif -%}
              {%- endfor -%}
              {{ ns.out }}
        - variables:
            _units_preflight_found: "{{ _units_preflight_matches | length > 0 }}"
            _units_preflight_match: "{{ _units_preflight_matches | first | default({}) }}"
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _units_preflight_found and (_units_preflight_match.get('active', 1) | int) == 0 }}"
            sequence:
            # Unit exists but inactive — reactivate it
            - action: script.zen_sutra_grocy
              continue_on_error: true
              response_variable: _units_reactivate_raw
              data:
                action_type: put
                endpoint: "/objects/quantity_units/{{ _units_preflight_match.id }}"
                payload: "{{ _units_preflight_match | combine({'active': 1, 'description': note_in if note_in else (_units_preflight_match.get('description') or '')}) | tojson }}"
            - variables:
                final_response:
                  status: reactivated
                  mode: units_add
                  unit_id: "{{ _units_preflight_match.id }}"
                  unit: "{{ _units_preflight_match.name }}"
                  message: "Unit '{{ _units_preflight_match.name }}' was inactive — reactivated."
            - stop: Unit Reactivated
              response_variable: final_response
          - conditions:
            - condition: template
              value_template: "{{ _units_preflight_found }}"
            sequence:
            - variables:
                final_response:
                  status: already_exists
                  mode: units_add
                  unit_id: "{{ _units_preflight_match.id }}"
                  unit: "{{ _units_preflight_match.name }}"
                  message: "Unit '{{ unit_norm }}' already exists."
                  coaching:
                  - Unit already exists. Reference it by name or unit_id.
                  - "To update: {'mode':'units_update','unit_id':{{ _units_preflight_match.id }},'note':'...'}"
            - stop: Unit Already Exists
              response_variable: final_response
    - variables:
        limit: "{% if cases[mode_norm].paging is defined %}\n  {{\n    (\n      per_page_in\n
          \     if per_page_in is number\n      else cases[mode_norm].paging.default.perPage\n
          \   ) | int\n  }}\n{% else %}\n  {{ none }}\n{% endif %}"
        page_effective: "{% if cases[mode_norm].paging is defined %}\n  {{\n    (\n
          \     page_in\n      if page_in is number\n      else cases[mode_norm].paging.default.pageNumber\n
          \   ) | int\n  }}\n{% else %}\n  {{ none }}\n{% endif %}"
        offset: "{% if limit is not none and page_effective is not none %}\n  {{ (page_effective
          - 1) * limit }}\n{% else %}\n  {{ none }}\n{% endif %}"
    # userfields schema CRUD -- short-circuit before endpoint builder
    - if: "{{ mode_norm in ['userfields_list','userfields_deploy','userfields_repair','userfields_delete','userfields_create'] }}"
      then:
        - variables:
            _uf_hh_cab: "{{ states('sensor.zen_default_household_cabinet_resolved') }}"
            _caller_token: "{{ caller_token | default('') }}"
