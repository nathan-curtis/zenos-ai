      move_on_open:
        name: Move on Open
        description: When opened via stock_open_item, auto-move to default consume location.
        selector:
          boolean:
      no_own_stock:
        name: No Own Stock
        description: >-
          update_product_meta only. Grocy flag meaning "this product has no stock of its
          own: only aggregate child products' stock". Set false to fix a product that
          rejects direct stock writes (HTTP 500 / SQLSTATE 23000 constraint violation)
          despite having no actual child products: an orphaned/inconsistent flag.
        selector:
          boolean:
      due_days_after_open:
        name: Due Days After Open
        description: Best-before days after opening (e.g. 180 for a 6-month filter).
        selector:
          number:
            min: 0
      best_before_days:
        name: Best Before Days
        description: Default days from purchase to best-before. -1 = never expires (clears expiry tracking for non-perishables like TP, batteries, paper).
        selector:
          number:
            min: -1
      amount:
        name: Amount
        description: Quantity used for stock math such as buy, consume, or transfer.
        selector:
          number:
            min: 0
            step: 0.01
      unit:
        name: Unit
        description: Quantity unit name (exact Grocy match, e.g. each, kg, l).
        selector:
          text:
      unit_id:
        name: Unit ID
        description: Explicit quantity unit ID. Skips unit name lookup.
        selector:
          number:
            min: 1
      purchase_unit_id:
        name: Purchase Unit ID
        description: Separate purchase unit for update_product_meta. Defaults to unit_id if omitted.
        selector:
          number:
            min: 1
      quick_consume_amount:
        name: Quick Consume Amount
        description: >-
          update_product_meta only. Sets the product's quick-consume amount.
          Grocy auto-scales this on any unit switch (qu_id_stock change) in
          the same request -- to set a corrected value after a unit switch,
          send this in a separate follow-up call with no unit/unit_id.
        selector:
          number:
            min: 0
            step: 0.01
      quick_open_amount:
        name: Quick Open Amount
        description: >-
          update_product_meta only. Sets the product's quick-open amount.
          Same Grocy auto-scaling-on-unit-switch caveat as quick_consume_amount.
        selector:
          number:
            min: 0
            step: 0.01
      tare_weight:
        name: Tare Weight
        description: >-
          update_product_meta only. Sets the product's tare weight (the empty
          container), in the product's stock unit. Grocy auto-scales it on any
          unit switch (qu_id_stock change) in the same request -- set it in a
          separate call, before or after the switch.
        selector:
          number:
            min: 0
            step: 0.01
      enable_tare_weight_handling:
        name: Tare Weight Handling
        description: >-
          update_product_meta only. Turns tare-weight handling on or off for the
          product. With it on, Grocy reads the amount of an add, a consume or
          an inventory as the total weight including the container, and
          subtracts tare_weight. Set tare_weight too, in the stock unit.
        selector:
          boolean:
      price:
        name: Price
        description: Optional unit price used for purchase transactions.
        selector:
          number:
            min: 0
            step: 0.01
      best_before_date:
        name: Best Before
        description: Optional best-before or due date for inventory entries.
        selector:
          date:
      purchase_date:
        name: Purchase Date
        description: Purchase date (YYYY-MM-DD). The stock purchase date for stock_add_purchase, stock_buy_product and bulk_stock_add (none = today); the asset purchase/install date for update_product_meta (get_product_meta returns it with fallback).
        selector:
          text:
      receipt:
        name: Receipt
        description: "receipt_intake only: the receipt as JSON {receipt_id, store or shopping_location_id, purchase_date, subtotal, tax, discounts, total, source_ref, notes, lines: [{line, product_id or name, description, amount, unit, unit_price, line_total, type (item|free|discount|coupon), best_before_date, nonperishable, location_id, note}]}. mode=help receipt_intake has an example."
        selector:
          text:
            multiline: true
      allow_unbalanced:
        name: Allow Unbalanced
        description: "receipt_intake only: true books a receipt whose lines do not add up to its subtotal or total (default false: refused)."
        selector:
          boolean:
      entry_ids:
        name: Entry IDs
        description: "stock_waste_expired only: the stock entry ids (from its preview) a person approved to waste, as a list or comma-separated."
        selector:
          text:
      hold_invalid:
        name: Hold Invalid
        description: "bulk_stock_add only: true books the lines that pass preflight and holds the rest (default false: a line with errors stops the whole call and nothing is written)."
        selector:
          boolean:
      location:
        name: Location
        description: Source or primary location name used by location-aware cases.
        selector:
          text:
      location_id:
        name: Location ID
        description: Explicit location ID. Skips location name resolution.
        selector:
          number:
            min: 1
      to_location:
        name: To Location
        description: Destination location name for transfer operations.
        selector:
          text:
      to_location_id:
        name: To Location ID
        description: Explicit destination location ID for transfers.
        selector:
          number:
            min: 1
      to_unit_id:
        name: To Unit ID
        description: Destination unit ID for unit_conversions_add.
        selector:
          number:
            min: 1
      store:
        name: Store
        description: Shopping location name used for purchase-related cases only.
        selector:
          text:
      shopping_location_id:
        name: Shopping Location ID
        description: Explicit shopping location ID. Skips store name lookup.
        selector:
          number:
            min: 1
      location_subclass:
        selector:
          select:
            options:
            - suite
            - room
            - closet
            - workspace
            - container
            - furniture
            - shelf
            - drawer
            - cubby
            - storage
        description: What type of location / storage is this? (location metadata)
      homeassistant_area_id:
        name: Home Assistant Area
        description: Home Assistant area associated with this Grocy location.
        selector:
          text:
      placement_priority:
        name: Placement Priority
        description: Numeric semantic priority for resolving locations. Higher wins.
        selector:
          number:
            min: 0
            step: 1
      parent_location:
        name: Parent Location
        description: Parent location name used when setting location metadata.
        selector:
          text:
      parent_location_id:
        name: Parent Location ID
        description: Explicit parent location ID used for location metadata.
        selector:
          number:
            min: 1
      child_location_ids:
        name: Child Location IDs
        description: JSON array of child IDs for bulk reparent. E.g. "[201,202,203]"
        selector:
          text:
      orphan_to:
        name: Orphan To Location ID
        description: Location to receive stock before safe-delete.
        selector:
          number:
            min: 1
      list_id:
        name: Shopping List ID
        description: Optional shopping list ID override for shopping list cases.
        selector:
          number:
            min: 1
      page:
        name: Page
        description: Page number (1-based)
        selector:
          number:
            min: 1
        default: 1
      per_page:
        name: Items per page
        description: Number of items per page
        selector:
          number:
            min: 1
            max: 250
        default: 25
      done_only:
        name: Done Only
        description: For shopping_clear_list - only clear items marked done (false clears all).
        selector:
          boolean:
        default: false
      recipe_id:
        name: Recipe ID
        description: Explicit Grocy recipe ID. Skips recipe name lookup.
        selector:
          number:
            min: 1
      chore_id:
        name: Chore ID
        description: Explicit chore ID. Skips chore name lookup.
        selector:
          number:
            min: 1
      task_id:
        name: Task ID
        description: Explicit task ID. Skips task name lookup.
        selector:
          number:
            min: 1
      entry_id:
        name: Stock Entry ID
        description: Specific stock entry ID for stock_entry_update. Get IDs via stock_entries_for_item.
        selector:
          number:
            min: 1
      execution_id:
        name: Chore Execution ID
        description: Execution ID to undo for chores_undo.
        selector:
          number:
            min: 1
      booking_id:
        name: Booking ID
        description: Booking ID to undo for stock_undo_booking.
        selector:
          number:
            min: 1
      battery_id:
        name: Battery ID
        description: Grocy battery ID for batteries_get, batteries_charge, batteries_due, batteries_journal.
        selector:
          number:
            min: 1
      ha_entity_id:
        name: HA Entity ID
        description: Battery Notes source entity ID for battery_replace (e.g. sensor.office_remote_battery_plus).
        selector:
          text:
      days_threshold:
        name: Days Threshold
        description: Days since last battery replaced - cutoff for battery_overdue.
        selector:
          number:
            min: 1
      field_id:
        description: "Userfield schema definition ID. Required for userfields_delete. Get IDs via userfields_list."
        required: false
        selector:
          number:
            min: 1
      entity:
        description: "Grocy entity name for userfields_list filter (locations, products, chores, tasks). Omit for all."
        required: false
        selector:
          text:
      period_days:
        name: Period Days
        description: Chore recurrence in days (chores_add, chores_edit).
        selector:
          number:
            min: 1
      note:
        name: Note
        description: Note or description text (also used by locations_update_description).
        selector:
          text:
            multiline: true
      spoiled:
        name: Spoiled
        description: For stock_consume - true marks this consumption as waste/spoilage in Grocy's native stock log (spoiled flag), false (default) is a normal consume.
        selector:
          boolean:
      new_name:
        name: New Name
        description: New name for the location.
        selector:
          text:
      report_inventory:
        name: Report Inventory
        description: Return a post-purchase inventory summary after buying.
        selector:
          boolean:
        default: true
      confirm_action:
        name: Confirm Action
        description: Bypass dupe guard on locations_add; confirm protected ops.
        selector:
          boolean:
      bom:
        name: BOM
        description: JSON string - BOM for provision_bom. See mode=help provision_bom.
        selector:
          text:
      hazmat_class:
        name: Hazmat Class
        description: Hazmat major class (e.g. flammable, corrosive, toxic). Triggers lean RM safety log.
        selector:
          text:
      safety_type:
        name: Safety Type
        description: "zen_safety_type userfield. fire_extinguisher|aed|first_aid|escape_ladder|spill_kit|eyewash|prescription|hazmat_storage"
        selector:
          text:
      asset_type:
        name: Asset Type
        description: "zen_asset_type userfield. consumable|asset|equipment|medical|prescription|hazmat|tool|appliance|book"
        selector:
          text:
      ha_labels:
        name: HA Labels
        description: "HA label slugs CSV: HA owns namespace. e.g. fire_safety,garage_tools"
        selector:
          text:
      catalog_class:
        name: Catalog Class
        description: "locations_metadata_set: item_type slug, __intake__ for global intake location, or perishable_storage for fridges/pantries/freezers."
        selector:
          text:
      expand:
        name: Expand
        description: "Opt-in: expand place lens results to full object_lens objects. Use per_page to cap (default 5). 3N+1 API calls."
        selector:
          boolean:
      dry_run:
        name: Dry Run
        description: Return plan without writing. For locations_hierarchy_rebuild, bulk_stock_reconcile_recent (default true there - must be explicitly set false + confirm_action=true to actually write), and bulk_stock_add (default false there, matching its existing confirm_action-required behavior - set true to preview without booking).
        selector:
          boolean:
      include_all:
        name: Include All
        description: For chores_due only - false (default) returns only chores that are currently due; set true to return every chore house-wide regardless of due status.
        selector:
          boolean:
      since_timestamp:
        name: Since Timestamp
        description: 'For bulk_stock_reconcile_recent: cutoff marking when the erroneous entries were created, e.g. ''2026-07-21 10:50:00''. Only stock entries at/after this timestamp are summed and reversed.'
        selector:
          text:
      field_name:
        name: Field Name
        description: Snake_case slug for userfields_create.
        selector:
          text:
      field_caption:
        name: Field Caption
        description: Display caption for userfields_create or userentities_create.
        selector:
          text:
      field_type:
        name: Field Type
        description: "Grocy field type for userfields_create. Default: text-single-line."
        selector:
          text:
      userentity_id:
        name: Userentity ID
        description: Custom entity integer ID for userobjects or values operations.
        selector:
          number:
            min: 1
      userobject_id:
        name: Userobject ID
        description: Object ID for userobjects_delete or userentity_values_get/set.
        selector:
          number:
            min: 1
      values_json:
        name: Values JSON
        description: JSON dict of field key to value pairs for userentity_values_set.
        selector:
          text:
            multiline: true

      ref_type:
        name: Ref Type
        description: Reference type - ticket or doc. For product_ref_add/remove.
        selector:
          select:
            options: [ticket, doc]
      ref_id:
        name: Ref ID
        description: Zammad ticket ID or Paperless document ID for product_ref_add/remove.
        selector:
          number:
            min: 1

      show_trace:
        name: Show Debug Trace
        description: Include resolution details, IDs, and endpoint information.
        selector:
          boolean:
    sequence:
    # Onboarding gate (zen_os_1 entry_gate): an agent without
    # zenos.agent.basic gets help and tool_manifest only. This script exits
    # early on every path, so the gate is the first step and stops here.
    # Automations, the scheduler and Flynn's lens registration (no user) pass.
    - variables:
        _inv_gate: >-
          {%- import 'zenos_ai/zen_os_1.jinja' as OS -%}
          {{ OS.entry_gate((context.user_id if context is defined else '') or '', 'zen_dojotools_inventory', (mode | default('', true) | string | trim | lower) or 'help') | from_json({'pass': false, 'reason': 'guarded: the onboarding gate could not be read'}) }}
    - if: "{{ not _inv_gate.get('pass', false) }}"
      then:
      - variables:
          final_response:
            status: error
            mode: "{{ mode | default('', true) }}"
            reason: "{{ _inv_gate.reason }}"
            next_step: "{{ _inv_gate.next_step }}"
      - action: system_log.write
        data:
          level: warning
          logger: zen_entry_gate
          message: "{{ _inv_gate.get('log') or 'onboarding gate refused a call (gate result unreadable)' }}"
      - stop: onboarding required
        response_variable: final_response
    - if: "{{ (mode | default('') | lower) == 'tool_manifest' }}"
      then:
      - variables:
          result: >-
            {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
            {{ MF.tool_manifest(
                tool='zen_dojotools_inventory',
                summary='Stock, shopping, chores, batteries, and locations',
                display_name='Inventory',
                tier='dojotools',
                version='5.13.5',
                health=(
                  {'configured': false, 'status': 'not_configured', 'notes': ['input_text.grocy_url is not set — set it to your Grocy instance base URL.']}
                  if (states('input_text.grocy_url') | default('', true) | trim) in ['', 'unknown', 'unavailable']
                  else ({'configured': true, 'status': 'ok', 'notes': []}
                        if (((state_attr(states('sensor.zen_default_household_cabinet_resolved'), 'variables') | default({}, true)).get('grocy_schema')) is not none)
                        else {'configured': true, 'status': 'warn', 'notes': ['Grocy schema not deployed yet: area-scoped inventory returns nothing until it is. Self-heals on the next boot/daily bootstrap, or run mode=userfields_repair.']})
                ),
                required_labels=['grocy'],
                optional_labels=['grocy'],
                consumes=['grocy_request'],
                returns=['inventory_data'],
                modes={'help': 'help', 'manifest': 'tool_manifest', 'register': 'register'},
                icon='mdi:fridge-outline',
                color='green',
                stripe=3,
                impact='soft',
                mcp_exposed=true,

                seed_modes=['battery_status', 'stock_list_by_location', 'stock_list_volatile'],
                caller_token=caller_token | default('')
            ) | from_json | combine({'register_mode': 'register', 'provider_key': 'inventory', 'lens_provider': true, 'lens_anchors': ['area_id'], 'lens_returns': ['player_hint'], 'certs_required': [
                {'cert': 'zenos.knowledge.inventory_schema_edit', 'level': 1, 'modes': ['userfields_create', 'userentities_create', 'locations_add', 'locations_rename', 'locations_update_description', 'locations_metadata_set', 'locations_reparent_bulk', 'locations_hierarchy_rebuild', 'units_add', 'units_update', 'unit_conversions_add', 'product_unit_repair', 'shopping_locations_rename'], 'bundle': ['zenos_agent_steward'],
                 'display_name': 'Inventory Schema Edit', 'max_level': 2,
                 'description': "Change how the pantry inventory is organized; level 2 also deletes", 'detail': 'Grocy structure: userfields, user entities, locations, units. Level 2 for delete/merge.',
                 'grant_via': 'persona_editor mode=cert_req_grant cert_component=zenos.knowledge.inventory_schema_edit'},
                {'cert': 'zenos.knowledge.inventory_schema_edit', 'max_level': 2, 'description': "Change how the pantry inventory is organized; level 2 also deletes", 'level': 2, 'modes': ['userfields_delete', 'userentities_delete', 'locations_delete', 'locations_delete_safe', 'unit_conversions_delete', 'catalog_delete_product', 'products_merge']}
              ]}) }}
      - stop: tool_manifest
        response_variable: result

    # ── Lens bus: register ────────────────────────────────────────────────────
    - if: "{{ (mode | default('') | lower) == 'register' }}"
      then:
      - variables:
          _inv_hh: "{{ states('sensor.zen_default_household_cabinet_resolved') }}"
      - variables:
          _inv_provider:
            consumes: [area_id]
            returns: [player_hint]
            tool: zen_dojotools_inventory
            mode: by_anchor
            department: inventory
      # Registered through the central lens writer (prompt_loader
      # lens_registry): it fills defaults, validates, and replaces the entry whole.
      - action: script.zen_admintools_prompt_loader
        response_variable: _inv_reg_write
        continue_on_error: true
        data:
          mode: lens_registry
          action_type: register
          item: inventory
          payload_json: "{{ _inv_provider | tojson }}"
      - variables:
          _inv_reg_write: "{{ _inv_reg_write.get('result', _inv_reg_write) if _inv_reg_write is defined and _inv_reg_write is mapping else {} }}"
      # Schema self-heal: register runs on HA start and daily via
      # zen_dojotools_manifest bootstrap_stacks, so the Grocy schema converges
      # to canonical without anyone calling repair. Spawned, not nested: a
      # script cannot call itself, and this script is queued so it runs next.
      - if: "{{ (states('input_text.grocy_url') | default('', true) | trim) not in ['', 'unknown', 'unavailable'] }}"
        then:
          - action: script.turn_on
            continue_on_error: true
            target:
              entity_id: script.zen_dojotools_inventory
            data:
              variables:
                mode: userfields_repair
                dry_run: false
                caller_token: inventory_schema_selfheal
      - variables:
          result:
            status: "{{ 'success' if _inv_reg_write is mapping and _inv_reg_write.get('status', '') == 'success' else 'error' }}"
            mode: register
            provider: inventory
            registry_entry: "{{ _inv_provider }}"
            schema_selfheal: "{{ 'queued' if (states('input_text.grocy_url') | default('', true) | trim) not in ['', 'unknown', 'unavailable'] else 'skipped: grocy_url not set' }}"
      - stop: inventory register complete
        response_variable: result

    # ── Lens bus: unregister ──────────────────────────────────────────────────
    - if: "{{ (mode | default('') | lower) == 'unregister' }}"
      then:
      # Through the central lens writer, the same door register uses.
      - action: script.zen_admintools_prompt_loader
        response_variable: _inv_unreg_write
        continue_on_error: true
        data:
          mode: lens_registry
          action_type: unregister
          item: inventory
      - variables:
          _inv_unreg_write: "{{ _inv_unreg_write.get('result', _inv_unreg_write) if _inv_unreg_write is defined and _inv_unreg_write is mapping else {} }}"
          result:
            status: "{{ 'success' if _inv_unreg_write is mapping and _inv_unreg_write.get('status', '') == 'success' else 'error' }}"
            mode: unregister
            provider: inventory
            message: "{{ 'Provider inventory removed from lens_registry.' if _inv_unreg_write is mapping and _inv_unreg_write.get('status', '') == 'success' else 'Unregister failed.' }}"
      - stop: inventory unregister complete
        response_variable: result

    - variables:
        show_trace: '{{ show_trace | default(false) }}'
        tool_name: Zen DojoTools Inventory
        tool_version: 5.13.5
        schema_version: "1.4.0"
    # ─── CASE AUTHORING CHECKLIST ────────────────────────────────────────────────
    # When adding a new mode/case to this script, update ALL of the following:
    #  1. fields: mode: enum        — add the mode name to the selector options list
    #  2. cases: dict (help block)  — add entry with intent/needs/optional/does/note/example
    #  3. Endpoint block            — add elif branch: mode_norm == 'X' -> /path
    #  4. action_type block         — add to read/post/update/delete list as appropriate
    #  5. payload: block            — add elif branch if this mode needs a body
    #  6. Guards / choose branches  — add any required-field guards before the API call
    #  7. filtered_result template  — add elif branch if the response needs reshaping
    #  8. _meta / _ns.p paths       — update both payload-build paths if the case writes
    # Reminder: cases: dict feeds help_json automatically via combine — do NOT duplicate
    #
    # ⚠ CUSTOM-HANDLED MODES (choose-alias, no standard endpoint builder):
    #   These modes handle themselves via a choose alias and call stop before the API
    #   call step. They MUST be added to BOTH guard lists or they get NoneType errors:
    #     GUARD 1 (value_template with double-quotes, alias: Error: Endpoint not Resolved)
    #     GUARD 2 (value_template with single-quotes, alias: Call Grocy API)
    #   Search "Call Grocy API" to find both. Add mode to both on every new custom handler.
    # ─────────────────────────────────────────────────────────────────────────────
    - variables:
        grocy_response: {}
        mode_norm: '{{ (mode | default(''help'')) | string | lower }}'
        item_norm: '{{ (item | default('''')) ~ '''' | trim }}'
        unit_norm: "{{\n  (unit | default('each')) ~ ''\n  | trim\n  | lower\n}}"
        loc_norm: '{{ (location | default('''')) ~ '''' | trim }}'
        loc_sub_norm: '{{ ( location_subclass | default('''') ) }}'
        to_loc_norm: '{{ (to_location | default('''')) ~ '''' | trim }}'
        store_norm: '{{ (store | default('''')) ~ '''' | trim }}'
        report_inventory_norm: '{{ report_inventory | default(true) }}'
        parent_loc_norm: '{{ (parent_location | default('''')) ~ '''' | trim }}'
        parent_lid_in: '{{ parent_location_id | default(none) }}'
        # homeassistant_area_id is canonical; area_id / homeassistant_area / area are
        # accepted too (the docs and help used them, and HA passes undeclared names
        # through silently, so a call with area_id used to report success and skip it).
        area_id_norm: "{{ (homeassistant_area_id | default('', true) or (area_id if area_id is string else '') or homeassistant_area | default('', true) or area | default('', true)) | string | trim | lower }}"
        new_name_norm: '{{ (new_name | default('''')) ~ '''' | trim }}'
        placement_priority_in: '{{ placement_priority | default(none) }}'
        pid_keep_in: '{{ product_id_keep | default(none) }}'
        pid_remove_in: '{{ product_id_remove | default(none) }}'
        product_group_id_in: '{{ product_group_id | default(none) }}'
        move_on_open_in: "{{ move_on_open | default(none) }}"
        no_own_stock_in: "{{ no_own_stock | default(none) }}"
        due_days_after_open_in: "{{ due_days_after_open | default(none) }}"
        best_before_days_in: "{{ best_before_days | default(none) }}"
        uid_in: '{{ unit_id | default(none) }}'
        purchase_uid_in: '{{ purchase_unit_id | default(none) }}'
        qca_in: '{{ quick_consume_amount | default(none) }}'
        qoa_in: '{{ quick_open_amount | default(none) }}'
        tare_in: '{{ tare_weight | default(none) }}'
        tare_on_in: '{{ (1 if (enable_tare_weight_handling | bool(false)) else 0) if enable_tare_weight_handling is defined and enable_tare_weight_handling is not none else none }}'
        # has_explicit_unit_input: checks the RAW unit/unit_id
        # caller inputs directly, not unit_norm (which silently defaults to
        # 'each' when no unit was passed at all -- see line ~1248) or
        # unit_id_resolved (which the pre-existing "Resolve Unit" block
        # further below also auto-populates for every stock-math mode,
        # update_product_meta included, regardless of caller intent). Only
        # this flag reflects "did the caller actually ask to change the
        # unit" -- used to gate update_product_meta's unit-write branches so
        # a call that only meant to touch e.g. min_stock_amount or
        # quick_consume_amount never silently resets qu_id_stock back to
        # the auto-resolved default.
        has_explicit_unit_input: >-
          {{ (unit is defined and (unit | default('', true) | string | trim != ''))
             or (unit_id is defined and unit_id is not none) }}
        pid_in: "{% set pid = product_id | default(none) %} {% if pid is not none %}\n
          \ {{ pid }}\n{% elif item is number %}\n  {{ item | int }}\n{% else %}\n  {{
          none }}\n{% endif %}"
        lid_in: "{% set lid = location_id | default(none) %}\n{% if lid is not none
          %}\n  {{ lid }}\n{% elif location is number %}\n  {{ location | int }}\n{%
          elif location is string and location | trim | regex_match('^\\\\d+$') %}\n
          \ {{ location | int }}\n{% else %}\n  {{ none }}\n{% endif %}"
        to_lid_in: "{% set lid = to_location_id | default(none) %}\n{% if lid is not
          none %}\n  {{ lid }}\n{% elif to_location is number %}\n  {{ to_location |
          int }}\n{% else %}\n  {{ none }}\n{% endif %}"
        to_unit_id_in: '{{ to_unit_id | default(none) }}'
        slid_in: '{{ shopping_location_id | default(none) }}'
        cid_in: '{{ chore_id | default(none) }}'
        tid_in: '{{ task_id | default(none) }}'
        amt_in: '{{ amount | default(1) | float(0) }}'
        price_in: '{{ price | default(none) }}'
        bbd_in: '{{ best_before_date | default(none) }}'
        purchase_date_in: "{{ (purchase_date | default('', true)) | string | trim }}"
        list_in: '{{ list_id | default(none) }}'
        note_in: '{{ note | default('''') | string | trim }}'
        spoiled_in: '{{ spoiled | default(false) | bool }}'
        payload_in: '{{ payload | default(none) }}'
        page_in: '{{ page | default(1) | int(1) }}'
        per_page_in: '{{ per_page | default(25) | int(25) }}'
        confirm_action_in: '{{ confirm_action | default(false) | bool }}'
        hazmat_class_in: '{{ hazmat_class | default(none, true) }}'
        dry_run_in: '{{ dry_run | default(false) | bool }}'
        parent_product_id_in: '{{ parent_product_id | default(none) }}'
        parent_product_norm: '{{ (parent_product | default('''')) ~ '''' | trim }}'
        has_parent_product_name: '{{ parent_product_norm is string and parent_product_norm | length > 0 }}'
        has_item_name: '{{ item_norm is string and item_norm | length > 0 }}'
        has_loc_name: '{{ loc_norm is string and loc_norm | length > 0 }}'
        has_to_loc_name: '{{ to_loc_norm is string and to_loc_norm | length > 0 }}'
        has_parent_loc_name: '{{ parent_loc_norm is string and parent_loc_norm | length
          > 0 }}'
        has_new_name: '{{ new_name_norm is string and new_name_norm | length > 0 }}'
        has_area_id: '{{ area_id_norm is string and area_id_norm | length > 0 }}'
        has_loc_subclass: '{{ loc_sub_norm is string and loc_sub_norm | length > 0 }}'
        catalog_class_in: "{{ (catalog_class | default('', true)) | string | trim }}"
        has_catalog_class: "{{ (catalog_class | default('', true)) | string | trim | length > 0 }}"
        has_store_name: '{{ store_norm is string and store_norm | length > 0 }}'
        has_unit_name: '{{ unit_norm is string and unit_norm | length > 0 }}'
        has_note: '{{ note_in is string and note_in | length > 0 }}'
        has_brand: '{{ brand is string and brand | length > 0 }}'
        has_sku: '{{ sku is string and sku | length > 0 }}'
        barcode_norm: '{{ (barcode | default("")) | string | trim }}'
        recipe_id_in: '{{ recipe_id | default(none) }}'
        entry_id_in: '{{ entry_id | default(none) }}'
        execution_id_in: '{{ execution_id | default(none) }}'
        booking_id_in: '{{ booking_id | default(none) }}'
        battery_id_in: '{{ battery_id | default(none) }}'
        done_only_in: '{{ done_only | default(false) }}'
        has_barcode: '{{ (barcode | default("") | string | trim) | length > 0 }}'
        has_explicit_amount: '{{ amount is defined and amount is not none }}'
        recipe_id_resolved: '{{ recipe_id | default(none) }}'
        child_lids_in: '{{ child_location_ids | default("[]") }}'
        orphan_to_lid_in: '{{ orphan_to | default(none) }}'
        bom_in: '{{ bom | default(none, true) }}'
        receipt_in: '{{ receipt | default(none, true) }}'
    - variables:
        cases:
          catalog_list_products:
            intent: List all products (catalog).
            needs: []
            does: GET /objects/products
            paging:
              required: true
              default:
                pageNumber: 1
                perPage: 25
            example: "{'mode':'catalog_list_products','per_page':25}"
          catalog_find_product:
            intent: Find a product by name (catalog lookup).
            needs:
            - item
            does: GET /objects/products + local name match
            example: "{'mode':'catalog_find_product','item':'coffee'}"
          catalog_add_product:
            intent: Create a 0-stock catalog entry for a product not yet owned.
            needs:
            - item
            - location OR location_id
            - unit OR unit_id (REQUIRED — omitting leaves qu_id_stock null, blocking all stock operations)
            optional:
            - sku
            - brand
            - note
            - confirm_action (bypass dupe guard)
            does: GET dupe-check + POST /objects/products
            example: "{'mode':'catalog_add_product','item':'Roborock HEPA Filter','location_id':80,'unit':'each','sku':'8.02.0104','brand':'Roborock'}"
          provision_bom:
            intent: Idempotent BOM provisioner — catalog + meta + labels + chores + stock seed for a set of parts.
            needs:
            - bom (JSON string with parts array)
            - confirm_action=true
            optional:
            - bom.robot_name, bom.storage_location_id, bom.ha_labels, bom.chore_ha_labels, bom.reseed
            - bom.parts[].product_id — pin to existing Grocy product ID; skips name-lookup entirely (for programmatic callers only — never hardcode in preset files)
            does: Per-part — unit resolve, resolve product (caller-pin → exact name → same-location+ha_labels-root fallback), create/reuse, update meta, tag, find/create chore, tag, seed stock. ha_labels in BOM root is REQUIRED for products to appear in zen_dojotools_plant mode=managed — omitting it makes the machine invisible.
            example: "{'mode':'provision_bom','bom':'{\"parts\":[{\"key\":\"main_brush\",\"name\":\"Roborock S7 MaxV Ultra - Main Brush\",\"unit\":\"each\",\"product_id\":548,\"storage_location_id\":451,\"consume_location_id\":387,\"chore_name\":\"Vacuum - Replace Main Brush\",\"chore_period_days\":180}]}','confirm_action':true}"
          catalog_import_bom:
            intent: Bulk-import a list of products (books, tools, any catalog items) — idempotent create + userfield tag in one call. No chores, no stock. Use for bulk cataloguing from visual scans or structured lists.
            needs:
            - bom (JSON string — see schema below)
            - confirm_action=true
            schema: "{'default_location_id':109,'default_ha_labels':'book','default_asset_type':'book','default_unit':'each','items':[{'name':'Title','location_id':109,'ha_labels':'book','asset_type':'book','book_author':'Last, First','book_isbn':'...','book_series':'Series #N','book_genre':'fantasy'}]}"
            optional_item_keys: name, location_id (inherits default), ha_labels (inherits default), asset_type (inherits default), book_author, book_isbn, book_series, book_genre, note, unit (inherits default)
            does: Per-item — name-lookup (idempotent), create if missing, PUT /userfields/products/{id} with all provided book fields + ha_labels + asset_type. Returns per-item status (created|existing|failed) + summary counts.
            example: "{'mode':'catalog_import_bom','bom':'{\"default_location_id\":109,\"default_ha_labels\":\"book\",\"items\":[{\"name\":\"Fahrenheit 451\",\"book_author\":\"Bradbury, Ray\",\"book_genre\":\"sci-fi\"}]}','confirm_action':true}"
          catalog_delete_product:
            intent: Delete a product. Stock guard + parent guard — offer merge/reparent or confirm to override.
            needs:
            - item OR product_id
            optional:
            - product_id_keep (merge stock into this product instead of blocking stock guard)
            - confirm_action (override both guards — discards stock AND orphans children)
            does: "GET stock check → merge/guard; GET children check → parent_guard; else DELETE"
            notes:
            - "stock_guard fires when product has stock and no product_id_keep"
            - "parent_guard fires when product has child products (varietals/brands under it)"
            - "confirm_action=true bypasses both guards — use only when you understand the consequences"
            example: "{'mode':'catalog_delete_product','product_id':401,'product_id_keep':411}"
          catalog_audit:
            intent: Full product health scan. Surfaces orphaned children, unlabelled products, products with no HA area, no default location, and no stock unit. Run after bulk imports or to find invisible products.
            needs: []
            reads: GET /objects/products (all)
            returns:
              orphaned_children: products whose parent_product_id points to a deleted product
              no_labels: products with no ha_labels (invisible to plant/tag queries)
              no_area: products with no homeassistant_area (no spatial context)
              no_location: products with no default storage location
              no_unit: products with no qu_id_stock (stock operations will fail)
            example: "{'mode':'catalog_audit'}"
          get_product_meta:
            intent: Retrieve canonical product metadata.
            needs:
            - item OR product_id
            does: GET /objects/products/{productId}
            example: "{'mode':'get_product_meta','item':'coffee'}"
          rename_product:
            intent: Rename a product (display name only).
            needs:
            - item OR product_id
            - new_name
            does: PUT /objects/products/{productId}
            notes:
            - Product ID remains stable
            - Stock and history are unaffected
            example: "{'mode':'rename_product','item':'coffee','new_name':'Whole Bean Coffee'}"
          update_product_meta:
            intent: Update declarative product metadata. unit_id sets qu_id_stock+consume (purchase unit preserved unless purchase_unit_id given). purchase_unit_id requires a global QU conversion to exist.
            needs:
            - item OR product_id
            optional:
            - note
            - unit OR unit_id
            - purchase_unit_id (separate purchase unit; requires global QU conversion to stock unit)
            - amount (sets min_stock_amount)
            - shopping_location_id (sets preferred store/shopping location)
            - to_location_id (sets default_consume_location_id — where item is consumed from by default)
            - product_group_id (sets product group/category)
            - move_on_open (bool — stock_open_item auto-moves to default_consume_location)
            - due_days_after_open (int — best_before = open_date + N days, e.g. 180 for a 6-month filter)
            - best_before_days (int — default days from purchase to best-before; -1 = never expires)
            - quick_consume_amount (Grocy auto-scales this on any unit switch in the same request — set the corrected value in a separate follow-up call with no unit/unit_id)
            - quick_open_amount (same auto-scaling-on-unit-switch caveat as quick_consume_amount)
            does: PUT /objects/products/{productId}
            supported_fields:
            - description
            - note
            - brand (stored in description if present)
            - sku (stored in description if present)
            - unit/unit_id (sets qu_id_stock, qu_id_consume; also qu_id_purchase unless purchase_unit_id given)
            - purchase_unit_id (optional — separate purchase unit; requires global QU conversion to stock unit)
            - amount (sets min_stock_amount — warning threshold)
            - shopping_location_id (preferred shopping/store location)
            - to_location_id (sets default_consume_location_id)
            - product_group_id (product category group ID — use product_groups_list to find IDs)
            - best_before_days (-1 = never expires; use for non-perishables like paper goods, batteries, cleaning supplies)
            - due_days_after_open (days until best_before after opening — for filters, open bags, etc.)
            expiry_semantics:
              best_before_days=-1: product never expires — no best_before date set on purchase; never appears in volatile/overdue
              best_before_days=0: best_before set to purchase date (expires immediately — rarely useful)
              best_before_days=N: best_before = purchase_date + N days
              due_days_after_open=N: when stock_open_item is called, stamps best_before = open_date + N days
            constraints:
            - No stock semantics are modified
            - description only sent when note/brand/sku provided
            - purchase_unit_id != unit_id requires global QU conversion — run unit_conversions_list first
            - setting unit_id alone preserves existing qu_id_purchase (no self-referential conversion)
            - a product with no stock unit (null qu_id_stock) that was ever stocked is refused here: use product_unit_repair
            examples:
            - "{'mode':'update_product_meta','item':'pH Up','unit_id':4,'purchase_unit_id':18}"
            - "{'mode':'update_product_meta','item':'Toilet Paper','best_before_days':-1}"
            - "{'mode':'update_product_meta','item':'HVAC Filter','due_days_after_open':90,'move_on_open':true}"
          set_default_location_for_product:
            intent: Set the default storage location for new purchases.
            needs:
            - item OR product_id
            - location OR location_id
            does: PUT /objects/products/{productId}
            example: "{'mode':'set_default_location_for_product','item':'coffee','location':'Pantry'}"
          products_merge:
            intent: Merge two products into one canonical product.
            needs:
            - product_id_keep
            - product_id_remove
            does: POST /stock/products/{productIdToKeep}/merge/{productIdToRemove}
            notes:
            - Moves all stock, history, and references
            - Removes the source product
            - This action is irreversible
            example: "{'mode':'products_merge','product_id_keep':42,'product_id_remove':99}"
          resolve_products_by_ids:
            intent: 'Internal: resolve product IDs to names'
            needs:
            - product_ids
            internal: true
            does: GET /objects/products/{productId}
            example: "internal — not for direct use"
          stock_list_by_location:
            intent: What is in a location.
            needs:
            - location OR location_id
            does: GET /stock/locations/{locationId}/entries
            example: "{'mode':'stock_list_by_location','location':'Pantry'}"
          stock_check_item:
            intent: Do we have the item.
            needs:
            - item OR product_id
            does: GET /stock/products/{productId}/entries
            example: "{'mode':'stock_check_item','item':'coffee'}"
          stock_where_is_item:
            intent: Where is the item stored. NOTE - returns identical data to stock_check_item. Prefer stock_check_item to avoid a redundant call.
            needs:
            - item OR product_id
            does: GET /stock/products/{productId}/locations
            example: "{'mode':'stock_check_item','item':'coffee'}"
          stock_entries_for_item:
            intent: Detailed stock entries for an item.
            needs:
            - item OR product_id
            does: GET /stock/products/{productId}/entries
            example: "{'mode':'stock_entries_for_item','item':'coffee'}"
          waste_history:
            intent: Grocy's own spoiled=true consume bookings (native waste log) — optionally scoped to one product.
            needs: []
            does: GET /objects/stock_log?query[]=spoiled=1
            example: "{'mode':'waste_history'} or {'mode':'waste_history','product_id':'692'}"
          stock_add_purchase:
            intent: Purchase into inventory.
            needs:
            - item OR product_id
            does: POST /stock/products/{productId}/add
            example: "{'mode':'stock_add_purchase','item':'coffee','amount':2,'location':'Pantry'}"
          stock_buy_product:
            intent: Create product if missing, then purchase into inventory.
            needs:
            - item OR product_id
            does: POST /objects/products (optional) + POST /stock/products/{productId}/add
            example: "{'mode':'stock_buy_product','item':'coffee','amount':1,'location':'Pantry'}"
          stock_consume:
            intent: Consume from stock.
            needs:
            - item OR product_id
            does: POST /stock/products/{productId}/consume
            example: "{'mode':'stock_consume','item':'coffee','amount':1}"
          stock_inventory_adjust:
            intent: Reconcile inventory to a measured total.
            needs:
            - item OR product_id
            - amount
            does: POST /stock/products/{productId}/inventory
            example: "{'mode':'stock_inventory_adjust','item':'coffee','amount':5}"
          stock_transfer_location:
            intent: Move item between locations.
            needs:
            - item OR product_id
            - location OR location_id
            - to_location OR to_location_id
            does: POST /stock/products/{productId}/transfer
            example: "{'mode':'stock_transfer_location','item':'coffee','location':'Pantry','to_location':'Kitchen'}"
          shopping_add_missing:
            intent: Add items below min stock to shopping list.
            needs:
            - optional list_id
            does: POST /stock/shoppinglist/add-missing-products
            example: "{'mode':'shopping_add_missing'}"
          shopping_add_overdue:
            intent: Add overdue products to shopping list.
            needs:
            - optional list_id
            does: POST /stock/shoppinglist/add-overdue-products
            example: "{'mode':'shopping_add_overdue'}"
          shopping_add_expired:
            intent: Add expired products to shopping list.
            needs:
            - optional list_id
            does: POST /stock/shoppinglist/add-expired-products
            example: "{'mode':'shopping_add_expired'}"
          chores_add:
            intent: Create a new Grocy chore, optionally linked to a product consumed on execution.
            needs: [item]
            optional: [note, product_id, product_amount, period_type, period_days]
            does: POST /objects/chores
            example: "{'mode':'chores_add','item':'Replace waste basket liner','product_id':387,'product_amount':1,'period_days':7}"
          chores_tag:
            intent: Set homeassistant_area and/or entity_id userfields on an existing chore. Required for chores_by_area and room_brief area discovery.
            needs: [chore_id OR item]
            optional: [homeassistant_area_id, homeassistant_entity_id]
            does: PUT /userfields/chores/{choreId}
            example: "{'mode':'chores_tag','item':'Lawn Tractor Oil Change','homeassistant_area_id':'garage'}"
          products_tag:
            intent: Set ZenOS userfields on a product — zen_safety_type, zen_asset_type, hazmat_class, homeassistant_area, ha_labels. Required to make products discoverable by emergency mode, inventory area queries, object_lens label lookups, and zen_dojotools_plant mode=managed. ha_labels is the ONLY mechanism that makes a product visible to Plant — a product without it is invisible to mode=managed regardless of location or chores.
            needs: [item OR product_id]
            optional: [safety_type, asset_type, hazmat_class, homeassistant_area_id, ha_labels]
            does: PUT /userfields/products/{productId}
            example: "{'mode':'products_tag','product_id':531,'safety_type':'fire_extinguisher','ha_labels':'fire_safety,garage'}"
          chores_delete:
            intent: Delete a Grocy chore by name or chore_id.
            needs: [chore_id OR item]
            does: GET /objects/chores/{id} (confirm) → DELETE /objects/chores/{id}
            example: "{'mode':'chores_delete','item':'Clean litter box'}"
          chores_edit:
            intent: Edit an existing chore. Pass only fields to change; others are preserved.
            needs: [chore_id OR item]
            optional: [new_name, period_type, period_days, product_id, product_amount, note, active]
            does: GET /objects/chores/{id} → merge overrides → PUT /objects/chores/{id}
            example: "{'mode':'chores_edit','item':'Replace waste basket liner','period_days':14,'new_name':'Replace liner'}"
          stock_area_inventory:
            intent: Full denormalized room view — all locations with product names and amounts. One call replaces N location + M product lookups.
            needs: [homeassistant_area_id]
            optional: []
            does: GET locations (area filter) + GET stock entries per location + GET all products (joined locally)
            example: "{'mode':'stock_area_inventory','homeassistant_area_id':'powder_room'}"
          chores_list:
            intent: List all chores.
            needs: []
            does: GET /objects/chores
            example: "{'mode':'chores_list'}"
          chores_find:
            intent: Find chores by name.
            needs:
            - item
            does: GET /objects/chores + local name match
            example: "{'mode':'chores_find','item':'kitchen'}"
          chores_execute:
            intent: Execute a chore.
            needs:
            - chore_id OR item
            does: POST /chores/{choreId}/execute
            example: "{'mode':'chores_execute','item':'Clean litter box'}"
          tasks_list:
            intent: List all tasks.
            needs: []
            does: GET /objects/tasks
            example: "{'mode':'tasks_list'}"
          tasks_find:
            intent: Find tasks by name.
            needs:
            - item
            does: GET /objects/tasks + local name match
            example: "{'mode':'tasks_find','item':'grocery'}"
          tasks_complete:
            intent: Complete a task.
            needs:
            - task_id OR item
            does: POST /tasks/{taskId}/complete
            example: "{'mode':'tasks_complete','item':'Buy groceries'}"
          locations_add:
            intent: Create a new Grocy location. Dupe-guards similar names; add confirm_action true to bypass.
            needs:
            - location
            optional:
            - parent_location
            - parent_location_id
            - location_subclass
            - area_id
            - placement_priority
            - confirm_action
            does:
            - POST /objects/locations
            - PUT /userfields/locations/{locationId} (if metadata provided)
            example: "{'mode':'locations_add','location':'Coffee Drawer','parent_location':'Kitchen','location_subclass':'drawer'}"
          locations_list:
            intent: List all locations.
            needs: []
            does: GET /objects/locations
            example: "{'mode':'locations_list'}"
          locations_find:
            intent: Find locations by name and/or parent anchor. parent_location_id alone lists all containers in a room.
            needs:
            - location (optional — name search)
            - parent_location_id (optional — filter to children of this anchor)
            does: GET /objects/locations + local filter
            example: "{'mode':'locations_find','parent_location_id':15}"
          locations_rename:
            intent: Rename a Grocy location.
            needs:
            - location OR location_id
            - new_name
            does: PUT /objects/locations/{locationId}
            example: "{'mode':'locations_rename','location':'Coffee Drawer','new_name':'Coffee Station'}"
          locations_update_description:
            intent: Update the description field of an existing Grocy location.
            needs:
            - location OR location_id
            - note (new description text)
            does: PUT /objects/locations/{locationId}
            example: "{'mode':'locations_update_description','location_id':276,'note':'Hazmat/MSDS — paint and household chemicals'}"
          locations_get_by_area:
            intent: Reverse lookup — find the Grocy location anchored to a given HA area_id. Returns the room anchor and any tagged children.
            needs:
            - homeassistant_area_id
            does: GET /objects/locations + filter by userfields.homeassistant_area (case-insensitive)
            example: "{'mode':'locations_get_by_area','homeassistant_area_id':'garage'}"
          locations_metadata_set:
            intent: Set governed semantic metadata for a location.
            needs:
            - location OR location_id
            - at least one of parent_location, parent_location_id, location_subclass,
              homeassistant_area_id (also accepted as area_id, homeassistant_area or area), placement_priority, note, ha_labels, catalog_class
            does: PUT /userfields/locations/{locationId}
            catalog_class_values:
              __intake__: global catalog intake location (triggers intake semaphore in KFC)
              perishable_storage: location holds perishable items (fridge, pantry, freezer) — triggers best_before coaching when buying/moving a never-expires product here. Children inherit via parent walk.
              non_perishable: explicit override — suppresses perishable_storage inheritance from parent. Use on sub-locations inside a perishable parent that don't hold food (e.g. fridge filter slots, wine racks inside pantry).
            examples:
            - "{'mode':'locations_metadata_set','location':'Left Twin Bookcase','ha_labels':'bookshelf','homeassistant_area_id':'living_room'}"
            - "{'mode':'locations_metadata_set','location':'Refrigerator','catalog_class':'perishable_storage'}"
            - "{'mode':'locations_metadata_set','location':'Pantry','catalog_class':'perishable_storage'}"
            - "{'mode':'locations_metadata_set','location':'Kitchen Refrigerator - Water Filter Slot','catalog_class':'non_perishable'}"
          locations_delete:
            intent: Permanently delete a Grocy location. Only call when the location has no stock.
            needs:
            - location_id
            does: DELETE /objects/locations/{locationId}
            example: "{'mode':'locations_delete','location_id':261}"
          units_list:
            intent: List all quantity units.
            needs: []
            does: GET /objects/quantity_units
            example: "{'mode':'units_list'}"
          units_find:
            intent: Find a quantity unit by exact name.
            needs:
            - unit
            does: GET /objects/quantity_units + exact local name match
            example: "{'mode':'units_find','unit':'each'}"
          units_add:
            intent: Create a new quantity unit. Idempotent — returns existing unit if name already found.
            needs:
            - unit
            optional:
            - note
            does: GET /objects/quantity_units + POST if not found
            constraints:
            - No fuzzy creation
            - Returns already_exists status if unit found (not an error)
            example: "{'mode':'units_add','unit':'can','note':'Standard grocery can'}"
          units_update:
            intent: Update an existing quantity unit.
            needs:
            - unit_id
            optional:
            - unit
            - note
            does: PUT /objects/quantity_units/{unitId}
            constraints:
            - unit_id is required
            - Renames must differ from current name
            example: "{'mode':'units_update','unit_id':5,'unit':'each'}"
          unit_conversions_add:
            intent: Add a QU conversion between two units (required before changing qu_id_stock on a product with stock).
            needs:
            - unit_id
            - to_location_id
            - amount
            optional:
            - product_id
            does: POST /objects/quantity_unit_conversions
            note: unit_id=from_qu_id, to_unit_id=to_qu_id, amount=factor; to_location_id still accepted as fallback
            example: "{'mode':'unit_conversions_add','unit_id':47,'to_unit_id':70,'amount':1}"
          unit_conversions_list:
            intent: List QU conversions. Optionally filter by unit_id (matches from OR to) or product_id.
            needs: []
            optional:
            - unit_id
            - product_id
            does: GET /objects/quantity_unit_conversions
            note: Use before unit_conversions_add to avoid duplicates. Use to audit orphaned conversions.
            example: "{'mode':'unit_conversions_list','unit_id':18}"
          unit_conversions_delete:
            intent: Delete a QU conversion by its row ID. Get IDs via unit_conversions_list.
            needs:
            - entry_id
            does: DELETE /objects/quantity_unit_conversions/{id}
            note: entry_id here is the conversion row ID from unit_conversions_list (not a stock entry ID).
            example: "{'mode':'unit_conversions_delete','entry_id':5}"
          product_unit_audit:
            intent: "Read only. Every product whose stock or purchase unit is not a real unit (stored '', None, null, 0, or a deleted unit's id). Stock writes for those products fail."
            needs: []
            returns: "count, and per product: id, name, problems, on_hand"
            does: "GET /objects/quantity_units, raw-column filters on /objects/products, then per product /objects/stock. Nothing is changed."
            example: "{'mode':'product_unit_audit'}"
          product_unit_repair:
            intent: "Fix a product whose stock or purchase unit is not a real unit (see product_unit_audit) by reconciling it onto a new product with the unit set, and moving every reference to it. Grocy cannot change such a product's unit in place once it was stocked."
            needs: [product_id or item, unit_id (units_list), confirm_action=true to write (without it, a preview of the plan and every reference)]
            does: "Maps references (Grocy stock, barcodes, chores, recipe ingredients, shopping list, meal plan, child products, user objects; every cabinet; Mealie foods). Renames the old product '<name> (retired #<id>)', creates the new one (fields, userfields, barcodes, parent), rebooks each stock entry on it with its own dates, price, location, store and note, zeroes the old by inventory correction, repoints every reference through its owner, sets the old inactive (history and receipt lines stay on it), verifies. Journaled in the household cabinet: run it again to continue a stopped repair."
            refuses: "a product whose units are real; an inactive or unknown unit; a reference with no handler (it is listed as manual and nothing is written)"
            certs: "zenos.knowledge.inventory_schema_edit level 1; repointing Room Manager safety also needs zenos.spatial.room_topology_edit, Mealie foods the Kitchen write cert (the preview names what applies)"
            example: "{'mode':'product_unit_repair','product_id':531,'unit_id':68,'confirm_action':true}"
