            action_type: update
            endpoint: /userfields/tasks/{{ task_id_resolved }}
            payload: "{{ {'homeassistant_area': _tt_area} | tojson }}"
        - variables:
            final_response:
              status: ok
              mode: tasks_tag
              task_id: "{{ task_id_resolved }}"
              homeassistant_area: "{{ _tt_area }}"
              tool: "{{ tool_name }}"
              version: "{{ tool_version }}"
        - stop: Task Tagged
          response_variable: final_response
    - alias: 'chores_delete — delete a Grocy chore by name or ID'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'chores_delete' }}"
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ chore_id_resolved is none }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: chores_delete
                  message: Chore not found — pass item=<name> or chore_id=<id>
            - stop: Chore Not Found
              response_variable: final_response
        - action: script.zen_dojotools_grocy_advanced
          response_variable: _cdl_raw
          data:
            action_type: read
            endpoint: /objects/chores/{{ chore_id_resolved }}
        - variables:
            _cdl_chore: >-
              {{ _cdl_raw['result']['content']
                 if (_cdl_raw is mapping and 'result' in _cdl_raw)
                 else {} }}
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ not _cdl_chore }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: chores_delete
                  message: Chore not found
                  chore_id: "{{ chore_id_resolved }}"
            - stop: Chore Not Found
              response_variable: final_response
        - action: script.zen_dojotools_grocy_advanced
          data:
            action_type: delete
            endpoint: /objects/chores/{{ chore_id_resolved }}
            payload: "{}"
        - variables:
            final_response:
              status: success
              mode: chores_delete
              chore_id: "{{ chore_id_resolved }}"
              name: "{{ _cdl_chore.get('name', item_norm) }}"
              tool: "{{ tool_name }}"
              version: "{{ tool_version }}"
        - stop: Chore Deleted
          response_variable: final_response
    - alias: 'chores_edit — edit fields of an existing Grocy chore'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'chores_edit' }}"
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ chore_id_resolved is none }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: chores_edit
                  message: Chore not found — pass item=<name> or chore_id=<id>
            - stop: Chore Not Found
              response_variable: final_response
        - action: script.zen_dojotools_grocy_advanced
          response_variable: _ced_raw
          data:
            action_type: read
            endpoint: /objects/chores/{{ chore_id_resolved }}
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ not (_ced_raw is mapping and _ced_raw.get('status') == 'success' and _ced_raw.get('result', {}).get('content') is mapping) }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: chores_edit
                  message: Chore not found
                  chore_id: "{{ chore_id_resolved }}"
            - stop: Chore Not Found
              response_variable: final_response
        - variables:
            _ced_period_days_in: "{{ period_days | default(none, true) }}"
            _ced_product_id_in: "{{ product_id | default(none, true) }}"
            _ced_product_amount_in: "{{ product_amount | default(amount, true) | default(none, true) }}"
            _ced_active_in: "{{ active | default(none, true) }}"
        - action: script.zen_dojotools_grocy_advanced
          response_variable: _ced_put_raw
          data:
            action_type: update
            endpoint: /objects/chores/{{ chore_id_resolved }}
            payload: >-
              {%- set _c = _ced_raw.get('result', {}).get('content', {}) -%}
              {%- set _c = _c if _c is mapping else {} -%}
              {%- if new_name_norm != '' -%}
                {%- set _c = _c | combine({'name': new_name_norm}) -%}
              {%- endif -%}
              {%- if period_type is defined and period_type is not none and period_type | string | trim != '' -%}
                {%- set _c = _c | combine({'period_type': period_type | string | trim}) -%}
              {%- endif -%}
              {%- if _ced_period_days_in is not none -%}
                {%- set _c = _c | combine({'period_days': _ced_period_days_in | int}) -%}
              {%- endif -%}
              {%- if _ced_product_id_in is not none -%}
                {%- set _c = _c | combine({'product_id': _ced_product_id_in | int, 'consume_product_on_execution': 1}) -%}
              {%- endif -%}
              {%- if _ced_product_amount_in is not none -%}
                {%- set _c = _c | combine({'product_amount': _ced_product_amount_in | float}) -%}
              {%- endif -%}
              {%- if note_in != '' -%}
                {%- set _c = _c | combine({'description': note_in}) -%}
              {%- endif -%}
              {%- if _ced_active_in is not none -%}
                {%- set _c = _c | combine({'active': 1 if _ced_active_in | string in ['true', '1', 'True'] else 0}) -%}
              {%- endif -%}
              {%- set _ns = namespace(c={}) -%}
              {%- for k, v in _c.items() -%}
                {%- if k != 'userfields' and k != 'row_created_timestamp' -%}
                  {%- set _ns.c = _ns.c | combine({k: v}) -%}
                {%- endif -%}
              {%- endfor -%}
              {{ _ns.c | tojson }}
        - variables:
            final_response:
              status: success
              mode: chores_edit
              chore_id: "{{ chore_id_resolved }}"
              name: "{{ new_name_norm if new_name_norm != '' else (_ced_raw.get('result', {}).get('content', {}).get('name', item_norm) if _ced_raw is mapping else item_norm) }}"
              updated_fields: >-
                {%- set out = [] -%}
                {%- if new_name_norm != '' -%}{%- set out = out + ['name'] -%}{%- endif -%}
                {%- if period_type is defined and period_type is not none and period_type | string | trim != '' -%}{%- set out = out + ['period_type'] -%}{%- endif -%}
                {%- if _ced_period_days_in is not none -%}{%- set out = out + ['period_days'] -%}{%- endif -%}
                {%- if _ced_product_id_in is not none -%}{%- set out = out + ['product_id'] -%}{%- endif -%}
                {%- if _ced_product_amount_in is not none -%}{%- set out = out + ['product_amount'] -%}{%- endif -%}
                {%- if note_in != '' -%}{%- set out = out + ['description'] -%}{%- endif -%}
                {%- if _ced_active_in is not none -%}{%- set out = out + ['active'] -%}{%- endif -%}
                {{ out }}
              tool: "{{ tool_name }}"
              version: "{{ tool_version }}"
        - stop: Chore Edited
          response_variable: final_response
    - alias: 'update_product_meta — read-modify-write full product PUT'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'update_product_meta' }}"
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ product_id_resolved is none }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: update_product_meta
                  message: Product not found — pass item=<name> or product_id=<id>
            - stop: Product Not Found
              response_variable: final_response
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ unit_id_resolved is not none }}"
            sequence:
            - action: script.zen_dojotools_grocy_advanced
              response_variable: _upm_qu_raw
              data:
                action_type: read
                endpoint: /objects/quantity_units/{{ unit_id_resolved }}
            - choose:
              - conditions:
                - condition: template
                  value_template: >-
                    {{ not (
                      _upm_qu_raw is mapping
                      and _upm_qu_raw.get('status') == 'success'
                      and _upm_qu_raw.get('result', {}).get('content') is mapping
                      and _upm_qu_raw.get('result', {}).get('content', {}).get('active') | int == 1
                      and _upm_qu_raw.get('result', {}).get('content', {}).get('name') not in [none, '', 'None']
                    ) }}
                sequence:
                - variables:
                    final_response:
                      status: error
                      mode: update_product_meta
                      message: >-
                        Target unit {{ unit_id_resolved }} is invalid (not found, inactive, or
                        has null name). Use mode=units_list to find valid units.
                      unit_id: "{{ unit_id_resolved }}"
                - stop: Invalid Target Unit
                  response_variable: final_response
        - action: script.zen_dojotools_grocy_advanced
          response_variable: _upm_raw
          data:
            action_type: read
            endpoint: /objects/products/{{ product_id_resolved }}
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ not (_upm_raw is mapping and _upm_raw.get('status') == 'success' and _upm_raw.get('result', {}).get('content') is mapping) }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: update_product_meta
                  message: Product fetch failed
                  product_id: "{{ product_id_resolved }}"
            - stop: Product Fetch Failed
              response_variable: final_response
        - choose:
          - conditions:
            - condition: template
              value_template: >-
                {{ unit_id_resolved is not none
                   and _upm_raw.get('result', {}).get('content', {}).get('qu_id_stock') is none }}
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: update_product_meta
                  message: >-
                    Product has a null stock unit — Grocy cannot update units on this product.
                    The only fix is to delete the product and recreate it with the correct unit_id from the start.
                  product_id: "{{ product_id_resolved }}"
                  current_qu_id_stock: null
                  target_qu_id: "{{ unit_id_resolved }}"
                  fix: >-
                    1. Note current stock amount and location.
                    2. mode=catalog_delete_product product_id={{ product_id_resolved }} confirm_action=true
                    3. mode=catalog_add_product item=<name> location_id=<id> unit_id={{ unit_id_resolved }}
                    4. mode=update_product_meta product_id=<new_id> purchase_unit_id=<id> amount=<min_stock>
                    5. mode=stock_add_purchase product_id=<new_id> amount=<stock> location_id=<id>
                  tool: "{{ tool_name }}"
                  version: "{{ tool_version }}"
            - stop: Null Stock Unit — Delete and Recreate
              response_variable: final_response
        - action: script.zen_dojotools_grocy_advanced
          response_variable: _upm_put_raw
          data:
            action_type: update
            endpoint: /objects/products/{{ product_id_resolved }}
            payload: >-
              {%- set _p = _upm_raw.get('result', {}).get('content', {}) -%}
              {%- set _p = _p if _p is mapping else {} -%}
              {%- set _ns = namespace(p={}) -%}
              {%- for k, v in _p.items() -%}
                {%- if k != 'userfields' and k != 'row_created_timestamp' -%}
                  {%- if not (k in ['qu_id_purchase', 'qu_id_price'] and v is none) -%}
                    {%- set _ns.p = _ns.p | combine({k: v}) -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
              {%- if unit_id_resolved is not none -%}
                {%- set _ns.p = _ns.p | combine({'qu_id_stock': unit_id_resolved | int, 'qu_id_consume': unit_id_resolved | int}) -%}
                {%- if purchase_unit_id_resolved is not none -%}
                  {%- set _ns.p = _ns.p | combine({'qu_id_purchase': purchase_unit_id_resolved | int}) -%}
                {%- endif -%}
              {%- endif -%}
              {%- if has_explicit_amount -%}
                {%- set _ns.p = _ns.p | combine({'min_stock_amount': amt_in | float}) -%}
              {%- endif -%}
              {%- if shopping_location_id_resolved is not none -%}
                {%- set _ns.p = _ns.p | combine({'shopping_location_id': shopping_location_id_resolved | int}) -%}
              {%- endif -%}
              {%- if to_location_id_resolved is not none -%}
                {%- set _ns.p = _ns.p | combine({'default_consume_location_id': to_location_id_resolved | int}) -%}
              {%- endif -%}
              {%- if product_group_id_in is not none -%}
                {%- set _ns.p = _ns.p | combine({'product_group_id': product_group_id_in | int}) -%}
              {%- endif -%}
              {%- set _desc_parts = [] -%}
              {%- if has_note -%}{%- set _desc_parts = _desc_parts + [note_in] -%}{%- endif -%}
              {%- if has_brand -%}{%- set _desc_parts = _desc_parts + ['Brand: ' ~ brand] -%}{%- endif -%}
              {%- if has_sku -%}{%- set _desc_parts = _desc_parts + ['SKU: ' ~ sku] -%}{%- endif -%}
              {%- if _desc_parts | length > 0 -%}
                {%- set _ns.p = _ns.p | combine({'description': _desc_parts | join(' | ')}) -%}
              {%- endif -%}
              {{ _ns.p | tojson }}
        - variables:
            _upm_err: >-
              {{ _upm_put_raw.get('result', {}).get('content', {}).get('error_message', '')
                 if (_upm_put_raw is mapping
                     and _upm_put_raw.get('result', {}).get('content') is mapping)
                 else '' }}
            _upm_pre_qu: >-
              {{ _upm_raw.get('result', {}).get('content', {}).get('qu_id_stock')
                 if _upm_raw is mapping else none }}
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ 'QU conversion' in _upm_err and _upm_pre_qu is none }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: update_product_meta
                  message: >-
                    Unit change blocked — product has a null stock unit. Grocy resolves
                    null to system default and conflicts with existing global aliases.
                    Delete and recreate the product with the correct unit from the start.
                  product_id: "{{ product_id_resolved }}"
                  current_qu_id_stock: null
                  target_qu_id: "{{ unit_id_resolved }}"
                  grocy_error: "{{ _upm_err }}"
                  fix: >-
                    1. Note current stock amount and location.
                    2. mode=catalog_delete_product product_id={{ product_id_resolved }} confirm_action=true
                    3. mode=catalog_add_product item=<name> location_id=<id> unit_id={{ unit_id_resolved }}
                    4. mode=update_product_meta product_id=<new_id> purchase_unit_id=<id> amount=<min_stock>
                    5. mode=stock_add_purchase product_id=<new_id> amount=<stock> location_id=<id>
                  tool: "{{ tool_name }}"
                  version: "{{ tool_version }}"
            - stop: Null Stock Unit — Delete and Recreate
              response_variable: final_response
          - conditions:
            - condition: template
              value_template: "{{ 'QU conversion' in _upm_err and _upm_pre_qu is not none }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: update_product_meta
                  message: Unit change blocked by Grocy - QU conversion required between current and target units.
                  product_id: "{{ product_id_resolved }}"
                  current_qu_id_stock: "{{ _upm_pre_qu }}"
                  target_qu_id: "{{ unit_id_resolved }}"
                  grocy_error: "{{ _upm_err }}"
                  fix: >-
                    Create a QU conversion first:
                    mode=unit_conversions_add unit_id={{ _upm_pre_qu }} to_unit_id={{ unit_id_resolved }} amount=<factor>
                    Then retry update_product_meta.
                  tool: "{{ tool_name }}"
                  version: "{{ tool_version }}"
            - stop: QU Conversion Required
              response_variable: final_response
        - variables:
            final_response:
              status: success
              mode: update_product_meta
              product_id: "{{ product_id_resolved }}"
              updated_fields: >-
                {%- set out = [] -%}
                {%- if unit_id_resolved is not none -%}{%- set out = out + ['qu_id_purchase', 'qu_id_stock', 'qu_id_consume'] -%}{%- endif -%}
                {%- if has_explicit_amount -%}{%- set out = out + ['min_stock_amount'] -%}{%- endif -%}
                {%- if has_note or has_brand or has_sku -%}{%- set out = out + ['description'] -%}{%- endif -%}
                {%- if shopping_location_id_resolved is not none -%}{%- set out = out + ['shopping_location_id'] -%}{%- endif -%}
                {%- if to_location_id_resolved is not none -%}{%- set out = out + ['default_consume_location_id'] -%}{%- endif -%}
                {%- if product_group_id_in is not none -%}{%- set out = out + ['product_group_id'] -%}{%- endif -%}
                {{ out }}
              tool: "{{ tool_name }}"
              version: "{{ tool_version }}"
        - stop: Product Meta Updated
          response_variable: final_response
    - alias: 'stock_area_inventory — full denormalized room view (locations + product names + amounts)'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'stock_area_inventory' }}"
        sequence:
        - variables:
            _sai_area_id: "{{ homeassistant_area_id | default('') | string | trim }}"
        - action: script.zen_dojotools_grocy_advanced
          response_variable: _sai_locs_raw
          data:
            action_type: read
            endpoint: /objects/locations?limit=500&offset=0
        - variables:
            _sai_area_locs: >-
              {%- set ns = namespace(locs=[]) -%}
              {%- for loc in _sai_locs_raw['result']['content'] | default([], true)
                   | selectattr('userfields.homeassistant_area', 'defined')
                   | selectattr('userfields.homeassistant_area', 'equalto', _sai_area_id) -%}
                {%- set ns.locs = ns.locs + [{'id': loc.id, 'name': loc.name,
                    'subclass': loc.userfields.grocy_location_subclass | default('', true)}] -%}
              {%- endfor -%}
              {{ ns.locs }}
        - action: script.zen_dojotools_grocy_advanced
          response_variable: _sai_prods_raw
          data:
            action_type: read
            endpoint: /objects/products?limit=500&offset=0
            slim_objects: true
        - variables:
            _sai_prod_map: >-
              {%- set ns = namespace(m={}) -%}
              {%- for p in _sai_prods_raw['result']['content'] | default([], true) -%}
                {%- set ns.m = ns.m | combine({p.id | string: p.name}) -%}
              {%- endfor -%}
              {{ ns.m }}
        - variables:
            _sai_locations: "{{ [] }}"
        - repeat:
            for_each: "{{ _sai_area_locs }}"
            sequence:
            - action: script.zen_dojotools_grocy_advanced
              response_variable: _sai_entries_raw
              continue_on_error: true
              data:
                action_type: read
                endpoint: /stock/locations/{{ repeat.item.id }}/entries
            - variables:
                _sai_products: >-
                  {%- set ns = namespace(seen={}) -%}
                  {%- for e in _sai_entries_raw['result']['content'] | default([], true) -%}
                    {%- set pid = e.product_id | string -%}
                    {%- if pid in ns.seen -%}
                      {%- set ns.seen = ns.seen | combine({pid: ns.seen[pid] + e.amount}) -%}
                    {%- else -%}
                      {%- set ns.seen = ns.seen | combine({pid: e.amount}) -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {%- set ns2 = namespace(out=[]) -%}
                  {%- for pid, amt in ns.seen.items() -%}
                    {%- set ns2.out = ns2.out + [{'product_id': pid | int, 'name': _sai_prod_map.get(pid, pid), 'amount': amt}] -%}
                  {%- endfor -%}
                  {{ ns2.out | sort(attribute='name') }}
            - variables:
                _sai_locations: >-
                  {%- if _sai_products | length > 0 -%}
                  {{ _sai_locations + [{
                    'id': repeat.item.id | int,
                    'name': repeat.item.name,
                    'subclass': repeat.item.subclass | default('', true),
                    'products': _sai_products
                  }] }}
                  {%- else -%}{{ _sai_locations }}{%- endif -%}
        - variables:
            final_response:
              status: success
              mode: stock_area_inventory
              area_id: "{{ _sai_area_id }}"
              locations: "{{ _sai_locations | sort(attribute='name') }}"
              total_locations: "{{ _sai_locations | length }}"
              total_locations_scanned: "{{ _sai_area_locs | length }}"
              total_products: "{{ _sai_locations | map(attribute='products') | sum(start=[]) | map(attribute='product_id') | list | count }}"
              tool: "{{ tool_name }}"
              version: "{{ tool_version }}"
        - stop: Area Inventory
          response_variable: final_response
    - alias: Post Purchase inventory on 'Buy'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'stock_buy_product'\n   and (report_inventory_norm
            | default(true))\n   and (product_id_resolved is not none) }}"
          alias: 'Buy: Post-purchase inventory report'
        sequence:
        - action: script.zen_dojotools_grocy_advanced
          response_variable: post_entries
          data:
            action_type: read
            endpoint: /stock/products/{{ product_id_resolved }}/entries
        - variables:
            post_entries_list: "{{ post_entries['result']['content']\n   if post_entries is
              mapping and 'result' in post_entries\n   else [] }}"
            post_total_amount: "{{\n  (post_entries_list\n    | map(attribute='amount')\n
              \   | map('float')\n    | sum)\n  | default(0)\n}}"
            post_locations: "{{ post_entries_list | map(attribute='location_name') | unique | list }}"
            inventory_report: "{{\n  {\n    \"purchase\": {\n      \"item\": (item_norm if item_norm else (grocy_product.name if grocy_product is defined and grocy_product is mapping else none)),\n
              \     \"product_id\": product_id_resolved,\n      \"unit\": unit_norm,\n
              \     \"amount_added\": amt_in,\n      \"location\": (loc_norm if has_loc_name
              else none),\n      \"store\": (store_norm if has_store_name else none)\n
              \   },\n    \"result\": {\n      \"total_amount_now\": post_total_amount,\n
              \     \"locations_now\": post_locations,\n      \"humor\": (\n        \"There
              are now \" ~ (post_total_amount | string)\n        ~ \" \" ~ (item_norm if item_norm else (grocy_product.name if grocy_product is defined and grocy_product is mapping else 'item'))
              ~ \" in inventory, boss.\"\n      )\n    }\n  }\n}}"
    - variables:
        grocy_result: "{% if grocy_response is mapping and 'result' in grocy_response
          %}\n  {{ grocy_response['result'] }}\n{% else %}\n  {{ none }}\n{% endif %}"
        content: >-
          {{ grocy_result["content"] if grocy_result is not none else [] }}
        filtered_result: "{% if mode_norm == 'catalog_find_product' %}\n  {% if product_matches
          is defined and product_matches | length > 0 %}\n    {{ product_matches }}\n
          \ {% elif grocy_product is not none %}\n    {{ [ grocy_product ] }}\n  {%
          else %}\n    []\n  {% endif %}\n{% elif mode_norm == 'chores_find' and has_item_name
          %}\n  {{ content | selectattr('name','search','(?i)' ~ item_norm) | list }}\n{%
          elif mode_norm == 'tasks_find' and has_item_name %}\n  {{ content | selectattr('name','search','(?i)'
          ~ item_norm) | list }}\n{% elif mode_norm == 'locations_find' %}\n  {% if location_id_resolved is not none %}\n    {{ content | selectattr('id','equalto', location_id_resolved | int) | list }}\n  {% elif has_loc_name and parent_lid_resolved is not none %}\n    {{ content | selectattr('name','search','(?i)' ~ loc_norm) | list | selectattr('userfields.grocy_parent_location_id','equalto', parent_lid_resolved | string) | list }}\n  {% elif has_loc_name %}\n    {{ content | selectattr('name','search','(?i)' ~ loc_norm) | list }}\n  {% elif has_item_name and parent_lid_resolved is not none %}\n    {{ content | selectattr('name','search','(?i)' ~ item_norm) | list | selectattr('userfields.grocy_parent_location_id','equalto', parent_lid_resolved | string) | list }}\n  {% elif has_item_name %}\n    {{ content | selectattr('name','search','(?i)' ~ item_norm) | list }}\n  {% elif parent_lid_resolved is not none %}\n    {{ content | selectattr('userfields.grocy_parent_location_id','equalto', parent_lid_resolved | string) | list }}\n  {% else %}\n    {{ [] }}\n  {% endif %}\n{% elif mode_norm == 'locations_get_by_area' %}\n  {{ content | selectattr('userfields.homeassistant_area','search','(?i)^' ~ area_id_norm ~ '$') | list }}\n{% elif mode_norm == 'units_find' and
          has_unit_name %}\n  {{ content | selectattr('name','equalto', unit_norm) |
          list }}
{% elif mode_norm == 'product_groups_find' and has_item_name %}\n  {{ content | selectattr('name','search','(?i)' ~ item_norm) | list }}
{% elif mode_norm == 'stock_list_volatile' %}
  {%- set _ov_raw = (content.overdue_products  | default([]))[:limit | int(25)] -%}
  {%- set _ds_raw = (content.due_dates          | default([]))[:limit | int(25)] -%}
  {%- set _ex_raw = (content.expiring_products  | default([]))[:limit | int(25)] -%}
  {%- set ns = namespace(ov=[], ds=[], ex=[]) -%}
  {%- for i in _ov_raw -%}
    {%- set ns.ov = ns.ov + [{'name': i.product.name | default('', true) if i.product is defined else i.name | default(''), 'product_id': i.product_id | default(''), 'amount': i.amount | default(''), 'best_before_date': i.best_before_date | default(''), 'location_id': i.product.location_id | default(none, true) if i.product is defined else none}] -%}
  {%- endfor -%}
  {%- for i in _ds_raw -%}
    {%- set ns.ds = ns.ds + [{'name': i.product.name | default('', true) if i.product is defined else i.name | default(''), 'product_id': i.product_id | default(''), 'amount': i.amount | default(''), 'best_before_date': i.best_before_date | default(''), 'location_id': i.product.location_id | default(none, true) if i.product is defined else none}] -%}
  {%- endfor -%}
  {%- for i in _ex_raw -%}
    {%- set ns.ex = ns.ex + [{'name': i.product.name | default('', true) if i.product is defined else i.name | default(''), 'product_id': i.product_id | default(''), 'amount': i.amount | default(''), 'best_before_date': i.best_before_date | default(''), 'location_id': i.product.location_id | default(none, true) if i.product is defined else none}] -%}
  {%- endfor -%}
  {{ {
    'overdue_count':  content.overdue_products  | default([]) | length,
    'due_soon_count': content.due_dates          | default([]) | length,
    'expiring_count': content.expiring_products  | default([]) | length,
    'overdue':  ns.ov,
    'due_soon': ns.ds,
    'expiring': ns.ex
  } }}
{% elif mode_norm == 'stock_overview' %}
  {{ content[:limit | int(25)] }}
{% elif mode_norm == 'locations_audit' %}
  {%- set ns = namespace(area_mismatches=[], orphan_parents=[], stale_lists=[]) %}
  {%- set valid_areas = areas() %}
  {%- for loc in content %}
    {%- set ha_area = loc.userfields.homeassistant_area | default('', true) %}
    {%- if ha_area != '' and ha_area not in valid_areas %}
      {%- set ns.area_mismatches = ns.area_mismatches + [{'id': loc.id, 'name': loc.name, 'area': ha_area}] %}
    {%- endif %}
    {%- set declared_parent = loc.userfields.grocy_parent_location_id | default(none, true) | int(none) %}
    {%- if declared_parent is not none %}
      {%- set parent = content | selectattr('id', 'equalto', declared_parent) | list | first | default(none) %}
      {%- if parent is none %}
        {%- set ns.orphan_parents = ns.orphan_parents + [{'id': loc.id, 'name': loc.name, 'declared_parent_id': declared_parent}] %}
      {%- else %}
        {%- set child_list = parent.userfields.grocy_child_location_ids | default('[]', true) | from_json | list %}
        {%- if loc.id not in child_list %}
          {%- set ns.stale_lists = ns.stale_lists + [{'child_id': loc.id, 'child_name': loc.name, 'parent_id': declared_parent, 'parent_name': parent.name}] %}
        {%- endif %}
      {%- endif %}
    {%- endif %}
  {%- endfor %}
  {{ {'total': content | length, 'area_mismatches': ns.area_mismatches, 'orphan_parents': ns.orphan_parents, 'stale_lists': ns.stale_lists} }}
{% elif mode_norm == 'unit_conversions_list' %}\n  {%- set _ucs = content if content is sequence else [] -%}\n  {%- if unit_id_resolved is not none -%}\n    {%- set _uid = unit_id_resolved | int -%}\n    {%- set _from = _ucs | selectattr('from_qu_id', 'equalto', _uid) | list -%}\n    {%- set _to   = _ucs | selectattr('to_qu_id',   'equalto', _uid) | list -%}\n    {%- set _ucs  = _from + _to -%}\n  {%- endif -%}\n  {%- if product_id_resolved is not none -%}\n    {%- set _ucs = _ucs | selectattr('product_id', 'equalto', product_id_resolved | int) | list -%}\n  {%- endif -%}\n  {{ _ucs }}\n{% else %}\n  {{ content }}\n{% endif %}"
        error_result: "{% if\n  mode_norm == 'stock_consume'\n  and product_id_resolved
          is not none\n  and location_id_resolved is not none\n  and stock_entries_for_product
          is defined\n  and (\n    stock_entries_for_product\n    | selectattr('location_id','equalto',
          location_id_resolved | int)\n    | list\n    | length == 0\n  )\n%}\n  {{\n
          \   {\n      \"code\": \"INVALID_CONSUME_LOCATION\",\n      \"message\": \"Cannot
          consume item from specified location\",\n      \"explanation\": (\n        \"The
          product exists, but no stock entry was found at the requested location. \"\n
          \       ~ \"Grocy requires the consume location to match an actual stock entry.\"\n
          \     ),\n      \"details\": {\n        \"product_id\": product_id_resolved,\n
          \       \"requested_location_id\": location_id_resolved,\n        \"available_location_ids\":\n
          \         stock_entries_for_product\n          | map(attribute='location_id')\n
          \         | list\n          | sort\n      },\n      \"suggested_fixes\": [\n
          \       \"consume_from_actual_location\",\n        \"transfer_then_consume\",\n
          \       \"omit_location_use_default\"\n      ],\n      \"confidence\": \"high\",\n
          \     \"blame\": \"none\"\n    }\n  }}\n{% else %}\n  {{ none }}\n{% endif
          %}"
        is_error: '{{ error_result is not none }}'
        result_payload: "{% if mode_norm == 'products_merge' %}\n  {{\n    {\n      \"merged_into\":
          product_id_keep_resolved,\n      \"removed_product\": product_id_remove_resolved\n
          \   }\n  }}\n{% elif mode_norm in ['rename_product','update_product_meta','set_default_location_for_product']
          %}\n  {{\n    {\n      \"product_id\": product_id_resolved,\n      \"product\":
          grocy_product.name if grocy_product is defined else none\n    }\n  }}\n{% elif mode_norm in ['shopping_add_product', 'shopping_remove_product'] %}\n  {{\n    {\n      'product_id': product_id_resolved,\n      'product_name': grocy_product.name if grocy_product is mapping else none,\n      'amount': amt_in,\n      'list_id': (list_in | int if list_in is not none else none),\n      'action': 'added' if mode_norm == 'shopping_add_product' else 'removed'\n    }\n  }}\n{% elif mode_norm in ['stock_check_item', 'stock_where_is_item'] %}\n  {{\n    {\n      'product_id': product_id_resolved,\n      'product_name': grocy_product.name if grocy_product is mapping else none,\n      'entries': filtered_result\n    }\n  }}\n{% elif mode_norm == 'stock_entry_update' %}\n  {{\n    {\n      'product_id': product_id_resolved,\n      'product_name': grocy_product.name if grocy_product is mapping else none,\n      'entry_id': entry_id_in,\n      'location_id': location_id_resolved,\n      'amount': amt_in,\n      'best_before_date': bbd_in | default(none)\n    }\n  }}\n{%
          else %}\n  {{ filtered_result }}\n{% endif %}"
        trace: "{% if show_trace or is_error %}\n  {{\n    {\n      \"endpoint\": endpoint
          | default(''),\n      \"action_type\": action_type | default(''),\n      \"resolved\":
          {\n        \"product_id\": product_id_resolved | default(none),\n        \"location_id\":
          location_id_resolved | default(none),\n        \"unit_resolution\": {\n          \"requested\":
          unit_norm,\n          \"resolved_unit_id\": unit_id_resolved,\n          \"created\":
          (\n            unit_norm == 'each'\n            and unit_created is defined\n
          \         )\n        },\n        \"shopping_location_id\": shopping_location_id_resolved
          | default(none),\n        \"chore_id\": chore_id_resolved | default(none),\n
          \       \"task_id\": task_id_resolved | default(none),\n        \"recipe_id\": recipe_id_resolved | default(none),\n        \"entry_id\": entry_id_in | default(none),\n        \"battery_id\": battery_id_in | default(none)\n      },\n      \"buy_flow\":
          (\n        inventory_report\n        if mode_norm == 'stock_buy_product' and
          inventory_report is defined\n        else none\n      )\n    }\n  }}\n{% else\n          %}\n  {{ none }}\n{% endif %}"
        final_response: "{{\n  {\n    \"status\": (\"error\" if is_error else \"success\"),\n
          \   \"tool\": tool_name,\n    \"version\": tool_version,\n    \"case\": mode_norm,\n\n
          \   \"result\": (none if is_error else result_payload),\n    \"error\": (error_result
          if is_error else none),\n\n    \"report\": (\n      inventory_report\n      if
          (not is_error)\n      and mode_norm == 'stock_buy_product'\n      and inventory_report
          is defined\n      else none\n    ),\n\n    \"pagination\": (\n      {\n        \"supported\": true,\n        \"applied\": true,\n        \"page\": page_effective | default(none),\n        \"per_page\": limit | default(none),\n        \"offset\": offset | default(none),\n        \"source\": (\"user\" if (page_in is number or per_page_in is number) else \"default\"),\n        \"has_more\": (result_payload | length == limit) if (limit is not none and result_payload is not none and result_payload is sequence and result_payload is not string) else none\n      }\n      if (supports_pagination | default(false)) and limit is not none and offset is not none\n      else {\"supported\": supports_pagination | default(false), \"applied\": false}\n    ),\n\n    \"endpoint\": final_endpoint
          | default(endpoint),\n\n    \"trace\": trace\n  }\n}}"
    - stop: Return Response
      response_variable: final_response

###############################################################################
# REST Sensors
###############################################################################

rest:
  # REST sensor for caching just the Grocy OpenAPI once per hr
  - resource_template: "{{ states('input_text.grocy_url') | trim('/') }}/openapi.json"
    method: GET
    headers:
      GROCY-API-KEY: !secret grocy_api_key
      accept: "application/json"
    scan_interval: 3600 # seconds (once/hr)
    sensor:
      - name:  Grocy_RESTful_OpenAPI_docs
        value_template: "{{ now() | as_local() }}" # last refresh time
        json_attributes: ['openapi', 'info', 'paths', 'components']
        force_update: true
        unique_id: 8cce6ae0-c940-4225-95fe-5e6b30f592cf
