              {%- endif -%}
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _blm_items | length == 0 }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: bulk_location_move
                  message: "bom required — JSON array of {name: X} or {product_id: N} objects."
            - stop: No Items
              response_variable: final_response
        - variables:
            _blm_lid: "{{ location_id_resolved | int }}"
            _blm_results: []
            _blm_moved: 0
            _blm_failed: 0
        - repeat:
            for_each: "{{ _blm_items }}"
            sequence:
              - variables:
                  _blmi_name: "{{ repeat.item.get('name', '') | string | trim }}"
                  _blmi_pid: "{{ repeat.item.get('product_id', repeat.item.get('id', 0)) | int(0) }}"
              - if: "{{ _blmi_pid | int(0) == 0 and _blmi_name != '' }}"
                then:
                  - action: script.zen_sutra_grocy
                    response_variable: _blmi_exact_raw
                    data:
                      action_type: read
                      endpoint: "objects/products?query%5B%5D=name={{ _blmi_name }}"
                  - variables:
                      _blmi_pid: >-
                        {%- set _raw = _blmi_exact_raw['result']['content'] | default(none, true) -%}
                        {%- set _dl = _raw if _raw is sequence and _raw is not string else [] -%}
                        {%- set _norm = _blmi_name | lower -%}
                        {%- set ns = namespace(found=0) -%}
                        {%- for p in _dl if p is mapping -%}
                          {%- if p['name'] | default('', true) | lower == _norm -%}
                            {%- set ns.found = p['id'] | default(0) | int(0) -%}
                          {%- endif -%}
                        {%- endfor -%}
                        {{ ns.found }}
              - if: "{{ _blmi_pid | int(0) == 0 and _blmi_name != '' }}"
                then:
                  - action: script.zen_sutra_grocy
                    response_variable: _blmi_fuzzy_raw
                    data:
                      action_type: read
                      endpoint: "objects/products?query%5B%5D=name~{{ _blmi_name }}"
                  - variables:
                      _blmi_pid: >-
                        {%- set _raw = _blmi_fuzzy_raw['result']['content'] | default(none, true) -%}
                        {%- set _dl = _raw if _raw is sequence and _raw is not string else [] -%}
                        {%- set _norm = _blmi_name | lower -%}
                        {%- set ns = namespace(found=0) -%}
                        {%- for p in _dl if p is mapping -%}
                          {%- if p['name'] | default('', true) | lower == _norm -%}
                            {%- set ns.found = p['id'] | default(0) | int(0) -%}
                          {%- endif -%}
                        {%- endfor -%}
                        {{ ns.found }}
              - if: "{{ _blmi_pid | int(0) > 0 }}"
                then:
                  - action: script.zen_sutra_grocy
                    response_variable: _blmi_prod_raw
                    continue_on_error: true
                    data:
                      action_type: read
                      endpoint: "/objects/products/{{ _blmi_pid | int }}"
                  - variables:
                      _blmi_prod: >-
                        {%- set _c = _blmi_prod_raw['result']['content'] | default({}, true) -%}
                        {{ _c if _c is mapping else {} }}
                  - action: script.zen_sutra_grocy
                    response_variable: _blmi_move_raw
                    continue_on_error: true
                    data:
                      action_type: update
                      endpoint: "/objects/products/{{ _blmi_pid | int }}"
                      payload: "{{ _blmi_prod | combine({'location_id': _blm_lid}) | tojson }}"
                  - variables:
                      _blmi_ok: >-
                        {%- set _r = _blmi_move_raw['result'] | default({}, true) -%}
                        {{ _r['status_code'] | default(200) | int < 300 }}
                  - variables:
                      _blm_results: >-
                        {{ (_blm_results if _blm_results is sequence else [])
                           + [{'name': _blmi_name, 'product_id': _blmi_pid | int,
                               'location_id': _blm_lid,
                               'status': 'moved' if _blmi_ok else 'failed',
                               'reason': '' if _blmi_ok else 'grocy api error'}] }}
                      _blm_moved: "{{ _blm_moved | int + 1 if _blmi_ok else _blm_moved | int }}"
              - if: "{{ _blmi_pid | int(0) == 0 }}"
                then:
                  - variables:
                      _blm_results: >-
                        {{ (_blm_results if _blm_results is sequence else [])
                           + [{'name': _blmi_name, 'status': 'failed', 'reason': 'product not found'}] }}
                      _blm_failed: "{{ _blm_failed | int + 1 }}"
        - variables:
            final_response:
              status: success
              mode: bulk_location_move
              summary:
                total: "{{ _blm_items | length }}"
                moved: "{{ _blm_moved | int }}"
                failed: "{{ _blm_failed | int }}"
              destination_location_id: "{{ _blm_lid }}"
              items: "{{ _blm_results }}"
        - stop: Bulk Location Move Complete
          response_variable: final_response

    - alias: 'object_lens — assemble complete operational object for a product or place'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'object_lens' }}"
        sequence:
        # ── place lens: triggered when area given without a product ───────────────
        - if: "{{ area_id_norm != '' and product_id_resolved is none }}"
          then:
            - action: script.zen_sutra_grocy
              response_variable: _pl_locs_raw
              continue_on_error: true
              data:
                action_type: read
                endpoint: /objects/locations?limit=500&offset=0
            - variables:
                _pl_area_loc_ids: >-
                  {%- set ns = namespace(ids=[]) -%}
                  {%- for loc in _pl_locs_raw['result']['content'] | default([], true) -%}
                    {%- if loc is mapping -%}
                      {%- set luf = loc.get('userfields', {}) if loc.get('userfields') is mapping else {} -%}
                      {%- if (luf.get('homeassistant_area', '') | default('', true)) | string | trim == area_id_norm -%}
                        {%- set ns.ids = ns.ids + [loc.id | string] -%}
                      {%- endif -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ ns.ids }}
            - action: script.zen_dojotools_inventory
              response_variable: _pl_prods_raw
              continue_on_error: true
              data:
                mode: catalog_find_by_tag
                area_id: "{{ area_id_norm }}"
            - action: script.zen_sutra_grocy
              response_variable: _pl_chores_raw
              continue_on_error: true
              data:
                action_type: read
                endpoint: /objects/chores?limit=500&offset=0
            - variables:
                _pl_tagged: >-
                  {%- set _src = (_pl_prods_raw.get('products', [])
                                  if _pl_prods_raw is mapping and _pl_prods_raw.get('status') == 'ok'
                                  else []) -%}
                  {%- set ns = namespace(r=[]) -%}
                  {%- for p in _src -%}
                    {%- set _hl = (p.get('ha_labels', '') | default('', true)) | string | trim -%}
                    {%- set _hl_list = _hl.split(',') | map('trim') | list -%}
                    {%- set _ha = p.get('homeassistant_area', none) -%}
                    {%- set _sloc = p.get('location_id') | string if p.get('location_id') is not none else '' -%}
                    {%- set _loc_match = _sloc != '' and _sloc in _pl_area_loc_ids -%}
                    {%- set _match = 'area' if _ha == area_id_norm else ('label' if area_id_norm in _hl_list else 'location') -%}
                    {%- set ns.r = ns.r + [{'id': p.id, 'name': p.name,
                      'zen_safety_type': p.get('zen_safety_type', none),
                      'zen_asset_type': p.get('zen_asset_type', none),
                      'hazmat_class': p.get('hazmat_class', none),
                      'ha_labels': _hl,
                      'match': _match}] -%}
                  {%- endfor -%}
                  {{ ns.r }}
            # _pl_chores in a separate step so it can read _pl_tagged product IDs directly
            - variables:
                _pl_chores: >-
                  {%- set ns = namespace(r=[]) -%}
                  {%- set _src = _pl_chores_raw['result']['content']
                                 if _pl_chores_raw is mapping and 'result' in _pl_chores_raw
                                    and _pl_chores_raw['result']['content'] is sequence
                                 else [] -%}
                  {%- set _tagged_pids = _pl_tagged | map(attribute='id') | map('string') | list -%}
                  {%- for c in _src -%}
                    {%- set cuf = c.get('userfields', {}) if c.get('userfields') is mapping else {} -%}
                    {%- set _area_match = (cuf.get('homeassistant_area', '') | default('', true)) | string | trim == area_id_norm -%}
                    {%- set _prod_match = c.product_id is not none and c.product_id | string in _tagged_pids -%}
                    {%- if _area_match or _prod_match -%}
                      {%- set ns.r = ns.r + [{'id': c.id, 'name': c.name,
                        'cadence_days': c.period_days | default(0), 'product_id': c.product_id,
                        'match': 'area' if _area_match else 'product'}] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ ns.r }}
            - variables:
                _pl_safety: "{{ _pl_tagged | selectattr('zen_safety_type', 'ne', none) | list }}"
                _pl_hazmat: "{{ _pl_tagged | selectattr('hazmat_class', 'ne', none) | list }}"
            # ── opt-in expansion: object_lens per product (expand=true) ──────────
            - if: "{{ expand | default(false) | bool and _pl_tagged | length > 0 }}"
              then:
                - variables:
                    _pl_exp_limit: "{{ [per_page | default(5) | int(5), _pl_tagged | length] | min }}"
                    _pl_expanded: []
                - repeat:
                    for_each: "{{ _pl_tagged[:_pl_exp_limit] }}"
                    sequence:
                      - action: script.zen_sutra_grocy
                        response_variable: _pl_exp_stock_raw
                        continue_on_error: true
                        data:
                          action_type: read
                          endpoint: "/stock/products/{{ repeat.item.id }}"
                      - action: script.zen_sutra_grocy
                        response_variable: _pl_exp_uf_raw
                        continue_on_error: true
                        data:
                          action_type: read
                          endpoint: "/userfields/products/{{ repeat.item.id }}"
                      - action: script.zen_sutra_grocy
                        response_variable: _pl_exp_entries_raw
                        continue_on_error: true
                        data:
                          action_type: read
                          endpoint: "/stock/products/{{ repeat.item.id }}/entries?limit=500&offset=0"
                      - variables:
                          _pl_exp_stock_obj: >-
                            {{ _pl_exp_stock_raw['result']['content']
                               if _pl_exp_stock_raw is mapping and 'result' in _pl_exp_stock_raw
                                  and _pl_exp_stock_raw['result']['content'] is mapping
                               else {} }}
                      - variables:
                          _pl_exp_prod_obj: "{{ _pl_exp_stock_obj.get('product', {}) if _pl_exp_stock_obj is mapping else {} }}"
                          _pl_exp_amount:   "{{ _pl_exp_stock_obj.get('stock_amount_aggregated', 0) | float(0) }}"
                          _pl_exp_bbd:      "{{ _pl_exp_stock_obj.get('next_due_date', none) }}"
                          _pl_exp_qu_name: >-
                            {%- set _qu = _pl_exp_stock_obj.get('quantity_unit_stock', none) -%}
                            {%- if _qu is mapping -%}{{ _qu.get('name', 'unit') }}{%- else -%}unit{%- endif -%}
                      - variables:
                          _pl_exp_min_stock:   "{{ _pl_exp_prod_obj.get('min_stock_amount', 0) | float(0) }}"
                          _pl_exp_consume_lid: "{{ _pl_exp_prod_obj.get('default_consume_location_id', none) }}"
                          _pl_exp_prod_name:   "{{ _pl_exp_prod_obj.get('name', repeat.item.name) }}"
                      - variables:
                          _pl_exp_uf: >-
                            {{ _pl_exp_uf_raw['result']['content']
                               if _pl_exp_uf_raw is mapping and 'result' in _pl_exp_uf_raw
                                  and _pl_exp_uf_raw['result']['content'] is mapping
                               else {} }}
                      - variables:
                          _pl_exp_safety_type: "{{ _pl_exp_uf.get('zen_safety_type', none) }}"
                          _pl_exp_asset_type:  "{{ _pl_exp_uf.get('zen_asset_type', none) }}"
                          _pl_exp_hazmat_cls:  "{{ _pl_exp_uf.get('hazmat_class', none) }}"
                          _pl_exp_ha_labels:   "{{ (_pl_exp_uf.get('ha_labels', '') | default('', true)) | string | trim }}"
                      - variables:
                          _pl_exp_entries: >-
                            {{ _pl_exp_entries_raw['result']['content']
                               if _pl_exp_entries_raw is mapping and 'result' in _pl_exp_entries_raw
                                  and _pl_exp_entries_raw['result']['content'] is sequence
                               else [] }}
                      - variables:
                          _pl_exp_installed: >-
                            {%- set _clid = _pl_exp_consume_lid | string if _pl_exp_consume_lid is not none else '' -%}
                            {%- set ns = namespace(out=[]) -%}
                            {%- for e in _pl_exp_entries -%}
                              {%- if _clid != '' and e.location_id | string == _clid -%}
                                {%- set ns.out = ns.out + [{'amount': e.amount, 'best_before': e.best_before_date, 'opened': e.open | bool}] -%}
                              {%- endif -%}
                            {%- endfor -%}
                            {{ ns.out }}
                          _pl_exp_spares: >-
                            {%- set _clid = _pl_exp_consume_lid | string if _pl_exp_consume_lid is not none else '' -%}
                            {%- set ns = namespace(out=[]) -%}
                            {%- for e in _pl_exp_entries -%}
                              {%- if _clid == '' or e.location_id | string != _clid -%}
                                {%- set ns.out = ns.out + [{'amount': e.amount, 'location_id': e.location_id, 'best_before': e.best_before_date}] -%}
                              {%- endif -%}
                            {%- endfor -%}
                            {{ ns.out }}
                      - variables:
                          _pl_exp_chore: >-
                            {%- set _src = _pl_chores_raw['result']['content']
                                           if _pl_chores_raw is mapping and 'result' in _pl_chores_raw
                                              and _pl_chores_raw['result']['content'] is sequence
                                           else [] -%}
                            {%- set ns = namespace(c=none) -%}
                            {%- for c in _src -%}
                              {%- if c.get('product_id') is not none
                                     and c.get('product_id') | string == repeat.item.id | string
                                     and ns.c is none -%}
                                {%- set ns.c = c -%}
                              {%- endif -%}
                            {%- endfor -%}
                            {{ ns.c }}
                      - variables:
                          _pl_exp_safety_relevant: "{{ _pl_exp_safety_type is not none or _pl_exp_hazmat_cls is not none }}"
                          _pl_exp_stock_status: >-
                            {%- set _today = now().date().isoformat() -%}
                            {%- set _amt = _pl_exp_amount | float(0) -%}
                            {%- set _min = _pl_exp_min_stock | float(0) -%}
                            {%- if _pl_exp_bbd is not none and _pl_exp_bbd != '2999-12-31' and _pl_exp_bbd[:10] < _today -%}overdue
                            {%- elif _min > 0 and _amt == 0 -%}critical
                            {%- elif _min > 0 and _amt < _min -%}low
                            {%- else -%}ok{%- endif -%}
                      - variables:
                          _pl_exp_status: >-
                            {%- if _pl_exp_stock_status == 'critical' or (_pl_exp_safety_relevant and _pl_exp_stock_status == 'overdue') -%}critical
                            {%- elif _pl_exp_stock_status in ['low', 'overdue'] -%}attention
                            {%- else -%}healthy{%- endif -%}
                          _pl_exp_object_type: >-
                            {%- if _pl_exp_safety_type is not none -%}safety
                            {%- elif _pl_exp_asset_type == 'tool' -%}tool
                            {%- elif _pl_exp_asset_type in ['medical', 'prescription'] -%}medication
                            {%- elif _pl_exp_asset_type in ['asset', 'equipment', 'appliance'] -%}asset
                            {%- else -%}consumable{%- endif -%}
                      - variables:
                          _pl_expanded: >-
                            {{ _pl_expanded + [{
                              'product_id': repeat.item.id | int,
                              'name': _pl_exp_prod_name,
                              'object_type': _pl_exp_object_type,
                              'status': _pl_exp_status,
                              'unit': _pl_exp_qu_name,
                              'ha_labels': _pl_exp_ha_labels,
                              'stock': {
                                'in_stock': _pl_exp_amount,
                                'installed_count': _pl_exp_installed | map(attribute='amount') | sum | float(0),
                                'spares_count': _pl_exp_spares | map(attribute='amount') | sum | float(0),
                                'threshold': _pl_exp_min_stock,
                                'status': _pl_exp_stock_status
                              },
                              'maintenance': {
                                'chore': {'id': _pl_exp_chore.id, 'name': _pl_exp_chore.name} if _pl_exp_chore is mapping else none,
                                'inspection_required': _pl_exp_safety_relevant
                              },
                              'safety': {
                                'safety_relevant': _pl_exp_safety_relevant,
                                'hazmat_class': _pl_exp_hazmat_cls
                              }
                            }] }}
            - variables:
                final_response:
                  mode: object_lens
                  lens:
                    type: place
                    focus: "{{ area_name(area_id_norm) }}"
                    area_id: "{{ area_id_norm }}"
                  tagged_products: "{{ _pl_tagged }}"
                  safety: "{{ _pl_safety }}"
                  hazmat: "{{ _pl_hazmat }}"
                  chores: "{{ _pl_chores }}"
                  expanded_objects: "{{ _pl_expanded | default(none) }}"
                  counts:
                    tagged: "{{ _pl_tagged | length }}"
                    safety: "{{ _pl_safety | length }}"
                    chores: "{{ _pl_chores | length }}"
                    expanded: "{{ _pl_expanded | default([]) | length }}"
                  status: "{{ 'attention' if (_pl_safety | length > 0 or _pl_chores | length > 0) else 'healthy' }}"
                  hint: "Pass expand=true + per_page=N to inline full operational objects. For stock depth, use stock_area_inventory."
                  tool: "{{ tool_name }}"
                  version: "{{ tool_version }}"
            - stop: object_lens place done
              response_variable: final_response
        # ── product error guard ───────────────────────────────────────────────────
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ product_id_resolved is none }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: object_lens
                  message: "Pass item=<name>, product_id=<id>, or homeassistant_area_id=<area> for a place lens."
            - stop: object_lens no input
              response_variable: final_response
        # ── stock summary + product meta ──────────────────────────────────────────
        - action: script.zen_sutra_grocy
          response_variable: _ol_stock_raw
          continue_on_error: true
          data:
            action_type: read
            endpoint: "/stock/products/{{ product_id_resolved }}"
        # ── userfields ────────────────────────────────────────────────────────────
        - action: script.zen_sutra_grocy
          response_variable: _ol_uf_raw
          continue_on_error: true
          data:
            action_type: read
            endpoint: "/userfields/products/{{ product_id_resolved }}"
        # ── stock entries for installed/spares split ──────────────────────────────
        - action: script.zen_sutra_grocy
          response_variable: _ol_entries_raw
          continue_on_error: true
          data:
            action_type: read
            endpoint: "/stock/products/{{ product_id_resolved }}/entries?limit=500&offset=0"
        # ── chore linked to this product ──────────────────────────────────────────
        - action: script.zen_sutra_grocy
          response_variable: _ol_chores_raw
          continue_on_error: true
          data:
            action_type: read
            endpoint: /objects/chores?limit=500&offset=0
        # ── extract stock object ──────────────────────────────────────────────────
        - variables:
            _ol_stock_obj: >-
              {{ _ol_stock_raw['result']['content']
                 if _ol_stock_raw is mapping and 'result' in _ol_stock_raw
                    and _ol_stock_raw['result']['content'] is mapping
                 else {} }}
        - variables:
            _ol_prod_obj:  "{{ _ol_stock_obj.get('product', {}) if _ol_stock_obj is mapping else {} }}"
            _ol_amount:    "{{ _ol_stock_obj.get('stock_amount_aggregated', 0) | float(0) }}"
            _ol_bbd_next:  "{{ _ol_stock_obj.get('next_due_date', none) }}"
            _ol_qu_name: >-
              {%- set _qu = _ol_stock_obj.get('quantity_unit_stock', none) -%}
              {%- if _qu is mapping -%}{{ _qu.get('name', 'unit') }}{%- else -%}unit{%- endif -%}
        - variables:
            _ol_prod_name:   "{{ _ol_prod_obj.get('name', '') }}"
            _ol_description: "{{ _ol_prod_obj.get('description', none) }}"
            _ol_min_stock:   "{{ _ol_prod_obj.get('min_stock_amount', 0) | float(0) }}"
            _ol_consume_lid: "{{ _ol_prod_obj.get('default_consume_location_id', none) }}"
        # ── extract userfields ────────────────────────────────────────────────────
        - variables:
            _ol_uf: >-
              {{ _ol_uf_raw['result']['content']
                 if _ol_uf_raw is mapping and 'result' in _ol_uf_raw
                    and _ol_uf_raw['result']['content'] is mapping
                 else {} }}
        - variables:
            _ol_safety_type: "{{ _ol_uf.get('zen_safety_type', none) }}"
            _ol_asset_type:  "{{ _ol_uf.get('zen_asset_type', none) }}"
            _ol_hazmat:      "{{ _ol_uf.get('hazmat_class', none) }}"
            _ol_ha_area:     "{{ _ol_uf.get('homeassistant_area', none) }}"
            _ol_ha_labels:   "{{ (_ol_uf.get('ha_labels', '') | default('', true)) | string | trim }}"
        # ── installed / spares split ──────────────────────────────────────────────
        - variables:
            _ol_entries: >-
              {{ _ol_entries_raw['result']['content']
                 if _ol_entries_raw is mapping and 'result' in _ol_entries_raw
                    and _ol_entries_raw['result']['content'] is sequence
                 else [] }}
        - variables:
            _ol_installed: >-
              {%- set _clid = _ol_consume_lid | string if _ol_consume_lid is not none else '' -%}
              {%- set ns = namespace(out=[]) -%}
              {%- for e in _ol_entries -%}
                {%- if _clid != '' and e.location_id | string == _clid -%}
                  {%- set ns.out = ns.out + [{'amount': e.amount, 'best_before': e.best_before_date, 'opened': e.open | bool, 'entry_id': e.id}] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out }}
            _ol_spares: >-
              {%- set _clid = _ol_consume_lid | string if _ol_consume_lid is not none else '' -%}
              {%- set ns = namespace(out=[]) -%}
              {%- for e in _ol_entries -%}
                {%- if _clid == '' or e.location_id | string != _clid -%}
                  {%- set ns.out = ns.out + [{'amount': e.amount, 'location_id': e.location_id, 'best_before': e.best_before_date}] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out }}
        # ── chore extraction ──────────────────────────────────────────────────────
        - variables:
            _ol_chore: >-
              {%- set _src = _ol_chores_raw['result']['content']
                             if _ol_chores_raw is mapping and 'result' in _ol_chores_raw
                                and _ol_chores_raw['result']['content'] is sequence
                             else [] -%}
              {%- set ns = namespace(c=none) -%}
              {%- for c in _src -%}
                {%- if c.get('product_id') is not none
                       and c.get('product_id') | string == product_id_resolved | string
                       and ns.c is none -%}
                  {%- set ns.c = c -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.c }}
        # ── container name lookup ─────────────────────────────────────────────────
        - if: "{{ _ol_consume_lid is not none and _ol_consume_lid | int(-1) > 0 }}"
          then:
            - action: script.zen_sutra_grocy
              response_variable: _ol_loc_raw
              continue_on_error: true
              data:
                action_type: read
                endpoint: "/objects/locations/{{ _ol_consume_lid }}"
          else:
            - variables:
                _ol_loc_raw: {}
        - variables:
            _ol_loc_name: >-
              {{ _ol_loc_raw['result']['content'].get('name', none)
                 if _ol_loc_raw is mapping and 'result' in _ol_loc_raw
                    and _ol_loc_raw['result']['content'] is mapping
                 else none }}
        # ── health scoring ────────────────────────────────────────────────────────
        - variables:
            _ol_safety_relevant: "{{ _ol_safety_type is not none or _ol_hazmat is not none }}"
            _ol_stock_status: >-
              {%- set _today = now().date().isoformat() -%}
              {%- set _bbd = _ol_bbd_next -%}
              {%- set _amt = _ol_amount | float(0) -%}
              {%- set _min = _ol_min_stock | float(0) -%}
              {%- if _bbd is not none and _bbd != '2999-12-31' and _bbd[:10] < _today -%}overdue
              {%- elif _min > 0 and _amt == 0 -%}critical
              {%- elif _min > 0 and _amt < _min -%}low
              {%- else -%}ok{%- endif -%}
            _ol_chore_due: >-
              {{ _ol_chore is not none and _ol_chore is mapping
                 and _ol_chore.get('next_execution_date') is not none
                 and _ol_chore.get('next_execution_date', '2999-12-31')[:10] <= now().date().isoformat() }}
        - variables:
            _ol_status: >-
              {%- if _ol_stock_status == 'critical' or (_ol_safety_relevant and _ol_stock_status == 'overdue') -%}critical
              {%- elif _ol_stock_status in ['low', 'overdue'] or _ol_chore_due -%}attention
              {%- else -%}healthy{%- endif -%}
            _ol_object_type: >-
              {%- if _ol_safety_type is not none -%}safety
              {%- elif _ol_asset_type == 'tool' -%}tool
              {%- elif _ol_asset_type in ['medical', 'prescription'] -%}medication
              {%- elif _ol_asset_type in ['asset', 'equipment', 'appliance'] -%}asset
              {%- else -%}consumable{%- endif -%}
            _ol_criticality: >-
              {%- if _ol_safety_relevant -%}high
              {%- elif _ol_asset_type in ['equipment', 'tool', 'appliance'] -%}medium
              {%- else -%}low{%- endif -%}
        # ── actions ───────────────────────────────────────────────────────────────
        - variables:
            _ol_actions: >-
              {%- set ns = namespace(a=[]) -%}
              {%- if _ol_chore is not none and _ol_chore is mapping -%}
                {%- set ns.a = ns.a + [{'action': 'replace', 'payload': {'tool': 'zen_dojotools_inventory', 'mode': 'chores_execute', 'chore_id': _ol_chore.id}}] -%}
              {%- else -%}
                {%- set ns.a = ns.a + [{'action': 'replace', 'payload': {'tool': 'zen_dojotools_inventory', 'mode': 'stock_open_item', 'product_id': product_id_resolved | int}}] -%}
              {%- endif -%}
              {%- set ns.a = ns.a + [{'action': 'restock', 'payload': {'tool': 'zen_dojotools_inventory', 'mode': 'shopping_add_product', 'product_id': product_id_resolved | int}}] -%}
              {%- if _ol_safety_relevant or _ol_chore is not none -%}
                {%- if _ol_chore is not none and _ol_chore is mapping -%}
                  {%- set ns.a = ns.a + [{'action': 'inspect', 'payload': {'tool': 'zen_dojotools_inventory', 'mode': 'chores_execute', 'chore_id': _ol_chore.id}}] -%}
                {%- else -%}
                  {%- set ns.a = ns.a + [{'action': 'inspect', 'payload': {'note': 'No inspection chore registered — use chores_add to create one'}}] -%}
                {%- endif -%}
              {%- endif -%}
              {{ ns.a }}
        # ── assemble response ─────────────────────────────────────────────────────
        - variables:
            final_response:
              status: ok
              mode: object_lens
              lens:
                type: product
                focus: "{{ _ol_prod_name }}"
                product_id: "{{ product_id_resolved | int }}"
              object:
                object_type: "{{ _ol_object_type }}"
                object_id: "{{ product_id_resolved | int }}"
                name: "{{ _ol_prod_name }}"
                status: "{{ _ol_status }}"
              identity:
                product_id: "{{ product_id_resolved | int }}"
                name: "{{ _ol_prod_name }}"
                description: "{{ _ol_description }}"
                unit: "{{ _ol_qu_name }}"
                zen_asset_type: "{{ _ol_asset_type }}"
                zen_safety_type: "{{ _ol_safety_type }}"
                ha_labels: "{{ _ol_ha_labels }}"
              context:
                area: "{{ _ol_ha_area }}"
                room: "{{ area_name(_ol_ha_area) if _ol_ha_area is not none and _ol_ha_area | trim != '' else none }}"
                container_id: "{{ _ol_consume_lid }}"
                container: "{{ _ol_loc_name }}"
                criticality: "{{ _ol_criticality }}"
              stock:
                in_stock: "{{ _ol_amount }}"
                installed:
                  count: "{{ _ol_installed | map(attribute='amount') | sum | float(0) }}"
                  location_id: "{{ _ol_consume_lid }}"
                  location: "{{ _ol_loc_name }}"
                  entries: "{{ _ol_installed }}"
                spares:
                  count: "{{ _ol_spares | map(attribute='amount') | sum | float(0) }}"
                  entries: "{{ _ol_spares }}"
                threshold: "{{ _ol_min_stock }}"
                status: "{{ _ol_stock_status }}"
                best_before_next: "{{ _ol_bbd_next }}"
              maintenance:
                chore: "{{ {'id': _ol_chore.id, 'name': _ol_chore.name, 'due': _ol_chore_due, 'next_execution': _ol_chore.get('next_execution_date')} if _ol_chore is not none and _ol_chore is mapping else none }}"
                cadence_days: "{{ _ol_chore.get('period_days') | int(0) if _ol_chore is not none and _ol_chore is mapping else 0 }}"
                inspection_required: "{{ _ol_safety_relevant }}"
              safety:
                safety_relevant: "{{ _ol_safety_relevant }}"
                hazmat_class: "{{ _ol_hazmat }}"
                emergency_visible: "{{ _ol_safety_relevant }}"
              actions: "{{ _ol_actions }}"
              tool: "{{ tool_name }}"
              version: "{{ tool_version }}"
        - stop: object_lens done
          response_variable: final_response
    - alias: 'tasks_add — create a new Grocy task'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'tasks_add' }}"
        sequence:
        - variables:
            _ta_name: "{{ item | default('') | string | trim }}"
            _ta_note: "{{ note | default(none, true) }}"
            _ta_due: "{{ best_before_date | default(none, true) }}"
            _ta_area: "{{ homeassistant_area_id | default(none, true) }}"
        - action: script.zen_sutra_grocy
          response_variable: _ta_raw
          data:
            action_type: create
            endpoint: /objects/tasks
            payload: >-
              {%- set p = {'name': _ta_name, 'done': 0} -%}
              {%- if _ta_note is not none -%}
                {%- set p = p | combine({'description': _ta_note}) -%}
              {%- endif -%}
              {%- if _ta_due is not none -%}
                {%- set p = p | combine({'due_date': _ta_due ~ ' 00:00:00'}) -%}
              {%- endif -%}
              {{ p | tojson }}
        - variables:
            _ta_created_id: >-
              {%- set _c = _ta_raw.get('result', {}).get('content', '') -%}
              {%- set _c = _c | from_json if _c is string and _c | trim not in ['', 'none', 'null'] else _c -%}
              {{ (_c.get('created_object_id', _c.get('id', none)) | int(none))
                 if _c is mapping else none }}
        - variables:
            final_response:
              status: "{{ 'success' if _ta_created_id is not none else 'error' }}"
              mode: tasks_add
              task_id: "{{ _ta_created_id }}"
              name: "{{ _ta_name }}"
              note: "{{ _ta_note }}"
              due_date: "{{ _ta_due }}"
              tool: "{{ tool_name }}"
              version: "{{ tool_version }}"
        - stop: Task Created
          response_variable: final_response
    - alias: 'tasks_tag — set homeassistant_area userfield on a task'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'tasks_tag' }}"
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ task_id_resolved is none }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: tasks_tag
                  message: Task not found — pass item=<name> or task_id=<id>
            - stop: Task Not Found
              response_variable: final_response
        - variables:
            _tt_area: "{{ homeassistant_area_id | default(none, true) }}"
        - action: script.zen_sutra_grocy
          response_variable: _tt_raw
          data:
            action_type: update
            endpoint: /userfields/tasks/{{ task_id_resolved }}
            payload: "{{ {'homeassistant_area': _tt_area} | tojson }}"
        - variables:
            final_response:
              status: ok
              mode: tasks_tag
              task_id: "{{ task_id_resolved }}"
              homeassistant_area: "{{ _tt_area }}"
              tool: "{{ tool_name }}"
              version: "{{ tool_version }}"
        - stop: Task Tagged
          response_variable: final_response
    - alias: 'chores_delete — delete a Grocy chore by name or ID'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'chores_delete' }}"
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ chore_id_resolved is none }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: chores_delete
                  message: Chore not found — pass item=<name> or chore_id=<id>
            - stop: Chore Not Found
              response_variable: final_response
        - action: script.zen_sutra_grocy
          response_variable: _cdl_raw
          data:
            action_type: read
            endpoint: /objects/chores/{{ chore_id_resolved }}
        - variables:
            _cdl_chore: >-
              {{ _cdl_raw['result']['content']
                 if (_cdl_raw is mapping and 'result' in _cdl_raw)
                 else {} }}
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ not _cdl_chore }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: chores_delete
                  message: Chore not found
                  chore_id: "{{ chore_id_resolved }}"
            - stop: Chore Not Found
              response_variable: final_response
        - action: script.zen_sutra_grocy
          data:
            action_type: delete
            endpoint: /objects/chores/{{ chore_id_resolved }}
            payload: "{}"
        - variables:
            final_response:
              status: success
              mode: chores_delete
              chore_id: "{{ chore_id_resolved }}"
              name: "{{ _cdl_chore.get('name', item_norm) }}"
              tool: "{{ tool_name }}"
              version: "{{ tool_version }}"
        - stop: Chore Deleted
          response_variable: final_response
    - alias: 'chores_edit — edit fields of an existing Grocy chore'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'chores_edit' }}"
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ chore_id_resolved is none }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: chores_edit
                  message: Chore not found — pass item=<name> or chore_id=<id>
            - stop: Chore Not Found
              response_variable: final_response
        - action: script.zen_sutra_grocy
          response_variable: _ced_raw
          data:
            action_type: read
            endpoint: /objects/chores/{{ chore_id_resolved }}
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ not (_ced_raw is mapping and _ced_raw.get('status') == 'success' and _ced_raw.get('result', {}).get('content') is mapping) }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: chores_edit
                  message: Chore not found
                  chore_id: "{{ chore_id_resolved }}"
            - stop: Chore Not Found
              response_variable: final_response
        - variables:
            _ced_period_days_in: "{{ period_days | default(none, true) }}"
            _ced_product_id_in: "{{ product_id | default(none, true) }}"
            _ced_product_amount_in: "{{ product_amount | default(amount, true) | default(none, true) }}"
            _ced_active_in: "{{ active | default(none, true) }}"
        - action: script.zen_sutra_grocy
          response_variable: _ced_put_raw
          data:
            action_type: update
            endpoint: /objects/chores/{{ chore_id_resolved }}
            payload: >-
              {%- set _c = _ced_raw.get('result', {}).get('content', {}) -%}
              {%- set _c = _c if _c is mapping else {} -%}
              {%- if new_name_norm != '' -%}
                {%- set _c = _c | combine({'name': new_name_norm}) -%}
              {%- endif -%}
              {%- if period_type is defined and period_type is not none and period_type | string | trim != '' -%}
                {%- set _c = _c | combine({'period_type': period_type | string | trim}) -%}
              {%- endif -%}
              {%- if _ced_period_days_in is not none -%}
                {%- set _c = _c | combine({'period_days': _ced_period_days_in | int}) -%}
              {%- endif -%}
              {%- if _ced_product_id_in is not none -%}
                {%- set _c = _c | combine({'product_id': _ced_product_id_in | int, 'consume_product_on_execution': 1}) -%}
              {%- endif -%}
              {%- if _ced_product_amount_in is not none -%}
                {%- set _c = _c | combine({'product_amount': _ced_product_amount_in | float}) -%}
              {%- endif -%}
              {%- if note_in != '' -%}
                {%- set _c = _c | combine({'description': note_in}) -%}
              {%- endif -%}
              {%- if _ced_active_in is not none -%}
                {%- set _c = _c | combine({'active': 1 if _ced_active_in | string in ['true', '1', 'True'] else 0}) -%}
              {%- endif -%}
              {%- set _ns = namespace(c={}) -%}
              {%- for k, v in _c.items() -%}
                {%- if k != 'userfields' and k != 'row_created_timestamp' -%}
                  {%- set _ns.c = _ns.c | combine({k: v}) -%}
                {%- endif -%}
              {%- endfor -%}
              {{ _ns.c | tojson }}
        - variables:
            final_response:
              status: success
              mode: chores_edit
              chore_id: "{{ chore_id_resolved }}"
              name: "{{ new_name_norm if new_name_norm != '' else (_ced_raw.get('result', {}).get('content', {}).get('name', item_norm) if _ced_raw is mapping else item_norm) }}"
              updated_fields: >-
                {%- set out = [] -%}
                {%- if new_name_norm != '' -%}{%- set out = out + ['name'] -%}{%- endif -%}
                {%- if period_type is defined and period_type is not none and period_type | string | trim != '' -%}{%- set out = out + ['period_type'] -%}{%- endif -%}
                {%- if _ced_period_days_in is not none -%}{%- set out = out + ['period_days'] -%}{%- endif -%}
                {%- if _ced_product_id_in is not none -%}{%- set out = out + ['product_id'] -%}{%- endif -%}
                {%- if _ced_product_amount_in is not none -%}{%- set out = out + ['product_amount'] -%}{%- endif -%}
                {%- if note_in != '' -%}{%- set out = out + ['description'] -%}{%- endif -%}
                {%- if _ced_active_in is not none -%}{%- set out = out + ['active'] -%}{%- endif -%}
                {{ out }}
              tool: "{{ tool_name }}"
              version: "{{ tool_version }}"
        - stop: Chore Edited
          response_variable: final_response
    - alias: 'get_product_meta — purchase_date resolution'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'get_product_meta' and product_id_resolved is not none }}"
        sequence:
        - variables:
            _gpm_uf: >-
              {%- set _c = grocy_response.get('result', {}).get('content', {}) if grocy_response is mapping else {} -%}
              {{ _c.get('userfields', {}) if _c is mapping and _c.get('userfields') is mapping else {} }}
            _gpm_explicit: >-
              {%- set _v = _gpm_uf.get('zen_purchase_date', none) -%}
              {%- set _s = _v | string | trim if _v is not none else '' -%}
              {{ '' if _s in ['', 'None', 'none', 'null'] else _s }}
        - if: "{{ _gpm_explicit == '' }}"
          then:
            - action: script.zen_sutra_grocy
              response_variable: _gpm_entries_raw
              continue_on_error: true
              data:
                action_type: read
                endpoint: "/stock/products/{{ product_id_resolved }}/entries"
            - variables:
                _gpm_entries: >-
                  {{ _gpm_entries_raw['result']['content']
                     if _gpm_entries_raw is mapping and 'result' in _gpm_entries_raw
                        and _gpm_entries_raw['result']['content'] is sequence
                     else [] }}
            - variables:
                _gpm_purchase_date: >-
                  {%- set ns = namespace(d=none) -%}
                  {%- for e in _gpm_entries -%}
                    {%- set _d = e.get('purchased_date', none) | string | trim -%}
                    {%- if _d not in ['', 'None', 'null', 'none'] -%}
                      {%- if ns.d is none or _d < ns.d -%}{%- set ns.d = _d -%}{%- endif -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ ns.d }}
                _gpm_purchase_date_source: "{{ 'stock_entry' if _gpm_purchase_date is not none else 'unknown' }}"
          else:
            - variables:
                _gpm_purchase_date: "{{ _gpm_explicit }}"
                _gpm_purchase_date_source: explicit
    - alias: 'update_product_meta — read-modify-write full product PUT'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'update_product_meta' }}"
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ product_id_resolved is none }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: update_product_meta
                  message: Product not found — pass item=<name> or product_id=<id>
            - stop: Product Not Found
              response_variable: final_response
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ unit_id_resolved is not none }}"
            sequence:
            - action: script.zen_sutra_grocy
              response_variable: _upm_qu_raw
              data:
                action_type: read
                endpoint: /objects/quantity_units/{{ unit_id_resolved }}
            - choose:
              - conditions:
                - condition: template
                  value_template: >-
                    {{ not (
                      _upm_qu_raw is mapping
                      and _upm_qu_raw.get('status') == 'success'
                      and _upm_qu_raw.get('result', {}).get('content') is mapping
                      and _upm_qu_raw.get('result', {}).get('content', {}).get('active') | int == 1
                      and _upm_qu_raw.get('result', {}).get('content', {}).get('name') not in [none, '', 'None']
                    ) }}
                sequence:
                - variables:
                    final_response:
                      status: error
                      mode: update_product_meta
                      message: >-
                        Target unit {{ unit_id_resolved }} is invalid (not found, inactive, or
                        has null name). Use mode=units_list to find valid units.
                      unit_id: "{{ unit_id_resolved }}"
                - stop: Invalid Target Unit
                  response_variable: final_response
        - action: script.zen_sutra_grocy
          response_variable: _upm_raw
          data:
            action_type: read
            endpoint: /objects/products/{{ product_id_resolved }}
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ not (_upm_raw is mapping and _upm_raw.get('status') == 'success' and _upm_raw.get('result', {}).get('content') is mapping) }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: update_product_meta
                  message: Product fetch failed
                  product_id: "{{ product_id_resolved }}"
            - stop: Product Fetch Failed
              response_variable: final_response
        - choose:
          - conditions:
            - condition: template
              value_template: >-
                {{ unit_id_resolved is not none
                   and (unit | default('', true)) | string | trim != ''
                   and _upm_raw.get('result', {}).get('content', {}).get('qu_id_stock') is none }}
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: update_product_meta
                  message: >-
                    Product has a null stock unit — Grocy cannot update units on this product.
                    The only fix is to delete the product and recreate it with the correct unit_id from the start.
                  product_id: "{{ product_id_resolved }}"
                  current_qu_id_stock: null
                  target_qu_id: "{{ unit_id_resolved }}"
                  fix: >-
                    1. Note current stock amount and location.
                    2. mode=catalog_delete_product product_id={{ product_id_resolved }} confirm_action=true
                    3. mode=catalog_add_product item=<name> location_id=<id> unit_id={{ unit_id_resolved }}
                    4. mode=update_product_meta product_id=<new_id> purchase_unit_id=<id> amount=<min_stock>
                    5. mode=stock_add_purchase product_id=<new_id> amount=<stock> location_id=<id>
                  tool: "{{ tool_name }}"
                  version: "{{ tool_version }}"
            - stop: Null Stock Unit — Delete and Recreate
              response_variable: final_response
        - action: script.zen_sutra_grocy
          response_variable: _upm_put_raw
          data:
            action_type: update
            endpoint: /objects/products/{{ product_id_resolved }}
            payload: >-
              {%- set _p = _upm_raw.get('result', {}).get('content', {}) -%}
              {%- set _p = _p if _p is mapping else {} -%}
              {%- set _ns = namespace(p={}) -%}
              {%- for k, v in _p.items() -%}
                {%- if k != 'userfields' and k != 'row_created_timestamp' -%}
                  {%- if not (k in ['qu_id_purchase', 'qu_id_price'] and v is none) -%}
                    {%- set _ns.p = _ns.p | combine({k: v}) -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
              {%- if unit_id_resolved is not none and (unit | default('', true)) | string | trim != '' -%}
                {%- set _ns.p = _ns.p | combine({'qu_id_stock': unit_id_resolved | int, 'qu_id_consume': unit_id_resolved | int}) -%}
                {%- if purchase_unit_id_resolved is not none -%}
                  {%- set _ns.p = _ns.p | combine({'qu_id_purchase': purchase_unit_id_resolved | int}) -%}
                {%- endif -%}
              {%- endif -%}
              {%- if has_explicit_amount -%}
                {%- set _ns.p = _ns.p | combine({'min_stock_amount': amt_in | float}) -%}
              {%- endif -%}
              {%- if shopping_location_id_resolved is not none -%}
                {%- set _ns.p = _ns.p | combine({'shopping_location_id': shopping_location_id_resolved | int}) -%}
              {%- endif -%}
              {%- if to_location_id_resolved is not none -%}
                {%- set _ns.p = _ns.p | combine({'default_consume_location_id': to_location_id_resolved | int}) -%}
              {%- endif -%}
              {%- if product_group_id_in is not none -%}
                {%- set _ns.p = _ns.p | combine({'product_group_id': product_group_id_in | int}) -%}
              {%- endif -%}
              {%- if move_on_open_in is not none -%}
                {%- set _ns.p = _ns.p | combine({'move_on_open': 1 if move_on_open_in | bool else 0}) -%}
              {%- endif -%}
              {%- if no_own_stock_in is not none -%}
                {%- set _ns.p = _ns.p | combine({'no_own_stock': 1 if no_own_stock_in | bool else 0}) -%}
              {%- endif -%}
              {%- if due_days_after_open_in is not none -%}
                {%- set _ns.p = _ns.p | combine({'default_best_before_days_after_open': due_days_after_open_in | int}) -%}
              {%- endif -%}
              {%- if best_before_days_in is not none -%}
                {%- set _ns.p = _ns.p | combine({'default_best_before_days': best_before_days_in | int}) -%}
              {%- endif -%}
              {%- set _desc_parts = [] -%}
              {%- if has_note -%}{%- set _desc_parts = _desc_parts + [note_in] -%}{%- endif -%}
              {%- if has_brand -%}{%- set _desc_parts = _desc_parts + ['Brand: ' ~ brand] -%}{%- endif -%}
              {%- if has_sku -%}{%- set _desc_parts = _desc_parts + ['SKU: ' ~ sku] -%}{%- endif -%}
              {%- if _desc_parts | length > 0 -%}
                {%- set _ns.p = _ns.p | combine({'description': _desc_parts | join(' | ')}) -%}
              {%- endif -%}
              {%- if parent_product_id_resolved is not none -%}
                {%- set _ns.p = _ns.p | combine({'parent_product_id': parent_product_id_resolved | int}) -%}
              {%- endif -%}
              {{ _ns.p | tojson }}
        - if: "{{ purchase_date_in != '' }}"
          then:
            - action: script.zen_sutra_grocy
              response_variable: _upm_pd_raw
              continue_on_error: true
              data:
                action_type: update
                endpoint: "/userfields/products/{{ product_id_resolved }}"
                payload: "{{ {'zen_purchase_date': purchase_date_in} | tojson }}"
        - variables:
            _upm_err: >-
              {{ _upm_put_raw.get('result', {}).get('content', {}).get('error_message', '')
                 if (_upm_put_raw is mapping
                     and _upm_put_raw.get('result', {}).get('content') is mapping)
                 else '' }}
            _upm_pre_qu: >-
              {{ _upm_raw.get('result', {}).get('content', {}).get('qu_id_stock')
                 if _upm_raw is mapping else none }}
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ 'QU conversion' in _upm_err and _upm_pre_qu is none }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: update_product_meta
                  message: >-
                    Unit change blocked — product has a null stock unit. Grocy resolves
                    null to system default and conflicts with existing global aliases.
                    Delete and recreate the product with the correct unit from the start.
                  product_id: "{{ product_id_resolved }}"
                  current_qu_id_stock: null
                  target_qu_id: "{{ unit_id_resolved }}"
                  grocy_error: "{{ _upm_err }}"
                  fix: >-
                    1. Note current stock amount and location.
                    2. mode=catalog_delete_product product_id={{ product_id_resolved }} confirm_action=true
                    3. mode=catalog_add_product item=<name> location_id=<id> unit_id={{ unit_id_resolved }}
                    4. mode=update_product_meta product_id=<new_id> purchase_unit_id=<id> amount=<min_stock>
                    5. mode=stock_add_purchase product_id=<new_id> amount=<stock> location_id=<id>
                  tool: "{{ tool_name }}"
                  version: "{{ tool_version }}"
            - stop: Null Stock Unit — Delete and Recreate
              response_variable: final_response
          - conditions:
            - condition: template
              value_template: "{{ 'QU conversion' in _upm_err and _upm_pre_qu is not none }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: update_product_meta
                  message: Unit change blocked by Grocy - QU conversion required between current and target units.
                  product_id: "{{ product_id_resolved }}"
                  current_qu_id_stock: "{{ _upm_pre_qu }}"
                  target_qu_id: "{{ unit_id_resolved }}"
                  grocy_error: "{{ _upm_err }}"
                  fix: >-
                    Create a QU conversion first:
                    mode=unit_conversions_add unit_id={{ _upm_pre_qu }} to_unit_id={{ unit_id_resolved }} amount=<factor>
                    Then retry update_product_meta.
                  tool: "{{ tool_name }}"
                  version: "{{ tool_version }}"
            - stop: QU Conversion Required
              response_variable: final_response
        - variables:
            final_response:
              status: success
              mode: update_product_meta
              product_id: "{{ product_id_resolved }}"
              updated_fields: >-
                {%- set out = [] -%}
                {%- if unit_id_resolved is not none and (unit | default('', true)) | string | trim != '' -%}{%- set out = out + ['qu_id_purchase', 'qu_id_stock', 'qu_id_consume'] -%}{%- endif -%}
                {%- if has_explicit_amount -%}{%- set out = out + ['min_stock_amount'] -%}{%- endif -%}
                {%- if has_note or has_brand or has_sku -%}{%- set out = out + ['description'] -%}{%- endif -%}
                {%- if shopping_location_id_resolved is not none -%}{%- set out = out + ['shopping_location_id'] -%}{%- endif -%}
                {%- if to_location_id_resolved is not none -%}{%- set out = out + ['default_consume_location_id'] -%}{%- endif -%}
                {%- if product_group_id_in is not none -%}{%- set out = out + ['product_group_id'] -%}{%- endif -%}
                {%- if move_on_open_in is not none -%}{%- set out = out + ['move_on_open'] -%}{%- endif -%}
                {%- if no_own_stock_in is not none -%}{%- set out = out + ['no_own_stock'] -%}{%- endif -%}
                {%- if due_days_after_open_in is not none -%}{%- set out = out + ['default_best_before_days_after_open'] -%}{%- endif -%}
                {%- if best_before_days_in is not none -%}{%- set out = out + ['default_best_before_days'] -%}{%- endif -%}
                {%- if parent_product_id_resolved is not none -%}{%- set out = out + ['parent_product_id'] -%}{%- endif -%}
                {%- if purchase_date_in != '' -%}{%- set out = out + ['zen_purchase_date'] -%}{%- endif -%}
                {{ out }}
              tool: "{{ tool_name }}"
              version: "{{ tool_version }}"
        - stop: Product Meta Updated
          response_variable: final_response
    - alias: 'provision_bom — idempotent BOM provisioner (catalog+meta+labels+chores+seed)'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'provision_bom' }}"
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ not confirm_action_in }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: provision_bom
                  message: confirm_action=true is required for provision_bom.
                  coaching:
                  - Pass confirm_action=true to execute BOM provisioning.
            - stop: Confirm Required
              response_variable: final_response
        - variables:
            _bom: >-
              {{ bom_in | from_json
                 if bom_in is string and bom_in | trim not in ['', 'none', 'null']
                 else bom_in | default({}, true) }}
        - variables:
            _bom_parts: "{{ _bom.get('parts', []) }}"
            _bom_robot_name: "{{ _bom.get('robot_name', '') | string | trim }}"
            _bom_default_storage_lid: "{{ _bom.get('storage_location_id') | int(none) }}"
            _bom_ha_labels: "{{ _bom.get('ha_labels', '') | string | trim }}"
            _bom_chore_ha_labels: "{{ _bom.get('chore_ha_labels', '') | string | trim }}"
            _bom_reseed: "{{ _bom.get('reseed', false) | bool }}"
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _bom_parts | length == 0 }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: provision_bom
                  message: bom.parts is required and must not be empty.
            - stop: BOM Parts Required
              response_variable: final_response
        - action: script.zen_sutra_grocy
          response_variable: _pbom_units_raw
          data:
            action_type: read
            endpoint: /objects/quantity_units?limit=500&offset=0
        - variables:
            _pbom_all_units: "{{ _pbom_units_raw['result']['content'] | default([], true) }}"
        - variables:
            _pbom_catalog: {}
        - repeat:
            for_each: "{{ _bom_parts }}"
            sequence:
            - variables:
                _bp: "{{ repeat.item }}"
                _bp_key: "{{ repeat.item.get('key', repeat.item.get('name', 'part')) | string | trim }}"
                _bp_storage_lid: "{{ repeat.item.get('storage_location_id', _bom_default_storage_lid) | int(none) }}"
                _bp_consume_lid: "{{ repeat.item.get('consume_location_id') | int(none) }}"
                _bp_ha_labels: "{{ repeat.item.get('ha_labels', _bom_ha_labels) | string | trim }}"
                _bp_chore_ha_labels: "{{ repeat.item.get('chore_ha_labels', _bom_chore_ha_labels) | string | trim }}"
                _bp_unit_name: "{{ repeat.item.get('unit', 'each') | string | trim }}"
                _bp_chore_name: "{{ repeat.item.get('chore_name', '') | string | trim }}"
                _bp_pid: "{{ repeat.item.get('product_id') | int(none) }}"
                _bp_chore_id: none
                _bp_is_new: false
                _bp_unit_error: none
            - variables:
                _bp_unit_exact: "{{ _pbom_all_units | selectattr('name', 'equalto', _bp_unit_name) | list }}"
            - variables:
                _bp_unit_ci: "{{ _pbom_all_units | selectattr('name', 'equalto', _bp_unit_name | lower) | list }}"
            - variables:
                _bp_unit_id: >-
                  {%- if _bp_unit_exact | length > 0 -%}
                    {{ _bp_unit_exact | map(attribute='id') | sort | first | int(none) }}
                  {%- elif _bp_unit_ci | length > 0 -%}
                    {{ _bp_unit_ci | map(attribute='id') | sort | first | int(none) }}
                  {%- else -%}{{ none }}{%- endif -%}
            # Product resolution: caller-pinned ID → exact name → ha_labels+location fallback
            - if: "{{ _bp_pid is none }}"
              then:
                - action: script.zen_sutra_grocy
                  response_variable: _bp_dupe_raw
                  data:
                    action_type: read
                    endpoint: "objects/products?query%5B%5D=name={{ _bp.get('name', '') }}"
                - variables:
                    _bp_pid: >-
                      {%- set _dl = _bp_dupe_raw['result']['content']
                                    | default([], true)
                                    | selectattr('name', 'equalto', _bp.get('name', ''))
                                    | list -%}
                      {{ (_dl | map(attribute='id') | sort | first | int(none)) if _dl | length > 0 else none }}
            # Secondary: if name missed, find product at same location with same ha_labels root
            # Prevents duplicate creation when BOM name differs from existing product name
            - if: "{{ _bp_pid is none and _bp_storage_lid is not none and _bp_ha_labels != '' }}"
              then:
                - action: script.zen_sutra_grocy
                  response_variable: _bp_loc_prods_raw
                  continue_on_error: true
                  data:
                    action_type: read
                    endpoint: "/objects/products?query%5B%5D=location_id={{ _bp_storage_lid }}&limit=200"
                - variables:
                    _bp_pid: >-
                      {%- set _root = (_bp_ha_labels.split(',') | first | trim) -%}
                      {%- set _src = _bp_loc_prods_raw['result']['content'] | default([], true)
                                     if _bp_loc_prods_raw is mapping
                                        and 'result' in _bp_loc_prods_raw
                                        and _bp_loc_prods_raw['result']['content'] is sequence
                                     else [] -%}
                      {%- set ns = namespace(matches=[]) -%}
                      {%- for p in _src -%}
                        {%- set _uf = p['userfields'] | default({}, true) if p['userfields'] | default(none, true) is mapping else {} -%}
                        {%- set _hl = (_uf['ha_labels'] | default('', true)) | string | trim -%}
                        {%- if _hl != '' and (_hl.split(',') | first | trim) == _root -%}
                          {%- set ns.matches = ns.matches + [p.id | int] -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {{ ns.matches | sort | first | int(none) if ns.matches | length == 1 else none }}
            - if: "{{ _bp_pid is none and _bp_unit_id is none }}"
              then:
                - variables:
                    _bp_unit_error: >-
                      Unit '{{ _bp_unit_name }}' not found in Grocy quantity_units — product not created.
                      Use mode=units_list to see available names, then fix the BOM part unit field.
            - if: "{{ _bp_pid is none and _bp_unit_id is not none }}"
              then:
                - variables:
                    _bp_desc: >-
                      {%- set _dp = [] -%}
                      {%- if _bp.get('chore_note', _bp.get('note', '')) | length > 0 -%}
                        {%- set _dp = _dp + [_bp.get('chore_note', _bp.get('note', ''))] -%}
                      {%- endif -%}
                      {%- if _bp.get('brand') -%}{%- set _dp = _dp + ['Brand: ' ~ _bp.brand] -%}{%- endif -%}
                      {%- if _bp.get('sku') -%}{%- set _dp = _dp + ['SKU: ' ~ _bp.sku] -%}{%- endif -%}
                      {{ _dp | join(' | ') }}
                - action: script.zen_sutra_grocy
                  response_variable: _bp_create_raw
                  data:
                    action_type: post
                    endpoint: /objects/products
                    payload: >-
                      {{ {
                        'name': _bp.get('name', ''),
                        'location_id': _bp_storage_lid | int(0),
                        'qu_id_purchase': _bp_unit_id | int,
                        'qu_id_stock': _bp_unit_id | int,
                        'description': _bp_desc
                      } | tojson }}
                - variables:
                    _bp_cc: >-
                      {%- set _c = _bp_create_raw['result']['content'] | default('', true) -%}
                      {%- set _c = _c | from_json if _c is string and _c | trim not in ['', 'none', 'null'] else _c -%}
                      {{ _c if _c is mapping else {} }}
                - variables:
                    _bp_pid: "{{ (_bp_cc['created_object_id'] | default(_bp_cc['id'] | default(none, true), true) | int(none)) }}"
                    _bp_is_new: true
            - if: "{{ _bp_pid is not none }}"
              then:
                - action: script.zen_sutra_grocy
                  response_variable: _bp_prod_raw
                  data:
                    action_type: read
                    endpoint: "/objects/products/{{ _bp_pid }}"
                - variables:
                    _bp_prod_obj: >-
                      {%- set _c = _bp_prod_raw['result']['content'] | default({}, true) -%}
                      {{ _c if _c is mapping else {} }}
                - variables:
                    _bp_meta_patch: >-
                      {%- set ns = namespace(p={}) -%}
                      {%- for k, v in _bp_prod_obj.items() -%}
                        {%- if k not in ['userfields', 'row_created_timestamp'] -%}
                          {%- if not (k in ['qu_id_purchase', 'qu_id_price'] and v is none) -%}
                            {%- set ns.p = ns.p | combine({k: v}) -%}
                          {%- endif -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {%- if _bp_unit_id is not none -%}
                        {%- set ns.p = ns.p | combine({'qu_id_stock': _bp_unit_id | int, 'qu_id_consume': _bp_unit_id | int, 'qu_id_purchase': _bp_unit_id | int}) -%}
                      {%- endif -%}
                      {%- if _bp_consume_lid is not none -%}
                        {%- set ns.p = ns.p | combine({'default_consume_location_id': _bp_consume_lid | int, 'move_on_open': 1}) -%}
                      {%- endif -%}
                      {%- set ns.p = ns.p | combine({'min_stock_amount': _bp.get('min_stock', 1) | int(1)}) -%}
                      {%- set ns.p = ns.p | combine({'default_best_before_days_after_open': _bp.get('chore_period_days', 90) | int(90)}) -%}
                      {%- set _bp_uf_base = _bp_prod_obj['userfields'] | default({}, true) if _bp_prod_obj['userfields'] | default(none, true) is mapping else {} -%}
                      {%- set _bp_uf = _bp_uf_base -%}
                      {%- if _bp_ha_labels | length > 0 -%}{%- set _bp_uf = _bp_uf | combine({'ha_labels': _bp_ha_labels}) -%}{%- endif -%}
                      {%- if _bp.get('asset_type') -%}{%- set _bp_uf = _bp_uf | combine({'zen_asset_type': _bp.get('asset_type')}) -%}{%- endif -%}
                      {%- if _bp.get('safety_type') -%}{%- set _bp_uf = _bp_uf | combine({'zen_safety_type': _bp.get('safety_type')}) -%}{%- endif -%}
                      {%- set ns.p = ns.p | combine({'userfields': _bp_uf}) -%}
                      {{ ns.p | tojson }}
                - action: script.zen_sutra_grocy
                  response_variable: _bp_meta_raw
                  continue_on_error: true
                  data:
                    action_type: update
                    endpoint: "/objects/products/{{ _bp_pid }}"
                    payload: "{{ _bp_meta_patch }}"
                - if: "{{ _bp_ha_labels | length > 0 }}"
                  then:
                    - action: script.zen_sutra_grocy
                      response_variable: _bp_tag_raw
                      continue_on_error: true
                      data:
                        action_type: update
                        endpoint: "/userfields/products/{{ _bp_pid }}"
                        payload: '{{ {"ha_labels": _bp_ha_labels} | tojson }}'
                - if: "{{ _bp_chore_name | length > 0 }}"
                  then:
                    - action: script.zen_sutra_grocy
                      response_variable: _bp_chore_find_raw
                      continue_on_error: true
                      data:
                        action_type: read
                        endpoint: "objects/chores?query%5B%5D=name={{ _bp_chore_name }}"
                    - variables:
                        _bp_chore_existing: >-
                          {%- set _cl = _bp_chore_find_raw['result']['content'] | default([], true)
                                        | default([], true)
                                        | selectattr('name', 'equalto', _bp_chore_name)
                                        | list -%}
                          {{ (_cl | map(attribute='id') | first | int(none)) if _cl | length > 0 else none }}
                    - if: "{{ _bp_chore_existing is not none }}"
                      then:
                        - variables:
                            _bp_chore_id: "{{ _bp_chore_existing }}"
                    - if: "{{ _bp_chore_existing is none }}"
                      then:
                        - variables:
                            _bp_chore_payload: >-
                              {%- set _cp = {
                                'name': _bp_chore_name,
                                'period_type': 'dynamic-regular',
                                'period_days': _bp.get('chore_period_days', 90) | int(90),
                                'active': 1,
                                'product_id': _bp_pid | int,
                                'product_amount': 0,
                                'consume_product_on_execution': 1
                              } -%}
                              {%- if _bp.get('chore_note') -%}
                                {%- set _cp = _cp | combine({'description': _bp.get('chore_note')}) -%}
                              {%- endif -%}
                              {{ _cp | tojson }}
                        - action: script.zen_sutra_grocy
                          response_variable: _bp_chore_raw
                          data:
                            action_type: create
                            endpoint: /objects/chores
                            payload: "{{ _bp_chore_payload }}"
                        - variables:
                            _bp_cc2: >-
                              {%- set _c = _bp_chore_raw['result']['content'] | default('', true) -%}
                              {%- set _c = _c | from_json if _c is string and _c | trim not in ['', 'none', 'null'] else _c -%}
                              {{ _c if _c is mapping else {} }}
                        - variables:
                            _bp_chore_id: "{{ (_bp_cc2['created_object_id'] | default(_bp_cc2['id'] | default(none, true), true) | int(none)) }}"
                    - if: "{{ _bp_chore_id is not none and _bp_chore_ha_labels | length > 0 }}"
                      then:
                        - action: script.zen_sutra_grocy
                          response_variable: _bp_ctag_raw
                          continue_on_error: true
                          data:
                            action_type: update
                            endpoint: "/userfields/chores/{{ _bp_chore_id }}"
                            payload: '{{ {"ha_labels": _bp_chore_ha_labels} | tojson }}'
            - variables:
                _pbom_catalog: >-
                  {{ _pbom_catalog | combine({
                    _bp_key: {
                      'product_id':          _bp_pid | int(none),
                      'name':                _bp.get('name', ''),
                      'sku':                 _bp.get('sku', none),
                      'unit':                _bp_unit_name,
                      'unit_id':             _bp_unit_id | int(none),
                      'storage_location_id': _bp_storage_lid | int(none),
                      'consume_location_id': _bp_consume_lid | int(none),
                      'min_stock':           _bp.get('min_stock', 1) | int(1),
                      'chore_id':            _bp_chore_id | int(none),
                      'chore_name':          _bp.get('chore_name', none),
                      'ha_labels':           _bp_ha_labels,
                      'is_new':              _bp_is_new,
                      'unit_error':          _bp_unit_error | default(none)
                    }
                  }) }}
        - repeat:
            for_each: "{{ _pbom_catalog.values() | list }}"
            sequence:
            - if: >-
                {{ repeat.item.get('product_id') is not none
                   and repeat.item.get('consume_location_id') is not none
                   and (repeat.item.get('is_new', false) or _bom_reseed) }}
              then:
                - action: script.zen_sutra_grocy
                  response_variable: _pbom_seed_raw
                  continue_on_error: true
                  data:
                    action_type: post
                    endpoint: "/stock/products/{{ repeat.item.product_id }}/add"
                    payload: >-
                      {{ {
                        'amount': 1,
                        'transaction_type': 'purchase',
                        'location_id': repeat.item.consume_location_id | int
                      } | tojson }}
        - variables:
            _pbom_integrity: >-
              {%- set ns = namespace(ok=[], failed=[], missing_chore=[], missing_labels=[]) -%}
              {%- for key, p in _pbom_catalog.items() -%}
                {%- if p.get('unit_error') is not none or p.get('product_id') is none -%}
                  {%- set ns.failed = ns.failed + [{'part': key, 'issue': p.get('unit_error', 'product_id not set — creation may have failed')}] -%}
                {%- else -%}
                  {%- set ns.ok = ns.ok + [key] -%}
                {%- endif -%}
                {%- if p.get('chore_name') and p.get('chore_id') is none -%}
                  {%- set ns.missing_chore = ns.missing_chore + [{'part': key, 'issue': 'chore_name provided but chore_id not set — chore creation may have failed'}] -%}
                {%- endif -%}
                {%- if _bom_ha_labels != '' and (p.get('ha_labels', '') | string | trim == '') -%}
                  {%- set ns.missing_labels = ns.missing_labels + [{'part': key, 'issue': 'ha_labels not applied — label step may have failed'}] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ {'ok': ns.ok, 'failed': ns.failed, 'missing_chore': ns.missing_chore, 'missing_labels': ns.missing_labels} }}
        - variables:
            final_response:
              status: >-
                {{ 'partial' if (_pbom_integrity.failed | length > 0
                   or _pbom_integrity.missing_chore | length > 0
                   or _pbom_integrity.missing_labels | length > 0)
                   else 'success' }}
              mode: provision_bom
              robot_name: "{{ _bom_robot_name }}"
              parts_count: "{{ _pbom_catalog | length }}"
              parts_ok: "{{ _pbom_integrity.ok | length }}"
              parts_failed: "{{ _pbom_integrity.failed | length }}"
              integrity_warnings: "{{ _pbom_integrity.failed + _pbom_integrity.missing_chore + _pbom_integrity.missing_labels }}"
              catalog: "{{ _pbom_catalog }}"
              seeded: "{{ not _bom_reseed }}"
              note: Write catalog to your cabinet for future provisioner reference.
              ha_labels_warning: "{{ 'BOM has no ha_labels — provisioned products will not appear in zen_dojotools_plant mode=managed. Add ha_labels to the BOM root and re-run provision_bom.' if _bom_ha_labels == '' else none }}"
              tool: "{{ tool_name }}"
              version: "{{ tool_version }}"
        - stop: BOM Provision Complete
          response_variable: final_response
    - alias: 'catalog_import_bom — bulk idempotent catalog create + userfield tag (no chores, no stock)'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'catalog_import_bom' }}"
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ not confirm_action_in }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: catalog_import_bom
                  message: confirm_action=true is required for catalog_import_bom.
            - stop: Confirm Required
              response_variable: final_response
        - variables:
            _cib_raw: >-
              {{ bom_in | from_json
                 if bom_in is string and bom_in | trim not in ['', 'none', 'null']
                 else bom_in | default({}, true) }}
        - variables:
            _cib_items: >-
              {%- if _cib_raw is sequence and _cib_raw is not mapping -%}
                {{ _cib_raw | list }}
              {%- elif _cib_raw is mapping -%}
                {{ _cib_raw['items'] | default([], true) }}
              {%- else -%}[]{%- endif -%}
            _cib_def_loc: >-
              {%- set _v = _cib_raw['default_location_id'] | default(none, true) if _cib_raw is mapping else none -%}
              {{ _v | int if _v is not none and _v | string | trim not in ['', 'none', 'null'] else none }}
            _cib_def_labels: >-
              {{ _cib_raw['default_ha_labels'] | default('book', true) | string | trim if _cib_raw is mapping else 'book' }}
            _cib_def_asset: >-
              {{ _cib_raw['default_asset_type'] | default('book', true) | string | trim if _cib_raw is mapping else 'book' }}
            _cib_def_unit: >-
              {{ _cib_raw['default_unit'] | default('each', true) | string | trim if _cib_raw is mapping else 'each' }}
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _cib_items | length == 0 }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: catalog_import_bom
                  message: bom.items is required and must not be empty.
            - stop: Items Required
              response_variable: final_response
        - action: script.zen_sutra_grocy
          response_variable: _cib_units_raw
          data:
            action_type: read
            endpoint: /objects/quantity_units?limit=500&offset=0
        - variables:
            _cib_all_units: "{{ _cib_units_raw['result']['content'] | default([], true) }}"
        - variables:
            _cib_results: []
            _cib_created: 0
            _cib_existing: 0
            _cib_failed: 0
        - repeat:
            for_each: "{{ _cib_items }}"
            sequence:
            - variables:
                _ci: "{{ repeat.item }}"
                _ci_name: "{{ repeat.item.get('name', '') | string | trim }}"
                _ci_loc: >-
                  {%- set _v = repeat.item.get('location_id', _cib_def_loc) -%}
                  {{ _v | int if _v is not none and _v | string | trim not in ['', 'none', 'null'] else none }}
                _ci_labels: "{{ repeat.item.get('ha_labels', _cib_def_labels) | string | trim }}"
                _ci_asset: "{{ repeat.item.get('asset_type', _cib_def_asset) | string | trim }}"
                _ci_unit_name: "{{ repeat.item.get('unit', _cib_def_unit) | string | trim }}"
                _ci_author: "{{ repeat.item.get('book_author', none) }}"
                _ci_isbn: "{{ repeat.item.get('book_isbn', none) }}"
                _ci_series: "{{ repeat.item.get('book_series', none) }}"
                _ci_genre: "{{ repeat.item.get('book_genre', none) }}"
                _ci_library_meta: "{{ repeat.item.get('library_meta', none) }}"
                _ci_note: "{{ repeat.item.get('note', '') | string | trim }}"
                _ci_pid: 0
                _ci_is_new: false
                _ci_status: pending
            - variables:
                _ci_unit_match: "{{ _cib_all_units | selectattr('name', 'equalto', _ci_unit_name) | list }}"
            - variables:
                _ci_unit_id: >-
                  {%- if _ci_unit_match | length > 0 -%}
                    {{ _ci_unit_match | map(attribute='id') | sort | first | int(none) }}
                  {%- else -%}
                    {%- set _cil = _cib_all_units | selectattr('name', 'equalto', _ci_unit_name | lower) | list -%}
                    {{ (_cil | map(attribute='id') | sort | first | int(none)) if _cil | length > 0 else none }}
                  {%- endif -%}
            - if: "{{ _ci_name == '' }}"
              then:
                - variables:
                    _ci_status: failed
                    _cib_results: >-
                      {{ (_cib_results if _cib_results is sequence else [])
                         + [{'name': '(blank)', 'status': 'failed', 'reason': 'name is required'}] }}
                    _cib_failed: "{{ _cib_failed | int + 1 }}"
            # Step 1: exact name match
            - if: "{{ _ci_name != '' and _ci_pid | int(0) == 0 }}"
              then:
                - action: script.zen_sutra_grocy
                  response_variable: _ci_exact_raw
                  data:
                    action_type: read
                    endpoint: "objects/products?query%5B%5D=name={{ _ci_name | replace(':', '%3A') }}"
                - variables:
                    _ci_pid: >-
                      {%- set _raw = _ci_exact_raw['result']['content'] | default(none, true) -%}
                      {%- set _dl = _raw if _raw is sequence and _raw is not string else [] -%}
                      {%- set _norm = _ci_name | lower -%}
                      {%- set ns = namespace(found=0) -%}
                      {%- for p in _dl if p is mapping -%}
                        {%- if p['name'] | default('', true) | lower == _norm -%}
                          {%- set ns.found = p['id'] | default(0) | int(0) -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {%- if ns.found == 0 and _dl | length == 1 -%}
                        {{ _dl[0]['id'] | default(0) | int(0) }}
                      {%- else -%}
                        {{ ns.found }}
                      {%- endif -%}
                    _ci_is_new: false
            # Step 2: fuzzy fallback - handles colons and special chars in names
            - if: "{{ _ci_name != '' and _ci_pid | int(0) == 0 }}"
              then:
                - action: script.zen_sutra_grocy
                  response_variable: _ci_fuzzy_raw
                  data:
                    action_type: read
                    endpoint: "objects/products?query%5B%5D=name~{{ _ci_name | replace(':', '%3A') }}"
                - variables:
                    _ci_pid: >-
                      {%- set _raw = _ci_fuzzy_raw['result']['content'] | default(none, true) -%}
                      {%- set _dl = _raw if _raw is sequence and _raw is not string else [] -%}
                      {%- set _norm = _ci_name | lower -%}
                      {%- set ns = namespace(found=0) -%}
                      {%- for p in _dl if p is mapping -%}
                        {%- if p['name'] | default('', true) | lower == _norm -%}
                          {%- set ns.found = p['id'] | default(0) | int(0) -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {{ ns.found }}
                    _ci_is_new: false
            # Step 3: create if still not found
            - if: "{{ _ci_name != '' and _ci_pid | int(0) == 0 and _ci_unit_id is not none }}"
              then:
                - variables:
                    _ci_create_payload: >-
                      {%- set p = {'name': _ci_name, 'qu_id_purchase': _ci_unit_id | int, 'qu_id_stock': _ci_unit_id | int, 'description': _ci_note} -%}
                      {%- if _ci_loc is not none and _ci_loc | int > 0 -%}{%- set p = p | combine({'location_id': _ci_loc | int}) -%}{%- endif -%}
                      {{ p | tojson }}
                - action: script.zen_sutra_grocy
                  response_variable: _ci_create_raw
                  data:
                    action_type: post
                    endpoint: /objects/products
                    payload: "{{ _ci_create_payload }}"
                - variables:
                    _ci_cc: >-
                      {%- set _c = _ci_create_raw['result']['content'] | default('', true) -%}
                      {%- set _c = _c | from_json if _c is string and _c | trim not in ['', 'none', 'null'] else _c -%}
                      {{ _c if _c is mapping else {} }}
                - variables:
                    _ci_new_pid: >-
                      {%- set _id = _ci_cc['created_object_id'] | default(_ci_cc['id'] | default(none, true), true) -%}
                      {{ _id | int(0) if _id is not none and _id | string | trim not in ['', 'none', 'null'] else 0 }}
                - variables:
                    _ci_pid: "{{ _ci_new_pid | int(0) }}"
                    _ci_is_new: "{{ _ci_new_pid | int(0) > 0 }}"
            - if: "{{ _ci_name != '' and _ci_pid | int(0) > 0 and _ci_loc is not none and _ci_loc | int > 0 }}"
              then:
                - action: script.zen_sutra_grocy
                  response_variable: _ci_prod_fetch
                  continue_on_error: true
                  data:
                    action_type: read
                    endpoint: "/objects/products/{{ _ci_pid | int }}"
                - variables:
                    _ci_prod_obj: >-
                      {%- set _c = _ci_prod_fetch['result']['content'] | default({}, true) -%}
                      {{ _c if _c is mapping else {} }}
                - action: script.zen_sutra_grocy
                  response_variable: _ci_loc_raw
                  continue_on_error: true
                  data:
                    action_type: update
                    endpoint: "/objects/products/{{ _ci_pid | int }}"
                    payload: "{{ _ci_prod_obj | combine({'location_id': _ci_loc | int}) | tojson }}"
            - if: "{{ _ci_name != '' and _ci_pid | int(0) > 0 }}"
              then:
                - variables:
                    _ci_uf_payload: >-
                      {%- set p = {} -%}
                      {%- if _ci_labels | trim != '' -%}{%- set p = p | combine({'ha_labels': _ci_labels}) -%}{%- endif -%}
                      {%- if _ci_asset | trim != '' -%}{%- set p = p | combine({'zen_asset_type': _ci_asset}) -%}{%- endif -%}
                      {%- if _ci_author is not none -%}{%- set p = p | combine({'book_author': _ci_author}) -%}{%- endif -%}
                      {%- if _ci_isbn is not none -%}{%- set p = p | combine({'book_isbn': _ci_isbn | string}) -%}{%- endif -%}
                      {%- if _ci_series is not none -%}{%- set p = p | combine({'book_series': _ci_series}) -%}{%- endif -%}
                      {%- if _ci_genre is not none -%}{%- set p = p | combine({'book_genre': _ci_genre}) -%}{%- endif -%}
                      {%- if _ci_library_meta is not none -%}{%- set p = p | combine({'library_meta': _ci_library_meta | string}) -%}{%- endif -%}
                      {{ p | tojson }}
                - action: script.zen_sutra_grocy
                  response_variable: _ci_tag_raw
                  continue_on_error: true
                  data:
                    action_type: update
                    endpoint: "/userfields/products/{{ _ci_pid | int }}"
                    payload: "{{ _ci_uf_payload }}"
                - variables:
                    _ci_status: "{{ 'created' if _ci_is_new else 'existing' }}"
                    _cib_results: >-
                      {{ (_cib_results if _cib_results is sequence else [])
                         + [{'name': _ci_name, 'product_id': _ci_pid | int, 'status': _ci_status}] }}
                    _cib_created: "{{ _cib_created | int + (1 if _ci_is_new else 0) }}"
                    _cib_existing: "{{ _cib_existing | int + (0 if _ci_is_new else 1) }}"
            - if: "{{ _ci_name != '' and _ci_pid | int(0) == 0 }}"
              then:
                - variables:
                    _cib_results: >-
                      {{ (_cib_results if _cib_results is sequence else [])
                         + [{'name': _ci_name, 'status': 'failed',
                             'reason': 'unit not found: ' ~ _ci_unit_name if _ci_unit_id is none else 'product create failed - check Grocy logs'}] }}
                    _cib_failed: "{{ _cib_failed | int + 1 }}"

        - variables:
            final_response:
              status: "{{ 'partial' if _cib_failed | int > 0 else 'success' }}"
              mode: catalog_import_bom
              summary:
                total: "{{ _cib_items | length }}"
                created: "{{ _cib_created }}"
                existing: "{{ _cib_existing }}"
                failed: "{{ _cib_failed }}"
              items: "{{ _cib_results }}"
              tool: "{{ tool_name }}"
              version: "{{ tool_version }}"
        - stop: BOM Import Complete
          response_variable: final_response
    - alias: 'stock_area_inventory — full denormalized room view (locations + product names + amounts)'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'stock_area_inventory' }}"
        sequence:
        - variables:
            _sai_area_id: "{{ homeassistant_area_id | default('') | string | trim }}"
        - variables:
            _sai_locs_pg_offset: 0
            _sai_locs_pg_done: false
            _sai_area_locs: []
        - repeat:
            while: "{{ not _sai_locs_pg_done }}"
            sequence:
              - action: script.zen_sutra_grocy
                response_variable: _sai_locs_pg_raw
                continue_on_error: true
                data:
                  action_type: read
                  endpoint: "/objects/locations?limit=200&offset={{ _sai_locs_pg_offset }}"
              - variables:
                  _sai_locs_pg_len: >-
                    {%- set _pg = _sai_locs_pg_raw['result']['content']
                                  if _sai_locs_pg_raw is mapping and 'result' in _sai_locs_pg_raw
                                     and _sai_locs_pg_raw['result']['content'] is sequence
                                  else [] -%}
                    {{ _pg | length }}
                  _sai_area_locs: >-
                    {%- set _pg = _sai_locs_pg_raw['result']['content']
                                  if _sai_locs_pg_raw is mapping and 'result' in _sai_locs_pg_raw
                                     and _sai_locs_pg_raw['result']['content'] is sequence
                                  else [] -%}
                    {%- set ns = namespace(locs=_sai_area_locs) -%}
                    {%- for loc in _pg | selectattr('userfields.homeassistant_area', 'defined')
                                        | selectattr('userfields.homeassistant_area', 'equalto', _sai_area_id) -%}
                      {%- set ns.locs = ns.locs + [{'id': loc.id, 'name': loc.name,
                          'subclass': loc.userfields.grocy_location_subclass | default('', true)}] -%}
                    {%- endfor -%}
                    {{ ns.locs }}
                  _sai_locs_pg_offset: "{{ (_sai_locs_pg_offset | int) + 200 }}"
              - variables:
                  _sai_locs_pg_done: "{{ _sai_locs_pg_len | int < 200 }}"
        - variables:
            _sai_prods_pg_offset: 0
            _sai_prods_pg_done: false
            _sai_prod_map: {}
        - repeat:
            while: "{{ not _sai_prods_pg_done }}"
            sequence:
              - action: script.zen_sutra_grocy
                response_variable: _sai_prods_pg_raw
                continue_on_error: true
                data:
                  action_type: read
                  endpoint: "/objects/products?limit=200&offset={{ _sai_prods_pg_offset }}"
                  slim_objects: true
              - variables:
                  _sai_prods_pg_len: >-
                    {%- set _pg = _sai_prods_pg_raw['result']['content']
                                  if _sai_prods_pg_raw is mapping and 'result' in _sai_prods_pg_raw
                                     and _sai_prods_pg_raw['result']['content'] is sequence
                                  else [] -%}
                    {{ _pg | length }}
                  _sai_prod_map: >-
                    {%- set _pg = _sai_prods_pg_raw['result']['content']
                                  if _sai_prods_pg_raw is mapping and 'result' in _sai_prods_pg_raw
                                     and _sai_prods_pg_raw['result']['content'] is sequence
                                  else [] -%}
                    {%- set ns = namespace(m=_sai_prod_map) -%}
                    {%- for p in _pg -%}
                      {%- set ns.m = ns.m | combine({p.id | string: p.name}) -%}
                    {%- endfor -%}
                    {{ ns.m }}
                  _sai_prods_pg_offset: "{{ (_sai_prods_pg_offset | int) + 200 }}"
              - variables:
                  _sai_prods_pg_done: "{{ _sai_prods_pg_len | int < 200 }}"
        - variables:
            _sai_locations: "{{ [] }}"
        - repeat:
            for_each: "{{ _sai_area_locs }}"
            sequence:
            - action: script.zen_sutra_grocy
              response_variable: _sai_entries_raw
              continue_on_error: true
              data:
                action_type: read
                endpoint: /stock/locations/{{ repeat.item.id }}/entries
            - variables:
                _sai_products: >-
                  {%- set ns = namespace(seen={}) -%}
                  {%- for e in _sai_entries_raw['result']['content'] | default([], true) -%}
                    {%- set pid = e.product_id | string -%}
                    {%- if pid in ns.seen -%}
                      {%- set ns.seen = ns.seen | combine({pid: ns.seen[pid] + e.amount}) -%}
                    {%- else -%}
                      {%- set ns.seen = ns.seen | combine({pid: e.amount}) -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {%- set ns2 = namespace(out=[]) -%}
                  {%- for pid, amt in ns.seen.items() -%}
                    {%- set ns2.out = ns2.out + [{'product_id': pid | int, 'name': _sai_prod_map.get(pid, pid), 'amount': amt}] -%}
                  {%- endfor -%}
                  {{ ns2.out | sort(attribute='name') }}
            - variables:
                _sai_locations: >-
                  {%- if _sai_products | length > 0 -%}
                  {{ _sai_locations + [{
                    'id': repeat.item.id | int,
                    'name': repeat.item.name,
                    'subclass': repeat.item.subclass | default('', true),
                    'products': _sai_products
                  }] }}
                  {%- else -%}{{ _sai_locations }}{%- endif -%}
        - variables:
            final_response:
              status: success
              mode: stock_area_inventory
              area_id: "{{ _sai_area_id }}"
              locations: "{{ _sai_locations | sort(attribute='name') }}"
              total_locations: "{{ _sai_locations | length }}"
              total_locations_scanned: "{{ _sai_area_locs | length }}"
              total_products: "{{ _sai_locations | map(attribute='products') | sum(start=[]) | map(attribute='product_id') | list | count }}"
              tool: "{{ tool_name }}"
              version: "{{ tool_version }}"
        - stop: Area Inventory
          response_variable: final_response
    - variables:
        _perishable_storage_warn: false
        _cogs_zone_warn: false
        _cogs_coach_msg: "{{ none }}"
        _cogs_cost_basis_warn: false
        _cogs_zone_read_warn: false
        _cogs_undo_warn_msg: "{{ none }}"
    - alias: Post Purchase inventory on 'Buy'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'stock_buy_product'\n   and (report_inventory_norm
            | default(true))\n   and (product_id_resolved is not none) }}"
          alias: 'Buy: Post-purchase inventory report'
        sequence:
        - action: script.zen_sutra_grocy
          response_variable: post_entries
          data:
            action_type: read
            endpoint: /stock/products/{{ product_id_resolved }}/entries
        - variables:
            post_entries_list: "{{ post_entries['result']['content']\n   if post_entries is
              mapping and 'result' in post_entries\n   else [] }}"
            post_total_amount: "{{\n  (post_entries_list\n    | map(attribute='amount')\n
              \   | map('float')\n    | sum)\n  | default(0)\n}}"
            post_locations: "{{ post_entries_list | map(attribute='location_name') | unique | list }}"
            inventory_report: "{{\n  {\n    \"purchase\": {\n      \"item\": (item_norm if item_norm else (grocy_product.name if grocy_product is defined and grocy_product is mapping else none)),\n
              \     \"product_id\": product_id_resolved,\n      \"unit\": unit_norm,\n
              \     \"amount_added\": amt_in,\n      \"location\": (loc_norm if has_loc_name
              else none),\n      \"store\": (store_norm if has_store_name else none)\n
              \   },\n    \"result\": {\n      \"total_amount_now\": post_total_amount,\n
              \     \"locations_now\": post_locations,\n      \"humor\": (\n        \"There
              are now \" ~ (post_total_amount | string)\n        ~ \" \" ~ (item_norm if item_norm else (grocy_product.name if grocy_product is defined and grocy_product is mapping else 'item'))
              ~ \" in inventory, boss.\"\n      )\n    }\n  }\n}}"
    - alias: Perishable Storage Coach
      choose:
      - conditions:
        - condition: template
          value_template: >-
            {{ mode_norm in ['stock_buy_product', 'stock_add_purchase', 'stock_transfer_location']
               and grocy_product is mapping
               and (grocy_product.default_best_before_days | int(-999)) == -1
               and (location_id_resolved is not none or to_location_id_resolved is not none) }}
        sequence:
        - variables:
            _ps_dest_id: "{{ to_location_id_resolved if mode_norm == 'stock_transfer_location' else location_id_resolved }}"
        - action: script.zen_sutra_grocy
          response_variable: _ps_loc_raw
          continue_on_error: true
          data:
            action_type: read
            endpoint: "objects/locations/{{ _ps_dest_id }}"
        - variables:
            _ps_loc_content: >-
              {{ (_ps_loc_raw.get('result', {}).get('content') or {}) if _ps_loc_raw is mapping else {} }}
        - variables:
            _ps_catalog_class: >-
              {{ ((_ps_loc_content.get('userfields') or {}).get('catalog_class') or '') | string | trim }}
            _ps_parent_id: >-
              {{ ((_ps_loc_content.get('userfields') or {}).get('grocy_parent_location_id') or '') | string | trim }}
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _ps_catalog_class == 'non_perishable' }}"
            sequence:
            - variables:
                _perishable_storage_warn: false
          - conditions:
            - condition: template
              value_template: "{{ _ps_catalog_class != 'perishable_storage' and _ps_parent_id != '' }}"
            sequence:
            - action: script.zen_sutra_grocy
              response_variable: _ps_parent_raw
              continue_on_error: true
              data:
                action_type: read
                endpoint: "objects/locations/{{ _ps_parent_id }}"
            - variables:
                _ps_parent_class: >-
                  {{ (((_ps_parent_raw.get('result', {}).get('content') or {}).get('userfields') or {}).get('catalog_class') or '') | string | trim
                     if _ps_parent_raw is mapping else '' }}
                _perishable_storage_warn: "{{ _ps_parent_class == 'perishable_storage' }}"
        - variables:
            _perishable_storage_warn: >-
              {{ true if _ps_catalog_class == 'perishable_storage'
                 else (_perishable_storage_warn | default(false)) }}
    - alias: COGS Zone Coach
      choose:
      - conditions:
        - condition: template
          value_template: >-
            {{ mode_norm in ['stock_buy_product', 'stock_add_purchase', 'stock_transfer_location', 'stock_inventory_adjust']
               and product_id_resolved is not none
               and (location_id_resolved is not none or to_location_id_resolved is not none) }}
        sequence:
        - variables:
            _cz_dest_id: "{{ to_location_id_resolved if mode_norm == 'stock_transfer_location' else location_id_resolved }}"
        - action: script.zen_sutra_grocy
          response_variable: _cz_loc_raw
          continue_on_error: true
          data:
            action_type: read
            endpoint: "objects/locations/{{ _cz_dest_id }}"
        - variables:
            _cz_loc_content: >-
              {{ (_cz_loc_raw.get('result', {}).get('content') or {}) if _cz_loc_raw is mapping else {} }}
            _cz_catalog_class: >-
              {{ ((_cz_loc_content.get('userfields') or {}).get('catalog_class') or '') | string | trim }}
        - if:
          - condition: template
            value_template: "{{ _cz_catalog_class == 'cogs_zone' }}"
          then:
          - action: script.zen_sutra_grocy
            response_variable: _cz_prod_raw
            continue_on_error: true
            data:
              action_type: read
              endpoint: "objects/products/{{ product_id_resolved }}"
          - variables:
              _cz_prod_content: >-
                {{ (_cz_prod_raw.get('result', {}).get('content') or {}) if _cz_prod_raw is mapping else {} }}
              _cz_labels: >-
                {{ ((_cz_prod_content.get('userfields') or {}).get('ha_labels', '') | default('', true)) | string | regex_findall('[^,]+') | map('trim') | list }}
              _cogs_zone_warn: "{{ 'cogs_tracked' not in _cz_labels }}"
        - variables:
            _cogs_zone_warn: "{{ _cogs_zone_warn | default(false) }}"
    - alias: "COGS Read Coach — cost-basis + zone-tag consistency"
      choose:
      - conditions:
        - condition: template
          value_template: >-
            {{ mode_norm in ['stock_check_item', 'stock_where_is_item', 'stock_entries_for_item']
               and product_id_resolved is not none and not is_error }}
        sequence:
        - action: script.zen_sutra_grocy
          response_variable: _crc_prod_raw
          continue_on_error: true
          data:
            action_type: read
            endpoint: "/objects/products/{{ product_id_resolved }}"
        - action: script.zen_sutra_grocy
          response_variable: _crc_entries_raw
          continue_on_error: true
          data:
            action_type: read
            endpoint: "/stock/products/{{ product_id_resolved }}/entries"
        - variables:
            _crc_prod: >-
              {{ (_crc_prod_raw.get('result', {}).get('content') or {}) if _crc_prod_raw is mapping else {} }}
            _crc_labels: >-
              {{ ((_crc_prod.get('userfields') or {}).get('ha_labels', '') | default('', true)) | string | regex_findall('[^,]+') | map('trim') | list }}
            _crc_entries: >-
              {{ (_crc_entries_raw.get('result', {}).get('content') or []) if _crc_entries_raw is mapping else [] }}
        - variables:
            _crc_is_tracked: "{{ 'cogs_tracked' in _crc_labels }}"
        - variables:
            _cogs_cost_basis_warn: >-
              {{ _crc_is_tracked and _crc_entries | length > 0
                 and (_crc_entries | map(attribute='price') | map('float', 0) | select('gt', 0) | list | length == 0) }}
        - if:
          - condition: template
            value_template: "{{ not _crc_is_tracked and _crc_entries | length > 0 }}"
          then:
          - action: script.zen_sutra_grocy
            response_variable: _crc_all_locs_raw
            continue_on_error: true
            data:
              action_type: read
              endpoint: /objects/locations?limit=500&offset=0
          - variables:
              _crc_all_locs: >-
                {{ (_crc_all_locs_raw.get('result', {}).get('content') or []) if _crc_all_locs_raw is mapping else [] }}
              _crc_entry_loc_ids: >-
                {{ _crc_entries | map(attribute='location_id') | reject('none') | list | unique | list }}
          - variables:
              _cogs_zone_read_warn: >-
                {{ (_crc_all_locs
                    | selectattr('id', 'in', _crc_entry_loc_ids)
                    | map(attribute='userfields')
                    | select('mapping')
                    | selectattr('catalog_class', 'defined')
                    | selectattr('catalog_class', 'equalto', 'cogs_zone')
                    | list | length > 0) }}
      - conditions:
        - condition: template
          value_template: "{{ true }}"
        sequence:
        - variables:
            _cogs_cost_basis_warn: false
            _cogs_zone_read_warn: false
    - variables:
        _cogs_cost_basis_warn: "{{ _cogs_cost_basis_warn | default(false) }}"
        _cogs_zone_read_warn: "{{ _cogs_zone_read_warn | default(false) }}"
    - alias: "COGS Undo Coach — Firefly is not auto-reversed by stock_undo_booking"
      choose:
      - conditions:
        - condition: template
          value_template: >-
            {{ mode_norm == 'stock_undo_booking' and not is_error and booking_id_in is not none }}
        sequence:
        - action: script.zen_sutra_grocy
          response_variable: _cub_log_raw
          continue_on_error: true
          data:
            action_type: read
            endpoint: "/objects/stock_log/{{ booking_id_in }}"
        - variables:
            _cub_log: >-
              {{ (_cub_log_raw.get('result', {}).get('content') or {}) if _cub_log_raw is mapping else {} }}
            _cub_product_id: "{{ _cub_log.get('product_id') if _cub_log is mapping else none }}"
        - if:
          - condition: template
            value_template: "{{ _cub_product_id is not none }}"
          then:
          - action: script.zen_sutra_grocy
            response_variable: _cub_prod_raw
            continue_on_error: true
            data:
              action_type: read
              endpoint: "/objects/products/{{ _cub_product_id }}"
          - variables:
              _cub_prod: >-
                {{ (_cub_prod_raw.get('result', {}).get('content') or {}) if _cub_prod_raw is mapping else {} }}
              _cub_labels: >-
                {{ ((_cub_prod.get('userfields') or {}).get('ha_labels', '') | default('', true)) | string | regex_findall('[^,]+') | map('trim') | list }}
          - if:
            - condition: template
              value_template: "{{ 'cogs_tracked' in _cub_labels }}"
            then:
            - variables:
                _cogs_undo_warn_msg: >-
                  {{ "This was a cogs_tracked product — undoing Grocy stock does NOT auto-reverse any Firefly COGS transaction. If one was posted, find and reverse it: zen_dojotools_finance mode=run case=transactions_search tags=grocy_stock_entry:" ~ (booking_id_in | string) ~ ", then case=compensate firefly_transaction_id=<id> confirm=true." }}
    - variables:
        _cogs_undo_warn_msg: "{{ _cogs_undo_warn_msg | default(none) }}"
    - variables:
        grocy_result: "{% if grocy_response is mapping and 'result' in grocy_response
          %}\n  {{ grocy_response['result'] }}\n{% else %}\n  {{ none }}\n{% endif %}"
        content: >-
          {{ grocy_result["content"] if grocy_result is not none else [] }}
        filtered_result: "{% if mode_norm == 'catalog_find_product' %}\n  {% if product_matches
