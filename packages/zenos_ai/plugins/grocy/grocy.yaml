    sequence:
    - if: "{{ (mode | default('') | lower) == 'tool_manifest' }}"
      then:
      - variables:
          result: >-
            {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
            {{ MF.tool_manifest(
                tool='zen_dojotools_inventory',
                display_name='Inventory',
                tier='dojotools',
                version='5.2.0',
                health={'configured': true, 'status': 'ok', 'notes': []},
                required_labels=['grocy'],
                optional_labels=['grocy'],
                consumes=['grocy_request'],
                returns=['inventory_data'],
                modes={'help': 'help', 'manifest': 'tool_manifest', 'register': 'register'},
                icon='mdi:fridge-outline',
                color='green',
                stripe=3,
                impact='soft',
                mcp_exposed=true,

                caller_token=caller_token | default('')
            ) | from_json | combine({'register_mode': 'register', 'provider_key': 'inventory', 'lens_provider': true, 'lens_anchors': ['area_id'], 'lens_returns': ['player_hint']}) }}
      - stop: tool_manifest
        response_variable: result

    # ── Lens bus: register ────────────────────────────────────────────────────
    - if: "{{ (mode | default('') | lower) == 'register' }}"
      then:
      - variables:
          _inv_hh: "{{ states('sensor.zen_default_household_cabinet_resolved') }}"
      - action: script.zen_dojotools_filecabinet
        response_variable: _inv_reg_raw
        continue_on_error: true
        data:
          action_type: get
          volume_entity_id: "{{ _inv_hh }}"
          key: lens_registry
      - variables:
          _inv_registry: >-
            {%- set raw = _inv_reg_raw if _inv_reg_raw is mapping else {} -%}
            {%- set val = raw.get('value', {}) -%}
            {%- set parsed = val | from_json if val is string else val -%}
            {{ parsed if parsed is mapping else {} }}
          _inv_provider:
            consumes: [area_id]
            returns: [player_hint]
            script: script.zen_dojotools_inventory
            anchor_mode: by_anchor
            department: inventory
      - variables:
          _inv_merged: "{{ _inv_registry | combine({'inventory': _inv_provider}) }}"
      - action: script.zen_dojotools_filecabinet
        response_variable: _inv_reg_write
        continue_on_error: true
        data:
          action_type: update
          volume_entity_id: "{{ _inv_hh }}"
          key: lens_registry
          value: "{{ _inv_merged | tojson }}"
      - variables:
          result:
            status: "{{ 'success' if _inv_reg_write is mapping and _inv_reg_write.get('status', '') == 'success' else 'error' }}"
            mode: register
            provider: inventory
            registry_entry: "{{ _inv_provider }}"
      - stop: inventory register complete
        response_variable: result

    # ── Lens bus: unregister ──────────────────────────────────────────────────
    - if: "{{ (mode | default('') | lower) == 'unregister' }}"
      then:
      - variables:
          _inv_hh: "{{ states('sensor.zen_default_household_cabinet_resolved') }}"
      - action: script.zen_dojotools_filecabinet
        response_variable: _inv_unreg_raw
        continue_on_error: true
        data:
          mode: get
          cabinet: "{{ _inv_hh }}"
          key: lens_registry
      - variables:
          _inv_ureg: >-
            {%- set r = _inv_unreg_raw.get('value') if _inv_unreg_raw is mapping else none -%}
            {%- set r = r if r is mapping else (r | from_json(none) if r is string and r | trim != '' else none) -%}
            {{ r if r is mapping else {} }}
          _inv_removed: >-
            {%- set ns = namespace(d={}) -%}
            {%- for k, v in (_inv_ureg if _inv_ureg is mapping else {}).items() -%}
              {%- if k != 'inventory' -%}{%- set ns.d = ns.d | combine({k: v}) -%}{%- endif -%}
            {%- endfor -%}
            {{ ns.d }}
      - action: script.zen_dojotools_filecabinet
        continue_on_error: true
        data:
          mode: set
          cabinet: "{{ _inv_hh }}"
          key: lens_registry
          value: "{{ _inv_removed | tojson }}"
      - variables:
          result:
            status: ok
            mode: unregister
            provider: inventory
            message: Provider inventory removed from lens_registry.
      - stop: inventory unregister complete
        response_variable: result

    - variables:
        show_trace: '{{ show_trace | default(false) }}'
        tool_name: Zen DojoTools Inventory
        tool_version: 5.3.1
        schema_version: "1.3.0"
    # ─── CASE AUTHORING CHECKLIST ────────────────────────────────────────────────
    # When adding a new mode/case to this script, update ALL of the following:
    #  1. fields: mode: enum        — add the mode name to the selector options list
    #  2. cases: dict (help block)  — add entry with intent/needs/optional/does/note/example
    #  3. Endpoint block            — add elif branch: mode_norm == 'X' -> /path
    #  4. action_type block         — add to read/post/update/delete list as appropriate
    #  5. payload: block            — add elif branch if this mode needs a body
    #  6. Guards / choose branches  — add any required-field guards before the API call
    #  7. filtered_result template  — add elif branch if the response needs reshaping
    #  8. _meta / _ns.p paths       — update both payload-build paths if the case writes
    # Reminder: cases: dict feeds help_json automatically via combine — do NOT duplicate
    #
    # ⚠ CUSTOM-HANDLED MODES (choose-alias, no standard endpoint builder):
    #   These modes handle themselves via a choose alias and call stop before the API
    #   call step. They MUST be added to BOTH guard lists or they get NoneType errors:
    #     GUARD 1 (value_template with double-quotes, alias: Error: Endpoint not Resolved)
    #     GUARD 2 (value_template with single-quotes, alias: Call Grocy API)
    #   Search "Call Grocy API" to find both. Add mode to both on every new custom handler.
    # ─────────────────────────────────────────────────────────────────────────────
    - variables:
        grocy_response: {}
        mode_norm: '{{ (mode | default(''help'')) | string | lower }}'
        item_norm: '{{ (item | default('''')) ~ '''' | trim }}'
        unit_norm: "{{\n  (unit | default('each')) ~ ''\n  | trim\n  | lower\n}}"
        loc_norm: '{{ (location | default('''')) ~ '''' | trim }}'
        loc_sub_norm: '{{ ( location_subclass | default('''') ) }}'
        to_loc_norm: '{{ (to_location | default('''')) ~ '''' | trim }}'
        store_norm: '{{ (store | default('''')) ~ '''' | trim }}'
        report_inventory_norm: '{{ report_inventory | default(true) }}'
        parent_loc_norm: '{{ (parent_location | default('''')) ~ '''' | trim }}'
        parent_lid_in: '{{ parent_location_id | default(none) }}'
        area_id_norm: "{{ (homeassistant_area_id | default('', true) or area | default('', true)) | string | trim | lower }}"
        new_name_norm: '{{ (new_name | default('''')) ~ '''' | trim }}'
        placement_priority_in: '{{ placement_priority | default(none) }}'
        pid_keep_in: '{{ product_id_keep | default(none) }}'
        pid_remove_in: '{{ product_id_remove | default(none) }}'
        product_group_id_in: '{{ product_group_id | default(none) }}'
        move_on_open_in: "{{ move_on_open | default(none) }}"
        no_own_stock_in: "{{ no_own_stock | default(none) }}"
        due_days_after_open_in: "{{ due_days_after_open | default(none) }}"
        best_before_days_in: "{{ best_before_days | default(none) }}"
        uid_in: '{{ unit_id | default(none) }}'
        purchase_uid_in: '{{ purchase_unit_id | default(none) }}'
        pid_in: "{% set pid = product_id | default(none) %} {% if pid is not none %}\n
          \ {{ pid }}\n{% elif item is number %}\n  {{ item | int }}\n{% else %}\n  {{
          none }}\n{% endif %}"
        lid_in: "{% set lid = location_id | default(none) %}\n{% if lid is not none
          %}\n  {{ lid }}\n{% elif location is number %}\n  {{ location | int }}\n{%
          elif location is string and location | trim | regex_match('^\\\\d+$') %}\n
          \ {{ location | int }}\n{% else %}\n  {{ none }}\n{% endif %}"
        to_lid_in: "{% set lid = to_location_id | default(none) %}\n{% if lid is not
          none %}\n  {{ lid }}\n{% elif to_location is number %}\n  {{ to_location |
          int }}\n{% else %}\n  {{ none }}\n{% endif %}"
        to_unit_id_in: '{{ to_unit_id | default(none) }}'
        slid_in: '{{ shopping_location_id | default(none) }}'
        cid_in: '{{ chore_id | default(none) }}'
        tid_in: '{{ task_id | default(none) }}'
        amt_in: '{{ amount | default(1) | float(0) }}'
        price_in: '{{ price | default(none) }}'
        bbd_in: '{{ best_before_date | default(none) }}'
        purchase_date_in: "{{ (purchase_date | default('', true)) | string | trim }}"
        list_in: '{{ list_id | default(none) }}'
        note_in: '{{ note | default('''') | string | trim }}'
        payload_in: '{{ payload | default(none) }}'
        page_in: '{{ page | default(1) | int(1) }}'
        per_page_in: '{{ per_page | default(25) | int(25) }}'
        confirm_action_in: '{{ confirm_action | default(false) | bool }}'
        hazmat_class_in: '{{ hazmat_class | default(none, true) }}'
        dry_run_in: '{{ dry_run | default(false) | bool }}'
        parent_product_id_in: '{{ parent_product_id | default(none) }}'
        parent_product_norm: '{{ (parent_product | default('''')) ~ '''' | trim }}'
        has_parent_product_name: '{{ parent_product_norm is string and parent_product_norm | length > 0 }}'
        has_item_name: '{{ item_norm is string and item_norm | length > 0 }}'
        has_loc_name: '{{ loc_norm is string and loc_norm | length > 0 }}'
        has_to_loc_name: '{{ to_loc_norm is string and to_loc_norm | length > 0 }}'
        has_parent_loc_name: '{{ parent_loc_norm is string and parent_loc_norm | length
          > 0 }}'
        has_new_name: '{{ new_name_norm is string and new_name_norm | length > 0 }}'
        has_area_id: '{{ area_id_norm is string and area_id_norm | length > 0 }}'
        has_loc_subclass: '{{ loc_sub_norm is string and loc_sub_norm | length > 0 }}'
        catalog_class_in: "{{ (catalog_class | default('', true)) | string | trim }}"
        has_catalog_class: "{{ (catalog_class | default('', true)) | string | trim | length > 0 }}"
        has_store_name: '{{ store_norm is string and store_norm | length > 0 }}'
        has_unit_name: '{{ unit_norm is string and unit_norm | length > 0 }}'
        has_note: '{{ note_in is string and note_in | length > 0 }}'
        has_brand: '{{ brand is string and brand | length > 0 }}'
        has_sku: '{{ sku is string and sku | length > 0 }}'
        barcode_norm: '{{ (barcode | default("")) | string | trim }}'
        recipe_id_in: '{{ recipe_id | default(none) }}'
        entry_id_in: '{{ entry_id | default(none) }}'
        execution_id_in: '{{ execution_id | default(none) }}'
        booking_id_in: '{{ booking_id | default(none) }}'
        battery_id_in: '{{ battery_id | default(none) }}'
        done_only_in: '{{ done_only | default(false) }}'
        has_barcode: '{{ (barcode | default("") | string | trim) | length > 0 }}'
        has_explicit_amount: '{{ amount is defined and amount is not none }}'
        recipe_id_resolved: '{{ recipe_id | default(none) }}'
        child_lids_in: '{{ child_location_ids | default("[]") }}'
        orphan_to_lid_in: '{{ orphan_to | default(none) }}'
        bom_in: '{{ bom | default(none, true) }}'
    - variables:
        cases:
          catalog_list_products:
            intent: List all products (catalog).
            needs: []
            does: GET /objects/products
            paging:
              required: true
              default:
                pageNumber: 1
                perPage: 25
            example: "{'mode':'catalog_list_products','per_page':25}"
          catalog_find_product:
            intent: Find a product by name (catalog lookup).
            needs:
            - item
            does: GET /objects/products + local name match
            example: "{'mode':'catalog_find_product','item':'coffee'}"
          catalog_add_product:
            intent: Create a 0-stock catalog entry for a product not yet owned.
            needs:
            - item
            - location OR location_id
            - unit OR unit_id (REQUIRED — omitting leaves qu_id_stock null, blocking all stock operations)
            optional:
            - sku
            - brand
            - note
            - confirm_action (bypass dupe guard)
            does: GET dupe-check + POST /objects/products
            example: "{'mode':'catalog_add_product','item':'Roborock HEPA Filter','location_id':80,'unit':'each','sku':'8.02.0104','brand':'Roborock'}"
          provision_bom:
            intent: Idempotent BOM provisioner — catalog + meta + labels + chores + stock seed for a set of parts.
            needs:
            - bom (JSON string with parts array)
            - confirm_action=true
            optional:
            - bom.robot_name, bom.storage_location_id, bom.ha_labels, bom.chore_ha_labels, bom.reseed
            - bom.parts[].product_id — pin to existing Grocy product ID; skips name-lookup entirely (for programmatic callers only — never hardcode in preset files)
            does: Per-part — unit resolve, resolve product (caller-pin → exact name → same-location+ha_labels-root fallback), create/reuse, update meta, tag, find/create chore, tag, seed stock. ha_labels in BOM root is REQUIRED for products to appear in zen_dojotools_plant mode=managed — omitting it makes the machine invisible.
            example: "{'mode':'provision_bom','bom':'{\"parts\":[{\"key\":\"main_brush\",\"name\":\"Roborock S7 MaxV Ultra - Main Brush\",\"unit\":\"each\",\"product_id\":548,\"storage_location_id\":451,\"consume_location_id\":387,\"chore_name\":\"Rosie - Replace Main Brush\",\"chore_period_days\":180}]}','confirm_action':true}"
          catalog_import_bom:
            intent: Bulk-import a list of products (books, tools, any catalog items) — idempotent create + userfield tag in one call. No chores, no stock. Use for bulk cataloguing from visual scans or structured lists.
            needs:
            - bom (JSON string — see schema below)
            - confirm_action=true
            schema: "{'default_location_id':109,'default_ha_labels':'book','default_asset_type':'book','default_unit':'each','items':[{'name':'Title','location_id':109,'ha_labels':'book','asset_type':'book','book_author':'Last, First','book_isbn':'...','book_series':'Series #N','book_genre':'fantasy'}]}"
            optional_item_keys: name, location_id (inherits default), ha_labels (inherits default), asset_type (inherits default), book_author, book_isbn, book_series, book_genre, note, unit (inherits default)
            does: Per-item — name-lookup (idempotent), create if missing, PUT /userfields/products/{id} with all provided book fields + ha_labels + asset_type. Returns per-item status (created|existing|failed) + summary counts.
            example: "{'mode':'catalog_import_bom','bom':'{\"default_location_id\":109,\"default_ha_labels\":\"book\",\"items\":[{\"name\":\"Fahrenheit 451\",\"book_author\":\"Bradbury, Ray\",\"book_genre\":\"sci-fi\"}]}','confirm_action':true}"
          catalog_delete_product:
            intent: Delete a product. Stock guard + parent guard — offer merge/reparent or confirm to override.
            needs:
            - item OR product_id
            optional:
            - product_id_keep (merge stock into this product instead of blocking stock guard)
            - confirm_action (override both guards — discards stock AND orphans children)
            does: "GET stock check → merge/guard; GET children check → parent_guard; else DELETE"
            notes:
            - "stock_guard fires when product has stock and no product_id_keep"
            - "parent_guard fires when product has child products (varietals/brands under it)"
            - "confirm_action=true bypasses both guards — use only when you understand the consequences"
            example: "{'mode':'catalog_delete_product','product_id':401,'product_id_keep':411}"
          catalog_audit:
            intent: Full product health scan. Surfaces orphaned children, unlabelled products, products with no HA area, no default location, and no stock unit. Run after bulk imports or to find invisible products.
            needs: []
            reads: GET /objects/products (all)
            returns:
              orphaned_children: products whose parent_product_id points to a deleted product
              no_labels: products with no ha_labels (invisible to plant/tag queries)
              no_area: products with no homeassistant_area (no spatial context)
              no_location: products with no default storage location
              no_unit: products with no qu_id_stock (stock operations will fail)
            example: "{'mode':'catalog_audit'}"
          get_product_meta:
            intent: Retrieve canonical product metadata.
            needs:
            - item OR product_id
            does: GET /objects/products/{productId}
            example: "{'mode':'get_product_meta','item':'coffee'}"
          rename_product:
            intent: Rename a product (display name only).
            needs:
            - item OR product_id
            - new_name
            does: PUT /objects/products/{productId}
            notes:
            - Product ID remains stable
            - Stock and history are unaffected
            example: "{'mode':'rename_product','item':'coffee','new_name':'Whole Bean Coffee'}"
          update_product_meta:
            intent: Update declarative product metadata. unit_id sets qu_id_stock+consume (purchase unit preserved unless purchase_unit_id given). purchase_unit_id requires a global QU conversion to exist.
            needs:
            - item OR product_id
            optional:
            - note
            - unit OR unit_id
            - purchase_unit_id (separate purchase unit; requires global QU conversion to stock unit)
            - amount (sets min_stock_amount)
            - shopping_location_id (sets preferred store/shopping location)
            - to_location_id (sets default_consume_location_id — where item is consumed from by default)
            - product_group_id (sets product group/category)
            - move_on_open (bool — stock_open_item auto-moves to default_consume_location)
            - due_days_after_open (int — best_before = open_date + N days, e.g. 180 for a 6-month filter)
            - best_before_days (int — default days from purchase to best-before; -1 = never expires)
            does: PUT /objects/products/{productId}
            supported_fields:
            - description
            - note
            - brand (stored in description if present)
            - sku (stored in description if present)
            - unit/unit_id (sets qu_id_stock, qu_id_consume; also qu_id_purchase unless purchase_unit_id given)
            - purchase_unit_id (optional — separate purchase unit; requires global QU conversion to stock unit)
            - amount (sets min_stock_amount — warning threshold)
            - shopping_location_id (preferred shopping/store location)
            - to_location_id (sets default_consume_location_id)
            - product_group_id (product category group ID — use product_groups_list to find IDs)
            - best_before_days (-1 = never expires; use for non-perishables like paper goods, batteries, cleaning supplies)
            - due_days_after_open (days until best_before after opening — for filters, open bags, etc.)
            expiry_semantics:
              best_before_days=-1: product never expires — no best_before date set on purchase; never appears in volatile/overdue
              best_before_days=0: best_before set to purchase date (expires immediately — rarely useful)
              best_before_days=N: best_before = purchase_date + N days
              due_days_after_open=N: when stock_open_item is called, stamps best_before = open_date + N days
            constraints:
            - No stock semantics are modified
            - description only sent when note/brand/sku provided
            - purchase_unit_id != unit_id requires global QU conversion — run unit_conversions_list first
            - setting unit_id alone preserves existing qu_id_purchase (no self-referential conversion)
            - CANNOT update unit_id if product has null qu_id_stock — delete and recreate instead
            examples:
            - "{'mode':'update_product_meta','item':'pH Up','unit_id':4,'purchase_unit_id':18}"
            - "{'mode':'update_product_meta','item':'Toilet Paper','best_before_days':-1}"
            - "{'mode':'update_product_meta','item':'HVAC Filter','due_days_after_open':90,'move_on_open':true}"
          set_default_location_for_product:
            intent: Set the default storage location for new purchases.
            needs:
            - item OR product_id
            - location OR location_id
            does: PUT /objects/products/{productId}
            example: "{'mode':'set_default_location_for_product','item':'coffee','location':'Pantry'}"
          products_merge:
            intent: Merge two products into one canonical product.
            needs:
            - product_id_keep
            - product_id_remove
            does: POST /stock/products/{productIdToKeep}/merge/{productIdToRemove}
            notes:
            - Moves all stock, history, and references
            - Removes the source product
            - This action is irreversible
            example: "{'mode':'products_merge','product_id_keep':42,'product_id_remove':99}"
          resolve_products_by_ids:
            intent: 'Internal: resolve product IDs to names'
            needs:
            - product_ids
            internal: true
            does: GET /objects/products/{productId}
            example: "internal — not for direct use"
          stock_list_by_location:
            intent: What is in a location.
            needs:
            - location OR location_id
            does: GET /stock/locations/{locationId}/entries
            example: "{'mode':'stock_list_by_location','location':'Pantry'}"
          stock_check_item:
            intent: Do we have the item.
            needs:
            - item OR product_id
            does: GET /stock/products/{productId}/entries
            example: "{'mode':'stock_check_item','item':'coffee'}"
          stock_where_is_item:
            intent: Where is the item stored. NOTE - returns identical data to stock_check_item. Prefer stock_check_item to avoid a redundant call.
            needs:
            - item OR product_id
            does: GET /stock/products/{productId}/locations
            example: "{'mode':'stock_check_item','item':'coffee'}"
          stock_entries_for_item:
            intent: Detailed stock entries for an item.
            needs:
            - item OR product_id
            does: GET /stock/products/{productId}/entries
            example: "{'mode':'stock_entries_for_item','item':'coffee'}"
          stock_add_purchase:
            intent: Purchase into inventory.
            needs:
            - item OR product_id
            does: POST /stock/products/{productId}/add
            example: "{'mode':'stock_add_purchase','item':'coffee','amount':2,'location':'Pantry'}"
          stock_buy_product:
            intent: Create product if missing, then purchase into inventory.
            needs:
            - item OR product_id
            does: POST /objects/products (optional) + POST /stock/products/{productId}/add
            example: "{'mode':'stock_buy_product','item':'coffee','amount':1,'location':'Pantry'}"
          stock_consume:
            intent: Consume from stock.
            needs:
            - item OR product_id
            does: POST /stock/products/{productId}/consume
            example: "{'mode':'stock_consume','item':'coffee','amount':1}"
          stock_inventory_adjust:
            intent: Reconcile inventory to a measured total.
            needs:
            - item OR product_id
            - amount
            does: POST /stock/products/{productId}/inventory
            example: "{'mode':'stock_inventory_adjust','item':'coffee','amount':5}"
          stock_transfer_location:
            intent: Move item between locations.
            needs:
            - item OR product_id
            - location OR location_id
            - to_location OR to_location_id
            does: POST /stock/products/{productId}/transfer
            example: "{'mode':'stock_transfer_location','item':'coffee','location':'Pantry','to_location':'Kitchen'}"
          shopping_add_missing:
            intent: Add items below min stock to shopping list.
            needs:
            - optional list_id
            does: POST /stock/shoppinglist/add-missing-products
            example: "{'mode':'shopping_add_missing'}"
          shopping_add_overdue:
            intent: Add overdue products to shopping list.
            needs:
            - optional list_id
            does: POST /stock/shoppinglist/add-overdue-products
            example: "{'mode':'shopping_add_overdue'}"
          shopping_add_expired:
            intent: Add expired products to shopping list.
            needs:
            - optional list_id
            does: POST /stock/shoppinglist/add-expired-products
            example: "{'mode':'shopping_add_expired'}"
          chores_add:
            intent: Create a new Grocy chore, optionally linked to a product consumed on execution.
            needs: [item]
            optional: [note, product_id, product_amount, period_type, period_days]
            does: POST /objects/chores
            example: "{'mode':'chores_add','item':'Replace waste basket liner','product_id':387,'product_amount':1,'period_days':7}"
          chores_tag:
            intent: Set homeassistant_area and/or entity_id userfields on an existing chore. Required for chores_by_area and room_brief area discovery.
            needs: [chore_id OR item]
            optional: [homeassistant_area_id, homeassistant_entity_id]
            does: PUT /userfields/chores/{choreId}
            example: "{'mode':'chores_tag','item':'Lawn Tractor Oil Change','homeassistant_area_id':'garage'}"
          products_tag:
            intent: Set ZenOS userfields on a product — zen_safety_type, zen_asset_type, hazmat_class, homeassistant_area, ha_labels. Required to make products discoverable by emergency mode, inventory area queries, object_lens label lookups, and zen_dojotools_plant mode=managed. ha_labels is the ONLY mechanism that makes a product visible to Plant — a product without it is invisible to mode=managed regardless of location or chores.
            needs: [item OR product_id]
            optional: [safety_type, asset_type, hazmat_class, homeassistant_area_id, ha_labels]
            does: PUT /userfields/products/{productId}
            example: "{'mode':'products_tag','product_id':531,'safety_type':'fire_extinguisher','ha_labels':'fire_safety,garage'}"
          chores_delete:
            intent: Delete a Grocy chore by name or chore_id.
            needs: [chore_id OR item]
            does: GET /objects/chores/{id} (confirm) → DELETE /objects/chores/{id}
            example: "{'mode':'chores_delete','item':'Clean litter box'}"
          chores_edit:
            intent: Edit an existing chore. Pass only fields to change; others are preserved.
            needs: [chore_id OR item]
            optional: [new_name, period_type, period_days, product_id, product_amount, note, active]
            does: GET /objects/chores/{id} → merge overrides → PUT /objects/chores/{id}
            example: "{'mode':'chores_edit','item':'Replace waste basket liner','period_days':14,'new_name':'Replace liner'}"
          stock_area_inventory:
            intent: Full denormalized room view — all locations with product names and amounts. One call replaces N location + M product lookups.
            needs: [homeassistant_area_id]
            optional: []
            does: GET locations (area filter) + GET stock entries per location + GET all products (joined locally)
            example: "{'mode':'stock_area_inventory','homeassistant_area_id':'powder_room'}"
          chores_list:
            intent: List all chores.
            needs: []
            does: GET /objects/chores
            example: "{'mode':'chores_list'}"
          chores_find:
            intent: Find chores by name.
            needs:
            - item
            does: GET /objects/chores + local name match
            example: "{'mode':'chores_find','item':'kitchen'}"
          chores_execute:
            intent: Execute a chore.
            needs:
            - chore_id OR item
            does: POST /chores/{choreId}/execute
            example: "{'mode':'chores_execute','item':'Clean litter box'}"
          tasks_list:
            intent: List all tasks.
            needs: []
            does: GET /objects/tasks
            example: "{'mode':'tasks_list'}"
          tasks_find:
            intent: Find tasks by name.
            needs:
            - item
            does: GET /objects/tasks + local name match
            example: "{'mode':'tasks_find','item':'grocery'}"
          tasks_complete:
            intent: Complete a task.
            needs:
            - task_id OR item
            does: POST /tasks/{taskId}/complete
            example: "{'mode':'tasks_complete','item':'Buy groceries'}"
          locations_add:
            intent: Create a new Grocy location. Dupe-guards similar names; add confirm_action true to bypass.
            needs:
            - location
            optional:
            - parent_location
            - parent_location_id
            - location_subclass
            - area_id
            - placement_priority
            - confirm_action
            does:
            - POST /objects/locations
            - PUT /userfields/locations/{locationId} (if metadata provided)
            example: "{'mode':'locations_add','location':'Coffee Drawer','parent_location':'Kitchen','location_subclass':'drawer'}"
          locations_list:
            intent: List all locations.
            needs: []
            does: GET /objects/locations
            example: "{'mode':'locations_list'}"
          locations_find:
            intent: Find locations by name and/or parent anchor. parent_location_id alone lists all containers in a room.
            needs:
            - location (optional — name search)
            - parent_location_id (optional — filter to children of this anchor)
            does: GET /objects/locations + local filter
            example: "{'mode':'locations_find','parent_location_id':15}"
          locations_rename:
            intent: Rename a Grocy location.
            needs:
            - location OR location_id
            - new_name
            does: PUT /objects/locations/{locationId}
            example: "{'mode':'locations_rename','location':'Coffee Drawer','new_name':'Coffee Station'}"
          locations_update_description:
            intent: Update the description field of an existing Grocy location.
            needs:
            - location OR location_id
            - note (new description text)
            does: PUT /objects/locations/{locationId}
            example: "{'mode':'locations_update_description','location_id':276,'note':'Hazmat/MSDS — paint and household chemicals'}"
          locations_get_by_area:
            intent: Reverse lookup — find the Grocy location anchored to a given HA area_id. Returns the room anchor and any tagged children.
            needs:
            - homeassistant_area_id
            does: GET /objects/locations + filter by userfields.homeassistant_area (case-insensitive)
            example: "{'mode':'locations_get_by_area','homeassistant_area_id':'garage'}"
          locations_metadata_set:
            intent: Set governed semantic metadata for a location.
            needs:
            - location OR location_id
            - at least one of parent_location, parent_location_id, location_subclass,
              area_id, placement_priority, note, ha_labels, catalog_class
            does: PUT /userfields/locations/{locationId}
            catalog_class_values:
              __intake__: global catalog intake location (triggers intake semaphore in KFC)
              perishable_storage: location holds perishable items (fridge, pantry, freezer) — triggers best_before coaching when buying/moving a never-expires product here. Children inherit via parent walk.
              non_perishable: explicit override — suppresses perishable_storage inheritance from parent. Use on sub-locations inside a perishable parent that don't hold food (e.g. fridge filter slots, wine racks inside pantry).
            examples:
            - "{'mode':'locations_metadata_set','location':'Left Twin Bookcase','ha_labels':'bookshelf','area_id':'living_room'}"
            - "{'mode':'locations_metadata_set','location':'Refrigerator','catalog_class':'perishable_storage'}"
            - "{'mode':'locations_metadata_set','location':'Pantry','catalog_class':'perishable_storage'}"
            - "{'mode':'locations_metadata_set','location':'Kitchen Refrigerator - Water Filter Slot','catalog_class':'non_perishable'}"
          locations_delete:
            intent: Permanently delete a Grocy location. Only call when the location has no stock.
            needs:
            - location_id
            does: DELETE /objects/locations/{locationId}
            example: "{'mode':'locations_delete','location_id':261}"
          units_list:
            intent: List all quantity units.
            needs: []
            does: GET /objects/quantity_units
            example: "{'mode':'units_list'}"
          units_find:
            intent: Find a quantity unit by exact name.
            needs:
            - unit
            does: GET /objects/quantity_units + exact local name match
            example: "{'mode':'units_find','unit':'each'}"
          units_add:
            intent: Create a new quantity unit. Idempotent — returns existing unit if name already found.
            needs:
            - unit
            optional:
            - note
            does: GET /objects/quantity_units + POST if not found
            constraints:
            - No fuzzy creation
            - Returns already_exists status if unit found (not an error)
            example: "{'mode':'units_add','unit':'can','note':'Standard grocery can'}"
          units_update:
            intent: Update an existing quantity unit.
            needs:
            - unit_id
            optional:
            - unit
            - note
            does: PUT /objects/quantity_units/{unitId}
            constraints:
            - unit_id is required
            - Renames must differ from current name
            example: "{'mode':'units_update','unit_id':5,'unit':'each'}"
          unit_conversions_add:
            intent: Add a QU conversion between two units (required before changing qu_id_stock on a product with stock).
            needs:
            - unit_id
            - to_location_id
            - amount
            optional:
            - product_id
            does: POST /objects/quantity_unit_conversions
            note: unit_id=from_qu_id, to_unit_id=to_qu_id, amount=factor; to_location_id still accepted as fallback
            example: "{'mode':'unit_conversions_add','unit_id':47,'to_unit_id':70,'amount':1}"
          unit_conversions_list:
            intent: List QU conversions. Optionally filter by unit_id (matches from OR to) or product_id.
            needs: []
            optional:
            - unit_id
            - product_id
            does: GET /objects/quantity_unit_conversions
            note: Use before unit_conversions_add to avoid duplicates. Use to audit orphaned conversions.
            example: "{'mode':'unit_conversions_list','unit_id':18}"
          unit_conversions_delete:
            intent: Delete a QU conversion by its row ID. Get IDs via unit_conversions_list.
            needs:
            - entry_id
            does: DELETE /objects/quantity_unit_conversions/{id}
            note: entry_id here is the conversion row ID from unit_conversions_list (not a stock entry ID).
            example: "{'mode':'unit_conversions_delete','entry_id':5}"
          shopping_add_product:
            intent: Add a specific product to a shopping list.
            needs:
            - item OR product_id
            optional:
            - amount
            - list_id
            does: POST /stock/shoppinglist/add-product
            example: "{'mode':'shopping_add_product','item':'coffee','amount':2}"
          shopping_remove_product:
            intent: Remove a specific product from a shopping list.
            needs:
            - item OR product_id
            optional:
            - amount
            - list_id
            does: POST /stock/shoppinglist/remove-product
            example: "{'mode':'shopping_remove_product','item':'coffee'}"
          shopping_clear_list:
            intent: Clear a shopping list (all or done-only).
            needs: []
            optional:
            - list_id
            - done_only
            does: POST /stock/shoppinglist/clear
            example: "{'mode':'shopping_clear_list'}"
          shopping_lists_list:
            intent: List all Grocy shopping lists with IDs and names. Use to find list_id values for cross-system linking.
            needs: []
            does: GET /objects/shopping_lists
            example: "{'mode':'shopping_lists_list'}"
          shopping_locations_list:
            intent: List all Grocy shopping locations (stores) with IDs, names, and crm_company_id. Use to find shopping_location_id values for vendor linking.
            needs: []
            does: GET /objects/shopping_locations
            example: "{'mode':'shopping_locations_list'}"
          recipes_list:
            intent: List all Grocy recipes.
            needs: []
            does: GET /objects/recipes
            paging:
              required: true
              default:
                pageNumber: 1
                perPage: 25
            example: "{'mode':'recipes_list'}"
          recipes_fulfillment:
            intent: What recipes can I make with current stock?
            needs: []
            does: GET /recipes/fulfillment
            example: "{'mode':'recipes_fulfillment'}"
          recipe_check_fulfillment:
            intent: Can I make a specific recipe with current stock?
            needs:
            - item OR recipe_id
            does: GET /recipes/{recipeId}/fulfillment
            example: "{'mode':'recipe_check_fulfillment','item':'House Blend Coffee'}"
          recipes_add_to_shopping:
            intent: Add missing recipe ingredients to a shopping list.
            needs:
            - item OR recipe_id
            optional:
            - list_id
            does: POST /recipes/{recipeId}/add-not-fulfilled-products-to-shoppinglist
            example: "{'mode':'recipes_add_to_shopping','item':'House Blend Coffee'}"
          recipes_consume:
            intent: Mark a recipe as made — consumes ingredients from stock.
            needs:
            - item OR recipe_id
            does: POST /recipes/{recipeId}/consume
            example: "{'mode':'recipes_consume','item':'House Blend Coffee'}"
          recipes_copy:
            intent: Duplicate a recipe.
            needs:
            - item OR recipe_id
            does: POST /recipes/{recipeId}/copy
            example: "{'mode':'recipes_copy','item':'House Blend Coffee'}"
          stock_overview:
            intent: Overview of all products currently in stock.
            needs: []
            does: GET /objects/stock
            paging:
              required: true
              default:
                pageNumber: 1
                perPage: 25
            example: "{'mode':'stock_overview','per_page':25}"
          stock_list_volatile:
            intent: List products that are due soon, overdue, or expired.
            needs: []
            does: GET /stock/volatile
            example: "{'mode':'stock_list_volatile'}"
          stock_get_product_details:
            intent: Get stock-context details for a product (amount, value, best_before).
            needs:
            - item OR product_id
            does: GET /stock/products/{productId}
            example: "{'mode':'stock_get_product_details','item':'coffee'}"
          stock_open_item:
            intent: Mark a product as opened.
            needs:
            - item OR product_id
            optional:
            - amount
            - best_before_date
            does: POST /stock/products/{productId}/open
            example: "{'mode':'stock_open_item','item':'coffee'}"
          stock_entry_update:
            intent: Edit a specific stock entry — pass only the fields to change.
            needs:
            - entry_id
            - item OR product_id
            optional:
            - amount
            - best_before_date
            - location
            - price
            - note
            does: PUT /stock/entry/{entryId}
            notes:
            - Get entry_id via stock_entries_for_item
            - Reads current entry first then merges your changes (safe partial update)
            example: "{'mode':'stock_entry_update','item':'House Blend Coffee','entry_id':42,'best_before_date':'2026-12-31'}"
          stock_undo_booking:
            intent: Undo a stock booking by booking ID.
            needs:
            - booking_id
            does: POST /stock/bookings/{bookingId}/undo
            example: "{'mode':'stock_undo_booking','booking_id':524}"
          tasks_undo:
            intent: Undo a completed task.
            needs:
            - item OR task_id
            does: POST /tasks/{taskId}/undo
            example: "{'mode':'tasks_undo','item':'Buy groceries'}"
          tasks_add:
            intent: Create a new Grocy task.
            needs: [item]
            optional: [note, best_before_date, homeassistant_area_id]
            does: POST /objects/tasks
            example: "{'mode':'tasks_add','item':'Check front tires','note':'Needs diagnosis + parts before repair'}"
          tasks_tag:
            intent: Set homeassistant_area userfield on an existing task.
            needs: [task_id OR item]
            optional: [homeassistant_area_id]
            does: PUT /userfields/tasks/{taskId}
            example: "{'mode':'tasks_tag','item':'Check front tires','homeassistant_area_id':'garage'}"
          chores_undo:
            intent: Undo a chore execution by execution ID.
            needs:
            - execution_id
            does: POST /chores/executions/{executionId}/undo
            notes:
            - execution_id is required (not chore_id)
            example: "{'mode':'chores_undo','execution_id':42}"
          catalog_find_by_barcode:
            intent: Find a product by barcode.
            needs:
            - barcode
            does: GET /stock/products/by-barcode/{barcode}
            example: "{'mode':'catalog_find_by_barcode','barcode':'012345678901'}"
          stock_add_by_barcode:
            intent: Purchase a product into stock using a barcode.
            needs:
            - barcode
            optional:
            - amount
            - location
            - price
            - best_before_date
            does: POST /stock/products/by-barcode/{barcode}/add
            example: "{'mode':'stock_add_by_barcode','barcode':'012345678901','amount':2}"
          stock_consume_by_barcode:
            intent: Consume a product from stock using a barcode.
            needs:
            - barcode
            optional:
            - amount
            does: POST /stock/products/by-barcode/{barcode}/consume
            example: "{'mode':'stock_consume_by_barcode','barcode':'012345678901'}"
          batteries_list:
            intent: List all tracked rechargeable batteries.
            needs: []
            does: GET /batteries
            example: "{'mode':'batteries_list'}"
          batteries_get:
            intent: Get details for a specific rechargeable battery.
            needs:
            - battery_id
            does: GET /batteries/{batteryId}
            example: "{'mode':'batteries_get','battery_id':1}"
          product_groups_list:
            intent: List all Grocy product groups.
            needs: []
            does: GET /objects/product_groups
            example: "{'mode':'product_groups_list'}"
          catalog_find_by_tag:
            intent: Find products by tag. Searches both ZenOS userfield ha_labels AND Grocy native product tags. Filters zen_safety_type, zen_asset_type, and/or ha_labels in-template.
            needs: []
            optional: [safety_type (filter by zen_safety_type), asset_type (filter by zen_asset_type), homeassistant_area_id (filter by product homeassistant_area userfield), ha_labels (filter by tag slug — matches ha_labels userfield OR native Grocy product tags, single slug or CSV)]
            reads: GET /objects/products (limit=600)
            notes:
              - Returns slim list — id, name, zen_safety_type, zen_asset_type, hazmat_class, homeassistant_area, ha_labels, native_tags, location_id
              - Omit all filters to get all tagged products (any zen_safety_type, zen_asset_type, ha_labels, or native tags set)
              - Native Grocy product tags and ha_labels userfield are merged for all tag filtering
          bulk_stock_add:
            intent: Add stock (purchase) for a BOM list of products. Resolves names with exact+fuzzy fallback.
            needs: [bom, confirm_action=true]
            optional: [amount (default 1), location, location_id, price, best_before_date]
            does: POST /stock/products/{id}/add for each item in bom
            example: "{'mode':'bulk_stock_add','bom':'[{name:Halo The Flood}]','amount':1,'confirm_action':true}"
          bulk_tag:
            intent: Apply userfield tags (ha_labels, asset_type, book fields, etc.) to a BOM list of products. Resolves names with exact then fuzzy fallback.
            needs: [bom, confirm_action=true]
            optional: [ha_labels, asset_type, safety_type, homeassistant_area_id, book_author, book_isbn, book_series, book_genre]
            does: PUT /userfields/products/{id} for each item in bom
            example: "{'mode':'bulk_tag','bom':'[{\"name\":\"Halo: The Flood\"}]','ha_labels':'book','book_series':'Halo','confirm_action':true}"
          bulk_label_add:
            intent: Append label slug(s) to ha_labels on a BOM list without overwriting existing labels.
            needs: [bom, ha_labels (slugs to add), confirm_action=true]
            optional: []
            does: GET /userfields/products/{id} + merge + PUT /userfields/products/{id} per item
            example: "{'mode':'bulk_label_add','bom':'[{name:Halo The Flood}]','ha_labels':'reading-list','confirm_action':true}"
          bulk_label_remove:
            intent: Remove label slug(s) from ha_labels on a BOM list without touching other labels.
            needs: [bom, ha_labels (slugs to remove), confirm_action=true]
            optional: []
            does: GET /userfields/products/{id} + filter + PUT /userfields/products/{id} per item
            example: "{'mode':'bulk_label_remove','bom':'[{name:Halo The Flood}]','ha_labels':'reading-list','confirm_action':true}"
          bulk_location_move:
            intent: Set the default storage location on a BOM list of products. Resolves names with exact then fuzzy fallback.
            needs: [bom, location OR location_id, confirm_action=true]
            optional: []
            does: GET /objects/products/{id} + PUT /objects/products/{id} with new location_id for each item
            example: "{'mode':'bulk_location_move','bom':'[{\"name\":\"Halo: The Flood\"}]','location':'Office Bookshelf','confirm_action':true}"
          catalog_search:
            intent: Unified product search — tries name match AND tag match in one call. Returns merged deduplicated results. Use when you don't know whether the query is a product name, tag, or alias.
            needs: [item (search query)]
            optional: []
            reads: GET /objects/products (one call, filtered two ways)
            notes:
              - match_source field on each result — name | tag | both
              - name match — case-insensitive substring on product name
              - tag match — case-insensitive substring match on ha_labels + native tags; "printer" finds the printer tag, "epson" finds epson products
              - START HERE for inventory search — name OR tag in one call; run catalog_detail after to get full product details
          object_lens:
            intent: Assemble complete operational object for a product — identity, stock (installed vs spares), maintenance chore, safety, context, actions. One call replaces 5+ manual joins. Use after catalog_find_by_tag, catalog_search, or catalog_find_product to get the full picture.
            needs: [item OR product_id OR homeassistant_area_id]
            optional: []
            reads: stock/products/{id} + userfields + entries + chores + location (product lens); objects/products + objects/chores filtered by area/ha_labels (place lens)
            returns: "product lens — {object{status}, identity, context{room,container}, stock{installed,spares,threshold,status}, maintenance, safety, actions[]}; place lens — {tagged_products[], safety[], chores[], counts{}}"
            example: "{'mode':'object_lens','item':'spa filter'} or {'mode':'object_lens','homeassistant_area_id':'garage'}"
          product_groups_find:
            intent: Find a product group by name (partial, case-insensitive).
            needs:
            - item
            does: GET /objects/product_groups + local name match
            example: "{'mode':'product_groups_find','item':'spa'}"
          batteries_charge:
            intent: Record a charge cycle for a rechargeable battery.
            needs:
            - battery_id
            optional:
            - amount
            does: POST /batteries/{batteryId}/charge
            example: "{'mode':'batteries_charge','battery_id':1}"
          batteries_due:
            intent: List rechargeable batteries bucketed by charge status (overdue/due_today/due_soon/ok).
            needs: []
            does: GET /batteries (shaped)
            example: "{'mode':'batteries_due'}"
          batteries_journal:
            intent: List charge cycle history. Optional battery_id to filter to one device.
            needs: []
            optional:
            - battery_id
            - page
            - per_page
            does: GET /objects/battery_charge_cycles
            example: "{'mode':'batteries_journal'}"
          batteries_charge_undo:
            intent: Undo a specific charge cycle by entry_id (from batteries_journal).
            needs:
            - entry_id
            does: POST /batteries/charge-cycles/{id}/undo
            example: "{'mode':'batteries_charge_undo','entry_id':42}"
          battery_status:
            intent: Low-battery triage across the house grouped by area with Grocy stock cross-ref.
            needs: []
            does: HA Battery Notes sensors + Grocy /stock/products (template-only)
            example: "{'mode':'battery_status'}"
          battery_overdue:
            intent: Devices not replaced in N days, sorted by days_since_replaced descending.
            needs:
            - days_threshold
            does: HA Battery Notes sensors (template-only)
            example: "{'mode':'battery_overdue','days_threshold':180}"
          battery_replace:
            intent: Atomic — log battery replacement in Battery Notes AND consume from Grocy stock.
            needs:
            - ha_entity_id
            optional:
            - item
            - amount
            does: battery_notes.set_battery_replaced + /stock/products/{id}/consume
            example: "{'mode':'battery_replace','ha_entity_id':'sensor.office_remote_battery_plus','item':'AA Batteries','amount':2}"
          stock_audit_perishable:
            intent: Audit — find stock in perishable locations with default_best_before_days=-1 (never-expires products that need expiry tracking). Reverse complement of coaching — catches existing violations in live stock.
            needs: []
            does: /objects/locations + /objects/stock + /objects/products (paginated, template cross-ref)
            example: "{'mode':'stock_audit_perishable'}"
            best_before_days_defaults:
              guidance: >-
                When a human asks what best_before_days to set, use these as starting points.
                Always defer to the product label if available. These are reasonable defaults
                for products without a printed date or when cataloging in bulk.
              canned_goods: 1825
              canned_goods_note: Tomatoes, beans, chili, broth — 5 years is the USDA guidance for low-acid canned goods
              jarred_sauces: 730
              jarred_sauces_note: Pasta sauces, pesto, simmer sauces, curry paste, coconut cream — 2 years sealed
              pickled_and_preserved: 730
              pickled_and_preserved_note: Jalapeños, olives, peppers, relish, tahini — 2 years sealed
              condiments: 365
              condiments_note: Mayo, mustard, salsa, hot sauce — 1 year (refrigerate after opening)
              dry_spices_and_seasonings: 1095
              dry_spices_and_seasonings_note: Ground spices lose potency in 2-3 years; whole spices last longer
              cooking_oils: 730
              cooking_oils_note: Olive oil, avocado oil — 2 years unopened; 6 months after opening
              wine: 1825
              wine_note: Table wine 3-5 years; fine wine longer — use label guidance
              beer_and_canned_drinks: 365
              beer_and_canned_drinks_note: 1 year for most; IPAs closer to 90 days
              dry_pasta_and_rice: 1825
              dry_pasta_and_rice_note: 5 years dry — effectively indefinite if sealed
              never_expires_candidates: [batteries, filters, paper_products, cleaning_supplies, tools]
              never_expires_note: Set best_before_days=-1 for non-food items in perishable locations (e.g. fridge water filters)
          locations_reparent_bulk:
            intent: "Bulk-set parent on child locations. Idempotent — safe to re-run. Inherits parent homeassistant_area to each child. Preserves child area if parent has none (unless confirm_action=true clears it)."
            needs:
            - parent_location_id
            - child_location_ids
            optional:
            - confirm_action (true = allow blanking child homeassistant_area when parent has none)
            does: "GET parent area → per child: read current state, skip if already correct, PUT grocy_parent_location_id + homeassistant_area if changed, sync child lists"
            example: "{'mode':'locations_reparent_bulk','parent_location_id':15,'child_location_ids':'[201,202,203]'}"
          locations_audit:
            intent: Scan all locations, report HA area mismatches and parent/child integrity issues.
            needs: []
            does: GET /objects/locations?limit=500&offset=0
            example: "{'mode':'locations_audit'}"
          stock_register_asset:
            intent: "1-call asset registration: create product, stock 1 unit BBD=never, set meta. Dupe-guards. hazmat_class triggers lean RM safety[] log."
            needs:
            - item
            - location
            optional:
            - note
            - brand
            - sku
            - price
            - hazmat_class
            - confirm_action
            example: "{'mode':'stock_register_asset','item':'Power Drill','location':'Garage','note':'18V cordless, model XR20V','brand':'DeWalt'}"
          locations_delete_safe:
            intent: Delete a location, transferring any stock to orphan_to first if needed.
            needs:
            - location_id
            optional:
            - orphan_to
            does: GET stock/locations/{id}/entries + optional transfer + DELETE
            example: "{'mode':'locations_delete_safe','location_id':261,'orphan_to':141}"
          locations_hierarchy_rebuild:
            intent: Rebuild grocy_child_location_ids for all parent locations from ground truth. Fixes stale lists after bulk imports or direct API edits.
            needs: []
            optional: [dry_run]
            does: GET all locations, derive children per parent, PUT corrected lists
            example: "{'mode':'locations_hierarchy_rebuild'}"
          stock_area_summary:
            intent: Containers + item counts for a HA area. Returns flat locations list + location_tree (3-level hierarchy). Includes RM anchor + hazmat safety.
            needs: [homeassistant_area_id]
            optional: []
            does: GET locations by area, GET all products in single bulk call, count by default location_id per location, build location_tree from grocy_parent_location_id userfield, read RM spatial for anchor + safety
            note: "Area membership flows via default location: product.location_id → location.homeassistant_area_id → HA area. Products do NOT need a direct area_id. To add a product to an area summary, set its default location to any location in that area."
            example: "{'mode':'stock_area_summary','homeassistant_area_id':'kitchen'}"
          stock_area_volatile:
            intent: Volatile items (overdue/due_soon/expiring) stored in a HA area. Filters whole-house volatile by room location membership.
            needs: [homeassistant_area_id]
            optional: []
            does: GET locations by area, GET /stock/volatile, filter slim items by default location_id membership, return overdue/due_soon/expiring lists + counts
            example: "{'mode':'stock_area_volatile','homeassistant_area_id':'kitchen'}"
          chores_by_area:
            intent: Chores for a HA area. Two discovery paths - product stocked in area, or chore userfield homeassistant_area tagged directly.
            needs: [homeassistant_area_id]
            optional: []
            does: GET locations + chore defs + chore state. Path 1 = product entries in area locs. Path 2 = userfields.homeassistant_area match. discovery field shows which path.
            example: "{'mode':'chores_by_area','homeassistant_area_id':'powder_room'}"
          room_brief:
            intent: Chores + stock summary for a HA area in one call. Use instead of chores_by_area + stock_area_summary to save a round trip.
            needs: [homeassistant_area_id]
            reads: chores_by_area + stock_area_summary combined
            example: "{'mode':'room_brief','homeassistant_area_id':'kitchen'}"
          userfields_list:
            intent: List all Grocy userfield schema definitions.
            needs: []
            optional: [entity]
            reads: GET /objects/userfields
          userfields_deploy:
            intent: Idempotent deploy of canonical ZenOS userfield schema. Creates missing fields, skips existing. Stamps schema_version to household cabinet.
            needs: []
            writes: POST /objects/userfields (per missing field)
            notes:
              - schema_version stamped to household cabinet grocy_schema key
          userfields_repair:
            intent: "Diff live Grocy schema vs canonical. Reports ok/missing/type_drift/caption_drift/unknown + version delta. Fixes missing + patches caption drift unless dry_run=true."
            needs: []
            optional: [dry_run]
            reads: GET /objects/userfields
            notes:
              - caption_drift detected when canonical caption is not contained in existing caption — patched via PUT /objects/userfields/{id}
              - type_drift reported but NOT auto-fixed (type changes are destructive — manual intervention required)
          userfields_delete:
            intent: Delete a userfield schema definition by ID. Warns if canonical. Preview without confirm_action.
            needs: [field_id]
            optional: [confirm_action]
            writes: "DELETE /objects/userfields/{id}"
            notes:
              - Deleting orphans all stored values for that field. IRREVERSIBLE.
          userfields_create:
            intent: Create a new userfield schema definition on a Grocy entity. Idempotent — returns already_exists if the same entity+name already exists.
            needs: [entity, field_name, field_caption]
            optional: [field_type (default text-single-line)]
            writes: POST /objects/userfields
          userentities_list:
            intent: List all custom Grocy userentity types (ERP object type registry).
            needs: []
            reads: GET /objects/userentities
          userentities_create:
            intent: Create a new custom Grocy userentity (ERP object type). Use item as the snake_case name slug.
            needs: [item (snake_case name), field_caption (display caption)]
            optional: [note (description)]
            writes: POST /objects/userentities
            notes:
              - "entity_qualifier in response: userentity-{name} — use this for userfields ops"
          userentities_delete:
            intent: Delete a custom userentity by ID. IRREVERSIBLE — removes all userobjects and stored values. Requires confirm_action.
            needs: [userentity_id, confirm_action]
            writes: DELETE /objects/userentities/{id}
          userobjects_list:
            intent: List userobjects. Filter to one type by passing userentity_id.
            needs: []
            optional: [userentity_id]
            reads: GET /objects/userobjects
          userobjects_create:
            intent: Create a new userobject under a custom userentity.
            needs: [userentity_id]
            writes: POST /objects/userobjects
            notes:
              - Use userentity_values_set to write field values after creation
          userobjects_delete:
            intent: Delete a userobject by ID. Requires confirm_action.
            needs: [userobject_id, confirm_action]
            writes: DELETE /objects/userobjects/{id}
          userentity_values_get:
            intent: Read all userfield values for a specific userobject.
            needs:
              - "entity (userentity-{name} form)"
              - userobject_id
            reads: "GET /userfields/{entity}/{userobject_id}"
          userentity_values_set:
            intent: Write userfield values for a specific userobject. Pass all fields to update as a JSON dict.
            needs:
              - "entity (userentity-{name} form)"
              - userobject_id
              - values_json
            writes: "PUT /userfields/{entity}/{userobject_id}"
          product_refs_get:
            intent: Get all ticket/doc refs for a product.
            needs: [item OR product_id]
            returns: "{product_id, ticket_refs: [], doc_refs: []}"
          product_ref_add:
            intent: Append a Zammad ticket or Paperless doc ID to a product’s ref array. Fires zen_inventory_ref_logged event.
            needs: [item OR product_id, ref_type (ticket|doc), ref_id (int)]
            returns: "{status ok|warn, product_id, ref_type, ref_id, refs_updated, already_present}"
          product_ref_remove:
            intent: Remove a ticket or doc ID from a product’s ref array.
            needs: [item OR product_id, ref_type (ticket|doc), ref_id (int)]
            returns: "{status ok|warn, refs_updated, was_present}"
          by_anchor:
            intent: "Lens bus entry point. anchor_type=area_id returns player_hint evidence for every product in that area with media_role set. Tells agents what physical playback hardware exists in a room."
            needs: [anchor_type (area_id), anchor_ids (JSON array of area slugs)]
            does: "Scan all products for media_role userfield at locations whose homeassistant_area matches anchor_ids. Emits player_hint evidence: {player_type, media_formats, media_types, dumb, entity_id, area, location_name}."
            returns: "{status, evidence[], count, anchor_type}"
            example: "{‘mode’:’by_anchor’,’anchor_type’:’area_id’,’anchor_ids’:’[\"living_room\"]’}"
          register:
            intent: Enroll Inventory as a Lens bus provider in the household lens_registry cabinet key. Run once after deploy or if registry is reset.
            needs: []
            does: Writes {consumes:[area_id], returns:[player_hint], script:script.zen_dojotools_inventory, anchor_mode:by_anchor, department:inventory} to lens_registry.
            returns: "{status ok, provider, registry_entry}"
            example: "{‘mode’:’register’}"
          unregister:
            intent: Remove Inventory from lens_registry.
            needs: []
            returns: "{status ok, message}"
            example: "{‘mode’:’unregister’}"
    - alias: 'Mode: Help'
      choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm == ''help'' }}'
          alias: 'Mode: HELP'
        sequence:
        - variables:
            help_json: "{{\n  {\n    \"tool\": tool_name | default(''),\n    \"version\":
              tool_version | default(''),\n    \"overview\":\n      \"Zen DojoTools
              Inventory is a deterministic, construct-safe intent router for Grocy.
              It converts explicit household intents into explicit Grocy API calls.
              All names are resolved to IDs, all writes are intentional, and no implicit
              mutation or inference is performed. Grocy is treated as the canonical
              authority for products, locations, and quantity units.\",\n\n    \"read_this_first\":
              [\n      \"This tool does exactly what you tell it to do—nothing more,
              nothing less.\",\n      \"Every write is intentional. Every ID is resolved
              before execution.\",\n      \"If an operation is blocked, it is because
              Grocy would reject it or the intent was ambiguous.\",\n      \"Errors
              include coaching because guessing would be irresponsible.\",\n      \"If
              you skipped help and hit an error, the help already explained it.\"\n
              \   ],\n    \n    \"operating_model\": {\n      \"resolution_rules\":
              [\n        \"Names are resolved to IDs before any operation\",\n        \"Exact
              matches are preferred; partial matches are fallback\",\n        \"Multiple
              matches cause the operation to stop\"\n      ],\n      \"write_rules\":
              [\n        \"All write operations require explicit case selection\",\n
              \       \"Required fields are enforced per case\",\n        \"No implicit
              create, merge, or delete ever occurs\"\n      ],\n      \"unit_governance\":
