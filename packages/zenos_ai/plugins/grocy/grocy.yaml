chores/executions/{{ execution_id_in }}/undo\n{% elif mode_norm == 'catalog_find_by_barcode' and has_barcode %}\n  /stock/products/by-barcode/{{ barcode_norm }}\n{% elif mode_norm == 'stock_add_by_barcode' and has_barcode %}\n  /stock/products/by-barcode/{{ barcode_norm }}/add\n{% elif mode_norm == 'stock_consume_by_barcode' and has_barcode %}\n  /stock/products/by-barcode/{{ barcode_norm }}/consume\n{% elif mode_norm == 'batteries_list' %}\n  /batteries\n{% elif mode_norm == 'batteries_get' and battery_id_in %}\n  /batteries/{{ battery_id_in }}\n{% elif mode_norm == 'batteries_charge' and battery_id_in %}\n  /batteries/{{ battery_id_in }}/charge\n{% elif mode_norm == 'locations_audit' %}\n  /objects/locations?limit=500&offset=0\n{% elif mode_norm in ['product_groups_list', 'product_groups_find'] %}\n  /objects/product_groups?limit=500&offset=0\n{% else %}\n  {{ none }}\n{% endif %}"
