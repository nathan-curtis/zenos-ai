###############################################################################
# ZenOS-AI Plugin: Grocy ERP Integration
# Version: 4.47.0
#
# UAT:     Critical path PASS — 2026-03-02
#          (locations_add, stock_buy_product, stock_check_item,
#           shopping_add/remove_product, recipes_list, recipes_fulfillment,
#           batteries_list, stock_list_volatile, stock_overview, stock_consume,
#           units_add, stock_get_product_details, recipe_check_fulfillment,
#           stock_entries_for_item, catalog_find_by_barcode,
#           recipes_add_to_shopping, chores_execute, recipes_copy,
#           stock_undo_booking, stock_open_item, stock_add_by_barcode,
#           stock_consume_by_barcode, stock_entry_update [read-modify-write]
#           — all verified against live Grocy instance)
# HALMark: PASS — 2026-03-02 (v0.9.10-draft)
#          (selectors, default(none), selectattr guards, no hardcoded IDs,
#           no initial: on input_text, filter ordering — all clean)
#
# SETUP
#
# 1. Add to secrets.yaml:
#      grocy_api_key: <your_api_key>   (no prefix — Grocy uses a bare key)
#
# 2. Set input_text.grocy_url in HA (Settings > Helpers, or Developer Tools):
#      https://<your-grocy-host>   (no trailing slash)
#    Must be set once after install — value persists across restarts.
#
#    *** USE HTTPS, NOT HTTP ***
#    If your Grocy is behind a reverse proxy (Caddy, nginx, Traefik) that
#    redirects HTTP → HTTPS, HA's HTTP client follows the 301 but converts
#    every POST to a GET per RFC. All write operations will silently fail.
#
# HOW TO GET YOUR GROCY API KEY:
#   1. Log in to Grocy
#   2. Go to Settings (top-right) > Manage API Keys
#   3. Click the key icon to copy your existing API key, or create a new one
#   4. Paste directly (no prefix needed):
#      grocy_api_key: XXXXXXXXXXXXXXXX
###############################################################################

input_text:
  grocy_url:
    name: "Grocy Base URL"
    max: 255
    mode: text
    icon: mdi:fridge-outline

rest_command:
  grocy_api_advanced_get:
    url: "{{ states('input_text.grocy_url') | trim('/') }}/api/{{ endpoint | replace('/api/', '') | replace('api/', '') | trim('/') }}{% if '?' not in (endpoint | string) %}?limit={{ perPage | int(20) }}&offset={{ (((pageNumber | int(1)) - 1) * (perPage | int(20))) }}{% if search is defined and search | trim != '' %}&query[]=name*={{ search }}{% endif %}{% if orderBy is defined and orderBy | trim != '' %}&order={{ orderBy }}%3A{{ orderDirection | default('asc') }}{% endif %}{% endif %}"
    method: GET
    headers:
      GROCY-API-KEY: !secret grocy_api_key
      content-type: application/json
    timeout: 30
  grocy_api_advanced_post:
    url: "{{ states('input_text.grocy_url') | trim('/') }}/api/{{ endpoint | replace('/api/', '') | replace('api/', '') | trim('/') }}"
    method: POST
    headers:
      GROCY-API-KEY: !secret grocy_api_key
      content-type: application/json
    payload: "{{ payload }}"
    timeout: 30
  grocy_api_advanced_put:
    url: "{{ states('input_text.grocy_url') | trim('/') }}/api/{{ endpoint | replace('/api/', '') | replace('api/', '') | trim('/') }}"
    method: PUT
    headers:
      GROCY-API-KEY: !secret grocy_api_key
      content-type: application/json
    payload: "{{ payload }}"
    timeout: 30
  grocy_api_advanced_delete:
    url: "{{ states('input_text.grocy_url') | trim('/') }}/api/{{ endpoint | replace('/api/', '') | replace('api/', '') | trim('/') }}"
    method: DELETE
    headers:
      GROCY-API-KEY: !secret grocy_api_key
      content-type: application/json
    payload: "{{ payload | default('') }}"
    timeout: 30

script:
  zen_dojotools_grocy_advanced:
    alias: Zen DojoTools Grocy Advanced
    description: "Zen DojoTools Grocy Advanced (v. 1.7.0) USE Zen DojoTools Inventory
      first, it is an easy to use passthrough to this tool. It will highlight WHEN to
      escalate to this modular controller for Grocy ERP. Supports inventory CRUD across
      all endpoints. Accepts action_type (create, read, update, delete, help), dynamic
      path_params, query filters, and JSON payloads. Use 'read' for GET operations (optionally
      with search and filters), 'create' (POST), 'update' (PUT), or 'delete' (DELETE)
      with appropriate payload.\nIf you get a 405 error \n  - should you be using this
      tool instead of Zen DojoTools Inventory?\n  - it likely means your endpoint
      call is incorrect. Thats why the Inventory tool exists.\n  - Use Help. \n\nFor a
      full list of supported endpoints, tags, usage patterns, and sample operations,
      pass 'help' as the action_type. Help returns OpenAPI path docs, tags, Grocy patterns,
      and best practices."
    mode: single
    icon: mdi:api
    fields:
      action_type:
        name: CRUD Action
        selector:
          select:
            options:
            - create
            - read
            - update
            - delete
            - help
        default: help
        required: true
      endpoint:
        name: API Endpoint
        description: API endpoint, e.g., 'stock', 'objects/products', 'objects/locations',
          'objects/tasks', etc.  See paths in HELP for list.
        selector:
          text:
      path_params:
        description: 'Optional token replacements like {"product_id": 4}.

          '
        selector:
          object:
      payload:
        name: Payload (JSON)
        description: 'JSON body for POST/PUT/DELETE requests. Required for those actions.

          '
        selector:
          text:
            multiline: true
      search:
        name: Search Term
        description: (GET only) Free-text search filter
        selector:
          text:
      slim_objects:
        name: Slim Objects
        description: 'Return only {id, name} for large object list fetches (prevents template overflow on big catalogs).'
        selector:
          boolean:
        default: false
      extra_params:
        name: Extra Filters
        description: 'Additional GET query filters, e.g. {"spoiled": "false"}

          '
        selector:
          object:
      pageNumber:
        name: Page Number
        selector:
          number:
            min: 1
            max: 99
            step: 1
        default: 1
      perPage:
        name: Items Per Page
        selector:
          number:
            min: 1
            max: 100
            step: 1
        default: 20
    sequence:
    - variables:
        inv_action_type: "{% set v = action_type | default('help') %} {% if v in ['post','create']
          %}\n  create\n{% elif v in ['get','read'] %}\n  read\n{% elif v in ['put','update']
          %}\n  update\n{% elif v in ['delete'] %}\n  delete\n{% elif v == 'help' %}\n
          \ help\n{% else %}\n  help\n{% endif %}"
        inv_endpoint: '{{ endpoint | default('''') }}'
        inv_payload: '{{ payload | default('''') }}'
        inv_search: '{{ search | default('''') }}'
        inv_extra_params: '{{ extra_params | default({}) }}'
        inv_page: '{{ pageNumber | default(1) }}'
        inv_limit: '{{ perPage | default(20) }}'
        inv_endpoint_path: "{% if '?' in inv_endpoint %}\n  {{ inv_endpoint.split('?',
          1)[0] }}\n{% else %}\n  {{ inv_endpoint }}\n{% endif %}"
        is_objects_endpoint: "{{\n  inv_endpoint_path[0:8] == 'objects/'\n  or inv_endpoint_path[0:9]
          == '/objects/'\n}}"
        is_objects_products: "{{ inv_endpoint_path == 'objects/products'\n   or inv_endpoint_path
          == '/objects/products' }}"
        is_get: '{{ inv_action_type == ''read'' }}'
        is_post: '{{ inv_action_type == ''create'' }}'
        is_put: '{{ inv_action_type == ''update'' }}'
        is_delete: '{{ inv_action_type == ''delete'' }}'
        is_help: '{{ inv_action_type == ''help'' }}'
        slim_objects: '{{ slim_objects | default(false) | bool }}'
        requires_payload: '{{ is_post or is_put or is_delete }}'
        has_endpoint: '{{ inv_endpoint not in ['''', None] }}'
        explicit_path_params: '{{ path_params is defined and path_params | count > 0
          }}'
        explicit_search: '{{ search is defined and search | trim != '''' }}'
        explicit_extra_params: '{{ extra_params is defined and extra_params | count
          > 0 }}'
        explicit_page: '{{ pageNumber is defined }}'
        explicit_limit: '{{ perPage is defined }}'
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ requires_payload and inv_payload | trim == '''' }}'
          alias: Error - Payload Required
        sequence:
        - variables:
            final_response:
              status: error
              message: This action requires a JSON payload, but none was provided.
        - stop: Missing Payload
          response_variable: final_response
      - conditions:
        - condition: template
          value_template: '{{ not has_endpoint and not is_help }}'
          alias: Error - Endpoint Required
        sequence:
        - variables:
            final_response:
              status: error
              message: A valid Grocy API endpoint is required.
        - stop: Missing Endpoint
          response_variable: final_response
      - conditions:
        - condition: template
          value_template: '{{ is_help }}'
          alias: HELP
        sequence:
        - variables:
            inv_docs: sensor.grocy_restful_openapi_docs
            inv_paths: "{% set attr = state_attr(inv_docs, 'paths') %} {% if attr is
              mapping %}\n  {{ attr }}\n{% else %}\n  {}\n{% endif %}"
            inv_tags: "{% set ns = namespace(tagset=[]) %}\n{% if inv_paths is mapping and inv_paths.items
              is defined %}\n  {% for path, methods in inv_paths.items() %}\n    {%
              if methods is mapping %}\n      {% for method, info in methods.items()
              %}\n        {% if info is mapping and info.tags is defined and info.tags
              is iterable %}\n          {% for tag in info.tags %}\n            {% if
              tag not in ns.tagset %}\n              {% set ns.tagset = ns.tagset + [tag] %}\n
              \           {% endif %}\n          {% endfor %}\n        {% endif %}\n
              \     {% endfor %}\n    {% endif %}\n  {% endfor %}\n{% endif %}\n{{ ns.tagset
              | to_json }}"
            help_response:
              status: info
              message: Zen Dojotools Grocy Advanced Help
              endpoint: '{{ inv_endpoint | default(''(none provided)'') }}'
              available_endpoints: '{{ inv_paths | list | to_json }}'
              available_tags: '{{ inv_tags }}'
              categories: '{{ inv_tags }}'
              cheatsheet:
                description: 'Common Generic entity interactions - exposed at these
                  endpoints for convenience. If you have a Grocy component,  Extended
                  help may be available in your Dojo. Note - START with /object/{entity}
                  before trying /{entity}
  
                  '
                methods:
                  more_info: "use File CRUD tool to read\n  dojo_cabinet/grocy_manager\n
                    \ dojo_cabinet/grocy_api_endpoints\ndrawers for detailed up to date
                    documentation.\n"
                  GET:
                  - /objects/{entity}: Returns all objects of the given entity (yes
                      objects first!)
                  - /objects/{entity}/{objectId}: Returns a single object of the given
                      entity
                  - /userfields/{entity}/{objectId}: Returns all userfields with their
                      values of the given object of the given entity
                  - /stock: Returns all products currently in stock incl. next due date.
                  - /stock/volatile: Returns all products due soon, overdue or expiring.
                  - /userfields/{entity}/{objectId}: Returns userfields with values.
                  POST:
                  - /objects/{entity}: Adds a single object of the given entity
                  PUT:
                  - /objects/{entity}/{objectId}: Edits the given object of the given
                      entity
                  - /userfields/{entity}/{objectId}: Edits the given userfields of the
                      given object of the given entity
                  DELETE:
                  - /objects/{entity}/{objectId}: Deletes a single object of the given
                      entity
                  available_grocy_entities:
                  - batteries
                  - chores
                  - equipment
                  - locations
                  - meal_plan
                  - meal_plan_sections
                  - product_barcodes
                  - product_groups
                  - products
                  - quantity_unit_conversions
                  - quantity_units
                  - recipes
                  - recipes_nestings
                  - recipes_pos
                  - shopping_list
                  - shopping_lists
                  - shopping_locations
                  - task_categories
                  - tasks
                  - userentities
                  - userfields
                  - userobjects
              tips:
              - Should you be using this tool? Always Prefer the Zen DojoTools Grocy
                Helper unless it referred you to use this 'Advanced' tool directly.
              - 'ALWAYS START WITH /objects/ GET/POST/PUT /objects/{entity} is where
                you find the interesting stuff ...your starting point. example: /objects/locations'
              - /objects/shopping_lists is a list of shopping lists while /objects/shopping_list
                are the items on the lists with each having attribute shopping_list_id
              - non-200 non-401 status returns on known endpoints may indicate the endpoint
                is not the correct or primary endpoint for your chosen method. Review
                paths to identify the correct path. A 405 means you are doing it wrong,
                it's not the setup.
              - Use path_params to replace dynamic tokens in endpoints like {product_id}.
              best_practices: 'Tool Choice: The Zen DojoTools Inventory is a tool
                wrapper designed to work with this tool to remove complexity.
  
                PREFER ''Helper'' over ''Advanced'' (this) unless the ''Helper'' tool
                EXPLICITLY instricted you to refer to this tool directly.
  
                Usage Notes: - Specify valid API endpoints to avoid errors. - Use pagination
                (pageNumber and perPage) for large datasets. - Leverage filtering options
                for targeted queries. - Detailed item and product management is supported
                (e.g. quantity, expiry, location, and labels). - Integrates with household
                user/group systems for secure and collaborative use.
  
                Best Practices: - Always read current inventory data before updating
                to prevent overwrites. - Validate JSON payloads prior to submitting
                create or update operations. - Include all relevant parameters for consistent
                results. - Use metadata and labels to enhance filtering and organization.
  
                '
              version: v1.5.0
              next:
              - Planned: auto-label inventory → cabinet sync bridge
        - stop: Help Displayed
          response_variable: help_response
      - conditions:
        - condition: template
          value_template: '{{ is_get }}'
        sequence:
        - variables:
            read_data: "{% set d = {\"endpoint\": inv_endpoint, \"pageNumber\": inv_page,
              \"perPage\": inv_limit} %} {% if explicit_path_params %}\n  {% set d =
              d | combine({\"path_params\": path_params}) %}\n{% endif %} {% if explicit_search
              %}\n  {% set d = d | combine({\"search\": inv_search}) %}\n{% endif %}
              {% if explicit_extra_params %}\n  {% set d = d | combine({\"additional_params\":
              inv_extra_params}) %}\n{% endif %} {{ d }}"
            read_response: {}
        - data: '{{ read_data }}'
          response_variable: read_response
          action: rest_command.grocy_api_advanced_get
        - variables:
            status_code: '{{ read_response.status | int(0) }}'
            is_405: '{{ status_code == 405 }}'
            final_response: |-
              {%- set _rc = read_response['content'] | default(none, true) -%}
              {%- set _isvol = 'stock/volatile' in inv_endpoint -%}
              {%- if is_405 -%}
              {{ { "status": "error", "message": "405 Method Not Allowed. You may be using the wrong endpoint.", "tip": "Most Grocy object actions excluding stock use /objects/{entity}. Try again with '/objects/" ~ inv_endpoint ~ "'.", "endpoint": inv_endpoint } }}
              {%- elif _isvol and _rc is mapping -%}
              {%- set _ov = (_rc.overdue_products | default([]))[:inv_limit | int(25)] -%}
              {%- set _ds = (_rc.due_dates | default([]))[:inv_limit | int(25)] -%}
              {%- set _ex = (_rc.expiring_products | default([]))[:inv_limit | int(25)] -%}
              {%- set ns = namespace(ov=[], ds=[], ex=[]) -%}
              {%- for i in _ov -%}{%- set ns.ov = ns.ov + [{'name': i.product.name | default('', true) if i.product is defined else i.name | default('', true), 'product_id': i.product_id | default(''), 'amount': i.amount | default(''), 'best_before_date': i.best_before_date | default(''), 'location_id': i.product.location_id | default(none, true) if i.product is defined else none}] -%}{%- endfor -%}
              {%- for i in _ds -%}{%- set ns.ds = ns.ds + [{'name': i.product.name | default('', true) if i.product is defined else i.name | default('', true), 'product_id': i.product_id | default(''), 'amount': i.amount | default(''), 'best_before_date': i.best_before_date | default(''), 'location_id': i.product.location_id | default(none, true) if i.product is defined else none}] -%}{%- endfor -%}
              {%- for i in _ex -%}{%- set ns.ex = ns.ex + [{'name': i.product.name | default('', true) if i.product is defined else i.name | default('', true), 'product_id': i.product_id | default(''), 'amount': i.amount | default(''), 'best_before_date': i.best_before_date | default(''), 'location_id': i.product.location_id | default(none, true) if i.product is defined else none}] -%}{%- endfor -%}
              {{ { "status": "success", "message": "GET to '" ~ inv_endpoint ~ "' succeeded.", "result": {"status": read_response.status | int(200), "content": {"overdue_products": ns.ov, "due_dates": ns.ds, "expiring_products": ns.ex}}} }}
              {%- elif _rc is iterable and _rc is not mapping and _rc is not string -%}
              {%- set _cap = 500 if 'limit=' in inv_endpoint else inv_limit | int(25) -%}
              {%- set _trimmed = _rc[:_cap] -%}
              {%- if slim_objects -%}
              {%- set ns_sl = namespace(out=[]) -%}
              {%- for o in _trimmed -%}{%- set ns_sl.out = ns_sl.out + [{'id': o.id, 'name': o.name | default('', true)}] -%}{%- endfor -%}
              {{ { "status": "success", "message": "GET to '" ~ inv_endpoint ~ "' succeeded.", "result": {"status": read_response.status | int(200), "content": ns_sl.out}} }}
              {%- else -%}
              {{ { "status": "success", "message": "GET to '" ~ inv_endpoint ~ "' succeeded.", "result": {"status": read_response.status | int(200), "content": _trimmed}} }}
              {%- endif -%}
              {%- else -%}
              {{ { "status": "success", "message": "GET to '" ~ inv_endpoint ~ "' succeeded.", "result": read_response } }}
              {%- endif -%}
        alias: READ
      - conditions:
        - condition: template
          value_template: '{{ is_post }}'
        sequence:
        - data:
            endpoint: '{{ inv_endpoint }}'
            path_params: '{{ path_params | default({}) }}'
            payload: "{% if inv_payload is mapping %}\n  {{ inv_payload | to_json }}\n{%
              else %}\n  {{ inv_payload }}\n{% endif %}"
          response_variable: response
          action: rest_command.grocy_api_advanced_post
        - variables:
            status_code: '{{ response.status | int(0) }}'
            is_405: '{{ status_code == 405 }}'
            final_response: "{% if is_405 %}\n  {{\n    {\n      \"status\": \"error\",\n
              \     \"message\": \"405 Method Not Allowed. You may be using the wrong
              endpoint.\",\n      \"tip\": \"Most Grocy object actions use /objects/{entity}.
              Try again with '/objects/{{ inv_endpoint }}'.\",\n      \"endpoint\":
              inv_endpoint\n    }\n  }}\n{% else %}\n  {{\n    {\n      \"status\":
              \"success\",\n      \"message\": \"POST to '\" ~ inv_endpoint ~ \"' succeeded.\",\n
              \     \"result\": response\n    }\n  }}\n{% endif %}"
        alias: CREATE
      - conditions:
        - condition: template
          value_template: '{{ is_put }}'
        sequence:
        - data:
            endpoint: '{{ inv_endpoint }}'
            path_params: '{{ path_params | default({}) }}'
            payload: "{% if inv_payload is mapping %}\n  {{ inv_payload | to_json }}\n{%
              else %}\n  {{ inv_payload }}\n{% endif %}"
          response_variable: response
          action: rest_command.grocy_api_advanced_put
        - variables:
            status_code: '{{ response.status | int(0) }}'
            is_405: '{{ status_code == 405 }}'
            final_response: "{% if is_405 %}\n  {{\n    {\n      \"status\": \"error\",\n
              \     \"message\": \"405 Method Not Allowed. You may be using the wrong
              endpoint.\",\n      \"tip\": \"Most Grocy object actions excluding stock
              use /objects/{entity}. Try again with '/objects/{{ inv_endpoint }}'.\",\n
              \     \"endpoint\": inv_endpoint\n    }\n  }}\n{% else %}\n  {{\n    {\n
              \     \"status\": \"success\",\n      \"message\": \"PUT to '\" ~ inv_endpoint
              ~ \"' succeeded.\",\n      \"result\": response\n    }\n  }}\n{% endif
              %}"
        alias: UPDATE
      - conditions:
        - condition: template
          value_template: '{{ is_delete }}'
        sequence:
        - data:
            endpoint: '{{ inv_endpoint }}'
            path_params: '{{ path_params | default({}) }}'
            payload: "{% if inv_payload is mapping %}\n  {{ inv_payload | to_json }}\n{%
              else %}\n  {{ inv_payload }}\n{% endif %}"
          response_variable: response
          action: rest_command.grocy_api_advanced_delete
        - variables:
            status_code: '{{ response.status | int(0) }}'
            is_405: '{{ status_code == 405 }}'
            final_response: "{% if is_405 %}\n  {{\n    {\n      \"status\": \"error\",\n
              \     \"message\": \"405 Method Not Allowed. You may be using the wrong
              endpoint.\",\n      \"tip\": \"Most Grocy object actionsexcluding stock
              use /objects/{entity}. Try again with '/objects/{{ inv_endpoint }}'.\",\n
              \     \"endpoint\": inv_endpoint\n    }\n  }}\n{% else %}\n  {{\n    {\n
              \     \"status\": \"success\",\n      \"message\": \"DELETE to '\" ~ inv_endpoint
              ~ \"' succeeded.\",\n      \"result\": response\n    }\n  }}\n{% endif
              %}"
        alias: DELETE
    - variables:
        final_response: "{{ final_response if final_response is defined else {\n  \"status\":
          \"error\",\n  \"message\": \"Unknown failure or incomplete input.\"\n} }}\n"
    - stop: End
      response_variable: final_response

  zen_dojotools_inventory:
    alias: Zen DojoTools Inventory
    description: >-
      Household inventory (4.48.0) — full ERP stack. Stock, shopping, catalog, locations,
      chores, tasks, recipes, units, batteries. 74 operations. Names resolve to IDs.
      mode=help returns a structured cases dict — CONTRACT for tool-to-tool calls.
      TASK TAXONOMY — use this (not zen_dojotools_todo) for tasks tied to a product/location.
      Inventory Task = asset todo. Inventory Chore = task + stock action on execution.
      mode=room_brief area=X: chores + stock one call. mode=chores_by_area area=X: chores for room.
      mode=chores_tag item=X area=Y: tag chore to room. mode=tasks_tag item=X area=Y: tag task.
      mode=tasks_add item=X: create task. mode=tasks_complete item=X: mark done.
      mode=chores_execute item=X: log + consume. mode=stock_check_item item=X: stock + location.
      mode=stock_buy_product item=X amount=N location=L: purchase. mode=stock_consume item=X: consume.
      mode=shopping_add_product item=X: queue. mode=help: full 74-op catalogue.
    mode: single
    icon: mdi:cart-variant
    fields:
      mode:
        name: Mode
        description: '74 operations + help. Default: help.'
        selector:
          select:
            options:
            - help
            - stock_check_item
            - stock_where_is_item
            - stock_entries_for_item
            - stock_get_product_details
            - stock_overview
            - stock_list_volatile
            - stock_list_by_location
            - stock_area_summary
            - stock_area_volatile
            - stock_area_inventory
            - chores_by_area
            - room_brief
            - chores_add
            - chores_tag
            - chores_delete
            - chores_edit
            - stock_add_purchase
            - stock_buy_product
            - stock_add_by_barcode
            - stock_consume
            - stock_consume_by_barcode
            - stock_transfer_location
            - stock_open_item
            - stock_inventory_adjust
            - stock_entry_update
            - stock_undo_booking
            - stock_register_asset
            - catalog_add_product
            - catalog_delete_product
            - catalog_list_products
            - catalog_find_product
            - catalog_find_by_barcode
            - get_product_meta
            - update_product_meta
            - rename_product
            - set_default_location_for_product
            - products_merge
            - locations_list
            - locations_find
            - locations_get_by_area
            - locations_add
            - locations_metadata_set
            - locations_rename
            - locations_update_description
            - locations_delete
            - locations_delete_safe
            - locations_reparent_bulk
            - locations_audit
            - locations_hierarchy_rebuild
            - shopping_add_missing
            - shopping_add_overdue
            - shopping_add_expired
            - shopping_add_product
            - shopping_remove_product
            - shopping_clear_list
            - recipes_list
            - recipes_fulfillment
            - recipe_check_fulfillment
            - recipes_add_to_shopping
            - recipes_consume
            - recipes_copy
            - chores_list
            - chores_find
            - chores_execute
            - chores_undo
            - tasks_list
            - tasks_find
            - tasks_complete
            - tasks_undo
            - tasks_add
            - tasks_tag
            - units_list
            - units_find
            - units_add
            - units_update
            - unit_conversions_add
            - unit_conversions_list
            - unit_conversions_delete
            - product_groups_list
            - product_groups_find
            - batteries_list
            - batteries_get
            - batteries_charge
            - userfields_list
            - userfields_deploy
            - userfields_repair
            - userfields_delete
        default: help
      item:
        name: Item
        description: 'Name resolved to Grocy ID. E.g. "coffee", "Pantry", "Clean litter box".'
        selector:
          text:
      product_id:
        name: Product ID
        description: Explicit product ID. Skips product name resolution.
        selector:
          number:
            min: 1
      barcode:
        name: Barcode
        description: Product barcode (EAN/UPC) for barcode-based stock operations.
        selector:
          text:
      brand:
        name: Brand
        description: Optional - Product meta - Brand of Product
        selector:
          text:
      sku:
        name: SKU
        description: Optional - Product meta - Product SKU
        selector:
          text:
      product_id_keep:
        name: Product ID to Keep
        description: Canonical product ID that will remain.
        selector:
          number:
            min: 1
      product_id_remove:
        name: Product ID to Remove
        description: Duplicate product ID that will be merged and deleted.
        selector:
          number:
            min: 1
      product_group_id:
        name: Product Group ID
        description: Grocy product group ID for update_product_meta.
        selector:
          number:
            min: 1
      amount:
        name: Amount
        description: Quantity used for stock math such as buy, consume, or transfer.
        selector:
          number:
            min: 0
            step: 0.01
      unit:
        name: Unit
        description: Quantity unit name (exact Grocy match, e.g. each, kg, l).
        selector:
          text:
      unit_id:
        name: Unit ID
        description: Explicit quantity unit ID. Skips unit name lookup.
        selector:
          number:
            min: 1
      purchase_unit_id:
        name: Purchase Unit ID
        description: Separate purchase unit for update_product_meta. Defaults to unit_id if omitted.
        selector:
          number:
            min: 1
      price:
        name: Price
        description: Optional unit price used for purchase transactions.
        selector:
          number:
            min: 0
            step: 0.01
      best_before_date:
        name: Best Before
        description: Optional best-before or due date for inventory entries.
        selector:
          date:
      location:
        name: Location
        description: Source or primary location name used by location-aware cases.
        selector:
          text:
      location_id:
        name: Location ID
        description: Explicit location ID. Skips location name resolution.
        selector:
          number:
            min: 1
      to_location:
        name: To Location
        description: Destination location name for transfer operations.
        selector:
          text:
      to_location_id:
        name: To Location ID
        description: Explicit destination location ID for transfers.
        selector:
          number:
            min: 1
      to_unit_id:
        name: To Unit ID
        description: Destination unit ID for unit_conversions_add.
        selector:
          number:
            min: 1
      store:
        name: Store
        description: Shopping location name used for purchase-related cases only.
        selector:
          text:
      shopping_location_id:
        name: Shopping Location ID
        description: Explicit shopping location ID. Skips store name lookup.
        selector:
          number:
            min: 1
      location_subclass:
        selector:
          select:
            options:
            - suite
            - room
            - closet
            - workspace
            - container
            - furniture
            - shelf
            - drawer
            - cubby
            - storage
        description: What type of location / storage is this? (location metadata)
      homeassistant_area_id:
        name: Home Assistant Area
        description: Home Assistant area associated with this Grocy location.
        selector:
          text:
      placement_priority:
        name: Placement Priority
        description: Numeric semantic priority for resolving locations. Higher wins.
        selector:
          number:
            min: 0
            step: 1
      parent_location:
        name: Parent Location
        description: Parent location name used when setting location metadata.
        selector:
          text:
      parent_location_id:
        name: Parent Location ID
        description: Explicit parent location ID used for location metadata.
        selector:
          number:
            min: 1
      child_location_ids:
        name: Child Location IDs
        description: JSON array of child IDs for bulk reparent. E.g. "[201,202,203]"
        selector:
          text:
      orphan_to:
        name: Orphan To Location ID
        description: Location to receive stock before safe-delete.
        selector:
          number:
            min: 1
      list_id:
        name: Shopping List ID
        description: Optional shopping list ID override for shopping list cases.
        selector:
          number:
            min: 1
      page:
        name: Page
        description: Page number (1-based)
        selector:
          number:
            min: 1
        default: 1
      per_page:
        name: Items per page
        description: Number of items per page
        selector:
          number:
            min: 1
            max: 250
        default: 25
      done_only:
        name: Done Only
        description: For shopping_clear_list — only clear items marked done (false clears all).
        selector:
          boolean:
        default: false
      recipe_id:
        name: Recipe ID
        description: Explicit Grocy recipe ID. Skips recipe name lookup.
        selector:
          number:
            min: 1
      chore_id:
        name: Chore ID
        description: Explicit chore ID. Skips chore name lookup.
        selector:
          number:
            min: 1
      task_id:
        name: Task ID
        description: Explicit task ID. Skips task name lookup.
        selector:
          number:
            min: 1
      entry_id:
        name: Stock Entry ID
        description: Specific stock entry ID for stock_entry_update. Get IDs via stock_entries_for_item.
        selector:
          number:
            min: 1
      execution_id:
        name: Chore Execution ID
        description: Execution ID to undo for chores_undo.
        selector:
          number:
            min: 1
      booking_id:
        name: Booking ID
        description: Booking ID to undo for stock_undo_booking.
        selector:
          number:
            min: 1
      battery_id:
        name: Battery ID
        description: Grocy battery ID for batteries_get and batteries_charge.
        selector:
          number:
            min: 1
      field_id:
        description: "Userfield schema definition ID. Required for userfields_delete. Get IDs via userfields_list."
        required: false
        selector:
          number:
            min: 1
      entity:
        description: "Grocy entity name for userfields_list filter (locations, products, chores, tasks). Omit for all."
        required: false
        selector:
          text:
      period_days:
        name: Period Days
        description: Chore recurrence in days (chores_add, chores_edit).
        selector:
          number:
            min: 1
      note:
        name: Note
        description: Note or description text (also used by locations_update_description).
        selector:
          text:
            multiline: true
      new_name:
        name: New Name
        description: New name for the location.
        selector:
          text:
      report_inventory:
        name: Report Inventory
        description: Return a post-purchase inventory summary after buying.
        selector:
          boolean:
        default: true
      confirm_action:
        name: Confirm Action
        description: Bypass dupe guard on locations_add; confirm protected ops.
        selector:
          boolean:
      hazmat_class:
        name: Hazmat Class
        description: Hazmat major class (e.g. flammable, corrosive, toxic). Triggers lean RM safety log.
        selector:
          text:
      dry_run:
        name: Dry Run
        description: Return plan without writing. For locations_hierarchy_rebuild.
        selector:
          boolean:

      show_trace:
        name: Show Debug Trace
        description: Include resolution details, IDs, and endpoint information.
        selector:
          boolean:
    sequence:
    - variables:
        show_trace: '{{ show_trace | default(false) }}'
        tool_name: Zen DojoTools Inventory
        tool_version: 4.48.0
        schema_version: "1.0.0"
    # ─── CASE AUTHORING CHECKLIST ────────────────────────────────────────────────
    # When adding a new mode/case to this script, update ALL of the following:
    #  1. fields: mode: enum        — add the mode name to the selector options list
    #  2. cases: dict (help block)  — add entry with intent/needs/optional/does/note/example
    #  3. Endpoint block            — add elif branch: mode_norm == 'X' -> /path
    #  4. action_type block         — add to read/post/update/delete list as appropriate
    #  5. payload: block            — add elif branch if this mode needs a body
    #  6. Guards / choose branches  — add any required-field guards before the API call
    #  7. filtered_result template  — add elif branch if the response needs reshaping
    #  8. _meta / _ns.p paths       — update both payload-build paths if the case writes
    # Reminder: cases: dict feeds help_json automatically via combine — do NOT duplicate
    # ─────────────────────────────────────────────────────────────────────────────
    - variables:
        grocy_response: {}
        mode_norm: '{{ (mode | default(''help'')) | string | lower }}'
        item_norm: '{{ (item | default('''')) ~ '''' | trim }}'
        unit_norm: "{{\n  (unit | default('each')) ~ ''\n  | trim\n  | lower\n}}"
        loc_norm: '{{ (location | default('''')) ~ '''' | trim }}'
        loc_sub_norm: '{{ ( location_subclass | default('''') ) }}'
        to_loc_norm: '{{ (to_location | default('''')) ~ '''' | trim }}'
        store_norm: '{{ (store | default('''')) ~ '''' | trim }}'
        report_inventory_norm: '{{ report_inventory | default(true) }}'
        parent_loc_norm: '{{ (parent_location | default('''')) ~ '''' | trim }}'
        parent_lid_in: '{{ parent_location_id | default(none) }}'
        area_id_norm: "{{ (homeassistant_area_id | default('', true) or area | default('', true)) | string | trim | lower }}"
        new_name_norm: '{{ (new_name | default('''')) ~ '''' | trim }}'
        placement_priority_in: '{{ placement_priority | default(none) }}'
        pid_keep_in: '{{ product_id_keep | default(none) }}'
        pid_remove_in: '{{ product_id_remove | default(none) }}'
        product_group_id_in: '{{ product_group_id | default(none) }}'
        uid_in: '{{ unit_id | default(none) }}'
        purchase_uid_in: '{{ purchase_unit_id | default(none) }}'
        pid_in: "{% set pid = product_id | default(none) %} {% if pid is not none %}\n
          \ {{ pid }}\n{% elif item is number %}\n  {{ item | int }}\n{% else %}\n  {{
          none }}\n{% endif %}"
        lid_in: "{% set lid = location_id | default(none) %}\n{% if lid is not none
          %}\n  {{ lid }}\n{% elif location is number %}\n  {{ location | int }}\n{%
          elif location is string and location | trim | regex_match('^\\\\d+$') %}\n
          \ {{ location | int }}\n{% else %}\n  {{ none }}\n{% endif %}"
        to_lid_in: "{% set lid = to_location_id | default(none) %}\n{% if lid is not
          none %}\n  {{ lid }}\n{% elif to_location is number %}\n  {{ to_location |
          int }}\n{% else %}\n  {{ none }}\n{% endif %}"
        to_unit_id_in: '{{ to_unit_id | default(none) }}'
        slid_in: '{{ shopping_location_id | default(none) }}'
        cid_in: '{{ chore_id | default(none) }}'
        tid_in: '{{ task_id | default(none) }}'
        amt_in: '{{ amount | default(1) | float(0) }}'
        price_in: '{{ price | default(none) }}'
        bbd_in: '{{ best_before_date | default(none) }}'
        list_in: '{{ list_id | default(none) }}'
        note_in: '{{ note | default('''') | string | trim }}'
        payload_in: '{{ payload | default(none) }}'
        page_in: '{{ page | default(1) | int(1) }}'
        per_page_in: '{{ per_page | default(25) | int(25) }}'
        confirm_action_in: '{{ confirm_action | default(false) | bool }}'
        hazmat_class_in: '{{ hazmat_class | default(none, true) }}'
        dry_run_in: '{{ dry_run | default(false) | bool }}'
        has_item_name: '{{ item_norm is string and item_norm | length > 0 }}'
        has_loc_name: '{{ loc_norm is string and loc_norm | length > 0 }}'
        has_to_loc_name: '{{ to_loc_norm is string and to_loc_norm | length > 0 }}'
        has_parent_loc_name: '{{ parent_loc_norm is string and parent_loc_norm | length
          > 0 }}'
        has_new_name: '{{ new_name_norm is string and new_name_norm | length > 0 }}'
        has_area_id: '{{ area_id_norm is string and area_id_norm | length > 0 }}'
        has_loc_subclass: '{{ loc_sub_norm is string and loc_sub_norm | length > 0 }}'
        has_store_name: '{{ store_norm is string and store_norm | length > 0 }}'
        has_unit_name: '{{ unit_norm is string and unit_norm | length > 0 }}'
        has_note: '{{ note_in is string and note_in | length > 0 }}'
        has_brand: '{{ brand is string and brand | length > 0 }}'
        has_sku: '{{ sku is string and sku | length > 0 }}'
        barcode_norm: '{{ (barcode | default("")) | string | trim }}'
        recipe_id_in: '{{ recipe_id | default(none) }}'
        entry_id_in: '{{ entry_id | default(none) }}'
        execution_id_in: '{{ execution_id | default(none) }}'
        booking_id_in: '{{ booking_id | default(none) }}'
        battery_id_in: '{{ battery_id | default(none) }}'
        done_only_in: '{{ done_only | default(false) }}'
        has_barcode: '{{ barcode_norm | length > 0 }}'
        has_explicit_amount: '{{ amount is defined and amount is not none }}'
        recipe_id_resolved: '{{ recipe_id | default(none) }}'
        child_lids_in: '{{ child_location_ids | default("[]") }}'
        orphan_to_lid_in: '{{ orphan_to | default(none) }}'
    - variables:
        cases:
          catalog_list_products:
            intent: List all products (catalog).
            needs: []
            does: GET /objects/products
            paging:
              required: true
              default:
                pageNumber: 1
                perPage: 25
            example: "{'mode':'catalog_list_products','per_page':25}"
          catalog_find_product:
            intent: Find a product by name (catalog lookup).
            needs:
            - item
            does: GET /objects/products + local name match
            example: "{'mode':'catalog_find_product','item':'coffee'}"
          catalog_add_product:
            intent: Create a 0-stock catalog entry for a product not yet owned.
            needs:
            - item
            - location OR location_id
            optional:
            - sku
            - brand
            - note
            - unit OR unit_id
            - confirm_action (bypass dupe guard)
            does: GET dupe-check + POST /objects/products
            example: "{'mode':'catalog_add_product','item':'Roborock HEPA Filter','location_id':80,'sku':'8.02.0104','brand':'Roborock'}"
          catalog_delete_product:
            intent: Delete a product. Stock guard - offer merge or confirm to override.
            needs:
            - item OR product_id
            optional:
            - product_id_keep (merge stock into this product instead of blocking)
            - confirm_action (delete even if stock > 0, discards stock)
            does: GET stock check; if stock+keep → merge; if stock+no keep → guard; else DELETE
            example: "{'mode':'catalog_delete_product','product_id':401,'product_id_keep':411}"
          get_product_meta:
            intent: Retrieve canonical product metadata.
            needs:
            - item OR product_id
            does: GET /objects/products/{productId}
            example: "{'mode':'get_product_meta','item':'coffee'}"
          rename_product:
            intent: Rename a product (display name only).
            needs:
            - item OR product_id
            - new_name
            does: PUT /objects/products/{productId}
            notes:
            - Product ID remains stable
            - Stock and history are unaffected
            example: "{'mode':'rename_product','item':'coffee','new_name':'Whole Bean Coffee'}"
          update_product_meta:
            intent: Update declarative product metadata. unit_id sets qu_id_stock+consume (purchase unit preserved unless purchase_unit_id given). purchase_unit_id requires a global QU conversion to exist.
            needs:
            - item OR product_id
            optional:
            - note
            - unit OR unit_id
            - purchase_unit_id (separate purchase unit; requires global QU conversion to stock unit)
            - amount (sets min_stock_amount)
            - shopping_location_id (sets preferred store/shopping location)
            - to_location_id (sets default_consume_location_id — where item is consumed from by default)
            - product_group_id (sets product group/category)
            does: PUT /objects/products/{productId}
            supported_fields:
            - description
            - note
            - brand (stored in description if present)
            - sku (stored in description if present)
            - unit/unit_id (sets qu_id_stock, qu_id_consume; also qu_id_purchase unless purchase_unit_id given)
            - purchase_unit_id (optional — separate purchase unit; requires global QU conversion to stock unit)
            - amount (sets min_stock_amount — warning threshold)
            - shopping_location_id (preferred shopping/store location)
            - to_location_id (sets default_consume_location_id)
            - product_group_id (product category group ID — use product_groups_list to find IDs)
            constraints:
            - No stock semantics are modified
            - description only sent when note/brand/sku provided
            - purchase_unit_id != unit_id requires global QU conversion — run unit_conversions_list first
            - setting unit_id alone preserves existing qu_id_purchase (no self-referential conversion)
            - CANNOT update unit_id if product has null qu_id_stock — delete and recreate instead
            example: "{'mode':'update_product_meta','item':'pH Up','unit_id':4,'purchase_unit_id':18}"
          set_default_location_for_product:
            intent: Set the default storage location for new purchases.
            needs:
            - item OR product_id
            - location OR location_id
            does: PUT /objects/products/{productId}
            example: "{'mode':'set_default_location_for_product','item':'coffee','location':'Pantry'}"
          products_merge:
            intent: Merge two products into one canonical product.
            needs:
            - product_id_keep
            - product_id_remove
            does: POST /stock/products/{productIdToKeep}/merge/{productIdToRemove}
            notes:
            - Moves all stock, history, and references
            - Removes the source product
            - This action is irreversible
            example: "{'mode':'products_merge','product_id_keep':42,'product_id_remove':99}"
          resolve_products_by_ids:
            intent: 'Internal: resolve product IDs to names'
            needs:
            - product_ids
            internal: true
            does: GET /objects/products/{productId}
            example: "internal — not for direct use"
          stock_list_by_location:
            intent: What is in a location.
            needs:
            - location OR location_id
            does: GET /stock/locations/{locationId}/entries
            example: "{'mode':'stock_list_by_location','location':'Pantry'}"
          stock_check_item:
            intent: Do we have the item.
            needs:
            - item OR product_id
            does: GET /stock/products/{productId}/entries
            example: "{'mode':'stock_check_item','item':'coffee'}"
          stock_where_is_item:
            intent: Where is the item stored. NOTE - returns identical data to stock_check_item. Prefer stock_check_item to avoid a redundant call.
            needs:
            - item OR product_id
            does: GET /stock/products/{productId}/locations
            example: "{'mode':'stock_check_item','item':'coffee'}"
          stock_entries_for_item:
            intent: Detailed stock entries for an item.
            needs:
            - item OR product_id
            does: GET /stock/products/{productId}/entries
            example: "{'mode':'stock_entries_for_item','item':'coffee'}"
          stock_add_purchase:
            intent: Purchase into inventory.
            needs:
            - item OR product_id
            does: POST /stock/products/{productId}/add
            example: "{'mode':'stock_add_purchase','item':'coffee','amount':2,'location':'Pantry'}"
          stock_buy_product:
            intent: Create product if missing, then purchase into inventory.
            needs:
            - item OR product_id
            does: POST /objects/products (optional) + POST /stock/products/{productId}/add
            example: "{'mode':'stock_buy_product','item':'coffee','amount':1,'location':'Pantry'}"
          stock_consume:
            intent: Consume from stock.
            needs:
            - item OR product_id
            does: POST /stock/products/{productId}/consume
            example: "{'mode':'stock_consume','item':'coffee','amount':1}"
          stock_inventory_adjust:
            intent: Reconcile inventory to a measured total.
            needs:
            - item OR product_id
            - amount
            does: POST /stock/products/{productId}/inventory
            example: "{'mode':'stock_inventory_adjust','item':'coffee','amount':5}"
          stock_transfer_location:
            intent: Move item between locations.
            needs:
            - item OR product_id
            - location OR location_id
            - to_location OR to_location_id
            does: POST /stock/products/{productId}/transfer
            example: "{'mode':'stock_transfer_location','item':'coffee','location':'Pantry','to_location':'Kitchen'}"
          shopping_add_missing:
            intent: Add items below min stock to shopping list.
            needs:
            - optional list_id
            does: POST /stock/shoppinglist/add-missing-products
            example: "{'mode':'shopping_add_missing'}"
          shopping_add_overdue:
            intent: Add overdue products to shopping list.
            needs:
            - optional list_id
            does: POST /stock/shoppinglist/add-overdue-products
            example: "{'mode':'shopping_add_overdue'}"
          shopping_add_expired:
            intent: Add expired products to shopping list.
            needs:
            - optional list_id
            does: POST /stock/shoppinglist/add-expired-products
            example: "{'mode':'shopping_add_expired'}"
          chores_add:
            intent: Create a new Grocy chore, optionally linked to a product consumed on execution.
            needs: [item]
            optional: [note, product_id, product_amount, period_type, period_days]
            does: POST /objects/chores
            example: "{'mode':'chores_add','item':'Replace waste basket liner','product_id':387,'product_amount':1,'period_days':7}"
          chores_tag:
            intent: Set homeassistant_area and/or entity_id userfields on an existing chore. Required for chores_by_area and room_brief area discovery.
            needs: [chore_id OR item]
            optional: [homeassistant_area_id, homeassistant_entity_id]
            does: PUT /userfields/chores/{choreId}
            example: "{'mode':'chores_tag','item':'Lawn Tractor Oil Change','homeassistant_area_id':'garage'}"
          chores_delete:
            intent: Delete a Grocy chore by name or chore_id.
            needs: [chore_id OR item]
            does: GET /objects/chores/{id} (confirm) → DELETE /objects/chores/{id}
            example: "{'mode':'chores_delete','item':'Clean litter box'}"
          chores_edit:
            intent: Edit an existing chore. Pass only fields to change; others are preserved.
            needs: [chore_id OR item]
            optional: [new_name, period_type, period_days, product_id, product_amount, note, active]
            does: GET /objects/chores/{id} → merge overrides → PUT /objects/chores/{id}
            example: "{'mode':'chores_edit','item':'Replace waste basket liner','period_days':14,'new_name':'Replace liner'}"
          stock_area_inventory:
            intent: Full denormalized room view — all locations with product names and amounts. One call replaces N location + M product lookups.
            needs: [homeassistant_area_id]
            optional: []
            does: GET locations (area filter) + GET stock entries per location + GET all products (joined locally)
            example: "{'mode':'stock_area_inventory','homeassistant_area_id':'powder_room'}"
          chores_list:
            intent: List all chores.
            needs: []
            does: GET /objects/chores
            example: "{'mode':'chores_list'}"
          chores_find:
            intent: Find chores by name.
            needs:
            - item
            does: GET /objects/chores + local name match
            example: "{'mode':'chores_find','item':'kitchen'}"
          chores_execute:
            intent: Execute a chore.
            needs:
            - chore_id OR item
            does: POST /chores/{choreId}/execute
            example: "{'mode':'chores_execute','item':'Clean litter box'}"
          tasks_list:
            intent: List all tasks.
            needs: []
            does: GET /objects/tasks
            example: "{'mode':'tasks_list'}"
          tasks_find:
            intent: Find tasks by name.
            needs:
            - item
            does: GET /objects/tasks + local name match
            example: "{'mode':'tasks_find','item':'grocery'}"
          tasks_complete:
            intent: Complete a task.
            needs:
            - task_id OR item
            does: POST /tasks/{taskId}/complete
            example: "{'mode':'tasks_complete','item':'Buy groceries'}"
          locations_add:
            intent: Create a new Grocy location. Dupe-guards similar names; add confirm_action true to bypass.
            needs:
            - location
            optional:
            - parent_location
            - parent_location_id
            - location_subclass
            - area_id
            - placement_priority
            - confirm_action
            does:
            - POST /objects/locations
            - PUT /userfields/locations/{locationId} (if metadata provided)
            example: "{'mode':'locations_add','location':'Coffee Drawer','parent_location':'Kitchen','location_subclass':'drawer'}"
          locations_list:
            intent: List all locations.
            needs: []
            does: GET /objects/locations
            example: "{'mode':'locations_list'}"
          locations_find:
            intent: Find locations by name and/or parent anchor. parent_location_id alone lists all containers in a room.
            needs:
            - location (optional — name search)
            - parent_location_id (optional — filter to children of this anchor)
            does: GET /objects/locations + local filter
            example: "{'mode':'locations_find','parent_location_id':15}"
          locations_rename:
            intent: Rename a Grocy location.
            needs:
            - location OR location_id
            - new_name
            does: PUT /objects/locations/{locationId}
            example: "{'mode':'locations_rename','location':'Coffee Drawer','new_name':'Coffee Station'}"
          locations_update_description:
            intent: Update the description field of an existing Grocy location.
            needs:
            - location OR location_id
            - note (new description text)
            does: PUT /objects/locations/{locationId}
            example: "{'mode':'locations_update_description','location_id':276,'note':'Hazmat/MSDS — paint and household chemicals'}"
          locations_get_by_area:
            intent: Reverse lookup — find the Grocy location anchored to a given HA area_id. Returns the room anchor and any tagged children.
            needs:
            - homeassistant_area_id
            does: GET /objects/locations + filter by userfields.homeassistant_area (case-insensitive)
            example: "{'mode':'locations_get_by_area','homeassistant_area_id':'garage'}"
          locations_metadata_set:
            intent: Set governed semantic metadata for a location.
            needs:
            - location OR location_id
            - at least one of parent_location, parent_location_id, location_subclass,
              area_id, placement_priority
            does: PUT /userfields/locations/{locationId}
            example: "{'mode':'locations_metadata_set','location':'Coffee Drawer','parent_location':'Kitchen','area_id':'kitchen','location_subclass':'drawer','placement_priority':10}"
          locations_delete:
            intent: Permanently delete a Grocy location. Only call when the location has no stock.
            needs:
            - location_id
            does: DELETE /objects/locations/{locationId}
            example: "{'mode':'locations_delete','location_id':261}"
          units_list:
            intent: List all quantity units.
            needs: []
            does: GET /objects/quantity_units
            example: "{'mode':'units_list'}"
          units_find:
            intent: Find a quantity unit by exact name.
            needs:
            - unit
            does: GET /objects/quantity_units + exact local name match
            example: "{'mode':'units_find','unit':'each'}"
          units_add:
            intent: Create a new quantity unit. Idempotent — returns existing unit if name already found.
            needs:
            - unit
            optional:
            - note
            does: GET /objects/quantity_units + POST if not found
            constraints:
            - No fuzzy creation
            - Returns already_exists status if unit found (not an error)
            example: "{'mode':'units_add','unit':'can','note':'Standard grocery can'}"
          units_update:
            intent: Update an existing quantity unit.
            needs:
            - unit_id
            optional:
            - unit
            - note
            does: PUT /objects/quantity_units/{unitId}
            constraints:
            - unit_id is required
            - Renames must differ from current name
            example: "{'mode':'units_update','unit_id':5,'unit':'each'}"
          unit_conversions_add:
            intent: Add a QU conversion between two units (required before changing qu_id_stock on a product with stock).
            needs:
            - unit_id
            - to_location_id
            - amount
            optional:
            - product_id
            does: POST /objects/quantity_unit_conversions
            note: unit_id=from_qu_id, to_unit_id=to_qu_id, amount=factor; to_location_id still accepted as fallback
            example: "{'mode':'unit_conversions_add','unit_id':47,'to_unit_id':70,'amount':1}"
          unit_conversions_list:
            intent: List QU conversions. Optionally filter by unit_id (matches from OR to) or product_id.
            needs: []
            optional:
            - unit_id
            - product_id
            does: GET /objects/quantity_unit_conversions
            note: Use before unit_conversions_add to avoid duplicates. Use to audit orphaned conversions.
            example: "{'mode':'unit_conversions_list','unit_id':18}"
          unit_conversions_delete:
            intent: Delete a QU conversion by its row ID. Get IDs via unit_conversions_list.
            needs:
            - entry_id
            does: DELETE /objects/quantity_unit_conversions/{id}
            note: entry_id here is the conversion row ID from unit_conversions_list (not a stock entry ID).
            example: "{'mode':'unit_conversions_delete','entry_id':5}"
          shopping_add_product:
            intent: Add a specific product to a shopping list.
            needs:
            - item OR product_id
            optional:
            - amount
            - list_id
            does: POST /stock/shoppinglist/add-product
            example: "{'mode':'shopping_add_product','item':'coffee','amount':2}"
          shopping_remove_product:
            intent: Remove a specific product from a shopping list.
            needs:
            - item OR product_id
            optional:
            - amount
            - list_id
            does: POST /stock/shoppinglist/remove-product
            example: "{'mode':'shopping_remove_product','item':'coffee'}"
          shopping_clear_list:
            intent: Clear a shopping list (all or done-only).
            needs: []
            optional:
            - list_id
            - done_only
            does: POST /stock/shoppinglist/clear
            example: "{'mode':'shopping_clear_list'}"
          recipes_list:
            intent: List all Grocy recipes.
            needs: []
            does: GET /objects/recipes
            paging:
              required: true
              default:
                pageNumber: 1
                perPage: 25
            example: "{'mode':'recipes_list'}"
          recipes_fulfillment:
            intent: What recipes can I make with current stock?
            needs: []
            does: GET /recipes/fulfillment
            example: "{'mode':'recipes_fulfillment'}"
          recipe_check_fulfillment:
            intent: Can I make a specific recipe with current stock?
            needs:
            - item OR recipe_id
            does: GET /recipes/{recipeId}/fulfillment
            example: "{'mode':'recipe_check_fulfillment','item':'House Blend Coffee'}"
          recipes_add_to_shopping:
            intent: Add missing recipe ingredients to a shopping list.
            needs:
            - item OR recipe_id
            optional:
            - list_id
            does: POST /recipes/{recipeId}/add-not-fulfilled-products-to-shoppinglist
            example: "{'mode':'recipes_add_to_shopping','item':'House Blend Coffee'}"
          recipes_consume:
            intent: Mark a recipe as made — consumes ingredients from stock.
            needs:
            - item OR recipe_id
            does: POST /recipes/{recipeId}/consume
            example: "{'mode':'recipes_consume','item':'House Blend Coffee'}"
          recipes_copy:
            intent: Duplicate a recipe.
            needs:
            - item OR recipe_id
            does: POST /recipes/{recipeId}/copy
            example: "{'mode':'recipes_copy','item':'House Blend Coffee'}"
          stock_overview:
            intent: Overview of all products currently in stock.
            needs: []
            does: GET /objects/stock
            paging:
              required: true
              default:
                pageNumber: 1
                perPage: 25
            example: "{'mode':'stock_overview','per_page':25}"
          stock_list_volatile:
            intent: List products that are due soon, overdue, or expired.
            needs: []
            does: GET /stock/volatile
            example: "{'mode':'stock_list_volatile'}"
          stock_get_product_details:
            intent: Get stock-context details for a product (amount, value, best_before).
            needs:
            - item OR product_id
            does: GET /stock/products/{productId}
            example: "{'mode':'stock_get_product_details','item':'coffee'}"
          stock_open_item:
            intent: Mark a product as opened.
            needs:
            - item OR product_id
            optional:
            - amount
            - best_before_date
            does: POST /stock/products/{productId}/open
            example: "{'mode':'stock_open_item','item':'coffee'}"
          stock_entry_update:
            intent: Edit a specific stock entry — pass only the fields to change.
            needs:
            - entry_id
            - item OR product_id
            optional:
            - amount
            - best_before_date
            - location
            - price
            - note
            does: PUT /stock/entry/{entryId}
            notes:
            - Get entry_id via stock_entries_for_item
            - Reads current entry first then merges your changes (safe partial update)
            example: "{'mode':'stock_entry_update','item':'House Blend Coffee','entry_id':42,'best_before_date':'2026-12-31'}"
          stock_undo_booking:
            intent: Undo a stock booking by booking ID.
            needs:
            - booking_id
            does: POST /stock/bookings/{bookingId}/undo
            example: "{'mode':'stock_undo_booking','booking_id':524}"
          tasks_undo:
            intent: Undo a completed task.
            needs:
            - item OR task_id
            does: POST /tasks/{taskId}/undo
            example: "{'mode':'tasks_undo','item':'Buy groceries'}"
          tasks_add:
            intent: Create a new Grocy task.
            needs: [item]
            optional: [note, best_before_date, homeassistant_area_id]
            does: POST /objects/tasks
            example: "{'mode':'tasks_add','item':'Check front tires','note':'Needs diagnosis + parts before repair'}"
          tasks_tag:
            intent: Set homeassistant_area userfield on an existing task.
            needs: [task_id OR item]
            optional: [homeassistant_area_id]
            does: PUT /userfields/tasks/{taskId}
            example: "{'mode':'tasks_tag','item':'Check front tires','homeassistant_area_id':'garage'}"
          chores_undo:
            intent: Undo a chore execution by execution ID.
            needs:
            - execution_id
            does: POST /chores/executions/{executionId}/undo
            notes:
            - execution_id is required (not chore_id)
            example: "{'mode':'chores_undo','execution_id':42}"
          catalog_find_by_barcode:
            intent: Find a product by barcode.
            needs:
            - barcode
            does: GET /stock/products/by-barcode/{barcode}
            example: "{'mode':'catalog_find_by_barcode','barcode':'012345678901'}"
          stock_add_by_barcode:
            intent: Purchase a product into stock using a barcode.
            needs:
            - barcode
            optional:
            - amount
            - location
            - price
            - best_before_date
            does: POST /stock/products/by-barcode/{barcode}/add
            example: "{'mode':'stock_add_by_barcode','barcode':'012345678901','amount':2}"
          stock_consume_by_barcode:
            intent: Consume a product from stock using a barcode.
            needs:
            - barcode
            optional:
            - amount
            does: POST /stock/products/by-barcode/{barcode}/consume
            example: "{'mode':'stock_consume_by_barcode','barcode':'012345678901'}"
          batteries_list:
            intent: List all tracked rechargeable batteries.
            needs: []
            does: GET /batteries
            example: "{'mode':'batteries_list'}"
          batteries_get:
            intent: Get details for a specific rechargeable battery.
            needs:
            - battery_id
            does: GET /batteries/{batteryId}
            example: "{'mode':'batteries_get','battery_id':1}"
          product_groups_list:
            intent: List all Grocy product groups.
            needs: []
            does: GET /objects/product_groups
            example: "{'mode':'product_groups_list'}"
          product_groups_find:
            intent: Find a product group by name (partial, case-insensitive).
            needs:
            - item
            does: GET /objects/product_groups + local name match
            example: "{'mode':'product_groups_find','item':'spa'}"
          batteries_charge:
            intent: Record a charge cycle for a rechargeable battery.
            needs:
            - battery_id
            optional:
            - amount
            does: POST /batteries/{batteryId}/charge
            example: "{'mode':'batteries_charge','battery_id':1}"
          locations_reparent_bulk:
            intent: Bulk-set a new parent on multiple child locations with JS reconciliation.
            needs:
            - parent_location_id
            - child_location_ids
            does: PUT /userfields/locations/{childId} per child + JS register + JS evict
            example: "{'mode':'locations_reparent_bulk','parent_location_id':15,'child_location_ids':'[201,202,203]'}"
          locations_audit:
            intent: Scan all locations, report HA area mismatches and parent/child integrity issues.
            needs: []
            does: GET /objects/locations?limit=500&offset=0
            example: "{'mode':'locations_audit'}"
          stock_register_asset:
            intent: "1-call asset registration: create product, stock 1 unit BBD=never, set meta. Dupe-guards. hazmat_class triggers lean RM safety[] log."
            needs:
            - item
            - location
            optional:
            - note
            - brand
            - sku
            - price
            - hazmat_class
            - confirm_action
            example: "{'mode':'stock_register_asset','item':'Power Drill','location':'Garage','note':'18V cordless, model XR20V','brand':'DeWalt'}"
          locations_delete_safe:
            intent: Delete a location, transferring any stock to orphan_to first if needed.
            needs:
            - location_id
            optional:
            - orphan_to
            does: GET stock/locations/{id}/entries + optional transfer + DELETE
            example: "{'mode':'locations_delete_safe','location_id':261,'orphan_to':141}"
          locations_hierarchy_rebuild:
            intent: Rebuild grocy_child_location_ids for all parent locations from ground truth. Fixes stale lists after bulk imports or direct API edits.
            needs: []
            optional: [dry_run]
            does: GET all locations, derive children per parent, PUT corrected lists
            example: "{'mode':'locations_hierarchy_rebuild'}"
          stock_area_summary:
            intent: Containers + item counts for a HA area. Returns flat locations list + location_tree (3-level hierarchy). Includes RM anchor + hazmat safety.
            needs: [homeassistant_area_id]
            optional: []
            does: GET locations by area, GET all products in single bulk call, count by default location_id per location, build location_tree from grocy_parent_location_id userfield, read RM spatial for anchor + safety
            note: "Area membership flows via default location: product.location_id → location.homeassistant_area_id → HA area. Products do NOT need a direct area_id. To add a product to an area summary, set its default location to any location in that area."
            example: "{'mode':'stock_area_summary','homeassistant_area_id':'kitchen'}"
          stock_area_volatile:
            intent: Volatile items (overdue/due_soon/expiring) stored in a HA area. Filters whole-house volatile by room location membership.
            needs: [homeassistant_area_id]
            optional: []
            does: GET locations by area, GET /stock/volatile, filter slim items by default location_id membership, return overdue/due_soon/expiring lists + counts
            example: "{'mode':'stock_area_volatile','homeassistant_area_id':'kitchen'}"
          chores_by_area:
            intent: Chores for a HA area. Two discovery paths - product stocked in area, or chore userfield homeassistant_area tagged directly.
            needs: [homeassistant_area_id]
            optional: []
            does: GET locations + chore defs + chore state. Path 1 = product entries in area locs. Path 2 = userfields.homeassistant_area match. discovery field shows which path.
            example: "{'mode':'chores_by_area','homeassistant_area_id':'powder_room'}"
          room_brief:
            intent: Chores + stock summary for a HA area in one call. Use instead of chores_by_area + stock_area_summary to save a round trip.
            needs: [homeassistant_area_id]
            reads: chores_by_area + stock_area_summary combined
            example: "{'mode':'room_brief','homeassistant_area_id':'kitchen'}"
          userfields_list:
            intent: List all Grocy userfield schema definitions.
            needs: []
            optional: [entity]
            reads: GET /objects/userfields
          userfields_deploy:
            intent: Idempotent deploy of canonical ZenOS userfield schema. Creates missing fields, skips existing. Stamps schema_version to household cabinet.
            needs: []
            writes: POST /objects/userfields (per missing field)
            notes:
              - Mealie owns mealie_ingredient_id - not deployed here
              - schema_version stamped to household cabinet grocy_schema key
          userfields_repair:
            intent: "Diff live Grocy schema vs canonical. Reports ok/missing/type_drift/unknown + version delta. Fixes missing unless dry_run=true."
            needs: []
            optional: [dry_run]
            reads: GET /objects/userfields
          userfields_delete:
            intent: Delete a userfield schema definition by ID. Warns if canonical. Preview without confirm_action.
            needs: [field_id]
            optional: [confirm_action]
            writes: "DELETE /objects/userfields/{id}"
            notes:
              - Deleting orphans all stored values for that field. IRREVERSIBLE.
    - alias: 'Mode: Help'
      choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm == ''help'' }}'
          alias: 'Mode: HELP'
        sequence:
        - variables:
            help_json: "{{\n  {\n    \"tool\": tool_name | default(''),\n    \"version\":
              tool_version | default(''),\n    \"overview\":\n      \"Zen DojoTools
              Inventory is a deterministic, construct-safe intent router for Grocy.
              It converts explicit household intents into explicit Grocy API calls.
              All names are resolved to IDs, all writes are intentional, and no implicit
              mutation or inference is performed. Grocy is treated as the canonical
              authority for products, locations, and quantity units.\",\n\n    \"read_this_first\":
              [\n      \"This tool does exactly what you tell it to do—nothing more,
              nothing less.\",\n      \"Every write is intentional. Every ID is resolved
              before execution.\",\n      \"If an operation is blocked, it is because
              Grocy would reject it or the intent was ambiguous.\",\n      \"Errors
              include coaching because guessing would be irresponsible.\",\n      \"If
              you skipped help and hit an error, the help already explained it.\"\n
              \   ],\n    \n    \"operating_model\": {\n      \"resolution_rules\":
              [\n        \"Names are resolved to IDs before any operation\",\n        \"Exact
              matches are preferred; partial matches are fallback\",\n        \"Multiple
              matches cause the operation to stop\"\n      ],\n      \"write_rules\":
              [\n        \"All write operations require explicit case selection\",\n
              \       \"Required fields are enforced per case\",\n        \"No implicit
              create, merge, or delete ever occurs\"\n      ],\n      \"unit_governance\":
              [\n        \"Quantity units are treated as first-class objects\",\n        \"Stock
              operations require resolvable quantity units\",\n        \"Unit creation
              or modification must be explicit\",\n        \"This tool never invents,
              guesses, or normalizes units\"\n      ],\n      \"safety_guards\": [\n
              \       \"Ambiguous intent is rejected\",\n        \"Unsupported Grocy
              behaviors are blocked\",\n        \"This tool never fabricates state or
              guesses outcomes\"\n      ],\n      \"mental_model\": [\n        \"Think
              of this as a controlled command router, not a chat interface\",\n        \"If
              Grocy needs it, you must supply it\",\n        \"If Grocy forbids it,
              this tool will stop you first\"\n      ]\n    },\n\n    \"cases\": {\n\n
              \     \"catalog_list_products\": {\n        \"intent\": \"List all products
              in the Grocy catalog.\",\n        \"needs\": [],\n        \"reads\": \"GET
              /objects/products\"\n      },\n\n      \"catalog_add_product\": {\n        \"intent\": \"Create a new product in the catalog with 0 starting stock. Use for spare parts / consumables that exist in the catalog but have not been purchased yet. Unlike stock_register_asset (which sets stock=1), this leaves stock at 0.\",\n        \"needs\": [\"item\", \"location OR location_id\"],\n        \"optional\": [\"note\", \"brand\", \"sku\"],\n        \"writes\": \"POST /objects/products\",\n        \"notes\": [\"Stock starts at 0 — use stock_buy_product to add units later\", \"Dupe guard: existing product triggers dupe_guard with candidate_ids\"]\n      },\n\n      \"catalog_find_product\": {\n        \"intent\":
              \"Find catalog products by name.\",\n        \"needs\": [\"item\"],\n
              \       \"reads\": \"GET /objects/products (filtered locally by name)\"\n
              \     },\n\n      \"get_product_meta\": {\n        \"intent\": \"Retrieve
              canonical product metadata.\",\n        \"needs\": [\"item OR product_id\"],\n
              \       \"reads\": \"GET /objects/products/{productId}\"\n      },\n\n
              \     \"rename_product\": {\n        \"intent\": \"Rename a product (display
              name only).\",\n        \"needs\": [\"item OR product_id\", \"new_name\"],\n
              \       \"writes\": \"PUT /objects/products/{productId}\",\n        \"notes\":
              [\"Product ID and stock are unaffected\"]\n      },\n\n      \"update_product_meta\":
              {\n        \"intent\": \"Update declarative product metadata. Pass amount to set min_stock_amount.\",\n        \"needs\":
              [\"item OR product_id\"],\n        \"writes\": \"PUT /objects/products/{productId}\",\n
              \       \"supported_fields\": [\"note\", \"brand\", \"sku\", \"unit/unit_id\", \"amount=min_stock_amount\"],\n        \"constraints\":
              [\"No stock semantics are modified\"]\n      },\n\n      \"set_default_location_for_product\":
              {\n        \"intent\": \"Set the default storage location for new purchases.\",\n
              \       \"needs\": [\"item OR product_id\", \"location OR location_id\"],\n
              \       \"writes\": \"PUT /objects/products/{productId}\"\n      },\n\n
              \     \"products_merge\": {\n        \"intent\": \"Merge two products
              into one canonical product.\",\n        \"needs\": [\"product_id_keep\",
              \"product_id_remove\"],\n        \"writes\": \"POST /stock/products/{productIdToKeep}/merge/{productIdToRemove}\",\n
              \       \"notes\": [\n          \"Moves all stock and history\",\n          \"Source
              product is deleted\",\n          \"This action is irreversible\"\n        ]\n
              \     },\n\n      \"stock_list_by_location\": {\n        \"intent\": \"List
              all stock entries stored in a specific location.\",\n        \"needs\":
              [\"location OR location_id\"],\n        \"reads\": \"GET /stock/locations/{locationId}/entries\"\n
              \     },\n\n      \"stock_check_item\": {\n        \"intent\": \"Check
              whether an item exists in stock.\",\n        \"needs\": [\"item OR product_id\"],\n
              \       \"reads\": \"GET /stock/products/{productId}/entries\"\n      },\n\n
              \     \"stock_where_is_item\": {\n        \"intent\": \"Determine which
              locations contain an item.\",\n        \"needs\": [\"item OR product_id\"],\n
              \       \"reads\": \"GET /stock/products/{productId}/locations\"\n      },\n\n
              \     \"stock_entries_for_item\": {\n        \"intent\": \"Return detailed
              stock entries for an item.\",\n        \"needs\": [\"item OR product_id\"],\n
              \       \"reads\": \"GET /stock/products/{productId}/entries\"\n      },\n\n
              \     \"stock_add_purchase\": {\n        \"intent\": \"Add purchased quantity
              of an existing product into inventory.\",\n        \"needs\": [\"item
              OR product_id\"],\n        \"writes\": \"POST /stock/products/{productId}/add\",\n
              \       \"notes\": [\n          \"Product must already exist\",\n          \"Quantity
              unit must be resolvable\"\n        ]\n      },\n\n      \"stock_buy_product\":
              {\n        \"intent\": \"Create a product if missing, then purchase it
              into inventory.\",\n        \"needs\": [\"item OR product_id\"],\n        \"writes\":
              [\n          \"POST /objects/products (if missing)\",\n          \"POST
              /stock/products/{productId}/add\"\n        ],\n        \"notes\": [\n
              \         \"Location is required when creating a new product\",\n          \"Quantity
              unit must be resolvable\",\n          \"Optional post-purchase inventory
              report may be returned\"\n        ]\n      },\n\n      \"stock_consume\":
              {\n        \"intent\": \"Consume quantity of an item from inventory.\",\n
              \       \"needs\": [\"item OR product_id\"],\n        \"writes\": \"POST
              /stock/products/{productId}/consume\"\n      },\n\n      \"stock_inventory_adjust\":
              {\n        \"intent\": \"Reconcile inventory to a measured total amount.\",\n
              \       \"needs\": [\"item OR product_id\", \"amount\"],\n        \"writes\":
              \"POST /stock/products/{productId}/inventory\"\n      },\n\n      \"stock_transfer_location\":
              {\n        \"intent\": \"Transfer stock quantity between locations.\",\n
              \       \"needs\": [\n          \"item OR product_id\",\n          \"location
              OR location_id\",\n          \"to_location OR to_location_id\"\n        ],\n
              \       \"writes\": \"POST /stock/products/{productId}/transfer\",\n        \"blocked_conditions\":
              [\n          \"Tare-weight products are not supported for transfer\"\n
              \       ]\n      },\n\n      \"units_list\": {\n        \"intent\": \"List
              all quantity units defined in Grocy.\",\n        \"needs\": [],\n        \"reads\":
              \"GET /objects/quantity_units\"\n      },\n\n      \"units_find\": {\n
              \       \"intent\": \"Find a quantity unit by exact name.\",\n        \"needs\":
              [\"unit\"],\n        \"reads\": \"GET /objects/quantity_units (filtered
              locally by name)\",\n        \"constraints\": [\n          \"Exact match
              only\",\n          \"Multiple matches block execution\"\n        ]\n      },\n\n
              \     \"units_add\": {\n        \"intent\": \"Create a new quantity unit.\",\n
              \       \"needs\": [\"unit\"],\n        \"optional\": [\"note\"],\n        \"writes\":
              \"POST /objects/quantity_units\",\n        \"constraints\": [\n          \"Unit
              name must not already exist\",\n          \"Pluralization is not inferred\",\n
              \         \"No implicit conversions are created\"\n        ]\n      },\n\n
              \     \"units_update\": {\n        \"intent\": \"Update an existing quantity
              unit.\",\n        \"needs\": [\"unit_id\"],\n        \"optional\": [\"unit\",
              \"note\"],\n        \"writes\": \"PUT /objects/quantity_units/{unitId}\",\n
              \       \"constraints\": [\n          \"unit_id is required\",\n          \"Renames
              must differ from current name\",\n          \"No stock math is affected\"\n
              \       ]\n      },\n\n      \"shopping_add_product\": {\"intent\": \"Add a specific product to a shopping list.\", \"needs\": [\"item OR product_id\"], \"optional\": [\"amount\", \"list_id\"], \"writes\": \"POST /stock/shoppinglist/add-product\"},\n      \"shopping_remove_product\": {\"intent\": \"Remove a product from a shopping list.\", \"needs\": [\"item OR product_id\"], \"optional\": [\"amount\", \"list_id\"], \"writes\": \"POST /stock/shoppinglist/remove-product\"},\n      \"shopping_clear_list\": {\"intent\": \"Clear a shopping list.\", \"optional\": [\"list_id\", \"done_only\"], \"writes\": \"POST /stock/shoppinglist/clear\"},\n      \"recipes_list\": {\"intent\": \"List all Grocy recipes.\", \"reads\": \"GET /objects/recipes\"},\n      \"recipes_fulfillment\": {\"intent\": \"What recipes can I make with current stock?\", \"reads\": \"GET /recipes/fulfillment\"},\n      \"recipe_check_fulfillment\": {\"intent\": \"Can I make a specific recipe?\", \"needs\": [\"item OR recipe_id\"], \"reads\": \"GET /recipes/{recipeId}/fulfillment\"},\n      \"recipes_add_to_shopping\": {\"intent\": \"Add missing recipe ingredients to shopping list.\", \"needs\": [\"item OR recipe_id\"], \"optional\": [\"list_id\"], \"writes\": \"POST /recipes/{recipeId}/add-not-fulfilled-products-to-shoppinglist\"},\n      \"recipes_consume\": {\"intent\": \"Mark recipe as made and consume stock ingredients.\", \"needs\": [\"item OR recipe_id\"], \"writes\": \"POST /recipes/{recipeId}/consume\"},\n      \"recipes_copy\": {\"intent\": \"Duplicate a recipe.\", \"needs\": [\"item OR recipe_id\"], \"writes\": \"POST /recipes/{recipeId}/copy\"},\n      \"stock_overview\": {\"intent\": \"Overview of all products currently in stock.\", \"reads\": \"GET /stock\"},\n      \"stock_list_volatile\": {\"intent\": \"List products due soon, overdue, or expired.\", \"reads\": \"GET /stock/volatile\"},\n      \"stock_get_product_details\": {\"intent\": \"Get stock-context details for a product (amount, value, best_before).\", \"needs\": [\"item OR product_id\"], \"reads\": \"GET /stock/products/{productId}\"},\n      \"stock_open_item\": {\"intent\": \"Mark a product as opened.\", \"needs\": [\"item OR product_id\"], \"optional\": [\"amount\", \"best_before_date\"], \"writes\": \"POST /stock/products/{productId}/open\"},\n      \"stock_entry_update\": {\"intent\": \"Edit a specific stock entry (best_before_date, location, price).\", \"needs\": [\"entry_id\"], \"optional\": [\"amount\", \"best_before_date\", \"location\", \"price\"], \"writes\": \"PUT /stock/entry/{entryId}\", \"notes\": [\"Get entry_id via stock_entries_for_item\"]},\n      \"stock_undo_booking\": {\"intent\": \"Undo a stock booking.\", \"needs\": [\"booking_id\"], \"writes\": \"POST /stock/bookings/{bookingId}/undo\"},\n      \"tasks_undo\": {\"intent\": \"Undo a completed task.\", \"needs\": [\"item OR task_id\"], \"writes\": \"POST /tasks/{taskId}/undo\"},
      \"tasks_add\": {\"intent\": \"Create a new Grocy task.\", \"needs\": [\"item\"], \"optional\": [\"note\", \"best_before_date\"], \"writes\": \"POST /objects/tasks\"},\n      \"chores_undo\": {\"intent\": \"Undo a chore execution.\", \"needs\": [\"execution_id\"], \"notes\": [\"execution_id is the execution ID, not the chore_id\"], \"writes\": \"POST /chores/executions/{executionId}/undo\"},\n      \"catalog_find_by_barcode\": {\"intent\": \"Find a product by barcode.\", \"needs\": [\"barcode\"], \"reads\": \"GET /stock/products/by-barcode/{barcode}\"},\n      \"stock_add_by_barcode\": {\"intent\": \"Purchase into stock by barcode.\", \"needs\": [\"barcode\"], \"optional\": [\"amount\", \"location\", \"price\", \"best_before_date\"], \"writes\": \"POST /stock/products/by-barcode/{barcode}/add\"},\n      \"stock_consume_by_barcode\": {\"intent\": \"Consume from stock by barcode.\", \"needs\": [\"barcode\"], \"optional\": [\"amount\"], \"writes\": \"POST /stock/products/by-barcode/{barcode}/consume\"},\n      \"batteries_list\": {\"intent\": \"List all tracked rechargeable batteries.\", \"reads\": \"GET /batteries\"},\n      \"batteries_get\": {\"intent\": \"Get details for a specific battery.\", \"needs\": [\"battery_id\"], \"reads\": \"GET /batteries/{batteryId}\"},\n      \"batteries_charge\": {\"intent\": \"Record a charge cycle for a battery.\", \"needs\": [\"battery_id\"], \"optional\": [\"amount\"], \"writes\": \"POST /batteries/{batteryId}/charge\"}\n    },\n\n    \"hints\": {\n      \"location_metadata\":
              \"Apply homeassistant metadata to grocy fields and grocy location id pointers
              to cabinet drawers, use labels liberally. These are the things that bind
              Grocy data to HA to become searchable by the Hyperindex.\",\n      \"unit_interop\":
              \"Grocy is the canonical authority for quantity units. External systems
              (e.g., Mealie) should reference Grocy unit IDs or normalized names. Unit
              reconciliation must be explicit and governed; this tool will not guess
              mappings.\",\n      \"task_routing\": \"For tasks/chores tied to a product or location, prefer zen_dojotools_inventory over zen_dojotools_todo. Inventory Task = todo attached to asset/location. Inventory Chore = task that also performs a stock action on execution.\"\n    },\n\n    \"big_asks\": {\n      \"new thing here (physical asset, permanent)\": \"stock_register_asset — 1-call registration, add hazmat_class if applicable\",\n      \"new thing here (consumable, first time in catalog)\": \"stock_buy_product — creates product and stocks it in one call\",\n      \"got more X / restocked\": \"stock_add_purchase\",\n      \"where is X?\": \"stock_check_item\",\n      \"whats in the [room]?\": \"room_brief(homeassistant_area_id=area). stock_area_summary for stock-only depth.\",\n      \"we used / consumed X\": \"stock_consume\",\n      \"need to buy X / running low\": \"shopping_add_product\",\n      \"whats expiring / going bad?\": \"stock_list_volatile\",\n      \"mark chore done\": \"chores_execute(item=<name>)\",\n      \"mark task done\": \"tasks_complete(item=<name>)\", \"tag chore/task to room\": \"chores_tag or tasks_tag\",\n      \"chores in [room]?\": \"chores_by_area(homeassistant_area_id=area)\"\n    },\n\n    \"why_operations_fail\": {\n      \"missing_required_fields\":
              \"Each case declares its own required inputs. If one is missing, execution
              stops.\",\n      \"ambiguous_matches\": \"If a name resolves to more than
              one object, the tool refuses to guess.\",\n      \"unit_errors\": \"Stock
              math requires a resolvable quantity unit. Units are governed objects in
              Grocy. If a unit does not exist or resolves ambiguously, the operation
              stops. Use units_list or units_add explicitly. 'each' must exist.\",\n
              \     \"location_constraints\": \"Grocy enforces location rules. This
              tool mirrors them exactly.\",\n      \"irreversible_actions\": \"Destructive
              operations (merge, consume, adjust) are guarded deliberately.\"\n    },\n\n
              \   \"examples\": {\n      \"check_inventory\": \"{'mode':'stock_check_item','item':'coffee'}\",\n
              \     \"where_is_item\": \"{'mode':'stock_where_is_item','item':'coffee'}\",\n
              \     \"list_items_in_location\": \"{'mode':'stock_list_by_location','location':'Pantry'}\",\n
              \     \"purchase_existing_product\": \"{'mode':'stock_add_purchase','item':'coffee','amount':1,'location':'Pantry'}\",\n
              \     \"create_and_purchase_new_product\": \"{'mode':'stock_buy_product','item':'chickens','amount':87000,'location':'Garage','note':'no
              questions'}\",\n      \"consume_item\": \"{'mode':'stock_consume','item':'coffee','amount':1}\",\n
              \     \"transfer_item\": \"{'mode':'stock_transfer_location','item':'coffee','location':'Pantry','to_location':'Kitchen'}\",\n
              \     \"complete_task\": \"{'mode':'tasks_complete','item':'Take out trash'}\",\n
              \     \"execute_chore\": \"{'mode':'chores_execute','item':'Clean litter
              box'}\",\n      \"set_location_metadata\": \"{'mode':'locations_metadata_set','location':'Coffee
              Drawer','parent_location':'Kitchen','area_id':'kitchen','location_subclass':'drawer','placement_priority':10}\",\n
              \     \"list_units\": \"{'mode':'units_list'}\",\n      \"add_unit\":
              \"{'mode':'units_add','unit':'can','note':'Standard grocery can'}\",\n
              \     \"find_unit\": \"{'mode':'units_find','unit':'can'}\"\n    },\n\n
              \   \"final_note\": [\n      \"Strict by design — prevents silent data corruption.\",\n      \"Names resolve before writes. Ambiguous matches stop execution.\",\n      \"Errors coach you back — no need to re-read help to fix a mistake.\"\n    ]\n  }\n}}"
        - variables:
            help_json: "{{ help_json | combine({'cases': cases}) }}"
        - variables:
            room_integration_block:
              description: "Grocy locations mirror your home structure. Each RM room (zen_dojotools_room_manager) has grocy_location_id pointing to its Grocy anchor. Bidirectional: RM→Grocy via grocy_location_id; Grocy→RM via homeassistant_area userfield."
              home_tree: "Your Home (root) → Wing/Floor/Zone (IDs vary) → Rooms → Containers → Products"
              place_object_pattern:
                - "1. zen_dojotools_room_manager mode=get area=X → read domain_routing.grocy for anchor ID"
                - "2. locations_find(parent_location_id=anchor) → all containers in room (add location= to name-filter)"
                - "3. locations_add(location=name, parent_location_id=anchor) if container missing"
                - "4. catalog_find_product(item=name) → verify exists; create if needed"
                - "5. stock_buy_product or stock_inventory_adjust to register item at container"
              find_object_pattern:
                - "stock_where_is_item(item=name) → returns location_id of each stock entry"
                - "location.userfields.homeassistant_area = RM area_id; use locations_get_by_area(homeassistant_area_id=area) for reverse anchor lookup"
                - "stock_list_by_location(location_id=anchor) → all items in a room"
              key_room_anchors: "IDs are household-specific. Discover yours: locations_list(per_page=200)."
              safety_equipment: "safety[] on RM rooms has grocy_location_id pinning each item to a specific Grocy container within that room."
        - variables:
            help_json: "{{ help_json | combine({'room_integration': room_integration_block}) }}"
        - variables:
            final_response:
              status: help
              help: '{{ help_json }}'
        - stop: Help Mode
          response_variable: final_response
    - alias: Trap Early Preflight Errors
      choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm not in cases }}'
          alias: 'Error: Case Not Recognized'
        sequence:
        - variables:
            final_response:
              status: error
              message: Invalid case
              mode: '{{ mode_norm }}'
              hint: Call with mode=help to see valid cases.
        - stop: Invalid Case
          response_variable: final_response
      - conditions:
        - alias: 'Error: locations_add requires a name'
          condition: template
          value_template: "{{ mode_norm == 'locations_add'\n and not has_loc_name }}"
        sequence:
        - variables:
            final_response:
              status: error
              message: locations_add requires a location name
              mode: '{{ mode_norm }}'
              coaching:
              - Provide a location name using the location field.
              - Example "{'mode':'locations_add','location':'Coffee Drawer'}"
        - stop: Missing Location Name
          response_variable: final_response
    - variables:
        payload_obj: "{% if payload_in is none %}\n  {{ none }}\n{% elif payload_in
          is mapping %}\n  {{ payload_in }}\n{% else %}\n  {% set s = (payload_in |
          string | trim) %}\n  {% if s == '' %}\n    {{ none }}\n  {% else %}\n    {{
          s | from_json }}\n  {% endif %}\n{% endif %}"
    - variables:
        product_id_resolved: '{{ pid_in }}'
        product_id_keep_resolved: '{{ pid_keep_in }}'
        product_id_remove_resolved: '{{ pid_remove_in }}'
        location_id_resolved: '{{ lid_in }}'
        to_location_id_resolved: '{{ to_lid_in }}'
        shopping_location_id_resolved: '{{ slid_in }}'
        parent_lid_resolved: '{{ parent_lid_in }}'
        chore_id_resolved: '{{ cid_in }}'
        task_id_resolved: '{{ tid_in }}'
        unit_id_resolved: '{{ uid_in }}'
        purchase_unit_id_resolved: '{{ purchase_uid_in }}'
        grocy_product: '{{ none }}'
        product_matches: '{{ [] }}'
    - alias: Resolve Locations
      choose:
      - conditions:
        - alias: Resolve Locations
          condition: template
          value_template: "{{ location_id_resolved is none\n   and has_loc_name\n   and
            mode_norm in [\n     'stock_list_by_location',\n     'locations_add',\n     'stock_register_asset',\n     'catalog_add_product',\n
            \    'stock_add_purchase',\n     'stock_buy_product',\n     'stock_transfer_location',\n
            \    'stock_add_by_barcode',\n     'stock_entry_update'\n
            \  ] }}"
        sequence:
        - action: script.zen_dojotools_grocy_advanced
          response_variable: locations_all
          data:
            action_type: read
            endpoint: /objects/locations
        - variables:
            locations_all_list: "{{ locations_all['result']['content'] if locations_all is mapping and 'result' in locations_all else [] }}"
            location_id_resolved: "{{\n  (locations_all_list\n    | selectattr('name','equalto',
              loc_norm)\n    | map(attribute='id')\n    | first)\n  | default(\n      (locations_all_list\n
              \       | selectattr('name','search','(?i)' ~ loc_norm)\n        | map(attribute='id')\n
              \       | first)\n    )\n  | default(location_id_resolved)\n}}"
    - alias: Resolve To Location
      choose:
      - conditions:
        - alias: Resolve To Location
          condition: template
          value_template: "{{ mode_norm == 'stock_transfer_location'\n   and (to_location_id_resolved
            is none)\n   and (has_to_loc_name) }}"
        sequence:
        - action: script.zen_dojotools_grocy_advanced
          response_variable: locations_all
          data:
            action_type: read
            endpoint: /objects/locations
        - variables:
            locations_all_list: "{{ locations_all['result']['content'] if locations_all is mapping and 'result' in locations_all else [] }}"
            to_location_id_resolved: "{{\n  (locations_all_list\n    | selectattr('name','equalto',
              to_loc_norm)\n    | map(attribute='id') | first)\n  | default(\n      (locations_all_list\n
              \       | selectattr('name','search','(?i)' ~ to_loc_norm)\n        |
              map(attribute='id') | first)\n    )\n  | default(to_location_id_resolved)\n}}"
    - alias: Resolve Shopping Locations
      choose:
      - conditions:
        - alias: Resolve Shopping Locations
          condition: template
          value_template: "{{ mode_norm in ['stock_add_purchase','stock_buy_product']\n
            \  and (shopping_location_id_resolved is none)\n   and (has_store_name)
            }}"
        sequence:
        - action: script.zen_dojotools_grocy_advanced
          response_variable: shopping_locations_all
          data:
            action_type: read
            endpoint: /objects/shopping_locations
        - variables:
            shopping_locations_all_list: "{{ shopping_locations_all['result']['content'] if shopping_locations_all is mapping and 'result' in shopping_locations_all else [] }}"
            shopping_location_id_resolved: "{{\n  (shopping_locations_all_list\n    |
              selectattr('name','equalto', store_norm)\n    | map(attribute='id') |
              first)\n  | default(\n      (shopping_locations_all_list\n        | selectattr('name','search','(?i)'
              ~ store_norm)\n        | map(attribute='id') | first)\n    )\n  | default(shopping_location_id_resolved)\n}}"
    - alias: Resolve Parent Location
      choose:
      - conditions:
        - alias: Resolve Parent Location
          condition: template
          value_template: "{{ mode_norm == 'locations_metadata_set'\n   and parent_lid_in
            is none\n   and has_parent_loc_name }}"
        sequence:
        - action: script.zen_dojotools_grocy_advanced
          response_variable: parent_locations_all
          data:
            action_type: read
            endpoint: /objects/locations
        - variables:
            parent_locations_list: "{{ parent_locations_all['result']['content'] if parent_locations_all is mapping and 'result' in parent_locations_all else [] }}"
            parent_lid_resolved: "{{\n  (parent_locations_list\n    | selectattr('name','equalto',
              parent_loc_norm)\n    | map(attribute='id') | first)\n  | default(\n      parent_locations_list\n
              \       | selectattr('name','search','(?i)' ~ parent_loc_norm)\n        |
              map(attribute='id') | first\n    )\n}}"
    - alias: Resolve Product
      choose:
      - conditions:
        - alias: Resolve Product (canonical)
          condition: template
          value_template: "{{\n  mode_norm in [\n                 'catalog_find_product','stock_check_item','stock_where_is_item',\n
            \                'stock_entries_for_item','stock_add_purchase','stock_buy_product',\n
            \                'stock_consume','stock_inventory_adjust','stock_transfer_location',\n
            \                'get_product_meta','rename_product',\n                 'update_product_meta','set_default_location_for_product',\n                 'stock_get_product_details','stock_open_item',\n                 'shopping_add_product','shopping_remove_product',\n                 'stock_entry_update'\n
            \               ]\n            and (product_id_resolved is none)\n            and
            (has_item_name)\n}}"
        sequence:
        - action: script.zen_dojotools_grocy_advanced
          response_variable: products_exact
          data:
            action_type: read
            endpoint: objects/products?query%5B%5D=name={{ item_norm }}
        - variables:
            exact_matches: "{{ products_exact['result']['content'] if products_exact is mapping and 'result' in products_exact else [] }}"
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ exact_matches | length == 0 }}'
              alias: Fallback partial match
            sequence:
            - action: script.zen_dojotools_grocy_advanced
              response_variable: products_like
              data:
                action_type: read
                endpoint: objects/products?query%5B%5D=name~{{ item_norm }}
            - variables:
                product_matches: "{{ products_like['result']['content'] if products_like is mapping and 'result' in products_like else [] }}"
          - conditions:
            - condition: template
              value_template: '{{ exact_matches | length > 0 }}'
            sequence:
            - variables:
                product_matches: '{{ exact_matches }}'
        - variables:
            grocy_product: '{{ product_matches | first }}'
            product_id_resolved: '{{ grocy_product.id | default(product_id_resolved)
              }}'
    - alias: Resolve Recipe
      choose:
      - conditions:
        - alias: Resolve Recipe by name
          condition: template
          value_template: "{{ mode_norm in [\n     'recipe_check_fulfillment',\n     'recipes_add_to_shopping',\n
            \    'recipes_consume',\n     'recipes_copy'\n   ]\n   and recipe_id_resolved
            is none\n   and has_item_name }}"
        sequence:
        - action: script.zen_dojotools_grocy_advanced
          response_variable: recipes_all
          data:
            action_type: read
            endpoint: /objects/recipes
        - variables:
            recipes_all_list: "{{ recipes_all['result']['content'] if recipes_all is mapping and 'result' in recipes_all else [] }}"
            recipe_id_resolved: "{{\n  (recipes_all_list\n    | selectattr('name','equalto',
              item_norm)\n    | map(attribute='id')\n    | first)\n  | default(\n      (recipes_all_list\n
              \       | selectattr('name','search','(?i)' ~ item_norm)\n        | map(attribute='id')\n
              \       | first)\n    )\n  | default(none)\n}}"
    - alias: Pre Auto-Change Case Guards
      choose:
      - conditions:
        - condition: template
          value_template: "{{ product_matches is defined\n   and product_matches | length
            > 1 }}"
          alias: 'Guard: ambiguous product match'
        sequence:
        - variables:
            matches_out: "{% set ns = namespace(items=[]) %}\n{% for p in (product_matches
              | sort(attribute='name'))[:10] %}\n  {% set ns.items = ns.items + [\n
              \   {\n      \"id\": p.id,\n      \"name\": p.name\n    }\n  ] %}\n{%
              endfor %}\n{{ ns.items }}"
            final_response:
              status: error
              message: Multiple possible matches for product name
              mode: '{{ mode_norm }}'
              details:
                item: '{{ item_norm }}'
                matches_total: '{{ product_matches | length }}'
                matches: '{{ matches_out }}'
              coaching:
              - Multiple products match this name
              - Re-run with product_id
              - Or be more specific (brand, type)
        - stop: Product Match Ambiguous
          response_variable: final_response
    - alias: Auto-Change Cases
      choose:
      - conditions:
        - alias: 'Auto-upgrade: purchase → buy_product'
          condition: template
          value_template: "{{ mode_norm == 'stock_add_purchase'\n                and
            product_id_resolved is none\n                and has_item_name }}"
        sequence:
        - variables:
            mode_norm: stock_buy_product
            mode: stock_buy_product
            auto_upgraded: true
    - alias: Resolve Unit
      choose:
      - conditions:
        - alias: Resolve Unit
          condition: template
          value_template: "{{ mode_norm in [\n      'stock_buy_product',\n      'stock_add_purchase',\n     'stock_register_asset',\n
            \     'stock_consume',\n      'stock_inventory_adjust',\n      'stock_transfer_location',\n
            \     'units_find',\n      'units_update'\n   ]\n   and unit_id_resolved
            is none\n   and (has_unit_name) }}\n"
        sequence:
        - action: script.zen_dojotools_grocy_advanced
          response_variable: units_all
          data:
            action_type: read
            endpoint: /objects/quantity_units
        - variables:
            units_all_list: "{{ units_all['result']['content'] if units_all is mapping and 'result' in units_all else [] }}"
            unit_id_resolved: "{{\n  (units_all_list\n    | selectattr('name','equalto',
              unit_norm)\n    | map(attribute='id')\n    | first\n    | default(none))\n}}"
        alias: Resolve Unit (required for stock math)
    - choose:
      - conditions:
        - alias: Create default unit "each"
          condition: template
          value_template: "{{ unit_norm == 'each'\n   and unit_id_resolved is none\n   and mode_norm in [\n     'stock_buy_product',\n     'stock_add_purchase',\n     'stock_consume',\n     'stock_inventory_adjust',\n     'stock_transfer_location',\n     'stock_register_asset'\n   ] }}"
        sequence:
        - action: script.zen_dojotools_grocy_advanced
          response_variable: unit_created
          data:
            action_type: post
            endpoint: /objects/quantity_units
            payload: "{{\n  {\n    \"name\": \"each\",\n    \"name_plural\": \"each\",\n
              \   \"description\": \"Default unit for countable items\"\n  }\n}}"
        - variables:
            unit_id_resolved: "{% if unit_created is mapping and 'result' in unit_created and unit_created['result'] is mapping and 'content' in unit_created['result'] %}\n  {{ unit_created['result']['content']['id'] | default(none) }}\n{% else %}\n  {{ none }}\n{% endif %}"
      alias: Create Default Unit 'each' if not present
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ unit_norm == 'each'\n   and unit_id_resolved is none\n
            \  and mode_norm in ['stock_buy_product', 'stock_register_asset'] }}"
          alias: 'Error: Failed to create default unit'
        sequence:
        - variables:
            final_response:
              status: error
              message: Failed to create default quantity unit 'each'
              coaching:
              - Ensure Grocy allows unit creation
              - You may need to create the 'each' unit manually first
        - stop: Unit Creation Failed
          response_variable: final_response
      alias: 'Trap Error: Failed to create ''each'''
    - alias: Create Product if missing ('Buy It')
      choose:
      - conditions:
        - alias: 'Buy: Create product if missing'
          condition: template
          value_template: "{{ mode_norm == 'stock_buy_product'\n   and (product_id_resolved
            is none)\n   and (has_item_name) }}"
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ mode_norm == 'stock_buy_product'\n   and product_id_resolved
                is none\n   and location_id_resolved is none }}"
              alias: 'Error: location required.'
            sequence:
            - variables:
                final_response:
                  status: error
                  message: 'Cannot create product: location is required by Grocy.'
                  mode: '{{ mode_norm }}'
                  item: '{{ item_norm }}'
                  coaching:
                  - Provide a location or location_id when buying a new product.
                  - Example: '{''case'':''stock_buy_product'',''item'':''{{ item_norm
                      }}'',''location'':''Pantry'',''amount'':1}'
                  - Grocy requires location_id when creating products.
            - stop: Product Create Blocked
              response_variable: final_response
          - conditions:
              condition: template
              value_template: "{{ mode_norm in [\n      'stock_buy_product',\n      'stock_add_purchase',\n
                \     'stock_consume',\n      'stock_inventory_adjust',\n      'stock_transfer_location'\n
                \  ]\n   and unit_id_resolved is none }}"
            alias: 'Error: Unit required.'
            sequence:
            - variables:
                final_response:
                  status: error
                  message: 'Cannot perform stock operation: quantity unit is required.'
                  mode: '{{ mode_norm }}'
                  item: '{{ item_norm }}'
                  details:
                    unit:
                      name: '{{ unit_norm if has_unit_name else none }}'
                      id: '{{ unit_id_resolved }}'
                  coaching:
                  - Provide a unit or unit_id for this operation.
                  - 'Example: {''case'':''{{ mode_norm }}'',''item'':''{{ item_norm
                    }}'',''unit'':''each'',''location'':''Pantry'',''amount'':1}'
                  - Unit name must exactly match a Grocy quantity unit.
            - stop: Unit Missing
              response_variable: final_response
        - action: script.zen_dojotools_grocy_advanced
          response_variable: product_created
          data:
            action_type: post
            endpoint: /objects/products
            payload: "{{\n  {\n    \"name\": item_norm,\n    \"location_id\": location_id_resolved,\n
              \   \"qu_id_stock\": unit_id_resolved,\n    \"qu_id_purchase\": unit_id_resolved,\n
              \   \"description\": (note_in if has_note else none)\n  }\n}}"
        - variables:
            product_id_resolved: "{% if product_created['result']['content']['id'] is defined
              %}\n  {{ product_created['result']['content']['id'] }}\n{% elif product_created['result']['content']['created_object_id']
              is defined %}\n  {{ product_created['result']['content']['created_object_id'] }}\n{%
              else %}\n  {{ none }}\n{% endif %}"
            grocy_product: '{{ product_created["result"]["content"] | default(none) }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ product_id_resolved is none }}'
              alias: 'Error: Buy blocked after create attempt'
            sequence:
            - variables:
                missing_location: '{{ (location_id_resolved is none) and not has_loc_name
                  }}'
                final_response:
                  status: error
                  message: "{% if missing_location %}\n  Purchase failed: a location
                    is required for stock_buy_product.\n{% else %}\n  Failed to create
                    product in catalog (no product id returned).\n{% endif %}"
                  mode: '{{ mode_norm }}'
                  item: '{{ item_norm }}'
                  details:
                    location:
                      name: '{{ loc_norm if has_loc_name else none }}'
                      id: '{{ location_id_resolved }}'
                    product_create_result: '{{ product_created["result"] | default(none)
                      }}'
                  coaching:
                  - "{% if missing_location %}\n  Provide a location (or location_id)
                    when buying a new product.\n  Example:\n  {'mode':'stock_buy_product','item':'{{
                    item_norm }}','amount':1,'location':'Pantry'}\n{% else %}\n  Ensure
                    Grocy allows product creation and returns an id.\n{% endif %}"
                  - Grocy may enforce location_id on stock purchase writes.
                  - If the item name is unusual, try simplifying it.
            - stop: Buy Flow Failed
              response_variable: final_response
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'stock_transfer_location'\n   and grocy_product
            is mapping\n   and grocy_product.tare_weight_enabled | default(false) }}"
          alias: 'Error: Tare-weight transfer not allowed'
        sequence:
        - variables:
            final_response:
              status: error
              message: Transfer not supported for tare-weight products
              mode: '{{ mode_norm }}'
              product_id: '{{ product_id_resolved }}'
              coaching:
              - This product uses tare-weight handling.
              - Grocy does not support transfers for tare-weight products.
              - Physically move it, re-weigh, then use stock_inventory_adjust.
        - stop: Tare Transfer Blocked
          response_variable: final_response
      alias: 'Trap Error: Tare Weight Transfer Attempt'
    - alias: Resolve Chores
      choose:
      - conditions:
        - alias: Resolve Chores
          condition: template
          value_template: "{{ mode_norm in ['chores_find','chores_execute','chores_delete','chores_edit']\n   and
            (chore_id_resolved is none)\n   and (has_item_name) }}"
        sequence:
        - action: script.zen_dojotools_grocy_advanced
          response_variable: chores_all
          data:
            action_type: read
            endpoint: /objects/chores
        - variables:
            chores_all_list: "{{ chores_all['result']['content'] if chores_all is mapping and 'result' in chores_all else [] }}"
            chore_id_resolved: "{{\n  (chores_all_list\n    | selectattr('name','equalto',
              item_norm)\n    | map(attribute='id') | first)\n  | default(\n      (chores_all_list\n
              \       | selectattr('name','search','(?i)' ~ item_norm)\n        | map(attribute='id')
              | first)\n    )\n  | default(chore_id_resolved)\n}}"
    - alias: Resolve Tasks
      choose:
      - conditions:
        - alias: Resolve Tasks
          condition: template
          value_template: "{{ mode_norm in ['tasks_find','tasks_complete','tasks_undo']\n   and (task_id_resolved
            is none)\n   and (has_item_name) }}"
        sequence:
        - action: script.zen_dojotools_grocy_advanced
          response_variable: tasks_all
          data:
            action_type: read
            endpoint: /objects/tasks
        - variables:
            tasks_all_list: "{{ tasks_all['result']['content'] if tasks_all is mapping and 'result' in tasks_all else [] }}"
            task_id_resolved: "{{\n  (tasks_all_list\n    | selectattr('name','equalto',
              item_norm)\n    | map(attribute='id') | first)\n  | default(\n      (tasks_all_list\n
              \       | selectattr('name','search','(?i)' ~ item_norm)\n        | map(attribute='id')
              | first)\n    )\n  | default(task_id_resolved)\n}}"
    - variables:
        current_entry_base: "{{ none }}"
    - alias: Pre-fetch Entry for stock_entry_update
      choose:
      - conditions:
        - alias: Pre-fetch stock entry for read-modify-write
          condition: template
          value_template: "{{ mode_norm == 'stock_entry_update'
            and entry_id_in is not none
            and product_id_resolved is not none }}"
        sequence:
        - action: script.zen_dojotools_grocy_advanced
          response_variable: entry_fetch_raw
          data:
            action_type: read
            endpoint: "stock/products/{{ product_id_resolved }}/entries"
        - variables:
            entry_fetch_list: "{{ entry_fetch_raw['result']['content'] | default([]) }}"
        - variables:
            current_entry_base: "{{ (entry_fetch_list
              | selectattr('id', 'equalto', entry_id_in | int)
              | list | first) | default(none) }}"
    - alias: Guards Before Endpoint Resolution
      choose:
      - conditions:
        - alias: 'Guard: invalid location rename'
          condition: template
          value_template: "{{ mode_norm == 'locations_rename'\n   and (\n     not has_new_name\n
            \    or new_name_norm == loc_norm\n   ) }}\n"
        sequence:
        - variables:
            final_response:
              status: error
              message: Invalid rename request
              mode: '{{ mode_norm }}'
              details:
                current_name: '{{ loc_norm }}'
                requested_name: '{{ new_name_norm }}'
              coaching:
              - New name must be provided
              - New name must differ from the current name
        - stop: Rename Guard Failed
          response_variable: final_response
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'stock_add_purchase'\n   and product_id_resolved
            is none }}"
          alias: 'Guard: purchase requires existing product'
        sequence:
        - variables:
            final_response:
              status: error
              message: Product not found in catalog
              mode: '{{ mode_norm }}'
              details:
                item: '{{ item_norm }}'
                location: '{{ loc_norm }}'
                price: '{{ price_in }}'
              coaching:
              - stock_add_purchase requires an existing catalog product
              - Use stock_buy_product to create-and-purchase
              - Or provide an explicit product_id
        - stop: Purchase Guard Failed
          response_variable: final_response
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'products_merge'\n   and (\n     product_id_keep_resolved
            is none\n     or product_id_remove_resolved is none\n     or product_id_keep_resolved
            == product_id_remove_resolved\n   ) }}"
          alias: 'Guard: invalid product merge'
        sequence:
        - variables:
            final_response:
              status: error
              message: Invalid product merge request
              mode: '{{ mode_norm }}'
              details:
                product_id_keep: '{{ product_id_keep_resolved }}'
                product_id_remove: '{{ product_id_remove_resolved }}'
              coaching:
              - product_id_keep and product_id_remove are required
              - IDs must be different
              - This action is irreversible
        - stop: Product Merge Guard Failed
          response_variable: final_response
      - conditions:
        - alias: 'Guard: invalid product rename'
          condition: template
          value_template: "{{ mode_norm == 'rename_product'\n   and (\n     not has_new_name\n
            \    or new_name_norm == grocy_product.name\n   ) }}\n"
        sequence:
        - variables:
            final_response:
              status: error
              message: Invalid product rename
              mode: '{{ mode_norm }}'
              details:
                current_name: '{{ grocy_product.name }}'
                requested_name: '{{ new_name_norm }}'
              coaching:
              - New name must be provided
              - New name must differ from current name
        - stop: Product Rename Guard Failed
          response_variable: final_response
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'set_default_location_for_product'\n   and
            location_id_resolved is none }}"
          alias: 'Guard: default location requires location'
        sequence:
        - variables:
            final_response:
              status: error
              message: Default location requires a valid location
              mode: '{{ mode_norm }}'
              coaching:
              - Provide location or location_id
              - Example:
                  mode: set_default_location_for_product
                  item: Coffee
                  location: Pantry
        - stop: Default Location Guard Failed
          response_variable: final_response
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'units_update'\n   and unit_id_resolved is
            none }}"
          alias: 'Guard: unit must exist for unit_update'
        sequence:
        - variables:
            final_response:
              status: error
              message: Quantity unit not found
              mode: units_update
              details:
                unit: '{{ unit_norm }}'
              coaching:
              - Provide a valid unit_id
              - Use units_list or units_find to discover unit IDs
        - stop: Unit Update Blocked
          response_variable: final_response
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'unit_conversions_delete' and not entry_id_in }}"
          alias: 'Guard: entry_id required for unit_conversions_delete'
        sequence:
        - variables:
            final_response:
              status: error
              mode: unit_conversions_delete
              message: entry_id required — get the conversion row ID from unit_conversions_list
              coaching:
              - "Run mode=unit_conversions_list (optionally unit_id=X) to find the row ID"
              - "Pass that integer as entry_id to this mode"
        - stop: Conversion Delete Guard Failed
          response_variable: final_response
      - conditions:
        - alias: 'Guard: stock_entry_update entry not found'
          condition: template
          value_template: "{{ mode_norm == 'stock_entry_update'
            and entry_id_in is not none
            and current_entry_base is none }}"
        sequence:
        - variables:
            final_response:
              status: error
              message: "Stock entry {{ entry_id_in }} not found"
              mode: '{{ mode_norm }}'
              coaching:
              - "Get valid entry IDs via: {'mode':'stock_entries_for_item','item':'...'}"
              - "Pass the same item or product_id when calling stock_entry_update"
        - stop: Entry Not Found
          response_variable: final_response
      - conditions:
        - alias: 'Guard: locations_add dupe check'
          condition: template
          value_template: "{{ mode_norm == 'locations_add'
            and has_loc_name
            and not confirm_action_in
            and (locations_all_list | default([]))
              | selectattr('name', 'search', '(?i)' ~ loc_norm)
              | list | length > 0 }}"
        sequence:
        - variables:
            _dupe_matches: "{{ (locations_all_list | default([]))
              | selectattr('name', 'search', '(?i)' ~ loc_norm)
              | list }}"
        - variables:
            final_response:
              status: dupe_guard
              mode: locations_add
              message: Similar location names already exist.
              candidates: "{{ _dupe_matches | map(attribute='name') | list }}"
              candidate_ids: "{{ _dupe_matches | map(attribute='id') | list }}"
              coaching:
              - To use an existing location, reference it by name or ID instead.
              - "To create anyway: add confirm_action: true to your request."
              - "Example: {'mode':'locations_add','location':'{{ loc_norm }}','confirm_action':true}"
              - Run mode=help for location taxonomy and naming guidance.
        - stop: Location Dupe Guard
          response_variable: final_response
      - conditions:
        - alias: 'Guard: units_add idempotent check'
          condition: template
          value_template: "{{ mode_norm == 'units_add' and has_unit_name }}"
        sequence:
        - action: script.zen_dojotools_grocy_advanced
          response_variable: _units_preflight_raw
          data:
            action_type: read
            endpoint: /objects/quantity_units
        - variables:
            _units_preflight_list: "{{ _units_preflight_raw['result']['content'] if _units_preflight_raw is mapping and 'result' in _units_preflight_raw else [] }}"
            _units_preflight_match: "{{ (_units_preflight_list | selectattr('name','equalto',unit_norm) | list | first) | default(none) }}"
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _units_preflight_match is not none }}"
            sequence:
            - variables:
                final_response:
                  status: already_exists
                  mode: units_add
                  unit_id: "{{ _units_preflight_match.id }}"
                  unit: "{{ _units_preflight_match.name }}"
                  message: "Unit '{{ unit_norm }}' already exists."
                  coaching:
                  - Unit already exists. Reference it by name or unit_id.
                  - "To update: {'mode':'units_update','unit_id':{{ _units_preflight_match.id }},'note':'...'}"
            - stop: Unit Already Exists
              response_variable: final_response
    - variables:
        limit: "{% if cases[mode_norm].paging is defined %}\n  {{\n    (\n      per_page_in\n
          \     if per_page_in is number\n      else cases[mode_norm].paging.default.perPage\n
          \   ) | int\n  }}\n{% else %}\n  {{ none }}\n{% endif %}"
        page_effective: "{% if cases[mode_norm].paging is defined %}\n  {{\n    (\n
          \     page_in\n      if page_in is number\n      else cases[mode_norm].paging.default.pageNumber\n
          \   ) | int\n  }}\n{% else %}\n  {{ none }}\n{% endif %}"
        offset: "{% if limit is not none and page_effective is not none %}\n  {{ (page_effective
          - 1) * limit }}\n{% else %}\n  {{ none }}\n{% endif %}"
    # userfields schema CRUD -- short-circuit before endpoint builder
    - if: "{{ mode_norm in ['userfields_list','userfields_deploy','userfields_repair','userfields_delete'] }}"
      then:
        - variables:
            _uf_hh_cab: "{{ states('sensor.zen_default_household_cabinet_resolved') }}"
            _caller_token: "{{ caller_token | default('') }}"
        - action: script.zen_dojotools_grocy_advanced
          data:
            action_type: read
            endpoint: /objects/userfields
            perPage: 200
          response_variable: _uf_all_raw
          continue_on_error: true
        - variables:
            _uf_existing: >-
              {{ _uf_all_raw['result']['content']
                 if _uf_all_raw is mapping and 'result' in _uf_all_raw
                    and _uf_all_raw['result']['content'] is sequence
                 else [] }}
            _uf_canonical: >-
              {%- set _c = [
                {'entity':'locations','name':'homeassistant_area','caption':'Home Assistant Area','type':'text-single-line','show_as_column_in_tables':1},
                {'entity':'locations','name':'grocy_parent_location_id','caption':'Parent Location ID','type':'number-decimal','show_as_column_in_tables':1},
                {'entity':'locations','name':'homeassistant_entity_id','caption':'HA entity_id representing this location','type':'text-single-line','show_as_column_in_tables':1},
                {'entity':'locations','name':'homeassistant_labels','caption':'Home Assistant Labels (JSON array)','type':'text-multi-line','show_as_column_in_tables':0},
                {'entity':'locations','name':'placement_priority','caption':'Priority weighting for location conflict resolution','type':'number-decimal','show_as_column_in_tables':1},
                {'entity':'locations','name':'grocy_location_subclass','caption':'suite|room|closet|workspace|container|furniture|shelf|drawer|cubby|storage','type':'text-single-line','show_as_column_in_tables':1},
                {'entity':'locations','name':'grocy_child_location_ids','caption':'JSON array of child location IDs','type':'text-multi-line','show_as_column_in_tables':0},
                {'entity':'products','name':'homeassistant_area','caption':'HA area_id direct product-to-area link','type':'text-single-line','show_as_column_in_tables':0},
                {'entity':'products','name':'hazmat_class','caption':'flammable|corrosive|toxic|oxidizer|other','type':'text-single-line','show_as_column_in_tables':0},
                {'entity':'products','name':'zen_asset_type','caption':'consumable|asset|equipment','type':'text-single-line','show_as_column_in_tables':0},
                {'entity':'chores','name':'homeassistant_area','caption':'HA Area ID','type':'text-single-line','show_as_column_in_tables':1},
                {'entity':'chores','name':'homeassistant_entity_id','caption':'HA schedule or todo entity linked to this chore','type':'text-single-line','show_as_column_in_tables':0},
                {'entity':'tasks','name':'homeassistant_area','caption':'HA Area ID for area-based task queries','type':'text-single-line','show_as_column_in_tables':0}
              ] -%}
              {{ _c }}

        # mode=userfields_list
        - if: "{{ mode_norm == 'userfields_list' }}"
          then:
            - variables:
                _ul_filter: "{{ (entity | default('')) | trim }}"
                _ul_fields: >-
                  {{ _uf_existing | selectattr('entity','equalto',_ul_filter) | list
                     if _ul_filter != '' else _uf_existing }}
            - variables:
                final_response:
                  status: ok
                  case: userfields_list
                  schema_version: "{{ schema_version }}"
                  entity_filter: "{{ _ul_filter | default(none, true) }}"
                  count: "{{ _ul_fields | length }}"
                  fields: "{{ _ul_fields }}"
                  caller_token: "{{ _caller_token }}"
            - stop: userfields_list done
              response_variable: final_response

        # mode=userfields_delete
        - if: "{{ mode_norm == 'userfields_delete' }}"
          then:
            - if: "{{ field_id | default(none) is none }}"
              then:
                - variables:
                    final_response:
                      status: error
                      case: userfields_delete
                      message: "field_id is required. Get IDs via mode=userfields_list."
                      caller_token: "{{ _caller_token }}"
                - stop: userfields_delete missing field_id
                  response_variable: final_response
            - variables:
                _uddel_target: >-
                  {{ _uf_existing | selectattr('id','equalto',field_id | int) | list | first | default(none) }}
                _uddel_is_canonical: >-
                  {%- set t = _uddel_target -%}
                  {{ _uf_canonical | selectattr('entity','equalto',t.entity | default(''))
                     | selectattr('name','equalto',t.name | default('')) | list | length > 0
                     if t is mapping else false }}
            - if: "{{ not (confirm_action | default(false) | bool) }}"
              then:
                - variables:
                    final_response:
                      status: preview
                      case: userfields_delete
                      field_id: "{{ field_id }}"
                      field: "{{ _uddel_target }}"
                      is_canonical: "{{ _uddel_is_canonical }}"
                      message: >-
                        {{ 'CAUTION: canonical ZenOS field -- deleting orphans stored values and breaks schema_version tracking. '
                           if _uddel_is_canonical else "" }}
                        Pass confirm_action=true to delete
                        {{ _uddel_target.entity | default("?") }}.{{ _uddel_target.name | default("?") }}
                        (id={{ field_id }}). IRREVERSIBLE.
                      caller_token: "{{ _caller_token }}"
                - stop: userfields_delete preview
                  response_variable: final_response
            - action: script.zen_dojotools_grocy_advanced
              data:
                action_type: delete
                endpoint: "/objects/userfields/{{ field_id }}"
                payload: "{}"
              response_variable: _uddel_raw
              continue_on_error: true
            - variables:
                _uddel_http: >-
                  {{ _uddel_raw['result']['status'] | int(0)
                     if _uddel_raw is mapping and 'result' in _uddel_raw else 0 }}
                _uddel_ok: "{{ _uddel_http in [200, 204] }}"
            - variables:
                final_response:
                  status: "{{ 'ok' if _uddel_ok else 'error' }}"
                  case: userfields_delete
                  field_id: "{{ field_id }}"
                  deleted: "{{ _uddel_ok }}"
                  was_canonical: "{{ _uddel_is_canonical }}"
                  http_status: "{{ _uddel_http }}"
                  schema_version: "{{ schema_version }}"
                  caller_token: "{{ _caller_token }}"
            - stop: userfields_delete done
              response_variable: final_response

        # mode=userfields_deploy
        - if: "{{ mode_norm == 'userfields_deploy' }}"
          then:
            - variables:
                _udp_missing: >-
                  {%- set ns = namespace(m=[]) -%}
                  {%- for f in _uf_canonical -%}
                    {%- if _uf_existing | selectattr('entity','equalto',f.entity)
                           | selectattr('name','equalto',f.name) | list | length == 0 -%}
                      {%- set ns.m = ns.m + [f] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ ns.m }}
                _udp_skipped: >-
                  {%- set ns = namespace(s=[]) -%}
                  {%- for f in _uf_canonical -%}
                    {%- if _uf_existing | selectattr('entity','equalto',f.entity)
                           | selectattr('name','equalto',f.name) | list | length > 0 -%}
                      {%- set ns.s = ns.s + [f.entity ~ '.' ~ f.name] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ ns.s }}
            - if: "{{ _udp_missing | length > 0 }}"
              then:
                - repeat:
                    for_each: "{{ _udp_missing }}"
                    sequence:
                      - action: script.zen_dojotools_grocy_advanced
                        data:
                          action_type: create
                          endpoint: /objects/userfields
                          payload: "{{ repeat.item | tojson }}"
                        response_variable: _udpc_raw
                        continue_on_error: true
                - action: script.zen_dojotools_grocy_advanced
                  data:
                    action_type: read
                    endpoint: /objects/userfields
                    perPage: 200
                  response_variable: _udp_after_raw
                  continue_on_error: true
                - variables:
                    _udp_after: >-
                      {{ _udp_after_raw['result']['content']
                         if _udp_after_raw is mapping and 'result' in _udp_after_raw
                            and _udp_after_raw['result']['content'] is sequence
                         else [] }}
                    _udp_created: >-
                      {%- set ns = namespace(c=[]) -%}
                      {%- for f in _udp_missing -%}
                        {%- if _udp_after | selectattr('entity','equalto',f.entity)
                               | selectattr('name','equalto',f.name) | list | length > 0 -%}
                          {%- set ns.c = ns.c + [f.entity ~ '.' ~ f.name] -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {{ ns.c }}
                    _udp_failed: >-
                      {%- set ns = namespace(f=[]) -%}
                      {%- for f in _udp_missing -%}
                        {%- if _udp_after | selectattr('entity','equalto',f.entity)
                               | selectattr('name','equalto',f.name) | list | length == 0 -%}
                          {%- set ns.f = ns.f + [f.entity ~ '.' ~ f.name] -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {{ ns.f }}
            - if: "{{ _uf_hh_cab != '' }}"
              then:
                - action: script.zen_dojotools_filecabinet
                  data:
                    action_type: "{{ 'update' if (state_attr(_uf_hh_cab, 'variables') | default({}, true)).get('grocy_schema') is not none else 'create' }}"
                    key: grocy_schema
                    volume_entity_id: "{{ _uf_hh_cab }}"
                    value: "{{ {'schema_version': schema_version, 'deployed_at': now().isoformat(), 'field_count': _uf_canonical | length} | tojson }}"
                  response_variable: _udp_cab_raw
                  continue_on_error: true
            - variables:
                final_response:
                  status: "{{ 'ok' if (_udp_failed | default([])) | length == 0 else 'partial' }}"
                  case: userfields_deploy
                  schema_version: "{{ schema_version }}"
                  total_canonical: "{{ _uf_canonical | length }}"
                  created: "{{ _udp_created | default([]) }}"
                  skipped: "{{ _udp_skipped }}"
                  failed: "{{ _udp_failed | default([]) }}"
                  version_stamped: "{{ _uf_hh_cab != '' }}"
                  caller_token: "{{ _caller_token }}"
            - stop: userfields_deploy done
              response_variable: final_response

        # mode=userfields_repair
        - if: "{{ mode_norm == 'userfields_repair' }}"
          then:
            - variables:
                _urp_cab_schema: >-
                  {%- from 'zenos_ai/zenos_cabinets.jinja' import cabinet_drawer_value with context -%}
                  {%- if _uf_hh_cab != '' -%}
                    {%- set _gs = cabinet_drawer_value(_uf_hh_cab, 'grocy_schema') | from_json -%}
                    {{ _gs if _gs is mapping else none }}
                  {%- else -%}{{ none }}{%- endif -%}
            - variables:
                _urp_deployed_ver: >-
                  {{ _urp_cab_schema.get('schema_version', 'undeployed') if _urp_cab_schema is mapping else 'undeployed' }}
            - variables:
                _urp_missing: >-
                  {%- set ns = namespace(m=[]) -%}
                  {%- for f in _uf_canonical -%}
                    {%- if _uf_existing | selectattr('entity','equalto',f.entity)
                           | selectattr('name','equalto',f.name) | list | length == 0 -%}
                      {%- set ns.m = ns.m + [f.entity ~ '.' ~ f.name] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ ns.m }}
                _urp_type_drift: >-
                  {%- set ns = namespace(d=[]) -%}
                  {%- for f in _uf_canonical -%}
                    {%- set match = _uf_existing | selectattr('entity','equalto',f.entity)
                                   | selectattr('name','equalto',f.name) | list | first | default(none) -%}
                    {%- if match is not none and match.get('type','') != f.type -%}
                      {%- set ns.d = ns.d + [{'field': f.entity ~ '.' ~ f.name,
                                              'expected': f.type, 'actual': match.get('type',''),
                                              'id': match.get('id')}] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ ns.d }}
                _urp_ok: >-
                  {%- set ns = namespace(o=[]) -%}
                  {%- for f in _uf_canonical -%}
                    {%- set match = _uf_existing | selectattr('entity','equalto',f.entity)
                                   | selectattr('name','equalto',f.name) | list | first | default(none) -%}
                    {%- if match is not none and match.get('type','') == f.type -%}
                      {%- set ns.o = ns.o + [f.entity ~ '.' ~ f.name] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ ns.o }}
                _urp_unknown: >-
                  {%- set ns = namespace(u=[]) -%}
                  {%- for f in _uf_existing -%}
                    {%- if _uf_canonical | selectattr('entity','equalto',f.entity)
                           | selectattr('name','equalto',f.name) | list | length == 0 -%}
                      {%- set ns.u = ns.u + [{'field': f.entity ~ '.' ~ f.name, 'id': f.id}] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ ns.u }}
            - variables:
                _urp_healthy: >-
                  {{ _urp_missing | length == 0
                     and _urp_type_drift | length == 0
                     and _urp_deployed_ver == schema_version }}
            - if: "{{ not (dry_run | default(false) | bool) and _urp_missing | length > 0 }}"
              then:
                - repeat:
                    for_each: >-
                      {%- set ns = namespace(m=[]) -%}
                      {%- for f in _uf_canonical -%}
                        {%- if f.entity ~ '.' ~ f.name in _urp_missing -%}
                          {%- set ns.m = ns.m + [f] -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {{ ns.m }}
                    sequence:
                      - action: script.zen_dojotools_grocy_advanced
                        data:
                          action_type: create
                          endpoint: /objects/userfields
                          payload: "{{ repeat.item | tojson }}"
                        response_variable: _urpm_raw
                        continue_on_error: true
            - variables:
                final_response:
                  status: "{{ 'ok' if _urp_healthy else 'issues_found' }}"
                  case: userfields_repair
                  schema_version: "{{ schema_version }}"
                  deployed_version: "{{ _urp_deployed_ver }}"
                  needs_migration: "{{ _urp_deployed_ver != schema_version }}"
                  dry_run: "{{ dry_run | default(false) | bool }}"
                  healthy: "{{ _urp_healthy }}"
                  ok_count: "{{ _urp_ok | length }}"
                  ok: "{{ _urp_ok }}"
                  missing: "{{ _urp_missing }}"
                  type_drift: "{{ _urp_type_drift }}"
                  unknown: "{{ _urp_unknown }}"
                  action_taken: >-
                    {{ "created_missing" if not (dry_run | default(false) | bool)
                       and _urp_missing | length > 0 else "none" }}
                  caller_token: "{{ _caller_token }}"
            - stop: userfields_repair done
              response_variable: final_response

