###############################################################################
# ZenOS-AI Plugin: Grocy ERP Integration
# Version: 5.13.5
# v5.13.5: the spa_config handler calls Spa Manager consumables action=repoint (moves only the
#   catalog entries that held the old product id). provision force=true rebuilt the whole catalog,
#   cleared its chore links and made new products; it is not used any more.
# v5.13.4: product_unit_repair handles two more owners. Autovac autovac_fleet: a reference under a
#   robot that is not the active one is history (a retired robot's catalog) and stays on the retired
#   product, like receipt lines; under the active robot it still stops the repair. Spa Manager
#   spa_config: after the new product exists, Spa Manager re-provisions its catalog
#   (consumables provision force=true with its stored preset), which finds parts by name and so
#   picks up the new product. Verification skips the history references. product_unit_audit skips
#   products already retired by the repair (they keep the old unit by design).
# v5.13.3: product_unit_repair answers a verified repair compactly (status, old_id, new_id, moved);
#   the full detail (steps, references left, cabinet refs, message) comes back only when a repair
#   is not finished.
# v5.13.2: product_unit_repair journal hygiene. A finished repair deletes its journal (each one
#   used to stay in the household cabinet). A confirmed run first
#   removes journals left marked done. The journal write before any Grocy write must be confirmed,
#   or the repair stops having changed nothing (a missed write let a repair go on without one).
#   A rerun with no journal on a product already renamed '(retired #id)' takes over the new product
#   only when exactly one product has the original name, the target unit and no stock.
#   Journals live in the scratch cabinet (zen_index_cabinet with no role label), never the household
#   cabinet; a confirmed run removes any left in the household by 5.13.0/5.13.1.
# v5.13.1: product_unit_repair handles a product whose stock unit is a deleted unit (a number, not
#   empty) with a different consume, price or purchase unit. Grocy adds a 1:1 conversion on every
#   product update when those differ and its resolved view shows none; a deleted unit never shows,
#   so the conversion it already holds is added again and refused ("QU conversion already exists"),
#   which blocked even the rename. The rename now also sets the old product's other units to its
#   stock unit, so Grocy has nothing to add. The old product is retired; nothing else changes.
# v5.13.0: product_unit_audit (#10779), read only. Lists every product whose stock or purchase unit
#   is not a real unit: a stored '', None, null or 0 (the API shows all of them as null), or the id
#   of a unit that no longer exists. It asks Grocy with filters on the raw columns, so it works on
#   any install, and per product reports its stock on hand. product_unit_repair reconciles each one
#   onto a new product. A one-time check for installs that took the bad writes before 5.12.2; it is
#   not scheduled.
#   product_unit_repair is rebuilt as one path: it reconciles a broken product onto a new one.
#   Grocy cannot change a stocked product's unit from a non-unit (its conversion view joins
#   quantity_units), so the product id has to change, and every reference must follow it. The
#   repair maps every reference first: in Grocy (stock, barcodes, chores, recipe ingredients,
#   shopping list, meal plan, child products, user objects whose fields hold the product id), in
#   every cabinet (any product_id / grocy_product_id / machine_product_id key; kata and history
#   cabinets are skipped), and in Mealie foods. A reference with no handler stops the product before
#   anything is written. Then: the old product is renamed "<name> (retired #<id>)", a new product is
#   created with the unit from the start (fields, userfields, barcodes, parent copied), each stock
#   entry is rebooked on it with its own dates, price, location, store and note, the old stock is
#   zeroed by an inventory correction (not a consume), every reference is repointed through its
#   owner (Room Manager safety through room_manager set, Mealie foods through kitchen foods_tag),
#   the old product is set inactive and keeps its history (receipt lines keep pointing at it), and
#   the result is verified (no live reference to the old id, stock totals equal). Each step is
#   journaled in the household cabinet (product_unit_repair_<old id>); running it again continues
#   from the journal. Preview by default; confirm_action=true writes.
# v5.12.2: a product can no longer be written without a real unit (#10779). Grocy's API stores
#   whatever it is sent: a unit that did not resolve went out as an empty string (or null) and
#   Grocy kept '' as the product's unit, which no API call can ever change once the product has
#   stock. The Grocy Sutra now refuses, for every caller, a product create whose stock or purchase
#   unit is not a positive whole number, and a product update that carries any unit (stock,
#   purchase, consume, price) that is not one. update_product_meta no longer copies an empty unit
#   back on its full-record write, nor do products_tag and provision_bom (each left a no-unit
#   product's '' in place on every edit, and would now be refused by the guard).
# v5.12.1: product_unit_repair finds the stock unit Grocy really stores. The API shows any
#   non-number in the integer column as null, so the empty unit is not always an empty string
#   (older writes stored the text None). Before writing, it asks Grocy which of None, '', null
#   and 0 the product holds (a read-only filter on the raw column) and builds the conversion
#   from that value. When none matches it stops and changes nothing.
# v5.12.0: product_unit_repair (#10779). A product saved with no stock unit and then stocked could
#   never get one: Grocy only changes the stock unit of a product with stock history through a
#   conversion from the old unit, and the old unit is empty. The repair adds a conversion scoped to
#   that product from the empty unit to the new one (factor 1, so no amount changes), sets the stock,
#   purchase, consume and price units, deletes the conversion and reads the product back. Preview by
#   default; confirm_action=true writes. Inventory Schema Edit level 1. The product keeps its id,
#   stock, history, barcodes and links. update_product_meta points a no-unit product here instead
#   of advising delete and recreate.
# v5.11.0: receipt_intake (#10780). A receipt is booked as a receipt: header (receipt_id, store,
#   purchase date, subtotal, tax, discounts, total) and lines (line, product_id or name,
#   description, amount, unit, unit_price, line_total, type item|free|discount|coupon, and the
#   bulk line keys). The money is checked in cents before anything is written: amount x
#   unit_price = line_total per line (one cent of rounding), items - discounts = subtotal and
#   subtotal + tax = total (two cents); a receipt that does not balance is refused unless
#   allow_unbalanced=true. Discount and coupon lines are recorded, never stocked; free lines book
#   at price 0; tax is recorded, never spread into item prices. Item lines go through the
#   bulk_stock_add preflight (held, never guessed); a line whose unit is not the product's
#   purchase unit, or a product whose purchase and stock units differ, is held. Each booking's
#   note is rcpt:<receipt_id>/L<line>/R<receipt object>, so a rerun finds what is already booked
#   in Grocy's stock log and books only the rest (replay-safe, resumable). dry_run (default true)
#   returns the plan. The receipt and each line are kept in Grocy as user objects (userentities
#   receipt and receipt_line, schema 1.4.0; userfields_deploy creates them). bulk_stock_add takes
#   a unit key per line: a line in another unit than the product's purchase unit is refused.
# v5.10.0: receipt intake that books what it is told (#10777, #10778, #10779).
#   bulk_stock_add resolves and checks every line before writing anything: the product (by
#   product_id, else an exact name; several matches = ambiguous, never a guess), its purchase and
#   stock units (missing = refused), a parent with no stock of its own (refused), the purchase
#   date (a real date, not in the future; none = today, said in a warning), the store (an exact
#   name, else one partial match, else refused; or shopping_location_id) and the best-before date
#   (explicit; nonperishable=true or a product default of -1 = never; a default of N days = the
#   purchase date plus N; a default of 0 = unknown and refused, not booked as expiring today).
#   Every value can be set per line (amount, price, purchase_date, store, shopping_location_id,
#   best_before_date, location_id, nonperishable, note) over the call's. A line with errors stops
#   the whole call unless hold_invalid=true, which books the valid lines and holds the rest. Each
#   booking is checked against Grocy's own booking record (purchased date, best-before, store,
#   amount) and returns its booking and stock ids; failed, unverified or mismatched is said so.
#   dry_run returns the resolved plan. stock_add_purchase, stock_buy_product and stock_add_by_barcode
#   send purchased_date too. Grocy Sutra: a POST or DELETE that answers non-2xx is an error, like PUT
#   (it was reported as success). New: stock_bbd_audit (read only: entries whose best-before equals
#   the purchase date on a 0-day product, the false dates #10778 left) and stock_waste_expired
#   (#10762: a preview of expired stock by entry, false-date suspects excluded; wastes only the
#   entry_ids a person approved, from their own stock entry, each read back).
# v5.9.10: chores_edit honors active=false/0 and product_amount=0; a truthy default dropped them
#   as if they were missing (#10752).
# v5.9.9: locations_find with a name asks Grocy for locations matching that name. It read
#   only the first 500 locations and filtered those, so on a house with more it missed newer
#   ones (Autovac provision then could not find the dock it had created) (#10744).
# v5.9.8: provision_bom no longer maps several parts of one BOM onto the same product. Its
#   fallback lookup (a product at the same location with the same label root) took the
#   product an earlier part of the same run had just created; it now skips those (#10744).
# v5.9.7: stock_entry_update writes to the numeric stock row id (it was sending the batch stock_id, so
#   Grocy refused every edit), sends only the fields Grocy edits, carrying the rest forward, reads the
#   entry back and reports an error unless the new values are there. A PUT that Grocy answers with a
#   non-2xx status is an error (#10723, #10727, #10736).
# v5.9.6: on a tare-weight product amount is the NET quantity in every stock write: stock_consume
#   sends exact_amount (Grocy would read a consume as the new total weight and refuse it), and
#   stock_inventory_adjust sends tare + amount as the new total (#10689).
# v5.9.5: update_product_meta takes enable_tare_weight_handling (true or false), so a product can be
#   set up for a weighed container without the Grocy UI (#10689).
# v5.9.4: update_product_meta takes tare_weight (in the stock unit). Grocy rescales a tare weight
#   on a stock-unit switch, so a switch to grams needs the tare set apart from the switch (#10689).
# v5.9.3: stock_add_purchase and stock_buy_product on a tare-weight product send the
#   amount as tare_weight + current stock + the amount bought. Grocy reads an add on
#   such a product as the new total weight and refused 1 lb with 'The amount cannot
#   be lower or equal than the defined tare weight + current stock amount.' (#10689).
# v5.9.2: Inventory: its tool_manifest declares seed_modes, the read modes the
#   Ninja summarizer may seed a run with (#10549).
# v5.9.1: each cert this tool declares gets a short plain description for
#   the approval prompt (the old text moves to detail) and its real max_level.
# v5.9.0: cert names moved to the zenos.* namespace (2026.11). An old flat
#   grant still satisfies the new name for one release (reissue pending).
# v5.8.0: onboarding gate (zen_os_1 entry_gate) on zen_dojotools_inventory:
#   an agent without zenos.agent.basic gets help and tool_manifest only;
#   anything else answers onboarding_required and writes one zen_entry_gate
#   warning. The script exits early on every path, so the gate is its first
#   step. Automations and the scheduler (no user) pass.
# v5.7.9: area_id_norm reads area_id only when it is a string. With none
#   passed, the name is HA's area_id() template function, so every area case
#   called without an area got the function as its area (chores_by_area
#   answered success with area_id "<function ...>" instead of refusing).
# v5.7.8: chores_by_area and room_brief read the area the way every other
#   area case does (area_id_norm) and refuse a missing area instead of
#   answering success with area_id "" and nothing found. stock_list_by_location
#   without a location names the input it needs. The FileCabinet calls use
#   mode and write_mode.
# v5.7.7: stock add by product name is no longer refused as "null stock unit":
#   the by-name lookup returns a product record without qu_id_stock, and an
#   absent key read as null. The guard now needs the key present and null.
# v5.7.6: unregister goes through the central lens writer like register (it read
#   with a bad call and wrote with mode=set, which FileCabinet does not have).
# v5.7.5: inventory bare call (no mode) returns a compact mode list; the full
#   ~100k-char catalogue is only for an explicit mode=help.
#
# v5.7.4: tool_manifest health warns when Grocy is configured but the schema
#   has never been deployed (#10615).
#
# v5.7.3: list reads pass the broker's total/returned/truncated through as
#   result.truncation (they were dropped here). tool_version (echoed in responses) and the MCP description carried
#   5.6.1/5.6.0; both now match the file version.
#
# v5.7.2: schema self-heal. register (run on HA start and daily by
#   bootstrap_stacks) queues userfields_repair, which now also creates missing
#   user entities and stamps the schema version on a clean run. deploy/repair
#   are ungated (canonical-only). Lens entry uses tool/mode, not script.
#   grocy_url 'unknown'/'unavailable' now counts as not configured (was only '').
#
# v5.7.1: userfields_repair widens type drift to a text type (no value loss),
#   reports healthy after its own patches (per-patch failures in failed[]), and
#   depreciable_asset.attachment_refs joins the canonical schema (108 fields).
#
# v5.7.0: inventory_schema_edit cert. Level 1 gates userfields/userentities
#   create+deploy+repair, location structure and units; level 2 gates deletes and
#   product merge. Level 1 is in the zenos_agent_steward bundle. Stock, products,
#   chores, tasks, shopping and batteries stay ungated.
#
# v5.6.4: an input that is missing or doesn't resolve returns status error with
#   reason 'guarded: ...' naming it (e.g. location 'pantry' matched nothing), not a bare
#   'Unable to resolve endpoint' error (#10590).
#
# v5.6.3: broker READ list responses report total / returned / truncated, so a
#   caller can tell when rows past the cap were dropped (#10597).
#
# v5.6.2: locations_metadata_set accepts area_id / homeassistant_area / area as
#   aliases of homeassistant_area_id (a documented-name call used to report
#   success and skip the area; #10595). Broker READ gives every objects/locations
#   row a userfields map so an undeployed schema no longer 500s the area modes
#   (#10580).
#
# v5.6.1 (Radar #10480): room_brief includes product_id on every chore entry
#   (it was computed internally but not returned), so consumers such as
#   zen_dojotools_plant mode=managed can attribute a chore to the specific
#   product it belongs to rather than to every machine sharing the area.
#
# v5.6.0 (2026-07-21): bulk_stock_add now supports dry_run (default false,
#   matching its existing confirm_action-required behavior) — when true, skips
#   the real POST /stock/products/{id}/add call for every item and returns a
#   'preview' status per item instead, with no confirm_action required, so
#   any bulk_stock_add call can be dry-run first.
#
# v5.5.0 (2026-07-21): New mode bulk_stock_reconcile_recent — reverses an
#   erroneous duplicate booking (e.g. a receipt re-booked onto stock it was
#   already booked to). Reconciles each product's total via
#   stock_inventory_adjust, subtracting only the entries created at/after a
#   given since_timestamp — deliberately not stock_undo_booking (can refuse
#   on "subsequent dependent bookings") or stock_consume (risks removing the original legitimate
#   entries instead of the erroneous new ones, since Grocy consumes by
#   soonest-expiry, not recency). dry_run defaults true.
#
# v5.4.0 (2026-07-21): bulk_stock_add now supports a real per-item price — each
#   bom entry may carry its own 'price' key, overriding the call-level price
#   param for that item only; items without one fall back to the call-level
#   price exactly as before (fully backward compatible, additive only). Built
#   to give receipt_to_stock (mealie.yaml) a real path to book actual per-line
#   receipt prices instead of one price applied to every item in a purchase.
#
# v5.3.1 (Zen pull, 2026-07-04 — hardening on top of H's content, no behavior
#   change on valid input): guarded as_datetime(_lrt) in battery_overdue against
#   silent-None on unparseable battery_last_replaced (FG-41). Guarded the
#   grocy_child_location_ids cid|int casts in stock_audit_perishable's child-walk
#   against non-numeric entries — malformed userfield content now skips that
#   child instead of raising.
#
# SETUP
#
# 1. Add to secrets.yaml:
#      grocy_api_key: <your_api_key>   (no prefix — Grocy uses a bare key)
#
# 2. Set input_text.grocy_url in HA (Settings > Helpers, or Developer Tools):
#      https://<your-grocy-host>   (no trailing slash)
#    Must be set once after install — value persists across restarts.
#
#    *** USE HTTPS, NOT HTTP ***
#    If your Grocy is behind a reverse proxy (Caddy, nginx, Traefik) that
#    redirects HTTP → HTTPS, HA's HTTP client follows the 301 but converts
#    every POST to a GET per RFC. All write operations will silently fail.
#
# HOW TO GET YOUR GROCY API KEY:
#   1. Log in to Grocy
#   2. Go to Settings (top-right) > Manage API Keys
#   3. Click the key icon to copy your existing API key, or create a new one
#   4. Paste directly (no prefix needed):
#      grocy_api_key: XXXXXXXXXXXXXXXX
###############################################################################

input_text:
  grocy_url:
    name: "Grocy Base URL"
    max: 255
    mode: text
    icon: mdi:fridge-outline

rest_command:
  grocy_api_advanced_get:
    url: "{{ states('input_text.grocy_url') | trim('/') }}/api/{{ endpoint | replace('/api/', '') | replace('api/', '') | trim('/') }}{% if '?' not in (endpoint | string) %}?limit={{ perPage | int(20) }}&offset={{ (((pageNumber | int(1)) - 1) * (perPage | int(20))) }}{% if search is defined and search | trim != '' %}&query[]=name*={{ search }}{% endif %}{% if orderBy is defined and orderBy | trim != '' %}&order={{ orderBy }}%3A{{ orderDirection | default('asc') }}{% endif %}{% endif %}"
    method: GET
    headers:
      GROCY-API-KEY: !secret grocy_api_key
      content-type: application/json
    timeout: 30
  grocy_api_advanced_post:
    url: "{{ states('input_text.grocy_url') | trim('/') }}/api/{{ endpoint | replace('/api/', '') | replace('api/', '') | trim('/') }}"
    method: POST
    headers:
      GROCY-API-KEY: !secret grocy_api_key
      content-type: application/json
    payload: "{{ payload }}"
    timeout: 30
  grocy_api_advanced_put:
    url: "{{ states('input_text.grocy_url') | trim('/') }}/api/{{ endpoint | replace('/api/', '') | replace('api/', '') | trim('/') }}"
    method: PUT
    headers:
      GROCY-API-KEY: !secret grocy_api_key
      content-type: application/json
    payload: "{{ payload }}"
    timeout: 30
  grocy_api_advanced_delete:
    url: "{{ states('input_text.grocy_url') | trim('/') }}/api/{{ endpoint | replace('/api/', '') | replace('api/', '') | trim('/') }}"
    method: DELETE
    headers:
      GROCY-API-KEY: !secret grocy_api_key
      content-type: application/json
    payload: "{{ payload | default('') }}"
    timeout: 30

script:
  zen_sutra_grocy:
    alias: Zen DojoTools Grocy Advanced
    description: "Zen DojoTools Grocy Advanced (v. 1.7.0) USE Zen DojoTools Inventory
      first, it is an easy to use passthrough to this tool. It will highlight WHEN to
      escalate to this modular controller for Grocy ERP. Supports inventory CRUD across
      all endpoints. Accepts action_type (create, read, update, delete, help), dynamic
      path_params, query filters, and JSON payloads. Use 'read' for GET operations (optionally
      with search and filters), 'create' (POST), 'update' (PUT), or 'delete' (DELETE)
      with appropriate payload.\nIf you get a 405 error \n  - should you be using this
      tool instead of Zen DojoTools Inventory?\n  - it likely means your endpoint
      call is incorrect. Thats why the Inventory tool exists.\n  - Use Help. \n\nFor a
      full list of supported endpoints, tags, usage patterns, and sample operations,
      pass 'help' as the action_type. Help returns OpenAPI path docs, tags, Grocy patterns,
      and best practices."
    mode: queued
    max: 3
    icon: mdi:api
    fields:
      action_type:
        name: CRUD Action
        selector:
          select:
            options:
            - create
            - read
            - update
            - delete
            - help
        default: help
        required: true
      endpoint:
        name: API Endpoint
        description: API endpoint, e.g., 'stock', 'objects/products', 'objects/locations',
          'objects/tasks', etc.  See paths in HELP for list.
        selector:
          text:
      path_params:
        description: 'Optional token replacements like {"product_id": 4}.

          '
        selector:
          object:
      payload:
        name: Payload (JSON)
        description: 'JSON body for POST/PUT/DELETE requests. Required for those actions.

          '
        selector:
          text:
            multiline: true
      search:
        name: Search Term
        description: (GET only) Free-text search filter
        selector:
          text:
      slim_objects:
        name: Slim Objects
        description: 'Return only {id, name} for large object list fetches (prevents template overflow on big catalogs).'
        selector:
          boolean:
        default: false
      extra_params:
        name: Extra Filters
        description: 'Additional GET query filters, e.g. {"spoiled": "false"}

          '
        selector:
          object:
      pageNumber:
        name: Page Number
        selector:
          number:
            min: 1
            max: 99
            step: 1
        default: 1
      perPage:
        name: Items Per Page
        selector:
          number:
            min: 1
            max: 100
            step: 1
        default: 20
    sequence:
    # --- tool_manifest early exit ---
    - if: "{{ (action_type | default('') | lower) == 'tool_manifest' or (mode | default('') | lower) == 'tool_manifest' }}"
      then:
      - variables:
          result: >-
            {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
            {{- MF.tool_manifest(
              tool='zen_sutra_grocy',
              summary='Internal: Grocy connector; use Inventory',
              display_name='Grocy Sutra (Internal)',
              tier='sutra',
              version='1.7.0',
              health={'configured': true, 'status': 'ok', 'notes': []},
              required_labels=['dojotools'],
              optional_labels=['grocy', 'inventory'],
              failure_policy='soft',
              mcp_exposed=false,
              stripe=2,
              impact='soft',
              caller_token=caller_token | default('')
            ) | from_json -}}
      - stop: zen_sutra_grocy tool_manifest
        response_variable: result
    - variables:
        inv_action_type: "{% set v = action_type | default('help') %} {% if v in ['post','create']
          %}\n  create\n{% elif v in ['get','read'] %}\n  read\n{% elif v in ['put','update']
          %}\n  update\n{% elif v in ['delete'] %}\n  delete\n{% elif v == 'help' %}\n
          \ help\n{% else %}\n  help\n{% endif %}"
        inv_endpoint: '{{ endpoint | default('''', true) }}'
        inv_payload: '{{ payload | default('''', true) }}'
        inv_search: '{{ search | default('''', true) }}'
        inv_extra_params: '{{ extra_params | default({}, true) }}'
        inv_page: '{{ pageNumber | default(1) }}'
        inv_limit: '{{ perPage | default(20) }}'
        inv_endpoint_path: "{% if '?' in inv_endpoint %}\n  {{ inv_endpoint.split('?',
          1)[0] }}\n{% else %}\n  {{ inv_endpoint }}\n{% endif %}"
        is_objects_endpoint: "{{\n  inv_endpoint_path[0:8] == 'objects/'\n  or inv_endpoint_path[0:9]
          == '/objects/'\n}}"
        is_objects_products: "{{ inv_endpoint_path == 'objects/products'\n   or inv_endpoint_path
          == '/objects/products' }}"
        is_get: '{{ inv_action_type == ''read'' }}'
        is_post: '{{ inv_action_type == ''create'' }}'
        is_put: '{{ inv_action_type == ''update'' }}'
        is_delete: '{{ inv_action_type == ''delete'' }}'
        is_help: '{{ inv_action_type == ''help'' }}'
        slim_objects: '{{ slim_objects | default(false) | bool }}'
        requires_payload: '{{ is_post or is_put or is_delete }}'
        has_endpoint: '{{ inv_endpoint not in ['''', None] }}'
        explicit_path_params: '{{ path_params is defined and path_params is not none and path_params | count > 0
          }}'
        explicit_search: '{{ search is defined and search | trim != '''' }}'
        explicit_extra_params: '{{ extra_params is defined and extra_params is not none and extra_params | count
          > 0 }}'
        explicit_page: '{{ pageNumber is defined }}'
        explicit_limit: '{{ perPage is defined }}'
    # Unit guard (#10779): a product is never written without real units. A unit that did
    # not resolve renders as '' or null, Grocy stores it as the product's unit, and once the
    # product has stock no API call can change it again. Every caller passes through here.
    - variables:
        _ug_path: "{{ inv_endpoint_path | string | trim | regex_replace('^/', '') }}"
        _ug_body: >-
          {%- set b = inv_payload -%}
          {%- set b = (b | from_json(none)) if b is string and b | trim != '' else b -%}
          {{ b if b is mapping else {} }}
    - variables:
        _ug_bad: >-
          {%- set keys = ['qu_id_stock', 'qu_id_purchase', 'qu_id_consume', 'qu_id_price'] -%}
          {%- set create = is_post and _ug_path == 'objects/products' -%}
          {%- set update = is_put and _ug_path is match('^objects/products/[0-9]+$') -%}
          {%- set ns = namespace(bad=[]) -%}
          {%- if create or update -%}
            {%- for k in keys -%}
              {%- set present = k in _ug_body -%}
              {%- set v = _ug_body.get(k) -%}
              {%- set ok = present and v is not none and (v | string | trim) is match('^[0-9]+$') and (v | int(0)) > 0 -%}
              {%- if (create and k in ['qu_id_stock', 'qu_id_purchase'] and not ok) or (present and not ok) -%}
                {%- set ns.bad = ns.bad + [k ~ '=' ~ (v | tojson)] -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endif -%}
          {{ ns.bad }}
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ _ug_bad | count > 0 }}"
          alias: Error - Product unit not a real unit
        sequence:
        - variables:
            final_response:
              status: error
              code: invalid_product_unit
              message: >-
                Refused before Grocy: a product is written only with real units (a positive unit id).
                Bad: {{ _ug_bad | join(', ') }}. Resolve the unit first (units_list / units_find).
              endpoint: "{{ inv_endpoint }}"
        - stop: invalid product unit
          response_variable: final_response
      - conditions:
        - condition: template
          value_template: '{{ requires_payload and inv_payload | trim == '''' }}'
          alias: Error - Payload Required
        sequence:
        - variables:
            final_response:
              status: error
              message: This action requires a JSON payload, but none was provided.
        - stop: Missing Payload
          response_variable: final_response
      - conditions:
        - condition: template
          value_template: '{{ not has_endpoint and not is_help }}'
          alias: Error - Endpoint Required
        sequence:
        - variables:
            final_response:
              status: error
              message: A valid Grocy API endpoint is required.
        - stop: Missing Endpoint
          response_variable: final_response
      - conditions:
        - condition: template
          value_template: '{{ is_help }}'
          alias: HELP
        sequence:
        - variables:
            inv_docs: sensor.grocy_restful_openapi_docs
            inv_paths: "{% set attr = state_attr(inv_docs, 'paths') %} {% if attr is
              mapping %}\n  {{ attr }}\n{% else %}\n  {}\n{% endif %}"
            inv_tags: "{% set ns = namespace(tagset=[]) %}\n{% if inv_paths is mapping and inv_paths.items
              is defined %}\n  {% for path, methods in inv_paths.items() %}\n    {%
              if methods is mapping %}\n      {% for method, info in methods.items()
              %}\n        {% if info is mapping and info.tags is defined and info.tags
              is iterable %}\n          {% for tag in info.tags %}\n            {% if
              tag not in ns.tagset %}\n              {% set ns.tagset = ns.tagset + [tag] %}\n
              \           {% endif %}\n          {% endfor %}\n        {% endif %}\n
              \     {% endfor %}\n    {% endif %}\n  {% endfor %}\n{% endif %}\n{{ ns.tagset
              | to_json }}"
            help_response:
              status: info
              message: Zen Dojotools Grocy Advanced Help
              endpoint: '{{ inv_endpoint | default(''(none provided)'') }}'
              available_endpoints: '{{ inv_paths | list | to_json }}'
              available_tags: '{{ inv_tags }}'
              categories: '{{ inv_tags }}'
              cheatsheet:
                description: 'Common Generic entity interactions - exposed at these
                  endpoints for convenience. If you have a Grocy component,  Extended
                  help may be available in your Dojo. Note - START with /object/{entity}
                  before trying /{entity}
  
                  '
                methods:
                  more_info: "use File CRUD tool to read\n  dojo_cabinet/grocy_manager\n
                    \ dojo_cabinet/grocy_api_endpoints\ndrawers for detailed up to date
                    documentation.\n"
                  GET:
                  - /objects/{entity}: Returns all objects of the given entity (yes
                      objects first!)
                  - /objects/{entity}/{objectId}: Returns a single object of the given
                      entity
                  - /userfields/{entity}/{objectId}: Returns all userfields with their
                      values of the given object of the given entity
                  - /stock: Returns all products currently in stock incl. next due date.
                  - /stock/volatile: Returns all products due soon, overdue or expiring.
                  - /userfields/{entity}/{objectId}: Returns userfields with values.
                  POST:
                  - /objects/{entity}: Adds a single object of the given entity
                  PUT:
                  - /objects/{entity}/{objectId}: Edits the given object of the given
                      entity
                  - /userfields/{entity}/{objectId}: Edits the given userfields of the
                      given object of the given entity
                  DELETE:
                  - /objects/{entity}/{objectId}: Deletes a single object of the given
                      entity
                  available_grocy_entities:
                  - batteries
                  - chores
                  - equipment
                  - locations
                  - meal_plan
                  - meal_plan_sections
                  - product_barcodes
                  - product_groups
                  - products
                  - quantity_unit_conversions
                  - quantity_units
                  - recipes
                  - recipes_nestings
                  - recipes_pos
                  - shopping_list
                  - shopping_lists
                  - shopping_locations
                  - task_categories
                  - tasks
                  - userentities
                  - userfields
                  - userobjects
              tips:
              - Should you be using this tool? Always Prefer the Zen DojoTools Grocy
                Helper unless it referred you to use this 'Advanced' tool directly.
              - 'ALWAYS START WITH /objects/ GET/POST/PUT /objects/{entity} is where
                you find the interesting stuff ...your starting point. example: /objects/locations'
              - /objects/shopping_lists is a list of shopping lists while /objects/shopping_list
                are the items on the lists with each having attribute shopping_list_id
              - non-200 non-401 status returns on known endpoints may indicate the endpoint
                is not the correct or primary endpoint for your chosen method. Review
                paths to identify the correct path. A 405 means you are doing it wrong,
                it's not the setup.
              - Use path_params to replace dynamic tokens in endpoints like {product_id}.
              best_practices: 'Tool Choice: The Zen DojoTools Inventory is a tool
                wrapper designed to work with this tool to remove complexity.
  
                PREFER ''Helper'' over ''Advanced'' (this) unless the ''Helper'' tool
                EXPLICITLY instricted you to refer to this tool directly.
  
                Usage Notes: - Specify valid API endpoints to avoid errors. - Use pagination
                (pageNumber and perPage) for large datasets. - Leverage filtering options
                for targeted queries. - Detailed item and product management is supported
                (e.g. quantity, expiry, location, and labels). - Integrates with household
                user/group systems for secure and collaborative use.
  
                Best Practices: - Always read current inventory data before updating
                to prevent overwrites. - Validate JSON payloads prior to submitting
                create or update operations. - Include all relevant parameters for consistent
                results. - Use metadata and labels to enhance filtering and organization.
  
                '
              version: v1.7.0
              next:
              - Planned: auto-label inventory → cabinet sync bridge
        - stop: Help Displayed
          response_variable: help_response
      - conditions:
        - condition: template
          value_template: '{{ is_get }}'
        sequence:
        - variables:
            read_data: "{% set d = {\"endpoint\": inv_endpoint, \"pageNumber\": inv_page,
              \"perPage\": inv_limit} %} {% if explicit_path_params %}\n  {% set d =
              d | combine({\"path_params\": path_params}) %}\n{% endif %} {% if explicit_search
              %}\n  {% set d = d | combine({\"search\": inv_search}) %}\n{% endif %}
              {% if explicit_extra_params %}\n  {% set d = d | combine({\"additional_params\":
              inv_extra_params}) %}\n{% endif %} {{ d }}"
            read_response: {}
        - data: '{{ read_data }}'
          response_variable: read_response
          action: rest_command.grocy_api_advanced_get
        - variables:
            status_code: '{{ read_response.status | int(0) }}'
            is_405: '{{ status_code == 405 }}'
            final_response: |-
              {%- set _rc = read_response['content'] | default(none, true) -%}
              {%- set _isvol = 'stock/volatile' in inv_endpoint -%}
              {%- if is_405 -%}
              {{ { "status": "error", "message": "405 Method Not Allowed. You may be using the wrong endpoint.", "tip": "Most Grocy object actions excluding stock use /objects/{entity}. Try again with '/objects/" ~ inv_endpoint ~ "'.", "endpoint": inv_endpoint } }}
              {%- elif _isvol and _rc is mapping -%}
              {%- set _ov = (_rc.overdue_products | default([]))[:inv_limit | int(25)] -%}
              {%- set _ds = (_rc.due_dates | default([]))[:inv_limit | int(25)] -%}
              {%- set _ex = (_rc.expiring_products | default([]))[:inv_limit | int(25)] -%}
              {%- set ns = namespace(ov=[], ds=[], ex=[]) -%}
              {%- for i in _ov -%}{%- set ns.ov = ns.ov + [{'name': i.product.name | default('', true) if i.product is defined else i.name | default('', true), 'product_id': i.product_id | default(''), 'amount': i.amount | default(''), 'best_before_date': i.best_before_date | default(''), 'location_id': i.product.location_id | default(none, true) if i.product is defined else none}] -%}{%- endfor -%}
              {%- for i in _ds -%}{%- set ns.ds = ns.ds + [{'name': i.product.name | default('', true) if i.product is defined else i.name | default('', true), 'product_id': i.product_id | default(''), 'amount': i.amount | default(''), 'best_before_date': i.best_before_date | default(''), 'location_id': i.product.location_id | default(none, true) if i.product is defined else none}] -%}{%- endfor -%}
              {%- for i in _ex -%}{%- set ns.ex = ns.ex + [{'name': i.product.name | default('', true) if i.product is defined else i.name | default('', true), 'product_id': i.product_id | default(''), 'amount': i.amount | default(''), 'best_before_date': i.best_before_date | default(''), 'location_id': i.product.location_id | default(none, true) if i.product is defined else none}] -%}{%- endfor -%}
              {{ { "status": "success", "message": "GET to '" ~ inv_endpoint ~ "' succeeded.", "result": {"status": read_response.status | int(200), "content": {"overdue_products": ns.ov, "due_dates": ns.ds, "expiring_products": ns.ex}}} }}
              {%- elif _rc is iterable and _rc is not mapping and _rc is not string -%}
              {%- set _cap = 500 if 'limit=' in inv_endpoint else inv_limit | int(25) -%}
              {#- Rows past _cap are dropped; total/returned/truncated in the result say so. -#}
              {%- set _trimmed = _rc[:_cap] -%}
              {%- if slim_objects -%}
              {%- set ns_sl = namespace(out=[]) -%}
              {%- for o in _trimmed -%}{%- set ns_sl.out = ns_sl.out + [{'id': o.id, 'name': o.name | default('', true)}] -%}{%- endfor -%}
              {{ { "status": "success", "message": "GET to '" ~ inv_endpoint ~ "' succeeded.", "result": {"status": read_response.status | int(200), "content": ns_sl.out, "total": _rc | length, "returned": _trimmed | length, "truncated": (_rc | length) > (_trimmed | length)}} }}
              {%- elif is_objects_products -%}
              {%- set _zuf_keys = ['zen_safety_type', 'zen_asset_type', 'hazmat_class', 'homeassistant_area', 'ha_labels', 'book_author', 'book_isbn', 'book_series', 'book_genre', 'book_loan_borrower', 'book_loan_date', 'book_loan_due', 'book_loan_home_location_id', 'library_meta', 'library_loan_borrower', 'library_loan_date', 'library_loan_due', 'library_loan_home_location_id'] -%}
              {%- set ns_pr = namespace(out=[]) -%}
              {%- for o in _trimmed -%}
              {%- set _ouf = o.get('userfields', {}) if o.get('userfields') is mapping else {} -%}
              {%- set _suf = namespace(d={}) -%}
              {%- for k in _zuf_keys -%}{%- set _v = _ouf.get(k) -%}{%- if _v is not none and _v | string | trim != '' -%}{%- set _suf.d = _suf.d | combine({k: _v}) -%}{%- endif -%}{%- endfor -%}
              {%- set ns_pr.out = ns_pr.out + [{'id': o.id, 'name': o.name | default('', true), 'location_id': o.get('location_id'), 'tags': (o.get('tags') or ''), 'userfields': _suf.d}] -%}
              {%- endfor -%}
              {{ { "status": "success", "message": "GET to '" ~ inv_endpoint ~ "' succeeded.", "result": {"status": read_response.status | int(200), "content": ns_pr.out, "total": _rc | length, "returned": _trimmed | length, "truncated": (_rc | length) > (_trimmed | length)}} }}
              {%- elif 'objects/locations' in inv_endpoint -%}
              {#- Grocy omits userfields when the schema was never deployed; every
                  location case reads userfields.<field>, so give each one a map. -#}
              {%- set ns_lo = namespace(out=[]) -%}
              {%- for o in _trimmed -%}{%- set ns_lo.out = ns_lo.out + [(o | combine({'userfields': {}})) if (o is mapping and o.get('userfields') is not mapping) else o] -%}{%- endfor -%}
              {{ { "status": "success", "message": "GET to '" ~ inv_endpoint ~ "' succeeded.", "result": {"status": read_response.status | int(200), "content": ns_lo.out, "total": _rc | length, "returned": _trimmed | length, "truncated": (_rc | length) > (_trimmed | length)}} }}
              {%- else -%}
              {{ { "status": "success", "message": "GET to '" ~ inv_endpoint ~ "' succeeded.", "result": {"status": read_response.status | int(200), "content": _trimmed, "total": _rc | length, "returned": _trimmed | length, "truncated": (_rc | length) > (_trimmed | length)}} }}
              {%- endif -%}
              {%- else -%}
              {{ { "status": "success", "message": "GET to '" ~ inv_endpoint ~ "' succeeded.", "result": read_response } }}
              {%- endif -%}
        alias: READ
      - conditions:
        - condition: template
          value_template: '{{ is_post }}'
        sequence:
        - data:
            endpoint: '{{ inv_endpoint }}'
            path_params: '{{ path_params | default({}) }}'
            payload: "{% if inv_payload is mapping %}\n  {{ inv_payload | to_json }}\n{%
              else %}\n  {{ inv_payload }}\n{% endif %}"
          response_variable: response
          action: rest_command.grocy_api_advanced_post
        - variables:
            status_code: '{{ response.status | int(0) }}'
            is_405: '{{ status_code == 405 }}'
            final_response: "{% if is_405 %}\n  {{\n    {\n      \"status\": \"error\",\n      \"message\": \"405 Method Not Allowed. You may be using the wrong endpoint.\",\n      \"tip\": \"Most Grocy object actions use /objects/{entity}. Try again with '/objects/{{ inv_endpoint }}'.\",\n      \"endpoint\": inv_endpoint\n    }\n  }}\n{% elif status_code < 200 or status_code >= 300 %}\n  {{ {\"status\": \"error\", \"message\": \"POST to '\" ~ inv_endpoint ~ \"' failed with HTTP \" ~ status_code ~ \".\", \"http_status\": status_code, \"result\": response} }}\n{% else %}\n  {{\n    {\n      \"status\": \"success\",\n      \"message\": \"POST to '\" ~ inv_endpoint ~ \"' succeeded.\",\n      \"result\": response\n    }\n  }}\n{% endif %}"
        alias: CREATE
      - conditions:
        - condition: template
          value_template: '{{ is_put }}'
        sequence:
        - data:
            endpoint: '{{ inv_endpoint }}'
            path_params: '{{ path_params | default({}) }}'
            payload: "{% if inv_payload is mapping %}\n  {{ inv_payload | to_json }}\n{%
              else %}\n  {{ inv_payload }}\n{% endif %}"
          response_variable: response
          action: rest_command.grocy_api_advanced_put
        - variables:
            status_code: '{{ response.status | int(0) }}'
            is_405: '{{ status_code == 405 }}'
            final_response: "{% if is_405 %}\n  {{\n    {\n      \"status\": \"error\",\n      \"message\": \"405 Method Not Allowed. You may be using the wrong endpoint.\",\n      \"tip\": \"Most Grocy object actions excluding stock use /objects/{entity}. Try again with '/objects/{{ inv_endpoint }}'.\",\n      \"endpoint\": inv_endpoint\n    }\n  }}\n{% elif status_code < 200 or status_code >= 300 %}\n  {{ {\"status\": \"error\", \"message\": \"PUT to '\" ~ inv_endpoint ~ \"' failed with HTTP \" ~ status_code ~ \".\", \"http_status\": status_code, \"result\": response} }}\n{% else %}\n  {{\n    {\n      \"status\": \"success\",\n      \"message\": \"PUT to '\" ~ inv_endpoint ~ \"' succeeded.\",\n      \"result\": response\n    }\n  }}\n{% endif %}"
        alias: UPDATE
      - conditions:
        - condition: template
          value_template: '{{ is_delete }}'
        sequence:
        - data:
            endpoint: '{{ inv_endpoint }}'
            path_params: '{{ path_params | default({}) }}'
            payload: "{% if inv_payload is mapping %}\n  {{ inv_payload | to_json }}\n{%
              else %}\n  {{ inv_payload }}\n{% endif %}"
          response_variable: response
          action: rest_command.grocy_api_advanced_delete
        - variables:
            status_code: '{{ response.status | int(0) }}'
            is_405: '{{ status_code == 405 }}'
            final_response: "{% if is_405 %}\n  {{\n    {\n      \"status\": \"error\",\n      \"message\": \"405 Method Not Allowed. You may be using the wrong endpoint.\",\n      \"tip\": \"Most Grocy object actions excluding stock use /objects/{entity}. Try again with '/objects/{{ inv_endpoint }}'.\",\n      \"endpoint\": inv_endpoint\n    }\n  }}\n{% elif status_code < 200 or status_code >= 300 %}\n  {{ {\"status\": \"error\", \"message\": \"DELETE to '\" ~ inv_endpoint ~ \"' failed with HTTP \" ~ status_code ~ \".\", \"http_status\": status_code, \"result\": response} }}\n{% else %}\n  {{\n    {\n      \"status\": \"success\",\n      \"message\": \"DELETE to '\" ~ inv_endpoint ~ \"' succeeded.\",\n      \"result\": response\n    }\n  }}\n{% endif %}"
        alias: DELETE
    - variables:
        final_response: "{{ final_response if final_response is defined else {\n  \"status\":
          \"error\",\n  \"message\": \"Unknown failure or incomplete input.\"\n} }}\n"
    - stop: End
      response_variable: final_response

  zen_dojotools_inventory:
    alias: Zen DojoTools Inventory
    description: >-
      Household inventory (5.7.4): full ERP stack. Stock, shopping, catalog, locations,
      chores, tasks, recipes, units, batteries, userentities, userobjects, userfields CRUD.
      102 operations. Names resolve to IDs.
      mode=help returns a structured cases dict: CONTRACT for tool-to-tool calls.
      TASK TAXONOMY: use this (not zen_dojotools_todo) for tasks tied to a product/location.
      Inventory Task = asset todo. Inventory Chore = task + stock action on execution.
      mode=room_brief homeassistant_area_id=X: chores + stock one call. mode=chores_by_area homeassistant_area_id=X: chores for room.
      mode=chores_tag item=X homeassistant_area_id=Y: tag chore to room. mode=tasks_tag item=X homeassistant_area_id=Y: tag task.
      mode=tasks_add item=X: create task. mode=tasks_complete item=X: mark done.
      mode=chores_execute item=X: log + consume. mode=stock_check_item item=X: stock + location.
      mode=stock_buy_product item=X amount=N location=L: purchase. mode=stock_consume item=X: consume.
      mode=shopping_add_product item=X: queue. mode=help: full 96-op catalogue.
      BOUNDARY: For physical item circulation (loan/return/browse books/games/media/art) use
      zen_dojotools_library section=catalog. Inventory owns the Grocy product (the Work);
      Library owns the physical copy (the Item). locations_reparent_bulk inherits
      homeassistant_area from parent: idempotent, safe to re-run.
      COGS COACHING (soft, never blocks): stock_check_item/stock_where_is_item/
      stock_entries_for_item may return coaching hints in the response: e.g. a
      cogs_tracked product with no positive-price stock entries (COGS will be skipped
      silently on consume), or an untracked product sitting in a cogs_zone-tagged
      location. stock_undo_booking does NOT auto-reverse any paired Firefly COGS
      transaction: if the product was cogs_tracked, coaching will point at
      zen_dojotools_finance mode=run case=transactions_search tags=grocy_stock_entry:<id>
      to find it, then case=compensate firefly_transaction_id=<id> confirm=true to reverse.
      Period-level rollup/reconciliation: zen_dojotools_finance mode=run
      case=cogs_summary|cogs_reconcile.
