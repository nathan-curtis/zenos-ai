    - variables:
        action_type: "{% if mode_norm in [\n  'rename_product',\n  'update_product_meta',\n
          \ 'set_default_location_for_product',\n  'locations_metadata_set',     \n
          \ 'locations_rename',\n  'locations_update_description',\n  'units_update',\n  'stock_entry_update'\n] %}\n  update\n{% elif mode_norm in
          [\n  'locations_add',\n  'products_merge',\n  'stock_transfer_location',\n
          \ 'stock_add_purchase',\n  'stock_buy_product',\n  'stock_consume',\n  'stock_inventory_adjust',\n
          \ 'shopping_add_missing',\n  'shopping_add_overdue',\n  'shopping_add_expired',\n
          \ 'chores_execute',\n  'tasks_complete',\n  'units_add',\n  'unit_conversions_add',\n  'stock_open_item',\n  'stock_undo_booking',\n  'shopping_add_product',\n  'shopping_remove_product',\n  'shopping_clear_list',\n  'recipes_add_to_shopping',\n  'recipes_consume',\n  'recipes_copy',\n  'tasks_undo',\n  'chores_undo',\n  'stock_add_by_barcode',\n  'stock_consume_by_barcode',\n  'batteries_charge'\n] %}\n  create\n{%
          elif mode_norm in ['locations_delete', 'unit_conversions_delete'] %}\n  delete\n{% else %}\n  read\n{% endif %}    "
    - variables:
        effective_payload: "{% if mode_norm in ['stock_add_purchase','stock_buy_product']
          %}\n  {{\n    {\n      \"amount\": amt_in,\n      \"best_before_date\": (bbd_in
          if bbd_in is not none else none),\n      \"transaction_type\": \"purchase\",\n
          \     \"price\": (price_in if price_in is not none else none),\n      \"location_id\":
          (location_id_resolved if location_id_resolved is not none else none),\n      \"shopping_location_id\":
          (shopping_location_id_resolved if shopping_location_id_resolved is not none
          else none),\n      \"note\": (note_in if has_note else none)\n    }\n  }}\n{%
          elif mode_norm == 'stock_consume' %}\n  {{ { \"amount\": amt_in, \"location_id\": (location_id_resolved if location_id_resolved is not none else none) } }}\n{% elif
          mode_norm == 'stock_inventory_adjust' %}\n  {{ { \"new_amount\": amt_in, \"location_id\": (location_id_resolved if location_id_resolved is not none else none) }
          }}\n{% elif mode_norm == 'stock_transfer_location' %}\n  {{\n    {\n      \"amount\":
          amt_in,\n      \"location_id_from\": location_id_resolved,\n      \"location_id_to\":
          to_location_id_resolved\n    }\n  }}\n{% elif mode_norm == 'rename_product'
          %}\n  {{\n    {\n      \"name\": new_name_norm\n    }\n  }}\n{% elif mode_norm
          == 'update_product_meta' %}\n  {% set parts = [] %}\n  {% if has_note %}\n
          \   {% set parts = parts + [note_in] %}\n  {% endif %}\n  {% if has_brand
          %}\n    {% set parts = parts + ['Brand: ' ~ brand] %}\n  {% endif %}\n  {%
          if has_sku %}\n    {% set parts = parts + ['SKU: ' ~ sku] %}\n  {% endif %}\n
          \ {% set _meta = {} %}\n
          \ {% if parts | length > 0 %}\n
          \   {% set _meta = _meta | combine({'description': parts | join(' | ')}) %}\n
          \ {% endif %}\n
          \ {% if unit_id_resolved is not none %}\n
          \   {% set _meta = _meta | combine({'qu_id_stock': unit_id_resolved, 'qu_id_consume': unit_id_resolved}) %}\n
          \   {% if purchase_unit_id_resolved is not none %}\n
          \     {% set _meta = _meta | combine({'qu_id_purchase': purchase_unit_id_resolved}) %}\n
          \   {% endif %}\n
          \ {% endif %}\n
          \ {% if has_explicit_amount %}\n
          \   {% set _meta = _meta | combine({'min_stock_amount': amt_in}) %}\n
          \ {% endif %}\n
          \ {{ _meta }}\n{% elif mode_norm == 'set_default_location_for_product'
          %}\n  {{\n    {\n      \"location_id\": location_id_resolved\n    }\n  }}
          \     \n{% elif mode_norm == 'locations_add' %}\n  {{\n    {\n      \"name\":
          loc_norm\n    }\n  }}\n{% elif mode_norm == 'locations_metadata_set' %}\n
          \ {% set ns = namespace(o={}) %}   \n  {% if parent_lid_resolved is not none
          %}\n    {% set ns.o = ns.o | combine({'grocy_parent_location_id': parent_lid_resolved})
          %}\n  {% endif %}\n  {% if has_area_id %}\n    {% set ns.o = ns.o | combine({'homeassistant_area':
          area_id_norm}) %}\n  {% endif %}\n  {% if has_loc_subclass %}\n    {% set
          ns.o = ns.o | combine({'grocy_location_subclass': loc_sub_norm}) %}\n  {%
          endif %}\n  {% if placement_priority_in is not none %}\n    {% set ns.o =
          ns.o | combine({'placement_priority': placement_priority_in}) %}\n  {% endif
          %}\n  {% if has_note %}\n    {% set ns.o = ns.o | combine({'note': note_in})
          %}\n  {% endif %}\n  {{ ns.o }}\n{% elif mode_norm == 'locations_rename' %}\n
          \ {{\n    {\n      \"name\": new_name_norm\n    }\n  }}\n{% elif mode_norm == 'locations_update_description' %}\n  {{\n    {\n      \"description\": note_in\n    }\n  }}\n{% elif mode_norm
          in ['shopping_add_missing','shopping_add_overdue','shopping_add_expired']
          %}\n  {% if list_in is not none %}\n    {{ {\"list_id\": (list_in | int)}
          }}\n  {% else %}\n    {{ {} }}\n  {% endif %}  \n{% elif mode_norm == 'unit_conversions_add'
          %}\n  {%- set _to_qu = (to_unit_id_in | int(none)) if to_unit_id_in is not none else (to_location_id_resolved | int(none)) -%}\n  {%- set _quc = {\"from_qu_id\": unit_id_resolved | int, \"to_qu_id\": _to_qu | int, \"factor\": amt_in | float} -%}\n  {%- if product_id_resolved is not none -%}{%- set _quc = _quc | combine({\"product_id\": product_id_resolved | int}) -%}{%- endif -%}\n  {{ _quc }}\n{% elif mode_norm == 'units_add'
          %}\n  {{\n    {\n      \"name\": unit_norm,\n      \"name_plural\": unit_norm,\n
          \     \"description\": (note_in if has_note else none)\n    }\n  }}\n{% elif
          mode_norm == 'units_update' %}\n  {{\n    {\n      \"name\": (unit_norm if
          has_unit_name else none),\n      \"name_plural\": (unit_norm if has_unit_name else none),\n      \"description\": (note_in if has_note else
          none)\n    }\n  }}\n{% elif mode_norm in ['shopping_add_product','shopping_remove_product'] %}\n  {{\n    {\n      \"product_id\": product_id_resolved,\n      \"product_amount\": amt_in,\n      \"shopping_list_id\": (list_in | int if list_in is not none else none)\n    }\n  }}\n{% elif mode_norm == 'shopping_clear_list' %}\n  {{\n    {\n      \"done_only\": done_only_in,\n      \"shopping_list_id\": (list_in | int if list_in is not none else none)\n    }\n  }}\n{% elif mode_norm == 'recipes_add_to_shopping' %}\n  {{\n    {\n      \"shopping_list_id\": (list_in | int if list_in is not none else none)\n    }\n  }}\n{% elif mode_norm == 'stock_open_item' %}\n  {{\n    {\n      \"amount\": amt_in,\n      \"best_before_date\": (bbd_in if bbd_in is not none else none),\n      \"allow_subproduct_substitution\": false\n    }\n  }}\n{% elif mode_norm == 'stock_entry_update' %}\n  {% if current_entry_base is mapping %}\n    {% set ns = namespace(o={}) %}\n    {% if has_explicit_amount %}{% set ns.o = ns.o | combine({\"amount\": amt_in}) %}{% endif %}\n    {% if bbd_in is not none %}{% set ns.o = ns.o | combine({\"best_before_date\": bbd_in}) %}{% endif %}\n    {% if location_id_resolved is not none %}{% set ns.o = ns.o | combine({\"location_id\": location_id_resolved}) %}{% endif %}\n    {% if price_in is not none %}{% set ns.o = ns.o | combine({\"price\": price_in}) %}{% endif %}\n    {% if note_in | trim != '' %}{% set ns.o = ns.o | combine({\"note\": note_in}) %}{% endif %}\n    {{ current_entry_base | combine(ns.o) }}\n  {% else %}\n    {{ none }}\n  {% endif %}\n{% elif mode_norm == 'stock_add_by_barcode' %}\n  {{\n    {\n      \"amount\": amt_in,\n      \"best_before_date\": (bbd_in if bbd_in is not none else none),\n      \"transaction_type\": \"purchase\",\n      \"price\": (price_in if price_in is not none else none),\n      \"location_id\": (location_id_resolved if location_id_resolved is not none else none)\n    }\n  }}\n{% elif mode_norm == 'stock_consume_by_barcode' %}\n  {{ {\"amount\": amt_in} }}\n{% elif mode_norm == 'batteries_charge' %}\n  {{ {\"tracked_time\": none, \"amount\": (amt_in | int(1))} }}\n{% elif mode_norm in ['locations_delete', 'unit_conversions_delete'] %}\n  {{ {} }}\n{% else %}\n  {{ payload_obj }}\n{% endif %}"
    - variables:
        payload_data: "{{\n  {\n    \"action_type\": action_type,\n    \"endpoint\":
          final_endpoint\n  }\n  | combine(\n      {\"payload\": effective_payload}\n
          \     if effective_payload is not none else {}\n    )\n}}"
    - alias: Endpoint Resolution Check
      choose:
      - conditions:
        - alias: 'Error: Endpoint not Resolved'
          condition: template
          value_template: "{{\n  (final_endpoint is none)\n  and mode_norm not in ['catalog_find_product', 'catalog_add_product', 'catalog_delete_product', 'locations_reparent_bulk', 'locations_delete_safe', 'locations_hierarchy_rebuild', 'stock_register_asset', 'stock_area_summary', 'stock_area_volatile', 'stock_area_inventory', 'chores_by_area', 'room_brief', 'chores_add', 'chores_tag', 'chores_delete', 'chores_edit', 'tasks_add', 'tasks_tag', 'update_product_meta']\n}}\n"
        sequence:
        - variables:
            final_response:
              status: error
              message: Unable to resolve endpoint for case
              mode: '{{ mode_norm }}'
              item: '{{ item_norm }}'
              location: '{{ loc_norm }}'
              resolved:
                product_id: '{{ product_id_resolved }}'
                location_id: '{{ location_id_resolved }}'
                shopping_location_id: '{{ shopping_location_id_resolved }}'
                chore_id: '{{ chore_id_resolved }}'
                task_id: '{{ task_id_resolved }}'
              coaching:
              - If this is an item question, pass item or product_id.
              - If this is a location question, pass location or location_id.
              - For purchases, provide item or product_id and amount.
        - stop: Resolution Failed
          response_variable: final_response
    - alias: 'PC sync — snapshot child current parent'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'locations_metadata_set'\n             and location_id_resolved is not none\n             and parent_lid_resolved is not none }}"
        sequence:
        - action: script.zen_dojotools_grocy_advanced
          response_variable: child_snapshot_raw
          data:
            action_type: read
            endpoint: /objects/locations?limit=500&offset=0
        - variables:
            child_old_parent_lid: "{{ child_snapshot_raw['result']['content'] | selectattr('id', 'equalto', location_id_resolved | int) | map(attribute='userfields.grocy_parent_location_id') | first | default(none, true) | int(none) }}"
    - variables:
        _deleted_loc_parent_id: "{{ none }}"
    - alias: 'Pre-fetch — snapshot parent before delete'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm in ['locations_delete', 'locations_delete_safe'] and location_id_resolved is not none }}"
        sequence:
        - action: script.zen_dojotools_grocy_advanced
          response_variable: _del_snap_raw
          data:
            action_type: read
            endpoint: /objects/locations?limit=500&offset=0
        - variables:
            _deleted_loc_parent_id: "{{ _del_snap_raw['result']['content'] | selectattr('id', 'equalto', location_id_resolved | int) | map(attribute='userfields.grocy_parent_location_id') | first | default(none, true) | int(none) }}"
    - alias: Call Grocy API (if not barred by endpoint)
      choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm not in [''catalog_find_product'', ''catalog_add_product'', ''catalog_delete_product'', ''locations_reparent_bulk'', ''locations_delete_safe'', ''locations_hierarchy_rebuild'', ''stock_register_asset'', ''stock_area_summary'', ''stock_area_volatile'', ''stock_area_inventory'', ''chores_by_area'', ''room_brief'', ''chores_add'', ''chores_tag'', ''chores_delete'', ''chores_edit'', ''tasks_add'', ''tasks_tag'', ''update_product_meta''] }}'
          alias: Not 'catalog_find_product'
        sequence:
        - action: script.zen_dojotools_grocy_advanced
          response_variable: grocy_response
          data: '{{ payload_data }}'
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm == ''locations_add'' }}'
          alias: Capture new location id
        sequence:
        - variables:
            location_id_resolved: "{% if grocy_response is mapping and 'result' in grocy_response
              and grocy_response['result'] is mapping and 'content' in grocy_response['result']
              and grocy_response['result']['content'] is mapping %}\n  {% if 'created_object_id'
              in grocy_response['result']['content'] %}\n    {{ grocy_response['result']['content']['created_object_id']
              }}\n  {% elif 'id' in grocy_response['result']['content'] %}\n    {{ grocy_response['result']['content']['id']
              }}\n  {% else %}\n    {{ none }}\n  {% endif %}\n{% else %}\n  {{ none }}\n{% endif %}"
      alias: Resolve new Location ID
    - alias: 'locations_add — inherit parent homeassistant_area if not provided'
      choose:
      - conditions:
        - condition: template
          value_template: >-
            {{ mode_norm == 'locations_add'
               and not has_area_id
               and parent_lid_resolved is not none }}
        sequence:
        - action: script.zen_dojotools_grocy_advanced
          response_variable: _inherit_area_raw
          continue_on_error: true
          data:
            action_type: read
            endpoint: /objects/locations/{{ parent_lid_resolved }}
        - variables:
            _parent_area: >-
              {%- set _c = _inherit_area_raw['result']['content']
                 if (_inherit_area_raw is mapping
                     and _inherit_area_raw.get('result', {})
                              .get('content') is mapping)
                 else {} -%}
              {{ _c.get('userfields', {}).get('homeassistant_area', none) }}
        - variables:
            area_id_norm: >-
              {{ _parent_area
                 if (_parent_area is string and _parent_area | length > 0)
                 else area_id_norm }}
            has_area_id: >-
              {{ true
                 if (_parent_area is string and _parent_area | length > 0)
                 else has_area_id }}
    - alias: Add Location Metadata if necessary
      choose:
      - conditions:
        - alias: locations_add → apply metadata
          condition: template
          value_template: "{{ mode_norm == 'locations_add'\n   and location_id_resolved
            is not none\n   and (\n     parent_lid_resolved is not none\n     or has_area_id\n
            \    or placement_priority_in is not none\n     or has_note\n   ) }}"
        sequence:
        - action: script.zen_dojotools_grocy_advanced
          response_variable: metadata_response
          data:
            action_type: update
            endpoint: /userfields/locations/{{ location_id_resolved }}
            payload: "{{\n  dict(\n    (\n      [\n        ('grocy_parent_location_id',
              parent_lid_resolved),\n        ('homeassistant_area', area_id_norm if
              has_area_id else none),\n        ('grocy_location_subclass', loc_sub_norm),\n
              \       ('placement_priority', placement_priority_in),\n        ('note',
              note_in if has_note else none)\n      ]\n      | selectattr(1)\n      |
              list\n    )\n  )\n}}"
    - alias: 'PC sync — register child with new parent'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm in ['locations_metadata_set', 'locations_add']\n             and parent_lid_resolved is not none\n             and location_id_resolved is not none }}"
        sequence:
        - action: script.zen_dojotools_grocy_advanced
          response_variable: js_register_raw
          data:
            action_type: read
            endpoint: /objects/locations?limit=500&offset=0
        - variables:
            _js_new_kids: "{{ js_register_raw['result']['content'] | selectattr('userfields.grocy_parent_location_id', 'equalto', parent_lid_resolved | string) | map(attribute='id') | map('int') | unique | sort | list }}"
        - action: script.zen_dojotools_grocy_advanced
          data:
            action_type: update
            endpoint: /userfields/locations/{{ parent_lid_resolved }}
            payload: "{{ dict([('grocy_child_location_ids', '[' ~ (_js_new_kids | join(',')) ~ ']')]) }}"
    - alias: 'PC sync — evict child from old parent'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'locations_metadata_set'\n             and parent_lid_resolved is not none\n             and child_old_parent_lid is defined\n             and child_old_parent_lid is not none\n             and (child_old_parent_lid | int) != (parent_lid_resolved | int) }}"
        sequence:
        - action: script.zen_dojotools_grocy_advanced
          response_variable: js_evict_raw
          data:
            action_type: read
            endpoint: /objects/locations?limit=500&offset=0
        - variables:
            _js_old_kids: "{{ js_evict_raw['result']['content'] | selectattr('userfields.grocy_parent_location_id', 'equalto', child_old_parent_lid | string) | map(attribute='id') | map('int') | unique | sort | list }}"
        - action: script.zen_dojotools_grocy_advanced
          data:
            action_type: update
            endpoint: /userfields/locations/{{ child_old_parent_lid }}
            payload: "{{ dict([('grocy_child_location_ids', '[' ~ (_js_old_kids | join(',')) ~ ']')]) }}"
    - alias: 'PC sync — evict deleted child from parent'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'locations_delete' and _deleted_loc_parent_id is not none }}"
        sequence:
        - action: script.zen_dojotools_grocy_advanced
          response_variable: js_del_evict_raw
          data:
            action_type: read
            endpoint: /objects/locations?limit=500&offset=0
        - variables:
            _js_del_kids: "{{ js_del_evict_raw['result']['content'] | selectattr('userfields.grocy_parent_location_id', 'equalto', _deleted_loc_parent_id | string) | map(attribute='id') | map('int') | unique | sort | list }}"
        - action: script.zen_dojotools_grocy_advanced
          data:
            action_type: update
            endpoint: /userfields/locations/{{ _deleted_loc_parent_id }}
            payload: "{{ dict([('grocy_child_location_ids', '[' ~ (_js_del_kids | join(',')) ~ ']')]) }}"
    - alias: 'stock_register_asset — 1-call physical asset registration'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'stock_register_asset' }}"
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ location_id_resolved is none }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: stock_register_asset
                  message: location or location_id is required.
                  coaching:
                  - Provide location name or location_id.
            - stop: Asset Location Required
              response_variable: final_response
        - action: script.zen_dojotools_grocy_advanced
          response_variable: _asset_dupe_raw
          data:
            action_type: read
            endpoint: objects/products?query%5B%5D=name={{ item_norm }}
        - variables:
            _asset_dupe_list: "{{ _asset_dupe_raw['result']['content'] | default([]) }}"
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _asset_dupe_list | length > 0 and not confirm_action_in }}"
            sequence:
            - variables:
                final_response:
                  status: dupe_guard
                  mode: stock_register_asset
                  message: A product with this name already exists.
                  candidates: "{{ _asset_dupe_list | map(attribute='name') | list }}"
                  candidate_ids: "{{ _asset_dupe_list | map(attribute='id') | list }}"
                  coaching:
                  - To stock an existing product, use stock_buy_product instead.
                  - To register a new asset with this name, add confirm_action true.
            - stop: Asset Dupe Guard
              response_variable: final_response
        - variables:
            _asset_desc_parts: "{{ ([note_in] if note_in is string and note_in | length > 0 else [])
              + (['Brand: ' ~ brand] if brand is defined and brand else [])
              + (['Serial: ' ~ sku] if sku is defined and sku else [])
              + (['Est. value: $' ~ price_in] if price_in is not none else []) }}"
            _asset_desc: "{{ _asset_desc_parts | join(' | ') }}"
        - action: script.zen_dojotools_grocy_advanced
          response_variable: _asset_create_raw
          data:
            action_type: post
            endpoint: /objects/products
            payload: "{{ {'name': item_norm, 'description': _asset_desc, 'location_id': location_id_resolved, 'qu_id_purchase': unit_id_resolved, 'qu_id_stock': unit_id_resolved} }}"
        - variables:
            _asset_pid: "{% set c = _asset_create_raw['result']['content'] | default({}) %}
              {{ c.get('created_object_id', c.get('id', none)) | int(none) }}"
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _asset_pid is none }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: stock_register_asset
                  message: Grocy product creation failed.
                  coaching:
                  - Check Grocy connection and try again.
            - stop: Asset Create Failed
              response_variable: final_response
        - action: script.zen_dojotools_grocy_advanced
          response_variable: _asset_stock_raw
          data:
            action_type: post
            endpoint: /stock/products/{{ _asset_pid }}/add
            payload: "{{ {'amount': 1, 'location_id': location_id_resolved, 'best_before_date': '2999-12-31', 'transaction_type': 'purchase'} }}"
        - variables:
            _asset_hazmat_logged: false
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ hazmat_class_in is not none }}"
            sequence:
            - action: script.zen_dojotools_grocy_advanced
              response_variable: _asset_loc_raw
              data:
                action_type: read
                endpoint: /objects/locations/{{ location_id_resolved }}
            - variables:
                _asset_loc_area: "{{ _asset_loc_raw['result']['content']['userfields']['homeassistant_area'] | default(none, true) }}"
            - choose:
              - conditions:
                - condition: template
                  value_template: "{{ _asset_loc_area is not none and _asset_loc_area | length > 0 }}"
                sequence:
                - action: script.zen_dojotools_room_manager
                  data:
                    mode: set
                    area: "{{ _asset_loc_area }}"
                    safety: "{{ {'name': item_norm ~ ' (hazmat)', 'type': 'other', 'location_note': hazmat_class_in ~ ' — see Grocy location ' ~ location_id_resolved, 'grocy_location_id': location_id_resolved | string} }}"
                - variables:
                    _asset_hazmat_logged: true
        - variables:
            final_response:
              status: success
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              mode: stock_register_asset
              result:
                product_id: '{{ _asset_pid }}'
                name: '{{ item_norm }}'
                location_id: '{{ location_id_resolved }}'
                stocked: 1
                best_before_date: '2999-12-31'
                hazmat_logged: '{{ _asset_hazmat_logged }}'
        - stop: Asset Registration Complete
          response_variable: final_response

    - alias: 'catalog_add_product — create product with 0 stock'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'catalog_add_product' }}"
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ location_id_resolved is none }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: catalog_add_product
                  message: location or location_id is required.
                  coaching:
                  - Provide location name or location_id (default storage location for new stock).
            - stop: Product Location Required
              response_variable: final_response
        - action: script.zen_dojotools_grocy_advanced
          response_variable: _cprod_dupe_raw
          data:
            action_type: read
            endpoint: objects/products?query%5B%5D=name={{ item_norm }}
        - variables:
            _cprod_dupe_list: "{{ _cprod_dupe_raw['result']['content'] | default([]) }}"
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _cprod_dupe_list | length > 0 and not confirm_action_in }}"
            sequence:
            - variables:
                final_response:
                  status: dupe_guard
                  mode: catalog_add_product
                  message: A product with this name already exists.
                  candidates: "{{ _cprod_dupe_list | map(attribute='name') | list }}"
                  candidate_ids: "{{ _cprod_dupe_list | map(attribute='id') | list }}"
                  coaching:
                  - To add stock to an existing product use stock_buy_product.
                  - To create with the same name pass confirm_action true.
            - stop: Product Dupe Guard
              response_variable: final_response
        - variables:
            _cprod_desc_parts: "{{ ([note_in] if note_in is string and note_in | length > 0 else [])
              + (['Brand: ' ~ brand] if brand is defined and brand else [])
              + (['SKU: ' ~ sku] if sku is defined and sku else [])
              + (['Est. value: $' ~ price_in] if price_in is not none else []) }}"
            _cprod_desc: "{{ _cprod_desc_parts | join(' | ') }}"
        - action: script.zen_dojotools_grocy_advanced
          response_variable: _cprod_create_raw
          data:
            action_type: post
            endpoint: /objects/products
            payload: "{{ {'name': item_norm, 'description': _cprod_desc, 'location_id': location_id_resolved, 'qu_id_purchase': unit_id_resolved, 'qu_id_stock': unit_id_resolved} }}"
        - variables:
            _cprod_pid: "{% set c = _cprod_create_raw['result']['content'] | default({}) %}
              {{ c.get('created_object_id', c.get('id', none)) | int(none) }}"
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _cprod_pid is none }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: catalog_add_product
                  message: Grocy product creation failed.
                  coaching:
                  - Check Grocy connection and try again.
            - stop: Product Create Failed
              response_variable: final_response
        - variables:
            final_response:
              status: success
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              mode: catalog_add_product
              result:
                product_id: '{{ _cprod_pid }}'
                name: '{{ item_norm }}'
                location_id: '{{ location_id_resolved }}'
                stocked: 0
        - stop: Product Catalog Add Complete
          response_variable: final_response
    - alias: 'catalog_delete_product — delete product, gated on no-stock or confirm'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'catalog_delete_product' }}"
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ product_id_resolved is none }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  mode: catalog_delete_product
                  message: product_id or item is required.
                  coaching:
                  - Pass item=<name> or product_id=<id> to identify the product.
            - stop: Product ID Required
              response_variable: final_response
        - action: script.zen_dojotools_grocy_advanced
          response_variable: _cdel_stock_raw
          data:
            action_type: read
            endpoint: "/stock/products/{{ product_id_resolved }}"
        - variables:
            _cdel_content: >-
              {{ _cdel_stock_raw['result']['content']
                 if (_cdel_stock_raw is mapping
                     and _cdel_stock_raw.get('result', {}).get('content') is mapping)
                 else {} }}
        - variables:
            _cdel_stock_amt: "{{ _cdel_content.get('stock_amount', 0) | float(0) }}"
            _cdel_product_name: "{{ _cdel_content.get('product', {}).get('name', item_norm) }}"
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _cdel_stock_amt > 0 and pid_keep_in is not none }}"
            sequence:
            - action: script.zen_dojotools_grocy_advanced
              response_variable: _cdel_merge_raw
              data:
                action_type: create
                endpoint: "/stock/products/{{ pid_keep_in }}/merge/{{ product_id_resolved }}"
                payload: "{}"
            - variables:
                final_response:
                  status: merged
                  mode: catalog_delete_product
                  message: Stock merged into target product; source product deleted.
                  removed_product_id: "{{ product_id_resolved }}"
                  removed_product_name: "{{ _cdel_product_name }}"
                  merged_into_product_id: "{{ pid_keep_in }}"
                  stock_amount_transferred: "{{ _cdel_stock_amt }}"
            - stop: Product Merged and Deleted
              response_variable: final_response
          - conditions:
            - condition: template
              value_template: "{{ _cdel_stock_amt > 0 and not confirm_action_in }}"
            sequence:
            - variables:
                final_response:
                  status: stock_guard
                  mode: catalog_delete_product
                  message: "Product has stock. Merge into another product or confirm to delete."
                  product_id: "{{ product_id_resolved }}"
                  name: "{{ _cdel_product_name }}"
                  stock_amount: "{{ _cdel_stock_amt }}"
                  coaching:
                  - "To merge stock into another product: add product_id_keep=<target_id>"
                  - "To delete and discard stock: confirm_action=true"
                  - "To consume remaining stock first: stock_consume item=<name> amount=<n>"
            - stop: Stock Guard
              response_variable: final_response
        - action: script.zen_dojotools_grocy_advanced
          response_variable: _cdel_raw
          data:
            action_type: delete
            endpoint: "/objects/products/{{ product_id_resolved }}"
            payload: "{}"
        - variables:
            final_response:
              status: success
              mode: catalog_delete_product
              result:
                product_id: "{{ product_id_resolved }}"
                name: "{{ _cdel_product_name }}"
                had_stock: "{{ _cdel_stock_amt > 0 }}"
                stock_amount_at_delete: "{{ _cdel_stock_amt }}"
        - stop: Product Deleted
          response_variable: final_response
    - alias: 'locations_reparent_bulk — bulk reparent'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'locations_reparent_bulk' }}"
        sequence:
        - variables:
            _bulk_child_ids: "{{ child_lids_in | list if child_lids_in is iterable and child_lids_in is not string else child_lids_in | from_json | list }}"
            _bulk_parent_lid: "{{ parent_lid_resolved | int(none) }}"
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _bulk_parent_lid is none or _bulk_child_ids | length == 0 }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  version: '{{ tool_version }}'
                  mode: locations_reparent_bulk
                  message: parent_location_id and child_location_ids are required
                  coaching:
                  - parent_location_id must be an explicit numeric ID
                  - child_location_ids must be a JSON array e.g. "[201,202,203]"
            - stop: Reparent Bulk Guard
              response_variable: final_response
        - repeat:
            for_each: "{{ _bulk_child_ids }}"
            sequence:
            - action: script.zen_dojotools_grocy_advanced
              response_variable: _rb_snap_raw
              data:
                action_type: read
                endpoint: /objects/locations?limit=500&offset=0
            - variables:
                _rb_old_parent: "{{ _rb_snap_raw['result']['content'] | selectattr('id', 'equalto', repeat.item | int) | map(attribute='userfields.grocy_parent_location_id') | first | default(none, true) | int(none) }}"
            - action: script.zen_dojotools_grocy_advanced
              data:
                action_type: update
                endpoint: /userfields/locations/{{ repeat.item }}
                payload: "{{ dict([('grocy_parent_location_id', _bulk_parent_lid)]) }}"
            - action: script.zen_dojotools_grocy_advanced
              response_variable: _rb_js_reg_raw
              data:
                action_type: read
                endpoint: /objects/locations?limit=500&offset=0
            - variables:
                _rb_new_kids: "{{ _rb_js_reg_raw['result']['content'] | selectattr('userfields.grocy_parent_location_id', 'equalto', _bulk_parent_lid | string) | map(attribute='id') | map('int') | unique | sort | list }}"
            - action: script.zen_dojotools_grocy_advanced
              data:
                action_type: update
                endpoint: /userfields/locations/{{ _bulk_parent_lid }}
                payload: "{{ dict([('grocy_child_location_ids', '[' ~ (_rb_new_kids | join(',')) ~ ']')]) }}"
            - choose:
              - conditions:
                - condition: template
                  value_template: "{{ _rb_old_parent is not none and (_rb_old_parent | int) != (_bulk_parent_lid | int) }}"
                sequence:
                - action: script.zen_dojotools_grocy_advanced
                  response_variable: _rb_evict_raw
                  data:
                    action_type: read
                    endpoint: /objects/locations?limit=500&offset=0
                - variables:
                    _rb_old_kids: "{{ _rb_evict_raw['result']['content'] | selectattr('userfields.grocy_parent_location_id', 'equalto', _rb_old_parent | string) | map(attribute='id') | map('int') | unique | sort | list }}"
                - action: script.zen_dojotools_grocy_advanced
                  data:
                    action_type: update
                    endpoint: /userfields/locations/{{ _rb_old_parent }}
                    payload: "{{ dict([('grocy_child_location_ids', '[' ~ (_rb_old_kids | join(',')) ~ ']')]) }}"
        - variables:
            final_response:
              status: success
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              mode: locations_reparent_bulk
              result:
                parent_id: '{{ _bulk_parent_lid }}'
                children_processed: '{{ _bulk_child_ids | length }}'
                child_ids: '{{ _bulk_child_ids }}'
        - stop: Reparent Bulk Complete
          response_variable: final_response
    - alias: 'locations_delete_safe — stock-safe delete'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'locations_delete_safe' and location_id_resolved is not none }}"
        sequence:
        - action: script.zen_dojotools_grocy_advanced
          response_variable: _ds_stock_raw
          data:
            action_type: read
            endpoint: /stock/locations/{{ location_id_resolved }}/entries
        - variables:
            _ds_stock_list: "{{ _ds_stock_raw['result']['content'] | default([]) }}"
            _ds_has_stock: "{{ (_ds_stock_list | list | length) > 0 }}"
            _ds_orphan_to: "{{ orphan_to_lid_in | int(none) }}"
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _ds_has_stock and _ds_orphan_to is none }}"
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  version: '{{ tool_version }}'
                  mode: locations_delete_safe
                  message: Location has stock — provide orphan_to to transfer before delete
                  details:
                    location_id: '{{ location_id_resolved }}'
                    stock_count: '{{ _ds_stock_list | length }}'
                  coaching:
                  - Use locations_delete_safe with orphan_to=<destination_id>
                  - Or transfer stock manually first then use locations_delete
            - stop: Delete Safe Blocked
              response_variable: final_response
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _ds_has_stock and _ds_orphan_to is not none }}"
            sequence:
            - repeat:
                for_each: "{{ _ds_stock_list | map(attribute='product_id') | unique | list }}"
                sequence:
                - action: script.zen_dojotools_grocy_advanced
                  data:
                    action_type: create
                    endpoint: /stock/products/{{ repeat.item }}/transfer
                    payload: "{{ {'amount': (_ds_stock_list | selectattr('product_id', 'equalto', repeat.item) | map(attribute='amount') | map('float') | sum), 'location_id_from': location_id_resolved | int, 'location_id_to': _ds_orphan_to} }}"
        - action: script.zen_dojotools_grocy_advanced
          response_variable: _ds_del_raw
          data:
            action_type: delete
            endpoint: /objects/locations/{{ location_id_resolved }}
            payload: "{{ {} }}"
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _deleted_loc_parent_id is not none }}"
            sequence:
            - action: script.zen_dojotools_grocy_advanced
              response_variable: _ds_evict_raw
              data:
                action_type: read
                endpoint: /objects/locations?limit=500&offset=0
            - variables:
                _ds_evict_kids: "{{ _ds_evict_raw['result']['content'] | selectattr('userfields.grocy_parent_location_id', 'equalto', _deleted_loc_parent_id | string) | map(attribute='id') | map('int') | unique | sort | list }}"
            - action: script.zen_dojotools_grocy_advanced
              data:
                action_type: update
                endpoint: /userfields/locations/{{ _deleted_loc_parent_id }}
                payload: "{{ dict([('grocy_child_location_ids', '[' ~ (_ds_evict_kids | join(',')) ~ ']')]) }}"
        - variables:
            final_response:
              status: success
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              mode: locations_delete_safe
              result:
                location_id: '{{ location_id_resolved }}'
                stock_transferred: '{{ _ds_has_stock }}'
                orphan_to: '{{ _ds_orphan_to }}'
                deleted: true
        - stop: Delete Safe Complete
          response_variable: final_response
    - alias: 'locations_hierarchy_rebuild — rebuild parent-child lists from ground truth'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'locations_hierarchy_rebuild' }}"
        sequence:
        - action: script.zen_dojotools_grocy_advanced
          response_variable: _hr_raw
          data:
            action_type: read
            endpoint: /objects/locations?limit=500&offset=0
        - variables:
            _hr_locs: "{{ _hr_raw['result']['content'] | default([], true) }}"
        - variables:
            _hr_all_pids: >-
              {{ _hr_locs
                 | selectattr('userfields.grocy_parent_location_id', 'defined')
                 | selectattr('userfields.grocy_parent_location_id', 'ne', none)
                 | selectattr('userfields.grocy_parent_location_id', 'ne', '')
                 | map(attribute='userfields.grocy_parent_location_id')
                 | map('int')
                 | unique
                 | list }}
        - variables:
            _hr_plans: >-
              {%- set ns = namespace(plans=[]) -%}
              {%- for pid_int in _hr_all_pids -%}
                {%- set pid_str = pid_int | string -%}
                {%- set derived = _hr_locs
                    | selectattr('userfields.grocy_parent_location_id', 'defined')
                    | selectattr('userfields.grocy_parent_location_id', 'equalto', pid_str)
                    | map(attribute='id') | map('int') | sort | list -%}
                {%- set parent = _hr_locs | selectattr('id', 'equalto', pid_int) | list | first | default(none) -%}
                {%- set cur_raw = (parent.userfields.grocy_child_location_ids | default('[]', true))
                    if (parent is not none and parent.userfields is defined) else '[]' -%}
                {%- set current = cur_raw | from_json | map('int') | sort | list -%}
                {%- if derived != current -%}
                  {%- set ns.plans = ns.plans + [{
                    'parent_id': pid_int,
                    'parent_name': (parent.name if parent is not none else '?'),
                    'derived': derived,
                    'current': current}] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.plans }}
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ dry_run_in }}"
            sequence:
            - variables:
                final_response:
                  status: dry_run
                  mode: locations_hierarchy_rebuild
                  parents_to_update: "{{ _hr_plans | length }}"
                  total_parents_scanned: "{{ _hr_all_pids | length }}"
                  plan: "{{ _hr_plans }}"
            - stop: Hierarchy Rebuild Dry Run
              response_variable: final_response
        - repeat:
            for_each: "{{ _hr_plans }}"
            sequence:
            - action: script.zen_dojotools_grocy_advanced
              data:
                action_type: update
                endpoint: /userfields/locations/{{ repeat.item.parent_id }}
                payload: "{{ dict([('grocy_child_location_ids', '[' ~ (repeat.item.derived | join(',')) ~ ']')]) }}"
        - variables:
            final_response:
              status: success
              mode: locations_hierarchy_rebuild
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              parents_scanned: "{{ _hr_all_pids | length }}"
              parents_updated: "{{ _hr_plans | length }}"
              total_children_registered: "{{ _hr_plans | map(attribute='derived') | map('length') | sum }}"
        - stop: Hierarchy Rebuild Complete
          response_variable: final_response
    - alias: 'stock_area_summary — bulk product count + location_tree for a HA area (RM chain target)'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'stock_area_summary' }}"
        sequence:
        - variables:
            _sas_area_id: "{{ area_id_norm }}"
        - variables:
            _sas_hh_cab: >-
              {{ label_entities('Zen Household Cabinet')
                 | select('match', 'sensor\\.') | list | first | default('') }}
        - variables:
            _sas_spatial: >-
              {%- set _cv = state_attr(_sas_hh_cab, 'variables') -%}
              {%- set _cv = _cv if _cv is mapping else {} -%}
              {%- set _topo = _cv.get('room_topology', {}) -%}
              {%- set _topo = _topo.get('value', _topo) if _topo is mapping else {} -%}
              {%- set _topo = _topo | from_json if _topo is string and _topo | trim not in ['', 'none', 'null', 'None'] else _topo -%}
              {{ _topo.get(_sas_area_id, none) }}
        - variables:
            _sas_anchor_id: >-
              {{ (_sas_spatial.grocy_location_id | string | trim)
                 if (_sas_spatial is mapping
                     and _sas_spatial.grocy_location_id | default(none, true) is not none)
                 else none }}
        - variables:
            _sas_safety: >-
              {{ _sas_spatial.get('safety', []) if _sas_spatial is mapping else [] }}
        - action: script.zen_dojotools_grocy_advanced
          response_variable: _sas_locs_raw
          data:
            action_type: read
            endpoint: /objects/locations?limit=500&offset=0
        - variables:
            _sas_all_locs: "{{ _sas_locs_raw['result']['content'] | default([], true) }}"
        - variables:
            _sas_area_locs: >-
              {{ _sas_all_locs
                 | selectattr('userfields.homeassistant_area', 'defined')
                 | selectattr('userfields.homeassistant_area', 'search', '(?i)^' ~ _sas_area_id ~ '$')
                 | list }}
        - action: rest_command.grocy_api_advanced_get
          response_variable: _sas_prods_rest
          data:
            endpoint: "objects/products?limit=1000"
        - variables:
            _sas_counts: >-
              {%- set _raw = _sas_prods_rest.content | default(none, true) -%}
              {%- set _prods = (_raw | from_json if _raw is string else _raw) | default([], true) -%}
              {%- set _prods = _prods if (_prods is sequence and _prods is not string) else [] -%}
              {%- set ns_lc = namespace(lc={}) -%}
              {%- for p in _prods -%}
                {%- set _lid = p.location_id | default(0, true) | int(0) -%}
                {%- if _lid > 0 -%}
                  {%- set ns_lc.lc = ns_lc.lc | combine({_lid | string: (ns_lc.lc.get(_lid | string, 0) + 1)}) -%}
                {%- endif -%}
              {%- endfor -%}
              {%- set ns = namespace(counts=[]) -%}
              {%- for loc in _sas_area_locs -%}
                {%- set _lid = loc.id | int -%}
                {%- set _pid_raw = loc.userfields.grocy_parent_location_id | default(none, true) -%}
                {%- set _pid = _pid_raw | int(none) if _pid_raw not in [none, '', '0', 0] else none -%}
                {%- set _count = ns_lc.lc.get(_lid | string, 0) | int -%}
                {%- set ns.counts = ns.counts + [{
                  'id': _lid,
                  'name': loc.name,
                  'parent_id': _pid,
                  'subclass': loc.userfields.grocy_location_subclass | default('', true),
                  'is_anchor': (loc.id | string) == (_sas_anchor_id | string),
                  'item_count': _count
                }] -%}
              {%- endfor -%}
              {{ ns.counts }}
        - variables:
            _sas_all_locs_map: >-
              {%- set ns = namespace(m={}) -%}
              {%- for l in _sas_all_locs -%}
                {%- set ns.m = ns.m | combine({l.id | string: l.name}) -%}
              {%- endfor -%}
              {{ ns.m }}
        - variables:
            _sas_annotated: >-
              {%- set ns = namespace(nodes=[]) -%}
              {%- for c in _sas_counts | sort(attribute='name') -%}
                {%- set pname = _sas_all_locs_map.get(c.parent_id | string, none) if c.parent_id is not none else none -%}
                {%- set ns.nodes = ns.nodes + [c | combine({'parent_name': pname})] -%}
              {%- endfor -%}
              {{ ns.nodes }}
            _sas_anchor_int: "{{ _sas_anchor_id | int(0) }}"
        - variables:
            _sas_location_tree: >-
              {%- set ns = namespace(roots=[]) -%}
              {%- set _has_anchor = _sas_annotated | selectattr('is_anchor') | list | length > 0 -%}
              {%- set _area_ids = _sas_annotated | map(attribute='id') | list -%}
              {%- for c0 in _sas_annotated if (c0.is_anchor if _has_anchor else c0.parent_id not in _area_ids) -%}
                {%- set ns_l1 = namespace(children=[]) -%}
                {%- for c1 in _sas_annotated if c1.parent_id == c0.id and not c1.is_anchor -%}
                  {%- set ns_l2 = namespace(children=[]) -%}
                  {%- for c2 in _sas_annotated if c2.parent_id == c1.id -%}
                    {%- set ns_l2.children = ns_l2.children + [{'id': c2.id, 'name': c2.name, 'subclass': c2.subclass, 'item_count': c2.item_count}] -%}
                  {%- endfor -%}
                  {%- set ns_l1.children = ns_l1.children + [{'id': c1.id, 'name': c1.name, 'subclass': c1.subclass, 'item_count': c1.item_count, 'children': ns_l2.children}] -%}
                {%- endfor -%}
                {%- set ns.roots = ns.roots + [{'id': c0.id, 'name': c0.name, 'is_anchor': c0.is_anchor, 'subclass': c0.subclass, 'item_count': c0.item_count, 'children': ns_l1.children}] -%}
              {%- endfor -%}
              {{ ns.roots }}
        - variables:
            final_response:
              status: success
              mode: stock_area_summary
              area_id: "{{ _sas_area_id }}"
              locations: "{{ _sas_annotated | sort(attribute='item_count', reverse=true) }}"
              location_tree: "{{ _sas_location_tree }}"
              anchor_location_id: "{{ _sas_anchor_id }}"
              total_locations: "{{ _sas_area_locs | length }}"
              stocked_locations: "{{ _sas_counts | selectattr('item_count', 'gt', 0) | list | length }}"
              total_items: "{{ _sas_counts | map(attribute='item_count') | sum }}"
              hazmat_safety: "{{ _sas_safety }}"
              tool: "{{ tool_name }}"
              version: "{{ tool_version }}"
        - stop: Area Inventory Summary
          response_variable: final_response
    - alias: 'stock_area_volatile — volatile items (overdue/due_soon/expiring) filtered to a HA area'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'stock_area_volatile' }}"
        sequence:
        - variables:
            _sav_area_id: "{{ area_id_norm }}"
        - action: script.zen_dojotools_grocy_advanced
          response_variable: _sav_locs_raw
          data:
            action_type: read
            endpoint: /objects/locations?limit=500&offset=0
        - variables:
            _sav_area_loc_ids: >-
              {%- set _all = _sav_locs_raw['result']['content'] | default([], true) -%}
              {{ _all
                 | selectattr('userfields.homeassistant_area', 'defined')
                 | selectattr('userfields.homeassistant_area', 'search', '(?i)^' ~ _sav_area_id ~ '$')
                 | map(attribute='id') | map('int') | list }}
        - action: script.zen_dojotools_grocy_advanced
          response_variable: _sav_vol_raw
          data:
            action_type: read
            endpoint: stock/volatile
        - variables:
            _sav_vol_content: >-
              {{ _sav_vol_raw['result']['content'] | default({}, true) }}
        - variables:
            final_response: >-
              {%- set _ov_all = _sav_vol_content.overdue_products | default([], true) -%}
              {%- set _ds_all = _sav_vol_content.due_dates | default([], true) -%}
              {%- set _ex_all = _sav_vol_content.expiring_products | default([], true) -%}
              {%- set ns = namespace(ov=[], ds=[], ex=[]) -%}
              {%- for i in _ov_all -%}
                {%- if i.location_id | default(none, true) | int(0) in _sav_area_loc_ids -%}
                  {%- set ns.ov = ns.ov + [i] -%}
                {%- endif -%}
              {%- endfor -%}
              {%- for i in _ds_all -%}
                {%- if i.location_id | default(none, true) | int(0) in _sav_area_loc_ids -%}
                  {%- set ns.ds = ns.ds + [i] -%}
                {%- endif -%}
              {%- endfor -%}
              {%- for i in _ex_all -%}
                {%- if i.location_id | default(none, true) | int(0) in _sav_area_loc_ids -%}
                  {%- set ns.ex = ns.ex + [i] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ {
                'status': 'success',
                'mode': 'stock_area_volatile',
                'area_id': _sav_area_id,
                'location_ids': _sav_area_loc_ids,
                'overdue': ns.ov,
                'due_soon': ns.ds,
                'expiring': ns.ex,
                'counts': {
                  'overdue': ns.ov | length,
                  'due_soon': ns.ds | length,
                  'expiring': ns.ex | length
                },
                'tool': tool_name,
                'version': tool_version
              } }}
        - stop: Area Volatile Stock
          response_variable: final_response
    - alias: 'chores_by_area — maintenance chores for products stocked in a HA area'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'chores_by_area' }}"
        sequence:
        - variables:
            _cba_area_id: "{{ homeassistant_area_id | default('') | string | trim }}"
        - action: script.zen_dojotools_grocy_advanced
          response_variable: _cba_locs_raw
          data:
            action_type: read
            endpoint: /objects/locations?limit=500&offset=0
        - variables:
            _cba_area_loc_ids: >-
              {{ _cba_locs_raw['result']['content'] | default([], true)
                 | selectattr('userfields.homeassistant_area', 'defined')
                 | selectattr('userfields.homeassistant_area', 'equalto', _cba_area_id)
                 | map(attribute='id') | map('int') | list }}
        - action: script.zen_dojotools_grocy_advanced
          response_variable: _cba_defs_raw
          data:
            action_type: read
            endpoint: /objects/chores?limit=500&offset=0
        - variables:
            _cba_all_chores: "{{ _cba_defs_raw['result']['content'] | default([], true) }}"
        - variables:
            _cba_tagged_ids: >-
              {{ _cba_all_chores
                 | selectattr('userfields', 'defined')
                 | selectattr('userfields.homeassistant_area', 'defined')
                 | selectattr('userfields.homeassistant_area', 'equalto', _cba_area_id)
                 | map(attribute='id') | map('int') | list }}
        - variables:
            _cba_linked: >-
              {{ _cba_all_chores
                 | selectattr('product_id', 'defined')
                 | rejectattr('product_id', 'equalto', none)
                 | rejectattr('product_id', 'equalto', '')
                 | list }}
        - action: script.zen_dojotools_grocy_advanced
          response_variable: _cba_state_raw
          data:
            action_type: read
            endpoint: /chores
        - variables:
            _cba_state: "{{ _cba_state_raw['result']['content'] | default([], true) }}"
        - variables:
            _cba_results: "{{ [] }}"
        - variables:
            _cba_results: >-
              {%- set ns = namespace(r=_cba_results) -%}
              {%- for c in _cba_all_chores -%}
                {%- if (c.id | int) in _cba_tagged_ids -%}
                  {%- set _pid = c.get('product_id', none) -%}
                  {%- if _pid is none or _pid | string | trim == '' -%}
                    {%- set _st = _cba_state | selectattr('chore_id', 'equalto', c.id | string) | list | first | default({}) -%}
                    {%- set ns.r = ns.r + [{'chore_id': c.id | int, 'name': c.name, 'product_id': none, 'product_amount': 0, 'is_due': _st.get('is_due', false) | bool, 'next_execution': _st.get('next_estimated_execution_time', none), 'last_tracked': _st.get('last_tracked_time', none), 'area_location_ids': [], 'discovery': 'tagged'}] -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.r }}
        - repeat:
            for_each: "{{ _cba_linked }}"
            sequence:
            - action: script.zen_dojotools_grocy_advanced
              response_variable: _cba_ploc_raw
              continue_on_error: true
              data:
                action_type: read
                endpoint: /stock/products/{{ repeat.item.product_id }}/entries
            - variables:
                _cba_plocs: "{{ _cba_ploc_raw['result']['content'] | default([], true) }}"
            - variables:
                _cba_in_area: >-
                  {{ _cba_plocs
                     | selectattr('location_id', 'defined')
                     | selectattr('location_id', 'in', _cba_area_loc_ids)
                     | list }}
            - variables:
                _cba_state_entry: >-
                  {{ _cba_state
                     | selectattr('chore_id', 'equalto', repeat.item.id | string)
                     | list | first | default({}) }}
            - variables:
                _cba_results: >-
                  {%- if _cba_in_area | length > 0 or (repeat.item.id | int) in _cba_tagged_ids -%}
                    {{ _cba_results + [{
                      'chore_id': repeat.item.id | int,
                      'name': repeat.item.name,
                      'product_id': repeat.item.product_id | int,
                      'product_amount': repeat.item.product_amount | default(1, true) | float,
                      'is_due': _cba_state_entry.get('is_due', false) | bool,
                      'next_execution': _cba_state_entry.get('next_estimated_execution_time', none),
                      'last_tracked': _cba_state_entry.get('last_tracked_time', none),
                      'area_location_ids': _cba_in_area | map(attribute='location_id') | map('int') | unique | list,
                      'discovery': 'product' if _cba_in_area | length > 0 else 'tagged'
                    }] }}
                  {%- else -%}
                    {{ _cba_results }}
                  {%- endif -%}
        - variables:
            final_response:
              status: success
              mode: chores_by_area
              area_id: "{{ _cba_area_id }}"
              chores: "{{ _cba_results }}"
              total: "{{ _cba_results | length }}"
              due_count: "{{ _cba_results | selectattr('is_due') | list | length }}"
              tool: "{{ tool_name }}"
              version: "{{ tool_version }}"
        - stop: Chores By Area
          response_variable: final_response
    - alias: 'room_brief — chores + stock summary for a HA area in one call'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'room_brief' }}"
        sequence:
        - variables:
            _rb_area: "{{ homeassistant_area_id | default('') | string | trim }}"
        - action: script.zen_dojotools_grocy_advanced
          response_variable: _rb_locs_raw
          data:
            action_type: read
            endpoint: /objects/locations?limit=500&offset=0
        - variables:
            _rb_area_loc_ids: >-
              {{ _rb_locs_raw['result']['content'] | default([], true)
                 | selectattr('userfields.homeassistant_area', 'defined')
                 | selectattr('userfields.homeassistant_area', 'equalto', _rb_area)
                 | map(attribute='id') | map('int') | list }}
        - action: script.zen_dojotools_grocy_advanced
          response_variable: _rb_chore_defs_raw
          data:
            action_type: read
            endpoint: /objects/chores?limit=500&offset=0
        - action: script.zen_dojotools_grocy_advanced
          response_variable: _rb_chore_state_raw
          data:
            action_type: read
            endpoint: /chores
        - variables:
            _rb_chore_state: "{{ _rb_chore_state_raw['result']['content'] | default([], true) }}"
        - variables:
            _rb_chores: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for c in _rb_chore_defs_raw['result']['content'] | default([], true) -%}
                {%- if c.userfields is mapping and c.userfields.get('homeassistant_area') == _rb_area -%}
                  {%- set _st = _rb_chore_state | selectattr('chore_id', 'equalto', c.id | string) | list | first | default({}) -%}
                  {%- set ns.out = ns.out + [{'chore_id': c.id | int, 'name': c.name, 'is_due': _st.get('is_due', false) | bool, 'next_execution': _st.get('next_estimated_execution_time', none)}] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out }}
        - action: script.zen_dojotools_grocy_advanced
          response_variable: _rb_stock_raw
          data:
            action_type: read
            endpoint: /objects/stock?limit=500&offset=0
        - variables:
            _rb_stock_in_area: >-
              {{ _rb_stock_raw['result']['content'] | default([], true)
                 | selectattr('location_id', 'defined')
                 | selectattr('location_id', 'in', _rb_area_loc_ids)
                 | list }}
        - variables:
            final_response:
              status: success
              mode: room_brief
              area_id: "{{ _rb_area }}"
              chores: "{{ _rb_chores }}"
              chores_due: "{{ _rb_chores | selectattr('is_due') | list | length }}"
              stock_total_items: "{{ _rb_stock_in_area | map(attribute='amount') | sum }}"
              stock_unique_products: "{{ _rb_stock_in_area | map(attribute='product_id') | unique | list | length }}"
              stocked_location_ids: "{{ _rb_stock_in_area | map(attribute='location_id') | unique | list }}"
              tool: "{{ tool_name }}"
              version: "{{ tool_version }}"
        - stop: Room Brief
          response_variable: final_response
    - alias: 'chores_add — create a new Grocy chore'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ mode_norm == 'chores_add' }}"
        sequence:
        - variables:
            _ca_name: "{{ item | default('') | string | trim }}"
            _ca_period_type: "{{ period_type | default('dynamic-regular') | string | trim }}"
            _ca_period_days: "{{ period_days | default(7) | int }}"
            _ca_product_id: "{{ product_id | default(none, true) }}"
            _ca_product_amount: "{{ product_amount | default(1) | float }}"
            _ca_note: "{{ note | default(none, true) }}"
        - action: script.zen_dojotools_grocy_advanced
          response_variable: _ca_raw
          data:
            action_type: create
            endpoint: /objects/chores
            payload: >-
              {%- set p = {
                  'name': _ca_name,
                  'period_type': _ca_period_type,
                  'period_days': _ca_period_days,
                  'active': 1
                } -%}
              {%- if _ca_product_id is not none -%}
                {%- set p = p | combine({'product_id': _ca_product_id | int,
                                         'product_amount': _ca_product_amount,
                                         'consume_product_on_execution': 1}) -%}
              {%- endif -%}
              {%- if _ca_note is not none -%}
                {%- set p = p | combine({'description': _ca_note}) -%}
              {%- endif -%}
              {{ p | tojson }}
        - variables:
            _ca_created_id: >-
              {%- set _c = _ca_raw.get('result', {}).get('content', '') -%}
              {%- set _c = _c | from_json if _c is string and _c | trim not in ['', 'none', 'null'] else _c -%}
              {{ (_c.get('created_object_id', _c.get('id', none)) | int(none))
                 if _c is mapping else none }}
        - variables:
            final_response:
              status: success
