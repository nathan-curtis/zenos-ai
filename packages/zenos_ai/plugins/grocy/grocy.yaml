          catalog_find_by_tag:
            intent: Find products by tag. Searches both ZenOS userfield ha_labels AND Grocy native product tags. Filters zen_safety_type, zen_asset_type, and/or ha_labels in-template.
            needs: []
            optional: [safety_type (filter by zen_safety_type), asset_type (filter by zen_asset_type), homeassistant_area_id (filter by product homeassistant_area userfield), ha_labels (filter by tag slug — matches ha_labels userfield OR native Grocy product tags, single slug or CSV)]
            reads: GET /objects/products (limit=600)
            notes:
              - Returns slim list — id, name, zen_safety_type, zen_asset_type, hazmat_class, homeassistant_area, ha_labels, native_tags, location_id
              - Omit all filters to get all tagged products (any zen_safety_type, zen_asset_type, ha_labels, or native tags set)
              - Native Grocy product tags and ha_labels userfield are merged for all tag filtering
          bulk_stock_add:
            intent: "Add stock (purchase) for a BOM list, checked line by line before anything is written. Each line resolves its product (product_id, else an exact name; several matches = ambiguous), its units, purchase date, store and best-before date; dry_run returns that plan. Line keys override the call's: name or product_id, amount, price, purchase_date, store or shopping_location_id, best_before_date, location_id, nonperishable, note."
            needs: [bom, confirm_action=true (unless dry_run=true)]
            optional: [amount (default 1), location, location_id, price, purchase_date (YYYY-MM-DD; none = today), store or shopping_location_id, best_before_date, hold_invalid (default false), dry_run (default false)]
            best_before: "explicit date wins; nonperishable=true or a product default of -1 = never expires (2999-12-31); a product default of N days = purchase date + N; a default of 0 = unknown: the line is refused until you give best_before_date or nonperishable=true (it is never booked as expiring today)"
            refused_before_writing: "product not found or ambiguous, no purchase or stock unit, a parent with no own stock, a bad or future date, an unknown or ambiguous store, amount 0, unknown best-before. Without hold_invalid nothing is written; with it the valid lines are booked and the rest come back held."
            does: "POST /stock/products/{id}/add per valid line with purchased_date, best_before_date, price, location and store; each booking is checked against Grocy's own booking record and returns booking_ids and stock_ids (status added, held, failed, unverified or mismatch)."
            example: "{'mode':'bulk_stock_add','bom':'[{\"name\":\"Halo The Flood\",\"price\":9.99}]','amount':1,'dry_run':true}"
          receipt_intake:
            intent: "Book a whole receipt (#10780). Header: receipt_id, store or shopping_location_id, purchase_date, subtotal, tax, discounts, total, source_ref, notes. Lines: line, product_id or name, description, amount, unit, unit_price and/or line_total, type item|free|discount|coupon, and best_before_date, nonperishable, location_id, note. The money is checked in cents first (per line, and items - discounts = subtotal, subtotal + tax = total); an unbalanced receipt is refused unless allow_unbalanced=true. Item lines go through bulk_stock_add's preflight; a line without a count or weight, in another unit than the product's purchase unit, or on a product that buys and stocks in different units, is held, never guessed. Discounts and coupons are recorded, not stocked; tax is recorded, not spread into prices."
            needs: [receipt (JSON), dry_run=false and confirm_action=true to book]
            optional: [dry_run (default true), allow_unbalanced (default false)]
            replay: "each booking's note is rcpt:<receipt_id>/L<line>/R<receipt object>; a rerun finds those in Grocy's stock log and books only the lines not booked yet (already_booked), so a held line can be fixed and the receipt run again"
            kept_in_grocy: "user objects receipt and receipt_line (schema 1.4.0; run userfields_deploy once)"
            example: "{'mode':'receipt_intake','receipt':{'receipt_id':'GROCER-2026-01-15-0001','store':'Corner Grocer','purchase_date':'2026-01-15','subtotal':9.96,'tax':0,'total':9.96,'lines':[{'line':1,'product_id':101,'description':'MILK 2% GAL','amount':2,'unit':'Gallon','unit_price':5.48,'line_total':10.96},{'line':2,'name':'Cake Mix','type':'free','line_total':0},{'line':3,'description':'DIGITAL COUPON','type':'coupon','line_total':-1.00}]}}"
          bulk_stock_reconcile_recent:
            intent: Reverse a duplicate/erroneous bulk stock booking. For each product in bom, sums only the stock entries created at/after since_timestamp and subtracts that from the product's current total via stock_inventory_adjust (Grocy's own reconcile-to-a-measured-total action) — never stock_undo_booking (can refuse on dependent bookings) or stock_consume (could remove the wrong, original entries instead of the erroneous new ones, since Grocy consumes by soonest-expiry not recency).
            needs: [bom, since_timestamp]
            optional: [dry_run (default true — preview only), confirm_action=true (required when dry_run=false)]
            does: GET /stock/products/{id}/entries + GET /stock/products/{id} then POST /stock/products/{id}/inventory per item in bom
            example: "{'mode':'bulk_stock_reconcile_recent','bom':'[{\"product_id\":692}]','since_timestamp':'2026-07-21 10:50:00','dry_run':true}"
          bulk_tag:
            intent: Apply userfield tags (ha_labels, asset_type, book fields, etc.) to a BOM list of products. Resolves names with exact then fuzzy fallback.
            needs: [bom, confirm_action=true]
            optional: [ha_labels, asset_type, safety_type, homeassistant_area_id, book_author, book_isbn, book_series, book_genre]
            does: PUT /userfields/products/{id} for each item in bom
            example: "{'mode':'bulk_tag','bom':'[{\"name\":\"Halo: The Flood\"}]','ha_labels':'book','book_series':'Halo','confirm_action':true}"
          bulk_label_add:
            intent: Append label slug(s) to ha_labels on a BOM list without overwriting existing labels.
            needs: [bom, ha_labels (slugs to add), confirm_action=true]
            optional: []
            does: GET /userfields/products/{id} + merge + PUT /userfields/products/{id} per item
            example: "{'mode':'bulk_label_add','bom':'[{name:Halo The Flood}]','ha_labels':'reading-list','confirm_action':true}"
          bulk_label_remove:
