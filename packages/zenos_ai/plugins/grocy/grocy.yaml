                icon_css_class: "fas fa-cube"
              - name: depreciable_asset
                caption: Depreciable Asset
                description: "Household asset subject to depreciation tracking. Stores cost basis, useful life, depreciation method, and Firefly III ledger references."
                show_in_sidebar_menu: 0
                icon_css_class: "fas fa-tools"
              - name: asset_allocation
                caption: Asset Allocation
                description: "Date-ranged business/household use allocation records per depreciable asset. One row per allocation period. Current effective row overrides asset-level percentages."
                show_in_sidebar_menu: 0
                icon_css_class: "fas fa-percent"

        # mode=userfields_list
        - if: "{{ mode_norm == 'userfields_list' }}"
          then:
            - variables:
                _ul_filter: "{{ (entity | default('')) | trim }}"
                _ul_fields: >-
                  {{ _uf_existing | selectattr('entity','equalto',_ul_filter) | list
                     if _ul_filter != '' else _uf_existing }}
            - variables:
                final_response:
                  status: ok
                  case: userfields_list
                  schema_version: "{{ schema_version }}"
                  entity_filter: "{{ _ul_filter | default(none, true) }}"
                  count: "{{ _ul_fields | length }}"
                  fields: "{{ _ul_fields }}"
                  caller_token: "{{ _caller_token }}"
            - stop: userfields_list done
              response_variable: final_response

        # mode=userfields_delete
        - if: "{{ mode_norm == 'userfields_delete' }}"
          then:
            - if: "{{ field_id | default(none) is none }}"
              then:
                - variables:
                    final_response:
                      status: error
                      case: userfields_delete
                      message: "field_id is required. Get IDs via mode=userfields_list."
                      caller_token: "{{ _caller_token }}"
                - stop: userfields_delete missing field_id
                  response_variable: final_response
            - variables:
                _uddel_target: >-
                  {{ _uf_existing | selectattr('id','equalto',field_id | int) | list | first | default(none) }}
                _uddel_is_canonical: >-
                  {%- set t = _uddel_target -%}
                  {{ _uf_canonical | selectattr('entity','equalto',t.entity | default(''))
                     | selectattr('name','equalto',t.name | default('')) | list | length > 0
                     if t is mapping else false }}
            - if: "{{ not (confirm_action | default(false) | bool) }}"
              then:
                - variables:
                    final_response:
                      status: preview
                      case: userfields_delete
                      field_id: "{{ field_id }}"
                      field: "{{ _uddel_target }}"
                      is_canonical: "{{ _uddel_is_canonical }}"
                      message: >-
                        {{ 'CAUTION: canonical ZenOS field -- deleting orphans stored values and breaks schema_version tracking. '
                           if _uddel_is_canonical else "" }}
                        Pass confirm_action=true to delete
                        {{ _uddel_target.entity | default("?") }}.{{ _uddel_target.name | default("?") }}
                        (id={{ field_id }}). IRREVERSIBLE.
                      caller_token: "{{ _caller_token }}"
                - stop: userfields_delete preview
                  response_variable: final_response
            - action: script.zen_sutra_grocy
              data:
                action_type: delete
                endpoint: "/objects/userfields/{{ field_id }}"
                payload: "{}"
              response_variable: _uddel_raw
              continue_on_error: true
            - variables:
                _uddel_http: >-
                  {{ _uddel_raw['result']['status'] | int(0)
                     if _uddel_raw is mapping and 'result' in _uddel_raw else 0 }}
                _uddel_ok: "{{ _uddel_http in [200, 204] }}"
            - variables:
                final_response:
                  status: "{{ 'ok' if _uddel_ok else 'error' }}"
                  case: userfields_delete
                  field_id: "{{ field_id }}"
                  deleted: "{{ _uddel_ok }}"
                  was_canonical: "{{ _uddel_is_canonical }}"
                  http_status: "{{ _uddel_http }}"
                  schema_version: "{{ schema_version }}"
                  caller_token: "{{ _caller_token }}"
            - stop: userfields_delete done
              response_variable: final_response

        # mode=userfields_deploy
        - if: "{{ mode_norm == 'userfields_deploy' }}"
          then:
            # --- phase 1: userentities ---
            - variables:
                _ude_missing: >-
                  {%- set ns = namespace(m=[]) -%}
                  {%- for ue in _ue_canonical -%}
                    {%- if _ue_existing | selectattr('name','equalto',ue.name) | list | length == 0 -%}
                      {%- set ns.m = ns.m + [ue] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ ns.m }}
                _ude_skipped: >-
                  {%- set ns = namespace(s=[]) -%}
                  {%- for ue in _ue_canonical -%}
                    {%- if _ue_existing | selectattr('name','equalto',ue.name) | list | length > 0 -%}
                      {%- set ns.s = ns.s + [ue.name] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ ns.s }}
            - if: "{{ _ude_missing | length > 0 }}"
              then:
                - repeat:
                    for_each: "{{ _ude_missing }}"
                    sequence:
                      - action: script.zen_sutra_grocy
                        data:
                          action_type: create
                          endpoint: /objects/userentities
                          payload: "{{ repeat.item | tojson }}"
                        response_variable: _udec_raw
                        continue_on_error: true
            # --- phase 2: userfields ---
            - variables:
                _udp_missing: >-
                  {%- set ns = namespace(m=[]) -%}
                  {%- for f in _uf_canonical -%}
                    {%- if _uf_existing | selectattr('entity','equalto',f.entity)
                           | selectattr('name','equalto',f.name) | list | length == 0 -%}
                      {%- set ns.m = ns.m + [f] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ ns.m }}
                _udp_skipped: >-
                  {%- set ns = namespace(s=[]) -%}
                  {%- for f in _uf_canonical -%}
                    {%- if _uf_existing | selectattr('entity','equalto',f.entity)
                           | selectattr('name','equalto',f.name) | list | length > 0 -%}
                      {%- set ns.s = ns.s + [f.entity ~ '.' ~ f.name] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ ns.s }}
            - if: "{{ _udp_missing | length > 0 }}"
              then:
                - repeat:
                    for_each: "{{ _udp_missing }}"
                    sequence:
                      - action: script.zen_sutra_grocy
                        data:
                          action_type: create
                          endpoint: /objects/userfields
                          payload: "{{ repeat.item | tojson }}"
                        response_variable: _udpc_raw
                        continue_on_error: true
                - action: script.zen_sutra_grocy
                  data:
                    action_type: read
                    endpoint: /objects/userfields
                    perPage: 200
                  response_variable: _udp_after_raw
                  continue_on_error: true
                - variables:
                    _udp_after: >-
                      {{ _udp_after_raw['result']['content']
                         if _udp_after_raw is mapping and 'result' in _udp_after_raw
                            and _udp_after_raw['result']['content'] is sequence
                         else [] }}
                    _udp_created: >-
                      {%- set ns = namespace(c=[]) -%}
                      {%- for f in _udp_missing -%}
                        {%- if _udp_after | selectattr('entity','equalto',f.entity)
                               | selectattr('name','equalto',f.name) | list | length > 0 -%}
                          {%- set ns.c = ns.c + [f.entity ~ '.' ~ f.name] -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {{ ns.c }}
                    _udp_failed: >-
                      {%- set ns = namespace(f=[]) -%}
                      {%- for f in _udp_missing -%}
                        {%- if _udp_after | selectattr('entity','equalto',f.entity)
                               | selectattr('name','equalto',f.name) | list | length == 0 -%}
                          {%- set ns.f = ns.f + [f.entity ~ '.' ~ f.name] -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {{ ns.f }}
            - if: "{{ _uf_hh_cab != '' }}"
              then:
                - action: script.zen_dojotools_filecabinet
                  data:
                    action_type: "{{ 'update' if (state_attr(_uf_hh_cab, 'variables') | default({}, true)).get('grocy_schema') is not none else 'create' }}"
                    key: grocy_schema
                    volume_entity_id: "{{ _uf_hh_cab }}"
                    value: "{{ {'schema_version': schema_version, 'deployed_at': now().isoformat(), 'field_count': _uf_canonical | length, 'userentity_count': _ue_canonical | length} | tojson }}"
                  response_variable: _udp_cab_raw
                  continue_on_error: true
            - variables:
                final_response:
                  status: "{{ 'ok' if (_udp_failed | default([])) | length == 0 else 'partial' }}"
                  case: userfields_deploy
                  schema_version: "{{ schema_version }}"
                  total_canonical: "{{ _uf_canonical | length }}"
                  userentities_created: "{{ _ude_missing | default([]) | map(attribute='name') | list }}"
                  userentities_skipped: "{{ _ude_skipped | default([]) }}"
                  created: "{{ _udp_created | default([]) }}"
                  skipped: "{{ _udp_skipped }}"
                  failed: "{{ _udp_failed | default([]) }}"
                  version_stamped: "{{ _uf_hh_cab != '' }}"
                  caller_token: "{{ _caller_token }}"
            - stop: userfields_deploy done
              response_variable: final_response

        # mode=userfields_repair
        - if: "{{ mode_norm == 'userfields_repair' }}"
          then:
            - variables:
                _urp_cab_schema: >-
                  {%- from 'zenos_ai/zenos_cabinets.jinja' import cabinet_drawer_value with context -%}
                  {%- if _uf_hh_cab != '' -%}
                    {%- set _gs = cabinet_drawer_value(_uf_hh_cab, 'grocy_schema') | from_json -%}
                    {{ _gs if _gs is mapping else none }}
                  {%- else -%}{{ none }}{%- endif -%}
            - variables:
                _urp_deployed_ver: >-
                  {{ _urp_cab_schema.get('schema_version', 'undeployed') if _urp_cab_schema is mapping else 'undeployed' }}
            - variables:
                _urp_missing: >-
                  {%- set ns = namespace(m=[]) -%}
                  {%- for f in _uf_canonical -%}
                    {%- if _uf_existing | selectattr('entity','equalto',f.entity)
                           | selectattr('name','equalto',f.name) | list | length == 0 -%}
                      {%- set ns.m = ns.m + [f.entity ~ '.' ~ f.name] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ ns.m }}
                _urp_type_drift: >-
                  {%- set ns = namespace(d=[]) -%}
                  {%- for f in _uf_canonical -%}
                    {%- set match = _uf_existing | selectattr('entity','equalto',f.entity)
                                   | selectattr('name','equalto',f.name) | list | first | default(none) -%}
                    {%- if match is not none and match.get('type','') != f.type -%}
                      {%- set ns.d = ns.d + [{'field': f.entity ~ '.' ~ f.name,
                                              'expected': f.type, 'actual': match.get('type',''),
                                              'id': match.get('id')}] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ ns.d }}
                _urp_ok: >-
                  {%- set ns = namespace(o=[]) -%}
                  {%- for f in _uf_canonical -%}
                    {%- set match = _uf_existing | selectattr('entity','equalto',f.entity)
                                   | selectattr('name','equalto',f.name) | list | first | default(none) -%}
                    {%- if match is not none and match.get('type','') == f.type -%}
                      {%- set ns.o = ns.o + [f.entity ~ '.' ~ f.name] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ ns.o }}
                _urp_unknown: >-
                  {%- set ns = namespace(u=[]) -%}
                  {%- for f in _uf_existing -%}
                    {%- if _uf_canonical | selectattr('entity','equalto',f.entity)
                           | selectattr('name','equalto',f.name) | list | length == 0 -%}
                      {%- set ns.u = ns.u + [{'field': f.entity ~ '.' ~ f.name, 'id': f.id}] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ ns.u }}
                _urp_caption_drift: >-
                  {%- set ns = namespace(d=[]) -%}
                  {%- for f in _uf_canonical -%}
                    {%- set match = _uf_existing | selectattr('entity','equalto',f.entity)
                                   | selectattr('name','equalto',f.name) | list | first | default(none) -%}
                    {%- if match is not none and f.caption not in match.get('caption','') -%}
                      {%- set ns.d = ns.d + [{'field': f.entity ~ '.' ~ f.name,
                                              'id': match.get('id'),
                                              'expected': f.caption,
                                              'actual': match.get('caption',''),
                                              'patch': match | combine({'caption': f.caption})}] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ ns.d }}
            - variables:
                _urp_healthy: >-
                  {{ _urp_missing | length == 0
                     and _urp_type_drift | length == 0
                     and _urp_caption_drift | length == 0
                     and _urp_deployed_ver == schema_version }}
            - if: "{{ not (dry_run | default(false) | bool) and _urp_missing | length > 0 }}"
              then:
                - repeat:
                    for_each: >-
                      {%- set ns = namespace(m=[]) -%}
                      {%- for f in _uf_canonical -%}
                        {%- if f.entity ~ '.' ~ f.name in _urp_missing -%}
                          {%- set ns.m = ns.m + [f] -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {{ ns.m }}
                    sequence:
                      - action: script.zen_sutra_grocy
                        data:
                          action_type: create
                          endpoint: /objects/userfields
                          payload: "{{ repeat.item | tojson }}"
                        response_variable: _urpm_raw
                        continue_on_error: true
            - if: "{{ not (dry_run | default(false) | bool) and _urp_caption_drift | length > 0 }}"
              then:
                - repeat:
                    for_each: "{{ _urp_caption_drift }}"
                    sequence:
                      - action: script.zen_sutra_grocy
                        data:
                          action_type: update
                          endpoint: "/objects/userfields/{{ repeat.item.id }}"
                          payload: "{{ repeat.item.patch | tojson }}"
                        response_variable: _urpc_raw
                        continue_on_error: true
            - variables:
                final_response:
                  status: "{{ 'ok' if _urp_healthy else 'issues_found' }}"
                  case: userfields_repair
                  schema_version: "{{ schema_version }}"
                  deployed_version: "{{ _urp_deployed_ver }}"
                  needs_migration: "{{ _urp_deployed_ver != schema_version }}"
                  dry_run: "{{ dry_run | default(false) | bool }}"
                  healthy: "{{ _urp_healthy }}"
                  ok_count: "{{ _urp_ok | length }}"
                  ok: "{{ _urp_ok }}"
                  missing: "{{ _urp_missing }}"
                  type_drift: "{{ _urp_type_drift }}"
                  caption_drift: "{{ _urp_caption_drift }}"
                  unknown: "{{ _urp_unknown }}"
                  action_taken: >-
                    {%- set acts = [] -%}
                    {%- if not (dry_run | default(false) | bool) -%}
                      {%- if _urp_missing | length > 0 -%}{%- set acts = acts + ['created_missing'] -%}{%- endif -%}
                      {%- if _urp_caption_drift | length > 0 -%}{%- set acts = acts + ['patched_captions'] -%}{%- endif -%}
                    {%- endif -%}
                    {{ acts | join(',') if acts | length > 0 else 'none' }}
                  caller_token: "{{ _caller_token }}"
            - stop: userfields_repair done
              response_variable: final_response

        # mode=userfields_create
        - if: "{{ mode_norm == 'userfields_create' }}"
          then:
            - variables:
                _ufc_entity: "{{ (entity | default('')) | trim }}"
                _ufc_name: "{{ (field_name | default('')) | trim }}"
                _ufc_caption: "{{ (field_caption | default('')) | trim }}"
                _ufc_type: "{{ (field_type | default('text-single-line')) | trim }}"
            - if: "{{ _ufc_entity == '' or _ufc_name == '' or _ufc_caption == '' }}"
              then:
                - variables:
                    final_response:
                      status: error
                      case: userfields_create
                      message: "entity, field_name, and field_caption are all required."
                      caller_token: "{{ _caller_token }}"
                - stop: userfields_create missing fields
                  response_variable: final_response
            - variables:
                _ufc_exists: >-
                  {{ _uf_existing | selectattr('entity','equalto',_ufc_entity)
                     | selectattr('name','equalto',_ufc_name) | list | first | default(none) }}
            - if: "{{ _ufc_exists is not none }}"
              then:
                - variables:
                    final_response:
                      status: already_exists
                      case: userfields_create
                      entity: "{{ _ufc_entity }}"
                      field_name: "{{ _ufc_name }}"
                      existing: "{{ _ufc_exists }}"
                      message: >-
                        Field {{ _ufc_entity }}.{{ _ufc_name }} already exists
                        (id={{ _ufc_exists.get('id') }}). No write performed.
                      caller_token: "{{ _caller_token }}"
                - stop: userfields_create already_exists
                  response_variable: final_response
            - action: script.zen_sutra_grocy
              data:
                action_type: create
                endpoint: /objects/userfields
                payload: >-
                  {{
                    {
                      'entity': _ufc_entity,
                      'name': _ufc_name,
                      'caption': _ufc_caption,
                      'type': _ufc_type,
                      'show_as_column_in_tables': 0
                    } | tojson
                  }}
              response_variable: _ufc_raw
              continue_on_error: true
            - variables:
                _ufc_content: >-
                  {{ _ufc_raw['result']['content']
                     if _ufc_raw is mapping and 'result' in _ufc_raw
                     else none }}
                _ufc_created_id: >-
                  {{ _ufc_content.get('created_object_id', none) | int(none)
                     if _ufc_content is mapping else none }}
            - variables:
                final_response:
                  status: "{{ 'ok' if _ufc_created_id is not none else 'error' }}"
                  case: userfields_create
                  entity: "{{ _ufc_entity }}"
                  field_name: "{{ _ufc_name }}"
                  field_type: "{{ _ufc_type }}"
                  created_id: "{{ _ufc_created_id }}"
                  schema_version: "{{ schema_version }}"
                  caller_token: "{{ _caller_token }}"
            - stop: userfields_create done
              response_variable: final_response

    # userentities + userobjects CRUD -- short-circuit before endpoint builder
    - if: "{{ mode_norm in ['userentities_list','userentities_create','userentities_delete',
                            'userobjects_list','userobjects_create','userobjects_delete',
                            'userentity_values_get','userentity_values_set'] }}"
      then:
        - variables:
            _uent_caller_token: "{{ caller_token | default('') }}"

        # mode=userentities_list
        - if: "{{ mode_norm == 'userentities_list' }}"
          then:
            - action: script.zen_sutra_grocy
              data:
                action_type: read
                endpoint: /objects/userentities
                perPage: 200
              response_variable: _uentl_raw
              continue_on_error: true
            - variables:
                _uentl_all: >-
                  {{ _uentl_raw['result']['content']
                     if _uentl_raw is mapping and 'result' in _uentl_raw
                        and _uentl_raw['result']['content'] is sequence
                     else [] }}
            - variables:
                final_response:
                  status: ok
                  case: userentities_list
                  count: "{{ _uentl_all | length }}"
                  userentities: "{{ _uentl_all }}"
                  caller_token: "{{ _uent_caller_token }}"
            - stop: userentities_list done
              response_variable: final_response

        # mode=userentities_create
        - if: "{{ mode_norm == 'userentities_create' }}"
          then:
            - variables:
                _uenc_name: "{{ (item | default('')) | trim }}"
                _uenc_caption: "{{ (field_caption | default('')) | trim }}"
                _uenc_desc: "{{ (note | default('')) | trim }}"
            - if: "{{ _uenc_name == '' or _uenc_caption == '' }}"
              then:
                - variables:
                    final_response:
                      status: error
                      case: userentities_create
                      message: "item (snake_case name slug) and field_caption are required."
                      caller_token: "{{ _uent_caller_token }}"
                - stop: userentities_create missing fields
                  response_variable: final_response
            - action: script.zen_sutra_grocy
              data:
                action_type: create
                endpoint: /objects/userentities
                payload: >-
                  {{
                    {
                      'name': _uenc_name,
                      'caption': _uenc_caption,
                      'description': _uenc_desc if _uenc_desc != '' else none,
                      'show_in_sidebar_menu': 0,
                      'icon_css_class': 'fas fa-cube'
                    } | tojson
                  }}
              response_variable: _uenc_raw
              continue_on_error: true
            - variables:
                _uenc_content: >-
                  {{ _uenc_raw['result']['content']
                     if _uenc_raw is mapping and 'result' in _uenc_raw
                     else none }}
                _uenc_id: >-
                  {{ _uenc_content.get('created_object_id', none) | int(none)
                     if _uenc_content is mapping else none }}
            - variables:
                final_response:
                  status: "{{ 'ok' if _uenc_id is not none else 'error' }}"
                  case: userentities_create
                  name: "{{ _uenc_name }}"
                  entity_qualifier: "userentity-{{ _uenc_name }}"
                  caption: "{{ _uenc_caption }}"
                  created_id: "{{ _uenc_id }}"
                  caller_token: "{{ _uent_caller_token }}"
            - stop: userentities_create done
              response_variable: final_response

        # mode=userentities_delete
        - if: "{{ mode_norm == 'userentities_delete' }}"
          then:
            - variables:
                _uend_id: "{{ userentity_id | default(none) }}"
            - if: "{{ _uend_id is none }}"
              then:
                - variables:
                    final_response:
                      status: error
                      case: userentities_delete
                      message: "userentity_id is required. Get IDs via mode=userentities_list."
                      caller_token: "{{ _uent_caller_token }}"
                - stop: userentities_delete missing id
                  response_variable: final_response
            - if: "{{ not (confirm_action | default(false) | bool) }}"
              then:
                - variables:
                    final_response:
                      status: preview
                      case: userentities_delete
                      userentity_id: "{{ _uend_id }}"
                      message: >-
                        CAUTION: deleting a userentity removes ALL userobjects and stored field
                        values under it. IRREVERSIBLE. Pass confirm_action=true to proceed
                        with id={{ _uend_id }}.
                      caller_token: "{{ _uent_caller_token }}"
                - stop: userentities_delete preview
                  response_variable: final_response
            - action: script.zen_sutra_grocy
              data:
                action_type: delete
                endpoint: "/objects/userentities/{{ _uend_id }}"
                payload: "{}"
              response_variable: _uend_raw
              continue_on_error: true
            - variables:
                _uend_http: >-
                  {{ _uend_raw['result']['status'] | int(0)
                     if _uend_raw is mapping and 'result' in _uend_raw else 0 }}
                _uend_ok: "{{ _uend_http in [200, 204] }}"
            - variables:
                final_response:
                  status: "{{ 'ok' if _uend_ok else 'error' }}"
                  case: userentities_delete
                  userentity_id: "{{ _uend_id }}"
                  deleted: "{{ _uend_ok }}"
                  http_status: "{{ _uend_http }}"
                  caller_token: "{{ _uent_caller_token }}"
            - stop: userentities_delete done
              response_variable: final_response

        # mode=userobjects_list
        - if: "{{ mode_norm == 'userobjects_list' }}"
          then:
            - action: script.zen_sutra_grocy
              data:
                action_type: read
                endpoint: /objects/userobjects
                perPage: 200
              response_variable: _uobjl_raw
              continue_on_error: true
            - variables:
                _uobjl_all: >-
                  {{ _uobjl_raw['result']['content']
                     if _uobjl_raw is mapping and 'result' in _uobjl_raw
                        and _uobjl_raw['result']['content'] is sequence
                     else [] }}
                _uobjl_ue_id: "{{ userentity_id | default(none) }}"
            - variables:
                _uobjl_filtered: >-
                  {{ _uobjl_all | selectattr('userentity_id','equalto',_uobjl_ue_id | int)
                     | list if _uobjl_ue_id is not none else _uobjl_all }}
            - variables:
                final_response:
                  status: ok
                  case: userobjects_list
                  userentity_id_filter: "{{ _uobjl_ue_id }}"
                  count: "{{ _uobjl_filtered | length }}"
                  userobjects: "{{ _uobjl_filtered }}"
                  caller_token: "{{ _uent_caller_token }}"
            - stop: userobjects_list done
              response_variable: final_response

        # mode=userobjects_create
        - if: "{{ mode_norm == 'userobjects_create' }}"
          then:
            - variables:
                _uobjc_ue_id: "{{ userentity_id | default(none) }}"
            - if: "{{ _uobjc_ue_id is none }}"
              then:
                - variables:
                    final_response:
                      status: error
                      case: userobjects_create
                      message: "userentity_id is required."
                      caller_token: "{{ _uent_caller_token }}"
                - stop: userobjects_create missing id
                  response_variable: final_response
            - action: script.zen_sutra_grocy
              data:
                action_type: create
                endpoint: /objects/userobjects
                payload: "{{ {'userentity_id': _uobjc_ue_id | int} | tojson }}"
              response_variable: _uobjc_raw
              continue_on_error: true
            - variables:
                _uobjc_content: >-
                  {{ _uobjc_raw['result']['content']
                     if _uobjc_raw is mapping and 'result' in _uobjc_raw
                     else none }}
                _uobjc_id: >-
                  {{ _uobjc_content.get('created_object_id', none) | int(none)
                     if _uobjc_content is mapping else none }}
            - variables:
                final_response:
                  status: "{{ 'ok' if _uobjc_id is not none else 'error' }}"
                  case: userobjects_create
                  userentity_id: "{{ _uobjc_ue_id }}"
                  created_id: "{{ _uobjc_id }}"
                  note: "Use userentity_values_set to write field values after creation."
                  caller_token: "{{ _uent_caller_token }}"
            - stop: userobjects_create done
              response_variable: final_response

        # mode=userobjects_delete
        - if: "{{ mode_norm == 'userobjects_delete' }}"
          then:
            - variables:
                _uobjd_id: "{{ userobject_id | default(none) }}"
            - if: "{{ _uobjd_id is none }}"
              then:
                - variables:
                    final_response:
                      status: error
                      case: userobjects_delete
                      message: "userobject_id is required."
                      caller_token: "{{ _uent_caller_token }}"
                - stop: userobjects_delete missing id
                  response_variable: final_response
            - if: "{{ not (confirm_action | default(false) | bool) }}"
              then:
                - variables:
                    final_response:
                      status: preview
                      case: userobjects_delete
                      userobject_id: "{{ _uobjd_id }}"
                      message: >-
                        Pass confirm_action=true to delete userobject id={{ _uobjd_id }}.
                        All userfield values for this object will be removed.
                      caller_token: "{{ _uent_caller_token }}"
                - stop: userobjects_delete preview
                  response_variable: final_response
            - action: script.zen_sutra_grocy
              data:
                action_type: delete
                endpoint: "/objects/userobjects/{{ _uobjd_id }}"
                payload: "{}"
              response_variable: _uobjd_raw
              continue_on_error: true
            - variables:
                _uobjd_http: >-
                  {{ _uobjd_raw['result']['status'] | int(0)
                     if _uobjd_raw is mapping and 'result' in _uobjd_raw else 0 }}
                _uobjd_ok: "{{ _uobjd_http in [200, 204] }}"
            - variables:
                final_response:
                  status: "{{ 'ok' if _uobjd_ok else 'error' }}"
                  case: userobjects_delete
                  userobject_id: "{{ _uobjd_id }}"
                  deleted: "{{ _uobjd_ok }}"
                  http_status: "{{ _uobjd_http }}"
                  caller_token: "{{ _uent_caller_token }}"
            - stop: userobjects_delete done
              response_variable: final_response

        # mode=userentity_values_get
        - if: "{{ mode_norm == 'userentity_values_get' }}"
          then:
            - variables:
                _uevg_entity: "{{ (entity | default('')) | trim }}"
                _uevg_obj_id: "{{ userobject_id | default(none) }}"
            - if: "{{ _uevg_entity == '' or _uevg_obj_id is none }}"
              then:
                - variables:
                    final_response:
                      status: error
                      case: userentity_values_get
                      message: "entity (userentity-{name} form) and userobject_id are required."
                      caller_token: "{{ _uent_caller_token }}"
                - stop: userentity_values_get missing fields
                  response_variable: final_response
            - action: script.zen_sutra_grocy
              data:
                action_type: read
                endpoint: "/userfields/{{ _uevg_entity }}/{{ _uevg_obj_id }}"
              response_variable: _uevg_raw
              continue_on_error: true
            - variables:
                _uevg_content: >-
                  {{ _uevg_raw['result']['content']
                     if _uevg_raw is mapping and 'result' in _uevg_raw
                        and _uevg_raw['result']['content'] is mapping
                     else {} }}
            - variables:
                final_response:
                  status: ok
                  case: userentity_values_get
                  entity: "{{ _uevg_entity }}"
                  userobject_id: "{{ _uevg_obj_id }}"
                  values: "{{ _uevg_content }}"
                  caller_token: "{{ _uent_caller_token }}"
            - stop: userentity_values_get done
              response_variable: final_response

        # mode=userentity_values_set
        - if: "{{ mode_norm == 'userentity_values_set' }}"
          then:
            - variables:
                _uevs_entity: "{{ (entity | default('')) | trim }}"
                _uevs_obj_id: "{{ userobject_id | default(none) }}"
                _uevs_vals_raw: "{{ values_json | default('') | trim }}"
            - if: "{{ _uevs_entity == '' or _uevs_obj_id is none or _uevs_vals_raw == '' }}"
              then:
                - variables:
                    final_response:
                      status: error
                      case: userentity_values_set
                      message: "entity (userentity-{name} form), userobject_id, and values_json are all required."
                      caller_token: "{{ _uent_caller_token }}"
                - stop: userentity_values_set missing fields
                  response_variable: final_response
            - variables:
                _uevs_parsed: >-
                  {{ _uevs_vals_raw if _uevs_vals_raw is mapping
                     else (_uevs_vals_raw | from_json(none) if _uevs_vals_raw | string | trim not in ['', 'none', 'null'] else none) }}
            - variables:
                _uevs_payload: >-
                  {{ _uevs_parsed | tojson if _uevs_parsed is mapping else none }}
            - if: "{{ _uevs_payload is none }}"
              then:
                - variables:
                    final_response:
                      status: error
                      case: userentity_values_set
                      message: "values_json must be a valid JSON object (dict)."
                      caller_token: "{{ _uent_caller_token }}"
                - stop: userentity_values_set invalid json
                  response_variable: final_response
            - action: script.zen_sutra_grocy
              data:
                action_type: update
                endpoint: "/userfields/{{ _uevs_entity }}/{{ _uevs_obj_id }}"
                payload: "{{ _uevs_payload }}"
              response_variable: _uevs_raw
              continue_on_error: true
            - variables:
                _uevs_http: >-
                  {{ _uevs_raw['result']['status'] | int(0)
                     if _uevs_raw is mapping and 'result' in _uevs_raw else 0 }}
                _uevs_ok: "{{ _uevs_http in [200, 204] }}"
            - variables:
                final_response:
                  status: "{{ 'ok' if _uevs_ok else 'error' }}"
                  case: userentity_values_set
                  entity: "{{ _uevs_entity }}"
                  userobject_id: "{{ _uevs_obj_id }}"
                  written: "{{ _uevs_ok }}"
                  http_status: "{{ _uevs_http }}"
                  caller_token: "{{ _uent_caller_token }}"
            - stop: userentity_values_set done
              response_variable: final_response

    # mode=product_refs_get
    - if: "{{ mode_norm == 'product_refs_get' }}"
      then:
        - if: "{{ product_id_resolved is none }}"
          then:
            - variables:
                final_response:
                  status: error
                  mode: product_refs_get
                  message: 'Product not found — pass item=<name> or product_id=<id>'
                  caller_token: "{{ caller_token | default('') }}"
            - stop: product_refs_get not found
              response_variable: final_response
        - action: script.zen_sutra_grocy
          response_variable: _prg_raw
          continue_on_error: true
          data:
            action_type: read
            endpoint: "/userfields/products/{{ product_id_resolved }}"
        - variables:
            _prg_uf: >-
              {{ _prg_raw.get('result', {}).get('content', {})
                 if _prg_raw is mapping and _prg_raw.get('status') == 'success'
                 else {} }}
        - variables:
            _prg_ticket_raw: "{{ _prg_uf.get('zen_ticket_refs', '[]') if _prg_uf is mapping else '[]' }}"
            _prg_doc_raw: "{{ _prg_uf.get('zen_doc_refs', '[]') if _prg_uf is mapping else '[]' }}"
        - variables:
            _prg_tickets: >-
              {%- set r = _prg_ticket_raw -%}
              {{ (r | from_json) if r is string and r | trim not in ('', 'None') else (r if r is sequence else []) }}
            _prg_docs: >-
              {%- set r = _prg_doc_raw -%}
              {{ (r | from_json) if r is string and r | trim not in ('', 'None') else (r if r is sequence else []) }}
        - variables:
