              \     \"location_constraints\": \"Grocy enforces location rules. This
              tool mirrors them exactly.\",\n      \"irreversible_actions\": \"Destructive
              operations (merge, consume, adjust) are guarded deliberately.\"\n    },\n\n
              \   \"examples\": {\n      \"check_inventory\": \"{'mode':'stock_check_item','item':'coffee'}\",\n
              \     \"where_is_item\": \"{'mode':'stock_where_is_item','item':'coffee'}\",\n
              \     \"list_items_in_location\": \"{'mode':'stock_list_by_location','location':'Pantry'}\",\n
              \     \"purchase_existing_product\": \"{'mode':'stock_add_purchase','item':'coffee','amount':1,'location':'Pantry'}\",\n
              \     \"create_and_purchase_new_product\": \"{'mode':'stock_buy_product','item':'chickens','amount':87000,'location':'Garage','note':'no
              questions'}\",\n      \"consume_item\": \"{'mode':'stock_consume','item':'coffee','amount':1}\",\n
              \     \"transfer_item\": \"{'mode':'stock_transfer_location','item':'coffee','location':'Pantry','to_location':'Kitchen'}\",\n
              \     \"complete_task\": \"{'mode':'tasks_complete','item':'Take out trash'}\",\n
              \     \"execute_chore\": \"{'mode':'chores_execute','item':'Clean litter
              box'}\",\n      \"set_location_metadata\": \"{'mode':'locations_metadata_set','location':'Coffee
              Drawer','parent_location':'Kitchen','area_id':'kitchen','location_subclass':'drawer','placement_priority':10}\",\n
              \     \"list_units\": \"{'mode':'units_list'}\",\n      \"add_unit\":
              \"{'mode':'units_add','unit':'can','note':'Standard grocery can'}\",\n
              \     \"find_unit\": \"{'mode':'units_find','unit':'can'}\"\n    },\n\n
              \   \"final_note\": [\n      \"Strict by design — prevents silent data corruption.\",\n      \"Names resolve before writes. Ambiguous matches stop execution.\",\n      \"Errors coach you back — no need to re-read help to fix a mistake.\"\n    ]\n  }\n}}"
        - variables:
            help_json: "{{ help_json | combine({'cases': cases}) }}"
        - variables:
            room_integration_block:
              description: "Grocy locations mirror your home structure. Each RM room (zen_dojotools_room_manager) has grocy_location_id pointing to its Grocy anchor. Bidirectional: RM→Grocy via grocy_location_id; Grocy→RM via homeassistant_area userfield."
              home_tree: "Your Home (root) → Wing/Floor/Zone (IDs vary) → Rooms → Containers → Products"
              place_object_pattern:
                - "1. zen_dojotools_room_manager mode=get area=X → read domain_routing.grocy for anchor ID"
                - "2. locations_find(parent_location_id=anchor) → all containers in room (add location= to name-filter)"
                - "3. locations_add(location=name, parent_location_id=anchor) if container missing"
                - "4. catalog_find_product(item=name) → verify exists; create if needed"
                - "5. stock_buy_product or stock_inventory_adjust to register item at container"
              find_object_pattern:
                - "stock_where_is_item(item=name) → returns location_id of each stock entry"
                - "location.userfields.homeassistant_area = RM area_id; use locations_get_by_area(homeassistant_area_id=area) for reverse anchor lookup"
                - "stock_list_by_location(location_id=anchor) → all items in a room"
              key_room_anchors: "IDs are household-specific. Discover yours: locations_list(per_page=200)."
              safety_equipment: "safety[] on RM rooms has grocy_location_id pinning each item to a specific Grocy container within that room."
        - variables:
            help_json: "{{ help_json | combine({'room_integration': room_integration_block}) }}"
        - variables:
            scenarios_block:
              primitives:
                stock_lifecycle:
                  acquire: "stock_buy_product or stock_add_purchase — put sealed units into storage location"
                  open_into_service: "stock_open_item — move sealed unit to default_consume_location, stamp opened_date and best_before = today + due_days_after_open"
                  consume: "stock_consume or chores_execute — remove the in-service unit (it is used up)"
                  transfer: "stock_transfer_location — move units between locations, FIFO by stock entry age"
                product_configuration:
                  default_purchase_location: "location_id on product — where stock_buy_product and stock_add_purchase land by default"
                  default_consume_location: "update_product_meta to_location_id=X — where chores_execute and stock_consume pull from"
                  move_on_open: "update_product_meta move_on_open=true — stock_open_item auto-moves unit to default_consume_location on open"
                  due_days_after_open: "update_product_meta due_days_after_open=N — best_before = open_date + N days, stamped at open time"
                  min_stock_amount: "update_product_meta amount=N — restock warning threshold shown in stock overview and volatile reports"
                location_model:
                  storage_location: "where sealed/spare units live (pantry shelf, cabinet, bin)"
                  install_location: "set as default_consume_location — where the in-service unit lives (slot, tank, tray, dock)"
                  naming: "parent asset name + slot role, e.g. 'Kitchen Refrigerator - Water Filter Slot'"
                chores:
                  create: "chores_add item=name period_days=N product_id=X — recurring task linked to a consumable product"
                  execute: "chores_execute — consumes 1 unit from default_consume_location, stamps today as last-done, next_due = today + period_days"
                  tag: "chores_tag homeassistant_area_id=area — surfaces the chore in room_brief and chores_by_area queries"
              scenarios:
                installable_consumable:
                  description: >-
                    Generic model for any consumable that installs into a slot and needs periodic
                    replacement — filters, cartridges, bulbs, batteries, bags, pads.
                    One product type, two locations (install slot + spare storage), one chore.
                  decisions:
                    what_is_the_product: "Name it, brand it, SKU it. One product = one consumable type. Use stock_buy_product to create and stock in one call."
                    where_does_it_install: "Create a location for the slot (e.g. 'Fridge - Water Filter Slot'), parent under the asset. Set this as default_consume_location via update_product_meta to_location_id."
                    where_are_spares_stored: "Create a location for spare stock (e.g. 'Pantry - Water Filters'), parent under the nearest cabinet or pantry. This is the product's default purchase location."
                    how_many_to_keep: "Set min_stock_amount = restock alert threshold (e.g. 1 spare). Aim to keep preferred level (e.g. 2 spares) at the storage location."
                    how_long_does_it_last: "Set due_days_after_open = service life in days (e.g. 180 for a 6-month filter). Grocy stamps this as best_before on open."
                  setup_sequence:
                    - "1. locations_add — install slot, parent under the asset"
                    - "2. locations_add — spare storage, parent under nearby cabinet or pantry"
                    - "3. stock_buy_product amount=N location_id=<storage> — create product and stock initial spares"
                    - "4. update_product_meta product_id=X to_location_id=<slot> move_on_open=true due_days_after_open=N"
                    - "5. chores_add item='Replace X' product_id=X period_days=N"
                    - "6. chores_tag homeassistant_area_id=area — enables room_brief and chores_by_area discovery"
                    - "7. stock_open_item product_id=X — put first spare into service: moves to slot, stamps due date"
                    - "8. stock_add_purchase amount=N location_id=<storage> — top up spares to preferred level if needed"
                  replacement_cycle:
                    trigger: "Chore due date reached, or spare count at or below min_stock_amount"
                    step_1: "chores_execute chore_id=X — consumes 1 unit from install slot, stamps today, calculates next_due = today + period_days"
                    step_2: "stock_open_item product_id=X — opens next spare: Grocy moves it from storage to slot, stamps best_before = today + due_days_after_open"
                    step_3: "stock_check_item product_id=X — verify spare count at storage location"
                    step_4: "shopping_add_product product_id=X — queue restock if spare count <= min_stock_amount"
                    fifo_note: "stock_open_item always opens the oldest sealed unit first (FIFO by stock entry creation date)"
                  restock_cycle:
                    trigger: "Spare count at or below min_stock_amount after a replacement"
                    step_1: "shopping_add_product product_id=X — add to Grocy shopping list"
                    step_2: "stock_add_purchase amount=N location_id=<storage> — receive purchased spares into storage"
                  stock_accounting:
                    total_physical: "1 installed at slot + N spares at storage = total product stock"
                    installed_unit: "1 unit at install/slot location — status: opened, best_before = replacement due date"
                    spare_units: "N units at storage location — status: sealed, awaiting service"
                    how_to_see_breakdown: "stock_entries_for_item product_id=X — shows each unit's location_id, opened_date, and best_before"
        - variables:
            help_json: "{{ help_json | combine({'scenarios': scenarios_block}) }}"
        - variables:
            agent_superpowers_block:
              you_own: >-
                Full household ERP — stock levels, shopping lists, chores, locations, product catalog,
                recipes, batteries, asset registration, userfields, userentities. You are the ground
                truth for what exists, where it lives, and how much is left.
              boundary: >-
                Physical item circulation (loan/return/browse books/games/music/video/art) belongs to
                zen_dojotools_library section=catalog. Inventory owns the Grocy product (the Work —
                what something IS); Library owns the catalog_item userobject (the Item — the physical
                copy on a shelf). Scan a barcode → Inventory creates the product → Library catalogs
                the copy. Never try to do loan/return through Inventory directly.
              location_superpowers: >-
                locations_reparent_bulk now inherits homeassistant_area from parent automatically
                and is idempotent — run it again on an already-correct location and it's a safe no-op.
                This is the stamping mechanism that makes room-aware queries (stock_area_summary,
                chores_by_area, library area_id lens) light up for child locations.
              quickstart: "configure a shelf → locations_metadata_set + catalog_class. Tag a machine → provision_bom. Find what's in a room → room_brief area=X. Queue shopping → shopping_add_missing."
              player_setup:
                what: >-
                  Register any physical playback device or space as a Lens player. The Lens bus
                  will surface it as a player_hint on any area_id query — agents see what can play
                  what in each room without asking. Two userfields do it all: media_role + media_formats.
                how: >-
                  1. Create or find the Grocy product for the device/space.
                  2. Set media_role (pick from role_catalog below).
                  3. Set media_formats (CSV of what physical media it accepts).
                  4. Set the product default location to a Grocy location with homeassistant_area stamped.
                  5. If the device has an HA entity, set homeassistant_entity_id on the product — makes dumb=false so agents can control it (turn on lamp, wake Xbox, etc).
                  6. Done — Lens dispatcher fans out automatically on every area_id query.
                role_catalog:
                  turntable: {plays: [music_recording], formats: [vinyl, 7-inch, 12-inch], note: Dumb unless connected to smart amp. Set homeassistant_entity_id to amp/receiver entity if available.}
                  cassette_deck: {plays: [music_recording], formats: [cassette], note: Almost always dumb. Still surfaces so agent knows the room has tape capability.}
                  cd_player: {plays: [music_recording], formats: [cd], note: Dumb or smart depending on integration. Set entity_id if it has one.}
                  dvd_player: {plays: [video], formats: [dvd, cd], note: Dumb standalone. For smart players use game_console or digital_player.}
                  blu_ray_player: {plays: [video], formats: [blu_ray, dvd, cd], note: Dumb standalone. Upscaling players count here.}
                  projector: {plays: [video], formats: [digital, hdmi], note: "Set entity_id if smart (Epson/BenQ HA integrations). media_formats=digital."}
                  e_reader: {plays: [book, periodical], formats: [digital], note: "Kindle/Kobo as a product. Set entity_id if HA-integrated. Tells agent a digital reader is in the room."}
                  radio: {plays: [music_recording], formats: [am_fm, digital], note: "Smart radios may have HA entity. media_formats=am_fm or digital."}
                  digital_player: {plays: [music_recording, video, book, game], formats: [digital], note: "Catch-all for smart streaming devices (Chromecast/Fire Stick/Apple TV) not better described by another role. Prefer game_console for consoles."}
                  game_console: {plays: [game, video, music_recording], formats: [xbox_one, xbox_360, ps5, ps4, switch, blu_ray, dvd, cd, digital], note: "Resolves as disc player AND game player. Set homeassistant_entity_id to the HA media_player entity (Xbox integration). Most powerful multi-role player."}
                  reading_nook: {plays: [book, periodical], formats: [physical, digital], note: "A SPACE not a device. Create as a Grocy product for the chair/nook/corner. Set homeassistant_entity_id to the reading lamp if smart — agent turns it on when delivering a book. Lives next to the shelf; agent connects the dots."}
                formats_reference: "vinyl, cassette, cd, dvd, blu_ray, digital, am_fm, hdmi, xbox_one, xbox_360, ps5, ps4, switch, physical — use physical for any dumb format not listed"
        - variables:
            help_json: "{{ help_json | combine({'agent_superpowers': agent_superpowers_block}) }}"
        - variables:
            suggested_constructs_block:
              personal_inventory:
                description: >-
                  Each person (human or AI persona) gets a canonical personal inventory location in Grocy.
                  A virtual parent location called People (ID 550) groups all person-root locations.
                  Person-root locations are children of People and represent that person's physical
                  or conceptual inventory space (shelves, bins, desk, bag, etc.).
                setup:
                  - "Create parent: locations_add location='People' (done — ID 550)"
                  - "Create person root: locations_add location='<Member>\\'s Inventory' parent_location_id=<people_id>"
                  - "Wire to profile: zen_dojotools_profile_editor mode=write inventory_root=<location_id>"
                  - "Wire AI persona: zen_dojotools_persona_editor mode=write inventory_root=<location_id>"
                live_roots:
                  - "<Member A> → location <id> (<Member A>'s Inventory, parent: People <people_id>)"
                  - "<Member B> → location <id> (<Member B>'s Inventory, parent: People <people_id>)"
                  - "<AI persona> → location <id> (<Persona>'s Inventory, parent: People <people_id>)"
                why: >-
                  Used by Library lending (checkout target), future agent workspace, and any tool that
                  needs to resolve where a person's possessions live. Profile and persona editors both
                  expose inventory_root as a first-class field — wire once, used everywhere.
              bookshelf_virtual_stack:
                description: >-
                  Physical bookcases become a virtual library by tagging parent bookcase locations with
                  homeassistant_labels=bookshelf. The Library tool (zen_dojotools_library section=books)
                  discovers all bookshelf-tagged locations and recurses their children via
                  grocy_child_location_ids — tag the parent once, the whole shelf tree joins the library.
                setup:
                  - "Tag bookcase: products_tag item='Left Twin Bookcase' ha_labels='bookshelf' (or locations_metadata_set with ha_labels)"
                  - "Tag books: products_tag item='Book Title' ha_labels='book'"
                  - "Rebuild hierarchy if needed: locations_hierarchy_rebuild"
                live_bookcases:
                  - "Left Twin (ID 109) — tag with ha_labels=bookshelf"
                  - "Right Twin (ID 110) — tag with ha_labels=bookshelf"
                discovery: >-
                  Library mode=status checks for bookshelf-tagged locations. If found but no books tagged,
                  returns onboarding suggestion. If neither exists, returns setup instructions.
              lending_library_flow:
                description: >-
                  A managed lending library built on top of personal inventory roots and bookshelf stacks.
                  Books live in bookshelf-tagged locations. Checkout moves a book to the borrower's
                  inventory root. Return moves it back to the product's default_location_id.
                checkout:
                  - "stock_transfer_location item='Book' to_location_id=<borrower inventory.root_location_id>"
                  - "products_tag item='Book' ha_labels='book,loaned'"
                  - "stock_entry_update entry_id=<id> best_before_date=<return_date> note='Loaned to {person}'"
                return_flow:
                  - "stock_transfer_location item='Book' to_location_id=<product default_location_id>"
                  - "products_tag item='Book' ha_labels='book'  (drop loaned tag)"
                overdue_detection: >-
                  Native Grocy volatile report (stock_list_volatile) surfaces loaned books automatically
                  when best_before_date < today — no custom query needed.
                entry_point: "zen_dojotools_library section=books — modes: status | browse | checkout | return | overdue | setup"
        - variables:
            help_json: "{{ help_json | combine({'suggested_constructs': suggested_constructs_block}) }}"
        - variables:
            systems_block:
              perishable_storage:
                overview: >-
                  A classification system that tags Grocy locations as perishable storage (fridges,
                  pantries, freezers) and enforces expiry tracking discipline on the products stored
                  in them. Two mechanisms: a real-time coach (fires when buying/moving stock) and an
                  audit (scans all live stock for violations). Together they catch violations as they
                  happen and find ones that already exist.
                catalog_class_values:
                  perishable_storage: >-
                    Tag on a Grocy location. Marks it as a zone where perishable goods live.
                    Triggers coaching when a never-expires product (default_best_before_days=-1) is
                    purchased or moved into this location. Children of this location inherit the flag
                    automatically via a one-level parent walk — tag the fridge, all fridge shelves
                    and drawers are implicitly covered without manual tagging.
                  non_perishable: >-
                    Explicit override. Place on a sub-location inside a perishable parent to suppress
                    the inheritance. Use for zones that hold non-food items inside a perishable
                    container — fridge water filter slots, ice maker, consumables bin, etc. Short-
                    circuits before the parent walk so the check is cheap. Set via
                    locations_metadata_set catalog_class=non_perishable.
                  __intake__: >-
                    Unrelated to perishable system. Marks the catalog intake staging location
                    (Kitchen Island). Drives the logistics KFC intake component.
                hierarchy_and_inheritance:
                  rule: >-
                    When coaching or audit evaluates a destination location, it checks:
                    (1) Does the location itself have catalog_class=perishable_storage? Yes → perishable.
                    (2) Does the location itself have catalog_class=non_perishable? Yes → not perishable (short-circuit).
                    (3) Does the location's grocy_parent_location_id point to a location with
                        catalog_class=perishable_storage? Yes → perishable (inherited).
                    (4) Otherwise → not perishable.
                  depth: One level only. Grandchild locations do not inherit from grandparent.
                  what_to_tag: >-
                    Tag the root containers — Kitchen Refrigerator (3), Kitchen Freezer (4),
                    Garage - Freezer (16), Pantry (97), North Wall Pantry (437). Sub-locations
                    inherit automatically. Only override with non_perishable where needed.
                coaching:
                  when_it_fires: >-
                    On stock_buy_product, stock_add_purchase, or stock_transfer_location when ALL:
                    (1) the product has default_best_before_days=-1 (never expires), AND
                    (2) the destination location resolves as perishable_storage (direct or inherited).
                  what_it_returns: >-
                    A coaching[] list on the response with a message recommending the agent either
                    set a best_before_date on this stock entry or run update_product_meta
                    best_before_days=N to enable expiry tracking for the product going forward.
                  cost: >-
                    Lazy — only fetches location userfields when the product is already -1.
                    Zero overhead on normal (non-never-expires) purchases.
                audit:
                  mode: stock_audit_perishable
                  what_it_does: >-
                    Paginated cross-reference: loads all locations, all raw stock entries, and all
                    never-expires products. Builds perishable_location_ids set from tagged locations
                    plus their children (excluding non_perishable children). Returns every stock entry
                    where a never-expires product sits in a perishable location as a violation.
                  response_shape:
                    perishable_location_ids: List of Grocy location IDs currently classified as perishable
                    never_expires_product_count: How many products in catalog have default_best_before_days=-1
                    violations.count: Number of never-expires products currently stocked in perishable locations
                    violations.items: >-
                      Each item has product_id, product_name, location_id, location_name, amount,
                      best_before_date, and a fix command ready to copy-paste.
                  how_to_act_on_violations: >-
                    For each violation, decide: is this product genuinely perishable (food in a fridge)?
                    → run the fix command: update_product_meta item='X' best_before_days=N where N
                    comes from the best_before_days_defaults table in the cases.stock_audit_perishable
                    help entry. Or is it a non-food item in a perishable zone (filter, battery, etc.)?
                    → either set best_before_days=-1 is already correct (leave it) or tag its location
                    non_perishable to silence it permanently.
                  known_acknowledged_violations:
                    - "Chemex Filter Natural Squares (product 182, Pantry) — paper filters, legitimately -1. Acknowledged non-issue."
                management_workflow:
                  tag_a_new_perishable_location: >-
                    locations_metadata_set location='Name' catalog_class=perishable_storage
                    Children inherit immediately — no need to tag sub-locations unless overriding.
                  suppress_a_sub_location: >-
                    locations_metadata_set location='Name' catalog_class=non_perishable
                    Use for non-food sub-zones inside a tagged parent (fridge slots, consumables bins).
                  fix_a_violation: >-
                    update_product_meta item='Product Name' best_before_days=N
                    This enables expiry tracking for all future purchases of that product.
                    Does not retroactively set best_before on existing stock entries — those keep
                    best_before_date=2999-12-31 (Grocy's never-expires sentinel). Update them
                    individually with stock_entry_update if needed.
                  run_the_audit: "zen_dojotools_inventory mode=stock_audit_perishable"
                current_tagged_locations:
                  directly_tagged:
                    - "Kitchen Refrigerator (3) — catalog_class=perishable_storage"
                    - "Kitchen Freezer (4) — catalog_class=perishable_storage"
                    - "Garage - Freezer (16) — catalog_class=perishable_storage"
                    - "Pantry (97) — catalog_class=perishable_storage"
                    - "North Wall Pantry (437) — catalog_class=perishable_storage"
                  non_perishable_overrides:
                    - "Ice Maker (439) — inside Kitchen Refrigerator"
                    - "Water Dispenser (440) — inside Kitchen Refrigerator"
                    - "Water Filter Slot (441) — inside Kitchen Refrigerator"
                    - "Fresh Air Filter Slot (442) — inside Kitchen Refrigerator"
                    - "Consumables (443) — inside Kitchen Refrigerator"
                    - "Water Filters (444) — inside Kitchen Refrigerator"
                    - "Fresh Air Filters (445) — inside Kitchen Refrigerator"
                    - "Garage Freezer (426) — ghost location, immortal in Grocy DB, tagged non_perishable to suppress"
