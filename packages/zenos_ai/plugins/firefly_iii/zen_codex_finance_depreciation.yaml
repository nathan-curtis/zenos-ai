###############################################################################
# ZenOS-AI Finance Codex: Household Asset Depreciation
# Version: 1.0.0
#
# Scripts:
#   zen_codex_finance_depreciation  ← Optional domain logic (codex tier)
#   zen_stack_depreciation          ← Lens Bus stack provider (auto-registered)
#
# Codex Tier Contract:
#   Parent tool: zen_dojotools_finance
#   Registered via: codex_registry drawer in household cabinet
#   Bootstrap: zen_dojotools_finance mode=run case=bootstrap_codices
#
# Requires: Grocy (asset brain) + Firefly III (money story)
# Cabinet footprint: ZERO — no asset data in cabinets. Schedule calculated on
#   demand. Post history from Firefly idempotency tags.
#
# SETUP:
#   1. Run zen_dojotools_finance mode=run case=depreciable_asset_firefly_setup
#      (creates Grocy depreciable_asset userentity schema + Firefly categories)
#   2. See mode=help for full workflow sequence.
#
# Codex Tickets: #10207 (epic), #10208-#10215 (T1-T8)
#
# v1.0.0 (Zen pull, 2026-07-04 — hardening, no behavior change on valid input):
#   guarded placed_in_service_date slice against a null value; int() casts on
#   last_depreciation_period_posted year/month default to 0 instead of raising
#   on malformed input; business-use split math (_t16_biz_*) uses float(0)
#   consistently instead of bare float() at three call sites.
#   Sanity-checked live (2026-07-04): config check clean, reload succeeded,
#   book_value run against an all-null-field asset (worst case for these
#   guards) — no crash, correctly zeroed response. Business-use split guard
#   verified by code inspection only — no live asset currently has posting
#   schedule data to exercise that path against.
#
# v1.0.1 (Zen pull, 2026-07-04): _setup_canonical_names was missing the 8
#   tax/allocation userfields (tax_context, owner_entity, paid_by_entity,
#   reimbursement_status, allocation_method, business_area_anchor,
#   evidence_refs, tax_review_status) that this codex already reads/writes
#   elsewhere in the file but that Grocy's grocy.yaml only just started
#   deploying — depreciable_asset_firefly_setup would have silently failed
#   to flag them as missing. Does NOT cover the separate asset_allocation
#   userentity, which this setup mode does not check at all (pre-existing,
#   out of scope here — flag separately if that entity needs setup coverage).
#
# NOTE on `compensate` (shared across all codices via zen_dojotools_finance):
# the idempotency-key-only reversal path (no firefly_transaction_id given) is
# hardcoded to THIS codex's own domain — it searches item="Depreciation" and
# matches key text in notes/description. This is intentional, not a bug: other
# codices (e.g. COGS) store their idempotency key in tags, not notes, and post
# against a different account entirely, so this search would silently look in
# the wrong place. A guard at the top of the compensate mode below detects
# non-depreciation keys (e.g. grocy_stock_entry:*) with no txn id and returns
# an explicit error instead of a misleading "not found" — see that guard for
# the exact check.
###############################################################################

script:

  ###########################################################################
  # zen_codex_finance_depreciation
  # Domain logic for household asset depreciation tracking.
  # NOT MCP-exposed — called by zen_dojotools_finance catch-all dispatch.
  ###########################################################################
  zen_codex_finance_depreciation:
    alias: Zen Codex Finance — Depreciation
    description: >-
      Household asset depreciation codex (v1.0.0). Grocy = asset brain.
      Firefly = money story. Not MCP-exposed — call via zen_dojotools_finance.
      Modes: tool_manifest, health, help, register, unregister, compensate,
      depreciable_asset_create, depreciable_asset_get, depreciable_asset_update,
      depreciable_asset_list, depreciable_asset_calculate_schedule,
      depreciable_asset_book_value, depreciable_asset_replacement_plan,
      depreciable_asset_firefly_setup, depreciable_asset_post_depreciation_period,
      depreciable_asset_dispose, depreciable_asset_report,
      asset_allocation_create, asset_allocation_get,
      asset_allocation_list, asset_allocation_update, cpa_summary,
      depreciable_asset_suggest_business_use.
    mode: parallel
    fields:
      mode:
        description: >-
          Operation to perform. tool_manifest|health|help|register|unregister|
          compensate|depreciable_asset_create|depreciable_asset_get|
          depreciable_asset_update|depreciable_asset_list|
          depreciable_asset_calculate_schedule|depreciable_asset_book_value|
          depreciable_asset_replacement_plan|depreciable_asset_firefly_setup|
          depreciable_asset_post_depreciation_period|depreciable_asset_dispose|
          depreciable_asset_report|asset_allocation_create|asset_allocation_get|
          asset_allocation_list|asset_allocation_update|cpa_summary|
          depreciable_asset_suggest_business_use
        selector:
          text:
      asset_id:
        description: Grocy userobject ID (integer) or asset name for name-based lookup
        selector:
          text:
      asset_data:
        description: JSON dict of asset fields for create/update
        selector:
          text:
            multiline: true
      period:
        description: Depreciation period YYYY-MM for post_depreciation_period
        selector:
          text:
      posting_mode:
        description: report_only (default, safe preview) or summary_post (writes to Firefly)
        selector:
          select:
            options: [report_only, summary_post]
      confirm:
        description: Explicit commit gate for write operations (default false)
        selector:
          boolean:
        default: false
      dry_run:
        description: Validate + preview without writing anything (overrides confirm)
        selector:
          boolean:
        default: false
      idempotency_key:
        description: Caller-supplied idempotency key; codex derives one if absent
        selector:
          text:
      project_id:
        description: Project ID filter for depreciable_asset_report_by_project
        selector:
          text:
      room_anchor:
        description: Room anchor filter for depreciable_asset_report_by_room
        selector:
          text:
      total_home_sqft_override:
        description: Override total home area (sqft) for business-use % calc — bypasses room-by-room sum when some rooms lack measurements
        selector:
          number:
            min: 1
            max: 100000
            step: 0.01
            mode: box
      firefly_transaction_id:
        description: Firefly transaction ID — used by compensate when tag search is unreliable (e.g. pre-fix transactions with colon tags)
        selector:
          text:
      caller:
        description: Caller identity for capability check (default zen_dojotools_finance)
        selector:
          text:
      audit_note:
        description: Free-text note appended to Grocy notes and Firefly transaction notes
        selector:
          text:
      include_evidence:
        description: Resolve evidence_refs into evidence items inline (book_value only)
        selector:
          boolean:
        default: false
      caller_token:
        description: Opaque correlation token
        selector:
          text:

    sequence:

    # ── Input normalization ────────────────────────────────────────────────
    - variables:
        _mode:          "{{ mode | default('help') | string | trim | lower }}"
        _asset_id_raw:  "{{ asset_id | default('') | string | trim }}"
        _project_id:    "{{ project_id | default('') | string | trim }}"
        _room_anchor:   "{{ room_anchor | default('') | string | trim | lower }}"
        _posting_mode:  "{{ posting_mode | default('report_only') | string | trim | lower }}"
        _confirm:       "{{ confirm | default(false) | bool }}"
        _dry_run:       "{{ dry_run | default(false) | bool }}"
        _idem_key_in:   "{{ idempotency_key | default('') | string | trim }}"
        _ftxn_id_in:    "{{ firefly_transaction_id | default('') | string | trim }}"
        _caller:            "{{ caller | default('zen_dojotools_finance') | string | trim }}"
        _audit_note:        "{{ audit_note | default('') | string | trim }}"
        _include_evidence:  "{{ include_evidence | default(false) | bool }}"
        _caller_token:  "{{ caller_token | default('') | string | trim }}"
        _now:           "{{ now().isoformat() }}"
        _today:         "{{ now().strftime('%Y-%m-%d') }}"
        _grocy_entity:  "userentity-depreciable_asset"
        tool_name:      zen_codex_finance_depreciation
        tool_version:   1.0.0
        _allowed_callers:
          - zen_dojotools_finance
          - zen_stack_depreciation

    # ── Caller capability check (write modes only) ─────────────────────────
    - variables:
        _write_modes:
          - depreciable_asset_create
          - depreciable_asset_update
          - depreciable_asset_firefly_setup
          - depreciable_asset_post_depreciation_period
          - depreciable_asset_post_due_depreciation
          - depreciable_asset_sync_piggy_reserves
          - depreciable_asset_dispose
          - depreciable_asset_dispose_with_post
          - depreciable_asset_attach
          - asset_allocation_create
          - asset_allocation_update
          - compensate
        _caller_ok: >-
          {{ _mode not in _write_modes or _caller in _allowed_callers }}

    - if: "{{ not _caller_ok }}"
      then:
      - variables:
          final_response:
            status: unauthorized
            tool: '{{ tool_name }}'
            mode: '{{ _mode }}'
            caller: '{{ _caller }}'
            allowed_callers: '{{ _allowed_callers }}'
            message: >-
              Caller '{{ _caller }}' is not in allowed_callers for write mode '{{ _mode }}'.
              Call mode=tool_manifest to inspect the whitelist.
      - stop: unauthorized
        response_variable: final_response

    # ── Grocy URL guard ────────────────────────────────────────────────────
    - variables:
        _grocy_url: "{{ states('input_text.grocy_url') | default('') | trim }}"
        _firefly_url: "{{ states('input_text.firefly_url') | default('') | trim }}"

    - if: "{{ _grocy_url == '' and _mode not in ['tool_manifest', 'health', 'help', 'register', 'unregister'] }}"
      then:
      - variables:
          final_response:
            status: error
            tool: '{{ tool_name }}'
            mode: '{{ _mode }}'
            code: grocy_not_configured
            message: >-
              Grocy URL is not set. Configure input_text.grocy_url in HA helpers,
              then run depreciable_asset_firefly_setup to create the asset schema.
      - stop: grocy not configured
        response_variable: final_response

    # ── asset_data coercion ────────────────────────────────────────────────
    - variables:
        _asset_data_raw: "{{ asset_data | default('') }}"
        _asset_data: >-
          {%- set v = _asset_data_raw -%}
          {%- if v is mapping -%}{{ v }}
          {%- elif v is string and v | trim not in ['', 'null', 'None', '{}'] -%}
            {{ v | from_json(none) or {} }}
          {%- else -%}{}{%- endif -%}

    ###########################################################################
    # tool_manifest
    ###########################################################################
    - if: "{{ _mode == 'tool_manifest' }}"
      then:
      - variables:
          final_response:
            status: ok
            tool: '{{ tool_name }}'
            version: '{{ tool_version }}'
            display_name: Finance Depreciation
            tier: codex
            domain: finance
            feature_key: depreciation
            parent_tool: zen_dojotools_finance
            register_mode: register
            requires: [grocy, firefly]
            allowed_callers: '{{ _allowed_callers }}'
            health_check: mode=health
            modes:
              - tool_manifest
              - health
              - help
              - register
              - unregister
              - compensate
              - depreciable_asset_create
              - depreciable_asset_get
              - depreciable_asset_update
              - depreciable_asset_list
              - depreciable_asset_calculate_schedule
              - depreciable_asset_book_value
              - depreciable_asset_replacement_plan
              - depreciable_asset_firefly_setup
              - depreciable_asset_post_depreciation_period
              - depreciable_asset_dispose
              - depreciable_asset_report
              - depreciable_asset_post_due_depreciation
              - depreciable_asset_sync_piggy_reserves
              - depreciable_asset_report_by_project
              - depreciable_asset_report_by_room
              - depreciable_asset_dispose_with_post
              - depreciable_asset_reconcile_firefly
              - depreciable_asset_warranty_check
              - depreciable_asset_warranty_report
              - depreciable_asset_attach
              - depreciable_asset_attachments_get
              - asset_allocation_create
              - asset_allocation_get
              - asset_allocation_list
              - asset_allocation_update
              - cpa_summary
              - depreciable_asset_suggest_business_use
            description: >-
              Household asset depreciation codex. Tracks depreciable assets in Grocy
              (userentity-depreciable_asset). Methods: straight_line, declining_balance,
              double_declining_balance, manual_no_post. Posts to Firefly with full
              idempotency. Supports business-use allocation splits (separate HH/BIZ
              transactions), disposal with Firefly posting, schedule reconciliation,
              warranty tracking, attachment refs (Paperless/Grocy), and year-end
              cpa_summary view. All writes support dry_run, idempotency_key, audit_note,
              and compensate.
            preferred_state:
              stripe: 2
              impact: soft
      - stop: tool_manifest
        response_variable: final_response

    ###########################################################################
    # health
    ###########################################################################
    - if: "{{ _mode == 'health' }}"
      then:
      - action: script.zen_dojotools_inventory
        continue_on_error: true
        response_variable: _h_grocy_raw
        data:
          mode: userentities_list
      - variables:
          _h_grocy_ok: >-
            {{ _h_grocy_raw is mapping and _h_grocy_raw.get('status', '') == 'ok' }}
          _h_ue_exists: >-
            {%- set ues = _h_grocy_raw.get('userentities', []) if _h_grocy_raw is mapping else [] -%}
            {{ ues | selectattr('name', 'equalto', 'depreciable_asset') | list | length > 0 }}
      - action: script.zen_dojotools_finance
        continue_on_error: true
        response_variable: _h_ff_raw
        data:
          mode: run
          case: health
      - variables:
          _h_ff_ok: >-
            {{ _h_ff_raw is mapping and _h_ff_raw.get('status', '') in ['ok', 'success'] }}
          final_response:
            status: "{{ 'ok' if (_h_grocy_ok and _h_ff_ok) else 'error' }}"
            tool: '{{ tool_name }}'
            version: '{{ tool_version }}'
            mode: health
            feature_key: depreciation
            enabled: "{{ _h_grocy_ok and _h_ff_ok }}"
            grocy_ok: '{{ _h_grocy_ok }}'
            grocy_schema_deployed: '{{ _h_ue_exists }}'
            firefly_ok: '{{ _h_ff_ok }}'
            message: >-
              {%- if not _h_grocy_ok -%}Grocy unreachable.
              {%- elif not _h_ue_exists -%}Grocy reachable but depreciable_asset schema not deployed. Run depreciable_asset_firefly_setup.
              {%- elif not _h_ff_ok -%}Grocy ok but Firefly III unreachable.
              {%- else -%}Depreciation codex healthy. Grocy + Firefly both reachable.{%- endif -%}
      - stop: health
        response_variable: final_response

    ###########################################################################
    # register — upsert self into codex_registry in household cabinet
    ###########################################################################
    - if: "{{ _mode == 'register' }}"
      then:
      - variables:
          _reg_household: >-
            {{ label_entities('zen_household_cabinet')
               | select('match', 'sensor\\.') | list | first | default('') }}
      - action: script.zen_dojotools_filecabinet
        continue_on_error: true
        response_variable: _reg_read_raw
        data:
          action_type: read
          volume_entity_id:
            - "{{ _reg_household }}"
          key: codex_registry
      - variables:
          _reg_existing: >-
            {%- set raw = _reg_read_raw if _reg_read_raw is mapping else {} -%}
            {%- set val = raw.get('value', {}) -%}
            {%- set parsed = val | from_json if val is string else val -%}
            {{ parsed if parsed is mapping else {} }}
          _reg_entry:
            feature_key: depreciation
            script: zen_codex_finance_depreciation
            parent_tool: zen_dojotools_finance
            version: '{{ tool_version }}'
            tier: codex
            domain: finance
            requires: [grocy, firefly]
            modes:
              - depreciable_asset_create
              - depreciable_asset_get
              - depreciable_asset_update
              - depreciable_asset_list
              - depreciable_asset_calculate_schedule
              - depreciable_asset_book_value
              - depreciable_asset_replacement_plan
              - depreciable_asset_firefly_setup
              - depreciable_asset_post_depreciation_period
              - depreciable_asset_dispose
              - depreciable_asset_report
              - depreciable_asset_post_due_depreciation
              - depreciable_asset_sync_piggy_reserves
              - depreciable_asset_report_by_project
              - depreciable_asset_report_by_room
              - depreciable_asset_dispose_with_post
              - depreciable_asset_reconcile_firefly
              - depreciable_asset_warranty_check
              - depreciable_asset_warranty_report
              - depreciable_asset_attach
              - depreciable_asset_attachments_get
              - asset_allocation_create
              - asset_allocation_get
              - asset_allocation_list
              - asset_allocation_update
              - cpa_summary
              - depreciable_asset_suggest_business_use
            registered_at: '{{ _now }}'
            status: available
      - variables:
          _reg_new: "{{ _reg_existing | combine({'depreciation': _reg_entry}) }}"
      - action: script.zen_dojotools_filecabinet
        continue_on_error: true
        response_variable: _reg_write_raw
        data:
          action_type: upsert
          volume_entity_id:
            - "{{ _reg_household }}"
          key: codex_registry
          value: "{{ _reg_new | tojson }}"
      - variables:
          _reg_ok: "{{ _reg_write_raw is mapping and _reg_write_raw.get('status', '') == 'success' }}"
          final_response:
            status: "{{ 'success' if _reg_ok else 'error' }}"
            tool: '{{ tool_name }}'
            mode: register
            feature_key: depreciation
            message: >-
              {{ 'Depreciation codex registered in codex_registry.' if _reg_ok else
                 'Registration failed: ' ~ (_reg_write_raw.get('error', 'unknown') if _reg_write_raw is mapping else 'no response') }}
      - stop: register
        response_variable: final_response

    ###########################################################################
    # unregister
    ###########################################################################
    - if: "{{ _mode == 'unregister' }}"
      then:
      - variables:
          _ureg_household: >-
            {{ label_entities('zen_household_cabinet')
               | select('match', 'sensor\\.') | list | first | default('') }}
      - action: script.zen_dojotools_filecabinet
        continue_on_error: true
        response_variable: _ureg_read_raw
        data:
          action_type: read
          volume_entity_id:
            - "{{ _ureg_household }}"
          key: codex_registry
      - variables:
          _ureg_existing: >-
            {%- set raw = _ureg_read_raw if _ureg_read_raw is mapping else {} -%}
            {%- set val = raw.get('value', {}) -%}
            {%- set parsed = val | from_json if val is string else val -%}
            {{ parsed if parsed is mapping else {} }}
          _ureg_new: >-
            {%- set ns = namespace(r={}) -%}
            {%- for k, v in _ureg_existing.items() if k != 'depreciation' -%}
              {%- set ns.r = ns.r | combine({k: v}) -%}
            {%- endfor -%}
            {{ ns.r }}
      - action: script.zen_dojotools_filecabinet
        continue_on_error: true
        response_variable: _ureg_write_raw
        data:
          action_type: upsert
          volume_entity_id:
            - "{{ _ureg_household }}"
          key: codex_registry
          value: "{{ _ureg_new | tojson }}"
      - variables:
          final_response:
            status: "{{ 'success' if _ureg_write_raw is mapping and _ureg_write_raw.get('status', '') == 'success' else 'error' }}"
            tool: '{{ tool_name }}'
            mode: unregister
            feature_key: depreciation
            message: Depreciation codex removed from codex_registry.
      - stop: unregister
        response_variable: final_response

    ###########################################################################
    # Userentity ID resolution (needed by all asset modes)
    ###########################################################################
    - if: "{{ _mode in ['depreciable_asset_create', 'depreciable_asset_get', 'depreciable_asset_update', 'depreciable_asset_list', 'depreciable_asset_calculate_schedule', 'depreciable_asset_book_value', 'depreciable_asset_replacement_plan', 'depreciable_asset_post_depreciation_period', 'depreciable_asset_post_due_depreciation', 'depreciable_asset_sync_piggy_reserves', 'depreciable_asset_dispose', 'depreciable_asset_dispose_with_post', 'depreciable_asset_reconcile_firefly', 'depreciable_asset_warranty_check', 'depreciable_asset_warranty_report', 'depreciable_asset_attach', 'depreciable_asset_attachments_get', 'depreciable_asset_report', 'depreciable_asset_report_by_project', 'depreciable_asset_report_by_room', 'depreciable_asset_suggest_business_use', 'depreciable_asset_firefly_setup', 'asset_allocation_create', 'asset_allocation_get', 'asset_allocation_list', 'asset_allocation_update'] }}"
      then:
      - action: script.zen_dojotools_inventory
        continue_on_error: true
        response_variable: _ue_list_raw
        data:
          mode: userentities_list
      - variables:
          _ue_list: >-
            {{ (_ue_list_raw.get('userentities', []) if _ue_list_raw is mapping else []) }}
          _ue_match: >-
            {{ _ue_list | selectattr('name', 'equalto', 'depreciable_asset') | list | first | default(none) }}
          _ue_id: >-
            {{ _ue_match.get('id') | int(0) if _ue_match is mapping else 0 }}

    - if: "{{ _ue_id is defined and _ue_id == 0 and _mode not in ['tool_manifest', 'health', 'help', 'register', 'unregister', 'compensate', 'depreciable_asset_firefly_setup'] }}"
      then:
      - variables:
          final_response:
            status: error
            tool: '{{ tool_name }}'
            mode: '{{ _mode }}'
            code: setup_required
            message: >-
              Grocy depreciable_asset userentity not found. Run
              zen_dojotools_finance mode=run case=depreciable_asset_firefly_setup
              first to deploy the asset schema.
      - stop: setup required
        response_variable: final_response

    ###########################################################################
    # depreciable_asset_firefly_setup (T5)
    ###########################################################################
    - if: "{{ _mode == 'depreciable_asset_firefly_setup' }}"
      then:
      # Check Grocy schema state
      - variables:
          _setup_ue_exists: "{{ _ue_id is defined and _ue_id | int(0) > 0 }}"
      - action: script.zen_dojotools_inventory
        continue_on_error: true
        response_variable: _setup_uf_raw
        data:
          mode: userfields_list
          entity: "{{ _grocy_entity }}"
      - variables:
          _setup_uf_existing: >-
            {{ (_setup_uf_raw.get('fields', []) if _setup_uf_raw is mapping else []) }}
          _setup_canonical_names:
            - name
            - description
            - asset_type
            - room_anchor
            - grocy_product_id
            - purchase_date
            - placed_in_service_date
            - cost_basis
            - salvage_value
            - replacement_cost_estimate
            - useful_life_months
            - depreciation_method
            - business_use_percent
            - household_use_percent
            - status
            - disposal_date
            - disposal_proceeds
            - firefly_asset_account_id
            - firefly_asset_account_name
            - firefly_expense_category_id
            - firefly_depreciation_tag
            - firefly_replacement_piggy_bank_id
            - last_depreciation_period_posted
            - serial_number
            - model_number
            - manufacturer
            - vendor
            - purchase_transaction_reference
            - project_id
            - warranty_expiration
            - attachment_refs
            - notes
            - created_at
            - updated_at
            - tax_context
            - owner_entity
            - paid_by_entity
            - reimbursement_status
            - allocation_method
            - business_area_anchor
            - evidence_refs
            - tax_review_status
          _setup_uf_existing_names: >-
            {{ _setup_uf_existing | map(attribute='name') | list }}
          _setup_uf_missing: >-
            {%- set ns = namespace(m=[]) -%}
            {%- for n in _setup_canonical_names -%}
              {%- if n not in _setup_uf_existing_names -%}
                {%- set ns.m = ns.m + [n] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.m }}
          _setup_ff_categories_needed:
            - Asset Purchases
            - Depreciation Expense
            - Asset Maintenance
            - Asset Disposal
            - Replacement Reserve
          _setup_plan:
            grocy_entity_exists: '{{ _setup_ue_exists }}'
            grocy_fields_present: '{{ _setup_uf_existing_names | length }}'
            grocy_fields_missing: '{{ _setup_uf_missing }}'
            firefly_categories_to_create: '{{ _setup_ff_categories_needed }}'
            dry_run: '{{ _dry_run }}'
            requires_confirm: '{{ not _confirm and not _dry_run }}'

      # dry_run or no confirm — return plan only
      - if: "{{ _dry_run or not _confirm }}"
        then:
        - variables:
            final_response:
              status: plan
              tool: '{{ tool_name }}'
              mode: depreciable_asset_firefly_setup
              plan: '{{ _setup_plan }}'
              message: >-
                {%- if _dry_run -%}dry_run=true — no changes made.
                {%- else -%}Pass confirm=true to execute this setup plan.{%- endif -%}
              evidence:
                dry_run: '{{ _dry_run }}'
                caller: '{{ _caller }}'
                timestamp: '{{ _now }}'
                mode: depreciable_asset_firefly_setup
        - stop: setup plan
          response_variable: final_response

      # Execute: deploy userfields schema
      - action: script.zen_dojotools_inventory
        continue_on_error: true
        response_variable: _setup_deploy_raw
        data:
          mode: userfields_deploy
          confirm_action: true
      - variables:
          _setup_deploy_ok: >-
            {{ _setup_deploy_raw is mapping and _setup_deploy_raw.get('status', '') in ['ok', 'partial'] }}

      # Execute: Firefly categories (delegate to zen_dojotools_finance)
      - variables:
          _setup_cat_results: []
      - repeat:
          for_each: "{{ _setup_ff_categories_needed }}"
          sequence:
          - action: script.zen_dojotools_finance
            continue_on_error: true
            response_variable: _setup_cat_raw
            data:
              mode: run
              case: category_create
              item: "{{ repeat.item }}"
              confirm: true
          - variables:
              _setup_cat_results: >-
                {{ _setup_cat_results + [{'category': repeat.item,
                   'status': (_setup_cat_raw.get('status', 'error') if _setup_cat_raw is mapping else 'error')}] }}

      - variables:
          _setup_idem_key: "depr:setup:global:{{ _today }}"
          final_response:
            status: "{{ 'success' if _setup_deploy_ok else 'partial' }}"
            tool: '{{ tool_name }}'
            mode: depreciable_asset_firefly_setup
            grocy_deploy_status: "{{ _setup_deploy_raw.get('status', 'unknown') if _setup_deploy_raw is mapping else 'error' }}"
            firefly_categories: '{{ _setup_cat_results }}'
            message: >-
              Setup complete. Grocy schema deployed. Firefly categories created.
              Re-run with an asset_id to create a replacement piggy bank for that asset.
            evidence:
              idempotency_key: '{{ _setup_idem_key }}'
              dry_run: false
              caller: '{{ _caller }}'
              timestamp: '{{ _now }}'
              mode: depreciable_asset_firefly_setup
              audit_note: "{{ _audit_note }}"
      - stop: setup done
        response_variable: final_response

    ###########################################################################
    # depreciable_asset_create (T1)
    ###########################################################################
    - if: "{{ _mode == 'depreciable_asset_create' }}"
      then:
      # Validate required fields
      - variables:
          _create_required:
            - name
            - cost_basis
            - useful_life_months
            - placed_in_service_date
            - depreciation_method
          _create_missing: >-
            {%- set ns = namespace(m=[]) -%}
            {%- for f in _create_required -%}
              {%- if _asset_data.get(f, '') | string | trim == '' -%}
                {%- set ns.m = ns.m + [f] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.m }}

      - if: "{{ _create_missing | length > 0 }}"
        then:
        - variables:
            final_response:
              status: error
              tool: '{{ tool_name }}'
              mode: depreciable_asset_create
              code: missing_required_fields
              missing: '{{ _create_missing }}'
              message: "Required fields missing: {{ _create_missing | join(', ') }}"
        - stop: missing fields
          response_variable: final_response

      - variables:
          _create_idem_key: >-
            {{ _idem_key_in if _idem_key_in != '' else
               'depr:create:' ~ (_asset_data.get('name', '') | lower | replace(' ', '_')) ~ ':' ~ _asset_data.get('placed_in_service_date', _today) }}

      # dry_run gate
      - if: "{{ _dry_run }}"
        then:
        - variables:
            final_response:
              status: plan
              tool: '{{ tool_name }}'
              mode: depreciable_asset_create
              would_create:
                name: "{{ _asset_data.get('name', '') }}"
                cost_basis: "{{ _asset_data.get('cost_basis', 0) }}"
                placed_in_service_date: "{{ _asset_data.get('placed_in_service_date', '') }}"
                depreciation_method: "{{ _asset_data.get('depreciation_method', '') }}"
              evidence:
                idempotency_key: '{{ _create_idem_key }}'
                dry_run: true
                caller: '{{ _caller }}'
                timestamp: '{{ _now }}'
                mode: depreciable_asset_create
        - stop: dry run
          response_variable: final_response

      - if: "{{ not _confirm }}"
        then:
        - variables:
            final_response:
              status: confirm_required
              tool: '{{ tool_name }}'
              mode: depreciable_asset_create
              preview:
                name: "{{ _asset_data.get('name', '') }}"
                cost_basis: "{{ _asset_data.get('cost_basis', 0) }}"
                placed_in_service_date: "{{ _asset_data.get('placed_in_service_date', '') }}"
                depreciation_method: "{{ _asset_data.get('depreciation_method', '') }}"
              message: Pass confirm=true to create this asset.
              evidence:
                idempotency_key: '{{ _create_idem_key }}'
                dry_run: false
                caller: '{{ _caller }}'
                timestamp: '{{ _now }}'
                mode: depreciable_asset_create
        - stop: confirm required
          response_variable: final_response

      # Create userobject
      - action: script.zen_dojotools_inventory
        continue_on_error: true
        response_variable: _create_obj_raw
        data:
          mode: userobjects_create
          userentity_id: "{{ _ue_id }}"

      - variables:
          _create_obj_id: >-
            {{ _create_obj_raw.get('created_id', 0) | int(0) if _create_obj_raw is mapping else 0 }}

      - if: "{{ _create_obj_id == 0 }}"
        then:
        - variables:
            final_response:
              status: error
              tool: '{{ tool_name }}'
              mode: depreciable_asset_create
              code: userobject_create_failed
              message: Failed to create Grocy userobject.
              evidence:
                idempotency_key: '{{ _create_idem_key }}'
                dry_run: false
                caller: '{{ _caller }}'
                timestamp: '{{ _now }}'
        - stop: create failed
          response_variable: final_response

      # Build values payload
      - variables:
          _create_audit_line: "[{{ _today }}] created by {{ _caller }}{{ (' | ' ~ _audit_note) if _audit_note != '' else '' }} | key:{{ _create_idem_key }}"
      - variables:
          _create_product_ref: >-
            {%- set pid = _asset_data.get('grocy_product_id', '') | string | trim -%}
            {{ ('product:' ~ pid) if pid not in ['', 'None', 'null'] else '' }}
      - variables:
          _create_evidence_refs: >-
            {%- set existing_raw = _asset_data.get('evidence_refs', '') -%}
            {%- set existing = existing_raw | from_json(none) if (existing_raw is string and existing_raw | trim not in ['', 'None', 'null']) else (existing_raw if existing_raw is sequence else []) -%}
            {%- set existing_list = existing if existing is sequence else [] -%}
            {%- set ref = _create_product_ref -%}
            {%- if ref != '' and ref not in existing_list -%}
              {{ (existing_list + [ref]) | tojson }}
            {%- elif existing_list | length > 0 -%}
              {{ existing_list | tojson }}
            {%- else -%}{{ '' }}{%- endif -%}
      - variables:
          _create_values: >-
            {%- set base = _asset_data | combine({
              'status': _asset_data.get('status', 'active'),
              'created_at': _now,
              'updated_at': _now,
              'notes': _create_audit_line
            }) -%}
            {%- if _create_evidence_refs != '' -%}
              {{ base | combine({'evidence_refs': _create_evidence_refs}) }}
            {%- else -%}{{ base }}{%- endif -%}

      - action: script.zen_dojotools_inventory
        continue_on_error: true
        response_variable: _create_vals_raw
        data:
          mode: userentity_values_set
          entity: "{{ _grocy_entity }}"
          userobject_id: "{{ _create_obj_id }}"
          values_json: "{{ _create_values | tojson }}"

      - variables:
          _create_ok: "{{ _create_vals_raw is mapping and _create_vals_raw.get('status', '') in ['ok', 'success'] }}"
          final_response:
            status: "{{ 'success' if _create_ok else 'error' }}"
            tool: '{{ tool_name }}'
            mode: depreciable_asset_create
            data:
              asset_id: '{{ _create_obj_id }}'
              name: "{{ _asset_data.get('name', '') }}"
              status: active
            evidence:
              idempotency_key: '{{ _create_idem_key }}'
              dry_run: false
              caller: '{{ _caller }}'
              timestamp: '{{ _now }}'
              mode: depreciable_asset_create
              audit_note: "{{ _audit_note }}"
      - stop: create done
        response_variable: final_response

    ###########################################################################
    # depreciable_asset_get (T1)
    ###########################################################################
    - if: "{{ _mode == 'depreciable_asset_get' }}"
      then:
      - variables:
          _get_id_resolved: >-
            {{ _asset_id_raw | int(0) }}

      # If name-based, list all and match
      - if: "{{ _get_id_resolved == 0 and _asset_id_raw != '' }}"
        then:
        - action: script.zen_dojotools_inventory
          continue_on_error: true
          response_variable: _get_list_raw
          data:
            mode: userobjects_list
            userentity_id: "{{ _ue_id }}"
        - variables:
            _get_objs: >-
              {{ (_get_list_raw.get('userobjects', []) if _get_list_raw is mapping else []) }}
        - repeat:
            for_each: "{{ _get_objs }}"
            sequence:
            - if: "{{ _get_id_resolved == 0 }}"
              then:
              - action: script.zen_dojotools_inventory
                continue_on_error: true
                response_variable: _get_vals_check
                data:
                  mode: userentity_values_get
                  entity: "{{ _grocy_entity }}"
                  userobject_id: "{{ repeat.item.get('id', 0) | int(0) }}"
              - variables:
                  _get_check_name: >-
                    {{ (_get_vals_check.get('values', {}).get('name', '') if _get_vals_check is mapping else '') | string | trim | lower }}
                  _get_id_resolved: >-
                    {{ repeat.item.get('id', 0) | int(0) if _get_check_name == _asset_id_raw | lower | trim else _get_id_resolved }}

      - if: "{{ _get_id_resolved == 0 }}"
        then:
        - variables:
            final_response:
              status: not_found
              tool: '{{ tool_name }}'
              mode: depreciable_asset_get
              asset_id: '{{ _asset_id_raw }}'
              message: "Asset '{{ _asset_id_raw }}' not found."
        - stop: not found
          response_variable: final_response

      - action: script.zen_dojotools_inventory
        continue_on_error: true
        response_variable: _get_vals_raw
        data:
          mode: userentity_values_get
          entity: "{{ _grocy_entity }}"
          userobject_id: "{{ _get_id_resolved }}"

      - variables:
          _get_fields: >-
            {{ _get_vals_raw.get('values', {}) if _get_vals_raw is mapping else {} }}
          final_response:
            status: ok
            tool: '{{ tool_name }}'
            mode: depreciable_asset_get
            data: >-
              {{ _get_fields | combine({'asset_id': _get_id_resolved}) }}
      - stop: get done
        response_variable: final_response

    ###########################################################################
    # depreciable_asset_update (T1)
    ###########################################################################
    - if: "{{ _mode == 'depreciable_asset_update' }}"
      then:
      # Resolve asset
      - action: script.zen_codex_finance_depreciation
        continue_on_error: true
        response_variable: _upd_get_raw
        data:
          mode: depreciable_asset_get
          asset_id: "{{ _asset_id_raw }}"
          caller: "{{ _caller }}"

      - if: "{{ not (_upd_get_raw is mapping and _upd_get_raw.get('status') == 'ok') }}"
        then:
        - variables:
            final_response: "{{ _upd_get_raw | default({'status': 'error', 'code': 'asset_not_found'}) }}"
        - stop: asset not found
          response_variable: final_response

      - variables:
          _upd_existing: "{{ _upd_get_raw.get('data', {}) }}"
          _upd_resolved_id: "{{ (_upd_get_raw.get('data', {}) or {}).get('asset_id', 0) | int(0) }}"
      - variables:
          _upd_idem_key: >-
            {{ _idem_key_in if _idem_key_in != '' else
               'depr:update:' ~ _upd_resolved_id | string ~ ':' ~ (_upd_existing.get('updated_at', _now) or _now)[:10] }}
      - variables:
          _upd_audit_line: >-
            [{{ _today }}] updated by {{ _caller }}{{ (' | ' ~ _audit_note) if _audit_note != '' else '' }} | key:{{ _upd_idem_key }}
      - variables:
          _upd_product_ref: >-
            {%- set pid = _asset_data.get('grocy_product_id', (_upd_existing or {}).get('grocy_product_id', '')) | string | trim -%}
            {{ ('product:' ~ pid) if pid not in ['', 'None', 'null'] else '' }}
      - variables:
          _upd_evidence_refs: >-
            {%- set existing_raw = _asset_data.get('evidence_refs') if 'evidence_refs' in _asset_data else (_upd_existing or {}).get('evidence_refs') -%}
            {%- set existing_str = '' if (existing_raw is none or existing_raw | string | trim in ['', 'None', 'null']) else existing_raw | string | trim -%}
            {%- set ns = namespace(refs=[]) -%}
            {%- if existing_str != '' -%}
              {%- set parsed = existing_str | from_json(none) -%}
              {%- if parsed is sequence -%}{%- set ns.refs = parsed -%}{%- endif -%}
            {%- endif -%}
            {%- if _upd_product_ref != '' and _upd_product_ref not in ns.refs -%}
              {%- set ns.refs = ns.refs + [_upd_product_ref] -%}
            {%- endif -%}
            {{ ns.refs | tojson if ns.refs | length > 0 else '' }}
      - variables:
          _upd_merged: >-
            {%- set _raw = (_upd_existing or {}) | combine(_asset_data) | combine({
              'updated_at': _now,
              'notes': (((_upd_existing or {}).get('notes', '') ~ '\n') if (_upd_existing or {}).get('notes', '') != '' else '') ~ _upd_audit_line
            }) -%}
            {%- set ns = namespace(clean={}) -%}
            {%- for k, v in _raw.items() if k != 'asset_id' -%}
              {%- set ns.clean = ns.clean | combine({k: v}) -%}
            {%- endfor -%}
            {%- if not (_upd_evidence_refs is string) and (_upd_evidence_refs is sequence) and _upd_evidence_refs | length > 0 -%}
              {%- set _er_ns = namespace(parts=[]) -%}
              {%- for ref in _upd_evidence_refs -%}
                {%- set _er_ns.parts = _er_ns.parts + ['"' ~ ref ~ '"'] -%}
              {%- endfor -%}
              {%- set ns.clean = ns.clean | combine({'evidence_refs': '[' ~ (_er_ns.parts | join(',')) ~ ']'}) -%}
            {%- elif _upd_evidence_refs is string and _upd_evidence_refs | trim != '' -%}
              {%- set ns.clean = ns.clean | combine({'evidence_refs': _upd_evidence_refs}) -%}
            {%- endif -%}
            {{ ns.clean }}

      - if: "{{ _dry_run }}"
        then:
        - variables:
            final_response:
              status: plan
              tool: '{{ tool_name }}'
              mode: depreciable_asset_update
              asset_id: '{{ _upd_resolved_id }}'
              changes: '{{ _asset_data }}'
              evidence:
                idempotency_key: '{{ _upd_idem_key }}'
                dry_run: true
                caller: '{{ _caller }}'
                timestamp: '{{ _now }}'
        - stop: dry run
          response_variable: final_response

      - if: "{{ not _confirm }}"
        then:
        - variables:
            final_response:
              status: confirm_required
              tool: '{{ tool_name }}'
              mode: depreciable_asset_update
              asset_id: '{{ _upd_resolved_id }}'
              changes: '{{ _asset_data }}'
              message: Pass confirm=true to apply these changes.
        - stop: confirm required
          response_variable: final_response

      - action: script.zen_dojotools_inventory
        continue_on_error: true
        response_variable: _upd_set_raw
        data:
          mode: userentity_values_set
          entity: "{{ _grocy_entity }}"
          userobject_id: "{{ _upd_resolved_id }}"
          values_json: "{{ _upd_merged | tojson }}"

      - variables:
          final_response:
            status: "{{ 'success' if (_upd_set_raw is mapping and _upd_set_raw.get('status', '') in ['ok', 'success']) else 'error' }}"
            tool: '{{ tool_name }}'
            mode: depreciable_asset_update
            data:
              asset_id: '{{ _upd_resolved_id }}'
              fields_updated: '{{ _asset_data.keys() | list }}'
            evidence:
              idempotency_key: '{{ _upd_idem_key }}'
              dry_run: false
              caller: '{{ _caller }}'
              timestamp: '{{ _now }}'
              audit_note: "{{ _audit_note }}"
      - stop: update done
        response_variable: final_response

    ###########################################################################
    # depreciable_asset_list (T1)
    ###########################################################################
    - if: "{{ _mode == 'depreciable_asset_list' }}"
      then:
      - action: script.zen_dojotools_inventory
        continue_on_error: true
        response_variable: _list_objs_raw
        data:
          mode: userobjects_list
          userentity_id: "{{ _ue_id }}"
      - variables:
          _list_objs: >-
            {{ (_list_objs_raw.get('userobjects', []) if _list_objs_raw is mapping else []) }}
          _list_assets: []
      - repeat:
          for_each: "{{ _list_objs }}"
          sequence:
          - action: script.zen_dojotools_inventory
            continue_on_error: true
            response_variable: _list_vals_raw
            data:
              mode: userentity_values_get
              entity: "{{ _grocy_entity }}"
              userobject_id: "{{ repeat.item.get('id', 0) | int(0) }}"
          - variables:
              _list_fields: >-
                {{ (_list_vals_raw.get('values', {}) if _list_vals_raw is mapping else {}) }}
              _list_assets: >-
                {{ _list_assets + [_list_fields | combine({'asset_id': repeat.item.get('id', 0) | int(0)})] }}
      - variables:
          final_response:
            status: ok
            tool: '{{ tool_name }}'
            mode: depreciable_asset_list
            count: '{{ _list_assets | length }}'
            assets: '{{ _list_assets }}'
      - stop: list done
        response_variable: final_response

    ###########################################################################
    # depreciable_asset_calculate_schedule (T2)
    ###########################################################################
    - if: "{{ _mode == 'depreciable_asset_calculate_schedule' }}"
      then:
      - action: script.zen_codex_finance_depreciation
        continue_on_error: true
        response_variable: _sched_get_raw
        data:
          mode: depreciable_asset_get
          asset_id: "{{ _asset_id_raw }}"
          caller: "{{ _caller }}"

      - if: "{{ not (_sched_get_raw is mapping and _sched_get_raw.get('status') == 'ok') }}"
        then:
        - variables:
            final_response: "{{ _sched_get_raw | default({'status': 'error', 'code': 'asset_not_found'}) }}"
        - stop: asset not found
          response_variable: final_response

      - variables:
          _sched_asset: "{{ _sched_get_raw.get('data', {}) }}"
          _sched_asset_id: "{{ _sched_asset.get('asset_id', 0) | int(0) }}"
          _sched_method: "{{ _sched_asset.get('depreciation_method', 'straight_line') | lower | trim }}"
          _sched_cost: "{{ _sched_asset.get('cost_basis', 0) | float(0) }}"
          _sched_salvage: "{{ _sched_asset.get('salvage_value', 0) | float(0) }}"
          _sched_life: "{{ _sched_asset.get('useful_life_months', 0) | int(0) }}"
          _sched_start: "{{ _sched_asset.get('placed_in_service_date', '') }}"

      - if: "{{ _sched_life == 0 or _sched_start == '' }}"
        then:
        - variables:
            final_response:
              status: error
              tool: '{{ tool_name }}'
              mode: depreciable_asset_calculate_schedule
              code: invalid_asset_fields
              message: useful_life_months and placed_in_service_date are required.
        - stop: invalid fields
          response_variable: final_response

      - variables:
          _sched_base: >-
            {{ [(_sched_cost - _sched_salvage), 0] | max | round(4) }}
          _sched_monthly: >-
            {{ (_sched_base / _sched_life) | round(4) if _sched_life > 0 else 0 }}
          _sched_sy: "{{ _sched_start[:4] | int(0) }}"
          _sched_sm: "{{ _sched_start[5:7] | int(0) }}"
          _sched_rows: >-
            {%- set ns = namespace(rows=[], acc=0.0, bv=_sched_cost | float) -%}
            {%- if _sched_method in ['declining_balance', 'double_declining_balance'] -%}
              {%- set _db_rate = (2.0 if _sched_method == 'double_declining_balance' else 1.0) / (_sched_life | int) -%}
              {%- for i in range(_sched_life | int) -%}
                {%- set _m = (_sched_sm | int + i - 1) % 12 + 1 -%}
                {%- set _y = _sched_sy | int + ((_sched_sm | int + i - 1) // 12) -%}
                {%- set _period = '%04d-%02d' | format(_y, _m) -%}
                {%- set _ddb_amt = (ns.bv * _db_rate) | round(2) -%}
                {%- set _periods_remaining = (_sched_life | int) - i -%}
                {%- set _sl_base = [ns.bv - _sched_salvage, 0] | max -%}
                {%- set _sl_amt = (_sl_base / _periods_remaining) | round(2) if _periods_remaining > 0 else 0 -%}
                {# Crossover: use whichever is larger; cap at remaining depreciable balance #}
                {%- set _cap = [ns.bv - _sched_salvage, 0] | max | round(2) -%}
                {%- set _raw_amt = (_cap if loop.last else [_ddb_amt, _sl_amt] | max | round(2)) -%}
                {%- set _amt = [_raw_amt, _cap] | min | round(2) -%}
                {%- set _new_acc = (ns.acc + _amt) | round(2) -%}
                {%- set _new_bv = ((_sched_cost | float) - _new_acc) | round(2) -%}
                {%- set _ikey = 'depr:' ~ _sched_asset_id | string ~ ':' ~ _period ~ ':' ~ _sched_method ~ ':' ~ _amt | string -%}
                {%- set _row = {'period': _period, 'opening_book_value': ns.bv | round(2), 'depreciation_amount': _amt, 'accumulated_depreciation_after': _new_acc, 'closing_book_value': _new_bv, 'post_status': 'pending', 'idempotency_key': _ikey} -%}
                {%- set ns.rows = ns.rows + [_row] -%}
                {%- set ns.acc = _new_acc -%}
                {%- set ns.bv = _new_bv -%}
              {%- endfor -%}
            {%- else -%}
              {# straight_line (default) and manual_no_post — same math, post_status differs #}
              {%- set _skip = _sched_method == 'manual_no_post' -%}
              {%- for i in range(_sched_life | int) -%}
                {%- set _m = (_sched_sm | int + i - 1) % 12 + 1 -%}
                {%- set _y = _sched_sy | int + ((_sched_sm | int + i - 1) // 12) -%}
                {%- set _period = '%04d-%02d' | format(_y, _m) -%}
                {%- set _amt = ((_sched_base | float) - ns.acc) | round(2) if loop.last else (_sched_monthly | float) | round(2) -%}
                {%- set _new_acc = (ns.acc + _amt) | round(2) -%}
                {%- set _new_bv = ((_sched_cost | float) - _new_acc) | round(2) -%}
                {%- set _ikey = 'depr:' ~ _sched_asset_id | string ~ ':' ~ _period ~ ':' ~ _sched_method ~ ':' ~ _amt | string -%}
                {%- set _row = {'period': _period, 'opening_book_value': ns.bv | round(2), 'depreciation_amount': _amt, 'accumulated_depreciation_after': _new_acc, 'closing_book_value': _new_bv, 'post_status': 'skipped' if _skip else 'pending', 'idempotency_key': _ikey} -%}
                {%- set ns.rows = ns.rows + [_row] -%}
                {%- set ns.acc = _new_acc -%}
                {%- set ns.bv = _new_bv -%}
              {%- endfor -%}
            {%- endif -%}
            {{ ns.rows }}

      - variables:
          final_response:
            status: ok
            tool: '{{ tool_name }}'
            mode: depreciable_asset_calculate_schedule
            asset_id: '{{ _sched_asset_id }}'
            asset_name: "{{ _sched_asset.get('name', '') }}"
            depreciation_method: '{{ _sched_method }}'
            cost_basis: '{{ _sched_cost }}'
            salvage_value: '{{ _sched_salvage }}'
            depreciable_base: '{{ _sched_base }}'
            monthly_amount: '{{ _sched_monthly | round(2) }}'
            total_periods: '{{ _sched_life }}'
            schedule: '{{ _sched_rows }}'
      - stop: schedule done
        response_variable: final_response

    ###########################################################################
    # depreciable_asset_book_value (T3)
    ###########################################################################
    - if: "{{ _mode == 'depreciable_asset_book_value' }}"
      then:
      - action: script.zen_codex_finance_depreciation
        continue_on_error: true
        response_variable: _bv_asset_raw
        data:
          mode: depreciable_asset_get
          asset_id: "{{ _asset_id_raw }}"
          caller: "{{ _caller }}"

      - if: "{{ not (_bv_asset_raw is mapping and _bv_asset_raw.get('status') == 'ok') }}"
        then:
        - variables:
            final_response: "{{ _bv_asset_raw | default({'status': 'error', 'code': 'asset_not_found'}) }}"
        - stop: not found
          response_variable: final_response

      - variables:
          _bv_asset: "{{ _bv_asset_raw.get('data', {}) }}"
      - variables:
          _bv_asset_id: "{{ (_bv_asset or {}).get('asset_id', 0) | int(0) }}"
          _bv_cost: "{{ (_bv_asset or {}).get('cost_basis', 0) | float(0) }}"
          _bv_salvage: "{{ (_bv_asset or {}).get('salvage_value', 0) | float(0) }}"
          _bv_total_periods: "{{ (_bv_asset or {}).get('useful_life_months', 0) | int(0) }}"

      # Resolve current effective allocation row (fail-soft — falls back to asset-level percentages)
      - action: script.zen_codex_finance_depreciation
        continue_on_error: true
        response_variable: _bv_alloc_raw
        data:
          mode: asset_allocation_get
          asset_id: "{{ _bv_asset_id | string }}"
          caller: "{{ _caller }}"
      - variables:
          _bv_alloc: >-
            {%- set r = _bv_alloc_raw if _bv_alloc_raw is mapping else {} -%}
            {{ r.get('effective_allocation') if r.get('found', false) else none }}
          _bv_biz_pct: >-
            {%- if _bv_alloc is mapping and _bv_alloc.get('business_use_percent') is not none -%}
              {{ _bv_alloc.get('business_use_percent') | float(0) }}
            {%- else -%}
              {{ (_bv_asset or {}).get('business_use_percent', 0) | float(0) }}
            {%- endif -%}
          _bv_hh_pct: >-
            {%- if _bv_alloc is mapping and _bv_alloc.get('household_use_percent') is not none -%}
              {{ _bv_alloc.get('household_use_percent') | float(0) }}
            {%- else -%}
              {{ (_bv_asset or {}).get('household_use_percent', 100) | float(100) }}
            {%- endif -%}

      # Search Firefly by asset name — substring search catches withdrawals + reversal deposits
      - action: script.zen_dojotools_finance
        continue_on_error: true
        response_variable: _bv_txns_raw
        data:
          mode: run
          case: transactions_search
          item: "{{ _bv_asset.get('name', '') }}"
          per_page: 100

      - variables:
          _bv_all_txns: >-
            {%- set r = _bv_txns_raw if _bv_txns_raw is mapping else {} -%}
            {%- set result = r.get('result', {}) if r is mapping else {} -%}
            {{ result.get('transactions', []) if result is mapping else [] }}
          _bv_last_posted: >-
            {{ _bv_asset.get('last_depreciation_period_posted', '') | default('', true) | string | trim }}

      # Build signed period-net dict.
      # withdrawal = +amount (depreciation charge), deposit = -amount (reversal credit).
      # Period extracted from last YYYY-MM in description — reversal dates don't matter, period does.
      - variables:
          _bv_period_nets: >-
            {%- set ns = namespace(nets={}) -%}
            {%- for t in _bv_all_txns if t is mapping -%}
              {%- set pm = t.get('description', '') | regex_findall('\d{4}-\d{2}') | list | last | default('unknown') -%}
              {%- set amt = t.get('amount', 0) | float(0) -%}
              {%- set signed = amt if t.get('type', '') == 'withdrawal' else -amt -%}
              {%- set ns.nets = ns.nets | combine({pm: ns.nets.get(pm, 0.0) + signed}) -%}
            {%- endfor -%}
            {{ ns.nets }}

      # Per-period deposit totals — needed to assign "reversed" status to matching withdrawals
      - variables:
          _bv_period_deposits: >-
            {%- set ns = namespace(deps={}) -%}
            {%- for t in _bv_all_txns if t is mapping and t.get('type', '') == 'deposit' -%}
              {%- set pm = t.get('description', '') | regex_findall('\d{4}-\d{2}') | list | last | default('unknown') -%}
              {%- set amt = t.get('amount', 0) | float(0) -%}
              {%- set ns.deps = ns.deps | combine({pm: ns.deps.get(pm, 0.0) + amt}) -%}
            {%- endfor -%}
            {{ ns.deps }}

      # Per-period evidence ledger: transactions, signed amounts, status, net, counts_as_posted
      - variables:
          _bv_period_ledger: >-
            {%- set nets = _bv_period_nets if _bv_period_nets is mapping else {} -%}
            {%- set deps = _bv_period_deposits if _bv_period_deposits is mapping else {} -%}
            {%- set ns = namespace(out=[]) -%}
            {%- for period, net in nets.items() -%}
              {%- set ns2 = namespace(txns=[], remaining_dep=deps.get(period, 0.0)) -%}
              {%- for t in _bv_all_txns if t is mapping -%}
                {%- set pm = t.get('description', '') | regex_findall('\d{4}-\d{2}') | list | last | default('unknown') -%}
                {%- if pm == period -%}
                  {%- set amt = t.get('amount', 0) | float(0) -%}
                  {%- set is_dep = t.get('type', '') == 'deposit' -%}
                  {%- set signed = -amt if is_dep else amt -%}
                  {%- if is_dep -%}
                    {%- set tx_status = 'reversal' -%}
                  {%- elif ns2.remaining_dep >= amt -%}
                    {%- set tx_status = 'reversed' -%}
                    {%- set ns2.remaining_dep = ns2.remaining_dep - amt -%}
                  {%- else -%}
                    {%- set tx_status = 'valid' -%}
                  {%- endif -%}
                  {%- set ns2.txns = ns2.txns + [{'tx': t.get('id', ''), 'type': t.get('type', ''), 'signed_amount': signed | round(2), 'status': tx_status}] -%}
                {%- endif -%}
              {%- endfor -%}
              {%- set ns.out = ns.out + [{'period': period, 'transactions': ns2.txns, 'net_amount': net | round(2), 'counts_as_posted': (net | float(0) > 0)}] -%}
            {%- endfor -%}
            {{ ns.out }}

      # accumulated = sum of positive-net periods; periods_posted = count of those periods
      - variables:
          _bv_accumulated: >-
            {%- set ns = namespace(total=0.0) -%}
            {%- for period, net in (_bv_period_nets.items() if _bv_period_nets is mapping else {}.items()) -%}
              {%- if net | float(0) > 0 -%}{%- set ns.total = ns.total + net | float(0) -%}{%- endif -%}
            {%- endfor -%}
            {{ ns.total | round(2) }}
          _bv_periods_posted: >-
            {%- set ns = namespace(count=0) -%}
            {%- for period, net in (_bv_period_nets.items() if _bv_period_nets is mapping else {}.items()) -%}
              {%- if net | float(0) > 0 -%}{%- set ns.count = ns.count + 1 -%}{%- endif -%}
            {%- endfor -%}
            {{ ns.count }}
      - variables:
          _bv_current: >-
            {{ [(_bv_cost - _bv_accumulated), _bv_salvage] | max | round(2) }}
          _bv_next_due: >-
            {%- if _bv_last_posted == '' or _bv_last_posted == 'None' or _bv_last_posted == 'none' -%}
              {{ (_bv_asset.get('placed_in_service_date', '') | default('', true) | string)[:7] }}
            {%- else -%}
              {%- set _y = _bv_last_posted[:4] | int(0) -%}
              {%- set _m = _bv_last_posted[5:7] | int(0) -%}
              {%- set _nm = _m % 12 + 1 -%}
              {%- set _ny = _y + (1 if _m == 12 else 0) -%}
              {{ '%04d-%02d' | format(_ny, _nm) }}
            {%- endif -%}

      # ── include_evidence: resolve evidence_refs via stack providers ──────────
      - variables:
          _bv_ev_raw: "{{ _bv_asset.get('evidence_refs', '') }}"
          _bv_resolved_evidence: []
      - variables:
          _bv_ev_refs: >-
            {%- set raw = _bv_ev_raw -%}
            {%- if raw is sequence and raw is not string -%}
              {{ raw }}
            {%- elif raw is string and raw | trim not in ['', 'None', 'null', '[]'] -%}
              {%- set parsed = raw | from_json(none) -%}
              {{ parsed if parsed is sequence else [] }}
            {%- else -%}
              {{ [] }}
            {%- endif -%}
      - if: "{{ _include_evidence and _bv_ev_refs | length > 0 }}"
        then:
        - variables:
            _bv_txn_anchor_ids: >-
              {%- set ns = namespace(ids=[]) -%}
              {%- for ref in _bv_ev_refs if ref is string -%}
                {%- set parts = ref | regex_findall('[^:]+') -%}
                {%- if parts | length >= 2 and parts[0] | lower | trim == 'transaction' -%}
                  {%- set ns.ids = ns.ids + [parts[1] | trim] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.ids }}
        - if: "{{ _bv_txn_anchor_ids | length > 0 }}"
          then:
          - action: script.zen_stack_firefly
            continue_on_error: true
            response_variable: _bv_txn_ev_raw
            data:
              mode: stacks_by_anchor
              anchor_type: transaction
              anchor_ids: "{{ _bv_txn_anchor_ids | tojson }}"
          - variables:
              _bv_resolved_evidence: >-
                {%- set r = _bv_txn_ev_raw if _bv_txn_ev_raw is mapping else {} -%}
                {{ _bv_resolved_evidence + (r.get('evidence', []) or []) }}
        - variables:
            _bv_resolved_evidence: >-
              {%- set ns = namespace(ev=_bv_resolved_evidence) -%}
              {%- for ref in _bv_ev_refs if ref is string -%}
                {%- set parts = ref | regex_findall('[^:]+') -%}
                {%- set rtype = parts[0] | lower | trim if parts | length >= 2 else '' -%}
                {%- if rtype not in ['transaction'] -%}
                  {%- set ns.ev = ns.ev + [{'ref': ref, 'type': rtype, 'resolved': false, 'reason': 'unsupported_ref_type'}] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.ev }}

      - variables:
          final_response:
            status: ok
            tool: '{{ tool_name }}'
            mode: depreciable_asset_book_value
            data:
              asset_id: '{{ _bv_asset_id }}'
              name: "{{ _bv_asset.get('name', '') }}"
              room_anchor: "{{ _bv_asset.get('room_anchor', '') }}"
              status: "{{ _bv_asset.get('status', 'active') }}"
              cost_basis: '{{ _bv_cost }}'
              salvage_value: '{{ _bv_salvage }}'
              accumulated_depreciation: '{{ _bv_accumulated }}'
              current_book_value: '{{ _bv_current }}'
              periods_posted: '{{ _bv_periods_posted }}'
              total_periods: '{{ _bv_total_periods }}'
              last_posted_period: '{{ _bv_last_posted }}'
              next_period_due: '{{ _bv_next_due }}'
              period_ledger: '{{ _bv_period_ledger }}'
              tax_context: "{{ _bv_asset.get('tax_context', '') }}"
              tax_review_status: "{{ _bv_asset.get('tax_review_status', 'unreviewed') }}"
              allocation_method: "{{ _bv_asset.get('allocation_method', '') }}"
              owner_entity: "{{ _bv_asset.get('owner_entity', '') }}"
              paid_by_entity: "{{ _bv_asset.get('paid_by_entity', '') }}"
              reimbursement_status: "{{ _bv_asset.get('reimbursement_status', '') }}"
              business_area_anchor: "{{ _bv_asset.get('business_area_anchor', '') }}"
              evidence_refs: "{{ _bv_asset.get('evidence_refs', '') }}"
              resolved_evidence: "{{ _bv_resolved_evidence if _include_evidence else none }}"
              effective_allocation: '{{ _bv_alloc }}'
              business_use_percent: '{{ _bv_biz_pct }}'
              household_use_percent: '{{ _bv_hh_pct }}'
              allocation_source: "{{ 'allocation_row' if (_bv_alloc is mapping) else 'asset_record' }}"
              natural_language: >-
                {{ _bv_asset.get('name', 'This asset') }} has a current book value of
                ${{ _bv_current }} after {{ _bv_periods_posted }} of {{ _bv_total_periods }}
                depreciation periods posted. Original cost basis was ${{ _bv_cost }}.
      - stop: book value done
        response_variable: final_response

    ###########################################################################
    # depreciable_asset_replacement_plan (T4)
    ###########################################################################
    - if: "{{ _mode == 'depreciable_asset_replacement_plan' }}"
      then:
      - action: script.zen_codex_finance_depreciation
        continue_on_error: true
        response_variable: _rp_bv_raw
        data:
          mode: depreciable_asset_book_value
          asset_id: "{{ _asset_id_raw }}"
          caller: "{{ _caller }}"

      - if: "{{ not (_rp_bv_raw is mapping and _rp_bv_raw.get('status') == 'ok') }}"
        then:
        - variables:
            final_response: "{{ _rp_bv_raw | default({'status': 'error', 'code': 'asset_not_found'}) }}"
        - stop: not found
          response_variable: final_response

      - variables:
          _rp_data: "{{ _rp_bv_raw.get('data', {}) }}"
          _rp_asset_id: "{{ _rp_data.get('asset_id', 0) }}"
          _rp_replacement_est: "{{ _rp_data.get('replacement_cost_estimate', 0) | float(0) }}"
          _rp_piggy_id: "{{ _rp_data.get('firefly_replacement_piggy_bank_id', '') | string | trim }}"
          _rp_cost: "{{ _rp_data.get('cost_basis', 0) | float(0) }}"
          _rp_life: "{{ _rp_data.get('useful_life_months', 1) | int(1) }}"
          _rp_start: "{{ _rp_data.get('placed_in_service_date', _today) }}"

      # Piggy bank balance
      - if: "{{ _rp_piggy_id != '' and _rp_piggy_id != '0' }}"
        then:
        - action: script.zen_dojotools_finance
          continue_on_error: true
          response_variable: _rp_piggy_raw
          data:
            mode: run
            case: piggybank_status
            item_id: "{{ _rp_piggy_id }}"
        - variables:
            _rp_current_reserve: >-
              {{ (_rp_piggy_raw.get('result', {}).get('current_amount', 0) | float(0)) if _rp_piggy_raw is mapping else 0.0 }}
      - if: "{{ _rp_piggy_id == '' or _rp_piggy_id == '0' }}"
        then:
        - variables:
            _rp_current_reserve: 0.0

      # Period arithmetic — split to avoid sibling-key footgun
      - variables:
          _rp_sy: "{{ _rp_start[:4] | int(0) }}"
          _rp_sm: "{{ _rp_start[5:7] | int(0) }}"
          _rp_today_y: "{{ now().year | int }}"
          _rp_today_m: "{{ now().month | int }}"
          _rp_remaining_need: >-
            {{ [(_rp_replacement_est - _rp_current_reserve), 0] | max | round(2) }}
      - variables:
          _rp_exp_y: "{{ _rp_sy + ((_rp_sm + _rp_life - 1) // 12) }}"
          _rp_exp_m: "{{ (_rp_sm + _rp_life - 1) % 12 + 1 }}"
      - variables:
          _rp_expected_replacement_date: >-
            {{ '%04d-%02d-01' | format(_rp_exp_y | int, _rp_exp_m | int) }}
          _rp_months_remaining: >-
            {{ [((_rp_exp_y | int - _rp_today_y) * 12 + (_rp_exp_m | int - _rp_today_m)), 1] | max }}
      - variables:
          _rp_monthly_reserve: >-
            {{ (_rp_remaining_need / _rp_months_remaining) | round(2) }}
          _rp_risk: >-
            {%- if _rp_months_remaining < 12 or (_rp_replacement_est > 0 and _rp_current_reserve < _rp_replacement_est * 0.5 and _rp_months_remaining < 24) -%}high
            {%- elif _rp_months_remaining < 24 -%}medium
            {%- else -%}low{%- endif -%}
          _rp_early_months: "{{ [_rp_months_remaining | int // 2, 1] | max }}"
      - variables:
          _rp_early_y: >-
            {{ _rp_today_y + ((_rp_today_m + (_rp_early_months | int) - 1) // 12) }}
          _rp_early_m: >-
            {{ (_rp_today_m + (_rp_early_months | int) - 1) % 12 + 1 }}
          _rp_early_monthly: >-
            {{ (_rp_remaining_need / (_rp_early_months | int)) | round(2) }}
          final_response:
            status: ok
            tool: '{{ tool_name }}'
            mode: depreciable_asset_replacement_plan
            data:
              asset_id: '{{ _rp_asset_id }}'
              current_book_value: "{{ _rp_data.get('current_book_value', 0) }}"
              replacement_cost_estimate: '{{ _rp_replacement_est }}'
              current_reserve_balance: '{{ _rp_current_reserve }}'
              remaining_replacement_need: '{{ _rp_remaining_need }}'
              expected_replacement_date: '{{ _rp_expected_replacement_date }}'
              months_remaining: '{{ _rp_months_remaining }}'
              monthly_reserve_needed: '{{ _rp_monthly_reserve }}'
              risk_flag: '{{ _rp_risk }}'
              early_death_scenario:
                months: '{{ _rp_early_months }}'
                date: "{{ '%04d-%02d-01' | format(_rp_early_y | int, _rp_early_m | int) }}"
                monthly_reserve_if_early: '{{ _rp_early_monthly }}'
              natural_language: >-
                {{ _rp_data.get('name', 'This asset') }} has {{ _rp_months_remaining }} months
                remaining. Replacement estimate: ${{ _rp_replacement_est }}.
                Current reserve: ${{ _rp_current_reserve }}.
                Monthly reserve needed: ${{ _rp_monthly_reserve }}.
                Risk: {{ _rp_risk }}.
      - stop: replacement plan done
        response_variable: final_response

    ###########################################################################
    # depreciable_asset_post_depreciation_period (T6)
    ###########################################################################
    - if: "{{ _mode == 'depreciable_asset_post_depreciation_period' }}"
      then:
      - variables:
          _post_period: "{{ period | default('') | string | trim }}"

      - if: "{{ _post_period == '' }}"
        then:
        - variables:
            final_response:
              status: error
              tool: '{{ tool_name }}'
              mode: depreciable_asset_post_depreciation_period
              code: period_required
              message: period (YYYY-MM) is required.
        - stop: period required
          response_variable: final_response

      # Get asset + schedule
      - action: script.zen_codex_finance_depreciation
        continue_on_error: true
        response_variable: _post_get_raw
        data:
          mode: depreciable_asset_get
          asset_id: "{{ _asset_id_raw }}"
          caller: "{{ _caller }}"

      - if: "{{ not (_post_get_raw is mapping and _post_get_raw.get('status') == 'ok') }}"
        then:
        - variables:
            final_response: "{{ _post_get_raw | default({'status': 'error', 'code': 'asset_not_found'}) }}"
        - stop: not found
          response_variable: final_response

      - variables:
          _post_asset: "{{ _post_get_raw.get('data', {}) }}"
          _post_asset_id: "{{ _post_asset.get('asset_id', 0) | int(0) }}"
          _post_method: "{{ _post_asset.get('depreciation_method', 'straight_line') | lower }}"

      - if: "{{ _post_method == 'manual_no_post' }}"
        then:
        - variables:
            final_response:
              status: error
              tool: '{{ tool_name }}'
              mode: depreciable_asset_post_depreciation_period
              code: method_does_not_post
              message: >-
                Asset uses manual_no_post depreciation method. Use
                depreciable_asset_book_value to see current paper value.
        - stop: method does not post
          response_variable: final_response

      - action: script.zen_codex_finance_depreciation
        continue_on_error: true
        response_variable: _post_sched_raw
        data:
          mode: depreciable_asset_calculate_schedule
          asset_id: "{{ _post_asset_id }}"
          caller: "{{ _caller }}"

      - variables:
          _post_sched: "{{ _post_sched_raw.get('schedule', []) if _post_sched_raw is mapping else [] }}"
          _post_row: >-
            {{ _post_sched | selectattr('period', 'equalto', _post_period) | list | first | default(none) }}

      - if: "{{ _post_row is none }}"
        then:
        - variables:
            final_response:
              status: error
              tool: '{{ tool_name }}'
              mode: depreciable_asset_post_depreciation_period
              code: period_not_in_schedule
              period: '{{ _post_period }}'
              message: >-
                Period {{ _post_period }} is not in this asset's depreciation schedule.
                Valid range: {{ _post_sched | map(attribute='period') | list | first | default('?') }}
                to {{ _post_sched | map(attribute='period') | list | last | default('?') }}.
        - stop: period not in schedule
          response_variable: final_response

      - variables:
          _post_idem_key: "{{ _post_row.get('idempotency_key', '') }}"
          _post_amount: "{{ _post_row.get('depreciation_amount', 0) | float(0) }}"

      # report_only or posting_mode check
      - if: "{{ _posting_mode == 'report_only' }}"
        then:
        - variables:
            final_response:
              status: ok
              tool: '{{ tool_name }}'
              mode: depreciable_asset_post_depreciation_period
              posting_mode: report_only
              would_post: true
              period: '{{ _post_period }}'
              amount: '{{ _post_amount }}'
              idempotency_key: '{{ _post_idem_key }}'
              schedule_row: '{{ _post_row }}'
              message: report_only — no Firefly write. Pass posting_mode=summary_post confirm=true to post.
        - stop: report only
          response_variable: final_response

      # T16: Check business-use allocation for this period (fail-soft)
      - action: script.zen_codex_finance_depreciation
        continue_on_error: true
        response_variable: _t16_alloc_raw
        data:
          mode: asset_allocation_get
          asset_id: "{{ _post_asset_id | string }}"
          period: "{{ _post_period }}"
          caller: "{{ _caller }}"

      - variables:
          _t16_alloc: >-
            {%- set r = _t16_alloc_raw if _t16_alloc_raw is mapping else {} -%}
            {{ r.get('effective_allocation') if r.get('found', false) else none }}
          _t16_biz_pct: >-
            {%- if _t16_alloc is mapping -%}{{ _t16_alloc.get('business_use_percent', 0) | float(0) }}{%- else -%}0{%- endif -%}
      - variables:
          _t16_biz_active: "{{ _t16_biz_pct | float(0) > 0 }}"
          _t16_biz_amt: "{{ (_post_amount | float(0) * (_t16_biz_pct | float(0)) / 100) | round(2) }}"
      - variables:
          _t16_hh_amt: "{{ (_post_amount | float(0) - _t16_biz_amt | float(0)) | round(2) }}"
          # Split uses distinct descriptions; legacy single-post uses original description
          _post_idem_desc: >-
            {{ ('Depreciation (household) — ' ~ _post_asset.get('name', '') ~ ' — ' ~ _post_period)
               if _t16_biz_active else
               ('Depreciation — ' ~ _post_asset.get('name', '') ~ ' — ' ~ _post_period) }}
          _t16_biz_desc: "Depreciation (business) — {{ _post_asset.get('name', '') }} — {{ _post_period }}"
          _post_txn_tags: "asset:{{ _post_asset_id }},depreciation,depreciable-asset,method:{{ _post_method }},period:{{ _post_period }},idempotency:{{ _post_idem_key }}"
          # Initialize post tracking vars
          _post_txn_ok: false
          _post_txn_id: ""
          _t16_biz_ok: true
          _t16_biz_txn_id: ""

      # Idempotency check — search by description (tag_is: unreliable with colons)
      - action: script.zen_dojotools_finance
        continue_on_error: true
        response_variable: _post_idem_check_raw
        data:
          mode: run
          case: transactions_search
          item: "{{ _post_idem_desc }}"
          start_date: "{{ _post_period }}-01"
          end_date: "{{ _post_period }}-28"
          per_page: 5

      - variables:
          _post_idem_txns: >-
            {%- set r = _post_idem_check_raw if _post_idem_check_raw is mapping else {} -%}
            {%- set result = r.get('result', {}) if r is mapping else {} -%}
            {%- set txns = result.get('transactions', []) if result is mapping else [] -%}
            {%- set ns = namespace(matches=[]) -%}
            {%- for t in txns if t is mapping -%}
              {%- if t.get('description', '') == _post_idem_desc -%}
                {%- set ns.matches = ns.matches + [t] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.matches }}
          _post_already_done: "{{ _post_idem_txns | length > 0 }}"

      - if: "{{ _post_already_done }}"
        then:
        - variables:
            final_response:
              status: already_posted
              tool: '{{ tool_name }}'
              mode: depreciable_asset_post_depreciation_period
              period: '{{ _post_period }}'
              idempotency_key: '{{ _post_idem_key }}'
              split_posting: '{{ _t16_biz_active }}'
              firefly_transaction_id: "{{ _post_idem_txns[0].get('id', '') if _post_idem_txns | length > 0 else '' }}"
              message: >-
                Period {{ _post_period }} already posted (idempotency key found in Firefly).
                Use compensate mode to reverse if needed.
        - stop: already posted
          response_variable: final_response

      # Confirm gate
      - if: "{{ not _confirm }}"
        then:
        - variables:
            final_response:
              status: confirm_required
              tool: '{{ tool_name }}'
              mode: depreciable_asset_post_depreciation_period
              period: '{{ _post_period }}'
              amount: '{{ _post_amount }}'
              posting_mode: summary_post
              idempotency_key: '{{ _post_idem_key }}'
              split_posting: '{{ _t16_biz_active }}'
              business_use_percent: '{{ _t16_biz_pct }}'
              household_amount: '{{ _t16_hh_amt if _t16_biz_active else _post_amount }}'
              business_amount: '{{ _t16_biz_amt if _t16_biz_active else 0 }}'
              description: "{{ _post_idem_desc }}"
              message: Pass confirm=true to post this depreciation transaction to Firefly.
        - stop: confirm required
          response_variable: final_response

      # dry_run gate
      - if: "{{ _dry_run }}"
        then:
        - variables:
            final_response:
              status: plan
              tool: '{{ tool_name }}'
              mode: depreciable_asset_post_depreciation_period
              period: '{{ _post_period }}'
              amount: '{{ _post_amount }}'
              split_posting: '{{ _t16_biz_active }}'
              household_amount: '{{ _t16_hh_amt if _t16_biz_active else _post_amount }}'
              business_amount: '{{ _t16_biz_amt if _t16_biz_active else 0 }}'
              idempotency_key: '{{ _post_idem_key }}'
              evidence:
                dry_run: true
                caller: '{{ _caller }}'
                timestamp: '{{ _now }}'
        - stop: dry run
          response_variable: final_response

      # Post to Firefly — single transaction (no allocation) or split (T16)
      - variables:
          _post_txn_notes: >-
            Asset: {{ _post_asset.get('name', '') }}
            Asset ID: {{ _post_asset_id }}
            Period: {{ _post_period }}
            Method: {{ _post_method }}
            Cost basis: {{ _post_asset.get('cost_basis', 0) }}
            Salvage value: {{ _post_asset.get('salvage_value', 0) }}
            Depreciation amount: {{ _post_amount }}
            {{ ('Business use: ' ~ _t16_biz_pct ~ '% ($' ~ _t16_biz_amt ~ ' biz / $' ~ _t16_hh_amt ~ ' hh)') if _t16_biz_active else '' }}
            Idempotency key: {{ _post_idem_key }}
            Calculated by ZenOS Friday. Firefly is ledger/reporting only.
            {{ ('Audit: ' ~ _audit_note) if _audit_note != '' else '' }}

      - if: "{{ _t16_biz_active }}"
        then:
        # Split path: post household portion
        - action: script.zen_dojotools_finance
          continue_on_error: true
          response_variable: _post_hh_raw
          data:
            mode: run
            case: transaction_add
            confirm: true
            transaction_type: withdrawal
            amount: "{{ _t16_hh_amt }}"
            description: "{{ _post_idem_desc }}"
            date: "{{ _post_period }}-01"
            source_account: "{{ _post_asset.get('firefly_asset_account_name', '') }}"
            category: Depreciation Expense
            tags: "{{ _post_txn_tags }},household-use"
            notes: "{{ _post_txn_notes }}"
        - variables:
            _post_txn_ok: "{{ _post_hh_raw is mapping and _post_hh_raw.get('status', '') in ['ok', 'success', 'created'] }}"
            _post_txn_id: "{{ (_post_hh_raw.get('result', {}).get('id', '') if _post_hh_raw is mapping else '') }}"
        # Post business portion
        - if: "{{ _post_txn_ok }}"
          then:
          - action: script.zen_dojotools_finance
            continue_on_error: true
            response_variable: _post_biz_raw
            data:
              mode: run
              case: transaction_add
              confirm: true
              transaction_type: withdrawal
              amount: "{{ _t16_biz_amt }}"
              description: "{{ _t16_biz_desc }}"
              date: "{{ _post_period }}-01"
              source_account: "{{ _post_asset.get('firefly_asset_account_name', '') }}"
              category: Business Depreciation Expense
              tags: "{{ _post_txn_tags }},business-use"
              notes: "{{ _post_txn_notes }}"
          - variables:
              _t16_biz_ok: "{{ _post_biz_raw is mapping and _post_biz_raw.get('status', '') in ['ok', 'success', 'created'] }}"
              _t16_biz_txn_id: "{{ (_post_biz_raw.get('result', {}).get('id', '') if _post_biz_raw is mapping else '') }}"
        else:
        # Single-post path (no allocation)
        - action: script.zen_dojotools_finance
          continue_on_error: true
          response_variable: _post_txn_raw
          data:
            mode: run
            case: transaction_add
            confirm: true
            transaction_type: withdrawal
            amount: "{{ _post_amount }}"
            description: "Depreciation — {{ _post_asset.get('name', '') }} — {{ _post_period }}"
            date: "{{ _post_period }}-01"
            source_account: "{{ _post_asset.get('firefly_asset_account_name', '') }}"
            category: Depreciation Expense
            tags: "{{ _post_txn_tags }}"
            notes: "{{ _post_txn_notes }}"
        - variables:
            _post_txn_ok: "{{ _post_txn_raw is mapping and _post_txn_raw.get('status', '') in ['ok', 'success', 'created'] }}"
            _post_txn_id: "{{ (_post_txn_raw.get('result', {}).get('id', '') if _post_txn_raw is mapping else '') }}"

      # Update last_depreciation_period_posted on asset
      - if: "{{ _post_txn_ok and _t16_biz_ok }}"
        then:
        - action: script.zen_dojotools_inventory
          continue_on_error: true
          response_variable: _post_update_raw
          data:
            mode: userentity_values_set
            entity: "{{ _grocy_entity }}"
            userobject_id: "{{ _post_asset_id }}"
            values_json: "{{ {'last_depreciation_period_posted': _post_period, 'updated_at': _now} | tojson }}"

      - variables:
          final_response:
            status: "{{ 'success' if _post_txn_ok and _t16_biz_ok else 'error' }}"
            tool: '{{ tool_name }}'
            mode: depreciable_asset_post_depreciation_period
            data:
              period: '{{ _post_period }}'
              amount: '{{ _post_amount }}'
              post_status: "{{ 'posted' if _post_txn_ok and _t16_biz_ok else 'error' }}"
              split_posting: '{{ _t16_biz_active }}'
              firefly_transaction_id: '{{ _post_txn_id }}'
              business_txn_id: '{{ _t16_biz_txn_id }}'
              household_amount: '{{ _t16_hh_amt if _t16_biz_active else _post_amount }}'
              business_amount: '{{ _t16_biz_amt if _t16_biz_active else 0 }}'
            evidence:
              idempotency_key: '{{ _post_idem_key }}'
              dry_run: false
              caller: '{{ _caller }}'
              timestamp: '{{ _now }}'
              mode: depreciable_asset_post_depreciation_period
              audit_note: "{{ _audit_note }}"
      - stop: post done
        response_variable: final_response

    ###########################################################################
    # depreciable_asset_dispose (T7)
    ###########################################################################
    - if: "{{ _mode == 'depreciable_asset_dispose' }}"
      then:
      - action: script.zen_codex_finance_depreciation
        continue_on_error: true
        response_variable: _disp_bv_raw
        data:
          mode: depreciable_asset_book_value
          asset_id: "{{ _asset_id_raw }}"
          caller: "{{ _caller }}"

      - if: "{{ not (_disp_bv_raw is mapping and _disp_bv_raw.get('status') == 'ok') }}"
        then:
        - variables:
            final_response: "{{ _disp_bv_raw | default({'status': 'error', 'code': 'asset_not_found'}) }}"
        - stop: not found
          response_variable: final_response

      - variables:
          _disp_asset: "{{ _disp_bv_raw.get('data', {}) }}"
          _disp_asset_id: "{{ _disp_asset.get('asset_id', 0) | int(0) }}"
          _disp_current_status: "{{ _disp_asset.get('status', 'active') | lower }}"

      - if: "{{ _disp_current_status != 'active' }}"
        then:
        - variables:
            final_response:
              status: error
              tool: '{{ tool_name }}'
              mode: depreciable_asset_dispose
              code: already_disposed
              current_status: '{{ _disp_current_status }}'
              message: "Asset status is '{{ _disp_current_status }}' — already disposed."
        - stop: already disposed
          response_variable: final_response

      - variables:
          _disp_disposal_type: "{{ _asset_data.get('disposal_type', 'retired') | lower }}"
          _disp_disposal_date: "{{ _asset_data.get('disposal_date', _today) }}"
          _disp_proceeds: "{{ _asset_data.get('disposal_proceeds', 0) | float(0) }}"
          _disp_book_value: "{{ _disp_asset.get('current_book_value', 0) | float(0) }}"
          _disp_gain_loss: "{{ (_disp_proceeds - _disp_book_value) | round(2) }}"
          _disp_idem_key: >-
            {{ _idem_key_in if _idem_key_in != '' else
               'depr:dispose:' ~ _disp_asset_id | string ~ ':' ~ _disp_disposal_date }}

      - if: "{{ _audit_note == '' and not _dry_run }}"
        then:
        - variables:
            final_response:
              status: error
              tool: '{{ tool_name }}'
              mode: depreciable_asset_dispose
              code: audit_note_required
              message: audit_note is required for dispose operations — provide a reason for disposal.
        - stop: audit note required
          response_variable: final_response

      - if: "{{ _dry_run }}"
        then:
        - variables:
            final_response:
              status: plan
              tool: '{{ tool_name }}'
              mode: depreciable_asset_dispose
              data:
                asset_id: '{{ _disp_asset_id }}'
                disposal_type: '{{ _disp_disposal_type }}'
                disposal_date: '{{ _disp_disposal_date }}'
                disposal_proceeds: '{{ _disp_proceeds }}'
                book_value_at_disposal: '{{ _disp_book_value }}'
                gain_or_loss: '{{ _disp_gain_loss }}'
              evidence:
                idempotency_key: '{{ _disp_idem_key }}'
                dry_run: true
                caller: '{{ _caller }}'
                timestamp: '{{ _now }}'
        - stop: dry run
          response_variable: final_response

      - if: "{{ not _confirm }}"
        then:
        - variables:
            final_response:
              status: confirm_required
              tool: '{{ tool_name }}'
              mode: depreciable_asset_dispose
              data:
                asset_id: '{{ _disp_asset_id }}'
                disposal_type: '{{ _disp_disposal_type }}'
                book_value_at_disposal: '{{ _disp_book_value }}'
                gain_or_loss: '{{ _disp_gain_loss }}'
              message: >-
                Pass confirm=true to mark this asset as {{ _disp_disposal_type }}.
                Gain/loss: ${{ _disp_gain_loss }}.
        - stop: confirm required
          response_variable: final_response

      # Execute disposal
      - variables:
          _disp_audit_line: "[{{ _today }}] DISPOSED by {{ _caller }}: {{ _audit_note }} | key:{{ _disp_idem_key }}"
          _disp_update_fields: >-
            {{ {'status': _disp_disposal_type, 'disposal_date': _disp_disposal_date,
                'disposal_proceeds': _disp_proceeds | string, 'updated_at': _now,
                'notes': ((_disp_asset.get('notes', '') ~ '\n') if _disp_asset.get('notes', '') != '' else '') ~ _disp_audit_line} }}

      - action: script.zen_dojotools_inventory
        continue_on_error: true
        response_variable: _disp_set_raw
        data:
          mode: userentity_values_set
          entity: "{{ _grocy_entity }}"
          userobject_id: "{{ _disp_asset_id }}"
          values_json: "{{ _disp_update_fields | tojson }}"

      - variables:
          _disp_ok: "{{ _disp_set_raw is mapping and _disp_set_raw.get('status', '') in ['ok', 'success'] }}"
          final_response:
            status: "{{ 'success' if _disp_ok else 'error' }}"
            tool: '{{ tool_name }}'
            mode: depreciable_asset_dispose
            data:
              asset_id: '{{ _disp_asset_id }}'
              disposal_type: '{{ _disp_disposal_type }}'
              disposal_date: '{{ _disp_disposal_date }}'
              book_value_at_disposal: '{{ _disp_book_value }}'
              disposal_proceeds: '{{ _disp_proceeds }}'
              gain_or_loss: '{{ _disp_gain_loss }}'
              natural_language: >-
                {{ _disp_asset.get('name', 'This asset') }} was {{ _disp_disposal_type }}.
                Book value at disposal: ${{ _disp_book_value }}.
                Proceeds: ${{ _disp_proceeds }}.
                {{ 'Gain' if _disp_gain_loss >= 0 else 'Loss' }}: ${{ _disp_gain_loss | abs }}.
            evidence:
              idempotency_key: '{{ _disp_idem_key }}'
              dry_run: false
              caller: '{{ _caller }}'
              timestamp: '{{ _now }}'
              mode: depreciable_asset_dispose
              audit_note: "{{ _audit_note }}"
      - stop: dispose done
        response_variable: final_response

    ###########################################################################
    # asset_allocation_create
    # Create a date-ranged allocation row for an asset.
    ###########################################################################
    - if: "{{ _mode == 'asset_allocation_create' }}"
      then:
      # Resolve allocation userentity ID
      - action: script.zen_dojotools_inventory
        continue_on_error: true
        response_variable: _alloc_ue_raw
        data:
          mode: userentities_list
      - variables:
          _alloc_ue_id: >-
            {%- set ues = _alloc_ue_raw.get('userentities', []) if _alloc_ue_raw is mapping else [] -%}
            {%- set ns = namespace(id=0) -%}
            {%- for ue in ues if ue is mapping -%}
              {%- if ue.get('name', '') == 'asset_allocation' -%}
                {%- set ns.id = ue.get('id', 0) | int(0) -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.id }}

      - if: "{{ _alloc_ue_id == 0 }}"
        then:
        - variables:
            final_response:
              status: error
              tool: '{{ tool_name }}'
              mode: asset_allocation_create
              code: setup_required
              message: >-
                userentity-asset_allocation not found in Grocy.
                Run depreciable_asset_firefly_setup or userfields_deploy to create it.
        - stop: allocation ue missing
          response_variable: final_response

      # Validate required
      - variables:
          _alloc_asset_id: "{{ _asset_data.get('asset_id', _asset_id_raw) | string | trim }}"
          _alloc_eff_date: "{{ _asset_data.get('effective_date', '') | string | trim }}"
          _alloc_biz_pct: "{{ _asset_data.get('business_use_percent', '') | string | trim }}"

      - if: "{{ _alloc_asset_id == '' or _alloc_eff_date == '' or _alloc_biz_pct == '' }}"
        then:
        - variables:
            final_response:
              status: error
              tool: '{{ tool_name }}'
              mode: asset_allocation_create
              code: missing_required_fields
              required: [asset_id, effective_date, business_use_percent]
              message: asset_id, effective_date, and business_use_percent are required.
        - stop: missing fields
          response_variable: final_response

      - if: "{{ _dry_run }}"
        then:
        - variables:
            final_response:
              status: plan
              tool: '{{ tool_name }}'
              mode: asset_allocation_create
              would_create:
                asset_id: '{{ _alloc_asset_id }}'
                effective_date: '{{ _alloc_eff_date }}'
                business_use_percent: '{{ _alloc_biz_pct }}'
              evidence:
                dry_run: true
                caller: '{{ _caller }}'
                timestamp: '{{ _now }}'
        - stop: dry run
          response_variable: final_response

      - if: "{{ not _confirm }}"
        then:
        - variables:
            final_response:
              status: confirm_required
              tool: '{{ tool_name }}'
              mode: asset_allocation_create
              preview:
                asset_id: '{{ _alloc_asset_id }}'
                effective_date: '{{ _alloc_eff_date }}'
                business_use_percent: '{{ _alloc_biz_pct }}'
              message: Pass confirm=true to create this allocation row.
        - stop: confirm required
          response_variable: final_response

      - action: script.zen_dojotools_inventory
        continue_on_error: true
        response_variable: _alloc_obj_raw
        data:
          mode: userobjects_create
          userentity_id: "{{ _alloc_ue_id }}"

      - variables:
          _alloc_obj_id: >-
            {{ _alloc_obj_raw.get('created_id', 0) | int(0) if _alloc_obj_raw is mapping else 0 }}

      - if: "{{ _alloc_obj_id == 0 }}"
        then:
        - variables:
            final_response:
              status: error
              tool: '{{ tool_name }}'
              mode: asset_allocation_create
              code: userobject_create_failed
              message: Failed to create Grocy userobject for asset_allocation.
        - stop: create failed
          response_variable: final_response

      - variables:
          _alloc_payload: >-
            {{ _asset_data | combine({
              'asset_id': _alloc_asset_id,
              'effective_date': _alloc_eff_date,
              'created_by': _caller,
              'created_at': _now,
              'updated_at': _now
            }) }}

      - action: script.zen_dojotools_inventory
        continue_on_error: true
        response_variable: _alloc_vals_raw
        data:
          mode: userentity_values_set
          entity: userentity-asset_allocation
          userobject_id: "{{ _alloc_obj_id }}"
          values_json: "{{ _alloc_payload | tojson }}"

      - variables:
          final_response:
            status: "{{ 'success' if (_alloc_vals_raw is mapping and _alloc_vals_raw.get('status','') in ['ok','success']) else 'error' }}"
            tool: '{{ tool_name }}'
            mode: asset_allocation_create
            data:
              allocation_id: '{{ _alloc_obj_id }}'
              asset_id: '{{ _alloc_asset_id }}'
              effective_date: '{{ _alloc_eff_date }}'
              business_use_percent: '{{ _alloc_biz_pct }}'
            evidence:
              dry_run: false
              caller: '{{ _caller }}'
              timestamp: '{{ _now }}'
              audit_note: '{{ _audit_note }}'
      - stop: allocation create done
        response_variable: final_response

    ###########################################################################
    # asset_allocation_list
    # List all allocation rows for an asset (full history).
    ###########################################################################
    - if: "{{ _mode == 'asset_allocation_list' }}"
      then:
      - action: script.zen_dojotools_inventory
        continue_on_error: true
        response_variable: _alist_ue_raw
        data:
          mode: userentities_list
      - variables:
          _alist_ue_id: >-
            {%- set ues = _alist_ue_raw.get('userentities', []) if _alist_ue_raw is mapping else [] -%}
            {%- set ns = namespace(id=0) -%}
            {%- for ue in ues if ue is mapping -%}
              {%- if ue.get('name', '') == 'asset_allocation' -%}{%- set ns.id = ue.get('id', 0) | int(0) -%}{%- endif -%}
            {%- endfor -%}
            {{ ns.id }}
          _alist_filter_id: "{{ _asset_id_raw | string | trim }}"

      - if: "{{ _alist_ue_id == 0 }}"
        then:
        - variables:
            final_response:
              status: error
              tool: '{{ tool_name }}'
              mode: asset_allocation_list
              code: setup_required
              message: userentity-asset_allocation not found. Run depreciable_asset_firefly_setup.
        - stop: ue missing
          response_variable: final_response

      - action: script.zen_dojotools_inventory
        continue_on_error: true
        response_variable: _alist_objs_raw
        data:
          mode: userobjects_list
          userentity_id: "{{ _alist_ue_id }}"

      - variables:
          _alist_objs: "{{ _alist_objs_raw.get('userobjects', []) if _alist_objs_raw is mapping else [] }}"
          _alist_rows: []

      - repeat:
          for_each: "{{ _alist_objs }}"
          sequence:
          - action: script.zen_dojotools_inventory
            continue_on_error: true
            response_variable: _alist_vals_raw
            data:
              mode: userentity_values_get
              entity: userentity-asset_allocation
              userobject_id: "{{ repeat.item.get('id', 0) }}"
          - variables:
              _alist_vals: "{{ _alist_vals_raw.get('values', {}) if _alist_vals_raw is mapping else {} }}"
          - if: "{{ _alist_filter_id == '' or (_alist_vals.get('asset_id', '') | string | trim) == (_alist_filter_id | string | trim) }}"
            then:
            - variables:
                _alist_rows: >-
                  {{ _alist_rows + [_alist_vals | combine({'allocation_id': repeat.item.get('id', 0)})] }}

      - variables:
          final_response:
            status: ok
            tool: '{{ tool_name }}'
            mode: asset_allocation_list
            asset_id: '{{ _alist_filter_id }}'
            count: '{{ _alist_rows | length }}'
            allocations: '{{ _alist_rows | sort(attribute="effective_date", reverse=true) }}'
      - stop: allocation list done
        response_variable: final_response

    ###########################################################################
    # asset_allocation_get
    # Get the current effective allocation row for an asset (as of today).
    # Pass period=YYYY-MM-DD to resolve as of a specific date instead.
    ###########################################################################
    - if: "{{ _mode == 'asset_allocation_get' }}"
      then:
      - action: script.zen_codex_finance_depreciation
        continue_on_error: true
        response_variable: _aget_list_raw
        data:
          mode: asset_allocation_list
          asset_id: "{{ _asset_id_raw }}"
          caller: "{{ _caller }}"

      - variables:
          _aget_as_of: "{{ period if (period | default('') | trim) != '' else _today }}"
          _aget_rows: "{{ _aget_list_raw.get('allocations', []) if _aget_list_raw is mapping else [] }}"
          _aget_effective: >-
            {%- set ns = namespace(row=none) -%}
            {%- set _as_of_ym = _aget_as_of[:7] -%}
            {%- for row in _aget_rows | sort(attribute='effective_date') if row is mapping -%}
              {%- if (row.get('effective_date', '') | string)[:7] <= _as_of_ym -%}
                {%- set end = row.get('end_date', '') | string | trim -%}
                {%- if end == '' or end == 'None' or end[:7] >= _as_of_ym -%}
                  {%- set ns.row = row -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.row }}

      - variables:
          final_response:
            status: ok
            tool: '{{ tool_name }}'
            mode: asset_allocation_get
            asset_id: '{{ _asset_id_raw }}'
            as_of: '{{ _aget_as_of }}'
            effective_allocation: '{{ _aget_effective }}'
            found: "{{ _aget_effective is not none and _aget_effective is mapping }}"
      - stop: allocation get done
        response_variable: final_response

    ###########################################################################
    # asset_allocation_update
    # Update fields on an existing allocation row by allocation_id.
    # Pass asset_id=<allocation_object_id> (the allocation row ID, not asset).
    ###########################################################################
    - if: "{{ _mode == 'asset_allocation_update' }}"
      then:
      - variables:
          _aupd_id: "{{ _asset_id_raw | int(0) }}"

      - if: "{{ _aupd_id == 0 }}"
        then:
        - variables:
            final_response:
              status: error
              tool: '{{ tool_name }}'
              mode: asset_allocation_update
              code: allocation_id_required
              message: Pass asset_id=<allocation_row_id> (the userobject ID of the allocation row to update).
        - stop: id required
          response_variable: final_response

      - if: "{{ not _confirm }}"
        then:
        - variables:
            final_response:
              status: confirm_required
              tool: '{{ tool_name }}'
              mode: asset_allocation_update
              allocation_id: '{{ _aupd_id }}'
              would_update: '{{ _asset_data }}'
              message: Pass confirm=true to apply this update.
        - stop: confirm required
          response_variable: final_response

      - variables:
          _aupd_payload: "{{ _asset_data | combine({'updated_at': _now}) }}"

      - action: script.zen_dojotools_inventory
        continue_on_error: true
        response_variable: _aupd_raw
        data:
          mode: userentity_values_set
          entity: userentity-asset_allocation
          userobject_id: "{{ _aupd_id }}"
          values_json: "{{ _aupd_payload | tojson }}"

      - variables:
          final_response:
            status: "{{ 'success' if (_aupd_raw is mapping and _aupd_raw.get('status','') in ['ok','success']) else 'error' }}"
            tool: '{{ tool_name }}'
            mode: asset_allocation_update
            data:
              allocation_id: '{{ _aupd_id }}'
              fields_updated: '{{ _asset_data.keys() | list }}'
            evidence:
              dry_run: false
              caller: '{{ _caller }}'
              timestamp: '{{ _now }}'
              audit_note: '{{ _audit_note }}'
      - stop: allocation update done
        response_variable: final_response

    ###########################################################################
    # depreciable_asset_report (T8)
    ###########################################################################
    - if: "{{ _mode == 'depreciable_asset_report' }}"
      then:
      - action: script.zen_codex_finance_depreciation
        continue_on_error: true
        response_variable: _rep_list_raw
        data:
          mode: depreciable_asset_list
          caller: "{{ _caller }}"

      - variables:
          _rep_assets: >-
            {%- set all = _rep_list_raw.get('assets', []) if _rep_list_raw is mapping else [] -%}
            {%- set ns = namespace(ok=[]) -%}
            {%- for a in all if a is mapping and a.get('name') is not none and a.get('cost_basis') is not none -%}
              {%- set ns.ok = ns.ok + [a] -%}
            {%- endfor -%}
            {{ ns.ok }}
          _rep_rows: []
          _rep_total_cost: 0.0
          _rep_total_bv: 0.0
          _rep_total_replacement: 0.0
          _rep_high_risk: []

      - repeat:
          for_each: "{{ _rep_assets }}"
          sequence:
          - action: script.zen_codex_finance_depreciation
            continue_on_error: true
            response_variable: _rep_bv_raw
            data:
              mode: depreciable_asset_book_value
              asset_id: "{{ repeat.item.get('asset_id', 0) | string }}"
              caller: "{{ _caller }}"
          - variables:
              _rep_bv: "{{ _rep_bv_raw.get('data', {}) if _rep_bv_raw is mapping else {} }}"
          - variables:
              _rep_cost_i: "{{ (_rep_bv or {}).get('cost_basis', 0) | float(0) }}"
              _rep_bv_i: "{{ (_rep_bv or {}).get('current_book_value', 0) | float(0) }}"
              _rep_repl_i: "{{ repeat.item.get('replacement_cost_estimate', 0) | float(0) }}"
          - variables:
              _rep_row:
                asset_id: "{{ repeat.item.get('asset_id', 0) }}"
                name: "{{ repeat.item.get('name', '') }}"
                room_anchor: "{{ repeat.item.get('room_anchor', '') }}"
                status: "{{ repeat.item.get('status', 'active') }}"
                cost_basis: '{{ _rep_cost_i }}'
                current_book_value: '{{ _rep_bv_i }}'
                accumulated_depreciation: "{{ (_rep_cost_i - _rep_bv_i) | round(2) }}"
                replacement_estimate: '{{ _rep_repl_i }}'
                periods_posted: "{{ (_rep_bv or {}).get('periods_posted', 0) }}"
                total_periods: "{{ (_rep_bv or {}).get('total_periods', 0) }}"
                tax_context: "{{ repeat.item.get('tax_context', '') }}"
                tax_review_status: "{{ repeat.item.get('tax_review_status', 'unreviewed') }}"
          - variables:
              _rep_total_cost: "{{ (_rep_total_cost | float + _rep_cost_i) | round(2) }}"
              _rep_total_bv: "{{ (_rep_total_bv | float + _rep_bv_i) | round(2) }}"
              _rep_total_replacement: "{{ (_rep_total_replacement | float + _rep_repl_i) | round(2) }}"
              _rep_rows: "{{ _rep_rows + [_rep_row] }}"

      - variables:
          final_response:
            status: ok
            tool: '{{ tool_name }}'
            mode: depreciable_asset_report
            generated_at: '{{ _now }}'
            assets: '{{ _rep_rows }}'
            aggregate:
              total_assets: '{{ _rep_rows | length }}'
              total_cost_basis: '{{ _rep_total_cost }}'
              total_book_value: '{{ _rep_total_bv }}'
              total_accumulated_depreciation: "{{ (_rep_total_cost - _rep_total_bv) | round(2) }}"
              total_replacement_exposure: '{{ _rep_total_replacement }}'
      - stop: report done
        response_variable: final_response

    ###########################################################################
    # depreciable_asset_post_due_depreciation (T10)
    # Batch: post prior-month depreciation for all active assets.
    # Derives period = previous calendar month.
    ###########################################################################
    - if: "{{ _mode == 'depreciable_asset_post_due_depreciation' }}"
      then:
      - variables:
          _pdd_month: "{{ now().month }}"
          _pdd_year: "{{ now().year }}"
      - variables:
          _pdd_period: >-
            {%- set m = _pdd_month | int -%}
            {%- set y = _pdd_year | int -%}
            {%- if m == 1 -%}{{ '%04d-%02d' | format(y - 1, 12) }}
            {%- else -%}{{ '%04d-%02d' | format(y, m - 1) }}{%- endif -%}
      - action: script.zen_codex_finance_depreciation
        continue_on_error: true
        response_variable: _pdd_list_raw
        data:
          mode: depreciable_asset_list
          caller: "{{ _caller }}"
      - variables:
          _pdd_assets: >-
            {%- set all = _pdd_list_raw.get('assets', []) if _pdd_list_raw is mapping else [] -%}
            {{ all | selectattr('status', 'equalto', 'active') | list }}
          _pdd_posted: []
          _pdd_already: []
          _pdd_skipped: []
          _pdd_errors: []
      - repeat:
          for_each: "{{ _pdd_assets }}"
          sequence:
          - action: script.zen_codex_finance_depreciation
            continue_on_error: true
            response_variable: _pdd_post_raw
            data:
              mode: depreciable_asset_post_depreciation_period
              asset_id: "{{ repeat.item.get('asset_id', 0) | string }}"
              period: "{{ _pdd_period }}"
              posting_mode: "{{ _posting_mode if _posting_mode != 'report_only' else 'summary_post' }}"
              confirm: "{{ _confirm }}"
              dry_run: "{{ _dry_run }}"
              caller: "{{ _caller }}"
              audit_note: "{{ _audit_note if _audit_note != '' else 'batch post via depreciable_asset_post_due_depreciation' }}"
          - variables:
              _pdd_r: "{{ _pdd_post_raw if _pdd_post_raw is mapping else {} }}"
              _pdd_r_status: "{{ _pdd_r.get('status', 'error') }}"
              _pdd_r_code: "{{ _pdd_r.get('code', '') }}"
              _pdd_r_name: "{{ repeat.item.get('name', repeat.item.get('asset_id', '?') | string) }}"
          - variables:
              _pdd_posted: >-
                {%- if _pdd_r_status in ['ok', 'success'] and _pdd_r_code != 'already_posted' -%}
                  {{ _pdd_posted + [{'asset_id': repeat.item.get('asset_id'), 'name': _pdd_r_name, 'period': _pdd_period}] }}
                {%- else -%}{{ _pdd_posted }}{%- endif -%}
              _pdd_already: >-
                {%- if _pdd_r_code == 'already_posted' -%}
                  {{ _pdd_already + [{'asset_id': repeat.item.get('asset_id'), 'name': _pdd_r_name}] }}
                {%- else -%}{{ _pdd_already }}{%- endif -%}
              _pdd_skipped: >-
                {%- if _pdd_r_code in ['method_does_not_post', 'confirm_required'] -%}
                  {{ _pdd_skipped + [{'asset_id': repeat.item.get('asset_id'), 'name': _pdd_r_name, 'reason': _pdd_r_code}] }}
                {%- else -%}{{ _pdd_skipped }}{%- endif -%}
              _pdd_errors: >-
                {%- if _pdd_r_status not in ['ok', 'success'] and _pdd_r_code not in ['already_posted', 'method_does_not_post', 'confirm_required'] -%}
                  {{ _pdd_errors + [{'asset_id': repeat.item.get('asset_id'), 'name': _pdd_r_name, 'error': _pdd_r_code or _pdd_r_status}] }}
                {%- else -%}{{ _pdd_errors }}{%- endif -%}
      - variables:
          final_response:
            status: ok
            tool: '{{ tool_name }}'
            mode: depreciable_asset_post_due_depreciation
            period: '{{ _pdd_period }}'
            dry_run: '{{ _dry_run }}'
            confirm: '{{ _confirm }}'
            posted: '{{ _pdd_posted }}'
            already_posted: '{{ _pdd_already }}'
            skipped: '{{ _pdd_skipped }}'
            errors: '{{ _pdd_errors }}'
            summary:
              total_assets: '{{ _pdd_assets | length }}'
              posted_count: '{{ _pdd_posted | length }}'
              already_posted_count: '{{ _pdd_already | length }}'
              skipped_count: '{{ _pdd_skipped | length }}'
              error_count: '{{ _pdd_errors | length }}'
      - stop: post_due_depreciation done
        response_variable: final_response

    ###########################################################################
    # depreciable_asset_sync_piggy_reserves (T11)
    # Update Firefly piggy bank targets from replacement_plan calculations.
    ###########################################################################
    - if: "{{ _mode == 'depreciable_asset_sync_piggy_reserves' }}"
      then:
      - action: script.zen_codex_finance_depreciation
        continue_on_error: true
        response_variable: _spr_list_raw
        data:
          mode: depreciable_asset_list
          caller: "{{ _caller }}"
      - variables:
          _spr_all: >-
            {%- set all = _spr_list_raw.get('assets', []) if _spr_list_raw is mapping else [] -%}
            {{ all | selectattr('status', 'equalto', 'active') | list }}
          _spr_with_piggy: >-
            {%- set ns = namespace(out=[]) -%}
            {%- for a in _spr_all if a is mapping and a.get('firefly_replacement_piggy_bank_id', '') | string | trim not in ['', '0', 'None', 'none'] -%}
              {%- set ns.out = ns.out + [a] -%}
            {%- endfor -%}
            {{ ns.out }}
          _spr_synced: []
          _spr_errors: []
      - repeat:
          for_each: "{{ _spr_with_piggy }}"
          sequence:
          - action: script.zen_codex_finance_depreciation
            continue_on_error: true
            response_variable: _spr_plan_raw
            data:
              mode: depreciable_asset_replacement_plan
              asset_id: "{{ repeat.item.get('asset_id', 0) | string }}"
              caller: "{{ _caller }}"
          - variables:
              _spr_plan: "{{ _spr_plan_raw.get('data', {}) if _spr_plan_raw is mapping else {} }}"
              _spr_target: "{{ (_spr_plan.get('replacement_cost_estimate', 0) | float(0)) | round(2) }}"
              _spr_piggy_id: "{{ repeat.item.get('firefly_replacement_piggy_bank_id', '') | string | trim }}"
              _spr_name: "{{ repeat.item.get('name', repeat.item.get('asset_id', '?') | string) }}"
          - if: "{{ _spr_target > 0 and _spr_piggy_id != '' }}"
            then:
            - action: script.zen_dojotools_finance
              continue_on_error: true
              response_variable: _spr_upd_raw
              data:
                mode: run
                case: piggybank_update
                item: "{{ _spr_piggy_id }}"
                piggybank_target: "{{ _spr_target }}"
                confirm: "{{ _confirm }}"
                notes: "Replacement reserve sync — {{ _spr_name }}. Monthly reserve: {{ _spr_plan.get('monthly_reserve', 0) | round(2) }}"
            - variables:
                _spr_ok: "{{ _spr_upd_raw is mapping and _spr_upd_raw.get('status', '') in ['ok', 'success'] }}"
            - variables:
                _spr_synced: >-
                  {%- if _spr_ok -%}
                    {{ _spr_synced + [{'asset_id': repeat.item.get('asset_id'), 'name': _spr_name, 'piggy_id': _spr_piggy_id, 'new_target': _spr_target}] }}
                  {%- else -%}{{ _spr_synced }}{%- endif -%}
                _spr_errors: >-
                  {%- if not _spr_ok -%}
                    {{ _spr_errors + [{'asset_id': repeat.item.get('asset_id'), 'name': _spr_name, 'error': (_spr_upd_raw.get('message', 'piggybank_update failed') if _spr_upd_raw is mapping else 'no response')}] }}
                  {%- else -%}{{ _spr_errors }}{%- endif -%}
      - variables:
          final_response:
            status: ok
            tool: '{{ tool_name }}'
            mode: depreciable_asset_sync_piggy_reserves
            dry_run: '{{ _dry_run }}'
            confirm: '{{ _confirm }}'
            synced: '{{ _spr_synced }}'
            errors: '{{ _spr_errors }}'
            summary:
              eligible_assets: '{{ _spr_with_piggy | length }}'
              synced_count: '{{ _spr_synced | length }}'
              error_count: '{{ _spr_errors | length }}'
      - stop: sync_piggy_reserves done
        response_variable: final_response

    ###########################################################################
    # depreciable_asset_report_by_project (T12)
    # Cost basis + book value + exposure grouped by project_id.
    ###########################################################################
    - if: "{{ _mode == 'depreciable_asset_report_by_project' }}"
      then:
      - if: "{{ _project_id == '' }}"
        then:
        - variables:
            final_response:
              status: error
              tool: '{{ tool_name }}'
              mode: depreciable_asset_report_by_project
              code: project_id_required
              message: project_id field is required for depreciable_asset_report_by_project.
        - stop: project_id required
          response_variable: final_response
      - action: script.zen_codex_finance_depreciation
        continue_on_error: true
        response_variable: _rbp_rep_raw
        data:
          mode: depreciable_asset_report
          caller: "{{ _caller }}"
      - variables:
          _rbp_all: "{{ _rbp_rep_raw.get('assets', []) if _rbp_rep_raw is mapping else [] }}"
          _rbp_rows: >-
            {%- set ns = namespace(out=[]) -%}
            {%- for a in _rbp_all if a is mapping and a.get('project_id', '') | string | trim | lower == _project_id | lower -%}
              {%- set ns.out = ns.out + [a] -%}
            {%- endfor -%}
            {{ ns.out }}
          _rbp_total_cost: >-
            {{ _rbp_rows | map(attribute='cost_basis') | map('float', 0) | sum | round(2) }}
          _rbp_total_bv: >-
            {{ _rbp_rows | map(attribute='current_book_value') | map('float', 0) | sum | round(2) }}
          _rbp_total_repl: >-
            {{ _rbp_rows | map(attribute='replacement_estimate') | map('float', 0) | sum | round(2) }}
      - variables:
          final_response:
            status: ok
            tool: '{{ tool_name }}'
            mode: depreciable_asset_report_by_project
            project_id: '{{ _project_id }}'
            generated_at: '{{ _now }}'
            assets: '{{ _rbp_rows }}'
            aggregate:
              total_assets: '{{ _rbp_rows | length }}'
              total_cost_basis: '{{ _rbp_total_cost }}'
              total_book_value: '{{ _rbp_total_bv }}'
              total_accumulated_depreciation: "{{ (_rbp_total_cost - _rbp_total_bv) | round(2) }}"
              total_replacement_exposure: '{{ _rbp_total_repl }}'
      - stop: report_by_project done
        response_variable: final_response

    ###########################################################################
    # depreciable_asset_report_by_room (T13)
    # Cost basis + book value + exposure grouped by room_anchor.
    ###########################################################################
    - if: "{{ _mode == 'depreciable_asset_report_by_room' }}"
      then:
      - if: "{{ _room_anchor == '' }}"
        then:
        - variables:
            final_response:
              status: error
              tool: '{{ tool_name }}'
              mode: depreciable_asset_report_by_room
              code: room_anchor_required
              message: room_anchor field is required for depreciable_asset_report_by_room.
        - stop: room_anchor required
          response_variable: final_response
      - action: script.zen_codex_finance_depreciation
        continue_on_error: true
        response_variable: _rbr_rep_raw
        data:
          mode: depreciable_asset_report
          caller: "{{ _caller }}"
      - variables:
          _rbr_all: "{{ _rbr_rep_raw.get('assets', []) if _rbr_rep_raw is mapping else [] }}"
          _rbr_rows: >-
            {%- set ns = namespace(out=[]) -%}
            {%- for a in _rbr_all if a is mapping and a.get('room_anchor', '') | string | trim | lower == _room_anchor -%}
              {%- set ns.out = ns.out + [a] -%}
            {%- endfor -%}
            {{ ns.out }}
          _rbr_total_cost: >-
            {{ _rbr_rows | map(attribute='cost_basis') | map('float', 0) | sum | round(2) }}
          _rbr_total_bv: >-
            {{ _rbr_rows | map(attribute='current_book_value') | map('float', 0) | sum | round(2) }}
          _rbr_total_repl: >-
            {{ _rbr_rows | map(attribute='replacement_estimate') | map('float', 0) | sum | round(2) }}
      - variables:
          final_response:
            status: ok
            tool: '{{ tool_name }}'
            mode: depreciable_asset_report_by_room
            room_anchor: '{{ _room_anchor }}'
            generated_at: '{{ _now }}'
            assets: '{{ _rbr_rows }}'
            aggregate:
              total_assets: '{{ _rbr_rows | length }}'
              total_cost_basis: '{{ _rbr_total_cost }}'
              total_book_value: '{{ _rbr_total_bv }}'
              total_accumulated_depreciation: "{{ (_rbr_total_cost - _rbr_total_bv) | round(2) }}"
              total_replacement_exposure: '{{ _rbr_total_repl }}'
      - stop: report_by_room done
        response_variable: final_response

    ###########################################################################
    # depreciable_asset_attach (T17a)
    # Append a Paperless or Grocy reference to attachment_refs on the asset.
    ###########################################################################
    - if: "{{ _mode == 'depreciable_asset_attach' }}"
      then:
      - action: script.zen_codex_finance_depreciation
        continue_on_error: true
        response_variable: _att_get_raw
        data:
          mode: depreciable_asset_get
          asset_id: "{{ _asset_id_raw }}"
          caller: "{{ _caller }}"

      - if: "{{ not (_att_get_raw is mapping and _att_get_raw.get('status') == 'ok') }}"
        then:
        - variables:
            final_response: "{{ _att_get_raw | default({'status': 'error', 'code': 'asset_not_found'}) }}"
        - stop: not found
          response_variable: final_response

      - variables:
          _att_asset: "{{ _att_get_raw.get('data', {}) }}"
          _att_asset_id: "{{ _att_asset.get('asset_id', 0) | int(0) }}"
          _att_type: "{{ _asset_data.get('attachment_type', '') | lower | trim }}"
          _att_id: "{{ _asset_data.get('attachment_id', '') | string | trim }}"
          _att_label: "{{ _asset_data.get('attachment_label', '') | string | trim }}"

      - if: "{{ _att_type not in ['paperless', 'grocy'] or _att_id == '' }}"
        then:
        - variables:
            final_response:
              status: error
              tool: '{{ tool_name }}'
              mode: depreciable_asset_attach
              code: invalid_attachment
              message: attachment_type (paperless or grocy) and attachment_id are required in asset_data.
        - stop: invalid attachment
          response_variable: final_response

      - if: "{{ not _confirm and not _dry_run }}"
        then:
        - variables:
            final_response:
              status: confirm_required
              tool: '{{ tool_name }}'
              mode: depreciable_asset_attach
              data:
                asset_id: '{{ _att_asset_id }}'
                attachment_type: '{{ _att_type }}'
                attachment_id: '{{ _att_id }}'
                attachment_label: '{{ _att_label }}'
              message: Pass confirm=true to append this attachment reference.
        - stop: confirm required
          response_variable: final_response

      - variables:
          _att_existing_raw: "{{ _att_asset.get('attachment_refs', '') | string | trim }}"
          _att_existing: >-
            {%- set v = _att_existing_raw -%}
            {%- if v is sequence and v is not string -%}{{ v }}
            {%- elif v is string and v not in ['', 'null', 'None', '[]'] -%}{{ v | from_json(none) or [] }}
            {%- else -%}[]{%- endif -%}
          _att_new_ref:
            type: '{{ _att_type }}'
            id: '{{ _att_id }}'
            label: '{{ _att_label }}'
            added_at: '{{ _today }}'

      - if: "{{ _dry_run }}"
        then:
        - variables:
            final_response:
              status: plan
              tool: '{{ tool_name }}'
              mode: depreciable_asset_attach
              data:
                asset_id: '{{ _att_asset_id }}'
                would_append: '{{ _att_new_ref }}'
                current_count: '{{ _att_existing | length }}'
              evidence:
                dry_run: true
                caller: '{{ _caller }}'
                timestamp: '{{ _now }}'
        - stop: dry run
          response_variable: final_response

      - variables:
          _att_updated_refs: "{{ (_att_existing if _att_existing is sequence else []) + [_att_new_ref] }}"

      - action: script.zen_dojotools_inventory
        continue_on_error: true
        response_variable: _att_set_raw
        data:
          mode: userentity_values_set
          entity: "{{ _grocy_entity }}"
          userobject_id: "{{ _att_asset_id }}"
          values_json: "{{ {'attachment_refs': _att_updated_refs | tojson, 'updated_at': _now} | tojson }}"

      - variables:
          _att_ok: "{{ _att_set_raw is mapping and _att_set_raw.get('status', '') in ['ok', 'success'] }}"
          final_response:
            status: "{{ 'success' if _att_ok else 'error' }}"
            tool: '{{ tool_name }}'
            mode: depreciable_asset_attach
            data:
              asset_id: '{{ _att_asset_id }}'
              attachment_type: '{{ _att_type }}'
              attachment_id: '{{ _att_id }}'
              attachment_label: '{{ _att_label }}'
              total_attachments: '{{ _att_updated_refs | length }}'
            evidence:
              dry_run: false
              caller: '{{ _caller }}'
              timestamp: '{{ _now }}'
              audit_note: "{{ _audit_note }}"
      - stop: attach done
        response_variable: final_response

    ###########################################################################
    # depreciable_asset_attachments_get (T17b)
    # Returns parsed attachment_refs list for an asset.
    ###########################################################################
    - if: "{{ _mode == 'depreciable_asset_attachments_get' }}"
      then:
      - action: script.zen_codex_finance_depreciation
        continue_on_error: true
        response_variable: _attg_get_raw
        data:
          mode: depreciable_asset_get
          asset_id: "{{ _asset_id_raw }}"
          caller: "{{ _caller }}"

      - if: "{{ not (_attg_get_raw is mapping and _attg_get_raw.get('status') == 'ok') }}"
        then:
        - variables:
            final_response: "{{ _attg_get_raw | default({'status': 'error', 'code': 'asset_not_found'}) }}"
        - stop: not found
          response_variable: final_response

      - variables:
          _attg_asset: "{{ _attg_get_raw.get('data', {}) }}"
          _attg_asset_id: "{{ _attg_asset.get('asset_id', 0) | int(0) }}"
          _attg_refs_raw: "{{ _attg_asset.get('attachment_refs', '') | string | trim }}"
          _attg_refs: >-
            {%- set v = _attg_refs_raw -%}
            {%- if v is sequence and v is not string -%}{{ v }}
            {%- elif v is string and v not in ['', 'null', 'None', '[]'] -%}{{ v | from_json(none) or [] }}
            {%- else -%}[]{%- endif -%}

      - variables:
          final_response:
            status: ok
            tool: '{{ tool_name }}'
            mode: depreciable_asset_attachments_get
            data:
              asset_id: '{{ _attg_asset_id }}'
              name: "{{ _attg_asset.get('name', '') }}"
              attachment_count: '{{ _attg_refs | length }}'
              attachments: '{{ _attg_refs }}'
            evidence:
              caller: '{{ _caller }}'
              timestamp: '{{ _now }}'
      - stop: attachments_get done
        response_variable: final_response

    ###########################################################################
    # depreciable_asset_warranty_check (T18)
    # Classifies active assets by warranty_expiration: expired / expiring_soon / ok.
    ###########################################################################
    - if: "{{ _mode in ['depreciable_asset_warranty_check', 'depreciable_asset_warranty_report'] }}"
      then:
      - action: script.zen_codex_finance_depreciation
        continue_on_error: true
        response_variable: _wc_list_raw
        data:
          mode: depreciable_asset_list
          caller: "{{ _caller }}"

      - if: "{{ not (_wc_list_raw is mapping and _wc_list_raw.get('status') in ['ok', 'success']) }}"
        then:
        - variables:
            final_response: "{{ _wc_list_raw | default({'status': 'error', 'code': 'list_failed'}) }}"
        - stop: list failed
          response_variable: final_response

      - variables:
          _wc_assets: "{{ _wc_list_raw.get('assets', []) }}"
          _wc_threshold: "{{ _asset_data.get('days_threshold', 90) | int(90) }}"
          # Threshold date = today + days_threshold (integer day arithmetic)
          _wc_threshold_date: >-
            {%- set _td = _today.split('-') -%}
            {%- set _ty = _td[0] | int -%}
            {%- set _tm = _td[1] | int -%}
            {%- set _td2 = _td[2] | int -%}
            {%- set _threshold_days = _wc_threshold | int -%}
            {%- set _total_days = _td2 + _threshold_days -%}
            {%- set _days_in_month = [31, 28 if _ty % 4 != 0 else 29, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31] -%}
            {%- set ns = namespace(y=_ty, m=_tm, d=_total_days) -%}
            {%- for _ in range(6) -%}
              {%- if ns.d > _days_in_month[ns.m - 1] -%}
                {%- set ns.d = ns.d - _days_in_month[ns.m - 1] -%}
                {%- set ns.m = ns.m + 1 -%}
                {%- if ns.m > 12 -%}{%- set ns.m = 1 -%}{%- set ns.y = ns.y + 1 -%}{%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {{ '%04d-%02d-%02d' | format(ns.y, ns.m, ns.d) }}

      - variables:
          _wc_expired: >-
            {%- set ns = namespace(rows=[]) -%}
            {%- for a in _wc_assets if a is mapping -%}
              {%- set _w = a.get('warranty_expiration', '') | string | trim -%}
              {%- if _w != '' and a.get('status', 'active') == 'active' and _w < _today -%}
                {%- set ns.rows = ns.rows + [{'asset_id': a.get('asset_id', ''), 'name': a.get('name', ''), 'warranty_expiration': _w, 'classification': 'expired'}] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.rows }}
          _wc_expiring_soon: >-
            {%- set ns = namespace(rows=[]) -%}
            {%- for a in _wc_assets if a is mapping -%}
              {%- set _w = a.get('warranty_expiration', '') | string | trim -%}
              {%- if _w != '' and a.get('status', 'active') == 'active' and _w >= _today and _w <= _wc_threshold_date -%}
                {%- set ns.rows = ns.rows + [{'asset_id': a.get('asset_id', ''), 'name': a.get('name', ''), 'warranty_expiration': _w, 'classification': 'expiring_soon'}] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.rows }}
          _wc_ok_count: >-
            {%- set ns = namespace(c=0) -%}
            {%- for a in _wc_assets if a is mapping -%}
              {%- set _w = a.get('warranty_expiration', '') | string | trim -%}
              {%- if a.get('status', 'active') == 'active' -%}
                {%- if _w == '' or _w > _wc_threshold_date -%}
                  {%- set ns.c = ns.c + 1 -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.c }}

      - variables:
          final_response:
            status: ok
            tool: '{{ tool_name }}'
            mode: '{{ _mode }}'
            data:
              days_threshold: '{{ _wc_threshold }}'
              threshold_date: '{{ _wc_threshold_date }}'
              total_active_assets: '{{ _wc_assets | selectattr("status", "equalto", "active") | list | length }}'
              expired: '{{ _wc_expired }}'
              expiring_soon: '{{ _wc_expiring_soon }}'
              ok_count: '{{ _wc_ok_count }}'
              no_warranty_count: >-
                {{ _wc_assets | selectattr('status', 'equalto', 'active') | list | length
                   - (_wc_expired | length) - (_wc_expiring_soon | length) - (_wc_ok_count | int) }}
              natural_language: >-
                Warranty check ({{ _today }}, threshold {{ _wc_threshold }} days):
                {{ _wc_expired | length }} expired,
                {{ _wc_expiring_soon | length }} expiring within {{ _wc_threshold }} days,
                {{ _wc_ok_count }} ok.
                {%- if _wc_expired | length > 0 %} Expired: {{ _wc_expired | map(attribute='name') | join(', ') }}.{%- endif %}
                {%- if _wc_expiring_soon | length > 0 %} Expiring soon: {{ _wc_expiring_soon | map(attribute='name') | join(', ') }}.{%- endif %}
            evidence:
              caller: '{{ _caller }}'
              timestamp: '{{ _now }}'
              mode: '{{ _mode }}'
      - stop: warranty check done
        response_variable: final_response

    ###########################################################################
    # depreciable_asset_dispose_with_post (T14)
    # Grocy disposal (T7) + posts final-depr and proceeds to Firefly.
    ###########################################################################
    - if: "{{ _mode == 'depreciable_asset_dispose_with_post' }}"
      then:
      # Get current book value — needed regardless of T7 outcome (for Firefly payload)
      - action: script.zen_codex_finance_depreciation
        continue_on_error: true
        response_variable: _dwp_bv_raw
        data:
          mode: depreciable_asset_book_value
          asset_id: "{{ _asset_id_raw }}"
          caller: "{{ _caller }}"

      - if: "{{ not (_dwp_bv_raw is mapping and _dwp_bv_raw.get('status') == 'ok') }}"
        then:
        - variables:
            final_response: "{{ _dwp_bv_raw | default({'status': 'error', 'code': 'asset_not_found'}) }}"
        - stop: not found
          response_variable: final_response

      - variables:
          _dwp_asset: "{{ _dwp_bv_raw.get('data', {}) }}"
          _dwp_asset_id: "{{ _dwp_asset.get('asset_id', 0) | int(0) }}"
          _dwp_name: "{{ _dwp_asset.get('name', '') }}"
          _dwp_book_value: "{{ _dwp_asset.get('current_book_value', 0) | float(0) }}"
          _dwp_disposal_type: "{{ _asset_data.get('disposal_type', 'retired') | lower }}"
          _dwp_disposal_date: "{{ _asset_data.get('disposal_date', _today) }}"
          _dwp_proceeds: "{{ _asset_data.get('disposal_proceeds', 0) | float(0) }}"
          _dwp_gain_loss: "{{ (_dwp_proceeds - _dwp_book_value) | round(2) }}"
          _dwp_final_depr_desc: "Final depreciation — {{ _dwp_name }} (disposed {{ _dwp_disposal_date }})"
          _dwp_proceeds_desc: "Disposal proceeds — {{ _dwp_name }} ({{ _dwp_disposal_date }})"
          _dwp_skip_final_depr: "{{ _dwp_book_value <= 0 }}"
          _dwp_skip_proceeds: "{{ _dwp_disposal_type != 'sold' or _dwp_proceeds <= 0 }}"
          # Initialize Firefly post tracking — overridden by conditional blocks below
          _dwp_fd_ok: true
          _dwp_fd_txn_id: ""
          _dwp_fd_already_posted: false
          _dwp_pr_ok: true
          _dwp_pr_txn_id: ""
          _dwp_pr_already_posted: false
          _dwp_t7_already: false

      - if: "{{ _dry_run }}"
        then:
        - variables:
            final_response:
              status: plan
              tool: '{{ tool_name }}'
              mode: depreciable_asset_dispose_with_post
              data:
                asset_id: '{{ _dwp_asset_id }}'
                name: '{{ _dwp_name }}'
                disposal_type: '{{ _dwp_disposal_type }}'
                disposal_date: '{{ _dwp_disposal_date }}'
                book_value_at_disposal: '{{ _dwp_book_value }}'
                disposal_proceeds: '{{ _dwp_proceeds }}'
                gain_or_loss: '{{ _dwp_gain_loss }}'
                would_post_final_depr: "{{ not _dwp_skip_final_depr }}"
                would_post_proceeds: "{{ not _dwp_skip_proceeds }}"
                final_depr_description: '{{ _dwp_final_depr_desc }}'
                proceeds_description: '{{ _dwp_proceeds_desc }}'
              evidence:
                dry_run: true
                caller: '{{ _caller }}'
                timestamp: '{{ _now }}'
        - stop: dry run
          response_variable: final_response

      - if: "{{ _audit_note == '' }}"
        then:
        - variables:
            final_response:
              status: error
              tool: '{{ tool_name }}'
              mode: depreciable_asset_dispose_with_post
              code: audit_note_required
              message: audit_note is required for dispose_with_post — provide a reason for disposal.
        - stop: audit note required
          response_variable: final_response

      - if: "{{ not _confirm }}"
        then:
        - variables:
            final_response:
              status: confirm_required
              tool: '{{ tool_name }}'
              mode: depreciable_asset_dispose_with_post
              data:
                asset_id: '{{ _dwp_asset_id }}'
                name: '{{ _dwp_name }}'
                disposal_type: '{{ _dwp_disposal_type }}'
                book_value_at_disposal: '{{ _dwp_book_value }}'
                gain_or_loss: '{{ _dwp_gain_loss }}'
              message: >-
                Pass confirm=true to mark this asset as {{ _dwp_disposal_type }} and post
                final depreciation{{ ' and proceeds' if not _dwp_skip_proceeds else '' }} to Firefly.
        - stop: confirm required
          response_variable: final_response

      # Call T7 — Grocy disposal write; allow already_disposed (idempotent re-run)
      - action: script.zen_codex_finance_depreciation
        continue_on_error: true
        response_variable: _dwp_t7_raw
        data:
          mode: depreciable_asset_dispose
          asset_id: "{{ _asset_id_raw }}"
          asset_data: "{{ _asset_data | tojson }}"
          confirm: true
          dry_run: false
          caller: "{{ _caller }}"
          audit_note: "{{ _audit_note }}"
          idempotency_key: "{{ _idem_key_in }}"

      - variables:
          _dwp_t7_ok: >-
            {{ _dwp_t7_raw is mapping and
               _dwp_t7_raw.get('status', '') in ['success', 'ok'] }}
          _dwp_t7_already: >-
            {{ _dwp_t7_raw is mapping and
               _dwp_t7_raw.get('code', '') == 'already_disposed' }}

      - if: "{{ not _dwp_t7_ok and not _dwp_t7_already }}"
        then:
        - variables:
            final_response: "{{ _dwp_t7_raw | default({'status': 'error', 'code': 'dispose_failed'}) }}"
        - stop: dispose failed
          response_variable: final_response

      # Post final depreciation to Firefly (if book_value > 0)
      - if: "{{ not _dwp_skip_final_depr }}"
        then:
        - action: script.zen_dojotools_finance
          continue_on_error: true
          response_variable: _dwp_fd_idem_raw
          data:
            mode: run
            case: transactions_search
            item: "{{ _dwp_final_depr_desc }}"
            start_date: "{{ _dwp_disposal_date[:7] }}-01"
            end_date: "{{ _dwp_disposal_date }}"
            per_page: 5
        - variables:
            _dwp_fd_idem_txns: >-
              {%- set r = _dwp_fd_idem_raw if _dwp_fd_idem_raw is mapping else {} -%}
              {%- set txns = r.get('result', {}).get('transactions', []) if r is mapping else [] -%}
              {%- set ns = namespace(matches=[]) -%}
              {%- for t in txns if t is mapping -%}
                {%- if t.get('description', '') == _dwp_final_depr_desc -%}
                  {%- set ns.matches = ns.matches + [t] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.matches }}
            _dwp_fd_already_posted: "{{ _dwp_fd_idem_txns | length > 0 }}"
        - if: "{{ not _dwp_fd_already_posted }}"
          then:
          - variables:
              _dwp_fd_notes: >-
                Asset: {{ _dwp_name }}
                Asset ID: {{ _dwp_asset_id }}
                Disposal date: {{ _dwp_disposal_date }}
                Disposal type: {{ _dwp_disposal_type }}
                Book value at disposal: {{ _dwp_book_value }}
                Gain/loss: {{ _dwp_gain_loss }}
                {{ ('Audit: ' ~ _audit_note) if _audit_note != '' else '' }}
                Posted by ZenOS. Firefly is ledger/reporting only.
              _dwp_fd_tags: "asset:{{ _dwp_asset_id }},depreciation,depreciable-asset,disposal,final-depr"
          - action: script.zen_dojotools_finance
            continue_on_error: true
            response_variable: _dwp_fd_post_raw
            data:
              mode: run
              case: transaction_add
              confirm: true
              transaction_type: withdrawal
              amount: "{{ _dwp_book_value }}"
              description: "{{ _dwp_final_depr_desc }}"
              date: "{{ _dwp_disposal_date }}"
              category: Depreciation Expense
              tags: "{{ _dwp_fd_tags }}"
              notes: "{{ _dwp_fd_notes }}"
          - variables:
              _dwp_fd_ok: "{{ _dwp_fd_post_raw is mapping and _dwp_fd_post_raw.get('status', '') in ['ok', 'success', 'created'] }}"
              _dwp_fd_txn_id: "{{ (_dwp_fd_post_raw.get('result', {}).get('id', '') if _dwp_fd_post_raw is mapping else '') }}"
          else:
          - variables:
              _dwp_fd_ok: true
              _dwp_fd_txn_id: "{{ _dwp_fd_idem_txns[0].get('id', '') if _dwp_fd_idem_txns | length > 0 else '' }}"

      # Post disposal proceeds (if sold and proceeds > 0)
      - if: "{{ not _dwp_skip_proceeds }}"
        then:
        - action: script.zen_dojotools_finance
          continue_on_error: true
          response_variable: _dwp_pr_idem_raw
          data:
            mode: run
            case: transactions_search
            item: "{{ _dwp_proceeds_desc }}"
            start_date: "{{ _dwp_disposal_date[:7] }}-01"
            end_date: "{{ _dwp_disposal_date }}"
            per_page: 5
        - variables:
            _dwp_pr_idem_txns: >-
              {%- set r = _dwp_pr_idem_raw if _dwp_pr_idem_raw is mapping else {} -%}
              {%- set txns = r.get('result', {}).get('transactions', []) if r is mapping else [] -%}
              {%- set ns = namespace(matches=[]) -%}
              {%- for t in txns if t is mapping -%}
                {%- if t.get('description', '') == _dwp_proceeds_desc -%}
                  {%- set ns.matches = ns.matches + [t] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.matches }}
            _dwp_pr_already_posted: "{{ _dwp_pr_idem_txns | length > 0 }}"
        - if: "{{ not _dwp_pr_already_posted }}"
          then:
          - variables:
              _dwp_pr_notes: >-
                Asset: {{ _dwp_name }}
                Asset ID: {{ _dwp_asset_id }}
                Disposal date: {{ _dwp_disposal_date }}
                Disposal type: sold
                Proceeds: {{ _dwp_proceeds }}
                Gain/loss: {{ _dwp_gain_loss }}
                {{ ('Audit: ' ~ _audit_note) if _audit_note != '' else '' }}
                Posted by ZenOS. Firefly is ledger/reporting only.
              _dwp_pr_tags: "asset:{{ _dwp_asset_id }},depreciable-asset,disposal,proceeds"
          - action: script.zen_dojotools_finance
            continue_on_error: true
            response_variable: _dwp_pr_post_raw
            data:
              mode: run
              case: transaction_add
              confirm: true
              transaction_type: deposit
              amount: "{{ _dwp_proceeds }}"
              description: "{{ _dwp_proceeds_desc }}"
              date: "{{ _dwp_disposal_date }}"
              category: Asset Disposal
              tags: "{{ _dwp_pr_tags }}"
              notes: "{{ _dwp_pr_notes }}"
          - variables:
              _dwp_pr_ok: "{{ _dwp_pr_post_raw is mapping and _dwp_pr_post_raw.get('status', '') in ['ok', 'success', 'created'] }}"
              _dwp_pr_txn_id: "{{ (_dwp_pr_post_raw.get('result', {}).get('id', '') if _dwp_pr_post_raw is mapping else '') }}"
          else:
          - variables:
              _dwp_pr_ok: true
              _dwp_pr_txn_id: "{{ _dwp_pr_idem_txns[0].get('id', '') if _dwp_pr_idem_txns | length > 0 else '' }}"

      - variables:
          final_response:
            status: "{{ 'success' if _dwp_fd_ok and _dwp_pr_ok else 'partial_error' }}"
            tool: '{{ tool_name }}'
            mode: depreciable_asset_dispose_with_post
            data:
              asset_id: '{{ _dwp_asset_id }}'
              name: '{{ _dwp_name }}'
              disposal_type: '{{ _dwp_disposal_type }}'
              disposal_date: '{{ _dwp_disposal_date }}'
              book_value_at_disposal: '{{ _dwp_book_value }}'
              disposal_proceeds: '{{ _dwp_proceeds }}'
              gain_or_loss: '{{ _dwp_gain_loss }}'
              grocy_dispose_status: "{{ 'already_disposed' if _dwp_t7_already else 'disposed' }}"
              final_depr_txn_id: '{{ _dwp_fd_txn_id }}'
              final_depr_posted: '{{ _dwp_fd_ok }}'
              final_depr_skipped: '{{ _dwp_skip_final_depr }}'
              final_depr_already_posted: '{{ _dwp_fd_already_posted }}'
              proceeds_txn_id: '{{ _dwp_pr_txn_id }}'
              proceeds_posted: '{{ _dwp_pr_ok }}'
              proceeds_skipped: '{{ _dwp_skip_proceeds }}'
              proceeds_already_posted: '{{ _dwp_pr_already_posted }}'
              natural_language: >-
                {{ _dwp_name }} disposed as {{ _dwp_disposal_type }} on {{ _dwp_disposal_date }}.
                Book value at disposal: ${{ _dwp_book_value }}.
                {%- if not _dwp_skip_final_depr %} Final depreciation of ${{ _dwp_book_value }}
                {{ 'already posted (idempotent)' if _dwp_fd_already_posted else 'posted' }} to Firefly.{%- endif %}
                {%- if not _dwp_skip_proceeds %} Proceeds of ${{ _dwp_proceeds }}
                {{ 'already posted (idempotent)' if _dwp_pr_already_posted else 'posted' }} to Firefly.{%- endif %}
                {{ 'Gain' if _dwp_gain_loss >= 0 else 'Loss' }}: ${{ _dwp_gain_loss | abs }}.
            evidence:
              dry_run: false
              caller: '{{ _caller }}'
              timestamp: '{{ _now }}'
              mode: depreciable_asset_dispose_with_post
              audit_note: "{{ _audit_note }}"
      - stop: dispose_with_post done
        response_variable: final_response

    ###########################################################################
    # depreciable_asset_reconcile_firefly (T15)
    # Diffs expected depreciation schedule vs posted Firefly transactions.
    ###########################################################################
    - if: "{{ _mode == 'depreciable_asset_reconcile_firefly' }}"
      then:
      - action: script.zen_codex_finance_depreciation
        continue_on_error: true
        response_variable: _recon_asset_raw
        data:
          mode: depreciable_asset_get
          asset_id: "{{ _asset_id_raw }}"
          caller: "{{ _caller }}"

      - if: "{{ not (_recon_asset_raw is mapping and _recon_asset_raw.get('status') in ['ok', 'success']) }}"
        then:
        - variables:
            final_response: "{{ _recon_asset_raw | default({'status': 'error', 'code': 'asset_not_found'}) }}"
        - stop: not found
          response_variable: final_response

      - action: script.zen_codex_finance_depreciation
        continue_on_error: true
        response_variable: _recon_sched_raw
        data:
          mode: depreciable_asset_calculate_schedule
          asset_id: "{{ _asset_id_raw }}"
          caller: "{{ _caller }}"

      - if: "{{ not (_recon_sched_raw is mapping and _recon_sched_raw.get('status') in ['ok', 'success']) }}"
        then:
        - variables:
            final_response: "{{ _recon_sched_raw | default({'status': 'error', 'code': 'schedule_failed'}) }}"
        - stop: schedule failed
          response_variable: final_response

      - variables:
          _recon_asset: "{{ _recon_asset_raw.get('data', {}) }}"
          _recon_asset_int_id: "{{ _recon_asset.get('asset_id', 0) | int(0) }}"
          _recon_name: "{{ _recon_asset.get('name', '') }}"
          _recon_pis_date: "{{ _recon_asset.get('placed_in_service_date', '2000-01-01') }}"
          _recon_schedule: "{{ _recon_sched_raw.get('schedule', []) }}"

      # Search Firefly for all periodic depreciation transactions for this asset
      - action: script.zen_dojotools_finance
        continue_on_error: true
        response_variable: _recon_ff_raw
        data:
          mode: run
          case: transactions_search
          item: "Depreciation — {{ _recon_name }} — "
          start_date: "{{ _recon_pis_date }}"
          end_date: "{{ _today }}"
          per_page: 250

      - variables:
          _recon_ff_txns: >-
            {%- set r = _recon_ff_raw if _recon_ff_raw is mapping else {} -%}
            {{ r.get('result', {}).get('transactions', []) if r is mapping else [] }}

      # Build posted periods set — filter to exact "Depreciation — {name} — YYYY-MM" format
      - variables:
          _recon_pfx: "Depreciation — {{ _recon_name }} — "
          _recon_posted_periods: >-
            {%- set ns = namespace(periods=[]) -%}
            {%- for t in _recon_ff_txns if t is mapping -%}
              {%- set _desc = t.get('description', '') -%}
              {%- set _pmatch = _desc | regex_findall('Depreciation — .+ — (\\d{4}-\\d{2})$') -%}
              {%- if _pmatch | length > 0 -%}
                {%- set _period = _pmatch[0] -%}
                {%- if _desc == _recon_pfx ~ _period -%}
                  {%- set ns.periods = ns.periods + [{'period': _period, 'txn_id': t.get('id', ''), 'amount': t.get('amount', 0) | float(0)}] -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.periods }}
          _recon_posted_period_keys: >-
            {{ _recon_posted_periods | map(attribute='period') | list }}

      # Diff: missing (in schedule but not Firefly) + unexpected (in Firefly but not schedule)
      - variables:
          _recon_sched_period_keys: >-
            {{ _recon_schedule | selectattr('post_status', 'ne', 'skipped') | map(attribute='period') | list }}
          _recon_missing: >-
            {%- set ns = namespace(rows=[]) -%}
            {%- for row in _recon_schedule if row is mapping -%}
              {%- if row.get('post_status', 'pending') != 'skipped' and row.get('period', '') not in _recon_posted_period_keys -%}
                {%- set ns.rows = ns.rows + [{'period': row.get('period', ''), 'amount': row.get('depreciation_amount', 0), 'idempotency_key': row.get('idempotency_key', '')}] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.rows }}
          _recon_unexpected: >-
            {%- set ns = namespace(rows=[]) -%}
            {%- for p in _recon_posted_periods if p is mapping -%}
              {%- if p.get('period', '') not in _recon_sched_period_keys -%}
                {%- set ns.rows = ns.rows + [p] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.rows }}
          _recon_matched_count: >-
            {%- set ns = namespace(c=0) -%}
            {%- for row in _recon_schedule if row is mapping -%}
              {%- if row.get('post_status', 'pending') != 'skipped' and row.get('period', '') in _recon_posted_period_keys -%}
                {%- set ns.c = ns.c + 1 -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.c }}
          _recon_fully_reconciled: >-
            {{ _recon_missing | length == 0 and _recon_unexpected | length == 0 }}

      - variables:
          final_response:
            status: ok
            tool: '{{ tool_name }}'
            mode: depreciable_asset_reconcile_firefly
            data:
              asset_id: '{{ _recon_asset_int_id }}'
              name: '{{ _recon_name }}'
              schedule_count: '{{ _recon_schedule | length }}'
              posted_count: '{{ _recon_posted_periods | length }}'
              matched_count: '{{ _recon_matched_count }}'
              fully_reconciled: '{{ _recon_fully_reconciled }}'
              missing: '{{ _recon_missing }}'
              unexpected: '{{ _recon_unexpected }}'
              natural_language: >-
                {{ _recon_name }}: {{ _recon_schedule | length }} periods scheduled,
                {{ _recon_matched_count }} matched in Firefly.
                {%- if _recon_missing | length > 0 %} {{ _recon_missing | length }} period(s) missing from Firefly.{%- endif %}
                {%- if _recon_unexpected | length > 0 %} {{ _recon_unexpected | length }} unexpected transaction(s) in Firefly.{%- endif %}
                {%- if _recon_fully_reconciled %} Fully reconciled.{%- endif %}
            evidence:
              caller: '{{ _caller }}'
              timestamp: '{{ _now }}'
              mode: depreciable_asset_reconcile_firefly
      - stop: reconcile done
        response_variable: final_response

    ###########################################################################
    # depreciable_asset_suggest_business_use
    # Reads room_topology from household cabinet, calculates business-use %
    # from home_office_claimed rooms vs total home area. Returns suggestion
    # with confirm gate — confirm=true writes to asset's business_use_percent.
    ###########################################################################
    - if: "{{ _mode == 'depreciable_asset_suggest_business_use' }}"
      then:
      - if: "{{ _asset_id_raw == '' }}"
        then:
        - variables:
            final_response:
              status: error
              mode: depreciable_asset_suggest_business_use
              code: missing_required
              message: asset_id is required.
        - stop: missing asset_id
          response_variable: final_response

      # Load asset to get room_anchor
      - action: script.zen_codex_finance_depreciation
        data:
          mode: depreciable_asset_get
          asset_id: "{{ _asset_id_raw }}"
          caller: "{{ _caller }}"
        response_variable: _sbu_asset_raw
      - variables:
          _sbu_asset: >-
            {{ _sbu_asset_raw.get('data', none) if _sbu_asset_raw is mapping else none }}
          _sbu_anchor: >-
            {{ (_sbu_asset.get('room_anchor', '') if _sbu_asset is mapping else '') | lower | trim }}

      - if: "{{ _sbu_asset is none }}"
        then:
        - variables:
            final_response:
              status: error
              mode: depreciable_asset_suggest_business_use
              code: asset_not_found
              asset_id: "{{ _asset_id_raw }}"
        - stop: asset not found
          response_variable: final_response

      # Read room_topology from household cabinet
      - variables:
          _sbu_hh_cab: >-
            {{ label_entities('Zen Household Cabinet') | select('match', 'sensor\\.') | list | first | default('') }}
      - variables:
          _sbu_topo: >-
            {%- if _sbu_hh_cab == '' -%}{{ {} }}{%- else -%}
            {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
            {%- set _raw = CABS.cabinet_drawer_value_mounted(_sbu_hh_cab, 'room_topology') -%}
            {%- set _t = _raw | from_json if _raw is string and _raw | trim not in ['', 'null', 'None'] else (_raw if _raw is mapping else {}) -%}
            {{ _t }}
            {%- endif -%}

      # Gate 1 — find claimed rooms
      - variables:
          _sbu_claimed: >-
            {%- set ns = namespace(rooms=[]) -%}
            {%- for area_id, room in _sbu_topo.items() -%}
              {%- if room is mapping and room.get('home_office_claimed', false) | bool -%}
                {%- set ns.rooms = ns.rooms + [{'area_id': area_id,
                    'name': room.get('area_note', area_id),
                    'area_sqft': room.get('area_sqft', none),
                    'area_calc': room.get('area_calc', none),
                    'unit': room.get('unit', 'ft')}] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.rooms }}
          _sbu_all_interior: >-
            {%- set _non_living = ['under_roof_porch', 'under_roof_garage', 'under_roof_attic'] -%}
            {%- set ns = namespace(rooms=[]) -%}
            {%- for area_id, room in _sbu_topo.items() -%}
              {%- if room is mapping and not (room.get('exterior', false) | bool) -%}
                {%- set _tb = room.get('tax_bucket', '') | string | trim -%}
                {%- if _tb == '' or _tb not in _non_living -%}
                  {%- set ns.rooms = ns.rooms + [{'area_id': area_id,
                      'name': room.get('area_note', area_id),
                      'tax_bucket': _tb,
                      'area_sqft': room.get('area_sqft', none)}] -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.rooms }}

      # Gate 2 — rooms missing area
      - variables:
          _sbu_gap_rooms: >-
            {{ _sbu_all_interior | selectattr('area_sqft', 'equalto', none) | map(attribute='name') | list }}
          _sbu_numerator: >-
            {%- set ns = namespace(total=0.0) -%}
            {%- for r in _sbu_claimed -%}
              {%- if r.area_sqft is not none -%}
                {%- set ns.total = ns.total + (r.area_sqft | float) -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.total }}
          _sbu_total_sqft_override: "{{ total_home_sqft_override | default(none, true) }}"

      - variables:
          _sbu_denominator: >-
            {%- if _sbu_total_sqft_override is not none -%}
              {{ _sbu_total_sqft_override | float }}
            {%- else -%}
              {%- set ns = namespace(total=0.0) -%}
              {%- for r in _sbu_all_interior -%}
                {%- if r.area_sqft is not none -%}
                  {%- set ns.total = ns.total + (r.area_sqft | float) -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.total }}
            {%- endif -%}
          _sbu_calc_state: >-
            {%- if _sbu_claimed | length == 0 -%}unconfigured
            {%- elif _sbu_gap_rooms | length > 0 and _sbu_total_sqft_override is none -%}partial
            {%- else -%}ready{%- endif -%}

      - variables:
          _sbu_pct: >-
            {%- if _sbu_calc_state == 'ready' and _sbu_denominator | float > 0 -%}
              {{ ((_sbu_numerator | float / _sbu_denominator | float) * 100) | round(1) }}
            {%- else -%}{{ none }}{%- endif -%}

      # Return coaching if not ready
      - if: "{{ _sbu_calc_state != 'ready' }}"
        then:
        - variables:
            final_response:
              status: coaching
              mode: depreciable_asset_suggest_business_use
              asset_id: "{{ _asset_id_raw }}"
              asset_name: "{{ (_sbu_asset.get('name', '') if _sbu_asset is mapping else '') }}"
              room_anchor: "{{ _sbu_anchor }}"
              calc_state: "{{ _sbu_calc_state }}"
              claimed_rooms: "{{ _sbu_claimed }}"
              message: >-
                {%- if _sbu_calc_state == 'unconfigured' -%}
                No rooms are tagged as home office in Room Manager. Use zen_dojotools_room_manager
                mode=set area=<room> home_office_claimed=true to tag your office space(s).
                {%- else -%}
                {{ _sbu_gap_rooms | length }} room(s) are missing area measurements: {{ _sbu_gap_rooms | join(', ') }}.
                Add length+width via zen_dojotools_room_manager mode=set, or pass total_home_sqft_override
                to bypass room-by-room calculation.
                {%- endif -%}
        - stop: coaching
          response_variable: final_response

      # Ready — confirm gate
      - if: "{{ not (_confirm | bool) }}"
        then:
        - variables:
            final_response:
              status: confirm_required
              mode: depreciable_asset_suggest_business_use
              asset_id: "{{ _asset_id_raw }}"
              asset_name: "{{ (_sbu_asset.get('name', '') if _sbu_asset is mapping else '') }}"
              room_anchor: "{{ _sbu_anchor }}"
              calc_state: ready
              claimed_rooms: "{{ _sbu_claimed }}"
              claimed_sqft: "{{ _sbu_numerator }}"
              total_home_sqft: "{{ _sbu_denominator }}"
              total_home_sqft_source: "{{ 'override' if _sbu_total_sqft_override is not none else 'room_topology' }}"
              suggested_business_use_percent: "{{ _sbu_pct }}"
              current_business_use_percent: "{{ (_sbu_asset.get('business_use_percent', none) if _sbu_asset is mapping else none) }}"
              message: >-
                {{ _sbu_claimed | map(attribute='name') | join(' + ') }}
                = {{ _sbu_numerator | round(0) | int }} sqft claimed of
                {{ _sbu_denominator | round(0) | int }} sqft total
                → {{ _sbu_pct }}% business use.
                Pass confirm=true to write this to the asset.
        - stop: confirm required
          response_variable: final_response

      # Confirmed — write to asset
      - action: script.zen_codex_finance_depreciation
        data:
          mode: depreciable_asset_update
          asset_id: "{{ _asset_id_raw }}"
          asset_data: >-
            {{ {'business_use_percent': _sbu_pct,
                'business_use_percent_calculated': _sbu_pct,
                'business_use_sqft_claimed': _sbu_numerator,
                'business_use_sqft_total': _sbu_denominator,
                'business_use_sqft_source': ('override' if _sbu_total_sqft_override is not none else 'room_topology')} | tojson }}
          caller: "{{ _caller }}"
          confirm: true
        response_variable: _sbu_write_raw
      - variables:
          final_response:
            status: "{{ _sbu_write_raw.get('status', 'error') if _sbu_write_raw is mapping else 'error' }}"
            mode: depreciable_asset_suggest_business_use
            asset_id: "{{ _asset_id_raw }}"
            asset_name: "{{ (_sbu_asset.get('name', '') if _sbu_asset is mapping else '') }}"
            business_use_percent_written: "{{ _sbu_pct }}"
            claimed_sqft: "{{ _sbu_numerator }}"
            total_home_sqft: "{{ _sbu_denominator }}"
            claimed_rooms: "{{ _sbu_claimed }}"
            message: >-
              Business use set to {{ _sbu_pct }}% based on room measurements
              ({{ _sbu_numerator | round(0) | int }} sqft of
              {{ _sbu_denominator | round(0) | int }} sqft total).
            evidence:
              dry_run: false
              caller: "{{ _caller }}"
              timestamp: "{{ _now }}"
              mode: depreciable_asset_suggest_business_use
      - stop: done
        response_variable: final_response

    ###########################################################################
    # cpa_summary (T20)
    # Read-only year-end summary: depreciation schedule, disposals, business-use
    # splits, and category spend. No writes. Future: publish to Wiki.js as .md.
    ###########################################################################
    - if: "{{ _mode == 'cpa_summary' }}"
      then:
      - variables:
          _cpa_opts: "{{ asset_data if asset_data is mapping else (asset_data | from_json(none) if asset_data is string and asset_data | trim not in ['', 'null', 'None'] else {}) }}"
          _cpa_year_str: >-
            {%- set _y = (_cpa_opts.get('year', '') if _cpa_opts is mapping else '') | string | trim -%}
            {{ _y if _y != '' else now().strftime('%Y') }}

      # Step 1: all assets
      - action: script.zen_codex_finance_depreciation
        continue_on_error: true
        response_variable: _cpa_list_raw
        data:
          mode: depreciable_asset_list
          caller: '{{ _caller }}'

      - variables:
          _cpa_assets: "{{ _cpa_list_raw.get('assets', []) if _cpa_list_raw is mapping else [] }}"
          _cpa_year_start: "{{ _cpa_year_str }}-01-01"
          _cpa_year_end: "{{ _cpa_year_str }}-12-31"
          _cpa_summaries: []
          _cpa_total_depr: 0.0
          _cpa_total_biz_depr: 0.0
          _cpa_disposals: []

      # Step 2: per-asset loop — schedule + allocation
      - repeat:
          for_each: "{{ _cpa_assets }}"
          sequence:
          - variables:
              _cpa_aid: "{{ repeat.item.get('asset_id', '') | string }}"
              _cpa_aname: "{{ repeat.item.get('name', '') }}"
              _cpa_method: "{{ repeat.item.get('depreciation_method', 'straight_line') }}"
              _cpa_status: "{{ repeat.item.get('status', 'active') }}"

          - action: script.zen_codex_finance_depreciation
            continue_on_error: true
            response_variable: _cpa_sched_raw
            data:
              mode: depreciable_asset_calculate_schedule
              asset_id: '{{ _cpa_aid }}'
              caller: '{{ _caller }}'

          - variables:
              _cpa_year_depr: >-
                {%- set rows = _cpa_sched_raw.get('schedule', []) if _cpa_sched_raw is mapping else [] -%}
                {%- set _ys = _cpa_year_str | string -%}
                {%- set ns = namespace(t=0.0) -%}
                {%- for row in rows if row is mapping and (row.get('period', '') | string)[:4] == _ys -%}
                  {%- set ns.t = ns.t + (row.get('depreciation_amount', 0) | float) -%}
                {%- endfor -%}
                {{ ns.t | round(2) }}
              _cpa_periods_in_year: >-
                {%- set rows = _cpa_sched_raw.get('schedule', []) if _cpa_sched_raw is mapping else [] -%}
                {%- set _ys = _cpa_year_str | string -%}
                {%- set ns = namespace(c=0) -%}
                {%- for row in rows if row is mapping and (row.get('period', '') | string)[:4] == _ys -%}
                  {%- set ns.c = ns.c + 1 -%}
                {%- endfor -%}
                {{ ns.c }}

          - action: script.zen_codex_finance_depreciation
            continue_on_error: true
            response_variable: _cpa_alloc_raw
            data:
              mode: asset_allocation_list
              asset_id: '{{ _cpa_aid }}'
              caller: '{{ _caller }}'

          - variables:
              _cpa_biz_pct_avg: >-
                {%- set rows = _cpa_alloc_raw.get('allocations', []) if _cpa_alloc_raw is mapping else [] -%}
                {%- set _ys = _cpa_year_str | string -%}
                {%- set ns = namespace(total=0.0, count=0) -%}
                {%- for row in rows if row is mapping -%}
                  {%- if (row.get('effective_date', '') | string)[:4] <= _ys -%}
                    {%- set end = (row.get('end_date') or '') | string | trim -%}
                    {%- if end == '' or end == 'None' or end[:4] >= _ys -%}
                      {%- set ns.total = ns.total + (row.get('business_use_percent', 0) | float) -%}
                      {%- set ns.count = ns.count + 1 -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ (ns.total / ns.count) | round(1) if ns.count > 0 else 0 }}

          - variables:
              _cpa_biz_depr_i: "{{ (_cpa_year_depr * _cpa_biz_pct_avg / 100) | round(2) }}"
              _cpa_hh_depr_i: "{{ (_cpa_year_depr - (_cpa_year_depr * _cpa_biz_pct_avg / 100)) | round(2) }}"
              _cpa_disposed_in_year: >-
                {{ _cpa_status not in ['active', ''] and
                   (repeat.item.get('disposal_date', '') | string)[:4] == (_cpa_year_str | string) }}

          - variables:
              _cpa_disposal_entry: >-
                {%- if _cpa_disposed_in_year | string | lower == 'true' -%}
                  {{ {
                    'asset_id': _cpa_aid,
                    'name': _cpa_aname,
                    'disposal_date': repeat.item.get('disposal_date', ''),
                    'disposal_type': _cpa_status,
                    'disposal_proceeds': repeat.item.get('disposal_proceeds', 0) | float,
                    'cost_basis': repeat.item.get('cost_basis', 0) | float
                  } }}
                {%- else -%}{{ none }}{%- endif -%}
              _cpa_row:
                asset_id: '{{ _cpa_aid }}'
                name: '{{ _cpa_aname }}'
                depreciation_method: '{{ _cpa_method }}'
                status: '{{ _cpa_status }}'
                cost_basis: "{{ repeat.item.get('cost_basis', 0) | float }}"
                year_depreciation_total: '{{ _cpa_year_depr }}'
                business_use_pct_avg: '{{ _cpa_biz_pct_avg }}'
                business_depreciation: '{{ _cpa_biz_depr_i }}'
                household_depreciation: '{{ _cpa_hh_depr_i }}'
                disposal: '{{ _cpa_disposal_entry }}'

          - variables:
              _cpa_summaries: "{{ _cpa_summaries + [_cpa_row] }}"
              _cpa_total_depr: "{{ (_cpa_total_depr | float + _cpa_year_depr) | round(2) }}"
              _cpa_total_biz_depr: "{{ (_cpa_total_biz_depr | float + _cpa_biz_depr_i) | round(2) }}"
              _cpa_disposals: "{{ _cpa_disposals + ([_cpa_disposal_entry] if _cpa_disposed_in_year | string | lower == 'true' else []) }}"

      # Step 3: Firefly category spend (two categories, run in sequence)
      - action: script.zen_dojotools_finance
        continue_on_error: true
        response_variable: _cpa_hh_spend_raw
        data:
          mode: run
          case: category_spend
          item: Depreciation Expense
          start_date: '{{ _cpa_year_start }}'
          end_date: '{{ _cpa_year_end }}'

      - action: script.zen_dojotools_finance
        continue_on_error: true
        response_variable: _cpa_biz_spend_raw
        data:
          mode: run
          case: category_spend
          item: Business Depreciation Expense
          start_date: '{{ _cpa_year_start }}'
          end_date: '{{ _cpa_year_end }}'

      - variables:
          _cpa_hh_spend: "{{ ((_cpa_hh_spend_raw.get('result') or {}).get('data') or {}).get('total_spent', 0) | float(0) if _cpa_hh_spend_raw is mapping else 0 }}"
          _cpa_biz_spend: "{{ ((_cpa_biz_spend_raw.get('result') or {}).get('data') or {}).get('total_spent', 0) | float(0) if _cpa_biz_spend_raw is mapping else 0 }}"

      - variables:
          final_response:
            status: ok
            tool: '{{ tool_name }}'
            mode: cpa_summary
            year: '{{ _cpa_year_str }}'
            generated_at: '{{ _now }}'
            assets: '{{ _cpa_summaries }}'
            aggregate:
              asset_count: '{{ _cpa_assets | length }}'
              total_depreciation_scheduled: '{{ _cpa_total_depr }}'
              total_business_depreciation: '{{ _cpa_total_biz_depr }}'
              total_household_depreciation: "{{ (_cpa_total_depr - _cpa_total_biz_depr) | round(2) }}"
              total_posted_to_firefly: "{{ (_cpa_hh_spend + _cpa_biz_spend) | round(2) }}"
              variance: "{{ (_cpa_total_depr - (_cpa_hh_spend + _cpa_biz_spend)) | round(2) }}"
              disposal_count: '{{ _cpa_disposals | length }}'
              disposals: '{{ _cpa_disposals }}'
            firefly_spend:
              depreciation_expense: '{{ _cpa_hh_spend }}'
              business_depreciation_expense: '{{ _cpa_biz_spend }}'
            note: >-
              Summary view only — no writes. Variance = scheduled minus posted to
              Firefly. Non-zero variance means unposted periods exist — run
              depreciable_asset_reconcile_firefly per asset for detail.
              Future: Wiki.js publish endpoint pending.
      - stop: cpa_summary done
        response_variable: final_response

    ###########################################################################
    # compensate
    ###########################################################################
    - if: "{{ _mode == 'compensate' }}"
      then:
      - if: "{{ _idem_key_in == '' and _ftxn_id_in == '' }}"
        then:
        - variables:
            final_response:
              status: error
              tool: '{{ tool_name }}'
              mode: compensate
              code: idempotency_key_required
              message: idempotency_key or firefly_transaction_id is required for compensate.
        - stop: key required
          response_variable: final_response

      # KNOWN LIMITATION (intentional, not a bug): the idempotency-key-only search
      # path below is hardcoded to this codex's own domain (searches item="Depreciation",
      # matches key text in notes/description). Other codices (e.g. COGS) store their
      # idempotency key in tags, not notes/description, and post against a different
      # account entirely — the search below would silently look in the wrong place and
      # return a misleading "not found". Guard against that here with an explicit,
      # actionable error instead of a silent wrong answer.
      - if: "{{ _idem_key_in is string and _idem_key_in.startswith('grocy_stock_entry:') and _ftxn_id_in == '' }}"
        then:
        - variables:
            final_response:
              status: error
              tool: '{{ tool_name }}'
              mode: compensate
              code: cogs_reversal_needs_txn_id
              message: >-
                COGS transactions can only be reversed by firefly_transaction_id —
                idempotency-key-only search is not implemented for this domain (only
                depreciation). Find the id first: zen_dojotools_finance mode=run
                case=transactions_search tags={{ _idem_key_in }}, then retry compensate
                with firefly_transaction_id=<id>.
        - stop: cogs reversal needs txn id
          response_variable: final_response

      # Derive key: prefer caller-supplied; fall back to txn-id-based
      - variables:
          _comp_key: >-
            {{ _idem_key_in if _idem_key_in != '' else ('txn:' ~ _ftxn_id_in) }}
          _comp_reversal_key: "reversal:{{ _comp_key }}"

      # Fast path: firefly_transaction_id provided — call zen_root_firefly directly
      # (avoids re-entrant call to zen_dojotools_finance which is the parent caller).
      - if: "{{ _ftxn_id_in != '' }}"
        then:
        - action: script.zen_root_firefly
          continue_on_error: true
          response_variable: _comp_direct_raw
          data:
            action_type: get
            endpoint: 'transactions/{{ _ftxn_id_in }}'
        - variables:
            _comp_orig: >-
              {%- if _comp_direct_raw is mapping and 'result' in _comp_direct_raw and _comp_direct_raw['result'] is mapping -%}
                {%- set d = _comp_direct_raw['result']['content'] | default({}) -%}
                {%- if d is mapping -%}
                  {%- set obj = d.get('data', d) -%}
                  {%- if obj is mapping -%}
                    {%- set attrs = obj.get('attributes', {}) -%}
                    {%- set splits = attrs.get('transactions', []) -%}
                    {%- set split = splits[0] if splits | length > 0 else {} -%}
                    {{ {'id': obj.get('id', _ftxn_id_in), 'description': split.get('description', ''), 'amount': split.get('amount', 0), 'type': split.get('type', ''), 'source': split.get('source_name', ''), 'destination': split.get('destination_name', ''), 'category_name': split.get('category_name', ''), 'notes': split.get('notes', '')} }}
                  {%- else -%}none{%- endif -%}
                {%- else -%}none{%- endif -%}
              {%- else -%}none{%- endif -%}

      # Idempotency key path: no txn ID — search by tag/notes (for post-fix transactions)
      - if: "{{ _ftxn_id_in == '' }}"
        then:
        - action: script.zen_dojotools_finance
          continue_on_error: true
          response_variable: _comp_orig_raw
          data:
            mode: run
            case: transactions_search
            item: "Depreciation"
            per_page: 25
        - variables:
            _comp_orig_txns: >-
              {%- set r = _comp_orig_raw if _comp_orig_raw is mapping else {} -%}
              {%- set result = r.get('result', {}) if r is mapping else {} -%}
              {{ result.get('transactions', []) if result is mapping else [] }}
            _comp_orig: >-
              {%- set ns = namespace(found=none) -%}
              {%- for t in _comp_orig_txns if t is mapping -%}
                {%- if _idem_key_in in (t.get('notes', '') ~ t.get('description', '')) and ns.found is none -%}
                  {%- set ns.found = t -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.found }}

      # Already-reversed check is skipped on dry_run and when using firefly_transaction_id
      # fast path (no re-entrant finance call; confirm gate catches double-post on real commit).
      - if: "{{ not _dry_run and not _confirm and _ftxn_id_in == '' }}"
        then:
        - action: script.zen_root_firefly
          continue_on_error: true
          response_variable: _comp_check_raw
          data:
            action_type: get
            endpoint: >-
              search/transactions?query={{ ('REVERSAL — ' ~ (_comp_orig.get('description', '') if _comp_orig is mapping else '')) | urlencode }}&limit=5
        - variables:
            _comp_already_reversed: >-
              {%- if _comp_check_raw is mapping and 'result' in _comp_check_raw and _comp_check_raw['result'] is mapping -%}
                {%- set data = _comp_check_raw['result']['content'] | default({}) -%}
                {{ (data.get('data', []) if data is mapping else []) | length > 0 }}
              {%- else -%}false{%- endif -%}
        - if: "{{ _comp_already_reversed }}"
          then:
          - variables:
              final_response:
                status: already_reversed
                tool: '{{ tool_name }}'
                mode: compensate
                idempotency_key: '{{ _comp_key }}'
                message: A reversal for this transaction already exists in Firefly.
          - stop: already reversed
            response_variable: final_response

      - if: "{{ _comp_orig is none }}"
        then:
        - variables:
            final_response:
              status: not_found
              tool: '{{ tool_name }}'
              mode: compensate
              idempotency_key: '{{ _comp_key }}'
              firefly_transaction_id: '{{ _ftxn_id_in }}'
              message: No Firefly transaction found with this idempotency key or transaction ID.
        - stop: not found
          response_variable: final_response

      - if: "{{ _dry_run }}"
        then:
        - variables:
            final_response:
              status: plan
              tool: '{{ tool_name }}'
              mode: compensate
              original_transaction: '{{ _comp_orig }}'
              would_post_reversal_tags: "reverses:{{ _comp_key }},reversal,{{ 'idempotency:' ~ _comp_reversal_key }}"
              evidence:
                dry_run: true
                caller: '{{ _caller }}'
                timestamp: '{{ _now }}'
        - stop: dry run
          response_variable: final_response

      - if: "{{ not _confirm }}"
        then:
        - variables:
            final_response:
              status: confirm_required
              tool: '{{ tool_name }}'
              mode: compensate
              original_transaction: '{{ _comp_orig }}'
              message: Pass confirm=true to post a reversing transaction.
        - stop: confirm required
          response_variable: final_response

      # Build reversal payload — deposit reverses the original withdrawal.
      # source/destination are swapped from the original.
      - variables:
          _comp_rev_payload: >-
            {%- set orig = _comp_orig if _comp_orig is mapping else {} -%}
            {%- set tag_list = ['reversal', 'reverses:' ~ _comp_key, 'idempotency:' ~ _comp_reversal_key] -%}
            {%- set notes_str = 'Reversing transaction for key: ' ~ _comp_key ~ '.\nOriginal transaction ID: ' ~ orig.get('id', '') ~ '.' ~ ('\nReason: ' ~ _audit_note if _audit_note != '' else '') -%}
            {{ {'transactions': [{'type': 'deposit', 'date': _today, 'amount': orig.get('amount', 0) | float(0) | string, 'description': 'REVERSAL — ' ~ orig.get('description', ''), 'source_name': orig.get('destination', ''), 'destination_name': orig.get('source', ''), 'category_name': orig.get('category_name', 'Depreciation Expense'), 'tags': tag_list, 'notes': notes_str}]} | tojson }}

      # Post directly via zen_root_firefly — avoids re-entrant call to zen_dojotools_finance
      - action: script.zen_root_firefly
        continue_on_error: true
        response_variable: _comp_rev_raw
        data:
          action_type: post
          endpoint: transactions
          payload: '{{ _comp_rev_payload }}'

      - variables:
          _comp_ok: >-
            {%- if _comp_rev_raw is mapping and 'result' in _comp_rev_raw and _comp_rev_raw['result'] is mapping -%}
              {%- set status = _comp_rev_raw.get('status', '') -%}
              {{ status == 'success' }}
            {%- else -%}false{%- endif -%}
          final_response:
            status: "{{ 'success' if _comp_ok else 'error' }}"
            tool: '{{ tool_name }}'
            mode: compensate
            original_idempotency_key: '{{ _comp_key }}'
            reversal_idempotency_key: '{{ _comp_reversal_key }}'
            message: "{{ 'Reversal posted.' if _comp_ok else 'Reversal failed.' }}"
            evidence:
              dry_run: false
              caller: '{{ _caller }}'
              timestamp: '{{ _now }}'
              audit_note: "{{ _audit_note }}"
      - stop: compensate done
        response_variable: final_response

    ###########################################################################
    # help
    ###########################################################################
    - variables:
        final_response:
          status: info
          tool: '{{ tool_name }}'
          version: '{{ tool_version }}'
          mode: help
          feature_key: depreciation
          description: >-
            Household asset depreciation codex. Tracks depreciable assets in Grocy,
            calculates schedules (straight-line, DDB, declining_balance), posts
            transactions to Firefly with idempotency, supports business-use splits,
            disposal accounting, warranty tracking, attachment refs, and year-end
            CPA summary view.
          concepts:
            cost_basis: >-
              Everything paid to put the asset in service: purchase price + delivery +
              installation + tax. Not just the sticker price.
            salvage_value: >-
              Estimated value at end of useful life. Default 0 for most household assets.
              Only relevant for straight_line method.
            useful_life: >-
              Expected service life in months. Common references (not enforced):
              appliances 60-120 mo, HVAC 180 mo, roof 240-360 mo, water heater 120 mo.
            straight_line: >-
              (cost_basis - salvage_value) / useful_life_months. Equal amount each period.
              Most common household method.
            declining_balance: >-
              Book value * (1 / useful_life_months) each period. Accelerated — higher
              deductions early. Final period takes remaining depreciable balance.
            double_declining_balance: >-
              Book value * (2 / useful_life_months) each period. Switches to straight-line
              when SL for remaining periods exceeds DDB amount (standard crossover rule).
              Highest front-loading. Common for equipment with rapid obsolescence.
            business_use_allocation: >-
              If an asset is used partly for business, create an allocation row via
              asset_allocation_create with effective_date and business_use_percent.
              depreciable_asset_post_depreciation_period will then split the period
              into two Firefly transactions: household (Depreciation Expense) and
              business (Business Depreciation Expense). cpa_summary reports both splits.
            manual_no_post: >-
              Calculates depreciation schedule but never posts to Firefly. For tracking
              asset value without ledger entries.
            book_value: >-
              cost_basis minus accumulated_depreciation. Paper value only — not market
              value, not replacement cost.
            replacement_reserve: >-
              Monthly savings target to fund replacement. Based on replacement_cost_estimate,
              NOT cost_basis. Run depreciable_asset_replacement_plan to calculate.
            idempotency: >-
              Posting the same period twice is safe. Returns already_posted. Nothing
              duplicated. Use compensate to reverse a posted period if needed.
            dry_run: >-
              dry_run=true on any write mode validates and previews without writing
              anything. Overrides confirm. Always safe to call.
            evidence_refs: >-
              JSON list of typed cross-references stored on the asset record.
              Format: ["type:id", ...]. Common refs: "product:389" (Grocy product),
              "transaction:1447" (Firefly purchase transaction). Set via
              depreciable_asset_update asset_data={"evidence_refs":"[\"product:389\"]"}.
              Resolved by the Lens Bus — pass include_evidence=true on book_value
              to get inline enrichment.
            include_evidence: >-
              book_value only. Pass include_evidence=true to resolve evidence_refs
              inline. transaction:* refs call zen_stack_firefly and return
              transaction_evidence items. Other ref types return {ref, resolved:false,
              reason:unsupported_ref_type} — graceful, not an error.
            lens_bus: >-
              zen_stack_depreciation is this codex's Lens Bus provider. It handles
              label, area_id, and product anchors — consumers dispatch via
              zen_dojotools_lens_dispatch, not directly. product:389 anchor resolves
              to all assets whose grocy_product_id == "389". zen_stack_firefly handles
              transaction:* anchors and returns transaction_evidence. Both stacks
              are registered in the household lens_registry cabinet drawer.
            disposal_accounting: >-
              Two modes: depreciable_asset_dispose (marks Grocy status, computes gain/loss,
              no Firefly) and depreciable_asset_dispose_with_post (does both — T7 +
              posts final depreciation and proceeds transactions to Firefly). Gain/loss =
              proceeds minus book_value_at_disposal. Informational only, no tax modeling.
            warranty_tracking: >-
              Store warranty_expiration as YYYY-MM-DD on the asset record.
              depreciable_asset_warranty_check classifies all active assets as expired,
              expiring_soon (within days_threshold, default 90), or ok.
              depreciable_asset_warranty_report formats the same data for review.
            attachments: >-
              depreciable_asset_attach stores a reference (not the file) in
              attachment_refs field: {type, id, label, added_at}. Types: paperless, grocy.
              depreciable_asset_attachments_get reads them back. The attachment_refs field
              (Grocy userfield ID 145) must exist — created via userfields_create, NOT
              auto-created by firefly_setup.
            cpa_summary: >-
              depreciable_asset_cpa_summary year=YYYY returns: per-asset scheduled
              depreciation, business-use splits, disposals with gain/loss, Firefly
              category spend totals, and variance (scheduled minus posted). Read-only.
              Variance non-zero = unposted periods — run reconcile_firefly per asset.
          write_contract:
            dry_run: Validate + preview only. Never writes. Overrides confirm.
            idempotency_key: >-
              Check evidence envelope after each write. If already_done, operation
              succeeded previously — do NOT retry with a new key.
            caller: >-
              unauthorized means caller not in allowed_callers. Call tool_manifest
              to inspect the whitelist.
            audit_note: >-
              Required for dispose. Optional for other writes. Stored permanently
              in Grocy notes and Firefly transaction notes.
            compensate: >-
              Pass original idempotency_key to reverse a prior write. Grocy writes
              restore prior values. Firefly writes post a reversing transaction.
          workflow:
            - "1. depreciable_asset_firefly_setup (once — deploys Grocy schema + Firefly categories)"
            - "2. depreciable_asset_create with required fields (name, cost_basis, useful_life_months, placed_in_service_date, depreciation_method)"
            - "3. depreciable_asset_firefly_setup asset_id={id} to create piggy bank"
            - "4. depreciable_asset_calculate_schedule to preview full schedule"
            - "5. depreciable_asset_post_depreciation_period posting_mode=report_only to preview"
            - "6. posting_mode=summary_post confirm=true to post"
            - "7. depreciable_asset_book_value anytime for current paper value"
            - "7b. add include_evidence=true to resolve evidence_refs (transactions, etc.) inline"
            - "8. depreciable_asset_report for full portfolio"
            - "9. [optional] asset_allocation_create to record business-use percent — post_depreciation_period will split automatically"
            - "10. [optional] depreciable_asset_attach to link Paperless receipts or Grocy docs"
            - "11. [optional] depreciable_asset_warranty_check to review expiring warranties"
            - "12. [disposal] depreciable_asset_dispose_with_post confirm=true — marks disposed + posts final-depr + proceeds to Firefly"
            - "13. [reconcile] depreciable_asset_reconcile_firefly to diff schedule vs Firefly-posted"
            - "14. [year-end] cpa_summary asset_data={year:YYYY} for CPA-ready annual summary"
          troubleshooting:
            setup_required: Run depreciable_asset_firefly_setup first
            already_posted: Idempotency working correctly. Use compensate + re-post if wrong.
            already_done: Write succeeded previously. Check evidence envelope for result.
            unauthorized: caller not in allowed_callers — call tool_manifest to see list
            method_does_not_post: Asset uses manual_no_post — use book_value instead
            book_value_equals_cost_basis: No periods posted yet — correct for new asset
            schedule_row_count_wrong: Check placed_in_service_date format must be YYYY-MM-DD
            split_not_triggered: asset_allocation_get returned found=false — check effective_date format (YYYY-MM-DD) and that the period falls within the allocation date range
            attachment_write_error: attachment_refs userfield (ID 145) may not exist — create via zen_dojotools_inventory mode=userfields_create entity=userentity-depreciable_asset field_name=attachment_refs field_type=text-multi-line
            cpa_summary_variance_high: expected — most assets have unposted periods. Run depreciable_asset_reconcile_firefly per asset to identify missing posts
            disposal_already_disposed: T14 dispose_with_post is idempotent — if already_disposed, still attempts Firefly posts. Safe to retry.
    - variables:
        _dom_inner: "{{ final_response | combine({'domain': 'finance', 'peers': {'inventory': 'zen_dojotools_inventory'}, 'see_also': 'zen_dojotools_manifest mode=domains name=finance'}) }}"
    - variables:
        final_response: "{{ {'status': 'help', 'help': _dom_inner} }}"
    - stop: help
      response_variable: final_response


  ###########################################################################
  # zen_stack_depreciation
  # Lens Bus provider for depreciable asset evidence.
  # Named zen_stack_* → auto-discovered by bootstrap_stacks.
  ###########################################################################
  zen_stack_depreciation:
    alias: Zen Stack Depreciation Assets
    description: >-
      Depreciation Asset Lens Provider (v1.0.0). Internal stack adapter for the
      ZenOS Lens Bus. Returns asset_depreciation_evidence for label, area_id, and product
      anchors. Not MCP-exposed — consumers call zen_dojotools_lens_dispatch.
    mode: parallel
    fields:
      mode:
        description: Provider mode (stacks_by_anchor, register, unregister, health, inspect, audit, tool_manifest)
        selector:
          text:
      action:
        description: Alias for mode (lens dispatcher compat)
        selector:
          text:
      anchor_type:
        description: Anchor type — label, area_id, or product
        selector:
          text:
      anchor_ids:
        description: JSON array of anchor ID strings
        selector:
          text:
      caller_token:
        description: Caller token for audit trail
        selector:
          text:

    sequence:
    - variables:
        _mode_norm: >-
          {{ (mode | default('') if mode is defined and mode | string | trim != ''
              else (action | default('help') if action is defined else 'help'))
              | string | trim | lower }}
        _anchor_type_norm: "{{ anchor_type | default('') | string | trim | lower }}"
        _anchor_ids_raw: "{{ anchor_ids | default('[]') }}"
        _anchor_ids: >-
          {%- set _v = _anchor_ids_raw -%}
          {%- if _v is sequence and _v is not string -%}{{ _v }}
          {%- elif _v is string and _v | trim != '' -%}{{ _v | from_json(none) | default([]) }}
          {%- else -%}[]{%- endif -%}
        tool_name: zen_stack_depreciation
        tool_version: 1.0.0

    # ── tool_manifest ──────────────────────────────────────────────────────
    - if: "{{ _mode_norm == 'tool_manifest' }}"
      then:
      - variables:
          final_response: >-
            {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
            {{- MF.tool_manifest(
                tool=tool_name,
                display_name='Depreciation Assets Stack — Asset Lifecycle Lens',
                tier='stacks',
                version=tool_version,
                health={'configured': true, 'status': 'ok', 'notes': []},
                required_labels=[],
                optional_labels=['finance', 'depreciation'],
                consumes=['label', 'area_id', 'product'],
                returns=['asset_depreciation_evidence'],
                failure_policy='soft',
                content_policy='standard',
                risk_class='read_only',
                security_act={'model': 'rwxda', 'required': 'r', 'allowed': ['r'], 'denied': ['w', 'x', 'd', 'a'], 'note': 'Read-only asset lifecycle evidence; mutations require zen_dojotools_finance directly.'},
                modes={'lookup': 'stacks_by_anchor', 'manifest': 'tool_manifest', 'health': 'health'},
                limitations=['Read-only — asset create/dispose/schedule actions require zen_dojotools_finance directly.'],
                evidence_shape={'assets': {'asset_id': 'Grocy userobject asset id.', 'book_value': 'Current depreciated book value.'}},
                icon='mdi:chart-line-variant',
                color='green',
                stripe=2,
                impact='soft',
                mcp_exposed=false,
                lens_provider=true,
                caller_token=caller_token | default('')
            ) | from_json | combine({
                'register_mode': 'register',
                'provider_key': 'depreciation_assets',
                'domain': 'finance'
            }) -}}
      - stop: tool_manifest
        response_variable: final_response

    # ── health ─────────────────────────────────────────────────────────────
    - if: "{{ _mode_norm == 'health' }}"
      then:
      - action: script.zen_codex_finance_depreciation
        continue_on_error: true
        response_variable: _sd_health_raw
        data:
          mode: health
      - variables:
          final_response:
            status: "{{ _sd_health_raw.get('status', 'error') if _sd_health_raw is mapping else 'error' }}"
            tool: '{{ tool_name }}'
            version: '{{ tool_version }}'
            mode: health
            provider: depreciation_assets
            enabled: "{{ _sd_health_raw.get('enabled', false) if _sd_health_raw is mapping else false }}"
            grocy_ok: "{{ _sd_health_raw.get('grocy_ok', false) if _sd_health_raw is mapping else false }}"
            firefly_ok: "{{ _sd_health_raw.get('firefly_ok', false) if _sd_health_raw is mapping else false }}"
      - stop: health
        response_variable: final_response

    # ── inspect ────────────────────────────────────────────────────────────
    - if: "{{ _mode_norm == 'inspect' }}"
      then:
      - variables:
          final_response:
            status: ok
            tool: '{{ tool_name }}'
            version: '{{ tool_version }}'
            mode: inspect
            provider: depreciation_assets
            consumes: [label, area_id, product]
            returns: [asset_depreciation_evidence]
            failure_policy: soft
            description: >-
              Maps label/area_id/product anchors to depreciable assets via Grocy room_anchor
              and grocy_product_id fields. Returns asset_depreciation_evidence with current book value,
              replacement estimate, and risk flag. Max 10 items per anchor.
      - stop: inspect
        response_variable: final_response

    # ── register ───────────────────────────────────────────────────────────
    - if: "{{ _mode_norm == 'register' }}"
      then:
      - variables:
          _sd_household: >-
            {{ label_entities('zen_household_cabinet')
               | select('match', 'sensor\\.') | list | first | default('') }}
      - action: script.zen_dojotools_filecabinet
        continue_on_error: true
        response_variable: _sd_reg_read
        data:
          action_type: read
          volume_entity_id:
            - "{{ _sd_household }}"
          key: lens_registry
      - variables:
          _sd_existing: >-
            {%- set raw = _sd_reg_read if _sd_reg_read is mapping else {} -%}
            {%- set val = raw.get('value', {}) -%}
            {%- set parsed = val | from_json if val is string else val -%}
            {{ parsed if parsed is mapping else {} }}
          _sd_decl:
            provider: depreciation_assets
            configured_by: zen_stack_depreciation
            department: stacks
            enabled: true
            status: available
            tool: zen_stack_depreciation
            mode: stacks_by_anchor
            consumes: [label, area_id, product]
            returns: [asset_depreciation_evidence]
            failure_policy: soft
            content_policy: standard
            risk_class: read_only
      - action: script.zen_dojotools_filecabinet
        continue_on_error: true
        response_variable: _sd_reg_write
        data:
          action_type: upsert
          volume_entity_id:
            - "{{ _sd_household }}"
          key: lens_registry
          value: "{{ (_sd_existing | combine({'depreciation_assets': _sd_decl})) | tojson }}"
      - variables:
          _sd_ok: "{{ _sd_reg_write is mapping and _sd_reg_write.get('status', '') == 'success' }}"
          final_response:
            status: "{{ 'success' if _sd_ok else 'error' }}"
            tool: '{{ tool_name }}'
            mode: register
            provider: depreciation_assets
            message: "{{ 'Provider depreciation_assets registered in lens_registry.' if _sd_ok else 'Registration failed.' }}"
      - stop: register
        response_variable: final_response

    # ── unregister ─────────────────────────────────────────────────────────
    - if: "{{ _mode_norm == 'unregister' }}"
      then:
      - variables:
          _sd_ureg_household: >-
            {{ label_entities('zen_household_cabinet')
               | select('match', 'sensor\\.') | list | first | default('') }}
      - action: script.zen_dojotools_filecabinet
        continue_on_error: true
        response_variable: _sd_ureg_read
        data:
          action_type: read
          volume_entity_id:
            - "{{ _sd_ureg_household }}"
          key: lens_registry
      - variables:
          _sd_ureg_existing: >-
            {%- set raw = _sd_ureg_read if _sd_ureg_read is mapping else {} -%}
            {%- set val = raw.get('value', {}) -%}
            {%- set parsed = val | from_json if val is string else val -%}
            {{ parsed if parsed is mapping else {} }}
          _sd_ureg_new: >-
            {%- set ns = namespace(r={}) -%}
            {%- for k, v in _sd_ureg_existing.items() if k != 'depreciation_assets' -%}
              {%- set ns.r = ns.r | combine({k: v}) -%}
            {%- endfor -%}
            {{ ns.r }}
      - action: script.zen_dojotools_filecabinet
        continue_on_error: true
        response_variable: _sd_ureg_write
        data:
          action_type: upsert
          volume_entity_id:
            - "{{ _sd_ureg_household }}"
          key: lens_registry
          value: "{{ _sd_ureg_new | tojson }}"
      - variables:
          final_response:
            status: "{{ 'success' if _sd_ureg_write is mapping and _sd_ureg_write.get('status', '') == 'success' else 'error' }}"
            tool: '{{ tool_name }}'
            mode: unregister
            provider: depreciation_assets
      - stop: unregister
        response_variable: final_response

    # ── stacks_by_anchor ───────────────────────────────────────────────────
    - if: "{{ _mode_norm == 'stacks_by_anchor' }}"
      then:
      # Get all assets
      - action: script.zen_codex_finance_depreciation
        continue_on_error: true
        response_variable: _sd_list_raw
        data:
          mode: depreciable_asset_list
          caller: zen_stack_depreciation
      - variables:
          _sd_assets: >-
            {{ (_sd_list_raw.get('assets', []) if _sd_list_raw is mapping else []) }}
          _sd_evidence: []

      - repeat:
          for_each: >-
            {{ _anchor_ids if _anchor_ids is sequence and _anchor_ids is not string else [] }}
          sequence:
          - variables:
              _sd_anchor_id: "{{ repeat.item | string | trim }}"
          - variables:
              _sd_matched: >-
                {%- set ns = namespace(m=[]) -%}
                {%- for a in _sd_assets if a is mapping -%}
                  {%- set _rm = a.get('room_anchor', '') | string | lower | trim -%}
                  {%- set _aid = _sd_anchor_id | lower | trim -%}
                  {%- set _gp = a.get('grocy_product_id', '') | string | trim -%}
                  {%- if _anchor_type_norm == 'area_id' and _rm == _aid -%}
                    {%- set ns.m = ns.m + [a] -%}
                  {%- elif _anchor_type_norm == 'label' and _aid in _rm -%}
                    {%- set ns.m = ns.m + [a] -%}
                  {%- elif _anchor_type_norm == 'product' and _gp != '' and _gp == _aid -%}
                    {%- set ns.m = ns.m + [a] -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.m[:10] }}

          - repeat:
              for_each: "{{ _sd_matched }}"
              sequence:
              - action: script.zen_codex_finance_depreciation
                continue_on_error: true
                response_variable: _sd_bv_raw
                data:
                  mode: depreciable_asset_book_value
                  asset_id: "{{ repeat.item.get('asset_id', 0) | string }}"
                  caller: zen_stack_depreciation
              - variables:
                  _sd_bv: "{{ _sd_bv_raw.get('data', {}) if _sd_bv_raw is mapping else {} }}"
                  _sd_evidence: >-
                    {{ _sd_evidence + [{
                      'id': 'asset:' ~ (repeat.item.get('asset_id', 0) | string),
                      'type': 'asset_depreciation_evidence',
                      'asset_name': repeat.item.get('name', ''),
                      'asset_id': repeat.item.get('asset_id', 0),
                      'room_anchor': repeat.item.get('room_anchor', ''),
                      'cost_basis': _sd_bv.get('cost_basis', 0),
                      'current_book_value': _sd_bv.get('current_book_value', 0),
                      'accumulated_depreciation': _sd_bv.get('accumulated_depreciation', 0),
                      'replacement_estimate': repeat.item.get('replacement_cost_estimate', 0),
                      'depreciation_method': repeat.item.get('depreciation_method', ''),
                      'status': repeat.item.get('status', 'active'),
                      'placed_in_service_date': repeat.item.get('placed_in_service_date', ''),
                      'anchor_type': _anchor_type_norm,
                      'anchor_id': _sd_anchor_id,
                      'confidence': 'explicit'
                    }] }}

      - variables:
          final_response:
            status: success
            tool: '{{ tool_name }}'
            version: '{{ tool_version }}'
            mode: stacks_by_anchor
            provider: depreciation_assets
            anchor_type: '{{ _anchor_type_norm }}'
            anchor_ids: '{{ _anchor_ids }}'
            evidence: '{{ _sd_evidence }}'
            count: '{{ _sd_evidence | length }}'
      - stop: stacks_by_anchor done
        response_variable: final_response

    # ── help / unknown ─────────────────────────────────────────────────────
    - variables:
        final_response:
          status: info
          tool: '{{ tool_name }}'
          version: '{{ tool_version }}'
          mode: help
          provider: depreciation_assets
          description: >-
            Depreciation Asset Lens Provider. Internal stack adapter for ZenOS Lens Bus.
            Call via zen_dojotools_lens_dispatch, not directly.
          modes:
            stacks_by_anchor: Fetch asset_depreciation_evidence for label or area_id anchors
            register: Register this provider in the household lens_registry cabinet drawer
            unregister: Remove this provider from lens_registry
            health: Check Grocy + Firefly reachability via zen_codex_finance_depreciation
            inspect: Show provider capabilities and contract
            tool_manifest: Full tool manifest declaration
    - stop: help
      response_variable: final_response

###############################################################################
# T9: Monthly Depreciation Scheduler
# Fires on the 1st of each month at 02:00 — posts prior month depreciation
# for all active assets via depreciable_asset_post_due_depreciation.
###############################################################################
automation:
  - alias: "Zen Depreciation — Monthly Post Due"
    id: zen_depreciation_monthly_post_due
    trigger:
      - trigger: time
        at: "02:00:00"
    condition:
      - condition: template
        value_template: "{{ now().day == 1 }}"
    action:
      - action: script.zen_dojotools_finance
        continue_on_error: true
        data:
          mode: run
          case: depreciable_asset_post_due_depreciation
          confirm: true
          posting_mode: summary_post
