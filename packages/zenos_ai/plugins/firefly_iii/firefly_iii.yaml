            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  version: '{{ tool_version }}'
                  case: piggybank_create
                  result: null
                  error: item (piggy bank name) and source_account (savings account name) are both required
            - stop: return
              response_variable: final_response
        - action: script.zen_root_firefly
          response_variable: _pbc_ac_resp
          continue_on_error: true
          data:
            action_type: get
            endpoint: 'autocomplete/accounts?query={{ src_acct_norm | urlencode }}&limit=20'
        - variables:
            _pbc_acct_id: >-
              {%- set c = (_pbc_ac_resp['result']['content'] | default([])) if (_pbc_ac_resp is mapping and 'result' in _pbc_ac_resp and _pbc_ac_resp['result'] is mapping) else [] -%}
              {%- set c = c if c is sequence and c is not string and c is not mapping else [] -%}
              {%- set _ns = namespace(found=none) -%}
              {%- for a in c -%}{%- if (a.get('name','') | lower) == (src_acct_norm | lower) -%}{%- set _ns.found = a.get('id') | string -%}{%- endif -%}{%- endfor -%}
              {{ _ns.found }}
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _pbc_acct_id is none }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  version: '{{ tool_version }}'
                  case: piggybank_create
                  result: null
                  error: 'No account found matching "{{ src_acct_norm }}".'
            - stop: return
              response_variable: final_response
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ not _pbc_confirm }}'
            sequence:
            - variables:
                final_response:
                  status: confirm_required
                  tool: '{{ tool_name }}'
                  version: '{{ tool_version }}'
                  case: piggybank_create
                  result:
                    planned:
                      name: '{{ item_norm }}'
                      account_id: '{{ _pbc_acct_id }}'
                      account: '{{ src_acct_norm }}'
                      target_amount: '{{ _pbc_target }}'
                      target_date: '{{ _pbc_tdate }}'
                  message: Set confirm=true to create this piggy bank.
            - stop: return
              response_variable: final_response
        - variables:
            _pbc_payload: >-
              {%- set body = {'name': item_norm, 'account_id': _pbc_acct_id | int} -%}
              {%- if _pbc_target is not none -%}{%- set body = body | combine({'target_amount': _pbc_target | float(0) | string}) -%}{%- endif -%}
              {%- if _pbc_tdate != '' -%}{%- set body = body | combine({'target_date': _pbc_tdate}) -%}{%- endif -%}
              {%- if _pbc_notes != '' -%}{%- set body = body | combine({'notes': _pbc_notes}) -%}{%- endif -%}
              {{ body | tojson }}
        - action: script.zen_root_firefly
          response_variable: _pbc_resp
          continue_on_error: true
          data:
            action_type: post
            endpoint: piggy-banks
            payload: '{{ _pbc_payload }}'
        - variables:
            _pbc_result: >-
              {%- if _pbc_resp is mapping and 'result' in _pbc_resp and _pbc_resp['result'] is mapping -%}
                {%- set d = _pbc_resp['result']['content'] | default({}) -%}
                {%- if d is mapping -%}
                  {%- set obj = d.get('data', {}) -%}
                  {{ obj.get('attributes', {}) | combine({'id': obj.get('id', '')}) if obj is mapping else {} }}
                {%- else -%}{{ {} }}{%- endif -%}
              {%- else -%}{{ {} }}{%- endif -%}
        - variables:
            final_response:
              status: '{{ _pbc_resp["status"] | default("error") if _pbc_resp is mapping else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: piggybank_create
              result: '{{ _pbc_result }}'
        - stop: return
          response_variable: final_response

    # ── case: bill_create ─────────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm == "run" and case_norm == "bill_create" }}'
        sequence:
        - variables:
            _bilc_confirm: '{{ confirm | default(false) | bool }}'
            _bilc_notes: '{{ notes | default("") | string | trim }}'
            _bilc_amt: '{{ amount_norm }}'
            _bilc_freq: '{{ limit_period | default("monthly") | string | trim | lower }}'
            _bilc_date: '{{ date_norm }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ item_norm == "" or _bilc_amt == 0 }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  version: '{{ tool_version }}'
                  case: bill_create
                  result: null
                  error: item (bill name) and amount are both required for bill_create
            - stop: return
              response_variable: final_response
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ not _bilc_confirm }}'
            sequence:
            - variables:
                final_response:
                  status: confirm_required
                  tool: '{{ tool_name }}'
                  version: '{{ tool_version }}'
                  case: bill_create
                  result:
                    planned:
                      name: '{{ item_norm }}'
                      amount: '{{ _bilc_amt }}'
                      repeat_freq: '{{ _bilc_freq }}'
                      start_date: '{{ _bilc_date }}'
                  message: Set confirm=true to create this bill.
            - stop: return
              response_variable: final_response
        - variables:
            _bilc_payload: >-
              {%- set body = {'name': item_norm, 'amount_min': _bilc_amt | string, 'amount_max': _bilc_amt | string, 'date': _bilc_date, 'repeat_freq': _bilc_freq, 'active': true, 'currency_code': 'USD'} -%}
              {%- if _bilc_notes != '' -%}{%- set body = body | combine({'notes': _bilc_notes}) -%}{%- endif -%}
              {{ body | tojson }}
        - action: script.zen_root_firefly
          response_variable: _bilc_resp
          continue_on_error: true
          data:
            action_type: post
            endpoint: bills
            payload: '{{ _bilc_payload }}'
        - variables:
            _bilc_result: >-
              {%- if _bilc_resp is mapping and 'result' in _bilc_resp and _bilc_resp['result'] is mapping -%}
                {%- set d = _bilc_resp['result']['content'] | default({}) -%}
                {%- if d is mapping -%}
                  {%- set obj = d.get('data', {}) -%}
                  {{ obj.get('attributes', {}) | combine({'id': obj.get('id', '')}) if obj is mapping else {} }}
                {%- else -%}{{ {} }}{%- endif -%}
              {%- else -%}{{ {} }}{%- endif -%}
        - variables:
            final_response:
              status: '{{ _bilc_resp["status"] | default("error") if _bilc_resp is mapping else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: bill_create
              result: '{{ _bilc_result }}'
        - stop: return
          response_variable: final_response

    # ── case: transaction_link ────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm == "run" and case_norm == "transaction_link" }}'
        sequence:
        - variables:
            _tl2_confirm: '{{ confirm | default(false) | bool }}'
            _tl2_ref: '{{ external_ref | default("") | string | trim }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ item_id_norm == "" or _tl2_ref == "" }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  version: '{{ tool_version }}'
                  case: transaction_link
                  result: null
                  error: item_id (transaction ID) and external_ref are both required for transaction_link
            - stop: return
              response_variable: final_response
        - action: script.zen_root_firefly
          response_variable: _tl2_get_resp
          continue_on_error: true
          data:
            action_type: get
            endpoint: 'transactions/{{ item_id_norm }}'
        - variables:
            _tl2_existing: >-
              {%- if _tl2_get_resp is mapping and 'result' in _tl2_get_resp and _tl2_get_resp['result'] is mapping -%}
                {%- set d = _tl2_get_resp['result']['content'] | default({}) -%}
                {%- if d is mapping -%}
                  {%- set obj = d.get('data', {}) -%}
                  {%- if obj is mapping -%}
                    {%- set attrs = obj.get('attributes', {}) -%}
                    {%- set txns = attrs.get('transactions', []) -%}
                    {{ txns[0] if txns | length > 0 else {} }}
                  {%- else -%}{{ {} }}{%- endif -%}
                {%- else -%}{{ {} }}{%- endif -%}
              {%- else -%}{{ {} }}{%- endif -%}
        - variables:
            _tl2_existing_notes: '{{ _tl2_existing.get("notes", "") | default("") | string | trim if _tl2_existing is mapping else "" }}'
            _tl2_link_tag: '[ref:{{ _tl2_ref }}]'
        - variables:
            _tl2_already_linked: '{{ _tl2_link_tag in _tl2_existing_notes }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _tl2_already_linked }}'
            sequence:
            - variables:
                final_response:
                  status: success
                  tool: '{{ tool_name }}'
                  version: '{{ tool_version }}'
                  case: transaction_link
                  result:
                    transaction_id: '{{ item_id_norm }}'
                    external_ref: '{{ _tl2_ref }}'
                    already_linked: true
                    notes: '{{ _tl2_existing_notes }}'
            - stop: return
              response_variable: final_response
        - variables:
            _tl2_new_notes: '{{ (_tl2_existing_notes ~ " " ~ _tl2_link_tag) | trim }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ not _tl2_confirm }}'
            sequence:
            - variables:
                final_response:
                  status: confirm_required
                  tool: '{{ tool_name }}'
                  version: '{{ tool_version }}'
                  case: transaction_link
                  result:
                    transaction_id: '{{ item_id_norm }}'
                    external_ref: '{{ _tl2_ref }}'
                    existing_notes: '{{ _tl2_existing_notes }}'
                    new_notes: '{{ _tl2_new_notes }}'
                  message: Set confirm=true to append this reference to the transaction notes.
            - stop: return
              response_variable: final_response
        - variables:
            _tl2_payload: '{{ {"transactions": [{"notes": _tl2_new_notes}]} | tojson }}'
        - action: script.zen_root_firefly
          response_variable: _tl2_put_resp
          continue_on_error: true
          data:
            action_type: put
            endpoint: 'transactions/{{ item_id_norm }}'
            payload: '{{ _tl2_payload }}'
        - variables:
            final_response:
              status: '{{ _tl2_put_resp["status"] | default("error") if _tl2_put_resp is mapping else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: transaction_link
              result:
                transaction_id: '{{ item_id_norm }}'
                external_ref: '{{ _tl2_ref }}'
                linked: '{{ _tl2_put_resp["status"] | default("error") == "success" if _tl2_put_resp is mapping else false }}'
                notes: '{{ _tl2_new_notes }}'
        - stop: return
          response_variable: final_response

    # ── case: category_create ────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm == "run" and case_norm == "category_create" }}'
        sequence:
        - variables:
            _cc_confirm: '{{ confirm | default(false) | bool }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ item_norm == "" }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  version: '{{ tool_version }}'
                  case: category_create
                  result: null
                  error: item (category name) is required for category_create
            - stop: return
              response_variable: final_response
        - action: script.zen_root_firefly
          continue_on_error: true
          response_variable: _cc_check_resp
          data:
            action_type: get
            endpoint: 'autocomplete/categories?query={{ item_norm | urlencode }}&limit=50'
        - variables:
            _cc_existing: >-
              {%- set c = (_cc_check_resp['result']['content'] | default([])) if (_cc_check_resp is mapping and 'result' in _cc_check_resp and _cc_check_resp['result'] is mapping) else [] -%}
              {%- set c = c if c is sequence and c is not string and c is not mapping else [] -%}
              {%- set _ns = namespace(found=none) -%}
              {%- for a in c -%}{%- if (a.get('name', '') | lower) == (item_norm | lower) -%}{%- set _ns.found = a.get('id') | string -%}{%- endif -%}{%- endfor -%}
              {{ _ns.found }}
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _cc_existing is not none }}'
            sequence:
            - variables:
                final_response:
                  status: success
                  tool: '{{ tool_name }}'
                  version: '{{ tool_version }}'
                  case: category_create
                  result:
                    name: '{{ item_norm }}'
                    id: '{{ _cc_existing }}'
                    already_existed: true
            - stop: return
              response_variable: final_response
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ not _cc_confirm }}'
            sequence:
            - variables:
                final_response:
                  status: confirm_required
                  tool: '{{ tool_name }}'
                  version: '{{ tool_version }}'
                  case: category_create
                  result:
                    planned:
                      name: '{{ item_norm }}'
                  message: Set confirm=true to create this category.
            - stop: return
              response_variable: final_response
        - action: script.zen_root_firefly
          response_variable: _cc_post_resp
          continue_on_error: true
          data:
            action_type: post
            endpoint: categories
            payload: '{{ {"name": item_norm} | tojson }}'
        - variables:
            _cc_result: >-
              {%- if _cc_post_resp is mapping and 'result' in _cc_post_resp and _cc_post_resp['result'] is mapping -%}
                {%- set d = _cc_post_resp['result']['content'] | default({}) -%}
                {%- if d is mapping -%}
                  {%- set obj = d.get('data', {}) -%}
                  {{ obj.get('attributes', {}) | combine({'id': obj.get('id', '')}) if obj is mapping else {} }}
                {%- else -%}{{ {} }}{%- endif -%}
              {%- else -%}{{ {} }}{%- endif -%}
        - variables:
            final_response:
              status: '{{ _cc_post_resp["status"] | default("error") if _cc_post_resp is mapping else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: category_create
              result: '{{ _cc_result }}'
        - stop: return
          response_variable: final_response

    # ── case: index ───────────────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm == "run" and case_norm == "index" }}'
        sequence:
        - variables:
            _idx_household: >-
              {{ label_entities('Zen Household Cabinet')
                 | select('match', 'sensor\\.') | list | first | default('') }}
        - action: script.zen_dojotools_filecabinet
          continue_on_error: true
          response_variable: _idx_reg_read
          data:
            action_type: read
            volume_entity_id:
              - "{{ _idx_household }}"
            key: codex_registry
        - variables:
            _idx_registry: >-
              {%- set raw = _idx_reg_read if _idx_reg_read is mapping else {} -%}
              {%- set val = raw.get('value', {}) -%}
              {%- set parsed = val | from_json if val is string else val -%}
              {{ parsed if parsed is mapping else {} }}
            _idx_known_cases: >-
              {{ cases.keys() | list }}
            _idx_codices: >-
              {%- set ns = namespace(d={}) -%}
              {%- for key, entry in _idx_registry.items() if entry is mapping -%}
                {%- set ns.d = ns.d | combine({key: {
                  'script': entry.get('script', ''),
                  'modes': entry.get('modes', []),
                  'status': entry.get('status', 'unknown'),
                  'registered_at': entry.get('registered_at', '')
                }}) -%}
              {%- endfor -%}
              {{ ns.d }}
            _idx_codex_modes: >-
              {%- set ns = namespace(modes=[]) -%}
              {%- for key, entry in _idx_registry.items() if entry is mapping -%}
                {%- set ns.modes = ns.modes + (entry.get('modes') or []) -%}
              {%- endfor -%}
              {{ ns.modes }}
        - variables:
            final_response:
              status: ok
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: index
              result:
                known_cases: '{{ _idx_known_cases }}'
                codices: '{{ _idx_codices }}'
                codex_modes: '{{ _idx_codex_modes }}'
                all_cases: '{{ (_idx_known_cases + _idx_codex_modes) | unique | list }}'
                total_cases: '{{ (_idx_known_cases + _idx_codex_modes) | unique | list | length }}'
        - stop: return
          response_variable: final_response

    # ── case: inspect ─────────────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm == "run" and case_norm == "inspect" }}'
        sequence:
        - action: script.zen_root_firefly
          continue_on_error: true
          response_variable: _ins_ff_raw
          data:
            action_type: get
            endpoint: about
        - variables:
            _ins_ff_ok: >-
              {{ _ins_ff_raw is mapping and _ins_ff_raw.get('status', '') == 'success' }}
            _ins_household: >-
              {{ label_entities('Zen Household Cabinet')
                 | select('match', 'sensor\\.') | list | first | default('') }}
        - action: script.zen_dojotools_filecabinet
          continue_on_error: true
          response_variable: _ins_reg_read
          data:
            action_type: read
            volume_entity_id:
              - "{{ _ins_household }}"
            key: codex_registry
        - variables:
            _ins_registry: >-
              {%- set raw = _ins_reg_read if _ins_reg_read is mapping else {} -%}
              {%- set val = raw.get('value', {}) -%}
              {%- set parsed = val | from_json if val is string else val -%}
              {{ parsed if parsed is mapping else {} }}
            _ins_features: {}
        - repeat:
            for_each: >-
              {{ _ins_registry.keys() | list }}
            sequence:
            - variables:
                _ins_entry: "{{ _ins_registry.get(repeat.item, {}) }}"
                _ins_script: "{{ _ins_entry.get('script', '') }}"
            - if: "{{ _ins_script != '' }}"
              then:
              - action: "script.{{ _ins_script }}"
                continue_on_error: true
                response_variable: _ins_tm_raw
                data:
                  mode: health
              - variables:
                  _ins_codex_ok: >-
                    {{ _ins_tm_raw is mapping and _ins_tm_raw.get('enabled', false) }}
                  _ins_features: >-
                    {{ _ins_features | combine({repeat.item: {
                      'script': _ins_script,
                      'enabled': _ins_codex_ok,
                      'modes_count': (_ins_entry.get('modes') or []) | length,
                      'health_status': (_ins_tm_raw.get('status', 'error') if _ins_tm_raw is mapping else 'error'),
                      'grocy_ok': (_ins_tm_raw.get('grocy_ok', false) if _ins_tm_raw is mapping else false),
                      'firefly_ok': (_ins_tm_raw.get('firefly_ok', false) if _ins_tm_raw is mapping else false)
                    }}) }}
        - variables:
            final_response:
              status: ok
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: inspect
              result:
                firefly_reachable: '{{ _ins_ff_ok }}'
                codex_count: '{{ _ins_registry.keys() | list | length }}'
                features: '{{ _ins_features }}'
        - stop: return
          response_variable: final_response

    # ── case: bootstrap_codices ───────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm == "run" and case_norm == "bootstrap_codices" }}'
        sequence:
        - variables:
            _bc2_household: >-
              {{ label_entities('Zen Household Cabinet')
                 | select('match', 'sensor\\.') | list | first | default('') }}
            # Static list of known zen_codex_finance_* scripts.
            # Add a new entry here when a new codex is created.
            _bc2_known:
              - zen_codex_finance_depreciation
              - zen_codex_finance_cogs
        - action: script.zen_dojotools_filecabinet
          continue_on_error: true
          response_variable: _bc2_reg_read
          data:
            action_type: read
            volume_entity_id:
              - "{{ _bc2_household }}"
            key: codex_registry
        - variables:
            _bc2_existing: >-
              {%- set raw = _bc2_reg_read if _bc2_reg_read is mapping else {} -%}
              {%- set val = raw.get('value', {}) -%}
              {%- set parsed = val | from_json if val is string else val -%}
              {{ parsed if parsed is mapping else {} }}
            _bc2_results: []
        - repeat:
            for_each: "{{ _bc2_known }}"
            sequence:
            - action: "script.{{ repeat.item }}"
              continue_on_error: true
              response_variable: _bc2_tm_raw
              data:
                mode: tool_manifest
            - variables:
                _bc2_tm_ok: >-
                  {{ _bc2_tm_raw is mapping and _bc2_tm_raw.get('status', '') in ['ok', 'success'] }}
                _bc2_feature_key: >-
                  {{ _bc2_tm_raw.get('feature_key', '') if _bc2_tm_raw is mapping else '' }}
                _bc2_modes: >-
                  {{ _bc2_tm_raw.get('modes', []) if _bc2_tm_raw is mapping else [] }}
            - if: "{{ _bc2_tm_ok and _bc2_feature_key != '' }}"
              then:
              - variables:
                  _bc2_entry:
                    feature_key: '{{ _bc2_feature_key }}'
                    script: '{{ repeat.item }}'
                    parent_tool: zen_dojotools_finance
                    version: "{{ _bc2_tm_raw.get('version', '') if _bc2_tm_raw is mapping else '' }}"
                    tier: codex
                    domain: finance
                    modes: '{{ _bc2_modes }}'
                    registered_at: '{{ now().isoformat() }}'
                    status: available
                  _bc2_existing: "{{ _bc2_existing | combine({_bc2_feature_key: _bc2_entry}) }}"
                  _bc2_results: "{{ _bc2_results + [{'script': repeat.item, 'feature_key': _bc2_feature_key, 'status': 'registered'}] }}"
            - if: "{{ not _bc2_tm_ok }}"
              then:
              - variables:
                  _bc2_results: "{{ _bc2_results + [{'script': repeat.item, 'status': 'failed', 'error': 'tool_manifest call failed'}] }}"
        - action: script.zen_dojotools_filecabinet
          continue_on_error: true
          response_variable: _bc2_write_raw
          data:
            action_type: upsert
            volume_entity_id:
              - "{{ _bc2_household }}"
            key: codex_registry
            value: "{{ _bc2_existing | tojson }}"
        - variables:
            _bc2_write_ok: >-
              {{ _bc2_write_raw is mapping and _bc2_write_raw.get('status', '') == 'success' }}
            final_response:
              status: "{{ 'success' if _bc2_write_ok else 'partial' }}"
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: bootstrap_codices
              result:
                scanned: '{{ _bc2_known }}'
                results: '{{ _bc2_results }}'
                registry_written: '{{ _bc2_write_ok }}'
                codex_count: '{{ _bc2_results | selectattr("status", "equalto", "registered") | list | length }}'
        - stop: return
          response_variable: final_response

    # ── mode: kfc_manifest ───────────────────────────────────────────────────
    # Multi-component KFC definition. bootstrap_kfc reads this and writes one
    # live drawer per component into the dojo cabinet.
    # No component param → returns full list (for bootstrap).
    # component param → returns single dict (for FC live drawer resolution).
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm == "kfc_manifest" }}'
        sequence:
        - variables:
            _kfc_defs:
              - kata_key: finance_budget
                friendly_name: Finance Budget Tracker
                label: Finance Budget
                component_summary: >-
                  Monthly budget vs actual across all Firefly III budgets.
                  Reports per-budget spend, remaining, % used, and days left
                  in the current period. Flags over-budget categories.
                component_instructions: >-
                  You will receive a budget_summary result. Work only from the data provided —
                  do not invent budget names, amounts, or watchlist entries.

                  If result.budgets is empty or missing: urgency=0, attention=null, error=null,
                  one sentence in general_inference: "No Firefly III budget limits configured." Nothing else.

                  If budgets present: report only budgets in the data.
                  urgency=4 if any over_budget=true.
                  urgency=3 if any pct_used >= 80 and days_left_in_period < 7.
                  urgency=2 if any pct_used >= 80.
                  urgency=1 otherwise.
                  attention: name the specific over-limit or high-pct budgets by name from the data.
                  watchlist: include only budget names with over_budget=true or pct_used >= 80. Empty list if none qualify.
                tool: zen_dojotools_finance
                seed:
                  tool: zen_dojotools_finance
                  params:
                    mode: run
                    case: budget_summary
                trigger_subscriptions: daily_midnight,weekly_trigger_monday
                drift_threshold: 6
                emission_cooldown_minutes: 1440
                delay_seconds: 0
                meta:
                  enabled: true
                  requires:
                    cert: ''
                    level: 0
              - kata_key: finance_bills
                friendly_name: Finance Bill Monitor
                label: Finance Bills
                component_summary: >-
                  Upcoming and overdue recurring bills from Firefly III.
                  Flags missed payments and bills due within the next 7 days.
                component_instructions: >-
                  You will receive a bills_list result. Work only from data provided.

                  result.bills is a list. If empty or missing: urgency=0, attention=null, error=null,
                  general_inference: "No bills configured in Firefly III." Nothing else.

                  If bills present:
                  urgency=4 if any overdue=true.
                  urgency=2 if any bill has next_expected_match within 7 days from now and overdue=false.
                  urgency=1 otherwise.
                  attention: name overdue bills first, then bills due within 7 days.
                  watchlist: only bill names that are overdue or due within 7 days. Empty list if none.
                  Do not mention bills far in the future unless they are the only ones.
                tool: zen_dojotools_finance
                seed:
                  tool: zen_dojotools_finance
                  params:
                    mode: run
                    case: bills_list
                trigger_subscriptions: daily_midnight,zen_finance_transaction_posted
                drift_threshold: 12
                emission_cooldown_minutes: 720
                delay_seconds: 15
                meta:
                  enabled: true
                  requires:
                    cert: ''
                    level: 0
              - kata_key: finance_networth
                friendly_name: Finance Net Worth
                label: Finance Net Worth
                component_summary: >-
                  Balance sheet snapshot: total assets, total liabilities, and net worth
                  across all Firefly III accounts.
                component_instructions: >-
                  You will receive a net_worth_snapshot result. Work only from data provided.

                  If result is missing or empty: urgency=0, attention=null, error=null, watchlist=[],
                  general_inference: "Net worth data unavailable — Firefly III may be unreachable." Nothing else.

                  result has: net_worth (float), total_assets (float), total_liabilities (float),
                  assets.accounts list [{name, balance}], liabilities.accounts list [{name, balance}].

                  Ignore accounts whose name starts with "Test" — these are test fixtures, not real assets.
                  Apply urgency to non-test accounts only.

                  urgency=3 if total_liabilities > 0.
                  urgency=2 if any non-test account balance < 0.
                  urgency=1 if net_worth < 1000.
                  urgency=0 otherwise (healthy balance sheet).
                  attention: name accounts with negative balance or name the liability if any. null if all healthy.
                  watchlist: non-test account names where balance < 0, or liability names. Empty list if all healthy.
                  general_inference (always required, never null): one sentence — "Net worth $X. Total assets $Y,
                  no liabilities, all accounts positive." or note any flagged items. Use actual values.
                tool: zen_dojotools_finance
                seed:
                  tool: zen_dojotools_finance
                  params:
                    mode: run
                    case: net_worth_snapshot
                trigger_subscriptions: daily_midnight,zen_finance_transaction_posted
                drift_threshold: 48
                emission_cooldown_minutes: 1440
                delay_seconds: 30
                meta:
                  enabled: true
                  requires:
                    cert: ''
                    level: 0
              - kata_key: finance_manager
                friendly_name: Finance Manager Rollup
                label: Finance Manager
                component_summary: >-
                  Synthesized finance overview: budget health, bill obligations, and
                  balance sheet in one kata. Drives the daily finance briefing.
                component_instructions: >-
                  You will receive a finance_rollup result with keys: budget, bills, net_worth.
                  Each is the result object from its sub-case. Work only from data provided.

                  If result is missing or all three sub-keys are empty: urgency=0, attention=null,
                  error=null, watchlist=[], general_inference: "Finance rollup unavailable." Nothing else.

                  budget sub-result: {budgets: [...], days_total_in_period, period_start, period_end}
                  bills sub-result: {bills: [...], today}
                  net_worth sub-result: {net_worth, total_assets, total_liabilities, assets, liabilities}

                  Ignore accounts/assets whose name starts with "Test".

                  Per-domain urgency rules:
                  budget: 4=any over_budget, 3=pct_used>=80+days_left<7, 2=pct_used>=80, 1=else, 0=empty.
                  bills: 4=any overdue, 2=any due within 7 days, 1=else, 0=empty.
                  net_worth: 3=liabilities>0, 2=non-test account<0, 1=net_worth<1000, 0=healthy.

                  overall urgency = max of the three domain urgencies.
                  attention: brief cross-domain summary of flagged items. null if all domains healthy/empty.
                  watchlist: union of flagged items from all domains. Deduplicate. Empty list if none.
                  general_inference (always required, never null): 1-2 sentences. Synthesize financial health.
                  If budget/bills are unconfigured, say so briefly and focus on net worth. Use specific numbers.
                tool: zen_dojotools_finance
                seed:
                  tool: zen_dojotools_finance
                  params:
                    mode: run
                    case: finance_rollup
                trigger_subscriptions: daily_midnight,zen_finance_transaction_posted
                drift_threshold: 6
                emission_cooldown_minutes: 720
                delay_seconds: 60
                meta:
                  enabled: true
                  requires:
                    cert: ''
                    level: 0
        - variables:
            _kfc_component: '{{ component | default("") | lower | trim }}'
            _kfc_match: >-
              {%- set ns = namespace(found=none) -%}
              {%- for d in _kfc_defs if d.get("kata_key", "") == _kfc_component -%}
                {%- set ns.found = d -%}
              {%- endfor -%}
              {{ ns.found }}
        - variables:
            # tojson → bootstrap_kfc parses with from_json → native list/dict for for_each.
            _kfc_value: >-
              {%- if _kfc_component != "" and _kfc_match is mapping -%}
                {{ _kfc_match | tojson }}
              {%- else -%}
                {{ _kfc_defs | tojson }}
              {%- endif -%}
        - variables:
            final_response:
              status: ok
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              mode: kfc_manifest
              kfc: '{{ _kfc_value }}'
        # Register self on the FC callout whitelist — idempotent.
        - action: script.zen_admintools_prompt_loader
          continue_on_error: true
          data:
            mode: whitelist
            whitelist_type: fc
            action_type: add
            item: zen_dojotools_finance:kfc_manifest
            caller_token: zen_dojotools_finance_kfc_manifest
        # Register self on the summarizer seed whitelist — idempotent.
        - action: script.zen_admintools_prompt_loader
          continue_on_error: true
          data:
            mode: whitelist
            whitelist_type: seed
            action_type: add
            item: zen_dojotools_finance
            caller_token: zen_dojotools_finance_kfc_seed
        - stop: return
          response_variable: final_response

    # ── mode: report ─────────────────────────────────────────────────────────
    # Composable CFO dashboard. Auto-discovers codex report modes from codex_registry.
    # Whitelisted as zen_dojotools_finance:report for FC live drawer use (read-only by design).
    # Pieces: 'rollup' = native finance_rollup; others = codex feature_key with *_report mode.
    # include=a,b → only those; exclude=a,b → all except those; default → all pieces.
    - if: "{{ mode_norm == 'report' }}"
      then:
      - variables:
          _rpt_include_raw: "{{ include | default('') | string | trim | lower }}"
          _rpt_exclude_raw: "{{ exclude | default('') | string | trim | lower }}"
          _rpt_household: >-
            {{ label_entities('Zen Household Cabinet')
               | select('match', 'sensor\\.') | list | first | default('') }}
      - action: script.zen_dojotools_filecabinet
        continue_on_error: true
        response_variable: _rpt_reg_read
        data:
          action_type: read
          volume_entity_id:
            - "{{ _rpt_household }}"
          key: codex_registry
      - variables:
          _rpt_registry: >-
            {%- set raw = _rpt_reg_read if _rpt_reg_read is mapping else {} -%}
            {%- set val = raw.get('value', {}) -%}
            {%- set parsed = val | from_json if val is string else val -%}
            {{ parsed if parsed is mapping else {} }}
          _rpt_codex_pieces: >-
            {%- set ns = namespace(pieces=[]) -%}
            {%- for key, entry in _rpt_registry.items() if entry is mapping -%}
              {%- set fk = entry.get('feature_key', '') -%}
              {%- set modes = entry.get('modes', []) -%}
              {%- if fk != '' and (fk ~ '_report') in modes -%}
                {%- set ns.pieces = ns.pieces + [fk] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.pieces }}
          _rpt_all_pieces: "{{ (['rollup'] + _rpt_codex_pieces) | unique | list }}"
      - variables:
          _rpt_pieces: >-
            {%- if _rpt_include_raw != '' -%}
              {{ _rpt_include_raw | regex_findall('[^,\\s]+') }}
            {%- elif _rpt_exclude_raw != '' -%}
              {%- set exc = _rpt_exclude_raw | regex_findall('[^,\\s]+') -%}
              {{ _rpt_all_pieces | reject('in', exc) | list }}
            {%- else -%}
              {{ _rpt_all_pieces }}
            {%- endif -%}
      # Native rollup piece
      - if: "{{ 'rollup' in _rpt_pieces }}"
        then:
        - action: script.zen_dojotools_finance
          continue_on_error: true
          response_variable: _rpt_rollup_raw
          data:
            mode: run
            case: finance_rollup
      # Codex: cogs — add new codex report branches here (feature_key_report in codex modes list)
      - if: "{{ 'cogs' in _rpt_pieces }}"
        then:
        - action: script.zen_codex_finance_cogs
          continue_on_error: true
          response_variable: _rpt_cogs_raw
          data:
            mode: cogs_report
            start_date: '{{ start_date | default("") }}'
            end_date: '{{ end_date | default("") }}'
      - variables:
          final_response:
            status: ok
            tool: '{{ tool_name }}'
            version: '{{ tool_version }}'
            mode: report
            pieces: '{{ _rpt_pieces }}'
            generated_at: '{{ now().isoformat() }}'
            rollup: "{{ _rpt_rollup_raw | default(none) }}"
            cogs: "{{ _rpt_cogs_raw | default(none) }}"
      - stop: report
        response_variable: final_response

    # ── Codex Router (catch-all for registered codex modes) ───────────────────
    # Fires only when no known finance case matched (all known cases stop:).
    # Reads codex_registry, routes to registered codex via inline static choose.
    # Adding a new codex = add one branch here + one entry to _bc2_known above.
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm == "run" and case_norm != "" }}'
        sequence:
        - variables:
            _cr_household: >-
              {{ label_entities('Zen Household Cabinet')
                 | select('match', 'sensor\\.') | list | first | default('') }}
        - action: script.zen_dojotools_filecabinet
          continue_on_error: true
          response_variable: _cr_reg_read
          data:
            action_type: read
            volume_entity_id:
              - "{{ _cr_household }}"
            key: codex_registry
        - variables:
            _cr_registry: >-
              {%- set raw = _cr_reg_read if _cr_reg_read is mapping else {} -%}
              {%- set val = raw.get('value', {}) -%}
              {%- set parsed = val | from_json if val is string else val -%}
              {{ parsed if parsed is mapping else {} }}
            _cr_target: >-
              {%- set ns = namespace(found=none) -%}
              {%- for key, entry in _cr_registry.items() if entry is mapping -%}
                {%- if case_norm in (entry.get('modes') or []) -%}
                  {%- set ns.found = entry.get('script') -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.found }}
        # Static inline choose — one branch per registered codex.
        # NOT templated action names (silently swallows failures — wrong for required codex responses).
        # NOT event-bus (adds timeout risk — wrong for synchronous LLM-facing calls).
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _cr_target == 'zen_codex_finance_depreciation' }}"
            sequence:
            - action: script.zen_codex_finance_depreciation
              response_variable: _cr_raw
              data:
                mode: '{{ case_norm }}'
                asset_id: '{{ asset_id | default("") }}'
                asset_data: '{{ asset_data | default("") }}'
                period: '{{ period | default("") }}'
                posting_mode: '{{ posting_mode | default("report_only") }}'
                confirm: '{{ confirm | default(false) }}'
                dry_run: '{{ dry_run | default(false) }}'
                idempotency_key: '{{ idempotency_key | default("") }}'
                firefly_transaction_id: '{{ firefly_transaction_id | default("") }}'
                caller: '{{ caller | default("zen_dojotools_finance") }}'
                audit_note: '{{ audit_note | default("") }}'
                include_evidence: '{{ include_evidence | default(false) }}'
                project_id: '{{ project_id | default("") }}'
                room_anchor: '{{ room_anchor | default("") }}'
                total_home_sqft_override: '{{ total_home_sqft_override | default("") }}'
            - variables:
                final_response: '{{ _cr_raw }}'
            - stop: codex dispatch
              response_variable: final_response
          - conditions:
            - condition: template
              value_template: "{{ _cr_target == 'zen_codex_finance_cogs' }}"
            sequence:
            - action: script.zen_codex_finance_cogs
              response_variable: _cr_raw
              data:
                mode: '{{ case_norm }}'
                default_source_account: '{{ default_source_account | default(source_account, true) | default("") }}'
                default_category: '{{ default_category | default(category, true) | default("") }}'
                enabled: '{{ enabled | default(true) }}'
                product_id: '{{ product_id | default("") }}'
                product_name: '{{ product_name | default("") }}'
                amount: '{{ amount | default("") }}'
                unit_price: '{{ unit_price | default("") }}'
                stock_entry_id: '{{ stock_entry_id | default("") }}'
                confirm: '{{ confirm | default(false) }}'
                caller_token: '{{ caller_token | default("") }}'
                start_date: '{{ start_date | default("") }}'
                end_date: '{{ end_date | default("") }}'
            - variables:
                final_response: '{{ _cr_raw }}'
            - stop: codex dispatch
              response_variable: final_response
          # Add new codex branches here when registered (also add to _bc2_known above)
          default:
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ _cr_target is not none }}'
              sequence:
              - variables:
                  final_response:
                    status: error
                    tool: '{{ tool_name }}'
                    version: '{{ tool_version }}'
                    code: codex_not_in_router
                    target: '{{ _cr_target }}'
                    case: '{{ case_norm }}'
                    message: >-
                      Codex '{{ _cr_target }}' is in codex_registry but not in the
                      dispatch block. Add a branch to the catch-all choose block in
                      zen_dojotools_finance (firefly_iii.yaml).
              - stop: codex not in router
                response_variable: final_response

    # ── default: unknown case ────────────────────────────────────────────────
    - variables:
        final_response:
          status: error
          tool: '{{ tool_name }}'
          version: '{{ tool_version }}'
          case: '{{ case_norm }}'
          result: null
          error: >-
            Unknown case "{{ case_norm }}". Call mode=help for available cases.
            Call mode=run case=index for live capability map including codex modes.
            Run mode=run case=bootstrap_codices to register installed codices.
    - stop: return
      response_variable: final_response
