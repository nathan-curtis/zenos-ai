        sequence:
        - variables:
            _bilc_confirm: '{{ confirm | default(false) | bool }}'
            _bilc_notes: '{{ notes | default("") | string | trim }}'
            _bilc_amt: '{{ amount_norm }}'
            _bilc_freq: '{{ limit_period | default("monthly") | string | trim | lower }}'
            _bilc_date: '{{ date_norm }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ item_norm == "" or _bilc_amt == 0 }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  version: '{{ tool_version }}'
                  case: bill_create
                  result: null
                  error: item (bill name) and amount are both required for bill_create
            - stop: return
              response_variable: final_response
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ not _bilc_confirm }}'
            sequence:
            - variables:
                final_response:
                  status: confirm_required
                  tool: '{{ tool_name }}'
                  version: '{{ tool_version }}'
                  case: bill_create
                  result:
                    planned:
                      name: '{{ item_norm }}'
                      amount: '{{ _bilc_amt }}'
                      repeat_freq: '{{ _bilc_freq }}'
                      start_date: '{{ _bilc_date }}'
                  message: Set confirm=true to create this bill.
            - stop: return
              response_variable: final_response
        - variables:
            _bilc_payload: >-
              {%- set body = {'name': item_norm, 'amount_min': _bilc_amt | string, 'amount_max': _bilc_amt | string, 'date': _bilc_date, 'repeat_freq': _bilc_freq, 'active': true, 'currency_code': 'USD'} -%}
              {%- if _bilc_notes != '' -%}{%- set body = body | combine({'notes': _bilc_notes}) -%}{%- endif -%}
              {{ body | tojson }}
        - action: script.zen_sutra_firefly
          response_variable: _bilc_resp
          continue_on_error: true
          data:
            action_type: post
            endpoint: bills
            payload: '{{ _bilc_payload }}'
        - variables:
            _bilc_result: >-
              {%- if _bilc_resp is mapping and 'result' in _bilc_resp and _bilc_resp['result'] is mapping -%}
                {%- set d = _bilc_resp['result']['content'] | default({}) -%}
                {%- if d is mapping -%}
                  {%- set obj = d.get('data', {}) -%}
                  {{ obj.get('attributes', {}) | combine({'id': obj.get('id', '')}) if obj is mapping else {} }}
                {%- else -%}{{ {} }}{%- endif -%}
              {%- else -%}{{ {} }}{%- endif -%}
        - variables:
            final_response:
              status: '{{ _bilc_resp["status"] | default("error") if _bilc_resp is mapping else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: bill_create
              result: '{{ _bilc_result }}'
        - stop: return
          response_variable: final_response

    # ── case: transaction_link ────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm == "run" and case_norm == "transaction_link" }}'
        sequence:
        - variables:
            _tl2_confirm: '{{ confirm | default(false) | bool }}'
            _tl2_ref: '{{ external_ref | default("") | string | trim }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ item_id_norm == "" or _tl2_ref == "" }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  version: '{{ tool_version }}'
                  case: transaction_link
                  result: null
                  error: item_id (transaction ID) and external_ref are both required for transaction_link
            - stop: return
              response_variable: final_response
        - action: script.zen_sutra_firefly
          response_variable: _tl2_get_resp
          continue_on_error: true
          data:
            action_type: get
            endpoint: 'transactions/{{ item_id_norm }}'
        - variables:
            _tl2_existing: >-
              {%- if _tl2_get_resp is mapping and 'result' in _tl2_get_resp and _tl2_get_resp['result'] is mapping -%}
                {%- set d = _tl2_get_resp['result']['content'] | default({}) -%}
                {%- if d is mapping -%}
                  {%- set obj = d.get('data', {}) -%}
                  {%- if obj is mapping -%}
                    {%- set attrs = obj.get('attributes', {}) -%}
                    {%- set txns = attrs.get('transactions', []) -%}
                    {{ txns[0] if txns | length > 0 else {} }}
                  {%- else -%}{{ {} }}{%- endif -%}
                {%- else -%}{{ {} }}{%- endif -%}
              {%- else -%}{{ {} }}{%- endif -%}
        - variables:
            _tl2_existing_notes: '{{ _tl2_existing.get("notes", "") | default("") | string | trim if _tl2_existing is mapping else "" }}'
            _tl2_link_tag: '[ref:{{ _tl2_ref }}]'
        - variables:
            _tl2_already_linked: '{{ _tl2_link_tag in _tl2_existing_notes }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _tl2_already_linked }}'
            sequence:
            - variables:
                final_response:
                  status: success
                  tool: '{{ tool_name }}'
                  version: '{{ tool_version }}'
                  case: transaction_link
                  result:
                    transaction_id: '{{ item_id_norm }}'
                    external_ref: '{{ _tl2_ref }}'
                    already_linked: true
                    notes: '{{ _tl2_existing_notes }}'
            - stop: return
              response_variable: final_response
        - variables:
            _tl2_new_notes: '{{ (_tl2_existing_notes ~ " " ~ _tl2_link_tag) | trim }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ not _tl2_confirm }}'
            sequence:
            - variables:
                final_response:
                  status: confirm_required
                  tool: '{{ tool_name }}'
                  version: '{{ tool_version }}'
                  case: transaction_link
                  result:
                    transaction_id: '{{ item_id_norm }}'
                    external_ref: '{{ _tl2_ref }}'
                    existing_notes: '{{ _tl2_existing_notes }}'
                    new_notes: '{{ _tl2_new_notes }}'
                  message: Set confirm=true to append this reference to the transaction notes.
            - stop: return
              response_variable: final_response
        - variables:
            _tl2_payload: '{{ {"transactions": [{"notes": _tl2_new_notes}]} | tojson }}'
        - action: script.zen_sutra_firefly
          response_variable: _tl2_put_resp
          continue_on_error: true
          data:
            action_type: put
            endpoint: 'transactions/{{ item_id_norm }}'
            payload: '{{ _tl2_payload }}'
        - variables:
            final_response:
              status: '{{ _tl2_put_resp["status"] | default("error") if _tl2_put_resp is mapping else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: transaction_link
              result:
                transaction_id: '{{ item_id_norm }}'
                external_ref: '{{ _tl2_ref }}'
                linked: '{{ _tl2_put_resp["status"] | default("error") == "success" if _tl2_put_resp is mapping else false }}'
                notes: '{{ _tl2_new_notes }}'
        - stop: return
          response_variable: final_response

    # ── default: unknown case ────────────────────────────────────────────────
    - variables:
        final_response:
          status: error
          tool: '{{ tool_name }}'
          version: '{{ tool_version }}'
          case: '{{ case_norm }}'
          result: null
          error: 'Unknown case "{{ case_norm }}". Call mode=help for available cases.'
    - stop: return
      response_variable: final_response
