              status: '{{ _tg_resp["status"] | default("error") if _tg_resp is mapping else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: transaction_get
              result: '{{ _tg_raw }}'
        - stop: return
