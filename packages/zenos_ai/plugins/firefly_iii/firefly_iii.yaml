                account: '{{ _rp_acct.get("name", "") if _rp_acct is mapping else "" }}'
                account_id: '{{ _rp_id }}'
                date_range:
                  start: '{{ start_norm }}'
                  end: '{{ end_norm }}'
                firefly_period_net: '{{ _rp_period_net }}'
                statement_balance: '{{ _rp_stmt_float }}'
                discrepancy: '{{ (_rp_stmt_float - _rp_period_net) | round(2) }}'
                transaction_count: '{{ _rp_txns | length }}'
                transactions: '{{ _rp_txns }}'
                unreconciled: '{{ _rp_txns | selectattr("reconciled", "equalto", false) | list }}'
                unreconciled_count: '{{ _rp_txns | selectattr("reconciled", "equalto", false) | list | length }}'
                instructions: Pass this result to the AI for matching against your bank statement rows. Use transaction_update to mark reconciled.
