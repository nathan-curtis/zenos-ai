                  result: null
                  error: 'No bill found matching "{{ item_norm }}".'
            - stop: return
              response_variable: final_response
        - action: script.zen_sutra_firefly
          response_variable: _bst_resp
          continue_on_error: true
          data:
            action_type: get
            endpoint: 'bills/{{ _bst_id }}'
        - action: script.zen_sutra_firefly
          response_variable: _bst_txn_resp
          continue_on_error: true
          data:
            action_type: get
            endpoint: 'bills/{{ _bst_id }}/transactions?start={{ start_norm }}&end={{ end_norm }}'
            perPage: 50
        - variables:
            _bst_bill: >-
              {%- if _bst_resp is mapping and 'result' in _bst_resp and _bst_resp['result'] is mapping -%}
                {%- set d = _bst_resp['result']['content'] | default({}) -%}
                {%- if d is mapping -%}
                  {%- set obj = d.get('data', {}) -%}
                  {{ obj.get('attributes', {}) | combine({'id': obj.get('id', _bst_id)}) if obj is mapping else {} }}
                {%- else -%}{{ {} }}{%- endif -%}
              {%- else -%}{{ {} }}{%- endif -%}
            _bst_txns: >-
              {%- set raw = (_bst_txn_resp['result']['content'] | default({})) if (_bst_txn_resp is mapping and 'result' in _bst_txn_resp and _bst_txn_resp['result'] is mapping) else {} -%}
              {%- set d = raw.get('data', []) if raw is mapping else [] -%}
              {%- set _ns = namespace(out=[]) -%}
              {%- for obj in d -%}
                {%- set attrs = obj.get('attributes', {}) -%}
                {%- set txns = attrs.get('transactions', []) -%}
                {%- set first = txns[0] if txns | length > 0 else {} -%}
                {%- set _ns.out = _ns.out + [{'id': obj.get('id', ''), 'date': first.get('date', ''), 'amount': first.get('amount', ''), 'description': first.get('description', '')}] -%}
              {%- endfor -%}
              {{ _ns.out }}
        - variables:
            _bst_today: '{{ now().strftime("%Y-%m-%d") }}'
            _bst_next: '{{ _bst_bill.get("next_expected_match", "") | string if _bst_bill is mapping else "" }}'
            _bst_amt_max: '{{ _bst_bill.get("amount_max", "0") | float(0) if _bst_bill is mapping else 0 }}'
        - variables:
            _bst_matched_total: >-
              {%- set _ns = namespace(total=0.0) -%}
              {%- for t in _bst_txns -%}{%- set _ns.total = _ns.total + (t.get('amount', '0') | float(0)) -%}{%- endfor -%}
              {{ _ns.total | round(2) }}
        - variables:
            final_response:
              status: '{{ _bst_resp["status"] | default("error") if _bst_resp is mapping else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: bill_status
              result:
                id: '{{ _bst_id }}'
                name: '{{ _bst_bill.get("name", "") if _bst_bill is mapping else "" }}'
                active: '{{ _bst_bill.get("active", true) if _bst_bill is mapping else true }}'
                amount_min: '{{ _bst_bill.get("amount_min", "") if _bst_bill is mapping else "" }}'
                amount_max: '{{ _bst_amt_max }}'
                repeat_freq: '{{ _bst_bill.get("repeat_freq", "") if _bst_bill is mapping else "" }}'
                next_expected_match: '{{ _bst_next }}'
                overdue: '{{ _bst_next != "" and _bst_next < _bst_today }}'
                paid_dates: '{{ _bst_bill.get("paid_dates", []) if _bst_bill is mapping else [] }}'
                matched_transactions: '{{ _bst_txns }}'
                matched_total: '{{ _bst_matched_total }}'
                variance: '{{ (_bst_matched_total - _bst_amt_max) | round(2) if _bst_amt_max > 0 else 0 }}'
                date_range:
                  start: '{{ start_norm }}'
                  end: '{{ end_norm }}'
        - stop: return
          response_variable: final_response

