                {%- set pct = ((curr / tgt * 100) | round(1)) if tgt > 0 else 0 -%}
                {%- set _ns.out = _ns.out + [{'id': obj.get('id', ''), 'name': attrs.get('name', ''), 'current_amount': curr, 'target_amount': tgt, 'percentage': pct, 'currency': attrs.get('currency_code', ''), 'target_date': attrs.get('target_date', none)}] -%}
              {%- endfor -%}
              {{ _ns.out }}
        - variables:
