###############################################################################
# ZenOS-AI Plugin: Firefly III — Finance
# Version: 2.3.0
#
# Scripts:
#   zen_dojotools_finance       ← MCP-facing finance tool (transactions, accounts, budgets, codex dispatch)
#   zen_stack_firefly           ← Lens Bus stack provider (internal, NOT MCP-exposed)
#   [zen_codex_finance_*.yaml]  ← Codex tier domain modules (loaded from sibling files)
#
# Lens Bus — Auto-Registration (introduced this version):
#   zen_stack_firefly is the first ZenOS lens provider to use bootstrap auto-registration.
#   tool_manifest returns: tier=stacks, provider_key=firefly_iii, register_mode=register.
#   On boot/daily, zen_dojotools_manifest mode=bootstrap_stacks calls tool_manifest on all
#   zen_stack_*/zen_sutra_* scripts, then calls mode=register for any that declare
#   register_mode and are not already in lens_registry.
#   zen_stack_firefly registers as "available" even if the URL is unconfigured — consumers
#   get empty evidence (soft fail) until the integration is set up. Registration confirms
#   capability, not reachability.
#   Skip: add 'firefly_iii' to household cabinet key lens_bootstrap_skip to suppress.
#
# SETUP
#
# 1. Add to secrets.yaml:
#      firefly_iii_bearer: "Bearer YOUR_PERSONAL_ACCESS_TOKEN"
#    Get your token: Firefly III → Profile → OAuth → Personal Access Tokens
#    Include "Bearer " prefix in the secret value.
#
# 2. Set input_text.firefly_url in HA (Settings > Helpers):
#      https://<your-firefly-host>   (no trailing slash, use HTTPS)
#    Set once — persists across restarts.
#    *** USE HTTPS *** — HTTP will cause POST→GET redirect on writes.
#
# 3. (Optional) configure n8n on <your-host> for bank feed → Firefly sync.
#    n8n pushes transactions to Firefly via POST /api/v1/transactions.
#    HA side webhook registration is Phase 2.
###############################################################################

input_text:
  firefly_url:
    name: Firefly III URL
    max: 255
    mode: text
    icon: mdi:bank

rest_command:

  firefly_api_advanced_get:
    url: >-
      {%- set ep = endpoint | default('') | string | trim -%}
      {%- set ep = ep | replace('/api/v1/', '') | replace('api/v1/', '') -%}
      {%- if ep and ep[0] == '/' -%}{%- set ep = ep[1:] -%}{%- endif -%}
      {%- set base = states('input_text.firefly_url') | trim | regex_replace('/$', '') -%}
      {%- set sep = '&' if '?' in ep else '?' -%}
      {{ base }}/api/v1/{{ ep }}{{ sep }}limit={{ perPage | default(50) | int }}&page={{ pageNumber | default(1) | int }}{% if search is defined and search | trim != '' %}&query={{ search | trim | urlencode }}{% endif %}
    method: GET
    headers:
      Authorization: !secret firefly_iii_bearer
      Accept: application/json
    timeout: 30

  firefly_api_advanced_post:
    url: >-
      {%- set ep = endpoint | default('') | string | trim -%}
      {%- set ep = ep | replace('/api/v1/', '') | replace('api/v1/', '') -%}
      {%- if ep and ep[0] == '/' -%}{%- set ep = ep[1:] -%}{%- endif -%}
      {%- set base = states('input_text.firefly_url') | trim | regex_replace('/$', '') -%}
      {{ base }}/api/v1/{{ ep }}
    method: POST
    headers:
      Authorization: !secret firefly_iii_bearer
      Content-Type: application/json
      Accept: application/json
    payload: "{{ payload | default('{}') }}"
    timeout: 30

  firefly_api_advanced_put:
    url: >-
      {%- set ep = endpoint | default('') | string | trim -%}
      {%- set ep = ep | replace('/api/v1/', '') | replace('api/v1/', '') -%}
      {%- if ep and ep[0] == '/' -%}{%- set ep = ep[1:] -%}{%- endif -%}
      {%- set base = states('input_text.firefly_url') | trim | regex_replace('/$', '') -%}
      {{ base }}/api/v1/{{ ep }}
    method: PUT
    headers:
      Authorization: !secret firefly_iii_bearer
      Content-Type: application/json
      Accept: application/json
    payload: "{{ payload | default('{}') }}"
    timeout: 30

  firefly_api_advanced_delete:
    url: >-
      {%- set ep = endpoint | default('') | string | trim -%}
      {%- set ep = ep | replace('/api/v1/', '') | replace('api/v1/', '') -%}
      {%- if ep and ep[0] == '/' -%}{%- set ep = ep[1:] -%}{%- endif -%}
      {%- set base = states('input_text.firefly_url') | trim | regex_replace('/$', '') -%}
      {{ base }}/api/v1/{{ ep }}
    method: DELETE
    headers:
      Authorization: !secret firefly_iii_bearer
      Accept: application/json
    timeout: 30

script:

  zen_root_firefly:
    alias: Zen DojoTools Firefly Advanced
    description: >
      Internal Firefly III API broker. Raw REST dispatcher — GET, POST, PUT, DELETE.
      NOT for direct AI or MCP use. Call zen_dojotools_finance instead.
    mode: queued
    max: 10
    icon: mdi:api
    fields:
      action_type:
        selector:
          select:
            options: [get, post, put, delete]
        default: get
      endpoint:
        description: Firefly III API path (e.g. accounts, transactions/5, autocomplete/accounts?query=check)
        selector:
          text:
      payload:
        description: JSON string for POST/PUT body
        selector:
          text:
            multiline: true
      search:
        description: Optional search query appended as &query=
        selector:
          text:
      pageNumber:
        selector:
          number:
            min: 1
            max: 1000
        default: 1
      perPage:
        selector:
          number:
            min: 1
            max: 100
        default: 50
    sequence:
    - variables:
        _ff_action: '{{ action_type | default("get") | lower | trim }}'
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ _ff_action == "get" }}'
        sequence:
        - action: rest_command.firefly_api_advanced_get
          response_variable: _ff_raw
          data:
            endpoint: '{{ endpoint | default("") }}'
            search: '{{ search | default("") }}'
            pageNumber: '{{ pageNumber | default(1) | int }}'
            perPage: '{{ perPage | default(50) | int }}'
      - conditions:
        - condition: template
          value_template: '{{ _ff_action == "post" }}'
        sequence:
        - action: rest_command.firefly_api_advanced_post
          response_variable: _ff_raw
          data:
            endpoint: '{{ endpoint | default("") }}'
            payload: '{{ payload | default("{}") }}'
      - conditions:
        - condition: template
          value_template: '{{ _ff_action == "put" }}'
        sequence:
        - action: rest_command.firefly_api_advanced_put
          response_variable: _ff_raw
          data:
            endpoint: '{{ endpoint | default("") }}'
            payload: '{{ payload | default("{}") }}'
      - conditions:
        - condition: template
          value_template: '{{ _ff_action == "delete" }}'
        sequence:
        - action: rest_command.firefly_api_advanced_delete
          response_variable: _ff_raw
          data:
            endpoint: '{{ endpoint | default("") }}'
    - variables:
        _ff_http: '{{ _ff_raw["status"] | int(0) if _ff_raw is defined else 0 }}'
    - variables:
        _ff_content: >-
          {%- if _ff_raw is defined -%}
            {%- set c = _ff_raw["content"] | default(none) -%}
            {%- if c is string and c | trim != '' -%}
              {{ c | from_json | default({}) }}
            {%- elif c is mapping or (c is sequence and c is not string) -%}
              {{ c }}
            {%- else -%}{{ {} }}{%- endif -%}
          {%- else -%}{{ {} }}{%- endif -%}
    - variables:
        final_response:
          status: '{{ "success" if _ff_http in [200, 201, 204] else "error" }}'
          http_status: '{{ _ff_http }}'
          result:
            content: '{{ _ff_content }}'
    - stop: return
      response_variable: final_response

  #####################################################################
  # zen_stack_firefly v1.0.0
  # Firefly III Lens Provider — ZenOS Lens Bus integration.
  # Consume anchors (label, person, transaction) → transaction_evidence.
  # Internal only: not MCP-exposed. Consumers call zen_dojotools_lens_dispatch.
  # Security: r-only gate. All writes go through zen_dojotools_finance directly.
  #####################################################################
  zen_stack_firefly:
    alias: Zen Stack Firefly III
    description: >-
      Firefly III Lens Provider (v1.0.0). Internal stack adapter for the ZenOS Lens Bus.
      Provides transaction_evidence for label, person, and transaction anchors. Not MCP-exposed —
      consumers call zen_dojotools_lens_dispatch.
    mode: queued
    max: 5
    fields:
      mode:
        description: Provider mode (stacks_by_anchor, register, unregister, health, inspect, audit, tool_manifest, help)
        selector:
          text:
      action:
        description: Alias for mode (lens dispatcher compat)
        selector:
          text:
      anchor_type:
        description: Anchor type — label, person, or transaction
        selector:
          text:
      anchor_ids:
        description: JSON array of anchor ID strings
        selector:
          text:
      caller_token:
        description: Caller token for audit trail
        selector:
          text:
    sequence:
    - variables:
        _mode_norm: >-
          {{ (mode | default('') if mode is defined and mode | string | trim != ''
              else (action | default('help') if action is defined else 'help'))
              | string | trim | lower }}
        _anchor_type_norm: "{{ anchor_type | default('') | string | trim | lower }}"
        _anchor_ids_raw: "{{ anchor_ids | default('[]') }}"
        _anchor_ids: >-
          {%- set _v = _anchor_ids_raw -%}
          {%- if _v is sequence and _v is not string -%}{{ _v }}
          {%- elif _v is string and _v | trim != '' -%}{{ _v | from_json(none) | default([]) }}
          {%- else -%}[]{%- endif -%}
        tool_name: zen_stack_firefly
        tool_version: 1.0.0

    # ── tool_manifest ──────────────────────────────────────────────────────
    - choose:
      - conditions:
          - condition: template
            value_template: '{{ _mode_norm == "tool_manifest" }}'
        sequence:
        - variables:
            final_response:
              status: ok
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              tier: stacks
              domain: finance
              provider_key: firefly_iii
              register_mode: register
              consumes: [label, person, transaction]
              returns: [transaction_evidence]
              failure_policy: soft
              content_policy: redacted_by_default
              risk_class: read_redacted
              security_act:
                model: rwxda
                required: r
                allowed: [r]
                denied: [w, x, d, a]
              lens_provider: true
              preferred_state:
                stripe: 2
                impact: soft
        - stop: return
          response_variable: final_response

    # ── inspect ────────────────────────────────────────────────────────────
    - choose:
      - conditions:
          - condition: template
            value_template: '{{ _mode_norm == "inspect" }}'
        sequence:
        - variables:
            final_response:
              status: ok
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              mode: inspect
              provider: firefly_iii
              consumes: [label, person, transaction]
              returns: [transaction_evidence]
              security_act:
                model: rwxda
                required: r
                allowed: [r]
              failure_policy: soft
              content_policy: redacted_by_default
              description: >-
                Maps label anchors to Firefly tag searches (tag_is:"label:{anchor_id}"),
                person anchors to payee description searches. Returns redacted
                transaction_evidence — amounts included but max 10 items per anchor.
        - stop: return
          response_variable: final_response

    # ── audit ──────────────────────────────────────────────────────────────
    - choose:
      - conditions:
          - condition: template
            value_template: '{{ _mode_norm == "audit" }}'
        sequence:
        - variables:
            final_response:
              status: ok
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              mode: audit
              provider: firefly_iii
              consumes: [label, person, transaction]
              returns: [transaction_evidence]
              security_violations: []
              notes: >-
                Read-only lens path. Calls zen_dojotools_finance (case: transactions_search)
                internally — all writes must go through zen_dojotools_finance directly.
                Strictly r-only per security_act.
        - stop: return
          response_variable: final_response

    # ── health ─────────────────────────────────────────────────────────────
    - choose:
      - conditions:
          - condition: template
            value_template: '{{ _mode_norm == "health" }}'
        sequence:
        - action: script.zen_root_firefly
          continue_on_error: true
          response_variable: _sf_health_raw
          data:
            action_type: get
            endpoint: about
        - variables:
            _sf_health_ok: >-
              {{ _sf_health_raw is defined and _sf_health_raw is mapping
                 and _sf_health_raw.get('status', '') == 'success' }}
            final_response:
              status: "{{ 'ok' if _sf_health_ok else 'error' }}"
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              mode: health
              provider: firefly_iii
              firefly_reachable: '{{ _sf_health_ok }}'
              message: >-
                {{ 'Firefly III reachable.' if _sf_health_ok else
                   'Firefly III unreachable: ' ~ (_sf_health_raw.get('error', 'no response')
                   if _sf_health_raw is mapping else 'no response') }}
        - stop: return
          response_variable: final_response

    # ── register ───────────────────────────────────────────────────────────
    - choose:
      - conditions:
          - condition: template
            value_template: '{{ _mode_norm == "register" }}'
        sequence:
        - variables:
            _sf_household_entity: >-
              {{ label_entities('zen_household_cabinet')
                 | select('match', 'sensor\\.') | list | first | default('') }}
        - action: script.zen_dojotools_filecabinet
          continue_on_error: true
          response_variable: _sf_reg_read
          data:
            action_type: read
            volume_entity_id:
              - "{{ _sf_household_entity }}"
            key: lens_registry
        - variables:
            _sf_existing_reg: >-
              {%- set raw = _sf_reg_read if _sf_reg_read is mapping else {} -%}
              {%- set val = raw.get('value', {}) -%}
              {%- set parsed = val | from_json if val is string else val -%}
              {{ parsed if parsed is mapping else {} }}
        - variables:
            _sf_provider_decl:
              provider: firefly_iii
              configured_by: zen_stack_firefly
              department: stacks
              enabled: true
              status: available
              tool: zen_stack_firefly
              mode: stacks_by_anchor
              consumes: [label, person, transaction]
              returns: [transaction_evidence]
              failure_policy: soft
              content_policy: redacted_by_default
              risk_class: read_redacted
              security_act:
                model: rwxda
                required: r
                allowed: [r]
                denied: [w, x, d, a]
        - variables:
            _sf_new_reg: "{{ _sf_existing_reg | combine({'firefly_iii': _sf_provider_decl}) }}"
        - action: script.zen_dojotools_filecabinet
          continue_on_error: true
          response_variable: _sf_reg_write
          data:
            action_type: upsert
            volume_entity_id:
              - "{{ _sf_household_entity }}"
            key: lens_registry
            value: "{{ _sf_new_reg | tojson }}"
        - variables:
            _sf_reg_ok: >-
              {{ _sf_reg_write is mapping and _sf_reg_write.get('status', '') == 'success' }}
            final_response:
              status: "{{ 'success' if _sf_reg_ok else 'error' }}"
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              mode: register
              provider: firefly_iii
              message: >-
                {{ 'Provider firefly_iii registered in lens_registry.' if _sf_reg_ok else
                   'Registration failed: ' ~ (_sf_reg_write.get('error', 'unknown')
                   if _sf_reg_write is mapping else 'no response') }}
        - stop: return
          response_variable: final_response

    # ── unregister ─────────────────────────────────────────────────────────
    - choose:
      - conditions:
          - condition: template
            value_template: '{{ _mode_norm == "unregister" }}'
        sequence:
        - variables:
            _sf_household_entity: >-
              {{ label_entities('zen_household_cabinet')
                 | select('match', 'sensor\\.') | list | first | default('') }}
        - action: script.zen_dojotools_filecabinet
          continue_on_error: true
          response_variable: _sf_ureg_read
          data:
            action_type: read
            volume_entity_id:
              - "{{ _sf_household_entity }}"
            key: lens_registry
        - variables:
            _sf_ureg_existing: >-
              {%- set raw = _sf_ureg_read if _sf_ureg_read is mapping else {} -%}
              {%- set val = raw.get('value', {}) -%}
              {%- set parsed = val | from_json if val is string else val -%}
              {{ parsed if parsed is mapping else {} }}
        - variables:
            _sf_ureg_new: >-
              {%- set ns = namespace(result={}) -%}
              {%- for k, v in _sf_ureg_existing.items() if k != 'firefly_iii' -%}
                {%- set ns.result = ns.result | combine({k: v}) -%}
              {%- endfor -%}
              {{ ns.result }}
        - action: script.zen_dojotools_filecabinet
          continue_on_error: true
          response_variable: _sf_ureg_write
          data:
            action_type: upsert
            volume_entity_id:
              - "{{ _sf_household_entity }}"
            key: lens_registry
            value: "{{ _sf_ureg_new | tojson }}"
        - variables:
            final_response:
              status: "{{ 'success' if _sf_ureg_write is mapping and _sf_ureg_write.get('status', '') == 'success' else 'error' }}"
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              mode: unregister
              provider: firefly_iii
              message: Provider firefly_iii removed from lens_registry.
        - stop: return
          response_variable: final_response

    # ── stacks_by_anchor ───────────────────────────────────────────────────
    - choose:
      - conditions:
          - condition: template
            value_template: '{{ _mode_norm == "stacks_by_anchor" }}'
        sequence:
        - variables:
            _sf_evidence: []
        - repeat:
            for_each: >-
              {{ _anchor_ids if _anchor_ids is sequence and _anchor_ids is not string else [] }}
            sequence:
            - variables:
                _sf_anchor_id: "{{ repeat.item | string | trim }}"
            - choose:
              # label anchor → tag_is:"label:{anchor_id}"
              - conditions:
                  - condition: template
                    value_template: '{{ _anchor_type_norm == "label" and _sf_anchor_id != "" }}'
                sequence:
                - action: script.zen_dojotools_finance
                  continue_on_error: true
                  response_variable: _sf_txn_raw
                  data:
                    case: transactions_search
                    label: "{{ _sf_anchor_id }}"
                    limit: 10
                - variables:
                    _sf_loop_txns: >-
                      {%- set r = _sf_txn_raw if _sf_txn_raw is mapping else {} -%}
                      {%- set result = r.get('result', {}) if r is mapping else {} -%}
                      {%- set txns = result.get('transactions', []) if result is mapping else [] -%}
                      {{ txns if txns is sequence and txns is not string else [] }}
                - variables:
                    _sf_evidence: >-
                      {%- set ns = namespace(items=_sf_evidence) -%}
                      {%- for t in _sf_loop_txns if t is mapping -%}
                        {%- set ns.items = ns.items + [{
                          'id': 'txn_' ~ (t.get('id', '') | string),
                          'type': 'transaction_evidence',
                          'date': t.get('date', ''),
                          'description': t.get('description', ''),
                          'amount': t.get('amount', ''),
                          'currency': t.get('currency_code', 'USD'),
                          'transaction_type': t.get('type', ''),
                          'source': t.get('source_account_name', ''),
                          'destination': t.get('destination_account_name', ''),
                          'category': (t.get('category_name') or ''),
                          'tags': t.get('tags', []),
                          'anchor_type': _anchor_type_norm,
                          'anchor_id': _sf_anchor_id
                        }] -%}
                      {%- endfor -%}
                      {{ ns.items }}

              # person anchor → description_contains search
              - conditions:
                  - condition: template
                    value_template: '{{ _anchor_type_norm == "person" and _sf_anchor_id != "" }}'
                sequence:
                - action: script.zen_dojotools_finance
                  continue_on_error: true
                  response_variable: _sf_person_raw
                  data:
                    case: transactions_search
                    description: "{{ _sf_anchor_id }}"
                    limit: 10
                - variables:
                    _sf_loop_person_txns: >-
                      {%- set r = _sf_person_raw if _sf_person_raw is mapping else {} -%}
                      {%- set result = r.get('result', {}) if r is mapping else {} -%}
                      {%- set txns = result.get('transactions', []) if result is mapping else [] -%}
                      {{ txns if txns is sequence and txns is not string else [] }}
                - variables:
                    _sf_evidence: >-
                      {%- set ns = namespace(items=_sf_evidence) -%}
                      {%- for t in _sf_loop_person_txns if t is mapping -%}
                        {%- set ns.items = ns.items + [{
                          'id': 'txn_' ~ (t.get('id', '') | string),
                          'type': 'transaction_evidence',
                          'date': t.get('date', ''),
                          'description': t.get('description', ''),
                          'amount': t.get('amount', ''),
                          'currency': t.get('currency_code', 'USD'),
                          'transaction_type': t.get('type', ''),
                          'source': t.get('source_account_name', ''),
                          'destination': t.get('destination_account_name', ''),
                          'category': (t.get('category_name') or ''),
                          'tags': t.get('tags', []),
                          'anchor_type': _anchor_type_norm,
                          'anchor_id': _sf_anchor_id
                        }] -%}
                      {%- endfor -%}
                      {{ ns.items }}

              # transaction anchor → direct lookup by Firefly transaction ID
              - conditions:
                  - condition: template
                    value_template: '{{ _anchor_type_norm == "transaction" and _sf_anchor_id != "" }}'
                sequence:
                - action: script.zen_dojotools_finance
                  continue_on_error: true
                  response_variable: _sf_txn_id_raw
                  data:
                    mode: run
                    case: transaction_get
                    item_id: "{{ _sf_anchor_id }}"
                - variables:
                    _sf_t: >-
                      {{ (_sf_txn_id_raw.get('result', {}) or {}) if _sf_txn_id_raw is mapping else {} }}
                - variables:
                    _sf_evidence: >-
                      {%- set ns = namespace(items=_sf_evidence) -%}
                      {%- if _sf_t is mapping and _sf_t.get('id', '') != '' -%}
                        {%- set ns.items = ns.items + [{
                          'id': 'txn_' ~ (_sf_t.get('id', '') | string),
                          'type': 'transaction_evidence',
                          'date': _sf_t.get('date', ''),
                          'description': _sf_t.get('description', ''),
                          'amount': _sf_t.get('amount', ''),
                          'currency': _sf_t.get('currency_code', 'USD'),
                          'transaction_type': _sf_t.get('type', ''),
                          'source': _sf_t.get('source', ''),
                          'destination': _sf_t.get('destination', ''),
                          'category': (_sf_t.get('category') or ''),
                          'tags': _sf_t.get('tags', []),
                          'notes': (_sf_t.get('notes') or ''),
                          'anchor_type': _anchor_type_norm,
                          'anchor_id': _sf_anchor_id
                        }] -%}
                      {%- endif -%}
                      {{ ns.items }}

        - variables:
            final_response:
              status: success
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              mode: stacks_by_anchor
              provider: firefly_iii
              anchor_type: '{{ _anchor_type_norm }}'
              anchor_ids: '{{ _anchor_ids }}'
              evidence: '{{ _sf_evidence }}'
              count: '{{ _sf_evidence | length }}'
        - stop: return
          response_variable: final_response

    # ── help / unknown mode ────────────────────────────────────────────────
    - variables:
        final_response:
          status: info
          tool: '{{ tool_name }}'
          version: '{{ tool_version }}'
          mode: help
          provider: firefly_iii
          description: >-
            Firefly III Lens Provider. Internal stack adapter for the ZenOS Lens Bus.
            Call via zen_dojotools_lens_dispatch, not directly.
          modes:
            stacks_by_anchor: Fetch transaction_evidence for label, person, or transaction anchors
            register: Register this provider in the household lens_registry cabinet drawer
            unregister: Remove this provider from lens_registry
            health: Check Firefly III API reachability
            inspect: Show provider capabilities and contract
            audit: Security and compliance summary
            tool_manifest: Full tool manifest declaration
    - stop: return
      response_variable: final_response

  zen_dojotools_finance:
    alias: Zen DojoTools Finance
    description: >
      Finance (v2.5.0) — Household ledger + asset depreciation. Authoritative for all money
      questions. Read: account_balance, transactions_list/search, budget_overview, bills_list,
      category_spend, net_worth_snapshot. Write (confirm=true): transaction_add/update,
      transfer, budget_limit_set, piggybank_update, account_create/update.
      Depreciation codex: full asset lifecycle — create, schedule (straight-line/DDB/
      declining_balance), post periods, business-use splits, book_value, replacement_plan,
      dispose, dispose_with_post, reconcile_firefly, warranty_check, attachments,
      cpa_summary. CFO DASHBOARD: mode=report — composable rollup of all finance pieces
      (budget+bills+net_worth) + registered codex reports (COGS, etc.) in one call.
      include=rollup,cogs or exclude=rollup to pick pieces. Agent synthesizes narrative.
      Pass mode=help or case=help for full reference. For stock/chores use zen_dojotools_inventory.
    mode: parallel
    icon: mdi:cash-multiple
    fields:
      mode:
        selector:
          select:
            options: [help, run, report, tool_manifest, kfc_manifest]
        default: help
      case:
        selector:
          select:
            options:
            - summary
            - accounts_list
            - account_get
            - account_balance
            - account_create
            - account_update
            - transactions_list
            - transactions_search
            - transaction_get
            - transaction_add
            - transaction_update
            - transfer
            - transaction_normalize
            - budget_overview
            - budget_limit_set
            - bills_list
            - bill_status
            - piggy_banks_list
            - piggybank_status
            - piggybank_update
            - category_spend
            - net_worth_snapshot
            - liability_summary
            - reconcile_prepare
            - project_account_status
            - spend_summary
            - budget_summary
            - finance_rollup
            - health
            - catalog
            - budget_create
            - piggybank_create
            - bill_create
            - transaction_link
            - index
            - inspect
            - bootstrap_codices
            - category_create
            - depreciable_asset_create
            - depreciable_asset_get
            - depreciable_asset_update
            - depreciable_asset_list
            - depreciable_asset_calculate_schedule
            - depreciable_asset_book_value
            - depreciable_asset_replacement_plan
            - depreciable_asset_firefly_setup
            - depreciable_asset_post_depreciation_period
            - depreciable_asset_dispose
            - depreciable_asset_report
            - depreciable_asset_post_due_depreciation
            - depreciable_asset_sync_piggy_reserves
            - depreciable_asset_report_by_project
            - depreciable_asset_report_by_room
            - depreciable_asset_dispose_with_post
            - depreciable_asset_reconcile_firefly
            - depreciable_asset_warranty_check
            - depreciable_asset_warranty_report
            - depreciable_asset_attach
            - depreciable_asset_attachments_get
            - asset_allocation_create
            - asset_allocation_get
            - asset_allocation_list
            - asset_allocation_update
            - cpa_summary
            - depreciable_asset_suggest_business_use
            - compensate
            - cogs_configure
            - cogs_post
            - cogs_summary
            - cogs_reconcile
            - cogs_report
      item:
        description: Account, budget, or category name (resolves to ID)
        selector:
          text:
      item_id:
        description: Explicit Firefly ID (skips name resolution)
        selector:
          text:
      amount:
        description: Transaction amount
        selector:
          number:
            min: 0
            step: 0.01
            mode: box
      description:
        description: Transaction description
        selector:
          text:
      source_account:
        description: Source account name (withdrawals and transfers)
        selector:
          text:
      dest_account:
        description: Destination account name (deposits and transfers)
        selector:
          text:
      category:
        description: Category name
        selector:
          text:
      budget:
        description: Budget name
        selector:
          text:
      tags:
        description: Comma-separated tags
        selector:
          text:
      date:
        description: Transaction date YYYY-MM-DD (default today)
        selector:
          text:
      start_date:
        description: Range start YYYY-MM-DD (default first of current month)
        selector:
          text:
      end_date:
        description: Range end YYYY-MM-DD (default today)
        selector:
          text:
      account_type:
        description: Filter accounts_list by type
        selector:
          select:
            options: [all, asset, expense, revenue, liability, cash]
        default: all
      transaction_type:
        description: Transaction type for transaction_add
        selector:
          select:
            options: [withdrawal, deposit, transfer]
        default: withdrawal
      page:
        selector:
          number:
            min: 1
            max: 1000
        default: 1
      per_page:
        selector:
          number:
            min: 1
            max: 100
        default: 25
      show_trace:
        selector:
          boolean:
        default: false
      confirm:
        description: Confirm write/mutation operations before executing
        selector:
          boolean:
        default: false
      target_date:
        description: Reference date for balance/snapshot YYYY-MM-DD
        selector:
          text:
      currency_code:
        description: Currency code (e.g. USD, EUR)
        selector:
          text:
      notes:
        description: Notes or memo for account/goal
        selector:
          text:
            multiline: true
      statement_balance:
        description: Statement ending balance for reconcile_prepare
        selector:
          number:
            min: -9999999
            max: 9999999
            step: 0.01
            mode: box
      limit_amount:
        description: Budget limit amount for budget_limit_set
        selector:
          number:
            min: 0
            step: 0.01
            mode: box
      limit_period:
        description: Budget limit period for budget_limit_set
        selector:
          select:
            options: [monthly, weekly, quarterly, yearly]
        default: monthly
      piggybank_amount:
        description: New current amount for piggybank_update
        selector:
          number:
            min: 0
            step: 0.01
            mode: box
      piggybank_target:
        description: New target amount for piggybank_update
        selector:
          number:
            min: 0
            step: 0.01
            mode: box
      external_ref:
        description: External reference ID to link (e.g. grocy:product:389, paperless:42)
        selector:
          text:
      label:
        description: HA label slug to tag this transaction/account (e.g. zen_energy, zen_kitchen)
        selector:
          text:
      # ── mode=report filters (CSV of feature_key slugs; rollup = native finance_rollup) ──
      include:
        description: Report pieces to include (CSV of slugs e.g. rollup,cogs). Default all.
        selector:
          text:
      exclude:
        description: Report pieces to exclude (CSV of slugs). Ignored if include is set.
        selector:
          text:
      # ── Codex pass-through fields (forwarded to zen_codex_finance_* dispatch) ──
      asset_id:
        description: Grocy userobject ID (int) or asset name for depreciation codex modes
        selector:
          text:
      asset_data:
        description: JSON dict of asset fields for depreciable_asset_create/update
        selector:
          text:
            multiline: true
      period:
        description: Depreciation period YYYY-MM for depreciable_asset_post_depreciation_period
        selector:
          text:
      posting_mode:
        description: report_only (safe preview, default) or summary_post (writes to Firefly)
        selector:
          select:
            options: [report_only, summary_post]
      dry_run:
        description: Validate + preview without writing. Overrides confirm.
        selector:
          boolean:
        default: false
      idempotency_key:
        description: Caller-supplied idempotency key for write operations
        selector:
          text:
      caller:
        description: Caller identity for codex capability check
        selector:
          text:
      audit_note:
        description: Audit note appended to Grocy notes and Firefly transaction notes
        selector:
          text:
      component:
        description: KFC component key for kfc_manifest mode (e.g. finance_budget)
        selector:
          text:
      firefly_transaction_id:
        description: Firefly transaction ID — used by compensate to look up a transaction directly by ID
        selector:
          text:
      include_evidence:
        description: Resolve evidence_refs into evidence items inline (book_value only)
        selector:
          boolean:
        default: false
      project_id:
        description: Project ID filter for depreciable_asset_report_by_project
        selector:
          text:
      room_anchor:
        description: Room anchor filter for depreciable_asset_report_by_room
        selector:
          text:
      total_home_sqft_override:
        description: Override total home area (sqft) for depreciable_asset_suggest_business_use — bypasses room-by-room sum
        selector:
          number:
            min: 1
            max: 100000
            step: 0.01
            mode: box
    sequence:
    - if: "{{ (mode | default('') | lower) == 'tool_manifest' }}"
      then:
      - variables:
          result: >-
            {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
            {{ MF.tool_manifest(
                tool='zen_dojotools_finance',
                display_name='Finance',
                tier='dojotools',
                version='2.5.0',
                health={'configured': true, 'status': 'ok', 'notes': []},
                required_labels=['firefly'],
                optional_labels=['finance', 'banking'],
                consumes=['firefly_request'],
                returns=['firefly_response'],
                modes={'help': 'help', 'run': 'run', 'report': 'report', 'manifest': 'tool_manifest', 'kfc': 'kfc_manifest'},
                icon='mdi:bank',
                color='green',
                preferred_state={
                    'required_labels': ['firefly', 'dojotools'],
                    'setup_steps': ['zen_dojotools_manifest mode=bootstrap_stacks'],
                    'codex_modules': ['zen_codex_finance_depreciation'],
                    'lens_registry_keys': ['firefly_iii']
                },
                caller_token=caller_token | default('')
            ) | from_json }}
      - stop: tool_manifest
        response_variable: result
    - variables:
        tool_name: Zen DojoTools Finance
        tool_version: 2.5.0
        mode_norm: '{{ mode | default("help") | string | trim | lower }}'
        case_norm: '{{ case | default("") | string | trim | lower }}'
        item_norm: '{{ item | default("") | string | trim }}'
        item_id_norm: '{{ item_id | default("") | string | trim }}'
        src_acct_norm: '{{ source_account | default("") | string | trim }}'
        dst_acct_norm: '{{ dest_account | default("") | string | trim }}'
        cat_norm: '{{ category | default("") | string | trim }}'
        bgt_norm: '{{ budget | default("") | string | trim }}'
        date_norm: '{{ date | default(now().strftime("%Y-%m-%d")) | string | trim }}'
        start_norm: '{{ start_date | default(now().strftime("%Y-%m-01")) | string | trim }}'
        end_norm: '{{ end_date | default(now().strftime("%Y-%m-%d")) | string | trim }}'
        amount_norm: '{{ amount | default(0) | float(0) | round(2) }}'
        page_norm: '{{ page | default(1) | int }}'
        per_norm: '{{ per_page | default(25) | int }}'
        acct_type_norm: '{{ account_type | default("all") | string | trim | lower }}'
        txn_type_norm: '{{ transaction_type | default("withdrawal") | string | trim | lower }}'
        label_norm: '{{ label | default("") | string | trim | lower | replace(" ", "_") }}'
        cases:
          summary:
            intent: Net worth, income, expenses, and left-to-spend for a date range.
            needs: []
            optional: [start_date, end_date]
            example: "{'mode':'run','case':'summary'}"
          accounts_list:
            intent: List all accounts with current balances. Filter by type.
            needs: []
            optional: [account_type, page, per_page]
            example: "{'mode':'run','case':'accounts_list','account_type':'asset'}"
          account_get:
            intent: Get a single account's details and balance by name or ID.
            needs: [item OR item_id]
            optional: []
            example: "{'mode':'run','case':'account_get','item':'Checking'}"
          transactions_list:
            intent: List recent transactions, optionally filtered by account and date range.
            needs: []
            optional: [item, start_date, end_date, transaction_type, page, per_page]
            example: "{'mode':'run','case':'transactions_list','start_date':'2026-06-01'}"
          transactions_search:
            intent: Full-text search across transaction descriptions with optional date range.
            needs: [item]
            optional: [start_date, end_date, page, per_page]
            example: "{'mode':'run','case':'transactions_search','item':'HEB','start_date':'2026-06-01'}"
          budget_overview:
            intent: All budgets — limit, spent, remaining for the current or specified period.
            needs: []
            optional: [start_date, end_date]
            example: "{'mode':'run','case':'budget_overview'}"
          bills_list:
            intent: All recurring bills — next due date, paid status, overdue flag.
            needs: []
            optional: [page, per_page]
            example: "{'mode':'run','case':'bills_list'}"
          piggy_banks_list:
            intent: Savings goals — name, current amount, target, percentage complete.
            needs: []
            optional: [page, per_page]
            example: "{'mode':'run','case':'piggy_banks_list'}"
          category_spend:
            intent: Spending for a category over a date range.
            needs: [item OR item_id]
            optional: [start_date, end_date, page, per_page]
            example: "{'mode':'run','case':'category_spend','item':'Groceries','start_date':'2026-06-01'}"
          transaction_add:
            intent: Log an expense (withdrawal), income (deposit), or transfer.
            needs: [description, amount]
            optional: [transaction_type, source_account, dest_account, category, budget, tags, date]
            example: "{'mode':'run','case':'transaction_add','description':'HEB groceries','amount':87.50,'source_account':'Checking','category':'Groceries','transaction_type':'withdrawal'}"
          transaction_update:
            intent: Fix an existing transaction — category, description, amount, or date.
            needs: [item_id]
            optional: [description, amount, category, budget, date, tags]
            example: "{'mode':'run','case':'transaction_update','item_id':'42','category':'Dining Out'}"
          transfer:
            intent: Move money between two asset accounts.
            needs: [amount, source_account, dest_account]
            optional: [description, date, tags]
            example: "{'mode':'run','case':'transfer','amount':500,'source_account':'Checking','dest_account':'Savings','description':'Monthly savings transfer'}"
          report:
            intent: >-
              CFO dashboard — composable rollup. Calls all pieces in one shot: rollup
              (budget+bills+net_worth) + every registered codex that has a *_report mode
              (currently: cogs). Agent synthesizes the narrative from structured data.
              Use include/exclude to pick pieces. Best entry point for "how are we doing?"
            needs: []
            optional: [include, exclude, start_date, end_date]
            example: "{'mode':'report'}"
            examples:
              all: "{'mode':'report'}"
              cogs_only: "{'mode':'report','include':'cogs'}"
              no_rollup: "{'mode':'report','exclude':'rollup'}"
              live_drawer: "zen_dojotools_filecabinet action_type=get path=cfo/report volume_entity_id=sensor.zenos_dojo_cabinet"
          spend_summary:
            intent: Compound briefing — net worth + budget snapshot + upcoming bills in one call. Writes snapshot to household cabinet.
            needs: []
            optional: [start_date, end_date]
            example: "{'mode':'run','case':'spend_summary'}"
          budget_summary:
            intent: >-
              Budget vs actual synthesis — per-budget: allocated, spent, remaining,
              pct_used, days_left_in_period. Only budgets with limits set are
              included. Ninja/KFC-ready. Use this for "how are we doing on budget?"
              questions and for the finance_budget KFC component.
            needs: []
            optional: [start_date, end_date]
            example: "{'mode':'run','case':'budget_summary'}"
          health:
            intent: Check API reachability, auth, Firefly version, and default currency.
            needs: []
            optional: []
            example: "{'mode':'run','case':'health'}"
          catalog:
            intent: Full financial world map — all accounts, categories, tags, budgets, piggy banks, currencies.
            needs: []
            optional: []
            example: "{'mode':'run','case':'catalog'}"
          account_balance:
            intent: Current balance for an account. Pass target_date for as-of lookup.
            needs: [item OR item_id]
            optional: [target_date]
            example: "{'mode':'run','case':'account_balance','item':'Checking'}"
          account_create:
            intent: Create a new account. confirm=true required to execute.
            needs: [item, account_type]
            optional: [currency_code, notes, confirm]
            example: "{'mode':'run','case':'account_create','item':'Emergency Fund','account_type':'asset','confirm':true}"
          account_update:
            intent: Update notes/type/currency on an existing account. Fetches current, merges, PUTs. confirm=true required.
            needs: [item OR item_id]
            optional: [notes, account_type, currency_code, confirm]
            example: "{'mode':'run','case':'account_update','item_id':'12','notes':'Primary checking','confirm':true}"
          bill_status:
            intent: Single bill detail — paid history, next due, matched transactions, variance.
            needs: [item OR item_id]
            optional: [start_date, end_date]
            example: "{'mode':'run','case':'bill_status','item':'Mortgage'}"
          piggybank_status:
            intent: Single piggy bank / savings goal detail with percentage to target.
            needs: [item OR item_id]
            optional: []
            example: "{'mode':'run','case':'piggybank_status','item':'Emergency Fund'}"
          piggybank_update:
            intent: Update current or target amount for a savings goal. confirm=true required.
            needs: [item OR item_id]
            optional: [piggybank_amount, piggybank_target, notes, confirm]
            example: "{'mode':'run','case':'piggybank_update','item':'Vacation','piggybank_amount':1500,'confirm':true}"
          budget_limit_set:
            intent: Create or update a budget limit for a period. Checks for existing limit first. confirm=true required.
            needs: [item, limit_amount]
            optional: [start_date, end_date, limit_period, currency_code, confirm]
            example: "{'mode':'run','case':'budget_limit_set','item':'Food','limit_amount':800,'limit_period':'monthly','confirm':true}"
          net_worth_snapshot:
            intent: Assets minus liabilities as of today. Includes all asset and liability accounts.
            needs: []
            optional: [target_date]
            example: "{'mode':'run','case':'net_worth_snapshot'}"
          liability_summary:
            intent: All liability accounts — balances, liability type, interest rate, notes.
            needs: []
            optional: [page, per_page]
            example: "{'mode':'run','case':'liability_summary'}"
          reconcile_prepare:
            intent: Fetch transactions for an account/period, calculate Firefly period net, compare to statement balance. Returns unreconciled candidates for AI review.
            needs: [item OR item_id, statement_balance]
            optional: [start_date, end_date]
            example: "{'mode':'run','case':'reconcile_prepare','item':'Chase Checking','statement_balance':4821.55,'start_date':'2026-05-01','end_date':'2026-05-31'}"
          transaction_normalize:
            intent: Fetch uncategorized withdrawals for a date range. AI proposes merchant, category, budget, tags — then use transaction_update to apply.
            needs: []
            optional: [start_date, end_date, page, per_page]
            example: "{'mode':'run','case':'transaction_normalize','start_date':'2026-06-01'}"
          project_account_status:
            intent: Dashboard for a project tag — all transactions + matching piggy bank goal.
            needs: [item]
            optional: [start_date, end_date, page, per_page]
            example: "{'mode':'run','case':'project_account_status','item':'deck-project','start_date':'2026-01-01'}"
          budget_create:
            intent: Create a new named budget container. confirm=true required.
            needs: [item]
            optional: [notes, confirm]
            example: "{'mode':'run','case':'budget_create','item':'Food','confirm':true}"
          piggybank_create:
            intent: Create a new savings goal / sinking fund. Links to a savings account. confirm=true required.
            needs: [item, source_account]
            optional: [piggybank_target, target_date, notes, confirm]
            example: "{'mode':'run','case':'piggybank_create','item':'Vacation Fund','source_account':'USAA Savings','piggybank_target':5000,'confirm':true}"
          bill_create:
            intent: Create a recurring bill. confirm=true required.
            needs: [item, amount]
            optional: [date, limit_period, notes, confirm]
            example: "{'mode':'run','case':'bill_create','item':'Electric','amount':150,'limit_period':'monthly','confirm':true}"
          transaction_link:
            intent: Link a Firefly transaction to an external record (inventory purchase, Paperless doc). Appends structured ref to transaction notes. confirm=true required.
            needs: [item_id, external_ref]
            optional: [confirm]
            example: "{'mode':'run','case':'transaction_link','item_id':'42','external_ref':'grocy:product:389','confirm':true}"
          index:
            intent: Live capability map — all known finance cases + registered codex modes from codex_registry.
            needs: []
            optional: []
            example: "{'mode':'run','case':'index'}"
          inspect:
            intent: Health + feature semaphore — Firefly reachability + all registered codex availability.
            needs: []
            optional: []
            example: "{'mode':'run','case':'inspect'}"
          cogs_configure:
            intent: Guided COGS setup — lists real Firefly accounts then writes cogs_accounting household cabinet drawer.
            needs: []
            optional: [default_source_account, default_category, enabled]
            example: "{'mode':'run','case':'cogs_configure'}"
          cogs_post:
            intent: Post one COGS transaction. Called automatically by stock_consume on cogs_tracked products. Fail-soft (status=skipped) if not configured.
            needs: [product_id, product_name, amount, unit_price, stock_entry_id, confirm]
            optional: []
            example: "{'mode':'run','case':'cogs_post','product_id':1009,'product_name':'Dichroic Sheet','amount':1,'unit_price':12.50,'stock_entry_id':99,'confirm':true}"
          cogs_summary:
            intent: Period rollup — net COGS posted to Firefly (postings minus reversals). Defaults to current month.
            needs: []
            optional: [start_date, end_date]
            example: "{'mode':'run','case':'cogs_summary','start_date':'2026-07-01'}"
          cogs_reconcile:
            intent: Compare Grocy-side consumption value against Firefly-side net COGS. Reports variance and likely causes if non-zero.
            needs: []
            optional: [start_date, end_date]
            example: "{'mode':'run','case':'cogs_reconcile','start_date':'2026-07-01'}"
          cogs_report:
            intent: Comptroller weave — config health + cogs_summary + cogs_reconcile in one call with a plain-English headline. Best single COGS entry point.
            needs: []
            optional: [start_date, end_date]
            example: "{'mode':'run','case':'cogs_report'}"
          bootstrap_codices:
            intent: Scan zen_codex_finance_* scripts and register each in codex_registry household cabinet drawer.
            needs: []
            optional: []
            example: "{'mode':'run','case':'bootstrap_codices'}"
          category_create:
            intent: Create a Firefly category if it does not already exist. confirm=true required.
            needs: [item]
            optional: [confirm]
            example: "{'mode':'run','case':'category_create','item':'Depreciation Expense','confirm':true}"
          depreciable_asset_create:
            intent: Create a new depreciable household asset record in Grocy. Routed to zen_codex_finance_depreciation.
            needs: [asset_data]
            optional: [dry_run, confirm, idempotency_key, caller, audit_note]
            example: "{'mode':'run','case':'depreciable_asset_create','asset_data':'{\"name\":\"Kiln\",\"cost_basis\":1200,\"useful_life_months\":84,\"placed_in_service_date\":\"2026-01-01\",\"depreciation_method\":\"straight_line\"}','confirm':true}"
          depreciable_asset_get:
            intent: Retrieve a depreciable asset record from Grocy by ID or name.
            needs: [asset_id]
            optional: []
            example: "{'mode':'run','case':'depreciable_asset_get','asset_id':'42'}"
          depreciable_asset_update:
            intent: Patch fields on an existing depreciable asset. confirm=true required.
            needs: [asset_id, asset_data]
            optional: [dry_run, confirm, idempotency_key, caller, audit_note]
            example: "{'mode':'run','case':'depreciable_asset_update','asset_id':'42','asset_data':'{\"replacement_cost_estimate\":1500}','confirm':true}"
          depreciable_asset_list:
            intent: List all depreciable assets with summary fields.
            needs: []
            optional: []
            example: "{'mode':'run','case':'depreciable_asset_list'}"
          depreciable_asset_calculate_schedule:
            intent: Calculate full straight-line depreciation schedule for an asset (no write).
            needs: [asset_id]
            optional: []
            example: "{'mode':'run','case':'depreciable_asset_calculate_schedule','asset_id':'42'}"
          depreciable_asset_book_value:
            intent: Current paper book value — cost basis minus accumulated posted depreciation.
            needs: [asset_id]
            optional: []
            example: "{'mode':'run','case':'depreciable_asset_book_value','asset_id':'42'}"
          depreciable_asset_replacement_plan:
            intent: Monthly reserve needed to fund asset replacement. Reads Firefly piggy bank balance.
            needs: [asset_id]
            optional: []
            example: "{'mode':'run','case':'depreciable_asset_replacement_plan','asset_id':'42'}"
          depreciable_asset_firefly_setup:
            intent: One-time setup — deploy Grocy schema + Firefly categories. confirm=true required.
            needs: []
            optional: [asset_id, dry_run, confirm, audit_note]
            example: "{'mode':'run','case':'depreciable_asset_firefly_setup','confirm':true}"
          depreciable_asset_post_depreciation_period:
            intent: Post one month of depreciation to Firefly (idempotent). Use posting_mode=report_only first.
            needs: [asset_id, period]
            optional: [posting_mode, dry_run, confirm, idempotency_key, caller, audit_note]
            example: "{'mode':'run','case':'depreciable_asset_post_depreciation_period','asset_id':'42','period':'2026-06','posting_mode':'report_only'}"
          depreciable_asset_dispose:
            intent: Mark asset as disposed/sold/donated. Calculates gain/loss. confirm=true required.
            needs: [asset_id, asset_data, audit_note]
            optional: [dry_run, confirm, idempotency_key, caller]
            example: "{'mode':'run','case':'depreciable_asset_dispose','asset_id':'42','asset_data':'{\"disposal_type\":\"sold\",\"disposal_date\":\"2026-06-23\",\"disposal_proceeds\":50}','audit_note':'Sold at garage sale','confirm':true}"
          depreciable_asset_report:
            intent: Portfolio report — all assets with book value, accumulated depreciation, replacement exposure.
            needs: []
            optional: []
            example: "{'mode':'run','case':'depreciable_asset_report'}"
          depreciable_asset_post_due_depreciation:
            intent: Batch post prior-month depreciation for all active assets. Safe to run on 1st of month — idempotent per asset.
            needs: []
            optional: [posting_mode, dry_run, confirm, audit_note]
            example: "{'mode':'run','case':'depreciable_asset_post_due_depreciation','dry_run':true}"
          depreciable_asset_sync_piggy_reserves:
            intent: Update Firefly piggy bank targets from replacement plan calculations. Assets must have firefly_replacement_piggy_bank_id set.
            needs: []
            optional: [dry_run, confirm, audit_note]
            example: "{'mode':'run','case':'depreciable_asset_sync_piggy_reserves','confirm':true}"
          depreciable_asset_report_by_project:
            intent: Portfolio report filtered to a single project_id.
            needs: [project_id]
            optional: []
            example: "{'mode':'run','case':'depreciable_asset_report_by_project','project_id':'kitchen-reno'}"
          depreciable_asset_report_by_room:
            intent: Portfolio report filtered to a single room_anchor.
            needs: [room_anchor]
            optional: []
            example: "{'mode':'run','case':'depreciable_asset_report_by_room','room_anchor':'garage'}"
          depreciable_asset_dispose_with_post:
            intent: Dispose asset in Grocy (T7) then post final-depreciation and optional sale-proceeds to Firefly. Idempotent.
            needs: [asset_id, asset_data.disposal_type, audit_note, confirm]
            optional: [asset_data.disposal_date, asset_data.disposal_proceeds, dry_run, idempotency_key]
            example: "{'mode':'run','case':'depreciable_asset_dispose_with_post','asset_id':'42','asset_data':'{\"disposal_type\":\"sold\",\"disposal_date\":\"2026-06-24\",\"disposal_proceeds\":500}','audit_note':'Sold on marketplace','confirm':true}"
          depreciable_asset_reconcile_firefly:
            intent: Diff expected depreciation schedule vs posted Firefly transactions. Returns missing, unexpected, matched counts. Read-only.
            needs: [asset_id]
            optional: []
            example: "{'mode':'run','case':'depreciable_asset_reconcile_firefly','asset_id':'42'}"
          depreciable_asset_attach:
            intent: Append a Paperless or Grocy document reference to an asset's attachment_refs list. confirm=true required.
            needs: [asset_id, asset_data.attachment_type, asset_data.attachment_id, confirm]
            optional: [asset_data.attachment_label, dry_run, audit_note]
            example: "{'mode':'run','case':'depreciable_asset_attach','asset_id':'42','asset_data':'{\"attachment_type\":\"paperless\",\"attachment_id\":\"88\",\"attachment_label\":\"Purchase receipt\"}','confirm':true}"
          depreciable_asset_attachments_get:
            intent: List all attachment references stored on an asset (Paperless and Grocy doc IDs). Read-only.
            needs: [asset_id]
            optional: []
            example: "{'mode':'run','case':'depreciable_asset_attachments_get','asset_id':'42'}"
          depreciable_asset_warranty_check:
            intent: Classify active assets by warranty status — expired, expiring_soon (within days_threshold), ok. Read-only.
            needs: []
            optional: [asset_data.days_threshold]
            example: "{'mode':'run','case':'depreciable_asset_warranty_check'}"
          depreciable_asset_warranty_report:
            intent: Same as warranty_check with report framing. Pass asset_data.days_threshold (default 90) to customize the expiring_soon window.
            needs: []
            optional: [asset_data.days_threshold]
            example: "{'mode':'run','case':'depreciable_asset_warranty_report','asset_data':'{\"days_threshold\":60}'}"
          asset_allocation_create:
            intent: Create a date-ranged business/household allocation row for an asset.
            needs: [asset_id, asset_data.effective_date, asset_data.business_use_percent]
            optional: [asset_data.household_use_percent, asset_data.allocation_method, asset_data.business_area_anchor, asset_data.basis, asset_data.notes, dry_run, confirm, audit_note]
            example: "{'mode':'run','case':'asset_allocation_create','asset_id':'21','asset_data':'{\"effective_date\":\"2024-01-01\",\"business_use_percent\":40,\"household_use_percent\":60,\"basis\":\"change_in_use\"}','confirm':true}"
          asset_allocation_get:
            intent: Get the current effective allocation row for an asset (as of today or a specific date).
            needs: [asset_id]
            optional: [period]
            example: "{'mode':'run','case':'asset_allocation_get','asset_id':'21'}"
          asset_allocation_list:
            intent: List all allocation rows for an asset (full history). Omit asset_id to list all allocations.
            needs: []
            optional: [asset_id]
            example: "{'mode':'run','case':'asset_allocation_list','asset_id':'21'}"
          asset_allocation_update:
            intent: Update fields on an existing allocation row by its allocation_id (userobject ID).
            needs: [asset_id, asset_data, confirm]
            optional: [audit_note]
            example: "{'mode':'run','case':'asset_allocation_update','asset_id':'7','asset_data':'{\"end_date\":\"2024-12-31\"}','confirm':true}"
          cpa_summary:
            intent: Year-end CPA summary view — depreciation scheduled vs posted, business-use splits, disposal gain/loss, and Firefly category spend. Read-only.
            needs: []
            optional: [asset_data.year]
            example: "{'mode':'run','case':'cpa_summary','asset_data':'{\"year\":\"2026\"}'}"

    - choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm == "help" }}'
        sequence:
        - variables:
            help_json:
              status: help
              help:
                tool: '{{ tool_name }}'
                version: '{{ tool_version }}'
                overview: >-
                  Household finance assistant over Firefly III. Budgets, bills,
                  accounts, transactions, savings goals, COGS tracking, asset
                  depreciation. Speaks household vocab not bookkeeping jargon.
                domain: finance
                peers:
                  inventory: zen_dojotools_inventory
                see_also: "zen_dojotools_manifest mode=domains name=finance"
                cases: '{{ cases }}'
        - stop: return
          response_variable: help_json

    # ── case: summary ────────────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm == "run" and case_norm == "summary" }}'
        sequence:
        - action: script.zen_root_firefly
          response_variable: _sum_resp
          continue_on_error: true
          data:
            action_type: get
            endpoint: 'summary/basic?start={{ start_norm }}&end={{ end_norm }}'
        - variables:
            _sum_raw: >-
              {%- if _sum_resp is mapping and 'result' in _sum_resp and _sum_resp['result'] is mapping -%}
                {{ _sum_resp['result']['content'] | default({}) }}
              {%- else -%}{{ {} }}{%- endif -%}
        - variables:
            final_response:
              status: '{{ _sum_resp["status"] | default("error") if _sum_resp is mapping else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: summary
              result:
                start_date: '{{ start_norm }}'
                end_date: '{{ end_norm }}'
                data: '{{ _sum_raw }}'
              error: '{{ none if (_sum_resp is mapping and _sum_resp.get("status") == "success") else "Firefly summary fetch failed (http_status=" ~ (_sum_resp.get("http_status", 0) if _sum_resp is mapping else 0) ~ ")" }}'
        - stop: return
          response_variable: final_response

    # ── case: accounts_list ──────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm == "run" and case_norm == "accounts_list" }}'
        sequence:
        - variables:
            _al_ep: '{{ "accounts?type=" ~ acct_type_norm if acct_type_norm != "all" else "accounts" }}'
        - action: script.zen_root_firefly
          response_variable: _al_resp
          continue_on_error: true
          data:
            action_type: get
            endpoint: '{{ _al_ep }}'
            pageNumber: '{{ page_norm }}'
            perPage: '{{ per_norm }}'
        - variables:
            _al_raw: >-
              {%- if _al_resp is mapping and 'result' in _al_resp and _al_resp['result'] is mapping -%}
                {{ _al_resp['result']['content'] | default({}) }}
              {%- else -%}{{ {} }}{%- endif -%}
        - variables:
            _al_data: >-
              {%- set d = _al_raw.get('data', []) if _al_raw is mapping else [] -%}
              {%- set _ns = namespace(out=[]) -%}
              {%- for obj in d -%}
                {%- set attrs = obj.get('attributes', {}) -%}
                {%- set _ns.out = _ns.out + [attrs | combine({'id': obj.get('id', '')})] -%}
              {%- endfor -%}
              {{ _ns.out }}
            _al_meta: '{{ _al_raw.get("meta", {}) if _al_raw is mapping else {} }}'
        - variables:
            final_response:
              status: '{{ _al_resp["status"] | default("error") if _al_resp is mapping else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: accounts_list
              result:
                accounts: '{{ _al_data }}'
