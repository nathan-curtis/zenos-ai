        - variables:
            final_response:
              status: '{{ _tl_resp["status"] | default("error") if _tl_resp is mapping else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: transactions_list
              result:
                transactions: '{{ _tl_data }}'
                count: '{{ _tl_data | length }}'
                account_filter: '{{ item_norm if item_norm != "" else "all" }}'
                date_range:
                  start: '{{ start_norm }}'
                  end: '{{ end_norm }}'
              pagination:
                page: '{{ page_norm }}'
                per_page: '{{ per_norm }}'
        - stop: return
          response_variable: final_response

    # ── case: transactions_search ────────────────────────────────────────────
    - choose:
