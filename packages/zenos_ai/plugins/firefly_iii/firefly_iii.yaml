              status: '{{ _pb_resp["status"] | default("error") if _pb_resp is mapping else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: piggy_banks_list
              result:
                piggy_banks: '{{ _pb_data }}'
                count: '{{ _pb_data | length }}'
        - stop: return
          response_variable: final_response

    # ── case: category_spend ─────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm == "run" and case_norm == "category_spend" }}'
        sequence:
        - variables:
            _cs_id: '{{ item_id_norm if item_id_norm != "" else none }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _cs_id is none and item_norm != "" }}'
            sequence:
            - action: script.zen_sutra_firefly
              response_variable: _cs_ac_resp
              continue_on_error: true
              data:
                action_type: get
                endpoint: 'autocomplete/categories?query={{ item_norm | urlencode }}&limit=20'
            - variables:
                _cs_ac_data: >-
                  {%- if _cs_ac_resp is mapping and 'result' in _cs_ac_resp and _cs_ac_resp['result'] is mapping -%}
                    {%- set c = _cs_ac_resp['result']['content'] | default([]) -%}
                    {{ c if c is sequence and c is not string and c is not mapping else [] }}
                  {%- else -%}{{ [] }}{%- endif -%}
            - variables:
                _cs_id: >-
                  {%- set _ns = namespace(found=none) -%}
                  {%- for a in _cs_ac_data -%}
                    {%- if (a.get('name', '') | lower) == (item_norm | lower) -%}
                      {%- set _ns.found = a.get('id') | string -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ _ns.found }}
                _cs_candidates: '{{ _cs_ac_data | map(attribute="name") | list }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _cs_id is none }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  version: '{{ tool_version }}'
                  case: category_spend
                  result: null
                  error: 'No category found matching "{{ item_norm }}". Candidates: {{ _cs_candidates | default([]) }}'
            - stop: return
              response_variable: final_response
        - action: script.zen_sutra_firefly
          response_variable: _cs_resp
          continue_on_error: true
          data:
            action_type: get
            endpoint: 'categories/{{ _cs_id }}/transactions?start={{ start_norm }}&end={{ end_norm }}'
            pageNumber: '{{ page_norm }}'
            perPage: '{{ per_norm }}'
        - variables:
            _cs_raw: >-
              {%- if _cs_resp is mapping and 'result' in _cs_resp and _cs_resp['result'] is mapping -%}
                {{ _cs_resp['result']['content'] | default({}) }}
              {%- else -%}{{ {} }}{%- endif -%}
        - variables:
            _cs_data: >-
              {%- set d = _cs_raw.get('data', []) if _cs_raw is mapping else [] -%}
              {%- set _ns = namespace(out=[], total=0.0) -%}
              {%- for obj in d -%}
                {%- set attrs = obj.get('attributes', {}) -%}
                {%- set txns = attrs.get('transactions', []) -%}
                {%- set first = txns[0] if txns | length > 0 else {} -%}
                {%- set amt = first.get('amount', '0') | float(0) -%}
                {%- set _ns.total = _ns.total + amt -%}
                {%- set _ns.out = _ns.out + [{'id': obj.get('id', ''), 'date': first.get('date', ''), 'description': first.get('description', ''), 'amount': amt, 'source': first.get('source_name', '')}] -%}
              {%- endfor -%}
              {{ {'transactions': _ns.out, 'total_spent': _ns.total | round(2)} }}
        - variables:
            final_response:
              status: '{{ _cs_resp["status"] | default("error") if _cs_resp is mapping else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: category_spend
              result:
                category: '{{ item_norm }}'
                category_id: '{{ _cs_id }}'
                data: '{{ _cs_data }}'
                date_range:
                  start: '{{ start_norm }}'
                  end: '{{ end_norm }}'
        - stop: return
          response_variable: final_response

    # ── case: transaction_add ────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm == "run" and case_norm == "transaction_add" }}'
        sequence:
        # Resolve source account
        - variables:
            _ta_src_id: none
            _ta_dst_id: none
            _ta_cat_id: none
            _ta_bgt_id: none
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ src_acct_norm != "" }}'
            sequence:
            - action: script.zen_sutra_firefly
              response_variable: _ta_src_resp
              continue_on_error: true
              data:
                action_type: get
                endpoint: 'autocomplete/accounts?query={{ src_acct_norm | urlencode }}&limit=20'
            - variables:
                _ta_src_data: >-
                  {%- if _ta_src_resp is mapping and 'result' in _ta_src_resp and _ta_src_resp['result'] is mapping -%}
                    {%- set c = _ta_src_resp['result']['content'] | default([]) -%}
                    {{ c if c is sequence and c is not string and c is not mapping else [] }}
                  {%- else -%}{{ [] }}{%- endif -%}
            - variables:
                _ta_src_id: >-
                  {%- set _ns = namespace(found=none) -%}
                  {%- for a in _ta_src_data -%}
                    {%- if (a.get('name', '') | lower) == (src_acct_norm | lower) -%}
                      {%- set _ns.found = a.get('id') | string -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ _ns.found }}
        # Resolve dest account
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ dst_acct_norm != "" }}'
            sequence:
            - action: script.zen_sutra_firefly
              response_variable: _ta_dst_resp
              continue_on_error: true
              data:
                action_type: get
                endpoint: 'autocomplete/accounts?query={{ dst_acct_norm | urlencode }}&limit=20'
            - variables:
                _ta_dst_data: >-
                  {%- if _ta_dst_resp is mapping and 'result' in _ta_dst_resp and _ta_dst_resp['result'] is mapping -%}
                    {%- set c = _ta_dst_resp['result']['content'] | default([]) -%}
                    {{ c if c is sequence and c is not string and c is not mapping else [] }}
                  {%- else -%}{{ [] }}{%- endif -%}
            - variables:
                _ta_dst_id: >-
                  {%- set _ns = namespace(found=none) -%}
                  {%- for a in _ta_dst_data -%}
                    {%- if (a.get('name', '') | lower) == (dst_acct_norm | lower) -%}
                      {%- set _ns.found = a.get('id') | string -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ _ns.found }}
        # Resolve category
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ cat_norm != "" }}'
            sequence:
            - action: script.zen_sutra_firefly
              response_variable: _ta_cat_resp
              continue_on_error: true
              data:
                action_type: get
                endpoint: 'autocomplete/categories?query={{ cat_norm | urlencode }}&limit=20'
            - variables:
                _ta_cat_data: >-
                  {%- if _ta_cat_resp is mapping and 'result' in _ta_cat_resp and _ta_cat_resp['result'] is mapping -%}
                    {%- set c = _ta_cat_resp['result']['content'] | default([]) -%}
                    {{ c if c is sequence and c is not string and c is not mapping else [] }}
                  {%- else -%}{{ [] }}{%- endif -%}
            - variables:
                _ta_cat_id: >-
                  {%- set _ns = namespace(found=none) -%}
                  {%- for a in _ta_cat_data -%}
                    {%- if (a.get('name', '') | lower) == (cat_norm | lower) -%}
                      {%- set _ns.found = a.get('id') | string -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ _ns.found }}
        # Resolve budget
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ bgt_norm != "" }}'
            sequence:
            - action: script.zen_sutra_firefly
              response_variable: _ta_bgt_resp
              continue_on_error: true
              data:
                action_type: get
                endpoint: 'autocomplete/budgets?query={{ bgt_norm | urlencode }}&limit=20'
            - variables:
                _ta_bgt_data: >-
                  {%- if _ta_bgt_resp is mapping and 'result' in _ta_bgt_resp and _ta_bgt_resp['result'] is mapping -%}
                    {%- set c = _ta_bgt_resp['result']['content'] | default([]) -%}
                    {{ c if c is sequence and c is not string and c is not mapping else [] }}
                  {%- else -%}{{ [] }}{%- endif -%}
            - variables:
                _ta_bgt_id: >-
                  {%- set _ns = namespace(found=none) -%}
                  {%- for a in _ta_bgt_data -%}
                    {%- if (a.get('name', '') | lower) == (bgt_norm | lower) -%}
                      {%- set _ns.found = a.get('id') | string -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ _ns.found }}
        # Build and POST transaction
        - variables:
            _ta_payload: >-
              {%- set txn = {'type': txn_type_norm, 'date': date_norm, 'amount': amount_norm | string, 'description': description | default('') | string | trim} -%}
              {%- if _ta_src_id and _ta_src_id | string | trim not in ['', 'none', 'None'] -%}{%- set txn = txn | combine({'source_id': _ta_src_id | string}) -%}{%- endif -%}
              {%- if _ta_dst_id and _ta_dst_id | string | trim not in ['', 'none', 'None'] -%}{%- set txn = txn | combine({'destination_id': _ta_dst_id | string}) -%}{%- endif -%}
              {%- if _ta_cat_id and _ta_cat_id | string | trim not in ['', 'none', 'None'] -%}{%- set txn = txn | combine({'category_id': _ta_cat_id | string}) -%}{%- endif -%}
              {%- if _ta_bgt_id and _ta_bgt_id | string | trim not in ['', 'none', 'None'] -%}{%- set txn = txn | combine({'budget_id': _ta_bgt_id | string}) -%}{%- endif -%}
              {%- set tag_list = (tags | trim).split(',') | map('trim') | select | list if (tags is defined and tags | default('') | trim != '') else [] -%}
              {%- if label_norm != '' -%}{%- set tag_list = tag_list + ['label:' ~ label_norm] -%}{%- endif -%}
              {%- if tag_list | length > 0 -%}{%- set txn = txn | combine({'tags': tag_list}) -%}{%- endif -%}
              {{ {'transactions': [txn]} | tojson }}
        - action: script.zen_sutra_firefly
          response_variable: _ta_post_resp
          continue_on_error: true
          data:
            action_type: post
            endpoint: transactions
            payload: '{{ _ta_payload }}'
        - variables:
            _ta_result: >-
              {%- if _ta_post_resp is mapping and 'result' in _ta_post_resp and _ta_post_resp['result'] is mapping -%}
                {%- set d = _ta_post_resp['result']['content'] | default({}) -%}
                {%- if d is mapping -%}
                  {%- set obj = d.get('data', {}) -%}
                  {%- if obj is mapping -%}
                    {{ obj.get('attributes', {}) | combine({'id': obj.get('id', '')}) }}
                  {%- else -%}{{ {} }}{%- endif -%}
                {%- else -%}{{ {} }}{%- endif -%}
              {%- else -%}{{ {} }}{%- endif -%}
        - variables:
            final_response:
              status: '{{ _ta_post_resp["status"] | default("error") if _ta_post_resp is mapping else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: transaction_add
              result: '{{ _ta_result }}'
              resolution:
                source_account_id: '{{ _ta_src_id }}'
                dest_account_id: '{{ _ta_dst_id }}'
                category_id: '{{ _ta_cat_id }}'
                budget_id: '{{ _ta_bgt_id }}'
        - stop: return
          response_variable: final_response

    # ── case: transaction_update ─────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm == "run" and case_norm == "transaction_update" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ item_id_norm == "" }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  version: '{{ tool_version }}'
                  case: transaction_update
                  result: null
                  error: item_id is required for transaction_update
            - stop: return
              response_variable: final_response
        - variables:
            _tu_cat_id: none
            _tu_bgt_id: none
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ cat_norm != "" }}'
            sequence:
            - action: script.zen_sutra_firefly
              response_variable: _tu_cat_resp
              continue_on_error: true
              data:
                action_type: get
                endpoint: 'autocomplete/categories?query={{ cat_norm | urlencode }}&limit=20'
            - variables:
                _tu_cat_data: >-
                  {%- if _tu_cat_resp is mapping and 'result' in _tu_cat_resp and _tu_cat_resp['result'] is mapping -%}
                    {%- set c = _tu_cat_resp['result']['content'] | default([]) -%}
                    {{ c if c is sequence and c is not string and c is not mapping else [] }}
                  {%- else -%}{{ [] }}{%- endif -%}
            - variables:
                _tu_cat_id: >-
                  {%- set _ns = namespace(found=none) -%}
                  {%- for a in _tu_cat_data -%}
                    {%- if (a.get('name', '') | lower) == (cat_norm | lower) -%}{%- set _ns.found = a.get('id') | string -%}{%- endif -%}
                  {%- endfor -%}
                  {{ _ns.found }}
        - variables:
            _tu_payload: >-
              {%- set txn = {} -%}
              {%- if description is defined and description | default('') | trim != '' -%}{%- set txn = txn | combine({'description': description | trim}) -%}{%- endif -%}
              {%- if amount is defined and amount | default(0) | float(0) > 0 -%}{%- set txn = txn | combine({'amount': amount | float(0) | string}) -%}{%- endif -%}
              {%- if date is defined and date | default('') | trim != '' -%}{%- set txn = txn | combine({'date': date | trim}) -%}{%- endif -%}
              {%- if _tu_cat_id is not none -%}{%- set txn = txn | combine({'category_id': _tu_cat_id | string}) -%}{%- endif -%}
              {%- set tag_list = (tags | trim).split(',') | map('trim') | select | list if (tags is defined and tags | default('') | trim != '') else [] -%}
              {%- if label_norm != '' -%}{%- set tag_list = tag_list + ['label:' ~ label_norm] -%}{%- endif -%}
              {%- if tag_list | length > 0 -%}{%- set txn = txn | combine({'tags': tag_list}) -%}{%- endif -%}
              {{ {'transactions': [txn]} | tojson }}
        - action: script.zen_sutra_firefly
          response_variable: _tu_resp
          continue_on_error: true
          data:
            action_type: put
            endpoint: 'transactions/{{ item_id_norm }}'
            payload: '{{ _tu_payload }}'
        - variables:
            final_response:
              status: '{{ _tu_resp["status"] | default("error") if _tu_resp is mapping else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: transaction_update
              result:
                transaction_id: '{{ item_id_norm }}'
                updated: '{{ _tu_resp["status"] | default("error") == "success" if _tu_resp is mapping else false }}'
        - stop: return
          response_variable: final_response

    # ── case: transfer ───────────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm == "run" and case_norm == "transfer" }}'
        sequence:
        - variables:
            _tr_src_id: none
            _tr_dst_id: none
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ src_acct_norm != "" }}'
            sequence:
            - action: script.zen_sutra_firefly
              response_variable: _tr_src_resp
              continue_on_error: true
              data:
                action_type: get
                endpoint: 'autocomplete/accounts?query={{ src_acct_norm | urlencode }}&limit=20'
            - variables:
                _tr_src_id: >-
                  {%- set c = (_tr_src_resp['result']['content'] | default([])) if (_tr_src_resp is mapping and 'result' in _tr_src_resp and _tr_src_resp['result'] is mapping) else [] -%}
                  {%- set c = c if c is sequence and c is not string and c is not mapping else [] -%}
                  {%- set _ns = namespace(found=none) -%}
                  {%- for a in c -%}{%- if (a.get('name','') | lower) == (src_acct_norm | lower) -%}{%- set _ns.found = a.get('id') | string -%}{%- endif -%}{%- endfor -%}
                  {{ _ns.found }}
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ dst_acct_norm != "" }}'
            sequence:
            - action: script.zen_sutra_firefly
              response_variable: _tr_dst_resp
              continue_on_error: true
              data:
                action_type: get
                endpoint: 'autocomplete/accounts?query={{ dst_acct_norm | urlencode }}&limit=20'
            - variables:
                _tr_dst_id: >-
                  {%- set c = (_tr_dst_resp['result']['content'] | default([])) if (_tr_dst_resp is mapping and 'result' in _tr_dst_resp and _tr_dst_resp['result'] is mapping) else [] -%}
                  {%- set c = c if c is sequence and c is not string and c is not mapping else [] -%}
                  {%- set _ns = namespace(found=none) -%}
                  {%- for a in c -%}{%- if (a.get('name','') | lower) == (dst_acct_norm | lower) -%}{%- set _ns.found = a.get('id') | string -%}{%- endif -%}{%- endfor -%}
                  {{ _ns.found }}
        - variables:
            _tr_payload: >-
              {%- set txn = {'type': 'transfer', 'date': date_norm, 'amount': amount_norm | string, 'description': description | default('Transfer') | string | trim} -%}
              {%- if _tr_src_id and _tr_src_id | string | trim not in ['', 'none', 'None'] -%}{%- set txn = txn | combine({'source_id': _tr_src_id | string}) -%}{%- endif -%}
              {%- if _tr_dst_id and _tr_dst_id | string | trim not in ['', 'none', 'None'] -%}{%- set txn = txn | combine({'destination_id': _tr_dst_id | string}) -%}{%- endif -%}
              {%- set tag_list = (tags | trim).split(',') | map('trim') | select | list if (tags is defined and tags | default('') | trim != '') else [] -%}
              {%- if label_norm != '' -%}{%- set tag_list = tag_list + ['label:' ~ label_norm] -%}{%- endif -%}
              {%- if tag_list | length > 0 -%}{%- set txn = txn | combine({'tags': tag_list}) -%}{%- endif -%}
              {{ {'transactions': [txn]} | tojson }}
        - action: script.zen_sutra_firefly
          response_variable: _tr_resp
          continue_on_error: true
          data:
            action_type: post
            endpoint: transactions
            payload: '{{ _tr_payload }}'
        - variables:
            final_response:
              status: '{{ _tr_resp["status"] | default("error") if _tr_resp is mapping else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: transfer
              result:
                source_account: '{{ src_acct_norm }}'
                dest_account: '{{ dst_acct_norm }}'
                amount: '{{ amount_norm }}'
                source_id: '{{ _tr_src_id }}'
                dest_id: '{{ _tr_dst_id }}'
        - stop: return
          response_variable: final_response

    # ── case: spend_summary (compound briefing) ───────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm == "run" and case_norm == "spend_summary" }}'
        sequence:
        - action: script.zen_sutra_firefly
          response_variable: _ss_sum_resp
          continue_on_error: true
          data:
            action_type: get
            endpoint: 'summary/basic?start={{ start_norm }}&end={{ end_norm }}'
        - action: script.zen_sutra_firefly
          response_variable: _ss_bgt_resp
          continue_on_error: true
          data:
            action_type: get
            endpoint: 'budgets?start={{ start_norm }}&end={{ end_norm }}'
            perPage: 50
        - action: script.zen_sutra_firefly
          response_variable: _ss_bil_resp
          continue_on_error: true
          data:
            action_type: get
            endpoint: bills
            perPage: 50
        - variables:
            _ss_summary: >-
              {%- if _ss_sum_resp is mapping and 'result' in _ss_sum_resp and _ss_sum_resp['result'] is mapping -%}
                {{ _ss_sum_resp['result']['content'] | default({}) }}
              {%- else -%}{{ {} }}{%- endif -%}
            _ss_budgets: >-
              {%- set raw = (_ss_bgt_resp['result']['content'] | default({})) if (_ss_bgt_resp is mapping and 'result' in _ss_bgt_resp and _ss_bgt_resp['result'] is mapping) else {} -%}
              {%- set d = raw.get('data', []) if raw is mapping else [] -%}
              {%- set _ns = namespace(out=[]) -%}
              {%- for obj in d -%}
                {%- set attrs = obj.get('attributes', {}) -%}
                {%- set spent = attrs.get('spent', []) -%}
                {%- set spent_sum = spent | sum(attribute='sum') | default(0) | float(0) | abs -%}
                {%- set _ns.out = _ns.out + [{'name': attrs.get('name', ''), 'spent': spent_sum}] -%}
              {%- endfor -%}
              {{ _ns.out }}
            _ss_bills: >-
              {%- set raw = (_ss_bil_resp['result']['content'] | default({})) if (_ss_bil_resp is mapping and 'result' in _ss_bil_resp and _ss_bil_resp['result'] is mapping) else {} -%}
              {%- set d = raw.get('data', []) if raw is mapping else [] -%}
              {%- set today = now().strftime('%Y-%m-%d') -%}
              {%- set _ns = namespace(out=[]) -%}
              {%- for obj in d -%}
                {%- set attrs = obj.get('attributes', {}) -%}
                {%- set next_exp = attrs.get('next_expected_match', '') | string -%}
                {%- if next_exp != '' and next_exp >= today -%}
                  {%- set _ns.out = _ns.out + [{'name': attrs.get('name', ''), 'next_due': next_exp, 'amount': attrs.get('amount_max', ''), 'overdue': (next_exp < today)}] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ _ns.out | sort(attribute='next_due') }}
        - variables:
            _ss_hh: '{{ states("sensor.zen_default_household_cabinet_resolved") }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _ss_hh != "" }}'
            sequence:
            - action: script.zen_dojotools_filecabinet
              continue_on_error: true
              data:
                action_type: update
                force_action: true
                volume_entity_id: '{{ _ss_hh }}'
                key: finance_daily_snapshot
                value: '{{ {"summary": _ss_summary, "budgets": _ss_budgets, "bills_due": _ss_bills, "as_of": now().isoformat()} | tojson }}'
                set_timestamp: true
        - variables:
            final_response:
              status: success
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: spend_summary
              result:
                summary: '{{ _ss_summary }}'
                budgets: '{{ _ss_budgets }}'
                bills_upcoming: '{{ _ss_bills }}'
                date_range:
                  start: '{{ start_norm }}'
                  end: '{{ end_norm }}'
                snapshot_written: '{{ _ss_hh != "" }}'
        - stop: return
          response_variable: final_response

    # ── case: health ─────────────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm == "run" and case_norm == "health" }}'
        sequence:
        - action: script.zen_sutra_firefly
          response_variable: _hlt_about_resp
          continue_on_error: true
          data:
            action_type: get
            endpoint: about
        - action: script.zen_sutra_firefly
          response_variable: _hlt_user_resp
          continue_on_error: true
          data:
            action_type: get
            endpoint: about/user
        - action: script.zen_sutra_firefly
          response_variable: _hlt_cur_resp
          continue_on_error: true
          data:
            action_type: get
            endpoint: currencies/default
        - variables:
            _hlt_about: >-
              {%- if _hlt_about_resp is mapping and 'result' in _hlt_about_resp and _hlt_about_resp['result'] is mapping -%}
                {{ _hlt_about_resp['result']['content'] | default({}) }}
              {%- else -%}{{ {} }}{%- endif -%}
            _hlt_user: >-
              {%- if _hlt_user_resp is mapping and 'result' in _hlt_user_resp and _hlt_user_resp['result'] is mapping -%}
                {{ _hlt_user_resp['result']['content'] | default({}) }}
              {%- else -%}{{ {} }}{%- endif -%}
        - variables:
            _hlt_about_data: '{{ _hlt_about.get("data", {}) if _hlt_about is mapping else {} }}'
            _hlt_user_data: '{{ _hlt_user.get("data", {}) if _hlt_user is mapping else {} }}'
            _hlt_cur_attrs: >-
              {%- if _hlt_cur_resp is mapping and 'result' in _hlt_cur_resp and _hlt_cur_resp['result'] is mapping -%}
                {%- set c = _hlt_cur_resp['result']['content'] | default({}) -%}
                {%- set obj = c.get('data', {}) if c is mapping else {} -%}
                {{ obj.get('attributes', {}) if obj is mapping else {} }}
              {%- else -%}{{ {} }}{%- endif -%}
        - variables:
            final_response:
              status: '{{ "success" if (_hlt_about_resp is mapping and _hlt_about_resp.get("status") == "success") else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: health
              result:
                reachable: '{{ _hlt_about_resp is mapping and _hlt_about_resp.get("status") == "success" }}'
                firefly_version: '{{ _hlt_about_data.get("version", "unknown") if _hlt_about_data is mapping else "unknown" }}'
                api_version: '{{ _hlt_about_data.get("api_version", "unknown") if _hlt_about_data is mapping else "unknown" }}'
                user_email: '{{ _hlt_user_data.get("email", "unknown") if _hlt_user_data is mapping else "unknown" }}'
                user_role: '{{ _hlt_user_data.get("role", "unknown") if _hlt_user_data is mapping else "unknown" }}'
                default_currency: '{{ _hlt_cur_attrs.get("code", "unknown") if _hlt_cur_attrs is mapping else "unknown" }}'
                default_currency_name: '{{ _hlt_cur_attrs.get("name", "") if _hlt_cur_attrs is mapping else "" }}'
                firefly_url: '{{ states("input_text.firefly_url") }}'
        - stop: return
          response_variable: final_response

    # ── case: catalog ─────────────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm == "run" and case_norm == "catalog" }}'
        sequence:
        - action: script.zen_sutra_firefly
          response_variable: _ctlg_accts_resp
          continue_on_error: true
          data:
            action_type: get
            endpoint: accounts
            perPage: 100
        - action: script.zen_sutra_firefly
          response_variable: _ctlg_cats_resp
          continue_on_error: true
          data:
            action_type: get
            endpoint: categories
            perPage: 100
        - action: script.zen_sutra_firefly
          response_variable: _ctlg_tags_resp
          continue_on_error: true
          data:
            action_type: get
            endpoint: tags
            perPage: 100
        - action: script.zen_sutra_firefly
          response_variable: _ctlg_bgts_resp
          continue_on_error: true
          data:
            action_type: get
            endpoint: budgets
            perPage: 100
        - action: script.zen_sutra_firefly
          response_variable: _ctlg_pigs_resp
          continue_on_error: true
          data:
            action_type: get
            endpoint: piggy-banks
            perPage: 100
        - action: script.zen_sutra_firefly
          response_variable: _ctlg_curs_resp
          continue_on_error: true
          data:
            action_type: get
            endpoint: currencies
            perPage: 100
        - variables:
            _ctlg_accounts: >-
              {%- set raw = (_ctlg_accts_resp['result']['content'] | default({})) if (_ctlg_accts_resp is mapping and 'result' in _ctlg_accts_resp and _ctlg_accts_resp['result'] is mapping) else {} -%}
              {%- set d = raw.get('data', []) if raw is mapping else [] -%}
              {%- set _ns = namespace(out=[]) -%}
              {%- for obj in d -%}
                {%- set attrs = obj.get('attributes', {}) -%}
                {%- set _ns.out = _ns.out + [{'id': obj.get('id', ''), 'name': attrs.get('name', ''), 'type': attrs.get('type', ''), 'balance': attrs.get('current_balance', ''), 'currency': attrs.get('currency_code', ''), 'active': attrs.get('active', true)}] -%}
              {%- endfor -%}
              {{ _ns.out }}
            _ctlg_categories: >-
              {%- set raw = (_ctlg_cats_resp['result']['content'] | default({})) if (_ctlg_cats_resp is mapping and 'result' in _ctlg_cats_resp and _ctlg_cats_resp['result'] is mapping) else {} -%}
              {%- set d = raw.get('data', []) if raw is mapping else [] -%}
              {%- set _ns = namespace(out=[]) -%}
              {%- for obj in d -%}{%- set _ns.out = _ns.out + [obj.get('attributes', {}).get('name', '')] -%}{%- endfor -%}
              {{ _ns.out }}
            _ctlg_tags: >-
              {%- set raw = (_ctlg_tags_resp['result']['content'] | default({})) if (_ctlg_tags_resp is mapping and 'result' in _ctlg_tags_resp and _ctlg_tags_resp['result'] is mapping) else {} -%}
              {%- set d = raw.get('data', []) if raw is mapping else [] -%}
              {%- set _ns = namespace(out=[]) -%}
              {%- for obj in d -%}{%- set _ns.out = _ns.out + [obj.get('attributes', {}).get('tag', '')] -%}{%- endfor -%}
              {{ _ns.out }}
            _ctlg_budgets: >-
              {%- set raw = (_ctlg_bgts_resp['result']['content'] | default({})) if (_ctlg_bgts_resp is mapping and 'result' in _ctlg_bgts_resp and _ctlg_bgts_resp['result'] is mapping) else {} -%}
              {%- set d = raw.get('data', []) if raw is mapping else [] -%}
              {%- set _ns = namespace(out=[]) -%}
              {%- for obj in d -%}
                {%- set attrs = obj.get('attributes', {}) -%}
                {%- set _ns.out = _ns.out + [{'id': obj.get('id', ''), 'name': attrs.get('name', ''), 'active': attrs.get('active', true)}] -%}
              {%- endfor -%}
              {{ _ns.out }}
            _ctlg_piggybanks: >-
              {%- set raw = (_ctlg_pigs_resp['result']['content'] | default({})) if (_ctlg_pigs_resp is mapping and 'result' in _ctlg_pigs_resp and _ctlg_pigs_resp['result'] is mapping) else {} -%}
              {%- set d = raw.get('data', []) if raw is mapping else [] -%}
              {%- set _ns = namespace(out=[]) -%}
              {%- for obj in d -%}
                {%- set attrs = obj.get('attributes', {}) -%}
                {%- set curr = attrs.get('current_amount', '0') | float(0) -%}
                {%- set tgt = attrs.get('target_amount', '0') | float(0) -%}
                {%- set _ns.out = _ns.out + [{'id': obj.get('id', ''), 'name': attrs.get('name', ''), 'current': curr, 'target': tgt}] -%}
              {%- endfor -%}
              {{ _ns.out }}
            _ctlg_currencies: >-
              {%- set raw = (_ctlg_curs_resp['result']['content'] | default({})) if (_ctlg_curs_resp is mapping and 'result' in _ctlg_curs_resp and _ctlg_curs_resp['result'] is mapping) else {} -%}
              {%- set d = raw.get('data', []) if raw is mapping else [] -%}
              {%- set _ns = namespace(out=[]) -%}
              {%- for obj in d -%}
                {%- set attrs = obj.get('attributes', {}) -%}
                {%- if attrs.get('enabled', false) -%}
                  {%- set _ns.out = _ns.out + [{'code': attrs.get('code', ''), 'name': attrs.get('name', ''), 'default': attrs.get('default', false)}] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ _ns.out }}
        - variables:
            final_response:
              status: success
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: catalog
              result:
                accounts: '{{ _ctlg_accounts }}'
                categories: '{{ _ctlg_categories }}'
                tags: '{{ _ctlg_tags }}'
                budgets: '{{ _ctlg_budgets }}'
                piggy_banks: '{{ _ctlg_piggybanks }}'
                currencies: '{{ _ctlg_currencies }}'
                counts:
                  accounts: '{{ _ctlg_accounts | length }}'
                  categories: '{{ _ctlg_categories | length }}'
                  tags: '{{ _ctlg_tags | length }}'
                  budgets: '{{ _ctlg_budgets | length }}'
                  piggy_banks: '{{ _ctlg_piggybanks | length }}'
        - stop: return
          response_variable: final_response

    # ── case: account_balance ─────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm == "run" and case_norm == "account_balance" }}'
        sequence:
        - variables:
            _ab_id: '{{ item_id_norm if item_id_norm != "" else none }}'
            _ab_date: '{{ target_date | default("") | string | trim }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _ab_id is none and item_norm != "" }}'
            sequence:
            - action: script.zen_sutra_firefly
              response_variable: _ab_ac_resp
              continue_on_error: true
              data:
                action_type: get
                endpoint: 'autocomplete/accounts?query={{ item_norm | urlencode }}&limit=20'
            - variables:
                _ab_id: >-
                  {%- set c = (_ab_ac_resp['result']['content'] | default([])) if (_ab_ac_resp is mapping and 'result' in _ab_ac_resp and _ab_ac_resp['result'] is mapping) else [] -%}
                  {%- set c = c if c is sequence and c is not string and c is not mapping else [] -%}
                  {%- set _ns = namespace(found=none) -%}
                  {%- for a in c -%}{%- if (a.get('name','') | lower) == (item_norm | lower) -%}{%- set _ns.found = a.get('id') | string -%}{%- endif -%}{%- endfor -%}
                  {{ _ns.found }}
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _ab_id is none }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  version: '{{ tool_version }}'
                  case: account_balance
                  result: null
                  error: 'No account found matching "{{ item_norm }}".'
            - stop: return
              response_variable: final_response
        - variables:
            _ab_ep: '{{ "accounts/" ~ _ab_id ~ "?date=" ~ _ab_date if _ab_date != "" else "accounts/" ~ _ab_id }}'
        - action: script.zen_sutra_firefly
          response_variable: _ab_resp
          continue_on_error: true
          data:
            action_type: get
            endpoint: '{{ _ab_ep }}'
        - variables:
            _ab_raw: >-
              {%- if _ab_resp is mapping and 'result' in _ab_resp and _ab_resp['result'] is mapping -%}
                {%- set d = _ab_resp['result']['content'] | default({}) -%}
                {%- if d is mapping -%}
                  {%- set obj = d.get('data', d) -%}
                  {{ obj.get('attributes', {}) | combine({'id': obj.get('id', _ab_id)}) if obj is mapping else {} }}
                {%- else -%}{{ {} }}{%- endif -%}
              {%- else -%}{{ {} }}{%- endif -%}
        - variables:
            final_response:
              status: '{{ _ab_resp["status"] | default("error") if _ab_resp is mapping else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: account_balance
              result:
                id: '{{ _ab_id }}'
                name: '{{ _ab_raw.get("name", "") if _ab_raw is mapping else "" }}'
                current_balance: '{{ _ab_raw.get("current_balance", "") if _ab_raw is mapping else "" }}'
                balance_date: '{{ _ab_date if _ab_date != "" else now().strftime("%Y-%m-%d") }}'
                currency: '{{ _ab_raw.get("currency_code", "") if _ab_raw is mapping else "" }}'
                account_type: '{{ _ab_raw.get("type", "") if _ab_raw is mapping else "" }}'
        - stop: return
          response_variable: final_response

    # ── case: account_create ──────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm == "run" and case_norm == "account_create" }}'
        sequence:
        - variables:
            _ac_name: '{{ item_norm }}'
            _ac_type: '{{ acct_type_norm if acct_type_norm not in ["all"] else "asset" }}'
            _ac_cur: '{{ currency_code | default("") | string | trim }}'
            _ac_notes: '{{ notes | default("") | string | trim }}'
            _ac_confirm: '{{ confirm | default(false) | bool }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _ac_name == "" }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  version: '{{ tool_version }}'
                  case: account_create
                  result: null
                  error: item (account name) is required for account_create
            - stop: return
              response_variable: final_response
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ not _ac_confirm }}'
            sequence:
            - variables:
                final_response:
                  status: confirm_required
                  tool: '{{ tool_name }}'
                  version: '{{ tool_version }}'
                  case: account_create
                  result:
                    planned:
                      name: '{{ _ac_name }}'
                      type: '{{ _ac_type }}'
                      currency: '{{ _ac_cur if _ac_cur != "" else "default" }}'
                      notes: '{{ _ac_notes }}'
                  message: Set confirm=true to create this account.
            - stop: return
              response_variable: final_response
        - variables:
            _ac_payload: >-
              {%- set body = {'name': _ac_name, 'type': _ac_type} -%}
              {%- if _ac_cur != '' -%}{%- set body = body | combine({'currency_code': _ac_cur}) -%}{%- endif -%}
              {%- if _ac_notes != '' -%}{%- set body = body | combine({'notes': _ac_notes}) -%}{%- endif -%}
              {{ body | tojson }}
        - action: script.zen_sutra_firefly
          response_variable: _ac_post_resp
          continue_on_error: true
          data:
            action_type: post
            endpoint: accounts
            payload: '{{ _ac_payload }}'
        - variables:
            _ac_result: >-
              {%- if _ac_post_resp is mapping and 'result' in _ac_post_resp and _ac_post_resp['result'] is mapping -%}
                {%- set d = _ac_post_resp['result']['content'] | default({}) -%}
                {%- if d is mapping -%}
                  {%- set obj = d.get('data', {}) -%}
                  {{ obj.get('attributes', {}) | combine({'id': obj.get('id', '')}) if obj is mapping else {} }}
                {%- else -%}{{ {} }}{%- endif -%}
              {%- else -%}{{ {} }}{%- endif -%}
        - variables:
            final_response:
              status: '{{ _ac_post_resp["status"] | default("error") if _ac_post_resp is mapping else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: account_create
              result: '{{ _ac_result }}'
        - stop: return
          response_variable: final_response

    # ── case: account_update ──────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm == "run" and case_norm == "account_update" }}'
        sequence:
        - variables:
