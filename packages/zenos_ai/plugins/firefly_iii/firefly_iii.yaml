            sequence:
            - action: script.zen_root_firefly
              response_variable: _tr_src_resp
              continue_on_error: true
              data:
                action_type: get
                endpoint: 'autocomplete/accounts?query={{ src_acct_norm | urlencode }}&limit=20'
            - variables:
                _tr_src_id: >-
                  {%- set c = (_tr_src_resp['result']['content'] | default([])) if (_tr_src_resp is mapping and 'result' in _tr_src_resp and _tr_src_resp['result'] is mapping) else [] -%}
                  {%- set c = c if c is sequence and c is not string and c is not mapping else [] -%}
                  {%- set _ns = namespace(found=none) -%}
                  {%- for a in c -%}{%- if (a.get('name','') | lower) == (src_acct_norm | lower) -%}{%- set _ns.found = a.get('id') | string -%}{%- endif -%}{%- endfor -%}
                  {{ _ns.found }}
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ dst_acct_norm != "" }}'
            sequence:
            - action: script.zen_root_firefly
              response_variable: _tr_dst_resp
              continue_on_error: true
              data:
                action_type: get
                endpoint: 'autocomplete/accounts?query={{ dst_acct_norm | urlencode }}&limit=20'
            - variables:
                _tr_dst_id: >-
                  {%- set c = (_tr_dst_resp['result']['content'] | default([])) if (_tr_dst_resp is mapping and 'result' in _tr_dst_resp and _tr_dst_resp['result'] is mapping) else [] -%}
                  {%- set c = c if c is sequence and c is not string and c is not mapping else [] -%}
                  {%- set _ns = namespace(found=none) -%}
                  {%- for a in c -%}{%- if (a.get('name','') | lower) == (dst_acct_norm | lower) -%}{%- set _ns.found = a.get('id') | string -%}{%- endif -%}{%- endfor -%}
                  {{ _ns.found }}
        - variables:
            _tr_payload: >-
              {%- set txn = {'type': 'transfer', 'date': date_norm, 'amount': amount_norm | string, 'description': description | default('Transfer') | string | trim} -%}
              {%- if _tr_src_id and _tr_src_id | string | trim not in ['', 'none', 'None'] -%}{%- set txn = txn | combine({'source_id': _tr_src_id | string}) -%}{%- endif -%}
              {%- if _tr_dst_id and _tr_dst_id | string | trim not in ['', 'none', 'None'] -%}{%- set txn = txn | combine({'destination_id': _tr_dst_id | string}) -%}{%- endif -%}
              {%- set tag_list = (tags | trim).split(',') | map('trim') | select | list if (tags is defined and tags | default('') | trim != '') else [] -%}
              {%- if label_norm != '' -%}{%- set tag_list = tag_list + ['label:' ~ label_norm] -%}{%- endif -%}
              {%- if tag_list | length > 0 -%}{%- set txn = txn | combine({'tags': tag_list}) -%}{%- endif -%}
              {{ {'transactions': [txn]} | tojson }}
        - action: script.zen_root_firefly
          response_variable: _tr_resp
          continue_on_error: true
          data:
            action_type: post
            endpoint: transactions
            payload: '{{ _tr_payload }}'
        - variables:
            final_response:
              status: '{{ _tr_resp["status"] | default("error") if _tr_resp is mapping else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: transfer
              result:
                source_account: '{{ src_acct_norm }}'
                dest_account: '{{ dst_acct_norm }}'
                amount: '{{ amount_norm }}'
                source_id: '{{ _tr_src_id }}'
                dest_id: '{{ _tr_dst_id }}'
        - stop: return
          response_variable: final_response

    # ── case: spend_summary (compound briefing) ───────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm == "run" and case_norm == "spend_summary" }}'
        sequence:
        - action: script.zen_root_firefly
          response_variable: _ss_sum_resp
          continue_on_error: true
          data:
            action_type: get
            endpoint: 'summary/basic?start={{ start_norm }}&end={{ end_norm }}'
        - action: script.zen_root_firefly
          response_variable: _ss_bgt_resp
          continue_on_error: true
          data:
            action_type: get
            endpoint: 'budgets?start={{ start_norm }}&end={{ end_norm }}'
            perPage: 50
        - action: script.zen_root_firefly
          response_variable: _ss_bil_resp
          continue_on_error: true
          data:
            action_type: get
            endpoint: bills
            perPage: 50
        - variables:
            _ss_summary: >-
              {%- if _ss_sum_resp is mapping and 'result' in _ss_sum_resp and _ss_sum_resp['result'] is mapping -%}
                {{ _ss_sum_resp['result']['content'] | default({}) }}
              {%- else -%}{{ {} }}{%- endif -%}
            _ss_budgets: >-
              {%- set raw = (_ss_bgt_resp['result']['content'] | default({})) if (_ss_bgt_resp is mapping and 'result' in _ss_bgt_resp and _ss_bgt_resp['result'] is mapping) else {} -%}
              {%- set d = raw.get('data', []) if raw is mapping else [] -%}
              {%- set _ns = namespace(out=[]) -%}
              {%- for obj in d -%}
                {%- set attrs = obj.get('attributes', {}) -%}
                {%- set spent = attrs.get('spent', []) -%}
                {%- set spent_sum = spent | sum(attribute='sum') | default(0) | float(0) | abs -%}
                {%- set _ns.out = _ns.out + [{'name': attrs.get('name', ''), 'spent': spent_sum}] -%}
              {%- endfor -%}
              {{ _ns.out }}
            _ss_bills: >-
              {%- set raw = (_ss_bil_resp['result']['content'] | default({})) if (_ss_bil_resp is mapping and 'result' in _ss_bil_resp and _ss_bil_resp['result'] is mapping) else {} -%}
              {%- set d = raw.get('data', []) if raw is mapping else [] -%}
              {%- set today = now().strftime('%Y-%m-%d') -%}
              {%- set _ns = namespace(out=[]) -%}
              {%- for obj in d -%}
                {%- set attrs = obj.get('attributes', {}) -%}
                {%- set next_exp = attrs.get('next_expected_match', '') | string -%}
                {%- if next_exp not in ['', 'None', 'none'] and next_exp >= today -%}
                  {%- set _ns.out = _ns.out + [{'name': attrs.get('name', ''), 'next_due': next_exp, 'amount': attrs.get('amount_max', ''), 'overdue': (next_exp < today)}] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ _ns.out | sort(attribute='next_due') }}
        - variables:
            _ss_hh: '{{ states("sensor.zen_default_household_cabinet_resolved") }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _ss_hh != "" }}'
            sequence:
            - action: script.zen_dojotools_filecabinet
              continue_on_error: true
              data:
                action_type: update
                force_action: true
                volume_entity_id: '{{ _ss_hh }}'
                key: finance_daily_snapshot
                value: '{{ {"summary": _ss_summary, "budgets": _ss_budgets, "bills_due": _ss_bills, "as_of": now().isoformat()} | tojson }}'
                set_timestamp: true
        - variables:
            final_response:
              status: success
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: spend_summary
              result:
                summary: '{{ _ss_summary }}'
                budgets: '{{ _ss_budgets }}'
                bills_upcoming: '{{ _ss_bills }}'
                date_range:
                  start: '{{ start_norm }}'
                  end: '{{ end_norm }}'
                snapshot_written: '{{ _ss_hh != "" }}'
        - stop: return
          response_variable: final_response

    # ── case: budget_summary (KFC-ready budget vs actual) ────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm == "run" and case_norm == "budget_summary" }}'
        sequence:
        # For budget_summary, end defaults to last day of current month (not today)
        # so the full period picture is always visible, not just days elapsed.
        - variables:
            _bsum_start: '{{ start_norm }}'
            _bsum_end: >-
              {%- if end_date | default('') | trim != '' -%}
                {{ end_norm }}
              {%- else -%}
                {%- set y = now().year -%}
                {%- set m = now().month -%}
                {%- set next_m = m + 1 if m < 12 else 1 -%}
                {%- set next_y = y if m < 12 else y + 1 -%}
                {%- set last_day = (('%04d-%02d-01' | format(next_y, next_m)) | as_datetime - timedelta(days=1)).strftime('%Y-%m-%d') -%}
                {{ last_day }}
              {%- endif -%}
        # Fetch budgets with spent amounts for the period
        - action: script.zen_root_firefly
          response_variable: _bsum_bgt_resp
          continue_on_error: true
          data:
            action_type: get
            endpoint: 'budgets?start={{ _bsum_start }}&end={{ _bsum_end }}'
            perPage: 100
        # Fetch budget limits (allocated amounts) for the period
        - action: script.zen_root_firefly
          response_variable: _bsum_lim_resp
          continue_on_error: true
          data:
            action_type: get
            endpoint: 'budgets/limits?start={{ _bsum_start }}&end={{ _bsum_end }}'
            perPage: 100
        - variables:
            _bsum_bgt_raw: >-
              {%- if _bsum_bgt_resp is mapping and 'result' in _bsum_bgt_resp and _bsum_bgt_resp['result'] is mapping -%}
                {{ _bsum_bgt_resp['result']['content'] | default({}) }}
              {%- else -%}{{ {} }}{%- endif -%}
            _bsum_lim_raw: >-
              {%- if _bsum_lim_resp is mapping and 'result' in _bsum_lim_resp and _bsum_lim_resp['result'] is mapping -%}
                {{ _bsum_lim_resp['result']['content'] | default({}) }}
              {%- else -%}{{ {} }}{%- endif -%}
        # Build limit lookup: budget_id → allocated amount
        - variables:
            _bsum_limits: >-
              {%- set d = _bsum_lim_raw.get('data', []) if _bsum_lim_raw is mapping else [] -%}
              {%- set ns = namespace(out={}) -%}
              {%- for obj in d -%}
                {%- set attrs = obj.get('attributes', {}) -%}
                {%- set bid = attrs.get('budget_id', '') | string -%}
                {%- set amt = attrs.get('amount', '0') | float(0) -%}
                {%- if bid != '' -%}
                  {%- set ns.out = ns.out | combine({bid: ns.out.get(bid, 0.0) + amt}) -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out }}
        # Compute days left in period (all naive datetimes via string conversion)
        - variables:
            _bsum_days_total: >-
              {%- set s = _bsum_start | as_datetime -%}
              {%- set e = _bsum_end | as_datetime -%}
              {{ ((e - s).days + 1) | int }}
            _bsum_days_left: >-
              {%- set today_str = now().strftime('%Y-%m-%d') -%}
              {%- set today_dt = today_str | as_datetime -%}
              {%- set end_dt = _bsum_end | as_datetime -%}
              {%- set diff = (end_dt - today_dt).days + 1 -%}
              {{ [diff, 0] | max | int }}
        # Synthesize per-budget rows
        - variables:
            _bsum_rows: >-
              {%- set d = _bsum_bgt_raw.get('data', []) if _bsum_bgt_raw is mapping else [] -%}
              {%- set ns = namespace(out=[], total_alloc=0.0, total_spent=0.0) -%}
              {%- for obj in d -%}
                {%- set attrs = obj.get('attributes', {}) -%}
                {%- if attrs.get('active', true) -%}
                  {%- set bid = obj.get('id', '') | string -%}
                  {%- set name = attrs.get('name', '') -%}
                  {%- set spent_list = attrs.get('spent', []) -%}
                  {%- set spent = spent_list | sum(attribute='sum') | default(0) | float(0) | abs -%}
                  {%- set allocated = _bsum_limits.get(bid, 0.0) | float(0) -%}
                  {%- set remaining = [allocated - spent, 0] | max | round(2) -%}
                  {%- set pct = ((spent / allocated * 100) | round(1)) if allocated > 0 else none -%}
                  {%- set over = spent > allocated and allocated > 0 -%}
                  {%- set ns.total_alloc = ns.total_alloc + allocated -%}
                  {%- set ns.total_spent = ns.total_spent + spent -%}
                  {%- if allocated > 0 -%}
                  {%- set ns.out = ns.out + [{
                    'budget_id': bid,
                    'name': name,
                    'allocated': allocated | round(2),
                    'spent': spent | round(2),
                    'remaining': remaining,
                    'pct_used': pct,
                    'over_budget': over
                  }] -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
              {{ {
                'budgets': ns.out | sort(attribute='name'),
                'total_allocated': ns.total_alloc | round(2),
                'total_spent': ns.total_spent | round(2),
                'total_remaining': [ns.total_alloc - ns.total_spent, 0] | max | round(2),
                'over_budget_count': ns.out | selectattr('over_budget') | list | length,
                'days_left_in_period': _bsum_days_left,
                'days_total_in_period': _bsum_days_total,
                'period_start': _bsum_start,
                'period_end': _bsum_end,
                'generated_at': now().isoformat()
              } }}
        - variables:
            final_response:
              status: '{{ _bsum_bgt_resp["status"] | default("error") if _bsum_bgt_resp is mapping else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: budget_summary
              result: '{{ _bsum_rows }}'
        - stop: return
          response_variable: final_response

    # ── case: finance_rollup (KFC seed — budget + bills + net_worth inline) ──
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm == "run" and case_norm == "finance_rollup" }}'
        sequence:
        - action: script.zen_dojotools_finance
          response_variable: _fr_bgt_resp
          continue_on_error: true
          data:
            mode: run
            case: budget_summary
        - action: script.zen_dojotools_finance
          response_variable: _fr_bil_resp
          continue_on_error: true
          data:
            mode: run
            case: bills_list
        - action: script.zen_dojotools_finance
          response_variable: _fr_nw_resp
          continue_on_error: true
          data:
            mode: run
            case: net_worth_snapshot
        - variables:
            _fr_budget: >-
              {%- set r = _fr_bgt_resp if _fr_bgt_resp is mapping else {} -%}
              {{ r.get('result', {}) if r is mapping else {} }}
            _fr_bills: >-
              {%- set r = _fr_bil_resp if _fr_bil_resp is mapping else {} -%}
              {{ r.get('result', {}) if r is mapping else {} }}
            _fr_networth: >-
              {%- set r = _fr_nw_resp if _fr_nw_resp is mapping else {} -%}
              {{ r.get('result', {}) if r is mapping else {} }}
        - variables:
            final_response:
              status: ok
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: finance_rollup
              result:
                budget: '{{ _fr_budget }}'
                bills: '{{ _fr_bills }}'
                net_worth: '{{ _fr_networth }}'
                generated_at: '{{ now().isoformat() }}'
        - stop: return
          response_variable: final_response

    # ── case: health ─────────────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm == "run" and case_norm == "health" }}'
        sequence:
        - action: script.zen_root_firefly
          response_variable: _hlt_about_resp
          continue_on_error: true
          data:
            action_type: get
            endpoint: about
        - action: script.zen_root_firefly
          response_variable: _hlt_user_resp
          continue_on_error: true
          data:
            action_type: get
            endpoint: about/user
        - action: script.zen_root_firefly
          response_variable: _hlt_cur_resp
          continue_on_error: true
          data:
            action_type: get
            endpoint: currencies/default
        - variables:
            _hlt_about: >-
              {%- if _hlt_about_resp is mapping and 'result' in _hlt_about_resp and _hlt_about_resp['result'] is mapping -%}
                {{ _hlt_about_resp['result']['content'] | default({}) }}
              {%- else -%}{{ {} }}{%- endif -%}
            _hlt_user: >-
              {%- if _hlt_user_resp is mapping and 'result' in _hlt_user_resp and _hlt_user_resp['result'] is mapping -%}
                {{ _hlt_user_resp['result']['content'] | default({}) }}
              {%- else -%}{{ {} }}{%- endif -%}
        - variables:
            _hlt_about_data: '{{ _hlt_about.get("data", {}) if _hlt_about is mapping else {} }}'
            _hlt_user_data: '{{ _hlt_user.get("data", {}) if _hlt_user is mapping else {} }}'
            _hlt_cur_attrs: >-
              {%- if _hlt_cur_resp is mapping and 'result' in _hlt_cur_resp and _hlt_cur_resp['result'] is mapping -%}
                {%- set c = _hlt_cur_resp['result']['content'] | default({}) -%}
                {%- set obj = c.get('data', {}) if c is mapping else {} -%}
                {{ obj.get('attributes', {}) if obj is mapping else {} }}
              {%- else -%}{{ {} }}{%- endif -%}
        - variables:
            final_response:
              status: '{{ "success" if (_hlt_about_resp is mapping and _hlt_about_resp.get("status") == "success") else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: health
              result:
                reachable: '{{ _hlt_about_resp is mapping and _hlt_about_resp.get("status") == "success" }}'
                firefly_version: '{{ _hlt_about_data.get("version", "unknown") if _hlt_about_data is mapping else "unknown" }}'
                api_version: '{{ _hlt_about_data.get("api_version", "unknown") if _hlt_about_data is mapping else "unknown" }}'
                user_email: '{{ _hlt_user_data.get("email", "unknown") if _hlt_user_data is mapping else "unknown" }}'
                user_role: '{{ _hlt_user_data.get("role", "unknown") if _hlt_user_data is mapping else "unknown" }}'
                default_currency: '{{ _hlt_cur_attrs.get("code", "unknown") if _hlt_cur_attrs is mapping else "unknown" }}'
                default_currency_name: '{{ _hlt_cur_attrs.get("name", "") if _hlt_cur_attrs is mapping else "" }}'
                firefly_url: '{{ states("input_text.firefly_url") }}'
        - stop: return
          response_variable: final_response

    # ── case: catalog ─────────────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm == "run" and case_norm == "catalog" }}'
        sequence:
        - action: script.zen_root_firefly
          response_variable: _ctlg_accts_resp
          continue_on_error: true
          data:
            action_type: get
            endpoint: accounts
            perPage: 100
        - action: script.zen_root_firefly
          response_variable: _ctlg_cats_resp
          continue_on_error: true
          data:
            action_type: get
            endpoint: categories
            perPage: 100
        - action: script.zen_root_firefly
          response_variable: _ctlg_tags_resp
          continue_on_error: true
          data:
            action_type: get
            endpoint: tags
            perPage: 100
        - action: script.zen_root_firefly
          response_variable: _ctlg_bgts_resp
          continue_on_error: true
          data:
            action_type: get
            endpoint: budgets
            perPage: 100
        - action: script.zen_root_firefly
          response_variable: _ctlg_pigs_resp
          continue_on_error: true
          data:
            action_type: get
            endpoint: piggy-banks
            perPage: 100
        - action: script.zen_root_firefly
          response_variable: _ctlg_curs_resp
          continue_on_error: true
          data:
            action_type: get
            endpoint: currencies
            perPage: 100
        - variables:
            _ctlg_accounts: >-
              {%- set raw = (_ctlg_accts_resp['result']['content'] | default({})) if (_ctlg_accts_resp is mapping and 'result' in _ctlg_accts_resp and _ctlg_accts_resp['result'] is mapping) else {} -%}
              {%- set d = raw.get('data', []) if raw is mapping else [] -%}
              {%- set _ns = namespace(out=[]) -%}
              {%- for obj in d -%}
                {%- set attrs = obj.get('attributes', {}) -%}
                {%- set _ns.out = _ns.out + [{'id': obj.get('id', ''), 'name': attrs.get('name', ''), 'type': attrs.get('type', ''), 'balance': attrs.get('current_balance', ''), 'currency': attrs.get('currency_code', ''), 'active': attrs.get('active', true)}] -%}
              {%- endfor -%}
              {{ _ns.out }}
            _ctlg_categories: >-
              {%- set raw = (_ctlg_cats_resp['result']['content'] | default({})) if (_ctlg_cats_resp is mapping and 'result' in _ctlg_cats_resp and _ctlg_cats_resp['result'] is mapping) else {} -%}
              {%- set d = raw.get('data', []) if raw is mapping else [] -%}
              {%- set _ns = namespace(out=[]) -%}
              {%- for obj in d -%}{%- set _ns.out = _ns.out + [obj.get('attributes', {}).get('name', '')] -%}{%- endfor -%}
              {{ _ns.out }}
            _ctlg_tags: >-
              {%- set raw = (_ctlg_tags_resp['result']['content'] | default({})) if (_ctlg_tags_resp is mapping and 'result' in _ctlg_tags_resp and _ctlg_tags_resp['result'] is mapping) else {} -%}
              {%- set d = raw.get('data', []) if raw is mapping else [] -%}
              {%- set _ns = namespace(out=[]) -%}
              {%- for obj in d -%}{%- set _ns.out = _ns.out + [obj.get('attributes', {}).get('tag', '')] -%}{%- endfor -%}
              {{ _ns.out }}
            _ctlg_budgets: >-
              {%- set raw = (_ctlg_bgts_resp['result']['content'] | default({})) if (_ctlg_bgts_resp is mapping and 'result' in _ctlg_bgts_resp and _ctlg_bgts_resp['result'] is mapping) else {} -%}
              {%- set d = raw.get('data', []) if raw is mapping else [] -%}
              {%- set _ns = namespace(out=[]) -%}
              {%- for obj in d -%}
                {%- set attrs = obj.get('attributes', {}) -%}
                {%- set _ns.out = _ns.out + [{'id': obj.get('id', ''), 'name': attrs.get('name', ''), 'active': attrs.get('active', true)}] -%}
              {%- endfor -%}
              {{ _ns.out }}
            _ctlg_piggybanks: >-
              {%- set raw = (_ctlg_pigs_resp['result']['content'] | default({})) if (_ctlg_pigs_resp is mapping and 'result' in _ctlg_pigs_resp and _ctlg_pigs_resp['result'] is mapping) else {} -%}
              {%- set d = raw.get('data', []) if raw is mapping else [] -%}
              {%- set _ns = namespace(out=[]) -%}
              {%- for obj in d -%}
                {%- set attrs = obj.get('attributes', {}) -%}
                {%- set curr = attrs.get('current_amount', '0') | float(0) -%}
                {%- set tgt = attrs.get('target_amount', '0') | float(0) -%}
                {%- set _ns.out = _ns.out + [{'id': obj.get('id', ''), 'name': attrs.get('name', ''), 'current': curr, 'target': tgt}] -%}
              {%- endfor -%}
              {{ _ns.out }}
            _ctlg_currencies: >-
              {%- set raw = (_ctlg_curs_resp['result']['content'] | default({})) if (_ctlg_curs_resp is mapping and 'result' in _ctlg_curs_resp and _ctlg_curs_resp['result'] is mapping) else {} -%}
              {%- set d = raw.get('data', []) if raw is mapping else [] -%}
              {%- set _ns = namespace(out=[]) -%}
              {%- for obj in d -%}
                {%- set attrs = obj.get('attributes', {}) -%}
                {%- if attrs.get('enabled', false) -%}
                  {%- set _ns.out = _ns.out + [{'code': attrs.get('code', ''), 'name': attrs.get('name', ''), 'default': attrs.get('default', false)}] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ _ns.out }}
        - variables:
            final_response:
              status: success
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: catalog
              result:
                accounts: '{{ _ctlg_accounts }}'
                categories: '{{ _ctlg_categories }}'
                tags: '{{ _ctlg_tags }}'
                budgets: '{{ _ctlg_budgets }}'
                piggy_banks: '{{ _ctlg_piggybanks }}'
                currencies: '{{ _ctlg_currencies }}'
                counts:
                  accounts: '{{ _ctlg_accounts | length }}'
                  categories: '{{ _ctlg_categories | length }}'
                  tags: '{{ _ctlg_tags | length }}'
                  budgets: '{{ _ctlg_budgets | length }}'
                  piggy_banks: '{{ _ctlg_piggybanks | length }}'
        - stop: return
          response_variable: final_response

    # ── case: account_balance ─────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm == "run" and case_norm == "account_balance" }}'
        sequence:
        - variables:
            _ab_id: '{{ item_id_norm if item_id_norm != "" else none }}'
            _ab_date: '{{ target_date | default("") | string | trim }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _ab_id is none and item_norm != "" }}'
            sequence:
            - action: script.zen_root_firefly
              response_variable: _ab_ac_resp
              continue_on_error: true
              data:
                action_type: get
                endpoint: 'autocomplete/accounts?query={{ item_norm | urlencode }}&limit=20'
            - variables:
                _ab_id: >-
                  {%- set c = (_ab_ac_resp['result']['content'] | default([])) if (_ab_ac_resp is mapping and 'result' in _ab_ac_resp and _ab_ac_resp['result'] is mapping) else [] -%}
                  {%- set c = c if c is sequence and c is not string and c is not mapping else [] -%}
                  {%- set _ns = namespace(found=none) -%}
                  {%- for a in c -%}{%- if (a.get('name','') | lower) == (item_norm | lower) -%}{%- set _ns.found = a.get('id') | string -%}{%- endif -%}{%- endfor -%}
                  {{ _ns.found }}
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _ab_id is none }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  version: '{{ tool_version }}'
                  case: account_balance
                  result: null
                  error: 'No account found matching "{{ item_norm }}".'
            - stop: return
              response_variable: final_response
        - variables:
            _ab_ep: '{{ "accounts/" ~ _ab_id ~ "?date=" ~ _ab_date if _ab_date != "" else "accounts/" ~ _ab_id }}'
        - action: script.zen_root_firefly
          response_variable: _ab_resp
          continue_on_error: true
          data:
            action_type: get
            endpoint: '{{ _ab_ep }}'
        - variables:
            _ab_raw: >-
              {%- if _ab_resp is mapping and 'result' in _ab_resp and _ab_resp['result'] is mapping -%}
                {%- set d = _ab_resp['result']['content'] | default({}) -%}
                {%- if d is mapping -%}
                  {%- set obj = d.get('data', d) -%}
                  {{ obj.get('attributes', {}) | combine({'id': obj.get('id', _ab_id)}) if obj is mapping else {} }}
                {%- else -%}{{ {} }}{%- endif -%}
              {%- else -%}{{ {} }}{%- endif -%}
        - variables:
