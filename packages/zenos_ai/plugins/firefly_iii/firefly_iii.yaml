    # ── case: budget_overview ────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm == "run" and case_norm == "budget_overview" }}'
        sequence:
        - action: script.zen_root_firefly
          response_variable: _bo_resp
          continue_on_error: true
          data:
            action_type: get
            endpoint: 'budgets?start={{ start_norm }}&end={{ end_norm }}'
            perPage: 100
        - action: script.zen_root_firefly
          response_variable: _ba_resp
          continue_on_error: true
          data:
            action_type: get
            endpoint: 'available-budgets?start={{ start_norm }}&end={{ end_norm }}'
            perPage: 100
        - variables:
            _bo_raw: >-
              {%- if _bo_resp is mapping and 'result' in _bo_resp and _bo_resp['result'] is mapping -%}
                {{ _bo_resp['result']['content'] | default({}) }}
              {%- else -%}{{ {} }}{%- endif -%}
            _ba_raw: >-
              {%- if _ba_resp is mapping and 'result' in _ba_resp and _ba_resp['result'] is mapping -%}
                {{ _ba_resp['result']['content'] | default({}) }}
              {%- else -%}{{ {} }}{%- endif -%}
        - variables:
            _bo_data: >-
              {%- set d = _bo_raw.get('data', []) if _bo_raw is mapping else [] -%}
              {%- set _ns = namespace(out=[]) -%}
              {%- for obj in d -%}
                {%- set attrs = obj.get('attributes', {}) -%}
                {%- set spent = attrs.get('spent', []) -%}
                {%- set spent_sum = spent | sum(attribute='sum') | default(0) | float(0) | abs -%}
                {%- set _ns.out = _ns.out + [{'id': obj.get('id', ''), 'name': attrs.get('name', ''), 'active': attrs.get('active', true), 'auto_budget': attrs.get('auto_budget_amount', none), 'spent': spent_sum}] -%}
              {%- endfor -%}
              {{ _ns.out }}
            _ba_data: >-
              {%- set d = _ba_raw.get('data', []) if _ba_raw is mapping else [] -%}
              {%- set _ns = namespace(out=[]) -%}
              {%- for obj in d -%}
                {%- set attrs = obj.get('attributes', {}) -%}
                {%- set _ns.out = _ns.out + [{'budget_id': attrs.get('budget_id', ''), 'period': attrs.get('period', ''), 'amount': attrs.get('amount', '0'), 'start': attrs.get('start', ''), 'end': attrs.get('end', '')}] -%}
              {%- endfor -%}
              {{ _ns.out }}
        - variables:
            final_response:
              status: '{{ _bo_resp["status"] | default("error") if _bo_resp is mapping else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: budget_overview
              result:
                budgets: '{{ _bo_data }}'
