            - variables:
                _bst_id: >-
                  {%- set raw = (_bst_list_resp['result']['content'] | default({})) if (_bst_list_resp is mapping and 'result' in _bst_list_resp and _bst_list_resp['result'] is mapping) else {} -%}
                  {%- set d = raw.get('data', []) if raw is mapping else [] -%}
                  {%- set _ns = namespace(found=none) -%}
                  {%- for obj in d -%}
                    {%- if (obj.get('attributes', {}).get('name', '') | lower) == (item_norm | lower) -%}
                      {%- set _ns.found = obj.get('id') | string -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ _ns.found }}
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _bst_id is none }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  version: '{{ tool_version }}'
