              {%- set _ns = namespace(out=[]) -%}
              {%- for obj in d -%}
                {%- set attrs = obj.get('attributes', {}) -%}
                {%- set _ns.out = _ns.out + [{'budget_id': attrs.get('budget_id', ''), 'period': attrs.get('period', ''), 'amount': attrs.get('amount', '0'), 'start': attrs.get('start', ''), 'end': attrs.get('end', '')}] -%}
              {%- endfor -%}
              {{ _ns.out }}
        - variables:
            final_response:
              status: '{{ _bo_resp["status"] | default("error") if _bo_resp is mapping else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: budget_overview
              result:
                budgets: '{{ _bo_data }}'
                available_budgets: '{{ _ba_data }}'
                date_range:
                  start: '{{ start_norm }}'
                  end: '{{ end_norm }}'
        - stop: return
          response_variable: final_response

    # ── case: bills_list ─────────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm == "run" and case_norm == "bills_list" }}'
        sequence:
        - action: script.zen_sutra_firefly
          response_variable: _bl_resp
          continue_on_error: true
          data:
            action_type: get
            endpoint: bills
            pageNumber: '{{ page_norm }}'
            perPage: '{{ per_norm }}'
        - variables:
            _bl_raw: >-
              {%- if _bl_resp is mapping and 'result' in _bl_resp and _bl_resp['result'] is mapping -%}
                {{ _bl_resp['result']['content'] | default({}) }}
              {%- else -%}{{ {} }}{%- endif -%}
        - variables:
            _bl_data: >-
              {%- set d = _bl_raw.get('data', []) if _bl_raw is mapping else [] -%}
              {%- set today = now().strftime('%Y-%m-%d') -%}
              {%- set _ns = namespace(out=[]) -%}
              {%- for obj in d -%}
                {%- set attrs = obj.get('attributes', {}) -%}
                {%- set next_exp = attrs.get('next_expected_match', '') | string -%}
                {%- set overdue = (next_exp != '' and next_exp < today) -%}
                {%- set _ns.out = _ns.out + [{'id': obj.get('id', ''), 'name': attrs.get('name', ''), 'amount_min': attrs.get('amount_min', ''), 'amount_max': attrs.get('amount_max', ''), 'currency': attrs.get('currency_code', ''), 'repeat_freq': attrs.get('repeat_freq', ''), 'next_expected_match': next_exp, 'overdue': overdue, 'active': attrs.get('active', true), 'paid_dates': attrs.get('paid_dates', [])}] -%}
              {%- endfor -%}
              {{ _ns.out }}
        - variables:
            final_response:
              status: '{{ _bl_resp["status"] | default("error") if _bl_resp is mapping else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: bills_list
              result:
                bills: '{{ _bl_data }}'
                count: '{{ _bl_data | length }}'
                overdue_count: '{{ _bl_data | selectattr("overdue") | list | length }}'
        - stop: return
          response_variable: final_response

    # ── case: piggy_banks_list ───────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm == "run" and case_norm == "piggy_banks_list" }}'
        sequence:
        - action: script.zen_sutra_firefly
          response_variable: _pb_resp
          continue_on_error: true
          data:
            action_type: get
            endpoint: piggy-banks
            pageNumber: '{{ page_norm }}'
            perPage: '{{ per_norm }}'
        - variables:
            _pb_raw: >-
              {%- if _pb_resp is mapping and 'result' in _pb_resp and _pb_resp['result'] is mapping -%}
                {{ _pb_resp['result']['content'] | default({}) }}
              {%- else -%}{{ {} }}{%- endif -%}
        - variables:
            _pb_data: >-
              {%- set d = _pb_raw.get('data', []) if _pb_raw is mapping else [] -%}
              {%- set _ns = namespace(out=[]) -%}
              {%- for obj in d -%}
                {%- set attrs = obj.get('attributes', {}) -%}
