    # ── case: bills_list ─────────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm == "run" and case_norm == "bills_list" }}'
        sequence:
        - action: script.zen_root_firefly
          response_variable: _bl_resp
          continue_on_error: true
          data:
            action_type: get
            endpoint: bills
            pageNumber: '{{ page_norm }}'
            perPage: '{{ per_norm }}'
        - variables:
            _bl_raw: >-
              {%- if _bl_resp is mapping and 'result' in _bl_resp and _bl_resp['result'] is mapping -%}
                {{ _bl_resp['result']['content'] | default({}) }}
              {%- else -%}{{ {} }}{%- endif -%}
        - variables:
            _bl_data: >-
              {%- set d = _bl_raw.get('data', []) if _bl_raw is mapping else [] -%}
              {%- set today = now().strftime('%Y-%m-%d') -%}
              {%- set _ns = namespace(out=[]) -%}
              {%- for obj in d -%}
                {%- set attrs = obj.get('attributes', {}) -%}
                {%- set next_exp = attrs.get('next_expected_match', '') | string -%}
                {%- set overdue = (next_exp not in ['', 'None', 'none'] and next_exp < today) -%}
                {%- set _ns.out = _ns.out + [{'id': obj.get('id', ''), 'name': attrs.get('name', ''), 'amount_min': attrs.get('amount_min', ''), 'amount_max': attrs.get('amount_max', ''), 'currency': attrs.get('currency_code', ''), 'repeat_freq': attrs.get('repeat_freq', ''), 'next_expected_match': next_exp, 'overdue': overdue, 'active': attrs.get('active', true), 'paid_dates': attrs.get('paid_dates', [])}] -%}
              {%- endfor -%}
              {{ _ns.out }}
        - variables:
            final_response:
              status: '{{ _bl_resp["status"] | default("error") if _bl_resp is mapping else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: bills_list
              result:
                bills: '{{ _bl_data }}'
                count: '{{ _bl_data | length }}'
                overdue_count: '{{ _bl_data | selectattr("overdue") | list | length }}'
        - stop: return
          response_variable: final_response

    # ── case: piggy_banks_list ───────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm == "run" and case_norm == "piggy_banks_list" }}'
        sequence:
        - action: script.zen_root_firefly
          response_variable: _pb_resp
          continue_on_error: true
          data:
            action_type: get
            endpoint: piggy-banks
            pageNumber: '{{ page_norm }}'
            perPage: '{{ per_norm }}'
        - variables:
            _pb_raw: >-
              {%- if _pb_resp is mapping and 'result' in _pb_resp and _pb_resp['result'] is mapping -%}
                {{ _pb_resp['result']['content'] | default({}) }}
              {%- else -%}{{ {} }}{%- endif -%}
        - variables:
            _pb_data: >-
              {%- set d = _pb_raw.get('data', []) if _pb_raw is mapping else [] -%}
              {%- set _ns = namespace(out=[]) -%}
              {%- for obj in d -%}
                {%- set attrs = obj.get('attributes', {}) -%}
                {%- set curr = attrs.get('current_amount', '0') | float(0) -%}
                {%- set tgt = attrs.get('target_amount', '0') | float(0) -%}
                {%- set pct = ((curr / tgt * 100) | round(1)) if tgt > 0 else 0 -%}
                {%- set _ns.out = _ns.out + [{'id': obj.get('id', ''), 'name': attrs.get('name', ''), 'current_amount': curr, 'target_amount': tgt, 'percentage': pct, 'currency': attrs.get('currency_code', ''), 'target_date': attrs.get('target_date', none)}] -%}
              {%- endfor -%}
              {{ _ns.out }}
        - variables:
            final_response:
              status: '{{ _pb_resp["status"] | default("error") if _pb_resp is mapping else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: piggy_banks_list
              result:
                piggy_banks: '{{ _pb_data }}'
                count: '{{ _pb_data | length }}'
        - stop: return
          response_variable: final_response

    # ── case: category_spend ─────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm == "run" and case_norm == "category_spend" }}'
        sequence:
        - variables:
            _cs_id: '{{ item_id_norm if item_id_norm != "" else none }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _cs_id is none and item_norm != "" }}'
            sequence:
            - action: script.zen_root_firefly
              response_variable: _cs_ac_resp
              continue_on_error: true
              data:
                action_type: get
                endpoint: 'autocomplete/categories?query={{ item_norm | urlencode }}&limit=20'
            - variables:
                _cs_ac_data: >-
                  {%- if _cs_ac_resp is mapping and 'result' in _cs_ac_resp and _cs_ac_resp['result'] is mapping -%}
                    {%- set c = _cs_ac_resp['result']['content'] | default([]) -%}
                    {{ c if c is sequence and c is not string and c is not mapping else [] }}
                  {%- else -%}{{ [] }}{%- endif -%}
            - variables:
                _cs_id: >-
                  {%- set _ns = namespace(found=none) -%}
                  {%- for a in _cs_ac_data -%}
                    {%- if (a.get('name', '') | lower) == (item_norm | lower) -%}
                      {%- set _ns.found = a.get('id') | string -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ _ns.found }}
                _cs_candidates: '{{ _cs_ac_data | map(attribute="name") | list }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _cs_id is none }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  version: '{{ tool_version }}'
                  case: category_spend
                  result: null
                  error: 'No category found matching "{{ item_norm }}". Candidates: {{ _cs_candidates | default([]) }}'
            - stop: return
              response_variable: final_response
        - action: script.zen_root_firefly
          response_variable: _cs_resp
          continue_on_error: true
          data:
            action_type: get
            endpoint: 'categories/{{ _cs_id }}/transactions?start={{ start_norm }}&end={{ end_norm }}'
            pageNumber: '{{ page_norm }}'
            perPage: '{{ per_norm }}'
        - variables:
            _cs_raw: >-
              {%- if _cs_resp is mapping and 'result' in _cs_resp and _cs_resp['result'] is mapping -%}
                {{ _cs_resp['result']['content'] | default({}) }}
              {%- else -%}{{ {} }}{%- endif -%}
        - variables:
            _cs_data: >-
              {%- set d = _cs_raw.get('data', []) if _cs_raw is mapping else [] -%}
              {%- set _ns = namespace(out=[], total=0.0) -%}
              {%- for obj in d -%}
                {%- set attrs = obj.get('attributes', {}) -%}
                {%- set txns = attrs.get('transactions', []) -%}
                {%- set first = txns[0] if txns | length > 0 else {} -%}
                {%- set amt = first.get('amount', '0') | float(0) -%}
                {%- set _ns.total = _ns.total + amt -%}
                {%- set _ns.out = _ns.out + [{'id': obj.get('id', ''), 'date': first.get('date', ''), 'description': first.get('description', ''), 'amount': amt, 'source': first.get('source_name', '')}] -%}
              {%- endfor -%}
              {{ {'transactions': _ns.out, 'total_spent': _ns.total | round(2)} }}
        - variables:
            final_response:
              status: '{{ _cs_resp["status"] | default("error") if _cs_resp is mapping else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: category_spend
              result:
                category: '{{ item_norm }}'
                category_id: '{{ _cs_id }}'
                data: '{{ _cs_data }}'
                date_range:
                  start: '{{ start_norm }}'
                  end: '{{ end_norm }}'
        - stop: return
          response_variable: final_response

    # ── case: transaction_add ────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm == "run" and case_norm == "transaction_add" }}'
        sequence:
        # Resolve source account
        - variables:
            _ta_src_id: none
            _ta_dst_id: none
            _ta_cat_id: none
            _ta_bgt_id: none
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ src_acct_norm != "" }}'
            sequence:
            - action: script.zen_root_firefly
              response_variable: _ta_src_resp
              continue_on_error: true
              data:
                action_type: get
                endpoint: 'autocomplete/accounts?query={{ src_acct_norm | urlencode }}&limit=20'
            - variables:
                _ta_src_data: >-
                  {%- if _ta_src_resp is mapping and 'result' in _ta_src_resp and _ta_src_resp['result'] is mapping -%}
                    {%- set c = _ta_src_resp['result']['content'] | default([]) -%}
                    {{ c if c is sequence and c is not string and c is not mapping else [] }}
                  {%- else -%}{{ [] }}{%- endif -%}
            - variables:
                _ta_src_id: >-
                  {%- set _ns = namespace(found=none) -%}
                  {%- for a in _ta_src_data -%}
                    {%- if (a.get('name', '') | lower) == (src_acct_norm | lower) -%}
                      {%- set _ns.found = a.get('id') | string -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ _ns.found }}
        # Resolve dest account
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ dst_acct_norm != "" }}'
            sequence:
            - action: script.zen_root_firefly
              response_variable: _ta_dst_resp
              continue_on_error: true
              data:
                action_type: get
                endpoint: 'autocomplete/accounts?query={{ dst_acct_norm | urlencode }}&limit=20'
            - variables:
                _ta_dst_data: >-
                  {%- if _ta_dst_resp is mapping and 'result' in _ta_dst_resp and _ta_dst_resp['result'] is mapping -%}
                    {%- set c = _ta_dst_resp['result']['content'] | default([]) -%}
                    {{ c if c is sequence and c is not string and c is not mapping else [] }}
                  {%- else -%}{{ [] }}{%- endif -%}
            - variables:
                _ta_dst_id: >-
                  {%- set _ns = namespace(found=none) -%}
                  {%- for a in _ta_dst_data -%}
                    {%- if (a.get('name', '') | lower) == (dst_acct_norm | lower) -%}
                      {%- set _ns.found = a.get('id') | string -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ _ns.found }}
        # Resolve category
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ cat_norm != "" }}'
            sequence:
            - action: script.zen_root_firefly
              response_variable: _ta_cat_resp
              continue_on_error: true
              data:
                action_type: get
                endpoint: 'autocomplete/categories?query={{ cat_norm | urlencode }}&limit=20'
            - variables:
                _ta_cat_data: >-
                  {%- if _ta_cat_resp is mapping and 'result' in _ta_cat_resp and _ta_cat_resp['result'] is mapping -%}
                    {%- set c = _ta_cat_resp['result']['content'] | default([]) -%}
                    {{ c if c is sequence and c is not string and c is not mapping else [] }}
                  {%- else -%}{{ [] }}{%- endif -%}
            - variables:
                _ta_cat_id: >-
                  {%- set _ns = namespace(found=none) -%}
                  {%- for a in _ta_cat_data -%}
                    {%- if (a.get('name', '') | lower) == (cat_norm | lower) -%}
                      {%- set _ns.found = a.get('id') | string -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ _ns.found }}
        # Resolve budget
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ bgt_norm != "" }}'
            sequence:
            - action: script.zen_root_firefly
              response_variable: _ta_bgt_resp
              continue_on_error: true
              data:
                action_type: get
                endpoint: 'autocomplete/budgets?query={{ bgt_norm | urlencode }}&limit=20'
            - variables:
                _ta_bgt_data: >-
                  {%- if _ta_bgt_resp is mapping and 'result' in _ta_bgt_resp and _ta_bgt_resp['result'] is mapping -%}
                    {%- set c = _ta_bgt_resp['result']['content'] | default([]) -%}
                    {{ c if c is sequence and c is not string and c is not mapping else [] }}
                  {%- else -%}{{ [] }}{%- endif -%}
            - variables:
                _ta_bgt_id: >-
                  {%- set _ns = namespace(found=none) -%}
                  {%- for a in _ta_bgt_data -%}
                    {%- if (a.get('name', '') | lower) == (bgt_norm | lower) -%}
                      {%- set _ns.found = a.get('id') | string -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ _ns.found }}
        # Build and POST transaction
        - variables:
            _ta_payload: >-
              {%- set txn = {'type': txn_type_norm, 'date': date_norm, 'amount': amount_norm | string, 'description': description | default('') | string | trim} -%}
              {%- if _ta_src_id and _ta_src_id | string | trim not in ['', 'none', 'None'] -%}{%- set txn = txn | combine({'source_id': _ta_src_id | string}) -%}{%- endif -%}
              {%- if _ta_dst_id and _ta_dst_id | string | trim not in ['', 'none', 'None'] -%}{%- set txn = txn | combine({'destination_id': _ta_dst_id | string}) -%}{%- endif -%}
              {%- if _ta_cat_id and _ta_cat_id | string | trim not in ['', 'none', 'None'] -%}{%- set txn = txn | combine({'category_id': _ta_cat_id | string}) -%}{%- endif -%}
              {%- if _ta_bgt_id and _ta_bgt_id | string | trim not in ['', 'none', 'None'] -%}{%- set txn = txn | combine({'budget_id': _ta_bgt_id | string}) -%}{%- endif -%}
              {%- set tag_list = (tags | trim).split(',') | map('trim') | select | list if (tags is defined and tags | default('') | trim != '') else [] -%}
              {%- if label_norm != '' -%}{%- set tag_list = tag_list + ['label:' ~ label_norm] -%}{%- endif -%}
              {%- if tag_list | length > 0 -%}{%- set txn = txn | combine({'tags': tag_list}) -%}{%- endif -%}
              {{ {'transactions': [txn]} | tojson }}
        - action: script.zen_root_firefly
          response_variable: _ta_post_resp
          continue_on_error: true
          data:
            action_type: post
            endpoint: transactions
            payload: '{{ _ta_payload }}'
        - variables:
            _ta_result: >-
              {%- if _ta_post_resp is mapping and 'result' in _ta_post_resp and _ta_post_resp['result'] is mapping -%}
                {%- set d = _ta_post_resp['result']['content'] | default({}) -%}
                {%- if d is mapping -%}
                  {%- set obj = d.get('data', {}) -%}
                  {%- if obj is mapping -%}
                    {{ obj.get('attributes', {}) | combine({'id': obj.get('id', '')}) }}
                  {%- else -%}{{ {} }}{%- endif -%}
                {%- else -%}{{ {} }}{%- endif -%}
              {%- else -%}{{ {} }}{%- endif -%}
        - variables:
            final_response:
              status: '{{ _ta_post_resp["status"] | default("error") if _ta_post_resp is mapping else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: transaction_add
              result: '{{ _ta_result }}'
              resolution:
                source_account_id: '{{ _ta_src_id }}'
                dest_account_id: '{{ _ta_dst_id }}'
                category_id: '{{ _ta_cat_id }}'
                budget_id: '{{ _ta_bgt_id }}'
        - stop: return
          response_variable: final_response

    # ── case: transaction_update ─────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm == "run" and case_norm == "transaction_update" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ item_id_norm == "" }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  version: '{{ tool_version }}'
                  case: transaction_update
                  result: null
                  error: item_id is required for transaction_update
            - stop: return
              response_variable: final_response
        - variables:
            _tu_cat_id: none
            _tu_bgt_id: none
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ cat_norm != "" }}'
            sequence:
            - action: script.zen_root_firefly
              response_variable: _tu_cat_resp
              continue_on_error: true
              data:
                action_type: get
                endpoint: 'autocomplete/categories?query={{ cat_norm | urlencode }}&limit=20'
            - variables:
                _tu_cat_data: >-
                  {%- if _tu_cat_resp is mapping and 'result' in _tu_cat_resp and _tu_cat_resp['result'] is mapping -%}
                    {%- set c = _tu_cat_resp['result']['content'] | default([]) -%}
                    {{ c if c is sequence and c is not string and c is not mapping else [] }}
                  {%- else -%}{{ [] }}{%- endif -%}
            - variables:
                _tu_cat_id: >-
                  {%- set _ns = namespace(found=none) -%}
                  {%- for a in _tu_cat_data -%}
                    {%- if (a.get('name', '') | lower) == (cat_norm | lower) -%}{%- set _ns.found = a.get('id') | string -%}{%- endif -%}
                  {%- endfor -%}
                  {{ _ns.found }}
        - variables:
            _tu_payload: >-
              {%- set txn = {} -%}
              {%- if description is defined and description | default('') | trim != '' -%}{%- set txn = txn | combine({'description': description | trim}) -%}{%- endif -%}
              {%- if amount is defined and amount | default(0) | float(0) > 0 -%}{%- set txn = txn | combine({'amount': amount | float(0) | string}) -%}{%- endif -%}
              {%- if date is defined and date | default('') | trim != '' -%}{%- set txn = txn | combine({'date': date | trim}) -%}{%- endif -%}
              {%- if _tu_cat_id is not none -%}{%- set txn = txn | combine({'category_id': _tu_cat_id | string}) -%}{%- endif -%}
              {%- set tag_list = (tags | trim).split(',') | map('trim') | select | list if (tags is defined and tags | default('') | trim != '') else [] -%}
              {%- if label_norm != '' -%}{%- set tag_list = tag_list + ['label:' ~ label_norm] -%}{%- endif -%}
              {%- if tag_list | length > 0 -%}{%- set txn = txn | combine({'tags': tag_list}) -%}{%- endif -%}
              {{ {'transactions': [txn]} | tojson }}
        - action: script.zen_root_firefly
          response_variable: _tu_resp
          continue_on_error: true
          data:
            action_type: put
            endpoint: 'transactions/{{ item_id_norm }}'
            payload: '{{ _tu_payload }}'
        - variables:
            final_response:
              status: '{{ _tu_resp["status"] | default("error") if _tu_resp is mapping else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: transaction_update
              result:
                transaction_id: '{{ item_id_norm }}'
                updated: '{{ _tu_resp["status"] | default("error") == "success" if _tu_resp is mapping else false }}'
        - stop: return
          response_variable: final_response

    # ── case: transfer ───────────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm == "run" and case_norm == "transfer" }}'
        sequence:
        - variables:
            _tr_src_id: none
            _tr_dst_id: none
        - choose:
