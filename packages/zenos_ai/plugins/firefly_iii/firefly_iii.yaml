                  result: null
                  error: statement_balance is required for reconcile_prepare
            - stop: return
              response_variable: final_response
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _rp_id is none and item_norm != "" }}'
            sequence:
            - action: script.zen_sutra_firefly
              response_variable: _rp_ac_resp
              continue_on_error: true
