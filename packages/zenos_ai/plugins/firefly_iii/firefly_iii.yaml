                _rp_id: >-
                  {%- set c = (_rp_ac_resp['result']['content'] | default([])) if (_rp_ac_resp is mapping and 'result' in _rp_ac_resp and _rp_ac_resp['result'] is mapping) else [] -%}
                  {%- set c = c if c is sequence and c is not string and c is not mapping else [] -%}
                  {%- set _ns = namespace(found=none) -%}
                  {%- for a in c -%}{%- if (a.get('name','') | lower) == (item_norm | lower) -%}{%- set _ns.found = a.get('id') | string -%}{%- endif -%}{%- endfor -%}
                  {{ _ns.found }}
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _rp_id is none }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  version: '{{ tool_version }}'
                  case: reconcile_prepare
                  result: null
                  error: 'No account found matching "{{ item_norm }}".'
            - stop: return
              response_variable: final_response
        - action: script.zen_sutra_firefly
          response_variable: _rp_acct_resp
          continue_on_error: true
          data:
            action_type: get
            endpoint: 'accounts/{{ _rp_id }}'
        - action: script.zen_sutra_firefly
          response_variable: _rp_txn_resp
          continue_on_error: true
          data:
            action_type: get
            endpoint: 'accounts/{{ _rp_id }}/transactions?start={{ start_norm }}&end={{ end_norm }}'
            perPage: 100
        - variables:
            _rp_acct: >-
              {%- if _rp_acct_resp is mapping and 'result' in _rp_acct_resp and _rp_acct_resp['result'] is mapping -%}
                {%- set d = _rp_acct_resp['result']['content'] | default({}) -%}
                {%- if d is mapping -%}
                  {%- set obj = d.get('data', {}) -%}
                  {{ obj.get('attributes', {}) | combine({'id': obj.get('id', _rp_id)}) if obj is mapping else {} }}
                {%- else -%}{{ {} }}{%- endif -%}
              {%- else -%}{{ {} }}{%- endif -%}
            _rp_txns: >-
              {%- set raw = (_rp_txn_resp['result']['content'] | default({})) if (_rp_txn_resp is mapping and 'result' in _rp_txn_resp and _rp_txn_resp['result'] is mapping) else {} -%}
              {%- set d = raw.get('data', []) if raw is mapping else [] -%}
              {%- set _ns = namespace(out=[]) -%}
              {%- for obj in d -%}
                {%- set attrs = obj.get('attributes', {}) -%}
                {%- set txns = attrs.get('transactions', []) -%}
                {%- set first = txns[0] if txns | length > 0 else {} -%}
                {%- set _ns.out = _ns.out + [{'id': obj.get('id', ''), 'date': first.get('date', ''), 'description': first.get('description', ''), 'amount': first.get('amount', '0'), 'type': first.get('type', ''), 'source': first.get('source_name', ''), 'destination': first.get('destination_name', ''), 'reconciled': first.get('reconciled', false)}] -%}
              {%- endfor -%}
              {{ _ns.out }}
        - variables:
            _rp_period_net: >-
              {%- set _ns = namespace(total=0.0) -%}
              {%- for t in _rp_txns -%}
                {%- set amt = t.get('amount', '0') | float(0) -%}
                {%- set typ = t.get('type', '') -%}
                {%- if typ == 'deposit' -%}{%- set _ns.total = _ns.total + amt -%}
                {%- elif typ == 'withdrawal' -%}{%- set _ns.total = _ns.total - amt -%}
                {%- endif -%}
              {%- endfor -%}
              {{ _ns.total | round(2) }}
            _rp_stmt_float: '{{ _rp_stmt_bal | float(0) | round(2) }}'
        - variables:
            final_response:
              status: '{{ _rp_txn_resp["status"] | default("error") if _rp_txn_resp is mapping else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: reconcile_prepare
              result:
                account: '{{ _rp_acct.get("name", "") if _rp_acct is mapping else "" }}'
                account_id: '{{ _rp_id }}'
                date_range:
                  start: '{{ start_norm }}'
                  end: '{{ end_norm }}'
                firefly_period_net: '{{ _rp_period_net }}'
                statement_balance: '{{ _rp_stmt_float }}'
                discrepancy: '{{ (_rp_stmt_float - _rp_period_net) | round(2) }}'
                transaction_count: '{{ _rp_txns | length }}'
                transactions: '{{ _rp_txns }}'
                unreconciled: '{{ _rp_txns | selectattr("reconciled", "equalto", false) | list }}'
                unreconciled_count: '{{ _rp_txns | selectattr("reconciled", "equalto", false) | list | length }}'
                instructions: Pass this result to the AI for matching against your bank statement rows. Use transaction_update to mark reconciled.
        - stop: return
          response_variable: final_response

