                  {%- set obj = d.get('data', {}) -%}
                  {{ obj.get('attributes', {}) | combine({'id': obj.get('id', _rp_id)}) if obj is mapping else {} }}
                {%- else -%}{{ {} }}{%- endif -%}
              {%- else -%}{{ {} }}{%- endif -%}
            _rp_txns: >-
              {%- set raw = (_rp_txn_resp['result']['content'] | default({})) if (_rp_txn_resp is mapping and 'result' in _rp_txn_resp and _rp_txn_resp['result'] is mapping) else {} -%}
              {%- set d = raw.get('data', []) if raw is mapping else [] -%}
              {%- set _ns = namespace(out=[]) -%}
              {%- for obj in d -%}
                {%- set attrs = obj.get('attributes', {}) -%}
                {%- set txns = attrs.get('transactions', []) -%}
                {%- set first = txns[0] if txns | length > 0 else {} -%}
                {%- set _ns.out = _ns.out + [{'id': obj.get('id', ''), 'date': first.get('date', ''), 'description': first.get('description', ''), 'amount': first.get('amount', '0'), 'type': first.get('type', ''), 'source': first.get('source_name', ''), 'destination': first.get('destination_name', ''), 'reconciled': first.get('reconciled', false)}] -%}
              {%- endfor -%}
              {{ _ns.out }}
        - variables:
            _rp_period_net: >-
              {%- set _ns = namespace(total=0.0) -%}
              {%- for t in _rp_txns -%}
                {%- set amt = t.get('amount', '0') | float(0) -%}
                {%- set typ = t.get('type', '') -%}
                {%- if typ == 'deposit' -%}{%- set _ns.total = _ns.total + amt -%}
                {%- elif typ == 'withdrawal' -%}{%- set _ns.total = _ns.total - amt -%}
                {%- endif -%}
              {%- endfor -%}
              {{ _ns.total | round(2) }}
            _rp_stmt_float: '{{ _rp_stmt_bal | float(0) | round(2) }}'
        - variables:
            final_response:
              status: '{{ _rp_txn_resp["status"] | default("error") if _rp_txn_resp is mapping else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: reconcile_prepare
