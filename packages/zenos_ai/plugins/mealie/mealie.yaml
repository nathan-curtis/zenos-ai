          receipt_to_stock:
            description: >-
              One-call grocery receipt pipeline: reads a checked shopping list,
              bootstraps any missing Grocy FKs via sync_now, sums quantities per
              product, books everything in one bulk_stock_add, and (if
              paperless_doc_id given) links every booked product back to the
              receipt via bulk_product_ref_add. Ambiguous foods (multiple Grocy
              candidates) are never guessed — returned in still_ambiguous for a
              human pick. Zero-quantity 'to taste' items are excluded from
              booking, listed in skipped_zero_qty. Optional prices (JSON
              {grocy_product_id: price}) attaches a real per-item price to each
              booked stock entry — human-confirmed only, read directly off the
              real receipt, never auto-parsed from Paperless OCR (real receipt
              OCR needs human eyes, confirmed this session). Products not
              listed in prices book with no price, same as before this field
              existed. Response summary includes priced_count. Optional
              dry_run (default false) computes and returns the exact bom
              (bom_preview) that would be booked without calling
              bulk_stock_add, bulk_product_ref_add, or the sync_now FK-apply
              step — no writes of any kind occur. Built after a real incident
              where calling this on an already-processed shopping list
              re-booked everything — always dry_run first on any list whose
              checked state isn't freshly known.
            method: internal
            endpoint: internal
            writes:
              level: batch
            requires:
            - item or shopping_list_id
            optional:
            - paperless_doc_id
            - prices
            - dry_run
            example: "{'case':'receipt_to_stock','shopping_list_id':'a7ef9fa4-c9a6-4a51-9f6e-4164dab92741','dry_run':true}"
          recipe_fulfillment:
            description: >-
              Can I make this Mealie recipe right now, given current Grocy stock?
              Resolves recipe_id or recipe (name, via recipes_find), fetches the
              full recipe's ingredient list, and checks each Grocy-FK-linked
              ingredient's on-hand amount via a per-product stock_check_item
              call. For ingredients with a stated unit, first attempts a real
              conversion (same engine as recipe_consume: an exact Grocy-unit-id
              match, or a real product-specific entry in Grocy's own
              quantity_unit_conversions table) before falling back to
              check_manually — only ingredients with genuinely no resolvable
              unit path land there now, not every stated-unit ingredient
              unconditionally like before. Returns fulfilled / insufficient /
              unresolvable (no food or FK) / check_manually (no real conversion
              path found) buckets plus can_make. No conversion math of our own —
              only Grocy's existing table, exactly as configured, never guessed.
              Adds 1-2 more API calls per stated-unit ingredient (product
              details + conversions list) versus a bare-count ingredient — a
              real latency cost, stated plainly. Distinct from Grocy's own
              recipe_check_fulfillment, which only works on Grocy's disconnected
              recipe objects, never Mealie recipes.
            method: internal
            endpoint: internal
            writes:
              level: none
            requires:
            - recipe_id or recipe
            example: "{'case':'recipe_fulfillment','recipe':'Spaghetti Carbonara'}"
          recipes_parse_ingredients:
            description: "Fix freetext-only ingredients on a scraped recipe (e.g. from recipes_create_from_url) so recipe_fulfillment can actually check stock against them. Resolves recipe_id or recipe (name, via recipes_find), fetches the full recipe, and for every recipeIngredient[] entry that has no linked food object, sends its note/display text to Mealie's real POST /api/parser/ingredients (parser: nlp/brute/openai, default nlp). Each parsed food name string is then resolved to a real Mealie Food — exact-name match via foods search, or created if none exists (never guesses on an ambiguous/partial match) — and the recipe is PUT back with structured quantity/unit/food on those ingredients. Already-structured ingredients are left untouched in place."
            method: internal
            endpoint: internal
            writes:
              level: single
            requires:
            - recipe_id or recipe
            optional:
            - parser
            example: "{'case':'recipes_parse_ingredients','recipe':'Spaghetti Carbonara'}"
          stock_expiry_suggestions:
            description: >-
              Cross-references Grocy's near-expiry stock (overdue/due_soon/expiring,
              via zen_dojotools_inventory stock_list_volatile, or stock_area_volatile
              when area is given) against every Mealie recipe's recipeIngredient[]
              grocy_product_id FK (same extraction idiom as recipe_fulfillment) to
              surface, per near-expiry product, which recipes could use it up before
              it goes bad. matching_recipes is always a list — empty (not omitted)
              when nothing matches. Also flags clearing_candidate: true for overdue
              items purchased 90+ days ago (via stock_entries_for_item) — a heuristic
              for stale/orphaned Grocy bookkeeping (e.g. stock never marked consumed)
              rather than genuinely aging food, with a coaching hint pointing at
              stock_consume/stock_inventory_adjust (never auto-executed). Timeline is
              priority-sorted, not a flat date sort: due_soon/expiring first (soonest
              first), then recently-overdue non-clearing items, then clearing
              candidates (most-stale-by-purchase-date first), then unparseable dates
              last. Performance limitation stated plainly: building the reverse
              product->recipe index pages through recipes_list and calls recipes_get
              once per recipe (O(recipe count)), plus one stock_entries_for_item call
              per near-expiry product — slow on large recipe/stock libraries.
              Read-only, no writes.
            method: internal
            endpoint: internal
            writes:
              level: none
            requires: []
            optional:
            - area
            example: "{'case':'stock_expiry_suggestions'}"
          recipe_consume:
            description: >-
              Depletes Grocy stock for a cooked Mealie recipe in one call — the
              consuming counterpart to recipe_fulfillment's checking. Resolves
              recipe_id or recipe (name, exact match only, same resolution as
              recipe_fulfillment), extracts recipeIngredient[].food.extras.grocy_product_id
              (same idiom used throughout this file), and for each FK-linked
              ingredient resolves a safe consume amount using real Grocy data —
              never guessed. Consumes directly when the ingredient has no stated
              unit (a bare count) or its unit resolves to the exact same Grocy unit
              id as the product's own stock unit; converts via a real
              product-specific entry in Grocy's own quantity_unit_conversions table
              when one exists; otherwise does NOT consume and lists the ingredient
              in needs_manual_check with the recipe's stated quantity/unit next to
              the real current on-hand amount, so nothing is ever silently
              mis-consumed. No unit-conversion math of our own — only Grocy's own
              conversion table, exactly as configured. Also stamps the recipe's
              lastMade (via the safe recipes_update merge) unless it was already
              set within the last hour. Returns consumed / needs_manual_check /
              unresolvable (no FK) / failed (Grocy rejected the consume — e.g. not
              enough on hand — with its real error message) / last_made_updated.
            method: internal
            endpoint: internal
            writes:
              level: batch
            requires:
            - recipe_id or recipe
            example: "{'case':'recipe_consume','recipe':'Easy Mongolian Beef'}"
          mealplan_suggest:
            description: >-
              Suggestion-only meal-plan assist — never schedules anything itself.
              Combines three already-shipped features: finds this week's genuinely
              empty breakfast/lunch/dinner slots (via mealplan_week), collects
              candidate recipes tied to near-expiry stock (via
              stock_expiry_suggestions' matching_recipes), and verifies each
              candidate is actually makeable right now (via recipe_fulfillment,
              can_make only, capped at 3 candidates). Each suggestion states its
              reason: "uses expiring stock: <products>". To actually schedule
              one, call mealplan_add_recipe yourself with the chosen recipe_id —
              scheduling is a household decision (who's home, what they're in the
              mood for), not something this case does automatically. Does NOT
              pad with random suggestions when expiry-linked candidates fall
              short of empty_slots — live testing showed the combined cost
              (stock_expiry_suggestions + recipe_fulfillment checks + random
              fan-out) exceeded a single call's practical timeout; instead
              returns random_padding_available: true/false so the caller can run
              its own recipes_random + recipe_fulfillment follow-up loop if
              wanted. Performance limitation stated plainly: stock_expiry_suggestions
              is already O(recipe count) on its own, plus up to 3
              recipe_fulfillment calls (each itself O(ingredients)) — the most
              API-heavy case in this file even after cutting the random-padding
              tail from v1. Optional area — when given, checks
              zen_dojotools_room_manager mode=room_occupant_prefs, which checks
              a guest stay (Twenty CRM) first and falls back to that room's
              static household occupant assignment (profile_editor) — so
              either a guest or a family member's allergens get flagged
              identically. If guestPrefs.allergens is non-empty, each
              suggestion gains allergen_flags (matched via a small synonym
              taxonomy — e.g. "dairy" also catches milk/cream/butter/cheese —
              word-boundary-safe against that recipe's ingredient names, not a
              bare substring, so "egg" no longer false-positives on
              "eggplant". Ingredient names are the same ones
              recipe_fulfillment already extracts, no extra API calls). This is a heuristic, not a
              certified allergen check — a flag is a prompt for human judgment,
              never used to silently drop a suggestion, and an empty
              allergen_flags list is not a safety guarantee. active_stay in the
              response (with a source: guest_stay/household_member field) is
              none when area is omitted or nobody's currently relevant there.
            method: internal
            endpoint: internal
            writes:
              level: none
            requires: []
            example: "{'case':'mealplan_suggest','area':'guest_room'}"
          recipes_scale:
            description: >-
              Recipe serving-size scaling. Confirmed via research: Mealie has no
              server-side scaling API (no scale query param, no dedicated
              endpoint) — this case does the same proportional math Mealie's own
              UI does client-side: scale_factor = target_servings (quantity
              field) / recipe's current recipeServings (or recipeYieldQuantity
              if servings is unset). Returns every ingredient's
              original_quantity and scaled_quantity, unit unchanged. Preview
              only by default (writes.level: none) — set apply_scale=true to
              persist the scaled quantities and new recipeServings back to the
              recipe via the same safe GET-merge-PUT recipes_update already
              uses elsewhere in this file. (Field is apply_scale, not apply —
              apply collides with a Jinja extension name in this environment,
              confirmed live via a real TypeError.) Nutrition values are
              explicitly NOT scaled — stated plainly in nutrition_note,
              matching a real upstream Mealie limitation (nutrition doesn't
              auto-scale in Mealie's own UI either when servings change), not a
              gap unique to this tool.
            method: internal
            endpoint: internal
            writes:
              level: none
            requires:
            - recipe_id or recipe
            - quantity (target_servings)
            optional:
            - apply_scale
            example: "{'case':'recipes_scale','recipe':'Easy Mongolian Beef','quantity':6}"
          cookbook_fulfillment:
            description: >-
              What can I actually cook from this cookbook right now? Resolves
              item_id or cookbook (name, exact match via cookbooks_list, refuses
              to guess on ambiguity), reads the cookbook's real queryFilterString
              (via cookbooks_get), uses it as recipes_list's queryFilter to get
              the cookbook's actual recipes, then runs recipe_fulfillment on
              each (capped at 2 — reduced live after a real timeout at cap 5;
              recipe_fulfillment got heavier in the Sprint 5 unit-conversion
              update, adding a stock_get_product_details + unit_conversions_list
              call per stated-unit ingredient, so even a handful of fan-out
              calls can exceed a single tool call's timeout). Returns
              makeable/not_makeable lists plus recipe_count (real total) vs
              checked_count (post-cap).
            method: internal
            endpoint: internal
            writes:
              level: none
            requires:
            - item_id or cookbook
            example: "{'case':'cookbook_fulfillment','cookbook':'Alton Brown'}"
          recipe_plan:
            description: >-
              Checks recipe_fulfillment; if not fully makeable, auto-adds
              whatever Mealie's own shopping_list_generate_from_recipe
              determines is missing to a shopping list — one call instead of
              two, closing the "missing ingredient to actionable list" gap.
              Requires shopping_list_id or shopping_list, same as
              shopping_list_generate_from_recipe itself — no default list is
              ever invented; if can_make is false and neither is given, returns
              shopping_action: skipped_no_list with a clear message rather than
              guessing or silently doing nothing. shopping_action is one of
              not_needed (already can_make) / added / skipped_no_list / failed.
            method: internal
            endpoint: internal
            writes:
              level: bulk
            requires:
            - recipe_id or recipe
            optional:
            - shopping_list_id or shopping_list (required only if not can_make)
            example: "{'case':'recipe_plan','recipe':'Easy Mongolian Beef','shopping_list':'Groceries'}"
          recipe_cost:
            description: >-
              What does this recipe actually cost to make? Self-calls
              recipe_fulfillment and reuses its already-conversion-resolved
              quantities (converted_required when a real Grocy unit conversion
              applied, bare quantity for unit-less ingredients) rather than
              recomputing unit conversion. For each fulfilled/insufficient
              ingredient, takes the first positive price found in
              stock_entries_for_item (the same aggregation the existing COGS
              system already trusts) and multiplies by the resolved quantity.
              Ingredients with no positive price anywhere in their stock
              history, or in check_manually/unresolvable, are excluded from
              total_cost — total_cost is stated plainly as a lower bound
              whenever unresolved_count > 0, never presented as complete when
              it isn't. Grocy-only, no Firefly/COGS transaction lookup (too
              heavy for per-recipe — that's a real, deliberately deferred
              future extension for period-level cooking-spend, not this).
            method: internal
            endpoint: internal
            writes:
              level: none
            requires:
            - recipe_id or recipe
            example: "{'case':'recipe_cost','recipe':'Easy Mongolian Beef'}"
          kitchen_brief:
            description: >-
              Exec-chef weekly report — the period-level cooking-spend
              extension recipe_cost's own docs flagged as deferred. Reads the
              current week's mealplan_week, sums recipe_cost for every planned
              meal (each occurrence counted, not deduped by recipe — cooking
              something twice costs twice), and compares that total against
              the household's total Groceries category spend for the same
              week (zen_dojotools_finance category_spend). food_cost_percentage
              is an approximation, not a certified figure — grocery spend
              includes non-recipe items from the same shopping trips.
              overall_status is red/yellow/green against rough foodservice
              targets (>=40% red, >=30% yellow, else green); gm_summary is one
              deterministic sentence, not LLM-generated.
            method: internal
            endpoint: internal
            writes:
              level: none
            needs: []
            example: "{'case':'kitchen_brief'}"
          waste_log:
            description: >-
              Log a discarded/spoiled item. Books it in Grocy via stock_consume
              with spoiled=true — Grocy's own native waste flag, visible in
              Grocy's own stock reports and queryable later via waste_summary.
              Nothing is written anywhere else (no cabinet drawer, no custom
              ledger — cabinet space is finite). waste_reason/recipe_id are
              echoed back in the response for your own context but are not
              persisted anywhere, since Grocy's stock_log has no field for
              either. Requires item or grocy_product_id; quantity defaults to 1.
            method: internal
            endpoint: internal
            writes:
              level: single
            requires:
            - item or grocy_product_id
            example: "{'case':'waste_log','item':'leftover rice','quantity':2,'waste_reason':'plate_waste'}"
          waste_summary:
            description: >-
              Rollup read directly from Grocy's own stock_log (spoiled=true
              bookings) — total waste events and top wasted products by
              quantity, optionally scoped to a start_date/end_date window
              (defaults to all-time through today). Grouped by
              grocy_product_id (Grocy's stock_log has no product name field).
              Quantity-based only; no cost estimate yet. No reason/recipe
              breakdown — nothing beyond Grocy's own stock_log is persisted.
            method: internal
            endpoint: internal
            writes:
              level: none
            needs: []
            example: "{'case':'waste_summary','start_date':'2026-07-20','end_date':'2026-07-26'}"
          event_menu_create:
            description: >-
              Thin orchestration wrapper for planning an event/occasion menu —
              scales each dish to a target guest count via recipes_scale (self-call,
              per dish) and flags allergen hits against the same room_occupant_prefs
              lookup mealplan_suggest uses (guest stay first, household occupant
              assignment fallback). payload is a comma-separated list of recipe
              names or recipe_ids; quantity is the target servings per dish; area
              is optional (enables allergen checking). apply_scale (default false)
              passes through to recipes_scale per dish — false previews only, true
              persists.
            method: internal
            endpoint: internal
            writes:
              level: bulk
            requires:
            - payload (comma-separated recipe names/ids)
            - quantity (target servings per dish)
            example: "{'case':'event_menu_create','payload':'Easy Mongolian Beef, Potato Leek Soup','quantity':12,'area':'dining_room'}"
          prep_schedule_set:
            description: >-
              Set a prep lead-time on an existing meal plan entry. Writes a
              parseable [PREP:N] tag (N = lead_time_minutes) into the entry's
              own free-text field via mealplan_update_recipe — Mealie's own
              mealplan API, no new storage. Any other existing text on that
              entry is preserved after the tag. Get item_id from
              mealplan_week/mealplan_today's entry lists.
            method: internal
            endpoint: internal
            writes:
              level: single
            requires:
            - item_id (mealplan entry id)
            - lead_time_minutes
            example: "{'case':'prep_schedule_set','item_id':'42','lead_time_minutes':120,'text':'Marinate the pork overnight'}"
          prep_brief:
            description: >-
              Prep-timing view for a day's meal plan (default today). Reads
              each entry's free-text [PREP:N] tag (set via prep_schedule_set),
              computes a start-by clock time against a default serving time
              per entry_type — breakfast/dinner derive live from the
              household's own scheduler_anchors (morning start / evening
              start +1h), lunch/snack from two standalone input_datetime
              helpers (zen_lunch_time/zen_snack_time, falling back to
              12:00/15:00 until set); no per-entry override yet — and sorts
              earliest-start first.
              Entries with no [PREP:N] tag are listed separately as unscheduled.
            method: internal
            endpoint: internal
            writes:
              level: none
            needs: []
            example: "{'case':'prep_brief','date':'2026-07-26'}"
          leftovers_to_stock:
            description: >-
              Closes the "I made X, have some left" gap — books
              a cooked dish's leftover quantity into Grocy as real stock in one
              call, instead of manually creating a Grocy product. Resolves or
              creates a "<Recipe Name> (leftovers)" product via
              zen_dojotools_inventory stock_buy_product (idempotent — repeat
              bookings of the same dish add to the same product, don't
              duplicate it). Leftover amount is either quantity (an absolute
              number of servings) or fraction_remaining (e.g. 0.5 for "half
              left", multiplied against the recipe's recipeServings) — give
              one, not both. best_before_date is computed from
              shelf_life_days (default 4 — a starting-point default for
              cooked leftovers, not a food-safety certification, adjust per
              dish). location defaults to Refrigerator. Booked stock is
              plain, undifferentiated "stock" (not tagged spoiled) — this is
              the inverse of waste_log, not the same booking.
            method: internal
            endpoint: internal
            writes:
              level: single
            requires:
            - recipe_id or recipe
            - quantity or fraction_remaining
            example: "{'case':'leftovers_to_stock','recipe':'Potato Leek Soup','fraction_remaining':0.5}"
          notes_resolve:
            description: Resolve note-only items from shopping_list_sync. Single-item mode requires item + grocy_product_id. Bulk mode — pass payload as JSON list of {name, grocy_product_id} objects to resolve many in one call.
            method: internal
            endpoint: internal
            writes:
              level: single
            requires:
            - item
            - grocy_product_id
            example: "{'case':'notes_resolve','item':'Shampoo','grocy_product_id':'590'}"
          notes_promote:
            description: "Promote note-only shopping list items to food-linked items after notes_resolve. For each note-only row, finds the matching Mealie food (must have grocy_product_id) and writes foodId back to the list item, making it ready for shopping_list_sync. Workflow: notes_resolve → notes_promote → shopping_list_sync."
            method: internal
            endpoint: internal
            writes:
              level: batch
            requires:
            - item or shopping_list_id
            example: "{'case':'notes_promote','item':'Groceries'}"
    - variables:
        safe_item: '{{ item | default('''') }}'
        safe_quantity: '{{ quantity | default(1) }}'
        safe_unit: '{{ unit | default('''') }}'
        safe_waste_reason: '{{ waste_reason | default(''other'') | string | trim | lower }}'
        safe_lead_time_minutes: '{{ lead_time_minutes | default(0) | int(0) }}'
        safe_fraction_remaining: '{{ fraction_remaining | default(0) | float(0) }}'
        safe_location: '{{ location | default(''Refrigerator'') | string | trim }}'
        safe_shelf_life_days: '{{ shelf_life_days | default(4) | int(4) }}'
        safe_search: '{{ search | default('''') }}'
        safe_recipe_id: '{{ recipe_id | default('''') }}'
        safe_recipe: '{{ recipe | default('''') | string | trim }}'
        safe_cookbook: '{{ cookbook | default('''') | string | trim }}'
        safe_area: '{{ area | default('''') | string | trim }}'
        safe_prices: >-
          {{ prices if prices is mapping
             else (prices | from_json if prices is string and prices | trim not in ['', 'none', 'null'] else {}) }}
        safe_dry_run: '{{ dry_run | default(false) | bool }}'
        safe_url: '{{ url | default('''') | string | trim }}'
        safe_include_tags: '{{ include_tags | default(false) | bool }}'
        safe_title: '{{ title | default('''') }}'
        safe_text: '{{ text | default('''') }}'
        safe_item_id: '{{ item_id | default('''') }}'
        safe_date: '{{ date | default('''') }}'
        safe_entry_type: '{{ entry_type | default(''dinner'') }}'
        safe_payload: '{{ payload | default('''') }}'
        safe_unit_plural: '{{ unit_plural | default('''') }}'
        safe_unit_description: '{{ unit_description | default('''') }}'
        safe_shopping_list: '{{ shopping_list | default('''') }}'
        safe_shopping_list_id: '{{ shopping_list_id | default('''') }}'
        safe_organizer_type: '{{ organizer_type | default('''') | string | trim }}'
        safe_slug: '{{ slug | default('''') | string | trim }}'
        safe_grocy_product_id: '{{ grocy_product_id | default('''') | string | trim }}'
        safe_grocy_list_id: '{{ grocy_list_id | default(none) | int(none) }}'
        safe_paperless_doc_id: '{{ paperless_doc_id | default(none) | int(none) }}'
        safe_checked: '{{ checked | default(true) | bool }}'
        safe_auto_parse: '{{ auto_parse | default(true) | bool }}'
        safe_apply: '{{ apply_scale | default(false) | bool }}'
        safe_target_servings: '{{ quantity | default(0) | float(0) }}'
        safe_sync_mode: '{{ sync_mode | default(''preview'') }}'
        safe_sync_direction: '{{ sync_direction | default(''mealie_to_grocy'') }}'
        safe_sync_limit: '{{ sync_limit | default(10) | int }}'
        safe_sync_confirmation: '{{ sync_confirmation | default(false) }}'
        safe_sync_default_location: '{{ sync_default_location | default(''Pantry'') }}'
        safe_sync_default_unit: '{{ sync_default_unit | default(''each'') }}'
        safe_sync: '{{ sync | default(true) }}'
        safe_include_notes: '{{ include_notes | default(false) }}'
        safe_parser: '{{ parser | default(''nlp'') | string | trim | lower }}'
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ mode == ''help'' }}'
        sequence:
        - variables:
            help_response:
              status: info
              tool: Zen DojoTools Kitchen
              version: '{{ tool_version |  default(None) }}'
              branch: '{{ tool_branch |  default('''') }}'
              notes: "This should be your FIRST choice for all Mealie operations. (Because
                it's THAT good!) \nThis helper translates explicit, safe intent only.
                Transport, retries, pagination strategy, permissions, observability,
                and batching are handled externally by Zen governance layers.    \n"
              philosophy:
              - Fail closed
              - Explicit intent only
              - Write-aware execution
              cases: "[ {% for name, meta in case_meta | dictsort %}\n  {\n    \"case\":
                \"{{ name }}\",\n    \"description\": {{\n      meta.description\n      |
                default(meta.payload_schema.description if meta.payload_schema is defined
                else None)\n      | to_json\n    }},\n    \"supports_search\": \"{{
                meta.supports_search | default(false) | tojson }}\",\n    \"writes\":
                \"{{ meta.writes.level }}\",\n    \"requires\": {{ meta.requires | default([])
                | to_json }},\n    \"payload_schema\": {{ meta.payload_schema | default(None)
                | to_json }}\n  }{% if not loop.last %},{% endif %}\n{% endfor %} ]"
        - stop: return
          response_variable: help_response
        alias: HELP
    - alias: Preflight Case validation
      choose:
      - conditions:
        - condition: template
          value_template: '{{ case not in case_meta }}'
          alias: 'Error: Unknown case.'
        sequence:
        - variables:
            error_response:
              status: error
              message: Unknown case.
        - stop: return
          response_variable: error_response
    - alias: Early exit — mealplan_today
      choose:
      - conditions:
        - condition: template
          value_template: '{{ case == "mealplan_today" }}'
        sequence:
        - variables:
            # Previously always used today's date, silently ignoring any
            # caller-supplied date= (found live —
            # date=2026-07-30 returned 2026-07-29's plan instead).
            mp_today: '{{ (date | default("", true) | string | trim) if (date | default("", true) | string | trim) != "" else now().strftime(''%Y-%m-%d'') }}'
        - action: script.zen_sutra_mealie
          response_variable: mp_resp
          data:
            mode: run
            method: GET
            endpoint: households/mealplans
            payload: '{{ none }}'
            pageNumber: 1
            perPage: 100
            additional_params: '{{ {"start_date": mp_today, "end_date": mp_today, "perPage": "100"} }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ mp_resp.result.status | default(200) >= 400 }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: mealplan_today
                  message: 'Meal plan fetch failed.'
            - stop: return
              response_variable: error_response
        - variables:
            mp_items: >-
              {{
                mp_resp.result.content.get('items', [])
                if mp_resp.result.content is mapping else []
              }}
        - variables:
            mp_meals: >-
              {%- set ns = namespace(meals={}) -%}
              {%- for item in mp_items -%}
                {%- set etype = item.get('entryType', 'unknown') -%}
                {%- set rname = item.get('recipe', {}).get('name', '') if item.get('recipe') is mapping else item.get('title', '') -%}
                {%- set entry = {'id': item.get('id', ''), 'recipe_id': item.get('recipeId', ''), 'name': rname} -%}
                {%- if etype in ns.meals -%}
                  {%- set ns.meals = ns.meals | combine({etype: ns.meals[etype] + [entry]}) -%}
                {%- else -%}
                  {%- set ns.meals = ns.meals | combine({etype: [entry]}) -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.meals }}
        - variables:
            final_response:
              status: success
              case: mealplan_today
              date: '{{ mp_today }}'
              meals: '{{ mp_meals }}'
              count: '{{ mp_items | length }}'
              writes:
                level: none
        - stop: return
          response_variable: final_response
    - alias: Early exit — mealplan_week
      choose:
      - conditions:
        - condition: template
          value_template: '{{ case == "mealplan_week" }}'
        sequence:
        - variables:
            mp_week_start: '{{ (now().date() - timedelta(days=now().weekday())).strftime(''%Y-%m-%d'') }}'
            mp_week_end: '{{ (now().date() + timedelta(days=6 - now().weekday())).strftime(''%Y-%m-%d'') }}'
        - action: script.zen_sutra_mealie
          response_variable: mp_resp
          data:
            mode: run
            method: GET
            endpoint: households/mealplans
            payload: '{{ none }}'
            pageNumber: 1
            perPage: 100
            additional_params: '{{ {"start_date": mp_week_start, "end_date": mp_week_end, "perPage": "100"} }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ mp_resp.result.status | default(200) >= 400 }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: mealplan_week
                  message: 'Meal plan fetch failed.'
            - stop: return
              response_variable: error_response
        - variables:
            mp_items: >-
              {{
                mp_resp.result.content.get('items', [])
                if mp_resp.result.content is mapping else []
              }}
        - variables:
            mp_days: >-
              {%- set ns = namespace(days={}) -%}
              {%- for item in mp_items -%}
                {%- set day = item.get('date', '') -%}
                {%- set etype = item.get('entryType', 'unknown') -%}
                {%- set rname = item.get('recipe', {}).get('name', '') if item.get('recipe') is mapping else item.get('title', '') -%}
                {%- set entry = {'id': item.get('id', ''), 'recipe_id': item.get('recipeId', ''), 'name': rname} -%}
                {%- set day_dict = ns.days.get(day, {}) -%}
                {%- if etype in day_dict -%}
                  {%- set day_dict = day_dict | combine({etype: day_dict[etype] + [entry]}) -%}
                {%- else -%}
                  {%- set day_dict = day_dict | combine({etype: [entry]}) -%}
                {%- endif -%}
                {%- set ns.days = ns.days | combine({day: day_dict}) -%}
              {%- endfor -%}
              {{ ns.days }}
        - variables:
            final_response:
              status: success
              case: mealplan_week
              week_start: '{{ mp_week_start }}'
              week_end: '{{ mp_week_end }}'
              days: '{{ mp_days }}'
              total_meals: '{{ mp_items | length }}'
              writes:
                level: none
        - stop: return
          response_variable: final_response
    - alias: Early exit — recipes_random
      choose:
      - conditions:
        - condition: template
          value_template: '{{ case == "recipes_random" }}'
        sequence:
        - action: script.zen_sutra_mealie
          response_variable: rr_resp
          data:
            mode: run
            method: GET
            endpoint: recipes
            payload: '{{ none }}'
            pageNumber: 1
            perPage: 1
            additional_params: '{{ {"random": "true", "perPage": "1"} }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ rr_resp.result.status | default(200) >= 400 }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: recipes_random
                  message: 'Failed to fetch random recipe.'
            - stop: return
              response_variable: error_response
        - variables:
            rr_items: >-
              {{
                rr_resp.result.content.get('items', [])
                if rr_resp.result.content is mapping else []
              }}
            rr_recipe: '{{ rr_items | first | default({}) }}'
        - variables:
            final_response:
              status: success
              case: recipes_random
              recipe:
                id: '{{ rr_recipe.get(''id'', '''') }}'
                slug: '{{ rr_recipe.get(''slug'', '''') }}'
                name: '{{ rr_recipe.get(''name'', '''') }}'
                description: '{{ rr_recipe.get(''description'', '''') }}'
                total_time: '{{ rr_recipe.get(''totalTime'', '''') }}'
                tags: '{{ rr_recipe.get(''tags'', []) }}'
              writes:
                level: none
        - stop: return
          response_variable: final_response
    - alias: Early exit — foods_tag
      choose:
      - conditions:
        - condition: template
          value_template: '{{ case == "foods_tag" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ safe_item_id == "" and safe_item == "" }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: foods_tag
                  message: 'foods_tag requires item_id (explicit food ID) or item (food name for lookup).'
            - stop: return
              response_variable: error_response
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ safe_item_id == "" and safe_item != "" }}'
            sequence:
            - action: script.zen_sutra_mealie
              response_variable: ft_find_resp
              data:
                mode: run
                method: GET
                endpoint: foods
                payload: '{{ none }}'
                pageNumber: 1
                perPage: 20
                additional_params: '{{ {"search": safe_item} }}'
            - variables:
                ft_items: >-
                  {{
                    ft_find_resp.result.content.get('items', [])
                    if ft_find_resp.result.content is mapping else []
                  }}
                ft_exact: >-
                  {{
                    ft_items
                    | selectattr('name', 'defined')
                    | selectattr('name', 'equalto', safe_item)
                    | list | first | default(none)
                  }}
            - choose:
              - conditions:
                - condition: template
                  value_template: '{{ ft_exact is none }}'
                sequence:
                - variables:
                    error_response:
                      status: error
                      case: foods_tag
                      message: 'Food not found by name: "{{ safe_item }}"'
                - stop: return
                  response_variable: error_response
            - variables:
                safe_item_id: '{{ (ft_exact.get(''id'', '''') | string) }}'
        - action: script.zen_sutra_mealie
          response_variable: ft_get_resp
          data:
            mode: run
            method: GET
            endpoint: 'foods/{{ safe_item_id }}'
            payload: '{{ none }}'
            pageNumber: 1
            perPage: 1
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ ft_get_resp.result.status | default(200) >= 400 }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: foods_tag
                  message: 'Failed to fetch food {{ safe_item_id }}.'
            - stop: return
              response_variable: error_response
        - variables:
            ft_food: >-
              {{
                ft_get_resp.result.content
                if ft_get_resp.result.content is mapping else {}
              }}
            ft_extras: >-
              {{
                ft_food.get('extras', {})
                if ft_food is mapping else {}
              }}
        - variables:
            ft_new_extras: >-
              {{
                ft_extras | combine(
                  {'grocy_product_id': safe_grocy_product_id | int}
                  if safe_grocy_product_id | string | trim != '' else {}
                )
              }}
            ft_updated_food: '{{ ft_food | combine({''extras'': ft_new_extras}) }}'
        - action: script.zen_sutra_mealie
          response_variable: ft_put_resp
          data:
            mode: run
            method: PUT
            endpoint: 'foods/{{ safe_item_id }}'
            payload: '{{ ft_updated_food | tojson }}'
            pageNumber: 1
            perPage: 1
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ ft_put_resp.result.status | default(200) >= 400 }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: foods_tag
                  message: 'Failed to update food {{ safe_item_id }}.'
            - stop: return
              response_variable: error_response
        - variables:
            final_response:
              status: success
              case: foods_tag
              food_id: '{{ safe_item_id }}'
              food_name: '{{ ft_food.get(''name'', '''') }}'
              extras: '{{ ft_new_extras }}'
              writes:
                level: single
              summary: Food tagged with cross-system links.
        - stop: return
          response_variable: final_response
    - alias: Early exit — notes_resolve
      choose:
      - conditions:
        - condition: template
          value_template: '{{ case == "notes_resolve" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ safe_payload is string and (safe_payload | trim) != "" }}'
            sequence:
            - variables:
                _nrb_items: '{{ safe_payload | from_json | default([]) }}'
                _nrb_resolved: []
                _nrb_errors: []
            - repeat:
                for_each: '{{ _nrb_items }}'
                sequence:
                - variables:
                    _nrb_name: '{{ (repeat.item.get("name", "") ~ "") | trim }}'
                    _nrb_gpid: '{{ (repeat.item.get("grocy_product_id", "") ~ "") | string | trim }}'
                - action: script.zen_sutra_mealie
                  response_variable: _nrb_search_raw
                  continue_on_error: true
                  data:
                    mode: run
                    method: GET
                    endpoint: foods
                    payload: '{{ none }}'
                    pageNumber: 1
                    perPage: 50
                    additional_params: '{{ {"search": _nrb_name} }}'
                - variables:
                    _nrb_all: >-
                      {{ _nrb_search_raw.result.content.get('items', [])
                         if (_nrb_search_raw.result.content is mapping) else [] }}
                    _nrb_exact: >-
                      {{ _nrb_all | selectattr('name','equalto', _nrb_name) | list | first | default(none) }}
                - variables:
                    _nrb_food_id: '{{ _nrb_exact.id if _nrb_exact is not none else none }}'
                    _nrb_action: '{{ "tagged" if _nrb_exact is not none else "pending_create" }}'
                - choose:
                  - conditions:
                    - condition: template
                      value_template: '{{ _nrb_food_id is none and _nrb_name != "" }}'
                    sequence:
                    - action: script.zen_sutra_mealie
                      response_variable: _nrb_create_raw
                      continue_on_error: true
                      data:
                        mode: run
                        method: POST
                        endpoint: foods
                        payload: '{{ {"name": _nrb_name} | tojson }}'
                    - variables:
                        _nrb_food_id: >-
                          {{ _nrb_create_raw.result.content.id
                             if (_nrb_create_raw.result.content is mapping) else none }}
                        _nrb_action: created
                - choose:
                  - conditions:
                    - condition: template
                      value_template: '{{ _nrb_food_id is not none and _nrb_gpid != "" }}'
                    sequence:
                    - action: script.zen_sutra_mealie
                      response_variable: _nrb_food_raw
                      continue_on_error: true
                      data:
                        mode: run
                        method: GET
                        endpoint: 'foods/{{ _nrb_food_id }}'
                        payload: '{{ none }}'
                    - variables:
                        _nrb_food_obj: >-
                          {{ _nrb_food_raw.result.content
                             if (_nrb_food_raw.result.content is mapping) else {} }}
                    - action: script.zen_sutra_mealie
                      response_variable: _nrb_tag_raw
                      continue_on_error: true
                      data:
                        mode: run
                        method: PUT
                        endpoint: 'foods/{{ _nrb_food_id }}'
                        payload: >-
                          {{ _nrb_food_obj | combine({"extras":
                             (_nrb_food_obj.extras if _nrb_food_obj.extras is mapping else {})
                             | combine({"grocy_product_id": _nrb_gpid | string})
                          }) | tojson }}
                    - variables:
                        _nrb_resolved: >-
                          {{ _nrb_resolved + [{"name": _nrb_name, "action": _nrb_action, "food_id": _nrb_food_id, "grocy_product_id": _nrb_gpid}] }}
                  - conditions:
                    - condition: template
                      value_template: '{{ true }}'
                    sequence:
                    - variables:
                        _nrb_errors: >-
                          {{ _nrb_errors + [{"name": _nrb_name, "error": "no food resolved or no grocy_product_id"}] }}
            - variables:
                final_response:
                  status: success
                  case: notes_resolve
                  mode: bulk
                  resolved: '{{ _nrb_resolved | length }}'
                  errors: '{{ _nrb_errors | length }}'
                  resolved_items: '{{ _nrb_resolved }}'
                  error_items: '{{ _nrb_errors }}'
            - stop: return
              response_variable: final_response
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ safe_item == "" or safe_grocy_product_id == "" }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: notes_resolve
                  message: notes_resolve requires item (food name) and grocy_product_id.
            - stop: return
              response_variable: error_response
        - action: script.zen_sutra_mealie
          response_variable: _nr_search_raw
          data:
            mode: run
            method: GET
            endpoint: foods
            payload: '{{ none }}'
            pageNumber: 1
            perPage: 50
            additional_params: '{{ {"search": safe_item} }}'
        - variables:
            _nr_all: >-
              {{ _nr_search_raw.result.content.get('items', [])
                 if _nr_search_raw.result.content is mapping else [] }}
            _nr_exact: >-
              {{ _nr_all | selectattr('name','equalto', safe_item) | list | first | default(none) }}
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _nr_exact is not none }}'
            sequence:
            - variables:
                _nr_food_id: '{{ _nr_exact.id }}'
                _nr_action: tagged
          - conditions:
            - condition: template
              value_template: '{{ true }}'
            sequence:
            - action: script.zen_sutra_mealie
              response_variable: _nr_create_raw
              data:
                mode: run
                method: POST
                endpoint: foods
                payload: '{{ {"name": safe_item} | tojson }}'
            - variables:
                _nr_food_id: >-
                  {{ _nr_create_raw.result.content.id
                     if _nr_create_raw.result.content is mapping else none }}
                _nr_action: created
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _nr_food_id is none }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: notes_resolve
                  message: Could not find or create Mealie food.
            - stop: return
              response_variable: error_response
        - action: script.zen_sutra_mealie
          response_variable: _nr_food_raw
          data:
            mode: run
            method: GET
            endpoint: 'foods/{{ _nr_food_id }}'
            payload: '{{ none }}'
        - variables:
            _nr_food_obj: >-
              {{ _nr_food_raw.result.content
                 if _nr_food_raw.result.content is mapping else {} }}
        - action: script.zen_sutra_mealie
          response_variable: _nr_tag_raw
          continue_on_error: true
          data:
            mode: run
            method: PUT
            endpoint: 'foods/{{ _nr_food_id }}'
            payload: >-
              {{ _nr_food_obj | combine({"extras":
                 (_nr_food_obj.extras if _nr_food_obj.extras is mapping else {})
                 | combine({"grocy_product_id": safe_grocy_product_id | string})
              }) | tojson }}
        - variables:
            final_response:
              status: success
              case: notes_resolve
              food_id: '{{ _nr_food_id }}'
              food_name: '{{ safe_item }}'
              grocy_product_id: '{{ safe_grocy_product_id }}'
              action: '{{ _nr_action }}'
              writes:
                level: single
        - stop: return
          response_variable: final_response
    - alias: Early exit — notes_promote
      choose:
      - conditions:
        - condition: template
          value_template: '{{ case == "notes_promote" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ safe_item == "" and safe_shopping_list_id == "" }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: notes_promote
                  message: notes_promote requires item (list name) or shopping_list_id.
            - stop: return
              response_variable: error_response
        - action: script.zen_sutra_mealie
          response_variable: _np_lists_raw
          data:
            mode: run
            method: GET
            endpoint: households/shopping/lists
            payload: '{{ none }}'
            pageNumber: 1
            perPage: 50
        - variables:
            _np_all_lists: >-
              {{
                _np_lists_raw.result.content.get('items', [])
                if _np_lists_raw.result.content is mapping else []
              }}
        - variables:
            _np_list: >-
              {%- if safe_shopping_list_id != '' -%}
                {{ _np_all_lists | selectattr('id', 'equalto', safe_shopping_list_id) | list | first | default(none) }}
              {%- else -%}
                {{ _np_all_lists | selectattr('name', 'search', '(?i)^' ~ safe_item ~ '$') | list | first | default(none) }}
              {%- endif -%}
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _np_list is none }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: notes_promote
                  message: Shopping list not found. Use shopping_lists_overview to see available lists.
            - stop: return
              response_variable: error_response
        - action: script.zen_sutra_mealie
          response_variable: _np_full_raw
          data:
            mode: run
            method: GET
            endpoint: 'households/shopping/lists/{{ _np_list.id }}'
            payload: '{{ none }}'
        - variables:
            _np_full: >-
              {{ _np_full_raw.result.content
                 if _np_full_raw.result.content is mapping else {} }}
        - variables:
            _np_items_raw: '{{ _np_full.listItems if _np_full.listItems is sequence else [] }}'
        - variables:
            _np_note_items: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for i in _np_items_raw -%}
                {%- if not i.checked and (not i.foodId or i.foodId is none) -%}
                  {%- set name = (i.note | default('', true) | trim) or (i.display | default('', true) | trim) -%}
                  {%- if name != '' -%}
                    {%- set ns.out = ns.out + [{'id': i.id, 'name': name, 'item': i}] -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out }}
        - variables:
            _np_promoted: []
            _np_not_found: []
            _np_no_link: []
            _np_errors: []
        - repeat:
            for_each: '{{ _np_note_items }}'
            sequence:
            - action: script.zen_sutra_mealie
              response_variable: _np_food_search_raw
              continue_on_error: true
              data:
                mode: run
                method: GET
                endpoint: foods
                payload: '{{ none }}'
                pageNumber: 1
                perPage: 50
                additional_params: '{{ {"search": repeat.item.name} }}'
            - variables:
                _np_food_results: >-
                  {{ _np_food_search_raw.result.content.get('items', [])
                     if (_np_food_search_raw.result.content is mapping) else [] }}
                _np_food_exact: >-
                  {{ _np_food_results | selectattr('name', 'equalto', repeat.item.name) | list | first | default(none) }}
            - choose:
              - conditions:
                - condition: template
                  value_template: '{{ _np_food_exact is none }}'
                sequence:
                - variables:
                    _np_not_found: '{{ _np_not_found + [repeat.item.name] }}'
              - conditions:
                - condition: template
                  value_template: >-
                    {{ (_np_food_exact.extras is not mapping)
                       or (_np_food_exact.extras.get("grocy_product_id", none) is none)
                       or ((_np_food_exact.extras.get("grocy_product_id", "") ~ "") | trim == "") }}
                sequence:
                - variables:
                    _np_no_link: '{{ _np_no_link + [repeat.item.name] }}'
              - conditions:
                - condition: template
                  value_template: '{{ true }}'
                sequence:
                - action: script.zen_sutra_mealie
                  response_variable: _np_put_raw
                  continue_on_error: true
                  data:
                    mode: run
                    method: PUT
                    endpoint: 'households/shopping/items/{{ repeat.item.id }}'
                    payload: '{{ repeat.item.item | combine({"foodId": _np_food_exact.id}) | tojson }}'
                - choose:
                  - conditions:
                    - condition: template
                      value_template: '{{ _np_put_raw is mapping and _np_put_raw.get("status") == "success" }}'
                    sequence:
                    - variables:
                        _np_promoted: >-
                          {{ _np_promoted + [{"name": repeat.item.name, "food_id": _np_food_exact.id, "grocy_product_id": _np_food_exact.extras.get("grocy_product_id")}] }}
                  - conditions:
                    - condition: template
                      value_template: '{{ true }}'
                    sequence:
                    - variables:
                        _np_errors: '{{ _np_errors + [repeat.item.name] }}'
        - variables:
            final_response:
              status: success
              case: notes_promote
              list_id: '{{ _np_list.id }}'
              list_name: '{{ _np_list.name }}'
              summary:
                total_notes: '{{ _np_note_items | length }}'
                promoted: '{{ _np_promoted | length }}'
                not_found: '{{ _np_not_found | length }}'
                no_grocy_link: '{{ _np_no_link | length }}'
                errors: '{{ _np_errors | length }}'
              promoted_items: '{{ _np_promoted }}'
              not_found_items: '{{ _np_not_found }}'
              no_grocy_link_items: '{{ _np_no_link }}'
              error_items: '{{ _np_errors }}'
              coaching: >-
                {{
                  (["Use notes_resolve item=<name> grocy_product_id=<id> to link " ~ (_np_not_found | length) ~ " unmatched item(s) first."]
                  if _np_not_found | length > 0 else [])
                  + (["" ~ (_np_no_link | length) ~ " item(s) found in Mealie but have no grocy_product_id — run notes_resolve to add the Grocy link."]
                  if _np_no_link | length > 0 else [])
                }}
              writes:
                level: batch
        - stop: return
          response_variable: final_response
    - alias: Early exit — sync_now
      choose:
      - conditions:
        - condition: template
          value_template: '{{ case == "sync_now" }}'
        sequence:
        - action: script.zen_admintools_kitchen_sync
          response_variable: sn_resp
          data:
            direction: '{{ safe_sync_direction }}'
            mode: '{{ safe_sync_mode }}'
            limit: '{{ safe_sync_limit }}'
            confirmation: '{{ safe_sync_confirmation }}'
            default_location: '{{ safe_sync_default_location }}'
            default_unit: '{{ safe_sync_default_unit }}'
        - stop: return
          response_variable: sn_resp
    - alias: Early exit — receipt_to_stock
      choose:
      - conditions:
        - condition: template
          value_template: '{{ case == "receipt_to_stock" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ safe_item == "" and safe_shopping_list == "" and safe_shopping_list_id == "" }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: receipt_to_stock
                  message: receipt_to_stock requires item, shopping_list, or shopping_list_id.
            - stop: return
              response_variable: error_response
        - action: script.zen_dojotools_kitchen
          response_variable: _rts_pass1
          data:
            mode: run
            case: shopping_list_detail
            item: '{{ safe_item if safe_item != "" else safe_shopping_list }}'
            shopping_list_id: '{{ safe_shopping_list_id }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _rts_pass1.get("status") != "success" }}'
            sequence:
            - stop: return
              response_variable: _rts_pass1
        - variables:
            _rts_unlinked_ct: >-
              {{ _rts_pass1.get('items', [])
                 | selectattr('checked', 'equalto', true)
                 | selectattr('food_id', 'defined')
                 | rejectattr('food_id', 'equalto', none)
                 | rejectattr('grocy_product_id')
                 | list | length }}
        - if: '{{ _rts_unlinked_ct > 0 and not safe_dry_run }}'
          then:
            - action: script.zen_admintools_kitchen_sync
              response_variable: _rts_sync_resp
              continue_on_error: true
              data:
                direction: mealie_to_grocy
                mode: apply
                confirmation: true
                limit: '{{ [_rts_unlinked_ct, 100] | min }}'
                default_location: Pantry
                default_unit: each
        - action: script.zen_dojotools_kitchen
          response_variable: _rts_pass2
          data:
            mode: run
            case: shopping_list_detail
            item: '{{ safe_item if safe_item != "" else safe_shopping_list }}'
            shopping_list_id: '{{ safe_shopping_list_id }}'
        - variables:
            _rts_items: '{{ _rts_pass2.get("items", []) if _rts_pass2.get("status") == "success" else _rts_pass1.get("items", []) }}'
        - variables:
            _rts_checked: '{{ _rts_items | selectattr("checked", "equalto", true) | list }}'
        - variables:
            _rts_zero: >-
              {{ _rts_checked | selectattr('grocy_product_id') | selectattr('quantity', 'le', 0) | map(attribute='food_name') | list }}
            _rts_still_ambiguous: >-
              {{ _rts_checked | rejectattr('grocy_product_id') | selectattr('food_id', 'defined') | rejectattr('food_id', 'equalto', none) | map(attribute='food_name') | list }}
        - variables:
            _rts_linked: >-
              {{ _rts_checked | selectattr('grocy_product_id') | selectattr('quantity', 'gt', 0) | list }}
        - variables:
            _rts_bom_map: >-
              {%- set ns = namespace(m={}) -%}
              {%- for i in _rts_linked -%}
                {%- set pid = i.grocy_product_id | string -%}
                {%- set prev = ns.m.get(pid, {'name': i.food_name, 'amount': 0}) -%}
                {%- set ns.m = ns.m | combine({pid: {'name': prev.name, 'amount': prev.amount + (i.quantity | float(0))}}) -%}
              {%- endfor -%}
              {{ ns.m }}
        - variables:
            _rts_bom: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for pid, v in _rts_bom_map.items() -%}
                {%- set _entry = {'product_id': pid | int, 'name': v.name, 'amount': v.amount} -%}
                {%- set _price = safe_prices.get(pid, none) -%}
                {%- if _price is not none and (_price | string | trim) not in ['', 'none', 'null'] -%}
                  {%- set _entry = _entry | combine({'price': _price | float}) -%}
                {%- endif -%}
                {%- set ns.out = ns.out + [_entry] -%}
              {%- endfor -%}
              {{ ns.out }}
        - variables:
            _rts_priced_count: >-
              {{ _rts_bom | selectattr('price', 'defined') | list | length }}
        - variables:
            _rts_booked: 0
            _rts_stock_error: ''
        - if: '{{ _rts_bom | length > 0 and not safe_dry_run }}'
          then:
            - action: script.zen_dojotools_inventory
              response_variable: _rts_stock_resp
              continue_on_error: true
              data:
                mode: bulk_stock_add
                bom: '{{ _rts_bom | tojson }}'
                confirm_action: true
            - variables:
                _rts_booked: '{{ _rts_stock_resp.get("summary", {}).get("added", 0) }}'
                _rts_stock_error: '{{ _rts_stock_resp.get("message", "") if _rts_stock_resp.get("status") == "error" else "" }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _rts_stock_error != "" }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: receipt_to_stock
                  message: 'Stock booking failed: {{ _rts_stock_error }}'
            - stop: return
              response_variable: error_response
        - variables:
            _rts_ref_tagged: 0
            _rts_ref_error: ''
        - if: '{{ safe_paperless_doc_id is not none and _rts_bom | length > 0 and not safe_dry_run }}'
          then:
            - action: script.zen_dojotools_inventory
              response_variable: _rts_ref_resp
              continue_on_error: true
              data:
                mode: bulk_product_ref_add
                bom: '{{ _rts_bom | tojson }}'
                ref_type: doc
                ref_id: '{{ safe_paperless_doc_id }}'
                confirm_action: true
            - variables:
                _rts_ref_tagged: '{{ _rts_ref_resp.get("summary", {}).get("updated", 0) }}'
                _rts_ref_error: '{{ _rts_ref_resp.get("message", "") if _rts_ref_resp.get("status") == "error" else "" }}'
        - variables:
            final_response:
              status: success
              case: receipt_to_stock
              dry_run: '{{ safe_dry_run }}'
              list_id: '{{ _rts_pass1.get("list_id") }}'
              list_name: '{{ _rts_pass1.get("list_name") }}'
              bom_preview: '{{ _rts_bom if safe_dry_run else [] }}'
              summary:
                booked: '{{ _rts_booked }}'
                priced_count: '{{ _rts_priced_count }}'
                ref_tagged: '{{ _rts_ref_tagged }}'
                ref_error: '{{ _rts_ref_error }}'
                skipped_zero_qty: '{{ _rts_zero }}'
                still_ambiguous: '{{ _rts_still_ambiguous }}'
              writes:
                level: batch
        - stop: return
          response_variable: final_response
    - alias: Early exit — recipe_fulfillment
      choose:
      - conditions:
        - condition: template
          value_template: '{{ case == "recipe_fulfillment" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ safe_recipe_id == "" and safe_recipe == "" }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: recipe_fulfillment
                  message: recipe_fulfillment requires recipe_id or recipe.
            - stop: return
              response_variable: error_response
        - variables:
            _rf_recipe_id: '{{ safe_recipe_id }}'
        - if: '{{ _rf_recipe_id == "" }}'
          then:
          - action: script.zen_dojotools_kitchen
            response_variable: _rf_find
            data:
              mode: run
              case: recipes_find
              search: '{{ safe_recipe }}'
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ _rf_find.get("status") != "success" }}'
              sequence:
              - stop: return
                response_variable: _rf_find
          - variables:
              _rf_find_items: >-
                {{ _rf_find.get('raw', {}).get('api', {}).get('result', {}).get('content', {}).get('items', []) if _rf_find.get('raw', {}).get('api', {}).get('result', {}).get('content') is mapping else [] }}
              _rf_matches: >-
                {{ _rf_find_items | selectattr('name', 'search', '(?i)^' ~ safe_recipe ~ '$') | list }}
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ _rf_matches | length == 0 }}'
              sequence:
              - variables:
                  error_response:
                    status: error
                    case: recipe_fulfillment
                    message: 'No exact recipe name match for "{{ safe_recipe }}". Candidates found by search: {{ _rf_find_items | map(attribute="name") | list }}'
              - stop: return
                response_variable: error_response
            - conditions:
              - condition: template
                value_template: '{{ _rf_matches | length > 1 }}'
              sequence:
              - variables:
                  error_response:
                    status: error
                    case: recipe_fulfillment
                    message: 'Recipe name "{{ safe_recipe }}" matched multiple recipes. Refuse to guess. Candidates: {{ _rf_matches | map(attribute="name") | list }}'
              - stop: return
                response_variable: error_response
          - variables:
              _rf_recipe_id: '{{ _rf_matches[0].id | default("") | string }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _rf_recipe_id == "" }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: recipe_fulfillment
                  message: Could not resolve a recipe id.
            - stop: return
              response_variable: error_response
        - action: script.zen_sutra_mealie
          response_variable: _rf_recipe_raw
          data:
            mode: run
            method: GET
            endpoint: 'recipes/{{ _rf_recipe_id }}'
            payload: '{{ none }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _rf_recipe_raw.result.status | default(200) >= 400 }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: recipe_fulfillment
                  message: 'Recipe fetch failed for id {{ _rf_recipe_id }}.'
            - stop: return
              response_variable: error_response
        - variables:
            _rf_recipe: >-
              {{ _rf_recipe_raw.result.content if _rf_recipe_raw.result.content is mapping else {} }}
        - variables:
            _rf_ingredients: >-
              {{ _rf_recipe.recipeIngredient if _rf_recipe.recipeIngredient is sequence else [] }}
        - variables:
            _rf_parsed: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for i in _rf_ingredients -%}
                {%- set food = i.food if i.food is mapping else none -%}
                {%- set gpid = food.extras.get('grocy_product_id', none) if food is not none and food.extras is mapping else none -%}
                {%- set gpid_clean = gpid if gpid is string and gpid | trim != '' else none -%}
                {%- set iname = food.name if food is not none else (i.note | default(i.display | default('', true), true)) -%}
                {%- set iunit = (i.unit.name if i.unit is mapping else '') | default('', true) | string | trim -%}
                {%- set ns.out = ns.out + [{'name': iname, 'quantity': i.quantity | default(0), 'unit': iunit, 'grocy_product_id': gpid_clean}] -%}
              {%- endfor -%}
              {{ ns.out }}
        - variables:
            _rf_unresolvable: >-
              {{ _rf_parsed | selectattr('grocy_product_id', 'equalto', none) | list }}
            _rf_resolvable: >-
              {{ _rf_parsed | rejectattr('grocy_product_id', 'equalto', none) | list }}
        - variables:
            _rf_stock_map: {}
        - if: '{{ _rf_resolvable | length > 0 }}'
          then:
          - repeat:
              for_each: '{{ _rf_resolvable | map(attribute="grocy_product_id") | unique | list }}'
              sequence:
                - action: script.zen_dojotools_inventory
                  response_variable: _rfi_stock_resp
                  continue_on_error: true
                  data:
                    mode: stock_check_item
                    product_id: '{{ repeat.item | int }}'
                - variables:
                    _rfi_entries: >-
                      {{ _rfi_stock_resp.get('result', {}).get('entries', [])
                         if (_rfi_stock_resp is defined and _rfi_stock_resp.get('status') == 'success'
                             and _rfi_stock_resp.get('result') is mapping
                             and _rfi_stock_resp.get('result', {}).get('entries') is sequence)
                         else [] }}
                - variables:
                    _rfi_total: >-
                      {{ _rfi_entries | map(attribute='amount') | map('float', 0) | sum }}
                - variables:
                    _rf_stock_map: '{{ _rf_stock_map | combine({repeat.item | string: _rfi_total}) }}'
        # --- real unit conversion, reusing the exact engine proven in recipe_consume: a
        #     one-time units_list -> name/id lookup (never units_find, live-confirmed buggy),
        #     then per stated-unit ingredient either an exact Grocy-unit-id match or a real
        #     product-specific quantity_unit_conversions entry. Only ingredients with neither
        #     still fall to check_manually — this is strictly additive, never guessed. ---
        - variables:
            _rf_units_by_name: {}
            _rf_conversion_map: {}
        - if: '{{ _rf_resolvable | selectattr("unit", "ne", "") | list | length > 0 }}'
          then:
          - action: script.zen_dojotools_inventory
            response_variable: _rf_units_resp
            continue_on_error: true
            data:
              mode: units_list
          - variables:
              _rf_units_by_name: >-
                {%- set ns3 = namespace(m={}) -%}
                {%- set _units = (_rf_units_resp.get('result', [])
                    if (_rf_units_resp is defined and _rf_units_resp.get('status') == 'success'
                        and _rf_units_resp.get('result') is sequence) else []) -%}
                {%- for u in _units -%}
                  {%- set ns3.m = ns3.m | combine({(u.name | string | trim | lower): u.id, (u.name_plural | default('', true) | string | trim | lower): u.id}) -%}
                {%- endfor -%}
                {{ ns3.m }}
          - repeat:
              for_each: '{{ _rf_resolvable | selectattr("unit", "ne", "") | list }}'
              sequence:
                - action: script.zen_dojotools_inventory
                  response_variable: _rfc_details_resp
                  continue_on_error: true
                  data:
                    mode: stock_get_product_details
                    product_id: '{{ repeat.item.grocy_product_id | int }}'
                - variables:
                    _rfc_stock_unit_id: >-
                      {{ ((_rfc_details_resp.get('result', {}) or {}).get('product', {}) or {}).get('qu_id_stock') | int(-1)
                         if (_rfc_details_resp is defined and _rfc_details_resp.get('status') == 'success') else -1 }}
                    _rfc_recipe_unit_id: '{{ _rf_units_by_name.get(repeat.item.unit | string | trim | lower, -1) }}'
                    _rfc_key: '{{ (repeat.item.grocy_product_id | string) ~ "|" ~ (repeat.item.unit | string | trim | lower) }}'
                - if: '{{ _rfc_recipe_unit_id != -1 and _rfc_stock_unit_id != -1 and _rfc_recipe_unit_id == _rfc_stock_unit_id }}'
                  then:
                  - variables:
                      _rf_conversion_map: '{{ _rf_conversion_map | combine({_rfc_key: {"factor": 1.0, "same_unit": true}}) }}'
                  else:
                  - if: '{{ _rfc_recipe_unit_id != -1 and _rfc_stock_unit_id != -1 }}'
                    then:
                    - action: script.zen_dojotools_inventory
                      response_variable: _rfc_conv_resp
                      continue_on_error: true
                      data:
                        mode: unit_conversions_list
                        product_id: '{{ repeat.item.grocy_product_id | int }}'
                    - variables:
                        _rfc_conversions: >-
                          {{ _rfc_conv_resp.get('result', [])
                             if (_rfc_conv_resp is defined and _rfc_conv_resp.get('status') == 'success'
                                 and _rfc_conv_resp.get('result') is sequence)
                             else [] }}
                    - variables:
                        _rfc_factor: >-
                          {%- set ns4 = namespace(f=0) -%}
                          {%- for c in _rfc_conversions -%}
                            {%- if c.from_qu_id | int(-1) == _rfc_recipe_unit_id and c.to_qu_id | int(-1) == _rfc_stock_unit_id and c.factor is defined -%}
                              {%- set ns4.f = c.factor | float(0) -%}
                            {%- elif c.to_qu_id | int(-1) == _rfc_recipe_unit_id and c.from_qu_id | int(-1) == _rfc_stock_unit_id and c.factor is defined and (c.factor | float(0)) != 0 -%}
                              {%- set ns4.f = 1 / (c.factor | float(1)) -%}
                            {%- endif -%}
                          {%- endfor -%}
                          {{ ns4.f }}
                    - if: '{{ (_rfc_factor | float(0)) > 0 }}'
                      then:
                      - variables:
                          _rf_conversion_map: '{{ _rf_conversion_map | combine({_rfc_key: {"factor": (_rfc_factor | float(0)), "same_unit": false}}) }}'
        - variables:
            _rf_buckets: >-
              {%- set ns = namespace(fulfilled=[], insufficient=[], check_manually=[]) -%}
              {%- for i in _rf_resolvable -%}
                {%- set pid = i.grocy_product_id -%}
                {%- set on_hand = _rf_stock_map.get(pid, 0) | float(0) -%}
                {%- set req_unit = i.unit -%}
                {%- set _key = (pid | string) ~ "|" ~ (req_unit | string | trim | lower) -%}
                {%- set _conv = _rf_conversion_map.get(_key, none) -%}
                {%- if req_unit == '' -%}
                  {%- if on_hand >= (i.quantity | default(0) | float(0)) -%}
                    {%- set ns.fulfilled = ns.fulfilled + [{'name': i.name, 'quantity': i.quantity, 'unit': req_unit, 'grocy_product_id': pid, 'on_hand': on_hand}] -%}
                  {%- else -%}
                    {%- set ns.insufficient = ns.insufficient + [{'name': i.name, 'quantity': i.quantity, 'unit': req_unit, 'grocy_product_id': pid, 'on_hand': on_hand}] -%}
                  {%- endif -%}
                {%- elif _conv is mapping -%}
                  {%- set _req_converted = (i.quantity | default(0) | float(0)) * (_conv.factor | float(0)) -%}
                  {%- set _entry = {'name': i.name, 'quantity': i.quantity, 'unit': req_unit, 'grocy_product_id': pid, 'on_hand': on_hand, 'converted_required': _req_converted, 'conversion': ('exact_unit_match' if _conv.same_unit else 'grocy_conversion_table')} -%}
                  {%- if on_hand >= _req_converted -%}
                    {%- set ns.fulfilled = ns.fulfilled + [_entry] -%}
                  {%- else -%}
                    {%- set ns.insufficient = ns.insufficient + [_entry] -%}
                  {%- endif -%}
                {%- else -%}
                  {%- set ns.check_manually = ns.check_manually + [{'name': i.name, 'recipe_quantity': i.quantity, 'recipe_unit': req_unit, 'grocy_on_hand': on_hand, 'grocy_stock_unit': none, 'grocy_product_id': pid, 'note': 'No Grocy unit-id match for this ingredient unit and no product-specific entry in quantity_unit_conversions. No conversion attempted — this is a real remaining gap, not a guess.'}] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ {'fulfilled': ns.fulfilled, 'insufficient': ns.insufficient, 'check_manually': ns.check_manually} }}
        - variables:
            final_response:
              status: success
              case: recipe_fulfillment
              recipe_id: '{{ _rf_recipe_id }}'
              recipe_name: '{{ _rf_recipe.name | default("") }}'
              result:
                fulfilled: '{{ _rf_buckets.fulfilled }}'
                insufficient: '{{ _rf_buckets.insufficient }}'
                unresolvable: '{{ _rf_unresolvable }}'
                check_manually: '{{ _rf_buckets.check_manually }}'
                can_make: '{{ (_rf_buckets.insufficient | length == 0) and (_rf_unresolvable | length == 0) }}'
              writes:
                level: none
        - stop: return
          response_variable: final_response
    - alias: Early exit — stock_expiry_suggestions
      choose:
      - conditions:
        - condition: template
          value_template: '{{ case == "stock_expiry_suggestions" }}'
        sequence:
        - action: script.zen_dojotools_inventory
          response_variable: _ses_volatile_raw
          data:
            mode: "{{ 'stock_area_volatile' if safe_area != '' else 'stock_list_volatile' }}"
            homeassistant_area_id: '{{ safe_area }}'
        - variables:
            _ses_flat: >-
              {%- set ns = namespace(out=[]) -%}
              {%- set r = _ses_volatile_raw.get('result', {}) if _ses_volatile_raw is mapping else {} -%}
              {%- for bucket in ['overdue', 'due_soon', 'expiring'] -%}
                {%- for i in (r.get(bucket, []) if r.get(bucket) is sequence else []) -%}
                  {%- if (i.amount | default(0) | float(0)) > 0 -%}
                    {%- set _pname = i.name if i.name is defined else (i.product.name if (i.product is defined and i.product is mapping) else '') -%}
                    {%- set _pid = i.product_id if i.product_id is defined else none -%}
                    {%- set _bbd = (i.best_before_date | default('', true)) | string | trim -%}
                    {%- set _days = ((strptime(_bbd, '%Y-%m-%d') - now().replace(tzinfo=none)).days) if _bbd != '' else none -%}
                    {%- set ns.out = ns.out + [{'product_name': _pname, 'product_id': _pid, 'bucket': bucket, 'amount': i.amount | default(0) | float(0), 'best_before_date': _bbd, 'days_until_expiry': _days}] -%}
                  {%- endif -%}
                {%- endfor -%}
              {%- endfor -%}
              {{ ns.out }}
        - variables:
            _ses_purchase_map: {}
        - if: '{{ _ses_flat | length > 0 }}'
          then:
          - repeat:
              for_each: '{{ _ses_flat }}'
              sequence:
                - action: script.zen_dojotools_inventory
                  response_variable: _sesc_entries_resp
                  continue_on_error: true
                  data:
                    mode: stock_entries_for_item
                    product_id: '{{ repeat.item.product_id | int }}'
                - variables:
                    _sesc_entries: >-
                      {{ _sesc_entries_resp.get('result', [])
                         if (_sesc_entries_resp is defined and _sesc_entries_resp.get('status') == 'success'
                             and _sesc_entries_resp.get('result') is sequence)
                         else [] }}
                    _sesc_purchased_dates: >-
                      {{ _sesc_entries | map(attribute='purchased_date') | select('string') | reject('equalto', '') | list }}
                - variables:
                    _ses_purchase_map: >-
                      {{ _ses_purchase_map | combine({(repeat.item.product_id | string): (_sesc_purchased_dates | sort | first)})
                         if _sesc_purchased_dates | length > 0 else _ses_purchase_map }}
        - variables:
            _ses_recipes: []
            _ses_page: 1
            _ses_total_pages: 1
        - repeat:
            while:
            - condition: template
              value_template: '{{ _ses_page <= _ses_total_pages }}'
            sequence:
            - action: script.zen_dojotools_kitchen
              response_variable: _sesp_list_resp
              data:
                mode: run
                case: recipes_list
                page: '{{ _ses_page }}'
                perPage: 50
            - variables:
                _sesp_content: >-
                  {{ _sesp_list_resp.get('raw', {}).get('api', {}).get('result', {}).get('content', {})
                     if _sesp_list_resp.get('raw', {}).get('api', {}).get('result', {}).get('content') is mapping
                     else {} }}
            - variables:
                _ses_recipes: '{{ _ses_recipes + (_sesp_content.get("items", []) if _sesp_content.get("items") is sequence else []) }}'
                _ses_total_pages: '{{ _sesp_content.get("total_pages", 1) | default(1) | int(1) }}'
                _ses_page: '{{ _ses_page + 1 }}'
        - variables:
            _ses_reverse_map: {}
        - if: '{{ _ses_recipes | length > 0 }}'
          then:
          - repeat:
              for_each: '{{ _ses_recipes }}'
              sequence:
                - action: script.zen_dojotools_kitchen
                  response_variable: _sesr_get_resp
                  continue_on_error: true
                  data:
                    mode: run
                    case: recipes_get
                    recipe_id: '{{ repeat.item.id }}'
                - variables:
                    _sesr_recipe: >-
                      {{ _sesr_get_resp.get('raw', {}).get('api', {}).get('result', {}).get('content', {})
                         if (_sesr_get_resp is defined and _sesr_get_resp is mapping
                             and _sesr_get_resp.get('raw', {}).get('api', {}).get('result', {}).get('content') is mapping)
                         else {} }}
                    _sesr_ingredients: >-
                      {{ _sesr_recipe.recipeIngredient if _sesr_recipe.recipeIngredient is sequence else [] }}
                - variables:
                    _ses_reverse_map: >-
                      {%- set m = _ses_reverse_map -%}
                      {%- for ing in _sesr_ingredients -%}
                        {%- set food = ing.food if ing.food is mapping else none -%}
                        {%- set gpid = food.extras.get('grocy_product_id', none) if food is not none and food.extras is mapping else none -%}
                        {%- set gpid_clean = (gpid | string | trim) if gpid is string and gpid | trim != '' else none -%}
                        {%- if gpid_clean is not none -%}
                          {%- set existing = m.get(gpid_clean, []) -%}
                          {%- if _sesr_recipe.name is defined and _sesr_recipe.name not in existing -%}
                            {%- set m = m | combine({gpid_clean: existing + [_sesr_recipe.name]}) -%}
                          {%- endif -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {{ m }}
        - variables:
            _ses_matched: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for i in _ses_flat -%}
                {%- set pid = (i.product_id | string) if i.product_id is not none else none -%}
                {%- set matches = _ses_reverse_map.get(pid, []) if pid is not none else [] -%}
                {%- set _pdate = _ses_purchase_map.get(pid, '') if pid is not none else '' -%}
                {%- set _days_since = ((now().replace(tzinfo=none) - strptime(_pdate, '%Y-%m-%d')).days) if _pdate != '' else none -%}
                {%- set _is_clearing = (i.bucket == 'overdue') and (_days_since is not none) and (_days_since > 90) -%}
                {%- set _coaching = ('Purchased ' ~ _days_since ~ ' days ago, still overdue — likely stale bookkeeping rather than real food-safety risk. If it is actually gone, run stock_consume; if a real partial amount remains, run stock_inventory_adjust.') if _is_clearing else none -%}
                {%- set ns.out = ns.out + [i | combine({'matching_recipes': matches, 'purchased_date': _pdate if _pdate != '' else none, 'days_since_purchase': _days_since, 'clearing_candidate': _is_clearing, 'coaching': _coaching})] -%}
              {%- endfor -%}
              {{ ns.out }}
        - variables:
            _ses_upcoming: >-
              {{ _ses_matched | selectattr('bucket', 'in', ['due_soon', 'expiring']) | selectattr('days_until_expiry', 'defined') | selectattr('days_until_expiry', 'ne', none) | list | sort(attribute='days_until_expiry') }}
            _ses_recent_overdue: >-
              {{ _ses_matched | selectattr('bucket', 'equalto', 'overdue') | rejectattr('clearing_candidate') | selectattr('days_until_expiry', 'defined') | selectattr('days_until_expiry', 'ne', none) | list | sort(attribute='days_until_expiry', reverse=true) }}
            _ses_clearing: >-
              {{ _ses_matched | selectattr('bucket', 'equalto', 'overdue') | selectattr('clearing_candidate') | list | sort(attribute='days_since_purchase', reverse=true) }}
            _ses_undated: >-
              {{ _ses_matched | selectattr('days_until_expiry', 'equalto', none) | list }}
        - variables:
            _ses_sorted: '{{ _ses_upcoming + _ses_recent_overdue + _ses_clearing + _ses_undated }}'
        - variables:
            final_response:
              status: success
              case: stock_expiry_suggestions
              count: '{{ _ses_sorted | length }}'
              timeline: '{{ _ses_sorted }}'
              writes:
                level: none
        - stop: return
          response_variable: final_response
    - alias: Early exit — recipe_consume
      choose:
      - conditions:
        - condition: template
          value_template: '{{ case == "recipe_consume" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ safe_recipe_id == "" and safe_recipe == "" }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: recipe_consume
                  message: recipe_consume requires recipe_id or recipe.
            - stop: return
              response_variable: error_response
        - variables:
            _rc_recipe_id: '{{ safe_recipe_id }}'
        - if: '{{ _rc_recipe_id == "" }}'
          then:
          - action: script.zen_dojotools_kitchen
            response_variable: _rc_find
            data:
              mode: run
              case: recipes_find
              search: '{{ safe_recipe }}'
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ _rc_find.get("status") != "success" }}'
              sequence:
              - stop: return
                response_variable: _rc_find
          - variables:
              _rc_find_items: >-
                {{ _rc_find.get('raw', {}).get('api', {}).get('result', {}).get('content', {}).get('items', []) if _rc_find.get('raw', {}).get('api', {}).get('result', {}).get('content') is mapping else [] }}
              _rc_matches: >-
                {{ _rc_find_items | selectattr('name', 'search', '(?i)^' ~ safe_recipe ~ '$') | list }}
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ _rc_matches | length == 0 }}'
              sequence:
              - variables:
                  error_response:
                    status: error
                    case: recipe_consume
                    message: 'No exact recipe name match for "{{ safe_recipe }}". Candidates found by search: {{ _rc_find_items | map(attribute="name") | list }}'
              - stop: return
                response_variable: error_response
            - conditions:
              - condition: template
                value_template: '{{ _rc_matches | length > 1 }}'
              sequence:
              - variables:
                  error_response:
                    status: error
                    case: recipe_consume
                    message: 'Recipe name "{{ safe_recipe }}" matched multiple recipes. Refuse to guess. Candidates: {{ _rc_matches | map(attribute="name") | list }}'
              - stop: return
                response_variable: error_response
          - variables:
              _rc_recipe_id: '{{ _rc_matches[0].id | default("") | string }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _rc_recipe_id == "" }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: recipe_consume
                  message: Could not resolve a recipe id.
            - stop: return
              response_variable: error_response
        - action: script.zen_sutra_mealie
          response_variable: _rc_recipe_raw
          data:
            mode: run
            method: GET
            endpoint: 'recipes/{{ _rc_recipe_id }}'
            payload: '{{ none }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _rc_recipe_raw.result.status | default(200) >= 400 }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: recipe_consume
                  message: 'Recipe fetch failed for id {{ _rc_recipe_id }}.'
            - stop: return
              response_variable: error_response
        - variables:
            _rc_recipe: >-
              {{ _rc_recipe_raw.result.content if _rc_recipe_raw.result.content is mapping else {} }}
        - variables:
            _rc_ingredients: >-
              {{ _rc_recipe.recipeIngredient if _rc_recipe.recipeIngredient is sequence else [] }}
        - variables:
            _rc_parsed: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for i in _rc_ingredients -%}
                {%- set food = i.food if i.food is mapping else none -%}
                {%- set gpid = food.extras.get('grocy_product_id', none) if food is not none and food.extras is mapping else none -%}
                {%- set gpid_clean = gpid if gpid is string and gpid | trim != '' else none -%}
                {%- set iname = food.name if food is not none else (i.note | default(i.display | default('', true), true)) -%}
                {%- set iunit = (i.unit.name if i.unit is mapping else '') | default('', true) | string | trim -%}
                {%- set ns.out = ns.out + [{'name': iname, 'quantity': i.quantity | default(0), 'unit': iunit, 'grocy_product_id': gpid_clean}] -%}
              {%- endfor -%}
              {{ ns.out }}
        - variables:
            _rc_unresolvable: >-
              {{ _rc_parsed | selectattr('grocy_product_id', 'equalto', none) | list }}
            _rc_resolvable: >-
              {{ _rc_parsed | rejectattr('grocy_product_id', 'equalto', none) | list }}
        - variables:
            _rc_consumed: []
            _rc_needs_manual: []
            _rc_failed: []
        - if: '{{ _rc_resolvable | length > 0 }}'
          then:
          # --- resolve every Grocy unit name -> id ONCE (case-insensitive), so per-ingredient
          #     unit matching compares real Grocy unit IDs, never fragile name strings. units_find
          #     was tested live and found to mismatch on exact names (e.g. 'teaspoon' incorrectly
          #     resolved to 'each') — do not use it; build the lookup from units_list directly. ---
          - action: script.zen_dojotools_inventory
            response_variable: _rc_units_resp
            continue_on_error: true
            data:
              mode: units_list
          - variables:
              _rc_units_by_name: >-
                {%- set ns3 = namespace(m={}) -%}
                {%- set _units = (_rc_units_resp.get('result', [])
                    if (_rc_units_resp is defined and _rc_units_resp.get('status') == 'success'
                        and _rc_units_resp.get('result') is sequence) else []) -%}
                {%- for u in _units -%}
                  {%- set ns3.m = ns3.m | combine({(u.name | string | trim | lower): u.id, (u.name_plural | default('', true) | string | trim | lower): u.id}) -%}
                {%- endfor -%}
                {{ ns3.m }}
          - repeat:
              for_each: '{{ _rc_resolvable }}'
              sequence:
                - action: script.zen_dojotools_inventory
                  response_variable: _rci_details_resp
                  continue_on_error: true
                  data:
                    mode: stock_get_product_details
                    product_id: '{{ repeat.item.grocy_product_id | int }}'
                - variables:
                    _rci_details: >-
                      {{ _rci_details_resp.get('result', {})
                         if (_rci_details_resp is defined and _rci_details_resp.get('status') == 'success'
                             and _rci_details_resp.get('result') is mapping)
                         else {} }}
                    _rci_stock_unit_id: >-
                      {%- set _p = _rci_details.get('product') -%}
                      {{ (_p.get('qu_id_stock') if _p is mapping else none) | int(none) }}
                    _rci_stock_unit_name: >-
                      {%- set _q = _rci_details.get('quantity_unit_stock') -%}
                      {{ (_q.get('name', '') if _q is mapping else '') | string | trim | lower }}
                # --- resolve a safe consume amount: no unit stated on the ingredient (bare
                #     count), the ingredient's unit resolves to the SAME Grocy unit id as the
                #     product's stock unit, or a real product-specific Grocy unit_conversions
                #     entry bridges the two by id. Anything else is a genuine unit mismatch —
                #     never guessed, always surfaced in needs_manual_check. ---
                - variables:
                    _rci_recipe_unit_name: "{{ repeat.item.unit | string | trim | lower }}"
                    _rci_recipe_unit_id: >-
                      {{ _rc_units_by_name.get(_rci_recipe_unit_name, none) if _rci_recipe_unit_name != '' else none }}
                    _rci_bare_count: "{{ _rci_recipe_unit_name == '' }}"
                - variables:
                    _rci_same_unit: >-
                      {{ _rci_bare_count or (_rci_recipe_unit_id is not none and _rci_stock_unit_id is not none and _rci_recipe_unit_id == _rci_stock_unit_id) }}
                - if: '{{ not _rci_same_unit and _rci_recipe_unit_id is not none and _rci_stock_unit_id is not none }}'
                  then:
                  - action: script.zen_dojotools_inventory
                    response_variable: _rci_conv_resp
                    continue_on_error: true
                    data:
                      mode: unit_conversions_list
                      product_id: '{{ repeat.item.grocy_product_id | int }}'
                  - variables:
                      _rci_conversions: >-
                        {{ _rci_conv_resp.get('result', [])
                           if (_rci_conv_resp is defined and _rci_conv_resp.get('status') == 'success'
                               and _rci_conv_resp.get('result') is sequence)
                           else [] }}
                  - variables:
                      _rci_factor: >-
                        {%- set ns2 = namespace(f=0) -%}
                        {%- for c in _rci_conversions -%}
                          {%- if c.from_qu_id | int(-1) == _rci_recipe_unit_id and c.to_qu_id | int(-1) == _rci_stock_unit_id and c.factor is defined -%}
                            {%- set ns2.f = c.factor | float(0) -%}
                          {%- elif c.to_qu_id | int(-1) == _rci_recipe_unit_id and c.from_qu_id | int(-1) == _rci_stock_unit_id and c.factor is defined and (c.factor | float(0)) != 0 -%}
                            {%- set ns2.f = 1 / (c.factor | float(1)) -%}
                          {%- endif -%}
                        {%- endfor -%}
                        {{ ns2.f }}
                  else:
                  - variables:
                      _rci_factor: 0
                # --- _rci_factor is always numeric (0 = "no conversion found", never a
                #     none/string sentinel) so this comparison never needs an is-none check ---
                - variables:
                    _rci_factor_num: '{{ _rci_factor | float(0) }}'
                - variables:
                    _rci_consume_amount: >-
                      {{ (repeat.item.quantity | float(0))
                         if _rci_same_unit
                         else (((repeat.item.quantity | float(0)) * _rci_factor_num) if _rci_factor_num > 0 else none) }}
                - if: '{{ _rci_consume_amount is not none and _rci_consume_amount > 0 }}'
                  then:
                  - action: script.zen_dojotools_inventory
                    response_variable: _rci_consume_resp
                    continue_on_error: true
                    data:
                      mode: stock_consume
                      product_id: '{{ repeat.item.grocy_product_id | int }}'
                      amount: '{{ _rci_consume_amount }}'
                  - variables:
                      _rci_consume_ok: >-
                        {{ _rci_consume_resp is defined and _rci_consume_resp.get('status') == 'success'
                           and not (_rci_consume_resp.get('result', {}) is mapping and _rci_consume_resp.get('result', {}).get('error_message')) }}
                  - if: '{{ _rci_consume_ok }}'
                    then:
                    - variables:
                        _rc_consumed: >-
                          {{ _rc_consumed + [{'name': repeat.item.name, 'product_id': repeat.item.grocy_product_id, 'amount_consumed': _rci_consume_amount, 'unit_resolution': ('exact_or_bare' if _rci_same_unit else 'converted')}] }}
                    else:
                    - variables:
                        _rc_failed: >-
                          {{ _rc_failed + [{'name': repeat.item.name, 'product_id': repeat.item.grocy_product_id, 'attempted_amount': _rci_consume_amount, 'error': (_rci_consume_resp.get('result', {}).get('error_message', 'unknown error') if _rci_consume_resp is defined and _rci_consume_resp.get('result') is mapping else 'unknown error')}] }}
                  else:
                  - action: script.zen_dojotools_inventory
                    response_variable: _rci_stock_resp
                    continue_on_error: true
                    data:
                      mode: stock_check_item
                      product_id: '{{ repeat.item.grocy_product_id | int }}'
                  - variables:
                      _rci_onhand: >-
                        {{ (_rci_stock_resp.get('result', {}).get('entries', [])
                            if (_rci_stock_resp is defined and _rci_stock_resp.get('status') == 'success'
                                and _rci_stock_resp.get('result') is mapping) else [])
                           | map(attribute='amount') | map('float', 0) | sum }}
                  - variables:
                      _rc_needs_manual: >-
                        {{ _rc_needs_manual + [{'name': repeat.item.name, 'product_id': repeat.item.grocy_product_id, 'recipe_quantity': repeat.item.quantity, 'recipe_unit': repeat.item.unit, 'grocy_stock_unit': _rci_stock_unit_name, 'current_on_hand': _rci_onhand}] }}
        - variables:
            _rc_last_made_updated: false
        - if: >-
            {{ (_rc_recipe.get('lastMade') is none) or
               ((now().replace(tzinfo=none) - strptime((_rc_recipe.get('lastMade') | string)[:19], '%Y-%m-%dT%H:%M:%S')).total_seconds() > 3600) }}
          then:
          - action: script.zen_dojotools_kitchen
            response_variable: _rc_lastmade_resp
            continue_on_error: true
            data:
              mode: run
              case: recipes_update
              recipe_id: '{{ _rc_recipe_id }}'
              payload: '{{ {"lastMade": now().replace(tzinfo=none).isoformat()} | tojson }}'
          - variables:
              _rc_last_made_updated: '{{ _rc_lastmade_resp is defined and _rc_lastmade_resp.get("status") == "success" }}'
        - variables:
            final_response:
              status: success
              case: recipe_consume
              recipe_id: '{{ _rc_recipe_id }}'
              recipe_name: '{{ _rc_recipe.name | default("") }}'
              consumed: '{{ _rc_consumed }}'
              needs_manual_check: '{{ _rc_needs_manual }}'
              unresolvable: '{{ _rc_unresolvable }}'
              failed: '{{ _rc_failed }}'
              last_made_updated: '{{ _rc_last_made_updated }}'
              writes:
                level: batch
        - stop: return
          response_variable: final_response
    - alias: Early exit — mealplan_suggest
      choose:
      - conditions:
        - condition: template
          value_template: '{{ case == "mealplan_suggest" }}'
        sequence:
        # --- step 1-2: find genuinely empty slots this week (reuse mealplan_week as-is) ---
        - action: script.zen_dojotools_kitchen
          response_variable: _msu_week_resp
          data:
            mode: run
            case: mealplan_week
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _msu_week_resp.get("status") != "success" }}'
            sequence:
            - stop: return
              response_variable: _msu_week_resp
        - variables:
            _msu_days_filled: '{{ _msu_week_resp.get("days", {}) }}'
        - variables:
            _msu_empty_slots: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for d in range(0, 7) -%}
                {%- set _date = (now().date() + timedelta(days=d)).strftime('%Y-%m-%d') -%}
                {%- set _day_dict = _msu_days_filled.get(_date, {}) -%}
                {%- for etype in ['breakfast', 'lunch', 'dinner'] -%}
                  {%- if (_day_dict.get(etype, []) | length) == 0 -%}
                    {%- set ns.out = ns.out + [{'date': _date, 'entry_type': etype}] -%}
                  {%- endif -%}
                {%- endfor -%}
              {%- endfor -%}
              {{ ns.out }}
        # --- step 2b: active guest stay + allergen prefs, opt-in via area param.
        #     Shared lookup lives in Room Manager (zen_dojotools_room_manager
        #     mode=room_occupant_prefs) — checks a guest stay first (Twenty CRM,
        #     event-shaped presence), falls back to this room's static household
        #     occupant assignment (profile_editor) so a family dinner gets the
        #     same allergen flagging a guest stay does. Read-only, active:false
        #     (not an error) when nobody's currently relevant to that room.
        #     Cross-plugin call, same pattern already used elsewhere in this
        #     file for zen_dojotools_inventory. ---
        - variables:
            _msu_active_stay: none
            _msu_allergens: []
        - if: '{{ safe_area != "" }}'
          then:
          - action: script.zen_dojotools_room_manager
            response_variable: _msu_asp_resp
            continue_on_error: true
            data:
              mode: room_occupant_prefs
              area: '{{ safe_area }}'
          - if: >-
              {{ _msu_asp_resp is defined and _msu_asp_resp is mapping
                 and _msu_asp_resp.get('status') == 'ok'
                 and _msu_asp_resp.get('result', {}).get('active') == true }}
            then:
            - variables:
                _msu_active_stay:
                  guest_name: '{{ _msu_asp_resp.get("result", {}).get("guest_name", "") }}'
                  source: '{{ _msu_asp_resp.get("result", {}).get("source", "") }}'
                  allergens_checked: '{{ _msu_asp_resp.get("result", {}).get("guest_prefs", {}).get("allergens", []) }}'
                _msu_allergens: '{{ _msu_asp_resp.get("result", {}).get("guest_prefs", {}).get("allergens", []) | list }}'
        # --- step 3: near-expiry stock -> candidate recipe names, deduped, capped ---
        - action: script.zen_dojotools_kitchen
          response_variable: _msu_expiry_resp
          continue_on_error: true
          data:
            mode: run
            case: stock_expiry_suggestions
        - variables:
            _msu_timeline: >-
              {{ _msu_expiry_resp.get('timeline', [])
                 if (_msu_expiry_resp is defined and _msu_expiry_resp.get('status') == 'success')
                 else [] }}
        - variables:
            _msu_expiry_candidates: >-
              {%- set ns = namespace(out={}) -%}
              {%- for entry in _msu_timeline -%}
                {%- for rname in (entry.matching_recipes if entry.matching_recipes is sequence else []) -%}
                  {%- set _existing = ns.out.get(rname, []) -%}
                  {%- if entry.product_name not in _existing -%}
                    {%- set ns.out = ns.out | combine({rname: _existing + [entry.product_name]}) -%}
                  {%- endif -%}
                {%- endfor -%}
              {%- endfor -%}
              {{ ns.out }}
        # --- step 4: verify each expiry-linked candidate is actually makeable right now,
        #     capped at 5 recipe_fulfillment calls (each itself O(ingredients)) — this is the
        #     most API-heavy case yet, stated plainly in the help description below ---
        - variables:
            _msu_suggestions: []
            _msu_suggested_ids: []
        - variables:
            _msu_expiry_names_list: '{{ (_msu_expiry_candidates.keys() | list)[:3] }}'
        - if: '{{ _msu_expiry_names_list | length > 0 }}'
          then:
          - repeat:
              for_each: '{{ _msu_expiry_names_list }}'
              sequence:
                - action: script.zen_dojotools_kitchen
                  response_variable: _msur_fulfill_resp
                  continue_on_error: true
                  data:
                    mode: run
                    case: recipe_fulfillment
                    recipe: '{{ repeat.item }}'
                - if: >-
                    {{ _msur_fulfill_resp is defined and _msur_fulfill_resp.get('status') == 'success'
                       and _msur_fulfill_resp.get('result', {}).get('can_make') == true }}
                  then:
                  - variables:
                      _msur_ingredient_names: >-
                        {%- set _res = _msur_fulfill_resp.get('result', {}) -%}
                        {%- set _all = (_res.get('fulfilled', []) + _res.get('insufficient', [])
                                         + _res.get('unresolvable', []) + _res.get('check_manually', [])) -%}
                        {{ _all | map(attribute='name') | select('string') | map('lower') | list }}
                      _msur_allergen_flags: >-
                        {%- set _tax = {
                          'egg': ['egg','eggs'],
                          'dairy': ['milk','cream','butter','cheese','yogurt','yoghurt'],
                          'milk': ['milk','cream','butter','cheese','yogurt','yoghurt'],
                          'peanut': ['peanut','peanuts'],
                          'tree nut': ['almond','walnut','pecan','cashew','pistachio','hazelnut','macadamia'],
                          'nut': ['almond','walnut','pecan','cashew','pistachio','hazelnut','macadamia','peanut'],
                          'shellfish': ['shrimp','crab','lobster','scallop','prawn','crawfish'],
                          'fish': ['fish','salmon','tuna','cod','anchovy','tilapia','halibut'],
                          'soy': ['soy','soya','tofu','edamame'],
                          'gluten': ['wheat','flour','bread','pasta','barley','rye','gluten'],
                          'wheat': ['wheat','flour','bread','pasta']
                        } -%}
                        {%- set ns = namespace(hits=[]) -%}
                        {%- for a in _msu_allergens -%}
                          {%- set _a_low = a | string | lower | trim -%}
                          {%- if _a_low != '' -%}
                            {%- set _kw_list = _tax.get(_a_low, [_a_low]) -%}
                            {%- for iname in _msur_ingredient_names -%}
                              {%- for kw in _kw_list -%}
                                {%- if (iname | regex_search('\\b' ~ kw ~ '\\b')) and a not in ns.hits -%}
                                  {%- set ns.hits = ns.hits + [a] -%}
                                {%- endif -%}
                              {%- endfor -%}
                            {%- endfor -%}
                          {%- endif -%}
                        {%- endfor -%}
                        {{ ns.hits }}
                  - variables:
                      _msu_suggestions: >-
                        {{ _msu_suggestions + [{'recipe_id': _msur_fulfill_resp.get('recipe_id', ''), 'recipe_name': _msur_fulfill_resp.get('recipe_name', repeat.item), 'reason': 'uses expiring stock: ' ~ (_msu_expiry_candidates.get(repeat.item, []) | join(', ')), 'can_make': true, 'allergen_flags': _msur_allergen_flags}] }}
                      _msu_suggested_ids: '{{ _msu_suggested_ids + [_msur_fulfill_resp.get("recipe_id", "")] }}'
        # --- random-padding fallback was cut from v1 after live testing showed the combined
        #     cost (stock_expiry_suggestions + up to 3 recipe_fulfillment checks + up to 3 more
        #     recipes_random/recipe_fulfillment round trips) exceeded a single call's practical
        #     timeout. random_padding_available tells the caller more empty slots exist than
        #     expiry-linked suggestions could fill — call case=recipes_random +
        #     case=recipe_fulfillment yourself in a follow-up loop if you want to fill the rest,
        #     same pattern this case already uses internally. Stated plainly, not silently cut. ---
        - variables:
            final_response:
              status: success
              case: mealplan_suggest
              empty_slots: '{{ _msu_empty_slots }}'
              random_padding_available: '{{ _msu_suggestions | length < _msu_empty_slots | length }}'
              suggestions: '{{ _msu_suggestions }}'
              active_stay: '{{ _msu_active_stay }}'
              writes:
                level: none
        - stop: return
          response_variable: final_response
    - alias: Early exit — recipes_scale
      choose:
      - conditions:
        - condition: template
          value_template: '{{ case == "recipes_scale" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ safe_recipe_id == "" and safe_recipe == "" }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: recipes_scale
                  message: recipes_scale requires recipe_id or recipe.
            - stop: return
              response_variable: error_response
          - conditions:
            - condition: template
              value_template: '{{ safe_target_servings <= 0 }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: recipes_scale
                  message: recipes_scale requires quantity (target_servings) > 0.
            - stop: return
              response_variable: error_response
        - variables:
            _rsc_recipe_id: '{{ safe_recipe_id }}'
        - if: '{{ _rsc_recipe_id == "" }}'
          then:
          - action: script.zen_dojotools_kitchen
            response_variable: _rsc_find
            data:
              mode: run
              case: recipes_find
              search: '{{ safe_recipe }}'
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ _rsc_find.get("status") != "success" }}'
              sequence:
              - stop: return
                response_variable: _rsc_find
          - variables:
              _rsc_find_items: >-
                {{ _rsc_find.get('raw', {}).get('api', {}).get('result', {}).get('content', {}).get('items', []) if _rsc_find.get('raw', {}).get('api', {}).get('result', {}).get('content') is mapping else [] }}
              _rsc_matches: >-
                {{ _rsc_find_items | selectattr('name', 'search', '(?i)^' ~ safe_recipe ~ '$') | list }}
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ _rsc_matches | length == 0 }}'
              sequence:
              - variables:
                  error_response:
                    status: error
                    case: recipes_scale
                    message: 'No exact recipe name match for "{{ safe_recipe }}". Candidates found by search: {{ _rsc_find_items | map(attribute="name") | list }}'
              - stop: return
                response_variable: error_response
            - conditions:
              - condition: template
                value_template: '{{ _rsc_matches | length > 1 }}'
              sequence:
              - variables:
                  error_response:
                    status: error
                    case: recipes_scale
                    message: 'Recipe name "{{ safe_recipe }}" matched multiple recipes. Refuse to guess. Candidates: {{ _rsc_matches | map(attribute="name") | list }}'
              - stop: return
                response_variable: error_response
          - variables:
              _rsc_recipe_id: '{{ _rsc_matches[0].id | default("") | string }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _rsc_recipe_id == "" }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: recipes_scale
                  message: Could not resolve a recipe id.
            - stop: return
              response_variable: error_response
        - action: script.zen_sutra_mealie
          response_variable: _rsc_recipe_raw
          data:
            mode: run
            method: GET
            endpoint: 'recipes/{{ _rsc_recipe_id }}'
            payload: '{{ none }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _rsc_recipe_raw.result.status | default(200) >= 400 }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: recipes_scale
                  message: 'Recipe fetch failed for id {{ _rsc_recipe_id }}.'
            - stop: return
              response_variable: error_response
        - variables:
            _rsc_recipe: >-
              {{ _rsc_recipe_raw.result.content if _rsc_recipe_raw.result.content is mapping else {} }}
        - variables:
            _rsc_current_servings: >-
              {{ (_rsc_recipe.get('recipeServings', 0) | float(0))
                 if (_rsc_recipe.get('recipeServings', 0) | float(0)) > 0
                 else (_rsc_recipe.get('recipeYieldQuantity', 0) | float(0)) }}
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _rsc_current_servings <= 0 }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: recipes_scale
                  message: 'Recipe "{{ _rsc_recipe.get("name", "") }}" has no recipeServings or recipeYieldQuantity set — cannot compute a scale factor.'
            - stop: return
              response_variable: error_response
        - variables:
            _rsc_scale_factor: '{{ safe_target_servings / _rsc_current_servings }}'
        - variables:
            _rsc_ingredients: >-
              {{ _rsc_recipe.recipeIngredient if _rsc_recipe.recipeIngredient is sequence else [] }}
        - variables:
            _rsc_scaled_ingredients: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for i in _rsc_ingredients -%}
                {%- set _orig_qty = i.quantity | default(0) | float(0) -%}
                {%- set _scaled_qty = _orig_qty * _rsc_scale_factor -%}
                {%- set _food = i.food if i.food is mapping else none -%}
                {%- set _iname = _food.name if _food is not none else (i.note | default(i.display | default('', true), true)) -%}
                {%- set _iunit = (i.unit.name if i.unit is mapping else '') | default('', true) | string | trim -%}
                {%- set ns.out = ns.out + [{'name': _iname, 'unit': _iunit, 'original_quantity': _orig_qty, 'scaled_quantity': _scaled_qty}] -%}
              {%- endfor -%}
              {{ ns.out }}
        - variables:
            _rsc_apply_result: >-
              {{ {'applied': false, 'reason': 'apply=false (default) — preview only, nothing written'} }}
        - if: '{{ safe_apply }}'
          then:
          - variables:
              _rsc_new_ingredients: >-
                {%- set ns = namespace(out=[]) -%}
                {%- for i in _rsc_ingredients -%}
                  {%- set _orig_qty = i.quantity | default(0) | float(0) -%}
                  {%- set ns.out = ns.out + [i | combine({'quantity': _orig_qty * _rsc_scale_factor})] -%}
                {%- endfor -%}
                {{ ns.out }}
          - action: script.zen_dojotools_kitchen
            response_variable: _rsc_apply_resp
            continue_on_error: true
            data:
              mode: run
              case: recipes_update
              recipe_id: '{{ _rsc_recipe_id }}'
              payload: '{{ {"recipeServings": safe_target_servings, "recipeIngredient": _rsc_new_ingredients} | tojson }}'
          - variables:
              _rsc_apply_result: >-
                {{ {'applied': true, 'status': _rsc_apply_resp.get('status', 'error')}
                   if (_rsc_apply_resp is defined) else {'applied': false, 'reason': 'recipes_update call failed'} }}
        - variables:
            final_response:
              status: success
              case: recipes_scale
              recipe_id: '{{ _rsc_recipe_id }}'
              recipe_name: '{{ _rsc_recipe.name | default("") }}'
              current_servings: '{{ _rsc_current_servings }}'
              target_servings: '{{ safe_target_servings }}'
              scale_factor: '{{ _rsc_scale_factor }}'
              scaled_ingredients: '{{ _rsc_scaled_ingredients }}'
              nutrition_note: Nutrition values are NOT scaled — Mealie itself doesn't auto-scale nutrition when servings change either; this is a real upstream limitation, not something skipped here.
              apply_result: '{{ _rsc_apply_result }}'
              writes:
                level: '{{ "single" if safe_apply else "none" }}'
        - stop: return
          response_variable: final_response
    - alias: Early exit — cookbook_fulfillment
      choose:
      - conditions:
        - condition: template
          value_template: '{{ case == "cookbook_fulfillment" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ safe_item_id == "" and safe_cookbook == "" }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: cookbook_fulfillment
                  message: cookbook_fulfillment requires item_id or cookbook.
            - stop: return
              response_variable: error_response
        - variables:
            _cbf_cookbook_id: '{{ safe_item_id }}'
        - if: '{{ _cbf_cookbook_id == "" }}'
          then:
          - action: script.zen_dojotools_kitchen
            response_variable: _cbf_list_resp
            data:
              mode: run
              case: cookbooks_list
          - variables:
              _cbf_list_items: >-
                {{ _cbf_list_resp.get('raw', {}).get('api', {}).get('result', {}).get('content', {}).get('items', [])
                   if _cbf_list_resp.get('raw', {}).get('api', {}).get('result', {}).get('content') is mapping else [] }}
              _cbf_matches: >-
                {{ _cbf_list_items | selectattr('name', 'search', '(?i)^' ~ safe_cookbook ~ '$') | list }}
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ _cbf_matches | length == 0 }}'
              sequence:
              - variables:
                  error_response:
                    status: error
                    case: cookbook_fulfillment
                    message: 'No exact cookbook name match for "{{ safe_cookbook }}". Candidates: {{ _cbf_list_items | map(attribute="name") | list }}'
              - stop: return
                response_variable: error_response
            - conditions:
              - condition: template
                value_template: '{{ _cbf_matches | length > 1 }}'
              sequence:
              - variables:
                  error_response:
                    status: error
                    case: cookbook_fulfillment
                    message: 'Cookbook name "{{ safe_cookbook }}" matched multiple cookbooks. Refuse to guess.'
              - stop: return
                response_variable: error_response
          - variables:
              _cbf_cookbook_id: '{{ _cbf_matches[0].id | default("") | string }}'
        - action: script.zen_dojotools_kitchen
          response_variable: _cbf_get_resp
          data:
            mode: run
            case: cookbooks_get
            item_id: '{{ _cbf_cookbook_id }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _cbf_get_resp.get("status") != "success" }}'
            sequence:
            - stop: return
              response_variable: _cbf_get_resp
        - variables:
            _cbf_cookbook: >-
              {{ _cbf_get_resp.get('raw', {}).get('api', {}).get('result', {}).get('content', {})
                 if _cbf_get_resp.get('raw', {}).get('api', {}).get('result', {}).get('content') is mapping else {} }}
            _cbf_query_filter: '{{ _cbf_get_resp.get("raw", {}).get("api", {}).get("result", {}).get("content", {}).get("queryFilterString", "") }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _cbf_query_filter == "" }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: cookbook_fulfillment
                  message: 'Cookbook "{{ _cbf_cookbook.get("name", "") }}" has no queryFilterString set — cannot resolve its recipes.'
            - stop: return
              response_variable: error_response
        - action: script.zen_dojotools_kitchen
          response_variable: _cbf_recipes_resp
          data:
            mode: run
            case: recipes_list
            queryFilter: '{{ _cbf_query_filter }}'
            perPage: 50
        - variables:
            _cbf_recipes: >-
              {{ _cbf_recipes_resp.get('raw', {}).get('api', {}).get('result', {}).get('content', {}).get('items', [])
                 if (_cbf_recipes_resp.get('status') == 'success'
                     and _cbf_recipes_resp.get('raw', {}).get('api', {}).get('result', {}).get('content') is mapping)
                 else [] }}
        - variables:
            _cbf_recipes_capped: '{{ _cbf_recipes[:2] }}'
        - variables:
            _cbf_makeable: []
            _cbf_not_makeable: []
        - if: '{{ _cbf_recipes_capped | length > 0 }}'
          then:
          - repeat:
              for_each: '{{ _cbf_recipes_capped }}'
              sequence:
                - action: script.zen_dojotools_kitchen
                  response_variable: _cbfr_fulfill_resp
                  continue_on_error: true
                  data:
                    mode: run
                    case: recipe_fulfillment
                    recipe_id: '{{ repeat.item.id }}'
                - if: >-
                    {{ _cbfr_fulfill_resp is defined and _cbfr_fulfill_resp.get('status') == 'success'
                       and _cbfr_fulfill_resp.get('result', {}).get('can_make') == true }}
                  then:
                  - variables:
                      _cbf_makeable: >-
                        {{ _cbf_makeable + [{'recipe_id': repeat.item.id, 'recipe_name': repeat.item.name}] }}
                  else:
                  - variables:
                      _cbf_not_makeable: >-
                        {{ _cbf_not_makeable + [{'recipe_id': repeat.item.id, 'recipe_name': repeat.item.name,
                           'insufficient_count': (_cbfr_fulfill_resp.get('result', {}).get('insufficient', []) | length if _cbfr_fulfill_resp is defined and _cbfr_fulfill_resp.get('status') == 'success' else none),
                           'check_manually_count': (_cbfr_fulfill_resp.get('result', {}).get('check_manually', []) | length if _cbfr_fulfill_resp is defined and _cbfr_fulfill_resp.get('status') == 'success' else none)}] }}
        - variables:
            final_response:
              status: success
              case: cookbook_fulfillment
              cookbook_id: '{{ _cbf_cookbook_id }}'
              cookbook_name: '{{ _cbf_cookbook.get("name", "") }}'
              recipe_count: '{{ _cbf_recipes | length }}'
              checked_count: '{{ _cbf_recipes_capped | length }}'
              capped: '{{ _cbf_recipes | length > 2 }}'
              makeable: '{{ _cbf_makeable }}'
              not_makeable: '{{ _cbf_not_makeable }}'
              writes:
                level: none
        - stop: return
          response_variable: final_response
    - alias: Early exit — recipe_plan
      choose:
      - conditions:
        - condition: template
          value_template: '{{ case == "recipe_plan" }}'
        sequence:
        - action: script.zen_dojotools_kitchen
          response_variable: _rpl_fulfill_resp
          data:
            mode: run
            case: recipe_fulfillment
            recipe_id: '{{ safe_recipe_id }}'
            recipe: '{{ safe_recipe }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _rpl_fulfill_resp.get("status") != "success" }}'
            sequence:
            - stop: return
              response_variable: _rpl_fulfill_resp
        - variables:
            _rpl_can_make: '{{ _rpl_fulfill_resp.get("result", {}).get("can_make", false) }}'
        - if: '{{ _rpl_can_make }}'
          then:
          - variables:
              final_response:
                status: success
                case: recipe_plan
                recipe_id: '{{ _rpl_fulfill_resp.get("recipe_id", "") }}'
                recipe_name: '{{ _rpl_fulfill_resp.get("recipe_name", "") }}'
                fulfillment: '{{ _rpl_fulfill_resp.get("result", {}) }}'
                shopping_action: not_needed
                writes:
                  level: none
          - stop: return
            response_variable: final_response
        - if: '{{ safe_shopping_list_id == "" and safe_shopping_list == "" }}'
          then:
          - variables:
              final_response:
                status: success
                case: recipe_plan
                recipe_id: '{{ _rpl_fulfill_resp.get("recipe_id", "") }}'
                recipe_name: '{{ _rpl_fulfill_resp.get("recipe_name", "") }}'
                fulfillment: '{{ _rpl_fulfill_resp.get("result", {}) }}'
                shopping_action: skipped_no_list
                message: Recipe is not fully fulfillable and no shopping_list_id/shopping_list was given — pass one to auto-add missing items.
                writes:
                  level: none
          - stop: return
            response_variable: final_response
        - action: script.zen_dojotools_kitchen
          response_variable: _rpl_shop_resp
          continue_on_error: true
          data:
            mode: run
            case: shopping_list_generate_from_recipe
            recipe_id: '{{ _rpl_fulfill_resp.get("recipe_id", "") }}'
            shopping_list_id: '{{ safe_shopping_list_id }}'
            shopping_list: '{{ safe_shopping_list }}'
        - variables:
            final_response:
              status: success
              case: recipe_plan
              recipe_id: '{{ _rpl_fulfill_resp.get("recipe_id", "") }}'
              recipe_name: '{{ _rpl_fulfill_resp.get("recipe_name", "") }}'
              fulfillment: '{{ _rpl_fulfill_resp.get("result", {}) }}'
              shopping_action: '{{ "added" if (_rpl_shop_resp is defined and _rpl_shop_resp.get("status") == "success") else "failed" }}'
              shopping_result: '{{ _rpl_shop_resp if _rpl_shop_resp is defined else {} }}'
              writes:
                level: bulk
        - stop: return
          response_variable: final_response
    - alias: Early exit — recipe_cost
      choose:
      - conditions:
        - condition: template
          value_template: '{{ case == "recipe_cost" }}'
        sequence:
        - action: script.zen_dojotools_kitchen
          response_variable: _rct_fulfill_resp
          data:
            mode: run
            case: recipe_fulfillment
            recipe_id: '{{ safe_recipe_id }}'
            recipe: '{{ safe_recipe }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _rct_fulfill_resp.get("status") != "success" }}'
            sequence:
            - stop: return
              response_variable: _rct_fulfill_resp
        - variables:
            _rct_costable: >-
              {{ (_rct_fulfill_resp.get('result', {}).get('fulfilled', []) if _rct_fulfill_resp.get('result', {}).get('fulfilled') is sequence else [])
                 + (_rct_fulfill_resp.get('result', {}).get('insufficient', []) if _rct_fulfill_resp.get('result', {}).get('insufficient') is sequence else []) }}
            _rct_unresolved_count: >-
              {{ (_rct_fulfill_resp.get('result', {}).get('check_manually', []) | length)
                 + (_rct_fulfill_resp.get('result', {}).get('unresolvable', []) | length) }}
        - variables:
            _rct_items: []
            _rct_total: 0.0
        - if: '{{ _rct_costable | length > 0 }}'
          then:
          - repeat:
              for_each: '{{ _rct_costable }}'
              sequence:
                - action: script.zen_dojotools_inventory
                  response_variable: _rcti_entries_resp
                  continue_on_error: true
                  data:
                    mode: stock_entries_for_item
                    product_id: '{{ repeat.item.grocy_product_id | int }}'
                - variables:
                    _rcti_entries: >-
                      {{ _rcti_entries_resp.get('result', [])
                         if (_rcti_entries_resp is defined and _rcti_entries_resp.get('status') == 'success'
                             and _rcti_entries_resp.get('result') is sequence)
                         else [] }}
                - variables:
                    _rcti_unit_price: >-
                      {{ (_rcti_entries | map(attribute='price') | map('float', 0) | select('gt', 0) | list | first) | default(0, true) }}
                - variables:
                    _rcti_qty: >-
                      {{ repeat.item.converted_required if repeat.item.converted_required is defined else (repeat.item.quantity | default(0) | float(0)) }}
                - variables:
                    _rcti_resolved: '{{ _rcti_unit_price > 0 }}'
                    _rcti_cost: '{{ (_rcti_qty * _rcti_unit_price) if _rcti_unit_price > 0 else none }}'
                - variables:
                    _rct_items: >-
                      {{ _rct_items + [{'name': repeat.item.name, 'quantity': _rcti_qty, 'unit_price': _rcti_unit_price, 'item_cost': _rcti_cost, 'cost_resolved': _rcti_resolved}] }}
                - if: '{{ _rcti_resolved }}'
                  then:
                  - variables:
                      _rct_total: '{{ _rct_total + _rcti_cost }}'
                  else:
                  - variables:
                      _rct_unresolved_count: '{{ _rct_unresolved_count + 1 }}'
        - action: script.zen_sutra_mealie
          response_variable: _rct_recipe_raw
          continue_on_error: true
          data:
            mode: run
            method: GET
            endpoint: 'recipes/{{ _rct_fulfill_resp.get("recipe_id", "") }}'
            payload: '{{ none }}'
        - variables:
            _rct_servings: >-
              {{ (_rct_recipe_raw.result.content.get('recipeServings', 0) | float(0))
                 if (_rct_recipe_raw is defined and _rct_recipe_raw.result.content is mapping
                     and (_rct_recipe_raw.result.content.get('recipeServings', 0) | float(0)) > 0)
                 else none }}
        - variables:
            final_response:
              status: success
              case: recipe_cost
              recipe_id: '{{ _rct_fulfill_resp.get("recipe_id", "") }}'
              recipe_name: '{{ _rct_fulfill_resp.get("recipe_name", "") }}'
              total_cost: '{{ _rct_total | round(2) }}'
              cost_per_serving: '{{ (_rct_total / _rct_servings) | round(2) if _rct_servings is not none else none }}'
              items: '{{ _rct_items }}'
              unresolved_count: '{{ _rct_unresolved_count }}'
              note: >-
                {{ 'total_cost is a lower bound — ' ~ _rct_unresolved_count ~ ' ingredient(s) excluded (no positive Grocy stock price found, or no safe quantity resolution from recipe_fulfillment).'
                   if _rct_unresolved_count > 0 else 'total_cost reflects all ingredients — every one had a resolvable quantity and a positive stock price.' }}
              writes:
                level: none
        - stop: return
          response_variable: final_response
    - alias: Early exit — kitchen_brief
      choose:
      - conditions:
        - condition: template
          value_template: '{{ case == "kitchen_brief" }}'
        sequence:
        - action: script.zen_dojotools_kitchen
          response_variable: _kb_week_resp
          continue_on_error: true
          data:
            mode: run
            case: mealplan_week
        - variables:
            _kb_week_start: '{{ _kb_week_resp.get("week_start","") if _kb_week_resp is mapping else "" }}'
            _kb_week_end: '{{ _kb_week_resp.get("week_end","") if _kb_week_resp is mapping else "" }}'
            _kb_days: '{{ _kb_week_resp.get("days", {}) if _kb_week_resp is mapping else {} }}'
        - variables:
            _kb_entries: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for _date, _slots in _kb_days.items() if _slots is mapping -%}
                {%- for _entry_type, _recipes in _slots.items() if _recipes is sequence -%}
                  {%- for _r in _recipes if _r is mapping -%}
                    {%- set ns.out = ns.out + [{'date': _date, 'entry_type': _entry_type, 'recipe_id': _r.get('recipe_id',''), 'name': _r.get('name','')}] -%}
                  {%- endfor -%}
                {%- endfor -%}
              {%- endfor -%}
              {{ ns.out }}
        # ── PERFORMANCE: unlike recipe_cost/recipe_fulfillment (per-meal, per-occurrence
        #     Grocy calls), kitchen_brief dedupes to ONE fetch per unique recipe and ONE
        #     Grocy lookup per unique ingredient across the ENTIRE week — a week with
        #     repeated ingredients (garlic, oil, etc.) across several recipes previously
        #     re-queried Grocy once per occurrence, which was slow enough to exceed a
        #     single MCP call's timeout. This costs everything in-memory after the fetch. ──
        - variables:
            _kb_unique_recipe_ids: >-
              {{ _kb_entries | selectattr('recipe_id', 'ne', '') | map(attribute='recipe_id') | unique | list }}
        - variables:
            _kb_recipe_data: {}
        - if: '{{ _kb_unique_recipe_ids | length > 0 }}'
          then:
          - repeat:
              for_each: '{{ _kb_unique_recipe_ids }}'
              sequence:
                - action: script.zen_sutra_mealie
                  response_variable: _kbr_raw
                  continue_on_error: true
                  data:
                    mode: run
                    method: GET
                    endpoint: 'recipes/{{ repeat.item }}'
                    payload: '{{ none }}'
                - variables:
                    _kbr_recipe: >-
                      {{ _kbr_raw.result.content if (_kbr_raw is defined and _kbr_raw.result.content is mapping) else {} }}
                - variables:
                    _kbr_ingredients: >-
                      {{ _kbr_recipe.recipeIngredient if _kbr_recipe.recipeIngredient is sequence else [] }}
                - variables:
                    _kbr_parsed: >-
                      {%- set ns2 = namespace(out=[]) -%}
                      {%- for i in _kbr_ingredients -%}
                        {%- set food = i.food if i.food is mapping else none -%}
                        {%- set gpid = food.extras.get('grocy_product_id', none) if food is not none and food.extras is mapping else none -%}
                        {%- set gpid_clean = gpid if gpid is string and gpid | trim != '' else none -%}
                        {%- set iname = food.name if food is not none else (i.note | default(i.display | default('', true), true)) -%}
                        {%- set iunit = (i.unit.name if i.unit is mapping else '') | default('', true) | string | trim -%}
                        {%- set ns2.out = ns2.out + [{'name': iname, 'quantity': i.quantity | default(0), 'unit': iunit, 'grocy_product_id': gpid_clean}] -%}
                      {%- endfor -%}
                      {{ ns2.out }}
                - variables:
                    _kbr_servings: >-
                      {{ (_kbr_recipe.get('recipeServings', 0) | float(0)) if (_kbr_recipe.get('recipeServings', 0) | float(0)) > 0 else none }}
                - variables:
                    _kb_recipe_data: >-
                      {{ _kb_recipe_data | combine({repeat.item: {'ingredients': _kbr_parsed, 'servings': _kbr_servings, 'name': _kbr_recipe.get('name', '')}}) }}
        - variables:
            _kb_all_ingredients: >-
              {%- set ns3 = namespace(out=[]) -%}
              {%- for _rid, _rd in _kb_recipe_data.items() -%}
                {%- for _ing in (_rd.ingredients if _rd.ingredients is sequence else []) -%}
                  {%- set ns3.out = ns3.out + [_ing] -%}
                {%- endfor -%}
              {%- endfor -%}
              {{ ns3.out }}
            _kb_unique_product_ids: >-
              {{ _kb_all_ingredients | selectattr('grocy_product_id', 'ne', none) | map(attribute='grocy_product_id') | unique | list }}
        - variables:
            _kb_price_map: {}
        - if: '{{ _kb_unique_product_ids | length > 0 }}'
          then:
          - repeat:
              for_each: '{{ _kb_unique_product_ids }}'
              sequence:
                - action: script.zen_dojotools_inventory
                  response_variable: _kbp_entries_resp
                  continue_on_error: true
                  data:
                    mode: stock_entries_for_item
                    product_id: '{{ repeat.item | int }}'
                - variables:
                    _kbp_entries: >-
                      {{ _kbp_entries_resp.get('result', [])
                         if (_kbp_entries_resp is defined and _kbp_entries_resp.get('status') == 'success'
                             and _kbp_entries_resp.get('result') is sequence)
                         else [] }}
                - variables:
                    _kbp_price: >-
                      {{ (_kbp_entries | map(attribute='price') | map('float', 0) | select('gt', 0) | list | first) | default(0, true) }}
                - variables:
                    _kb_price_map: '{{ _kb_price_map | combine({repeat.item | string: _kbp_price}) }}'
        - variables:
            _kb_units_by_name: {}
            _kb_conv_data: {}
        - if: '{{ _kb_all_ingredients | selectattr("unit", "ne", "") | list | length > 0 }}'
          then:
          - action: script.zen_dojotools_inventory
            response_variable: _kb_units_resp
            continue_on_error: true
            data:
              mode: units_list
          - variables:
              _kb_units_by_name: >-
                {%- set ns4 = namespace(m={}) -%}
                {%- set _units = (_kb_units_resp.get('result', [])
                    if (_kb_units_resp is defined and _kb_units_resp.get('status') == 'success'
                        and _kb_units_resp.get('result') is sequence) else []) -%}
                {%- for u in _units -%}
                  {%- set ns4.m = ns4.m | combine({(u.name | string | trim | lower): u.id, (u.name_plural | default('', true) | string | trim | lower): u.id}) -%}
                {%- endfor -%}
                {{ ns4.m }}
          - repeat:
              for_each: '{{ _kb_unique_product_ids }}'
              sequence:
                - action: script.zen_dojotools_inventory
                  response_variable: _kbc_details_resp
                  continue_on_error: true
                  data:
                    mode: stock_get_product_details
                    product_id: '{{ repeat.item | int }}'
                - action: script.zen_dojotools_inventory
                  response_variable: _kbc_conv_resp
                  continue_on_error: true
                  data:
                    mode: unit_conversions_list
                    product_id: '{{ repeat.item | int }}'
                - variables:
                    _kbc_stock_unit_id: >-
                      {{ ((_kbc_details_resp.get('result', {}) or {}).get('product', {}) or {}).get('qu_id_stock') | int(-1)
                         if (_kbc_details_resp is defined and _kbc_details_resp.get('status') == 'success') else -1 }}
                    _kbc_conversions: >-
                      {{ _kbc_conv_resp.get('result', [])
                         if (_kbc_conv_resp is defined and _kbc_conv_resp.get('status') == 'success'
                             and _kbc_conv_resp.get('result') is sequence)
                         else [] }}
                - variables:
                    _kb_conv_data: >-
                      {{ _kb_conv_data | combine({repeat.item | string: {'stock_unit_id': _kbc_stock_unit_id, 'conversions': _kbc_conversions}}) }}
        # ── all costing math below is pure in-memory Jinja — zero further API calls ──
        - variables:
            _kb_recipe_totals: >-
              {%- set ns5 = namespace(map={}) -%}
              {%- for _rid, _rd in _kb_recipe_data.items() -%}
                {%- set total = namespace(v=0.0, unresolved=0) -%}
                {%- for i in (_rd.ingredients if _rd.ingredients is sequence else []) -%}
                  {%- if i.grocy_product_id is none -%}
                    {%- set total.unresolved = total.unresolved + 1 -%}
                  {%- else -%}
                    {%- set pid = i.grocy_product_id -%}
                    {%- set price = _kb_price_map.get(pid | string, 0) | float(0) -%}
                    {%- set req_unit = i.unit | string | trim | lower -%}
                    {%- set qty = i.quantity | default(0) | float(0) -%}
                    {%- if req_unit == '' -%}
                      {%- set conv_qty = qty -%}
                      {%- set have_conv = true -%}
                    {%- else -%}
                      {%- set pcd = _kb_conv_data.get(pid | string, none) -%}
                      {%- set recipe_unit_id = _kb_units_by_name.get(req_unit, -1) -%}
                      {%- if pcd is not none and recipe_unit_id != -1 and pcd.stock_unit_id != -1 and recipe_unit_id == pcd.stock_unit_id -%}
                        {%- set conv_qty = qty -%}
                        {%- set have_conv = true -%}
                      {%- elif pcd is not none and recipe_unit_id != -1 and pcd.stock_unit_id != -1 -%}
                        {%- set factor = namespace(f=0) -%}
                        {%- for c in pcd.conversions -%}
                          {%- if c.from_qu_id | int(-1) == recipe_unit_id and c.to_qu_id | int(-1) == pcd.stock_unit_id and c.factor is defined -%}
                            {%- set factor.f = c.factor | float(0) -%}
                          {%- elif c.to_qu_id | int(-1) == recipe_unit_id and c.from_qu_id | int(-1) == pcd.stock_unit_id and c.factor is defined and (c.factor | float(0)) != 0 -%}
                            {%- set factor.f = 1 / (c.factor | float(1)) -%}
                          {%- endif -%}
                        {%- endfor -%}
                        {%- if (factor.f | float(0)) > 0 -%}
                          {%- set conv_qty = qty * (factor.f | float(0)) -%}
                          {%- set have_conv = true -%}
                        {%- else -%}
                          {%- set conv_qty = 0 -%}
                          {%- set have_conv = false -%}
                        {%- endif -%}
                      {%- else -%}
                        {%- set conv_qty = 0 -%}
                        {%- set have_conv = false -%}
                      {%- endif -%}
                    {%- endif -%}
                    {%- if have_conv and price > 0 -%}
                      {%- set total.v = total.v + (conv_qty * price) -%}
                    {%- else -%}
                      {%- set total.unresolved = total.unresolved + 1 -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endfor -%}
                {%- set ns5.map = ns5.map | combine({_rid: {'total_cost': (total.v | round(2)), 'unresolved_count': total.unresolved, 'servings': _rd.servings, 'name': _rd.name}}) -%}
              {%- endfor -%}
              {{ ns5.map }}
        - variables:
            _kb_recipe_costs: >-
              {%- set ns6 = namespace(out=[]) -%}
              {%- for e in _kb_entries -%}
                {%- set rt = _kb_recipe_totals.get(e.recipe_id, none) -%}
                {%- set ns6.out = ns6.out + [{'date': e.date, 'entry_type': e.entry_type, 'name': e.name, 'cost': (rt.total_cost if rt is not none else none), 'unresolved_count': (rt.unresolved_count if rt is not none else none)}] -%}
              {%- endfor -%}
              {{ ns6.out }}
            _kb_recipe_total: >-
              {{ (_kb_recipe_costs | selectattr('cost', 'ne', none) | map(attribute='cost') | sum) | round(2) }}
            _kb_unresolved_recipes: >-
              {#- Previously only counted recipes with cost == none (total
                 lookup failure) — found live:
                 a recipe processed fine but with every ingredient unresolved
                 gets cost=0.00 (not none), so it was silently excluded from
                 this total despite its own row showing unresolved_count=14+.
                 Now counts any recipe with cost==none OR unresolved_count>0,
                 matching what the per-recipe rows actually show. -#}
              {%- set ns7 = namespace(n=0) -%}
              {%- for r in _kb_recipe_costs -%}
                {%- if r.cost is none or ((r.unresolved_count | default(0, true) | int(0)) > 0) -%}
                  {%- set ns7.n = ns7.n + 1 -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns7.n }}
        # ── total household grocery spend for the same week window ─────────
        - action: script.zen_dojotools_finance
          response_variable: _kb_spend_resp
          continue_on_error: true
          data:
            mode: run
            case: category_spend
            item: Groceries
            start_date: '{{ _kb_week_start }}'
            end_date: '{{ _kb_week_end }}'
        - variables:
            _kb_grocery_spend: >-
              {%- set _ok = _kb_spend_resp is mapping and _kb_spend_resp.get('status') == 'success' -%}
              {%- set _r = _kb_spend_resp.get('result', {}) if _ok else {} -%}
              {%- set _r = _r if _r is mapping else {} -%}
              {%- set _d = _r.get('data', {}) -%}
              {%- set _d = _d if _d is mapping else {} -%}
              {{ (_d.get('total_spent', 0) | float(0)) if _ok else none }}
        - variables:
            _kb_food_cost_pct: >-
              {{ ((_kb_recipe_total / _kb_grocery_spend) * 100) | round(1) if (_kb_grocery_spend is not none and _kb_grocery_spend > 0) else none }}
            _kb_overall_status: >-
              {%- if _kb_food_cost_pct is none -%}unknown
              {%- elif _kb_food_cost_pct >= 40 -%}red
              {%- elif _kb_food_cost_pct >= 30 -%}yellow
              {%- else -%}green
              {%- endif -%}
        - variables:
            final_response:
              status: success
              case: kitchen_brief
              week_start: '{{ _kb_week_start }}'
              week_end: '{{ _kb_week_end }}'
              overall_status: '{{ _kb_overall_status }}'
              gm_summary: >-
                {{ ('Recipe cost this week: $' ~ _kb_recipe_total ~ ' against $' ~ (_kb_grocery_spend | round(2)) ~ ' grocery spend (' ~ _kb_food_cost_pct ~ '% food cost).'
                    if _kb_food_cost_pct is not none
                    else ('Recipe cost this week: $' ~ _kb_recipe_total ~ '. Grocery spend for this window not available from Finance — check category_spend configuration.')) }}
              recipe_cost_total: '{{ _kb_recipe_total }}'
              grocery_spend_total: '{{ _kb_grocery_spend }}'
              food_cost_percentage: '{{ _kb_food_cost_pct }}'
              unresolved_recipe_count: '{{ _kb_unresolved_recipes }}'
              unique_recipes_priced: '{{ _kb_unique_recipe_ids | length }}'
              unique_products_priced: '{{ _kb_unique_product_ids | length }}'
              recipes: '{{ _kb_recipe_costs }}'
              note: "food_cost_percentage compares recipe ingredient cost against total 'Groceries' category spend for the same week — an approximation, since grocery spend includes non-recipe items (snacks, toiletries, etc. mixed into the same shopping trips). Costs are computed directly from deduped per-recipe/per-product Grocy lookups across the whole week (not via per-meal recipe_cost/recipe_fulfillment calls) to keep total call volume low. Per-ingredient cost is only counted when Grocy has a positive recorded stock price AND a resolvable unit conversion — unresolved_count per recipe reflects ingredients missing either, so a low or $0 total_cost often means price data hasn't been entered for those stock entries, not that the recipe is free. unique_products_priced counts distinct products REFERENCED by this week's recipes, not products that successfully resolved a price — cross-check against each recipe's own unresolved_count for actual pricing coverage."
        - stop: return
          response_variable: final_response

    - alias: Early exit — waste_log
      choose:
      - conditions:
        - condition: template
          value_template: '{{ case == "waste_log" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ safe_item == "" and safe_grocy_product_id == "" }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: waste_log
                  message: waste_log requires item or grocy_product_id.
            - stop: return
              response_variable: error_response
        # ── Purely Grocy-native: mark the consumption spoiled=true so it lands in
        #     Grocy's own stock_log. Nothing is written anywhere else — cabinet space
        #     is finite and this would grow unbounded, so waste_reason/recipe_id are
        #     accepted for the caller's own context but not persisted anywhere; only
        #     what Grocy's stock_log itself natively tracks (product, qty, date, spoiled)
        #     is queryable later via waste_summary. ──
        - action: script.zen_dojotools_inventory
          response_variable: _wl_consume_resp
          continue_on_error: true
          data:
            mode: stock_consume
            item: '{{ safe_item }}'
            product_id: '{{ safe_grocy_product_id }}'
            amount: '{{ safe_quantity }}'
            spoiled: true
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ not (_wl_consume_resp is mapping and _wl_consume_resp.get("status") == "success") }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: waste_log
                  message: Grocy stock_consume (spoiled) failed — nothing logged.
                  grocy_response: '{{ _wl_consume_resp if _wl_consume_resp is defined else {} }}'
            - stop: return
              response_variable: error_response
        - variables:
            final_response:
              status: success
              case: waste_log
              item: '{{ safe_item }}'
              quantity: '{{ safe_quantity }}'
              unit: '{{ safe_unit }}'
              waste_reason: '{{ safe_waste_reason }}'
              recipe_id: '{{ safe_recipe_id }}'
              grocy_stock_consume: '{{ _wl_consume_resp.get("result", {}) }}'
              writes:
                level: single
              note: "Booked in Grocy with spoiled=true — Grocy's own native waste flag, visible in Grocy's own stock reports and queryable via waste_summary. waste_reason/recipe_id are echoed back for your own record but are NOT persisted anywhere (no cabinet drawer, no custom ledger) — Grocy's stock_log has no field for either."
        - stop: return
          response_variable: final_response
    - alias: Early exit — waste_summary
      choose:
      - conditions:
        - condition: template
          value_template: '{{ case == "waste_summary" }}'
        sequence:
        - action: script.zen_dojotools_inventory
          response_variable: _ws_history_resp
          continue_on_error: true
          data:
            mode: waste_history
            product_id: '{{ safe_grocy_product_id }}'
        - variables:
            _ws_all: >-
              {{ _ws_history_resp.get('result', [])
                 if (_ws_history_resp is mapping and _ws_history_resp.get('status') == 'success'
                     and _ws_history_resp.get('result') is sequence)
                 else [] }}
        - variables:
            _ws_start: '{{ start_date | default("", true) if (start_date | default("", true)) != "" else "1970-01-01" }}'
            _ws_end: '{{ end_date | default("", true) if (end_date | default("", true)) != "" else now().date().isoformat() }}'
        - variables:
            _ws_scoped: >-
              {{ _ws_all | selectattr('used_date', 'defined') | selectattr('used_date', 'ge', _ws_start) | selectattr('used_date', 'le', _ws_end) | list }}
        - variables:
            _ws_by_product: >-
              {%- set ns = namespace(m={}) -%}
              {%- for e in _ws_scoped -%}
                {%- set pid = e.get('product_id', 'unknown') | string -%}
                {%- set qty = (e.get('amount', 0) | float(0)) | abs -%}
                {%- set ns.m = ns.m | combine({pid: (ns.m.get(pid, 0) + qty)}) -%}
              {%- endfor -%}
              {{ ns.m }}
        - variables:
            _ws_top_products: >-
              {{ _ws_by_product.items() | list | sort(attribute='1', reverse=true) | list }}
        - variables:
            final_response:
              status: success
              case: waste_summary
              start_date: '{{ _ws_start }}'
              end_date: '{{ _ws_end }}'
              total_events: '{{ _ws_scoped | length }}'
              top_wasted_products: '{{ _ws_top_products[:10] }}'
              entries: '{{ _ws_scoped }}'
              note: "Reads directly from Grocy's own stock_log (spoiled=true bookings) — nothing is cached or stored anywhere else. Quantity-based only (no cost estimate — add on request, same per-product price-lookup pattern kitchen_brief uses). Grouped by grocy_product_id, not name — Grocy's stock_log doesn't carry the product name, resolve via zen_dojotools_inventory stock_check_item if you need it. No reason/recipe breakdown — Grocy's own stock_log doesn't track either field, and per household preference nothing is persisted outside Grocy to backfill it."
        - stop: return
          response_variable: final_response

    - alias: Early exit — event_menu_create
      choose:
      - conditions:
        - condition: template
          value_template: '{{ case == "event_menu_create" }}'
        sequence:
        - variables:
            _emc_recipes_raw: >-
              {{ safe_payload | regex_findall('[^,]+') | map('trim') | select('ne', '') | list }}
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _emc_recipes_raw is not sequence or _emc_recipes_raw | length == 0 }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: event_menu_create
                  message: "event_menu_create requires payload as a comma-separated list of recipe names or recipe_ids, e.g. payload='Easy Mongolian Beef, Potato Leek Soup'."
            - stop: return
              response_variable: error_response
          - conditions:
            - condition: template
              value_template: '{{ safe_target_servings <= 0 }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: event_menu_create
                  message: event_menu_create requires quantity (guest count / servings per dish) > 0.
            - stop: return
              response_variable: error_response
        # ── allergen context: same room_occupant_prefs lookup mealplan_suggest already
        #     uses (guest stay first, falls back to household occupant assignment) ──
        - variables:
            _emc_allergens: []
            _emc_guest_context: none
        - if: '{{ safe_area != "" }}'
          then:
          - action: script.zen_dojotools_room_manager
            response_variable: _emc_asp_resp
            continue_on_error: true
            data:
              mode: room_occupant_prefs
              area: '{{ safe_area }}'
          - if: >-
              {{ _emc_asp_resp is defined and _emc_asp_resp is mapping
                 and _emc_asp_resp.get('status') == 'ok'
                 and _emc_asp_resp.get('result', {}).get('active') == true }}
            then:
            - variables:
                _emc_guest_context:
                  guest_name: '{{ _emc_asp_resp.get("result", {}).get("guest_name", "") }}'
                  source: '{{ _emc_asp_resp.get("result", {}).get("source", "") }}'
                _emc_allergens: '{{ _emc_asp_resp.get("result", {}).get("guest_prefs", {}).get("allergens", []) | list }}'
        # ── scale each dish to the guest count via the existing recipes_scale case
        #     (self-call, already proven) and flag any allergen hits against the
        #     scaled ingredient names it returns — no extra fulfillment call needed. ──
        - variables:
            _emc_menu: []
            _emc_errors: []
        - repeat:
            for_each: '{{ _emc_recipes_raw }}'
            sequence:
            - variables:
                _emcr_is_uuid: >-
                  {{ (repeat.item | string | length) == 36 and (repeat.item | string | regex_findall('^[0-9a-fA-F-]{36}$') | length) > 0 }}
            - action: script.zen_dojotools_kitchen
              response_variable: _emcr_scale_resp
              continue_on_error: true
              data:
                mode: run
                case: recipes_scale
                recipe_id: '{{ repeat.item if _emcr_is_uuid else "" }}'
                recipe: '{{ repeat.item if not _emcr_is_uuid else "" }}'
                quantity: '{{ safe_target_servings }}'
                apply_scale: '{{ safe_apply }}'
            - if: '{{ _emcr_scale_resp is mapping and _emcr_scale_resp.get("status") == "success" }}'
              then:
              - variables:
                  _emcr_ingredient_names: >-
                    {{ _emcr_scale_resp.get('scaled_ingredients', []) | map(attribute='name') | select('string') | map('lower') | list }}
                  _emcr_allergen_flags: >-
                    {%- set _tax = {
                      'egg': ['egg','eggs'],
                      'dairy': ['milk','cream','butter','cheese','yogurt','yoghurt'],
                      'milk': ['milk','cream','butter','cheese','yogurt','yoghurt'],
                      'peanut': ['peanut','peanuts'],
                      'tree nut': ['almond','walnut','pecan','cashew','pistachio','hazelnut','macadamia'],
                      'nut': ['almond','walnut','pecan','cashew','pistachio','hazelnut','macadamia','peanut'],
                      'shellfish': ['shrimp','crab','lobster','scallop','prawn','crawfish'],
                      'fish': ['fish','salmon','tuna','cod','anchovy','tilapia','halibut'],
                      'soy': ['soy','soya','tofu','edamame'],
                      'gluten': ['wheat','flour','bread','pasta','barley','rye','gluten'],
                      'wheat': ['wheat','flour','bread','pasta']
                    } -%}
                    {%- set ns = namespace(hits=[]) -%}
                    {%- for a in _emc_allergens -%}
                      {%- set _a_low = a | string | lower | trim -%}
                      {%- if _a_low != '' -%}
                        {%- set _kw_list = _tax.get(_a_low, [_a_low]) -%}
                        {%- for iname in (_emcr_scale_resp.get('scaled_ingredients', []) | map(attribute='name') | select('string') | map('lower') | list) -%}
                          {%- for kw in _kw_list -%}
                            {%- if (iname | regex_search('\\b' ~ kw ~ '\\b')) and a not in ns.hits -%}
                              {%- set ns.hits = ns.hits + [a] -%}
                            {%- endif -%}
                          {%- endfor -%}
                        {%- endfor -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {{ ns.hits }}
              - variables:
                  _emc_menu: >-
                    {{ _emc_menu + [{
                      'recipe_id': _emcr_scale_resp.get('recipe_id', ''),
                      'recipe_name': _emcr_scale_resp.get('recipe_name', ''),
                      'target_servings': _emcr_scale_resp.get('target_servings', safe_target_servings),
                      'scale_factor': _emcr_scale_resp.get('scale_factor', 1),
                      'scaled_ingredients': _emcr_scale_resp.get('scaled_ingredients', []),
                      'allergen_flags': _emcr_allergen_flags,
                      'apply_result': _emcr_scale_resp.get('apply_result', {})
                    }] }}
              else:
              - variables:
                  _emc_errors: >-
                    {{ _emc_errors + [{'requested': repeat.item, 'error': _emcr_scale_resp if _emcr_scale_resp is defined else {'message': 'no response'}}] }}
        - variables:
            _emc_any_allergen_conflict: >-
              {{ _emc_menu | selectattr('allergen_flags', 'defined') | selectattr('allergen_flags', 'ne', []) | list | length > 0 }}
        - variables:
            final_response:
              status: success
              case: event_menu_create
              title: '{{ safe_title if safe_title != "" else "Untitled event" }}'
              target_servings: '{{ safe_target_servings }}'
              guest_context: '{{ _emc_guest_context }}'
              dishes_requested: '{{ _emc_recipes_raw | length }}'
              dishes_scaled: '{{ _emc_menu | length }}'
              any_allergen_conflict: '{{ _emc_any_allergen_conflict }}'
              menu: '{{ _emc_menu }}'
              errors: '{{ _emc_errors }}'
              writes:
                level: '{{ "bulk" if safe_apply else "none" }}'
              note: "Thin orchestration over recipes_scale (per-dish) + the same room_occupant_prefs allergen lookup mealplan_suggest uses. apply_scale (default false) is passed straight through to recipes_scale per dish — false previews only, true persists each recipe's scaled servings/ingredients in Mealie. allergen_flags per dish use a small synonym taxonomy (dairy also catches milk/cream/butter/cheese, etc.) matched word-boundary-safe against scaled ingredient names — not a bare substring match, which used to false-positive on things like egg matching inside eggplant. Same heuristic used elsewhere in this file — still not a certified allergen check."
        - stop: return
          response_variable: final_response

    - alias: Early exit — prep_schedule_set
      choose:
      - conditions:
        - condition: template
          value_template: '{{ case == "prep_schedule_set" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ safe_item_id == "" }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: prep_schedule_set
                  message: prep_schedule_set requires item_id (a mealplan entry id — get it from mealplan_week/mealplan_today's entry lists).
            - stop: return
              response_variable: error_response
          - conditions:
            - condition: template
              value_template: '{{ safe_lead_time_minutes <= 0 }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: prep_schedule_set
                  message: prep_schedule_set requires lead_time_minutes > 0.
            - stop: return
              response_variable: error_response
        - action: script.zen_dojotools_kitchen
          response_variable: _pss_get_resp
          data:
            mode: run
            case: mealplan_get_item
            item_id: '{{ safe_item_id }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _pss_get_resp.get("status") != "success" }}'
            sequence:
            - stop: return
              response_variable: _pss_get_resp
        - variables:
            _pss_entry: >-
              {{ _pss_get_resp.get('raw', {}).get('api', {}).get('result', {}).get('content', {})
                 if _pss_get_resp.get('raw', {}).get('api', {}).get('result', {}).get('content') is mapping
                 else {} }}
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _pss_entry == {} }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: prep_schedule_set
                  message: 'Could not fetch mealplan entry {{ safe_item_id }}.'
            - stop: return
              response_variable: error_response
        # ── strip any existing [PREP:N] tag (this call replaces it), keep everything else ──
        - variables:
            _pss_existing_text: '{{ _pss_entry.get("text", "") | default("", true) }}'
            _pss_remainder: >-
              {{ _pss_existing_text | regex_replace('^\[PREP:[0-9]+\]\s*', '') }}
        - variables:
            _pss_new_text: >-
              {{ '[PREP:' ~ safe_lead_time_minutes ~ '] ' ~ (safe_text if safe_text != '' else _pss_remainder) }}
        - action: script.zen_dojotools_kitchen
          response_variable: _pss_update_resp
          data:
            mode: run
            case: mealplan_update_recipe
            item_id: '{{ safe_item_id }}'
            date: '{{ _pss_entry.get("date", "") }}'
            entry_type: '{{ _pss_entry.get("entryType", "") }}'
            recipe_id: '{{ _pss_entry.get("recipeId", "") | default("", true) }}'
            title: '{{ _pss_entry.get("title", "") | default("", true) }}'
            text: '{{ _pss_new_text }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _pss_update_resp.get("status") != "success" }}'
            sequence:
            - stop: return
              response_variable: _pss_update_resp
        - variables:
            final_response:
              status: success
              case: prep_schedule_set
              item_id: '{{ safe_item_id }}'
              lead_time_minutes: '{{ safe_lead_time_minutes }}'
              text: '{{ _pss_new_text }}'
              writes:
                level: single
              note: "Lead time is stored as a [PREP:N] tag at the start of the mealplan entry's own free-text field (Mealie's own mealplan API — no new storage). Read back via prep_brief. Calling this again on the same item_id replaces the tag; anything after it in the text field (or the new text= you pass) is preserved."
        - stop: return
          response_variable: final_response
    - alias: Early exit — prep_brief
      choose:
      - conditions:
        - condition: template
          value_template: '{{ case == "prep_brief" }}'
        sequence:
        - variables:
            _pb_date: '{{ safe_date if safe_date != "" else now().strftime("%Y-%m-%d") }}'
        - action: script.zen_sutra_mealie
          response_variable: _pb_resp
          data:
            mode: run
            method: GET
            endpoint: households/mealplans
            payload: '{{ none }}'
            pageNumber: 1
            perPage: 100
            additional_params: '{{ {"start_date": _pb_date, "end_date": _pb_date, "perPage": "100"} }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _pb_resp.result.status | default(200) >= 400 }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: prep_brief
                  message: 'Meal plan fetch failed for {{ _pb_date }}.'
            - stop: return
              response_variable: error_response
        - variables:
            _pb_items: >-
              {{ _pb_resp.result.content.get('items', []) if _pb_resp.result.content is mapping else [] }}
        # ── default serving times per entry_type; no per-entry override in v1.
        #     breakfast/dinner derive from the household's own scheduler_anchors
        #     (input_datetime.zen_morning_start / zen_evening_start +1h) — same
        #     anchors Home Mode itself uses — so overriding them is just
        #     zen_dojotools_systemtools mode=scheduler_anchors anchor=morning/evening
        #     value=HH:MM. lunch/snack read two standalone input_datetime helpers
        #     (zen_lunch_time/zen_snack_time) — deliberately NOT part of the 6
        #     home-mode scheduler_anchors (those drive real home-mode state
        #     transitions; lunch/snack are just clock habits, not state changes).
        #     Override those two directly via Developer Tools > States. ──
        - variables:
            _pb_morning_anchor: "{{ states('input_datetime.zen_morning_start') }}"
            _pb_evening_anchor: "{{ states('input_datetime.zen_evening_start') }}"
            _pb_lunch_anchor: "{{ states('input_datetime.zen_lunch_time') }}"
            _pb_snack_anchor: "{{ states('input_datetime.zen_snack_time') }}"
        - variables:
            _pb_breakfast_default: >-
              {{ (_pb_morning_anchor[:5]) if _pb_morning_anchor not in ['unknown','unavailable',''] else '08:00' }}
            _pb_dinner_default: >-
              {%- if _pb_evening_anchor not in ['unknown','unavailable',''] -%}
                {{ ((_pb_date ~ ' ' ~ _pb_evening_anchor) | as_datetime + timedelta(hours=1)).strftime('%H:%M') }}
              {%- else -%}18:00{%- endif -%}
            _pb_lunch_default: >-
              {{ (_pb_lunch_anchor[:5]) if _pb_lunch_anchor not in ['unknown','unavailable',''] else '12:00' }}
            _pb_snack_default: >-
              {{ (_pb_snack_anchor[:5]) if _pb_snack_anchor not in ['unknown','unavailable',''] else '15:00' }}
        - variables:
            _pb_serving_defaults:
              breakfast: '{{ _pb_breakfast_default }}'
              lunch: '{{ _pb_lunch_default }}'
              dinner: '{{ _pb_dinner_default }}'
              snack: '{{ _pb_snack_default }}'
        - variables:
            _pb_scheduled: []
            _pb_unscheduled: []
        - if: '{{ _pb_items | length > 0 }}'
          then:
          - repeat:
              for_each: '{{ _pb_items }}'
              sequence:
              - variables:
                  _pbr_etype: '{{ repeat.item.get("entryType", "unknown") }}'
                  _pbr_rname: >-
                    {{ repeat.item.get('recipe', {}).get('name', '') if repeat.item.get('recipe') is mapping else repeat.item.get('title', '') }}
                  _pbr_text: '{{ repeat.item.get("text", "") | default("", true) }}'
              - variables:
                  _pbr_lead_match: '{{ _pbr_text | regex_findall("^\[PREP:([0-9]+)\]") }}'
              - if: '{{ _pbr_lead_match | length > 0 }}'
                then:
                - variables:
                    _pbr_lead_min: '{{ _pbr_lead_match[0] | int(0) }}'
                    _pbr_serving_time: '{{ _pb_serving_defaults.get(_pbr_etype, "18:00") }}'
                - variables:
                    _pbr_serving_epoch: '{{ (_pb_date ~ " " ~ _pbr_serving_time) | as_datetime | as_timestamp }}'
                - variables:
                    _pbr_start_by_epoch: '{{ _pbr_serving_epoch - (_pbr_lead_min * 60) }}'
                - variables:
                    _pb_scheduled: >-
                      {{ _pb_scheduled + [{
                        'entry_type': _pbr_etype,
                        'recipe_name': _pbr_rname,
                        'lead_time_minutes': _pbr_lead_min,
                        'serving_time': _pbr_serving_time,
                        'start_by': _pbr_start_by_epoch | timestamp_custom('%Y-%m-%d %H:%M', true),
                        'item_id': repeat.item.get('id', '')
                      }] }}
                else:
                - variables:
                    _pb_unscheduled: >-
                      {{ _pb_unscheduled + [{
                        'entry_type': _pbr_etype,
                        'recipe_name': _pbr_rname,
                        'item_id': repeat.item.get('id', '')
                      }] }}
        - variables:
            _pb_sorted: >-
              {{ _pb_scheduled | sort(attribute='start_by') | list }}
        - variables:
            final_response:
              status: success
              case: prep_brief
              date: '{{ _pb_date }}'
              scheduled: '{{ _pb_sorted }}'
              unscheduled: '{{ _pb_unscheduled }}'
              writes:
                level: none
              note: "Serving times per entry_type all derive from real household config now: breakfast/dinner from scheduler_anchors (morning start / evening start +1h — override via zen_dojotools_systemtools mode=scheduler_anchors); lunch/snack from two standalone input_datetime helpers (zen_lunch_time/zen_snack_time — override directly via Developer Tools > States, deliberately NOT part of the 6 home-mode anchors since they aren't state transitions). Falls back to 12:00/15:00 literals until those are set once. No per-entry override yet. scheduled entries have a [PREP:N] tag set via prep_schedule_set; unscheduled ones don't. start_by is serving_time minus lead_time_minutes."
        - stop: return
          response_variable: final_response

    - alias: Early exit — leftovers_to_stock
      choose:
      - conditions:
        - condition: template
          value_template: '{{ case == "leftovers_to_stock" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ safe_recipe_id == "" and safe_recipe == "" }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: leftovers_to_stock
                  message: leftovers_to_stock requires recipe_id or recipe.
            - stop: return
              response_variable: error_response
          - conditions:
            - condition: template
              value_template: '{{ (quantity | default(none) is none) and safe_fraction_remaining <= 0 }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: leftovers_to_stock
                  message: 'leftovers_to_stock requires quantity (absolute servings) or fraction_remaining (e.g. 0.5 for "half left").'
            - stop: return
              response_variable: error_response
        # ── resolve recipe, same idiom as recipes_scale/recipe_cost ──────────
        - variables:
            _lts_recipe_id: '{{ safe_recipe_id }}'
        - if: '{{ _lts_recipe_id == "" }}'
          then:
          - action: script.zen_dojotools_kitchen
            response_variable: _lts_find
            data:
              mode: run
              case: recipes_find
              search: '{{ safe_recipe }}'
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ _lts_find.get("status") != "success" }}'
              sequence:
              - stop: return
                response_variable: _lts_find
          - variables:
              _lts_find_items: >-
                {{ _lts_find.get('raw', {}).get('api', {}).get('result', {}).get('content', {}).get('items', []) if _lts_find.get('raw', {}).get('api', {}).get('result', {}).get('content') is mapping else [] }}
              _lts_matches: >-
                {{ _lts_find_items | selectattr('name', 'search', '(?i)^' ~ safe_recipe ~ '$') | list }}
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ _lts_matches | length == 0 }}'
              sequence:
              - variables:
                  error_response:
                    status: error
                    case: leftovers_to_stock
                    message: 'No exact recipe name match for "{{ safe_recipe }}". Candidates found by search: {{ _lts_find_items | map(attribute="name") | list }}'
              - stop: return
                response_variable: error_response
            - conditions:
              - condition: template
                value_template: '{{ _lts_matches | length > 1 }}'
              sequence:
              - variables:
                  error_response:
                    status: error
                    case: leftovers_to_stock
                    message: 'Recipe name "{{ safe_recipe }}" matched multiple recipes. Refuse to guess. Candidates: {{ _lts_matches | map(attribute="name") | list }}'
              - stop: return
                response_variable: error_response
          - variables:
              _lts_recipe_id: '{{ _lts_matches[0].id | default("") | string }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _lts_recipe_id == "" }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: leftovers_to_stock
                  message: Could not resolve a recipe id.
            - stop: return
              response_variable: error_response
        - action: script.zen_sutra_mealie
          response_variable: _lts_recipe_raw
          data:
            mode: run
            method: GET
            endpoint: 'recipes/{{ _lts_recipe_id }}'
            payload: '{{ none }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _lts_recipe_raw.result.status | default(200) >= 400 }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: leftovers_to_stock
                  message: 'Recipe fetch failed for id {{ _lts_recipe_id }}.'
            - stop: return
              response_variable: error_response
        - variables:
            _lts_recipe: >-
              {{ _lts_recipe_raw.result.content if _lts_recipe_raw.result.content is mapping else {} }}
            _lts_recipe_name: '{{ _lts_recipe_raw.result.content.get("name", "") if _lts_recipe_raw.result.content is mapping else "" }}'
        - variables:
            _lts_servings: >-
              {{ (_lts_recipe.get('recipeServings', 0) | float(0))
                 if (_lts_recipe.get('recipeServings', 0) | float(0)) > 0
                 else (_lts_recipe.get('recipeYieldQuantity', 0) | float(0)) }}
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ safe_fraction_remaining > 0 and _lts_servings <= 0 }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: leftovers_to_stock
                  message: 'Recipe "{{ _lts_recipe_name }}" has no recipeServings/recipeYieldQuantity set — cannot compute an amount from fraction_remaining. Pass quantity (an absolute number of servings) instead.'
            - stop: return
              response_variable: error_response
        - variables:
            _lts_amount: >-
              {{ (quantity | float(0)) if (quantity | default(none) is not none) else (_lts_servings * safe_fraction_remaining) }}
        - variables:
            _lts_product_name: '{{ _lts_recipe_name }} (leftovers)'
            _lts_best_before: '{{ (now().date() + timedelta(days=safe_shelf_life_days)).isoformat() }}'
        # ── resolve product_id ourselves first and call stock_buy_product by id when
        #    it already exists — Grocy's exact-name-match query breaks on parentheses
        #    in the name (falls through to a fuzzy match with stale/incomplete data),
        #    which stock_buy_product's own name-lookup path hits every time since this
        #    product name always ends in "(leftovers)". Bypassing it for an existing
        #    product sidesteps that without touching the shared resolution logic other
        #    cases also rely on. ──
        - action: script.zen_dojotools_inventory
          response_variable: _lts_existing_resp
          continue_on_error: true
          data:
            mode: catalog_find_product
            item: '{{ _lts_product_name }}'
        - variables:
            _lts_existing_id: >-
              {%- set _r = _lts_existing_resp.get('result', []) if _lts_existing_resp is mapping else [] -%}
              {%- set _r = _r if _r is sequence else [] -%}
              {%- set _match = _r | selectattr('name', 'equalto', _lts_product_name) | list | first | default(none) -%}
              {{ (_match.id | string) if _match is not none else none }}
        - if: '{{ _lts_existing_id is not none }}'
          then:
          - action: script.zen_dojotools_inventory
            response_variable: _lts_stock_resp
            continue_on_error: true
            data:
              mode: stock_buy_product
              product_id: '{{ _lts_existing_id }}'
              amount: '{{ _lts_amount }}'
              location: '{{ safe_location }}'
              best_before_date: '{{ _lts_best_before }}'
              note: "Leftovers from {{ _lts_recipe_name }} (recipe_id {{ _lts_recipe_id }}), booked {{ now().date().isoformat() }}."
          else:
          # --- 2026-08-09 real bug, caught live: stock_buy_product's OWN
          #     item:-name creation path does a fuzzy Grocy product search
          #     internally, not an exact match — two recipes sharing a long
          #     common name prefix ("Recipe X — Variation 1..." vs
          #     "...Variation 2...") silently booked BOTH onto the FIRST
          #     product it fuzzy-matched, mislabeling one recipe's stock as
          #     the other's. _lts_existing_id above already proved there's
          #     no EXACT match (selectattr('name','equalto',...) came back
          #     none) — so explicitly create the product first via
          #     catalog_add_product (exact name, no fuzzy resolution
          #     involved) and book by the id it returns, mirroring the
          #     already-safe by-id path above. Never call stock_buy_product
          #     with a bare item: name for a genuinely new product again. ---
          - action: script.zen_dojotools_inventory
            response_variable: _lts_create_resp
            continue_on_error: true
            data:
              mode: catalog_add_product
              item: '{{ _lts_product_name }}'
              location: '{{ safe_location }}'
          - variables:
              _lts_created_id: >-
                {{ (_lts_create_resp.result.product_id | string)
                   if (_lts_create_resp is mapping and _lts_create_resp.get('status') == 'success'
                       and _lts_create_resp.get('result', {}).get('product_id') is not none)
                   else none }}
          - action: script.zen_dojotools_inventory
            response_variable: _lts_stock_resp
            continue_on_error: true
            data:
              mode: stock_buy_product
              product_id: '{{ _lts_created_id }}'
              amount: '{{ _lts_amount }}'
              location: '{{ safe_location }}'
              best_before_date: '{{ _lts_best_before }}'
              note: "Leftovers from {{ _lts_recipe_name }} (recipe_id {{ _lts_recipe_id }}), booked {{ now().date().isoformat() }}."
        # ── one-shot retry: Grocy's own create-then-stock-add sequence sees a stale
        #    read of the product it JUST created in the same run (proven live — a
        #    second, independent call against the same product_id always succeeds
        #    immediately). Only retries this exact, known-transient failure shape,
        #    reusing the product_id Grocy's own error response already gives us. ──
        - variables:
            _lts_retry_pid: >-
              {%- set _r = _lts_stock_resp if _lts_stock_resp is mapping else {} -%}
              {{ (_r.get('product_id') | string) if (_r.get('status') == 'error' and 'qu_id_stock' in (_r.get('message', '') | string) and _r.get('product_id') is not none) else none }}
        - if: '{{ _lts_retry_pid is not none }}'
          then:
          - action: script.zen_dojotools_inventory
            response_variable: _lts_stock_resp
            continue_on_error: true
            data:
              mode: stock_buy_product
              product_id: '{{ _lts_retry_pid }}'
              amount: '{{ _lts_amount }}'
              location: '{{ safe_location }}'
              best_before_date: '{{ _lts_best_before }}'
              note: "Leftovers from {{ _lts_recipe_name }} (recipe_id {{ _lts_recipe_id }}), booked {{ now().date().isoformat() }}."
        - variables:
            _lts_ok: '{{ _lts_stock_resp is mapping and _lts_stock_resp.get("status") == "success" }}'
            final_response:
              status: '{{ "success" if _lts_ok else "error" }}'
              case: leftovers_to_stock
              recipe_id: '{{ _lts_recipe_id }}'
              recipe_name: '{{ _lts_recipe_name }}'
              product_name: '{{ _lts_product_name }}'
              amount_booked: '{{ _lts_amount }}'
              location: '{{ safe_location }}'
              best_before_date: '{{ _lts_best_before }}'
              grocy_response: '{{ _lts_stock_resp.get("result", {}) if _lts_ok else _lts_stock_resp }}'
              writes:
                level: single
              error: '{{ none if _lts_ok else "Inventory stock_buy_product failed — see grocy_response." }}'
              note: "Booked as plain stock (not spoiled) — this is the inverse of waste_log, not the same booking. best_before_date is a {{ safe_shelf_life_days }}-day starting-point default for cooked leftovers, not a food-safety certification — adjust shelf_life_days per dish if needed. Repeat calls for the same recipe add to the same '<Recipe Name> (leftovers)' product rather than creating duplicates."
        - stop: return
          response_variable: final_response

    - alias: Early exit — recipes_create_from_url
      choose:
      - conditions:
        - condition: template
          value_template: '{{ case == "recipes_create_from_url" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ safe_url == "" }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: recipes_create_from_url
                  message: recipes_create_from_url requires url.
            - stop: return
              response_variable: error_response
        - action: script.zen_sutra_mealie
          response_variable: _rcu_create_raw
          data:
            mode: run
            method: POST
            endpoint: recipes/create/url
            payload: >-
              {{ {"url": safe_url, "include_tags": safe_include_tags} | tojson }}
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _rcu_create_raw.result.status | default(200) >= 400 }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: recipes_create_from_url
                  message: "{{\n  {\n    \"mealie_api_error\": {\n      \"http_status\": _rcu_create_raw.result.status | default(''),\n      \"detail\": _rcu_create_raw.result.content.detail | default(_rcu_create_raw.result.content) | default('')\n    }\n  }\n}}"
            - stop: return
              response_variable: error_response
        - variables:
            _rcu_slug: >-
              {{ (_rcu_create_raw.result.content | string | trim | trim('"')) }}
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _rcu_slug == "" }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: recipes_create_from_url
                  message: Mealie returned an empty slug for the scraped recipe.
            - stop: return
              response_variable: error_response
        - action: script.zen_sutra_mealie
          response_variable: _rcu_get_raw
          continue_on_error: true
          data:
            mode: run
            method: GET
            endpoint: 'recipes/{{ _rcu_slug }}'
            payload: '{{ none }}'
        - variables:
            _rcu_recipe: >-
              {{ _rcu_get_raw.result.content
                 if (_rcu_get_raw is defined and _rcu_get_raw.result is mapping
                     and _rcu_get_raw.result.content is mapping)
                 else {} }}
        # --- auto-chain recipes_parse_ingredients so a scrape+import is one call
        #     end to end (was two manual calls tonight — real token savings for
        #     the calling agent). Set auto_parse=false to skip and leave
        #     ingredients freetext. Failure here is non-fatal: the recipe was
        #     still created successfully, so continue_on_error and surface
        #     whatever happened in the response rather than failing the case. ---
        - variables:
            _rcu_parse_summary: '{{ {"skipped": true, "reason": "auto_parse=false"} }}'
        - if: '{{ safe_auto_parse }}'
          then:
            - action: script.zen_dojotools_kitchen
              response_variable: _rcu_parse_resp
              continue_on_error: true
              data:
                mode: run
                case: recipes_parse_ingredients
                recipe_id: '{{ _rcu_recipe.get("id", "") }}'
            - variables:
                _rcu_parse_summary: >-
                  {{ _rcu_parse_resp.get('summary', {})
                     if (_rcu_parse_resp is defined and _rcu_parse_resp.get('status') == 'success')
                     else {'error': _rcu_parse_resp.get('message', 'ingredient parsing failed') if _rcu_parse_resp is defined else 'ingredient parsing failed'} }}
            # re-fetch so raw.api reflects post-parse structured recipeIngredient[],
            # not the pre-parse freetext snapshot from _rcu_get_raw above
            - action: script.zen_sutra_mealie
              response_variable: _rcu_get_raw
              continue_on_error: true
              data:
                mode: run
                method: GET
                endpoint: 'recipes/{{ _rcu_slug }}'
                payload: '{{ none }}'
            - variables:
                _rcu_recipe: >-
                  {{ _rcu_get_raw.result.content
                     if (_rcu_get_raw is defined and _rcu_get_raw.result is mapping
                         and _rcu_get_raw.result.content is mapping)
                     else _rcu_recipe }}
        - variables:
            final_response:
              status: success
              case: recipes_create_from_url
              slug: '{{ _rcu_slug }}'
              summary: Recipe scraped from URL, created, and ingredients parsed/matched to Mealie foods in one call.
              writes:
                level: single
              recipe:
                name: '{{ _rcu_recipe.get("name", "") }}'
                slug: '{{ _rcu_recipe.get("slug", _rcu_slug) }}'
                recipeIngredient_count: '{{ _rcu_recipe.get("recipeIngredient", []) | length }}'
              ingredient_parse: '{{ _rcu_parse_summary }}'
              raw:
                api: '{{ _rcu_get_raw }}'
        - stop: return
          response_variable: final_response
    - alias: Early exit — recipes_parse_ingredients
      choose:
      - conditions:
        - condition: template
          value_template: '{{ case == "recipes_parse_ingredients" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ safe_recipe_id == "" and safe_recipe == "" }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: recipes_parse_ingredients
                  message: recipes_parse_ingredients requires recipe_id or recipe.
            - stop: return
              response_variable: error_response
        # --- id resolution: copied near-verbatim from "Early exit — recipe_fulfillment" ---
        - variables:
            _rpi_recipe_id: '{{ safe_recipe_id }}'
        - if: '{{ _rpi_recipe_id == "" }}'
          then:
          - action: script.zen_dojotools_kitchen
            response_variable: _rpi_find
            data:
              mode: run
              case: recipes_find
              search: '{{ safe_recipe }}'
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ _rpi_find.get("status") != "success" }}'
              sequence:
              - stop: return
                response_variable: _rpi_find
          - variables:
              _rpi_find_items: >-
                {{ _rpi_find.get('raw', {}).get('api', {}).get('result', {}).get('content', {}).get('items', []) if _rpi_find.get('raw', {}).get('api', {}).get('result', {}).get('content') is mapping else [] }}
              _rpi_matches: >-
                {{ _rpi_find_items | selectattr('name', 'search', '(?i)^' ~ safe_recipe ~ '$') | list }}
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ _rpi_matches | length == 0 }}'
              sequence:
              - variables:
                  error_response:
                    status: error
                    case: recipes_parse_ingredients
                    message: 'No exact recipe name match for "{{ safe_recipe }}". Candidates found by search: {{ _rpi_find_items | map(attribute="name") | list }}'
              - stop: return
                response_variable: error_response
            - conditions:
              - condition: template
                value_template: '{{ _rpi_matches | length > 1 }}'
              sequence:
              - variables:
                  error_response:
                    status: error
                    case: recipes_parse_ingredients
                    message: 'Recipe name "{{ safe_recipe }}" matched multiple recipes. Refuse to guess. Candidates: {{ _rpi_matches | map(attribute="name") | list }}'
              - stop: return
                response_variable: error_response
          - variables:
              _rpi_recipe_id: '{{ _rpi_matches[0].id | default("") | string }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _rpi_recipe_id == "" }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: recipes_parse_ingredients
                  message: Could not resolve a recipe id.
            - stop: return
              response_variable: error_response
        - variables:
            _rpi_parser_safe: >-
              {{ safe_parser if safe_parser in ['nlp', 'brute', 'openai'] else 'nlp' }}
        # --- fetch full recipe, same idiom as recipes_get / recipe_fulfillment ---
        - action: script.zen_sutra_mealie
          response_variable: _rpi_recipe_raw
          data:
            mode: run
            method: GET
            endpoint: 'recipes/{{ _rpi_recipe_id }}'
            payload: '{{ none }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _rpi_recipe_raw.result.status | default(200) >= 400 }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: recipes_parse_ingredients
                  message: 'Recipe fetch failed for id {{ _rpi_recipe_id }}.'
            - stop: return
              response_variable: error_response
        - variables:
            _rpi_recipe: >-
              {{ _rpi_recipe_raw.result.content if _rpi_recipe_raw.result.content is mapping else {} }}
        - variables:
            _rpi_ingredients: >-
              {{ _rpi_recipe.recipeIngredient if _rpi_recipe.recipeIngredient is sequence else [] }}
            _rpi_already_structured_count: >-
              {{ _rpi_recipe.recipeIngredient | selectattr('food', 'mapping') | list | length if _rpi_recipe.recipeIngredient is sequence else 0 }}
        # --- freetext-only ingredients, keyed by original array index so results
        #     can be written back to the right position; already-structured
        #     ingredients (food is already a mapping) are never touched ---
        - variables:
            _rpi_freetext_idx: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for i in _rpi_ingredients -%}
                {%- if i.food is not mapping -%}
                  {%- set line = (i.note | default('', true) | trim) or (i.display | default('', true) | trim) -%}
                  {%- if line != '' -%}
                    {%- set ns.out = ns.out + [{'index': loop.index0, 'line': line}] -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out }}
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _rpi_freetext_idx | length == 0 }}'
            sequence:
            - variables:
                final_response:
                  status: success
                  case: recipes_parse_ingredients
                  recipe_id: '{{ _rpi_recipe_id }}'
                  recipe_name: '{{ _rpi_recipe.name | default("") }}'
                  summary:
                    parsed_count: 0
                    foods_created: []
                    foods_matched: []
                    already_structured_count: '{{ _rpi_already_structured_count }}'
                  message: No freetext-only ingredients found on this recipe — nothing to parse.
                  writes:
                    level: none
            - stop: return
              response_variable: final_response
        # --- Mealie's real ingredient parser: POST /api/parser/ingredients,
        #     {"ingredients": [...freetext...], "parser": "nlp"|"brute"|"openai"}.
        #     Response is a batch wrapper around one parsed result per input line;
        #     the exact wrapper key isn't pinned down by spec, so unwrap
        #     defensively (bare list, or a mapping with a data/items/results key). ---
        - action: script.zen_sutra_mealie
          response_variable: _rpi_parse_raw
          data:
            mode: run
            method: POST
            endpoint: parser/ingredients
            payload: >-
              {{ {"ingredients": _rpi_freetext_idx | map(attribute="line") | list, "parser": _rpi_parser_safe} | tojson }}
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _rpi_parse_raw.result.status | default(200) >= 400 }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: recipes_parse_ingredients
                  message: "{{\n  {\n    \"mealie_api_error\": {\n      \"http_status\": _rpi_parse_raw.result.status | default(''),\n      \"detail\": _rpi_parse_raw.result.content.detail | default(_rpi_parse_raw.result.content) | default('')\n    }\n  }\n}}"
            - stop: return
              response_variable: error_response
        - variables:
            _rpi_parsed_raw: '{{ _rpi_parse_raw.result.content }}'
            _rpi_parsed_list: >-
              {%- if _rpi_parse_raw.result.content is sequence and _rpi_parse_raw.result.content is not string -%}
                {{ _rpi_parse_raw.result.content }}
              {%- elif _rpi_parse_raw.result.content is mapping -%}
                {{ _rpi_parse_raw.result.content.get('data', _rpi_parse_raw.result.content.get('items', _rpi_parse_raw.result.content.get('results', []))) }}
              {%- else -%}
                {{ [] }}
              {%- endif -%}
        - variables:
            _rpi_combined: '{{ zip(_rpi_freetext_idx, _rpi_parsed_list) | list }}'
        - variables:
            _rpi_created: []
            _rpi_matched: []
            _rpi_errors: []
            _rpi_updates: '{{ {} }}'
            _rpi_needs_package_size: []
        # --- for each parsed line: resolve its plain food-name string to a real
        #     Mealie Food, exact-match-only (same "refuse to guess" precedent as
        #     recipe_fulfillment's id resolution). find-or-create idiom mirrors
        #     notes_resolve's proven pattern (direct GET foods?search=, exact
        #     selectattr match, else POST foods {"name": ...}) rather than
        #     round-tripping through this script's own foods_find/food_add cases. ---
        - repeat:
            for_each: '{{ _rpi_combined }}'
            sequence:
            - variables:
                _rpii_idx_entry: '{{ repeat.item[0] }}'
                _rpii_parsed_entry: '{{ repeat.item[1] }}'
                _rpii_ingredient: >-
                  {{ _rpii_parsed_entry.ingredient if (_rpii_parsed_entry is mapping and _rpii_parsed_entry.ingredient is mapping) else (_rpii_parsed_entry if _rpii_parsed_entry is mapping else {}) }}
            - variables:
                # Mealie's nlp parser returns a FULLY RESOLVED object (with a real
                # 'id') for unit/food when it matches an existing Mealie Unit/Food
                # record, or a bare string when it only extracted freetext with no
                # DB match. Handle both shapes — confirmed live via a real 422 error
                # showing full Unit objects inline, contradicting the "always a
                # plain name string" assumption from public docs research.
                _rpii_food_raw: '{{ _rpii_ingredient.food | default(none) }}'
                _rpii_unit_raw: '{{ _rpii_ingredient.unit | default(none) }}'
                _rpii_quantity: '{{ _rpii_ingredient.quantity | default(0) }}'
            - variables:
                _rpii_food_resolved_id: >-
                  {{ _rpii_food_raw.id if (_rpii_food_raw is mapping and _rpii_food_raw.id is defined) else none }}
                _rpii_food_name: >-
                  {{ (_rpii_food_raw.name if _rpii_food_raw is mapping else _rpii_food_raw) | default('', true) | string | trim }}
                _rpii_unit_resolved_id: >-
                  {{ _rpii_unit_raw.id if (_rpii_unit_raw is mapping and _rpii_unit_raw.id is defined) else none }}
                _rpii_unit_resolved_name: >-
                  {{ _rpii_unit_raw.name if (_rpii_unit_raw is mapping and _rpii_unit_raw.name is defined) else '' }}
            - variables:
                _rpii_food_id: '{{ _rpii_food_resolved_id }}'
            - if: '{{ _rpii_food_resolved_id is not none }}'
              then:
                - variables:
                    _rpi_matched: '{{ _rpi_matched + [_rpii_food_name] }}'
            - if: '{{ _rpii_food_id is none and _rpii_food_name == "" }}'
              then:
                - variables:
                    _rpi_errors: '{{ _rpi_errors + [{"line": _rpii_idx_entry.line, "error": "parser returned no food name"}] }}'
            - if: '{{ _rpii_food_id is none and _rpii_food_name != "" }}'
              then:
                - action: script.zen_sutra_mealie
                  response_variable: _rpii_food_search_raw
                  continue_on_error: true
                  data:
                    mode: run
                    method: GET
                    endpoint: foods
                    payload: '{{ none }}'
                    pageNumber: 1
                    perPage: 50
                    additional_params: '{{ {"search": _rpii_food_name} }}'
                - variables:
                    _rpii_food_results: >-
                      {{ _rpii_food_search_raw.result.content.get('items', [])
                         if (_rpii_food_search_raw is defined and _rpii_food_search_raw.result.content is mapping) else [] }}
                    _rpii_food_exact: >-
                      {{ _rpii_food_results | selectattr('name', 'equalto', _rpii_food_name) | list | first | default(none) }}
                - if: '{{ _rpii_food_exact is not none }}'
                  then:
                    - variables:
                        _rpii_food_id: '{{ _rpii_food_exact.id }}'
                        _rpi_matched: '{{ _rpi_matched + [_rpii_food_name] }}'
                  else:
                    - action: script.zen_sutra_mealie
                      response_variable: _rpii_food_create_raw
                      continue_on_error: true
                      data:
                        mode: run
                        method: POST
                        endpoint: foods
                        payload: '{{ {"name": _rpii_food_name} | tojson }}'
                    - variables:
                        _rpii_food_id: >-
                          {{ _rpii_food_create_raw.result.content.id
                             if (_rpii_food_create_raw is defined and _rpii_food_create_raw.result.content is mapping) else none }}
                    # --- GROCY SYNC (Radar-adjacent fix, 2026-08-09, caught
                    #     live: 5 foods created here had zero Grocy link,
                    #     silently unresolvable by recipe_consume forever).
                    #     food_add's own Grocy sync ('Grocy sync on food
                    #     write' below) only fires for case in
                    #     ['food_add','food_update'] — this branch creates
                    #     Mealie foods via a raw POST that never touches
                    #     that shared block. Mirrors the same find-or-create
                    #     idiom: exact-match an existing Grocy product first,
                    #     else create one, then write grocy_product_id back
                    #     onto the Mealie food via foods_tag. Best-effort —
                    #     continue_on_error, never blocks the ingredient
                    #     parse itself if Inventory is unavailable. ---
                    - if: '{{ _rpii_food_id is not none }}'
                      then:
                        - action: script.zen_dojotools_inventory
                          response_variable: _rpii_grocy_find
                          continue_on_error: true
                          data:
                            mode: catalog_find_product
                            item: '{{ _rpii_food_name }}'
                        - variables:
                            _rpii_grocy_exact: >-
                              {%- set _gr = _rpii_grocy_find.result if (_rpii_grocy_find is mapping and _rpii_grocy_find.result is sequence) else [] -%}
                              {{ _gr | selectattr('name', 'equalto', _rpii_food_name) | list | first | default(none) }}
                        - if: '{{ _rpii_grocy_exact is none }}'
                          then:
                            - action: script.zen_dojotools_inventory
                              response_variable: _rpii_grocy_create
                              continue_on_error: true
                              data:
                                mode: catalog_add_product
                                item: '{{ _rpii_food_name }}'
                                location: Pantry
                        - variables:
                            _rpii_grocy_product_id: >-
                              {{ _rpii_grocy_exact.id if _rpii_grocy_exact is not none
                                 else (_rpii_grocy_create.result.product_id
                                       if (_rpii_grocy_create is defined and _rpii_grocy_create is mapping
                                           and _rpii_grocy_create.get('status') == 'success')
                                       else none) }}
                        - if: '{{ _rpii_grocy_product_id is not none }}'
                          then:
                            - action: script.zen_dojotools_kitchen
                              continue_on_error: true
                              data:
                                mode: run
                                case: foods_tag
                                item_id: '{{ _rpii_food_id }}'
                                grocy_product_id: '{{ _rpii_grocy_product_id }}'
                        # --- PACKAGE-SIZE FLAG (2026-08-09, "bake it in — help
                        #     those who come after"). A brand-new Grocy
                        #     product (never catalog_add_product'd before
                        #     this exact call) starts with no unit_conversions
                        #     entry — if this ingredient's own unit is a real
                        #     measured unit (gram/teaspoon/etc, not a bare
                        #     count), recipe_consume WILL hit needs_manual_check
                        #     for it later unless someone adds the real
                        #     package-size conversion now, at the one moment
                        #     the ingredient context is actually in hand.
                        #     Surfaced in the top-level response so whichever
                        #     agent is driving asks "what size do you buy
                        #     this in?" right here instead of discovering the
                        #     gap during a later recipe_consume failure. ---
                        - if: '{{ _rpii_grocy_exact is none and _rpii_grocy_product_id is not none and _rpii_unit_resolved_name | trim != "" }}'
                          then:
                            - variables:
                                _rpi_needs_package_size: '{{ _rpi_needs_package_size + [{"name": _rpii_food_name, "grocy_product_id": _rpii_grocy_product_id, "recipe_unit": _rpii_unit_resolved_name}] }}'
                    - if: '{{ _rpii_food_id is none }}'
                      then:
                        - variables:
                            _rpi_errors: '{{ _rpi_errors + [{"line": _rpii_idx_entry.line, "error": "could not find or create Mealie food"}] }}'
                      else:
                        - variables:
                            _rpi_created: '{{ _rpi_created + [_rpii_food_name] }}'
            - if: '{{ _rpii_food_id is not none }}'
              then:
                - variables:
                    _rpi_updates: >-
                      {{ _rpi_updates | combine({_rpii_idx_entry.index | string: {
                        'quantity': _rpii_quantity,
                        'unit': ({'id': _rpii_unit_resolved_id, 'name': _rpii_unit_resolved_name} if _rpii_unit_resolved_id is not none else none),
                        'food': {'id': _rpii_food_id, 'name': _rpii_food_name},
                        'note': _rpii_idx_entry.line
                      }}) }}
        # --- rebuild recipeIngredient[]: only positions in _rpi_updates change,
        #     everything else (already-structured or unparseable) is preserved
        #     exactly as-is in its original array position ---
        - variables:
            _rpi_new_ingredients: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for i in _rpi_ingredients -%}
                {%- set key = loop.index0 | string -%}
                {%- if key in _rpi_updates -%}
                  {%- set upd = _rpi_updates[key] -%}
                  {%- set merged = i | combine({
                    'quantity': upd.quantity,
                    'unit': upd.unit,
                    'food': upd.food,
                    'note': upd.note
                  }) -%}
                  {%- set ns.out = ns.out + [merged] -%}
                {%- else -%}
                  {%- set ns.out = ns.out + [i] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out }}
        # --- PUT the full recipe back, same endpoint/method idiom as recipes_update ---
        - action: script.zen_sutra_mealie
          response_variable: _rpi_put_raw
          data:
            mode: run
            method: PUT
            endpoint: 'recipes/{{ _rpi_recipe_id }}'
            payload: '{{ _rpi_recipe | combine({"recipeIngredient": _rpi_new_ingredients}) | tojson }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _rpi_put_raw.result.status | default(200) >= 400 }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: recipes_parse_ingredients
                  message: "{{\n  {\n    \"mealie_api_error\": {\n      \"http_status\": _rpi_put_raw.result.status | default(''),\n      \"detail\": _rpi_put_raw.result.content.detail | default(_rpi_put_raw.result.content) | default('')\n    }\n  }\n}}"
            - stop: return
              response_variable: error_response
        - variables:
            final_response:
              status: success
              case: recipes_parse_ingredients
              recipe_id: '{{ _rpi_recipe_id }}'
              recipe_name: '{{ _rpi_recipe.name | default("") }}'
              summary:
                parsed_count: '{{ _rpi_freetext_idx | length }}'
                foods_created: '{{ _rpi_created }}'
                foods_matched: '{{ _rpi_matched }}'
                already_structured_count: '{{ _rpi_already_structured_count }}'
                errors: '{{ _rpi_errors }}'
              needs_package_size: >-
                {{ _rpi_needs_package_size if (_rpi_needs_package_size | count) > 0 else none }}
              needs_package_size_note: >-
                {%- if (_rpi_needs_package_size | count) > 0 -%}
                  New Grocy product(s) created for a real measured unit (not a bare count) — recipe_consume will hit needs_manual_check for these later unless a package-size conversion is added now. Ask "what size do you buy this in?" and call zen_dojotools_inventory mode=unit_conversions_add for each before this recipe is actually cooked.
                {%- else -%}
                  {{ none }}
                {%- endif -%}
              writes:
                level: single
        - stop: return
          response_variable: final_response
    # --- recipes_update: always fetch live state and shallow-merge the caller's
    #     payload on top of it before PUT — never trust a hand-built/partial body
    #     as the full replacement. A blind full-body PUT (recipe_id supplied,
    #     payload missing/altering fields Mealie's schema needs) destroyed a real
    #     recipe in production on 2026-07-20: the PUT returned a 500
    #     ValidationError but had already applied a destructive replace before
    #     validating the response, leaving the recipe permanently gone (a Mealie
    #     API bug, not recoverable from our side after the fact). This merge
    #     step is the actual fix: whatever the caller doesn't mention in payload
    #     is preserved byte-for-byte from the live GET, so an incomplete payload
    #     can never wipe untouched fields. Same idiom as recipes_parse_ingredients
    #     above (GET -> combine() -> PUT), just merging the caller's payload
    #     instead of a computed ingredient list. ---
    - alias: Early exit — recipes_update
      choose:
      - conditions:
        - condition: template
          value_template: '{{ case == "recipes_update" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ safe_recipe_id == "" and safe_recipe == "" }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: recipes_update
                  message: recipes_update requires recipe_id or recipe.
            - stop: return
              response_variable: error_response
        - variables:
            _ru_recipe_id: '{{ safe_recipe_id }}'
        - if: '{{ _ru_recipe_id == "" }}'
          then:
          - action: script.zen_dojotools_kitchen
            response_variable: _ru_find
            data:
              mode: run
              case: recipes_find
              search: '{{ safe_recipe }}'
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ _ru_find.get("status") != "success" }}'
              sequence:
              - stop: return
                response_variable: '{{ _ru_find }}'
          - variables:
              _ru_find_items: >-
                {{ _ru_find.get('raw', {}).get('api', {}).get('result', {}).get('content', {}).get('items', []) if _ru_find.get('raw', {}).get('api', {}).get('result', {}).get('content') is mapping else [] }}
              _ru_matches: >-
                {{ _ru_find_items | selectattr('name', 'search', '(?i)^' ~ safe_recipe ~ '$') | list }}
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ _ru_matches | length != 1 }}'
              sequence:
              - variables:
                  error_response:
                    status: error
                    case: recipes_update
                    message: "{{\n  'No exact recipe name match for ' ~ safe_recipe ~ ' (' ~ (_ru_matches | length) ~ ' candidates) — refusing to guess. Use recipe_id instead.'\n}}"
              - stop: return
                response_variable: error_response
          - variables:
              _ru_recipe_id: '{{ _ru_matches[0].id | default("") | string }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _ru_recipe_id == "" }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: recipes_update
                  message: Could not resolve a recipe id.
            - stop: return
              response_variable: error_response
        - choose:
          - conditions:
            - condition: template
              value_template: "{{\n  (safe_payload is not mapping) and (safe_payload | default('') | trim == '')\n}}\n"
            sequence:
            - variables:
                error_response:
                  status: error
                  case: recipes_update
                  message: recipes_update requires a non-empty payload.
            - stop: return
              response_variable: error_response
        - variables:
            _ru_payload_parsed: '{{ safe_payload if safe_payload is mapping else (safe_payload | from_json) }}'
        - action: script.zen_sutra_mealie
          response_variable: _ru_get_raw
          data:
            mode: run
            method: GET
            endpoint: 'recipes/{{ _ru_recipe_id }}'
            payload: '{{ none }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _ru_get_raw.result.status | default(200) >= 400 }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: recipes_update
                  message: "{{\n  {\n    \"mealie_api_error\": {\n      \"http_status\": _ru_get_raw.result.status | default(''),\n      \"detail\": _ru_get_raw.result.content.detail | default(_ru_get_raw.result.content) | default('')\n    }\n  }\n}}"
            - stop: return
              response_variable: error_response
        - variables:
            _ru_recipe: '{{ _ru_get_raw.result.content if _ru_get_raw.result.content is mapping else {} }}'
        - variables:
            _ru_merged: '{{ _ru_recipe | combine(_ru_payload_parsed) }}'
        # --- FOOD-REFERENCE HYDRATION (2026-08-09) — Mealie's
        #     recipeIngredient[].food is a full nested IngredientFood object,
        #     not a foreign key: a caller-supplied {"food": {"id": "<uuid>"}}
        #     (the natural, efficient way to link an ingredient to an EXISTING
        #     structured food by id) fails PUT with a 422 — Mealie's schema
        #     requires 'name' (and other fields) on that object, confirmed
        #     live: "Field required" at food.name for exactly this shape. Fix:
        #     detect any recipeIngredient[].food that has an id but no name,
        #     GET the real food record for each UNIQUE id needing it (deduped,
        #     same idiom as notes_promote's food-search loop above), and
        #     replace the partial stub with the full record before the PUT —
        #     the caller only ever has to supply the id. Freetext ingredients
        #     (food: null, just a note) were never affected — confirmed live,
        #     single AND bulk freetext updates already worked before this fix.
        - variables:
            _ru_ing_list: '{{ _ru_merged.get("recipeIngredient", []) if _ru_merged.recipeIngredient is sequence else [] }}'
            _ru_food_ids_to_hydrate: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for ing in _ru_ing_list -%}
                {%- if ing.food is mapping and (ing.food.get('id','') | trim) != '' and (ing.food.get('name','') | trim) == '' and ing.food.id not in ns.out -%}
                  {%- set ns.out = ns.out + [ing.food.id] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out }}
        - if: '{{ (_ru_food_ids_to_hydrate | count) > 0 }}'
          then:
            - variables:
                _ru_hydrated_foods_list: []
            - repeat:
                for_each: '{{ _ru_food_ids_to_hydrate }}'
                sequence:
                  - action: script.zen_sutra_mealie
                    response_variable: _ru_food_get_raw
                    continue_on_error: true
                    data:
                      mode: run
                      method: GET
                      endpoint: 'foods/{{ repeat.item }}'
                      payload: '{{ none }}'
                  - variables:
                      _ru_hydrated_foods_list: >-
                        {{ (_ru_hydrated_foods_list + [_ru_food_get_raw.result.content])
                           if (_ru_food_get_raw.result.content is mapping and (_ru_food_get_raw.result.status | default(200)) < 400)
                           else _ru_hydrated_foods_list }}
            - variables:
                _ru_hydrated_foods_map: >-
                  {%- set ns = namespace(out={}) -%}
                  {%- for f in _ru_hydrated_foods_list -%}
                    {%- set ns.out = ns.out | combine({f.id: f}) -%}
                  {%- endfor -%}
                  {{ ns.out }}
            - variables:
                _ru_ing_list: >-
                  {%- set ns = namespace(out=[]) -%}
                  {%- for ing in _ru_ing_list -%}
                    {%- if ing.food is mapping and (ing.food.get('id','') | trim) != '' and ing.food.id in _ru_hydrated_foods_map -%}
                      {%- set ns.out = ns.out + [ing | combine({'food': _ru_hydrated_foods_map[ing.food.id]})] -%}
                    {%- else -%}
                      {%- set ns.out = ns.out + [ing] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ ns.out }}
            - variables:
                _ru_merged: '{{ _ru_merged | combine({"recipeIngredient": _ru_ing_list}) }}'
        - action: script.zen_sutra_mealie
          response_variable: _ru_put_raw
          data:
            mode: run
            method: PUT
            endpoint: 'recipes/{{ _ru_recipe_id }}'
            payload: '{{ _ru_merged | tojson }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _ru_put_raw.result.status | default(200) >= 400 }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: recipes_update
                  message: "{{\n  {\n    \"mealie_api_error\": {\n      \"http_status\": _ru_put_raw.result.status | default(''),\n      \"detail\": _ru_put_raw.result.content.detail | default(_ru_put_raw.result.content) | default('')\n    }\n  }\n}}"
            - stop: return
              response_variable: error_response
        - variables:
            final_response:
              status: success
              case: recipes_update
              recipe_id: '{{ _ru_recipe_id }}'
              recipe_name: '{{ _ru_merged.name | default("") }}'
              fields_changed: '{{ _ru_payload_parsed.keys() | list if _ru_payload_parsed is mapping else [] }}'
              writes:
                level: single
        - stop: return
          response_variable: final_response
    # --- cookbooks_update / organizers_update: same GET->combine()->PUT safety
    #     net as recipes_update above. cookbooks_update was wired earlier this
    #     session with a blind safe_payload passthrough (the exact pattern that
    #     just destroyed a recipe) — closing it before it gets used the same way.
    #     organizers_update never had a working payload wire-up (fell through to
    #     `none`); fixing it properly here rather than re-introducing the unsafe
    #     passthrough it was missing. ---
    - alias: Early exit — cookbooks_update
      choose:
      - conditions:
        - condition: template
          value_template: '{{ case == "cookbooks_update" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ safe_item_id == "" }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: cookbooks_update
                  message: cookbooks_update requires item_id.
            - stop: return
              response_variable: error_response
          - conditions:
            - condition: template
              value_template: "{{\n  (safe_payload is not mapping) and (safe_payload | default('') | trim == '')\n}}\n"
            sequence:
            - variables:
                error_response:
                  status: error
                  case: cookbooks_update
                  message: cookbooks_update requires a non-empty payload.
            - stop: return
              response_variable: error_response
        - variables:
            _cbu_payload_parsed: '{{ safe_payload if safe_payload is mapping else (safe_payload | from_json) }}'
        - action: script.zen_sutra_mealie
          response_variable: _cbu_get_raw
          data:
            mode: run
            method: GET
            endpoint: 'households/cookbooks/{{ safe_item_id }}'
            payload: '{{ none }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _cbu_get_raw.result.status | default(200) >= 400 }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: cookbooks_update
                  message: "{{\n  {\n    \"mealie_api_error\": {\n      \"http_status\": _cbu_get_raw.result.status | default(''),\n      \"detail\": _cbu_get_raw.result.content.detail | default(_cbu_get_raw.result.content) | default('')\n    }\n  }\n}}"
            - stop: return
              response_variable: error_response
        - variables:
            _cbu_cookbook: '{{ _cbu_get_raw.result.content if _cbu_get_raw.result.content is mapping else {} }}'
        - variables:
            _cbu_merged: '{{ _cbu_cookbook | combine(_cbu_payload_parsed) }}'
        - action: script.zen_sutra_mealie
          response_variable: _cbu_put_raw
          data:
            mode: run
            method: PUT
            endpoint: 'households/cookbooks/{{ safe_item_id }}'
            payload: '{{ _cbu_merged | tojson }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _cbu_put_raw.result.status | default(200) >= 400 }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: cookbooks_update
                  message: "{{\n  {\n    \"mealie_api_error\": {\n      \"http_status\": _cbu_put_raw.result.status | default(''),\n      \"detail\": _cbu_put_raw.result.content.detail | default(_cbu_put_raw.result.content) | default('')\n    }\n  }\n}}"
            - stop: return
              response_variable: error_response
        - variables:
            final_response:
              status: success
              case: cookbooks_update
              item_id: '{{ safe_item_id }}'
              name: '{{ _cbu_merged.name | default("") }}'
              fields_changed: '{{ _cbu_payload_parsed.keys() | list if _cbu_payload_parsed is mapping else [] }}'
              writes:
                level: single
        - stop: return
          response_variable: final_response
    - alias: Early exit — organizers_update
      choose:
      - conditions:
        - condition: template
          value_template: '{{ case == "organizers_update" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ safe_organizer_type not in ["categories","tags","tools"] }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: organizers_update
                  message: 'Invalid organizer_type. Allowed: categories, tags, tools.'
            - stop: return
              response_variable: error_response
          - conditions:
            - condition: template
              value_template: '{{ safe_item_id == "" }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: organizers_update
                  message: organizers_update requires item_id.
            - stop: return
              response_variable: error_response
          - conditions:
            - condition: template
              value_template: "{{\n  (safe_payload is not mapping) and (safe_payload | default('') | trim == '')\n}}\n"
            sequence:
            - variables:
                error_response:
                  status: error
                  case: organizers_update
                  message: organizers_update requires a non-empty payload.
            - stop: return
              response_variable: error_response
        - variables:
            _oru_payload_parsed: '{{ safe_payload if safe_payload is mapping else (safe_payload | from_json) }}'
        - action: script.zen_sutra_mealie
          response_variable: _oru_get_raw
          data:
            mode: run
            method: GET
            endpoint: 'organizers/{{ safe_organizer_type }}/{{ safe_item_id }}'
            payload: '{{ none }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _oru_get_raw.result.status | default(200) >= 400 }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: organizers_update
                  message: "{{\n  {\n    \"mealie_api_error\": {\n      \"http_status\": _oru_get_raw.result.status | default(''),\n      \"detail\": _oru_get_raw.result.content.detail | default(_oru_get_raw.result.content) | default('')\n    }\n  }\n}}"
            - stop: return
              response_variable: error_response
        - variables:
            _oru_item: '{{ _oru_get_raw.result.content if _oru_get_raw.result.content is mapping else {} }}'
        - variables:
            _oru_merged: '{{ _oru_item | combine(_oru_payload_parsed) }}'
        - action: script.zen_sutra_mealie
          response_variable: _oru_put_raw
          data:
            mode: run
            method: PUT
            endpoint: 'organizers/{{ safe_organizer_type }}/{{ safe_item_id }}'
            payload: '{{ _oru_merged | tojson }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _oru_put_raw.result.status | default(200) >= 400 }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: organizers_update
                  message: "{{\n  {\n    \"mealie_api_error\": {\n      \"http_status\": _oru_put_raw.result.status | default(''),\n      \"detail\": _oru_put_raw.result.content.detail | default(_oru_put_raw.result.content) | default('')\n    }\n  }\n}}"
            - stop: return
              response_variable: error_response
        - variables:
            final_response:
              status: success
              case: organizers_update
              item_id: '{{ safe_item_id }}'
              organizer_type: '{{ safe_organizer_type }}'
              name: '{{ _oru_merged.name | default("") }}'
              fields_changed: '{{ _oru_payload_parsed.keys() | list if _oru_payload_parsed is mapping else [] }}'
              writes:
                level: single
        - stop: return
          response_variable: final_response
    - alias: Early exit — all_lists_sync
      choose:
      - conditions:
        - condition: template
          value_template: '{{ case == "all_lists_sync" }}'
        sequence:
        - variables:
            _als_household: '{{ states("sensor.zen_default_household_cabinet_resolved") }}'
        - action: script.zen_dojotools_filecabinet
          response_variable: _als_prefs_raw
          continue_on_error: true
          data:
            action_type: read
            volume_entity_id: '{{ _als_household }}'
            key: kitchen_sync
        - variables:
            _als_prefs_r: >-
              {%- set r = _als_prefs_raw.get('result', {}) if _als_prefs_raw is mapping else {} -%}
              {%- set r = r | from_json if r is string else (r if r is mapping else {}) -%}
              {%- set raw = r.get('kitchen_sync', {}) -%}
              {%- set raw = raw if raw is mapping else (raw | from_json if raw is string else {}) -%}
              {%- set v = raw.get('value', raw) if raw is mapping else {} -%}
              {{ v if v is mapping else (v | from_json if v is string else {}) }}
        - variables:
            _als_prefs: '{{ _als_prefs_r if _als_prefs_r is mapping else {} }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ (_als_prefs == {} or _als_prefs is none) and _als_household != "" }}'
            sequence:
            - action: script.zen_dojotools_filecabinet
              continue_on_error: true
              data:
                action_type: create
                volume_entity_id: '{{ _als_household }}'
                key: kitchen_sync
                value: '{"include_notes": true, "default_location": "Pantry", "default_unit": "each"}'
                set_timestamp: true
                label_input: kitchen_sync, zen_household
            - variables:
                _als_prefs:
                  include_notes: true
                  default_location: Pantry
                  default_unit: each
        - variables:
            _als_apply: '{{ safe_sync_mode != "preview" }}'
            _als_include_notes: >-
              {{ _als_prefs.get('include_notes', true) if _als_prefs is mapping else true }}
            _als_def_loc: >-
              {{ _als_prefs.get('default_location', 'Pantry') if _als_prefs is mapping else 'Pantry' }}
            _als_def_unit: >-
              {{ _als_prefs.get('default_unit', 'each') if _als_prefs is mapping else 'each' }}
        - action: script.zen_sutra_mealie
          response_variable: _als_lists_raw
          data:
            mode: run
            method: GET
            endpoint: households/shopping/lists
            payload: '{{ none }}'
            pageNumber: 1
            perPage: 50
        - variables:
            _als_all: >-
              {{
                _als_lists_raw.result.content.get('items', [])
                if _als_lists_raw.result.content is mapping else []
              }}
        - variables:
            _als_linked: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for sl in _als_all -%}
                {%- set ex = sl.extras if sl.extras is mapping else {} -%}
                {%- set gid = ex.get('grocy_list_id', none) -%}
                {%- if gid is not none and (gid | string | trim) != '' -%}
                  {%- set ns.out = ns.out + [{'id': sl.id, 'name': sl.name, 'grocy_list_id': gid}] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out }}
            _als_results: []
        - repeat:
            for_each: '{{ _als_linked }}'
            sequence:
            - variables:
                _als_lid: '{{ repeat.item.id }}'
                _als_lname: '{{ repeat.item.name }}'
                _als_lgid: '{{ repeat.item.grocy_list_id }}'
            - action: script.zen_sutra_mealie
              response_variable: _als_full_raw
              continue_on_error: true
              data:
                mode: run
                method: GET
                endpoint: 'households/shopping/lists/{{ _als_lid }}'
                payload: '{{ none }}'
            - variables:
                _als_full: >-
                  {{ _als_full_raw.result.content
                     if _als_full_raw.result.content is mapping else {} }}
                _als_ex: '{{ _als_full.extras if _als_full.extras is mapping else {} }}'
                _als_items: '{{ _als_full.listItems if _als_full.listItems is sequence else [] }}'
            - variables:
                _als_ready: >-
                  {%- set ns = namespace(out=[]) -%}
                  {%- for i in _als_items -%}
                    {%- if not i.checked -%}
                      {%- set food = i.food if i.food is mapping else none -%}
                      {%- set fid = i.foodId if i.foodId is string and i.foodId | trim != '' else none -%}
                      {%- if fid is not none and food is not none -%}
                        {%- set gpid = food.extras.get('grocy_product_id', none) if food.extras is mapping else none -%}
                        {%- if gpid is not none and (gpid | string | trim) != '' -%}
                          {%- set disp = (i.note | default('', true) | trim) or (i.display | default('', true) | trim) -%}
                          {%- set ns.out = ns.out + [{'display': disp, 'grocy_product_id': gpid | int, 'quantity': i.quantity | default(1) | float}] -%}
                        {%- endif -%}
                      {%- endif -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ ns.out }}
                _als_notes: >-
                  {%- if _als_include_notes -%}
                    {%- set ns = namespace(out=[]) -%}
                    {%- for i in _als_items -%}
                      {%- if not i.checked and (not i.foodId or i.foodId is none) -%}
                        {%- set disp = (i.note | default('', true) | trim) or (i.display | default('', true) | trim) -%}
                        {%- if disp != '' -%}
                          {%- set ns.out = ns.out + [{'display': disp, 'quantity': i.quantity | default(1) | float}] -%}
                        {%- endif -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {{ ns.out }}
                  {%- else -%}
                    []
                  {%- endif -%}
            - variables:
                _als_synced: []
                _als_notes_synced: []
                _als_errors: []
            - choose:
              - conditions:
                - condition: template
                  value_template: '{{ _als_apply }}'
                sequence:
                - repeat:
                    for_each: '{{ _als_ready }}'
                    sequence:
                    - action: script.zen_dojotools_inventory
                      response_variable: _als_radd
                      continue_on_error: true
                      data:
                        mode: shopping_add_product
                        product_id: '{{ repeat.item.grocy_product_id }}'
                        list_id: '{{ _als_lgid | int }}'
                        amount: '{{ repeat.item.quantity }}'
                    - choose:
                      - conditions:
                        - condition: template
                          value_template: '{{ _als_radd is mapping and (_als_radd.status | default("")) == "success" }}'
                        sequence:
                        - variables:
                            _als_synced: '{{ _als_synced + [repeat.item.display] }}'
                      - conditions:
                        - condition: template
                          value_template: '{{ true }}'
                        sequence:
                        - variables:
                            _als_errors: '{{ _als_errors + [repeat.item.display] }}'
                - repeat:
                    for_each: '{{ _als_notes }}'
                    sequence:
                    - action: script.zen_dojotools_inventory
                      response_variable: _als_nfind
                      continue_on_error: true
                      data:
                        mode: catalog_find_product
                        item: '{{ repeat.item.display }}'
                        report_inventory: false
                    - variables:
                        _als_nreal: >-
                          {{ _als_nfind.result | default([]) | selectattr('name','defined') | list }}
                        _als_nexact: >-
                          {%- set m = _als_nreal | selectattr('name','equalto', repeat.item.display) | list -%}
                          {{ m[0].id if m | length > 0 else none }}
                    - choose:
                      - conditions:
                        - condition: template
                          value_template: '{{ _als_nexact is not none }}'
                        sequence:
                        - action: script.zen_dojotools_inventory
                          response_variable: _als_nadd
                          continue_on_error: true
                          data:
                            mode: shopping_add_product
                            product_id: '{{ _als_nexact | int }}'
                            list_id: '{{ _als_lgid | int }}'
                            amount: '{{ repeat.item.quantity }}'
                        - variables:
                            _als_notes_synced: '{{ _als_notes_synced + [repeat.item.display] }}'
                      - conditions:
                        - condition: template
                          value_template: '{{ (_als_nfind.status | default("")) == "success" and (_als_nreal | length) == 0 }}'
                        sequence:
                        - action: script.zen_dojotools_inventory
                          response_variable: _als_ncreate
                          continue_on_error: true
                          data:
                            mode: catalog_add_product
                            item: '{{ repeat.item.display }}'
                            location: '{{ _als_def_loc }}'
                            unit: '{{ _als_def_unit }}'
                        - variables:
                            _als_nnew: >-
                              {{ _als_ncreate.result.product_id | default(none)
                                 if (_als_ncreate is mapping and _als_ncreate.result is mapping)
                                 else none }}
                        - choose:
                          - conditions:
                            - condition: template
                              value_template: '{{ _als_nnew is not none }}'
                            sequence:
                            - action: script.zen_dojotools_inventory
                              response_variable: _als_nadd2
                              continue_on_error: true
                              data:
                                mode: shopping_add_product
                                product_id: '{{ _als_nnew | int }}'
                                list_id: '{{ _als_lgid | int }}'
                                amount: '{{ repeat.item.quantity }}'
                            - variables:
                                _als_notes_synced: '{{ _als_notes_synced + [repeat.item.display] }}'
                - action: script.zen_sutra_mealie
                  response_variable: _als_stamp
                  continue_on_error: true
                  data:
                    mode: run
                    method: PUT
                    endpoint: 'households/shopping/lists/{{ _als_lid }}'
                    payload: '{{ _als_full | combine({"extras": _als_ex | combine({"grocy_list_id": _als_lgid | string, "last_synced_at": now().isoformat(), "last_ready_count": _als_ready | length | string, "last_total_count": _als_items | length | string})}) | tojson }}'
            - variables:
                _als_results: >-
                  {{ _als_results + [{'list': _als_lname, 'synced': _als_synced | length, 'notes_synced': _als_notes_synced | length, 'errors': _als_errors | length, 'would_sync': _als_ready | length, 'would_sync_notes': _als_notes | length}] }}
        - variables:
            _als_total_synced: '{{ _als_results | sum(attribute="synced") }}'
            _als_total_errors: '{{ _als_results | sum(attribute="errors") }}'
            _als_error_lists: >-
              {{ _als_results | selectattr("errors", "gt", 0) | map(attribute="list") | list }}
        - variables:
            _als_summary:
              status: '{{ "errors" if (_als_total_errors | int) > 0 else "ok" }}'
              last_run_at: '{{ now().isoformat() }}'
              mode: '{{ "apply" if _als_apply else "preview" }}'
              lists_processed: '{{ _als_linked | length }}'
              total_synced: '{{ _als_total_synced }}'
              total_errors: '{{ _als_total_errors }}'
              error_lists: '{{ _als_error_lists }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _als_household != "" and _als_apply }}'
            sequence:
            - action: script.zen_dojotools_filecabinet
              response_variable: _als_write_resp
              continue_on_error: true
              data:
                action_type: update
                force_action: true
                volume_entity_id: '{{ _als_household }}'
                key: kitchen_sync_last_run
                value: '{{ _als_summary | tojson }}'
                set_timestamp: true
            - choose:
              - conditions:
                - condition: template
                  value_template: >-
                    {{ not (_als_write_resp is mapping
                       and (_als_write_resp.get('success') == true
                            or (_als_write_resp.get('status', '') | string | lower) == 'success')) }}
                sequence:
                - action: script.zen_dojotools_filecabinet
                  continue_on_error: true
                  data:
                    action_type: create
                    volume_entity_id: '{{ _als_household }}'
                    key: kitchen_sync_last_run
                    value: '{{ _als_summary | tojson }}'
                    set_timestamp: true
                    label_input: kitchen_sync, zen_household
        - variables:
            final_response:
              status: success
              case: all_lists_sync
              mode: '{{ "apply" if _als_apply else "preview" }}'
              lists_processed: '{{ _als_linked | length }}'
              results: '{{ _als_results }}'
              summary: '{{ _als_summary }}'
              prefs_used:
                include_notes: '{{ _als_include_notes }}'
                default_location: '{{ _als_def_loc }}'
                default_unit: '{{ _als_def_unit }}'
              writes:
                level: batch
        - stop: return
          response_variable: final_response
    - alias: Early exit — ambiguous_review
      choose:
      - conditions:
        - condition: template
          value_template: '{{ case == "ambiguous_review" }}'
        sequence:
        - variables:
            _ar_household: '{{ states("sensor.zen_default_household_cabinet_resolved") }}'
            _ar_limit: '{{ sync_limit | default(10) | int }}'
        - action: script.zen_dojotools_filecabinet
          response_variable: _ar_raw
          continue_on_error: true
          data:
            action_type: read
            volume_entity_id: '{{ _ar_household }}'
            key: kitchen_sync_ambiguous_queue
        - variables:
            _ar_parsed: >-
              {%- set r = _ar_raw.get('result', {}) if _ar_raw is mapping else {} -%}
              {%- set r = r | from_json if r is string else (r if r is mapping else {}) -%}
              {%- set raw = r.get('kitchen_sync_ambiguous_queue', {}) -%}
              {%- set raw = raw if raw is mapping else (raw | from_json if raw is string else {}) -%}
              {%- set v = raw.get('value', raw) if raw is mapping else [] -%}
              {{ v if (v is sequence and v is not string and v is not mapping) else (v | from_json if v is string else []) }}
        - variables:
            _ar_queue: '{{ _ar_parsed if (_ar_parsed is sequence and _ar_parsed is not mapping) else [] }}'
        - variables:
            _ar_page: '{{ _ar_queue[:_ar_limit] }}'
            _ar_total: '{{ _ar_queue | length }}'
        - variables:
            final_response:
              status: success
              case: ambiguous_review
              total_queued: '{{ _ar_total }}'
              showing: '{{ _ar_page | length }}'
              remaining_after: '{{ [_ar_total - _ar_limit, 0] | max }}'
              items: '{{ _ar_page }}'
              resolve_hint: "For each item: call foods_tag item_id=<food_id> grocy_product_id=<chosen_id> to link. Or call zen_dojotools_inventory products_merge to collapse duplicate Grocy products first."
        - stop: return
          response_variable: final_response
    - alias: Early exit — foods_audit
      choose:
      - conditions:
        - condition: template
          value_template: '{{ case == "foods_audit" }}'
        sequence:
        - variables:
            _fa_household: '{{ states("sensor.zen_default_household_cabinet_resolved") }}'
        - action: script.zen_dojotools_filecabinet
          response_variable: _fa_lastrun_raw
          continue_on_error: true
          data:
            action_type: read
            volume_entity_id: '{{ _fa_household }}'
            key: kitchen_sync_last_run
        - variables:
            _fa_lastrun: >-
              {%- set r = _fa_lastrun_raw.get('result', {}) if _fa_lastrun_raw is mapping else {} -%}
              {%- set r = r | from_json if r is string else (r if r is mapping else {}) -%}
              {%- set raw = r.get('kitchen_sync_last_run', {}) -%}
              {%- set raw = raw if raw is mapping else (raw | from_json if raw is string else {}) -%}
              {%- set v = raw.get('value', raw) if raw is mapping else {} -%}
              {{ v if v is mapping else (v | from_json if v is string else {}) }}
        - variables:
            _fa_foods: []
            _fa_done: false
        - repeat:
            count: 20
            sequence:
            - choose:
              - conditions:
                - condition: template
                  value_template: '{{ not _fa_done }}'
                sequence:
                - action: script.zen_sutra_mealie
                  response_variable: _fa_page_raw
                  continue_on_error: true
                  data:
                    mode: run
                    method: GET
                    endpoint: foods
                    payload: '{{ none }}'
                    pageNumber: '{{ repeat.index }}'
                    perPage: 50
                - variables:
                    _fa_items: >-
                      {{
                        _fa_page_raw.result.content.get('items', [])
                        if _fa_page_raw.result.content is mapping else []
                      }}
                - variables:
                    _fa_foods: '{{ _fa_foods + _fa_items }}'
                - choose:
                  - conditions:
                    - condition: template
                      value_template: '{{ _fa_items | length < 50 }}'
                    sequence:
                    - variables:
                        _fa_done: true
        - variables:
            _fa_linked: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for f in _fa_foods -%}
                {%- set ex = f.extras if f.extras is mapping else {} -%}
                {%- set gpid = ex.get('grocy_product_id', none) -%}
                {%- if gpid is not none and (gpid | string | trim) != '' -%}
                  {%- set ns.out = ns.out + [f.name] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out }}
            _fa_unlinked: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for f in _fa_foods -%}
                {%- set ex = f.extras if f.extras is mapping else {} -%}
                {%- set gpid = ex.get('grocy_product_id', none) -%}
                {%- if gpid is none or (gpid | string | trim) == '' -%}
                  {%- set ns.out = ns.out + [f.name] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out }}
        - variables:
            final_response:
              status: success
              case: foods_audit
              total_foods: '{{ _fa_foods | length }}'
              linked: '{{ _fa_linked | length }}'
              unlinked: '{{ _fa_unlinked | length }}'
              coverage_pct: >-
                {{
                  ((_fa_linked | length) / (_fa_foods | length) * 100) | round(1)
                  if (_fa_foods | length) > 0 else 0
                }}
              unlinked_sample: '{{ _fa_unlinked[:25] }}'
              last_sync_run: '{{ _fa_lastrun }}'
        - stop: return
          response_variable: final_response
    - alias: Early exit — qty_sync
      choose:
      - conditions:
        - condition: template
          value_template: '{{ case == "qty_sync" }}'
        sequence:
        - variables:
            _qts_apply: '{{ safe_sync_mode != "preview" }}'
            _qts_limit: '{{ sync_limit | default(50) | int }}'
        - variables:
            _qts_foods: []
            _qts_done: false
        - repeat:
            count: 20
            sequence:
            - choose:
              - conditions:
                - condition: template
                  value_template: '{{ not _qts_done }}'
                sequence:
                - action: script.zen_sutra_mealie
                  response_variable: _qts_page_raw
                  continue_on_error: true
                  data:
                    mode: run
                    method: GET
                    endpoint: foods
                    payload: '{{ none }}'
                    pageNumber: '{{ repeat.index }}'
                    perPage: 50
                - variables:
                    _qts_items: >-
                      {{
                        _qts_page_raw.result.content.get('items', [])
                        if _qts_page_raw.result.content is mapping else []
                      }}
                - variables:
                    _qts_foods: '{{ _qts_foods + _qts_items }}'
                - choose:
                  - conditions:
                    - condition: template
                      value_template: '{{ _qts_items | length < 50 }}'
                    sequence:
                    - variables:
                        _qts_done: true
        - variables:
            _qts_linked: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for f in _qts_foods -%}
                {%- set ex = f.extras if f.extras is mapping else {} -%}
                {%- set gpid = ex.get('grocy_product_id', none) -%}
                {%- if gpid is not none and (gpid | string | trim) != '' -%}
                  {%- set ns.out = ns.out + [{'id': f.id, 'name': f.name, 'grocy_product_id': gpid | int}] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out[:_qts_limit] }}
        - variables:
            _qts_synced: []
            _qts_errors: []
            _qts_preview: []
        - repeat:
            for_each: '{{ _qts_linked }}'
            sequence:
            - variables:
                _qts_fid: '{{ repeat.item.id }}'
                _qts_fname: '{{ repeat.item.name }}'
                _qts_gpid: '{{ repeat.item.grocy_product_id }}'
            - action: script.zen_dojotools_inventory
              response_variable: _qts_stock
              continue_on_error: true
              data:
                mode: stock_get_product_details
                product_id: '{{ _qts_gpid }}'
            - variables:
                _qts_amt: >-
                  {{
                    _qts_stock.result.stock_amount | default(0) | float
                    if _qts_stock is mapping else 0
                  }}
            - choose:
              - conditions:
                - condition: template
                  value_template: '{{ not _qts_apply }}'
                sequence:
                - variables:
                    _qts_preview: '{{ _qts_preview + [{"name": _qts_fname, "grocy_stock_qty": _qts_amt}] }}'
              - conditions:
                - condition: template
                  value_template: '{{ _qts_apply }}'
                sequence:
                - action: script.zen_sutra_mealie
                  response_variable: _qts_get
                  continue_on_error: true
                  data:
                    mode: run
                    method: GET
                    endpoint: 'foods/{{ _qts_fid }}'
                    payload: '{{ none }}'
                    pageNumber: 1
                    perPage: 1
                - variables:
                    _qts_full: >-
                      {{
                        _qts_get.result.content
                        if _qts_get.result.content is mapping else {}
                      }}
                    _qts_merged: >-
                      {{
                        (_qts_full.get('extras', {}) or {})
                        | combine({'grocy_stock_qty': _qts_amt | string, 'grocy_stock_updated_at': now().isoformat()})
                      }}
                - choose:
                  - conditions:
                    - condition: template
                      value_template: '{{ _qts_full != {} }}'
                    sequence:
                    - action: script.zen_sutra_mealie
                      response_variable: _qts_put
                      continue_on_error: true
                      data:
                        mode: run
                        method: PUT
                        endpoint: 'foods/{{ _qts_fid }}'
                        payload: '{{ _qts_full | combine({"extras": _qts_merged}) | tojson }}'
                        pageNumber: 1
                        perPage: 1
                    - choose:
                      - conditions:
                        - condition: template
                          value_template: '{{ (_qts_put.result.status | default(200) | int) < 400 }}'
                        sequence:
                        - variables:
                            _qts_synced: '{{ _qts_synced + [_qts_fname] }}'
                      - conditions:
                        - condition: template
                          value_template: '{{ true }}'
                        sequence:
                        - variables:
