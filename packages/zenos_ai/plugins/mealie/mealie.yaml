        - action: script.zen_sutra_mealie
          response_variable: _scc_full_raw
          data:
            mode: run
            method: GET
            endpoint: 'households/shopping/lists/{{ _scc_list.id }}'
            payload: '{{ none }}'
        - variables:
            _scc_items_raw: >-
              {{ _scc_full_raw.result.content.listItems
                 if _scc_full_raw.result.content is mapping and _scc_full_raw.result.content.listItems is sequence
                 else [] }}
        - variables:
            _scc_checked: '{{ _scc_items_raw | selectattr("checked", "equalto", true) | list }}'
        - variables:
            _scc_removed: 0
