    - alias: Early exit — shopping_list_clear_completed
      choose:
      - conditions:
        - condition: template
          value_template: '{{ case == "shopping_list_clear_completed" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ safe_shopping_list_id == "" and safe_item == "" }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: shopping_list_clear_completed
                  message: shopping_list_clear_completed requires shopping_list_id or item (list name).
            - stop: return
              response_variable: error_response
        - action: script.zen_sutra_mealie
          response_variable: _scc_lists_raw
          data:
            mode: run
            method: GET
            endpoint: households/shopping/lists
            payload: '{{ none }}'
            pageNumber: 1
            perPage: 50
        - variables:
            _scc_all: >-
              {{
                _scc_lists_raw.result.content.get('items', [])
                if _scc_lists_raw.result.content is mapping else []
              }}
        - variables:
            _scc_list: >-
              {%- if safe_shopping_list_id != '' -%}
                {{ _scc_all | selectattr('id', 'equalto', safe_shopping_list_id) | list | first | default(none) }}
              {%- elif safe_item != '' -%}
                {{ _scc_all | selectattr('name', 'search', '(?i)^' ~ safe_item ~ '$') | list | first | default(none) }}
              {%- else -%}
                {{ none }}
