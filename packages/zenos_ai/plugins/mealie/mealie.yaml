###############################################################################
# ZenOS-AI Plugin: Kitchen — Mealie Recipe/Kitchen Integration
# Version: 5.23.0
#
# v5.23.0 (2026-08-09/10): recipe_consume hardening, closing the loop on a
#   real debugging session. Three separate bugs fixed:
#   (1) leftovers_to_stock's item:-name product-creation path used a fuzzy
#   Grocy search internally, not an exact match — two recipes sharing a
#   long common name prefix silently booked BOTH onto the first fuzzy-
#   matched product. Fixed by creating via catalog_add_product (exact
#   name) and booking by the id it returns. (2) recipes_parse_ingredients
#   created new Mealie foods via a raw POST that bypassed the shared Grocy
#   sync block entirely — foods created this way had zero Grocy link,
#   silently unresolvable by recipe_consume forever. Fixed by mirroring
#   the same find-or-create-then-foods_tag idiom inline for this path.
#   (3) recipe_consume crashed (UndefinedError) once enough ingredients
#   reached the unit-resolution code — stock_get_product_details'
#   quantity_unit_stock field returns a list instead of a dict for some
#   products, and the existing `x or {}` fallback only guarded against
#   falsy, not wrong type. Fixed with explicit is-mapping checks.
#   NEW — needs_package_size: recipes_parse_ingredients now flags, in its
#   own response, any brand-new Grocy product it just created for a real
#   measured unit (gram/teaspoon/etc, not a bare count) — the exact
#   moment recipe_consume will later hit needs_manual_check for it unless
#   a package-size unit_conversions_add entry exists. Lets whichever agent
#   is driving ask "what size do you buy this in?" once, at creation
#   time, instead of the gap surfacing later during an actual cook.
#   (Caught its own bug in testing: the fix's catalog_add_product call was
#   missing the required location param, silently no-oping the whole
#   flag — fixed before shipping.)
#
# v5.22.0 (2026-07-26/27): exec-chef gap closures. kitchen_brief — weekly
#   food-cost rollup, deduped per unique recipe/ingredient across the whole
#   week (not per-meal) to stay inside a single call's timeout; also fixed
#   two real mode:single->queued concurrency bugs in zen_dojotools_inventory
#   and zen_sutra_grocy that were silently dropping concurrent callers.
#   waste_log/waste_summary — logs via Grocy's own stock_consume spoiled=true
#   flag (new waste_history mode on Inventory reads it back); no cabinet/
#   custom ledger, by design (cabinet space is finite). event_menu_create —
#   scales a whole multi-dish menu to a guest count in one call, flags
#   allergens per dish via the same room_occupant_prefs lookup mealplan_suggest
#   uses. prep_schedule_set/prep_brief — tags a mealplan entry's own text
#   field with a [PREP:N] lead-time marker, prep_brief computes start-by times
#   for the day; also fixed a pre-existing bug in mealplan_update_recipe
#   (Mealie now requires groupId/userId on PUT, which the payload never sent).
#   prep_schedule is now also surfaced in zen_dojotools_taskmaster's briefing
#   context block, so it's proactive on the existing quarter_hour trigger, not
#   pull-only. Allergen matching (mealplan_suggest + event_menu_create) moved
#   from bare substring match (false-positived "egg" inside "eggplant") to a
#   word-boundary-safe synonym taxonomy (dairy also catches milk/cream/
#   butter/cheese, etc.) — still a heuristic, not a certified allergen check.
#
# v5.21.0 (2026-07-22): mealplan_suggest's active-stay lookup repointed from
#   zen_dojotools_rolodex mode=active_stay_prefs to
#   zen_dojotools_room_manager mode=room_occupant_prefs — same guest-stay
#   check, now falling back to a room's static household occupant (when no
#   guest is staying there) so a family dinner gets the same allergen
#   flagging a guest stay does. Response field names unchanged
#   (active/guest_name/guest_prefs), active_stay gains a source field
#   (guest_stay/household_member). No other mealplan_suggest logic changed.
#
# v5.20.0 (2026-07-22): mealplan_suggest gains optional area + guest allergen
#   flagging — closes the "Rolodex can manage guest prefs but nothing reads
#   them" gap. When area is given, self-calls the new
#   zen_dojotools_rolodex mode=active_stay_prefs (shared active-stay lookup)
#   and, if a guest is staying there with guestPrefs.allergens set, flags each
#   suggestion's allergen_flags via a small synonym taxonomy (dairy -> milk/
#   cream/butter/cheese, etc.) matched word-boundary-safe against ingredient
#   names recipe_fulfillment already extracts (no new API calls) — not a bare
#   substring match, which false-positived on things like "egg" inside
#   "eggplant".
#   Heuristic, never used to silently drop a suggestion — flags are a prompt
#   for human judgment, not a certified allergen check. Fully backward
#   compatible — omitting area behaves exactly as before (active_stay: none).
#
# v5.19.0 (2026-07-21): shopping_list_clear_completed rebuilt as a real Early
#   exit — discovered live (while clearing a real household shopping list post-incident)
#   that it previously called a bulk DELETE households/shopping/items with no
#   list/item scoping in the request; it returned status 200 but silently
#   removed nothing. Now resolves shopping_list_id or item (list name), reads
#   the live list's checked items, and DELETEs each individually via
#   households/shopping/items/{item_id} — the same proven single-item
#   primitive shopping_list_remove_item already uses. Returns
#   removed/failed counts.
#
# v5.18.0 (2026-07-21): receipt_to_stock gains dry_run (default false) — when
#   true, computes and returns bom_preview (exact products/amounts/prices that
#   WOULD be booked) without calling bulk_stock_add, bulk_product_ref_add, or
#   the sync_now FK-apply step. Built directly after a real incident where
#   calling receipt_to_stock on an already-processed shopping list re-booked
#   all 63 checked items, duplicating real stock (fixed live via grocy.yaml's
#   new bulk_stock_reconcile_recent mode). Companion to bulk_stock_add's new
#   dry_run (grocy.yaml v5.6.0) — both write paths this incident touched can
#   now be previewed safely before any real call.
#
# v5.17.0 (2026-07-21): receipt_to_stock gains a real path to book actual
#   per-item receipt prices — new optional prices field ({grocy_product_id:
#   price}), human-confirmed only, never OCR-parsed. Attaches per-item to each
#   _rts_bom entry, relying on the matching per-item price fix just shipped in
#   bulk_stock_add (grocy.yaml v5.4.0 — that mode previously only supported one
#   global price for the whole BOM). New priced_count in the response summary.
#   Directly closes the data gap recipe_cost surfaced (total_cost was $0 with
#   no real price history to draw from).
#
# v5.16.0 (2026-07-21): New case recipe_cost — Kitchen<->Finance cross-surface.
#   Self-calls recipe_fulfillment and reuses its conversion-resolved quantities
#   (no unit-conversion math reinvented), prices each ingredient from
#   stock_entries_for_item's first positive price (same aggregation the
#   existing COGS system already trusts), and sums into total_cost +
#   cost_per_serving. Ingredients with no price history or no safe quantity
#   resolution are excluded and counted in unresolved_count — total_cost is
#   stated plainly as a lower bound whenever that's nonzero. Deliberately
#   Grocy-only, no Firefly/COGS transaction lookup (too heavy per-recipe;
#   period-level cooking-spend via real COGS transactions is a named, deferred
#   future extension, not built here).
#
# v5.15.0 (2026-07-21): Post-roadmap combined-scenario cases. cookbook_fulfillment
#   — resolves a cookbook's real queryFilterString (via cookbooks_get, field
#   path confirmed live) into recipes_list, fans out recipe_fulfillment per
#   recipe (capped at 2, reduced live from 5 after a real timeout — Sprint 5's
#   conversion engine made recipe_fulfillment heavier per call). recipe_plan —
#   checks recipe_fulfillment, auto-adds
#   missing items via shopping_list_generate_from_recipe when not fulfillable;
#   requires shopping_list_id/shopping_list same as that case itself, no
#   invented default list, returns shopping_action: not_needed/added/
#   skipped_no_list/failed.
#
# v5.14.0 (2026-07-21): Sprint 5 (final) — unit conversion + recipe scaling.
#   Part A: recipe_fulfillment now reuses recipe_consume's real Grocy
#   unit-conversion engine (units_list-based id lookup, never units_find —
#   live-confirmed buggy; exact Grocy-unit-id match or a real product-specific
#   quantity_unit_conversions entry) instead of unconditionally bucketing every
#   stated-unit ingredient into check_manually. Only genuinely unconvertible
#   ingredients still land there. Strictly additive — bucket/response shape
#   unchanged. Part B: new case recipes_scale — client-side proportional
#   scaling (Mealie has no server-side scale API, confirmed via research;
#   nutrition doesn't scale even in Mealie's own UI). Preview-only by default;
#   apply_scale=true persists via the existing safe recipes_update merge (field
#   is apply_scale, not apply — apply collides with a Jinja extension name in
#   this environment, live-confirmed via a real TypeError mid-testing).
#
# v5.13.0 (2026-07-21): New case mealplan_suggest — Sprint 4, meal-plan assist.
#   Combines mealplan_week (find empty slots), stock_expiry_suggestions
#   (near-expiry -> candidate recipes), and recipe_fulfillment (can_make
#   verification, capped at 3 candidates) into one suggestion-only case. Never
#   schedules anything itself — scheduling stays an explicit mealplan_add_recipe
#   call by the caller. Random-padding fallback (fill remaining empty slots with
#   verified random suggestions) was designed, live-tested, and cut from v1 after
#   confirming the combined round-trip cost exceeded a single call's practical
#   timeout — returns random_padding_available instead so the caller can run its
#   own follow-up loop.
#
# v5.12.0 (2026-07-21): New case recipe_consume — the consuming counterpart to
#   recipe_fulfillment. Depletes Grocy stock for a cooked Mealie recipe in one
#   call, resolving a safe consume amount per ingredient from real Grocy data
#   (exact unit-id match, bare count, or a real product-specific
#   quantity_unit_conversions entry) rather than any guessed math of our own.
#   Anything without a safe path goes to needs_manual_check with recipe
#   quantity/unit shown next to real current on-hand stock. Also stamps
#   lastMade via the existing safe recipes_update merge, skipping if already
#   recent. Built after a live attempt to manually consume ingredients for a
#   real cooked recipe failed immediately on a genuine unit mismatch (recipe
#   said "2 teaspoon", product's real Grocy stock unit was "each") — confirmed
#   live that Grocy has a real per-product unit-conversion table
#   (quantity_unit_conversions) this case can lean on instead of reinventing
#   conversion math. Also found and avoided a real bug in units_find (exact
#   name lookup mismatched "teaspoon" to "each" live) — unit-id resolution
#   here is built directly from units_list instead.
#
# v5.11.1 (2026-07-21): stock_expiry_suggestions fix-up after first live test. Added
#   clearing_candidate detection (stock_entries_for_item per near-expiry product,
#   flags overdue items purchased 90+ days ago as likely stale bookkeeping rather
#   than real food-safety concerns, with a stock_consume/stock_inventory_adjust
#   coaching hint — never auto-executed). Replaced the flat ascending sort (which
#   put months-overdue non-perishables like a year-old coffee at the very top)
#   with a priority sort: due_soon/expiring first, then recently-overdue, then
#   clearing candidates, then unparseable dates.
#
# v5.11.0 (2026-07-20): New case stock_expiry_suggestions — cross-references
#   Grocy's near-expiry stock (via zen_dojotools_inventory stock_list_volatile /
#   stock_area_volatile) against every Mealie recipe's recipeIngredient[] FK
#   (grocy_product_id, same extraction idiom as recipe_fulfillment) to answer
#   "what's expiring soon and what recipe could use it up." Read-only. Paginates
#   recipes_list (respects total_pages) and calls recipes_get per recipe to
#   build a reverse product_id->recipe-name index, so cost is O(recipe count)
#   in recipes_get calls — stated plainly in case_meta since it can be slow on
#   large recipe libraries. New optional area field (passthrough to Grocy's
#   homeassistant_area_id) scopes the near-expiry feed to one HA area.
#
# v5.10.2 (2026-07-20): New queryFilter field on zen_dojotools_kitchen, wired
#   into recipes_list/recipes_find's query_params (previously only mealplan_list
#   forwarded it — the field existed in Mealie's own DSL but had no input field
#   on this script and no wiring for the recipe-listing cases). Closes the
#   Sprint 2 deferred item: cookbook->recipes filtering (tags.slug="..."/
#   cookbook.id="...") now actually reaches Mealie's recipes endpoint.
#
# v5.10.1 (2026-07-20): recipes_update rebuilt as a dedicated Early exit that
#   always GETs the live recipe and shallow-merges the caller's payload onto it
#   before PUT (same GET->combine()->PUT idiom as recipes_parse_ingredients).
#   Fixes a real incident: a hand-built full-body PUT via the old blind
#   passthrough (case_meta generic dispatch, final_payload = safe_payload
#   verbatim) triggered a Mealie-side bug where a 500 ValidationError on write
#   still left the recipe deleted — "Swedish Meatballs" was lost this way.
#   Removed recipes_update from the generic final_payload elif chain entirely;
#   it can no longer take the unsafe path. recipe_id or recipe (name) now both
#   resolve, matching recipe_fulfillment/recipes_parse_ingredients.
#   Applied the same GET->combine()->PUT fix to cookbooks_update (was wired
#   with the same unsafe blind passthrough earlier this session — closed before
#   it could repeat the incident) and organizers_update (previously a silent
#   no-op, payload never wired at all — fixed properly instead of reintroducing
#   the unsafe pattern it happened to be missing).
#
# v5.10.0 (2026-07-20): cookbooks_list/cookbooks_get/cookbooks_create/
#   cookbooks_update/cookbooks_delete — same organizers_* CRUD pattern against
#   households/cookbooks (no organizer_type template; cookbooks aren't typed).
#   All five fall through the existing generic dispatch table (endpoint/method
#   resolution, missing_fields checks) same as organizers_*, no new Early exit
#   block needed. Removed the dead rest_command.mealie_get_cookbooks (never
#   referenced by any case) — cookbooks_list supersedes it.
#
# v5.9.3 (2026-07-20): recipes_parse_ingredients — closes the gap recipe_fulfillment
#   exposed tonight: recipes scraped via recipes_create_from_url often land with
#   freetext-only ingredients (quantity 0.0, unit null, food null, just a note/
#   display string), which recipe_fulfillment can't check stock against (all
#   bucketed unresolvable). Resolves recipe_id/recipe (via recipes_find, same
#   exact-match-only precedent as recipe_fulfillment), fetches the recipe, sends
#   each freetext note/display line to Mealie's real POST /api/parser/ingredients
#   (parser: nlp/brute/openai), resolves each parsed food-name string to a real
#   Mealie Food (find-or-create idiom copied from notes_resolve — exact-name
#   match or create, never guesses on ambiguity), and PUTs the recipe back with
#   structured quantity/unit/food on those positions only. Already-structured
#   ingredients are left untouched.
#
# v5.9.2 (2026-07-20): recipe_fulfillment — the missing Mealie<>Grocy bridge.
#   "Can I make this recipe right now?" Resolves recipe_id/recipe (name, via
#   recipes_find), pulls recipeIngredient[] from GET recipes/{id}, and checks
#   each FK-linked ingredient against ONE zen_dojotools_inventory
#   mode=stock_overview call (avoids N+1). Buckets: fulfilled, insufficient,
#   unresolvable (no food/FK), check_manually. NOTE: Grocy's /objects/stock
#   rows (stock_overview) carry no unit field, so unit compatibility cannot be
#   verified from that one call without a second per-product lookup — any
#   ingredient with a stated unit is bucketed check_manually rather than
#   guessed at. Distinct from Grocy's own recipe_check_fulfillment (Grocy's
#   disconnected recipe objects only, never Mealie recipes).
#
# v5.9.1 (2026-07-20): recipes_create_from_url — wraps Mealie's real
#   POST /recipes/create/url (parse_recipe_url, ScrapeRecipe payload: url,
#   include_tags). Response is a bare slug string (response_model=str), not an
#   object; this case parses the slug then follows up with GET recipes/{slug}
#   so the caller gets the fully-populated scraped recipe back in one call.
#
# v5.9.0 (2026-07-20): shopping_list_check_item (real gap — Mealie's own checkbox
#   toggle was never exposed by any tool; Mealie-only, no Grocy dependency) and
#   receipt_to_stock (one-call: bootstrap FKs via sync_now, sum+bulk_stock_add,
#   optional bulk_product_ref_add to a Paperless doc). Both degrade cleanly if
#   Grocy/Paperless aren't configured — see zen_dojotools_inventory's own
#   "Grocy not configured" guard for the underlying check.
#
# COMPANION: kitchen_sync.yaml (same folder)
#   zen_dojotools_kitchen (this file) is the MCP/LLM surface. The Mealie<>Grocy
#   sync ENGINE lives in kitchen_sync.yaml (zen_admintools_kitchen_sync). The
#   case=sync_now and case=sync_queue_review delegate there. Changes to foods_list,
#   foods_tag, or kitchen_sync cabinet keys affect both files.
#
# SETUP
#
# 1. Add to secrets.yaml:
#      mealie_bearer: Bearer <your_long_lived_token>
#
# 2. Set input_text.mealie_url in HA (Settings > Helpers, or Developer Tools):
#      http://<your-mealie-host>:<port>   (no trailing slash)
#    Must be set once after install — value persists across restarts.
#
# HOW TO GET YOUR MEALIE TOKEN:
#   1. Log in to Mealie
#   2. Go to your Profile (top-right avatar) > API Tokens
#   3. Create a new Long-Lived Token
#   4. Copy the token and prefix it with "Bearer ":
#      mealie_bearer: Bearer eyJhbGci...
###############################################################################

input_text:
  mealie_url:
    name: "Mealie Base URL"
    max: 255
    mode: text
    icon: mdi:chef-hat

script:
  zen_sutra_mealie:
    alias: Zen DojoTools Mealie Advanced
    description: '
  
      Zen DojoTools Mealie (5.8.0) is a deterministic, construct-safe
      controller for governed interaction with the Mealie API.
  
      This tool provides validated GET, POST, PUT, and DELETE operations with enforced
      payload requirements, pagination discipline, and structured HELP output. It is
      designed as a stable backend layer intended to be called by higher-level Zen DojoTools
      helpers and automation systems.
  
      The controller mirrors the safety, response structure, and execution model of
      Grocy Advanced, ensuring consistency across household data systems.
  
      This tool does NOT accept raw or implicit writes. All write operations must be
      explicit and fully specified.
  
      Use mode=help to view supported operations, endpoints, and usage guidance.
  
      '
    mode: single
    icon: mdi:chef-hat
    fields:
      mode:
        name: Mode
        description: Run controller or show help
        selector:
          select:
            options:
            - run
            - help
        default: help
      method:
        name: HTTP Method
        selector:
          select:
            options:
            - GET
            - POST
            - PUT
            - DELETE
        required: true
      endpoint:
        name: Mealie Endpoint
        description: API path (e.g., recipes, tags, users/self/ratings/{recipe_id})
        selector:
          text:
      path_params:
        name: Path Params
        description: Dictionary for token substitution in endpoint
        selector:
          object:
      payload:
        name: Payload (JSON)
        description: Required for POST, PUT, DELETE
        selector:
          text:
            multiline: true
      search:
        name: Search
        description: (GET only) Free-text search
        selector:
          text:
      orderDirection:
        name: Order Direction
        description: (GET only) asc or desc
        selector:
          text:
        default: desc
      additional_params:
        name: Extra Filters
        description: (GET only) Additional query parameters
        selector:
          object:
      pageNumber:
        name: Page Number
        selector:
          number:
            min: 1
            max: 100
        default: 1
      perPage:
        name: Items Per Page
        selector:
          number:
            min: 1
            max: 50
        default: 10
    sequence:
    # --- tool_manifest early exit ---
    - if: "{{ (mode | default('') | lower) == 'tool_manifest' }}"
      then:
      - variables:
          result: >-
            {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
            {{- MF.tool_manifest(
              tool='zen_sutra_mealie',
              display_name='Mealie Sutra (Internal)',
              tier='sutra',
              version='5.8.0',
              health={'configured': true, 'status': 'ok', 'notes': []},
              required_labels=['dojotools'],
              optional_labels=['mealie', 'recipes'],
              failure_policy='soft',
              mcp_exposed=false,
              stripe=2,
              impact='soft',
              caller_token=caller_token | default('')
            ) | from_json -}}
      - stop: zen_sutra_mealie tool_manifest
        response_variable: result
    - variables:
        tool_version: 5.8.0
        docs: sensor.mealie_restful_openapi_docs
        is_get: '{{ method == ''GET'' }}'
        is_write: '{{ method in [''POST'',''PUT'',''DELETE''] }}'
        has_endpoint: '{{ endpoint is string and endpoint | length > 0 }}'
        needs_payload: '{{ is_write }}'
        kitchen_paths: '{{ state_attr(docs, ''paths'') | default({}, true) }}'
        kitchen_tags: "{% set ns = namespace(tags=[]) %}\n{% for methods in kitchen_paths.values()
          %}\n  {% for info in methods.values() if info.tags is defined %}\n    {% for
          tag in info.tags if tag not in ns.tags %}\n      {% set ns.tags = ns.tags
          + [tag] %}\n    {% endfor %}\n  {% endfor %}\n{% endfor %}\n{{ ns.tags | to_json
          }}"
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ mode == ''help'' }}'
          alias: HELP
        sequence:
        - variables:
            help_json:
              status: info
              tool: Zen DojoTools Mealie Advanced
              version: '{{ tool_version }}'
              mode: help
              description: 'Deterministic, construct-safe controller for the Mealie
                API. Provides governed GET/POST/PUT/DELETE access and structured HELP.
  
                '
              supported_methods:
              - GET
              - POST
              - PUT
              - DELETE
              required_fields:
                common:
                - endpoint
                write_operations:
                - payload
              optional_fields:
                read_operations:
                - search
                - orderDirection
                - additional_params
                - pageNumber
                - perPage
              pagination:
                defaults:
                  pageNumber: 1
                  perPage: 10
                limits:
                  pageNumber_max: 100
                  perPage_max: 50
                guidance: 'Pagination is strongly recommended for large result sets
                  to avoid response size limits.
  
                  '
              available_endpoints: '{{ kitchen_paths.keys() | list | to_json }}'
              available_tags: '{{ kitchen_tags }}'
              usage_notes:
              - Payloads are mandatory for POST, PUT, and DELETE
              - Read before write to avoid unintended overwrites
              - Use path_params to replace tokens such as {recipe_id}
              - This controller is intended to be wrapped by helper tools
              safety_model:
              - Explicit writes only
              - No implicit defaults for destructive actions
              - Deterministic response envelope
              authored_by: Friday
              authored_on: '2025-06-09T00:00:00.000Z'
            status: Help
            message: Help File.
            method: HELP
            result: '{{ help_json }}'
            final_response: "{{\n  {\n    \"status\": status | default(''),\n    \"message\":
              message | default(''),\n    \"method\": method | default('ERROR'),\n    \"endpoint\":
              endpoint | default(),\n    \"result\": result | default({})\n  }\n}}"
        - stop: Help
          response_variable: help_json
      - conditions:
        - condition: template
          value_template: '{{ not has_endpoint }}'
          alias: 'Error: Could Not Resolve Endpoint'
        sequence:
        - variables:
            status: error
            message: Endpoint is required.
            method: '{{ method | default(''ERROR'') }}'
            endpoint: '{{ endpoint }}'
            result: '{{ response }}'
            final_response: "{{\n  {\n    \"status\": status | default(''),\n    \"message\":
              message | default(''),\n    \"method\": method | default('ERROR'),\n    \"endpoint\":
              endpoint | default(),\n    \"result\": result | default({})\n  }\n}}"
        - stop: return
          response_variable: final_response
      - conditions:
        - condition: template
          value_template: '{{ needs_payload and (payload | trim == '''') }}'
          alias: 'Error: Missing Required Payload'
        sequence:
        - variables:
            status: error
            message: Payload is required for write operations.
            method: '{{ method | default(''ERROR'') }}'
            endpoint: '{{ endpoint }}'
            result: '{{ response }}'
            final_response: "{{\n  {\n    \"status\": status | default(''),\n    \"message\":
              message | default(''),\n    \"method\": method | default('ERROR'),\n    \"endpoint\":
              endpoint | default(),\n    \"result\": result | default({})\n  }\n}}"
        - stop: return
          response_variable: final_response
      - conditions:
        - condition: template
          value_template: '{{ is_get }}'
          alias: GET
        sequence:
        - variables:
            read_data: "{% set d = {\"endpoint\": endpoint} %}\n\n{% if path_params
              is defined\n      and path_params is mapping\n      and path_params |
              length > 0 %}\n  {% set d = d | combine({\"path_params\": path_params})
              %}\n{% endif %}\n\n{% if search is defined\n      and search is string\n
              \     and search | trim != '' %}\n  {% set d = d | combine({\"search\":
              search | trim}) %}\n{% endif %}\n\n{% if orderDirection is defined\n      and
              orderDirection in ['asc', 'desc'] %}\n  {% set d = d | combine({\"orderDirection\":
              orderDirection}) %}\n{% endif %}\n\n{% if additional_params is defined\n
              \     and additional_params is mapping\n      and additional_params |
              length > 0 %}\n  {% set d = d | combine({\"additional_params\": additional_params})
              %}\n{% endif %}\n\n{% if pageNumber is defined\n      and pageNumber |
              int(0) > 0 %}\n  {% set d = d | combine({\"pageNumber\": pageNumber |
              int(0)}) %}\n{% endif %}\n\n{% if perPage is defined\n      and perPage |
              int(0) > 0 %}\n  {% set d = d | combine({\"perPage\": perPage | int(0)})
              %}\n{% endif %}\n\n{{ d }}"
            response: {}
        - action: rest_command.mealie_api_advanced_get
          data: '{{ read_data }}'
          response_variable: response
        - variables:
            status: success
            method: '{{ method | default(''ERROR'') }}'
            message: '{{ method }} Complete'
            endpoint: '{{ endpoint }}'
            result: '{{ response }}'
            final_response: "{{\n  {\n    \"status\": status | default(''),\n    \"method\":
              method | default('ERROR'),\n    \"endpoint\": endpoint | default(),\n
              \   \"result\": result | default({})\n  }\n}}"
        - stop: return
          response_variable: final_response
      - conditions:
        - condition: template
          value_template: '{{ method == ''POST'' }}'
          alias: POST
        sequence:
        - action: rest_command.mealie_api_advanced_post
          response_variable: response
          data:
            endpoint: '{{ endpoint }}'
            path_params: '{{ path_params | default({}) }}'
            payload: '{{ payload }}'
        - variables:
            status: success
            method: '{{ method | default(''ERROR'') }}'
            message: '{{ method }} Complete'
            endpoint: '{{ endpoint }}'
            result: '{{ response }}'
            final_response: "{{\n  {\n    \"status\": status | default(''),\n    \"method\":
              method | default('ERROR'),\n    \"endpoint\": endpoint | default(),\n
              \   \"result\": result | default({})\n  }\n}}"
        - stop: return
          response_variable: final_response
      - conditions:
        - condition: template
          value_template: '{{ method == ''PUT'' }}'
          alias: PUT
        sequence:
        - action: rest_command.mealie_api_advanced_put
          response_variable: response
          data:
            endpoint: '{{ endpoint }}'
            path_params: '{{ path_params | default({}) }}'
            payload: '{{ payload }}'
        - variables:
            status: success
            method: '{{ method | default(''ERROR'') }}'
            message: '{{ method }} Complete'
            endpoint: '{{ endpoint }}'
            result: '{{ response }}'
            final_response: "{{\n  {\n    \"status\": status | default(''),\n    \"method\":
              method | default('ERROR'),\n    \"endpoint\": endpoint | default(),\n
              \   \"result\": result | default({})\n  }\n}}"
        - stop: return
          response_variable: final_response
      - conditions:
        - condition: template
          value_template: '{{ method == ''DELETE'' }}'
          alias: DELETE
        sequence:
        - action: rest_command.mealie_api_advanced_delete
          response_variable: response
          data:
            endpoint: '{{ endpoint }}'
            path_params: '{{ path_params | default({}) }}'
            payload: '{{ payload }}'
        - variables:
            status: success
            method: '{{ method | default(''ERROR'') }}'
            message: '{{ method }} Complete'
            endpoint: '{{ endpoint }}'
            result: '{{ response }}'
            final_response: "{{\n  {\n    \"status\": status | default(''),\n    \"message\":
              message | default(''),\n    \"method\": method | default('ERROR'),\n    \"endpoint\":
              endpoint | default(),\n    \"result\": result |default({})\n  }\n}}"
        - stop: return
          response_variable: final_response
    - variables:
        status: error
        message: Unhandled execution path
        method: '{{ method | default(''ERROR'') }}'
        endpoint: '{{ endpoint }}'
        result: '{{ response }}'
        final_response: "{{\n  {\n    \"status\": status | default(''),\n    \"message\":
          message | default(''),\n    \"method\": method | default('ERROR'),\n    \"endpoint\":
          endpoint | default(),\n    \"result\": result | default({})\n  }\n}}"
    - stop: return
      response_variable: final_response

  zen_dojotools_kitchen:
    alias: Zen DojoTools Kitchen
    description: 'Kitchen (v5.22.0) — Executive chef view of the household. Authoritative
      for all meal and recipe questions. Use mealplan_today for ''what''s for dinner
      tonight'', mealplan_week for ''what are we eating this week'', recipes_random
      for a suggestion. Covers recipes, meal plans, shopping lists, and the ingredient
      catalog. For cross-system linking use foods_tag to write grocy_product_id into
      a Mealie food''s extras dict. Vocabulary differs deliberately from Inventory:
      recipes are dishes, meal plans are the service schedule, shopping lists are mise
      en place. For pantry stock, quantities, and purchase tracking use
      zen_dojotools_inventory. If the user hands you a grocery receipt (photo, Paperless
      doc, or just says "I went shopping"): check the item off with
      shopping_list_check_item, then call case=receipt_to_stock — one call bootstraps
      Grocy FKs, books stock, and (with paperless_doc_id) links every product back to
      the receipt. Works standalone with Mealie only; Grocy and Paperless linkage are
      each optional and degrade cleanly if not configured. kitchen_brief: weekly food-cost
      rollup vs Groceries spend. waste_log/waste_summary: Grocy-native spoiled=true
      tracking, no separate ledger. event_menu_create: scale a whole multi-dish menu to
      a guest count in one call, with per-dish allergen flags. prep_schedule_set/prep_brief:
      tag a meal with a prep lead time, get a sorted start-cooking-by list for the day —
      also surfaces in Taskmaster''s scheduled briefing, not just on demand.

      '
    mode: parallel
    icon: mdi:silverware-fork-knife
    fields:
      mode:
        name: Mode
        selector:
          select:
            options:
            - help
            - run
            - tool_manifest
        default: help
      case:
        selector:
          select:
            options:
            - recipes_list
            - recipes_find
            - recipes_get
            - recipes_create
            - recipes_create_from_url
            - recipes_update
            - recipes_delete
            - recipes_get_stats
            - recipes_get_comments
            - recipes_add_comment
            - organizers_list
            - organizers_get
            - organizers_get_by_slug
            - organizers_create
            - organizers_update
            - organizers_delete
            - cookbooks_list
            - cookbooks_get
            - cookbooks_create
            - cookbooks_update
            - cookbooks_delete
            - shopping_list_get
            - shopping_list_get_items
            - shopping_list_add_item
            - shopping_list_remove_item
            - shopping_list_check_item
            - shopping_list_clear_completed
            - shopping_list_generate_from_recipe
            - mealplan_list
            - mealplan_get_item
            - mealplan_add_recipe
            - mealplan_update_recipe
            - mealplan_delete_item
            - units_list
            - units_find
            - unit_get
            - unit_add
            - unit_update
            - unit_delete
            - foods_list
            - foods_find
            - food_get
            - food_add
            - food_update
            - food_delete
            - foods_tag
            - mealplan_today
            - mealplan_week
            - recipes_random
            - sync_now
            - shopping_lists_overview
            - shopping_list_detail
            - shopping_list_link
            - shopping_list_sync
            - notes_resolve
            - notes_promote
            - all_lists_sync
            - foods_audit
            - qty_sync
            - ambiguous_review
            - receipt_to_stock
            - recipe_fulfillment
            - recipes_parse_ingredients
            - stock_expiry_suggestions
            - recipe_consume
            - mealplan_suggest
            - recipes_scale
            - cookbook_fulfillment
            - recipe_plan
            - recipe_cost
            - kitchen_brief
            - waste_log
            - waste_summary
            - event_menu_create
            - prep_schedule_set
            - prep_brief
            - leftovers_to_stock
      area:
        name: Area
        description: For stock_expiry_suggestions — optional HA area id to scope the near-expiry stock feed (passed through to zen_dojotools_inventory as homeassistant_area_id). Omit to check all stock. Also used by mealplan_suggest — when given, checks zen_dojotools_rolodex for an active guest stay in that room and flags suggestions containing an allergen-matched ingredient.
        required: false
        selector:
          text:
      recipe:
        name: Recipe Name
        selector:
          text:
      cookbook:
        name: Cookbook Name
        description: For cookbook_fulfillment — exact cookbook name (use item_id to skip name resolution).
        selector:
          text:
      recipe_id:
        name: Recipe ID
        selector:
          text:
      url:
        name: URL
        description: For recipes_create_from_url — the recipe source URL to scrape.
        required: false
        selector:
          text:
      include_tags:
        name: Include Tags
        description: For recipes_create_from_url — also pull the source site's own tags/categories into the new recipe. Default false.
        required: false
        selector:
          boolean:
      auto_parse:
        name: Auto-Parse Ingredients
        description: For recipes_create_from_url — automatically chain recipes_parse_ingredients right after the scrape so ingredients are structured/matched in one call. Default true. Set false to skip and leave ingredients freetext (call recipes_parse_ingredients yourself later if needed).
        required: false
        default: true
        selector:
          boolean:
      apply_scale:
        name: Apply Scaling
        description: For recipes_scale — false (default) returns a preview only, never writes. Set true to persist the scaled quantities and new recipeServings back to the recipe via the same safe GET-merge-PUT recipes_update already uses.
        required: false
        default: false
        selector:
          boolean:
      parser:
        name: Ingredient Parser
        description: For recipes_parse_ingredients — which Mealie NLP parser backend to use. Default nlp.
        required: false
        selector:
          select:
            options:
            - nlp
            - brute
            - openai
        default: nlp
      title:
        name: Title
        selector:
          text:
      text:
        name: Text
        selector:
          text:
            multiline: true
      start_date:
        name: Start Date
        selector:
          date:
      end_date:
        name: End Date
        selector:
          date:
      page:
        name: Page
        selector:
          number:
            min: 1
        default: 1
      perPage:
        name: Per Page
        selector:
          number:
            min: 1
            max: 50
        default: 50
      orderDirection:
        name: Order Direction
        selector:
          select:
            options:
            - asc
            - desc
        default: desc
      item:
        name: Item
        selector:
          text:
      item_id:
        name: Item ID
        selector:
          text:
      checked:
        name: Checked
        description: For shopping_list_check_item. true=check off (default), false=uncheck.
        required: false
        selector:
          boolean:
      quantity:
        name: Quantity
        selector:
          number:
            min: 0
      lead_time_minutes:
        name: Lead Time Minutes
        description: For prep_schedule_set — how many minutes before serving this dish's prep must start.
        selector:
          number:
            min: 0
            max: 2880
      fraction_remaining:
        name: Fraction Remaining
        description: For leftovers_to_stock — fraction of the recipe's full batch left over, e.g. 0.5 for "half left". Ignored if quantity is given instead.
        selector:
          number:
            min: 0
            max: 1
            step: 0.05
      location:
        name: Location
        description: For leftovers_to_stock — Grocy storage location name. Default Refrigerator.
        selector:
          text:
      shelf_life_days:
        name: Shelf Life Days
        description: For leftovers_to_stock — days until this leftover batch is considered expired. Default 4 (a fridge-leftovers starting point, not a food-safety certification) — pass a much higher value (e.g. 90) for anything going into the freezer.
        selector:
          number:
            min: 1
            max: 365
      unit:
        name: Unit
        selector:
          text:
      waste_reason:
        name: Waste Reason
        description: For waste_log — why the item was discarded. Default other.
        selector:
          select:
            options:
            - spoiled
            - expired
            - overprepped
            - plate_waste
            - other
      date:
        name: Date
        selector:
          date:
      organizer_type:
        name: Organizer Type
        description: 'Choose one of the supported ''Organizer'' domains (categories,
          tags, tools).
  
          '
        selector:
          select:
            options:
            - categories
            - tags
            - tools
      entry_type:
        name: Entry Type
        selector:
          select:
            options:
            - breakfast
            - lunch
            - dinner
            - snack
        default: dinner
      slug:
        name: Slug
        description: Used when searching by 'slug' where supported.
        selector:
          text:
      search:
        name: Search
        selector:
          text:
      queryFilter:
        name: Query Filter
        description: >-
          For recipes_list/recipes_find/mealplan_list — Mealie's query-filter DSL
          string, e.g. tags.slug="alton-brown" or recipeCategory.slug="dinner".
          Confirmed live: 'cookbook.id="..."' is NOT a valid attribute on this
          Mealie version (400 invalid attribute string) — a cookbook's own
          recipes are found by filtering on the SAME tag/category its
          queryFilterString uses (cookbooks_get to read that string), not by
          the cookbook's id directly.
        selector:
          text:
      payload:
        name: Payload
        selector:
          text:
            multiline: true
      unit_plural:
        name: Unit Plural Name
        description: Optional plural form
        selector:
          text:
      unit_description:
        name: Unit Description
        selector:
          text:
      shopping_list:
        name: Shopping List
        description: Exact shopping list name to resolve to an ID
        selector:
          text:
      shopping_list_id:
        name: Shopping List ID
        description: Explicit shopping list ID (skips name resolution)
        selector:
          text:
      grocy_product_id:
        name: Grocy Product ID
        description: Grocy product ID for cross-system FK (foods_tag).
        selector:
          text:
      grocy_list_id:
        name: Grocy List ID
        description: Grocy shopping list integer ID for shopping_list_link.
        selector:
          number:
            min: 1
      paperless_doc_id:
        name: Paperless Document ID
        description: Optional. For receipt_to_stock — Paperless document ID for the receipt. If set, every product booked in this call is linked to it via bulk_product_ref_add (ref_type=doc).
        required: false
        selector:
          number:
            min: 1
      prices:
        name: Item Prices
        description: >-
          Optional. For receipt_to_stock — JSON string mapping grocy_product_id
          (string) to a real per-item price, e.g. '{"602": 4.99, "692": 2.49}'
          (same JSON-string convention as bom elsewhere in this system, not a
          native object — pass it as text). Human-confirmed only — read
          directly off the real receipt, never parsed from Paperless OCR (this
          session's own experience is that receipt OCR needs human eyes, not
          blind regex). Products not listed book with no price, same as today.
        required: false
        selector:
          text:
      dry_run:
        name: Dry Run
        description: >-
          Optional. For receipt_to_stock — default false. When true, computes
          and returns the exact bom (products/amounts/prices) that WOULD be
          booked, without calling bulk_stock_add, bulk_product_ref_add, or the
          mealie_to_grocy FK-sync apply step. No writes of any kind occur.
        required: false
        selector:
          boolean:
      sync_mode:
        name: Sync Mode
        description: preview = dry run (default). apply = write to Grocy.
        selector:
          select:
            options:
            - preview
            - apply
        default: preview
      sync_direction:
        name: Sync Direction
        selector:
          select:
            options:
            - mealie_to_grocy
            - grocy_to_mealie
        default: mealie_to_grocy
      sync_limit:
        name: Sync Limit
        description: Max foods to process per run (1-100).
        selector:
          number:
            min: 1
            max: 100
        default: 10
      sync_confirmation:
        name: Sync Confirmation
        description: Must be true to execute an apply run.
        selector:
          boolean:
        default: false
      sync_default_location:
        name: Sync Default Location
        description: Default Grocy storage location for new products.
        selector:
          text:
        default: Pantry
      sync_default_unit:
        name: Sync Default Unit
        description: Default Grocy unit for new products.
        selector:
          text:
        default: each
      sync:
        name: Sync to Grocy
        description: Auto-sync food to Grocy after add/update. Default true.
        selector:
          boolean:
        default: true
      include_notes:
        name: Include Notes
        description: Also sync unchecked note-only items (no food entity) via Grocy name dedup.
        selector:
          boolean:
        default: false
    sequence:
    - if: "{{ (mode | default('') | lower) == 'tool_manifest' }}"
      then:
      - variables:
          result: >-
            {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
            {{ MF.tool_manifest(
                tool='zen_dojotools_kitchen',
                display_name='Kitchen',
                tier='dojotools',
                version='5.8.0',
                health={'configured': true, 'status': 'ok', 'notes': []},
                required_labels=['mealie'],
                optional_labels=['mealie'],
                consumes=['recipe_request'],
                returns=['kitchen_response'],
                icon='mdi:chef-hat',
                color='orange',
                stripe=3,
                impact='soft',
                mcp_exposed=true,

                caller_token=caller_token | default('')
            ) | from_json }}
      - stop: tool_manifest
        response_variable: result
    - variables:
        tool_version: 5.8.0
        tool_branch: GA
    - variables:
        case_meta:
          recipes_list:
            description: >-
              List all recipes. Optional queryFilter (Mealie DSL, e.g.
              tags.slug="alton-brown") restricts results. NOT cookbook.id — not
              a valid attribute; filter on the tag/category the cookbook's own
              queryFilterString uses instead (see cookbooks_get).
            method: GET
            endpoint: recipes
            writes:
              level: none
            supports_search: true
            optional:
            - queryFilter
          recipes_find:
            description: >-
              Search recipes by name or metadata. Optional queryFilter (same DSL
              as recipes_list) can be combined with search.
            method: GET
            endpoint: recipes
            writes:
              level: none
            supports_search: true
            requires:
            - search
            optional:
            - queryFilter
          recipes_get:
            description: Get a recipe by ID
            method: GET
            endpoint: recipes/{id}
            writes:
              level: none
            requires:
            - recipe_id
          recipes_create:
            description: Create a new recipe
            method: POST
            endpoint: recipes
            writes:
              level: single
            requires:
            - payload
            payload_schema:
              description: Recipe creation payload
              required:
              - name
              optional:
              - description
              - ingredients
              - instructions
              - tags
              - categories
              - tools
              example:
                name: Spaghetti Carbonara
                description: Classic Roman pasta
                ingredients:
                - spaghetti
                - eggs
                - pancetta
                - pecorino
                instructions:
                - Boil pasta
                - Mix eggs and cheese
                - Combine with pancetta
          recipes_create_from_url:
            description: >-
              Scrape a recipe directly from a public recipe URL and create it in
              Mealie in one call — no hand-typed ingredients needed. Wraps Mealie's
              real POST /recipes/create/url endpoint (handler parse_recipe_url).
              Request schema is ScrapeRecipe (url required, include_tags optional
              bool to also pull the source site's own tags/categories). NOTE: this
              endpoint's response is a bare JSON string (response_model=str) — the
              new recipe's slug, not an object like recipes_create returns. This
              case parses that string and follows up with a GET on the new recipe
              so the response includes real scraped data (name, ingredients,
              instructions), proving the scrape worked.
            method: POST
            endpoint: recipes/create/url
            writes:
              level: single
            requires:
            - url
            optional:
            - include_tags
            payload_schema:
              description: ScrapeRecipe payload
              required:
              - url
              optional:
              - include_tags
              example:
                url: https://www.example.com/recipes/spaghetti-carbonara
                include_tags: true
          recipes_update:
            description: >-
              Update an existing recipe. Safe partial update: internally fetches the
              live recipe first and shallow-merges your payload on top of it before
              PUT — fields you don't mention are preserved untouched. Pass only the
              top-level fields you want changed (e.g. just {"tags": [...]}"), not a
              hand-rebuilt full recipe body.
            method: PUT
            endpoint: recipes/{id}
            writes:
              level: single
            requires:
            - recipe_id or recipe
            - payload
            payload_schema:
              description: Recipe fields to change (merged onto live state, not a full replacement)
              required: []
              optional:
              - name
              - description
              - ingredients
              - instructions
              - tags
              - categories
              - tools
          recipes_delete:
            description: Delete a recipe
            method: DELETE
            endpoint: recipes/{id}
            writes:
              level: destructive
            requires:
            - recipe_id
          recipes_get_stats:
            description: Get statistics for a recipe
            method: GET
            endpoint: recipes/{id}/stats
            writes:
              level: none
            requires:
            - recipe_id
          recipes_get_comments:
            description: Get comments for a recipe
            method: GET
            endpoint: recipes/{id}/comments
            writes:
              level: none
            requires:
            - recipe_id
          recipes_add_comment:
            description: Add a comment to a recipe
            method: POST
            endpoint: recipes/{id}/comments
            writes:
              level: single
            requires:
            - recipe_id
            - text
            payload_schema:
              description: Comment payload
              required:
              - text
          mealplan_list:
            description: List meal plan entries
            method: GET
            endpoint: households/mealplans
            writes:
              level: none
            optional:
            - start_date
            - end_date
            - orderBy
            - orderDirection
            - page
            - perPage
            - queryFilter
          mealplan_get_item:
            description: Get a meal plan entry by ID
            method: GET
            endpoint: households/mealplans/{item_id}
            writes:
              level: none
            requires:
            - item_id
          mealplan_add_recipe:
            description: Schedule a recipe or note in the meal plan
            method: POST
            endpoint: households/mealplans
            writes:
              level: bulk
            requires:
            - date
            - entry_type
            allowed_entry_types:
            - breakfast
            - lunch
            - dinner
            - snack
            payload_schema:
              description: Meal plan entry payload
              required:
              - date
              - entryType
              optional:
              - recipeId
              - title
              - text
              example:
                date: '2025-12-25'
                entryType: dinner
                title: ''
                text: ''
          mealplan_update_recipe:
            description: Update an existing meal plan entry
            method: PUT
            endpoint: households/mealplans/{item_id}
            writes:
              level: bulk
            requires:
            - item_id
            - date
            - entry_type
            allowed_entry_types:
            - breakfast
            - lunch
            - dinner
            - snack
            payload_schema:
              description: Meal plan update payload
              required:
              - id
              - date
              - entryType
              optional:
              - recipeId
              - title
              - text
              example:
                id: 42
                recipeId: abc123
                date: '2025-12-25'
                entryType: dinner
          mealplan_delete_item:
            description: Delete a meal plan entry
            method: DELETE
            endpoint: households/mealplans/{item_id}
            writes:
              level: destructive
            requires:
            - item_id
          shopping_list_get:
            description: List all shopping lists
            method: GET
            endpoint: households/shopping/lists
            writes:
              level: none
          shopping_list_get_items:
            description: Get all items in a shopping list
            method: GET
            endpoint: households/shopping/lists/{shopping_list_id}
            writes:
              level: none
            requires:
            - shopping_list_id
          shopping_list_add_item:
            description: Add an item to a shopping list
            method: POST
            endpoint: households/shopping/items
            writes:
              level: single
            requires:
            - item
            payload_schema:
              description: Shopping list item payload
              required:
              - name
              optional:
              - quantity
              - unit
              example:
                name: Milk
                quantity: 2
                unit: liters
          shopping_list_remove_item:
            description: Remove an item from a shopping list
            method: DELETE
            endpoint: households/shopping/items/{item_id}
            writes:
              level: destructive
            requires:
            - item_id
          shopping_list_check_item:
            description: "Check (or uncheck) a single shopping list item — the gap where nothing else in this tool could actually toggle Mealie's checkbox. Reads the item's current full object (GET the parent list), merges checked, PUTs it back so no other field is clobbered."
            method: PUT
            endpoint: households/shopping/items/{item_id}
            writes:
              level: single
            requires:
            - item_id
            - shopping_list_id
            optional:
            - checked (default true)
