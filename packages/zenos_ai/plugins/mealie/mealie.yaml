###############################################################################
# ZenOS-AI Plugin: Kitchen — Mealie Recipe/Kitchen Integration
# Version: 5.8.0
#
# COMPANION: kitchen_sync.yaml (same folder)
#   zen_dojotools_kitchen (this file) is the MCP/LLM surface. The Mealie<>Grocy
#   sync ENGINE lives in kitchen_sync.yaml (zen_admintools_kitchen_sync). The
#   case=sync_now and case=sync_queue_review delegate there. Changes to foods_list,
#   foods_tag, or kitchen_sync cabinet keys affect both files.
#
# SETUP
#
# 1. Add to secrets.yaml:
#      mealie_bearer: Bearer <your_long_lived_token>
#
# 2. Set input_text.mealie_url in HA (Settings > Helpers, or Developer Tools):
#      http://<your-mealie-host>:<port>   (no trailing slash)
#    Must be set once after install — value persists across restarts.
#
# HOW TO GET YOUR MEALIE TOKEN:
#   1. Log in to Mealie
#   2. Go to your Profile (top-right avatar) > API Tokens
#   3. Create a new Long-Lived Token
#   4. Copy the token and prefix it with "Bearer ":
#      mealie_bearer: Bearer eyJhbGci...
###############################################################################

input_text:
  mealie_url:
    name: "Mealie Base URL"
    max: 255
    mode: text
    icon: mdi:chef-hat

script:
  zen_sutra_mealie:
    alias: Zen DojoTools Mealie Advanced
    description: '
  
      Zen DojoTools Mealie (5.8.0) is a deterministic, construct-safe
      controller for governed interaction with the Mealie API.
  
      This tool provides validated GET, POST, PUT, and DELETE operations with enforced
      payload requirements, pagination discipline, and structured HELP output. It is
      designed as a stable backend layer intended to be called by higher-level Zen DojoTools
      helpers and automation systems.
  
      The controller mirrors the safety, response structure, and execution model of
      Grocy Advanced, ensuring consistency across household data systems.
  
      This tool does NOT accept raw or implicit writes. All write operations must be
      explicit and fully specified.
  
      Use mode=help to view supported operations, endpoints, and usage guidance.
  
      '
    mode: single
    icon: mdi:chef-hat
    fields:
      mode:
        name: Mode
        description: Run controller or show help
        selector:
          select:
            options:
            - run
            - help
        default: help
      method:
        name: HTTP Method
        selector:
          select:
            options:
            - GET
            - POST
            - PUT
            - DELETE
        required: true
      endpoint:
        name: Mealie Endpoint
        description: API path (e.g., recipes, tags, users/self/ratings/{recipe_id})
        selector:
          text:
      path_params:
        name: Path Params
        description: Dictionary for token substitution in endpoint
        selector:
          object:
      payload:
        name: Payload (JSON)
        description: Required for POST, PUT, DELETE
        selector:
          text:
            multiline: true
      search:
        name: Search
        description: (GET only) Free-text search
        selector:
          text:
      orderDirection:
        name: Order Direction
        description: (GET only) asc or desc
        selector:
          text:
        default: desc
      additional_params:
        name: Extra Filters
        description: (GET only) Additional query parameters
        selector:
          object:
      pageNumber:
        name: Page Number
        selector:
          number:
            min: 1
            max: 100
        default: 1
      perPage:
        name: Items Per Page
        selector:
          number:
            min: 1
            max: 50
        default: 10
    sequence:
    - variables:
        tool_version: 5.8.0
        docs: sensor.mealie_restful_openapi_docs
        is_get: '{{ method == ''GET'' }}'
        is_write: '{{ method in [''POST'',''PUT'',''DELETE''] }}'
        has_endpoint: '{{ endpoint is string and endpoint | length > 0 }}'
        needs_payload: '{{ is_write }}'
        kitchen_paths: '{{ state_attr(docs, ''paths'') | default({}, true) }}'
        kitchen_tags: "{% set ns = namespace(tags=[]) %}\n{% for methods in kitchen_paths.values()
          %}\n  {% for info in methods.values() if info.tags is defined %}\n    {% for
          tag in info.tags if tag not in ns.tags %}\n      {% set ns.tags = ns.tags
          + [tag] %}\n    {% endfor %}\n  {% endfor %}\n{% endfor %}\n{{ ns.tags | to_json
          }}"
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ mode == ''help'' }}'
          alias: HELP
        sequence:
        - variables:
            help_json:
              status: info
              tool: Zen DojoTools Mealie Advanced
              version: '{{ tool_version }}'
              mode: help
              description: 'Deterministic, construct-safe controller for the Mealie
                API. Provides governed GET/POST/PUT/DELETE access and structured HELP.
  
                '
              supported_methods:
              - GET
              - POST
              - PUT
              - DELETE
              required_fields:
                common:
                - endpoint
                write_operations:
                - payload
              optional_fields:
                read_operations:
                - search
                - orderDirection
                - additional_params
                - pageNumber
                - perPage
              pagination:
                defaults:
                  pageNumber: 1
                  perPage: 10
                limits:
                  pageNumber_max: 100
                  perPage_max: 50
                guidance: 'Pagination is strongly recommended for large result sets
                  to avoid response size limits.
  
                  '
              available_endpoints: '{{ kitchen_paths.keys() | list | to_json }}'
              available_tags: '{{ kitchen_tags }}'
              usage_notes:
              - Payloads are mandatory for POST, PUT, and DELETE
              - Read before write to avoid unintended overwrites
              - Use path_params to replace tokens such as {recipe_id}
              - This controller is intended to be wrapped by helper tools
              safety_model:
              - Explicit writes only
              - No implicit defaults for destructive actions
              - Deterministic response envelope
              authored_by: Friday
              authored_on: '2025-06-09T00:00:00.000Z'
            status: Help
            message: Help File.
            method: HELP
            result: '{{ help_json }}'
            final_response: "{{\n  {\n    \"status\": status | default(''),\n    \"message\":
              message | default(''),\n    \"method\": method | default('ERROR'),\n    \"endpoint\":
              endpoint | default(),\n    \"result\": result | default({})\n  }\n}}"
        - stop: Help
          response_variable: help_json
      - conditions:
        - condition: template
          value_template: '{{ not has_endpoint }}'
          alias: 'Error: Could Not Resolve Endpoint'
        sequence:
        - variables:
            status: error
            message: Endpoint is required.
            method: '{{ method | default(''ERROR'') }}'
            endpoint: '{{ endpoint }}'
            result: '{{ response }}'
            final_response: "{{\n  {\n    \"status\": status | default(''),\n    \"message\":
              message | default(''),\n    \"method\": method | default('ERROR'),\n    \"endpoint\":
              endpoint | default(),\n    \"result\": result | default({})\n  }\n}}"
        - stop: return
          response_variable: final_response
      - conditions:
        - condition: template
          value_template: '{{ needs_payload and (payload | trim == '''') }}'
          alias: 'Error: Missing Required Payload'
        sequence:
        - variables:
            status: error
            message: Payload is required for write operations.
            method: '{{ method | default(''ERROR'') }}'
            endpoint: '{{ endpoint }}'
            result: '{{ response }}'
            final_response: "{{\n  {\n    \"status\": status | default(''),\n    \"message\":
              message | default(''),\n    \"method\": method | default('ERROR'),\n    \"endpoint\":
              endpoint | default(),\n    \"result\": result | default({})\n  }\n}}"
        - stop: return
          response_variable: final_response
      - conditions:
        - condition: template
          value_template: '{{ is_get }}'
          alias: GET
        sequence:
        - variables:
            read_data: "{% set d = {\"endpoint\": endpoint} %}\n\n{% if path_params
              is defined\n      and path_params is mapping\n      and path_params |
              length > 0 %}\n  {% set d = d | combine({\"path_params\": path_params})
              %}\n{% endif %}\n\n{% if search is defined\n      and search is string\n
              \     and search | trim != '' %}\n  {% set d = d | combine({\"search\":
              search | trim}) %}\n{% endif %}\n\n{% if orderDirection is defined\n      and
              orderDirection in ['asc', 'desc'] %}\n  {% set d = d | combine({\"orderDirection\":
              orderDirection}) %}\n{% endif %}\n\n{% if additional_params is defined\n
              \     and additional_params is mapping\n      and additional_params |
              length > 0 %}\n  {% set d = d | combine({\"additional_params\": additional_params})
              %}\n{% endif %}\n\n{% if pageNumber is defined\n      and pageNumber |
              int(0) > 0 %}\n  {% set d = d | combine({\"pageNumber\": pageNumber |
              int(0)}) %}\n{% endif %}\n\n{% if perPage is defined\n      and perPage |
              int(0) > 0 %}\n  {% set d = d | combine({\"perPage\": perPage | int(0)})
              %}\n{% endif %}\n\n{{ d }}"
            response: {}
        - action: rest_command.mealie_api_advanced_get
          data: '{{ read_data }}'
          response_variable: response
        - variables:
            status: success
            method: '{{ method | default(''ERROR'') }}'
            message: '{{ method }} Complete'
            endpoint: '{{ endpoint }}'
            result: '{{ response }}'
            final_response: "{{\n  {\n    \"status\": status | default(''),\n    \"method\":
              method | default('ERROR'),\n    \"endpoint\": endpoint | default(),\n
              \   \"result\": result | default({})\n  }\n}}"
        - stop: return
          response_variable: final_response
      - conditions:
        - condition: template
          value_template: '{{ method == ''POST'' }}'
          alias: POST
        sequence:
        - action: rest_command.mealie_api_advanced_post
          response_variable: response
          data:
            endpoint: '{{ endpoint }}'
            path_params: '{{ path_params | default({}) }}'
            payload: '{{ payload }}'
        - variables:
            status: success
            method: '{{ method | default(''ERROR'') }}'
            message: '{{ method }} Complete'
            endpoint: '{{ endpoint }}'
            result: '{{ response }}'
            final_response: "{{\n  {\n    \"status\": status | default(''),\n    \"method\":
              method | default('ERROR'),\n    \"endpoint\": endpoint | default(),\n
              \   \"result\": result | default({})\n  }\n}}"
        - stop: return
          response_variable: final_response
      - conditions:
        - condition: template
          value_template: '{{ method == ''PUT'' }}'
          alias: PUT
        sequence:
        - action: rest_command.mealie_api_advanced_put
          response_variable: response
          data:
            endpoint: '{{ endpoint }}'
            path_params: '{{ path_params | default({}) }}'
            payload: '{{ payload }}'
        - variables:
            status: success
            method: '{{ method | default(''ERROR'') }}'
            message: '{{ method }} Complete'
            endpoint: '{{ endpoint }}'
            result: '{{ response }}'
            final_response: "{{\n  {\n    \"status\": status | default(''),\n    \"method\":
              method | default('ERROR'),\n    \"endpoint\": endpoint | default(),\n
              \   \"result\": result | default({})\n  }\n}}"
        - stop: return
          response_variable: final_response
      - conditions:
        - condition: template
          value_template: '{{ method == ''DELETE'' }}'
          alias: DELETE
        sequence:
        - action: rest_command.mealie_api_advanced_delete
          response_variable: response
          data:
            endpoint: '{{ endpoint }}'
            path_params: '{{ path_params | default({}) }}'
            payload: '{{ payload }}'
        - variables:
            status: success
            method: '{{ method | default(''ERROR'') }}'
            message: '{{ method }} Complete'
            endpoint: '{{ endpoint }}'
            result: '{{ response }}'
            final_response: "{{\n  {\n    \"status\": status | default(''),\n    \"message\":
              message | default(''),\n    \"method\": method | default('ERROR'),\n    \"endpoint\":
              endpoint | default(),\n    \"result\": result |default({})\n  }\n}}"
        - stop: return
          response_variable: final_response
    - variables:
        status: error
        message: Unhandled execution path
        method: '{{ method | default(''ERROR'') }}'
        endpoint: '{{ endpoint }}'
        result: '{{ response }}'
        final_response: "{{\n  {\n    \"status\": status | default(''),\n    \"message\":
          message | default(''),\n    \"method\": method | default('ERROR'),\n    \"endpoint\":
          endpoint | default(),\n    \"result\": result | default({})\n  }\n}}"
    - stop: return
      response_variable: final_response

  zen_dojotools_kitchen:
    alias: Zen DojoTools Kitchen
    description: 'Kitchen (v5.8.0) — Executive chef view of the household. Authoritative
      for all meal and recipe questions. Use mealplan_today for ''what''s for dinner
      tonight'', mealplan_week for ''what are we eating this week'', recipes_random
      for a suggestion. Covers recipes, meal plans, shopping lists, and the ingredient
      catalog. For cross-system linking use foods_tag to write grocy_product_id into
      a Mealie food''s extras dict. Vocabulary differs deliberately from Inventory:
      recipes are dishes, meal plans are the service schedule, shopping lists are mise
      en place. For pantry stock, quantities, and purchase tracking use
      zen_dojotools_inventory.

      '
    mode: parallel
    icon: mdi:silverware-fork-knife
    fields:
      mode:
        name: Mode
        selector:
          select:
            options:
            - help
            - run
            - tool_manifest
        default: help
      case:
        selector:
          select:
            options:
            - recipes_list
            - recipes_find
            - recipes_get
            - recipes_create
            - recipes_update
            - recipes_delete
            - recipes_get_stats
            - recipes_get_comments
            - recipes_add_comment
            - organizers_list
            - organizers_get
            - organizers_get_by_slug
            - organizers_create
            - organizers_update
            - organizers_delete
            - shopping_list_get
            - shopping_list_get_items
            - shopping_list_add_item
            - shopping_list_remove_item
            - shopping_list_clear_completed
            - shopping_list_generate_from_recipe
            - mealplan_list
            - mealplan_get_item
            - mealplan_add_recipe
            - mealplan_update_recipe
            - mealplan_delete_item
            - units_list
            - units_find
            - unit_get
            - unit_add
            - unit_update
            - unit_delete
            - foods_list
            - foods_find
            - food_get
            - food_add
            - food_update
            - food_delete
            - foods_tag
            - mealplan_today
            - mealplan_week
            - recipes_random
            - sync_now
            - shopping_lists_overview
            - shopping_list_detail
            - shopping_list_link
            - shopping_list_sync
            - notes_resolve
            - notes_promote
            - all_lists_sync
            - foods_audit
            - qty_sync
            - ambiguous_review
      recipe:
        name: Recipe Name
        selector:
          text:
      recipe_id:
        name: Recipe ID
        selector:
          text:
      title:
        name: Title
        selector:
          text:
      text:
        name: Text
        selector:
          text:
            multiline: true
      start_date:
        name: Start Date
        selector:
          date:
      end_date:
        name: End Date
        selector:
          date:
      page:
        name: Page
        selector:
          number:
            min: 1
        default: 1
      perPage:
        name: Per Page
        selector:
          number:
            min: 1
            max: 50
        default: 50
      orderDirection:
        name: Order Direction
        selector:
          select:
            options:
            - asc
            - desc
        default: desc
      item:
        name: Item
        selector:
          text:
      item_id:
        name: Item ID
        selector:
          text:
      quantity:
        name: Quantity
        selector:
          number:
            min: 0
      unit:
        name: Unit
        selector:
          text:
      date:
        name: Date
        selector:
          date:
      organizer_type:
        name: Organizer Type
        description: 'Choose one of the supported ''Organizer'' domains (categories,
          tags, tools).
  
          '
        selector:
          select:
            options:
            - categories
            - tags
            - tools
      entry_type:
        name: Entry Type
        selector:
          select:
            options:
            - breakfast
            - lunch
            - dinner
            - snack
        default: dinner
      slug:
        name: Slug
        description: Used when searching by 'slug' where supported.
        selector:
          text:
      search:
        name: Search
        selector:
          text:
      payload:
        name: Payload
        selector:
          text:
            multiline: true
      unit_plural:
        name: Unit Plural Name
        description: Optional plural form
        selector:
          text:
      unit_description:
        name: Unit Description
        selector:
          text:
      shopping_list:
        name: Shopping List
        description: Exact shopping list name to resolve to an ID
        selector:
          text:
      shopping_list_id:
        name: Shopping List ID
        description: Explicit shopping list ID (skips name resolution)
        selector:
          text:
      grocy_product_id:
        name: Grocy Product ID
        description: Grocy product ID for cross-system FK (foods_tag).
        selector:
          text:
      grocy_list_id:
        name: Grocy List ID
        description: Grocy shopping list integer ID for shopping_list_link.
        selector:
          number:
            min: 1
      sync_mode:
        name: Sync Mode
        description: preview = dry run (default). apply = write to Grocy.
        selector:
          select:
            options:
            - preview
            - apply
        default: preview
      sync_direction:
        name: Sync Direction
        selector:
          select:
            options:
            - mealie_to_grocy
            - grocy_to_mealie
        default: mealie_to_grocy
      sync_limit:
        name: Sync Limit
        description: Max foods to process per run (1-100).
        selector:
          number:
            min: 1
            max: 100
        default: 10
      sync_confirmation:
        name: Sync Confirmation
        description: Must be true to execute an apply run.
        selector:
          boolean:
        default: false
      sync_default_location:
        name: Sync Default Location
        description: Default Grocy storage location for new products.
        selector:
          text:
        default: Pantry
      sync_default_unit:
        name: Sync Default Unit
        description: Default Grocy unit for new products.
        selector:
          text:
        default: each
      sync:
        name: Sync to Grocy
        description: Auto-sync food to Grocy after add/update. Default true.
        selector:
          boolean:
        default: true
      include_notes:
        name: Include Notes
        description: Also sync unchecked note-only items (no food entity) via Grocy name dedup.
        selector:
          boolean:
        default: false
    sequence:
    - if: "{{ (mode | default('') | lower) == 'tool_manifest' }}"
      then:
      - variables:
          result: >-
            {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
            {{ MF.tool_manifest(
                tool='zen_dojotools_kitchen',
                display_name='Kitchen',
                tier='dojotools',
                version='5.8.0',
                health={'configured': true, 'status': 'ok', 'notes': []},
                required_labels=['mealie'],
                optional_labels=['mealie'],
                consumes=['recipe_request'],
                returns=['kitchen_response'],
                icon='mdi:chef-hat',
                color='orange',

                caller_token=caller_token | default('')
            ) | from_json }}
      - stop: tool_manifest
        response_variable: result
    - variables:
        tool_version: 5.8.0
        tool_branch: GA
    - variables:
        case_meta:
          recipes_list:
            description: List all recipes
            method: GET
            endpoint: recipes
            writes:
              level: none
            supports_search: true
          recipes_find:
            description: Search recipes by name or metadata
            method: GET
            endpoint: recipes
            writes:
              level: none
            supports_search: true
            requires:
            - search
          recipes_get:
            description: Get a recipe by ID
            method: GET
            endpoint: recipes/{id}
            writes:
              level: none
            requires:
            - recipe_id
          recipes_create:
            description: Create a new recipe
            method: POST
            endpoint: recipes
            writes:
              level: single
            requires:
            - payload
            payload_schema:
              description: Recipe creation payload
              required:
              - name
              optional:
              - description
              - ingredients
              - instructions
              - tags
              - categories
              - tools
              example:
                name: Spaghetti Carbonara
                description: Classic Roman pasta
                ingredients:
                - spaghetti
                - eggs
                - pancetta
                - pecorino
                instructions:
                - Boil pasta
                - Mix eggs and cheese
                - Combine with pancetta
          recipes_update:
            description: Update an existing recipe
            method: PUT
            endpoint: recipes/{id}
            writes:
              level: single
            requires:
            - recipe_id
            - payload
            payload_schema:
              description: Recipe update payload
              required: []
              optional:
              - name
              - description
              - ingredients
              - instructions
              - tags
              - categories
              - tools
          recipes_delete:
            description: Delete a recipe
            method: DELETE
            endpoint: recipes/{id}
            writes:
              level: destructive
            requires:
            - recipe_id
          recipes_get_stats:
            description: Get statistics for a recipe
            method: GET
            endpoint: recipes/{id}/stats
            writes:
              level: none
            requires:
            - recipe_id
          recipes_get_comments:
            description: Get comments for a recipe
            method: GET
            endpoint: recipes/{id}/comments
            writes:
              level: none
            requires:
            - recipe_id
          recipes_add_comment:
            description: Add a comment to a recipe
            method: POST
            endpoint: recipes/{id}/comments
            writes:
              level: single
            requires:
            - recipe_id
            - text
            payload_schema:
              description: Comment payload
              required:
              - text
          mealplan_list:
            description: List meal plan entries
            method: GET
            endpoint: households/mealplans
            writes:
              level: none
            optional:
            - start_date
            - end_date
            - orderBy
            - orderDirection
            - page
            - perPage
            - queryFilter
          mealplan_get_item:
            description: Get a meal plan entry by ID
            method: GET
            endpoint: households/mealplans/{item_id}
            writes:
              level: none
            requires:
            - item_id
          mealplan_add_recipe:
            description: Schedule a recipe or note in the meal plan
            method: POST
            endpoint: households/mealplans
            writes:
              level: bulk
            requires:
            - date
            - entry_type
            allowed_entry_types:
            - breakfast
            - lunch
            - dinner
            - snack
            payload_schema:
              description: Meal plan entry payload
              required:
              - date
              - entryType
              optional:
              - recipeId
              - title
              - text
              example:
                date: '2025-12-25'
                entryType: dinner
                title: ''
                text: ''
          mealplan_update_recipe:
            description: Update an existing meal plan entry
            method: PUT
            endpoint: households/mealplans/{item_id}
            writes:
              level: bulk
            requires:
            - item_id
            - date
            - entry_type
            allowed_entry_types:
            - breakfast
            - lunch
            - dinner
            - snack
            payload_schema:
              description: Meal plan update payload
              required:
              - id
              - date
              - entryType
              optional:
              - recipeId
              - title
              - text
              example:
                id: 42
                recipeId: abc123
                date: '2025-12-25'
                entryType: dinner
          mealplan_delete_item:
            description: Delete a meal plan entry
            method: DELETE
            endpoint: households/mealplans/{item_id}
            writes:
              level: destructive
            requires:
            - item_id
          shopping_list_get:
            description: List all shopping lists
            method: GET
            endpoint: households/shopping/lists
            writes:
              level: none
          shopping_list_get_items:
            description: Get all items in a shopping list
            method: GET
            endpoint: households/shopping/lists/{shopping_list_id}
            writes:
              level: none
            requires:
            - shopping_list_id
          shopping_list_add_item:
            description: Add an item to a shopping list
            method: POST
            endpoint: households/shopping/items
            writes:
              level: single
            requires:
            - item
            payload_schema:
              description: Shopping list item payload
              required:
              - name
              optional:
              - quantity
              - unit
              example:
                name: Milk
                quantity: 2
                unit: liters
          shopping_list_remove_item:
            description: Remove an item from a shopping list
            method: DELETE
            endpoint: households/shopping/items/{item_id}
            writes:
              level: destructive
            requires:
            - item_id
          shopping_list_clear_completed:
            description: Remove all completed items from shopping lists
            method: DELETE
            endpoint: households/shopping/items
            writes:
              level: bulk
            requires:
            - item_id
          shopping_list_generate_from_recipe:
            description: Generate shopping list items from a recipe
            method: POST
            endpoint: households/shopping/lists/{shopping_list_id}/recipe
            writes:
              level: bulk
            requires:
            - recipe_id
          units_list:
            description: List all measurement units
            method: GET
            endpoint: units
            writes:
              level: none
            supports_search: true
          units_find:
            description: Search measurement units by name
            method: GET
            endpoint: units
            writes:
              level: none
            supports_search: true
            requires:
            - search
          unit_get:
            description: Get a measurement unit by ID
            method: GET
            endpoint: units/{id}
            writes:
              level: none
            requires:
            - item_id
          unit_add:
            description: Create a new measurement unit
            method: POST
            endpoint: units
            writes:
              level: single
            requires:
            - unit
            payload_schema:
              description: Unit creation payload
              required:
              - name
              optional:
              - pluralName
              - description
          unit_update:
            description: Update a measurement unit
            method: PUT
            endpoint: units/{id}
            writes:
              level: single
            requires:
            - item_id
            - unit
            payload_schema:
              description: Unit update payload
              required:
              - id
              - name
              optional:
              - pluralName
              - description
          unit_delete:
            description: Delete a measurement unit
            method: DELETE
            endpoint: units/{id}
            writes:
              level: destructive
            requires:
            - item_id
          foods_list:
            description: List all foods
            method: GET
            endpoint: foods
            writes:
              level: none
            supports_search: false
          foods_find:
            description: Search foods by name
            method: GET
            endpoint: foods
            writes:
              level: none
            supports_search: true
            requires:
            - search
          food_get:
            description: Get a food by ID
            method: GET
            endpoint: foods/{id}
            writes:
              level: none
            requires:
            - item_id
          food_add:
            description: Create a new food
            method: POST
            endpoint: foods
            writes:
              level: single
            requires:
            - payload
            payload_schema:
              description: Food creation payload
              required:
              - name
              optional:
              - description
              - foodGroup
              - label
          food_update:
            description: Update a food
            method: PUT
            endpoint: foods/{id}
            writes:
              level: single
            requires:
            - item_id
            - payload
            payload_schema:
              description: Food update payload
              required: []
              optional:
              - name
              - description
              - foodGroup
              - label
          food_delete:
            description: Delete a food
            method: DELETE
            endpoint: foods/{id}
            writes:
              level: destructive
            requires:
            - item_id
          organizers_list:
            description: List all organizers of a given type
            method: GET
            endpoint: organizers/{organizer_type}
            writes:
              level: none
            supports_search: false
            requires:
            - organizer_type
          organizers_get:
            description: Get an organizer by ID
            method: GET
            endpoint: organizers/{organizer_type}/{item_id}
            writes:
              level: none
            requires:
            - organizer_type
            - item_id
          organizers_get_by_slug:
            description: Get an organizer by slug
            method: GET
            endpoint: organizers/{organizer_type}/slug/{slug}
            writes:
              level: none
            requires:
            - organizer_type
            - slug
          organizers_create:
            description: Create a new organizer
            method: POST
            endpoint: organizers/{organizer_type}
            writes:
              level: single
            requires:
            - organizer_type
            - payload
            payload_schema:
              description: Organizer creation payload
              required:
              - name
              optional:
              - description
              - slug
              - icon
              - color
              example:
                name: Italian
                description: Italian cuisine
                slug: italian
          organizers_update:
            description: Update an organizer
            method: PUT
            endpoint: organizers/{organizer_type}/{item_id}
            writes:
              level: single
            requires:
            - organizer_type
            - item_id
            - payload
            payload_schema:
              description: Organizer update payload
              required: []
              optional:
              - name
              - description
              - slug
              - icon
              - color
          organizers_delete:
            description: Delete an organizer
            method: DELETE
            endpoint: organizers/{organizer_type}/{item_id}
            writes:
              level: destructive
            requires:
            - organizer_type
            - item_id
          mealplan_today:
            description: Get today's meal plan grouped by entry type. Answers 'what's for dinner tonight?'
            method: GET
            endpoint: households/mealplans
            writes:
              level: none
            requires: []
          mealplan_week:
            description: Get this week's meal plan (Mon-Sun) grouped by date then entry type. Answers 'what are we eating this week?'
            method: GET
            endpoint: households/mealplans
            writes:
              level: none
            requires: []
          recipes_random:
            description: Get a random recipe suggestion. Answers 'suggest something for dinner' or 'what should I make tonight?'
            method: GET
            endpoint: recipes
            writes:
              level: none
            requires: []
          foods_tag:
            description: Tag a food with cross-system link fields (grocy_product_id into extras dict). Requires item_id or item (name lookup).
            method: PUT
            endpoint: foods/{id}
            writes:
              level: single
            requires: []
          sync_now:
            description: "Trigger Mealie→Grocy food catalog sync. Idempotent — safe to run repeatedly; skip_linked=true (default) skips foods already linked so limit=N always processes N unlinked foods. Preview first (default), then apply with sync_confirmation=true. Run foods_audit first to see coverage. For FK repair set skip_linked=false."
            method: internal
            endpoint: script.zen_admintools_kitchen_sync
            writes:
              level: batch
            requires: []
          shopping_lists_overview:
            description: All Mealie shopping lists — name, linked Grocy list ID, item counts (total/unchecked/note_only). Cabinet-index view of the shopping system.
            method: GET
            endpoint: households/shopping/lists
            writes:
              level: none
            requires: []
          shopping_list_detail:
            description: Items in a specific list with sync_status per row (ready/pending/note_only/checked). Requires item (list name) or shopping_list_id.
            method: GET
            endpoint: households/shopping/lists
            writes:
              level: none
            requires:
            - item or shopping_list_id
          shopping_list_link:
            description: Link a Mealie shopping list to a Grocy shopping list. Writes grocy_list_id into list extras. Use zen_dojotools_inventory mode=shopping_lists_list to find Grocy list IDs first.
            method: PUT
            endpoint: households/shopping/lists/{id}
            writes:
              level: single
            requires:
            - item or shopping_list_id
            - grocy_list_id
          shopping_list_sync:
            description: Sync ready items (food-linked + grocy_product_id set + unchecked) from a Mealie list to the linked Grocy shopping list. sync_mode=preview (default) shows plan. sync_mode=apply writes. List must be linked first via shopping_list_link.
            method: internal
            endpoint: internal
            writes:
              level: batch
            requires:
            - item or shopping_list_id
          all_lists_sync:
            description: "Sync all linked Mealie shopping lists to Grocy in one call. Prefs read from household cabinet key 'kitchen_sync' — if drawer is missing, defaults are written automatically on first run: {include_notes: true, default_location: 'Pantry', default_unit: 'each'}. Item quantities are synced. Writes last-run summary to kitchen_sync_last_run. Default mode is apply."
            method: internal
            endpoint: internal
            writes:
              level: batch
            requires: []
            example: "{'case':'all_lists_sync','sync_mode':'apply'}"
          ambiguous_review:
            description: "Read the kitchen_sync_ambiguous_queue from household cabinet — foods where sync_now found multiple Grocy candidates but no exact match. Returns food_name, food_id, and candidates list. Resolve each by calling foods_tag (pick a candidate) or zen_dojotools_inventory products_merge (collapse duplicates first). Use sync_limit to page (default 10)."
            method: internal
            endpoint: internal
            writes:
              level: none
            requires: []
            example: "{'case':'ambiguous_review','sync_limit':10}"
          qty_sync:
            description: "Grocy→Mealie stock quantity sync. For each Mealie food with a grocy_product_id FK, fetches current Grocy stock_amount and writes grocy_stock_qty + grocy_stock_updated_at into food extras. Grocy is lord — Mealie value is overwritten. Errors skipped. Default mode apply."
            method: internal
            endpoint: internal
            writes:
              level: batch
            requires: []
            example: "{'case':'qty_sync'}"
          foods_audit:
            description: "FK coverage health check across all Mealie foods. Reports total, linked (has grocy_product_id), unlinked (no FK), coverage %, sample of unlinked names, and last sync run summary from household cabinet. Run before sync_now to know what needs bootstrapping."
            method: internal
            endpoint: internal
            writes:
              level: none
            requires: []
            example: "{'case':'foods_audit'}"
          notes_resolve:
            description: Resolve note-only items from shopping_list_sync. Single-item mode requires item + grocy_product_id. Bulk mode — pass payload as JSON list of {name, grocy_product_id} objects to resolve many in one call.
            method: internal
            endpoint: internal
            writes:
              level: single
            requires:
            - item
            - grocy_product_id
            example: "{'case':'notes_resolve','item':'Shampoo','grocy_product_id':'590'}"
          notes_promote:
            description: "Promote note-only shopping list items to food-linked items after notes_resolve. For each note-only row, finds the matching Mealie food (must have grocy_product_id) and writes foodId back to the list item, making it ready for shopping_list_sync. Workflow: notes_resolve → notes_promote → shopping_list_sync."
            method: internal
            endpoint: internal
            writes:
              level: batch
            requires:
            - item or shopping_list_id
            example: "{'case':'notes_promote','item':'HEB'}"
    - variables:
        safe_item: '{{ item | default('''') }}'
        safe_quantity: '{{ quantity | default(1) }}'
        safe_unit: '{{ unit | default('''') }}'
        safe_search: '{{ search | default('''') }}'
        safe_recipe_id: '{{ recipe_id | default('''') }}'
        safe_title: '{{ title | default('''') }}'
        safe_text: '{{ text | default('''') }}'
        safe_item_id: '{{ item_id | default('''') }}'
        safe_date: '{{ date | default('''') }}'
        safe_entry_type: '{{ entry_type | default(''dinner'') }}'
        safe_payload: '{{ payload | default('''') }}'
        safe_unit_plural: '{{ unit_plural | default('''') }}'
        safe_unit_description: '{{ unit_description | default('''') }}'
        safe_shopping_list: '{{ shopping_list | default('''') }}'
        safe_shopping_list_id: '{{ shopping_list_id | default('''') }}'
        safe_organizer_type: '{{ organizer_type | default('''') | string | trim }}'
        safe_slug: '{{ slug | default('''') | string | trim }}'
        safe_grocy_product_id: '{{ grocy_product_id | default('''') | string | trim }}'
        safe_grocy_list_id: '{{ grocy_list_id | default(none) | int(none) }}'
        safe_sync_mode: '{{ sync_mode | default(''preview'') }}'
        safe_sync_direction: '{{ sync_direction | default(''mealie_to_grocy'') }}'
        safe_sync_limit: '{{ sync_limit | default(10) | int }}'
        safe_sync_confirmation: '{{ sync_confirmation | default(false) }}'
        safe_sync_default_location: '{{ sync_default_location | default(''Pantry'') }}'
        safe_sync_default_unit: '{{ sync_default_unit | default(''each'') }}'
        safe_sync: '{{ sync | default(true) }}'
        safe_include_notes: '{{ include_notes | default(false) }}'
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ mode == ''help'' }}'
        sequence:
        - variables:
            help_response:
              status: info
              tool: Zen DojoTools Kitchen
              version: '{{ tool_version |  default(None) }}'
              branch: '{{ tool_branch |  default('''') }}'
              notes: "This should be your FIRST choice for all Mealie operations. (Because
                it's THAT good!) \nThis helper translates explicit, safe intent only.
                Transport, retries, pagination strategy, permissions, observability,
                and batching are handled externally by Zen governance layers.    \n"
              philosophy:
              - Fail closed
              - Explicit intent only
              - Write-aware execution
              cases: "[ {% for name, meta in case_meta | dictsort %}\n  {\n    \"case\":
                \"{{ name }}\",\n    \"description\": {{\n      meta.description\n      |
                default(meta.payload_schema.description if meta.payload_schema is defined
                else None)\n      | to_json\n    }},\n    \"supports_search\": \"{{
                meta.supports_search | default(false) | tojson }}\",\n    \"writes\":
                \"{{ meta.writes.level }}\",\n    \"requires\": {{ meta.requires | default([])
                | to_json }},\n    \"payload_schema\": {{ meta.payload_schema | default(None)
                | to_json }}\n  }{% if not loop.last %},{% endif %}\n{% endfor %} ]"
        - stop: return
          response_variable: help_response
        alias: HELP
    - alias: Preflight Case validation
      choose:
      - conditions:
        - condition: template
          value_template: '{{ case not in case_meta }}'
          alias: 'Error: Unknown case.'
        sequence:
        - variables:
            error_response:
              status: error
              message: Unknown case.
        - stop: return
          response_variable: error_response
    - alias: Early exit — mealplan_today
      choose:
      - conditions:
        - condition: template
          value_template: '{{ case == "mealplan_today" }}'
        sequence:
        - variables:
            mp_today: '{{ now().strftime(''%Y-%m-%d'') }}'
        - action: script.zen_sutra_mealie
          response_variable: mp_resp
          data:
            mode: run
            method: GET
            endpoint: households/mealplans
            payload: '{{ none }}'
            pageNumber: 1
            perPage: 100
            additional_params: '{{ {"start_date": mp_today, "end_date": mp_today, "perPage": "100"} }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ mp_resp.result.status | default(200) >= 400 }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: mealplan_today
                  message: 'Meal plan fetch failed.'
            - stop: return
              response_variable: error_response
        - variables:
            mp_items: >-
              {{
                mp_resp.result.content.get('items', [])
                if mp_resp.result.content is mapping else []
              }}
        - variables:
            mp_meals: >-
              {%- set ns = namespace(meals={}) -%}
              {%- for item in mp_items -%}
                {%- set etype = item.get('entryType', 'unknown') -%}
                {%- set rname = item.get('recipe', {}).get('name', '') if item.get('recipe') is mapping else item.get('title', '') -%}
                {%- set entry = {'id': item.get('id', ''), 'recipe_id': item.get('recipeId', ''), 'name': rname} -%}
                {%- if etype in ns.meals -%}
                  {%- set ns.meals = ns.meals | combine({etype: ns.meals[etype] + [entry]}) -%}
                {%- else -%}
                  {%- set ns.meals = ns.meals | combine({etype: [entry]}) -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.meals }}
        - variables:
            final_response:
              status: success
              case: mealplan_today
              date: '{{ mp_today }}'
              meals: '{{ mp_meals }}'
              count: '{{ mp_items | length }}'
              writes:
                level: none
        - stop: return
          response_variable: final_response
    - alias: Early exit — mealplan_week
      choose:
      - conditions:
        - condition: template
          value_template: '{{ case == "mealplan_week" }}'
        sequence:
        - variables:
            mp_week_start: '{{ (now().date() - timedelta(days=now().weekday())).strftime(''%Y-%m-%d'') }}'
            mp_week_end: '{{ (now().date() + timedelta(days=6 - now().weekday())).strftime(''%Y-%m-%d'') }}'
        - action: script.zen_sutra_mealie
          response_variable: mp_resp
          data:
            mode: run
            method: GET
            endpoint: households/mealplans
            payload: '{{ none }}'
            pageNumber: 1
            perPage: 100
            additional_params: '{{ {"start_date": mp_week_start, "end_date": mp_week_end, "perPage": "100"} }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ mp_resp.result.status | default(200) >= 400 }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: mealplan_week
                  message: 'Meal plan fetch failed.'
            - stop: return
              response_variable: error_response
        - variables:
            mp_items: >-
              {{
                mp_resp.result.content.get('items', [])
                if mp_resp.result.content is mapping else []
              }}
        - variables:
            mp_days: >-
              {%- set ns = namespace(days={}) -%}
              {%- for item in mp_items -%}
                {%- set day = item.get('date', '') -%}
                {%- set etype = item.get('entryType', 'unknown') -%}
                {%- set rname = item.get('recipe', {}).get('name', '') if item.get('recipe') is mapping else item.get('title', '') -%}
                {%- set entry = {'id': item.get('id', ''), 'recipe_id': item.get('recipeId', ''), 'name': rname} -%}
                {%- set day_dict = ns.days.get(day, {}) -%}
                {%- if etype in day_dict -%}
                  {%- set day_dict = day_dict | combine({etype: day_dict[etype] + [entry]}) -%}
                {%- else -%}
                  {%- set day_dict = day_dict | combine({etype: [entry]}) -%}
                {%- endif -%}
                {%- set ns.days = ns.days | combine({day: day_dict}) -%}
              {%- endfor -%}
              {{ ns.days }}
        - variables:
            final_response:
              status: success
              case: mealplan_week
              week_start: '{{ mp_week_start }}'
              week_end: '{{ mp_week_end }}'
              days: '{{ mp_days }}'
              total_meals: '{{ mp_items | length }}'
              writes:
                level: none
        - stop: return
          response_variable: final_response
    - alias: Early exit — recipes_random
      choose:
      - conditions:
        - condition: template
          value_template: '{{ case == "recipes_random" }}'
        sequence:
        - action: script.zen_sutra_mealie
          response_variable: rr_resp
          data:
            mode: run
            method: GET
            endpoint: recipes
            payload: '{{ none }}'
            pageNumber: 1
            perPage: 1
            additional_params: '{{ {"random": "true", "perPage": "1"} }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ rr_resp.result.status | default(200) >= 400 }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: recipes_random
                  message: 'Failed to fetch random recipe.'
            - stop: return
              response_variable: error_response
        - variables:
            rr_items: >-
              {{
                rr_resp.result.content.get('items', [])
                if rr_resp.result.content is mapping else []
              }}
            rr_recipe: '{{ rr_items | first | default({}) }}'
        - variables:
            final_response:
              status: success
              case: recipes_random
              recipe:
                id: '{{ rr_recipe.get(''id'', '''') }}'
                slug: '{{ rr_recipe.get(''slug'', '''') }}'
                name: '{{ rr_recipe.get(''name'', '''') }}'
                description: '{{ rr_recipe.get(''description'', '''') }}'
                total_time: '{{ rr_recipe.get(''totalTime'', '''') }}'
                tags: '{{ rr_recipe.get(''tags'', []) }}'
              writes:
                level: none
        - stop: return
          response_variable: final_response
    - alias: Early exit — foods_tag
      choose:
      - conditions:
        - condition: template
          value_template: '{{ case == "foods_tag" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ safe_item_id == "" and safe_item == "" }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: foods_tag
                  message: 'foods_tag requires item_id (explicit food ID) or item (food name for lookup).'
            - stop: return
              response_variable: error_response
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ safe_item_id == "" and safe_item != "" }}'
            sequence:
            - action: script.zen_sutra_mealie
              response_variable: ft_find_resp
              data:
                mode: run
                method: GET
                endpoint: foods
                payload: '{{ none }}'
                pageNumber: 1
                perPage: 20
                additional_params: '{{ {"search": safe_item} }}'
            - variables:
                ft_items: >-
                  {{
                    ft_find_resp.result.content.get('items', [])
                    if ft_find_resp.result.content is mapping else []
                  }}
                ft_exact: >-
                  {{
                    ft_items
                    | selectattr('name', 'defined')
                    | selectattr('name', 'equalto', safe_item)
                    | list | first | default(none)
                  }}
            - choose:
              - conditions:
                - condition: template
                  value_template: '{{ ft_exact is none }}'
                sequence:
                - variables:
                    error_response:
                      status: error
                      case: foods_tag
                      message: 'Food not found by name: "{{ safe_item }}"'
                - stop: return
                  response_variable: error_response
            - variables:
                safe_item_id: '{{ (ft_exact.get(''id'', '''') | string) }}'
        - action: script.zen_sutra_mealie
          response_variable: ft_get_resp
          data:
            mode: run
            method: GET
            endpoint: 'foods/{{ safe_item_id }}'
            payload: '{{ none }}'
            pageNumber: 1
            perPage: 1
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ ft_get_resp.result.status | default(200) >= 400 }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: foods_tag
                  message: 'Failed to fetch food {{ safe_item_id }}.'
            - stop: return
              response_variable: error_response
        - variables:
            ft_food: >-
              {{
                ft_get_resp.result.content
                if ft_get_resp.result.content is mapping else {}
              }}
            ft_extras: >-
              {{
                ft_food.get('extras', {})
                if ft_food is mapping else {}
              }}
        - variables:
            ft_new_extras: >-
              {{
                ft_extras | combine(
                  {'grocy_product_id': safe_grocy_product_id | int}
                  if safe_grocy_product_id | string | trim != '' else {}
                )
              }}
            ft_updated_food: '{{ ft_food | combine({''extras'': ft_new_extras}) }}'
        - action: script.zen_sutra_mealie
          response_variable: ft_put_resp
          data:
            mode: run
            method: PUT
            endpoint: 'foods/{{ safe_item_id }}'
            payload: '{{ ft_updated_food | tojson }}'
            pageNumber: 1
            perPage: 1
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ ft_put_resp.result.status | default(200) >= 400 }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: foods_tag
                  message: 'Failed to update food {{ safe_item_id }}.'
            - stop: return
              response_variable: error_response
        - variables:
            final_response:
              status: success
              case: foods_tag
              food_id: '{{ safe_item_id }}'
              food_name: '{{ ft_food.get(''name'', '''') }}'
              extras: '{{ ft_new_extras }}'
              writes:
                level: single
              summary: Food tagged with cross-system links.
        - stop: return
          response_variable: final_response
    - alias: Early exit — notes_resolve
      choose:
      - conditions:
        - condition: template
          value_template: '{{ case == "notes_resolve" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ safe_payload is string and (safe_payload | trim) != "" }}'
            sequence:
            - variables:
                _nrb_items: '{{ safe_payload | from_json | default([]) }}'
                _nrb_resolved: []
                _nrb_errors: []
            - repeat:
                for_each: '{{ _nrb_items }}'
                sequence:
                - variables:
                    _nrb_name: '{{ (repeat.item.get("name", "") ~ "") | trim }}'
                    _nrb_gpid: '{{ (repeat.item.get("grocy_product_id", "") ~ "") | string | trim }}'
                - action: script.zen_sutra_mealie
                  response_variable: _nrb_search_raw
                  continue_on_error: true
                  data:
                    mode: run
                    method: GET
                    endpoint: foods
                    payload: '{{ none }}'
                    pageNumber: 1
                    perPage: 50
                    additional_params: '{{ {"search": _nrb_name} }}'
                - variables:
                    _nrb_all: >-
                      {{ _nrb_search_raw.result.content.get('items', [])
                         if (_nrb_search_raw.result.content is mapping) else [] }}
                    _nrb_exact: >-
                      {{ _nrb_all | selectattr('name','equalto', _nrb_name) | list | first | default(none) }}
                - variables:
                    _nrb_food_id: '{{ _nrb_exact.id if _nrb_exact is not none else none }}'
                    _nrb_action: '{{ "tagged" if _nrb_exact is not none else "pending_create" }}'
                - choose:
                  - conditions:
                    - condition: template
                      value_template: '{{ _nrb_food_id is none and _nrb_name != "" }}'
                    sequence:
                    - action: script.zen_sutra_mealie
                      response_variable: _nrb_create_raw
                      continue_on_error: true
                      data:
                        mode: run
                        method: POST
                        endpoint: foods
                        payload: '{{ {"name": _nrb_name} | tojson }}'
                    - variables:
                        _nrb_food_id: >-
                          {{ _nrb_create_raw.result.content.id
                             if (_nrb_create_raw.result.content is mapping) else none }}
                        _nrb_action: created
                - choose:
                  - conditions:
                    - condition: template
                      value_template: '{{ _nrb_food_id is not none and _nrb_gpid != "" }}'
                    sequence:
                    - action: script.zen_sutra_mealie
                      response_variable: _nrb_food_raw
                      continue_on_error: true
                      data:
                        mode: run
                        method: GET
                        endpoint: 'foods/{{ _nrb_food_id }}'
                        payload: '{{ none }}'
                    - variables:
                        _nrb_food_obj: >-
                          {{ _nrb_food_raw.result.content
                             if (_nrb_food_raw.result.content is mapping) else {} }}
                    - action: script.zen_sutra_mealie
                      response_variable: _nrb_tag_raw
                      continue_on_error: true
                      data:
                        mode: run
                        method: PUT
                        endpoint: 'foods/{{ _nrb_food_id }}'
                        payload: >-
                          {{ _nrb_food_obj | combine({"extras":
                             (_nrb_food_obj.extras if _nrb_food_obj.extras is mapping else {})
                             | combine({"grocy_product_id": _nrb_gpid | string})
                          }) | tojson }}
                    - variables:
                        _nrb_resolved: >-
                          {{ _nrb_resolved + [{"name": _nrb_name, "action": _nrb_action, "food_id": _nrb_food_id, "grocy_product_id": _nrb_gpid}] }}
                  - conditions:
                    - condition: template
                      value_template: '{{ true }}'
                    sequence:
                    - variables:
                        _nrb_errors: >-
                          {{ _nrb_errors + [{"name": _nrb_name, "error": "no food resolved or no grocy_product_id"}] }}
            - variables:
                final_response:
                  status: success
                  case: notes_resolve
                  mode: bulk
                  resolved: '{{ _nrb_resolved | length }}'
                  errors: '{{ _nrb_errors | length }}'
                  resolved_items: '{{ _nrb_resolved }}'
                  error_items: '{{ _nrb_errors }}'
            - stop: return
              response_variable: final_response
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ safe_item == "" or safe_grocy_product_id == "" }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: notes_resolve
                  message: notes_resolve requires item (food name) and grocy_product_id.
            - stop: return
              response_variable: error_response
        - action: script.zen_sutra_mealie
          response_variable: _nr_search_raw
          data:
            mode: run
            method: GET
            endpoint: foods
            payload: '{{ none }}'
            pageNumber: 1
            perPage: 50
            additional_params: '{{ {"search": safe_item} }}'
        - variables:
            _nr_all: >-
              {{ _nr_search_raw.result.content.get('items', [])
                 if _nr_search_raw.result.content is mapping else [] }}
            _nr_exact: >-
              {{ _nr_all | selectattr('name','equalto', safe_item) | list | first | default(none) }}
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _nr_exact is not none }}'
            sequence:
            - variables:
                _nr_food_id: '{{ _nr_exact.id }}'
                _nr_action: tagged
          - conditions:
            - condition: template
              value_template: '{{ true }}'
            sequence:
            - action: script.zen_sutra_mealie
              response_variable: _nr_create_raw
              data:
                mode: run
                method: POST
                endpoint: foods
                payload: '{{ {"name": safe_item} | tojson }}'
            - variables:
                _nr_food_id: >-
                  {{ _nr_create_raw.result.content.id
                     if _nr_create_raw.result.content is mapping else none }}
                _nr_action: created
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _nr_food_id is none }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: notes_resolve
                  message: Could not find or create Mealie food.
            - stop: return
              response_variable: error_response
        - action: script.zen_sutra_mealie
          response_variable: _nr_food_raw
          data:
            mode: run
            method: GET
            endpoint: 'foods/{{ _nr_food_id }}'
            payload: '{{ none }}'
        - variables:
            _nr_food_obj: >-
              {{ _nr_food_raw.result.content
                 if _nr_food_raw.result.content is mapping else {} }}
        - action: script.zen_sutra_mealie
          response_variable: _nr_tag_raw
          continue_on_error: true
          data:
            mode: run
            method: PUT
            endpoint: 'foods/{{ _nr_food_id }}'
            payload: >-
              {{ _nr_food_obj | combine({"extras":
                 (_nr_food_obj.extras if _nr_food_obj.extras is mapping else {})
                 | combine({"grocy_product_id": safe_grocy_product_id | string})
              }) | tojson }}
        - variables:
            final_response:
              status: success
              case: notes_resolve
              food_id: '{{ _nr_food_id }}'
              food_name: '{{ safe_item }}'
              grocy_product_id: '{{ safe_grocy_product_id }}'
              action: '{{ _nr_action }}'
              writes:
                level: single
        - stop: return
          response_variable: final_response
    - alias: Early exit — notes_promote
      choose:
      - conditions:
        - condition: template
          value_template: '{{ case == "notes_promote" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ safe_item == "" and safe_shopping_list_id == "" }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: notes_promote
                  message: notes_promote requires item (list name) or shopping_list_id.
            - stop: return
              response_variable: error_response
        - action: script.zen_sutra_mealie
          response_variable: _np_lists_raw
          data:
            mode: run
            method: GET
            endpoint: households/shopping/lists
            payload: '{{ none }}'
            pageNumber: 1
            perPage: 50
        - variables:
            _np_all_lists: >-
              {{
                _np_lists_raw.result.content.get('items', [])
                if _np_lists_raw.result.content is mapping else []
              }}
        - variables:
            _np_list: >-
              {%- if safe_shopping_list_id != '' -%}
                {{ _np_all_lists | selectattr('id', 'equalto', safe_shopping_list_id) | list | first | default(none) }}
              {%- else -%}
                {{ _np_all_lists | selectattr('name', 'search', '(?i)^' ~ safe_item ~ '$') | list | first | default(none) }}
              {%- endif -%}
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _np_list is none }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: notes_promote
                  message: Shopping list not found. Use shopping_lists_overview to see available lists.
            - stop: return
              response_variable: error_response
        - action: script.zen_sutra_mealie
          response_variable: _np_full_raw
          data:
            mode: run
            method: GET
            endpoint: 'households/shopping/lists/{{ _np_list.id }}'
            payload: '{{ none }}'
        - variables:
            _np_full: >-
              {{ _np_full_raw.result.content
                 if _np_full_raw.result.content is mapping else {} }}
        - variables:
            _np_items_raw: '{{ _np_full.listItems if _np_full.listItems is sequence else [] }}'
        - variables:
            _np_note_items: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for i in _np_items_raw -%}
                {%- if not i.checked and (not i.foodId or i.foodId is none) -%}
                  {%- set name = (i.note | default('', true) | trim) or (i.display | default('', true) | trim) -%}
                  {%- if name != '' -%}
                    {%- set ns.out = ns.out + [{'id': i.id, 'name': name, 'item': i}] -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out }}
        - variables:
            _np_promoted: []
            _np_not_found: []
            _np_no_link: []
            _np_errors: []
        - repeat:
            for_each: '{{ _np_note_items }}'
            sequence:
            - action: script.zen_sutra_mealie
              response_variable: _np_food_search_raw
              continue_on_error: true
              data:
                mode: run
                method: GET
                endpoint: foods
                payload: '{{ none }}'
                pageNumber: 1
                perPage: 50
                additional_params: '{{ {"search": repeat.item.name} }}'
            - variables:
                _np_food_results: >-
                  {{ _np_food_search_raw.result.content.get('items', [])
                     if (_np_food_search_raw.result.content is mapping) else [] }}
                _np_food_exact: >-
                  {{ _np_food_results | selectattr('name', 'equalto', repeat.item.name) | list | first | default(none) }}
            - choose:
              - conditions:
                - condition: template
                  value_template: '{{ _np_food_exact is none }}'
                sequence:
                - variables:
                    _np_not_found: '{{ _np_not_found + [repeat.item.name] }}'
              - conditions:
                - condition: template
                  value_template: >-
                    {{ (_np_food_exact.extras is not mapping)
                       or (_np_food_exact.extras.get("grocy_product_id", none) is none)
                       or ((_np_food_exact.extras.get("grocy_product_id", "") ~ "") | trim == "") }}
                sequence:
                - variables:
                    _np_no_link: '{{ _np_no_link + [repeat.item.name] }}'
              - conditions:
                - condition: template
                  value_template: '{{ true }}'
                sequence:
                - action: script.zen_sutra_mealie
                  response_variable: _np_put_raw
                  continue_on_error: true
                  data:
                    mode: run
                    method: PUT
                    endpoint: 'households/shopping/items/{{ repeat.item.id }}'
                    payload: '{{ repeat.item.item | combine({"foodId": _np_food_exact.id}) | tojson }}'
                - choose:
                  - conditions:
                    - condition: template
                      value_template: '{{ _np_put_raw is mapping and _np_put_raw.get("status") == "success" }}'
                    sequence:
                    - variables:
                        _np_promoted: >-
                          {{ _np_promoted + [{"name": repeat.item.name, "food_id": _np_food_exact.id, "grocy_product_id": _np_food_exact.extras.get("grocy_product_id")}] }}
                  - conditions:
                    - condition: template
                      value_template: '{{ true }}'
                    sequence:
                    - variables:
                        _np_errors: '{{ _np_errors + [repeat.item.name] }}'
        - variables:
            final_response:
              status: success
              case: notes_promote
              list_id: '{{ _np_list.id }}'
              list_name: '{{ _np_list.name }}'
              summary:
                total_notes: '{{ _np_note_items | length }}'
                promoted: '{{ _np_promoted | length }}'
                not_found: '{{ _np_not_found | length }}'
                no_grocy_link: '{{ _np_no_link | length }}'
                errors: '{{ _np_errors | length }}'
              promoted_items: '{{ _np_promoted }}'
              not_found_items: '{{ _np_not_found }}'
              no_grocy_link_items: '{{ _np_no_link }}'
              error_items: '{{ _np_errors }}'
              coaching: >-
                {{
                  (["Use notes_resolve item=<name> grocy_product_id=<id> to link " ~ (_np_not_found | length) ~ " unmatched item(s) first."]
                  if _np_not_found | length > 0 else [])
                  + (["" ~ (_np_no_link | length) ~ " item(s) found in Mealie but have no grocy_product_id — run notes_resolve to add the Grocy link."]
                  if _np_no_link | length > 0 else [])
                }}
              writes:
                level: batch
        - stop: return
          response_variable: final_response
    - alias: Early exit — sync_now
      choose:
      - conditions:
        - condition: template
          value_template: '{{ case == "sync_now" }}'
        sequence:
        - action: script.zen_admintools_kitchen_sync
          response_variable: sn_resp
          data:
            direction: '{{ safe_sync_direction }}'
            mode: '{{ safe_sync_mode }}'
            limit: '{{ safe_sync_limit }}'
            confirmation: '{{ safe_sync_confirmation }}'
            default_location: '{{ safe_sync_default_location }}'
            default_unit: '{{ safe_sync_default_unit }}'
        - stop: return
          response_variable: sn_resp
    - alias: Early exit — all_lists_sync
      choose:
      - conditions:
        - condition: template
          value_template: '{{ case == "all_lists_sync" }}'
        sequence:
        - variables:
            _als_household: '{{ states("sensor.zen_default_household_cabinet_resolved") }}'
        - action: script.zen_dojotools_filecabinet
          response_variable: _als_prefs_raw
          continue_on_error: true
          data:
            action_type: read
            volume_entity_id: '{{ _als_household }}'
            key: kitchen_sync
        - variables:
            _als_prefs_r: >-
              {%- set r = _als_prefs_raw.get('result', {}) if _als_prefs_raw is mapping else {} -%}
              {%- set r = r | from_json if r is string else (r if r is mapping else {}) -%}
              {%- set raw = r.get('kitchen_sync', {}) -%}
              {%- set raw = raw if raw is mapping else (raw | from_json if raw is string else {}) -%}
              {%- set v = raw.get('value', raw) if raw is mapping else {} -%}
              {{ v if v is mapping else (v | from_json if v is string else {}) }}
        - variables:
            _als_prefs: '{{ _als_prefs_r if _als_prefs_r is mapping else {} }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ (_als_prefs == {} or _als_prefs is none) and _als_household != "" }}'
            sequence:
            - action: script.zen_dojotools_filecabinet
              continue_on_error: true
              data:
                action_type: create
                volume_entity_id: '{{ _als_household }}'
                key: kitchen_sync
                value: '{"include_notes": true, "default_location": "Pantry", "default_unit": "each"}'
                set_timestamp: true
                label_input: kitchen_sync, zen_household
            - variables:
                _als_prefs:
                  include_notes: true
                  default_location: Pantry
                  default_unit: each
        - variables:
            _als_apply: '{{ safe_sync_mode != "preview" }}'
            _als_include_notes: >-
              {{ _als_prefs.get('include_notes', true) if _als_prefs is mapping else true }}
            _als_def_loc: >-
              {{ _als_prefs.get('default_location', 'Pantry') if _als_prefs is mapping else 'Pantry' }}
            _als_def_unit: >-
              {{ _als_prefs.get('default_unit', 'each') if _als_prefs is mapping else 'each' }}
        - action: script.zen_sutra_mealie
          response_variable: _als_lists_raw
          data:
            mode: run
            method: GET
            endpoint: households/shopping/lists
            payload: '{{ none }}'
            pageNumber: 1
            perPage: 50
        - variables:
            _als_all: >-
              {{
                _als_lists_raw.result.content.get('items', [])
                if _als_lists_raw.result.content is mapping else []
              }}
        - variables:
            _als_linked: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for sl in _als_all -%}
                {%- set ex = sl.extras if sl.extras is mapping else {} -%}
                {%- set gid = ex.get('grocy_list_id', none) -%}
                {%- if gid is not none and (gid | string | trim) != '' -%}
                  {%- set ns.out = ns.out + [{'id': sl.id, 'name': sl.name, 'grocy_list_id': gid}] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out }}
            _als_results: []
        - repeat:
            for_each: '{{ _als_linked }}'
            sequence:
            - variables:
                _als_lid: '{{ repeat.item.id }}'
                _als_lname: '{{ repeat.item.name }}'
                _als_lgid: '{{ repeat.item.grocy_list_id }}'
            - action: script.zen_sutra_mealie
              response_variable: _als_full_raw
              continue_on_error: true
              data:
                mode: run
                method: GET
                endpoint: 'households/shopping/lists/{{ _als_lid }}'
                payload: '{{ none }}'
            - variables:
                _als_full: >-
                  {{ _als_full_raw.result.content
                     if _als_full_raw.result.content is mapping else {} }}
                _als_ex: '{{ _als_full.extras if _als_full.extras is mapping else {} }}'
                _als_items: '{{ _als_full.listItems if _als_full.listItems is sequence else [] }}'
            - variables:
                _als_ready: >-
                  {%- set ns = namespace(out=[]) -%}
                  {%- for i in _als_items -%}
                    {%- if not i.checked -%}
                      {%- set food = i.food if i.food is mapping else none -%}
                      {%- set fid = i.foodId if i.foodId is string and i.foodId | trim != '' else none -%}
                      {%- if fid is not none and food is not none -%}
                        {%- set gpid = food.extras.get('grocy_product_id', none) if food.extras is mapping else none -%}
                        {%- if gpid is not none and (gpid | string | trim) != '' -%}
                          {%- set disp = (i.note | default('', true) | trim) or (i.display | default('', true) | trim) -%}
                          {%- set ns.out = ns.out + [{'display': disp, 'grocy_product_id': gpid | int, 'quantity': i.quantity | default(1) | float}] -%}
                        {%- endif -%}
                      {%- endif -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ ns.out }}
                _als_notes: >-
                  {%- if _als_include_notes -%}
                    {%- set ns = namespace(out=[]) -%}
                    {%- for i in _als_items -%}
                      {%- if not i.checked and (not i.foodId or i.foodId is none) -%}
                        {%- set disp = (i.note | default('', true) | trim) or (i.display | default('', true) | trim) -%}
                        {%- if disp != '' -%}
                          {%- set ns.out = ns.out + [{'display': disp, 'quantity': i.quantity | default(1) | float}] -%}
                        {%- endif -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {{ ns.out }}
                  {%- else -%}
                    []
                  {%- endif -%}
            - variables:
                _als_synced: []
                _als_notes_synced: []
                _als_errors: []
            - choose:
              - conditions:
                - condition: template
                  value_template: '{{ _als_apply }}'
                sequence:
                - repeat:
                    for_each: '{{ _als_ready }}'
                    sequence:
                    - action: script.zen_dojotools_inventory
                      response_variable: _als_radd
                      continue_on_error: true
                      data:
                        mode: shopping_add_product
                        product_id: '{{ repeat.item.grocy_product_id }}'
                        list_id: '{{ _als_lgid | int }}'
                        amount: '{{ repeat.item.quantity }}'
                    - choose:
                      - conditions:
                        - condition: template
                          value_template: '{{ _als_radd is mapping and (_als_radd.status | default("")) == "success" }}'
                        sequence:
                        - variables:
                            _als_synced: '{{ _als_synced + [repeat.item.display] }}'
                      - conditions:
                        - condition: template
                          value_template: '{{ true }}'
                        sequence:
                        - variables:
                            _als_errors: '{{ _als_errors + [repeat.item.display] }}'
                - repeat:
                    for_each: '{{ _als_notes }}'
                    sequence:
                    - action: script.zen_dojotools_inventory
                      response_variable: _als_nfind
                      continue_on_error: true
                      data:
                        mode: catalog_find_product
                        item: '{{ repeat.item.display }}'
                        report_inventory: false
                    - variables:
                        _als_nreal: >-
                          {{ _als_nfind.result | default([]) | selectattr('name','defined') | list }}
                        _als_nexact: >-
                          {%- set m = _als_nreal | selectattr('name','equalto', repeat.item.display) | list -%}
                          {{ m[0].id if m | length > 0 else none }}
                    - choose:
                      - conditions:
                        - condition: template
                          value_template: '{{ _als_nexact is not none }}'
                        sequence:
                        - action: script.zen_dojotools_inventory
                          response_variable: _als_nadd
                          continue_on_error: true
                          data:
                            mode: shopping_add_product
                            product_id: '{{ _als_nexact | int }}'
                            list_id: '{{ _als_lgid | int }}'
                            amount: '{{ repeat.item.quantity }}'
                        - variables:
                            _als_notes_synced: '{{ _als_notes_synced + [repeat.item.display] }}'
                      - conditions:
                        - condition: template
                          value_template: '{{ (_als_nfind.status | default("")) == "success" and (_als_nreal | length) == 0 }}'
                        sequence:
                        - action: script.zen_dojotools_inventory
                          response_variable: _als_ncreate
                          continue_on_error: true
                          data:
                            mode: catalog_add_product
                            item: '{{ repeat.item.display }}'
                            location: '{{ _als_def_loc }}'
                            unit: '{{ _als_def_unit }}'
                        - variables:
                            _als_nnew: >-
                              {{ _als_ncreate.result.product_id | default(none)
                                 if (_als_ncreate is mapping and _als_ncreate.result is mapping)
                                 else none }}
                        - choose:
                          - conditions:
                            - condition: template
                              value_template: '{{ _als_nnew is not none }}'
                            sequence:
                            - action: script.zen_dojotools_inventory
                              response_variable: _als_nadd2
                              continue_on_error: true
                              data:
                                mode: shopping_add_product
                                product_id: '{{ _als_nnew | int }}'
                                list_id: '{{ _als_lgid | int }}'
                                amount: '{{ repeat.item.quantity }}'
                            - variables:
                                _als_notes_synced: '{{ _als_notes_synced + [repeat.item.display] }}'
                - action: script.zen_sutra_mealie
                  response_variable: _als_stamp
                  continue_on_error: true
                  data:
                    mode: run
                    method: PUT
                    endpoint: 'households/shopping/lists/{{ _als_lid }}'
                    payload: '{{ _als_full | combine({"extras": _als_ex | combine({"grocy_list_id": _als_lgid | string, "last_synced_at": now().isoformat(), "last_ready_count": _als_ready | length | string, "last_total_count": _als_items | length | string})}) | tojson }}'
            - variables:
                _als_results: >-
                  {{ _als_results + [{'list': _als_lname, 'synced': _als_synced | length, 'notes_synced': _als_notes_synced | length, 'errors': _als_errors | length, 'would_sync': _als_ready | length, 'would_sync_notes': _als_notes | length}] }}
        - variables:
            _als_total_synced: '{{ _als_results | sum(attribute="synced") }}'
            _als_total_errors: '{{ _als_results | sum(attribute="errors") }}'
            _als_error_lists: >-
              {{ _als_results | selectattr("errors", "gt", 0) | map(attribute="list") | list }}
        - variables:
            _als_summary:
              status: '{{ "errors" if (_als_total_errors | int) > 0 else "ok" }}'
              last_run_at: '{{ now().isoformat() }}'
              mode: '{{ "apply" if _als_apply else "preview" }}'
              lists_processed: '{{ _als_linked | length }}'
              total_synced: '{{ _als_total_synced }}'
              total_errors: '{{ _als_total_errors }}'
              error_lists: '{{ _als_error_lists }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _als_household != "" and _als_apply }}'
            sequence:
            - action: script.zen_dojotools_filecabinet
              response_variable: _als_write_resp
              continue_on_error: true
              data:
                action_type: update
                force_action: true
                volume_entity_id: '{{ _als_household }}'
                key: kitchen_sync_last_run
                value: '{{ _als_summary | tojson }}'
                set_timestamp: true
            - choose:
              - conditions:
                - condition: template
                  value_template: >-
                    {{ not (_als_write_resp is mapping
                       and (_als_write_resp.get('success') == true
                            or (_als_write_resp.get('status', '') | string | lower) == 'success')) }}
                sequence:
                - action: script.zen_dojotools_filecabinet
                  continue_on_error: true
                  data:
                    action_type: create
                    volume_entity_id: '{{ _als_household }}'
                    key: kitchen_sync_last_run
                    value: '{{ _als_summary | tojson }}'
                    set_timestamp: true
                    label_input: kitchen_sync, zen_household
        - variables:
            final_response:
              status: success
              case: all_lists_sync
              mode: '{{ "apply" if _als_apply else "preview" }}'
              lists_processed: '{{ _als_linked | length }}'
              results: '{{ _als_results }}'
              summary: '{{ _als_summary }}'
              prefs_used:
                include_notes: '{{ _als_include_notes }}'
                default_location: '{{ _als_def_loc }}'
                default_unit: '{{ _als_def_unit }}'
              writes:
                level: batch
        - stop: return
          response_variable: final_response
    - alias: Early exit — ambiguous_review
      choose:
      - conditions:
        - condition: template
          value_template: '{{ case == "ambiguous_review" }}'
        sequence:
        - variables:
            _ar_household: '{{ states("sensor.zen_default_household_cabinet_resolved") }}'
            _ar_limit: '{{ sync_limit | default(10) | int }}'
        - action: script.zen_dojotools_filecabinet
          response_variable: _ar_raw
          continue_on_error: true
          data:
            action_type: read
            volume_entity_id: '{{ _ar_household }}'
            key: kitchen_sync_ambiguous_queue
        - variables:
            _ar_parsed: >-
              {%- set r = _ar_raw.get('result', {}) if _ar_raw is mapping else {} -%}
              {%- set r = r | from_json if r is string else (r if r is mapping else {}) -%}
              {%- set raw = r.get('kitchen_sync_ambiguous_queue', {}) -%}
              {%- set raw = raw if raw is mapping else (raw | from_json if raw is string else {}) -%}
              {%- set v = raw.get('value', raw) if raw is mapping else [] -%}
              {{ v if (v is sequence and v is not string and v is not mapping) else (v | from_json if v is string else []) }}
        - variables:
            _ar_queue: '{{ _ar_parsed if (_ar_parsed is sequence and _ar_parsed is not mapping) else [] }}'
        - variables:
            _ar_page: '{{ _ar_queue[:_ar_limit] }}'
            _ar_total: '{{ _ar_queue | length }}'
        - variables:
            final_response:
              status: success
              case: ambiguous_review
              total_queued: '{{ _ar_total }}'
              showing: '{{ _ar_page | length }}'
              remaining_after: '{{ [_ar_total - _ar_limit, 0] | max }}'
              items: '{{ _ar_page }}'
              resolve_hint: "For each item: call foods_tag item_id=<food_id> grocy_product_id=<chosen_id> to link. Or call zen_dojotools_inventory products_merge to collapse duplicate Grocy products first."
        - stop: return
          response_variable: final_response
    - alias: Early exit — foods_audit
      choose:
      - conditions:
        - condition: template
          value_template: '{{ case == "foods_audit" }}'
        sequence:
        - variables:
            _fa_household: '{{ states("sensor.zen_default_household_cabinet_resolved") }}'
        - action: script.zen_dojotools_filecabinet
          response_variable: _fa_lastrun_raw
          continue_on_error: true
          data:
            action_type: read
            volume_entity_id: '{{ _fa_household }}'
            key: kitchen_sync_last_run
        - variables:
            _fa_lastrun: >-
              {%- set r = _fa_lastrun_raw.get('result', {}) if _fa_lastrun_raw is mapping else {} -%}
              {%- set r = r | from_json if r is string else (r if r is mapping else {}) -%}
              {%- set raw = r.get('kitchen_sync_last_run', {}) -%}
              {%- set raw = raw if raw is mapping else (raw | from_json if raw is string else {}) -%}
              {%- set v = raw.get('value', raw) if raw is mapping else {} -%}
              {{ v if v is mapping else (v | from_json if v is string else {}) }}
        - variables:
            _fa_foods: []
            _fa_done: false
        - repeat:
            count: 20
            sequence:
            - choose:
              - conditions:
                - condition: template
                  value_template: '{{ not _fa_done }}'
                sequence:
                - action: script.zen_sutra_mealie
                  response_variable: _fa_page_raw
                  continue_on_error: true
                  data:
                    mode: run
                    method: GET
                    endpoint: foods
                    payload: '{{ none }}'
                    pageNumber: '{{ repeat.index }}'
                    perPage: 50
                - variables:
                    _fa_items: >-
                      {{
                        _fa_page_raw.result.content.get('items', [])
                        if _fa_page_raw.result.content is mapping else []
                      }}
                - variables:
                    _fa_foods: '{{ _fa_foods + _fa_items }}'
                - choose:
                  - conditions:
                    - condition: template
                      value_template: '{{ _fa_items | length < 50 }}'
                    sequence:
                    - variables:
                        _fa_done: true
        - variables:
            _fa_linked: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for f in _fa_foods -%}
                {%- set ex = f.extras if f.extras is mapping else {} -%}
                {%- set gpid = ex.get('grocy_product_id', none) -%}
                {%- if gpid is not none and (gpid | string | trim) != '' -%}
                  {%- set ns.out = ns.out + [f.name] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out }}
            _fa_unlinked: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for f in _fa_foods -%}
                {%- set ex = f.extras if f.extras is mapping else {} -%}
                {%- set gpid = ex.get('grocy_product_id', none) -%}
                {%- if gpid is none or (gpid | string | trim) == '' -%}
                  {%- set ns.out = ns.out + [f.name] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out }}
        - variables:
            final_response:
              status: success
              case: foods_audit
              total_foods: '{{ _fa_foods | length }}'
              linked: '{{ _fa_linked | length }}'
              unlinked: '{{ _fa_unlinked | length }}'
              coverage_pct: >-
                {{
                  ((_fa_linked | length) / (_fa_foods | length) * 100) | round(1)
                  if (_fa_foods | length) > 0 else 0
                }}
              unlinked_sample: '{{ _fa_unlinked[:25] }}'
              last_sync_run: '{{ _fa_lastrun }}'
        - stop: return
          response_variable: final_response
    - alias: Early exit — qty_sync
      choose:
      - conditions:
        - condition: template
          value_template: '{{ case == "qty_sync" }}'
        sequence:
        - variables:
            _qts_apply: '{{ safe_sync_mode != "preview" }}'
            _qts_limit: '{{ sync_limit | default(50) | int }}'
        - variables:
            _qts_foods: []
            _qts_done: false
        - repeat:
            count: 20
            sequence:
            - choose:
              - conditions:
                - condition: template
                  value_template: '{{ not _qts_done }}'
                sequence:
                - action: script.zen_sutra_mealie
                  response_variable: _qts_page_raw
                  continue_on_error: true
                  data:
                    mode: run
                    method: GET
                    endpoint: foods
                    payload: '{{ none }}'
                    pageNumber: '{{ repeat.index }}'
                    perPage: 50
                - variables:
                    _qts_items: >-
                      {{
                        _qts_page_raw.result.content.get('items', [])
                        if _qts_page_raw.result.content is mapping else []
                      }}
                - variables:
                    _qts_foods: '{{ _qts_foods + _qts_items }}'
                - choose:
                  - conditions:
                    - condition: template
                      value_template: '{{ _qts_items | length < 50 }}'
                    sequence:
                    - variables:
                        _qts_done: true
        - variables:
            _qts_linked: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for f in _qts_foods -%}
                {%- set ex = f.extras if f.extras is mapping else {} -%}
                {%- set gpid = ex.get('grocy_product_id', none) -%}
                {%- if gpid is not none and (gpid | string | trim) != '' -%}
                  {%- set ns.out = ns.out + [{'id': f.id, 'name': f.name, 'grocy_product_id': gpid | int}] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out[:_qts_limit] }}
        - variables:
            _qts_synced: []
            _qts_errors: []
            _qts_preview: []
        - repeat:
            for_each: '{{ _qts_linked }}'
            sequence:
            - variables:
                _qts_fid: '{{ repeat.item.id }}'
                _qts_fname: '{{ repeat.item.name }}'
                _qts_gpid: '{{ repeat.item.grocy_product_id }}'
            - action: script.zen_dojotools_inventory
              response_variable: _qts_stock
              continue_on_error: true
              data:
                mode: stock_get_product_details
                product_id: '{{ _qts_gpid }}'
            - variables:
                _qts_amt: >-
                  {{
                    _qts_stock.result.stock_amount | default(0) | float
                    if _qts_stock is mapping else 0
                  }}
            - choose:
              - conditions:
                - condition: template
                  value_template: '{{ not _qts_apply }}'
                sequence:
                - variables:
                    _qts_preview: '{{ _qts_preview + [{"name": _qts_fname, "grocy_stock_qty": _qts_amt}] }}'
              - conditions:
                - condition: template
                  value_template: '{{ _qts_apply }}'
                sequence:
                - action: script.zen_sutra_mealie
                  response_variable: _qts_get
                  continue_on_error: true
                  data:
                    mode: run
                    method: GET
                    endpoint: 'foods/{{ _qts_fid }}'
                    payload: '{{ none }}'
                    pageNumber: 1
                    perPage: 1
                - variables:
                    _qts_full: >-
                      {{
                        _qts_get.result.content
                        if _qts_get.result.content is mapping else {}
                      }}
                    _qts_merged: >-
                      {{
                        (_qts_full.get('extras', {}) or {})
                        | combine({'grocy_stock_qty': _qts_amt | string, 'grocy_stock_updated_at': now().isoformat()})
                      }}
                - choose:
                  - conditions:
                    - condition: template
                      value_template: '{{ _qts_full != {} }}'
                    sequence:
                    - action: script.zen_sutra_mealie
                      response_variable: _qts_put
                      continue_on_error: true
                      data:
                        mode: run
                        method: PUT
                        endpoint: 'foods/{{ _qts_fid }}'
                        payload: '{{ _qts_full | combine({"extras": _qts_merged}) | tojson }}'
                        pageNumber: 1
                        perPage: 1
                    - choose:
                      - conditions:
                        - condition: template
                          value_template: '{{ (_qts_put.result.status | default(200) | int) < 400 }}'
                        sequence:
                        - variables:
                            _qts_synced: '{{ _qts_synced + [_qts_fname] }}'
                      - conditions:
                        - condition: template
                          value_template: '{{ true }}'
                        sequence:
                        - variables:
                            _qts_errors: '{{ _qts_errors + [_qts_fname] }}'
                  - conditions:
                    - condition: template
                      value_template: '{{ _qts_full == {} }}'
                    sequence:
                    - variables:
                        _qts_errors: '{{ _qts_errors + [_qts_fname] }}'
        - variables:
            final_response:
              status: success
              case: qty_sync
              mode: '{{ "apply" if _qts_apply else "preview" }}'
              total_linked: '{{ _qts_linked | length }}'
              synced: '{{ _qts_synced | length }}'
              errors: '{{ _qts_errors | length }}'
              error_names: '{{ _qts_errors }}'
              preview_sample: '{{ _qts_preview }}'
              writes:
                level: batch
        - stop: return
          response_variable: final_response
    - alias: Early exit — shopping_lists_overview
      choose:
      - conditions:
        - condition: template
          value_template: '{{ case == "shopping_lists_overview" }}'
        sequence:
        - action: script.zen_sutra_mealie
          response_variable: _slo_raw
          data:
            mode: run
            method: GET
            endpoint: households/shopping/lists
            payload: '{{ none }}'
            pageNumber: 1
            perPage: 50
        - variables:
            _slo_all: >-
              {{
                _slo_raw.result.content.get('items', [])
                if _slo_raw.result.content is mapping else []
              }}
        - variables:
            _slo_out: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for sl in _slo_all -%}
                {%- set ex = sl.extras if sl.extras is mapping else {} -%}
                {%- set gid = ex.get('grocy_list_id', none) -%}
                {%- set ns.out = ns.out + [{'id': sl.id, 'name': sl.name, 'grocy_list_id': gid, 'linked': gid is not none and (gid | string | trim) != '', 'last_synced_at': ex.get('last_synced_at', none), 'last_ready_count': ex.get('last_ready_count', none), 'last_total_count': ex.get('last_total_count', none)}] -%}
              {%- endfor -%}
              {{ ns.out }}
        - variables:
            final_response:
              status: success
              case: shopping_lists_overview
              lists: '{{ _slo_out }}'
              total_lists: '{{ _slo_out | length }}'
              linked_count: '{{ _slo_out | selectattr("linked") | list | length }}'
              writes:
                level: none
        - stop: return
          response_variable: final_response
    - alias: Early exit — shopping_list_detail
      choose:
      - conditions:
        - condition: template
          value_template: '{{ case == "shopping_list_detail" }}'
        sequence:
        - action: script.zen_sutra_mealie
          response_variable: _sld_raw
          data:
            mode: run
            method: GET
            endpoint: households/shopping/lists
            payload: '{{ none }}'
            pageNumber: 1
            perPage: 50
        - variables:
            _sld_all: >-
              {{
                _sld_raw.result.content.get('items', [])
                if _sld_raw.result.content is mapping else []
              }}
        - variables:
            _sld_list: >-
              {%- if safe_shopping_list_id != '' -%}
                {{ _sld_all | selectattr('id', 'equalto', safe_shopping_list_id) | list | first | default(none) }}
              {%- elif safe_item != '' -%}
                {{ _sld_all | selectattr('name', 'search', '(?i)^' ~ safe_item ~ '$') | list | first | default(none) }}
              {%- else -%}
                {{ none }}
              {%- endif -%}
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _sld_list is none }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: shopping_list_detail
                  message: Shopping list not found. Use shopping_lists_overview to see available lists.
            - stop: return
              response_variable: error_response
        - action: script.zen_sutra_mealie
          response_variable: _sld_full_raw
          data:
            mode: run
            method: GET
            endpoint: 'households/shopping/lists/{{ _sld_list.id }}'
            payload: '{{ none }}'
        - variables:
            _sld_full: >-
              {{ _sld_full_raw.result.content
                 if _sld_full_raw.result.content is mapping else {} }}
        - variables:
            _sld_ex: '{{ _sld_full.extras if _sld_full.extras is mapping else {} }}'
            _sld_items_raw: '{{ _sld_full.listItems if _sld_full.listItems is sequence else [] }}'
        - variables:
            _sld_items: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for i in _sld_items_raw -%}
                {%- set food = i.food if i.food is mapping else none -%}
                {%- set food_id = i.foodId if i.foodId is string and i.foodId | trim != '' else none -%}
                {%- set gpid = food.extras.get('grocy_product_id', none) if food is not none and food.extras is mapping else none -%}
                {%- set gpid_clean = gpid if gpid is string and gpid | trim != '' else none -%}
                {%- if i.checked -%}
                  {%- set ss = 'checked' -%}
                {%- elif food_id is none -%}
                  {%- set ss = 'note_only' -%}
                {%- elif gpid_clean is not none -%}
                  {%- set ss = 'ready' -%}
                {%- else -%}
                  {%- set ss = 'pending' -%}
                {%- endif -%}
                {%- set ns.out = ns.out + [{'id': i.id, 'display': i.display | default('', true), 'note': i.note | default('', true), 'food_id': food_id, 'food_name': food.name if food is not none else none, 'grocy_product_id': gpid_clean, 'label': i.label.name if i.label is mapping else none, 'quantity': i.quantity | default(0), 'checked': i.checked | default(false), 'sync_status': ss}] -%}
              {%- endfor -%}
              {{ ns.out }}
        - variables:
            _sld_counts: >-
              {{
                {
                  'ready': _sld_items | selectattr('sync_status','equalto','ready') | list | length,
                  'pending': _sld_items | selectattr('sync_status','equalto','pending') | list | length,
                  'note_only': _sld_items | selectattr('sync_status','equalto','note_only') | list | length,
                  'checked': _sld_items | selectattr('sync_status','equalto','checked') | list | length
                }
              }}
        - variables:
            final_response:
              status: success
              case: shopping_list_detail
              list_id: '{{ _sld_list.id }}'
              list_name: '{{ _sld_list.name }}'
              grocy_list_id: '{{ _sld_ex.get("grocy_list_id", none) }}'
              linked: '{{ _sld_ex.get("grocy_list_id") is not none }}'
              last_synced_at: '{{ _sld_ex.get("last_synced_at", none) }}'
              item_counts: '{{ _sld_counts }}'
              items: '{{ _sld_items }}'
              writes:
                level: none
        - stop: return
          response_variable: final_response
    - alias: Early exit — shopping_list_link
      choose:
      - conditions:
        - condition: template
          value_template: '{{ case == "shopping_list_link" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ safe_grocy_list_id is none or (safe_item == "" and safe_shopping_list_id == "") }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: shopping_list_link
                  message: shopping_list_link requires item (list name) or shopping_list_id, plus grocy_list_id (integer). Use zen_dojotools_inventory mode=shopping_lists_list to find Grocy list IDs.
            - stop: return
              response_variable: error_response
        - action: script.zen_sutra_mealie
          response_variable: _sll_all_raw
          data:
            mode: run
            method: GET
            endpoint: households/shopping/lists
            payload: '{{ none }}'
            pageNumber: 1
            perPage: 50
        - variables:
            _sll_all: >-
              {{
                _sll_all_raw.result.content.get('items', [])
                if _sll_all_raw.result.content is mapping else []
              }}
        - variables:
            _sll_list: >-
              {%- if safe_shopping_list_id != '' -%}
                {{ _sll_all | selectattr('id', 'equalto', safe_shopping_list_id) | list | first | default(none) }}
              {%- else -%}
                {{ _sll_all | selectattr('name', 'search', '(?i)^' ~ safe_item ~ '$') | list | first | default(none) }}
              {%- endif -%}
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _sll_list is none }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: shopping_list_link
                  message: Shopping list not found. Use shopping_lists_overview to see available lists.
            - stop: return
              response_variable: error_response
        - variables:
            _sll_list_id: '{{ _sll_list.id }}'
            _sll_old_ex: '{{ _sll_list.extras if _sll_list.extras is mapping else {} }}'
        - variables:
            _sll_new_ex: '{{ _sll_old_ex | combine({"grocy_list_id": safe_grocy_list_id | string, "last_synced_at": none}) }}'
        - action: script.zen_sutra_mealie
          response_variable: _sll_full_raw
          data:
            mode: run
            method: GET
            endpoint: 'households/shopping/lists/{{ _sll_list_id }}'
            payload: '{{ none }}'
        - variables:
            _sll_full: >-
              {{ _sll_full_raw.result.content
                 if _sll_full_raw.result.content is mapping else {} }}
        - action: script.zen_sutra_mealie
          response_variable: _sll_put_resp
          data:
            mode: run
            method: PUT
            endpoint: 'households/shopping/lists/{{ _sll_list_id }}'
            payload: '{{ _sll_full | combine({"extras": _sll_new_ex}) | tojson }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _sll_put_resp.result.status | default(200) >= 400 }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: shopping_list_link
                  message: 'Failed to update shopping list extras. HTTP {{ _sll_put_resp.result.status | default("unknown") }}'
            - stop: return
              response_variable: error_response
        - variables:
            final_response:
              status: success
              case: shopping_list_link
              list_id: '{{ _sll_list_id }}'
              list_name: '{{ _sll_list.name }}'
              grocy_list_id: '{{ safe_grocy_list_id }}'
              extras: '{{ _sll_new_ex }}'
              message: List linked. Run shopping_list_sync to push items to Grocy.
              writes:
                level: single
        - stop: return
          response_variable: final_response
    - alias: Early exit — shopping_list_sync
      choose:
      - conditions:
        - condition: template
          value_template: '{{ case == "shopping_list_sync" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ safe_item == "" and safe_shopping_list_id == "" }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: shopping_list_sync
                  message: shopping_list_sync requires item (list name) or shopping_list_id.
            - stop: return
              response_variable: error_response
        - action: script.zen_sutra_mealie
          response_variable: _sls_raw
          data:
            mode: run
            method: GET
            endpoint: households/shopping/lists
            payload: '{{ none }}'
            pageNumber: 1
            perPage: 50
        - variables:
            _sls_all: >-
              {{
                _sls_raw.result.content.get('items', [])
                if _sls_raw.result.content is mapping else []
              }}
        - variables:
            _sls_list: >-
              {%- if safe_shopping_list_id != '' -%}
                {{ _sls_all | selectattr('id', 'equalto', safe_shopping_list_id) | list | first | default(none) }}
              {%- else -%}
                {{ _sls_all | selectattr('name', 'search', '(?i)^' ~ safe_item ~ '$') | list | first | default(none) }}
              {%- endif -%}
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _sls_list is none }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: shopping_list_sync
                  message: Shopping list not found. Use shopping_lists_overview to see available lists.
            - stop: return
              response_variable: error_response
        - variables:
            _sls_ex: '{{ _sls_list.extras if _sls_list.extras is mapping else {} }}'
            _sls_grocy_list_id: '{{ _sls_ex.get("grocy_list_id", none) }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _sls_grocy_list_id is none or (_sls_grocy_list_id | string | trim) == "" }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: shopping_list_sync
                  message: List is not linked to a Grocy shopping list. Run shopping_list_link first.
                  list_id: '{{ _sls_list.id }}'
                  list_name: '{{ _sls_list.name }}'
            - stop: return
              response_variable: error_response
        - action: script.zen_sutra_mealie
          response_variable: _sls_full_raw
          data:
            mode: run
            method: GET
            endpoint: 'households/shopping/lists/{{ _sls_list.id }}'
            payload: '{{ none }}'
        - variables:
            _sls_full: >-
              {{ _sls_full_raw.result.content
                 if _sls_full_raw.result.content is mapping else {} }}
        - variables:
            _sls_items_raw: '{{ _sls_full.listItems if _sls_full.listItems is sequence else [] }}'
        - variables:
            _sls_ready: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for i in _sls_items_raw -%}
                {%- if not i.checked -%}
                  {%- set food = i.food if i.food is mapping else none -%}
                  {%- set food_id = i.foodId if i.foodId is string and i.foodId | trim != '' else none -%}
                  {%- if food_id is not none and food is not none -%}
                    {%- set gpid = food.extras.get('grocy_product_id', none) if food.extras is mapping else none -%}
                    {%- if gpid is not none and (gpid | string | trim) != '' -%}
                      {%- set ns.out = ns.out + [{'item_id': i.id, 'display': i.display | default('', true), 'food_name': food.name, 'grocy_product_id': gpid | int, 'quantity': i.quantity | default(1) | float}] -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out }}
            _sls_pending_ct: >-
              {%- set ns = namespace(n=0) -%}
              {%- for i in _sls_items_raw -%}
                {%- if not i.checked and i.foodId is string and i.foodId | trim != '' -%}
                  {%- set food = i.food if i.food is mapping else none -%}
                  {%- set gpid = food.extras.get('grocy_product_id', none) if food is not none and food.extras is mapping else none -%}
                  {%- if gpid is none or (gpid | string | trim) == '' -%}
                    {%- set ns.n = ns.n + 1 -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.n }}
            _sls_note_ct: >-
              {%- set ns = namespace(n=0) -%}
              {%- for i in _sls_items_raw -%}
                {%- if not i.checked and (not i.foodId or i.foodId is none) -%}
                  {%- set ns.n = ns.n + 1 -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.n }}
        - variables:
            _sls_notes_ready: >-
              {%- if safe_include_notes -%}
                {%- set ns = namespace(out=[]) -%}
                {%- for i in _sls_items_raw -%}
                  {%- if not i.checked -%}
                    {%- set food_id = i.foodId if i.foodId is string and (i.foodId | trim) != '' else none -%}
                    {%- if food_id is none -%}
                      {%- set disp = (i.note | default('', true) | trim) or (i.display | default('', true) | trim) -%}
                      {%- if disp != '' -%}
                        {%- set ns.out = ns.out + [{'display': disp, 'quantity': i.quantity | default(1) | float}] -%}
                      {%- endif -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.out }}
              {%- else -%}
                []
              {%- endif -%}
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ safe_sync_mode == "apply" }}'
            sequence:
            - variables:
                _sls_synced: []
                _sls_errors: []
            - repeat:
                for_each: '{{ _sls_ready }}'
                sequence:
                - action: script.zen_dojotools_inventory
                  response_variable: _sls_add_resp
                  continue_on_error: true
                  data:
                    mode: shopping_add_product
                    product_id: '{{ repeat.item.grocy_product_id }}'
                    list_id: '{{ _sls_grocy_list_id | int }}'
                    amount: '{{ repeat.item.quantity }}'
                - choose:
                  - conditions:
                    - condition: template
                      value_template: '{{ _sls_add_resp is mapping and _sls_add_resp.get("status") == "success" }}'
                    sequence:
                    - variables:
                        _sls_synced: '{{ _sls_synced + [repeat.item.display] }}'
                  - conditions:
                    - condition: template
                      value_template: '{{ true }}'
                    sequence:
                    - variables:
                        _sls_errors: '{{ _sls_errors + [repeat.item.display] }}'
            - variables:
                _sls_notes_synced: []
                _sls_notes_created: []
                _sls_notes_ambiguous: []
                _sls_notes_errors: []
            - repeat:
                for_each: '{{ _sls_notes_ready }}'
                sequence:
                - action: script.zen_dojotools_inventory
                  response_variable: _nf_resp
                  continue_on_error: true
                  data:
                    mode: catalog_find_product
                    item: '{{ repeat.item.display }}'
                    report_inventory: false
                - variables:
                    _nf_status: '{{ _nf_resp.status | default("error") }}'
                    _nf_results: '{{ _nf_resp.result | default([]) }}'
                    _nf_message: '{{ _nf_resp.message | default("") }}'
                    _nf_real: '{{ _nf_results | selectattr("name", "defined") | list }}'
                - variables:
                    _nf_exact_id: >-
                      {%- set m = _nf_real | selectattr('name','equalto', repeat.item.display) | list -%}
                      {{ m[0].id if m | length > 0 else none }}
                    _nf_no_results: '{{ _nf_real | length == 0 }}'
                - choose:
                  - conditions:
                    - condition: template
                      value_template: '{{ _nf_exact_id is not none }}'
                    sequence:
                    - action: script.zen_dojotools_inventory
                      response_variable: _nf_add_resp
                      continue_on_error: true
                      data:
                        mode: shopping_add_product
                        product_id: '{{ _nf_exact_id | int }}'
                        list_id: '{{ _sls_grocy_list_id | int }}'
                        amount: '{{ repeat.item.quantity }}'
                    - variables:
                        _sls_notes_synced: '{{ _sls_notes_synced + [repeat.item.display] }}'
                  - conditions:
                    - condition: template
                      value_template: '{{ _nf_status == "success" and _nf_no_results }}'
                    sequence:
                    - action: script.zen_dojotools_inventory
                      response_variable: _nf_create_resp
                      continue_on_error: true
                      data:
                        mode: catalog_add_product
                        item: '{{ repeat.item.display }}'
                        location: Pantry
                    - variables:
                        _nf_new_id: >-
                          {{ _nf_create_resp.result.product_id | default(none)
                             if _nf_create_resp is mapping else none }}
                    - choose:
                      - conditions:
                        - condition: template
                          value_template: '{{ _nf_new_id is not none }}'
                        sequence:
                        - action: script.zen_dojotools_inventory
                          response_variable: _nf_add2_resp
                          continue_on_error: true
                          data:
                            mode: shopping_add_product
                            product_id: '{{ _nf_new_id | int }}'
                            list_id: '{{ _sls_grocy_list_id | int }}'
                            amount: '{{ repeat.item.quantity }}'
                        - variables:
                            _sls_notes_synced: '{{ _sls_notes_synced + [repeat.item.display] }}'
                            _sls_notes_created: '{{ _sls_notes_created + [repeat.item.display] }}'
                      - conditions:
                        - condition: template
                          value_template: '{{ true }}'
                        sequence:
                        - variables:
                            _sls_notes_errors: '{{ _sls_notes_errors + [repeat.item.display] }}'
                  - conditions:
                    - condition: template
                      value_template: '{{ true }}'
                    sequence:
                    - variables:
                        _sls_notes_ambiguous: >-
                          {{
                            _sls_notes_ambiguous + [{
                              'name': repeat.item.display,
                              'candidates': (_nf_resp.details.matches
                                | map(attribute='name') | list)
                                if (_nf_resp.details is mapping and _nf_resp.details.matches is sequence)
                                else (_nf_real | map(attribute='name') | list)
                            }]
                          }}
            - action: script.zen_sutra_mealie
              response_variable: _sls_stamp_resp
              continue_on_error: true
              data:
                mode: run
                method: PUT
                endpoint: 'households/shopping/lists/{{ _sls_list.id }}'
                payload: '{{ _sls_full | combine({"extras": _sls_ex | combine({"grocy_list_id": _sls_grocy_list_id | string, "last_synced_at": now().isoformat(), "last_ready_count": _sls_ready | length | string, "last_total_count": _sls_items_raw | length | string})}) | tojson }}'
            - variables:
                final_response:
                  status: success
                  case: shopping_list_sync
                  mode: apply
                  list_id: '{{ _sls_list.id }}'
                  list_name: '{{ _sls_list.name }}'
                  grocy_list_id: '{{ _sls_grocy_list_id }}'
                  summary:
                    synced: '{{ _sls_synced | length }}'
                    errors: '{{ _sls_errors | length }}'
                    skipped_pending: '{{ _sls_pending_ct }}'
                    skipped_note_only: '{{ _sls_note_ct }}'
                    notes_synced: '{{ _sls_notes_synced | length }}'
                    notes_created: '{{ _sls_notes_created | length }}'
                    notes_ambiguous: '{{ _sls_notes_ambiguous | length }}'
                  synced_items: '{{ _sls_synced }}'
                  error_items: '{{ _sls_errors }}'
                  notes_synced_items: '{{ _sls_notes_synced }}'
                  notes_created_items: '{{ _sls_notes_created }}'
                  notes_ambiguous_items: '{{ _sls_notes_ambiguous }}'
                  coaching: >-
                    {{
                      ["Pending items have Mealie foods but no Grocy FK. Run case=sync_now (orchestrator) to bulk-create Grocy products and write FKs, then re-sync. Or use notes_resolve item=<name> grocy_product_id=<id> for individual items."]
                      if (_sls_pending_ct | int) > 0 else []
                    }}
                  writes:
                    level: batch
            - stop: return
              response_variable: final_response
        - variables:
            final_response:
              status: success
              case: shopping_list_sync
              mode: preview
              list_id: '{{ _sls_list.id }}'
              list_name: '{{ _sls_list.name }}'
              grocy_list_id: '{{ _sls_grocy_list_id }}'
              summary:
                would_sync: '{{ _sls_ready | length }}'
                skipped_pending: '{{ _sls_pending_ct }}'
                skipped_note_only: '{{ _sls_note_ct }}'
                would_sync_notes: '{{ _sls_notes_ready | length }}'
              would_sync_items: '{{ _sls_ready | map(attribute="display") | list }}'
              would_sync_notes_items: '{{ _sls_notes_ready | map(attribute="display") | list }}'
              coaching: >-
                {{
                  (["Pending items have Mealie foods but no Grocy FK. Run case=sync_now (orchestrator) to bulk-create Grocy products and write FKs, then re-sync. Or use notes_resolve item=<name> grocy_product_id=<id> for individual items."]
                  if (_sls_pending_ct | int) > 0 else [])
                  + (["Note-only items have no food link. Workflow: notes_resolve (adds food + grocy_product_id) → notes_promote item=<list_name> (writes foodId to list items) → shopping_list_sync."]
                  if (_sls_note_ct | int) > 0 else [])
                }}
              writes:
                level: none
        - stop: return
          response_variable: final_response
    - variables:
        resolved_shopping_list_id: '{{ safe_shopping_list_id | string | trim }}'
    - alias: Resolve Shopping List to Shopping List ID if necessary
      choose:
      - conditions:
        - alias: Must Resolve Shopping List to Shopping List ID
          condition: template
          value_template: "{{\n  case in [\n    'shopping_list_get_items',\n    'shopping_list_generate_from_recipe',\n
            \   'shopping_list_add_item'\n  ]\n  and resolved_shopping_list_id == ''\n
            \ and (safe_shopping_list | string | trim != '')\n}}\n\n"
        sequence:
        - action: script.zen_sutra_mealie
          response_variable: shopping_lists_resp
          data:
            mode: run
            method: GET
            endpoint: households/shopping/lists
            payload: '{{ none }}'
            pageNumber: 1
            perPage: 200
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ shopping_lists_resp.result.status | default(200) >=
                400 }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: '{{ case }}'
                  message: 'Failed to fetch shopping lists for resolution.
  
                    '
            - stop: return
              response_variable: error_response
        - variables:
            lists_raw: "{{\n  shopping_lists_resp.result.content\n  | default([])\n}}"
            lists: "{{\n  (\n    (lists_raw['items'] if (lists_raw is mapping and 'items'
              in lists_raw) else lists_raw)\n    | default([])\n  )\n}}"
            matches: "{{\n  lists\n  | selectattr('name', 'equalto', (safe_shopping_list
              | string | trim))\n  | list\n}}"
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ matches | length == 0 }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: '{{ case }}'
                  message: 'Shopping list name did not match any list exactly: "{{ safe_shopping_list
                    }}".
  
                    '
            - stop: return
              response_variable: error_response
          - conditions:
            - condition: template
              value_template: '{{ matches | length > 1 }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: '{{ case }}'
                  message: 'Shopping list name matched multiple lists exactly: "{{ safe_shopping_list
                    }}". Refuse to guess.
  
                    '
            - stop: return
              response_variable: error_response
        - variables:
            resolved_shopping_list_id: "{{\n  (matches[0].id | default('')) | string
              | trim\n}}"
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ resolved_shopping_list_id == '''' }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: '{{ case }}'
                  message: 'Shopping list resolved but had no id field. Cannot proceed.
  
                    '
            - stop: return
              response_variable: error_response
    - variables:
        required_fields: "{{\n  case in case_meta\n  and case_meta[case].requires\n
          \ or []\n}}\n"
        missing_fields: "{% set ns = namespace(out=[]) %}\n{% set p = safe_payload if
          safe_payload is mapping else {} %}\n\n{% for field in required_fields %}\n
          \ {% set v =\n    (field == 'recipe_id' and (safe_recipe_id or p.get('recipe_id')))\n
          \   or (field == 'item_id' and (safe_item_id or p.get('item_id')))\n    or
          (field == 'shopping_list_id' and resolved_shopping_list_id)\n    or (field
          == 'item' and (safe_item or p.get('item')))\n    or (field == 'date' and (safe_date
          or p.get('date')))\n    or (field == 'entry_type' and (safe_entry_type or
          p.get('entry_type')))\n    or (field == 'organizer_type' and safe_organizer_type)\n
          \   or (field == 'slug' and safe_slug)\n    or (field == 'search' and (safe_search
          or p.get('search')))\n    or (field == 'text' and safe_text)\n    or (field
          == 'unit' and safe_unit)\n    or (field == 'payload' and safe_payload)\n    or
          ''\n  %}\n\n  {% if v in [None, '', []] %}\n    {% set ns.out = ns.out + [field]
          %}\n  {% endif %}\n{% endfor %}\n{{ ns.out }}\n"
    - alias: Preflight Guards
      choose:
      - conditions:
        - condition: template
          value_template: '{{ missing_fields | length > 0 }}'
          alias: 'Error: Missing Fields'
        sequence:
        - variables:
            error_response:
              status: error
              case: '{{ case }}'
              message: 'Missing required fields: {{ missing_fields | join('', '') }}
  
                '
        - stop: return
          response_variable: error_response
      - conditions:
        - condition: template
          value_template: "{{\n  case_meta[case].allowed_entry_types is defined\n  and
            entry_type not in case_meta[case].allowed_entry_types\n}}\n"
          alias: 'Error: Invalid entry_type'
        sequence:
        - variables:
            error_response:
              status: error
              case: '{{ case }}'
              message: 'Invalid entry_type. Allowed: {{ case_meta[case].allowed_entry_types
                | join('', '') }}
  
                '
        - stop: return
          response_variable: error_response
      - conditions:
        - condition: template
          value_template: "{{\n  case in [\n    'mealplan_add_recipe',\n    'mealplan_update_recipe',\n
            \   'mealplan_add_or_update_recipe'\n  ]\n  and\n  (\n    (safe_recipe_id
            | default('') | string | trim == '')\n    and (safe_title | default('')
            | string | trim == '')\n    and (safe_text | default('') | string | trim
            == '')\n    and (\n      safe_payload is not mapping\n      or (\n        (safe_payload.get('recipe_id','')
            | string | trim == '')\n        and (safe_payload.get('recipeId','') | string
            | trim == '')\n        and (safe_payload.get('title','') | string | trim
            == '')\n        and (safe_payload.get('text','') | string | trim == '')\n
            \     )\n    )\n  )\n}}"
          alias: 'Error: Meal has no content'
        sequence:
        - variables:
            error_response:
              status: error
              case: '{{ case }}'
              message: 'Meal must include either a recipe or a title/text note.
  
                '
        - stop: return
          response_variable: error_response
      - conditions:
        - condition: template
          value_template: "{{\n  case in ['food_add','food_update']\n  and (\n    safe_payload
            is not mapping\n    or (safe_payload | count == 0)\n  )\n}}\n"
        alias: 'Error: Food payload empty'
        sequence:
        - variables:
            error_response:
              status: error
              case: '{{ case }}'
              message: Food operations require a non-empty payload.
        - stop: return
          response_variable: error_response
      - conditions:
        - condition: template
          value_template: "{{\n  case == 'shopping_list_generate_from_recipe'\n  and
            (safe_shopping_list_id | string | trim == '')\n  and (safe_shopping_list
            | string | trim == '')\n}}\n"
        alias: 'Error: Shopping list not specified'
        sequence:
        - variables:
            error_response:
              status: error
              case: '{{ case }}'
              message: 'shopping_list_id or shopping_list is required for shopping_list_generate_from_recipe.
  
                '
        - stop: return
          response_variable: error_response
      - conditions:
        - condition: template
          value_template: "{{\n  case.startswith('organizers_')\n  and safe_organizer_type
            not in ['categories','tags','tools']\n}}\n"
        alias: 'Error: Invalid organizer_type'
        sequence:
        - variables:
            error_response:
              status: error
              case: '{{ case }}'
              message: 'Invalid organizer_type. Allowed: categories, tags, tools.
  
                '
        - stop: return
          response_variable: error_response
    - variables:
        method: '{{ case_meta[case].method }}'
        endpoint: "{{\n  case_meta[case].endpoint\n  | replace('{shopping_list_id}',
          resolved_shopping_list_id | default('') | string)\n  | replace('{id}',\n      (\n
          \       (case in ['unit_get','unit_update','unit_delete','food_get','food_update','food_delete']\n
          \         and (safe_item_id | default('') | string))\n        or (safe_recipe_id
          | default('') | string)\n      )\n    )\n  | replace('{organizer_type}', safe_organizer_type)\n
          \ | replace('{item_id}', safe_item_id)\n  | replace('{slug}', safe_slug)\n}}"
        query_params: "{% set ns = namespace(q={}) %}\n\n{# --- mealplan_list: keep
          existing behavior (uses page/perPage + other filters) --- #}\n{% if case ==
          'mealplan_list' %}\n  {% if start_date is defined and (start_date | string
          | trim) != '' %}\n    {% set ns.q = ns.q | combine({'start_date': start_date})
          %}\n  {% endif %}\n  {% if end_date is defined and (end_date | string | trim)
          != '' %}\n    {% set ns.q = ns.q | combine({'end_date': end_date}) %}\n  {%
          endif %}\n  {% if orderBy is defined and (orderBy | string | trim) != '' %}\n
          \   {% set ns.q = ns.q | combine({'orderBy': orderBy}) %}\n  {% endif %}\n
          \ {% if orderDirection is defined and (orderDirection | string | trim) !=
          '' %}\n    {% set ns.q = ns.q | combine({'orderDirection': orderDirection})
          %}\n  {% endif %}\n  {% if page is defined and page %}\n    {% set ns.q =
          ns.q | combine({'page': page | int}) %}\n  {% endif %}\n  {% if perPage is
          defined and perPage %}\n    {% set ns.q = ns.q | combine({'perPage': perPage
          | int}) %}\n  {% endif %}\n  {% if queryFilter is defined and (queryFilter
          | string | trim) != '' %}\n    {% set ns.q = ns.q | combine({'queryFilter':
          queryFilter}) %}\n  {% endif %}\n{% endif %}\n\n{# --- list endpoints: add
          pagination only; don't invent other params --- #}\n{% if case in ['recipes_list','recipes_find','foods_list','foods_find']
          %}\n  {% if page is defined and page %}\n    {% set ns.q = ns.q | combine({'pageNumber':
          page | int}) %}\n  {% endif %}\n  {% if perPage is defined and perPage %}\n
          \   {% set ns.q = ns.q | combine({'perPage': perPage | int}) %}\n  {% endif
          %}\n{% endif %}\n{% if case == 'foods_find' and safe_search is string and (safe_search | trim) != '' %}\n  {% set ns.q = ns.q | combine({'search': safe_search | trim}) %}\n{% endif %}\n\n{{ ns.q }}"
        final_payload: "{% if case in ['mealplan_list'] %}\n  {{ query_params }}\n\n{%
          elif case == 'units_list' %}\n  {{ none }}\n\n{% elif case == 'units_find'
          %}\n  {{ {\"search\": safe_search} | tojson }}\n\n{% elif case == 'unit_get'
          %}\n  {{ none }}\n\n{% elif case == 'unit_delete' %}\n  {{ none }}\n\n{% elif
          case == 'unit_add' %}\n  {{\n    {\n      \"name\": safe_unit,\n      \"pluralName\":
          (safe_unit_plural if (safe_unit_plural | string | trim) != '' else none),\n
          \     \"description\": (safe_unit_description if (safe_unit_description |
          string | trim) != '' else \"\")\n    } | tojson\n  }}\n\n{% elif case == 'unit_update'
          %}\n  {{\n    {\n      \"id\": (safe_item_id | int),\n      \"name\": safe_unit,\n
          \     \"pluralName\": (safe_unit_plural if (safe_unit_plural | string | trim)
          != '' else none),\n      \"description\": (safe_unit_description if (safe_unit_description
          | string | trim) != '' else \"\")\n    } | tojson\n  }}\n\n{% elif case in
          [\n  'recipes_list',\n  'recipes_get',\n  'recipe_tags_list',\n  'recipe_categories_list',\n
          \ 'recipe_tools_list',\n  'shopping_list_get',\n  'shopping_list_remove_item',\n
          \ 'recipes_delete'\n] %}\n  {{ none }}\n\n{% elif case == 'recipes_find' %}\n
          \ {{ {\"search\": safe_search} | tojson }}\n\n{% elif case in [\n  'recipes_get_stats',\n
          \ 'recipes_get_comments',\n  'shopping_list_get_items',\n  'shopping_list_clear_completed',\n
          \ 'mealplan_get_item',\n  'mealplan_delete_item'\n] %}\n  {{ none }}\n\n{%
          elif case in ['recipes_create', 'recipes_update'] %}\n  {{ safe_payload }}\n\n{%
          elif case == 'recipes_add_comment' %}\n  {{ {\"text\": safe_text} | tojson
          }}\n\n{% elif case == 'shopping_list_add_item' %}\n  {{\n    {\n      \"shoppingListId\": resolved_shopping_list_id,\n      \"note\": safe_item,\n      \"quantity\": safe_quantity | default(1),\n      \"checked\": false\n    }\n    | combine(\n        { \"unit\": { \"name\": safe_unit } }\n        if (safe_unit | string | trim) != '' else {}\n      )\n    | tojson\n  }}\n\n{%
          elif case == 'shopping_list_generate_from_recipe' %}\n  {{ {\"recipeId\":
          safe_recipe_id} | tojson }}\n\n{% elif case == 'mealplan_add_recipe' %}\n  {{\n    {\n
          \     \"date\": safe_date,\n      \"entryType\": safe_entry_type,\n      \"recipeId\":
          (safe_recipe_id if (safe_recipe_id | string | trim) != '' else none),\n      \"title\":
          safe_title,\n      \"text\": safe_text\n    } | tojson\n  }}\n\n{% elif case
          == 'mealplan_update_recipe' %}\n  {{\n    {\n      \"id\": safe_item_id |
          int,\n      \"date\": safe_date,\n      \"entryType\": safe_entry_type,\n
          \     \"recipeId\": (safe_recipe_id if (safe_recipe_id | string | trim) !=
          '' else none),\n      \"title\": safe_title,\n      \"text\": safe_text\n
          \   } | tojson\n  }}\n\n{% elif case in ['foods_list','food_get','food_delete']
          %}\n  {{ none }}\n\n{% elif case == 'foods_find' %}\n  {{ {\"search\": safe_search}
          | tojson }}\n\n{% elif case in ['food_add','food_update'] %}\n  {{ safe_payload
          }}\n\n{% else %}\n  {{ none }}\n{% endif %}"
    - action: script.zen_sutra_mealie
      response_variable: api_resp
      data:
        mode: run
        method: '{{ method }}'
        endpoint: '{{ endpoint }}'
        payload: '{{ final_payload }}'
        pageNumber: '{{ (query_params.pageNumber if (query_params is mapping and query_params.pageNumber
          is defined) else (page | default(1))) | int(1) }}'
        perPage: '{{ (query_params.perPage if (query_params is mapping and query_params.perPage
          is defined) else (perPage | default(50))) | int(50) }}'
        additional_params: "{{\n  (query_params if (query_params is mapping and query_params
          | length > 0) else {})\n}}"
    - alias: Post API Call Validation
      choose:
      - conditions:
        - condition: template
          value_template: '{{ api_resp.result.status | default(200) >= 400 }}'
          alias: HTTP Status > 200
        sequence:
        - variables:
            message: "{{\n  {\n    \"mealie_api_error\": {\n      \"http_status\": api_resp.result.status
              | default(''),\n      \"detail\": api_resp.result.content.detail | default(api_resp.result.content)
              |default('')\n    }\n  }\n}}"
            final_response: "{{\n  {\n    \"status\": \"error\",\n    \"case\": case
              | default('ERROR_UNDEFINED_CASE'),\n    \"message\": message | default({})\n
              \ }\n}}"
        - stop: return
          response_variable: final_response
    - variables:
        final_response:
          status: success
          case: '{{ case }}'
          writes:
            level: '{{ case_meta[case].writes.level }}'
          summary: "{{\n  case == 'food_add' and 'Food created.'\n  or case == 'food_update'
            and 'Food updated.'\n  or case == 'food_delete' and 'Food deleted.'\n  \n
            \ or case == 'mealplan_add_recipe' and 'Recipe scheduled.'\n  or case ==
            'mealplan_update_recipe' and 'Meal plan updated.'\n  or case == 'mealplan_delete_item'
            and 'Meal plan entry removed.'     \n\n  or case == 'recipes_create' and
            'Recipe created.'\n  or case == 'recipes_update' and 'Recipe updated.'\n
            \ or case == 'recipes_add_comment' and 'Comment added to recipe.'\n  or
            case == 'recipes_delete' and 'Recipe deleted.'\n\n  or case == 'shopping_list_add_item'
            and 'Item added.'\n  or case == 'shopping_list_remove_item' and 'Item removed.'\n
            \ or case == 'shopping_list_generate_from_recipe' and 'Shopping list generated.'\n
            \ \n  or case == 'unit_add' and 'Unit created.'\n  or case == 'unit_update'
            and 'Unit updated.'\n  or case == 'unit_delete' and 'Unit deleted.'\n  \n
            \ or 'Operation completed.'\n}}\n"
          raw:
            api: '{{ api_resp }}'
    - alias: Grocy sync on food write
      choose:
      - conditions:
        - condition: template
          value_template: "{{ case in ['food_add','food_update'] and safe_sync }}"
        sequence:
        - variables:
            sync_food_name: "{{ safe_payload.get('name','') | trim if safe_payload is mapping else '' }}"
            grocy_sync:
              status: error
              message: Inventory unavailable
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ sync_food_name != '' }}"
            sequence:
            - action: script.zen_dojotools_inventory
              response_variable: sf
              continue_on_error: true
              data:
                mode: catalog_find_product
                item: '{{ sync_food_name }}'
                report_inventory: false
            - variables:
                sf_ok: "{{ sf is defined and sf is mapping }}"
                sf_status: "{{ sf.status if (sf is defined and sf is mapping) else 'error' }}"
                sf_results: "{{ sf.result | default([]) if (sf is defined and sf is mapping) else [] }}"
                sf_message: "{{ sf.message | default('') if (sf is defined and sf is mapping) else 'Inventory unavailable' }}"
                sf_exact: "{{\n  sf_results | selectattr('name','defined') | map(attribute='name')\n  | select('equalto', sync_food_name) | list | length > 0\n}}"
                sf_real_results: "{{ sf_results | selectattr('name','defined') | list }}"
                sf_multiple: "{{ 'Multiple possible matches' in (sf_message ~ '') }}"
            - choose:
              - conditions:
                - condition: template
                  value_template: "{{ sf_status == 'success' and sf_exact }}"
                sequence:
                - variables:
                    sf_matched_pid: >-
                      {{ (sf_real_results | selectattr('name','equalto', sync_food_name) | list | first).id
                         | default(none) }}
                    sf_new_food_id: >-
                      {{ api_resp.raw.api.result.content.id | default(none)
                         if (api_resp is defined and api_resp.raw is mapping) else none }}
                - choose:
                  - conditions:
                    - condition: template
                      value_template: '{{ sf_matched_pid is not none and sf_new_food_id is not none }}'
                    sequence:
                    - action: script.zen_sutra_mealie
                      response_variable: sf_food_raw
                      continue_on_error: true
                      data:
                        mode: run
                        method: GET
                        endpoint: 'foods/{{ sf_new_food_id }}'
                        payload: '{{ none }}'
                    - variables:
                        sf_food_obj: >-
                          {{ sf_food_raw.result.content
                             if sf_food_raw is defined and sf_food_raw.result is mapping
                             and sf_food_raw.result.content is mapping else {} }}
                    - action: script.zen_sutra_mealie
                      response_variable: sf_tag_raw
                      continue_on_error: true
                      data:
                        mode: run
                        method: PUT
                        endpoint: 'foods/{{ sf_new_food_id }}'
                        payload: >-
                          {{ sf_food_obj | combine({"extras":
                             (sf_food_obj.extras if sf_food_obj.extras is mapping else {})
                             | combine({"grocy_product_id": sf_matched_pid | string})
                          }) | tojson }}
                - variables:
                    grocy_sync:
                      status: matched
                      message: '{{ sync_food_name }} already exists in Grocy. FK written.'
                      grocy_product_id: '{{ sf_matched_pid }}'
              - conditions:
                - condition: template
                  value_template: "{{ sf_status == 'success' and not sf_exact and sf_real_results | length > 0 }}"
                sequence:
                - variables:
                    grocy_sync:
                      status: ambiguous
                      message: 'Grocy has similar products but no exact match. Review candidates.'
                      candidates: "{{ sf_real_results | map(attribute='name') | list }}"
              - conditions:
                - condition: template
                  value_template: "{{ sf_status == 'error' and sf_multiple }}"
                sequence:
                - variables:
                    grocy_sync:
                      status: ambiguous
                      message: 'Multiple Grocy products match this name. Review candidates.'
                      candidates: "{{ sf.details.matches | map(attribute='name') | list if (sf is defined and sf.details is mapping) else [] }}"
              - conditions:
                - condition: template
                  value_template: "{{ sf_status == 'success' and sf_real_results | length == 0 }}"
                sequence:
                - action: script.zen_dojotools_inventory
                  response_variable: sc
                  continue_on_error: true
                  data:
                    mode: catalog_add_product
                    item: '{{ sync_food_name }}'
                    location: '{{ safe_sync_default_location }}'
                    unit: '{{ safe_sync_default_unit }}'
                - variables:
                    sc_ok: "{{ sc is defined and sc is mapping and sc.status | default('') == 'success' }}"
                    grocy_sync: "{{ {'status': 'created', 'message': sync_food_name ~ ' created in Grocy.'} if sc_ok else {'status': 'error', 'message': sc.message | default('Create failed') if (sc is defined and sc is mapping) else 'Inventory unavailable'} }}"
              - conditions:
                - condition: template
                  value_template: "{{ not sf_ok }}"
                sequence:
                - variables:
                    grocy_sync:
                      status: error
                      message: Inventory unavailable or timed out.
        - variables:
            final_response: "{{ final_response | combine({'sync': grocy_sync}) }}"
    - stop: return
      response_variable: final_response


###############################################################################
# REST Commands
###############################################################################

rest_command:
  mealie_recipe_search:
    url: >
      {{ states('input_text.mealie_url') | trim('/') }}/api/recipes?
      orderDirection=desc
      &page=1
      &perPage={{ perPage | default(10) }}
      {%- if search is defined -%}
        &search={{ search | urlencode }}
      {%- endif -%}
    method: GET
    headers:
      Authorization: !secret mealie_bearer
      accept: "application/json"
    verify_ssl: false

  mealie_api_advanced_openapi:
    url: "{{ states('input_text.mealie_url') | trim('/') }}/openapi.json"
    method: GET
    headers:
      Authorization: !secret mealie_bearer
      accept: 'application/json; charset=utf-8'
    verify_ssl: false

  mealie_api_advanced_get:
    url: >
      {%- if path_params is defined and path_params | length > 0 -%}
          {%- for key, value in path_params.items() -%}
              {%- set endpoint = endpoint | replace("{" ~ key ~ "}", value) -%}
          {%- endfor -%}
      {%- endif -%}
      {%- set endpoint = endpoint | replace('/api/', '') | replace('api/', '') %}
      {%- if endpoint[0] == '/' -%}
          {%- set endpoint = endpoint[1:] %}
      {%- endif -%}
      {{ states('input_text.mealie_url') | trim('/') }}/api/{{ endpoint }}?orderDirection={{ orderDirection | default("desc") }}
      {%- if search is defined and search not in ["", None] -%}
          &search={{ search | urlencode }}
      {%- endif %}
      {%- if additional_params is defined and additional_params | length > 0 and additional_params is mapping -%}
          {%- for key, value in additional_params.items() -%}
              &{{ key }}={{ value | urlencode }}
          {%- endfor -%}
      {%- endif %}
      {%- if pageNumber is defined and pageNumber > 0 -%}
          &page={{ pageNumber | default(1) }}
      {%- endif %}
      {%- if perPage is defined and perPage > 0 -%}
          &perPage={{ perPage | default(10) }}
      {%- endif %}
    method: GET
    headers:
      Authorization: !secret mealie_bearer
      accept: "application/json"
    verify_ssl: false

  mealie_api_advanced_post:
    url: >
      {%- set endpoint = endpoint | replace('/api/', '') | replace('api/', '') %}
      {%- if endpoint[0] == '/' -%}
          {%- set endpoint = endpoint[1:] %}
      {%- endif -%}
      {{ states('input_text.mealie_url') | trim('/') }}/api/ {{- endpoint }}
    method: POST
    headers:
      authorization: !secret mealie_bearer
      accept: 'application/json; charset=utf-8'
    payload: "{{- payload -}}"
    content_type: 'application/json; charset=utf-8'
    verify_ssl: false

  mealie_api_advanced_put:
    url: >
      {%- set endpoint = endpoint | replace('/api/', '') | replace('api/', '') %}
      {%- if endpoint[0] == '/' -%}
          {%- set endpoint = endpoint[1:] %}
      {%- endif -%}
      {{ states('input_text.mealie_url') | trim('/') }}/api/ {{- endpoint }}
    method: PUT
    headers:
      authorization: !secret mealie_bearer
      accept: 'application/json; charset=utf-8'
    payload: "{{- payload -}}"
    content_type: 'application/json; charset=utf-8'
    verify_ssl: false

  mealie_api_advanced_delete:
    url: >
      {%- set endpoint = endpoint | replace('/api/', '') | replace('api/', '') %}
      {%- if endpoint[0] == '/' -%}
          {%- set endpoint = endpoint[1:] %}
      {%- endif -%}
      {{ states('input_text.mealie_url') | trim('/') }}/api/ {{- endpoint }}
    method: DELETE
    headers:
      authorization: !secret mealie_bearer
      accept: 'application/json; charset=utf-8'
    payload: "{{- payload -}}"
    content_type: 'application/json; charset=utf-8'
    verify_ssl: false

  mealie_get_recipes:
    url: >
      {{ states('input_text.mealie_url') | trim('/') }}/api/recipes?
      orderDirection=desc
      {%- if search is defined -%}
        &searchs={{ search | urlencode }}
      {%- endif -%}      
