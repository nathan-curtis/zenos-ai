                      data:
                        mode: catalog_add_product
                        item: '{{ repeat.item.display }}'
                        location: Pantry
                    - variables:
                        _nf_new_id: >-
                          {{ _nf_create_resp.result.product_id | default(none)
                             if _nf_create_resp is mapping else none }}
                    - choose:
                      - conditions:
                        - condition: template
                          value_template: '{{ _nf_new_id is not none }}'
                        sequence:
                        - action: script.zen_dojotools_inventory
                          response_variable: _nf_add2_resp
                          continue_on_error: true
                          data:
                            mode: shopping_add_product
                            product_id: '{{ _nf_new_id | int }}'
                            list_id: '{{ _sls_grocy_list_id | int }}'
                            amount: '{{ repeat.item.quantity }}'
                        - variables:
                            _sls_notes_synced: '{{ _sls_notes_synced + [repeat.item.display] }}'
                            _sls_notes_created: '{{ _sls_notes_created + [repeat.item.display] }}'
                      - conditions:
                        - condition: template
                          value_template: '{{ true }}'
                        sequence:
                        - variables:
                            _sls_notes_errors: '{{ _sls_notes_errors + [repeat.item.display] }}'
                  - conditions:
                    - condition: template
                      value_template: '{{ true }}'
                    sequence:
                    - variables:
                        _sls_notes_ambiguous: >-
                          {{
                            _sls_notes_ambiguous + [{
                              'name': repeat.item.display,
                              'candidates': (_nf_resp.details.matches
                                | map(attribute='name') | list)
                                if (_nf_resp.details is mapping and _nf_resp.details.matches is sequence)
                                else (_nf_real | map(attribute='name') | list)
                            }]
                          }}
            - action: script.zen_sutra_mealie
              response_variable: _sls_stamp_resp
              continue_on_error: true
              data:
                mode: run
                method: PUT
                endpoint: 'households/shopping/lists/{{ _sls_list.id }}'
                payload: '{{ _sls_full | combine({"extras": _sls_ex | combine({"grocy_list_id": _sls_grocy_list_id | string, "last_synced_at": now().isoformat(), "last_ready_count": _sls_ready | length | string, "last_total_count": _sls_items_raw | length | string})}) | tojson }}'
            - variables:
                final_response:
                  status: success
                  case: shopping_list_sync
                  mode: apply
                  list_id: '{{ _sls_list.id }}'
                  list_name: '{{ _sls_list.name }}'
                  grocy_list_id: '{{ _sls_grocy_list_id }}'
                  summary:
                    synced: '{{ _sls_synced | length }}'
                    errors: '{{ _sls_errors | length }}'
                    skipped_pending: '{{ _sls_pending_ct }}'
                    skipped_note_only: '{{ _sls_note_ct }}'
                    notes_synced: '{{ _sls_notes_synced | length }}'
                    notes_created: '{{ _sls_notes_created | length }}'
                    notes_ambiguous: '{{ _sls_notes_ambiguous | length }}'
                  synced_items: '{{ _sls_synced }}'
                  error_items: '{{ _sls_errors }}'
                  notes_synced_items: '{{ _sls_notes_synced }}'
                  notes_created_items: '{{ _sls_notes_created }}'
                  notes_ambiguous_items: '{{ _sls_notes_ambiguous }}'
                  coaching: >-
                    {{
                      ["Pending items have Mealie foods but no Grocy FK. Run case=sync_now (orchestrator) to bulk-create Grocy products and write FKs, then re-sync. Or use notes_resolve item=<name> grocy_product_id=<id> for individual items."]
                      if (_sls_pending_ct | int) > 0 else []
                    }}
                  writes:
                    level: batch
            - stop: return
              response_variable: final_response
        - variables:
            final_response:
              status: success
              case: shopping_list_sync
              mode: preview
              list_id: '{{ _sls_list.id }}'
              list_name: '{{ _sls_list.name }}'
              grocy_list_id: '{{ _sls_grocy_list_id }}'
              summary:
                would_sync: '{{ _sls_ready | length }}'
                skipped_pending: '{{ _sls_pending_ct }}'
                skipped_note_only: '{{ _sls_note_ct }}'
                would_sync_notes: '{{ _sls_notes_ready | length }}'
              would_sync_items: '{{ _sls_ready | map(attribute="display") | list }}'
              would_sync_notes_items: '{{ _sls_notes_ready | map(attribute="display") | list }}'
              coaching: >-
                {{
                  (["Pending items have Mealie foods but no Grocy FK. Run case=sync_now (orchestrator) to bulk-create Grocy products and write FKs, then re-sync. Or use notes_resolve item=<name> grocy_product_id=<id> for individual items."]
                  if (_sls_pending_ct | int) > 0 else [])
                  + (["Note-only items have no food link. Workflow: notes_resolve (adds food + grocy_product_id) → notes_promote item=<list_name> (writes foodId to list items) → shopping_list_sync."]
                  if (_sls_note_ct | int) > 0 else [])
                }}
              writes:
                level: none
        - stop: return
          response_variable: final_response
    - variables:
        resolved_shopping_list_id: '{{ safe_shopping_list_id | string | trim }}'
    - alias: Resolve Shopping List to Shopping List ID if necessary
      choose:
      - conditions:
        - alias: Must Resolve Shopping List to Shopping List ID
          condition: template
          value_template: "{{\n  case in [\n    'shopping_list_get_items',\n    'shopping_list_generate_from_recipe',\n
            \   'shopping_list_add_item'\n  ]\n  and resolved_shopping_list_id == ''\n
            \ and (safe_shopping_list | string | trim != '')\n}}\n\n"
        sequence:
        - action: script.zen_sutra_mealie
          response_variable: shopping_lists_resp
          data:
            mode: run
            method: GET
            endpoint: households/shopping/lists
            payload: '{{ none }}'
            pageNumber: 1
            perPage: 200
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ shopping_lists_resp.result.status | default(200) >=
                400 }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: '{{ case }}'
                  message: 'Failed to fetch shopping lists for resolution.
  
                    '
            - stop: return
              response_variable: error_response
        - variables:
            lists_raw: "{{\n  shopping_lists_resp.result.content\n  | default([])\n}}"
            lists: "{{\n  (\n    (lists_raw['items'] if (lists_raw is mapping and 'items'
              in lists_raw) else lists_raw)\n    | default([])\n  )\n}}"
            matches: "{{\n  lists\n  | selectattr('name', 'equalto', (safe_shopping_list
              | string | trim))\n  | list\n}}"
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ matches | length == 0 }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: '{{ case }}'
                  message: 'Shopping list name did not match any list exactly: "{{ safe_shopping_list
                    }}".
  
                    '
            - stop: return
              response_variable: error_response
          - conditions:
            - condition: template
              value_template: '{{ matches | length > 1 }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: '{{ case }}'
                  message: 'Shopping list name matched multiple lists exactly: "{{ safe_shopping_list
                    }}". Refuse to guess.
  
                    '
            - stop: return
              response_variable: error_response
        - variables:
            resolved_shopping_list_id: "{{\n  (matches[0].id | default('')) | string
              | trim\n}}"
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ resolved_shopping_list_id == '''' }}'
            sequence:
            - variables:
                error_response:
                  status: error
                  case: '{{ case }}'
                  message: 'Shopping list resolved but had no id field. Cannot proceed.
  
                    '
            - stop: return
              response_variable: error_response
    - variables:
        required_fields: "{{\n  case in case_meta\n  and case_meta[case].requires\n
          \ or []\n}}\n"
        missing_fields: "{% set ns = namespace(out=[]) %}\n{% set p = safe_payload if
          safe_payload is mapping else {} %}\n\n{% for field in required_fields %}\n
          \ {% set v =\n    (field == 'recipe_id' and (safe_recipe_id or p.get('recipe_id')))\n
          \   or (field == 'item_id' and (safe_item_id or p.get('item_id')))\n    or
          (field == 'shopping_list_id' and resolved_shopping_list_id)\n    or (field
          == 'item' and (safe_item or p.get('item')))\n    or (field == 'date' and (safe_date
          or p.get('date')))\n    or (field == 'entry_type' and (safe_entry_type or
          p.get('entry_type')))\n    or (field == 'organizer_type' and safe_organizer_type)\n
          \   or (field == 'slug' and safe_slug)\n    or (field == 'search' and (safe_search
          or p.get('search')))\n    or (field == 'text' and safe_text)\n    or (field
          == 'unit' and safe_unit)\n    or (field == 'payload' and safe_payload)\n    or
          ''\n  %}\n\n  {% if v in [None, '', []] %}\n    {% set ns.out = ns.out + [field]
          %}\n  {% endif %}\n{% endfor %}\n{{ ns.out }}\n"
    - alias: Preflight Guards
      choose:
      - conditions:
        - condition: template
          value_template: '{{ missing_fields | length > 0 }}'
          alias: 'Error: Missing Fields'
        sequence:
        - variables:
            error_response:
              status: error
              case: '{{ case }}'
              message: 'Missing required fields: {{ missing_fields | join('', '') }}
  
                '
        - stop: return
          response_variable: error_response
      - conditions:
        - condition: template
          value_template: "{{\n  case_meta[case].allowed_entry_types is defined\n  and
            entry_type not in case_meta[case].allowed_entry_types\n}}\n"
          alias: 'Error: Invalid entry_type'
        sequence:
        - variables:
            error_response:
              status: error
              case: '{{ case }}'
              message: 'Invalid entry_type. Allowed: {{ case_meta[case].allowed_entry_types
                | join('', '') }}
  
                '
        - stop: return
          response_variable: error_response
      - conditions:
        - condition: template
          value_template: "{{\n  case in [\n    'mealplan_add_recipe',\n    'mealplan_update_recipe',\n
            \   'mealplan_add_or_update_recipe'\n  ]\n  and\n  (\n    (safe_recipe_id
            | default('') | string | trim == '')\n    and (safe_title | default('')
            | string | trim == '')\n    and (safe_text | default('') | string | trim
            == '')\n    and (\n      safe_payload is not mapping\n      or (\n        (safe_payload.get('recipe_id','')
            | string | trim == '')\n        and (safe_payload.get('recipeId','') | string
            | trim == '')\n        and (safe_payload.get('title','') | string | trim
            == '')\n        and (safe_payload.get('text','') | string | trim == '')\n
            \     )\n    )\n  )\n}}"
          alias: 'Error: Meal has no content'
        sequence:
        - variables:
            error_response:
              status: error
              case: '{{ case }}'
              message: 'Meal must include either a recipe or a title/text note.
  
                '
        - stop: return
          response_variable: error_response
      - conditions:
        - condition: template
          value_template: "{{\n  case in ['food_add','food_update']\n  and (\n    safe_payload
            is not mapping\n    or (safe_payload | count == 0)\n  )\n}}\n"
        alias: 'Error: Food payload empty'
        sequence:
        - variables:
            error_response:
              status: error
              case: '{{ case }}'
              message: Food operations require a non-empty payload.
        - stop: return
          response_variable: error_response
      - conditions:
        - condition: template
          value_template: "{{\n  case == 'shopping_list_generate_from_recipe'\n  and
            (safe_shopping_list_id | string | trim == '')\n  and (safe_shopping_list
            | string | trim == '')\n}}\n"
        alias: 'Error: Shopping list not specified'
        sequence:
        - variables:
            error_response:
              status: error
              case: '{{ case }}'
              message: 'shopping_list_id or shopping_list is required for shopping_list_generate_from_recipe.
  
                '
        - stop: return
          response_variable: error_response
      - conditions:
        - condition: template
          value_template: "{{\n  case.startswith('organizers_')\n  and safe_organizer_type
            not in ['categories','tags','tools']\n}}\n"
        alias: 'Error: Invalid organizer_type'
        sequence:
        - variables:
            error_response:
              status: error
              case: '{{ case }}'
              message: 'Invalid organizer_type. Allowed: categories, tags, tools.
  
                '
        - stop: return
          response_variable: error_response
    - alias: 'Pre-fetch — mealplan_update_recipe needs groupId/userId Mealie now requires on PUT'
      choose:
      - conditions:
        - condition: template
          value_template: "{{ case == 'mealplan_update_recipe' and safe_item_id != '' }}"
        sequence:
        - action: script.zen_sutra_mealie
          response_variable: _mu_existing_raw
          continue_on_error: true
          data:
            mode: run
            method: GET
            endpoint: 'households/mealplans/{{ safe_item_id }}'
            payload: '{{ none }}'
        - variables:
            _mu_existing: >-
              {{ _mu_existing_raw.result.content if (_mu_existing_raw is defined and _mu_existing_raw.result.content is mapping) else {} }}
    - variables:
        _mu_group_id: "{{ (_mu_existing.get('groupId', none) if (_mu_existing is defined and _mu_existing is mapping) else none) }}"
        _mu_user_id: "{{ (_mu_existing.get('userId', none) if (_mu_existing is defined and _mu_existing is mapping) else none) }}"
    - variables:
        method: '{{ case_meta[case].method }}'
        endpoint: "{{\n  case_meta[case].endpoint\n  | replace('{shopping_list_id}',
          resolved_shopping_list_id | default('') | string)\n  | replace('{id}',\n      (\n
          \       (case in ['unit_get','unit_update','unit_delete','food_get','food_update','food_delete']\n
          \         and (safe_item_id | default('') | string))\n        or (safe_recipe_id
          | default('') | string)\n      )\n    )\n  | replace('{organizer_type}', safe_organizer_type)\n
          \ | replace('{item_id}', safe_item_id)\n  | replace('{slug}', safe_slug)\n}}"
        query_params: "{% set ns = namespace(q={}) %}\n\n{# --- mealplan_list: keep
          existing behavior (uses page/perPage + other filters) --- #}\n{% if case ==
          'mealplan_list' %}\n  {% if start_date is defined and (start_date | string
          | trim) != '' %}\n    {% set ns.q = ns.q | combine({'start_date': start_date})
          %}\n  {% endif %}\n  {% if end_date is defined and (end_date | string | trim)
          != '' %}\n    {% set ns.q = ns.q | combine({'end_date': end_date}) %}\n  {%
          endif %}\n  {% if orderBy is defined and (orderBy | string | trim) != '' %}\n
          \   {% set ns.q = ns.q | combine({'orderBy': orderBy}) %}\n  {% endif %}\n
          \ {% if orderDirection is defined and (orderDirection | string | trim) !=
          '' %}\n    {% set ns.q = ns.q | combine({'orderDirection': orderDirection})
          %}\n  {% endif %}\n  {% if page is defined and page %}\n    {% set ns.q =
          ns.q | combine({'page': page | int}) %}\n  {% endif %}\n  {% if perPage is
          defined and perPage %}\n    {% set ns.q = ns.q | combine({'perPage': perPage
          | int}) %}\n  {% endif %}\n  {% if queryFilter is defined and (queryFilter
          | string | trim) != '' %}\n    {% set ns.q = ns.q | combine({'queryFilter':
          queryFilter}) %}\n  {% endif %}\n{% endif %}\n\n{# --- list endpoints: pagination + optional queryFilter DSL passthrough --- #}\n{% if case in ['recipes_list','recipes_find','foods_list','foods_find']
          %}\n  {% if page is defined and page %}\n    {% set ns.q = ns.q | combine({'pageNumber':
          page | int}) %}\n  {% endif %}\n  {% if perPage is defined and perPage %}\n
          \   {% set ns.q = ns.q | combine({'perPage': perPage | int}) %}\n  {% endif
          %}\n{% endif %}\n{% if case in ['recipes_list','recipes_find'] and queryFilter is defined and (queryFilter | string | trim) != '' %}\n  {% set ns.q = ns.q | combine({'queryFilter': queryFilter | string | trim}) %}\n{% endif %}\n{% if case in ['foods_find','recipes_find'] and safe_search is string and (safe_search | trim) != '' %}\n  {% set ns.q = ns.q | combine({'search': safe_search | trim}) %}\n{% endif %}\n\n{{ ns.q }}"
        final_payload: "{% if case in ['mealplan_list'] %}\n  {{ query_params }}\n\n{%
          elif case == 'units_list' %}\n  {{ none }}\n\n{% elif case == 'units_find'
          %}\n  {{ {\"search\": safe_search} | tojson }}\n\n{% elif case == 'unit_get'
          %}\n  {{ none }}\n\n{% elif case == 'unit_delete' %}\n  {{ none }}\n\n{% elif
          case == 'unit_add' %}\n  {{\n    {\n      \"name\": safe_unit,\n      \"pluralName\":
          (safe_unit_plural if (safe_unit_plural | string | trim) != '' else none),\n
          \     \"description\": (safe_unit_description if (safe_unit_description |
          string | trim) != '' else \"\")\n    } | tojson\n  }}\n\n{% elif case == 'unit_update'
          %}\n  {{\n    {\n      \"id\": (safe_item_id | int),\n      \"name\": safe_unit,\n
          \     \"pluralName\": (safe_unit_plural if (safe_unit_plural | string | trim)
          != '' else none),\n      \"description\": (safe_unit_description if (safe_unit_description
          | string | trim) != '' else \"\")\n    } | tojson\n  }}\n\n{% elif case in
          [\n  'recipes_list',\n  'recipes_find',\n  'recipes_get',\n  'recipe_tags_list',\n  'recipe_categories_list',\n
          \ 'recipe_tools_list',\n  'shopping_list_get',\n  'shopping_list_remove_item',\n
          \ 'recipes_delete'\n] %}\n  {{ none }}\n\n{% elif case in [\n  'recipes_get_stats',\n
          \ 'recipes_get_comments',\n  'shopping_list_get_items',\n  'shopping_list_clear_completed',\n
          \ 'mealplan_get_item',\n  'mealplan_delete_item'\n] %}\n  {{ none }}\n\n{%
          elif case == 'recipes_create' %}\n  {{ safe_payload }}\n\n{%
          elif case == 'recipes_add_comment' %}\n  {{ {\"text\": safe_text} | tojson
          }}\n\n{% elif case == 'shopping_list_add_item' %}\n  {{\n    {\n      \"shoppingListId\": resolved_shopping_list_id,\n      \"note\": safe_item,\n      \"quantity\": safe_quantity | default(1),\n      \"checked\": false\n    }\n    | combine(\n        { \"unit\": { \"name\": safe_unit } }\n        if (safe_unit | string | trim) != '' else {}\n      )\n    | tojson\n  }}\n\n{%
          elif case == 'shopping_list_generate_from_recipe' %}\n  {{ {\"recipeId\":
          safe_recipe_id} | tojson }}\n\n{% elif case == 'mealplan_add_recipe' %}\n  {{\n    {\n
          \     \"date\": safe_date,\n      \"entryType\": safe_entry_type,\n      \"recipeId\":
          (safe_recipe_id if (safe_recipe_id | string | trim) != '' else none),\n      \"title\":
          safe_title,\n      \"text\": safe_text\n    } | tojson\n  }}\n\n{% elif case
          == 'mealplan_update_recipe' %}\n  {{\n    {\n      \"id\": safe_item_id |
          int,\n      \"date\": safe_date,\n      \"entryType\": safe_entry_type,\n
          \     \"recipeId\": (safe_recipe_id if (safe_recipe_id | string | trim) !=
          '' else none),\n      \"title\": safe_title,\n      \"text\": safe_text, \"groupId\": _mu_group_id, \"userId\": _mu_user_id\n
          \   } | tojson\n  }}\n\n{% elif case in ['foods_list','food_get','food_delete']
          %}\n  {{ none }}\n\n{% elif case == 'foods_find' %}\n  {{ {\"search\": safe_search}
          | tojson }}\n\n{% elif case in ['food_add','food_update'] %}\n  {{ safe_payload
          }}\n\n{% elif case == 'cookbooks_create' %}\n  {{ safe_payload
          }}\n\n{% else %}\n  {{ none }}\n{% endif %}"
    - action: script.zen_sutra_mealie
      response_variable: api_resp
      data:
        mode: run
        method: '{{ method }}'
        endpoint: '{{ endpoint }}'
        payload: '{{ final_payload }}'
        pageNumber: '{{ (query_params.pageNumber if (query_params is mapping and query_params.pageNumber
          is defined) else (page | default(1))) | int(1) }}'
        perPage: '{{ (query_params.perPage if (query_params is mapping and query_params.perPage
          is defined) else (perPage | default(50))) | int(50) }}'
        additional_params: "{{\n  (query_params if (query_params is mapping and query_params
          | length > 0) else {})\n}}"
    - alias: Post API Call Validation
      choose:
      - conditions:
        - condition: template
          value_template: '{{ api_resp.result.status | default(200) >= 400 }}'
          alias: HTTP Status > 200
        sequence:
        - variables:
            message: "{{\n  {\n    \"mealie_api_error\": {\n      \"http_status\": api_resp.result.status
              | default(''),\n      \"detail\": api_resp.result.content.detail | default(api_resp.result.content)
              |default('')\n    }\n  }\n}}"
            final_response: "{{\n  {\n    \"status\": \"error\",\n    \"case\": case
              | default('ERROR_UNDEFINED_CASE'),\n    \"message\": message | default({})\n
              \ }\n}}"
        - stop: return
          response_variable: final_response
    - variables:
        final_response:
          status: success
          case: '{{ case }}'
          writes:
            level: '{{ case_meta[case].writes.level }}'
          summary: "{{\n  case == 'food_add' and 'Food created.'\n  or case == 'food_update'
            and 'Food updated.'\n  or case == 'food_delete' and 'Food deleted.'\n  \n
            \ or case == 'mealplan_add_recipe' and 'Recipe scheduled.'\n  or case ==
            'mealplan_update_recipe' and 'Meal plan updated.'\n  or case == 'mealplan_delete_item'
            and 'Meal plan entry removed.'     \n\n  or case == 'recipes_create' and
            'Recipe created.'\n  or case == 'recipes_update' and 'Recipe updated.'\n
            \ or case == 'recipes_add_comment' and 'Comment added to recipe.'\n  or
            case == 'recipes_delete' and 'Recipe deleted.'\n\n  or case == 'shopping_list_add_item'
            and 'Item added.'\n  or case == 'shopping_list_remove_item' and 'Item removed.'\n
            \ or case == 'shopping_list_generate_from_recipe' and 'Shopping list generated.'\n
            \ \n  or case == 'unit_add' and 'Unit created.'\n  or case == 'unit_update'
            and 'Unit updated.'\n  or case == 'unit_delete' and 'Unit deleted.'\n  \n
            \ or 'Operation completed.'\n}}\n"
          raw:
            api: '{{ api_resp }}'
    - alias: Grocy sync on food write
      choose:
      - conditions:
        - condition: template
          value_template: "{{ case in ['food_add','food_update'] and safe_sync }}"
        sequence:
        - variables:
            sync_food_name: "{{ safe_payload.get('name','') | trim if safe_payload is mapping else '' }}"
            grocy_sync:
              status: error
              message: Inventory unavailable
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ sync_food_name != '' }}"
            sequence:
            - action: script.zen_dojotools_inventory
              response_variable: sf
              continue_on_error: true
              data:
                mode: catalog_find_product
                item: '{{ sync_food_name }}'
                report_inventory: false
            - variables:
                sf_ok: "{{ sf is defined and sf is mapping }}"
                sf_status: "{{ sf.status if (sf is defined and sf is mapping) else 'error' }}"
                sf_results: "{{ sf.result | default([]) if (sf is defined and sf is mapping) else [] }}"
                sf_message: "{{ sf.message | default('') if (sf is defined and sf is mapping) else 'Inventory unavailable' }}"
                sf_exact: "{{\n  sf_results | selectattr('name','defined') | map(attribute='name')\n  | select('equalto', sync_food_name) | list | length > 0\n}}"
                sf_real_results: "{{ sf_results | selectattr('name','defined') | list }}"
                sf_multiple: "{{ 'Multiple possible matches' in (sf_message ~ '') }}"
            - choose:
              - conditions:
                - condition: template
                  value_template: "{{ sf_status == 'success' and sf_exact }}"
                sequence:
                - variables:
                    sf_matched_pid: >-
                      {{ (sf_real_results | selectattr('name','equalto', sync_food_name) | list | first).id
                         | default(none) }}
                    sf_new_food_id: >-
                      {{ api_resp.raw.api.result.content.id | default(none)
                         if (api_resp is defined and api_resp.raw is mapping) else none }}
                - choose:
                  - conditions:
                    - condition: template
                      value_template: '{{ sf_matched_pid is not none and sf_new_food_id is not none }}'
                    sequence:
                    - action: script.zen_sutra_mealie
                      response_variable: sf_food_raw
                      continue_on_error: true
                      data:
                        mode: run
                        method: GET
                        endpoint: 'foods/{{ sf_new_food_id }}'
                        payload: '{{ none }}'
                    - variables:
                        sf_food_obj: >-
                          {{ sf_food_raw.result.content
                             if sf_food_raw is defined and sf_food_raw.result is mapping
                             and sf_food_raw.result.content is mapping else {} }}
                    - action: script.zen_sutra_mealie
                      response_variable: sf_tag_raw
                      continue_on_error: true
                      data:
                        mode: run
                        method: PUT
                        endpoint: 'foods/{{ sf_new_food_id }}'
                        payload: >-
                          {{ sf_food_obj | combine({"extras":
                             (sf_food_obj.extras if sf_food_obj.extras is mapping else {})
                             | combine({"grocy_product_id": sf_matched_pid | string})
                          }) | tojson }}
                - variables:
                    grocy_sync:
                      status: matched
                      message: '{{ sync_food_name }} already exists in Grocy. FK written.'
                      grocy_product_id: '{{ sf_matched_pid }}'
              - conditions:
                - condition: template
                  value_template: "{{ sf_status == 'success' and not sf_exact and sf_real_results | length > 0 }}"
                sequence:
                - variables:
                    grocy_sync:
                      status: ambiguous
                      message: 'Grocy has similar products but no exact match. Review candidates.'
                      candidates: "{{ sf_real_results | map(attribute='name') | list }}"
              - conditions:
                - condition: template
                  value_template: "{{ sf_status == 'error' and sf_multiple }}"
                sequence:
                - variables:
                    grocy_sync:
                      status: ambiguous
                      message: 'Multiple Grocy products match this name. Review candidates.'
                      candidates: "{{ sf.details.matches | map(attribute='name') | list if (sf is defined and sf.details is mapping) else [] }}"
              - conditions:
                - condition: template
                  value_template: "{{ sf_status == 'success' and sf_real_results | length == 0 }}"
                sequence:
                - action: script.zen_dojotools_inventory
                  response_variable: sc
                  continue_on_error: true
                  data:
                    mode: catalog_add_product
                    item: '{{ sync_food_name }}'
                    location: '{{ safe_sync_default_location }}'
                    unit: '{{ safe_sync_default_unit }}'
                - variables:
                    sc_ok: "{{ sc is defined and sc is mapping and sc.status | default('') == 'success' }}"
                    grocy_sync: "{{ {'status': 'created', 'message': sync_food_name ~ ' created in Grocy.'} if sc_ok else {'status': 'error', 'message': sc.message | default('Create failed') if (sc is defined and sc is mapping) else 'Inventory unavailable'} }}"
              - conditions:
                - condition: template
                  value_template: "{{ not sf_ok }}"
                sequence:
                - variables:
                    grocy_sync:
                      status: error
                      message: Inventory unavailable or timed out.
        - variables:
            final_response: "{{ final_response | combine({'sync': grocy_sync}) }}"
    - stop: return
      response_variable: final_response


###############################################################################
# REST Commands
###############################################################################

rest_command:
  mealie_recipe_search:
    url: >
      {{ states('input_text.mealie_url') | trim('/') }}/api/recipes?
      orderDirection=desc
      &page=1
      &perPage={{ perPage | default(10) }}
      {%- if search is defined -%}
        &search={{ search | urlencode }}
      {%- endif -%}
    method: GET
    headers:
      Authorization: !secret mealie_bearer
      accept: "application/json"
    verify_ssl: false

  mealie_api_advanced_openapi:
    url: "{{ states('input_text.mealie_url') | trim('/') }}/openapi.json"
    method: GET
    headers:
      Authorization: !secret mealie_bearer
      accept: 'application/json; charset=utf-8'
    verify_ssl: false

  mealie_api_advanced_get:
    url: >
      {%- if path_params is defined and path_params | length > 0 -%}
          {%- for key, value in path_params.items() -%}
              {%- set endpoint = endpoint | replace("{" ~ key ~ "}", value) -%}
          {%- endfor -%}
      {%- endif -%}
      {%- set endpoint = endpoint | replace('/api/', '') | replace('api/', '') %}
      {%- if endpoint[0] == '/' -%}
          {%- set endpoint = endpoint[1:] %}
      {%- endif -%}
      {{ states('input_text.mealie_url') | trim('/') }}/api/{{ endpoint }}?orderDirection={{ orderDirection | default("desc") }}
      {%- if search is defined and search not in ["", None] -%}
          &search={{ search | urlencode }}
      {%- endif %}
      {%- if additional_params is defined and additional_params | length > 0 and additional_params is mapping -%}
          {%- for key, value in additional_params.items() -%}
              &{{ key }}={{ value | urlencode }}
          {%- endfor -%}
      {%- endif %}
      {%- if pageNumber is defined and pageNumber > 0 -%}
          &page={{ pageNumber | default(1) }}
      {%- endif %}
      {%- if perPage is defined and perPage > 0 -%}
          &perPage={{ perPage | default(10) }}
      {%- endif %}
    method: GET
    headers:
      Authorization: !secret mealie_bearer
      accept: "application/json"
    verify_ssl: false

  mealie_api_advanced_post:
    url: >
      {%- set endpoint = endpoint | replace('/api/', '') | replace('api/', '') %}
      {%- if endpoint[0] == '/' -%}
          {%- set endpoint = endpoint[1:] %}
      {%- endif -%}
      {{ states('input_text.mealie_url') | trim('/') }}/api/ {{- endpoint }}
    method: POST
    headers:
      authorization: !secret mealie_bearer
      accept: 'application/json; charset=utf-8'
    payload: "{{- payload -}}"
    content_type: 'application/json; charset=utf-8'
    verify_ssl: false

  mealie_api_advanced_put:
    url: >
      {%- set endpoint = endpoint | replace('/api/', '') | replace('api/', '') %}
      {%- if endpoint[0] == '/' -%}
          {%- set endpoint = endpoint[1:] %}
      {%- endif -%}
      {{ states('input_text.mealie_url') | trim('/') }}/api/ {{- endpoint }}
    method: PUT
    headers:
      authorization: !secret mealie_bearer
      accept: 'application/json; charset=utf-8'
    payload: "{{- payload -}}"
    content_type: 'application/json; charset=utf-8'
    verify_ssl: false

  mealie_api_advanced_delete:
    url: >
      {%- set endpoint = endpoint | replace('/api/', '') | replace('api/', '') %}
      {%- if endpoint[0] == '/' -%}
          {%- set endpoint = endpoint[1:] %}
      {%- endif -%}
      {{ states('input_text.mealie_url') | trim('/') }}/api/ {{- endpoint }}
    method: DELETE
    headers:
      authorization: !secret mealie_bearer
      accept: 'application/json; charset=utf-8'
    payload: "{{- payload -}}"
    content_type: 'application/json; charset=utf-8'
    verify_ssl: false

  mealie_get_recipes:
    url: >
      {{ states('input_text.mealie_url') | trim('/') }}/api/recipes?
      orderDirection=desc
      {%- if search is defined -%}
        &searchs={{ search | urlencode }}
      {%- endif -%}      
      {%- if categories is defined -%}
        &categories={{ categories | urlencode }}
      {%- endif -%}
      {%- if tags is defined -%}
        &tags={{ tags | urlencode }}
      {%- endif -%}
      {%- if tools is defined -%}
        &tools={{ tools | urlencode }}
      {%- endif -%}
      {%- if foods is defined -%}
        &foods={{ foods | urlencode }}
      {%- endif -%}
      &page={{ pageNumber| default(1) }}
      &perPage={{ perPage | default(10) }}
    method: GET
    headers:
      Authorization: !secret mealie_bearer
      accept: "application/json"
    verify_ssl: false

