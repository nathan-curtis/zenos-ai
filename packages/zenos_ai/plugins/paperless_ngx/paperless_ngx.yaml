###############################################################################
# ZenOS-AI Plugin: Paperless-NGX — Stacks
# Version: 0.7.3
#
# Providers:
#   zen_stack_paperless  <- Lens bus stack provider (called by zen_dojotools_library)
#
# Internal adapter:
#   zen_sutra_paperless  ← internal REST broker (NOT MCP-exposed)
#
# CONFIG:
#   household cabinet: integrations_config.paperless_ngx.url
#   household cabinet: integrations_config.paperless_ngx.api_version (default 9)
#
# SECRETS:
#   paperless_ngx_token: "Token YOUR_PAPERLESS_API_TOKEN"
#
# Note: HA !secret values cannot be concatenated inside a header template, so the
# secret stores the full Authorization header value including the "Token " prefix.
###############################################################################

rest_command:
  paperless_ngx_rest_get:
    url: >
      {{ base_url | default('', true) | string | trim | regex_replace('/$','') }}{{ endpoint }}
    method: GET
    headers:
      Authorization: !secret paperless_ngx_token
      Accept: >
        application/json; version={{ api_version | default(9, true) | int(9) }}
    verify_ssl: false
    timeout: 30

  paperless_ngx_rest_post:
    url: >
      {{ base_url | default('', true) | string | trim | regex_replace('/$','') }}{{ endpoint }}
    method: POST
    headers:
      Authorization: !secret paperless_ngx_token
      Content-Type: application/json
      Accept: >
        application/json; version={{ api_version | default(9, true) | int(9) }}
    payload: '{{ payload }}'
    verify_ssl: false
    timeout: 30

  paperless_ngx_rest_patch:
    url: >
      {{ base_url | default('', true) | string | trim | regex_replace('/$','') }}{{ endpoint }}
    method: PATCH
    headers:
      Authorization: !secret paperless_ngx_token
      Content-Type: application/json
      Accept: >
        application/json; version={{ api_version | default(9, true) | int(9) }}
    payload: '{{ payload }}'
    verify_ssl: false
    timeout: 30

  paperless_ngx_rest_delete:
    url: >
      {{ base_url | default('', true) | string | trim | regex_replace('/$','') }}{{ endpoint }}
    method: DELETE
    headers:
      Authorization: !secret paperless_ngx_token
      Accept: >
        application/json; version={{ api_version | default(9, true) | int(9) }}
    verify_ssl: false
    timeout: 30

script:
  zen_stack_paperless:
    alias: Zen Stack Provider - Paperless-NGX (Internal)
    description: >
      Internal Stack provider handler for Paperless-NGX. Provider-facing adapter
      for Library/Lens dispatch. Not intended as a public user tool.
    mode: parallel
    max: 10
    fields:
      mode:
        name: Mode
        description: "stacks_by_anchor | register | unregister | inspect | health | audit | stacks_configure | help | tool_manifest"
        selector:
          select:
            options:
            - stacks_by_anchor
            - register
            - unregister
            - inspect
            - health
            - audit
            - stacks_configure
            - help
            - tool_manifest
        default: help
      input_json:
        name: Input JSON
        description: Structured JSON payload for the Stack operation.
        selector:
          text:
            multiline: true
      caller_token:
        name: Caller Token
        description: Opaque token passed through for correlation.
        selector:
          text:
    sequence:
    - variables:
        _mode_norm: "{{ mode | default('help') | string | trim | lower }}"
        _hh: "{{ states('sensor.zen_default_household_cabinet_resolved') }}"

    - choose:
      - conditions:
        - condition: template
          value_template: '{{ _mode_norm == "tool_manifest" }}'
        sequence:
        - action: script.zen_dojotools_filecabinet
          response_variable: _ic_fc_raw
          continue_on_error: true
          data:
            action_type: get
            volume_entity_id: "{{ _hh }}"
            path: integrations_config
        - variables:
            _base_url: >-
              {%- set _ic = _ic_fc_raw.get('value', {}) if _ic_fc_raw is mapping and _ic_fc_raw.get('status') == 'success' else {} -%}
              {%- set _ic = _ic if _ic is mapping else {} -%}
              {{ _ic.get('paperless_ngx', {}).get('url', '') | string | trim }}
        - variables:
            _provider_response: >-
              {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
              {%- set _health = {'configured': _base_url != '', 'status': 'ok' if _base_url != '' else 'warn', 'notes': [] if _base_url != '' else ['Paperless-NGX URL not configured — run Library stacks_configure']} -%}
              {{- MF.tool_manifest(
                tool='zen_stack_paperless',
                display_name='Paperless-NGX Document Stack',
                tier='dojotools',
                version='0.7.3',
                health=_health,
                required_labels=['paperless'],
                optional_labels=['documents', 'stacks'],
                consumes=['label', 'person', 'area_id', 'zone'],
                returns=['document_evidence'],
                failure_policy='soft',
                content_policy='redacted_by_default',
                risk_class='read_redacted',
                security_act={'model': 'rwxda', 'required': 'r', 'allowed': ['r'], 'denied': ['w', 'x', 'd', 'a'], 'note': 'Lens provider returns redacted read evidence only; CRUD modes are outside the lens bus.'},
                modes={'lookup': 'stacks_by_anchor', 'manifest': 'tool_manifest'},
                limitations=['Document content is redacted by default — pass include_content: true to opt in.', 'CRUD operations require zen_sutra_paperless (debug only).'],
                evidence_shape={'documents': {'id': 'Paperless document id.', 'title': 'Document title.', 'summary': 'Redacted document evidence.', 'tags': 'Applied tag names.', 'correspondent': 'Correspondent name.', 'created': 'Document creation date.'}},
                icon='mdi:file-document-multiple',
                color='brown',

                caller_token=caller_token | default('')
              ) | from_json -}}
        - stop: paperless lens manifest complete
          response_variable: _provider_response

    - action: script.zen_dojotools_library
      response_variable: _paperless_stack_result
      continue_on_error: true
      data:
        section: stacks
        mode: "{{ _mode_norm }}"
        input_json: >-
          {%- set raw = input_json | default('', true) -%}
          {%- if raw is mapping -%}{{ raw | tojson }}
          {%- elif raw is string and raw | trim != '' -%}{{ raw | trim }}
          {%- else -%}{{ {} | tojson }}{%- endif -%}
        caller_token: "{{ caller_token | default('') }}"
    - variables:
        _provider_response: >-
          {%- set r = _paperless_stack_result if _paperless_stack_result is mapping else {} -%}
          {%- set out = r | combine({
            'provider': 'paperless_ngx',
            'department': 'stacks',
            'handler': 'zen_stack_paperless'
          }, recursive=true) -%}
          {{ out }}
    - stop: paperless stack provider complete
      response_variable: _provider_response

  zen_sutra_paperless:
    alias: Zen DojoTools Paperless Advanced (Internal)
    description: >
      Internal REST broker for Paperless-NGX Stacks. NOT MCP-exposed.
      Gate 1 supports read-only GET routes plus POST plumbing for future gated
      modes. Call through zen_dojotools_library section=stacks.
    mode: queued
    max: 5
    fields:
      action_type:
        description: get / post / patch / delete
        selector:
          select:
            options:
            - get
            - post
            - patch
            - delete
        default: get
      endpoint:
        description: Paperless API path beginning with /api/
        selector:
          text:
      payload:
        description: JSON payload for POST routes
        selector:
          text:
            multiline: true

    sequence:
    - variables:
        _at: '{{ action_type | default("get") | string | trim | lower }}'
        _ep: '{{ endpoint | default("") | string | trim }}'
        _pl: '{{ payload | default("{}") | string | trim }}'
        _hh: "{{ states('sensor.zen_default_household_cabinet_resolved') }}"

    - action: script.zen_dojotools_filecabinet
      response_variable: _ic_read
      continue_on_error: true
      data:
        action_type: read
        show_hidden_volumes: false
        volume_entity_id:
          - '{{ _hh }}'
        key: integrations_config

    - variables:
        _integrations_config: >-
          {%- set r = _ic_read.get('result', {}) if _ic_read is mapping else {} -%}
          {%- set r = r if r is mapping else (r | from_json if r is string else {}) -%}
          {%- set r = r.get('result', r) if r is mapping else {} -%}
          {%- set v = r.get('integrations_config', {}) -%}
          {%- set v = v.get('value', v) if v is mapping else {} -%}
          {{ v if v is mapping else (v | from_json if v is string else {}) }}
        _cfg: "{{ _integrations_config.get('paperless_ngx', {}) if _integrations_config is mapping else {} }}"
        _base_url: "{{ _cfg.get('url', '') | string | trim if _cfg is mapping else '' }}"
        _api_version: "{{ _cfg.get('api_version', 9) | int(9) if _cfg is mapping else 9 }}"

    - choose:
      - conditions:
        - condition: template
          value_template: '{{ _base_url == "" }}'
        sequence:
        - delay:
            seconds: 2
        - action: script.zen_dojotools_filecabinet
          response_variable: _ic_retry_read
          continue_on_error: true
          data:
            action_type: read
            show_hidden_volumes: false
            volume_entity_id:
              - '{{ _hh }}'
            key: integrations_config
        - variables:
            _integrations_config: >-
              {%- set r = _ic_retry_read.get('result', {}) if _ic_retry_read is mapping else {} -%}
              {%- set r = r if r is mapping else (r | from_json if r is string else {}) -%}
              {%- set r = r.get('result', r) if r is mapping else {} -%}
              {%- set v = r.get('integrations_config', {}) -%}
              {%- set v = v.get('value', v) if v is mapping else {} -%}
              {{ v if v is mapping else (v | from_json if v is string else {}) }}
            _cfg: "{{ _integrations_config.get('paperless_ngx', {}) if _integrations_config is mapping else {} }}"
            _base_url: "{{ _cfg.get('url', '') | string | trim if _cfg is mapping else '' }}"
            _api_version: "{{ _cfg.get('api_version', 9) | int(9) if _cfg is mapping else 9 }}"

    - choose:
      - conditions:
        - condition: template
          value_template: '{{ _base_url == "" }}'
        sequence:
        - variables:
            final_response:
              status: not_configured
              tool: Zen DojoTools Paperless Advanced
              message: Paperless-NGX URL is not configured.
              availability:
                ok: false
                class: not_configured
                human: Paperless-NGX is not set up yet. Run Library stacks_configure with the Paperless URL.
                operator_hint: Configure integrations_config.paperless_ngx.url in the household cabinet.
              config:
                url_configured: false
                api_version: '{{ _api_version }}'
              lens_registry:
                providers:
                  paperless_ngx:
                    provider: paperless_ngx
                    department: stacks
                    enabled: false
                    status: not_configured
                    reason: paperless_ngx_url_missing
                    tool: zen_stack_paperless
                    section: stacks
                    mode: stacks_by_anchor
                    consumes: [label, person, area_id, zone]
                    returns: [document_evidence]
                    timeout_ms: 1200
                    risk_class: read_redacted
                    failure_policy: soft
                    content_policy: redacted_by_default
                    security_act:
                      model: rwxda
                      required: r
                      allowed: [r]
                      denied: [w, x, d, a]
                      note: Lens provider returns redacted read evidence only; CRUD modes are outside the lens bus.
        - stop: paperless not configured
          response_variable: final_response
      - conditions:
        - condition: template
          value_template: '{{ _ep == "" or _ep[:5] != "/api/" }}'
        sequence:
        - variables:
            final_response:
              status: error
              tool: Zen DojoTools Paperless Advanced
              message: endpoint is required and must begin with /api/
              endpoint: '{{ _ep }}'
        - stop: invalid paperless endpoint
          response_variable: final_response

    - choose:
      - conditions:
        - condition: template
          value_template: '{{ _at == "post" }}'
        sequence:
        - action: rest_command.paperless_ngx_rest_post
          response_variable: _raw
          continue_on_error: true
          data:
            base_url: '{{ _base_url }}'
            api_version: '{{ _api_version }}'
            endpoint: '{{ _ep }}'
            payload: '{{ _pl }}'
      - conditions:
        - condition: template
          value_template: '{{ _at == "patch" }}'
        sequence:
        - action: rest_command.paperless_ngx_rest_patch
          response_variable: _raw
          continue_on_error: true
          data:
            base_url: '{{ _base_url }}'
            api_version: '{{ _api_version }}'
            endpoint: '{{ _ep }}'
            payload: '{{ _pl }}'
      - conditions:
        - condition: template
          value_template: '{{ _at == "delete" }}'
        sequence:
        - action: rest_command.paperless_ngx_rest_delete
          response_variable: _raw
          continue_on_error: true
          data:
            base_url: '{{ _base_url }}'
            api_version: '{{ _api_version }}'
            endpoint: '{{ _ep }}'
      default:
        - action: rest_command.paperless_ngx_rest_get
          response_variable: _raw
          continue_on_error: true
          data:
            base_url: '{{ _base_url }}'
            api_version: '{{ _api_version }}'
            endpoint: '{{ _ep }}'

    - variables:
        _raw_ok: '{{ _raw is defined and _raw is mapping }}'
        _http: '{{ _raw["status"] | int(0) if _raw is defined and _raw is mapping else 0 }}'
        _content: >-
          {%- if _raw is defined and _raw is mapping -%}
            {%- set c = _raw["content"] | default(none) -%}
            {%- set cs = c | trim if c is string else '' -%}
            {%- if c is string and cs != "" and cs[:1] in ['{', '['] -%}
              {{ c | from_json | default({}) }}
            {%- elif c is mapping or (c is sequence and c is not string) -%}
              {{ c }}
            {%- else -%}{{ {} }}{%- endif -%}
          {%- else -%}{{ {} }}{%- endif -%}
        _content_class: >-
          {%- set c = _raw["content"] | default(none) if _raw_ok else none -%}
          {%- set cs = c | trim if c is string else '' -%}
          {%- if c is mapping or (c is sequence and c is not string) or (c is string and cs[:1] in ['{', '[']) -%}json
          {%- elif c is string and cs != '' -%}non_json
          {%- else -%}empty{%- endif -%}
        _availability: >-
          {%- set h = _http | int(0) -%}
          {%- if h in [200, 201, 202, 204] and _content_class != 'non_json' -%}
            {{ {'ok': true, 'class': 'available', 'human': 'Paperless-NGX is reachable.', 'operator_hint': 'No action needed.'} }}
          {%- elif h in [200, 201, 202, 204] and _content_class == 'non_json' -%}
            {{ {'ok': false, 'class': 'non_json_response', 'human': 'Paperless-NGX answered, but not with API JSON. This usually means a login page, proxy page, or wrong API path.', 'operator_hint': 'Check the base URL, /api path, reverse proxy auth bypass, and Paperless token header.'} }}
          {%- elif not _raw_ok or h == 0 -%}
            {{ {'ok': false, 'class': 'network_error', 'human': 'Paperless-NGX did not answer. It is probably DNS, routing, TLS, or the service is down.', 'operator_hint': 'Check the configured base URL, DNS name, network route, container/service health, and certificate settings.'} }}
          {%- elif h == 400 -%}
            {{ {'ok': false, 'class': 'bad_request', 'human': 'Paperless-NGX says the request shape is wrong.', 'operator_hint': 'Check endpoint syntax, query parameters, and object IDs.'} }}
          {%- elif h == 401 -%}
            {{ {'ok': false, 'class': 'auth_failed', 'human': 'Paperless-NGX rejected the token. The token may be expired, revoked, or malformed.', 'operator_hint': 'Check paperless_ngx_token in secrets.yaml and confirm it includes the Token prefix expected by this install.'} }}
          {%- elif h == 403 -%}
            {{ {'ok': false, 'class': 'forbidden', 'human': 'Paperless-NGX says the caller is not allowed through that door.', 'operator_hint': 'Confirm the token belongs to a Paperless user with permission for this endpoint/object.'} }}
          {%- elif h == 404 -%}
            {{ {'ok': false, 'class': 'not_found', 'human': 'Paperless-NGX answered, but that endpoint or object is not here.', 'operator_hint': 'Check the base URL, reverse proxy path, endpoint path, document/tag ID, and DNS alias.'} }}
          {%- elif h >= 500 -%}
            {{ {'ok': false, 'class': 'server_error', 'human': 'Paperless-NGX is borked server-side right now. Try again later after checking service logs.', 'operator_hint': 'Check Paperless worker/webserver logs and database/Redis health.'} }}
          {%- else -%}
            {{ {'ok': false, 'class': 'unknown_error', 'human': 'Paperless-NGX returned an unexpected HTTP status.', 'operator_hint': 'Check http_status, endpoint, token, and service logs.'} }}
          {%- endif -%}

    - variables:
        final_response:
          status: "{{ 'success' if _availability is mapping and _availability.get('ok', false) else 'error' }}"
          tool: Zen DojoTools Paperless Advanced
          http_status: '{{ _http }}'
          availability: '{{ _availability }}'
          source:
            system: paperless_ngx
            api_version: '{{ _api_version }}'
          result:
            content: '{{ _content }}'
          trace:
            endpoint: '{{ _ep }}'
            method: '{{ _at | upper }}'

    - stop: paperless advanced return
      response_variable: final_response
