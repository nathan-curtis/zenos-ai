###############################################################################
# ZenOS-AI Plugin: Zammad — Fulfillment (Service Desk / Help Tickets)
# Codename: Radar
# Version: 0.4.0
#
# MCP-facing:
#   zen_dojotools_servicedesk  ← expose this to MCP
#
# Internal adapter:
#   zen_sutra_zammad  ← internal REST broker (NOT MCP-exposed)
#
# CONFIG:
#   household cabinet: integrations_config.fulfillment.url
#   Run case=configure to bootstrap.
#
# SECRETS:
#   zammad_token: "Token token=YOUR_ZAMMAD_API_TOKEN"
#   (full Authorization header value including prefix)
###############################################################################

rest_command:
  zammad_rest_get:
    url: >
      {{ base_url | default('', true) | string | trim | regex_replace('/$','') }}/api/v1/{{ endpoint | default('') }}
    method: GET
    headers:
      Authorization: !secret zammad_token
      Accept: application/json
    verify_ssl: false
    timeout: 45

  zammad_rest_post:
    url: >
      {{ base_url | default('', true) | string | trim | regex_replace('/$','') }}/api/v1/{{ endpoint | default('') }}
    method: POST
    headers:
      Authorization: !secret zammad_token
      Content-Type: application/json
      Accept: application/json
    payload: '{{ payload }}'
    verify_ssl: false
    timeout: 45

  zammad_rest_put:
    url: >
      {{ base_url | default('', true) | string | trim | regex_replace('/$','') }}/api/v1/{{ endpoint | default('') }}
    method: PUT
    headers:
      Authorization: !secret zammad_token
      Content-Type: application/json
      Accept: application/json
    payload: '{{ payload }}'
    verify_ssl: false
    timeout: 45

  zammad_rest_delete:
    url: >
      {{ base_url | default('', true) | string | trim | regex_replace('/$','') }}/api/v1/{{ endpoint | default('') }}
    method: DELETE
    headers:
      Authorization: !secret zammad_token
      Content-Type: application/json
      Accept: application/json
    payload: '{{ payload }}'
    verify_ssl: false
    timeout: 45

script:
  zen_dojotools_servicedesk:
    alias: Zen DojoTools Service Desk
    description: >
      Radar — ZenOS service desk backed by Zammad. Create, update, assign, search, tag, and close
      help tickets. Supports customer resolution via household roster or reporter shorthand
      (house/zenos). Manage queues, orgs, triage metadata, typed anchors, and ticket links.
      Run radar_setup to initialize identity infrastructure. Use mode=help for full case reference.
    mode: parallel
    icon: mdi:ticket-outline
    fields:
      mode:
        name: Mode
        description: Operation to perform. Use help to list all cases.
        selector:
          select:
            options:
            - help
            - configure
            - ticket_create
            - ticket_get
            - ticket_find
            - ticket_list
            - ticket_search
            - ticket_update
            - ticket_close
            - ticket_complete
            - article_add
            - articles_list
            - ticket_tag
            - triage_set
            - triage_get
            - customer_find
            - customer_create
            - org_find
            - org_create
            - queue_get
            - view_get
            - workflow_context_get
            - tickets_by_anchor
            - ticket_link
            - ticket_unlink
            - tool_manifest
            - batch_update
            - object_attribute_create
            - radar_setup
            - ticket_assign
        default: help
      input_json:
        name: Input JSON
        description: Structured JSON payload for case inputs.
        selector:
          text:
            multiline: true
      caller_token:
        name: Caller Token
        description: Opaque token passed through for correlation.
        selector:
          text:

    sequence:
    - variables:
        caller_token_norm: "{{ caller_token | default('') }}"
        case_norm: "{{ mode | default('help', true) | string | trim | lower }}"
        _hh: "{{ states('sensor.zen_default_household_cabinet_resolved') }}"
        input_data: >-
          {%- set raw = input_json | default('', true) -%}
          {%- if raw is mapping -%}{{ raw }}
          {%- elif raw is string and raw | trim != '' -%}{{ raw | from_json | default({}) }}
          {%- else -%}{{ {} }}{%- endif -%}
        cases_help:
          help:
            intent: Return all available cases and their input fields.
          _ticket_id_note: 'ticket_id accepts either the display number (e.g. 10073) or the raw Zammad DB id (e.g. 73) — both resolve correctly.'
          configure:
            intent: Write Zammad URL to household cabinet and test-connect.
            needs: [input_json.url]
            optional: [input_json.action (inspect to read current config without writing), input_json.timeout_seconds (Zammad HTTP timeout, clamped 10-90)]
          ticket_create:
            intent: Create a new Zammad ticket.
            needs: [input_json.title, input_json.body]
            optional: [input_json.group (default Users), input_json.customer (email — explicit), input_json.person_entity_id (HA person entity e.g. person.member_name — resolves customer email from household roster; overridden by customer if both given), input_json.reporter (shorthand: house=household persona, zenos=dev persona — bypasses group lookup; ignored if customer set), input_json.priority (default "2 normal"), input_json.state (default new), input_json.product_name (Grocy product name — inventory notified on success), input_json.timeout_seconds (Zammad HTTP timeout, clamped 10-90)]
          ticket_get:
            intent: Fetch a ticket by ID including all articles.
            needs: [input_json.ticket_id (display number 10xxx or raw id)]
          ticket_find:
            intent: Search tickets by query string.
            needs: [input_json.query]
            optional: [input_json.limit (default 10), input_json.page (default 1)]
          ticket_list:
            intent: List tickets. Optional state_filter (open/closed/all, default open).
            optional: [input_json.state_filter, input_json.limit (default 25), input_json.page (default 1)]
          ticket_search:
            intent: Search tickets for Radar worklists using Zammad tickets/search.
            optional: [input_json.query, input_json.queue, input_json.states (list/string), input_json.owner, input_json.tags (list/string), input_json.priority, input_json.sort_by (default updated_at), input_json.order_by (default desc), input_json.expand (default true), input_json.with_total_count (default true), input_json.per_page (default 25), input_json.page (default 1), input_json.timeout_seconds]
          ticket_update:
            intent: Update a ticket. Supports group/queue move, org/customer reassignment, and field updates.
            needs: [input_json.ticket_id (display number 10xxx or raw id)]
            optional: [input_json.title, input_json.state, input_json.priority, input_json.owner_id, input_json.group (queue full name string — e.g. 'Users::Default Household::Physical Plant'), input_json.organization_id (int), input_json.customer_id (int), input_json.pending_time (ISO8601 datetime — required when state is pending close or pending reminder)]
          batch_update:
            intent: Apply the same field updates to multiple tickets in one call. Iterates ticket_ids, calls ticket_update for each, returns per-ticket results.
            needs: [input_json.ticket_ids (list of int), at least one update field]
            optional: [input_json.title, input_json.state, input_json.priority, input_json.organization_id (int), input_json.group (queue full name string), input_json.owner_id (int), input_json.pending_time (ISO8601 datetime — required when state is pending close or pending reminder)]
          object_attribute_create:
            intent: Create a custom field (object manager attribute) on a Zammad object, then execute migrations to apply it. Admin token required.
            needs: [input_json.name (snake_case field key — Zammad reserves _id and _ids suffixes, avoid them), input_json.display (human label), input_json.data_type (boolean|input|select|integer|datetime|date)]
            optional: [input_json.object_type (Ticket|Organization|Group|User — default Ticket), input_json.default (default value), input_json.position (int, default 1600)]
          radar_setup:
            intent: Initialize or configure Radar identity infrastructure (default personas, cabinet defaults).
            needs: [input_json.action (init|map_queue|set_org_default|inspect_queue)]
            optional: [input_json.house_email (init only), input_json.dev_email (init only), input_json.group_id (int — map_queue/inspect_queue), input_json.org_id (int — set_org_default), input_json.customer_id (int — map_queue/set_org_default)]
            returns: "action=init: {house_customer_id, house_status, dev_customer_id, dev_status, cabinet_written}. action=map_queue: {group_id, group_name, customer_id}. action=set_org_default: {org_id, org_name, customer_id}. action=inspect_queue: {group_id, group_name, zen_default_customer, wired}"
            note: Idempotent. init finds-or-creates personas + writes radar_defaults to household cabinet. map_queue sets zen_default_customer on a Group. set_org_default sets zen_default_customer on an Org. inspect_queue reads the full wiring chain for a group.
          ticket_assign:
            intent: Assign a ticket to a specific agent/owner by name, email, or HA person entity.
            needs: [input_json.ticket_id (display number 10xxx or raw id), input_json.owner (name or email string or person.* entity_id)]
            returns: "{status, ticket_id, owner_id, owner_name, owner_email}"
          ticket_close:
            intent: Close a ticket (sets state to closed).
            needs: [input_json.ticket_id (display number 10xxx or raw id)]
          ticket_complete:
            intent: Add a completion receipt, optionally tag/anchor, and close a ticket in one call.
            needs: [input_json.ticket_id (display number 10xxx or raw id), input_json.body]
            optional: [input_json.subject (default Completed), input_json.tags (string or list), input_json.anchors (string/list, applied as tags), input_json.internal (default true)]
          article_add:
            intent: Add a note or reply article to a ticket.
            needs: [input_json.ticket_id (display number 10xxx or raw id), input_json.body]
            optional: [input_json.subject (default Note), input_json.type (note/email, default note), input_json.internal (default true)]
          articles_list:
            intent: List all articles for a ticket.
            needs: [input_json.ticket_id (display number 10xxx or raw id)]
          ticket_tag:
            intent: Add a tag to a ticket.
            needs: [input_json.ticket_id (display number 10xxx or raw id), input_json.tag]
          triage_set:
            intent: Record structured Radar/dev-pipe triage metadata on a ticket.
            needs: [input_json.ticket_id (display number 10xxx or raw id), input_json.rank]
            optional: [input_json.lane, input_json.sequence, input_json.blocked_by, input_json.after, input_json.rationale, input_json.triaged_by, input_json.accepted_by, input_json.milestone, input_json.release_train, input_json.timeout_seconds]
            note: MVP stores a normalized internal triage receipt plus deterministic radar_* tags. Future Zammad object attributes can replace the storage backend without changing the Service Desk contract.
          triage_get:
            intent: Read structured Radar/dev-pipe triage metadata from ticket tags and receipt notes.
            needs: [input_json.ticket_id (display number 10xxx or raw id)]
          customer_find:
            intent: Find a Zammad user/customer by name or email.
            needs: [input_json.query]
          customer_create:
            intent: Register a new Zammad customer. Run before ticket_create when the reporter is not yet in Zammad.
            needs: [input_json.email]
            optional: [input_json.first_name, input_json.last_name, input_json.phone]
          org_find:
            intent: Find a Zammad organization by name.
            needs: [input_json.query]
          org_create:
            intent: Create a new Zammad organization.
            needs: [input_json.name]
            optional: [input_json.note]
          queue_get:
            intent: List Zammad queue entities. Default source=groups; source=overviews returns saved view definitions when token allows.
            optional: [input_json.source (groups/overviews, default groups), input_json.active_only (default true), input_json.include_counts (default false), input_json.timeout_seconds (Zammad HTTP timeout, clamped 10-90)]
          view_get:
            intent: Return built-in Radar views, or run one synthetic view through ticket search.
            optional: [input_json.view_id (catalog/new_unassigned/open_unassigned/my_open/pending_reminder/escalating/recent_customer_reply), input_json.queue (default Users), input_json.agent_email (required for my_open), input_json.per_page (default 25), input_json.page (default 1), input_json.timeout_seconds]
          workflow_context_get:
            intent: Return read-only Radar workflow metadata and permission diagnostics.
            optional: [input_json.include_tags (default false), input_json.timeout_seconds]
            note: Groups are queue entities; views are synthetic Radar worklists or Zammad overviews for diagnostics; workflows/triggers/schedulers/macros are agent affordances and automation context, not queue sources.
          tickets_by_anchor:
            intent: Find tickets tagged with an HA slug - label, area, person, or zone.
            needs: [input_json.anchor_ids (string or JSON list of HA slugs)]
            optional: [input_json.anchor_type (label/person/area_id/zone/company/family/household), input_json.limit (default 25)]
            note: Tag Zammad tickets with HA entity slugs to link them to HA context.
          ticket_link:
            intent: Create a formal parent/child or related link between two Zammad tickets.
            needs: [input_json.ticket_id (source ticket — display number 10xxx or raw id), input_json.target_id (target ticket — display number 10xxx or raw id)]
            optional: [input_json.link_type (normal/parent/child, default normal)]
            note: "link_type=parent makes ticket_id the parent of target_id. link_type=child is the inverse. link_type=normal is a peer relationship."
          ticket_unlink:
            intent: Remove an existing link between two Zammad tickets.
            needs: [input_json.ticket_id (source ticket — display number 10xxx or raw id), input_json.target_id (target ticket — display number 10xxx or raw id)]
            optional: [input_json.link_type (normal/parent/child, default normal)]
          tool_manifest:
            intent: Return Lens Spec provider manifest for Service Desk operational ticket evidence.
            consumes: [label, person, area_id, zone, company, family, household]
            returns: [ticket_evidence, work_receipt_evidence, actor_pipeline_evidence]

    - action: script.zen_dojotools_filecabinet
      response_variable: _ic_fc_raw
      continue_on_error: true
      data:
        action_type: get
        volume_entity_id: "{{ _hh }}"
        path: integrations_config
    - variables:
        _base_url: >-
          {%- set _ic = _ic_fc_raw.get('value', {}) if _ic_fc_raw is mapping and _ic_fc_raw.get('status') == 'success' else {} -%}
          {%- set _ic = _ic if _ic is mapping else {} -%}
          {{ _ic.get('fulfillment', {}).get('url', '') | string | trim }}
        _hh_vars: "{{ state_attr(_hh, 'variables') | default({}, true) if state_attr(_hh, 'variables') is mapping else {} }}"
        _audit_input: "{{ input_data.get('actor_context', {}) if input_data is mapping and input_data.get('actor_context', {}) is mapping else {} }}"
        _audit_actor_hint: >-
          {%- set explicit = _audit_input.get('actor', input_data.get('actor', '')) if input_data is mapping else '' -%}
          {%- set tok = caller_token_norm | string | lower -%}
          {%- if explicit | string | trim != '' -%}{{ explicit | string | trim }}
          {%- elif 'maeve' in tok -%}Maeve
          {%- elif 'nyx' in tok -%}Nyx
          {%- elif 'cayt' in tok -%}Cayt
          {%- elif 'friday' in tok -%}Friday
          {%- else -%}unknown{%- endif -%}
        _audit_service_account: "{{ _audit_input.get('service_account', input_data.get('service_account', 'Friday')) if input_data is mapping else 'Friday' }}"
        _audit_delegation_mode: >-
          {%- set explicit = _audit_input.get('delegation_mode', input_data.get('delegation_mode', '')) if input_data is mapping else '' -%}
          {%- if explicit | string | trim != '' -%}{{ explicit | string | trim }}
          {%- elif (_audit_actor_hint | string | lower) in ['', 'unknown', (_audit_service_account | string | lower)] -%}direct
          {%- else -%}delegated{%- endif -%}
        _audit_approved_by: "{{ _audit_input.get('approved_by', input_data.get('approved_by', '')) if input_data is mapping else '' }}"
        _audit_approval_basis: "{{ _audit_input.get('approval_basis', input_data.get('approval_basis', '')) if input_data is mapping else '' }}"
        _audit_context:
          schema_version: "1.0.0"
          actor: "{{ _audit_actor_hint }}"
          service_account: "{{ _audit_service_account }}"
          delegation_mode: "{{ _audit_delegation_mode }}"
          approved_by: "{{ _audit_approved_by if _audit_approved_by != '' else none }}"
          approval_basis: "{{ _audit_approval_basis if _audit_approval_basis != '' else none }}"
          caller_token: "{{ caller_token_norm }}"
        _audit_has_context: >-
          {{ (_audit_actor_hint | string | lower) not in ['', 'unknown'] or
             (_audit_approved_by | string | trim) != '' or
             (_audit_approval_basis | string | trim) != '' or
             (input_data is mapping and ('actor_context' in input_data or 'actor' in input_data or 'service_account' in input_data or 'delegation_mode' in input_data or 'approved_by' in input_data)) }}
        _request_timeout: >-
          {%- set raw = input_data.get('timeout_seconds', input_data.get('timeout', 45)) if input_data is mapping else 45 -%}
          {%- set sec = raw | int(45) -%}
          {{ [10, [sec, 90] | min] | max }}

    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "help" }}'
        sequence:
        - variables:
            result:
              status: info
              tool: Zen DojoTools Fulfillment
              codename: Radar
              version: "0.4.0"
              configured_url: "{{ _base_url }}"
              cases: "{{ cases_help }}"
              caller_token: "{{ caller_token_norm }}"
        - stop: fulfillment help
          response_variable: result

      - conditions:
        - condition: template
          value_template: '{{ case_norm == "tool_manifest" }}'
        sequence:
        - variables:
            result: >-
              {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
              {%- set _health = {'configured': _base_url != '', 'status': 'ok' if _base_url != '' else 'warn', 'notes': [] if _base_url != '' else ['Zammad URL not configured — run mode=configure']} -%}
              {{- MF.tool_manifest(
                tool='zen_dojotools_servicedesk',
                display_name='Service Desk / Zammad',
                tier='dojotools',
                version='0.3.1',
                health=_health,
                required_labels=['zammad'],
                optional_labels=['zammad', 'service_desk', 'tickets', 'fulfillment'],
                consumes=['label', 'person', 'area_id', 'zone', 'company', 'family', 'household'],
                returns=['ticket_evidence', 'work_receipt_evidence', 'actor_pipeline_evidence'],
                failure_policy='soft',
                content_policy='redacted_by_default',
                risk_class='read_redacted',
                security_act={'model': 'rwxda', 'required': 'r', 'allowed': ['r'], 'denied': ['w', 'x', 'd', 'a'], 'note': 'Lens provider returns redacted ticket/work evidence only; ticket mutation stays on explicit Service Desk cases.'},
                modes={'lookup': 'tickets_by_anchor', 'manifest': 'tool_manifest'},
                limitations=['Lookup requires Zammad tickets tagged with stable HA or ZenOS anchor slugs.', 'Lens output is redacted and does not include raw article bodies.', 'Mutating ticket cases are outside the lens bus.'],
                evidence_shape={'documents': {'id': 'Zammad ticket id.', 'title': 'Redacted ticket title.', 'summary': 'Operational ticket evidence.', 'stack': 'provider/source/evidence metadata.', 'anchor_contexts': 'Matched typed anchors.', 'servicedesk': 'Ticket metadata safe for enrichment.'}},
                icon='mdi:ticket-outline',
                color='indigo',

                caller_token=caller_token_norm
              ) | from_json -}}
        - stop: servicedesk lens manifest complete
          response_variable: result

    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "configure" }}'
        sequence:
        - variables:
            _cfg_action: "{{ input_data.get('action', 'write') | string | trim | lower if input_data is mapping else 'write' }}"
            _cfg_url: "{{ input_data.get('url', '') | string | trim if input_data is mapping else '' }}"
            _cfg_register_lens: "{{ input_data.get('register_lens', true) if input_data is mapping else true }}"
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _cfg_action == "inspect" }}'
            sequence:
            - variables:
                _cfg_current: "{{ ((state_attr(_hh, 'variables') | default({}, true)).get('integrations_config', {}).get('value', {}) or {}).get('fulfillment', {}) }}"
            - variables:
                result:
                  status: ok
                  tool: Zen DojoTools Fulfillment
                  case: configure
                  config:
                    url: "{{ _cfg_current.get('url', '') if _cfg_current is mapping else '' }}"
                    status: "{{ _cfg_current.get('status', 'unknown') if _cfg_current is mapping else 'unknown' }}"
                    tested_at: "{{ _cfg_current.get('tested_at', none) if _cfg_current is mapping else none }}"
                  caller_token: "{{ caller_token_norm }}"
            - stop: configure inspect
              response_variable: result
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _cfg_url == "" }}'
            sequence:
            - variables:
                result:
                  status: error
                  tool: Zen DojoTools Fulfillment
                  case: configure
                  message: 'Missing required field: url. Pass input_json={"url": "http://your-zammad-host/"}'
                  caller_token: "{{ caller_token_norm }}"
            - stop: configure missing url
              response_variable: result
        - action: script.zen_sutra_zammad
          response_variable: _test_raw
          continue_on_error: true
          data:
            action_type: get
            base_url: "{{ _cfg_url }}"
            request_timeout: "{{ _request_timeout }}"
            endpoint: "users/me"
        - variables:
            _test_ok: "{{ _test_raw is mapping and _test_raw.get('status') == 'success' }}"
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ not _test_ok }}'
            sequence:
            - variables:
                result:
                  status: error
                  tool: Zen DojoTools Fulfillment
                  case: configure
                  message: "Cannot connect to Zammad at {{ _cfg_url }}. Check URL and zammad_token secret. Try https://zammad.<yourlocaldomain> first, then fallback to direct host:port."
                  http_status: "{{ _test_raw.get('http_status', 0) if _test_raw is mapping else 0 }}"
                  error_class: "{{ _test_raw.get('error_class', 'connection_throw') if _test_raw is mapping else 'connection_throw' }}"
                  caller_token: "{{ caller_token_norm }}"
            - stop: configure connect failed
              response_variable: result
        - variables:
            _ic_existing: >-
              {%- set slot = _hh_vars.get('integrations_config', {}) if _hh_vars is mapping else {} -%}
              {%- set slot_m = slot | from_json if slot is string else (slot if slot is mapping else {}) -%}
              {{ slot_m.get('value', slot_m) if slot_m is mapping else {} }}
            _ic_drawer_exists: "{{ _hh_vars is mapping and 'integrations_config' in _hh_vars }}"
            _fulfillment_cfg:
              url: "{{ _cfg_url }}"
              status: ok
              tested_at: "{{ now().isoformat() }}"
        - action: script.zen_dojotools_filecabinet
          response_variable: _ic_write
          continue_on_error: true
          data:
            action_type: "{{ 'update' if _ic_drawer_exists else 'create' }}"
            force_action: true
            set_timestamp: true
            volume_entity_id:
              - "{{ _hh }}"
            key: integrations_config
            value: "{{ _ic_existing | combine({'fulfillment': _fulfillment_cfg}, recursive=true) | tojson }}"
        - variables:
            _lens_payload:
              provider: servicedesk
              display_name: Service Desk / Zammad
              configured_by: servicedesk
              department: operations
              section: operations
              enabled: true
              status: available
              tool: zen_dojotools_servicedesk
              mode: tickets_by_anchor
              lookup_mode: tickets_by_anchor
              manifest_mode: tool_manifest
              consumes: [label, person, area_id, zone, company, family, household]
              returns: [ticket_evidence, work_receipt_evidence, actor_pipeline_evidence]
              failure_policy: soft
              content_policy: redacted_by_default
              risk_class: read_redacted
              security_act:
                model: rwxda
                required: r
                allowed: [r]
                denied: [w, x, d, a]
                note: Lens provider returns redacted ticket/work evidence only; ticket mutation stays on explicit Service Desk cases.
              timeout_ms: 1200
              more_info:
                tool: zen_dojotools_servicedesk
                mode: tool_manifest
              manifest_schema_version: "1.0.0"
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _cfg_register_lens | bool }}"
            sequence:
            - action: script.zen_admintools_prompt_loader
              response_variable: _lens_register
              continue_on_error: true
              data:
                mode: lens_registry
                action_type: register
                item: servicedesk
                payload_json: "{{ _lens_payload | tojson }}"
                caller_token: "{{ caller_token_norm if caller_token_norm != '' else 'servicedesk_configure_lens_register' }}"
          default:
          - variables:
              _lens_register:
                status: success
                action_type: register
                provider: servicedesk
                skipped: true
                reason: lens_registration_disabled_by_input
                schema_valid: true
        - variables:
            _lens_register_ok: "{{ _lens_register is mapping and _lens_register.get('status') == 'success' }}"
            _lens_write_status: "{{ _lens_register.get('write_result', {}).get('status', '') if _lens_register is mapping and _lens_register.get('write_result', {}) is mapping else '' }}"
            _lens_retry_hint: >-
              {%- if _lens_register_ok | bool -%}
                {{ none }}
              {%- elif _lens_write_status == '' -%}
                Registry writer did not return a verified FileCabinet write. Retry configure after the system is quiet; if repeated, inspect zen_admintools_prompt_loader mode=lens_registry and FileCabinet health.
              {%- else -%}
                Registry writer returned {{ _lens_write_status }}. Retry configure; if repeated, inspect lens_registry drawer and FileCabinet write_result.
              {%- endif -%}
            result:
              status: "{{ 'ok' if _lens_register_ok else 'warning' }}"
              tool: Zen DojoTools Fulfillment
              case: configure
              zammad_connected: true
              url_stored: true
              lens_registered: "{{ _lens_register_ok }}"
              lens_register_skipped: "{{ _lens_register.get('skipped', false) if _lens_register is mapping else false }}"
              lens_registry_write: "{{ _lens_register }}"
              lens_registry_retry_hint: "{{ _lens_retry_hint }}"
              optimization:
                skipped_integrations_config_read: true
                note: "Removed one redundant integrations_config FileCabinet read; lens registry write still uses the central verified writer."
              url: "{{ _cfg_url }}"
              caller_token: "{{ caller_token_norm }}"
        - stop: configure write done
          response_variable: result

    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm in ["ticket_create","ticket_get","ticket_find","ticket_list","ticket_search","ticket_update","ticket_close","ticket_complete","article_add","articles_list","ticket_tag","ticket_link","ticket_unlink","triage_set","triage_get","customer_find","customer_create","org_find","org_create","queue_get","view_get","workflow_context_get","tickets_by_anchor"] }}'
        sequence:
        - variables:
            _ticket_id: >-
              {%- set _raw = (input_data.get('ticket_id', '') | string | trim if input_data is mapping else '') -%}
              {%- set _n = _raw | int(0) -%}
              {%- if _n >= 10001 -%}{{ _n - 10000 }}{%- else -%}{{ _raw }}{%- endif -%}
            _query: "{{ input_data.get('query', '') | string | trim if input_data is mapping else '' }}"
            _target_id_raw: "{{ input_data.get('target_id', '') | string | trim if input_data is mapping else '' }}"
        - variables:
            _target_id: >-
              {%- set _n = _target_id_raw | int(0) -%}
              {%- if _n >= 10001 -%}{{ _n - 10000 }}{%- else -%}{{ _target_id_raw }}{%- endif -%}
        - variables:
            _missing: >-
              {%- if case_norm in ['ticket_get','ticket_update','ticket_close','ticket_complete','article_add','articles_list','ticket_tag','ticket_link','ticket_unlink','triage_set','triage_get'] and _ticket_id == '' -%}ticket_id
              {%- elif case_norm in ['ticket_find','customer_find','org_find'] and _query == '' -%}query
              {%- elif case_norm == 'ticket_create' and (input_data.get('title','') | string | trim) == '' -%}title
              {%- elif case_norm == 'ticket_create' and (input_data.get('body','') | string | trim) == '' -%}body
              {%- elif case_norm == 'ticket_complete' and (input_data.get('body','') | string | trim) == '' -%}body
              {%- elif case_norm == 'article_add' and (input_data.get('body','') | string | trim) == '' -%}body
              {%- elif case_norm == 'ticket_tag' and (input_data.get('tag','') | string | trim) == '' -%}tag
              {%- elif case_norm == 'triage_set' and (input_data.get('rank','') | string | trim) == '' -%}rank
              {%- elif case_norm == 'customer_create' and (input_data.get('email','') | string | trim) == '' -%}email
              {%- elif case_norm == 'org_create' and (input_data.get('name','') | string | trim) == '' -%}name
              {%- elif case_norm in ['ticket_link','ticket_unlink'] and _target_id == '' -%}target_id
              {%- elif case_norm == 'tickets_by_anchor' and not (input_data is mapping and input_data.get('anchor_ids') is not none and (input_data.get('anchor_ids') | string | trim) not in ('', '[]', 'None')) -%}anchor_ids
              {%- else -%}{%- endif -%}
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _missing | trim != "" }}'
            sequence:
            - variables:
                result:
                  status: error
                  tool: Zen DojoTools Fulfillment
                  case: "{{ case_norm }}"
                  message: "Missing required field: {{ _missing | trim }}"
                  caller_token: "{{ caller_token_norm }}"
            - stop: fulfillment missing input
              response_variable: result

        - choose:
          - conditions:
            - condition: template
              value_template: '{{ case_norm == "ticket_list" }}'
            sequence:
            - variables:
                _state_filter: "{{ input_data.get('state_filter', 'open') | string | trim | lower if input_data is mapping else 'open' }}"
                _limit: "{{ input_data.get('limit', 25) | int(25) if input_data is mapping else 25 }}"
                _page: "{{ input_data.get('page', 1) | int(1) if input_data is mapping else 1 }}"
            - variables:
                _list_endpoint: >-
                  {%- if _state_filter == 'all' -%}
                    tickets?page={{ _page }}&per_page={{ _limit }}
                  {%- elif _state_filter == 'closed' -%}
                    tickets/search?query=state.name%3Aclosed&page={{ _page }}&per_page={{ _limit }}
                  {%- else -%}
                    tickets/search?query=state.name%3Anew+OR+state.name%3Aopen&page={{ _page }}&per_page={{ _limit }}
                  {%- endif -%}
            - action: script.zen_sutra_zammad
              response_variable: _list_raw
              continue_on_error: true
              data:
                action_type: get
                base_url: "{{ _base_url }}"
                request_timeout: "{{ _request_timeout }}"
                endpoint: "{{ _list_endpoint }}"
            - variables:
                _list_content: "{{ _list_raw.get('result', {}).get('content', {}) if _list_raw is mapping else {} }}"
            - variables:
                _list_http_status: "{{ _list_raw.get('http_status', 0) if _list_raw is mapping else 0 }}"
                _list_sequence_tickets: "{{ _list_content if _list_content is sequence and _list_content is not string and _list_content is not mapping else [] }}"
                _list_mapping_ticket_ids: "{{ _list_content.get('tickets', []) if _list_content is mapping else [] }}"
                _list_assets: "{{ _list_content.get('assets', {}).get('Ticket', {}) if _list_content is mapping else {} }}"
                _list_tickets: "{{ _list_assets.values() | list if _list_assets is mapping and _list_assets | length > 0 else _list_sequence_tickets }}"
                _list_ticket_ids: >-
                  {%- if _list_content is mapping -%}
                    {{ _list_mapping_ticket_ids }}
                  {%- else -%}
                    {%- set ns = namespace(ids=[]) -%}
                    {%- for t in _list_sequence_tickets if t is mapping -%}
                      {%- set ns.ids = ns.ids + [t.get('id', none)] -%}
                    {%- endfor -%}
                    {{ ns.ids | reject('equalto', none) | list }}
                  {%- endif -%}
                _list_count: "{{ _list_content.get('tickets_count', _list_mapping_ticket_ids | length) if _list_content is mapping else _list_sequence_tickets | length }}"
                _list_diagnostic: >-
                  {%- if _list_http_status | int(0) >= 200 and _list_http_status | int(0) < 300 -%}
                    {{ none }}
                  {%- elif _list_http_status | int(0) == 401 -%}
                    Zammad rejected ticket_list as unauthorized. Check token expiry and credentials.
                  {%- elif _list_http_status | int(0) == 403 -%}
                    Zammad rejected ticket_list for this token. Check ticket.agent and group visibility.
                  {%- elif _list_http_status | int(0) == 404 -%}
                    Zammad ticket list endpoint was not found at the configured base URL. Check DNS/base URL and reverse proxy path.
                  {%- else -%}
                    ticket_list failed before a usable Zammad response was available.
                  {%- endif -%}
                result:
                  status: "{{ _list_raw.get('status', 'error') if _list_raw is mapping else 'error' }}"
                  ok: "{{ _list_http_status | int(0) >= 200 and _list_http_status | int(0) < 300 }}"
                  tool: Zen DojoTools Fulfillment
                  case: ticket_list
                  source: "{{ 'tickets' if _state_filter == 'all' else 'tickets_search' }}"
                  state_filter: "{{ _state_filter }}"
                  queues: []
                  ticket_ids: "{{ _list_ticket_ids }}"
                  tickets: "{{ _list_tickets }}"
                  views: []
                  overviews: []
                  metadata:
                    page: "{{ _page }}"
                    per_page: "{{ _limit }}"
                    response_shape: "{{ 'mapping_assets' if _list_content is mapping else 'ticket_sequence' }}"
                  count: "{{ _list_count }}"
                  total_count: "{{ _list_count }}"
                  diagnostic: "{{ _list_diagnostic }}"
                  error_detail: "{{ _list_content if _list_http_status | int(0) >= 400 else none }}"
                  trace:
                    endpoint: "{{ _list_endpoint }}"
                    http_status: "{{ _list_http_status }}"
                    caller_token: "{{ caller_token_norm }}"
            - stop: ticket_list done
              response_variable: result

        - choose:
          - conditions:
            - condition: template
              value_template: '{{ case_norm == "ticket_find" }}'
            sequence:
            - variables:
                _find_limit: "{{ input_data.get('limit', 10) | int(10) if input_data is mapping else 10 }}"
                _find_page: "{{ input_data.get('page', 1) | int(1) if input_data is mapping else 1 }}"
            - action: script.zen_sutra_zammad
              response_variable: _find_raw
              continue_on_error: true
              data:
                action_type: get
                base_url: "{{ _base_url }}"
                request_timeout: "{{ _request_timeout }}"
                endpoint: "tickets/search?query={{ (_query | urlencode) | replace('%20', '+') }}&page={{ _find_page }}&per_page={{ _find_limit }}"
            - variables:
                _find_content: "{{ _find_raw.get('result', {}).get('content', {}) if _find_raw is mapping else {} }}"
                _find_sequence_tickets: "{{ _find_content if _find_content is sequence and _find_content is not string and _find_content is not mapping else [] }}"
                _find_assets: "{{ _find_content.get('assets', {}).get('Ticket', {}) if _find_content is mapping else {} }}"
                _find_tickets: "{{ _find_assets.values() | list if _find_assets is mapping and _find_assets | length > 0 else _find_sequence_tickets }}"
                _find_ticket_ids: >-
                  {%- if _find_content is mapping -%}
                    {{ _find_content.get('tickets', []) }}
                  {%- else -%}
                    {%- set ns = namespace(ids=[]) -%}
                    {%- for t in _find_sequence_tickets if t is mapping -%}
                      {%- set ns.ids = ns.ids + [t.get('id', none)] -%}
                    {%- endfor -%}
                    {{ ns.ids | reject('equalto', none) | list }}
                  {%- endif -%}
                result:
                  status: "{{ _find_raw.get('status', 'error') if _find_raw is mapping else 'error' }}"
                  tool: Zen DojoTools Fulfillment
                  case: ticket_find
                  query: "{{ _query }}"
                  ticket_ids: "{{ _find_ticket_ids }}"
                  tickets: "{{ _find_tickets }}"
                  count: "{{ _find_content.get('tickets_count', _find_ticket_ids | length) if _find_content is mapping else _find_sequence_tickets | length }}"
                  assets: "{{ _find_content.get('assets', {}) if _find_content is mapping else {} }}"
                  trace:
                    http_status: "{{ _find_raw.get('http_status', 0) if _find_raw is mapping else 0 }}"
                    caller_token: "{{ caller_token_norm }}"
            - stop: ticket_find done
              response_variable: result

        - choose:
          - conditions:
            - condition: template
              value_template: '{{ case_norm == "ticket_search" }}'
            sequence:
            - variables:
                _ts_query_raw: "{{ input_data.get('query', '') | string | trim if input_data is mapping else '' }}"
                _ts_queue: "{{ input_data.get('queue', '') | string | trim if input_data is mapping else '' }}"
                _ts_owner: "{{ input_data.get('owner', '') | string | trim if input_data is mapping else '' }}"
                _ts_priority: "{{ input_data.get('priority', '') | string | trim if input_data is mapping else '' }}"
                _ts_page: "{{ input_data.get('page', 1) | int(1) if input_data is mapping else 1 }}"
                _ts_per_page: "{{ input_data.get('per_page', input_data.get('limit', 25)) | int(25) if input_data is mapping else 25 }}"
                _ts_sort_by: "{{ input_data.get('sort_by', 'updated_at') | string | trim if input_data is mapping else 'updated_at' }}"
                _ts_order_by: "{{ input_data.get('order_by', 'desc') | string | trim | lower if input_data is mapping else 'desc' }}"
                _ts_expand: "{{ input_data.get('expand', true) if input_data is mapping else true }}"
                _ts_with_total_count: "{{ input_data.get('with_total_count', true) if input_data is mapping else true }}"
                _ts_states_raw: "{{ input_data.get('states', ['new', 'open']) if input_data is mapping else ['new', 'open'] }}"
                _ts_tags_raw: "{{ input_data.get('tags', []) if input_data is mapping else [] }}"
            - variables:
                _ts_states: >-
                  {%- if _ts_states_raw is sequence and _ts_states_raw is not string -%}
                    {{ _ts_states_raw | list }}
                  {%- elif _ts_states_raw is string and _ts_states_raw | trim != '' -%}
                    {{ _ts_states_raw | trim | split(',') | map('trim') | reject('equalto', '') | list }}
                  {%- else -%}
                    {{ [] }}
                  {%- endif -%}
                _ts_tags: >-
                  {%- if _ts_tags_raw is sequence and _ts_tags_raw is not string -%}
                    {{ _ts_tags_raw | list }}
                  {%- elif _ts_tags_raw is string and _ts_tags_raw | trim != '' -%}
                    {{ _ts_tags_raw | trim | split(',') | map('trim') | reject('equalto', '') | list }}
                  {%- else -%}
                    {{ [] }}
                  {%- endif -%}
            - variables:
                _ts_query: >-
                  {%- set ns = namespace(parts=[]) -%}
                  {%- if _ts_query_raw != '' -%}
                    {%- set ns.parts = ns.parts + [_ts_query_raw] -%}
                  {%- endif -%}
                  {%- if _ts_queue != '' -%}
                    {%- set ns.parts = ns.parts + ['group.name:"' ~ _ts_queue ~ '"'] -%}
                  {%- endif -%}
                  {%- if _ts_owner != '' -%}
                    {%- set _owner_query = 'owner:"-"' if _ts_owner | lower in ['nobody','unassigned','-'] else 'owner:"' ~ _ts_owner ~ '"' -%}
                    {%- set ns.parts = ns.parts + [_owner_query] -%}
                  {%- endif -%}
                  {%- if _ts_priority != '' -%}
                    {%- set ns.parts = ns.parts + ['priority.name:"' ~ _ts_priority ~ '"'] -%}
                  {%- endif -%}
                  {%- for tag in _ts_tags -%}
                    {%- if tag | string | trim != '' -%}
                      {%- set ns.parts = ns.parts + ['tags:' ~ (tag | string | trim)] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {%- if _ts_states | length > 1 and _ts_query_raw == '' -%}
                    {%- set branches = namespace(items=[]) -%}
                    {%- for s in _ts_states -%}
                      {%- set branch = ns.parts + ['state.name:' ~ (s | string | trim)] -%}
                      {%- set branches.items = branches.items + ['(' ~ (branch | join(' AND ')) ~ ')'] -%}
                    {%- endfor -%}
                    {{ branches.items | join(' OR ') }}
                  {%- elif _ts_states | length == 1 and _ts_query_raw == '' -%}
                    {{ (ns.parts + ['state.name:' ~ (_ts_states | first | string | trim)]) | join(' AND ') }}
                  {%- else -%}
                    {{ ns.parts | join(' AND ') if ns.parts | length > 0 else '*' }}
                  {%- endif -%}
                _ts_endpoint: >-
                  tickets/search?query={{ (_ts_query | urlencode) | replace('%20', '+') }}&page={{ _ts_page }}&per_page={{ _ts_per_page }}
            - action: script.zen_sutra_zammad
              response_variable: _ts_raw
              continue_on_error: true
              data:
                action_type: get
                base_url: "{{ _base_url }}"
                request_timeout: "{{ _request_timeout }}"
                endpoint: "{{ _ts_endpoint }}"
            - variables:
                _ts_content: "{{ _ts_raw.get('result', {}).get('content', {}) if _ts_raw is mapping else {} }}"
                _ts_http_status: "{{ _ts_raw.get('http_status', 0) if _ts_raw is mapping else 0 }}"
                _ts_sequence_tickets: "{{ _ts_content if _ts_content is sequence and _ts_content is not string and _ts_content is not mapping else [] }}"
                _ts_assets: "{{ _ts_content.get('assets', {}).get('Ticket', {}) if _ts_content is mapping else {} }}"
                _ts_tickets: "{{ _ts_assets.values() | list if _ts_assets is mapping and _ts_assets | length > 0 else _ts_sequence_tickets }}"
                _ts_ticket_ids: >-
                  {%- if _ts_content is mapping -%}
                    {{ _ts_content.get('tickets', []) }}
                  {%- else -%}
                    {%- set ns = namespace(ids=[]) -%}
                    {%- for t in _ts_sequence_tickets if t is mapping -%}
                      {%- set ns.ids = ns.ids + [t.get('id', none)] -%}
                    {%- endfor -%}
                    {{ ns.ids | reject('equalto', none) | list }}
                  {%- endif -%}
                _ts_error_detail: "{{ _ts_content if _ts_content is mapping and _ts_http_status | int(0) >= 400 else none }}"
                _ts_diagnostic: >-
                  {%- if _ts_http_status | int(0) == 401 -%}
                    Zammad rejected the request as unauthorized. Check token expiry and configured credentials.
                  {%- elif _ts_http_status | int(0) == 403 -%}
                    Zammad rejected tickets/search for this token. Check group, ticket, or search permissions.
                  {%- elif _ts_http_status | int(0) == 404 -%}
                    Zammad tickets/search was not found at the configured base URL. Check DNS/base URL and reverse proxy path.
                  {%- elif _ts_http_status | int(0) >= 500 -%}
                    Zammad returned a server error. Retry later or inspect the Zammad service.
                  {%- elif _ts_http_status | int(0) >= 200 and _ts_http_status | int(0) < 300 -%}
                    {{ none }}
                  {%- else -%}
                    Ticket search failed before a usable Zammad response was available.
                  {%- endif -%}
                result:
                  status: "{{ _ts_raw.get('status', 'error') if _ts_raw is mapping else 'error' }}"
                  ok: "{{ _ts_http_status | int(0) >= 200 and _ts_http_status | int(0) < 300 }}"
                  tool: Zen DojoTools Fulfillment
                  case: ticket_search
                  source: tickets_search
                  query: "{{ _ts_query }}"
                  queues: []
                  tickets: "{{ _ts_tickets }}"
                  views: []
                  overviews: []
                  metadata:
                    queue: "{{ _ts_queue if _ts_queue != '' else none }}"
                    states: "{{ _ts_states }}"
                    owner: "{{ _ts_owner if _ts_owner != '' else none }}"
                    tags: "{{ _ts_tags }}"
                    priority: "{{ _ts_priority if _ts_priority != '' else none }}"
                    sort_by: "{{ _ts_sort_by }}"
                    order_by: "{{ _ts_order_by }}"
                    sort_applied_by_api: false
                    note: "Zammad search on this install returns rows reliably with the lean query/page/per_page endpoint; sort/expand/count request fields are preserved as caller intent but not sent to the API."
                    page: "{{ _ts_page }}"
                    per_page: "{{ _ts_per_page }}"
                  count: "{{ _ts_ticket_ids | length }}"
                  total_count: "{{ _ts_content.get('tickets_count', _ts_ticket_ids | length) if _ts_content is mapping else _ts_sequence_tickets | length }}"
                  ticket_ids: "{{ _ts_ticket_ids }}"
                  diagnostic: "{{ _ts_diagnostic }}"
                  error_detail: "{{ _ts_error_detail }}"
                  trace:
                    endpoint: "{{ _ts_endpoint }}"
                    http_status: "{{ _ts_http_status }}"
                    caller_token: "{{ caller_token_norm }}"
            - stop: ticket_search done
              response_variable: result

        - choose:
          - conditions:
            - condition: template
              value_template: '{{ case_norm == "view_get" }}'
            sequence:
            - variables:
                _view_id: "{{ input_data.get('view_id', input_data.get('view', 'catalog')) | string | trim | lower if input_data is mapping else 'catalog' }}"
                _view_queue: "{{ input_data.get('queue', 'Users') | string | trim if input_data is mapping else 'Users' }}"
                _view_agent_email: "{{ input_data.get('agent_email', input_data.get('owner', '')) | string | trim if input_data is mapping else '' }}"
                _view_page: "{{ input_data.get('page', 1) | int(1) if input_data is mapping else 1 }}"
                _view_per_page: "{{ input_data.get('per_page', input_data.get('limit', 25)) | int(25) if input_data is mapping else 25 }}"
                _views_catalog:
                  - view_id: new_unassigned
                    label: New Unassigned
                    queue_required: false
                    query_shape: group + state:new + owner:unassigned
                  - view_id: open_unassigned
                    label: Open Unassigned
                    queue_required: false
                    query_shape: group + state:open + owner:unassigned
                  - view_id: my_open
                    label: My Open
                    queue_required: false
                    agent_email_required: true
                    query_shape: group + state:new/open + owner:agent_email
                  - view_id: pending_reminder
                    label: Pending Reminder
                    queue_required: false
                    query_shape: group + pending states
                  - view_id: escalating
                    label: Escalating
                    queue_required: false
                    query_shape: group + escalation marker
                  - view_id: recent_customer_reply
                    label: Recent Customer Reply
                    queue_required: false
                    query_shape: group + new/open sorted by last_contact_customer_at
            - choose:
              - conditions:
                - condition: template
                  value_template: '{{ _view_id in ["", "catalog", "list"] }}'
                sequence:
                - variables:
                    result:
                      status: ok
                      ok: true
                      tool: Zen DojoTools Fulfillment
                      case: view_get
                      source: synthetic_views
                      queues: []
                      tickets: []
                      views: "{{ _views_catalog }}"
                      overviews: []
                      metadata:
                        view_id: catalog
                        queue_default: "{{ _view_queue }}"
                      count: "{{ _views_catalog | length }}"
                      total_count: "{{ _views_catalog | length }}"
                      diagnostic: "{{ none }}"
                      error_detail: "{{ none }}"
                      trace:
                        caller_token: "{{ caller_token_norm }}"
                - stop: view_get catalog done
                  response_variable: result
            - variables:
                _view_missing: "{{ 'agent_email' if _view_id == 'my_open' and _view_agent_email == '' else '' }}"
            - choose:
              - conditions:
                - condition: template
                  value_template: '{{ _view_missing != "" }}'
                sequence:
                - variables:
                    result:
                      status: error
                      ok: false
                      tool: Zen DojoTools Fulfillment
                      case: view_get
                      source: synthetic_views
                      queues: []
                      tickets: []
                      views: "{{ _views_catalog }}"
                      overviews: []
                      metadata:
                        view_id: "{{ _view_id }}"
                        queue: "{{ _view_queue }}"
                      count: 0
                      total_count: 0
                      diagnostic: "Missing required field for this view: {{ _view_missing }}."
                      error_detail:
                        missing: "{{ _view_missing }}"
                      trace:
                        caller_token: "{{ caller_token_norm }}"
                - stop: view_get missing input
                  response_variable: result
            - variables:
                _view_sort_by: "{{ 'last_contact_customer_at' if _view_id == 'recent_customer_reply' else 'updated_at' }}"
                _view_order_by: desc
                _view_query: >-
                  {%- set group_part = 'group.name:"' ~ _view_queue ~ '"' -%}
                  {%- if _view_id == 'new_unassigned' -%}
                    {{ group_part ~ ' AND state.name:new AND owner:"-"' }}
                  {%- elif _view_id == 'open_unassigned' -%}
                    {{ group_part ~ ' AND state.name:open AND owner:"-"' }}
                  {%- elif _view_id == 'my_open' -%}
                    {{ '(' ~ group_part ~ ' AND state.name:new AND owner:"' ~ _view_agent_email ~ '") OR (' ~ group_part ~ ' AND state.name:open AND owner:"' ~ _view_agent_email ~ '")' }}
                  {%- elif _view_id == 'pending_reminder' -%}
                    {{ '(' ~ group_part ~ ' AND state.name:pending reminder) OR (' ~ group_part ~ ' AND state.name:pending close)' }}
                  {%- elif _view_id == 'escalating' -%}
                    {{ group_part ~ ' AND escalation_at:*' }}
                  {%- elif _view_id == 'recent_customer_reply' -%}
                    {{ '(' ~ group_part ~ ' AND state.name:new AND last_contact_customer_at:*) OR (' ~ group_part ~ ' AND state.name:open AND last_contact_customer_at:*)' }}
                  {%- else -%}
                    {{ '' }}
                  {%- endif -%}
            - choose:
              - conditions:
                - condition: template
                  value_template: '{{ _view_query | trim == "" }}'
                sequence:
                - variables:
                    result:
                      status: error
                      ok: false
                      tool: Zen DojoTools Fulfillment
                      case: view_get
                      source: synthetic_views
                      queues: []
                      tickets: []
                      views: "{{ _views_catalog }}"
                      overviews: []
                      metadata:
                        view_id: "{{ _view_id }}"
                        queue: "{{ _view_queue }}"
                      count: 0
                      total_count: 0
                      diagnostic: "Unknown Radar view_id. Call view_get with view_id=catalog for supported views."
                      error_detail:
                        view_id: "{{ _view_id }}"
                      trace:
                        caller_token: "{{ caller_token_norm }}"
                - stop: view_get unknown view
                  response_variable: result
            - variables:
                _view_endpoint: >-
                  tickets/search?query={{ (_view_query | urlencode) | replace('%20', '+') }}&page={{ _view_page }}&per_page={{ _view_per_page }}
            - action: script.zen_sutra_zammad
              response_variable: _view_raw
              continue_on_error: true
              data:
                action_type: get
                base_url: "{{ _base_url }}"
                request_timeout: "{{ _request_timeout }}"
                endpoint: "{{ _view_endpoint }}"
            - variables:
                _view_content: "{{ _view_raw.get('result', {}).get('content', {}) if _view_raw is mapping else {} }}"
                _view_http_status: "{{ _view_raw.get('http_status', 0) if _view_raw is mapping else 0 }}"
                _view_sequence_tickets: "{{ _view_content if _view_content is sequence and _view_content is not string and _view_content is not mapping else [] }}"
                _view_assets: "{{ _view_content.get('assets', {}).get('Ticket', {}) if _view_content is mapping else {} }}"
                _view_tickets: "{{ _view_assets.values() | list if _view_assets is mapping and _view_assets | length > 0 else _view_sequence_tickets }}"
                _view_ticket_ids: >-
                  {%- if _view_content is mapping -%}
                    {{ _view_content.get('tickets', []) }}
                  {%- else -%}
                    {%- set ns = namespace(ids=[]) -%}
                    {%- for t in _view_sequence_tickets if t is mapping -%}
                      {%- set ns.ids = ns.ids + [t.get('id', none)] -%}
                    {%- endfor -%}
                    {{ ns.ids | reject('equalto', none) | list }}
                  {%- endif -%}
                _view_error_detail: "{{ _view_content if _view_content is mapping and _view_http_status | int(0) >= 400 else none }}"
                _view_diagnostic: >-
                  {%- if _view_http_status | int(0) >= 200 and _view_http_status | int(0) < 300 -%}
                    {{ none }}
                  {%- elif _view_http_status | int(0) == 403 -%}
                    Zammad rejected the Radar view search for this token. Check group/ticket/search permissions.
                  {%- elif _view_http_status | int(0) == 404 -%}
                    Zammad tickets/search was not found at the configured base URL. Check DNS/base URL and reverse proxy path.
                  {%- else -%}
                    Radar view search failed. Inspect error_detail and trace.http_status.
                  {%- endif -%}
                result:
                  status: "{{ _view_raw.get('status', 'error') if _view_raw is mapping else 'error' }}"
                  ok: "{{ _view_http_status | int(0) >= 200 and _view_http_status | int(0) < 300 }}"
                  tool: Zen DojoTools Fulfillment
                  case: view_get
                  source: synthetic_views
                  query: "{{ _view_query }}"
                  queues: []
                  tickets: "{{ _view_tickets }}"
                  views: "{{ _views_catalog }}"
                  overviews: []
                  metadata:
                    view_id: "{{ _view_id }}"
                    queue: "{{ _view_queue }}"
                    agent_email: "{{ _view_agent_email if _view_agent_email != '' else none }}"
                    page: "{{ _view_page }}"
                    per_page: "{{ _view_per_page }}"
                    sort_by: "{{ _view_sort_by }}"
                    order_by: "{{ _view_order_by }}"
                    sort_applied_by_api: false
                  count: "{{ _view_ticket_ids | length }}"
                  total_count: "{{ _view_content.get('tickets_count', _view_ticket_ids | length) if _view_content is mapping else _view_sequence_tickets | length }}"
                  ticket_ids: "{{ _view_ticket_ids }}"
                  diagnostic: "{{ _view_diagnostic }}"
                  error_detail: "{{ _view_error_detail }}"
                  trace:
                    endpoint: "{{ _view_endpoint }}"
                    http_status: "{{ _view_http_status }}"
                    caller_token: "{{ caller_token_norm }}"
            - stop: view_get done
              response_variable: result

        - choose:
          - conditions:
            - condition: template
              value_template: '{{ case_norm == "ticket_get" }}'
            sequence:
            - action: script.zen_sutra_zammad
              response_variable: _tget_raw
              continue_on_error: true
              data:
                action_type: get
                base_url: "{{ _base_url }}"
                request_timeout: "{{ _request_timeout }}"
                endpoint: "tickets/{{ _ticket_id }}"
            - action: script.zen_sutra_zammad
              response_variable: _tget_art_raw
              continue_on_error: true
              data:
                action_type: get
                base_url: "{{ _base_url }}"
                request_timeout: "{{ _request_timeout }}"
                endpoint: "ticket_articles/by_ticket/{{ _ticket_id }}"
            - action: script.zen_sutra_zammad
              response_variable: _tget_tags_raw
              continue_on_error: true
              data:
                action_type: get
                base_url: "{{ _base_url }}"
                request_timeout: "{{ _request_timeout }}"
                endpoint: "tags?object=Ticket&o_id={{ _ticket_id }}"
            - variables:
                _tget_content: "{{ _tget_raw.get('result', {}).get('content', {}) if _tget_raw is mapping else {} }}"
                _tget_articles: "{{ _tget_art_raw.get('result', {}).get('content', []) if _tget_art_raw is mapping else [] }}"
                _tget_tags_content: "{{ _tget_tags_raw.get('result', {}).get('content', {}) if _tget_tags_raw is mapping else {} }}"
            - variables:
                _tget_tag_list: "{{ _tget_tags_content.get('tags', []) if _tget_tags_content is mapping else [] }}"
                _ha_label_ids: "{{ labels() | list }}"
                _ha_area_ids: "{{ areas() | list }}"
                _ha_person_slugs: "{{ states.person | map(attribute='entity_id') | map('regex_replace', '^person\\.', '') | list }}"
                _ha_zone_slugs: "{{ states.zone | map(attribute='entity_id') | map('regex_replace', '^zone\\.', '') | list }}"
            - variables:
                _anchor_contexts: >-
                  {%- set _ns = namespace(ctxs=[]) -%}
                  {%- for tag in _tget_tag_list -%}
                    {%- if tag in _ha_label_ids -%}
                      {%- set _ns.ctxs = _ns.ctxs + [{'tag': tag, 'type': 'label', 'entity': 'label:' + tag}] -%}
                    {%- elif tag in _ha_area_ids -%}
                      {%- set _ns.ctxs = _ns.ctxs + [{'tag': tag, 'type': 'area', 'entity': 'area:' + tag}] -%}
                    {%- elif tag in _ha_person_slugs -%}
                      {%- set _ns.ctxs = _ns.ctxs + [{'tag': tag, 'type': 'person', 'entity': 'person.' + tag}] -%}
                    {%- elif tag in _ha_zone_slugs -%}
                      {%- set _ns.ctxs = _ns.ctxs + [{'tag': tag, 'type': 'zone', 'entity': 'zone.' + tag}] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ _ns.ctxs }}
                _anchor_suggestions: >-
                  {%- set _ha_all = (_ha_label_ids | list) + (_ha_area_ids | list) + (_ha_person_slugs | list) + (_ha_zone_slugs | list) -%}
                  {%- set _ns = namespace(sugs=[]) -%}
                  {%- for tag in _tget_tag_list -%}
                    {%- if tag not in _ha_all -%}
                      {%- set _ns.sugs = _ns.sugs + [tag] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ _ns.sugs }}
                _triage_metadata: >-
                  {%- set ns = namespace(data={'triaged': false}) -%}
                  {%- for tag in _tget_tag_list -%}
                    {%- set t = tag | string -%}
                    {%- if t == 'radar_triaged' -%}{%- set ns.data = ns.data | combine({'triaged': true}) -%}
                    {%- elif t[0:11] == 'radar_rank_' -%}{%- set ns.data = ns.data | combine({'rank': t[11:]}) -%}
                    {%- elif t[0:11] == 'radar_lane_' -%}{%- set ns.data = ns.data | combine({'lane': t[11:]}) -%}
                    {%- elif t[0:15] == 'radar_sequence_' -%}{%- set ns.data = ns.data | combine({'sequence': t[15:]}) -%}
                    {%- elif t[0:17] == 'radar_blocked_by_' -%}{%- set ns.data = ns.data | combine({'blocked_by': t[17:]}) -%}
                    {%- elif t[0:12] == 'radar_after_' -%}{%- set ns.data = ns.data | combine({'after': t[12:]}) -%}
                    {%- elif t[0:16] == 'radar_milestone_' -%}{%- set ns.data = ns.data | combine({'milestone': t[16:]}) -%}
                    {%- elif t[0:14] == 'radar_release_' -%}{%- set ns.data = ns.data | combine({'release_train': t[14:]}) -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ ns.data }}
            - variables:
                result:
                  status: "{{ _tget_raw.get('status', 'error') if _tget_raw is mapping else 'error' }}"
                  tool: Zen DojoTools Fulfillment
                  case: ticket_get
                  ticket: "{{ _tget_content }}"
                  articles: "{{ _tget_articles if _tget_articles is sequence else [] }}"
                  article_count: "{{ _tget_articles | length if _tget_articles is sequence else 0 }}"
                  tags: "{{ _tget_tag_list }}"
                  triage_metadata: "{{ _triage_metadata }}"
                  anchor_contexts: "{{ _anchor_contexts }}"
                  anchor_suggestions: "{{ _anchor_suggestions }}"
                  rolodex_hint:
                    tool: zen_dojotools_rolodex
                    case: contact_find
                    note: Use zen_dojotools_rolodex case=contact_find to look up contact details for this ticket's customer.
                  trace:
                    http_status: "{{ _tget_raw.get('http_status', 0) if _tget_raw is mapping else 0 }}"
                    caller_token: "{{ caller_token_norm }}"
            - stop: ticket_get done
              response_variable: result

        - choose:
          - conditions:
            - condition: template
              value_template: '{{ case_norm == "ticket_create" }}'
            sequence:
            - variables:
                _tc_title: "{{ input_data.get('title', '') | string | trim if input_data is mapping else '' }}"
                _tc_body: "{{ input_data.get('body', '') | string | trim if input_data is mapping else '' }}"
                _tc_group: "{{ input_data.get('group', 'Users') | string | trim if input_data is mapping else 'Users' }}"
                _tc_customer: "{{ input_data.get('customer', '') | string | trim if input_data is mapping else '' }}"
                _tc_person_entity_id: "{{ input_data.get('person_entity_id', '') | string | trim if input_data is mapping else '' }}"
                _tc_reporter: "{{ input_data.get('reporter', '') | string | trim | lower if input_data is mapping else '' }}"
                _tc_priority: "{{ input_data.get('priority', '2 normal') | string | trim if input_data is mapping else '2 normal' }}"
                _tc_state: "{{ input_data.get('state', 'new') | string | trim if input_data is mapping else 'new' }}"
                _tc_product_name: "{{ input_data.get('product_name', '') | string | trim if input_data is mapping else '' }}"
            - variables:
                _tc_person_name: >-
                  {{ state_attr(_tc_person_entity_id, 'friendly_name') | default('') if _tc_person_entity_id != '' else '' }}
                _tc_person_resolve_raw: none
            - variables:
                _tc_profile_email: >-
                  {%- if _tc_person_entity_id == '' or _tc_customer != '' or _tc_person_name == '' -%}
                  {%- else -%}
                    {%- set _fam_cab = states('sensor.zen_default_family_cabinet_resolved') -%}
                    {%- set _fam_vars = state_attr(_fam_cab, 'variables') | default({}, true) -%}
                    {%- set _fam_vars = _fam_vars if _fam_vars is mapping else {} -%}
                    {%- set _hm_raw = _fam_vars.get('household_members', {}) -%}
                    {%- set _hm = (_hm_raw.get('value', _hm_raw) if _hm_raw is mapping and 'value' in _hm_raw else _hm_raw) -%}
                    {%- set _hm = _hm if _hm is mapping else (_hm | from_json(none) if _hm is string and _hm | trim not in ['','none','null','None'] else {}) -%}
                    {%- set _members = _hm.get('members', {}) if _hm is mapping else {} -%}
                    {%- set _slug = _tc_person_name | lower | regex_replace('[^a-z].*', '') -%}
                    {%- set _member = _members.get(_slug, {}) -%}
                    {%- set _ucab = _member.get('user_cabinet', '') if _member is mapping else '' -%}
                    {%- if _ucab != '' -%}
                      {%- set _ucab_vars = state_attr(_ucab, 'variables') | default({}, true) -%}
                      {%- set _ucab_vars = _ucab_vars if _ucab_vars is mapping else {} -%}
                      {%- set _pr_raw = _ucab_vars.get('user_profile', none) -%}
                      {%- set _pr = (_pr_raw.get('value', _pr_raw) if _pr_raw is mapping and 'value' in _pr_raw else _pr_raw) -%}
                      {%- set _pr = _pr if _pr is mapping else (_pr | from_json(none) if _pr is string and _pr | trim not in ['','none','null','None'] else {}) -%}
                      {{ (_pr.get('email', '') if _pr is mapping else '') }}
                    {%- endif -%}
                  {%- endif -%}
            - if: "{{ _tc_person_entity_id != '' and _tc_customer == '' and _tc_person_name == '' }}"
              then:
                - variables:
                    result:
                      status: error
                      tool: Zen DojoTools Fulfillment
                      case: ticket_create
                      message: "person_entity_id '{{ _tc_person_entity_id }}' not found in HA — entity does not exist or is unavailable. Use zen_dojotools_inspect mode=person_list to find valid person entity IDs, or pass customer email directly."
                      trace:
                        caller_token: "{{ caller_token_norm }}"
                - stop: ticket_create person_entity_id not found
                  response_variable: result
            - choose:
              - conditions:
                - condition: template
                  value_template: '{{ _tc_customer == "" and _tc_person_entity_id != "" and _tc_person_name != "" and _tc_profile_email == "" }}'
                sequence:
                - action: script.zen_sutra_zammad
                  response_variable: _tc_person_resolve_raw
                  continue_on_error: true
                  data:
                    action_type: get
                    base_url: "{{ _base_url }}"
                    request_timeout: "{{ _request_timeout }}"
                    endpoint: "users/search?query={{ _tc_person_name | urlencode }}&limit=5"
            - variables:
                _tc_customer: >-
                  {%- if _tc_customer != '' -%}
                    {{ _tc_customer }}
                  {%- elif _tc_profile_email != '' -%}
                    {{ _tc_profile_email }}
                  {%- elif _tc_person_resolve_raw is mapping and _tc_person_resolve_raw.get('status','') == 'success' -%}
                    {%- set _hits = _tc_person_resolve_raw.get('result', {}).get('content', []) -%}
                    {%- set _hits = _hits if _hits is sequence else [] -%}
                    {{ (_hits | first).get('email', '') if (_hits | length) > 0 and (_hits | first) is mapping else '' }}
                  {%- else -%}{%- endif -%}
                _tc_person_email_source: >-
                  {%- if _tc_profile_email != '' -%}profile
                  {%- elif _tc_person_resolve_raw is mapping and _tc_person_resolve_raw.get('status','') == 'success' -%}zammad_search
                  {%- elif _tc_customer != '' -%}explicit
                  {%- else -%}none{%- endif -%}
            # --- reporter shorthand + group→zen_default_customer resolution ---
            # GATE: only fires when no customer resolved yet AND (reporter shorthand OR group set)
            - variables:
                _tc_radar_defaults: >-
                  {%- set _hh_cab = states('sensor.zen_default_household_cabinet_resolved') -%}
                  {%- set _hh_vars = state_attr(_hh_cab, 'variables') | default({}, true) -%}
                  {%- set _hh_vars = _hh_vars if _hh_vars is mapping else {} -%}
                  {%- set _rd_raw = _hh_vars.get('radar_defaults', {}) -%}
                  {%- set _rd = _rd_raw.get('value', _rd_raw) if _rd_raw is mapping and 'value' in _rd_raw else _rd_raw -%}
                  {%- set _rd = _rd if _rd is mapping else (_rd | from_json(none) if _rd is string and _rd | trim not in ['','none','null','None'] else {}) -%}
                  {{ _rd if _rd is mapping else {} }}
            - if: "{{ _tc_customer == '' }}"
              then:
              - if: "{{ _tc_reporter == 'house' }}"
                then:
                - variables:
                    _tc_customer: "{{ _tc_radar_defaults.get('house_customer_id', 0) | int(0) | string }}"
                    _tc_person_email_source: shorthand_house
                else:
                - if: "{{ _tc_reporter == 'zenos' }}"
                  then:
                  - variables:
                      _tc_customer: "{{ _tc_radar_defaults.get('dev_customer_id', 0) | int(0) | string }}"
                      _tc_person_email_source: shorthand_zenos
                  else:
                  - if: "{{ _tc_group != '' }}"
                    then:
                    # group→customer_id via radar_group_map cabinet lookup (written by radar_setup map_queue)
                    - variables:
                        _tc_grp_map_raw: >-
                          {%- set _hh_cab = states('sensor.zen_default_household_cabinet_resolved') -%}
                          {%- set _hh_vars = state_attr(_hh_cab, 'variables') | default({}, true) -%}
                          {%- set _hh_vars = _hh_vars if _hh_vars is mapping else {} -%}
                          {%- set _raw = _hh_vars.get('radar_group_map', {}) -%}
                          {%- set _v = _raw.get('value', _raw) if _raw is mapping and 'value' in _raw else _raw -%}
                          {%- set _v = _v if _v is mapping else (_v | from_json(none) if _v is string and _v | trim not in ['','none','null','None'] else {}) -%}
                          {{ _v if _v is mapping else {} }}
                    - variables:
                        _tc_grp_cust_id: "{{ (_tc_grp_map_raw.get(_tc_group, none) if _tc_grp_map_raw is mapping else none) | int(0) }}"
                    - if: "{{ _tc_grp_cust_id > 0 }}"
                      then:
                      - variables:
                          _tc_customer: "{{ _tc_grp_cust_id | string }}"
                          _tc_person_email_source: group_map
                      else:
                      - variables:
                          _tc_customer: "{{ _tc_radar_defaults.get('house_customer_id', 0) | int(0) | string }}"
                          _tc_person_email_source: radar_fallback

            - variables:
                _tc_payload: >-
                  {%- set _ns = namespace(p={
                    'title': _tc_title,
                    'group': _tc_group,
                    'priority': _tc_priority,
                    'state': _tc_state,
                    'article': {
                      'subject': _tc_title,
                      'body': _tc_body,
                      'type': 'note',
                      'internal': false
                    }
                  }) -%}
                  {%- if _tc_customer != '' -%}
                    {%- if _tc_customer | int(0) > 0 -%}
                      {%- set _ns.p = _ns.p | combine({'customer_id': _tc_customer | int}) -%}
                    {%- else -%}
                      {%- set _ns.p = _ns.p | combine({'customer': _tc_customer}) -%}
                    {%- endif -%}
                  {%- endif -%}
                  {{ _ns.p | tojson }}
            - action: script.zen_sutra_zammad
              response_variable: _tc_raw
              continue_on_error: true
              data:
                action_type: post
                base_url: "{{ _base_url }}"
                request_timeout: "{{ _request_timeout }}"
                endpoint: "tickets"
                payload: "{{ _tc_payload }}"
            - variables:
                _tc_content: "{{ _tc_raw.get('result', {}).get('content', {}) if _tc_raw is mapping else {} }}"
                _tc_created_ok: "{{ _tc_raw is mapping and _tc_raw.get('status', '') == 'success' }}"
                _tc_new_id: "{{ _tc_content.get('id', none) if _tc_content is mapping else none }}"
                _inv_notify_raw: none
                _audit_note_raw: none
            - choose:
              - conditions:
                - condition: template
                  value_template: '{{ _tc_product_name != "" and _tc_created_ok and _tc_new_id is not none }}'
                sequence:
                - action: script.zen_dojotools_inventory
                  continue_on_error: true
                  response_variable: _inv_notify_raw
                  data:
                    mode: product_ref_add
                    item: "{{ _tc_product_name }}"
                    ref_type: ticket
                    ref_id: "{{ _tc_new_id | int }}"
            - choose:
              - conditions:
                - condition: template
                  value_template: '{{ _tc_created_ok and _tc_new_id is not none and _audit_has_context | bool }}'
                sequence:
                - variables:
                    _audit_note_payload: >-
                      {{
                        {
                          'ticket_id': _tc_new_id | int,
                          'subject': 'Audit: delegated work receipt',
                          'body': 'Work receipt\n'
                            ~ 'asked_to_do: ' ~ _tc_title ~ '\n'
                            ~ 'acting_agent: ' ~ _audit_context.get('actor', 'unknown') ~ '\n'
                            ~ 'technical_account: ' ~ _audit_context.get('service_account', 'unknown') ~ '\n'
                            ~ 'delegation_mode: ' ~ _audit_context.get('delegation_mode', 'direct') ~ '\n'
                            ~ 'approved_by: ' ~ (_audit_context.get('approved_by') or '') ~ '\n'
                            ~ 'approval_basis: ' ~ (_audit_context.get('approval_basis') or '') ~ '\n'
                            ~ 'created_at: ' ~ now().isoformat() ~ '\n'
                            ~ 'status: created\n'
                            ~ 'caller_token: ' ~ caller_token_norm,
                          'type': 'note',
                          'internal': true
                        } | tojson
                      }}
                - action: script.zen_sutra_zammad
                  response_variable: _audit_note_raw
                  continue_on_error: true
                  data:
                    action_type: post
                    base_url: "{{ _base_url }}"
                    request_timeout: "{{ _request_timeout }}"
                    endpoint: "ticket_articles"
                    payload: "{{ _audit_note_payload }}"
            - variables:
                _inv_notified: "{{ _inv_notify_raw is mapping and _inv_notify_raw.get('status', '') == 'ok' }}"
                _audit_note_written: "{{ _audit_note_raw is mapping and _audit_note_raw.get('status', '') == 'success' }}"
                result:
                  status: "{{ _tc_raw.get('status', 'error') if _tc_raw is mapping else 'error' }}"
                  tool: Zen DojoTools Fulfillment
                  case: ticket_create
                  ticket: "{{ _tc_content }}"
                  ticket_id: "{{ _tc_content.get('id', none) if _tc_content is mapping else none }}"
                  ticket_number: "{{ _tc_content.get('number', none) if _tc_content is mapping else none }}"
                  inventory_notified: "{{ _inv_notified }}"
                  audit_note_written: "{{ _audit_note_written }}"
                  person_resolution: >-
                    {%- if _tc_person_entity_id == '' -%}{{ none }}
                    {%- else -%}
                      {{
                        {
                          'person_entity_id': _tc_person_entity_id,
                          'resolved_email': _tc_customer,
                          'source': _tc_person_email_source,
                          'suggest_profile_write': (
                            'zen_dojotools_profile_editor mode=write email=' ~ _tc_customer
                            if _tc_person_email_source == 'zammad_search' and _tc_customer != ''
                            else none
                          )
                        }
                      }}
                    {%- endif -%}
                  trace:
                    http_status: "{{ _tc_raw.get('http_status', 0) if _tc_raw is mapping else 0 }}"
                    caller_token: "{{ caller_token_norm }}"
                    audit_context: "{{ _audit_context }}"
            - stop: ticket_create done
              response_variable: result

        - choose:
          - conditions:
            - condition: template
              value_template: '{{ case_norm == "ticket_update" }}'
            sequence:
            - variables:
                _tu_payload: >-
                  {%- set _ns = namespace(p={}) -%}
                  {%- if input_data is mapping -%}
                    {%- set _t = input_data.get('title', '') | string | trim -%}
                    {%- if _t != '' -%}{%- set _ns.p = _ns.p | combine({'title': _t}) -%}{%- endif -%}
                    {%- set _s = input_data.get('state', '') | string | trim -%}
                    {%- if _s != '' -%}{%- set _ns.p = _ns.p | combine({'state': _s}) -%}{%- endif -%}
                    {%- set _pr = input_data.get('priority', '') | string | trim -%}
                    {%- if _pr != '' -%}{%- set _ns.p = _ns.p | combine({'priority': _pr}) -%}{%- endif -%}
                    {%- set _ow = input_data.get('owner_id', none) -%}
                    {%- if _ow is not none -%}{%- set _ns.p = _ns.p | combine({'owner_id': _ow | int}) -%}{%- endif -%}
                    {%- set _g = input_data.get('group', '') | string | trim -%}
                    {%- if _g != '' -%}{%- set _ns.p = _ns.p | combine({'group': _g}) -%}{%- endif -%}
                    {%- set _org = input_data.get('organization_id', none) -%}
                    {%- if _org is not none -%}{%- set _ns.p = _ns.p | combine({'organization_id': _org | int}) -%}{%- endif -%}
                    {%- set _cust = input_data.get('customer_id', none) -%}
                    {%- if _cust is not none -%}{%- set _ns.p = _ns.p | combine({'customer_id': _cust | int}) -%}{%- endif -%}
                    {%- set _pt = input_data.get('pending_time', '') | string | trim -%}
                    {%- if _pt != '' -%}{%- set _ns.p = _ns.p | combine({'pending_time': _pt}) -%}{%- endif -%}
                  {%- endif -%}
                  {{ _ns.p | tojson }}
            - action: script.zen_sutra_zammad
              response_variable: _tu_raw
              continue_on_error: true
              data:
                action_type: put
                base_url: "{{ _base_url }}"
                request_timeout: "{{ _request_timeout }}"
                endpoint: "tickets/{{ _ticket_id }}"
                payload: "{{ _tu_payload }}"
            - variables:
                _tu_content: "{{ _tu_raw.get('result', {}).get('content', {}) if _tu_raw is mapping else {} }}"
                result:
                  status: "{{ _tu_raw.get('status', 'error') if _tu_raw is mapping else 'error' }}"
                  tool: Zen DojoTools Fulfillment
                  case: ticket_update
                  ticket: "{{ _tu_content }}"
                  ticket_id: "{{ _ticket_id }}"
                  trace:
                    http_status: "{{ _tu_raw.get('http_status', 0) if _tu_raw is mapping else 0 }}"
                    caller_token: "{{ caller_token_norm }}"
            - stop: ticket_update done
              response_variable: result

        - choose:
          - conditions:
            - condition: template
              value_template: '{{ case_norm == "ticket_close" }}'
            sequence:
            - action: script.zen_sutra_zammad
              response_variable: _tclose_raw
              continue_on_error: true
              data:
                action_type: put
                base_url: "{{ _base_url }}"
                request_timeout: "{{ _request_timeout }}"
                endpoint: "tickets/{{ _ticket_id }}"
                payload: '{"state": "closed"}'
            - variables:
                _tclose_content: "{{ _tclose_raw.get('result', {}).get('content', {}) if _tclose_raw is mapping else {} }}"
                result:
                  status: "{{ _tclose_raw.get('status', 'error') if _tclose_raw is mapping else 'error' }}"
                  tool: Zen DojoTools Fulfillment
                  case: ticket_close
                  ticket_id: "{{ _ticket_id }}"
                  ticket: "{{ _tclose_content }}"
                  trace:
                    http_status: "{{ _tclose_raw.get('http_status', 0) if _tclose_raw is mapping else 0 }}"
                    caller_token: "{{ caller_token_norm }}"
            - stop: ticket_close done
              response_variable: result

        - choose:
          - conditions:
            - condition: template
              value_template: '{{ case_norm == "ticket_complete" }}'
            sequence:
            - variables:
                _done_body: "{{ input_data.get('body', '') | string | trim if input_data is mapping else '' }}"
                _done_subject: "{{ input_data.get('subject', 'Completed') | string | trim if input_data is mapping else 'Completed' }}"
                _done_internal: "{{ input_data.get('internal', true) if input_data is mapping else true }}"
                _done_tags_raw: "{{ input_data.get('tags', []) if input_data is mapping else [] }}"
                _done_anchors_raw: "{{ input_data.get('anchors', []) if input_data is mapping else [] }}"
            - variables:
                _done_tags: >-
                  {%- set ns = namespace(items=[]) -%}
                  {%- set raw = _done_tags_raw -%}
                  {%- if raw is sequence and raw is not string -%}
                    {%- for t in raw -%}
                      {%- set x = t | string | trim -%}
                      {%- if x != '' and x not in ns.items -%}{%- set ns.items = ns.items + [x] -%}{%- endif -%}
                    {%- endfor -%}
                  {%- elif raw is string and raw | trim != '' -%}
                    {%- for t in raw | split(',') -%}
                      {%- set x = t | string | trim -%}
                      {%- if x != '' and x not in ns.items -%}{%- set ns.items = ns.items + [x] -%}{%- endif -%}
                    {%- endfor -%}
                  {%- endif -%}
                  {%- set araw = _done_anchors_raw -%}
                  {%- if araw is sequence and araw is not string -%}
                    {%- for t in araw -%}
                      {%- set x = t | string | trim -%}
                      {%- if x != '' and x not in ns.items -%}{%- set ns.items = ns.items + [x] -%}{%- endif -%}
                    {%- endfor -%}
                  {%- elif araw is string and araw | trim != '' -%}
                    {%- for t in araw | split(',') -%}
                      {%- set x = t | string | trim -%}
                      {%- if x != '' and x not in ns.items -%}{%- set ns.items = ns.items + [x] -%}{%- endif -%}
                    {%- endfor -%}
                  {%- endif -%}
                  {{ ns.items }}
                _done_receipt_body: >-
                  {{
                    _done_body ~ '\n\nWork receipt\n'
                    ~ 'acting_agent: ' ~ _audit_context.get('actor', 'unknown') ~ '\n'
                    ~ 'technical_account: ' ~ _audit_context.get('service_account', 'unknown') ~ '\n'
                    ~ 'delegation_mode: ' ~ _audit_context.get('delegation_mode', 'direct') ~ '\n'
                    ~ 'approved_by: ' ~ (_audit_context.get('approved_by') or '') ~ '\n'
                    ~ 'approval_basis: ' ~ (_audit_context.get('approval_basis') or '') ~ '\n'
                    ~ 'completed_at: ' ~ now().isoformat() ~ '\n'
                    ~ 'status: completed\n'
                    ~ 'caller_token: ' ~ caller_token_norm
                  }}
            - action: script.zen_sutra_zammad
              response_variable: _done_note_raw
              continue_on_error: true
              data:
                action_type: post
                base_url: "{{ _base_url }}"
                request_timeout: "{{ _request_timeout }}"
                endpoint: "ticket_articles"
                payload: >-
                  {{
                    {
                      'ticket_id': _ticket_id | int,
                      'subject': _done_subject,
                      'body': _done_receipt_body,
                      'type': 'note',
                      'internal': _done_internal
                    } | tojson
                  }}
            - variables:
                _done_tag_results: []
            - repeat:
                for_each: "{{ _done_tags }}"
                sequence:
                - action: script.zen_sutra_zammad
                  response_variable: _done_tag_raw
                  continue_on_error: true
                  data:
                    action_type: post
                    base_url: "{{ _base_url }}"
                    request_timeout: "{{ _request_timeout }}"
                    endpoint: "tags/add"
                    payload: '{{ {"object": "Ticket", "o_id": _ticket_id | int, "item": repeat.item} | tojson }}'
                - variables:
                    _done_tag_results: >-
                      {{ _done_tag_results + [{
                        'tag': repeat.item,
                        'status': _done_tag_raw.get('status', 'error') if _done_tag_raw is mapping else 'error',
                        'http_status': _done_tag_raw.get('http_status', 0) if _done_tag_raw is mapping else 0
                      }] }}
            - action: script.zen_sutra_zammad
              response_variable: _done_close_raw
              continue_on_error: true
              data:
                action_type: put
                base_url: "{{ _base_url }}"
                request_timeout: "{{ _request_timeout }}"
                endpoint: "tickets/{{ _ticket_id }}"
                payload: '{"state": "closed"}'
            - variables:
                _done_note_content: "{{ _done_note_raw.get('result', {}).get('content', {}) if _done_note_raw is mapping else {} }}"
                _done_close_content: "{{ _done_close_raw.get('result', {}).get('content', {}) if _done_close_raw is mapping else {} }}"
                _done_note_ok: "{{ _done_note_raw is mapping and _done_note_raw.get('status') == 'success' }}"
                _done_close_ok: "{{ _done_close_raw is mapping and _done_close_raw.get('status') == 'success' }}"
                _done_tag_failures: "{{ _done_tag_results | rejectattr('status', 'equalto', 'success') | list if _done_tag_results is sequence else [] }}"
                result:
                  status: "{{ 'success' if _done_note_ok and _done_close_ok and (_done_tag_failures | length == 0) else 'warning' }}"
                  tool: Zen DojoTools Fulfillment
                  case: ticket_complete
                  ticket_id: "{{ _ticket_id }}"
                  note_written: "{{ _done_note_ok }}"
                  article_id: "{{ _done_note_content.get('id', none) if _done_note_content is mapping else none }}"
                  tags_requested: "{{ _done_tags }}"
                  tag_results: "{{ _done_tag_results }}"
                  closed: "{{ _done_close_ok }}"
                  ticket: "{{ _done_close_content }}"
                  actor_context: "{{ _audit_context }}"
                  trace:
                    note_http_status: "{{ _done_note_raw.get('http_status', 0) if _done_note_raw is mapping else 0 }}"
                    close_http_status: "{{ _done_close_raw.get('http_status', 0) if _done_close_raw is mapping else 0 }}"
                    caller_token: "{{ caller_token_norm }}"
            - stop: ticket_complete done
              response_variable: result

        - choose:
          - conditions:
            - condition: template
              value_template: '{{ case_norm == "article_add" }}'
            sequence:
            - variables:
                _art_body: "{{ input_data.get('body', '') | string | trim if input_data is mapping else '' }}"
                _art_subject: "{{ input_data.get('subject', 'Note') | string | trim if input_data is mapping else 'Note' }}"
                _art_type: "{{ input_data.get('type', 'note') | string | trim | lower if input_data is mapping else 'note' }}"
                _art_internal: "{{ input_data.get('internal', true) if input_data is mapping else true }}"
            - variables:
                _art_payload: >-
                  {{
                    {
                      'ticket_id': _ticket_id | int,
                      'subject': _art_subject,
                      'body': _art_body,
                      'type': _art_type,
                      'internal': _art_internal
                    } | tojson
                  }}
            - action: script.zen_sutra_zammad
              response_variable: _art_raw
              continue_on_error: true
              data:
                action_type: post
                base_url: "{{ _base_url }}"
                request_timeout: "{{ _request_timeout }}"
                endpoint: "ticket_articles"
                payload: "{{ _art_payload }}"
            - variables:
                _art_content: "{{ _art_raw.get('result', {}).get('content', {}) if _art_raw is mapping else {} }}"
                result:
                  status: "{{ _art_raw.get('status', 'error') if _art_raw is mapping else 'error' }}"
                  tool: Zen DojoTools Fulfillment
                  case: article_add
                  ticket_id: "{{ _ticket_id }}"
                  article: "{{ _art_content }}"
                  article_id: "{{ _art_content.get('id', none) if _art_content is mapping else none }}"
                  trace:
                    http_status: "{{ _art_raw.get('http_status', 0) if _art_raw is mapping else 0 }}"
                    caller_token: "{{ caller_token_norm }}"
            - stop: article_add done
              response_variable: result

        - choose:
          - conditions:
            - condition: template
              value_template: '{{ case_norm == "articles_list" }}'
            sequence:
            - action: script.zen_sutra_zammad
              response_variable: _alist_raw
              continue_on_error: true
              data:
                action_type: get
                base_url: "{{ _base_url }}"
                request_timeout: "{{ _request_timeout }}"
                endpoint: "ticket_articles/by_ticket/{{ _ticket_id }}"
            - variables:
                _alist_content: "{{ _alist_raw.get('result', {}).get('content', []) if _alist_raw is mapping else [] }}"
                result:
                  status: "{{ _alist_raw.get('status', 'error') if _alist_raw is mapping else 'error' }}"
                  tool: Zen DojoTools Fulfillment
                  case: articles_list
                  ticket_id: "{{ _ticket_id }}"
                  articles: "{{ _alist_content if _alist_content is sequence else [] }}"
                  count: "{{ _alist_content | length if _alist_content is sequence else 0 }}"
                  trace:
                    http_status: "{{ _alist_raw.get('http_status', 0) if _alist_raw is mapping else 0 }}"
                    caller_token: "{{ caller_token_norm }}"
            - stop: articles_list done
              response_variable: result

        - choose:
          - conditions:
            - condition: template
              value_template: '{{ case_norm == "triage_set" }}'
            sequence:
            - variables:
                _triage_rank: "{{ input_data.get('rank', '') | string | trim | lower if input_data is mapping else '' }}"
                _triage_lane: "{{ input_data.get('lane', '') | string | trim | lower if input_data is mapping else '' }}"
                _triage_sequence: "{{ input_data.get('sequence', '') | string | trim if input_data is mapping else '' }}"
                _triage_blocked_by: "{{ input_data.get('blocked_by', '') | string | trim if input_data is mapping else '' }}"
                _triage_after: "{{ input_data.get('after', '') | string | trim if input_data is mapping else '' }}"
                _triage_rationale: "{{ input_data.get('rationale', '') | string | trim if input_data is mapping else '' }}"
                _triage_triaged_by: "{{ input_data.get('triaged_by', _audit_actor_hint) | string | trim if input_data is mapping else _audit_actor_hint }}"
                _triage_accepted_by: "{{ input_data.get('accepted_by', '') | string | trim if input_data is mapping else '' }}"
                _triage_milestone: "{{ input_data.get('milestone', '') | string | trim if input_data is mapping else '' }}"
                _triage_release_train: "{{ input_data.get('release_train', '') | string | trim if input_data is mapping else '' }}"
            - variables:
                _triage_rank_slug: "{{ _triage_rank | regex_replace('[^a-z0-9]+', '_') | regex_replace('(^_+|_+$)', '') }}"
                _triage_lane_slug: "{{ _triage_lane | regex_replace('[^a-z0-9]+', '_') | regex_replace('(^_+|_+$)', '') }}"
                _triage_sequence_slug: "{{ _triage_sequence | lower | regex_replace('[^a-z0-9]+', '_') | regex_replace('(^_+|_+$)', '') }}"
                _triage_blocked_slug: "{{ _triage_blocked_by | lower | regex_replace('[^a-z0-9]+', '_') | regex_replace('(^_+|_+$)', '') }}"
                _triage_after_slug: "{{ _triage_after | lower | regex_replace('[^a-z0-9]+', '_') | regex_replace('(^_+|_+$)', '') }}"
                _triage_milestone_slug: "{{ _triage_milestone | lower | regex_replace('[^a-z0-9]+', '_') | regex_replace('(^_+|_+$)', '') }}"
                _triage_release_slug: "{{ _triage_release_train | lower | regex_replace('[^a-z0-9]+', '_') | regex_replace('(^_+|_+$)', '') }}"
            - variables:
                _triage_tags: >-
                  {%- set ns = namespace(tags=['radar_triaged']) -%}
                  {%- if _triage_rank_slug != '' -%}{%- set ns.tags = ns.tags + ['radar_rank_' ~ _triage_rank_slug] -%}{%- endif -%}
                  {%- if _triage_lane_slug != '' -%}{%- set ns.tags = ns.tags + ['radar_lane_' ~ _triage_lane_slug] -%}{%- endif -%}
                  {%- if _triage_sequence_slug != '' -%}{%- set ns.tags = ns.tags + ['radar_sequence_' ~ _triage_sequence_slug] -%}{%- endif -%}
                  {%- if _triage_blocked_slug != '' -%}{%- set ns.tags = ns.tags + ['radar_blocked_by_' ~ _triage_blocked_slug] -%}{%- endif -%}
                  {%- if _triage_after_slug != '' -%}{%- set ns.tags = ns.tags + ['radar_after_' ~ _triage_after_slug] -%}{%- endif -%}
                  {%- if _triage_milestone_slug != '' -%}{%- set ns.tags = ns.tags + ['radar_milestone_' ~ _triage_milestone_slug] -%}{%- endif -%}
                  {%- if _triage_release_slug != '' -%}{%- set ns.tags = ns.tags + ['radar_release_' ~ _triage_release_slug] -%}{%- endif -%}
                  {{ ns.tags }}
                _triage_receipt:
                  schema: radar_triage.v1
                  ticket_id: "{{ _ticket_id }}"
                  rank: "{{ _triage_rank }}"
                  lane: "{{ _triage_lane if _triage_lane != '' else none }}"
                  sequence: "{{ _triage_sequence if _triage_sequence != '' else none }}"
                  blocked_by: "{{ _triage_blocked_by if _triage_blocked_by != '' else none }}"
                  after: "{{ _triage_after if _triage_after != '' else none }}"
                  rationale: "{{ _triage_rationale if _triage_rationale != '' else none }}"
                  triaged_by: "{{ _triage_triaged_by if _triage_triaged_by != '' else none }}"
                  accepted_by: "{{ _triage_accepted_by if _triage_accepted_by != '' else none }}"
                  triaged_at: "{{ now().isoformat() }}"
                  milestone: "{{ _triage_milestone if _triage_milestone != '' else none }}"
                  release_train: "{{ _triage_release_train if _triage_release_train != '' else none }}"
                  storage_backend: internal_note_and_tags
            - variables:
                _triage_note_body: >-
                  schema: radar_triage.v1
                  data: {{ _triage_receipt | tojson }}
                  tags: {{ _triage_tags | tojson }}
                _triage_note_payload: >-
                  {{
                    {
                      'ticket_id': _ticket_id | int,
                      'subject': 'Radar triage metadata',
                      'body': _triage_note_body,
                      'type': 'note',
                      'internal': true
                    } | tojson
                  }}
            - action: script.zen_sutra_zammad
              response_variable: _triage_note_raw
              continue_on_error: true
              data:
                action_type: post
                base_url: "{{ _base_url }}"
                request_timeout: "{{ _request_timeout }}"
                endpoint: "ticket_articles"
                payload: "{{ _triage_note_payload }}"
            - repeat:
                for_each: "{{ _triage_tags }}"
                sequence:
                - action: script.zen_sutra_zammad
                  response_variable: _triage_tag_raw
                  continue_on_error: true
                  data:
                    action_type: post
                    base_url: "{{ _base_url }}"
                    request_timeout: "{{ _request_timeout }}"
                    endpoint: "tags/add"
                    payload: '{{ {"object": "Ticket", "o_id": _ticket_id | int, "item": repeat.item} | tojson }}'
            - variables:
                _triage_note_content: "{{ _triage_note_raw.get('result', {}).get('content', {}) if _triage_note_raw is mapping else {} }}"
                result:
                  status: "{{ _triage_note_raw.get('status', 'error') if _triage_note_raw is mapping else 'error' }}"
                  ok: "{{ _triage_note_raw is mapping and _triage_note_raw.get('http_status', 0) | int(0) >= 200 and _triage_note_raw.get('http_status', 0) | int(0) < 300 }}"
                  tool: Zen DojoTools Fulfillment
                  case: triage_set
                  ticket_id: "{{ _ticket_id }}"
                  triage: "{{ _triage_receipt }}"
                  tags_requested: "{{ _triage_tags }}"
                  article_id: "{{ _triage_note_content.get('id', none) if _triage_note_content is mapping else none }}"
                  storage_backend: internal_note_and_tags
                  trace:
                    note_http_status: "{{ _triage_note_raw.get('http_status', 0) if _triage_note_raw is mapping else 0 }}"
                    caller_token: "{{ caller_token_norm }}"
            - stop: triage_set done
              response_variable: result

        - choose:
          - conditions:
            - condition: template
              value_template: '{{ case_norm == "triage_get" }}'
            sequence:
            - action: script.zen_sutra_zammad
              response_variable: _triage_get_tags_raw
              continue_on_error: true
              data:
                action_type: get
                base_url: "{{ _base_url }}"
                request_timeout: "{{ _request_timeout }}"
                endpoint: "tags?object=Ticket&o_id={{ _ticket_id }}"
            - action: script.zen_sutra_zammad
              response_variable: _triage_get_articles_raw
              continue_on_error: true
              data:
                action_type: get
                base_url: "{{ _base_url }}"
                request_timeout: "{{ _request_timeout }}"
                endpoint: "ticket_articles/by_ticket/{{ _ticket_id }}"
            - variables:
                _triage_get_tags_content: "{{ _triage_get_tags_raw.get('result', {}).get('content', {}) if _triage_get_tags_raw is mapping else {} }}"
                _triage_get_articles: "{{ _triage_get_articles_raw.get('result', {}).get('content', []) if _triage_get_articles_raw is mapping else [] }}"
                _triage_get_tag_list: "{{ _triage_get_tags_content.get('tags', []) if _triage_get_tags_content is mapping else [] }}"
            - variables:
                _triage_from_tags: >-
                  {%- set ns = namespace(data={'triaged': false}) -%}
                  {%- for tag in _triage_get_tag_list -%}
                    {%- set t = tag | string -%}
                    {%- if t == 'radar_triaged' -%}{%- set ns.data = ns.data | combine({'triaged': true}) -%}
                    {%- elif t[0:11] == 'radar_rank_' -%}{%- set ns.data = ns.data | combine({'rank': t[11:]}) -%}
                    {%- elif t[0:11] == 'radar_lane_' -%}{%- set ns.data = ns.data | combine({'lane': t[11:]}) -%}
                    {%- elif t[0:15] == 'radar_sequence_' -%}{%- set ns.data = ns.data | combine({'sequence': t[15:]}) -%}
                    {%- elif t[0:17] == 'radar_blocked_by_' -%}{%- set ns.data = ns.data | combine({'blocked_by': t[17:]}) -%}
                    {%- elif t[0:12] == 'radar_after_' -%}{%- set ns.data = ns.data | combine({'after': t[12:]}) -%}
                    {%- elif t[0:16] == 'radar_milestone_' -%}{%- set ns.data = ns.data | combine({'milestone': t[16:]}) -%}
                    {%- elif t[0:14] == 'radar_release_' -%}{%- set ns.data = ns.data | combine({'release_train': t[14:]}) -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ ns.data }}
                _triage_receipt_articles: >-
                  {%- set ns = namespace(items=[]) -%}
                  {%- for article in _triage_get_articles if article is mapping -%}
                    {%- set body = article.get('body', '') | string -%}
                    {%- if 'schema: radar_triage.v1' in body -%}
                      {%- set ns.items = ns.items + [{
                        'article_id': article.get('id', none),
                        'created_at': article.get('created_at', none),
                        'body': body
                      }] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ ns.items }}
                result:
                  status: "{{ _triage_get_tags_raw.get('status', 'error') if _triage_get_tags_raw is mapping else 'error' }}"
                  ok: "{{ _triage_get_tags_raw is mapping and _triage_get_tags_raw.get('http_status', 0) | int(0) >= 200 and _triage_get_tags_raw.get('http_status', 0) | int(0) < 300 }}"
                  tool: Zen DojoTools Fulfillment
                  case: triage_get
                  ticket_id: "{{ _ticket_id }}"
                  triage: "{{ _triage_from_tags }}"
                  receipt_articles: "{{ _triage_receipt_articles }}"
                  tags: "{{ _triage_get_tag_list }}"
                  storage_backend: internal_note_and_tags
                  trace:
                    tags_http_status: "{{ _triage_get_tags_raw.get('http_status', 0) if _triage_get_tags_raw is mapping else 0 }}"
                    articles_http_status: "{{ _triage_get_articles_raw.get('http_status', 0) if _triage_get_articles_raw is mapping else 0 }}"
                    caller_token: "{{ caller_token_norm }}"
            - stop: triage_get done
              response_variable: result

        - choose:
          - conditions:
            - condition: template
              value_template: '{{ case_norm == "ticket_tag" }}'
            sequence:
            - variables:
                _tag_name: "{{ input_data.get('tag', '') | string | trim if input_data is mapping else '' }}"
            - action: script.zen_sutra_zammad
              response_variable: _tag_raw
              continue_on_error: true
              data:
                action_type: post
                base_url: "{{ _base_url }}"
                request_timeout: "{{ _request_timeout }}"
                endpoint: "tags/add"
                payload: '{{ {"object": "Ticket", "o_id": _ticket_id | int, "item": _tag_name} | tojson }}'
            - variables:
                result:
                  status: "{{ _tag_raw.get('status', 'error') if _tag_raw is mapping else 'error' }}"
                  tool: Zen DojoTools Fulfillment
                  case: ticket_tag
                  ticket_id: "{{ _ticket_id }}"
                  tag: "{{ _tag_name }}"
                  trace:
                    http_status: "{{ _tag_raw.get('http_status', 0) if _tag_raw is mapping else 0 }}"
