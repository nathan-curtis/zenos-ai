        - choose:
          - conditions:
            - condition: template
              value_template: '{{ case_norm in ["ticket_link", "ticket_unlink"] }}'
            sequence:
            - variables:
                _link_type: >-
                  {%- set _lt = input_data.get('link_type', 'normal') | string | trim | lower if input_data is mapping else 'normal' -%}
                  {{ _lt if _lt in ['normal', 'parent', 'child'] else 'normal' }}
                _link_source_number: "{{ (_ticket_id | int + 10000) | string }}"
                _link_add_payload: >-
                  {{ {
                    'link_type': _link_type,
                    'link_object_source': 'Ticket',
                    'link_object_source_number': _link_source_number,
                    'link_object_target': 'Ticket',
                    'link_object_target_value': _target_id | int
                  } | tojson }}
                _link_remove_payload: >-
                  {{ {
                    'link_type': _link_type,
                    'link_object_source': 'Ticket',
                    'link_object_source_value': _ticket_id | int,
                    'link_object_target': 'Ticket',
                    'link_object_target_value': _target_id | int
                  } | tojson }}
            - action: script.zen_sutra_zammad
              response_variable: _link_raw
              continue_on_error: true
              data:
                action_type: "{{ 'delete' if case_norm == 'ticket_unlink' else 'post' }}"
                base_url: "{{ _base_url }}"
                request_timeout: "{{ _request_timeout }}"
                endpoint: "{{ 'links/remove' if case_norm == 'ticket_unlink' else 'links/add' }}"
                payload: "{{ _link_remove_payload if case_norm == 'ticket_unlink' else _link_add_payload }}"
            - variables:
                result:
                  status: "{{ _link_raw.get('status', 'error') if _link_raw is mapping else 'error' }}"
                  tool: Zen DojoTools Fulfillment
                  case: "{{ case_norm }}"
                  ticket_id: "{{ _ticket_id }}"
                  target_id: "{{ _target_id }}"
                  link_type: "{{ _link_type }}"
                  trace:
                    http_status: "{{ _link_raw.get('http_status', 0) if _link_raw is mapping else 0 }}"
                    caller_token: "{{ caller_token_norm }}"
            - stop: "{{ case_norm }} done"
              response_variable: result

        - choose:
          - conditions:
            - condition: template
              value_template: '{{ case_norm == "customer_find" }}'
            sequence:
            - action: script.zen_sutra_zammad
              response_variable: _cust_raw
              continue_on_error: true
              data:
                action_type: get
                base_url: "{{ _base_url }}"
                request_timeout: "{{ _request_timeout }}"
                endpoint: "users/search?query={{ _query | urlencode }}&limit=10"
            - variables:
                _cust_content: "{{ _cust_raw.get('result', {}).get('content', []) if _cust_raw is mapping else [] }}"
                result:
                  status: "{{ _cust_raw.get('status', 'error') if _cust_raw is mapping else 'error' }}"
                  tool: Zen DojoTools Fulfillment
                  case: customer_find
                  query: "{{ _query }}"
                  customers: "{{ _cust_content if _cust_content is sequence else [] }}"
                  count: "{{ _cust_content | length if _cust_content is sequence else 0 }}"
                  ticket_create_hint: >-
                    {%- set _cl = _cust_content if _cust_content is sequence else [] -%}
                    {%- if _cl | length > 0 and (_cl | first) is mapping -%}
                      {%- set _fe = (_cl | first).get('email', '') -%}
                      {{ {'found': true, 'customer': _fe, 'note': 'Pass customer to ticket_create', 'next': {'case': 'ticket_create', 'add_to_input_json': {'customer': _fe}}} if _fe != '' else none }}
                    {%- else -%}
                      {{ {'found': false, 'note': 'No customer found — run customer_create to register', 'next': {'case': 'customer_create', 'input_json': {'email': _query if '@' in _query else '', 'first_name': _query if '@' not in _query else ''}}} }}
                    {%- endif -%}
                  trace:
                    http_status: "{{ _cust_raw.get('http_status', 0) if _cust_raw is mapping else 0 }}"
                    caller_token: "{{ caller_token_norm }}"
            - stop: customer_find done
              response_variable: result

        - choose:
          - conditions:
            - condition: template
              value_template: '{{ case_norm == "org_find" }}'
            sequence:
            - action: script.zen_sutra_zammad
              response_variable: _org_raw
              continue_on_error: true
              data:
                action_type: get
                base_url: "{{ _base_url }}"
                request_timeout: "{{ _request_timeout }}"
                endpoint: "organizations/search?query={{ _query | urlencode }}&limit=10"
            - variables:
                _org_content: "{{ _org_raw.get('result', {}).get('content', []) if _org_raw is mapping else [] }}"
                result:
                  status: "{{ _org_raw.get('status', 'error') if _org_raw is mapping else 'error' }}"
                  tool: Zen DojoTools Fulfillment
                  case: org_find
                  query: "{{ _query }}"
                  organizations: "{{ _org_content if _org_content is sequence else [] }}"
                  count: "{{ _org_content | length if _org_content is sequence else 0 }}"
                  trace:
                    http_status: "{{ _org_raw.get('http_status', 0) if _org_raw is mapping else 0 }}"
                    caller_token: "{{ caller_token_norm }}"
            - stop: org_find done
              response_variable: result

        - choose:
          - conditions:
            - condition: template
              value_template: '{{ case_norm == "org_create" }}'
            sequence:
            - variables:
                _oc_name: "{{ input_data.get('name', '') | string | trim if input_data is mapping else '' }}"
                _oc_note: "{{ input_data.get('note', '') | string | trim if input_data is mapping else '' }}"
            - variables:
                _oc_payload: >-
                  {%- set _ns = namespace(p={'name': _oc_name}) -%}
                  {%- if _oc_note != '' -%}{%- set _ns.p = _ns.p | combine({'note': _oc_note}) -%}{%- endif -%}
                  {{ _ns.p | tojson }}
            - action: script.zen_sutra_zammad
              response_variable: _oc_raw
              continue_on_error: true
              data:
                action_type: post
                base_url: "{{ _base_url }}"
                request_timeout: "{{ _request_timeout }}"
                endpoint: "organizations"
                payload: "{{ _oc_payload }}"
            - variables:
                _oc_content: "{{ _oc_raw.get('result', {}).get('content', {}) if _oc_raw is mapping else {} }}"
                result:
                  status: "{{ _oc_raw.get('status', 'error') if _oc_raw is mapping else 'error' }}"
                  tool: Zen DojoTools Fulfillment
                  case: org_create
                  organization: "{{ _oc_content }}"
                  org_id: "{{ _oc_content.get('id', none) if _oc_content is mapping else none }}"
                  trace:
                    http_status: "{{ _oc_raw.get('http_status', 0) if _oc_raw is mapping else 0 }}"
                    caller_token: "{{ caller_token_norm }}"
            - stop: org_create done
              response_variable: result

        - choose:
          - conditions:
            - condition: template
              value_template: '{{ case_norm == "workflow_context_get" }}'
            sequence:
            - variables:
                _wf_include_tags: "{{ input_data.get('include_tags', false) if input_data is mapping else false }}"
            - action: script.zen_sutra_zammad
              response_variable: _wf_states_raw
              continue_on_error: true
              data:
                action_type: get
                base_url: "{{ _base_url }}"
                request_timeout: "{{ _request_timeout }}"
                endpoint: "ticket_states"
            - action: script.zen_sutra_zammad
              response_variable: _wf_priorities_raw
              continue_on_error: true
              data:
                action_type: get
                base_url: "{{ _base_url }}"
                request_timeout: "{{ _request_timeout }}"
                endpoint: "ticket_priorities"
            - action: script.zen_sutra_zammad
              response_variable: _wf_groups_raw
              continue_on_error: true
              data:
                action_type: get
                base_url: "{{ _base_url }}"
                request_timeout: "{{ _request_timeout }}"
                endpoint: "groups"
            - action: script.zen_sutra_zammad
              response_variable: _wf_me_raw
              continue_on_error: true
              data:
                action_type: get
                base_url: "{{ _base_url }}"
                request_timeout: "{{ _request_timeout }}"
                endpoint: "users/me"
            - choose:
              - conditions:
                - condition: template
                  value_template: '{{ _wf_include_tags | bool }}'
                sequence:
                - action: script.zen_sutra_zammad
                  response_variable: _wf_tags_raw
                  continue_on_error: true
                  data:
                    action_type: get
                    base_url: "{{ _base_url }}"
                    request_timeout: "{{ _request_timeout }}"
                    endpoint: "tags"
            - variables:
                _wf_states_status: "{{ _wf_states_raw.get('http_status', 0) if _wf_states_raw is mapping else 0 }}"
                _wf_priorities_status: "{{ _wf_priorities_raw.get('http_status', 0) if _wf_priorities_raw is mapping else 0 }}"
                _wf_groups_status: "{{ _wf_groups_raw.get('http_status', 0) if _wf_groups_raw is mapping else 0 }}"
                _wf_me_status: "{{ _wf_me_raw.get('http_status', 0) if _wf_me_raw is mapping else 0 }}"
                _wf_tags_raw_safe: "{{ _wf_tags_raw if _wf_tags_raw is mapping else {} }}"
                _wf_tags_status: "{{ _wf_tags_raw_safe.get('http_status', 0) if _wf_tags_raw_safe is mapping else 0 }}"
                _wf_states_content: "{{ _wf_states_raw.get('result', {}).get('content', []) if _wf_states_raw is mapping else [] }}"
                _wf_priorities_content: "{{ _wf_priorities_raw.get('result', {}).get('content', []) if _wf_priorities_raw is mapping else [] }}"
                _wf_groups_content: "{{ _wf_groups_raw.get('result', {}).get('content', []) if _wf_groups_raw is mapping else [] }}"
                _wf_me_content: "{{ _wf_me_raw.get('result', {}).get('content', {}) if _wf_me_raw is mapping else {} }}"
                _wf_tags_content: "{{ _wf_tags_raw_safe.get('result', {}).get('content', []) if _wf_tags_raw_safe is mapping else [] }}"
                _wf_states: "{{ _wf_states_content if _wf_states_content is sequence and _wf_states_content is not string and _wf_states_content is not mapping else [] }}"
                _wf_priorities: "{{ _wf_priorities_content if _wf_priorities_content is sequence and _wf_priorities_content is not string and _wf_priorities_content is not mapping else [] }}"
                _wf_groups: "{{ _wf_groups_content if _wf_groups_content is sequence and _wf_groups_content is not string and _wf_groups_content is not mapping else [] }}"
                _wf_tags: "{{ _wf_tags_content if _wf_tags_content is sequence and _wf_tags_content is not string and _wf_tags_content is not mapping else [] }}"
                _wf_diagnostics: >-
                  {%- set ns = namespace(items=[]) -%}
                  {%- if _wf_states_status | int(0) == 403 -%}{%- set ns.items = ns.items + ['ticket_states forbidden: token needs ticket metadata visibility.'] -%}{%- endif -%}
                  {%- if _wf_priorities_status | int(0) == 403 -%}{%- set ns.items = ns.items + ['ticket_priorities forbidden: token needs ticket metadata visibility.'] -%}{%- endif -%}
                  {%- if _wf_groups_status | int(0) == 403 -%}{%- set ns.items = ns.items + ['groups forbidden: token needs admin.group or a configured static queue map for Radar queue discovery.'] -%}{%- endif -%}
                  {%- if _wf_me_status | int(0) == 401 -%}{%- set ns.items = ns.items + ['users/me unauthorized: check token expiry or credentials.'] -%}{%- endif -%}
                  {%- if _wf_me_status | int(0) == 403 -%}{%- set ns.items = ns.items + ['users/me forbidden: token cannot self-inspect; actor attribution may be limited.'] -%}{%- endif -%}
                  {%- if _wf_include_tags | bool and _wf_tags_status | int(0) == 403 -%}{%- set ns.items = ns.items + ['tags forbidden: tag metadata discovery is optional; ticket tag reads/writes may still work per ticket.'] -%}{%- endif -%}
                  {%- if ns.items | length == 0 -%}
                    {{ [] }}
                  {%- else -%}
                    {{ ns.items }}
                  {%- endif -%}
                _wf_ok: "{{ (_wf_states_status | int(0) >= 200 and _wf_states_status | int(0) < 300) or (_wf_priorities_status | int(0) >= 200 and _wf_priorities_status | int(0) < 300) or (_wf_groups_status | int(0) >= 200 and _wf_groups_status | int(0) < 300) or (_wf_me_status | int(0) >= 200 and _wf_me_status | int(0) < 300) }}"
                result:
                  status: "{{ 'success' if _wf_ok | bool else 'error' }}"
                  ok: "{{ _wf_ok | bool }}"
                  tool: Zen DojoTools Fulfillment
                  case: workflow_context_get
                  source: zammad_metadata
                  queues: "{{ _wf_groups }}"
                  tickets: []
                  views: []
                  overviews: []
                  metadata:
                    ticket_states: "{{ _wf_states }}"
                    ticket_priorities: "{{ _wf_priorities }}"
                    current_user: "{{ _wf_me_content if _wf_me_content is mapping else {} }}"
                    tags: "{{ _wf_tags if _wf_include_tags | bool else [] }}"
                    taxonomy:
                      groups: "Canonical Zammad queue entities for Radar."
                      overviews: "Saved Zammad view definitions; diagnostic/source material only, not queue identity."
                      synthetic_views: "Radar worklists assembled from groups plus ticket search."
                      workflows: "UI/form rules and ticket workflow context; not queues."
                      triggers_schedulers: "Automation rules that may update tickets; not queue sources."
                      macros: "One-click ticket actions for agents; not queue sources."
                    permissions:
                      minimum_practical:
                        - ticket.agent
                        - group access for Radar-visible groups
                        - admin.group for /api/v1/groups discovery, or a configured static queue map
                      optional_admin:
                        - object/metadata permissions for admin discovery endpoints
                        - tag metadata permission for global tag discovery
                  count: "{{ (_wf_states | length) + (_wf_priorities | length) + (_wf_groups | length) }}"
                  total_count: "{{ (_wf_states | length) + (_wf_priorities | length) + (_wf_groups | length) }}"
                  diagnostic: "{{ _wf_diagnostics }}"
                  error_detail:
                    ticket_states: "{{ _wf_states_content if _wf_states_status | int(0) >= 400 else none }}"
                    ticket_priorities: "{{ _wf_priorities_content if _wf_priorities_status | int(0) >= 400 else none }}"
                    groups: "{{ _wf_groups_content if _wf_groups_status | int(0) >= 400 else none }}"
                    users_me: "{{ _wf_me_content if _wf_me_status | int(0) >= 400 else none }}"
                    tags: "{{ _wf_tags_content if _wf_include_tags | bool and _wf_tags_status | int(0) >= 400 else none }}"
                  trace:
                    endpoints:
                      ticket_states: ticket_states
                      ticket_priorities: ticket_priorities
                      groups: groups
                      users_me: users/me
                      tags: "{{ 'tags' if _wf_include_tags | bool else none }}"
                    http_status:
                      ticket_states: "{{ _wf_states_status }}"
                      ticket_priorities: "{{ _wf_priorities_status }}"
                      groups: "{{ _wf_groups_status }}"
                      users_me: "{{ _wf_me_status }}"
                      tags: "{{ _wf_tags_status if _wf_include_tags | bool else none }}"
                    caller_token: "{{ caller_token_norm }}"
            - stop: workflow_context_get done
              response_variable: result

        - choose:
          - conditions:
            - condition: template
              value_template: '{{ case_norm == "queue_get" }}'
            sequence:
            - variables:
                _queue_source: "{{ input_data.get('source', 'groups') | string | trim | lower if input_data is mapping else 'groups' }}"
                _queue_endpoint: "{{ 'overviews' if _queue_source == 'overviews' else 'groups' }}"
                _queue_active_only: "{{ input_data.get('active_only', true) if input_data is mapping else true }}"
                _queue_include_counts: "{{ input_data.get('include_counts', false) if input_data is mapping else false }}"
            - action: script.zen_sutra_zammad
              response_variable: _queue_raw
              continue_on_error: true
              data:
                action_type: get
                base_url: "{{ _base_url }}"
                request_timeout: "{{ _request_timeout }}"
                endpoint: "{{ _queue_endpoint }}"
            - variables:
                _queue_content: "{{ _queue_raw.get('result', {}).get('content', []) if _queue_raw is mapping else [] }}"
                _queue_http_status: "{{ _queue_raw.get('http_status', 0) if _queue_raw is mapping else 0 }}"
                _queue_items: "{{ _queue_content if _queue_content is sequence and _queue_content is not string and _queue_content is not mapping else [] }}"
                _queue_active_items: >-
                  {%- if not (_queue_active_only | bool) -%}
                    {{ _queue_items }}
                  {%- else -%}
                    {%- set ns = namespace(items=[]) -%}
                    {%- for item in _queue_items if item is mapping -%}
                      {%- if item.get('active', true) | bool -%}
                        {%- set ns.items = ns.items + [item] -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {{ ns.items }}
                  {%- endif -%}
                _queue_error_detail: "{{ _queue_content if _queue_content is mapping else none }}"
                _queue_diagnostic: >-
                  {%- if _queue_http_status | int(0) == 403 and _queue_endpoint == 'groups' -%}
                    Zammad rejected GET /api/v1/groups. Queue entities are groups, but this endpoint requires admin.group permission. Grant the Service Desk token admin.group or use ticket_list/search as the non-admin operational queue.
                  {%- elif _queue_http_status | int(0) == 403 and _queue_endpoint == 'overviews' -%}
                    Zammad rejected GET /api/v1/overviews. Overviews are saved view definitions and require overview/agent permissions; they are not the canonical queue entity for Radar.
                  {%- elif _queue_http_status | int(0) >= 200 and _queue_http_status | int(0) < 300 -%}
                    {{ none }}
                  {%- else -%}
                    Queue lookup failed at /api/v1/{{ _queue_endpoint }}. Check token, DNS/base URL, and Zammad permissions.
                  {%- endif -%}
            - choose:
              - conditions:
                - condition: template
                  value_template: '{{ _queue_include_counts | bool }}'
                sequence:
                - action: script.zen_sutra_zammad
                  response_variable: _queue_counts_raw
                  continue_on_error: true
                  data:
                    action_type: get
                    base_url: "{{ _base_url }}"
                    request_timeout: "{{ _request_timeout }}"
                    endpoint: "tickets/search?query={{ ('state.name:new OR state.name:open' | urlencode) | replace('%20', '+') }}&page=1&per_page=1&expand=false&with_total_count=true"
            - variables:
                _queue_counts_raw_safe: "{{ _queue_counts_raw if _queue_counts_raw is mapping else {} }}"
                _queue_counts_content: "{{ _queue_counts_raw_safe.get('result', {}).get('content', {}) if _queue_counts_raw_safe is mapping else {} }}"
                _queue_counts_http_status: "{{ _queue_counts_raw_safe.get('http_status', 0) if _queue_counts_raw_safe is mapping else 0 }}"
                _queue_open_total_count: "{{ _queue_counts_content.get('tickets_count', 0) if _queue_counts_content is mapping else 0 }}"
                _queue_count_diagnostic: >-
                  {%- if not (_queue_include_counts | bool) -%}
                    {{ none }}
                  {%- elif _queue_counts_http_status | int(0) >= 200 and _queue_counts_http_status | int(0) < 300 -%}
                    {{ none }}
                  {%- else -%}
                    include_counts total lookup failed; queue list remains usable. Inspect trace.count_http_status.
                  {%- endif -%}
                _queue_final_diagnostic: >-
                  {%- if (_queue_diagnostic | string | trim) not in ['', 'None', 'none'] -%}
                    {{ _queue_diagnostic }}
                  {%- elif (_queue_count_diagnostic | string | trim) not in ['', 'None', 'none'] -%}
                    {{ _queue_count_diagnostic }}
                  {%- else -%}
                    {{ none }}
                  {%- endif -%}
                result:
                  status: "{{ _queue_raw.get('status', 'error') if _queue_raw is mapping else 'error' }}"
                  ok: "{{ _queue_http_status | int(0) >= 200 and _queue_http_status | int(0) < 300 }}"
                  tool: Zen DojoTools Fulfillment
                  case: queue_get
                  source: "{{ _queue_source if _queue_source in ['groups', 'overviews'] else 'groups' }}"
                  endpoint: "{{ _queue_endpoint }}"
                  queues: "{{ _queue_active_items if _queue_endpoint == 'groups' else [] }}"
                  tickets: []
                  views: []
                  overviews: "{{ _queue_active_items if _queue_endpoint == 'overviews' else [] }}"
                  metadata:
                    active_only: "{{ _queue_active_only | bool }}"
                    include_counts: "{{ _queue_include_counts | bool }}"
                    open_total_count: "{{ _queue_open_total_count }}"
                    count_scope: "all_groups_new_or_open"
                  count: "{{ _queue_active_items | length }}"
                  total_count: "{{ _queue_active_items | length }}"
                  error_detail: "{{ _queue_error_detail }}"
                  diagnostic: "{{ _queue_final_diagnostic }}"
                  trace:
                    http_status: "{{ _queue_http_status }}"
                    count_http_status: "{{ _queue_counts_http_status }}"
                    caller_token: "{{ caller_token_norm }}"
            - stop: queue_get done
              response_variable: result

        - choose:
          - conditions:
            - condition: template
              value_template: '{{ case_norm == "tickets_by_anchor" }}'
            sequence:
            - variables:
                _anc_type: "{{ input_data.get('anchor_type', '') | string | trim | lower if input_data is mapping else '' }}"
                _anc_raw_ids: "{{ input_data.get('anchor_ids', []) if input_data is mapping else [] }}"
                _anc_limit: "{{ input_data.get('limit', 25) | int(25) if input_data is mapping else 25 }}"
            - variables:
                _anc_ids: >-
                  {%- if _anc_raw_ids is sequence and _anc_raw_ids is not string -%}
                    {{ _anc_raw_ids | list }}
                  {%- elif _anc_raw_ids is string and _anc_raw_ids | trim != '' -%}
                    {{ _anc_raw_ids | trim | split(',') | map('trim') | reject('equalto', '') | list }}
                  {%- else -%}
                    {{ [] }}
                  {%- endif -%}
            - variables:
                _anc_query: >-
                  {%- if _anc_ids | length == 0 -%}
                    *
                  {%- else -%}
                    {%- set _ns = namespace(parts=[]) -%}
                    {%- for id in _anc_ids -%}
                      {%- set _ns.parts = _ns.parts + ['tags:' + id] -%}
                    {%- endfor -%}
                    {{ _ns.parts | join(' OR ') }}
                  {%- endif -%}
            - action: script.zen_sutra_zammad
              response_variable: _anc_raw
              continue_on_error: true
              data:
                action_type: get
                base_url: "{{ _base_url }}"
                request_timeout: "{{ _request_timeout }}"
                endpoint: "tickets/search?query={{ (_anc_query | urlencode) | replace('%20', '+') }}&per_page={{ _anc_limit }}"
            - variables:
                _anc_content: "{{ _anc_raw.get('result', {}).get('content', {}) if _anc_raw is mapping else {} }}"
            - variables:
                _anc_ticket_ids: "{{ _anc_content.get('tickets', []) if _anc_content is mapping else [] }}"
                _anc_assets: "{{ _anc_content.get('assets', {}).get('Ticket', {}) if _anc_content is mapping else {} }}"
                _anc_documents: >-
                  {%- set docs = namespace(items=[]) -%}
                  {%- for tid, t in _anc_assets.items() if _anc_assets is mapping and t is mapping -%}
                    {%- set _tid = t.get('id', tid) | string -%}
                    {%- set _tags = t.get('tags', []) if t.get('tags', []) is sequence and t.get('tags', []) is not string else [] -%}
                    {%- set _matched = namespace(ids=[]) -%}
                    {%- for aid in _anc_ids -%}
                      {%- if aid in _tags or (aid | string) in (t | string) -%}
                        {%- set _matched.ids = _matched.ids + [aid | string] -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {%- set _matched_ids = _matched.ids if _matched.ids | length > 0 else _anc_ids -%}
                    {%- set _anchors = namespace(items=[]) -%}
                    {%- for aid in _matched_ids -%}
                      {%- set _anchors.items = _anchors.items + [{
                        'type': _anc_type if _anc_type != '' else 'unknown',
                        'id': aid | string,
                        'confidence': 'explicit_tag',
                        'source': 'zammad_tag',
                        'provider': 'servicedesk'
                      }] -%}
                    {%- endfor -%}
                    {%- set docs.items = docs.items + [{
                      'id': _tid,
                      'title': '',
                      'title_redacted': true,
                      'summary': 'Service Desk ticket evidence',
                      'content_redacted': true,
                      'servicedesk': {
                        'ticket_id': _tid,
                        'number': t.get('number', ''),
                        'state_id': t.get('state_id', none),
                        'priority_id': t.get('priority_id', none),
                        'group_id': t.get('group_id', none),
                        'owner_id': t.get('owner_id', none),
                        'customer_id': t.get('customer_id', none),
                        'created_at': t.get('created_at', none),
                        'updated_at': t.get('updated_at', none),
                        'tags': _tags
                      },
                      'stack': {
                        'provider': 'servicedesk',
                        'object_type': 'ticket',
                        'source_id': _tid,
                        'evidence_id': 'servicedesk:ticket:' ~ _tid,
                        'lens_mode': 'tickets_by_anchor'
                      },
                      'anchor_contexts': _anchors.items,
                      'matched_anchor_ids': _matched_ids
                    }] -%}
                  {%- endfor -%}
                  {{ docs.items }}
                result:
                  status: "{{ _anc_raw.get('status', 'error') if _anc_raw is mapping else 'error' }}"
                  tool: Zen DojoTools Fulfillment
                  case: tickets_by_anchor
                  provider: servicedesk
                  anchor_ids: "{{ _anc_ids }}"
                  anchor_type: "{{ _anc_type if _anc_type != '' else none }}"
                  query: "{{ _anc_query }}"
                  ticket_ids: "{{ _anc_ticket_ids }}"
                  tickets: "{{ _anc_assets.values() | list if _anc_assets is mapping else [] }}"
                  count: "{{ _anc_content.get('tickets_count', _anc_ticket_ids | length) if _anc_content is mapping else 0 }}"
                  result:
                    count: "{{ _anc_documents | length }}"
                    documents: "{{ _anc_documents }}"
                    content_redacted: true
                  trace:
                    http_status: "{{ _anc_raw.get('http_status', 0) if _anc_raw is mapping else 0 }}"
                    caller_token: "{{ caller_token_norm }}"
            - stop: tickets_by_anchor done
              response_variable: result

        - choose:
          - conditions:
            - condition: template
              value_template: '{{ case_norm == "customer_create" }}'
            sequence:
            - variables:
                _cc_email: "{{ input_data.get('email', '') | string | trim if input_data is mapping else '' }}"
                _cc_first: "{{ input_data.get('first_name', '') | string | trim if input_data is mapping else '' }}"
                _cc_last: "{{ input_data.get('last_name', '') | string | trim if input_data is mapping else '' }}"
                _cc_phone: "{{ input_data.get('phone', '') | string | trim if input_data is mapping else '' }}"
            - variables:
                _cc_payload: >-
                  {%- set _ns = namespace(p={'email': _cc_email}) -%}
                  {%- if _cc_first != '' -%}{%- set _ns.p = _ns.p | combine({'firstname': _cc_first}) -%}{%- endif -%}
                  {%- if _cc_last != '' -%}{%- set _ns.p = _ns.p | combine({'lastname': _cc_last}) -%}{%- endif -%}
                  {%- if _cc_phone != '' -%}{%- set _ns.p = _ns.p | combine({'phone': _cc_phone}) -%}{%- endif -%}
                  {{ _ns.p | tojson }}
            - action: script.zen_sutra_zammad
              response_variable: _cc_raw
              continue_on_error: true
              data:
                action_type: post
                base_url: "{{ _base_url }}"
                request_timeout: "{{ _request_timeout }}"
                endpoint: "users"
                payload: "{{ _cc_payload }}"
            - variables:
                _cc_content: "{{ _cc_raw.get('result', {}).get('content', {}) if _cc_raw is mapping else {} }}"
                result:
                  status: "{{ _cc_raw.get('status', 'error') if _cc_raw is mapping else 'error' }}"
                  tool: Zen DojoTools Fulfillment
                  case: customer_create
                  customer: "{{ _cc_content }}"
                  customer_id: "{{ _cc_content.get('id', none) if _cc_content is mapping else none }}"
                  email: "{{ _cc_email }}"
                  ticket_create_hint:
                    note: Customer registered — pass email to ticket_create
                    customer: "{{ _cc_email }}"
                    next:
                      case: ticket_create
                      add_to_input_json:
                        customer: "{{ _cc_email }}"
                  trace:
                    http_status: "{{ _cc_raw.get('http_status', 0) if _cc_raw is mapping else 0 }}"
                    caller_token: "{{ caller_token_norm }}"
            - stop: customer_create done
              response_variable: result

      - conditions:
        - condition: template
          value_template: '{{ case_norm == "batch_update" }}'
        sequence:
        - variables:
            _bu_ids_raw: >-
              {%- set raw = input_data.get('ticket_ids', []) -%}
              {%- if raw is sequence and raw is not string -%}{{ raw | list }}
              {%- else -%}
                {%- set rs = raw | string | trim -%}
                {%- if rs[:1] == '[' -%}{{ rs | from_json | default([]) }}
                {%- else -%}{{ [] }}{%- endif -%}
              {%- endif -%}
            _bu_payload: >-
              {%- set _ns = namespace(p={}) -%}
              {%- set _t = input_data.get('title', '') | string | trim -%}
              {%- if _t != '' -%}{%- set _ns.p = _ns.p | combine({'title': _t}) -%}{%- endif -%}
              {%- set _st = input_data.get('state', '') | string | trim -%}
              {%- if _st != '' -%}{%- set _ns.p = _ns.p | combine({'state': _st}) -%}{%- endif -%}
              {%- set _pri = input_data.get('priority', '') | string | trim -%}
              {%- if _pri != '' -%}{%- set _ns.p = _ns.p | combine({'priority': _pri}) -%}{%- endif -%}
              {%- set _oid = input_data.get('organization_id', 0) | int(0) -%}
              {%- if _oid > 0 -%}{%- set _ns.p = _ns.p | combine({'organization_id': _oid}) -%}{%- endif -%}
              {%- set _bg = input_data.get('group', '') | string | trim -%}
              {%- if _bg != '' -%}{%- set _ns.p = _ns.p | combine({'group': _bg}) -%}{%- endif -%}
              {%- set _own = input_data.get('owner_id', 0) | int(0) -%}
              {%- if _own > 0 -%}{%- set _ns.p = _ns.p | combine({'owner_id': _own}) -%}{%- endif -%}
              {%- set _pt = input_data.get('pending_time', '') | string | trim -%}
              {%- if _pt != '' -%}{%- set _ns.p = _ns.p | combine({'pending_time': _pt}) -%}{%- endif -%}
              {{ _ns.p | tojson }}
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _bu_ids_raw | length == 0 or _bu_payload == '{}' }}"
            sequence:
            - variables:
                result:
                  status: error
                  tool: Zen DojoTools Fulfillment
                  case: batch_update
                  message: "ticket_ids (list) and at least one update field are required."
                  caller_token: "{{ caller_token_norm }}"
            - stop: batch_update validation failed
              response_variable: result
        - variables:
            _bu_results: []
        - repeat:
            for_each: "{{ _bu_ids_raw }}"
            sequence:
            - action: script.zen_dojotools_servicedesk
              response_variable: _bu_item_raw
              continue_on_error: true
              data:
                mode: ticket_update
                input_json: >-
                  {%- set _p = _bu_payload if _bu_payload is mapping else (_bu_payload | from_json | default({})) -%}
                  {{ _p | combine({'ticket_id': repeat.item | int}) | tojson }}
                caller_token: "{{ caller_token_norm }}"
            - variables:
                _bu_results: >-
                  {%- set _r = _bu_item_raw if _bu_item_raw is mapping else {'status': 'error', 'ticket_id': repeat.item} -%}
                  {{ _bu_results + [_r] }}
        - variables:
            _bu_succeeded: "{{ _bu_results | selectattr('status', 'eq', 'success') | list | length }}"
            _bu_failed: "{{ _bu_results | rejectattr('status', 'eq', 'success') | list | length }}"
        - variables:
            result:
              status: "{{ 'success' if _bu_failed | int == 0 else ('partial' if _bu_succeeded | int > 0 else 'error') }}"
              tool: Zen DojoTools Fulfillment
              case: batch_update
              total: "{{ _bu_ids_raw | length }}"
              succeeded: "{{ _bu_succeeded }}"
              failed: "{{ _bu_failed }}"
              results: "{{ _bu_results }}"
              caller_token: "{{ caller_token_norm }}"
        - stop: batch_update done
          response_variable: result

      - conditions:
        - condition: template
          value_template: '{{ case_norm == "object_attribute_create" }}'
        sequence:
        - variables:
            _oac_name: "{{ input_data.get('name', '') | string | trim if input_data is mapping else '' }}"
            _oac_display: "{{ input_data.get('display', '') | string | trim if input_data is mapping else '' }}"
            _oac_type: "{{ input_data.get('data_type', 'boolean') | string | trim if input_data is mapping else 'boolean' }}"
            _oac_object: "{{ input_data.get('object_type', 'Ticket') | string | trim if input_data is mapping else 'Ticket' }}"
            _oac_default: "{{ input_data.get('default', false) if input_data is mapping else false }}"
            _oac_position: "{{ input_data.get('position', 1600) | int if input_data is mapping else 1600 }}"
        - if: "{{ _oac_name == '' or _oac_display == '' }}"
          then:
          - variables:
              result:
                status: error
                tool: Zen DojoTools Fulfillment
                case: object_attribute_create
                message: "name and display are required."
                caller_token: "{{ caller_token_norm }}"
          - stop: object_attribute_create validation failed
            response_variable: result
        - action: script.zen_sutra_zammad
          response_variable: _oac_raw
          continue_on_error: true
          data:
            action_type: post
            base_url: "{{ _base_url }}"
            request_timeout: "{{ _request_timeout }}"
            endpoint: object_manager_attributes
            payload: >-
              {%- set _perm_key = 'admin.group' if _oac_object == 'Group' else ('admin.user' if _oac_object == 'User' else ('admin.organization' if _oac_object == 'Organization' else 'ticket.agent')) -%}
              {{
                {
                  'object': _oac_object,
                  'name': _oac_name,
                  'display': _oac_display,
                  'active': true,
                  'data_type': _oac_type,
                  'data_option': {
                    'default': _oac_default,
                    'null': true,
                    'min': 1,
                    'max': 999999999
                  } if _oac_type == 'integer' else {
                    'default': _oac_default,
                    'options': {'true': 'Yes', 'false': 'No'} if _oac_type == 'boolean' else {}
                  },
                  'editable': true,
                  'position': _oac_position,
                  'screens': {
                    'create': {_perm_key: {'shown': true, 'required': false}},
                    'edit': {_perm_key: {'shown': true, 'required': false}},
                    'view': {_perm_key: {'shown': true}}
                  }
                } | tojson
              }}
        - if: "{{ not (_oac_raw is mapping and _oac_raw.get('status') == 'success') }}"
          then:
          - variables:
              result:
                status: error
                tool: Zen DojoTools Fulfillment
                case: object_attribute_create
                message: "Failed to create attribute. Token needs admin.object + admin.group (for Group objects). Confirm token was regenerated after role changes."
                http_status: "{{ _oac_raw.get('http_status', 0) if _oac_raw is mapping else 0 }}"
                error_detail: "{{ (_oac_raw.get('result', {}) or {}).get('content', {}) if _oac_raw is mapping else '' }}"
                caller_token: "{{ caller_token_norm }}"
          - stop: object_attribute_create failed
            response_variable: result
        - action: script.zen_sutra_zammad
          response_variable: _oac_migrate_raw
          continue_on_error: true
          data:
            action_type: post
            base_url: "{{ _base_url }}"
            request_timeout: "{{ _request_timeout }}"
            endpoint: object_manager_attributes_execute_migrations
            payload: "{}"
        - variables:
            result:
              status: success
              tool: Zen DojoTools Fulfillment
              case: object_attribute_create
              object_type: "{{ _oac_object }}"
              attribute: "{{ (_oac_raw.get('result', {}).get('content', {}) if _oac_raw is mapping else {}) }}"
              migrations_executed: "{{ _oac_migrate_raw.get('status') == 'success' if _oac_migrate_raw is mapping else false }}"
              caller_token: "{{ caller_token_norm }}"
        - stop: object_attribute_create done
          response_variable: result

      - conditions:
        - condition: template
          value_template: '{{ case_norm == "radar_setup" }}'
        sequence:
        - variables:
            _rs_action: "{{ input_data.get('action', 'init') | string | trim | lower if input_data is mapping else 'init' }}"
            _rs_house_email: "{{ input_data.get('house_email', '') | string | trim if input_data is mapping else '' }}"
            _rs_dev_email: "{{ input_data.get('dev_email', '') | string | trim if input_data is mapping else '' }}"

        # --- action=init ---
        - if: "{{ _rs_action == 'init' }}"
          then:

          # 1. Find or create house persona
          - action: script.zen_sutra_zammad
            response_variable: _rs_house_find_raw
            continue_on_error: true
            data:
              action_type: get
              base_url: "{{ _base_url }}"
              request_timeout: "{{ _request_timeout }}"
              endpoint: "users/search?query={{ _rs_house_email | urlencode }}&limit=5"
          - variables:
              _rs_house_found: "{{ _rs_house_find_raw.get('result', {}).get('content', []) if _rs_house_find_raw is mapping else [] }}"
              _rs_house_id: >-
                {%- set hits = _rs_house_find_raw.get('result', {}).get('content', []) if _rs_house_find_raw is mapping else [] -%}
                {%- set hits = hits if hits is sequence else [] -%}
                {{ (hits | selectattr('email', 'defined') | selectattr('email', 'eq', _rs_house_email) | list | first or {}).get('id', none) }}

          - if: "{{ _rs_house_id is none or _rs_house_id == 'None' }}"
            then:
            - action: script.zen_sutra_zammad
              response_variable: _rs_house_create_raw
              continue_on_error: true
              data:
                action_type: post
                base_url: "{{ _base_url }}"
                request_timeout: "{{ _request_timeout }}"
                endpoint: users
                payload: >-
                  {{ {'email': _rs_house_email, 'firstname': 'Household', 'lastname': 'Curtis Place', 'roles': ['Customer']} | tojson }}
            - variables:
                _rs_house_id: "{{ (_rs_house_create_raw.get('result', {}).get('content', {}) or {}).get('id', none) if _rs_house_create_raw is mapping else none }}"
                _rs_house_status: "{{ 'created' if _rs_house_id not in [none, 'None'] else 'failed' }}"
            else:
            - variables:
                _rs_house_status: existing

          # 2. Find or create dev persona
          - action: script.zen_sutra_zammad
            response_variable: _rs_dev_find_raw
            continue_on_error: true
            data:
              action_type: get
              base_url: "{{ _base_url }}"
              request_timeout: "{{ _request_timeout }}"
              endpoint: "users/search?query={{ _rs_dev_email | urlencode }}&limit=5"
          - variables:
              _rs_dev_id: >-
                {%- set hits = _rs_dev_find_raw.get('result', {}).get('content', []) if _rs_dev_find_raw is mapping else [] -%}
                {%- set hits = hits if hits is sequence else [] -%}
                {{ (hits | selectattr('email', 'defined') | selectattr('email', 'eq', _rs_dev_email) | list | first or {}).get('id', none) }}

          - if: "{{ _rs_dev_id is none or _rs_dev_id == 'None' }}"
            then:
            - action: script.zen_sutra_zammad
              response_variable: _rs_dev_create_raw
              continue_on_error: true
              data:
                action_type: post
                base_url: "{{ _base_url }}"
                request_timeout: "{{ _request_timeout }}"
                endpoint: users
                payload: >-
                  {{ {'email': _rs_dev_email, 'firstname': 'ZenOS', 'lastname': 'Development', 'roles': ['Customer']} | tojson }}
            - variables:
                _rs_dev_id: "{{ (_rs_dev_create_raw.get('result', {}).get('content', {}) or {}).get('id', none) if _rs_dev_create_raw is mapping else none }}"
                _rs_dev_status: "{{ 'created' if _rs_dev_id not in [none, 'None'] else 'failed' }}"
            else:
            - variables:
                _rs_dev_status: existing

          # 3. Write radar_defaults cabinet drawer (system cabinet)
          - variables:
              _rs_sys_cab: "{{ states('sensor.zen_default_household_cabinet_resolved') }}"
              _rs_cab_vars: >-
                {{ state_attr(_rs_sys_cab, 'variables') | default({}, true) if _rs_sys_cab != '' else {} }}
              _rs_existing_defaults: >-
                {{ (_rs_cab_vars if _rs_cab_vars is mapping else {}).get('radar_defaults', {}) or {} }}
          - action: script.zen_dojotools_filecabinet
            response_variable: _rs_cab_write
            continue_on_error: true
            data:
              action_type: "{{ 'update' if 'radar_defaults' in (_rs_cab_vars if _rs_cab_vars is mapping else {}) else 'create' }}"
              force_action: true
              set_timestamp: true
              volume_entity_id:
                - "{{ _rs_sys_cab }}"
              key: radar_defaults
              value: >-
                {{
                  _rs_existing_defaults | combine({
                    'house_customer_id': _rs_house_id | int(0),
                    'dev_customer_id': _rs_dev_id | int(0)
                  }) | tojson
                }}
          - variables:
              result:
                status: "{{ 'success' if _rs_house_id not in [none, 'None'] and _rs_dev_id not in [none, 'None'] else 'partial' }}"
                tool: Zen DojoTools Fulfillment
                case: radar_setup
                action: init
                house_customer_id: "{{ _rs_house_id | int(0) }}"
                house_status: "{{ _rs_house_status | default('unknown') }}"
                dev_customer_id: "{{ _rs_dev_id | int(0) }}"
                dev_status: "{{ _rs_dev_status | default('unknown') }}"
                cabinet_written: "{{ _rs_cab_write.get('status') == 'success' if _rs_cab_write is mapping else false }}"
                caller_token: "{{ caller_token_norm }}"
          - stop: radar_setup init done
            response_variable: result

        # --- action=map_queue ---
        - if: "{{ _rs_action == 'map_queue' }}"
          then:
          - variables:
              _rs_mq_group_id: "{{ input_data.get('group_id', 0) | int(0) if input_data is mapping else 0 }}"
              _rs_mq_customer_id: "{{ input_data.get('customer_id', 0) | int(0) if input_data is mapping else 0 }}"
          - if: "{{ _rs_mq_group_id == 0 or _rs_mq_customer_id == 0 }}"
            then:
            - variables:
                result:
                  status: error
                  tool: Zen DojoTools Fulfillment
                  case: radar_setup
                  action: map_queue
                  message: "group_id and customer_id are required integers."
                  caller_token: "{{ caller_token_norm }}"
            - stop: radar_setup map_queue validation failed
              response_variable: result
          - action: script.zen_sutra_zammad
            response_variable: _rs_mq_raw
            continue_on_error: true
            data:
              action_type: put
              base_url: "{{ _base_url }}"
              request_timeout: "{{ _request_timeout }}"
              endpoint: "groups/{{ _rs_mq_group_id }}"
              payload: "{{ {'zen_default_customer': _rs_mq_customer_id} | tojson }}"
          - variables:
              _rs_mq_content: "{{ (_rs_mq_raw.get('result', {}) or {}).get('content', {}) if _rs_mq_raw is mapping else {} }}"
              _rs_mq_group_name: "{{ (_rs_mq_content.get('name', '') if _rs_mq_content is mapping else '') }}"
          # Write group_name→customer_id to radar_group_map cabinet drawer
          - variables:
              _rs_mq_hh_cab: "{{ states('sensor.zen_default_household_cabinet_resolved') }}"
              _rs_mq_hh_vars: "{{ state_attr(_rs_mq_hh_cab, 'variables') | default({}, true) if _rs_mq_hh_cab != '' else {} }}"
          - variables:
              _rs_mq_existing_map: >-
                {%- set _raw = (_rs_mq_hh_vars if _rs_mq_hh_vars is mapping else {}).get('radar_group_map', {}) -%}
                {%- set _v = _raw.get('value', _raw) if _raw is mapping and 'value' in _raw else _raw -%}
                {%- set _v = _v if _v is mapping else (_v | from_json(none) if _v is string and _v | trim not in ['','none','null','None'] else {}) -%}
                {{ _v if _v is mapping else {} }}
          - action: script.zen_dojotools_filecabinet
            response_variable: _rs_mq_map_write
            continue_on_error: true
            data:
              action_type: "{{ 'update' if 'radar_group_map' in (_rs_mq_hh_vars if _rs_mq_hh_vars is mapping else {}) else 'create' }}"
              force_action: true
              set_timestamp: true
              volume_entity_id:
                - "{{ _rs_mq_hh_cab }}"
              key: radar_group_map
              value: >-
                {{ _rs_mq_existing_map | combine({_rs_mq_group_name: _rs_mq_customer_id}) | tojson }}
          - variables:
              result:
                status: "{{ 'success' if _rs_mq_raw is mapping and _rs_mq_raw.get('status') == 'success' else 'error' }}"
                tool: Zen DojoTools Fulfillment
                case: radar_setup
                action: map_queue
                group_id: "{{ _rs_mq_group_id }}"
                customer_id: "{{ _rs_mq_customer_id }}"
                group_name: "{{ _rs_mq_group_name }}"
                map_written: "{{ _rs_mq_map_write.get('status') == 'success' if _rs_mq_map_write is mapping else false }}"
                http_status: "{{ _rs_mq_raw.get('http_status', 0) if _rs_mq_raw is mapping else 0 }}"
                caller_token: "{{ caller_token_norm }}"
          - stop: radar_setup map_queue done
            response_variable: result

        # --- action=set_org_default ---
        - if: "{{ _rs_action == 'set_org_default' }}"
          then:
          - variables:
              _rs_so_org_id: "{{ input_data.get('org_id', 0) | int(0) if input_data is mapping else 0 }}"
              _rs_so_customer_id: "{{ input_data.get('customer_id', 0) | int(0) if input_data is mapping else 0 }}"
          - if: "{{ _rs_so_org_id == 0 or _rs_so_customer_id == 0 }}"
            then:
            - variables:
                result:
                  status: error
                  tool: Zen DojoTools Fulfillment
                  case: radar_setup
                  action: set_org_default
                  message: "org_id and customer_id are required integers."
                  caller_token: "{{ caller_token_norm }}"
            - stop: radar_setup set_org_default validation failed
              response_variable: result
          - action: script.zen_sutra_zammad
            response_variable: _rs_so_raw
            continue_on_error: true
            data:
              action_type: put
              base_url: "{{ _base_url }}"
              request_timeout: "{{ _request_timeout }}"
              endpoint: "organizations/{{ _rs_so_org_id }}"
              payload: "{{ {'zen_default_customer': _rs_so_customer_id} | tojson }}"
          - variables:
              _rs_so_content: "{{ (_rs_so_raw.get('result', {}) or {}).get('content', {}) if _rs_so_raw is mapping else {} }}"
              result:
                status: "{{ 'success' if _rs_so_raw is mapping and _rs_so_raw.get('status') == 'success' else 'error' }}"
                tool: Zen DojoTools Fulfillment
                case: radar_setup
                action: set_org_default
                org_id: "{{ _rs_so_org_id }}"
                customer_id: "{{ _rs_so_customer_id }}"
                org_name: "{{ (_rs_so_content.get('name', '') if _rs_so_content is mapping else '') }}"
                http_status: "{{ _rs_so_raw.get('http_status', 0) if _rs_so_raw is mapping else 0 }}"
                caller_token: "{{ caller_token_norm }}"
          - stop: radar_setup set_org_default done
            response_variable: result

        # --- action=inspect_queue ---
        - if: "{{ _rs_action == 'inspect_queue' }}"
          then:
          - variables:
              _rs_iq_group_id: "{{ input_data.get('group_id', 0) | int(0) if input_data is mapping else 0 }}"
          - if: "{{ _rs_iq_group_id == 0 }}"
            then:
            - variables:
                result:
                  status: error
                  tool: Zen DojoTools Fulfillment
                  case: radar_setup
                  action: inspect_queue
                  message: "group_id is required."
                  caller_token: "{{ caller_token_norm }}"
            - stop: radar_setup inspect_queue validation failed
              response_variable: result
          - action: script.zen_sutra_zammad
            response_variable: _rs_iq_grp_raw
            continue_on_error: true
            data:
              action_type: get
              base_url: "{{ _base_url }}"
              request_timeout: "{{ _request_timeout }}"
              endpoint: "groups/{{ _rs_iq_group_id }}"
          - variables:
              _rs_iq_grp_raw_content: "{{ (_rs_iq_grp_raw.get('result', {}) or {}).get('content', {}) if _rs_iq_grp_raw is mapping else {} }}"
          - variables:
              _rs_iq_grp: "{{ _rs_iq_grp_raw_content if _rs_iq_grp_raw_content is mapping else {} }}"
          - variables:
              _rs_iq_cust_id: "{{ _rs_iq_grp.get('zen_default_customer', none) }}"
          - variables:
              result:
                status: "{{ 'success' if _rs_iq_grp_raw is mapping and _rs_iq_grp_raw.get('status') == 'success' else 'error' }}"
                tool: Zen DojoTools Fulfillment
                case: radar_setup
                action: inspect_queue
                group_id: "{{ _rs_iq_group_id }}"
                group_name: "{{ _rs_iq_grp.get('name', '') }}"
                zen_default_customer: "{{ _rs_iq_cust_id }}"
                wired: "{{ _rs_iq_cust_id is not none and _rs_iq_cust_id | int(0) > 0 }}"
                caller_token: "{{ caller_token_norm }}"
          - stop: radar_setup inspect_queue done
            response_variable: result

        - variables:
            result:
              status: error
              tool: Zen DojoTools Fulfillment
              case: radar_setup
              message: "Unknown action '{{ _rs_action }}'. Supported: init, map_queue, set_org_default, inspect_queue"
              caller_token: "{{ caller_token_norm }}"
        - stop: radar_setup unknown action
          response_variable: result

      - conditions:
        - condition: template
          value_template: '{{ case_norm == "ticket_assign" }}'
        sequence:
        - variables:
            _ta_ticket_id_raw: "{{ input_data.get('ticket_id', '') | string | trim if input_data is mapping else '' }}"
            _ta_owner: "{{ input_data.get('owner', '') | string | trim if input_data is mapping else '' }}"
        - if: "{{ _ta_ticket_id_raw == '' or _ta_owner == '' }}"
          then:
          - variables:
              result:
                status: error
                tool: Zen DojoTools Fulfillment
                case: ticket_assign
                message: "ticket_id and owner are required. owner accepts name, email, or person entity_id (person.*)."
                caller_token: "{{ caller_token_norm }}"
          - stop: ticket_assign validation failed
            response_variable: result
        # Resolve ticket_id (display 10xxx → raw id)
        - variables:
            _ta_ticket_id: >-
              {%- set n = _ta_ticket_id_raw | int(0) -%}
              {%- if n >= 10001 -%}{{ n - 10000 }}{%- else -%}{{ n }}{%- endif -%}
        # Resolve owner — person entity, email, or name
        - variables:
            _ta_owner_query: >-
              {%- if _ta_owner.startswith('person.') -%}
                {%- set _slug = _ta_owner | replace('person.', '', 1) -%}
                {%- set _fam_cab = states('sensor.zen_default_family_cabinet_resolved') -%}
                {%- set _fam_vars = state_attr(_fam_cab, 'variables') | default({}, true) -%}
                {%- set _fam_vars = _fam_vars if _fam_vars is mapping else {} -%}
                {%- set _hm_raw = _fam_vars.get('household_members', {}) -%}
                {%- set _hm = (_hm_raw.get('value', _hm_raw) if _hm_raw is mapping and 'value' in _hm_raw else _hm_raw) -%}
                {%- set _hm = _hm if _hm is mapping else (_hm | from_json(none) if _hm is string and _hm | trim not in ['','none','null','None'] else {}) -%}
                {%- set _members = _hm.get('members', {}) if _hm is mapping else {} -%}
                {%- set _member = _members.get(_slug, {}) -%}
                {%- set _email = _member.get('email', '') if _member is mapping else '' -%}
                {{ _email if _email != '' else _slug }}
              {%- else -%}
                {{ _ta_owner }}
              {%- endif -%}
        - action: script.zen_sutra_zammad
          response_variable: _ta_user_raw
          continue_on_error: true
          data:
            action_type: get
            base_url: "{{ _base_url }}"
            request_timeout: "{{ _request_timeout }}"
            endpoint: "users/search?query={{ _ta_owner_query | urlencode }}&limit=10"
        - variables:
            _ta_user_hits: >-
              {%- set _c = (_ta_user_raw.get('result', {}) or {}).get('content', []) if _ta_user_raw is mapping else [] -%}
              {{ _c if _c is sequence else [] }}
        - variables:
            _ta_user_match: >-
              {%- set hits = _ta_user_hits if _ta_user_hits is sequence else [] -%}
              {%- set by_email = hits | selectattr('email', 'defined') | selectattr('email', 'eq', _ta_owner_query) | list -%}
              {%- if by_email | length > 0 -%}
                {{ by_email | first }}
              {%- elif hits | length > 0 -%}
                {{ hits | first }}
              {%- else -%}
                {{ {} }}
              {%- endif -%}
        - variables:
            _ta_owner_id: "{{ (_ta_user_match.get('id', 0) if _ta_user_match is mapping else 0) | int(0) }}"
            _ta_owner_email: "{{ (_ta_user_match.get('email', '') if _ta_user_match is mapping else '') }}"
            _ta_owner_name: "{{ ((_ta_user_match.get('firstname', '') ~ ' ' ~ _ta_user_match.get('lastname', '')) | trim if _ta_user_match is mapping else '') }}"
        - if: "{{ _ta_owner_id == 0 }}"
          then:
          - variables:
              result:
                status: error
                tool: Zen DojoTools Fulfillment
                case: ticket_assign
                message: "Could not resolve owner '{{ _ta_owner }}' to a Zammad user. Try email or full name."
                query_used: "{{ _ta_owner_query }}"
                caller_token: "{{ caller_token_norm }}"
          - stop: ticket_assign owner not found
            response_variable: result
        # PUT owner_id onto ticket
        - action: script.zen_sutra_zammad
          response_variable: _ta_update_raw
          continue_on_error: true
          data:
            action_type: put
            base_url: "{{ _base_url }}"
            request_timeout: "{{ _request_timeout }}"
            endpoint: "tickets/{{ _ta_ticket_id }}"
            payload: "{{ {'owner_id': _ta_owner_id} | tojson }}"
        - variables:
            result:
              status: "{{ 'success' if _ta_update_raw is mapping and _ta_update_raw.get('status') == 'success' else 'error' }}"
              tool: Zen DojoTools Fulfillment
              case: ticket_assign
              ticket_id: "{{ _ta_ticket_id }}"
              owner_id: "{{ _ta_owner_id }}"
              owner_name: "{{ _ta_owner_name }}"
              owner_email: "{{ _ta_owner_email }}"
              http_status: "{{ _ta_update_raw.get('http_status', 0) if _ta_update_raw is mapping else 0 }}"
              caller_token: "{{ caller_token_norm }}"
        - stop: ticket_assign done
          response_variable: result

    - variables:
        result:
          status: error
          tool: Zen DojoTools Fulfillment
          case: "{{ case_norm }}"
          message: Unknown case. Use case=help to list available cases.
          caller_token: "{{ caller_token_norm }}"
    - stop: fulfillment unknown case
      response_variable: result

  zen_sutra_zammad:
    alias: Zen DojoTools Zammad Advanced (Internal)
    description: >
      Internal REST broker for Zammad. NOT MCP-exposed.
      Dispatches GET/POST/PUT to Zammad REST API v1.
    mode: parallel
    icon: mdi:server
    fields:
      action_type:
        name: Action Type
        description: HTTP method — get, post, put, delete
        selector:
          select:
            options: [get, post, put, delete]
        default: get
      base_url:
        name: Base URL
        description: Zammad base URL override (uses cabinet config if omitted)
        selector:
          text:
      endpoint:
        name: Endpoint
        description: API path after /api/v1/ (e.g., tickets, tickets/42)
        selector:
          text:
      payload:
        name: Payload
        description: JSON string for POST/PUT requests
        selector:
          text:
            multiline: true
      request_timeout:
        name: Request Timeout
        description: Zammad HTTP timeout in seconds. Clamped 10-90.
        selector:
          number:
            min: 10
            max: 90

    sequence:
    - variables:
        _action: "{{ action_type | default('get') | string | trim | lower }}"
        _endpoint: "{{ endpoint | default('') | string | trim | regex_replace('^/', '') }}"
        _payload: "{{ payload | default('{}') | string | trim }}"
        _base: "{{ base_url | default('') | string | trim }}"
        _timeout: >-
          {%- set sec = request_timeout | default(45) | int(45) -%}
          {{ [10, [sec, 90] | min] | max }}

    - choose:
      - conditions:
        - condition: template
          value_template: '{{ _action == "get" }}'
        sequence:
        - action: rest_command.zammad_rest_get
          response_variable: _raw
          continue_on_error: true
          data:
            base_url: "{{ _base }}"
            endpoint: "{{ _endpoint }}"
            request_timeout: "{{ _timeout }}"
      - conditions:
        - condition: template
          value_template: '{{ _action == "post" }}'
        sequence:
        - action: rest_command.zammad_rest_post
          response_variable: _raw
          continue_on_error: true
          data:
            base_url: "{{ _base }}"
            endpoint: "{{ _endpoint }}"
            payload: "{{ _payload }}"
            request_timeout: "{{ _timeout }}"
      - conditions:
        - condition: template
          value_template: '{{ _action == "put" }}'
        sequence:
        - action: rest_command.zammad_rest_put
          response_variable: _raw
          continue_on_error: true
          data:
            base_url: "{{ _base }}"
            endpoint: "{{ _endpoint }}"
            payload: "{{ _payload }}"
            request_timeout: "{{ _timeout }}"
      - conditions:
        - condition: template
          value_template: '{{ _action == "delete" }}'
        sequence:
        - action: rest_command.zammad_rest_delete
          response_variable: _raw
          continue_on_error: true
          data:
            base_url: "{{ _base }}"
            endpoint: "{{ _endpoint }}"
            payload: "{{ _payload }}"
            request_timeout: "{{ _timeout }}"

    - variables:
        _http_status: "{{ _raw.status | default(0) | int(0) if _raw is defined else 0 }}"
        _raw_defined: "{{ _raw is defined }}"
    - variables:
        _status: >-
          {%- if _http_status >= 200 and _http_status < 300 -%}success
          {%- elif _http_status == 401 -%}unauthorized
          {%- elif _http_status == 403 -%}forbidden
          {%- elif _http_status == 404 -%}not_found
          {%- elif _http_status >= 500 -%}server_error
          {%- elif _http_status >= 400 -%}client_error
          {%- elif _http_status == 0 and _raw_defined -%}unreachable
          {%- elif not _raw_defined -%}connection_throw
          {%- else -%}error{%- endif -%}
        _content: >-
          {%- if not _raw_defined -%}{{ {} }}
          {%- else -%}
            {%- set raw_c = _raw.content | default(none, true) -%}
            {%- if raw_c is mapping or (raw_c is sequence and raw_c is not string) -%}
              {{ raw_c }}
            {%- elif raw_c is string and raw_c | trim != '' -%}
              {{ raw_c | from_json | default({}) }}
            {%- else -%}{{ {} }}{%- endif -%}
          {%- endif -%}
        _error_class: >-
          {%- if not _raw_defined -%}connection_throw
          {%- elif _http_status == 0 -%}unreachable
          {%- elif _http_status == 401 -%}unauthorized
          {%- elif _http_status == 403 -%}forbidden
          {%- elif _http_status == 404 -%}not_found
          {%- elif _http_status >= 500 -%}server_error
          {%- elif _http_status >= 400 -%}client_error
          {%- else -%}none{%- endif -%}
    - variables:
        result:
          status: "{{ _status }}"
          http_status: "{{ _http_status }}"
          error_class: "{{ _error_class }}"
          request_timeout: "{{ _timeout }}"
          result:
            content: "{{ _content }}"
    - stop: zammad advanced done
      response_variable: result

###############################################################################
# ZEN AGENT QUEUE SYNC
# Polls Zammad for tickets tagged agent_queue + active persona slug, state=new.
# Writes thin summary to household_cabinet._zen_agent_queue_<slug>.
# Macro in zen_os_1.jinja reads this at prompt render time — silent if missing.
#
# Timer interval: household cabinet key _agent_queue_interval_minutes (default 10).
# Set via: zen_dojotools_filecabinet mode=write target=household
#           key=_agent_queue_interval_minutes value=<N>
###############################################################################

  zen_stack_radar:
    alias: Zen Stack Provider - Radar/Zammad (Internal)
    description: >
      Internal Stack provider handler for Zammad service desk. Provider-facing
      adapter for Library/Lens dispatch. Not intended as a public user tool.
      Use zen_dojotools_library section=stacks stack=radar mode=<verb>.
    mode: parallel
    max: 10
    fields:
      mode:
        name: Mode
        description: "tool_manifest | get | find | list | configure | by_anchor | help"
        selector:
          select:
            options:
            - tool_manifest
            - get
            - find
            - list
            - configure
            - by_anchor
            - help
        default: help
      input_json:
        name: Input JSON
        description: Structured JSON payload for the Stack operation.
        selector:
          text:
            multiline: true
      caller_token:
        name: Caller Token
        description: Opaque token passed through for correlation.
        selector:
          text:
    sequence:
    - variables:
        _mode_norm: '{{ mode | default("help") | string | trim | lower }}'
        _hh: '{{ states("sensor.zen_default_household_cabinet_resolved") }}'

    - choose:
      - conditions:
        - condition: template
          value_template: '{{ _mode_norm == "tool_manifest" }}'
        sequence:
        - action: script.zen_dojotools_filecabinet
          response_variable: _ic_fc_raw
          continue_on_error: true
          data:
            action_type: get
            volume_entity_id: '{{ _hh }}'
            path: integrations_config
        - variables:
            _base_url: >-
              {%- set _ic = _ic_fc_raw.get("value", {}) if _ic_fc_raw is mapping and _ic_fc_raw.get("status") == "success" else {} -%}
              {%- set _ic = _ic if _ic is mapping else {} -%}
              {{ _ic.get("fulfillment", {}).get("url", "") | string | trim }}
        - variables:
            _provider_response: >-
              {%- import "zenos_ai/zenos_manifest.jinja" as MF -%}
              {%- set _configured = _base_url != "" -%}
              {%- set _health = {"configured": _configured, "status": "ok" if _configured else "warn", "notes": [] if _configured else ["Zammad URL not configured — run Library section=stacks stack=radar mode=configure"]} -%}
              {{- MF.tool_manifest(
                tool="zen_stack_radar",
                display_name="Radar — Zammad Service Desk Stack",
                tier="dojotools",
                version="1.0.0",
                health=_health,
                required_labels=["radar"],
                optional_labels=["servicedesk", "tickets"],
                consumes=["label", "person", "area_id", "ticket"],
                returns=["ticket_evidence"],
                failure_policy="soft",
                content_policy="redacted_by_default",
                risk_class="read_redacted",
                security_act={"model": "rwxda", "required": "r", "allowed": ["r"], "denied": ["w", "x", "d", "a"], "note": "Lens provider returns redacted read evidence only."},
                modes={"lookup": "by_anchor", "manifest": "tool_manifest"},
                limitations=["Ticket content is redacted by default.", "Mutations require zen_dojotools_servicedesk directly."],
                evidence_shape={"tickets": {"id": "Zammad ticket id.", "title": "Ticket title.", "state": "Ticket state.", "anchor_contexts": "Typed anchor links on this ticket."}},
                icon="mdi:ticket-outline",
                color="red",
                caller_token=caller_token | default("")
              ) | from_json -}}
        - stop: radar lens manifest complete
          response_variable: _provider_response

    - variables:
        _radar_mode_map:
          get: ticket_get
          find: ticket_find
          list: ticket_list
          configure: configure
          by_anchor: tickets_by_anchor
        _svc_mode: '{{ _radar_mode_map.get(_mode_norm, _mode_norm) }}'
    - action: script.zen_dojotools_servicedesk
      response_variable: _radar_result
      continue_on_error: true
      data:
        mode: '{{ _svc_mode }}'
        input_json: >-
          {%- set raw = input_json | default("", true) -%}
          {%- if raw is mapping -%}{{ raw | tojson }}
          {%- elif raw is string and raw | trim != "" -%}{{ raw | trim }}
          {%- else -%}{{ {} | tojson }}{%- endif -%}
        caller_token: '{{ caller_token | default("") }}'
    - variables:
        _provider_response: >-
          {%- set r = _radar_result if _radar_result is mapping else {} -%}
          {%- set out = r | combine({
            "provider": "radar",
            "stack": "radar",
            "handler": "zen_stack_radar"
          }, recursive=true) -%}
          {{ out }}
    - stop: radar stack provider complete
      response_variable: _provider_response


automation:
  - id: zen_agent_queue_sync
    alias: Zen Agent Queue Sync
    description: >-
      Zen Agent Queue Sync 1.0.0. Polls Zammad for agent_queue tickets (state=new)
      for the active persona. Writes thin summary to household cabinet
      _zen_agent_queue_<slug>. Interval tunable via _agent_queue_interval_minutes
      household cabinet key (default 10 min).
    mode: single

    triggers:
      - trigger: time_pattern
        minutes: /1
        id: timer
      - trigger: state
        entity_id: input_text.zenos_persona_name
        id: persona_switch
      - trigger: event
        event_type: zen_event
        event_data:
          event:
            kind: agent_queue_refresh
        id: force_refresh

    conditions:
      - condition: template
        value_template: >-
          {%- if trigger.id in ['persona_switch', 'force_refresh'] -%}true
          {%- else -%}
            {%- set _hh = states('sensor.zen_default_household_cabinet_resolved') -%}
            {%- if _hh in ['', 'unknown', 'unavailable'] -%}false
            {%- else -%}
              {%- set _vars = state_attr(_hh, 'variables') | default({}, true) -%}
              {%- set _vars = _vars if _vars is mapping else {} -%}
              {%- set _iv_raw = _vars.get('_agent_queue_interval_minutes', {}) -%}
              {%- set _iv_raw = _iv_raw.get('value', _iv_raw) if _iv_raw is mapping else _iv_raw -%}
              {%- set _interval = _iv_raw | int(10) -%}
              {%- set _interval = [_interval, 1] | max -%}
              {{ now().minute % _interval == 0 }}
            {%- endif -%}
          {%- endif -%}

    actions:
      - variables:
          _household: "{{ states('sensor.zen_default_household_cabinet_resolved') }}"
          _persona_name: "{{ states('input_text.zenos_persona_name') | lower | trim }}"
          _slug: "{{ _persona_name | regex_replace('[^a-z].*', '') }}"

      - if: "{{ _household in ['', 'unknown', 'unavailable'] or _slug == '' }}"
        then:
          - stop: agent_queue_sync prereqs not met

      - variables:
          _aq_limit: >-
            {%- set _vars = state_attr(_household, 'variables') | default({}, true) -%}
            {%- set _vars = _vars if _vars is mapping else {} -%}
            {%- set _lv = _vars.get('_agent_queue_limit', {}) -%}
            {%- set _lv = _lv.get('value', _lv) if _lv is mapping else _lv -%}
            {{ [_lv | int(5), 1] | max }}

      # Query Zammad for agent_queue + slug + state=new via public servicedesk tool
      - action: script.zen_dojotools_servicedesk
        response_variable: _aq_raw
        continue_on_error: true
        data:
          mode: ticket_search
          query: "tags:agent_queue AND tags:{{ _slug }} AND state.name:new"
          per_page: "{{ _aq_limit }}"

      - variables:
          _aq_tickets: >-
            {%- set _r = _aq_raw if _aq_raw is mapping else {} -%}
            {%- set _tickets = _r.get('tickets', []) -%}
            {%- set _tickets = _tickets if _tickets is sequence else [] -%}
            {{ _tickets[:_aq_limit | int(5)] }}
      - variables:
          _aq_slim: >-
            {%- set ns = namespace(items=[]) -%}
            {%- for t in _aq_tickets if t is mapping -%}
              {%- set ns.items = ns.items + [{'id': t.id | int, 'number': t.number | string, 'title': t.title | string | truncate(80, true, '…')}] -%}
            {%- endfor -%}
            {{ {'count': ns.items | length, 'slug': _slug, 'tickets': ns.items, 'updated_at': now().isoformat()} | tojson }}

      # Write to household cabinet _zen_agent_queue_<slug>
      - action: script.zen_dojotools_filecabinet
        continue_on_error: true
        data:
          action_type: upsert
          mode: replace
          volume_entity_id: "{{ _household }}"
          key: "_zen_agent_queue_{{ _slug }}"
          value: "{{ _aq_slim }}"
          force_action: true
          caller_token: zen_agent_queue_sync
