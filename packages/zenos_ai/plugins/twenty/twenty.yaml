    # ── case: contact_update ──────────────────────────────────────────────────
    # Partial update (PATCH) — only fields actually passed get sent, existing
    # fields not named are left untouched. Use contact_find first for item_id.
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "contact_update" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ item_id_norm == "" }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  case: contact_update
