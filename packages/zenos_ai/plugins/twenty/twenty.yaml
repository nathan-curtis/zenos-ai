                  {%- set _ns = namespace(id='') -%}
                  {%- for e in _edges -%}
                    {%- if e is mapping and e.get('node', {}).get('name','') == 'issueDescription' -%}
                      {%- set _ns.id = e.get('node', {}).get('objectMetadataId', '') -%}
