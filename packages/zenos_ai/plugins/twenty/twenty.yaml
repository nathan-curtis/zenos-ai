            - condition: template
              value_template: '{{ _ps_resv_id != "" and "partyLabel" not in _ps_reservation_has }}'
            sequence:
            - action: script.zen_sutra_twenty
              response_variable: _ps_create_r2
              continue_on_error: true
              data:
                action_type: meta
                payload: >-
                  {%- set q = 'mutation CreateOneField($input: CreateOneFieldMetadataInput!) { createOneField(input: $input) { id name label type } }' -%}
                  {%- set v = {'input': {'field': {'objectMetadataId': _ps_resv_id, 'type': 'TEXT', 'name': 'partyLabel', 'label': 'Party Label', 'description': 'Freeform label for the party, e.g. \'Smith family — July\'.', 'isNullable': true}}} -%}
