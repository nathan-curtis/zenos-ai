          select:
            options:
            - configure
            - contact_find
            - contact_get
            - contact_create
            - contact_update
            - contact_delete
            - contact_note
            - company_find
            - company_get
            - company_create
            - company_update
            - company_delete
            - recent_activity
            - stays_create
            - stays_list
            - stay_create
            - stay_get
            - stays_active_list
            - stay_release
            - stay_delete
            - stay_amenity_add
            - stay_prep_check
            - checkout_status
            - stay_checkout_check
            - reservation_create
            - reservation_get
            - reservations_active_list
            - reservation_checkout
            - reservation_cancel
            - appt_create
            - appt_get
            - appts_active_list
            - appt_start
            - appt_complete
            - appt_no_show
            - appt_cancel
            - appt_delete
            - service_request_create
            - service_request_get
            - service_requests_active_list
            - service_request_resolve
            - service_request_delete
            - appointment_create
            - appointments_list
            - reminder_set
            - reminders_list
            - task_link
            - tasks_list
            - vendor_history
            - timeline
