        # id from the crm_schema cabinet stamp (Step 7 writes it on success)
        # over re-querying Twenty's metadata API — confirmed tonight that
        # Twenty's metadata read side lags/fails for querying a freshly
        # created custom object by objects(filter:...) (same eventual-
        # consistency class of issue seen with company_find on regular
        # records), so a live objects() re-query cannot be trusted as the
        # source of truth for "does this already exist." Recovery path if
        # the cache is empty: look up the known guestContactId field by
        # name (not by objectMetadataId) and read its parent id back —
        # fields(filter: {name: ...}) has proven reliable all session for
        # person/company; this reuses that same proven path instead of
        # objects(filter: {nameSingular: ...}), which is what's unreliable.
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _ps_stay_id_cached == "" }}'
            sequence:
            - action: script.zen_sutra_twenty
              response_variable: _ps_stay_obj_raw
              continue_on_error: true
              data:
                action_type: meta
