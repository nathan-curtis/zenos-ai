                  {%- set v = {'input': {'field': {'objectMetadataId': _ps_resv_id, 'type': 'SELECT', 'name': 'status', 'label': 'Status', 'description': 'Reservation lifecycle state.', 'options': [{'value': 'RESERVED', 'label': 'Reserved', 'color': 'blue', 'position': 0}, {'value': 'CHECKED_IN', 'label': 'Checked In', 'color': 'green', 'position': 1}, {'value': 'CHECKED_OUT', 'label': 'Checked Out', 'color': 'gray', 'position': 2}, {'value': 'CANCELLED', 'label': 'Cancelled', 'color': 'red', 'position': 3}, {'value': 'NO_SHOW', 'label': 'No Show', 'color': 'orange', 'position': 4}]}}} -%}
                  {{ {'query': q, 'variables': v} | tojson }}
            - variables:
