              {%- set _ns = namespace(out=[]) -%}
              {%- for co in _compf_list -%}
                {%- if co is mapping -%}
                  {%- set dom = co.get('domainName', {}) if co.get('domainName') is mapping else {} -%}
                  {%- set _ns.out = _ns.out + [{'id': co.get('id',''), 'name': co.get('name',''), 'domain': dom.get('primaryLinkUrl',''), 'employees': co.get('employees', none), 'created_at': co.get('createdAt','')}] -%}
