                  {{ {'query': q, 'variables': v} | tojson }}
            - variables:
                _ps_r1_raw: "{{ _ps_create_r1 | string }}"
                _ps_r1_ok: "{{ _ps_create_r1 is mapping and _ps_create_r1.get('status') == 'success' and 'errors' not in _ps_r1_raw }}"
                _ps_r1_conflict: "{{ 'already used by another field' in _ps_r1_raw }}"
