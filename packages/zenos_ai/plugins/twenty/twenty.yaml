              {%- if phone_norm != '' -%}{%- set d = d | combine({'phones': {'primaryPhoneNumber': phone_norm, 'primaryPhoneCallingCode': '+1', 'primaryPhoneCountryCode': 'US'}}) -%}{%- endif -%}
              {%- if company_id_norm != '' -%}{%- set d = d | combine({'companyId': company_id_norm}) -%}{%- endif -%}
              {{ d | tojson }}

        - action: script.zen_sutra_twenty
          response_variable: _cc_adv
          continue_on_error: true
          data:
            action_type: post
            endpoint: people
