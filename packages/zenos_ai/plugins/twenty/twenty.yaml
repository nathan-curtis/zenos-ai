            - action: script.zen_sutra_twenty
              response_variable: _ps_create_appt_obj
              continue_on_error: true
              data:
                action_type: meta
                payload: >-
                  {%- set q = 'mutation CreateOneObject($input: CreateOneObjectInput!) { createOneObject(input: $input) { id nameSingular namePlural } }' -%}
                  {%- set v = {'input': {'object': {'nameSingular': 'appointment', 'namePlural': 'appointments', 'labelSingular': 'Appointment', 'labelPlural': 'Appointments', 'icon': 'IconTool', 'description': 'Vendor appointment lifecycle (scheduled/in_progress/completed/no_show/cancelled) — ZenOS.'}}} -%}
                  {{ {'query': q, 'variables': v} | tojson }}
            - variables:
                _ps_appt_id_created: >-
                  {%- set _r = _ps_create_appt_obj if _ps_create_appt_obj is mapping else {} -%}
                  {%- set _c = _r.get('result', {}).get('content', {}) if _r.get('status') == 'success' else {} -%}
                  {%- set _c = _c if _c is mapping else {} -%}
                  {%- set _d = _c.get('data') -%}
                  {%- set _d = _d if _d is mapping else {} -%}
                  {%- set _o = _d.get('createOneObject') -%}
                  {%- set _o = _o if _o is mapping else {} -%}
                  {{ _o.get('id', '') }}
          default:
