            - kfc_manifest
            - help
            - tool_manifest
      block_on_overlap:
        description: "For stay_create/appt_create. Default false (warn but allow — households vary, sharing a room is often intentional). Set true to hard-block creation instead when the room already has an overlapping active record."
        selector:
          boolean:
      requires_followup:
        description: "For appt_complete only. Default false. Set true if the vendor did not fully resolve the issue — flags the appointment and the auto-written vendor_history note for follow-up."
        selector:
          boolean:
      request_type:
        description: "For service_request_create. HOUSEKEEPING / MAINTENANCE / CONCIERGE / OTHER — determines which backend fulfills it (HOUSEKEEPING -> Grocy chore, MAINTENANCE -> Radar ticket when configured, else base To Do). Default OTHER."
        selector:
          select:
            options:
              - HOUSEKEEPING
              - MAINTENANCE
              - CONCIERGE
              - OTHER
      item:
        description: Person name, email, or company name for search/create
        selector:
          text:
      item_id:
        description: Twenty UUID — bypasses name resolution
        selector:
          text:
      amenity:
        description: For stay_amenity_add — the mid-stay task title, e.g. "Fresh towels" or "Welcome basket".
        selector:
          text:
      day_offset:
        description: For stay_amenity_add — days after check-in this task is due. 0 = day of check-in.
        selector:
          number:
            min: 0
            max: 365
      first_name:
        description: Contact first name
        selector:
          text:
      last_name:
        description: Contact last name
        selector:
          text:
      email:
        description: Contact email address
        selector:
          text:
      phone:
        description: Contact phone number
        selector:
          text:
      address:
        description: "Street address for company_create. Single freetext line — e.g. '123 Main St, Suite 100, Anytown, TX 00000'. Stored as-is on the Twenty company's addressStreet1 field; city/state/postcode are not parsed out separately."
        selector:
          text:
      company:
        description: Company name to link to contact
        selector:
          text:
      company_id:
        description: Twenty company UUID — bypasses company name resolution
        selector:
          text:
      note_title:
        description: Note title (auto-generated from date if omitted)
        selector:
          text:
      note_body:
        description: Note body text — supports multi-line
        selector:
          text:
            multiline: true
      note_target_type:
        description: "Target entity type for note: person (default) or company"
        selector:
          select:
            options:
              - person
              - company
      limit:
        description: Max results returned (default 20, max 100)
        selector:
          number:
            min: 1
            max: 100
            mode: box
        default: 20
      lookahead_hours:
        description: "For stay_prep_check -- only RESERVED stays whose check-in falls within this many hours from now are prepped. Default 3."
        selector:
          number:
            min: 1
            max: 72
            mode: box
        default: 3
      start_date:
        description: ISO date or datetime — event start or range filter start
        selector:
          text:
      end_date:
        description: ISO date or datetime — event end or range filter end
        selector:
          text:
      summary:
        description: Event title (stays/appointments) or todo item name (reminders/tasks)
        selector:
          text:
      tags:
        description: 'Comma-separated ZenOS label slugs to apply (e.g. plumber,vendor,active)'
        selector:
          text:
      config_json:
        description: 'JSON dict for configure — keys: url, stays_label, appointments_label, reminders_label, tasks_label'
        selector:
          text:
            multiline: true
      area_id:
        description: HA area ID — area_vendors source, or tags a stay to a room
        selector:
          text:
      occupant_names:
        description: For stay_create — freeform comma-separated names of all occupants in the room for this stay (household is family/friends, not every occupant needs a Twenty Person contact).
        selector:
          text:
      party_label:
        description: For reservation_create — freeform label for the whole booking/party, e.g. 'Smith family — July'.
        selector:
          text:
      rooms_json:
        description: >-
          For reservation_create — JSON array of room bookings, one entry per room:
          [{"area_id":"guest_room","item_id":"<guest contact UUID>","start_date":"2026-08-01","end_date":"2026-08-03","occupant_names":"Jane, John","note":"..."}].
          item_id defaults to the reservation's primary item_id (item_id field) if omitted per-room.
        selector:
          text:
            multiline: true
      zone:
        description: HA zone name filter for people_home (default=home)
        selector:
          text:
      person_entity_id:
        description: HA person entity ID — e.g. person.member_name (used in person_link)
        selector:
          text:
      role:
        description: Job title / relationship role for contact_link (e.g. Mechanic, Electrician)
        selector:
          text:
      anchor_type:
        description: Lens anchor type — company or person (for stacks_by_anchor)
        selector:
          text:
      grocy_entity:
        description: 'Grocy entity for vendor_link — shopping_lists or shopping_locations'
        selector:
          text:
      grocy_id:
        description: Grocy record ID for vendor_link (integer)
        selector:
          number:
            min: 1
            max: 9999
            mode: box
      prefs:
        description: >-
          For guest_prefs_set — JSON string for a contact's guestPrefs field,
          e.g. '{"allergens":["peanut"],"music":{"genre":"jazz"},"spa":{"temp_f":102}}'.
          Extensible — any keys are stored as-is. Requires provision_schema to
          have created the guestPrefs field first.
        selector:
          text:
            multiline: true
      component:
        description: Optional kata_key filter for kfc_manifest (omit for all components).
        selector:
          text:

    sequence:
    - variables:
        tool_name: Zen DojoTools Rolodex
        tool_version: 1.13.3
        crm_schema_version: '1.6.0'
        case_norm: '{{ mode | default("help") | string | trim | lower }}'
        item_norm: '{{ item | default("") | string | trim }}'
        item_id_norm: '{{ item_id | default("") | string | trim }}'
        amenity_norm: '{{ amenity | default("") | string | trim }}'
        day_offset_norm: '{{ day_offset | default(0) | int(0) }}'
        first_name_norm: '{{ first_name | default("") | string | trim }}'
        last_name_norm: '{{ last_name | default("") | string | trim }}'
        email_norm: '{{ email | default("") | string | trim | lower }}'
        phone_norm: '{{ phone | default("") | string | trim }}'
        address_norm: '{{ address | default("") | string | trim }}'
        company_norm: '{{ company | default("") | string | trim }}'
        company_id_norm: '{{ company_id | default("") | string | trim }}'
        note_title_norm: '{{ note_title | default("") | string | trim }}'
        note_body_norm: '{{ note_body | default("") | string | trim }}'
        limit_norm: '{{ limit | default(20) | int(20) }}'
        # local->UTC conversion. Every downstream write (checkIn/checkOut
        # on stay/appointment/reservation) takes whatever string the caller
        # sends and Twenty stores it with a literal 'Z' (UTC) suffix appended
        # -- no conversion. A caller-intended local wall-clock time (which is
        # what "5pm" or "17:54" means to a human, and matches every existing
        # example in this file's own docstrings) would land hours off from
        # the intended real-world moment without this. Only applies when the string has a
        # TIME component (length > 10 or contains 'T') -- a bare date
        # ('2026-08-01') has no time-of-day to shift and is left untouched.
        # Only applies when the caller did NOT already supply an explicit
        # offset ('Z' suffix, or +/-HH:MM after the date portion) -- an
        # unambiguous input is never second-guessed. now().utcoffset() is the
        # CURRENT local<->UTC offset, not necessarily the offset at the
        # target date if it crosses a DST boundary relative to today -- a
        # known, accepted imprecision (at most ~1h), not a full timezone
        # library reimplementation in Jinja. This is the single normalization
        # point every downstream case (create/list/active_stay_prefs' own
        # lookahead override) already reads from, so the fix propagates
        # everywhere at once rather than needing five separate patches.
        start_date_norm: >-
          {%- set _raw = start_date | default("") | string | trim -%}
          {%- set _has_time = 'T' in _raw or _raw | length > 10 -%}
          {%- set _has_explicit_tz = _raw.endswith('Z') or ('+' in _raw[10:]) or ('-' in _raw[10:]) -%}
          {%- if _raw == "" or not _has_time or _has_explicit_tz -%}
            {{ _raw }}
          {%- else -%}
            {%- set _naive = as_datetime(_raw) -%}
            {{ (_naive - now().utcoffset()).isoformat() if _naive is not none else _raw }}
          {%- endif -%}
        end_date_norm: >-
          {%- set _raw = end_date | default("") | string | trim -%}
          {%- set _has_time = 'T' in _raw or _raw | length > 10 -%}
          {%- set _has_explicit_tz = _raw.endswith('Z') or ('+' in _raw[10:]) or ('-' in _raw[10:]) -%}
          {%- if _raw == "" or not _has_time or _has_explicit_tz -%}
            {{ _raw }}
          {%- else -%}
            {%- set _naive = as_datetime(_raw) -%}
            {{ (_naive - now().utcoffset()).isoformat() if _naive is not none else _raw }}
          {%- endif -%}
        summary_norm: '{{ summary | default("") | string | trim }}'
        tags_norm: '{{ tags | default("") | string | trim }}'
        occupant_names_norm: '{{ occupant_names | default("") | string | trim }}'
        party_label_norm: '{{ party_label | default("") | string | trim }}'
        rooms_json_norm: >-
          {%- set _rj = rooms_json | default('') -%}
          {%- if _rj is mapping or (_rj is sequence and _rj is not string) -%}{{ _rj }}
          {%- else -%}
            {%- set _rjs = _rj | string | trim -%}
            {{ (_rjs | from_json) if _rjs != '' and _rjs[:1] in ['[', '{'] else [] }}
          {%- endif -%}
        config_json_norm: >-
          {%- set _cjv = config_json | default('') -%}
          {%- if _cjv is mapping -%}{{ _cjv | tojson }}{%- else -%}{{ _cjv | string | trim }}{%- endif -%}
        area_id_norm: >-
          {%- if area_id is string -%}{{ area_id | trim }}
          {%- else -%}{{ '' }}{%- endif -%}
        zone_norm: '{{ zone | default("home") | string | trim | lower }}'
        note_target_type_norm: '{{ note_target_type | default("person") | string | trim | lower }}'
        person_entity_id_norm: '{{ person_entity_id | default("") | string | trim }}'
        role_norm: '{{ role | default("") | string | trim }}'
        anchor_type_norm: '{{ anchor_type | default("") | string | lower | trim }}'
        grocy_entity_norm: '{{ grocy_entity | default("") | string | trim | lower }}'
        grocy_id_norm: '{{ grocy_id | default(0) | int(0) }}'
        block_on_overlap_norm: '{{ block_on_overlap | default(false) | bool(false) }}'
        requires_followup_norm: '{{ requires_followup | default(false) | bool(false) }}'
        request_type_norm: '{{ request_type | default("OTHER") | string | trim | upper }}'
        prefs_norm: >-
          {%- if prefs is defined and prefs is mapping -%}
            {{ prefs | tojson }}
          {%- elif prefs is defined and prefs is string and prefs | trim not in ['', 'none', 'null'] -%}
            {{ prefs | trim }}
          {%- else -%}{{ '' }}{%- endif -%}
        cases:
          contact_find:
            intent: Search people by name or email
            needs: [item]
            optional: [limit]
            example: "{'mode':'contact_find','item':'Jane Smith'}"
          contact_get:
            intent: Full contact record + recent notes
            needs: [item_id]
            optional: []
            example: "{'mode':'contact_get','item_id':'uuid-here'}"
          contact_create:
            intent: Create a new contact
            needs: [first_name]
            optional: [last_name, email, phone, company_id]
            example: "{'mode':'contact_create','first_name':'Jane','last_name':'Doe','email':'jane@example.com'}"
          contact_update:
            intent: "Partial update (PATCH) — only fields actually passed are sent. Use contact_find first to get item_id."
            needs: [item_id]
            optional: [first_name, last_name, email, phone, company_id]
            example: "{'mode':'contact_update','item_id':'uuid-here','email':'new@example.com'}"
          contact_delete:
            intent: "Delete a contact. Twenty soft-deletes to trash (recoverable there for a retention window) — not an immediate hard purge."
            needs: [item_id]
            optional: []
            example: "{'mode':'contact_delete','item_id':'uuid-here'}"
          contact_note:
            intent: Add a note to a contact
            needs: [item_id, note_body]
            optional: [note_title]
            example: "{'mode':'contact_note','item_id':'uuid-here','note_body':'Discussed timeline.'}"
          company_find:
            intent: Search companies by name
            needs: [item]
            optional: [limit]
            example: "{'mode':'company_find','item':'Acme'}"
          company_get:
            intent: Company record + people list
            needs: [item_id]
            optional: []
            example: "{'mode':'company_get','item_id':'uuid-here'}"
          company_create:
            intent: Create a new company
            needs: [item]
            optional: [address (freetext street address, stored on Twenty's addressStreet1 field — no city/state/postcode parsing)]
            example: "{'mode':'company_create','item':'New Vendor LLC','address':'123 Main St, Anytown, TX'}"
          company_update:
            intent: "Partial update (PATCH) — only fields actually passed are sent, existing fields not named are left untouched. Use company_find first to get item_id."
            needs: [item_id]
            optional: [item (new name), address (freetext street address, addressStreet1)]
            example: "{'mode':'company_update','item_id':'uuid-here','address':'456 New Addr, Anytown, TX'}"
          company_delete:
            intent: "Delete a company. Twenty soft-deletes to trash (recoverable there for a retention window) — not an immediate hard purge."
            needs: [item_id]
            optional: []
            example: "{'mode':'company_delete','item_id':'uuid-here'}"
          recent_activity:
            intent: Recent notes across all contacts
            needs: []
            optional: [limit]
            example: "{'mode':'recent_activity','limit':10}"
          configure:
            intent: Set Twenty URL + CRM routing labels in cabinet; inspect current config if no config_json
            needs: []
            optional: [config_json]
            example: "{'mode':'configure','config_json':'{\"url\":\"http://your-twenty-host:3000\"}'}"
          stays_create:
            intent: Create a guest stay event on the crm_stays calendar
            needs: [summary, start_date]
            optional: [end_date, item_id, note_body, area_id]
            example: "{'mode':'stays_create','summary':'Guest: Jane','start_date':'2026-06-10','end_date':'2026-06-12','area_id':'guest_room'}"
          stays_list:
            intent: List stay events from the crm_stays calendar; filter by area_id if provided
            needs: []
            optional: [start_date, end_date, area_id]
            example: "{'mode':'stays_list','start_date':'2026-06-01','end_date':'2026-06-30'}"
          stay_create:
            intent: "Check-in — create a structured stay record on the 'stay' custom object (reserved/active/released lifecycle). Distinct from the calendar-based stays_create. status auto-set: RESERVED if start_date is in the future, else ACTIVE. area_id is hard-validated against real HA areas (blocks on typo/unknown room). Overlapping stays in the same room are NOT blocked by default — sharing a room is a valid household choice — but surfaced as a warning + overlapping_stays list. Set block_on_overlap=true to hard-block instead."
            needs: [item_id (guest contact UUID — use contact_find/contact_create first), area_id, start_date]
            optional: [end_date, note_body]
            example: "{'mode':'stay_create','item_id':'contact-uuid','area_id':'guest_room','start_date':'2026-08-01'}"
          stay_get:
            intent: Full stay record by id (guest, room, dates, lifecycle status, turnover_spawned + prep_spawned flags).
            needs: [item_id (stay UUID)]
            optional: []
            example: "{'mode':'stay_get','item_id':'stay-uuid'}"
          stays_active_list:
            intent: "Front-desk view — every stay not yet RELEASED (RESERVED + ACTIVE). Optional area_id scopes to one room."
            needs: []
            optional: [area_id, limit]
            example: "{'mode':'stays_active_list','area_id':'guest_room'}"
          stay_release:
            intent: "Checkout + turnover dispatch. Idempotent (already-released stays are a no-op). Sets status=RELEASED, spawns a Taskmaster chore (upgraded to deep-clean for allergen guests or stays >=3 nights), and spawns a hot tub recheck chore if the amenity was active during the stay. Never auto-creates a Radar ticket — housekeeping escalates manually if something's actually broken."
            needs: [item_id (stay UUID)]
            optional: []
            example: "{'mode':'stay_release','item_id':'stay-uuid'}"
          stay_delete:
            intent: "Delete a stay record. Twenty soft-deletes to trash (recoverable there for a retention window) — not an immediate hard purge. Does not touch the guest contact or any chores already spawned by a prior stay_release."
            needs: [item_id (stay UUID)]
            optional: []
            example: "{'mode':'stay_delete','item_id':'stay-uuid'}"
          stay_amenity_add:
            intent: "Mid-stay housekeeping task (turndown, towel refresh, welcome basket) — distinct from the automatic checkout turnover chore stay_release spawns. Uses zen_dojotools_inventory tasks_add directly (a real dated, location-tied task) rather than Taskmaster, since this needs a specific future due date, not a recurring chore. day_offset is days after check-in (0 = day of check-in); warns (doesn't block) if the computed due date falls after checkout. One call per amenity — not a policy engine, call it once per item you want scheduled."
            needs: [item_id (stay UUID), amenity (task title)]
            optional: [day_offset (default 0), note_body]
            example: "{'mode':'stay_amenity_add','item_id':'stay-uuid','amenity':'Fresh towels','day_offset':3}"
          reservation_create:
            intent: "Book multiple rooms as one reservation-level record, each becoming its own member stay. Every room's area_id is validated against real HA areas up front — fails before creating anything if any room is bad, rather than partway through."
            needs: ["rooms_json (JSON array of {area_id, item_id, start_date, end_date, occupant_names, note} objects)"]
            optional: []
            example: "{'mode':'reservation_create','rooms_json':'[{\"area_id\":\"guest_room\",\"item_id\":\"contact-uuid\",\"start_date\":\"2026-08-01\",\"end_date\":\"2026-08-03\"}]'}"
          reservation_get:
            intent: Full reservation-level record — the booking, not an individual member stay.
            needs: [item_id (reservation UUID)]
            optional: []
            example: "{'mode':'reservation_get','item_id':'uuid-here'}"
          reservations_active_list:
            intent: "Who's here or arriving, at the reservation level (date-scoped — a reservation with a past checkout that was never explicitly released does not count as active)."
            needs: []
            optional: []
            example: "{'mode':'reservations_active_list'}"
          reservation_checkout:
            intent: "Reservation-level checkout — releases every member stay not yet RELEASED (each gets the same turnover-chore-dispatch + hot-tub-recheck logic stay_release runs, one room at a time), then marks the reservation itself checked out. Idempotent."
            needs: [item_id (reservation UUID)]
            optional: []
            example: "{'mode':'reservation_checkout','item_id':'uuid-here'}"
          reservation_cancel:
            intent: "Cancels the booking-level record only — does NOT touch child stays' own status or any chores already spawned. Cannot cancel a reservation already CHECKED_OUT; release/manage the individual stays instead."
            needs: [item_id (reservation UUID)]
            optional: []
            example: "{'mode':'reservation_cancel','item_id':'uuid-here'}"
          stay_prep_check:
            intent: "Arrival counterpart to stay_release — scans RESERVED stays and spawns a Taskmaster prep chore (guest name, check-in time, allergen/music/spa summary) plus a Postman notice for any check-in within lookahead_hours that hasn't been prepped yet. Idempotent via prepSpawned, same shape as turnoverSpawned. Scan operation, not single-stay — no item_id. Intended caller: a periodic automation, not a live agent request."
            needs: []
            optional: [lookahead_hours (default 3)]
            example: "{'mode':'stay_prep_check','lookahead_hours':3}"
          checkout_status:
            intent: "Read-only — 'is a departure approaching' as an agent-queryable fact, not just a background push. Lists ACTIVE stays with checkOut inside lookahead_hours (default 24 — a wide browsing window; call with a smaller value for 'leaving in the next hour' style questions). No side effects, no idempotency tracking — safe to call any time. Optional area_id scopes to one room."
            needs: []
            optional: [area_id, lookahead_hours (default 24)]
            example: "{'mode':'checkout_status','lookahead_hours':6}"
          stay_checkout_check:
            intent: "Departure counterpart to stay_prep_check — scans ACTIVE stays and spawns a one-off Taskmaster reminder task (chore=false, not a recurring chore) plus a Postman notice for any checkout within lookahead_hours that hasn't been nudged yet. Idempotent via checkoutNudgeSpawned. Does not replace stay_release — that still owns the actual turnover dispatch once checkout happens; this only nudges that it's approaching. Scan operation, not single-stay — no item_id. Intended caller: a periodic automation, not a live agent request."
            needs: []
            optional: [lookahead_hours (default 3)]
            example: "{'mode':'stay_checkout_check','lookahead_hours':3}"
          appt_create:
            intent: "Schedule a vendor appointment on the structured 'appointment' object (SCHEDULED lifecycle state). area_id hard-validated against real HA areas. Overlapping appointments in the same room warn (not block) by default — set block_on_overlap=true to hard-block instead."
            needs: [item_id (vendor contact/company UUID — use contact_find/company_find first), area_id, start_date]
            optional: [end_date, note_body (issue description), block_on_overlap]
            example: "{'mode':'appt_create','item_id':'vendor-uuid','area_id':'kitchen','start_date':'2026-08-01T10:00:00','note_body':'Fix AC unit'}"
          appt_get:
            intent: Full appointment record by id (vendor, room, scheduled window, lifecycle status, completion notes).
            needs: [item_id (appointment UUID)]
            optional: []
            example: "{'mode':'appt_get','item_id':'appt-uuid'}"
          appts_active_list:
            intent: "Everything not yet terminal (not COMPLETED/NO_SHOW/CANCELLED). Optional area_id scopes to one room."
            needs: []
            optional: [area_id, limit]
            example: "{'mode':'appts_active_list','area_id':'kitchen'}"
          appt_start:
            intent: "SCHEDULED -> IN_PROGRESS. Vendor actually arrived — distinct from just having been booked, matters for no-show tracking."
            needs: [item_id (appointment UUID)]
            optional: []
            example: "{'mode':'appt_start','item_id':'appt-uuid'}"
          appt_complete:
            intent: "Checkout for a vendor visit. Idempotent (already-completed is a no-op). Sets status=COMPLETED, stores completion_notes and requires_followup, and auto-writes a completion note to the vendor's vendor_history — closes the loop vendor_history already promised without a separate manual step."
            needs: [item_id (appointment UUID)]
            optional: [note_body (completion notes), requires_followup]
            example: "{'mode':'appt_complete','item_id':'appt-uuid','note_body':'Replaced capacitor.','requires_followup':false}"
          appt_no_show:
            intent: "Vendor never showed. Distinct terminal state from CANCELLED — a real signal worth tracking separately for vendor reliability."
            needs: [item_id (appointment UUID)]
            optional: []
            example: "{'mode':'appt_no_show','item_id':'appt-uuid'}"
          appt_cancel:
            intent: Appointment was cancelled before it happened.
            needs: [item_id (appointment UUID)]
            optional: []
            example: "{'mode':'appt_cancel','item_id':'appt-uuid'}"
          appt_delete:
            intent: "Delete an appointment record. Twenty soft-deletes to trash — not an immediate hard purge."
            needs: [item_id (appointment UUID)]
            optional: []
            example: "{'mode':'appt_delete','item_id':'appt-uuid'}"
          service_request_create:
            intent: "Log a guest service request on the 'serviceRequest' object. Shape-first routing through Taskmaster: HOUSEKEEPING -> Grocy chore, MAINTENANCE/CONCIERGE/OTHER -> general tracking (Radar when configured, else base To Do). area_id is OPTIONAL (not every request is room-scoped — WiFi, front door code); when given it's still hard-validated against real HA areas. linked_backend/linked_task_id in the response show which system actually owns the fulfillment."
            needs: [note_body (the request description)]
            optional: [item_id (guest contact UUID), area_id, request_type (HOUSEKEEPING/MAINTENANCE/CONCIERGE/OTHER, default OTHER)]
            example: "{'mode':'service_request_create','note_body':'Extra towels please','area_id':'guest_room','request_type':'HOUSEKEEPING'}"
          service_request_get:
            intent: Full service request record by id — guest, room (if any), type, status, and which backend/task actually fulfills it.
            needs: [item_id (service request UUID)]
            optional: []
            example: "{'mode':'service_request_get','item_id':'svcreq-uuid'}"
          service_requests_active_list:
            intent: "Everything not yet RESOLVED. Optional area_id scopes to one room (house-wide requests have no area and are always included)."
            needs: []
            optional: [area_id, limit]
            example: "{'mode':'service_requests_active_list','area_id':'guest_room'}"
          service_request_resolve:
            intent: "Mark a service request RESOLVED. Idempotent (already-resolved is a no-op). Does NOT auto-complete the underlying linked_task_id — that's a separate backend-native completion step (task_complete/chores_execute/ticket_close); resolving the guest-facing record is distinct from closing out the fulfilling work."
            needs: [item_id (service request UUID)]
            optional: [note_body (resolution notes)]
            example: "{'mode':'service_request_resolve','item_id':'svcreq-uuid','note_body':'Towels delivered.'}"
          service_request_delete:
            intent: "Delete a service request record. Twenty soft-deletes to trash — not an immediate hard purge."
            needs: [item_id (service request UUID)]
            optional: []
            example: "{'mode':'service_request_delete','item_id':'svcreq-uuid'}"
          appointment_create:
            intent: "Create a booking/appointment on the crm_appointments calendar. Optional area_id tags it to a room (same ha_area: convention as stays_create) — enables active_appointment / room_occupant_prefs vendor_activity lookups for that room."
            needs: [summary, start_date]
            optional: [end_date, item_id, note_body, area_id]
            example: "{'mode':'appointment_create','summary':'Plumber visit','start_date':'2026-06-15T10:00:00','area_id':'kitchen'}"
          appointments_list:
            intent: List appointments from the crm_appointments calendar; filter by area_id if provided
            needs: []
            optional: [start_date, end_date, area_id]
            example: "{'mode':'appointments_list','area_id':'kitchen'}"
          reminder_set:
            intent: Create a reminder todo linked to a contact/company
            needs: [summary]
            optional: [item_id, start_date]
            example: "{'mode':'reminder_set','summary':'Follow up re: quote','item_id':'uuid'}"
          reminders_list:
            intent: List reminders; optionally filter by linked contact/company id
            needs: []
            optional: [item_id, limit]
            example: "{'mode':'reminders_list','item_id':'uuid'}"
          task_link:
            intent: Create a task todo linked to a contact/company
            needs: [summary]
            optional: [item_id, start_date]
            example: "{'mode':'task_link','summary':'Send contract','item_id':'uuid'}"
          tasks_list:
            intent: List tasks; optionally filter by linked contact/company id
            needs: []
            optional: [item_id, limit]
            example: "{'mode':'tasks_list'}"
          tag_contact:
            intent: Apply ZenOS HA label slugs to a contact (haLabels field). Each slug dep-checked against HA label index. Run provision_schema first to create the field.
            needs: [item_id, tags]
            optional: []
            example: "{'mode':'tag_contact','item_id':'uuid','tags':'plumber,vendor'}"
          tag_company:
            intent: Apply ZenOS HA label slugs to a company (haLabels field). Each slug dep-checked against HA label index. Run provision_schema first to create the field.
            needs: [item_id, tags]
            optional: []
            example: "{'mode':'tag_company','item_id':'uuid','tags':'electrical,active_vendor'}"
          contacts_by_label:
            intent: Find contacts by HA label slug stored in ha_labels field
            needs: [item]
            optional: [limit]
            example: "{'mode':'contacts_by_label','item':'plumber'}"
          companies_by_label:
            intent: Find companies by HA label slug stored in ha_labels field
            needs: [item]
            optional: [limit]
            example: "{'mode':'companies_by_label','item':'active_vendor'}"
          provision_schema:
            intent: Idempotent deploy of ZenOS CRM schema to Twenty. Creates haLabels (TEXT) on People+Companies, haPersonId (TEXT) on People, and guestPrefs (TEXT, JSON string — allergens/music/spa/extensible) on People, if missing. Stamps crm_schema to cabinet. Safe to run again.
            needs: []
            optional: []
            example: "{'mode':'provision_schema'}"
          area_vendors:
            intent: Find vendor companies + contacts associated with an HA area via haLabels matching. Resolves area labels via inspect, then fans out to Twenty.
            needs: [area_id]
            optional: [item, limit]
            example: "{'mode':'area_vendors','area_id':'kitchen'}"
          person_link:
            intent: Link a Twenty contact to an HA person entity ID — stores haPersonId on the contact for live presence enrichment. Run provision_schema first.
            needs: [item_id, person_entity_id]
            optional: []
            example: "{'mode':'person_link','item_id':'uuid','person_entity_id':'person.member_name'}"
          contact_link:
            intent: Wire a person to a company with optional role + note in one call. "My mechanic at X" pattern — replaces three separate API calls.
            needs: [item_id, company_id]
            optional: [role, note_body]
            example: "{'mode':'contact_link','item_id':'person-uuid','company_id':'company-uuid','role':'Mechanic','note_body':'Primary contact for vehicle service.'}"
          people_home:
            intent: List HA persons in a zone (default=home); enriched with linked Twenty contact where haPersonId matches.
            needs: []
            optional: [zone]
            example: "{'mode':'people_home','zone':'home'}"
          stacks_by_anchor:
            intent: >-
              Lens bus provider entry point — return bounded CRM evidence for a company or person anchor.
              Consumed by zen_dojotools_lens_dispatch. content_redacted always true. anchor_type: company or person.
            needs: [item_id, anchor_type]
            optional: []
            example: "{'mode':'stacks_by_anchor','anchor_type':'company','item_id':'company-uuid'}"
          vendor_history:
            intent: List notes for a vendor/company (service history)
            needs: [item_id]
            optional: [limit]
            example: "{'mode':'vendor_history','item_id':'company-uuid','limit':20}"
          timeline:
            intent: Aggregated view — stays, appointments, notes, reminders, tasks sorted by date
            needs: []
            optional: [item_id, start_date, end_date, limit]
            example: "{'mode':'timeline','start_date':'2026-06-01','end_date':'2026-06-30'}"
          vendor_link:
            intent: Link a CRM company UUID to a Grocy shopping_list or shopping_location via crm_company_id userfield. Makes the vendor chain schema-level and permanent.
            needs: [item_id, grocy_entity, grocy_id]
            optional: []
            example: "{'mode':'vendor_link','item_id':'company-uuid','grocy_entity':'shopping_lists','grocy_id':8}"
          guest_prefs_set:
            intent: Write a contact's guestPrefs field (JSON string — allergens/music/spa/extensible). Run provision_schema first to create the field.
            needs: [item_id, prefs]
            optional: []
            example: "{'mode':'guest_prefs_set','item_id':'uuid','prefs':'{\"allergens\":[\"peanut\"],\"music\":{\"genre\":\"jazz\"}}'}"
          active_stay_prefs:
            intent: >-
              Is there a guest actively staying right now (optionally scoped to one room via area_id),
              and if so what are their guestPrefs? Finds the stay whose start/end window contains the
              current time (or start_date if given, as an "as of" override), extracts the linked
              contact via the stay's crm_link token, and returns guest_prefs alongside active/guest_name.
              active:false (not an error) when nothing is currently active. Read-only — the shared
              lookup other consumers (meal planning, media, spa) can build on.
            needs: []
            optional: [area_id, start_date]
            example: "{'mode':'active_stay_prefs','area_id':'guest_room'}"
          active_appointment:
            intent: >-
              Is a vendor/contact mid-appointment in this room right now (optionally scoped via
              area_id)? Finds the appointment whose start/end window contains the current time (or
              start_date if given, as an "as of" override), extracts the linked contact via the
              appointment's crm_link token, and resolves its name — tries Twenty companies first
              (the typical vendor case), falls back to people. active:false (not an error) when
              nothing's in progress there. A caution signal for automations, not a prefs source —
              see zen_dojotools_room_manager mode=room_occupant_prefs's vendor_activity field.
            needs: []
            optional: [area_id, start_date]
            example: "{'mode':'active_appointment','area_id':'kitchen'}"
          kfc_manifest:
            intent: Return KFC kata component definitions for Friday's dojo bootstrap scanner (zen_dojotools_manifest mode=bootstrap_kfc). Optional component filters to one kata_key.
            needs: []
            optional: [component]
            example: "{'mode':'kfc_manifest'}"

    # ── mode=tool_manifest ────────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "tool_manifest" }}'
        sequence:
        - variables:
            _tm_hh: "{{ states('sensor.zen_default_household_cabinet_resolved') }}"
        - variables:
            _tm_url: >-
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
              {%- set _ic_raw = CABS.cabinet_drawer_value(_tm_hh, 'integrations_config', {}) -%}
              {%- set _ic = _ic_raw if _ic_raw is mapping else (_ic_raw | from_json(none) if _ic_raw is string and _ic_raw | trim not in ('', 'null', 'None') else none) | default({}) -%}
              {%- set url = (_ic.get('twenty') or {}).get('url', '') | string | trim -%}
              {%- if url == '' -%}{{ states('input_text.twenty_url') | default('') | trim }}{%- else -%}{{ url }}{%- endif -%}
        - variables:
            result: >-
              {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
              {%- set _health = {'configured': _tm_url != '', 'status': 'ok' if _tm_url != '' else 'warn', 'notes': [] if _tm_url != '' else ['Twenty URL not configured — run mode=configure']} -%}
              {{- MF.tool_manifest(
                tool='zen_dojotools_rolodex',
                display_name='Rolodex — Contact & Company CRM',
                tier='dojotools',
                version='1.13.3',
                health=_health,
                required_labels=['crm', 'zen_kfc_provider'],
                optional_labels=['crm', 'contacts', 'companies', 'vendors'],
                consumes=['person', 'company', 'label', 'area_id', 'zone'],
                returns=['contact_evidence', 'company_evidence', 'timeline_evidence'],
                failure_policy='soft',
                content_policy='redacted_by_default',
                risk_class='read_redacted',
                modes={'lookup': 'contact_find', 'manifest': 'tool_manifest', 'kfc_manifest': 'Return KFC component definitions'},
                icon='mdi:contacts',
                color='indigo',
                stripe=3,
                impact='soft',
                mcp_exposed=true,
                caller_token=caller_token | default('')
              ) | from_json | combine({'kfc_manifest': true, 'kfc_components': ['rolodex']}) -}}
        - stop: rolodex tool manifest
          response_variable: result

    # ── mode=kfc_manifest ─────────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "kfc_manifest" }}'
        sequence:
        - variables:
            _kfc_filter: '{{ component | default("") | string | trim | lower }}'
            _kfc_defs:
            - kata_key: rolodex
              friendly_name: Rolodex — Guests & Vendors
              label: rolodex
              component_summary: ""
              component_instructions: >-
                SCOPE: Guest stays, vendor/contact CRM, appointments — Twenty CRM via Rolodex.
                  Guests: zen_dojotools_rolodex mode=stays_list / stays_create — a stay is a
                  calendar event on the crm_stays calendar, tagged to a contact (item_id) and a
                  room (area_id).
                  Contacts: mode=contact_find / contact_get — a guest's guestPrefs field (JSON:
                  allergens, music, spa, extensible) surfaces automatically in contact_get once
                  provision_schema has been run.
                  Active stay shortcut: mode=active_stay_prefs area_id=<room> — one call for "is a
                  guest staying in this room right now, and what are their prefs" (active:false when
                  not). Other tools (Kitchen's mealplan_suggest, media, spa) call this directly rather
                  than re-deriving stay/contact lookup themselves.
                  Active appointment shortcut: mode=active_appointment area_id=<room> — "is a
                  vendor/contact mid-appointment here right now" (active:false when not). A caution
                  signal for automations, not a prefs source — zen_dojotools_room_manager
                  mode=room_occupant_prefs surfaces this as vendor_activity alongside guest/household
                  prefs.
                  Vendors: mode=area_vendors area_id=<room> for who services a given room;
                  mode=vendor_history for service history; mode=vendor_link for the Grocy↔CRM
                  shopping list/location binding.

                DATA ACCESS:
                  Upcoming stays: mode=stays_list start_date=<today> — filters by area_id when given.
                  Guest profile: mode=contact_get item_id=<uuid> — returns guest_prefs alongside
                  name/email/phone/ha_labels.
                  Timeline: mode=timeline — stays, appointments, notes, reminders, tasks in one
                  aggregated view, optionally scoped to a contact via item_id.

                WHAT TO SURFACE:
                  1. Upcoming or in-progress stays — who, which room, arrival/departure.
                  2. Any guest_prefs worth acting on before/during a stay (allergens especially —
                     surface to Kitchen-facing conversations if a stay is active).
                  3. Vendor appointments scheduled against a room that's also hosting a stay.

                TRIGGER CONTEXT:
                  ha_start — no proactive stay summary needed; this is pull, not push, today.
                  force_summary — list active/upcoming stays and any flagged guest_prefs.

                NAVIGATION:
                  Stays: mode=stays_list / stays_create.
                  Contacts + prefs: mode=contact_find / contact_get / guest_prefs_set.
                  Vendors: mode=area_vendors / vendor_history / vendor_link.
                  Full case list: mode=help.

                TONE: Front-of-house, not casual — this is guest and vendor management, be precise
                  about names, rooms, and dates.
              trigger_subscriptions:
              - force_summary
              drift_threshold: 5
              emission_cooldown_minutes: 30
              delay_seconds: 0
              suggested_act_event: null
              seed: null
              master_switch: ""
              index_call:
                domain_inspect_domains: []
                domain_inspect_limit: 25
                expand_entities: false
                filter_json: {}
                label_1: rolodex
                label_2: ""
                operator: AND
                output_fields: ""
              meta:
                enabled: true
                requires:
                  cert: ""
                  level: 0
        - variables:
            _kfc_out: >-
              {%- if _kfc_filter == '' -%}
                {{ _kfc_defs }}
              {%- else -%}
                {{ _kfc_defs | selectattr('kata_key', 'equalto', _kfc_filter) | list }}
              {%- endif -%}
            result:
              status: ok
              tool: zen_dojotools_rolodex
              version: "1.13.3"
              mode: kfc_manifest
              kfc: '{{ _kfc_out }}'
              count: '{{ _kfc_out | length }}'
              caller_token: '{{ caller_token | default("") }}'
        - stop: kfc_manifest
          response_variable: result

    # ── mode=help ─────────────────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "help" }}'
        sequence:
        - variables:
            _help:
              status: info
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              mode: help
              description: >-
                Rolodex Prime — Organization is the right of all sentient beings.
                Contact + company CRM via Twenty. Property-ops: stays, appointments,
                reminders, tasks, vendor history, timeline. configure to bootstrap routing.
              cases: '{{ cases }}'
              api_quirks:
                noteTarget_fields: >-
                  Twenty noteTarget uses targetPersonId / targetCompanyId /
                  targetOpportunityId — NOT personId / companyId. Bare POST to
                  /noteTargets creates the record; set target via PATCH or inline
                  in /notes creation payload using the target* prefixed names.
                note_body_field: >-
                  Note body is bodyV2 (RICH_TEXT) — pass as
                  {blocknote: null, markdown: "text"}. The legacy "body" field
                  does not exist on this object.
        - stop: return
          response_variable: _help

    # ── case: contact_find ────────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "contact_find" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ item_norm == "" }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  case: contact_find
                  error: item (name or email) is required
            - stop: return
              response_variable: final_response

        - variables:
            _cf_filter: >-
              {%- set parts = item_norm.split(' ', 1) -%}
              {%- if '@' in item_norm -%}
                emails.primaryEmail[eq]:{{ item_norm }}
              {%- elif parts | length > 1 -%}
                or(name.firstName[ilike]:%{{ parts[0] }}%,name.lastName[ilike]:%{{ parts[1] }}%)
              {%- else -%}
                or(name.firstName[ilike]:%{{ item_norm }}%,name.lastName[ilike]:%{{ item_norm }}%)
              {%- endif -%}

        - action: script.zen_sutra_twenty
          response_variable: _cf_adv
          continue_on_error: true
          data:
            action_type: get
            endpoint: 'people?filter={{ _cf_filter }}&limit={{ limit_norm }}'

        - variables:
            _cf_ok: '{{ _cf_adv is mapping and _cf_adv.get("status") == "success" }}'
            _cf_body: >-
              {%- if _cf_adv is mapping and "result" in _cf_adv and "content" in _cf_adv["result"] -%}
                {{ _cf_adv["result"]["content"] }}
              {%- else -%}{{ {} }}{%- endif -%}

        - variables:
            _cf_list: >-
              {{ _cf_body.get('data', {}).get('people', []) if _cf_body is mapping else [] }}

        - variables:
            _cf_contacts: >-
              {%- set _ns = namespace(out=[]) -%}
              {%- for p in _cf_list -%}
                {%- if p is mapping -%}
                  {%- set nm = p.get('name', {}) if p.get('name') is mapping else {} -%}
                  {%- set em = p.get('emails', {}) if p.get('emails') is mapping else {} -%}
                  {%- set ph = p.get('phones', {}) if p.get('phones') is mapping else {} -%}
                  {%- set co = p.get('company', {}) if p.get('company') is mapping else {} -%}
                  {%- set _ns.out = _ns.out + [{
                    'id': p.get('id', ''),
                    'name': ((nm.get('firstName','') ~ ' ' ~ nm.get('lastName','')) | trim),
                    'email': em.get('primaryEmail',''),
                    'phone': ph.get('primaryPhoneNumber',''),
                    'company': co.get('name',''),
