          - conditions:
            - condition: template
              value_template: '{{ _ps_stay_id_existing == "" }}'
            sequence:
            - action: script.zen_sutra_twenty
              response_variable: _ps_create_obj
              continue_on_error: true
              data:
                action_type: meta
                payload: >-
                  {%- set q = 'mutation CreateOneObject($input: CreateOneObjectInput!) { createOneObject(input: $input) { id nameSingular namePlural } }' -%}
                  {%- set v = {'input': {'object': {'nameSingular': 'stay', 'namePlural': 'stays', 'labelSingular': 'Stay', 'labelPlural': 'Stays', 'icon': 'IconBed', 'description': 'Guest stay lifecycle (reserved/active/released) and turnover dispatch state — ZenOS.'}}} -%}
                  {{ {'query': q, 'variables': v} | tojson }}
            - variables:
                _ps_stay_id_created: >-
                  {%- set _r = _ps_create_obj if _ps_create_obj is mapping else {} -%}
                  {%- set _c = _r.get('result', {}).get('content', {}) if _r.get('status') == 'success' else {} -%}
                  {%- set _c = _c if _c is mapping else {} -%}
                  {%- set _d = _c.get('data') -%}
                  {%- set _d = _d if _d is mapping else {} -%}
                  {%- set _o = _d.get('createOneObject') -%}
                  {%- set _o = _o if _o is mapping else {} -%}
                  {{ _o.get('id', '') }}
          default:
          - variables:
              _ps_stay_id_created: ''
        - variables:
            _ps_stay_id: "{{ _ps_stay_id_existing if _ps_stay_id_existing != '' else _ps_stay_id_created }}"

        # Step 2c: existence check + create for the "appointment" custom
        # object — same cache-first pattern, same field-name recovery lookup,
