              error: '{{ none if (_cg_ok and _cg_p) else ("not found — HTTP " ~ _cg_adv.get("http_status","?") if _cg_adv is mapping else "broker error") }}'
        - stop: return
          response_variable: final_response

    # ── case: contact_create ──────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "contact_create" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ first_name_norm == "" and last_name_norm == "" }}'
