            sequence:
            - action: script.zen_sutra_twenty
              response_variable: _ps_create_r4
              continue_on_error: true
              data:
                action_type: meta
                payload: >-
                  {%- set q = 'mutation CreateOneField($input: CreateOneFieldMetadataInput!) { createOneField(input: $input) { id name label type } }' -%}
                  {%- set v = {'input': {'field': {'objectMetadataId': _ps_resv_id, 'type': 'TEXT', 'name': 'notes', 'label': 'Notes', 'description': 'Free text notes on the reservation.', 'isNullable': true}}} -%}
                  {{ {'query': q, 'variables': v} | tojson }}
            - variables:
                _ps_r4_raw: "{{ _ps_create_r4 | string }}"
                _ps_r4_ok: "{{ _ps_create_r4 is mapping and _ps_create_r4.get('status') == 'success' and 'errors' not in _ps_r4_raw }}"
