              response_variable: _ps_create_svc_obj
              continue_on_error: true
              data:
                action_type: meta
                payload: >-
                  {%- set q = 'mutation CreateOneObject($input: CreateOneObjectInput!) { createOneObject(input: $input) { id nameSingular namePlural } }' -%}
                  {%- set v = {'input': {'object': {'nameSingular': 'serviceRequest', 'namePlural': 'serviceRequests', 'labelSingular': 'Service Request', 'labelPlural': 'Service Requests', 'icon': 'IconBellRinging', 'description': 'Guest service request lifecycle (open/in_progress/resolved), routed to the underlying fulfilling backend — ZenOS.'}}} -%}
