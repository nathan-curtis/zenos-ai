              {%- if address_norm != "" -%}{%- set ns.f = ns.f | combine({"address": {"addressStreet1": address_norm}}) -%}{%- endif -%}
              {{ ns.f }}
        - if: "{{ _compu_fields | length == 0 }}"
          then:
          - variables:
              final_response:
                status: error
                tool: '{{ tool_name }}'
                version: '{{ tool_version }}'
                case: company_update
                error: "Nothing to update — pass at least one of item (name) or address."
          - stop: return
            response_variable: final_response

        - action: script.zen_sutra_twenty
          response_variable: _compu_adv
          continue_on_error: true
          data:
            action_type: patch
            endpoint: 'companies/{{ item_id_norm }}'
            payload: '{{ _compu_fields | tojson }}'

        - variables:
            _compu_ok: '{{ _compu_adv is mapping and _compu_adv.get("status") == "success" }}'
            _compu_body: >-
              {%- if _compu_adv is mapping and "result" in _compu_adv and "content" in _compu_adv["result"] -%}
                {{ _compu_adv["result"]["content"] }}
              {%- else -%}{{ {} }}{%- endif -%}

        - variables:
            _compu_result: '{{ _compu_body.get("data", {}).get("updateCompany", _compu_body.get("data", {})) if _compu_body is mapping else {} }}'

        - variables:
            final_response:
              status: '{{ "success" if _compu_ok and _compu_result is mapping and _compu_result.get("id","") != "" else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: company_update
              result:
                id: '{{ _compu_result.get("id","") if _compu_result is mapping else "" }}'
                name: '{{ _compu_result.get("name","") if _compu_result is mapping else "" }}'
                fields_updated: '{{ _compu_fields.keys() | list }}'
              error: '{{ none if (_compu_ok and _compu_result is mapping and _compu_result.get("id","") != "") else ("update failed — HTTP " ~ _compu_adv.get("http_status","?") if _compu_adv is mapping else "broker error") }}'
        - stop: return
          response_variable: final_response

    # ── case: company_delete ──────────────────────────────────────────────────
    # Twenty soft-deletes by default (moves to trash, recoverable there) rather
    # than a hard destructive delete — matches the DELETE verb's normal Twenty
    # REST behavior. No confirm gate here since Twenty's own trash/recovery is
    # the safety net; this is not a hard-delete API call.
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "company_delete" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ item_id_norm == "" }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  version: '{{ tool_version }}'
                  case: company_delete
                  error: item_id required. Use company_find first.
            - stop: return
              response_variable: final_response

        - action: script.zen_sutra_twenty
          response_variable: _compd_adv
          continue_on_error: true
          data:
            action_type: delete
            endpoint: 'companies/{{ item_id_norm }}'

        - variables:
            _compd_ok: '{{ _compd_adv is mapping and _compd_adv.get("status") == "success" }}'

        - variables:
            final_response:
              status: '{{ "success" if _compd_ok else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: company_delete
              result:
                id: '{{ item_id_norm }}'
                deleted: '{{ _compd_ok }}'
                note: "Twenty soft-deletes — record moves to trash, recoverable there for a retention window, not immediately purged."
              error: '{{ none if _compd_ok else ("delete failed — HTTP " ~ _compd_adv.get("http_status","?") if _compd_adv is mapping else "broker error") }}'
        - stop: return
          response_variable: final_response

    # ── case: recent_activity ─────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "recent_activity" }}'
        sequence:
        - action: script.zen_sutra_twenty
          response_variable: _ra_adv
          continue_on_error: true
          data:
            action_type: get
            endpoint: 'notes?order_by=createdAt[DescNullsLast]&limit={{ limit_norm }}'

        - variables:
            _ra_ok: '{{ _ra_adv is mapping and _ra_adv.get("status") == "success" }}'
            _ra_body: >-
              {%- if _ra_adv is mapping and "result" in _ra_adv and "content" in _ra_adv["result"] -%}
                {{ _ra_adv["result"]["content"] }}
              {%- else -%}{{ {} }}{%- endif -%}

        - variables:
            _ra_list: >-
              {{ _ra_body.get('data', {}).get('notes', []) if _ra_body is mapping else [] }}

        - variables:
            _ra_notes: >-
              {%- set _ns = namespace(out=[]) -%}
              {%- for n in _ra_list -%}
                {%- if n is mapping -%}
                  {%- set _ns.out = _ns.out + [{'id': n.get('id',''), 'title': n.get('title',''), 'body': (n.get('bodyV2', {}) or {}).get('markdown',''), 'created_at': n.get('createdAt','')}] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ _ns.out }}

        - variables:
            final_response:
              status: '{{ "success" if _ra_ok else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: recent_activity
              result:
                notes: '{{ _ra_notes }}'
                count: '{{ _ra_notes | length }}'
              error: '{{ none if _ra_ok else ("broker error — HTTP " ~ _ra_adv.get("http_status","?") if _ra_adv is mapping else "broker error") }}'
        - stop: return
          response_variable: final_response

    # ── case: configure ──────────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "configure" }}'
        sequence:
        - variables:
            _hh_cab: "{{ states('sensor.zen_default_household_cabinet_resolved') }}"

        - variables:
            _cfg_integrations: >-
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
              {{ CABS.cabinet_drawer_value(states('sensor.zen_default_household_cabinet_resolved'), 'integrations_config', {}) }}
            _cfg_crm: >-
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
              {{ CABS.cabinet_drawer_value(states('sensor.zen_default_household_cabinet_resolved'), 'crm_config', {}) }}

        # inspect path — no config_json provided
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ config_json_norm == "" }}'
            sequence:
            - variables:
                _cfg_inspect:
                  integrations_config: '{{ _cfg_integrations }}'
                  crm_config: '{{ _cfg_crm }}'
            - variables:
                final_response:
                  status: info
                  tool: '{{ tool_name }}'
                  version: '{{ tool_version }}'
                  case: configure
                  result: '{{ _cfg_inspect }}'
                  message: Pass config_json to write config. e.g. config_json='{"url":"http://your-twenty-host:3000"}'
            - stop: return
              response_variable: final_response

        # write path — parse config_json (handle dict or string input)
        - variables:
            _cfg_in: >-
              {%- set raw = config_json_norm -%}
              {%- if raw is mapping -%}
                {{ raw }}
              {%- elif raw is string and raw | trim != '' -%}
                {{ raw | from_json({}) }}
              {%- else -%}
                {{ {} }}
              {%- endif -%}

        - variables:
            _cfg_url: '{{ _cfg_in.get("url", "") | trim if _cfg_in is mapping else "" }}'
            _cfg_stays: '{{ _cfg_in.get("stays_label", "") | trim if _cfg_in is mapping else "" }}'
            _cfg_appts: '{{ _cfg_in.get("appointments_label", "") | trim if _cfg_in is mapping else "" }}'
            _cfg_reminders: '{{ _cfg_in.get("reminders_label", "") | trim if _cfg_in is mapping else "" }}'
            _cfg_tasks: '{{ _cfg_in.get("tasks_label", "") | trim if _cfg_in is mapping else "" }}'

        # test-connect if url provided
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _cfg_url != "" }}'
            sequence:
            - action: rest_command.twenty_rest_get
              response_variable: _cfg_test_raw
              continue_on_error: true
              data:
                base_url: '{{ _cfg_url | regex_replace("/$","") }}'
                endpoint: 'people?limit=1'
            - variables:
                _cfg_connected: '{{ _cfg_test_raw is defined and _cfg_test_raw.get("status", 0) | int(0) in [0, 200, 201] }}'
          default:
            - variables:
                _cfg_connected: false

        # read existing integrations_config
        - action: script.zen_dojotools_filecabinet
          response_variable: _ic_read
          continue_on_error: true
          data:
            action_type: read
            show_hidden_volumes: false
            volume_entity_id:
              - '{{ _hh_cab }}'
            key: integrations_config

        - variables:
            _ic_raw: >-
              {%- set r = _ic_read.get('result', {}) if _ic_read is mapping else {} -%}
              {%- set r = r if r is mapping else (r | from_json if r is string else {}) -%}
              {%- set v = r.get('integrations_config', {}) -%}
              {%- set v = v.get('value', v) if v is mapping else {} -%}
              {{ v if v is mapping else (v | from_json if v is string else {}) }}
            _ic_exists: >-
              {%- set r = _ic_read.get('result', {}) if _ic_read is mapping else {} -%}
              {%- set r = r if r is mapping else (r | from_json if r is string else {}) -%}
              {{ 'integrations_config' in r }}

        # build twenty entry
        - variables:
            _twenty_entry: >-
              {%- set existing = _ic_raw.get('twenty', {}) if _ic_raw is mapping else {} -%}
              {%- set upd = {} -%}
              {%- if _cfg_url != '' -%}{%- set upd = upd | combine({'url': _cfg_url}) -%}{%- endif -%}
              {%- if _cfg_connected -%}{%- set upd = upd | combine({'status': 'ok', 'tested_at': now().isoformat()}) -%}{%- endif -%}
              {{ existing | combine(upd, recursive=true) }}

        # write integrations_config
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _cfg_url != "" }}'
            sequence:
            - action: script.zen_dojotools_filecabinet
              response_variable: _ic_write
              continue_on_error: true
              data:
                action_type: "{{ 'update' if _ic_exists else 'create' }}"
                force_action: true
                set_timestamp: true
                show_hidden_volumes: false
                volume_entity_id:
                  - '{{ _hh_cab }}'
                key: integrations_config
                value: "{{ _ic_raw | combine({'twenty': _twenty_entry}, recursive=true) | tojson }}"

        # read + write crm_config if any labels provided
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _cfg_stays != "" or _cfg_appts != "" or _cfg_reminders != "" or _cfg_tasks != "" }}'
            sequence:
            - action: script.zen_dojotools_filecabinet
              response_variable: _cc_read
              continue_on_error: true
              data:
                action_type: read
                show_hidden_volumes: false
                volume_entity_id:
                  - '{{ _hh_cab }}'
                key: crm_config

            - variables:
                _cc_raw: >-
                  {%- set r = _cc_read.get('result', {}) if _cc_read is mapping else {} -%}
                  {%- set r = r if r is mapping else (r | from_json if r is string else {}) -%}
                  {%- set v = r.get('crm_config', {}) -%}
                  {%- set v = v.get('value', v) if v is mapping else {} -%}
                  {{ v if v is mapping else (v | from_json if v is string else {}) }}
                _cc_exists: >-
                  {%- set r = _cc_read.get('result', {}) if _cc_read is mapping else {} -%}
                  {%- set r = r if r is mapping else (r | from_json if r is string else {}) -%}
                  {{ 'crm_config' in r }}

            - variables:
                _cc_upd: >-
                  {%- set upd = {} -%}
                  {%- if _cfg_stays != '' -%}{%- set upd = upd | combine({'stays_label': _cfg_stays}) -%}{%- endif -%}
                  {%- if _cfg_appts != '' -%}{%- set upd = upd | combine({'appointments_label': _cfg_appts}) -%}{%- endif -%}
                  {%- if _cfg_reminders != '' -%}{%- set upd = upd | combine({'reminders_label': _cfg_reminders}) -%}{%- endif -%}
                  {%- if _cfg_tasks != '' -%}{%- set upd = upd | combine({'tasks_label': _cfg_tasks}) -%}{%- endif -%}
                  {{ _cc_raw | combine(upd, recursive=true) }}

            - action: script.zen_dojotools_filecabinet
              response_variable: _cc_write
              continue_on_error: true
              data:
                action_type: "{{ 'update' if _cc_exists else 'create' }}"
                force_action: true
                set_timestamp: true
                show_hidden_volumes: false
                volume_entity_id:
                  - '{{ _hh_cab }}'
                key: crm_config
                value: "{{ _cc_upd | tojson }}"

        # Register CRM provider through the central lens registry writer.
        - variables:
            _lr_crm_entry:
              provider: crm
              display_name: CRM / Twenty
              configured_by: crm
              department: crm
              enabled: true
              status: available
              tool: zen_stack_crm
              mode: stacks_by_anchor
              manifest_mode: tool_manifest
              consumes: [company, person]
              returns: [company_evidence, contact_evidence]
              failure_policy: soft
              content_policy: redacted_by_default
              risk_class: read_redacted
              security_act:
                model: rwxda
                required: r
                allowed: [r]
                denied: [w, x, d, a]
              more_info:
                tool: zen_stack_crm
                mode: tool_manifest

        - action: script.zen_admintools_prompt_loader
          response_variable: _lr_write
          continue_on_error: true
          data:
            mode: lens_registry
            action_type: register
            item: crm
            payload_json: "{{ _lr_crm_entry | tojson }}"
            caller_token: "{{ caller_token | default('crm_configure_lens_register') }}"

        - variables:
            _lr_write_status: >-
              {%- set r = _lr_write if _lr_write is mapping else {} -%}
              {%- set inner = r.get('result', r) if r is mapping else {} -%}
              {{ inner.get('status', r.get('status', 'error')) if inner is mapping else 'error' }}
            _lr_write_ok: "{{ _lr_write_status in ['success', 'ok', 'warning'] }}"
            final_response:
              status: "{{ 'success' if _lr_write_ok else 'error' }}"
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: configure
              result:
                twenty_connected: '{{ _cfg_connected }}'
                url_stored: '{{ _cfg_url != "" }}'
                labels_stored: '{{ _cfg_stays != "" or _cfg_appts != "" or _cfg_reminders != "" or _cfg_tasks != "" }}'
                lens_registered: "{{ _lr_write_ok }}"
                lens_registry_write: "{{ _lr_write }}"
              error: "{{ none if _lr_write_ok else 'lens registry registration failed' }}"
        - stop: return
          response_variable: final_response

    # ── shared cabinet read (used by all routing cases) ───────────────────────
    # NOTE: each routing case reads cabinet inline — no shared step before choose

    # ── case: stays_create ────────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "stays_create" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ summary_norm == "" or start_date_norm == "" }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  case: stays_create
                  error: summary and start_date are required
            - stop: return
              response_variable: final_response

        - variables:
            _crm_cfg_s: >-
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
              {{ CABS.cabinet_drawer_value(states('sensor.zen_default_household_cabinet_resolved'), 'crm_config', {}) }}

        - variables:
            _stays_label: "{{ _crm_cfg_s.get('stays_label', 'crm_stays') }}"
            _stays_cal: "{{ label_entities(_stays_label) | select('match', 'calendar\\.') | list | first | default('') }}"
            _stays_end: "{{ end_date_norm if end_date_norm != '' else (start_date_norm ~ 'T23:59:00' if 'T' not in start_date_norm else start_date_norm) }}"

        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _stays_cal == "" }}'
            sequence:
            - variables:
                final_response:
                  status: not_configured
                  tool: '{{ tool_name }}'
                  case: stays_create
                  error: 'No calendar labeled ''{{ _stays_label }}''. Label a calendar entity or run configure with stays_label.'
            - stop: return
              response_variable: final_response

        - variables:
            _stays_desc: >-
              {%- set _ns = namespace(parts=[]) -%}
              {%- if note_body_norm != "" -%}{%- set _ns.parts = _ns.parts + [note_body_norm] -%}{%- endif -%}
              {%- if item_id_norm != "" -%}{%- set _ns.parts = _ns.parts + ['crm_link:' ~ item_id_norm] -%}{%- endif -%}
              {%- if area_id_norm != "" -%}{%- set _ns.parts = _ns.parts + ['ha_area:' ~ area_id_norm] -%}{%- endif -%}
              {{ _ns.parts | join(' | ') }}

        - action: script.zen_dojotools_calendar
          response_variable: _stays_cal_res
          continue_on_error: true
          data:
            action_type: create
            calendar_name: '{{ _stays_cal }}'
            summary: '{{ summary_norm }}'
            start: '{{ start_date_norm }}'
            end: '{{ _stays_end }}'
            description: '{{ _stays_desc }}'

        # optionally add a note in Twenty if item_id (contact) provided
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ item_id_norm != "" and note_body_norm != "" }}'
            sequence:
            - action: script.zen_sutra_twenty
              response_variable: _stays_note_adv
              continue_on_error: true
              data:
                action_type: post
                endpoint: notes
                payload: >-
                  {{ {'title': summary_norm, 'bodyV2': {'blocknote': none, 'markdown': note_body_norm}} | tojson }}
            - action: script.zen_sutra_twenty
              continue_on_error: true
              data:
                action_type: post
                endpoint: noteTargets
                payload: >-
                  {{ {'noteId': ((_stays_note_adv.get('result', {}) or {}).get('content', {}) or {}).get('id', ''), 'targetPersonId': item_id_norm} | tojson }}

        - variables:
            _stays_ok: '{{ _stays_cal_res is mapping and _stays_cal_res.get("status") in ["ok", "success"] }}'

        - variables:
            final_response:
              status: '{{ "success" if _stays_ok else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: stays_create
              result:
                calendar: '{{ _stays_cal }}'
                summary: '{{ summary_norm }}'
                start: '{{ start_date_norm }}'
                end: '{{ _stays_end }}'
                contact_id: '{{ item_id_norm }}'
              error: '{{ none if _stays_ok else "calendar create failed — check crm_stays label and calendar entity" }}'
        - stop: return
          response_variable: final_response

    # ── case: stays_list ──────────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "stays_list" }}'
        sequence:
        - variables:
            _crm_cfg_sl: >-
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
              {{ CABS.cabinet_drawer_value(states('sensor.zen_default_household_cabinet_resolved'), 'crm_config', {}) }}

        - variables:
            _sl_label: "{{ _crm_cfg_sl.get('stays_label', 'crm_stays') }}"
            _sl_cal: "{{ label_entities(_sl_label) | select('match', 'calendar\\.') | list | first | default('') }}"

        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _sl_cal == "" }}'
            sequence:
            - variables:
                final_response:
                  status: not_configured
                  tool: '{{ tool_name }}'
                  case: stays_list
                  error: 'No calendar labeled ''{{ _sl_label }}''. Label a calendar entity or run configure.'
            - stop: return
              response_variable: final_response

        - variables:
            _sl_start: "{{ start_date_norm if start_date_norm != '' else now().strftime('%Y-%m-%d') }}"
            _sl_end: "{{ end_date_norm if end_date_norm != '' else (now() + timedelta(days=90)).strftime('%Y-%m-%d') }}"

        - action: script.zen_dojotools_calendar
          response_variable: _sl_res
          continue_on_error: true
          data:
            action_type: read
            calendar_name: '{{ _sl_cal }}'
            start: '{{ _sl_start }}'
            end: '{{ _sl_end }}'

        - variables:
            _sl_items_raw: >-
              {%- if _sl_res is mapping -%}
                {%- set _rs = _sl_res.get('results', []) -%}
                {{ (_rs | first).get('events', []) if (_rs | length) > 0 else [] }}
              {%- else -%}{{ [] }}{%- endif -%}

        # Parse the ha_area:/crm_link: tags out of the raw description text once,
        # here, so every caller (arrival briefs, spa preconditioning, amenity
        # checks) gets clean area_id/crm_link fields instead of each needing to
        # know and re-implement the ' | '-joined tagging convention itself.
        # A stay can carry MULTIPLE ha_area: tags (multi-room booking on one
        # event) — area_ids is always a list, area_id is the first entry for
        # simple single-room callers.
        - variables:
            _sl_items_parsed: >-
              {%- set ns = namespace(items=[]) -%}
              {%- for ev in _sl_items_raw -%}
                {%- set _desc = ev.get('description', '') | default('', true) -%}
                {%- set _parts = (_desc.split(' | ') if _desc else []) -%}
                {%- set _areas = _parts | select('match', '^ha_area:') | map('regex_replace', '^ha_area:', '') | list -%}
                {%- set _link_part = _parts | select('match', '^crm_link:') | list | first | default('') -%}
                {%- set _crm_link = _link_part | regex_replace('^crm_link:', '') -%}
                {%- set _note = _parts | reject('match', '^ha_area:') | reject('match', '^crm_link:') | list | join(' | ') -%}
                {%- set ns.items = ns.items + [ev | combine({
                      'area_ids': _areas,
                      'area_id': (_areas | first) if _areas | length > 0 else '',
                      'crm_link': _crm_link,
                      'note': _note
                    })] -%}
              {%- endfor -%}
              {{ ns.items }}

        - variables:
            _sl_items: >-
              {%- if area_id_norm == '' -%}
                {{ _sl_items_parsed }}
              {%- else -%}
                {{ _sl_items_parsed | selectattr('area_ids', 'contains', area_id_norm) | list }}
              {%- endif -%}

        - variables:
            final_response:
              status: '{{ "success" if _sl_res is mapping else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: stays_list
              result:
                stays: '{{ _sl_items }}'
                count: '{{ _sl_items | length if _sl_items is sequence else 0 }}'
                calendar: '{{ _sl_cal }}'
                area_id_filter: '{{ area_id_norm if area_id_norm != "" else none }}'
              error: '{{ none if _sl_res is mapping else "calendar read failed" }}'
        - stop: return
          response_variable: final_response

    # ── case: stay_create ──────────────────────────────────────────────────────
    # Structured stay record on the "stay" custom object (front-of-house
    # check-in). Distinct from the calendar-based stays_create — this is the
    # CRM-native lifecycle record (reserved/active/released) turnover/concierge
    # logic is built on. item_id here is the GUEST's Twenty Person UUID — use
    # contact_find/contact_create first if the guest isn't already a contact.
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "stay_create" }}'
        sequence:
        - variables:
            _stc_missing: >-
              {%- if item_id_norm == "" -%}item_id (guest contact UUID — use contact_find/contact_create first)
              {%- elif area_id_norm == "" -%}area_id
              {%- elif start_date_norm == "" -%}start_date
              {%- else -%}{%- endif -%}
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _stc_missing | trim != "" }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  case: stay_create
                  error: "Missing required field: {{ _stc_missing | trim }}"
            - stop: return
              response_variable: final_response

        # ── hard gate: area_id must be a real HA area ────────────────────────
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ area_id_norm not in (areas() | list) }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  case: stay_create
                  error: "area_id '{{ area_id_norm }}' is not a known HA area."
                  known_areas_sample: '{{ (areas() | list)[:20] }}'
            - stop: return
              response_variable: final_response

        # 2026-08-19: start_date_norm is naive but UTC-semantic (see its own
        # normalization comment above) -- as_timestamp() on a bare naive
        # datetime assumes LOCAL time, which would silently re-introduce the
        # exact UTC/local bug just fixed at the write side. Reattaching
        # utcnow().tzinfo before computing the timestamp makes the epoch
        # correct regardless of how as_timestamp treats naive input.
        - variables:
            _stc_status: >-
              {%- set _utc_tz = utcnow().tzinfo -%}
              {%- set _start_ts = (start_date_norm | as_datetime).replace(tzinfo=_utc_tz) | as_timestamp if start_date_norm != '' else none -%}
              {{ 'RESERVED' if _start_ts is not none and _start_ts > now().timestamp() else 'ACTIVE' }}

        # ── soft check: overlapping stay in the same room — warn, don't block.
        # Households vary; some like sharing a room for a stretch. This is
        # visibility for the concierge, not a reservation lock. Queries
        # Twenty directly (zen_sutra_twenty) rather than recursing back into
        # this same script — zen_dojotools_rolodex is mode:queued (not
        # parallel), and a self-call here hits the same silent no-op
        # recursion class of issue Taskmaster had earlier tonight.
        - action: script.zen_sutra_twenty
          response_variable: _stc_overlap_adv
          continue_on_error: true
          data:
            action_type: get
            endpoint: 'stays?limit=100'
        - variables:
            _stc_overlap_body: >-
              {%- if _stc_overlap_adv is mapping and "result" in _stc_overlap_adv and "content" in _stc_overlap_adv["result"] -%}
                {{ _stc_overlap_adv["result"]["content"] }}
              {%- else -%}{{ {} }}{%- endif -%}
            _stc_overlap_all: >-
              {%- set _d = _stc_overlap_body.get('data', {}) if _stc_overlap_body is mapping else {} -%}
              {%- set _d = _d if _d is mapping else {} -%}
              {{ _d.get('stays', []) if _d.get('stays') is sequence else [] }}
        - variables:
            _stc_overlap_candidates: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for s in _stc_overlap_all if s is mapping -%}
                {%- if s.get('status','') != 'RELEASED' and s.get('roomAreaId','') == area_id_norm -%}
                  {%- set ns.out = ns.out + [{'id': s.get('id',''), 'guest_contact_id': s.get('guestContactId',''), 'check_in': s.get('checkIn',''), 'check_out': s.get('checkOut','')}] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out }}
        - variables:
            _stc_overlaps: >-
              {%- set _utc_tz = utcnow().tzinfo -%}
              {%- set _new_start = (start_date_norm | as_datetime).replace(tzinfo=_utc_tz) | as_timestamp -%}
              {%- set _new_end_raw = ((end_date_norm | as_datetime).replace(tzinfo=_utc_tz) | as_timestamp) if end_date_norm != "" else none -%}
              {%- set _new_end_eff = _new_end_raw if _new_end_raw is not none else _new_start -%}
              {%- set ns = namespace(out=[]) -%}
              {%- for s in _stc_overlap_candidates if s is mapping -%}
                {%- set _os = s.get('check_in','') | as_datetime | as_timestamp -%}
                {%- set _oe_raw = s.get('check_out','') -%}
                {%- set _oe = (_oe_raw | as_datetime | as_timestamp) if _oe_raw else none -%}
                {%- set _o_end_eff = _oe if _oe is not none else _os -%}
                {%- if _os is not none and _new_start is not none and _os <= _new_end_eff and _o_end_eff >= _new_start -%}
                  {%- set ns.out = ns.out + [{'id': s.get('id',''), 'guest_contact_id': s.get('guest_contact_id',''), 'check_in': s.get('check_in',''), 'check_out': s.get('check_out','')}] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out }}

        # ── block instead of warn, if the caller opted into strict mode ─────
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ block_on_overlap_norm and _stc_overlaps | length > 0 }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  case: stay_create
                  error: "Room already booked in this window — blocked (block_on_overlap=true)."
                  overlapping_stays: '{{ _stc_overlaps }}'
            - stop: return
              response_variable: final_response

        - variables:
            _stc_payload: >-
              {{ {'guestContactId': item_id_norm, 'roomAreaId': area_id_norm, 'checkIn': start_date_norm, 'checkOut': (end_date_norm if end_date_norm != '' else none), 'status': _stc_status, 'notes': note_body_norm, 'turnoverSpawned': false, 'prepSpawned': false, 'checkoutNudgeSpawned': false, 'occupantNames': occupant_names_norm} | tojson }}
        - action: script.zen_sutra_twenty
          response_variable: _stc_adv
          continue_on_error: true
          data:
            action_type: post
            endpoint: stays
            payload: '{{ _stc_payload }}'
        - variables:
            _stc_ok: '{{ _stc_adv is mapping and _stc_adv.get("status") == "success" }}'
            _stc_body: >-
              {%- if _stc_adv is mapping and "result" in _stc_adv and "content" in _stc_adv["result"] -%}
                {{ _stc_adv["result"]["content"] }}
              {%- else -%}{{ {} }}{%- endif -%}
            _stc_result: '{{ _stc_body.get("data", {}).get("createStay", _stc_body.get("data", {})) if _stc_body is mapping else {} }}'
        - variables:
            final_response:
              status: '{{ "success" if _stc_ok and _stc_result is mapping and _stc_result.get("id","") != "" else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: stay_create
              result:
                id: '{{ _stc_result.get("id","") if _stc_result is mapping else "" }}'
                status: '{{ _stc_status }}'
                guest_contact_id: '{{ item_id_norm }}'
                area_id: '{{ area_id_norm }}'
                check_in: '{{ start_date_norm }}'
                check_out: '{{ end_date_norm if end_date_norm != "" else none }}'
                occupant_names: '{{ occupant_names_norm }}'
              warning: '{{ ("Room already has " ~ (_stc_overlaps | length) ~ " overlapping stay(s) in this window — sharing? confirm this is intentional.") if _stc_overlaps | length > 0 else none }}'
              overlapping_stays: '{{ _stc_overlaps if _stc_overlaps | length > 0 else [] }}'
              error: '{{ none if (_stc_ok and _stc_result is mapping and _stc_result.get("id","") != "") else ("create failed — HTTP " ~ _stc_adv.get("http_status","?") if _stc_adv is mapping else "broker error") }}'
        - stop: return
          response_variable: final_response

    # ── case: stay_get ──────────────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "stay_get" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ item_id_norm == "" }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  case: stay_get
                  error: item_id required. Use stays_active_list first.
            - stop: return
              response_variable: final_response
        - action: script.zen_sutra_twenty
          response_variable: _stg_adv
          continue_on_error: true
          data:
            action_type: get
            endpoint: 'stays/{{ item_id_norm }}'
        - variables:
            _stg_ok: '{{ _stg_adv is mapping and _stg_adv.get("status") == "success" }}'
            _stg_body: >-
              {%- if _stg_adv is mapping and "result" in _stg_adv and "content" in _stg_adv["result"] -%}
                {{ _stg_adv["result"]["content"] }}
              {%- else -%}{{ {} }}{%- endif -%}
            _stg_s: '{{ _stg_body.get("data", {}).get("stay", _stg_body.get("data", {})) if _stg_body is mapping else {} }}'
        - variables:
            final_response:
              status: '{{ "success" if _stg_ok and _stg_s else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: stay_get
              result:
                id: '{{ _stg_s.get("id","") if _stg_s is mapping else "" }}'
                guest_contact_id: '{{ _stg_s.get("guestContactId","") if _stg_s is mapping else "" }}'
                area_id: '{{ _stg_s.get("roomAreaId","") if _stg_s is mapping else "" }}'
                check_in: '{{ _stg_s.get("checkIn","") if _stg_s is mapping else "" }}'
                check_out: '{{ _stg_s.get("checkOut","") if _stg_s is mapping else "" }}'
                status: '{{ _stg_s.get("status","") if _stg_s is mapping else "" }}'
                turnover_spawned: '{{ _stg_s.get("turnoverSpawned", false) if _stg_s is mapping else false }}'
                prep_spawned: '{{ _stg_s.get("prepSpawned", false) if _stg_s is mapping else false }}'
                checkout_nudge_spawned: '{{ _stg_s.get("checkoutNudgeSpawned", false) if _stg_s is mapping else false }}'
                notes: '{{ _stg_s.get("notes","") if _stg_s is mapping else "" }}'
                occupant_names: '{{ _stg_s.get("occupantNames","") if _stg_s is mapping else "" }}'
                reservation_id: '{{ _stg_s.get("reservationId","") if _stg_s is mapping else "" }}'
              error: '{{ none if (_stg_ok and _stg_s) else ("not found — HTTP " ~ _stg_adv.get("http_status","?") if _stg_adv is mapping else "broker error") }}'
        - stop: return
          response_variable: final_response

    # ── case: stays_active_list ──────────────────────────────────────────────────
    # Front-desk view: everything not yet released (RESERVED + ACTIVE), i.e.
    # "who's here or arriving" — not "who has ever stayed." Optional area_id
    # scopes to one room.
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "stays_active_list" }}'
        sequence:
        - action: script.zen_sutra_twenty
          response_variable: _sal_adv
          continue_on_error: true
          data:
            action_type: get
            endpoint: 'stays?limit={{ limit_norm }}'
        - variables:
            _sal_ok: '{{ _sal_adv is mapping and _sal_adv.get("status") == "success" }}'
            _sal_body: >-
              {%- if _sal_adv is mapping and "result" in _sal_adv and "content" in _sal_adv["result"] -%}
                {{ _sal_adv["result"]["content"] }}
              {%- else -%}{{ {} }}{%- endif -%}
            _sal_all: >-
              {%- set _d = _sal_body.get('data', {}) if _sal_body is mapping else {} -%}
              {%- set _d = _d if _d is mapping else {} -%}
              {{ _d.get('stays', []) if _d.get('stays') is sequence else [] }}
        - variables:
            # stays_active_list must not treat any unreleased RESERVED
            # record as active without checking whether today falls between
            # check-in and checkout -- a stale reservation whose checkout
            # already passed can otherwise keep reporting as an active stay
            # indefinitely. status != 'RELEASED' alone matches the
            # documented "who's here or arriving" intent for a genuine
            # future/current stay, but doesn't distinguish that from a
            # RESERVED record whose checkout already passed without ever
            # being explicitly released -- that's not "arriving," it's
            # abandoned. Added: drop any record whose check_out is
            # already in the past, regardless of status. A blank
            # check_out is treated as not-expired (never assume expiry
            # from missing data).
            _sal_filtered: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for s in _sal_all if s is mapping -%}
                {%- set _co = s.get('checkOut','') -%}
                {%- set _not_expired = (_co == '') or (as_datetime(_co) is not none and as_datetime(_co) >= now()) -%}
                {%- if s.get('status','') != 'RELEASED' and _not_expired and (area_id_norm == '' or s.get('roomAreaId','') == area_id_norm) -%}
                  {%- set ns.out = ns.out + [{'id': s.get('id',''), 'guest_contact_id': s.get('guestContactId',''), 'area_id': s.get('roomAreaId',''), 'check_in': s.get('checkIn',''), 'check_out': s.get('checkOut',''), 'status': s.get('status',''), 'occupant_names': s.get('occupantNames',''), 'reservation_id': s.get('reservationId','')}] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out }}
        - variables:
            final_response:
              status: '{{ "success" if _sal_ok else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: stays_active_list
              result:
                stays: '{{ _sal_filtered }}'
                count: '{{ _sal_filtered | length }}'
                area_id_filter: '{{ area_id_norm if area_id_norm != "" else none }}'
              error: '{{ none if _sal_ok else "broker error" }}'
        - stop: return
          response_variable: final_response

    # ── case: stay_release ───────────────────────────────────────────────────────
    # Checkout + turnover dispatch. Idempotent — a stay already RELEASED with
    # turnoverSpawned=true is a no-op, not a re-fire. This is the "bell rings
    # for housekeeping" moment: baseline turnover chore always spawns via
    # Taskmaster (shape-first routing already handles chore vs ticket), with
    # upgrades based on stay length / allergen prefs, matching the aux-case
    # matrix designed earlier. No auto-created Radar tickets — human escalates
    # anything found, this only ever spawns routine chores.
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "stay_release" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ item_id_norm == "" }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  case: stay_release
                  error: item_id required. Use stays_active_list first.
            - stop: return
              response_variable: final_response

        - action: script.zen_sutra_twenty
          response_variable: _sr_get_adv
          continue_on_error: true
          data:
            action_type: get
            endpoint: 'stays/{{ item_id_norm }}'
        - variables:
            _sr_get_body: >-
              {%- if _sr_get_adv is mapping and "result" in _sr_get_adv and "content" in _sr_get_adv["result"] -%}
                {{ _sr_get_adv["result"]["content"] }}
              {%- else -%}{{ {} }}{%- endif -%}
            _sr_stay: '{{ _sr_get_body.get("data", {}).get("stay", _sr_get_body.get("data", {})) if _sr_get_body is mapping else {} }}'

        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _sr_stay is not mapping or _sr_stay.get("id","") == "" }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  case: stay_release
                  error: "stay not found: {{ item_id_norm }}"
            - stop: return
              response_variable: final_response

          - conditions:
            - condition: template
              value_template: '{{ _sr_stay.get("status","") == "RELEASED" and _sr_stay.get("turnoverSpawned", false) }}'
            sequence:
            - variables:
                final_response:
                  status: success
                  tool: '{{ tool_name }}'
                  case: stay_release
                  result:
                    id: '{{ item_id_norm }}'
                    already_released: true
                    turnover_dispatched: []
                  error: none
            - stop: return
              response_variable: final_response

          default:
          - variables:
              _sr_area: '{{ _sr_stay.get("roomAreaId","") }}'
              _sr_guest_id: '{{ _sr_stay.get("guestContactId","") }}'
              _sr_check_in: '{{ _sr_stay.get("checkIn","") }}'
              _sr_check_out: '{{ _sr_stay.get("checkOut","") }}'
              _sr_reservation_id: '{{ _sr_stay.get("reservationId","") }}'
              _sr_correlation_tag: >-
                {{ "stay:" ~ item_id_norm ~ (" reservation:" ~ _sr_stay.get("reservationId","") if _sr_stay.get("reservationId","") not in ["", none] else "") }}
              _sr_nights: >-
                {%- set _ci = _sr_stay.get('checkIn','') | as_datetime -%}
                {%- set _co_raw = _sr_stay.get('checkOut','') -%}
                {%- set _co = (_co_raw | as_datetime) if _co_raw else now() -%}
                {{ ((_co - _ci).total_seconds() / 86400) | round(1, 'floor') if _ci is not none and _co is not none else 0 }}

          # ── read guest's allergen prefs (if any) ─────────────────────────
          - action: script.zen_sutra_twenty
            response_variable: _sr_guest_adv
            continue_on_error: true
            data:
              action_type: get
              endpoint: 'people/{{ _sr_guest_id }}'
          - variables:
              _sr_guest_body: >-
                {%- if _sr_guest_adv is mapping and "result" in _sr_guest_adv and "content" in _sr_guest_adv["result"] -%}
                  {{ _sr_guest_adv["result"]["content"] }}
                {%- else -%}{{ {} }}{%- endif -%}
              _sr_guest_p: '{{ _sr_guest_body.get("data", {}).get("person", _sr_guest_body.get("data", {})) if _sr_guest_body is mapping else {} }}'
          - variables:
              _sr_guest_prefs_raw: '{{ _sr_guest_p.get("guestPrefs", "") if _sr_guest_p is mapping else "" }}'
              _sr_guest_prefs: >-
                {%- set _gp = _sr_guest_prefs_raw -%}
                {%- if _gp is mapping -%}{{ _gp }}
                {%- elif _gp is string and _gp | trim not in ['', 'none', 'null'] -%}
                  {{ (_gp | from_json) if (_gp | trim)[:1] in ['{', '['] else {} }}
                {%- else -%}{{ {} }}{%- endif -%}
              _sr_has_allergens: '{{ _sr_guest_prefs is mapping and (_sr_guest_prefs.get("allergens", []) | list | length) > 0 }}'

          # ── mark released (idempotency flag flips regardless of dispatch outcome below) ─
          - action: script.zen_sutra_twenty
            response_variable: _sr_patch_adv
            continue_on_error: true
            data:
              action_type: patch
              endpoint: 'stays/{{ item_id_norm }}'
              payload: '{{ {"status": "RELEASED", "turnoverSpawned": true} | tojson }}'

          # ── baseline turnover chore, shape/upgrade per aux-case matrix ───
          - variables:
              _sr_chore_item: >-
                {{ 'Deep clean (allergen stay) — turnover' if _sr_has_allergens
                   else ('Deep clean (extended stay, ' ~ (_sr_nights | int) ~ ' nights) — turnover' if _sr_nights | float >= 3
                   else 'Standard turnover clean') }}
          - action: script.zen_dojotools_taskmaster
            response_variable: _sr_turnover_dispatch
            continue_on_error: true
            data:
              mode: task_create
              item: '{{ _sr_chore_item }}'
              chore: true
              area: '{{ _sr_area }}'
              note: "Guest stay released. Check-in: {{ _sr_check_in }}. {{ 'Allergen prefs on file — sanitize thoroughly.' if _sr_has_allergens else '' }} {{ _sr_correlation_tag }}"

          # ── mark room dirty — decoupled housekeeping status, independent
          # of the chore dispatch above; a failure here must not block release ──
          - action: script.zen_dojotools_room_manager
            continue_on_error: true
            data:
              mode: room_status_set
              area: '{{ _sr_area }}'
              room_status: dirty
              room_status_source: turnover
              room_status_note: "Turnover chore dispatched: {{ _sr_chore_item }}"

          # ── hot tub recheck if the amenity was active during this stay ───
          - action: script.zen_dojotools_filecabinet
            response_variable: _sr_hottub_kata_raw
            continue_on_error: true
            data:
              action_type: get
              volume_entity_id: sensor.zenos_kata_cabinet
              key: hot_tub_manager
          - variables:
              _sr_hottub_updated_at: '{{ _sr_hottub_kata_raw.get("value", {}).get("updated_at", "") if _sr_hottub_kata_raw is mapping and _sr_hottub_kata_raw.get("status") == "success" else "" }}'
              _sr_hottub_active_during_stay: >-
                {%- set _u = _sr_hottub_updated_at | as_datetime if _sr_hottub_updated_at != '' else none -%}
                {%- set _ci = _sr_check_in | as_datetime if _sr_check_in != '' else none -%}
                {{ _u is not none and _ci is not none and _u >= _ci }}
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ _sr_hottub_active_during_stay }}'
              sequence:
              - action: script.zen_dojotools_taskmaster
                continue_on_error: true
                data:
                  mode: task_create
                  item: "Hot tub recheck after guest stay"
                  chore: true
                  area: '{{ _sr_area }}'
                  note: "Spa/hot tub activity detected during this stay window — verify chemistry and reset for next guest. {{ _sr_correlation_tag }}"

          - variables:
              final_response:
                status: success
                tool: '{{ tool_name }}'
                version: '{{ tool_version }}'
                case: stay_release
                result:
                  id: '{{ item_id_norm }}'
                  area_id: '{{ _sr_area }}'
                  nights: '{{ _sr_nights }}'
                  had_allergen_prefs: '{{ _sr_has_allergens }}'
                  hot_tub_recheck_spawned: '{{ _sr_hottub_active_during_stay }}'
                  turnover_chore: '{{ _sr_chore_item }}'
                error: none
          - stop: return
            response_variable: final_response

    # ── case: stay_prep_check ────────────────────────────────────────────────────
    # Arrival counterpart to stay_release above -- closes the "the home already
    # knows but doesn't act until someone's already here" gap (2026-08-19
    # pre-release audit, Gap 1). Scans RESERVED stays whose check-in falls
    # within lookahead_hours of now and haven't been prepped yet, and for each
    # spawns a Taskmaster prep chore carrying the guest's stored prefs
    # (allergens/music/spa) plus a Postman notice to the owner -- same "bell
    # rings for housekeeping" idiom stay_release already uses, on the other
    # side of the stay. Deliberately NOT direct climate/light actuation this
    # pass -- no entity-level room->device resolution exists here yet and
    # guestPrefs has no temperature field to act on; a human-in-the-loop
    # chore is the safe, real slice of "acts ahead of time" buildable without
    # inventing either. Idempotent via prepSpawned (same shape as
    # turnoverSpawned). No caller-supplied item_id -- this scans, not a
    # single-stay operation. Intended caller: a periodic automation (see
    # automations.yaml zen_guest_prep_scan), not a live agent request --
    # there's nothing for a human to confirm here.
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "stay_prep_check" }}'
        sequence:
        - variables:
            _spc_lookahead_h: "{{ lookahead_hours | default(3) | int(3) }}"
        - action: script.zen_sutra_twenty
          response_variable: _spc_adv
          continue_on_error: true
          data:
            action_type: get
            endpoint: 'stays?limit={{ limit_norm }}'
        - variables:
            _spc_ok: '{{ _spc_adv is mapping and _spc_adv.get("status") == "success" }}'
            _spc_body: >-
              {%- if _spc_adv is mapping and "result" in _spc_adv and "content" in _spc_adv["result"] -%}
                {{ _spc_adv["result"]["content"] }}
              {%- else -%}{{ {} }}{%- endif -%}
            _spc_all: >-
              {%- set _d = _spc_body.get('data', {}) if _spc_body is mapping else {} -%}
              {%- set _d = _d if _d is mapping else {} -%}
              {{ _d.get('stays', []) if _d.get('stays') is sequence else [] }}
        - variables:
            _spc_due: >-
              {%- set ns = namespace(out=[]) -%}
              {%- set _now = now() -%}
              {%- set _horizon = _now + timedelta(hours=_spc_lookahead_h) -%}
              {%- for s in _spc_all if s is mapping -%}
                {%- set _ci = s.get('checkIn','') | as_datetime -%}
                {%- if s.get('status','') == 'RESERVED'
                    and not (s.get('prepSpawned', false) | bool(false))
                    and _ci is not none and _now <= _ci <= _horizon -%}
                  {%- set ns.out = ns.out + [s] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out }}
        - variables:
            _spc_results: []
        - repeat:
            for_each: "{{ _spc_due }}"
            sequence:
            - variables:
                _spci_id: "{{ repeat.item.get('id','') }}"
                _spci_area: "{{ repeat.item.get('roomAreaId','') }}"
                _spci_guest_id: "{{ repeat.item.get('guestContactId','') }}"
                _spci_check_in: "{{ repeat.item.get('checkIn','') }}"
                _spci_check_in_local: >-
                  {%- set _ci_dt = repeat.item.get('checkIn','') | as_datetime -%}
                  {{ as_local(_ci_dt).strftime('%a %b %d, %I:%M %p') if _ci_dt is not none else repeat.item.get('checkIn','') }}
                _spci_correlation_tag: "{{ 'stay:' ~ repeat.item.get('id','') }}"

            - action: script.zen_sutra_twenty
              response_variable: _spci_guest_adv
              continue_on_error: true
              data:
                action_type: get
                endpoint: 'people/{{ _spci_guest_id }}'
            - variables:
                _spci_guest_body: >-
                  {%- if _spci_guest_adv is mapping and "result" in _spci_guest_adv and "content" in _spci_guest_adv["result"] -%}
                    {{ _spci_guest_adv["result"]["content"] }}
                  {%- else -%}{{ {} }}{%- endif -%}
                _spci_guest_p: '{{ _spci_guest_body.get("data", {}).get("person", _spci_guest_body.get("data", {})) if _spci_guest_body is mapping else {} }}'
            - variables:
                _spci_guest_name: >-
                  {{ ((_spci_guest_p.get('name', {}).get('firstName', '') if _spci_guest_p is mapping else '')
                      ~ ' ' ~
                      (_spci_guest_p.get('name', {}).get('lastName', '') if _spci_guest_p is mapping else '')) | trim }}
                _spci_prefs_raw: '{{ _spci_guest_p.get("guestPrefs", "") if _spci_guest_p is mapping else "" }}'
                _spci_prefs: >-
                  {%- set _gp = _spci_prefs_raw -%}
                  {%- if _gp is mapping -%}{{ _gp }}
                  {%- elif _gp is string and _gp | trim not in ['', 'none', 'null'] -%}
                    {{ (_gp | from_json) if (_gp | trim)[:1] in ['{', '['] else {} }}
                  {%- else -%}{{ {} }}{%- endif -%}
                _spci_allergens: "{{ _spci_prefs.get('allergens', []) if _spci_prefs is mapping else [] }}"

            - variables:
                _spci_prefs_summary: >-
                  {%- set ns = namespace(parts=[]) -%}
                  {%- if _spci_allergens | length > 0 -%}
                    {%- set ns.parts = ns.parts + ['Allergens: ' ~ (_spci_allergens | join(', '))] -%}
                  {%- endif -%}
                  {%- if _spci_prefs is mapping and _spci_prefs.get('music') -%}
                    {%- set ns.parts = ns.parts + ['Music prefs on file'] -%}
                  {%- endif -%}
                  {%- if _spci_prefs is mapping and _spci_prefs.get('spa') -%}
                    {%- set ns.parts = ns.parts + ['Spa prefs on file'] -%}
                  {%- endif -%}
                  {{ (ns.parts | join('. ')) if ns.parts | length > 0 else 'No prefs on file.' }}

            - action: script.zen_dojotools_taskmaster
              response_variable: _spci_chore_dispatch
              continue_on_error: true
              data:
                mode: task_create
                item: "Guest arrival prep{{ ' — ' ~ _spci_guest_name if _spci_guest_name != '' else '' }}"
                chore: true
                area: '{{ _spci_area }}'
                note: "Guest arriving {{ _spci_check_in_local }}. {{ _spci_prefs_summary }} {{ _spci_correlation_tag }}"

            - action: script.zen_sutra_twenty
              continue_on_error: true
              data:
                action_type: patch
                endpoint: 'stays/{{ _spci_id }}'
                payload: '{{ {"prepSpawned": true} | tojson }}'

            - action: script.zen_dojotools_postman
              continue_on_error: true
              data:
                mode: resolve_and_dispatch
                tag: "guest_prep_{{ _spci_id }}"
                title: "Guest prep — {{ _spci_area }}"
                message: "{{ _spci_guest_name if _spci_guest_name != '' else 'Guest' }} arriving {{ _spci_check_in_local }} in {{ _spci_area }}. {{ _spci_prefs_summary }}"
                urgency: 3
                channel_hint: push

            - variables:
                _spc_results: >-
                  {{ _spc_results + [{'stay_id': _spci_id, 'area_id': _spci_area, 'guest_name': _spci_guest_name, 'check_in': _spci_check_in, 'chore_dispatched': (_spci_chore_dispatch is mapping and _spci_chore_dispatch.get('status','') in ['ok','success'])}] }}

        - variables:
            final_response:
              status: '{{ "success" if _spc_ok else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: stay_prep_check
              result:
                lookahead_hours: '{{ _spc_lookahead_h }}'
                prepped: '{{ _spc_results }}'
                count: '{{ _spc_results | length }}'
              error: '{{ none if _spc_ok else "broker error" }}'
        - stop: return
          response_variable: final_response

    # ── case: checkout_status ────────────────────────────────────────────────────
    # Read-only, no side effects, safe to call any time -- this is the "does
    # the agent already know a departure is approaching" answer (2026-08-19,
    # household: result should be an agent-queryable fact, not just a background
    # push). Scans ACTIVE stays with a set checkOut inside lookahead_hours
    # (default 24 -- a broader natural window than the nudge dispatch below,
    # since "who's leaving today" is a wider ask than "fire the reminder
    # now"). Shares no state with stay_checkout_check -- call this as often
    # as you like, it never marks anything done.
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "checkout_status" }}'
        sequence:
        - variables:
            _cos_lookahead_h: "{{ lookahead_hours | default(24) | int(24) }}"
        - action: script.zen_sutra_twenty
          response_variable: _cos_adv
          continue_on_error: true
          data:
            action_type: get
            endpoint: 'stays?limit={{ limit_norm }}'
        - variables:
            _cos_ok: '{{ _cos_adv is mapping and _cos_adv.get("status") == "success" }}'
            _cos_body: >-
              {%- if _cos_adv is mapping and "result" in _cos_adv and "content" in _cos_adv["result"] -%}
                {{ _cos_adv["result"]["content"] }}
              {%- else -%}{{ {} }}{%- endif -%}
            _cos_all: >-
              {%- set _d = _cos_body.get('data', {}) if _cos_body is mapping else {} -%}
              {%- set _d = _d if _d is mapping else {} -%}
              {{ _d.get('stays', []) if _d.get('stays') is sequence else [] }}
        - variables:
            _cos_departing: >-
              {%- set ns = namespace(out=[]) -%}
              {%- set _now = now() -%}
              {%- set _horizon = _now + timedelta(hours=_cos_lookahead_h) -%}
              {%- for s in _cos_all if s is mapping -%}
                {%- set _co = s.get('checkOut','') | as_datetime -%}
                {%- if s.get('status','') == 'ACTIVE'
                    and (area_id_norm == '' or s.get('roomAreaId','') == area_id_norm)
                    and _co is not none and _now <= _co <= _horizon -%}
                  {%- set _hrs_left = ((_co - _now).total_seconds() / 3600) | round(1) -%}
                  {%- set ns.out = ns.out + [{'stay_id': s.get('id',''), 'area_id': s.get('roomAreaId',''), 'guest_contact_id': s.get('guestContactId',''), 'check_out': s.get('checkOut',''), 'hours_remaining': _hrs_left}] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out | sort(attribute='hours_remaining') }}
        - variables:
            final_response:
              status: '{{ "success" if _cos_ok else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: checkout_status
              result:
                lookahead_hours: '{{ _cos_lookahead_h }}'
                departing: '{{ _cos_departing }}'
                count: '{{ _cos_departing | length }}'
              error: '{{ none if _cos_ok else "broker error" }}'
        - stop: return
          response_variable: final_response

    # ── case: stay_checkout_check ────────────────────────────────────────────────
    # Departure counterpart to stay_prep_check above -- fires once per stay
    # (idempotent via checkoutNudgeSpawned, same shape as prepSpawned/
    # turnoverSpawned) when an ACTIVE stay's checkOut falls within
    # lookahead_hours (default 3 -- tight, this is the actual reminder
    # trigger, not the wider browsing window checkout_status uses).
    # chore=false (unlike stay_prep_check's chore=true) -- a checkout
    # reminder is a one-off task, not a recurring cleaning chore; routes
    # through Taskmaster's non-chore-shaped branch (Radar if configured,
    # else a plain Grocy task). Does not replace stay_release -- that still
    # owns the actual turnover dispatch once checkout happens; this only
    # nudges that it's approaching. Deliberately does NOT fetch/surface
    # guestPrefs (unlike stay_prep_check) -- allergen/music/spa context is
    # useful for prepping a room, not for a departure reminder. Not an
    # oversight, don't add it without a real use case driving it.
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "stay_checkout_check" }}'
        sequence:
        - variables:
            _scc_lookahead_h: "{{ lookahead_hours | default(3) | int(3) }}"
        - action: script.zen_sutra_twenty
          response_variable: _scc_adv
          continue_on_error: true
          data:
            action_type: get
            endpoint: 'stays?limit={{ limit_norm }}'
        - variables:
            _scc_ok: '{{ _scc_adv is mapping and _scc_adv.get("status") == "success" }}'
            _scc_body: >-
              {%- if _scc_adv is mapping and "result" in _scc_adv and "content" in _scc_adv["result"] -%}
                {{ _scc_adv["result"]["content"] }}
              {%- else -%}{{ {} }}{%- endif -%}
            _scc_all: >-
              {%- set _d = _scc_body.get('data', {}) if _scc_body is mapping else {} -%}
              {%- set _d = _d if _d is mapping else {} -%}
              {{ _d.get('stays', []) if _d.get('stays') is sequence else [] }}
        - variables:
            _scc_due: >-
              {%- set ns = namespace(out=[]) -%}
              {%- set _now = now() -%}
              {%- set _horizon = _now + timedelta(hours=_scc_lookahead_h) -%}
              {%- for s in _scc_all if s is mapping -%}
                {%- set _co = s.get('checkOut','') | as_datetime -%}
                {%- if s.get('status','') == 'ACTIVE'
                    and not (s.get('checkoutNudgeSpawned', false) | bool(false))
                    and _co is not none and _now <= _co <= _horizon -%}
                  {%- set ns.out = ns.out + [s] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out }}
        - variables:
            _scc_results: []
        - repeat:
            for_each: "{{ _scc_due }}"
            sequence:
            - variables:
                _scci_id: "{{ repeat.item.get('id','') }}"
                _scci_area: "{{ repeat.item.get('roomAreaId','') }}"
                _scci_guest_id: "{{ repeat.item.get('guestContactId','') }}"
                _scci_check_out: "{{ repeat.item.get('checkOut','') }}"
                _scci_check_out_local: >-
                  {%- set _co_dt = repeat.item.get('checkOut','') | as_datetime -%}
                  {{ as_local(_co_dt).strftime('%a %b %d, %I:%M %p') if _co_dt is not none else repeat.item.get('checkOut','') }}
                _scci_correlation_tag: "{{ 'stay:' ~ repeat.item.get('id','') }}"

            - action: script.zen_sutra_twenty
              response_variable: _scci_guest_adv
              continue_on_error: true
              data:
                action_type: get
                endpoint: 'people/{{ _scci_guest_id }}'
            - variables:
                _scci_guest_body: >-
                  {%- if _scci_guest_adv is mapping and "result" in _scci_guest_adv and "content" in _scci_guest_adv["result"] -%}
                    {{ _scci_guest_adv["result"]["content"] }}
                  {%- else -%}{{ {} }}{%- endif -%}
                _scci_guest_p: '{{ _scci_guest_body.get("data", {}).get("person", _scci_guest_body.get("data", {})) if _scci_guest_body is mapping else {} }}'
            - variables:
                _scci_guest_name: >-
                  {{ ((_scci_guest_p.get('name', {}).get('firstName', '') if _scci_guest_p is mapping else '')
                      ~ ' ' ~
                      (_scci_guest_p.get('name', {}).get('lastName', '') if _scci_guest_p is mapping else '')) | trim }}

            - action: script.zen_dojotools_taskmaster
              response_variable: _scci_task_dispatch
              continue_on_error: true
              data:
                mode: task_create
                item: "Checkout approaching{{ ' — ' ~ _scci_guest_name if _scci_guest_name != '' else '' }}"
                chore: false
                area: '{{ _scci_area }}'
                note: "Checkout {{ _scci_check_out_local }}. {{ _scci_correlation_tag }}"

            - action: script.zen_sutra_twenty
              continue_on_error: true
              data:
                action_type: patch
                endpoint: 'stays/{{ _scci_id }}'
                payload: '{{ {"checkoutNudgeSpawned": true} | tojson }}'

            - action: script.zen_dojotools_postman
              continue_on_error: true
              data:
                mode: resolve_and_dispatch
                tag: "guest_checkout_{{ _scci_id }}"
                title: "Checkout approaching — {{ _scci_area }}"
                message: "{{ _scci_guest_name if _scci_guest_name != '' else 'Guest' }} in {{ _scci_area }} checking out {{ _scci_check_out_local }}."
                urgency: 3
                channel_hint: push

            - variables:
                _scc_results: >-
                  {{ _scc_results + [{'stay_id': _scci_id, 'area_id': _scci_area, 'guest_name': _scci_guest_name, 'check_out': _scci_check_out, 'task_dispatched': (_scci_task_dispatch is mapping and _scci_task_dispatch.get('status','') in ['ok','success'])}] }}

        - variables:
            final_response:
              status: '{{ "success" if _scc_ok else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: stay_checkout_check
              result:
                lookahead_hours: '{{ _scc_lookahead_h }}'
                nudged: '{{ _scc_results }}'
                count: '{{ _scc_results | length }}'
              error: '{{ none if _scc_ok else "broker error" }}'
        - stop: return
          response_variable: final_response

    # ── case: reservation_create ─────────────────────────────────────────────────
    # Thin booking-level grouping over one or more "stay" records — NOT a
    # duplicate of stay's own room/date/turnover-state data. Each room gets
    # its own real stay record (same validation/overlap-check as stay_create),
    # tagged with reservationId. No fake atomicity: Twenty has no multi-object
    # transactions, so a failure on room 3 of 5 does not roll back rooms 1-2 —
    # per-room results are reported honestly so the caller can retry just the
    # failed room(s) via plain stay_create with the harvested reservation_id.
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "reservation_create" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ rooms_json_norm | length == 0 }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  case: reservation_create
                  error: "rooms_json required — JSON array of {area_id, item_id, start_date, end_date, occupant_names, note} objects."
            - stop: return
              response_variable: final_response

        # ── hard gate: every room's area_id must be a real HA area, checked
        # up front — fail before creating anything rather than partway through.
        - variables:
            _rc_bad_areas: >-
              {%- set ns = namespace(out=[]) -%}
              {%- set _areas = areas() | list -%}
              {%- for r in rooms_json_norm if r is mapping -%}
                {%- set _a = r.get('area_id', '') | string | trim -%}
                {%- if _a == '' or _a not in _areas -%}
                  {%- set ns.out = ns.out + [_a] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out }}
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _rc_bad_areas | length > 0 }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  case: reservation_create
                  error: "Unknown/missing area_id(s) in rooms_json: {{ _rc_bad_areas | join(', ') }}"
                  known_areas_sample: '{{ (areas() | list)[:20] }}'
            - stop: return
              response_variable: final_response

        # ── create the Reservation row first ─────────────────────────────
        - variables:
            _rc_status: >-
              {%- set _first_start = (rooms_json_norm | first).get('start_date', '') -%}
              {%- set _start_ts = _first_start | as_datetime | as_timestamp if _first_start != '' else none -%}
              {{ 'CHECKED_IN' if _start_ts is not none and _start_ts <= now().timestamp() else 'RESERVED' }}
            _rc_payload: >-
              {{ {'primaryGuestContactId': item_id_norm, 'partyLabel': party_label_norm, 'status': _rc_status, 'notes': note_body_norm} | tojson }}
        - action: script.zen_sutra_twenty
          response_variable: _rc_resv_adv
          continue_on_error: true
          data:
            action_type: post
            endpoint: reservations
            payload: '{{ _rc_payload }}'
        - variables:
            _rc_resv_body: >-
              {%- if _rc_resv_adv is mapping and "result" in _rc_resv_adv and "content" in _rc_resv_adv["result"] -%}
                {{ _rc_resv_adv["result"]["content"] }}
              {%- else -%}{{ {} }}{%- endif -%}
            _rc_resv_result: '{{ _rc_resv_body.get("data", {}).get("createReservation", _rc_resv_body.get("data", {})) if _rc_resv_body is mapping else {} }}'
            _rc_reservation_id: '{{ _rc_resv_result.get("id","") if _rc_resv_result is mapping else "" }}'

        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _rc_reservation_id == "" }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  case: reservation_create
                  error: "Reservation create failed — HTTP {{ _rc_resv_adv.get('http_status','?') if _rc_resv_adv is mapping else '?' }}. No rooms were created."
            - stop: return
              response_variable: final_response

        # ── one upfront overlap-check read, reused per room (not one GET per room) ──
        - action: script.zen_sutra_twenty
          response_variable: _rc_overlap_adv
          continue_on_error: true
          data:
            action_type: get
            endpoint: 'stays?limit=200'
        - variables:
            _rc_overlap_body: >-
              {%- if _rc_overlap_adv is mapping and "result" in _rc_overlap_adv and "content" in _rc_overlap_adv["result"] -%}
                {{ _rc_overlap_adv["result"]["content"] }}
              {%- else -%}{{ {} }}{%- endif -%}
            _rc_overlap_all: >-
              {%- set _d = _rc_overlap_body.get('data', {}) if _rc_overlap_body is mapping else {} -%}
              {%- set _d = _d if _d is mapping else {} -%}
              {{ _d.get('stays', []) if _d.get('stays') is sequence else [] }}

        # ── per-room create loop ──────────────────────────────────────────
        - variables:
            _rc_results: []
        - repeat:
            for_each: '{{ rooms_json_norm }}'
            sequence:
            - variables:
                _rcr_area: "{{ repeat.item.get('area_id', '') | string | trim }}"
                _rcr_item_id: "{{ repeat.item.get('item_id', '') | string | trim if repeat.item.get('item_id', '') else item_id_norm }}"
                _rcr_start: >-
                  {%- set _raw = repeat.item.get('start_date', '') | string | trim -%}
                  {%- set _has_time = 'T' in _raw or _raw | length > 10 -%}
                  {%- set _has_explicit_tz = _raw.endswith('Z') or ('+' in _raw[10:]) or ('-' in _raw[10:]) -%}
                  {%- if _raw == "" or not _has_time or _has_explicit_tz -%}
                    {{ _raw }}
                  {%- else -%}
                    {%- set _naive = as_datetime(_raw) -%}
                    {{ (_naive - now().utcoffset()).isoformat() if _naive is not none else _raw }}
                  {%- endif -%}
                _rcr_end: >-
                  {%- set _raw = repeat.item.get('end_date', '') | string | trim -%}
                  {%- set _has_time = 'T' in _raw or _raw | length > 10 -%}
                  {%- set _has_explicit_tz = _raw.endswith('Z') or ('+' in _raw[10:]) or ('-' in _raw[10:]) -%}
                  {%- if _raw == "" or not _has_time or _has_explicit_tz -%}
                    {{ _raw }}
                  {%- else -%}
                    {%- set _naive = as_datetime(_raw) -%}
                    {{ (_naive - now().utcoffset()).isoformat() if _naive is not none else _raw }}
                  {%- endif -%}
                _rcr_occupants: "{{ repeat.item.get('occupant_names', '') | string | trim }}"
                _rcr_note: "{{ repeat.item.get('note', '') | string | trim }}"
            - variables:
                _rcr_status: >-
                  {%- set _utc_tz = utcnow().tzinfo -%}
                  {%- set _rts = (_rcr_start | as_datetime).replace(tzinfo=_utc_tz) | as_timestamp if _rcr_start != '' else none -%}
                  {{ 'RESERVED' if _rts is not none and _rts > now().timestamp() else 'ACTIVE' }}
                _rcr_overlaps: >-
                  {%- set _utc_tz = utcnow().tzinfo -%}
                  {%- set ns = namespace(out=[]) -%}
                  {%- set _new_start = (_rcr_start | as_datetime).replace(tzinfo=_utc_tz) | as_timestamp if _rcr_start != '' else none -%}
                  {%- set _new_end_raw = ((_rcr_end | as_datetime).replace(tzinfo=_utc_tz) | as_timestamp) if _rcr_end != '' else none -%}
                  {%- set _new_end_eff = _new_end_raw if _new_end_raw is not none else _new_start -%}
                  {%- for s in _rc_overlap_all if s is mapping and s.get('status','') != 'RELEASED' and s.get('roomAreaId','') == _rcr_area -%}
                    {%- set _os = s.get('checkIn','') | as_datetime | as_timestamp if s.get('checkIn','') else none -%}
                    {%- set _oe_raw = s.get('checkOut','') -%}
                    {%- set _oe = (_oe_raw | as_datetime | as_timestamp) if _oe_raw else none -%}
                    {%- set _o_end_eff = _oe if _oe is not none else _os -%}
                    {%- if _os is not none and _new_start is not none and _os <= _new_end_eff and _o_end_eff >= _new_start -%}
                      {%- set ns.out = ns.out + [{'id': s.get('id',''), 'check_in': s.get('checkIn',''), 'check_out': s.get('checkOut','')}] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ ns.out }}
            - choose:
              - conditions:
                - condition: template
                  value_template: '{{ block_on_overlap_norm and _rcr_overlaps | length > 0 }}'
                sequence:
                - variables:
                    _rc_results: "{{ _rc_results + [{'area_id': _rcr_area, 'status': 'skipped_overlap', 'overlapping_stays': _rcr_overlaps}] }}"
              default:
              - variables:
                  _rcr_payload: >-
                    {{ {'guestContactId': _rcr_item_id, 'roomAreaId': _rcr_area, 'checkIn': _rcr_start, 'checkOut': (_rcr_end if _rcr_end != '' else none), 'status': _rcr_status, 'notes': _rcr_note, 'turnoverSpawned': false, 'prepSpawned': false, 'checkoutNudgeSpawned': false, 'occupantNames': _rcr_occupants, 'reservationId': _rc_reservation_id} | tojson }}
              - action: script.zen_sutra_twenty
                response_variable: _rcr_adv
                continue_on_error: true
                data:
                  action_type: post
                  endpoint: stays
                  payload: '{{ _rcr_payload }}'
              - variables:
                  _rcr_body: >-
                    {%- if _rcr_adv is mapping and "result" in _rcr_adv and "content" in _rcr_adv["result"] -%}
                      {{ _rcr_adv["result"]["content"] }}
                    {%- else -%}{{ {} }}{%- endif -%}
                  _rcr_result: '{{ _rcr_body.get("data", {}).get("createStay", _rcr_body.get("data", {})) if _rcr_body is mapping else {} }}'
                  _rcr_stay_id: '{{ _rcr_result.get("id","") if _rcr_result is mapping else "" }}'
              - variables:
                  _rc_results: >-
                    {{ _rc_results + [{'area_id': _rcr_area, 'status': ('created' if _rcr_stay_id != '' else 'error'), 'stay_id': _rcr_stay_id,
                       'warning': (('Room already has ' ~ (_rcr_overlaps | length) ~ ' overlapping stay(s) in this window.') if _rcr_overlaps | length > 0 else none)} ] }}

        - variables:
            final_response:
              status: "{{ 'success' if (_rc_results | selectattr('status', 'equalto', 'created') | list | length) > 0 else 'error' }}"
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: reservation_create
              result:
                reservation_id: '{{ _rc_reservation_id }}'
                party_label: '{{ party_label_norm }}'
                status: '{{ _rc_status }}'
                rooms: '{{ _rc_results }}'
                count_created: '{{ _rc_results | selectattr("status", "equalto", "created") | list | length }}'
                count_skipped: '{{ _rc_results | rejectattr("status", "equalto", "created") | list | length }}'
              error: none
        - stop: return
          response_variable: final_response

    # ── case: reservation_get ────────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "reservation_get" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ item_id_norm == "" }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  case: reservation_get
                  error: item_id required (the reservation UUID).
            - stop: return
              response_variable: final_response
        - action: script.zen_sutra_twenty
          response_variable: _rg_adv
          continue_on_error: true
          data:
            action_type: get
            endpoint: 'reservations/{{ item_id_norm }}'
        - variables:
            _rg_ok: '{{ _rg_adv is mapping and _rg_adv.get("status") == "success" }}'
            _rg_body: >-
              {%- if _rg_adv is mapping and "result" in _rg_adv and "content" in _rg_adv["result"] -%}
                {{ _rg_adv["result"]["content"] }}
              {%- else -%}{{ {} }}{%- endif -%}
            _rg_r: '{{ _rg_body.get("data", {}).get("reservation", _rg_body.get("data", {})) if _rg_body is mapping else {} }}'
        - action: script.zen_sutra_twenty
          response_variable: _rg_stays_adv
          continue_on_error: true
          data:
            action_type: get
            endpoint: 'stays?limit=200'
        - variables:
            _rg_stays_body: >-
              {%- if _rg_stays_adv is mapping and "result" in _rg_stays_adv and "content" in _rg_stays_adv["result"] -%}
                {{ _rg_stays_adv["result"]["content"] }}
              {%- else -%}{{ {} }}{%- endif -%}
            _rg_stays_all: >-
              {%- set _d = _rg_stays_body.get('data', {}) if _rg_stays_body is mapping else {} -%}
              {%- set _d = _d if _d is mapping else {} -%}
              {{ _d.get('stays', []) if _d.get('stays') is sequence else [] }}
            _rg_member_stays: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for s in _rg_stays_all if s is mapping and s.get('reservationId','') == item_id_norm -%}
                {%- set ns.out = ns.out + [{'id': s.get('id',''), 'area_id': s.get('roomAreaId',''), 'check_in': s.get('checkIn',''), 'check_out': s.get('checkOut',''), 'status': s.get('status','')}] -%}
              {%- endfor -%}
              {{ ns.out }}
        - variables:
            final_response:
              status: '{{ "success" if _rg_ok and _rg_r else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: reservation_get
              result:
                id: '{{ _rg_r.get("id","") if _rg_r is mapping else "" }}'
                primary_guest_contact_id: '{{ _rg_r.get("primaryGuestContactId","") if _rg_r is mapping else "" }}'
                party_label: '{{ _rg_r.get("partyLabel","") if _rg_r is mapping else "" }}'
                status: '{{ _rg_r.get("status","") if _rg_r is mapping else "" }}'
                notes: '{{ _rg_r.get("notes","") if _rg_r is mapping else "" }}'
                rooms: '{{ _rg_member_stays }}'
              error: '{{ none if (_rg_ok and _rg_r) else ("not found — HTTP " ~ _rg_adv.get("http_status","?") if _rg_adv is mapping else "broker error") }}'
        - stop: return
          response_variable: final_response

    # ── case: reservations_active_list ───────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "reservations_active_list" }}'
        sequence:
        - action: script.zen_sutra_twenty
          response_variable: _ral_adv
          continue_on_error: true
          data:
            action_type: get
            endpoint: 'reservations?limit={{ limit_norm }}'
        - variables:
            _ral_ok: '{{ _ral_adv is mapping and _ral_adv.get("status") == "success" }}'
            _ral_body: >-
              {%- if _ral_adv is mapping and "result" in _ral_adv and "content" in _ral_adv["result"] -%}
                {{ _ral_adv["result"]["content"] }}
              {%- else -%}{{ {} }}{%- endif -%}
            _ral_all: >-
              {%- set _d = _ral_body.get('data', {}) if _ral_body is mapping else {} -%}
              {%- set _d = _d if _d is mapping else {} -%}
              {{ _d.get('reservations', []) if _d.get('reservations') is sequence else [] }}
            _ral_filtered: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for r in _ral_all if r is mapping and r.get('status','') not in ['CHECKED_OUT', 'CANCELLED', 'NO_SHOW'] -%}
                {%- set ns.out = ns.out + [{'id': r.get('id',''), 'primary_guest_contact_id': r.get('primaryGuestContactId',''), 'party_label': r.get('partyLabel',''), 'status': r.get('status','')}] -%}
              {%- endfor -%}
              {{ ns.out }}
        - variables:
            final_response:
              status: '{{ "success" if _ral_ok else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: reservations_active_list
              result:
                reservations: '{{ _ral_filtered }}'
                count: '{{ _ral_filtered | length }}'
              error: '{{ none if _ral_ok else "broker error" }}'
        - stop: return
          response_variable: final_response

    # ── case: reservation_checkout ───────────────────────────────────────────────
    # Reservation-level checkout — releases every member stay not yet RELEASED
    # (each gets the exact same PATCH + turnover-chore-dispatch + hot-tub-
    # recheck logic stay_release runs, one room at a time), then marks the
    # reservation CHECKED_OUT. Calls script.zen_sutra_twenty directly per the
    # non-recursion rule (never script.zen_dojotools_rolodex).
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "reservation_checkout" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ item_id_norm == "" }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  case: reservation_checkout
                  error: item_id required (the reservation UUID).
            - stop: return
              response_variable: final_response

        - action: script.zen_sutra_twenty
          response_variable: _rco_get_adv
          continue_on_error: true
          data:
            action_type: get
            endpoint: 'reservations/{{ item_id_norm }}'
        - variables:
            _rco_body: >-
              {%- if _rco_get_adv is mapping and "result" in _rco_get_adv and "content" in _rco_get_adv["result"] -%}
                {{ _rco_get_adv["result"]["content"] }}
              {%- else -%}{{ {} }}{%- endif -%}
            _rco_resv: '{{ _rco_body.get("data", {}).get("reservation", _rco_body.get("data", {})) if _rco_body is mapping else {} }}'

        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _rco_resv is not mapping or _rco_resv.get("id","") == "" }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  case: reservation_checkout
                  error: "reservation not found: {{ item_id_norm }}"
            - stop: return
              response_variable: final_response

          # idempotency guard — mirrors stay_release's own already-released short-circuit
          - conditions:
            - condition: template
              value_template: '{{ _rco_resv.get("status","") == "CHECKED_OUT" }}'
            sequence:
            - variables:
                final_response:
                  status: success
                  tool: '{{ tool_name }}'
                  case: reservation_checkout
                  result:
                    id: '{{ item_id_norm }}'
                    already_checked_out: true
                    rooms_checked_out: []
                  error: none
            - stop: return
              response_variable: final_response

          default:
          - action: script.zen_sutra_twenty
            response_variable: _rco_stays_adv
            continue_on_error: true
            data:
              action_type: get
              endpoint: 'stays?limit=200'
          - variables:
              _rco_stays_body: >-
                {%- if _rco_stays_adv is mapping and "result" in _rco_stays_adv and "content" in _rco_stays_adv["result"] -%}
                  {{ _rco_stays_adv["result"]["content"] }}
                {%- else -%}{{ {} }}{%- endif -%}
              _rco_stays_all: >-
                {%- set _d = _rco_stays_body.get('data', {}) if _rco_stays_body is mapping else {} -%}
                {%- set _d = _d if _d is mapping else {} -%}
                {{ _d.get('stays', []) if _d.get('stays') is sequence else [] }}
              _rco_member_stays: >-
                {%- set ns = namespace(out=[]) -%}
                {%- for s in _rco_stays_all if s is mapping and s.get('reservationId','') == item_id_norm and s.get('status','') != 'RELEASED' -%}
                  {%- set ns.out = ns.out + [s] -%}
                {%- endfor -%}
                {{ ns.out }}

          - variables:
              _rco_results: []
          - repeat:
              for_each: '{{ _rco_member_stays }}'
              sequence:
              - variables:
                  _rcs_id: "{{ repeat.item.get('id', '') }}"
                  _rcs_area: "{{ repeat.item.get('roomAreaId','') }}"
                  _rcs_guest_id: "{{ repeat.item.get('guestContactId','') }}"
                  _rcs_check_in: "{{ repeat.item.get('checkIn','') }}"
                  _rcs_check_out: "{{ repeat.item.get('checkOut','') }}"
              - variables:
                  _rcs_nights: >-
                    {%- set _ci = _rcs_check_in | as_datetime -%}
                    {%- set _co = (_rcs_check_out | as_datetime) if _rcs_check_out else now() -%}
                    {{ ((_co - _ci).total_seconds() / 86400) | round(1, 'floor') if _ci is not none and _co is not none else 0 }}
                  _rcs_correlation_tag: "{{ 'stay:' ~ _rcs_id ~ ' reservation:' ~ item_id_norm }}"

              # ── allergen prefs ──────────────────────────────────────────
              - action: script.zen_sutra_twenty
                response_variable: _rcs_guest_adv
                continue_on_error: true
                data:
                  action_type: get
                  endpoint: 'people/{{ _rcs_guest_id }}'
              - variables:
                  _rcs_guest_body: >-
                    {%- if _rcs_guest_adv is mapping and "result" in _rcs_guest_adv and "content" in _rcs_guest_adv["result"] -%}
                      {{ _rcs_guest_adv["result"]["content"] }}
                    {%- else -%}{{ {} }}{%- endif -%}
                  _rcs_guest_p: '{{ _rcs_guest_body.get("data", {}).get("person", _rcs_guest_body.get("data", {})) if _rcs_guest_body is mapping else {} }}'
              - variables:
                  _rcs_guest_prefs_raw: '{{ _rcs_guest_p.get("guestPrefs", "") if _rcs_guest_p is mapping else "" }}'
                  _rcs_guest_prefs: >-
                    {%- set _gp = _rcs_guest_prefs_raw -%}
                    {%- if _gp is mapping -%}{{ _gp }}
                    {%- elif _gp is string and _gp | trim not in ['', 'none', 'null'] -%}
                      {{ (_gp | from_json) if (_gp | trim)[:1] in ['{', '['] else {} }}
                    {%- else -%}{{ {} }}{%- endif -%}
                  _rcs_has_allergens: '{{ _rcs_guest_prefs is mapping and (_rcs_guest_prefs.get("allergens", []) | list | length) > 0 }}'

              # ── mark released ────────────────────────────────────────────
              - action: script.zen_sutra_twenty
                continue_on_error: true
                data:
                  action_type: patch
                  endpoint: 'stays/{{ _rcs_id }}'
                  payload: '{{ {"status": "RELEASED", "turnoverSpawned": true} | tojson }}'

              # ── turnover chore ────────────────────────────────────────────
              - variables:
                  _rcs_chore_item: >-
                    {{ 'Deep clean (allergen stay) — turnover' if _rcs_has_allergens
                       else ('Deep clean (extended stay, ' ~ (_rcs_nights | int) ~ ' nights) — turnover' if _rcs_nights | float >= 3
                       else 'Standard turnover clean') }}
              - action: script.zen_dojotools_taskmaster
                continue_on_error: true
                data:
                  mode: task_create
                  item: '{{ _rcs_chore_item }}'
                  chore: true
                  area: '{{ _rcs_area }}'
                  note: "Guest stay released (reservation checkout). Check-in: {{ _rcs_check_in }}. {{ 'Allergen prefs on file — sanitize thoroughly.' if _rcs_has_allergens else '' }} {{ _rcs_correlation_tag }}"

              # ── mark room dirty — decoupled housekeeping status ──────────
              - action: script.zen_dojotools_room_manager
                continue_on_error: true
                data:
                  mode: room_status_set
                  area: '{{ _rcs_area }}'
                  room_status: dirty
                  room_status_source: turnover
                  room_status_note: "Turnover chore dispatched (reservation checkout): {{ _rcs_chore_item }}"

              # ── hot tub recheck if active during this room's stay window ──
              - action: script.zen_dojotools_filecabinet
                response_variable: _rcs_hottub_kata_raw
                continue_on_error: true
                data:
                  action_type: get
                  volume_entity_id: sensor.zenos_kata_cabinet
                  key: hot_tub_manager
              - variables:
                  _rcs_hottub_updated_at: '{{ _rcs_hottub_kata_raw.get("value", {}).get("updated_at", "") if _rcs_hottub_kata_raw is mapping and _rcs_hottub_kata_raw.get("status") == "success" else "" }}'
                  _rcs_hottub_active: >-
                    {%- set _u = _rcs_hottub_updated_at | as_datetime if _rcs_hottub_updated_at != '' else none -%}
                    {%- set _ci = _rcs_check_in | as_datetime if _rcs_check_in != '' else none -%}
                    {{ _u is not none and _ci is not none and _u >= _ci }}
              - choose:
                - conditions:
                  - condition: template
                    value_template: '{{ _rcs_hottub_active }}'
                  sequence:
                  - action: script.zen_dojotools_taskmaster
                    continue_on_error: true
                    data:
                      mode: task_create
                      item: "Hot tub recheck after guest stay"
                      chore: true
                      area: '{{ _rcs_area }}'
                      note: "Spa/hot tub activity detected during this stay window — verify chemistry and reset for next guest. {{ _rcs_correlation_tag }}"

              - variables:
                  _rco_results: "{{ _rco_results + [{'stay_id': _rcs_id, 'area_id': _rcs_area, 'nights': _rcs_nights, 'turnover_chore': _rcs_chore_item, 'hot_tub_recheck_spawned': _rcs_hottub_active}] }}"

          # ── mark reservation checked out ───────────────────────────────
          - action: script.zen_sutra_twenty
            continue_on_error: true
            data:
              action_type: patch
              endpoint: 'reservations/{{ item_id_norm }}'
              payload: '{{ {"status": "CHECKED_OUT"} | tojson }}'

          - variables:
              final_response:
                status: success
                tool: '{{ tool_name }}'
                version: '{{ tool_version }}'
                case: reservation_checkout
                result:
                  id: '{{ item_id_norm }}'
                  rooms_checked_out: '{{ _rco_results }}'
                  count: '{{ _rco_results | length }}'
                error: none
          - stop: return
            response_variable: final_response

    # ── case: reservation_cancel ──────────────────────────────────────────────────
    # Cancels the booking-level record only — does NOT touch child stays'
    # own status (documented gap, matches stay_delete's own accepted
    # not-touching-spawned-chores precedent; the new stay:/reservation:
    # correlation tags land in Taskmaster's free-text note field, not a
    # queryable structured field, so automated chore cleanup here would need
    # new full-text-scan infrastructure disproportionate to the ask).
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "reservation_cancel" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ item_id_norm == "" }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  case: reservation_cancel
                  error: item_id required (the reservation UUID).
            - stop: return
              response_variable: final_response
        - action: script.zen_sutra_twenty
          response_variable: _rcn_get_adv
          continue_on_error: true
          data:
            action_type: get
            endpoint: 'reservations/{{ item_id_norm }}'
        - variables:
            _rcn_body: >-
              {%- if _rcn_get_adv is mapping and "result" in _rcn_get_adv and "content" in _rcn_get_adv["result"] -%}
                {{ _rcn_get_adv["result"]["content"] }}
              {%- else -%}{{ {} }}{%- endif -%}
            _rcn_resv: '{{ _rcn_body.get("data", {}).get("reservation", _rcn_body.get("data", {})) if _rcn_body is mapping else {} }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _rcn_resv is not mapping or _rcn_resv.get("id","") == "" }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  case: reservation_cancel
                  error: "reservation not found: {{ item_id_norm }}"
            - stop: return
              response_variable: final_response
          - conditions:
            - condition: template
              value_template: '{{ _rcn_resv.get("status","") == "CHECKED_OUT" }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  case: reservation_cancel
                  error: "cannot cancel a reservation that is already CHECKED_OUT — release/manage the individual stays instead."
            - stop: return
              response_variable: final_response
          - conditions:
            - condition: template
              value_template: '{{ _rcn_resv.get("status","") == "CANCELLED" }}'
            sequence:
            - variables:
                final_response:
                  status: success
                  tool: '{{ tool_name }}'
                  case: reservation_cancel
                  result:
                    id: '{{ item_id_norm }}'
                    already_cancelled: true
                  error: none
            - stop: return
              response_variable: final_response
          default:
          - action: script.zen_sutra_twenty
            response_variable: _rcn_patch_adv
            continue_on_error: true
            data:
              action_type: patch
              endpoint: 'reservations/{{ item_id_norm }}'
              payload: '{{ {"status": "CANCELLED"} | tojson }}'
          - variables:
              _rcn_ok: '{{ _rcn_patch_adv is mapping and _rcn_patch_adv.get("status") == "success" }}'
              final_response:
                status: '{{ "success" if _rcn_ok else "error" }}'
                tool: '{{ tool_name }}'
                case: reservation_cancel
                result:
                  id: '{{ item_id_norm }}'
                  note: "Reservation cancelled. Member stay records were NOT touched — release/delete them individually if needed."
                error: '{{ none if _rcn_ok else "cancel failed — HTTP " ~ _rcn_patch_adv.get("http_status","?") if _rcn_patch_adv is mapping else "broker error" }}'
          - stop: return
            response_variable: final_response

    # ── case: stay_delete ─────────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "stay_delete" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ item_id_norm == "" }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  case: stay_delete
                  error: item_id required. Use stays_active_list first.
            - stop: return
              response_variable: final_response
        - action: script.zen_sutra_twenty
          response_variable: _std_adv
          continue_on_error: true
          data:
            action_type: delete
            endpoint: 'stays/{{ item_id_norm }}'
        - variables:
            _std_ok: '{{ _std_adv is mapping and _std_adv.get("status") == "success" }}'
            final_response:
              status: '{{ "success" if _std_ok else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: stay_delete
              result:
                id: '{{ item_id_norm }}'
                deleted: '{{ _std_ok }}'
                note: "Twenty soft-deletes — record moves to trash, recoverable there for a retention window, not immediately purged."
              error: '{{ none if _std_ok else ("delete failed — HTTP " ~ _std_adv.get("http_status","?") if _std_adv is mapping else "broker error") }}'
        - stop: return
          response_variable: final_response

    # ── case: stay_amenity_add ────────────────────────────────────────────────
    # Mid-stay housekeeping — turndown/amenity tasks that aren't the checkout
    # turnover chore. Uses zen_dojotools_inventory tasks_add directly (NOT
    # Taskmaster task_create) because this needs a real future due date tied
    # to a specific day of the stay — Taskmaster's chore path only supports
    # recurrence (period_days), not "due on this exact date." tasks_add's
    # best_before_date + homeassistant_area_id is the correct location-tied,
    # dated primitive for this. Caller can invoke this once per amenity (a
    # towel refresh at day 3, a welcome basket at day 0, etc.) — this is a
    # single primitive, not a policy engine that auto-schedules a package.
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "stay_amenity_add" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ item_id_norm == "" or amenity_norm == "" }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  case: stay_amenity_add
                  error: item_id (stay id) and amenity (task title) are required.
            - stop: return
              response_variable: final_response
        - action: script.zen_sutra_twenty
          response_variable: _saa_get_adv
          continue_on_error: true
          data:
            action_type: get
            endpoint: 'stays/{{ item_id_norm }}'
        - variables:
            _saa_get_body: >-
              {%- if _saa_get_adv is mapping and "result" in _saa_get_adv and "content" in _saa_get_adv["result"] -%}
                {{ _saa_get_adv["result"]["content"] }}
              {%- else -%}{{ {} }}{%- endif -%}
            _saa_stay: '{{ _saa_get_body.get("data", {}).get("stay", _saa_get_body.get("data", {})) if _saa_get_body is mapping else {} }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _saa_stay is not mapping or _saa_stay.get("id","") == "" }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  case: stay_amenity_add
                  error: "stay not found: {{ item_id_norm }}"
            - stop: return
              response_variable: final_response
        - variables:
            _saa_area: '{{ _saa_stay.get("roomAreaId","") }}'
            _saa_check_in: '{{ _saa_stay.get("checkIn","") }}'
            _saa_check_out: '{{ _saa_stay.get("checkOut","") }}'
        - variables:
            _saa_due_date: >-
              {%- set _ci = _saa_check_in | as_datetime if _saa_check_in != '' else none -%}
              {{ ((_ci + timedelta(days=day_offset_norm)).date().isoformat()) if _ci is not none else none }}
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _saa_due_date is none }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  case: stay_amenity_add
                  error: "Could not compute a due date — stay {{ item_id_norm }} has no valid checkIn recorded."
            - stop: return
              response_variable: final_response
        - variables:
            _saa_past_checkout: >-
              {%- set _co_epoch = (_saa_check_out | as_datetime | as_timestamp) if _saa_check_out != '' else none -%}
              {%- set _due_epoch = _saa_due_date | as_datetime | as_timestamp -%}
              {{ _co_epoch is not none and _due_epoch is not none and _due_epoch > _co_epoch }}
        - action: script.zen_dojotools_inventory
          response_variable: _saa_task_resp
          continue_on_error: true
          data:
            mode: tasks_add
            item: '{{ amenity_norm }}'
            note: "{{ 'Guest stay ' ~ item_id_norm ~ '.' ~ (' Note: ' ~ note_body_norm if note_body_norm != '' else '') }}"
            best_before_date: '{{ _saa_due_date }}'
            homeassistant_area_id: '{{ _saa_area }}'
        - variables:
            _saa_ok: '{{ _saa_task_resp is mapping and _saa_task_resp.get("status") == "success" }}'
            final_response:
              status: '{{ "success" if _saa_ok else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: stay_amenity_add
              result:
                stay_id: '{{ item_id_norm }}'
                area_id: '{{ _saa_area }}'
                amenity: '{{ amenity_norm }}'
                due_date: '{{ _saa_due_date }}'
                task_id: '{{ _saa_task_resp.get("task_id", none) if _saa_ok else none }}'
              warning: "{{ 'due_date falls after this stay''s checkout (' ~ _saa_check_out ~ ') — task was still created, but double-check the day_offset.' if _saa_past_checkout else none }}"
              error: '{{ none if _saa_ok else "Inventory tasks_add failed — see logs." }}'
        - stop: return
          response_variable: final_response

    # ── case: appt_create ────────────────────────────────────────────────────
    # Structured vendor appointment (front-of-house scheduling). item_id is
    # the VENDOR's Twenty Person/Company UUID — use contact_find/company_find
    # first. Same area validation + overlap-warning pattern as stay_create.
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "appt_create" }}'
        sequence:
        - variables:
            _apc_missing: >-
              {%- if item_id_norm == "" -%}item_id (vendor UUID — use contact_find/company_find first)
              {%- elif area_id_norm == "" -%}area_id
              {%- elif start_date_norm == "" -%}start_date
              {%- else -%}{%- endif -%}
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _apc_missing | trim != "" }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  case: appt_create
                  error: "Missing required field: {{ _apc_missing | trim }}"
            - stop: return
              response_variable: final_response

        - choose:
          - conditions:
            - condition: template
              value_template: '{{ area_id_norm not in (areas() | list) }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  case: appt_create
                  error: "area_id '{{ area_id_norm }}' is not a known HA area."
                  known_areas_sample: '{{ (areas() | list)[:20] }}'
            - stop: return
              response_variable: final_response

        # ── soft check: overlapping appointment in the same room — warn only
        - action: script.zen_sutra_twenty
          response_variable: _apc_overlap_adv
          continue_on_error: true
          data:
            action_type: get
            endpoint: 'appointments?limit=100'
        - variables:
            _apc_overlap_body: >-
              {%- if _apc_overlap_adv is mapping and "result" in _apc_overlap_adv and "content" in _apc_overlap_adv["result"] -%}
                {{ _apc_overlap_adv["result"]["content"] }}
              {%- else -%}{{ {} }}{%- endif -%}
            _apc_overlap_all: >-
              {%- set _d = _apc_overlap_body.get('data', {}) if _apc_overlap_body is mapping else {} -%}
              {%- set _d = _d if _d is mapping else {} -%}
              {{ _d.get('appointments', []) if _d.get('appointments') is sequence else [] }}
        - variables:
            _apc_overlap_candidates: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for a in _apc_overlap_all if a is mapping -%}
                {%- if a.get('status','') not in ['COMPLETED', 'NO_SHOW', 'CANCELLED'] and a.get('roomAreaId','') == area_id_norm -%}
                  {%- set ns.out = ns.out + [{'id': a.get('id',''), 'vendor_id': a.get('vendorId',''), 'scheduled_start': a.get('scheduledStart',''), 'scheduled_end': a.get('scheduledEnd','')}] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out }}
        - variables:
            _apc_overlaps: >-
              {%- set _utc_tz = utcnow().tzinfo -%}
              {%- set _new_start = (start_date_norm | as_datetime).replace(tzinfo=_utc_tz) | as_timestamp -%}
              {%- set _new_end_raw = ((end_date_norm | as_datetime).replace(tzinfo=_utc_tz) | as_timestamp) if end_date_norm != "" else none -%}
              {%- set _new_end_eff = _new_end_raw if _new_end_raw is not none else _new_start -%}
              {%- set ns = namespace(out=[]) -%}
              {%- for a in _apc_overlap_candidates if a is mapping -%}
                {%- set _os = a.get('scheduled_start','') | as_datetime | as_timestamp -%}
                {%- set _oe_raw = a.get('scheduled_end','') -%}
                {%- set _oe = (_oe_raw | as_datetime | as_timestamp) if _oe_raw else none -%}
                {%- set _o_end_eff = _oe if _oe is not none else _os -%}
                {%- if _os is not none and _new_start is not none and _os <= _new_end_eff and _o_end_eff >= _new_start -%}
                  {%- set ns.out = ns.out + [a] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out }}

        - choose:
          - conditions:
            - condition: template
              value_template: '{{ block_on_overlap_norm and _apc_overlaps | length > 0 }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  case: appt_create
                  error: "Room already has a vendor appointment in this window — blocked (block_on_overlap=true)."
                  overlapping_appointments: '{{ _apc_overlaps }}'
            - stop: return
              response_variable: final_response

        - variables:
            _apc_payload: >-
              {{ {'vendorId': item_id_norm, 'roomAreaId': area_id_norm, 'scheduledStart': start_date_norm, 'scheduledEnd': (end_date_norm if end_date_norm != '' else none), 'status': 'SCHEDULED', 'issueDescription': note_body_norm, 'requiresFollowup': false} | tojson }}
        - action: script.zen_sutra_twenty
          response_variable: _apc_adv
          continue_on_error: true
          data:
            action_type: post
            endpoint: appointments
            payload: '{{ _apc_payload }}'
        - variables:
            _apc_ok: '{{ _apc_adv is mapping and _apc_adv.get("status") == "success" }}'
            _apc_body: >-
              {%- if _apc_adv is mapping and "result" in _apc_adv and "content" in _apc_adv["result"] -%}
                {{ _apc_adv["result"]["content"] }}
              {%- else -%}{{ {} }}{%- endif -%}
            _apc_result: '{{ _apc_body.get("data", {}).get("createAppointment", _apc_body.get("data", {})) if _apc_body is mapping else {} }}'
        - variables:
            final_response:
              status: '{{ "success" if _apc_ok and _apc_result is mapping and _apc_result.get("id","") != "" else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: appt_create
              result:
                id: '{{ _apc_result.get("id","") if _apc_result is mapping else "" }}'
                status: SCHEDULED
                vendor_id: '{{ item_id_norm }}'
                area_id: '{{ area_id_norm }}'
                scheduled_start: '{{ start_date_norm }}'
                scheduled_end: '{{ end_date_norm if end_date_norm != "" else none }}'
              warning: '{{ ("Room already has " ~ (_apc_overlaps | length) ~ " overlapping appointment(s) in this window.") if _apc_overlaps | length > 0 else none }}'
              overlapping_appointments: '{{ _apc_overlaps if _apc_overlaps | length > 0 else [] }}'
              error: '{{ none if (_apc_ok and _apc_result is mapping and _apc_result.get("id","") != "") else ("create failed — HTTP " ~ _apc_adv.get("http_status","?") if _apc_adv is mapping else "broker error") }}'
        - stop: return
          response_variable: final_response

    # ── case: appt_get ────────────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "appt_get" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ item_id_norm == "" }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  case: appt_get
                  error: item_id required. Use appts_active_list first.
            - stop: return
              response_variable: final_response
        - action: script.zen_sutra_twenty
          response_variable: _apg_adv
          continue_on_error: true
          data:
            action_type: get
            endpoint: 'appointments/{{ item_id_norm }}'
        - variables:
            _apg_ok: '{{ _apg_adv is mapping and _apg_adv.get("status") == "success" }}'
            _apg_body: >-
              {%- if _apg_adv is mapping and "result" in _apg_adv and "content" in _apg_adv["result"] -%}
                {{ _apg_adv["result"]["content"] }}
              {%- else -%}{{ {} }}{%- endif -%}
            _apg_a: '{{ _apg_body.get("data", {}).get("appointment", _apg_body.get("data", {})) if _apg_body is mapping else {} }}'
        - variables:
            final_response:
              status: '{{ "success" if _apg_ok and _apg_a else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: appt_get
              result:
                id: '{{ _apg_a.get("id","") if _apg_a is mapping else "" }}'
                vendor_id: '{{ _apg_a.get("vendorId","") if _apg_a is mapping else "" }}'
                area_id: '{{ _apg_a.get("roomAreaId","") if _apg_a is mapping else "" }}'
                scheduled_start: '{{ _apg_a.get("scheduledStart","") if _apg_a is mapping else "" }}'
                scheduled_end: '{{ _apg_a.get("scheduledEnd","") if _apg_a is mapping else "" }}'
                status: '{{ _apg_a.get("status","") if _apg_a is mapping else "" }}'
                issue_description: '{{ _apg_a.get("issueDescription","") if _apg_a is mapping else "" }}'
                completion_notes: '{{ _apg_a.get("completionNotes","") if _apg_a is mapping else "" }}'
                requires_followup: '{{ _apg_a.get("requiresFollowup", false) if _apg_a is mapping else false }}'
              error: '{{ none if (_apg_ok and _apg_a) else ("not found — HTTP " ~ _apg_adv.get("http_status","?") if _apg_adv is mapping else "broker error") }}'
        - stop: return
          response_variable: final_response

    # ── case: appts_active_list ───────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "appts_active_list" }}'
        sequence:
        - action: script.zen_sutra_twenty
          response_variable: _apl_adv
          continue_on_error: true
          data:
            action_type: get
            endpoint: 'appointments?limit={{ limit_norm }}'
        - variables:
            _apl_ok: '{{ _apl_adv is mapping and _apl_adv.get("status") == "success" }}'
            _apl_body: >-
              {%- if _apl_adv is mapping and "result" in _apl_adv and "content" in _apl_adv["result"] -%}
                {{ _apl_adv["result"]["content"] }}
              {%- else -%}{{ {} }}{%- endif -%}
            _apl_all: >-
              {%- set _d = _apl_body.get('data', {}) if _apl_body is mapping else {} -%}
              {%- set _d = _d if _d is mapping else {} -%}
              {{ _d.get('appointments', []) if _d.get('appointments') is sequence else [] }}
        - variables:
            _apl_filtered: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for a in _apl_all if a is mapping -%}
                {%- if a.get('status','') not in ['COMPLETED', 'NO_SHOW', 'CANCELLED'] and (area_id_norm == '' or a.get('roomAreaId','') == area_id_norm) -%}
                  {%- set ns.out = ns.out + [{'id': a.get('id',''), 'vendor_id': a.get('vendorId',''), 'area_id': a.get('roomAreaId',''), 'scheduled_start': a.get('scheduledStart',''), 'scheduled_end': a.get('scheduledEnd',''), 'status': a.get('status','')}] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out }}
        - variables:
            final_response:
              status: '{{ "success" if _apl_ok else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: appts_active_list
              result:
                appointments: '{{ _apl_filtered }}'
                count: '{{ _apl_filtered | length }}'
                area_id_filter: '{{ area_id_norm if area_id_norm != "" else none }}'
              error: '{{ none if _apl_ok else "broker error" }}'
        - stop: return
          response_variable: final_response

    # ── case: appt_start ──────────────────────────────────────────────────────
    # SCHEDULED -> IN_PROGRESS. Vendor actually arrived — distinct from just
    # having been booked, matters for no-show tracking.
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "appt_start" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ item_id_norm == "" }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  case: appt_start
                  error: item_id required. Use appts_active_list first.
            - stop: return
              response_variable: final_response
        - action: script.zen_sutra_twenty
          response_variable: _aps_adv
          continue_on_error: true
          data:
            action_type: patch
            endpoint: 'appointments/{{ item_id_norm }}'
            payload: '{{ {"status": "IN_PROGRESS"} | tojson }}'
        - variables:
            _aps_ok: '{{ _aps_adv is mapping and _aps_adv.get("status") == "success" }}'
            final_response:
              status: '{{ "success" if _aps_ok else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: appt_start
              result:
                id: '{{ item_id_norm }}'
                status: IN_PROGRESS
              error: '{{ none if _aps_ok else ("update failed — HTTP " ~ _aps_adv.get("http_status","?") if _aps_adv is mapping else "broker error") }}'
        - stop: return
          response_variable: final_response

    # ── case: appt_complete ───────────────────────────────────────────────────
    # Closes the loop vendor_history already promised — auto-writes a
    # completion note to the vendor's history rather than needing a manual
    # note every time.
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "appt_complete" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ item_id_norm == "" }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  case: appt_complete
                  error: item_id required. Use appts_active_list first.
            - stop: return
              response_variable: final_response

        - action: script.zen_sutra_twenty
          response_variable: _apcm_get_adv
          continue_on_error: true
          data:
            action_type: get
            endpoint: 'appointments/{{ item_id_norm }}'
        - variables:
            _apcm_get_body: >-
              {%- if _apcm_get_adv is mapping and "result" in _apcm_get_adv and "content" in _apcm_get_adv["result"] -%}
                {{ _apcm_get_adv["result"]["content"] }}
              {%- else -%}{{ {} }}{%- endif -%}
            _apcm_appt: '{{ _apcm_get_body.get("data", {}).get("appointment", _apcm_get_body.get("data", {})) if _apcm_get_body is mapping else {} }}'

        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _apcm_appt is not mapping or _apcm_appt.get("id","") == "" }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  case: appt_complete
                  error: "appointment not found: {{ item_id_norm }}"
            - stop: return
              response_variable: final_response

          - conditions:
            - condition: template
              value_template: '{{ _apcm_appt.get("status","") == "COMPLETED" }}'
            sequence:
            - variables:
                final_response:
                  status: success
                  tool: '{{ tool_name }}'
                  case: appt_complete
                  result:
                    id: '{{ item_id_norm }}'
                    already_completed: true
                  error: none
            - stop: return
              response_variable: final_response

          default:
          - variables:
              _apcm_vendor_id: '{{ _apcm_appt.get("vendorId","") }}'
              _apcm_requires_followup: '{{ requires_followup_norm if requires_followup_norm is defined else false }}'
          - action: script.zen_sutra_twenty
            response_variable: _apcm_patch_adv
            continue_on_error: true
            data:
              action_type: patch
              endpoint: 'appointments/{{ item_id_norm }}'
              payload: '{{ {"status": "COMPLETED", "completionNotes": note_body_norm, "requiresFollowup": _apcm_requires_followup} | tojson }}'
          - variables:
              _apcm_patch_ok: '{{ _apcm_patch_adv is mapping and _apcm_patch_adv.get("status") == "success" }}'
          # ── auto-note to vendor_history ──────────────────────────────────
          # vendor_history reads strictly via noteTargets.targetCompanyId, so
          # the note must be linked (same two-step create-then-link pattern
          # contact_note already uses), not just created bare.
          - variables:
              _apcm_note_id: ''
              _apcm_note_linked: false
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ _apcm_patch_ok and _apcm_vendor_id != "" }}'
              sequence:
              - action: script.zen_sutra_twenty
                response_variable: _apcm_note_adv
                continue_on_error: true
                data:
                  action_type: post
                  endpoint: notes
                  payload: >-
                    {{ {'title': 'Appointment completed', 'bodyV2': {'blocknote': none, 'markdown': ('Completed: ' ~ (note_body_norm if note_body_norm != '' else 'no notes.') ~ (' FOLLOW-UP NEEDED.' if _apcm_requires_followup else ''))}} | tojson }}
              - variables:
                  _apcm_note_body: >-
                    {%- if _apcm_note_adv is mapping and "result" in _apcm_note_adv and "content" in _apcm_note_adv["result"] -%}
                      {{ _apcm_note_adv["result"]["content"] }}
                    {%- else -%}{{ {} }}{%- endif -%}
                  _apcm_note_id: >-
                    {%- set _b = _apcm_note_body if _apcm_note_body is mapping else {} -%}
                    {%- set _d = _b.get('data') -%}
                    {%- set _d = _d if _d is mapping else {} -%}
                    {{ (_d.get('createNote') or _d).get('id', '') if (_d.get('createNote') or _d) is mapping else '' }}
              - choose:
                - conditions:
                  - condition: template
                    value_template: '{{ _apcm_note_id != "" }}'
                  sequence:
                  - action: script.zen_sutra_twenty
                    response_variable: _apcm_nt_adv
                    continue_on_error: true
                    data:
                      action_type: post
                      endpoint: noteTargets
                      payload: >-
                        {{ {'noteId': _apcm_note_id, 'targetCompanyId': _apcm_vendor_id} | tojson }}
                  - variables:
                      _apcm_note_linked: '{{ _apcm_nt_adv is mapping and _apcm_nt_adv.get("status") == "success" }}'
          - variables:
              final_response:
                status: '{{ "success" if _apcm_patch_ok else "error" }}'
                tool: '{{ tool_name }}'
                version: '{{ tool_version }}'
                case: appt_complete
                result:
                  id: '{{ item_id_norm }}'
                  vendor_id: '{{ _apcm_vendor_id }}'
                  requires_followup: '{{ _apcm_requires_followup }}'
                  vendor_history_noted: '{{ _apcm_note_linked }}'
                error: '{{ none if _apcm_patch_ok else ("update failed — HTTP " ~ _apcm_patch_adv.get("http_status","?") if _apcm_patch_adv is mapping else "broker error") }}'
          - stop: return
            response_variable: final_response

    # ── case: appt_no_show ────────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "appt_no_show" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ item_id_norm == "" }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  case: appt_no_show
                  error: item_id required. Use appts_active_list first.
            - stop: return
              response_variable: final_response
        - action: script.zen_sutra_twenty
          response_variable: _apns_adv
          continue_on_error: true
          data:
            action_type: patch
            endpoint: 'appointments/{{ item_id_norm }}'
            payload: '{{ {"status": "NO_SHOW"} | tojson }}'
        - variables:
            _apns_ok: '{{ _apns_adv is mapping and _apns_adv.get("status") == "success" }}'
            final_response:
              status: '{{ "success" if _apns_ok else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: appt_no_show
              result:
                id: '{{ item_id_norm }}'
                status: NO_SHOW
              error: '{{ none if _apns_ok else ("update failed — HTTP " ~ _apns_adv.get("http_status","?") if _apns_adv is mapping else "broker error") }}'
        - stop: return
          response_variable: final_response

    # ── case: appt_cancel ─────────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "appt_cancel" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ item_id_norm == "" }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  case: appt_cancel
                  error: item_id required. Use appts_active_list first.
            - stop: return
              response_variable: final_response
        - action: script.zen_sutra_twenty
          response_variable: _apcn_adv
          continue_on_error: true
          data:
            action_type: patch
            endpoint: 'appointments/{{ item_id_norm }}'
            payload: '{{ {"status": "CANCELLED"} | tojson }}'
        - variables:
            _apcn_ok: '{{ _apcn_adv is mapping and _apcn_adv.get("status") == "success" }}'
            final_response:
              status: '{{ "success" if _apcn_ok else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: appt_cancel
              result:
                id: '{{ item_id_norm }}'
                status: CANCELLED
              error: '{{ none if _apcn_ok else ("update failed — HTTP " ~ _apcn_adv.get("http_status","?") if _apcn_adv is mapping else "broker error") }}'
        - stop: return
          response_variable: final_response

    # ── case: appt_delete ─────────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "appt_delete" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ item_id_norm == "" }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  case: appt_delete
                  error: item_id required. Use appts_active_list first.
            - stop: return
              response_variable: final_response
        - action: script.zen_sutra_twenty
          response_variable: _apd_adv
          continue_on_error: true
          data:
            action_type: delete
            endpoint: 'appointments/{{ item_id_norm }}'
        - variables:
            _apd_ok: '{{ _apd_adv is mapping and _apd_adv.get("status") == "success" }}'
            final_response:
              status: '{{ "success" if _apd_ok else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: appt_delete
              result:
                id: '{{ item_id_norm }}'
                deleted: '{{ _apd_ok }}'
                note: "Twenty soft-deletes — record moves to trash, recoverable there for a retention window, not immediately purged."
              error: '{{ none if _apd_ok else ("delete failed — HTTP " ~ _apd_adv.get("http_status","?") if _apd_adv is mapping else "broker error") }}'
        - stop: return
          response_variable: final_response

    # ── case: service_request_create ──────────────────────────────────────────
    # Guest service request — shape-first routing through Taskmaster, same
    # doctrine as task_create's own shape-before-tier logic. area_id is
    # OPTIONAL here (unlike stay/appointment) — not every request is
    # room-scoped (WiFi, front door code). guestContactId is also optional —
    # a system-logged house-wide issue may have no single asker.
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "service_request_create" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ note_body_norm == "" }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  case: service_request_create
                  error: "Missing required field: note_body (the request description)"
            - stop: return
              response_variable: final_response

        - choose:
          - conditions:
            - condition: template
              value_template: '{{ area_id_norm != "" and area_id_norm not in (areas() | list) }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  case: service_request_create
                  error: "area_id '{{ area_id_norm }}' is not a known HA area."
                  known_areas_sample: '{{ (areas() | list)[:20] }}'
            - stop: return
              response_variable: final_response

        # ── dispatch through Taskmaster — shape decides the backend ─────────
        - action: script.zen_dojotools_taskmaster
          response_variable: _svc_dispatch
          continue_on_error: true
          data:
            mode: task_create
            item: '{{ note_body_norm }}'
            chore: '{{ request_type_norm == "HOUSEKEEPING" }}'
            area: '{{ area_id_norm }}'
            note: '{{ note_body_norm }}'
        - variables:
            _svc_backend: '{{ _svc_dispatch.get("backend","") if _svc_dispatch is mapping else "" }}'
            _svc_linked_id: >-
              {%- set _d = _svc_dispatch if _svc_dispatch is mapping else {} -%}
              {{ _d.get('ticket_number', _d.get('chore_id', _d.get('task_id', ''))) | string }}

        - variables:
            _svc_payload: >-
              {{ {'guestContactId': (item_id_norm if item_id_norm != '' else none), 'roomAreaId': (area_id_norm if area_id_norm != '' else none), 'requestType': request_type_norm, 'description': note_body_norm, 'status': 'OPEN', 'linkedBackend': _svc_backend, 'linkedTaskId': ('' ~ _svc_linked_id)} | tojson }}
        - action: script.zen_sutra_twenty
          response_variable: _svc_adv
          continue_on_error: true
          data:
            action_type: post
            endpoint: serviceRequests
            payload: '{{ _svc_payload }}'
        - variables:
            _svc_ok: '{{ _svc_adv is mapping and _svc_adv.get("status") == "success" }}'
            _svc_body: >-
              {%- if _svc_adv is mapping and "result" in _svc_adv and "content" in _svc_adv["result"] -%}
                {{ _svc_adv["result"]["content"] }}
              {%- else -%}{{ {} }}{%- endif -%}
            _svc_result: '{{ _svc_body.get("data", {}).get("createServiceRequest", _svc_body.get("data", {})) if _svc_body is mapping else {} }}'
        - variables:
            final_response:
              status: '{{ "success" if _svc_ok and _svc_result is mapping and _svc_result.get("id","") != "" else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: service_request_create
              result:
                id: '{{ _svc_result.get("id","") if _svc_result is mapping else "" }}'
                status: OPEN
                request_type: '{{ request_type_norm }}'
                area_id: '{{ area_id_norm if area_id_norm != "" else none }}'
                guest_contact_id: '{{ item_id_norm if item_id_norm != "" else none }}'
                linked_backend: '{{ _svc_backend }}'
                linked_task_id: '{{ _svc_linked_id }}'
              error: '{{ none if (_svc_ok and _svc_result is mapping and _svc_result.get("id","") != "") else ("create failed — HTTP " ~ _svc_adv.get("http_status","?") if _svc_adv is mapping else "broker error") }}'
        - stop: return
          response_variable: final_response

    # ── case: service_request_get ─────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "service_request_get" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ item_id_norm == "" }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  case: service_request_get
                  error: item_id required. Use service_requests_active_list first.
            - stop: return
              response_variable: final_response
        - action: script.zen_sutra_twenty
          response_variable: _svcg_adv
          continue_on_error: true
          data:
            action_type: get
            endpoint: 'serviceRequests/{{ item_id_norm }}'
        - variables:
            _svcg_ok: '{{ _svcg_adv is mapping and _svcg_adv.get("status") == "success" }}'
            _svcg_body: >-
              {%- if _svcg_adv is mapping and "result" in _svcg_adv and "content" in _svcg_adv["result"] -%}
                {{ _svcg_adv["result"]["content"] }}
              {%- else -%}{{ {} }}{%- endif -%}
            _svcg_s: '{{ _svcg_body.get("data", {}).get("serviceRequest", _svcg_body.get("data", {})) if _svcg_body is mapping else {} }}'
        - variables:
            final_response:
              status: '{{ "success" if _svcg_ok and _svcg_s else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: service_request_get
              result:
                id: '{{ _svcg_s.get("id","") if _svcg_s is mapping else "" }}'
                guest_contact_id: '{{ _svcg_s.get("guestContactId","") if _svcg_s is mapping else "" }}'
                area_id: '{{ _svcg_s.get("roomAreaId","") if _svcg_s is mapping else "" }}'
                request_type: '{{ _svcg_s.get("requestType","") if _svcg_s is mapping else "" }}'
                description: '{{ _svcg_s.get("description","") if _svcg_s is mapping else "" }}'
                status: '{{ _svcg_s.get("status","") if _svcg_s is mapping else "" }}'
                linked_backend: '{{ _svcg_s.get("linkedBackend","") if _svcg_s is mapping else "" }}'
                linked_task_id: '{{ _svcg_s.get("linkedTaskId","") if _svcg_s is mapping else "" }}'
                resolution_notes: '{{ _svcg_s.get("resolutionNotes","") if _svcg_s is mapping else "" }}'
              error: '{{ none if (_svcg_ok and _svcg_s) else ("not found — HTTP " ~ _svcg_adv.get("http_status","?") if _svcg_adv is mapping else "broker error") }}'
        - stop: return
          response_variable: final_response

    # ── case: service_requests_active_list ────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "service_requests_active_list" }}'
        sequence:
        - action: script.zen_sutra_twenty
          response_variable: _svcl_adv
          continue_on_error: true
          data:
            action_type: get
            endpoint: 'serviceRequests?limit={{ limit_norm }}'
        - variables:
            _svcl_ok: '{{ _svcl_adv is mapping and _svcl_adv.get("status") == "success" }}'
            _svcl_body: >-
              {%- if _svcl_adv is mapping and "result" in _svcl_adv and "content" in _svcl_adv["result"] -%}
                {{ _svcl_adv["result"]["content"] }}
              {%- else -%}{{ {} }}{%- endif -%}
            _svcl_all: >-
              {%- set _d = _svcl_body.get('data', {}) if _svcl_body is mapping else {} -%}
              {%- set _d = _d if _d is mapping else {} -%}
              {{ _d.get('serviceRequests', []) if _d.get('serviceRequests') is sequence else [] }}
        - variables:
            _svcl_filtered: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for s in _svcl_all if s is mapping -%}
                {%- if s.get('status','') != 'RESOLVED' and (area_id_norm == '' or s.get('roomAreaId','') == area_id_norm) -%}
                  {%- set ns.out = ns.out + [{'id': s.get('id',''), 'guest_contact_id': s.get('guestContactId',''), 'area_id': s.get('roomAreaId',''), 'request_type': s.get('requestType',''), 'description': s.get('description',''), 'status': s.get('status',''), 'linked_backend': s.get('linkedBackend',''), 'linked_task_id': s.get('linkedTaskId','')}] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out }}
        - variables:
            final_response:
              status: '{{ "success" if _svcl_ok else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: service_requests_active_list
              result:
                service_requests: '{{ _svcl_filtered }}'
                count: '{{ _svcl_filtered | length }}'
                area_id_filter: '{{ area_id_norm if area_id_norm != "" else none }}'
              error: '{{ none if _svcl_ok else "broker error" }}'
        - stop: return
          response_variable: final_response

    # ── case: service_request_resolve ─────────────────────────────────────────
    # Idempotent — already-resolved is a no-op, same convention as
    # stay_release/appt_complete. Does NOT auto-complete the underlying
    # linked_task_id — that's a separate backend-native completion
    # (task_complete/chores_execute/ticket_close), resolving the guest-facing
    # record is a distinct step from closing out the fulfilling work.
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "service_request_resolve" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ item_id_norm == "" }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  case: service_request_resolve
                  error: item_id required. Use service_requests_active_list first.
            - stop: return
              response_variable: final_response

        - action: script.zen_sutra_twenty
          response_variable: _svcr_get_adv
          continue_on_error: true
          data:
            action_type: get
            endpoint: 'serviceRequests/{{ item_id_norm }}'
        - variables:
            _svcr_get_body: >-
              {%- if _svcr_get_adv is mapping and "result" in _svcr_get_adv and "content" in _svcr_get_adv["result"] -%}
                {{ _svcr_get_adv["result"]["content"] }}
              {%- else -%}{{ {} }}{%- endif -%}
            _svcr_s: '{{ _svcr_get_body.get("data", {}).get("serviceRequest", _svcr_get_body.get("data", {})) if _svcr_get_body is mapping else {} }}'

        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _svcr_s is not mapping or _svcr_s.get("id","") == "" }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  case: service_request_resolve
                  error: "service request not found: {{ item_id_norm }}"
            - stop: return
              response_variable: final_response

          - conditions:
            - condition: template
              value_template: '{{ _svcr_s.get("status","") == "RESOLVED" }}'
            sequence:
            - variables:
                final_response:
                  status: success
                  tool: '{{ tool_name }}'
                  case: service_request_resolve
                  result:
                    id: '{{ item_id_norm }}'
                    already_resolved: true
                  error: none
            - stop: return
              response_variable: final_response

          default:
          - action: script.zen_sutra_twenty
            response_variable: _svcr_patch_adv
            continue_on_error: true
            data:
              action_type: patch
              endpoint: 'serviceRequests/{{ item_id_norm }}'
              payload: '{{ {"status": "RESOLVED", "resolutionNotes": note_body_norm} | tojson }}'
          - variables:
              _svcr_patch_ok: '{{ _svcr_patch_adv is mapping and _svcr_patch_adv.get("status") == "success" }}'
              final_response:
                status: '{{ "success" if _svcr_patch_ok else "error" }}'
                tool: '{{ tool_name }}'
                version: '{{ tool_version }}'
                case: service_request_resolve
                result:
                  id: '{{ item_id_norm }}'
                  linked_backend: '{{ _svcr_s.get("linkedBackend","") }}'
                  linked_task_id: '{{ _svcr_s.get("linkedTaskId","") }}'
                error: '{{ none if _svcr_patch_ok else ("update failed — HTTP " ~ _svcr_patch_adv.get("http_status","?") if _svcr_patch_adv is mapping else "broker error") }}'
          - stop: return
            response_variable: final_response

    # ── case: service_request_delete ──────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "service_request_delete" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ item_id_norm == "" }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  case: service_request_delete
                  error: item_id required. Use service_requests_active_list first.
            - stop: return
              response_variable: final_response
        - action: script.zen_sutra_twenty
          response_variable: _svcd_adv
          continue_on_error: true
          data:
            action_type: delete
            endpoint: 'serviceRequests/{{ item_id_norm }}'
        - variables:
            _svcd_ok: '{{ _svcd_adv is mapping and _svcd_adv.get("status") == "success" }}'
            final_response:
              status: '{{ "success" if _svcd_ok else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: service_request_delete
              result:
                id: '{{ item_id_norm }}'
                deleted: '{{ _svcd_ok }}'
                note: "Twenty soft-deletes — record moves to trash, recoverable there for a retention window, not immediately purged."
              error: '{{ none if _svcd_ok else ("delete failed — HTTP " ~ _svcd_adv.get("http_status","?") if _svcd_adv is mapping else "broker error") }}'
        - stop: return
          response_variable: final_response

    # ── case: active_stay_prefs ────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "active_stay_prefs" }}'
        sequence:
        # NOTE: this case cannot self-call `action: script.zen_dojotools_rolodex` for
        # stays_list/contact_get — a script calling itself recursively does not reliably
        # return a response_variable (comes back {} every time, no error surfaced despite
        # continue_on_error). Both lookups are inlined below instead, reusing
        # the same underlying scripts (zen_dojotools_calendar, zen_sutra_twenty) that
        # stays_list/contact_get themselves call — those are separate script entities, calling
        # them directly is not recursive and works fine.
        # _asp_now is NOT precomputed via a `variables:` step — a raw datetime object gets
        # stringified when it round-trips through one, same mechanism as the guestPrefs write
        # bug above. Recomputed inline at the comparison site
        # below instead, staying within one Jinja template's native evaluation throughout.
        - variables:
            _asp_window_start: "{{ (now() - timedelta(days=1)).strftime('%Y-%m-%d') if start_date_norm == '' else (as_datetime(start_date_norm) - timedelta(days=1)).strftime('%Y-%m-%d') }}"
            _asp_window_end: "{{ (now() + timedelta(days=1)).strftime('%Y-%m-%d') if start_date_norm == '' else (as_datetime(start_date_norm) + timedelta(days=1)).strftime('%Y-%m-%d') }}"

        - variables:
            _asp_crm_cfg: >-
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
              {{ CABS.cabinet_drawer_value(states('sensor.zen_default_household_cabinet_resolved'), 'crm_config', {}) }}
        - variables:
            _asp_label: "{{ _asp_crm_cfg.get('stays_label', 'crm_stays') }}"
            _asp_cal: "{{ label_entities(_asp_label) | select('match', 'calendar\\.') | list | first | default('') }}"

        - action: script.zen_dojotools_calendar
          response_variable: _asp_cal_res
          continue_on_error: true
          data:
            action_type: read
            calendar_name: '{{ _asp_cal }}'
            start: '{{ _asp_window_start }}'
            end: '{{ _asp_window_end }}'

        - variables:
            _asp_items_raw: >-
              {%- if _asp_cal_res is mapping -%}
                {%- set _rs = _asp_cal_res.get('results', []) -%}
                {{ (_rs | first).get('events', []) if (_rs | length) > 0 else [] }}
              {%- else -%}{{ [] }}{%- endif -%}

        - variables:
            _asp_items: >-
              {%- if area_id_norm == '' -%}
                {{ _asp_items_raw }}
              {%- else -%}
                {{ _asp_items_raw | selectattr('description', 'defined') | selectattr('description', 'search', 'ha_area:' ~ area_id_norm ~ '(\\||$)') | list }}
              {%- endif -%}

        - variables:
            _asp_active: >-
              {%- set _cmp_now = as_local(as_datetime(start_date_norm)) if (start_date_norm != '' and as_datetime(start_date_norm) is not none) else now() -%}
              {%- set ns = namespace(found=none) -%}
              {%- for e in _asp_items -%}
                {%- set s = as_datetime(e.get('start', '')) -%}
                {%- set en = as_datetime(e.get('end', '')) -%}
                {%- if s is not none and en is not none and s is not string and en is not string and s <= _cmp_now <= en and ns.found is none -%}
                  {%- set ns.found = e -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.found }}

        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _asp_active is none }}'
            sequence:
            - variables:
                final_response:
                  status: success
                  tool: '{{ tool_name }}'
                  version: '{{ tool_version }}'
                  case: active_stay_prefs
                  result:
                    active: false
                    area_id: '{{ area_id_norm if area_id_norm != "" else none }}'
                  error: null
            - stop: return
              response_variable: final_response

        - variables:
            _asp_crm_parts: "{{ (_asp_active.get('description', '') | default('', true)) | regex_findall('crm_link:([^|]+)') }}"
            _asp_crm_id: "{{ (_asp_crm_parts[0] | trim) if _asp_crm_parts | length > 0 else '' }}"

        - variables:
            _asp_guest_name: ''
            _asp_guest_prefs: {}

        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _asp_crm_id != "" }}'
            sequence:
            - action: script.zen_sutra_twenty
              response_variable: _asp_cg_adv
              continue_on_error: true
              data:
                action_type: get
                endpoint: 'people/{{ _asp_crm_id }}'
            - variables:
                _asp_cg_body: >-
                  {%- if _asp_cg_adv is mapping and "result" in _asp_cg_adv and "content" in _asp_cg_adv["result"] -%}
                    {{ _asp_cg_adv["result"]["content"] }}
                  {%- else -%}{{ {} }}{%- endif -%}
            - variables:
                _asp_cg_p: >-
                  {{ _asp_cg_body.get('data', {}).get('person', _asp_cg_body.get('data', {})) if _asp_cg_body is mapping else {} }}
            - variables:
                _asp_guest_name: >-
                  {{ ((_asp_cg_p.get('name', {}).get('firstName', '') if _asp_cg_p is mapping else '')
                      ~ ' ' ~
                      (_asp_cg_p.get('name', {}).get('lastName', '') if _asp_cg_p is mapping else '')) | trim }}
                _asp_guest_prefs: >-
                  {%- set _gp = _asp_cg_p.get('guestPrefs', {}) if _asp_cg_p is mapping else {} -%}
                  {%- if _gp is mapping -%}{{ _gp }}
                  {%- elif _gp is string and _gp | trim not in ['', 'none', 'null'] -%}{{ _gp | from_json }}
                  {%- else -%}{{ {} }}{%- endif -%}

        - variables:
            final_response:
              status: success
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: active_stay_prefs
              result:
                active: true
                item_id: '{{ _asp_crm_id if _asp_crm_id != "" else none }}'
                guest_name: '{{ _asp_guest_name }}'
                area_id: '{{ area_id_norm if area_id_norm != "" else none }}'
                guest_prefs: '{{ _asp_guest_prefs }}'
                stay_summary: "{{ _asp_active.get('summary', '') }}"
              error: null
        - stop: return
          response_variable: final_response

    # ── case: appointment_create ──────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "appointment_create" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ summary_norm == "" or start_date_norm == "" }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  case: appointment_create
                  error: summary and start_date are required
            - stop: return
              response_variable: final_response

        - variables:
            _crm_cfg_ac: >-
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
              {{ CABS.cabinet_drawer_value(states('sensor.zen_default_household_cabinet_resolved'), 'crm_config', {}) }}

        - variables:
            _ac_label: "{{ _crm_cfg_ac.get('appointments_label', 'crm_appointments') }}"
            _ac_cal: "{{ label_entities(_ac_label) | select('match', 'calendar\\.') | list | first | default('') }}"
            _ac_end: "{{ end_date_norm if end_date_norm != '' else (start_date_norm ~ 'T23:59:00' if 'T' not in start_date_norm else start_date_norm) }}"
            _ac_desc: >-
              {%- set _ns = namespace(parts=[]) -%}
              {%- if note_body_norm != "" -%}{%- set _ns.parts = _ns.parts + [note_body_norm] -%}{%- endif -%}
              {%- if item_id_norm != "" -%}{%- set _ns.parts = _ns.parts + ['crm_link:' ~ item_id_norm] -%}{%- endif -%}
              {%- if area_id_norm != "" -%}{%- set _ns.parts = _ns.parts + ['ha_area:' ~ area_id_norm] -%}{%- endif -%}
              {{ _ns.parts | join(' | ') }}

        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _ac_cal == "" }}'
            sequence:
            - variables:
                final_response:
                  status: not_configured
                  tool: '{{ tool_name }}'
                  case: appointment_create
                  error: 'No calendar labeled ''{{ _ac_label }}''. Label a calendar entity or run configure.'
            - stop: return
              response_variable: final_response

        - action: script.zen_dojotools_calendar
          response_variable: _ac_cal_res
          continue_on_error: true
          data:
            action_type: create
            calendar_name: '{{ _ac_cal }}'
            summary: '{{ summary_norm }}'
            start: '{{ start_date_norm }}'
            end: '{{ _ac_end }}'
            description: '{{ _ac_desc }}'

        - choose:
          - conditions:
            - condition: template
              value_template: '{{ item_id_norm != "" and note_body_norm != "" }}'
            sequence:
            - action: script.zen_sutra_twenty
              response_variable: _ac_note_adv
              continue_on_error: true
              data:
                action_type: post
                endpoint: notes
                payload: >-
                  {{ {'title': summary_norm, 'bodyV2': {'blocknote': none, 'markdown': note_body_norm}} | tojson }}
            - action: script.zen_sutra_twenty
              continue_on_error: true
              data:
                action_type: post
                endpoint: noteTargets
                payload: >-
                  {{ {'noteId': ((_ac_note_adv.get('result', {}) or {}).get('content', {}) or {}).get('id', ''), 'targetPersonId': item_id_norm} | tojson }}

        - variables:
            _ac_ok: '{{ _ac_cal_res is mapping and _ac_cal_res.get("status") in ["ok", "success"] }}'

        - variables:
            final_response:
              status: '{{ "success" if _ac_ok else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: appointment_create
              result:
                calendar: '{{ _ac_cal }}'
                summary: '{{ summary_norm }}'
                start: '{{ start_date_norm }}'
                end: '{{ _ac_end }}'
                contact_id: '{{ item_id_norm }}'
                area_id: '{{ area_id_norm if area_id_norm != "" else none }}'
              error: '{{ none if _ac_ok else "calendar create failed — check crm_appointments label" }}'
        - stop: return
          response_variable: final_response

    # ── case: appointments_list ───────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "appointments_list" }}'
        sequence:
        - variables:
            _crm_cfg_al: >-
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
              {{ CABS.cabinet_drawer_value(states('sensor.zen_default_household_cabinet_resolved'), 'crm_config', {}) }}

        - variables:
            _al_label: "{{ _crm_cfg_al.get('appointments_label', 'crm_appointments') }}"
            _al_cal: "{{ label_entities(_al_label) | select('match', 'calendar\\.') | list | first | default('') }}"

        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _al_cal == "" }}'
            sequence:
            - variables:
                final_response:
                  status: not_configured
                  tool: '{{ tool_name }}'
                  case: appointments_list
                  error: 'No calendar labeled ''{{ _al_label }}''. Label a calendar entity or run configure.'
            - stop: return
              response_variable: final_response

        - variables:
            _al_start: "{{ start_date_norm if start_date_norm != '' else now().strftime('%Y-%m-%d') }}"
            _al_end: "{{ end_date_norm if end_date_norm != '' else (now() + timedelta(days=90)).strftime('%Y-%m-%d') }}"

        - action: script.zen_dojotools_calendar
          response_variable: _al_res
          continue_on_error: true
          data:
            action_type: read
            calendar_name: '{{ _al_cal }}'
            start: '{{ _al_start }}'
            end: '{{ _al_end }}'

        - variables:
            _al_items_raw: >-
              {%- if _al_res is mapping -%}
                {%- set _rs = _al_res.get('results', []) -%}
                {{ (_rs | first).get('events', []) if (_rs | length) > 0 else [] }}
              {%- else -%}{{ [] }}{%- endif -%}

        - variables:
            _al_items: >-
              {%- if area_id_norm == '' -%}
                {{ _al_items_raw }}
              {%- else -%}
                {{ _al_items_raw | selectattr('description', 'defined') | selectattr('description', 'search', 'ha_area:' ~ area_id_norm ~ '(\\||$)') | list }}
              {%- endif -%}

        - variables:
            final_response:
              status: '{{ "success" if _al_res is mapping else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: appointments_list
              result:
                appointments: '{{ _al_items }}'
                count: '{{ _al_items | length if _al_items is sequence else 0 }}'
                calendar: '{{ _al_cal }}'
                area_id_filter: '{{ area_id_norm if area_id_norm != "" else none }}'
              error: '{{ none if _al_res is mapping else "calendar read failed" }}'
        - stop: return
          response_variable: final_response

    # ── case: active_appointment ──────────────────────────────────────────────
    # "Is a vendor/contact mid-appointment in this room right now?" — the appointment
    # counterpart to active_stay_prefs, feeding room_manager's vendor_activity signal
    # (caution-flag for automations, not a prefs source — a vendor being present doesn't
    # change whose meal/music prefs apply).
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "active_appointment" }}'
        sequence:
        - variables:
            _aap_window_start: "{{ (now() - timedelta(days=1)).strftime('%Y-%m-%d') if start_date_norm == '' else (as_datetime(start_date_norm) - timedelta(days=1)).strftime('%Y-%m-%d') }}"
            _aap_window_end: "{{ (now() + timedelta(days=1)).strftime('%Y-%m-%d') if start_date_norm == '' else (as_datetime(start_date_norm) + timedelta(days=1)).strftime('%Y-%m-%d') }}"

        - variables:
            _aap_crm_cfg: >-
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
              {{ CABS.cabinet_drawer_value(states('sensor.zen_default_household_cabinet_resolved'), 'crm_config', {}) }}
        - variables:
            _aap_label: "{{ _aap_crm_cfg.get('appointments_label', 'crm_appointments') }}"
            _aap_cal: "{{ label_entities(_aap_label) | select('match', 'calendar\\.') | list | first | default('') }}"

        - action: script.zen_dojotools_calendar
          response_variable: _aap_cal_res
          continue_on_error: true
          data:
            action_type: read
            calendar_name: '{{ _aap_cal }}'
            start: '{{ _aap_window_start }}'
            end: '{{ _aap_window_end }}'

        - variables:
            _aap_items_raw: >-
              {%- if _aap_cal_res is mapping -%}
                {%- set _rs = _aap_cal_res.get('results', []) -%}
                {{ (_rs | first).get('events', []) if (_rs | length) > 0 else [] }}
              {%- else -%}{{ [] }}{%- endif -%}

        - variables:
            _aap_items: >-
              {%- if area_id_norm == '' -%}
                {{ _aap_items_raw }}
              {%- else -%}
                {{ _aap_items_raw | selectattr('description', 'defined') | selectattr('description', 'search', 'ha_area:' ~ area_id_norm ~ '(\\||$)') | list }}
              {%- endif -%}

        - variables:
            _aap_active: >-
              {%- set _cmp_now = as_local(as_datetime(start_date_norm)) if (start_date_norm != '' and as_datetime(start_date_norm) is not none) else now() -%}
              {%- set ns = namespace(found=none) -%}
              {%- for e in _aap_items -%}
                {%- set s = as_datetime(e.get('start', '')) -%}
                {%- set en = as_datetime(e.get('end', '')) -%}
                {%- if s is not none and en is not none and s is not string and en is not string and s <= _cmp_now <= en and ns.found is none -%}
                  {%- set ns.found = e -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.found }}

        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _aap_active is none }}'
            sequence:
            - variables:
                final_response:
                  status: success
                  tool: '{{ tool_name }}'
                  version: '{{ tool_version }}'
                  case: active_appointment
                  result:
                    active: false
                    area_id: '{{ area_id_norm if area_id_norm != "" else none }}'
                  error: null
            - stop: return
              response_variable: final_response

        - variables:
            _aap_crm_parts: "{{ (_aap_active.get('description', '') | default('', true)) | regex_findall('crm_link:([^|]+)') }}"
            _aap_crm_id: "{{ (_aap_crm_parts[0] | trim) if _aap_crm_parts | length > 0 else '' }}"

        - variables:
            _aap_vendor_name: ''

        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _aap_crm_id != "" }}'
            sequence:
            # try company first (typical vendor case)
            - action: script.zen_sutra_twenty
              response_variable: _aap_co_adv
              continue_on_error: true
              data:
                action_type: get
                endpoint: 'companies/{{ _aap_crm_id }}'
            - variables:
                _aap_co_body: >-
                  {%- if _aap_co_adv is mapping and "result" in _aap_co_adv and "content" in _aap_co_adv["result"] -%}
                    {{ _aap_co_adv["result"]["content"] }}
                  {%- else -%}{{ {} }}{%- endif -%}
                _aap_co_name: '{{ _aap_co_body.get("data", {}).get("company", {}).get("name", "") if _aap_co_body is mapping else "" }}'
            - if: "{{ _aap_co_name != '' }}"
              then:
                - variables:
                    _aap_vendor_name: '{{ _aap_co_name }}'
              else:
                # fall back to person
                - action: script.zen_sutra_twenty
                  response_variable: _aap_p_adv
                  continue_on_error: true
                  data:
                    action_type: get
                    endpoint: 'people/{{ _aap_crm_id }}'
                - variables:
                    _aap_p_body: >-
                      {%- if _aap_p_adv is mapping and "result" in _aap_p_adv and "content" in _aap_p_adv["result"] -%}
                        {{ _aap_p_adv["result"]["content"] }}
                      {%- else -%}{{ {} }}{%- endif -%}
                    _aap_p: "{{ _aap_p_body.get('data', {}).get('person', _aap_p_body.get('data', {})) if _aap_p_body is mapping else {} }}"
                - variables:
                    _aap_vendor_name: >-
                      {{ ((_aap_p.get('name', {}).get('firstName', '') if _aap_p is mapping else '')
                          ~ ' ' ~
                          (_aap_p.get('name', {}).get('lastName', '') if _aap_p is mapping else '')) | trim }}

        - variables:
            final_response:
              status: success
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: active_appointment
              result:
                active: true
                area_id: '{{ area_id_norm if area_id_norm != "" else none }}'
                item_id: '{{ _aap_crm_id if _aap_crm_id != "" else none }}'
                vendor_name: '{{ _aap_vendor_name }}'
                appointment_summary: "{{ _aap_active.get('summary', '') }}"
              error: null
        - stop: return
          response_variable: final_response

    # ── case: reminder_set ────────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "reminder_set" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ summary_norm == "" }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  case: reminder_set
                  error: summary is required
            - stop: return
              response_variable: final_response

        - variables:
            _crm_cfg_rs: >-
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
              {{ CABS.cabinet_drawer_value(states('sensor.zen_default_household_cabinet_resolved'), 'crm_config', {}) }}

        - variables:
            _rs_label: "{{ _crm_cfg_rs.get('reminders_label', 'crm_reminders') }}"
            _rs_todo: "{{ label_entities(_rs_label) | select('match', 'todo\\.') | list | first | default('') }}"
            _rs_desc: '{{ ("crm_link:" ~ item_id_norm) if item_id_norm != "" else "" }}'

        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _rs_todo == "" }}'
            sequence:
            - variables:
                final_response:
                  status: not_configured
                  tool: '{{ tool_name }}'
                  case: reminder_set
                  error: 'No todo list labeled ''{{ _rs_label }}''. Label a todo entity or run configure.'
            - stop: return
              response_variable: final_response

        - action: script.zen_dojotools_todo
          response_variable: _rs_res
          continue_on_error: true
          data:
            action_type: create
            list_name: '{{ _rs_todo }}'
            items: ['{{ summary_norm }}']
            description: '{{ _rs_desc }}'
            due_date: '{{ start_date_norm }}'

        - variables:
            _rs_ok: '{{ _rs_res is mapping and _rs_res.get("status") == "success" }}'

        - variables:
            final_response:
              status: '{{ "success" if _rs_ok else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: reminder_set
              result:
                list: '{{ _rs_todo }}'
                summary: '{{ summary_norm }}'
                contact_id: '{{ item_id_norm }}'
                due_date: '{{ start_date_norm }}'
              error: '{{ none if _rs_ok else "todo create failed — check crm_reminders label" }}'
        - stop: return
          response_variable: final_response

    # ── case: reminders_list ──────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "reminders_list" }}'
        sequence:
        - variables:
            _crm_cfg_rl: >-
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
              {{ CABS.cabinet_drawer_value(states('sensor.zen_default_household_cabinet_resolved'), 'crm_config', {}) }}

        - variables:
            _rl_label: "{{ _crm_cfg_rl.get('reminders_label', 'crm_reminders') }}"
            _rl_todo: "{{ label_entities(_rl_label) | select('match', 'todo\\.') | list | first | default('') }}"

        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _rl_todo == "" }}'
            sequence:
            - variables:
                final_response:
                  status: not_configured
                  tool: '{{ tool_name }}'
                  case: reminders_list
                  error: 'No todo list labeled ''{{ _rl_label }}''. Label a todo entity or run configure.'
            - stop: return
              response_variable: final_response

        - action: script.zen_dojotools_todo
          response_variable: _rl_res
          continue_on_error: true
          data:
            action_type: read
            list_name: '{{ _rl_todo }}'

        - variables:
            _rl_all: >-
              {%- if _rl_res is mapping -%}
                {{ _rl_res.get('result', {}).get('items', _rl_res.get('items', [])) }}
              {%- else -%}{{ [] }}{%- endif -%}

        - variables:
            _rl_filtered: >-
              {%- if item_id_norm != '' -%}
                {{ _rl_all | selectattr('description', 'defined') | selectattr('description', 'search', 'crm_link:' ~ item_id_norm) | list }}
              {%- else -%}
                {{ _rl_all }}
              {%- endif -%}

        - variables:
            final_response:
              status: '{{ "success" if _rl_res is mapping else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: reminders_list
              result:
                reminders: '{{ _rl_filtered }}'
                count: '{{ _rl_filtered | length if _rl_filtered is sequence else 0 }}'
                filtered_by: '{{ item_id_norm }}'
              error: '{{ none if _rl_res is mapping else "todo read failed" }}'
        - stop: return
          response_variable: final_response

    # ── case: task_link ───────────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "task_link" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ summary_norm == "" }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  case: task_link
                  error: summary is required
            - stop: return
              response_variable: final_response

        - variables:
            _crm_cfg_tl: >-
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
              {{ CABS.cabinet_drawer_value(states('sensor.zen_default_household_cabinet_resolved'), 'crm_config', {}) }}

        - variables:
            _tl_label: "{{ _crm_cfg_tl.get('tasks_label', 'crm_tasks') }}"
            _tl_todo: "{{ label_entities(_tl_label) | select('match', 'todo\\.') | list | first | default('') }}"
            _tl_desc: '{{ ("crm_link:" ~ item_id_norm) if item_id_norm != "" else "" }}'

        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _tl_todo == "" }}'
            sequence:
            - variables:
                final_response:
                  status: not_configured
                  tool: '{{ tool_name }}'
                  case: task_link
                  error: 'No todo list labeled ''{{ _tl_label }}''. Label a todo entity or run configure.'
            - stop: return
              response_variable: final_response

        - action: script.zen_dojotools_todo
          response_variable: _tl_res
          continue_on_error: true
          data:
            action_type: create
            list_name: '{{ _tl_todo }}'
            items: ['{{ summary_norm }}']
            description: '{{ _tl_desc }}'
            due_date: '{{ start_date_norm }}'

        - variables:
            _tl_ok: '{{ _tl_res is mapping and _tl_res.get("status") == "success" }}'

        - variables:
            final_response:
              status: '{{ "success" if _tl_ok else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: task_link
              result:
                list: '{{ _tl_todo }}'
                summary: '{{ summary_norm }}'
                contact_id: '{{ item_id_norm }}'
                due_date: '{{ start_date_norm }}'
              error: '{{ none if _tl_ok else "todo create failed — check crm_tasks label" }}'
        - stop: return
          response_variable: final_response

    # ── case: tasks_list ──────────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "tasks_list" }}'
        sequence:
        - variables:
            _crm_cfg_tsl: >-
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
              {{ CABS.cabinet_drawer_value(states('sensor.zen_default_household_cabinet_resolved'), 'crm_config', {}) }}

        - variables:
            _tsl_label: "{{ _crm_cfg_tsl.get('tasks_label', 'crm_tasks') }}"
            _tsl_todo: "{{ label_entities(_tsl_label) | select('match', 'todo\\.') | list | first | default('') }}"

        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _tsl_todo == "" }}'
            sequence:
            - variables:
                final_response:
                  status: not_configured
                  tool: '{{ tool_name }}'
                  case: tasks_list
                  error: 'No todo list labeled ''{{ _tsl_label }}''. Label a todo entity or run configure.'
            - stop: return
              response_variable: final_response

        - action: script.zen_dojotools_todo
          response_variable: _tsl_res
          continue_on_error: true
          data:
            action_type: read
            list_name: '{{ _tsl_todo }}'

        - variables:
            _tsl_all: >-
              {%- if _tsl_res is mapping -%}
                {{ _tsl_res.get('result', {}).get('items', _tsl_res.get('items', [])) }}
              {%- else -%}{{ [] }}{%- endif -%}

        - variables:
            _tsl_filtered: >-
              {%- if item_id_norm != '' -%}
                {{ _tsl_all | selectattr('description', 'defined') | selectattr('description', 'search', 'crm_link:' ~ item_id_norm) | list }}
              {%- else -%}
                {{ _tsl_all }}
              {%- endif -%}

        - variables:
            final_response:
              status: '{{ "success" if _tsl_res is mapping else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: tasks_list
              result:
                tasks: '{{ _tsl_filtered }}'
                count: '{{ _tsl_filtered | length if _tsl_filtered is sequence else 0 }}'
                filtered_by: '{{ item_id_norm }}'
              error: '{{ none if _tsl_res is mapping else "todo read failed" }}'
        - stop: return
          response_variable: final_response

    # ── case: vendor_history ──────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "vendor_history" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ item_id_norm == "" }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  case: vendor_history
                  error: item_id (company UUID) is required
            - stop: return
              response_variable: final_response

        # step 1: query noteTargets junction to get noteIds for this company
        - action: script.zen_sutra_twenty
          response_variable: _vh_nt_adv
          continue_on_error: true
          data:
            action_type: get
            endpoint: 'noteTargets?filter=targetCompanyId[eq]:{{ item_id_norm }}&limit=50'

        - variables:
            _vh_nt_body: >-
              {%- if _vh_nt_adv is mapping and "result" in _vh_nt_adv and "content" in _vh_nt_adv["result"] -%}
                {{ _vh_nt_adv["result"]["content"] }}
              {%- else -%}{{ {} }}{%- endif -%}

        - variables:
            _vh_nt_list: >-
              {{ _vh_nt_body.get('data', {}).get('noteTargets', []) if _vh_nt_body is mapping else [] }}
            _vh_note_ids: >-
              {%- set _ns = namespace(ids=[]) -%}
              {%- for nt in _vh_nt_list -%}
                {%- if nt is mapping and nt.get('noteId','') != '' -%}
                  {%- set _ns.ids = _ns.ids + [nt.get('noteId')] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ _ns.ids }}

        # no noteTargets for this company — return empty cleanly
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ (_vh_note_ids | length) == 0 }}'
            sequence:
            - variables:
                final_response:
                  status: success
                  tool: '{{ tool_name }}'
                  version: '{{ tool_version }}'
                  case: vendor_history
                  result:
                    notes: []
                    count: 0
                    company_id: '{{ item_id_norm }}'
                    via: noteTargets
                  error: ~
            - stop: return
              response_variable: final_response

        # step 2: fetch the notes whose IDs we found via noteTargets
        - action: script.zen_sutra_twenty
          response_variable: _vh_adv
          continue_on_error: true
          data:
            action_type: get
            endpoint: 'notes?filter=id[in]:{{ _vh_note_ids | tojson }}&order_by=createdAt[DescNullsLast]&limit={{ limit_norm }}'

        - variables:
            _vh_ok: '{{ _vh_adv is mapping and _vh_adv.get("status") == "success" }}'
            _vh_body: >-
              {%- if _vh_adv is mapping and "result" in _vh_adv and "content" in _vh_adv["result"] -%}
                {{ _vh_adv["result"]["content"] }}
              {%- else -%}{{ {} }}{%- endif -%}

        - variables:
            _vh_list: >-
              {{ _vh_body.get('data', {}).get('notes', []) if _vh_body is mapping else [] }}

        - variables:
            _vh_notes: >-
              {%- set _ns = namespace(out=[]) -%}
              {%- for n in _vh_list -%}
                {%- if n is mapping -%}
                  {%- set _ns.out = _ns.out + [{'id': n.get('id',''), 'title': n.get('title',''), 'body': (n.get('bodyV2', {}) or {}).get('markdown',''), 'created_at': n.get('createdAt','')}] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ _ns.out }}

        - variables:
            final_response:
              status: '{{ "success" if _vh_ok else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: vendor_history
              result:
                notes: '{{ _vh_notes }}'
                count: '{{ _vh_notes | length }}'
                company_id: '{{ item_id_norm }}'
                via: noteTargets
              error: '{{ none if _vh_ok else ("broker error — HTTP " ~ _vh_adv.get("http_status","?") if _vh_adv is mapping else "broker error") }}'
        - stop: return
          response_variable: final_response

    # ── case: timeline ────────────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "timeline" }}'
        sequence:
        - variables:
            _crm_cfg_tm: >-
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
              {{ CABS.cabinet_drawer_value(states('sensor.zen_default_household_cabinet_resolved'), 'crm_config', {}) }}

        - variables:
            _tm_stays_label: "{{ _crm_cfg_tm.get('stays_label', 'crm_stays') }}"
            _tm_appts_label: "{{ _crm_cfg_tm.get('appointments_label', 'crm_appointments') }}"
            _tm_rem_label: "{{ _crm_cfg_tm.get('reminders_label', 'crm_reminders') }}"
            _tm_tasks_label: "{{ _crm_cfg_tm.get('tasks_label', 'crm_tasks') }}"

        - variables:
            _tm_stays_cal: "{{ label_entities(_tm_stays_label) | select('match', 'calendar\\.') | list | first | default('') }}"
            _tm_appts_cal: "{{ label_entities(_tm_appts_label) | select('match', 'calendar\\.') | list | first | default('') }}"
            _tm_rem_todo: "{{ label_entities(_tm_rem_label) | select('match', 'todo\\.') | list | first | default('') }}"
            _tm_tasks_todo: "{{ label_entities(_tm_tasks_label) | select('match', 'todo\\.') | list | first | default('') }}"
            _tm_sources_ok: []
            _tm_sources_failed: []

        # fan-out — all continue_on_error
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _tm_stays_cal != "" }}'
            sequence:
            - action: script.zen_dojotools_calendar
              response_variable: _tm_stays_res
              continue_on_error: true
              data:
                action_type: read
                calendar_name: '{{ _tm_stays_cal }}'
                start: '{{ start_date_norm }}'
                end: '{{ end_date_norm }}'

        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _tm_appts_cal != "" }}'
            sequence:
            - action: script.zen_dojotools_calendar
              response_variable: _tm_appts_res
              continue_on_error: true
              data:
                action_type: read
                calendar_name: '{{ _tm_appts_cal }}'
                start: '{{ start_date_norm }}'
                end: '{{ end_date_norm }}'

        - action: script.zen_sutra_twenty
          response_variable: _tm_notes_adv
          continue_on_error: true
          data:
            action_type: get
            endpoint: >-
              {%- if item_id_norm != '' -%}
                notes?filter=noteTargets.targetPersonId[eq]:{{ item_id_norm }}&order_by=createdAt[DescNullsLast]&limit={{ limit_norm }}
              {%- else -%}
                notes?order_by=createdAt[DescNullsLast]&limit={{ limit_norm }}
              {%- endif -%}

        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _tm_rem_todo != "" }}'
            sequence:
            - action: script.zen_dojotools_todo
              response_variable: _tm_rem_res
              continue_on_error: true
              data:
                action_type: read
                list_name: '{{ _tm_rem_todo }}'

        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _tm_tasks_todo != "" }}'
            sequence:
            - action: script.zen_dojotools_todo
              response_variable: _tm_tasks_res
              continue_on_error: true
              data:
                action_type: read
                list_name: '{{ _tm_tasks_todo }}'

        # extract + tag each source
        - variables:
            _tm_stays_items: >-
              {%- if _tm_stays_res is defined and _tm_stays_res is mapping -%}
                {%- set _ns = namespace(out=[]) -%}
                {%- for e in (_tm_stays_res.get('result', _tm_stays_res.get('events', [])) | default([])) -%}
                  {%- if e is mapping -%}
                    {%- set _d = e.get('start', e.get('start_time', e.get('date', ''))) -%}
                    {%- set _ns.out = _ns.out + [e | combine({'source': 'stay', 'date': _d})] -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ _ns.out }}
              {%- else -%}{{ [] }}{%- endif -%}

            _tm_appts_items: >-
              {%- if _tm_appts_res is defined and _tm_appts_res is mapping -%}
                {%- set _ns = namespace(out=[]) -%}
                {%- for e in (_tm_appts_res.get('result', _tm_appts_res.get('events', [])) | default([])) -%}
                  {%- if e is mapping -%}
                    {%- set _d = e.get('start', e.get('start_time', e.get('date', ''))) -%}
                    {%- set _ns.out = _ns.out + [e | combine({'source': 'appointment', 'date': _d})] -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ _ns.out }}
              {%- else -%}{{ [] }}{%- endif -%}

            _tm_notes_items: >-
              {%- if _tm_notes_adv is defined and _tm_notes_adv is mapping and _tm_notes_adv.get('status') == 'success' -%}
                {%- set body = _tm_notes_adv.get('result', {}).get('content', {}) -%}
                {%- set notes = body.get('data', {}).get('notes', []) if body is mapping else [] -%}
                {%- set _ns = namespace(out=[]) -%}
                {%- for n in notes -%}
                  {%- if n is mapping -%}
                    {%- set _ns.out = _ns.out + [{'id': n.get('id',''), 'title': n.get('title',''), 'body': (n.get('bodyV2', {}) or {}).get('markdown',''), 'date': n.get('createdAt',''), 'source': 'note'}] -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ _ns.out }}
              {%- else -%}{{ [] }}{%- endif -%}

            _tm_rem_items: >-
              {%- if _tm_rem_res is defined and _tm_rem_res is mapping -%}
                {%- set _ns = namespace(out=[]) -%}
                {%- for t in (_tm_rem_res.get('result', {}).get('items', _tm_rem_res.get('items', [])) | default([])) -%}
                  {%- if t is mapping -%}
                    {%- set _d = t.get('due', t.get('due_date', t.get('date', ''))) -%}
                    {%- set _ns.out = _ns.out + [t | combine({'source': 'reminder', 'date': _d})] -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ _ns.out }}
              {%- else -%}{{ [] }}{%- endif -%}

            _tm_tasks_items: >-
              {%- if _tm_tasks_res is defined and _tm_tasks_res is mapping -%}
                {%- set _ns = namespace(out=[]) -%}
                {%- for t in (_tm_tasks_res.get('result', {}).get('items', _tm_tasks_res.get('items', [])) | default([])) -%}
                  {%- if t is mapping -%}
                    {%- set _d = t.get('due', t.get('due_date', t.get('date', ''))) -%}
                    {%- set _ns.out = _ns.out + [t | combine({'source': 'task', 'date': _d})] -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ _ns.out }}
              {%- else -%}{{ [] }}{%- endif -%}

        - variables:
            _tm_all: >-
              {{ (_tm_stays_items + _tm_appts_items + _tm_notes_items + _tm_rem_items + _tm_tasks_items)
                 | sort(attribute='date') | reverse | list }}

        - variables:
            _tm_sources_ok: >-
              {%- set _ns = namespace(ok=[]) -%}
              {%- if _tm_stays_res is defined and _tm_stays_res is mapping -%}{%- set _ns.ok = _ns.ok + ['stays'] -%}{%- endif -%}
              {%- if _tm_appts_res is defined and _tm_appts_res is mapping -%}{%- set _ns.ok = _ns.ok + ['appointments'] -%}{%- endif -%}
              {%- if _tm_notes_adv is defined and _tm_notes_adv is mapping and _tm_notes_adv.get('status') == 'success' -%}{%- set _ns.ok = _ns.ok + ['notes'] -%}{%- endif -%}
              {%- if _tm_rem_res is defined and _tm_rem_res is mapping -%}{%- set _ns.ok = _ns.ok + ['reminders'] -%}{%- endif -%}
              {%- if _tm_tasks_res is defined and _tm_tasks_res is mapping -%}{%- set _ns.ok = _ns.ok + ['tasks'] -%}{%- endif -%}
              {{ _ns.ok }}
            _tm_sources_failed: >-
              {%- set _ns = namespace(failed=[]) -%}
              {%- if _tm_stays_cal != '' and (_tm_stays_res is not defined or _tm_stays_res is not mapping) -%}{%- set _ns.failed = _ns.failed + ['stays'] -%}{%- endif -%}
              {%- if _tm_appts_cal != '' and (_tm_appts_res is not defined or _tm_appts_res is not mapping) -%}{%- set _ns.failed = _ns.failed + ['appointments'] -%}{%- endif -%}
              {%- if _tm_notes_adv is not defined or _tm_notes_adv.get('status') != 'success' -%}{%- set _ns.failed = _ns.failed + ['notes'] -%}{%- endif -%}
              {%- if _tm_rem_todo != '' and (_tm_rem_res is not defined or _tm_rem_res is not mapping) -%}{%- set _ns.failed = _ns.failed + ['reminders'] -%}{%- endif -%}
              {%- if _tm_tasks_todo != '' and (_tm_tasks_res is not defined or _tm_tasks_res is not mapping) -%}{%- set _ns.failed = _ns.failed + ['tasks'] -%}{%- endif -%}
              {{ _ns.failed }}

        - variables:
            final_response:
              status: success
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: timeline
              result:
                timeline: '{{ _tm_all }}'
                count: '{{ _tm_all | length }}'
                sources_ok: '{{ _tm_sources_ok }}'
                sources_failed: '{{ _tm_sources_failed }}'
              error: null
        - stop: return
          response_variable: final_response

    # ── case: tag_contact ────────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "tag_contact" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ item_id_norm == "" or tags_norm == "" }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  case: tag_contact
                  error: item_id and tags are required. tags = comma-separated ZenOS label slugs.
            - stop: return
              response_variable: final_response

        - variables:
            _tc_tags_list: >-
              {{ tags_norm.split(',') | map('trim') | select | list }}
            _tc_all_labels: '{{ labels() | list }}'

        - variables:
            _tc_bad_tags: >-
              {%- set _ns = namespace(bad=[]) -%}
              {%- for t in _tc_tags_list -%}
                {%- if t not in _tc_all_labels -%}{%- set _ns.bad = _ns.bad + [t] -%}{%- endif -%}
              {%- endfor -%}
              {{ _ns.bad }}

        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _tc_bad_tags | length > 0 }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  case: tag_contact
                  error: 'Tags not in ZenOS label index: {{ _tc_bad_tags | join(", ") }}. Create the HA label first or check spelling.'
                  bad_tags: '{{ _tc_bad_tags }}'
                  available_sample: '{{ _tc_all_labels[:20] }}'
            - stop: return
              response_variable: final_response

        - action: script.zen_sutra_twenty
          response_variable: _tc_adv
          continue_on_error: true
          data:
            action_type: patch
            endpoint: 'people/{{ item_id_norm }}'
            payload: '{{ {"haLabels": tags_norm} | tojson }}'

        - variables:
            _tc_ok: '{{ _tc_adv is mapping and _tc_adv.get("status") == "success" }}'

        - variables:
            final_response:
              status: '{{ "success" if _tc_ok else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: tag_contact
              result:
                contact_id: '{{ item_id_norm }}'
                ha_labels: '{{ tags_norm }}'
                tags_applied: '{{ _tc_tags_list }}'
              error: '{{ none if _tc_ok else ("patch failed — HTTP " ~ _tc_adv.get("http_status","?") ~ " — run provision_schema first to create haLabels field") }}'
        - stop: return
          response_variable: final_response

    # ── case: guest_prefs_set ────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "guest_prefs_set" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ item_id_norm == "" or prefs_norm == "" }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  case: guest_prefs_set
                  error: item_id and prefs are required. prefs = JSON string, e.g. '{"allergens":["peanut"]}'.
            - stop: return
              response_variable: final_response

        - action: script.zen_sutra_twenty
          response_variable: _gps_adv
          continue_on_error: true
          data:
            action_type: patch
            endpoint: 'people/{{ item_id_norm }}'
            payload: >-
              {"guestPrefs": {{ (prefs | default('', true) | trim) | tojson }}}

        - variables:
            _gps_ok: '{{ _gps_adv is mapping and _gps_adv.get("status") == "success" }}'

        - variables:
            final_response:
              status: '{{ "success" if _gps_ok else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: guest_prefs_set
              result:
                contact_id: '{{ item_id_norm }}'
                guest_prefs: '{{ prefs | default("", true) | trim }}'
              error: '{{ none if _gps_ok else ("patch failed — HTTP " ~ _gps_adv.get("http_status","?") ~ " — " ~ (_gps_adv.get("result",{}).get("content","") | string)) }}'
        - stop: return
          response_variable: final_response

    # ── case: tag_company ────────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "tag_company" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ item_id_norm == "" or tags_norm == "" }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  case: tag_company
                  error: item_id and tags are required. tags = comma-separated ZenOS label slugs.
            - stop: return
              response_variable: final_response

        - variables:
            _tco_tags_list: >-
              {{ tags_norm.split(',') | map('trim') | select | list }}
            _tco_all_labels: '{{ labels() | list }}'

        - variables:
            _tco_bad_tags: >-
              {%- set _ns = namespace(bad=[]) -%}
              {%- for t in _tco_tags_list -%}
                {%- if t not in _tco_all_labels -%}{%- set _ns.bad = _ns.bad + [t] -%}{%- endif -%}
              {%- endfor -%}
              {{ _ns.bad }}

        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _tco_bad_tags | length > 0 }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  case: tag_company
                  error: 'Tags not in ZenOS label index: {{ _tco_bad_tags | join(", ") }}. Create the HA label first or check spelling.'
                  bad_tags: '{{ _tco_bad_tags }}'
                  available_sample: '{{ _tco_all_labels[:20] }}'
            - stop: return
              response_variable: final_response

        - action: script.zen_sutra_twenty
          response_variable: _tco_adv
          continue_on_error: true
          data:
            action_type: patch
            endpoint: 'companies/{{ item_id_norm }}'
            payload: '{{ {"haLabels": tags_norm} | tojson }}'

        - variables:
            _tco_ok: '{{ _tco_adv is mapping and _tco_adv.get("status") == "success" }}'

        - variables:
            final_response:
              status: '{{ "success" if _tco_ok else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: tag_company
              result:
                company_id: '{{ item_id_norm }}'
                ha_labels: '{{ tags_norm }}'
                tags_applied: '{{ _tco_tags_list }}'
              error: '{{ none if _tco_ok else ("patch failed — HTTP " ~ _tco_adv.get("http_status","?") ~ " — run provision_schema first to create haLabels field") }}'
        - stop: return
          response_variable: final_response

    # ── case: contacts_by_label ───────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "contacts_by_label" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ item_norm == "" }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  case: contacts_by_label
                  error: item (label slug) is required
            - stop: return
              response_variable: final_response

        - action: script.zen_sutra_twenty
          response_variable: _cbl_adv
          continue_on_error: true
          data:
            action_type: get
            endpoint: 'people?filter=haLabels[ilike]:%{{ item_norm }}%&limit={{ limit_norm }}'

        - variables:
            _cbl_ok: '{{ _cbl_adv is mapping and _cbl_adv.get("status") == "success" }}'
            _cbl_body: >-
              {%- if _cbl_adv is mapping and "result" in _cbl_adv and "content" in _cbl_adv["result"] -%}
                {{ _cbl_adv["result"]["content"] }}
              {%- else -%}{{ {} }}{%- endif -%}

        - variables:
            _cbl_list: >-
              {{ _cbl_body.get('data', {}).get('people', []) if _cbl_body is mapping else [] }}

        - variables:
            _cbl_contacts: >-
              {%- set _ns = namespace(out=[]) -%}
              {%- for p in _cbl_list -%}
                {%- if p is mapping -%}
                  {%- set nm = p.get('name', {}) if p.get('name') is mapping else {} -%}
                  {%- set em = p.get('emails', {}) if p.get('emails') is mapping else {} -%}
                  {%- set co = p.get('company', {}) if p.get('company') is mapping else {} -%}
                  {%- set _ns.out = _ns.out + [{
                    'id': p.get('id',''),
                    'name': ((nm.get('firstName','') ~ ' ' ~ nm.get('lastName','')) | trim),
                    'email': em.get('primaryEmail',''),
                    'company': co.get('name',''),
                    'company_id': co.get('id',''),
                    'ha_labels': p.get('haLabels','')
                  }] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ _ns.out }}

        - variables:
            final_response:
              status: '{{ "success" if _cbl_ok else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: contacts_by_label
              result:
                contacts: '{{ _cbl_contacts }}'
                count: '{{ _cbl_contacts | length }}'
                label: '{{ item_norm }}'
              error: '{{ none if _cbl_ok else ("broker error — HTTP " ~ _cbl_adv.get("http_status","?") ~ " — run provision_schema first to create haLabels field on People") }}'
        - stop: return
          response_variable: final_response

    # ── case: companies_by_label ──────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "companies_by_label" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ item_norm == "" }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  case: companies_by_label
                  error: item (label slug) is required
            - stop: return
              response_variable: final_response

        - action: script.zen_sutra_twenty
          response_variable: _cobl_adv
          continue_on_error: true
          data:
            action_type: get
            endpoint: 'companies?filter=haLabels[ilike]:%{{ item_norm }}%&limit={{ limit_norm }}'

        - variables:
            _cobl_ok: '{{ _cobl_adv is mapping and _cobl_adv.get("status") == "success" }}'
            _cobl_body: >-
              {%- if _cobl_adv is mapping and "result" in _cobl_adv and "content" in _cobl_adv["result"] -%}
                {{ _cobl_adv["result"]["content"] }}
              {%- else -%}{{ {} }}{%- endif -%}

        - variables:
            _cobl_list: >-
              {{ _cobl_body.get('data', {}).get('companies', []) if _cobl_body is mapping else [] }}

        - variables:
            _cobl_results: >-
              {%- set _ns = namespace(out=[]) -%}
              {%- for co in _cobl_list -%}
                {%- if co is mapping -%}
                  {%- set dom = co.get('domainName', {}) if co.get('domainName') is mapping else {} -%}
                  {%- set _ns.out = _ns.out + [{
                    'id': co.get('id',''),
                    'name': co.get('name',''),
                    'domain': dom.get('primaryLinkUrl',''),
                    'employees': co.get('employees',none),
                    'ha_labels': co.get('haLabels',''),
                    'created_at': co.get('createdAt','')
                  }] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ _ns.out }}

        - variables:
            final_response:
              status: '{{ "success" if _cobl_ok else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: companies_by_label
              result:
                companies: '{{ _cobl_results }}'
                count: '{{ _cobl_results | length }}'
                label: '{{ item_norm }}'
              error: '{{ none if _cobl_ok else ("broker error — HTTP " ~ _cobl_adv.get("http_status","?") ~ " — run provision_schema first to create haLabels field on Companies") }}'
        - stop: return
          response_variable: final_response

    # ── case: provision_schema ───────────────────────────────────────────────
    # Canonical ZenOS CRM schema (bump crm_schema_version when adding fields)
    # Fields: ha_labels on person + company
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "provision_schema" }}'
        sequence:
        - variables:
            _hh_cab_ps: "{{ states('sensor.zen_default_household_cabinet_resolved') }}"
            _ps_crm_schema_cached: >-
              {{ (state_attr(states('sensor.zen_default_household_cabinet_resolved'), 'variables') | default({}, true)).get('crm_schema', {}) }}
            _ps_stay_id_cached: >-
              {%- set _v = _ps_crm_schema_cached -%}
              {%- set _v = _v.get('value', _v) if _v is mapping else {} -%}
              {%- set _v = (_v | from_json) if _v is string and _v | trim != '' else _v -%}
              {{ _v.get('stay_object_id', '') if _v is mapping else '' }}
            _ps_appt_id_cached: >-
              {%- set _v = _ps_crm_schema_cached -%}
              {%- set _v = _v.get('value', _v) if _v is mapping else {} -%}
              {%- set _v = (_v | from_json) if _v is string and _v | trim != '' else _v -%}
              {{ _v.get('appointment_object_id', '') if _v is mapping else '' }}
            _ps_svc_id_cached: >-
              {%- set _v = _ps_crm_schema_cached -%}
              {%- set _v = _v.get('value', _v) if _v is mapping else {} -%}
              {%- set _v = (_v | from_json) if _v is string and _v | trim != '' else _v -%}
              {{ _v.get('servicerequest_object_id', '') if _v is mapping else '' }}
            _ps_reservation_id_cached: >-
              {%- set _v = _ps_crm_schema_cached -%}
              {%- set _v = _v.get('value', _v) if _v is mapping else {} -%}
              {%- set _v = (_v | from_json) if _v is string and _v | trim != '' else _v -%}
              {{ _v.get('reservation_object_id', '') if _v is mapping else '' }}

        # Step 1: query metadata objects (filtered to person + company)
        - action: script.zen_sutra_twenty
          response_variable: _ps_obj_raw
          continue_on_error: true
          data:
            action_type: meta
            payload: >-
              {%- set q = '{ objects { edges { node { id nameSingular } } } }' -%}
              {{ {'query': q} | tojson }}

        - variables:
            _ps_obj_ok: >-
              {%- set _r = _ps_obj_raw if _ps_obj_raw is mapping else {} -%}
              {%- set _c = _r.get('result', {}).get('content', {}) -%}
              {{ _r.get('status') == 'success' and _c is mapping and 'errors' not in _c and 'data' in _c }}
            _ps_obj_body: >-
              {%- if _ps_obj_raw is mapping and "result" in _ps_obj_raw and "content" in _ps_obj_raw["result"] -%}
                {{ _ps_obj_raw["result"]["content"] }}
              {%- else -%}{{ {} }}{%- endif -%}

        - choose:
          - conditions:
            - condition: template
              value_template: '{{ not _ps_obj_ok }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  case: provision_schema
                  error: 'Metadata API unreachable — HTTP {{ _ps_obj_raw.get("http_status","?") if _ps_obj_raw is mapping else "?" }}. Ensure Twenty URL is configured (run configure first).'
            - stop: return
              response_variable: final_response

        # Step 2: extract person + company object IDs
        - variables:
            _ps_edges: >-
              {%- set d = _ps_obj_body if _ps_obj_body is mapping else {} -%}
              {{ d.get('data', {}).get('objects', {}).get('edges', []) }}

        - variables:
            _ps_person_id: >-
              {%- set _ns = namespace(id='') -%}
              {%- for e in _ps_edges -%}
                {%- if e is mapping and e.get('node', {}).get('nameSingular','') == 'person' -%}
                  {%- set _ns.id = e.get('node', {}).get('id', '') -%}
                {%- endif -%}
              {%- endfor -%}
              {{ _ns.id }}
            _ps_company_id: >-
              {%- set _ns = namespace(id='') -%}
              {%- for e in _ps_edges -%}
                {%- if e is mapping and e.get('node', {}).get('nameSingular','') == 'company' -%}
                  {%- set _ns.id = e.get('node', {}).get('id', '') -%}
                {%- endif -%}
              {%- endfor -%}
              {{ _ns.id }}
