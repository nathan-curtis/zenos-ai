###############################################################################
# ZenOS-AI Plugin: Twenty CRM
# Version: 1.13.3 — hospitality lifecycle scans + local/UTC datetime fix (2026-08-19)
#   New stay_prep_check (arrival, mirrors stay_release's shape) and its
#   departure counterpart stay_checkout_check + a read-only checkout_status
#   query -- both idempotent via new prepSpawned/checkoutNudgeSpawned
#   boolean fields (same shape as turnoverSpawned), wired into the shared
#   15-minute scheduler dispatch (dojotools_scheduler.yaml). Closes the
#   "does the agent already know a stay lifecycle event is approaching" gap
#   identified in the pre-2026.9 hospitality walkthrough.
#   Also fixed: every naive local-time input to start_date/end_date was
#   being stored with a literal UTC 'Z' suffix with no conversion -- a
#   caller typing "18:08" lands 5 hours off. Fixed at the single shared
#   normalization point (start_date_norm/end_date_norm) plus the downstream
#   status/overlap comparisons that read it, which need a matching
#   UTC-semantic reinterpretation (as_timestamp on a bare naive datetime
#   assumes local, which silently re-breaks RESERVED/ACTIVE status
#   computation unless utcnow().tzinfo is reattached before computing any
#   timestamp). Also fixed: contact_get's guestPrefs returns as a native
#   mapping, not a JSON string -- stay_release's allergen-aware deep-clean
#   upgrade depends on reading it correctly.
#
# Version: 1.10.0 — appointment_create/appointments_list gain real area_id room
#   tagging (same ha_area: convention stays_create already used — description
#   assembly here was previously either/or between note_body and crm_link,
#   never combined; now joins all three parts like stays_create does). New
#   active_appointment case — the appointment counterpart to active_stay_prefs:
#   is a vendor/contact mid-appointment in this room right now, resolving the
#   linked contact as a company first (typical vendor case), person fallback.
#   A caution signal for automations (room_manager's new vendor_activity
#   field), not a prefs source — a vendor being present doesn't change whose
#   meal/music prefs apply.
#
# v1.9.0 — active_stay_prefs: one-call "is a guest staying in this room
#   right now, and what are their guestPrefs" — finds the stay whose start/end
#   window contains the current time, extracts the linked contact via the
#   stay's crm_link token (new parsing, no existing helper for this), and
#   returns guest_prefs. Read-only. The shared lookup mealplan_suggest
#   (mealie.yaml) now builds on for allergen flagging — same lookup can serve
#   media/spa consumers later without re-deriving stay/contact resolution.
#
# v1.8.0 — kfc_manifest self-registration (Friday couldn't discover
#   stays_create/stays_list/timeline before this — no kata component existed
#   for the KFC bootstrap scanner to find), guestPrefs custom field on People
#   (JSON-string prefs: allergens/music/spa, extensible — read via contact_get,
#   written via guest_prefs_set), and a real area_id filter fix for stays_list
#   (previously documented but never implemented — always returned every stay).
#
# Two-layer adapter (same pattern as Finance/Grocy/Kitchen):
#   zen_sutra_twenty  ← internal REST broker (NOT MCP-exposed)
#   zen_dojotools_rolodex              ← MCP-facing helper (IS exposed)
#
# Twenty CRM. REST base: {integrations_config.twenty.url}/rest/{entity}
# Note: /rest/core/ prefix is WRONG — use /rest/{entity} for both list and single record
# OpenAPI spec: GET /open-api/core (response too large for HA template engine)
#
# REST response shapes:
#   list:   { "data": { "companies": [...] }, "pageInfo": {...}, "totalCount": N }
#   single: { "data": { ... } }
#   create: { "data": { ... } }
# Filter syntax: name[ilike]:%value%  (unencoded — do NOT urlencode brackets)
#
# URL RESOLUTION ORDER (rest_commands):
#   1. household cabinet: integrations_config.twenty.url
#   2. input_text.twenty_url (legacy fallback — stays until configure is run)
#
# CRM ROUTING (calendar/todo fan-out):
#   household cabinet: crm_config.{stays,appointments,reminders,tasks}_label
#   label_entities(label) at call time → discovers actual calendar/todo entity
#   Defaults: crm_stays / crm_appointments / crm_reminders / crm_tasks
#
# SETUP:
#   1. In secrets.yaml add:
#        twenty_bearer: "Bearer YOUR_TWENTY_API_KEY"
#   2. Run: zen_dojotools_rolodex mode=run case=configure config_json='{"url":"http://your-twenty-host:3000"}'
#   3. Label a calendar entity with crm_stays, crm_appointments
#      Label a todo entity with crm_reminders, crm_tasks
###############################################################################

input_text:
  twenty_url:
    name: Twenty CRM URL
    icon: mdi:account-group

rest_command:
  twenty_rest_get:
    url: >
      {{ base_url | default('', true) | string | trim | regex_replace('/$','') }}/rest/{{ endpoint }}
    method: GET
    headers:
      Authorization: !secret twenty_bearer
      Accept: application/json
    verify_ssl: false
    timeout: 30

  twenty_rest_post:
    url: >
      {{ base_url | default('', true) | string | trim | regex_replace('/$','') }}/rest/{{ endpoint }}
    method: POST
    headers:
      Authorization: !secret twenty_bearer
      Content-Type: application/json
      Accept: application/json
    payload: '{{ payload }}'
    verify_ssl: false
    timeout: 30

  twenty_rest_patch:
    url: >
      {{ base_url | default('', true) | string | trim | regex_replace('/$','') }}/rest/{{ endpoint }}
    method: PATCH
    headers:
      Authorization: !secret twenty_bearer
      Content-Type: application/json
      Accept: application/json
    payload: '{{ payload }}'
    verify_ssl: false
    timeout: 30

  twenty_rest_delete:
    url: >
      {{ base_url | default('', true) | string | trim | regex_replace('/$','') }}/rest/{{ endpoint }}
    method: DELETE
    headers:
      Authorization: !secret twenty_bearer
      Accept: application/json
    verify_ssl: false
    timeout: 30

  twenty_rest_meta:
    url: >
      {{ base_url | default('', true) | string | trim | regex_replace('/$','') }}/metadata
    method: POST
    headers:
      Authorization: !secret twenty_bearer
      Content-Type: application/json
      Accept: application/json
    payload: '{{ payload }}'
    verify_ssl: false
    timeout: 30

script:

  zen_sutra_twenty:
    alias: Zen DojoTools Twenty Advanced (Internal)
    description: Internal REST broker for Twenty CRM. NOT MCP-exposed.
    mode: queued
    max: 5
    fields:
      action_type:
        description: get / post / patch / delete / meta (GraphQL metadata API)
        selector:
          select:
            options: [get, post, patch, delete, meta]
      endpoint:
        description: REST path after /rest/ (include query params for GET)
        selector:
          text:
      payload:
        description: JSON payload for post/patch
        selector:
          text:
            multiline: true

    sequence:
    # --- tool_manifest early exit ---
    - if: "{{ (action_type | default('') | lower) == 'tool_manifest' or (mode | default('') | lower) == 'tool_manifest' }}"
      then:
      - variables:
          result: >-
            {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
            {{- MF.tool_manifest(
              tool='zen_sutra_twenty',
              display_name='Twenty CRM Sutra (Internal)',
              tier='sutra',
              version='1.7.0',
              health={'configured': true, 'status': 'ok', 'notes': []},
              required_labels=['dojotools'],
              optional_labels=['crm', 'twenty'],
              failure_policy='soft',
              mcp_exposed=false,
              stripe=2,
              impact='soft',
              caller_token=caller_token | default('')
            ) | from_json -}}
      - stop: zen_sutra_twenty tool_manifest
        response_variable: result
    - variables:
        _at: '{{ action_type | default("get") | lower }}'
        _ep: '{{ endpoint | default("") | string | trim }}'
        _pl: '{{ payload | default("{}") | string | trim }}'
        _hh: "{{ states('sensor.zen_default_household_cabinet_resolved') }}"
    - action: script.zen_dojotools_filecabinet
      response_variable: _ic_fc_raw
      continue_on_error: true
      data:
        action_type: get
        volume_entity_id: "{{ _hh }}"
        path: integrations_config
    - variables:
        _integrations_config: >-
          {%- set _ic = _ic_fc_raw.get('value', {}) if _ic_fc_raw is mapping and _ic_fc_raw.get('status') == 'success' else {} -%}
          {{ _ic if _ic is mapping else {} }}

    - variables:
        _twenty_cfg: "{{ _integrations_config.get('twenty', {}) if _integrations_config is mapping else {} }}"

    - variables:
        _base: >-
          {%- set url = (_twenty_cfg.get('url', '') | string | trim) if _twenty_cfg is mapping else '' -%}
          {%- if not url -%}{%- set url = states('input_text.twenty_url') | default('') | trim -%}{%- endif -%}
          {{ url | regex_replace('/$','') }}

    - choose:
      - conditions:
        - condition: template
          value_template: '{{ _base == "" }}'
        sequence:
        - delay:
            seconds: 2
        - action: script.zen_dojotools_filecabinet
          response_variable: _ic_fc_raw
          continue_on_error: true
          data:
            action_type: get
            volume_entity_id: "{{ _hh }}"
            path: integrations_config
        - variables:
            _integrations_config: >-
              {%- set _ic = _ic_fc_raw.get('value', {}) if _ic_fc_raw is mapping and _ic_fc_raw.get('status') == 'success' else {} -%}
              {{ _ic if _ic is mapping else {} }}
        - variables:
            _twenty_cfg: "{{ _integrations_config.get('twenty', {}) if _integrations_config is mapping else {} }}"
        - variables:
            _base: >-
              {%- set url = (_twenty_cfg.get('url', '') | string | trim) if _twenty_cfg is mapping else '' -%}
              {%- if not url -%}{%- set url = states('input_text.twenty_url') | default('') | trim -%}{%- endif -%}
              {{ url | regex_replace('/$','') }}

    - choose:
      - conditions:
        - condition: template
          value_template: '{{ _base == "" }}'
        sequence:
        - variables:
            final_response:
              status: not_configured
              tool: Zen DojoTools Twenty Advanced
              message: 'Twenty CRM URL not configured. Run zen_dojotools_rolodex mode=run case=configure to set up.'
              availability:
                ok: false
                class: not_configured
                human: Twenty CRM is not set up yet. Run Rolodex configure with the Twenty URL.
                operator_hint: Configure integrations_config.twenty.url in the household cabinet.
              config:
                url_configured: false
        - stop: twenty not configured
          response_variable: final_response

    - choose:
      - conditions:
        - condition: template
          value_template: '{{ _at == "post" }}'
        sequence:
        - action: rest_command.twenty_rest_post
          response_variable: _raw
          continue_on_error: true
          data:
            base_url: '{{ _base }}'
            endpoint: '{{ _ep }}'
            payload: '{{ _pl }}'
      - conditions:
        - condition: template
          value_template: '{{ _at == "patch" }}'
        sequence:
        - action: rest_command.twenty_rest_patch
          response_variable: _raw
          continue_on_error: true
          data:
            base_url: '{{ _base }}'
            endpoint: '{{ _ep }}'
            payload: '{{ _pl }}'
      - conditions:
        - condition: template
          value_template: '{{ _at == "delete" }}'
        sequence:
        - action: rest_command.twenty_rest_delete
          response_variable: _raw
          continue_on_error: true
          data:
            base_url: '{{ _base }}'
            endpoint: '{{ _ep }}'
      - conditions:
        - condition: template
          value_template: '{{ _at == "meta" }}'
        sequence:
        - action: rest_command.twenty_rest_meta
          response_variable: _raw
          continue_on_error: true
          data:
            base_url: '{{ _base }}'
            payload: '{{ _pl }}'
      default:
        - action: rest_command.twenty_rest_get
          response_variable: _raw
          continue_on_error: true
          data:
            base_url: '{{ _base }}'
            endpoint: '{{ _ep }}'

    - variables:
        _raw_ok: '{{ _raw is defined and _raw is mapping }}'
        _http: '{{ _raw["status"] | int(0) if _raw is defined and _raw is mapping else 0 }}'

    - variables:
        _content: >-
          {%- if _raw is defined and _raw is mapping -%}
            {%- set c = _raw["content"] | default(none) -%}
            {%- set cs = c | trim if c is string else '' -%}
            {%- if c is string and cs != '' and cs[:1] in ['{', '['] -%}
              {{ c | from_json | default({}) }}
            {%- elif c is mapping or (c is sequence and c is not string) -%}
              {{ c }}
            {%- else -%}{{ {} }}{%- endif -%}
          {%- else -%}{{ {} }}{%- endif -%}
        _content_class: >-
          {%- set c = _raw["content"] | default(none) if _raw_ok else none -%}
          {%- set cs = c | trim if c is string else '' -%}
          {%- if c is mapping or (c is sequence and c is not string) or (c is string and cs[:1] in ['{', '[']) -%}json
          {%- elif c is string and cs != '' -%}non_json
          {%- else -%}empty{%- endif -%}
        _availability: >-
          {%- set h = _http | int(0) -%}
          {%- if h in [0, 200, 201, 202, 204] and _raw_ok and _content_class != 'non_json' -%}
            {{ {'ok': true, 'class': 'available', 'human': 'Twenty CRM is reachable.', 'operator_hint': 'No action needed.'} }}
          {%- elif h in [0, 200, 201, 202, 204] and _raw_ok and _content_class == 'non_json' -%}
            {{ {'ok': false, 'class': 'non_json_response', 'human': 'Twenty CRM answered, but not with API JSON. This usually means a login page, proxy page, or wrong REST path.', 'operator_hint': 'Check the base URL, /rest path, reverse proxy auth bypass, and bearer token header.'} }}
          {%- elif not _raw_ok or h == 0 -%}
            {{ {'ok': false, 'class': 'network_error', 'human': 'Twenty CRM did not answer. It is probably DNS, routing, reverse proxy, or the service is down.', 'operator_hint': 'Check the configured base URL, DNS name, network route, container/service health, and reverse proxy.'} }}
          {%- elif h == 400 -%}
            {{ {'ok': false, 'class': 'bad_request', 'human': 'Twenty CRM says the request shape or object path is wrong.', 'operator_hint': 'Check the REST object name, endpoint syntax, filters, and UUIDs.'} }}
          {%- elif h == 401 -%}
            {{ {'ok': false, 'class': 'auth_failed', 'human': 'Twenty CRM rejected the token. The token may be expired, revoked, or malformed.', 'operator_hint': 'Check twenty_bearer in secrets.yaml and confirm the API key is still valid.'} }}
          {%- elif h == 403 -%}
            {{ {'ok': false, 'class': 'forbidden', 'human': 'Twenty CRM says the caller is not allowed through that door.', 'operator_hint': 'Confirm the API key has permission for this object and endpoint.'} }}
          {%- elif h == 404 -%}
            {{ {'ok': false, 'class': 'not_found', 'human': 'Twenty CRM answered, but that endpoint or object is not here.', 'operator_hint': 'Check the base URL, /rest path, object UUID, and DNS alias.'} }}
          {%- elif h >= 500 -%}
            {{ {'ok': false, 'class': 'server_error', 'human': 'Twenty CRM is borked server-side right now. Try again later after checking service logs.', 'operator_hint': 'Check Twenty server logs, database health, and worker/container status.'} }}
          {%- else -%}
            {{ {'ok': false, 'class': 'unknown_error', 'human': 'Twenty CRM returned an unexpected HTTP status.', 'operator_hint': 'Check http_status, endpoint, token, and service logs.'} }}
          {%- endif -%}

    - variables:
        final_response:
          status: "{{ 'success' if _availability is mapping and _availability.get('ok', false) else 'error' }}"
          http_status: '{{ _http }}'
          availability: '{{ _availability }}'
          result:
            content: '{{ _content }}'

    - stop: return
      response_variable: final_response

  zen_stack_crm:
    alias: Zen Stack Provider - CRM / Twenty (Internal)
    description: >
      Internal lens provider handler for CRM/Twenty. Accepts the standard
      mode + input_json stack-provider shape and delegates to Rolodex.
    mode: parallel
    max: 10
    fields:
      mode:
        name: Mode
        description: Stack operation, e.g. stacks_by_anchor or tool_manifest.
        selector:
          text:
      input_json:
        name: Input JSON
        description: Structured JSON payload for the Stack operation.
        selector:
          text:
            multiline: true
      caller_token:
        name: Caller Token
        description: Opaque token passed through for correlation.
        selector:
          text:
    sequence:
    - variables:
        _stack_mode: "{{ mode | default('help') | string | trim | lower }}"
        _stack_input: >-
          {%- set raw = input_json | default('{}', true) -%}
          {%- if raw is mapping -%}{{ raw }}
          {%- elif raw is string and raw | trim != '' -%}{{ raw | from_json({}) }}
          {%- else -%}{{ {} }}{%- endif -%}
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ _stack_mode == 'tool_manifest' }}"
        sequence:
        - action: script.zen_dojotools_filecabinet
          response_variable: _crm_tm_ic_raw
          continue_on_error: true
          data:
            action_type: get
            volume_entity_id: "{{ label_entities('zen_default_household_cabinet') | select('match', 'sensor\\.') | list | first | default('') }}"
            path: integrations_config
        - variables:
            _crm_tm_base_url: >-
              {%- set _ic = _crm_tm_ic_raw.get('value', {}) if _crm_tm_ic_raw is mapping and _crm_tm_ic_raw.get('status') == 'success' else {} -%}
              {%- set _ic = _ic if _ic is mapping else {} -%}
              {%- set url = (_ic.get('twenty', {}).get('url', '') | string | trim) if _ic.get('twenty', {}) is mapping else '' -%}
              {%- if not url -%}{%- set url = states('input_text.twenty_url') | default('', true) | trim -%}{%- endif -%}
              {{ url }}
        - variables:
            _manifest: >-
              {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
              {%- set _configured = _crm_tm_base_url != '' -%}
              {%- set _health = {'configured': _configured, 'status': 'ok' if _configured else 'warn', 'notes': [] if _configured else ['Twenty CRM URL not configured — set integrations_config.twenty.url in the household cabinet']} -%}
              {{- MF.tool_manifest(
                tool='zen_stack_crm',
                display_name='CRM / Twenty',
                tier='stacks',
                version='1.0.0',
                health=_health,
                required_labels=['crm'],
                optional_labels=['twenty'],
                consumes=['company', 'person'],
                returns=['company_evidence', 'contact_evidence'],
                failure_policy='soft',
                content_policy='redacted_by_default',
                risk_class='read_redacted',
                security_act={'model': 'rwxda', 'required': 'r', 'allowed': ['r'], 'denied': ['w', 'x', 'd', 'a'], 'note': 'Lens provider returns redacted read evidence only; CRUD/write operations require zen_dojotools_rolodex directly.'},
                modes={'lookup': 'stacks_by_anchor', 'manifest': 'tool_manifest'},
                limitations=['Lookup requires stable Twenty company/person UUID anchors.', 'Lens output is redacted and does not include raw note bodies.'],
                evidence_shape={'company': {'id': 'Twenty company UUID.', 'name_redacted': 'true — raw name not exposed.'}, 'contact': {'id': 'Twenty person UUID.', 'name_redacted': 'true — raw name not exposed.'}},
                icon='mdi:account-tie',
                color='blue',
                stripe=2,
                impact='soft',
                mcp_exposed=false,
                lens_provider=true,
                caller_token=caller_token | default('')
              ) | from_json | combine({'register_mode': 'register', 'provider_key': 'crm'}) -}}
        - stop: crm lens manifest complete
          response_variable: _manifest
      # ── register — declared register_mode='register' above but this had no
      # actual handler until now: bootstrap_stacks was calling mode=register
      # on a script with no matching branch, silently no-op'ing while still
      # reporting "registered" (nothing to fall into, no error to surface).
      - conditions:
        - condition: template
          value_template: "{{ _stack_mode == 'register' }}"
        sequence:
        - variables:
            _crm_hh: "{{ label_entities('zen_default_household_cabinet') | select('match', 'sensor\\.') | list | first | default('') }}"
        - action: script.zen_dojotools_filecabinet
          continue_on_error: true
          response_variable: _crm_reg_read
          data:
            action_type: get
            volume_entity_id: "{{ _crm_hh }}"
            key: lens_registry
        - variables:
            _crm_existing_reg: >-
              {%- set raw = _crm_reg_read if _crm_reg_read is mapping else {} -%}
              {%- set val = raw.get('value', {}) -%}
              {%- set parsed = val | from_json if val is string else val -%}
              {{ parsed if parsed is mapping else {} }}
            _crm_provider_decl:
              provider: crm
              configured_by: zen_stack_crm
              department: stacks
              enabled: true
              status: available
              tool: zen_stack_crm
              mode: stacks_by_anchor
              consumes: [company, person]
              returns: [company_evidence, contact_evidence]
              failure_policy: soft
              content_policy: redacted_by_default
              risk_class: read_redacted
              security_act:
                model: rwxda
                required: r
                allowed: [r]
                denied: [w, x, d, a]
        - action: script.zen_dojotools_filecabinet
          continue_on_error: true
          response_variable: _crm_reg_write
          data:
            action_type: update
            volume_entity_id: "{{ _crm_hh }}"
            key: lens_registry
            value: "{{ _crm_existing_reg | combine({'crm': _crm_provider_decl}) | tojson }}"
        - variables:
            _crm_reg_response:
              status: "{{ 'success' if _crm_reg_write is mapping and _crm_reg_write.get('status', '') == 'success' else 'error' }}"
              provider: crm
              mode: register
              message: >-
                {{ 'Provider crm registered in lens_registry.' if _crm_reg_write is mapping
                   and _crm_reg_write.get('status', '') == 'success' else
                   'Registration failed: ' ~ (_crm_reg_write.get('error', 'unknown') if _crm_reg_write is mapping else 'no response') }}
        - stop: crm register complete
          response_variable: _crm_reg_response
      # ── unregister ──────────────────────────────────────────────────────
      - conditions:
        - condition: template
          value_template: "{{ _stack_mode == 'unregister' }}"
        sequence:
        - variables:
            _crm_hh: "{{ label_entities('zen_default_household_cabinet') | select('match', 'sensor\\.') | list | first | default('') }}"
        - action: script.zen_dojotools_filecabinet
          continue_on_error: true
          response_variable: _crm_unreg_read
          data:
            action_type: get
            volume_entity_id: "{{ _crm_hh }}"
            key: lens_registry
        - variables:
            _crm_unreg_existing: >-
              {%- set raw = _crm_unreg_read if _crm_unreg_read is mapping else {} -%}
              {%- set val = raw.get('value', {}) -%}
              {%- set parsed = val | from_json if val is string else val -%}
              {%- set d = parsed if parsed is mapping else {} -%}
              {%- set ns = namespace(result={}) -%}
              {%- for k, v in d.items() if k != 'crm' -%}
                {%- set ns.result = ns.result | combine({k: v}) -%}
              {%- endfor -%}
              {{ ns.result }}
        - action: script.zen_dojotools_filecabinet
          continue_on_error: true
          response_variable: _crm_unreg_write
          data:
            action_type: update
            volume_entity_id: "{{ _crm_hh }}"
            key: lens_registry
            value: "{{ _crm_unreg_existing | tojson }}"
        - variables:
            _crm_unreg_response:
              status: "{{ 'success' if _crm_unreg_write is mapping and _crm_unreg_write.get('status', '') == 'success' else 'error' }}"
              provider: crm
              mode: unregister
        - stop: crm unregister complete
          response_variable: _crm_unreg_response
      - conditions:
        - condition: template
          value_template: "{{ _stack_mode == 'stacks_by_anchor' }}"
        sequence:
        - variables:
            _anchor_type: "{{ _stack_input.get('anchor_type', '') | string | lower | trim if _stack_input is mapping else '' }}"
            _anchor_ids: >-
              {%- set ids = _stack_input.get('anchor_ids', []) if _stack_input is mapping else [] -%}
              {%- if ids is sequence and ids is not string -%}{{ ids }}
              {%- elif _stack_input is mapping and _stack_input.get('anchor_id', '') | string | trim != '' -%}{{ [_stack_input.get('anchor_id') | string | trim] }}
              {%- else -%}{{ [] }}{%- endif -%}
            _crm_docs: []
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _anchor_type not in ['company', 'person'] }}"
            sequence:
            - variables:
                _unsupported:
                  status: success
                  provider: crm
                  result:
                    count: 0
                    documents: []
                    content_redacted: true
                    miss_reason: anchor_type_unsupported
                  caller_token: "{{ caller_token | default('') }}"
            - stop: crm lens unsupported anchor
              response_variable: _unsupported
        - repeat:
            for_each: "{{ _anchor_ids }}"
            sequence:
            - action: script.zen_dojotools_rolodex
              response_variable: _crm_anchor_raw
              continue_on_error: true
              data:
                mode: run
                case: stacks_by_anchor
                anchor_type: "{{ _anchor_type }}"
                item_id: "{{ repeat.item }}"
                caller_token: "{{ caller_token | default('') }}"
            - variables:
                _crm_anchor_outer: "{{ _crm_anchor_raw.get('result', _crm_anchor_raw) if _crm_anchor_raw is mapping else {} }}"
                _crm_anchor_result: "{{ _crm_anchor_outer.get('result', {}) if _crm_anchor_outer is mapping else {} }}"
                _crm_docs: >-
                  {%- set docs = _crm_docs if _crm_docs is sequence and _crm_docs is not string else [] -%}
                  {%- if _anchor_type == 'company' and _crm_anchor_result is mapping and _crm_anchor_result.get('company', {}) is mapping and _crm_anchor_result.get('company', {}).get('id', '') != '' -%}
                    {%- set co = _crm_anchor_result.get('company', {}) -%}
                    {{ docs + [{
                      'id': co.get('id', repeat.item),
                      'title': '',
                      'title_redacted': true,
                      'summary': 'CRM company evidence',
                      'content_redacted': true,
                      'crm': {'company_id': co.get('id', repeat.item), 'name_redacted': true},
                      'stack': {'provider': 'crm', 'object_type': 'company', 'source_id': co.get('id', repeat.item), 'evidence_id': 'crm:company:' ~ (co.get('id', repeat.item) | string), 'lens_mode': 'stacks_by_anchor'},
                      'anchor_contexts': [{'type': 'company', 'id': repeat.item | string, 'confidence': 'explicit', 'source': 'twenty', 'provider': 'crm'}],
                      'matched_anchor_ids': [repeat.item | string]
                    }] }}
                  {%- elif _anchor_type == 'person' and _crm_anchor_result is mapping and _crm_anchor_result.get('contact', {}) is mapping and _crm_anchor_result.get('contact', {}).get('id', '') != '' -%}
                    {%- set p = _crm_anchor_result.get('contact', {}) -%}
                    {{ docs + [{
                      'id': p.get('id', repeat.item),
                      'title': '',
                      'title_redacted': true,
                      'summary': 'CRM contact evidence',
                      'content_redacted': true,
                      'crm': {'contact_id': p.get('id', repeat.item), 'name_redacted': true, 'company_id': p.get('company_id', ''), 'company_redacted': true},
                      'stack': {'provider': 'crm', 'object_type': 'contact', 'source_id': p.get('id', repeat.item), 'evidence_id': 'crm:contact:' ~ (p.get('id', repeat.item) | string), 'lens_mode': 'stacks_by_anchor'},
                      'anchor_contexts': [{'type': 'person', 'id': repeat.item | string, 'confidence': 'explicit', 'source': 'twenty', 'provider': 'crm'}],
                      'matched_anchor_ids': [repeat.item | string]
                    }] }}
                  {%- else -%}
                    {{ docs }}
                  {%- endif -%}
        - variables:
            _crm_response:
              status: success
              provider: crm
              result:
                count: "{{ _crm_docs | length }}"
                documents: "{{ _crm_docs }}"
                content_redacted: true
              caller_token: "{{ caller_token | default('') }}"
        - stop: crm stack provider complete
          response_variable: _crm_response
    - variables:
        _crm_help:
          status: success
          provider: crm
          modes: [stacks_by_anchor, tool_manifest]
          message: CRM stack provider accepts mode=stacks_by_anchor with input_json anchor_type company/person and anchor_ids.
          caller_token: "{{ caller_token | default('') }}"
    - stop: crm stack provider help
      response_variable: _crm_help

  zen_dojotools_rolodex:
    alias: Zen DojoTools Rolodex
    description: >
      Zen DojoTools Rolodex "Rolodex Prime" — Organization is the right of all sentient beings.
      Contact/company CRM via Twenty REST + property-ops via HA calendar and todo.
      Contacts: find, get, create, note. Companies: find, get, create.
      Tag contacts/companies with ZenOS HA labels (ha_labels); search by label.
      Guest stays: stay_create/stay_get/stays_active_list/stay_release (structured Twenty
      object, not just a calendar entry — area-validated, overlap-warned, auto-dispatches
      a turnover chore + hot-tub recheck on checkout) and stay_amenity_add for mid-stay
      housekeeping (towel refresh, welcome basket — a dated, location-tied task, distinct
      from the checkout turnover). Multi-room bookings: reservation_create/_get/
      reservations_active_list/_checkout/_cancel — one reservation-level record spanning
      several rooms, each becoming its own member stay; checkout/cancel operate on the
      whole booking at once. Lifecycle scans (periodic-automation-driven, but also
      directly agent-queryable): stay_prep_check/checkout_status/stay_checkout_check —
      arrival-prep and checkout-approaching signals, closing the "does the agent already
      know a departure/arrival is coming" gap on both ends of a stay. Vendor appointments: appt_create/_start/_complete/
      _no_show/_cancel, with completion auto-writing to vendor_history. Guest requests:
      service_request_create/_get/_resolve, routed by shape (HOUSEKEEPING->Grocy chore,
      MAINTENANCE->Radar ticket). guest_prefs_set stores allergens/prefs on a contact;
      active_stay_prefs is the shared lookup Kitchen's allergen-flagging uses. Reminders +
      tasks in Friday's task list. Vendor service history. Timeline aggregation across all
      sources. vendor_link: schema-level Grocy↔CRM binding (shopping_lists + shopping_locations).
      Run configure to bootstrap routing. mode=help for full case docs.
    mode: queued
    max: 5
    icon: mdi:card-account-details
    fields:
      mode:
