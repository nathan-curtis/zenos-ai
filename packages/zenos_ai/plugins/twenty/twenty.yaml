                  {%- set q = 'query { fields(filter: {isCustom: {is: true}}) { edges { node { id name objectMetadataId } } } }' -%}
                  {{ {'query': q} | tojson }}
            - variables:
                _ps_stay_id_existing: >-
                  {%- set _r = _ps_stay_obj_raw if _ps_stay_obj_raw is mapping else {} -%}
                  {%- set _c = _r.get('result', {}).get('content', {}) if _r.get('status') == 'success' else {} -%}
                  {%- set _c = _c if _c is mapping else {} -%}
                  {%- set _d = _c.get('data') -%}
                  {%- set _d = _d if _d is mapping else {} -%}
                  {%- set _edges = _d.get('fields', {}).get('edges', []) if _d.get('fields') is mapping else [] -%}
                  {%- set _ns = namespace(id='') -%}
                  {%- for e in _edges -%}
                    {%- if e is mapping and e.get('node', {}).get('name','') == 'guestContactId' -%}
                      {%- set _ns.id = e.get('node', {}).get('objectMetadataId', '') -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ _ns.id }}
          default:
          - variables:
