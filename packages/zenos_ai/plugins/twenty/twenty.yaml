              _ps_appt_id_created: ''
        - variables:
            _ps_appt_id: "{{ _ps_appt_id_existing if _ps_appt_id_existing != '' else _ps_appt_id_created }}"

        # Step 2c.5: existence check + create for the "reservation" custom
        # object — thin booking-level grouping/lifecycle wrapper over "stay".
        # Deliberately NOT the source of truth for room/dates/turnover-state —
        # stay keeps that role. Membership is stay.reservationId pointing up
