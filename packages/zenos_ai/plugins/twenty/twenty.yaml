              {%- if email_norm != '' -%}{%- set ns.f = ns.f | combine({'emails': {'primaryEmail': email_norm}}) -%}{%- endif -%}
              {%- if phone_norm != '' -%}{%- set ns.f = ns.f | combine({'phones': {'primaryPhoneNumber': phone_norm, 'primaryPhoneCallingCode': '+1', 'primaryPhoneCountryCode': 'US'}}) -%}{%- endif -%}
              {%- if company_id_norm != '' -%}{%- set ns.f = ns.f | combine({'companyId': company_id_norm}) -%}{%- endif -%}
              {{ ns.f }}
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _cu_fields | length == 0 }}'
            sequence:
            - variables:
                final_response:
                  status: error
                  tool: '{{ tool_name }}'
                  case: contact_update
                  error: "Nothing to update — pass at least one of first_name, last_name, email, phone, or company_id."
            - stop: return
              response_variable: final_response

        - action: script.zen_sutra_twenty
          response_variable: _cu_adv
          continue_on_error: true
          data:
            action_type: patch
            endpoint: 'people/{{ item_id_norm }}'
            payload: '{{ _cu_fields | tojson }}'

        - variables:
            _cu_ok: '{{ _cu_adv is mapping and _cu_adv.get("status") == "success" }}'
            _cu_body: >-
              {%- if _cu_adv is mapping and "result" in _cu_adv and "content" in _cu_adv["result"] -%}
                {{ _cu_adv["result"]["content"] }}
              {%- else -%}{{ {} }}{%- endif -%}
            _cu_result: '{{ _cu_body.get("data", {}).get("updatePerson", _cu_body.get("data", {})) if _cu_body is mapping else {} }}'

        - variables:
            final_response:
              status: '{{ "success" if _cu_ok and _cu_result is mapping and _cu_result.get("id","") != "" else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: contact_update
              result:
                id: '{{ _cu_result.get("id","") if _cu_result is mapping else "" }}'
                fields_updated: '{{ _cu_fields.keys() | list }}'
              error: '{{ none if (_cu_ok and _cu_result is mapping and _cu_result.get("id","") != "") else ("update failed — HTTP " ~ _cu_adv.get("http_status","?") if _cu_adv is mapping else "broker error") }}'
        - stop: return
          response_variable: final_response

