            _cg_em: '{{ _cg_p.get("emails", {}) if _cg_p is mapping and _cg_p.get("emails") is mapping else {} }}'
            _cg_ph: '{{ _cg_p.get("phones", {}) if _cg_p is mapping and _cg_p.get("phones") is mapping else {} }}'
            _cg_company_id: '{{ _cg_p.get("companyId", "") if _cg_p is mapping else "" }}'
            _cg_ha_person_id: '{{ _cg_p.get("haPersonId", "") if _cg_p is mapping else "" }}'

        # fetch company name if companyId is set
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _cg_company_id != "" }}'
            sequence:
            - action: script.zen_sutra_twenty
              response_variable: _cg_co_adv
              continue_on_error: true
              data:
                action_type: get
                endpoint: 'companies/{{ _cg_company_id }}'
            - variables:
                _cg_co_body: >-
                  {%- if _cg_co_adv is mapping and "result" in _cg_co_adv and "content" in _cg_co_adv["result"] -%}
                    {{ _cg_co_adv["result"]["content"] }}
                  {%- else -%}{{ {} }}{%- endif -%}
                _cg_company_name: '{{ _cg_co_body.get("data", {}).get("company", {}).get("name", "") if _cg_co_body is mapping else "" }}'

        - variables:
            _cg_ha_presence: >-
              {%- if _cg_ha_person_id != "" -%}
                {{ {'entity_id': _cg_ha_person_id, 'zone': states(_cg_ha_person_id), 'state': states(_cg_ha_person_id)} }}
              {%- else -%}{{ none }}{%- endif -%}

        - variables:
            final_response:
              status: '{{ "success" if _cg_ok and _cg_p else "error" }}'
              tool: '{{ tool_name }}'
              version: '{{ tool_version }}'
              case: contact_get
              result:
                id: '{{ _cg_p.get("id","") if _cg_p is mapping else "" }}'
                name: '{{ ((_cg_nm.get("firstName","") ~ " " ~ _cg_nm.get("lastName","")) | trim) }}'
                email: '{{ _cg_em.get("primaryEmail","") }}'
                phone: '{{ _cg_ph.get("primaryPhoneNumber","") }}'
                job_title: '{{ _cg_p.get("jobTitle","") if _cg_p is mapping else "" }}'
