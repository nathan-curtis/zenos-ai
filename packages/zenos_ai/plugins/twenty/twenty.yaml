    # clobber name/employees/etc already on the record.
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ case_norm == "company_update" }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ item_id_norm == "" }}'
            sequence:
            - variables:
