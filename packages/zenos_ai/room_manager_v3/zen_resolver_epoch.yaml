###############################################################################
# ZenOS Room Manager v3 — Resolver Epoch Heartbeat (2026-08-05)
#
# SUPERSEDED for room_state.yaml specifically (2026-08-05): that
# blueprint is now TRIGGER-BASED (explicit trigger_entities list +
# `trigger: event: zen_resolver_refresh` + homeassistant_start), so it
# reacts to zen_resolver_refresh directly and no longer depends on this
# heartbeat at all. Root cause of the original design's failure: a plain
# (non-trigger) template sensor referencing this input_text ONLY inside a
# shared `variables:` block (never consumed by state/attributes) was
# confirmed LIVE to sometimes silently fail to register it as a tracked
# dependency — three separate zen_resolver_refresh fires, each verified
# to genuinely change this entity's own state, produced zero re-render on
# a deployed room_state instance. Root cause never fully isolated;
# rather than keep chasing HA's opaque dependency-tracking behavior for
# something load-bearing, the blueprint was converted to an explicit
# trigger list instead (deterministic, no ambiguity).
#
# This input_text + bump automation is left in place as GLOBAL infra —
# other resolver-subscribed sensors (cabinet health, etc.) may still use
# the same "bump on zen_resolver_refresh" pattern successfully; it was
# never proven broken for those, only for this one blueprint's specific
# variables-block-only reference pattern. Renamed from the earlier
# sim-only input_text.zen_sim_label_epoch (2026-08-05 correction) — the
# blueprint referencing a sim-specific entity name broke portability;
# this generic name is deployed identically on both T and H.
###############################################################################
input_text:
  zen_resolver_epoch:
    name: "ZenOS — Resolver Epoch Heartbeat"
    icon: mdi:pulse
    max: 20

automation:
  - alias: "ZenOS — Bump Resolver Epoch on zen_resolver_refresh"
    id: zen_bump_resolver_epoch
    trigger:
      - trigger: event
        event_type: zen_resolver_refresh
    action:
      - action: input_text.set_value
        target:
          entity_id: input_text.zen_resolver_epoch
        data:
          value: "{{ now().strftime('%H:%M:%S') }}"
