template:

# Home Overview Sensor
# Compact top-line context for Friday's prompt and the ninja summarizer.
# State = home_mode; attributes mirror RM home_overview top-line signals.
# Full floor/room/inventory/autovac/plant/presence depth → room_manager mode=home_overview
  - sensor:
      - unique_id: 5b2eb0cc-7e8e-4ede-862a-b32b9d9ece31
        name: "Home Overview"
        state: "{{ states('sensor.zen_home_mode') | default(states('input_select.zen_home_mode'), true) }}"
        attributes:
          home_mode: "{{ states('sensor.zen_home_mode') | default(states('input_select.zen_home_mode'), true) }}"
          security_mode: >-
            {%- set _panel = label_entities('alarm_panel') | select('match', 'alarm_control_panel\\.') | list | first | default('') -%}
            {{ states(_panel) if _panel else 'unavailable' }}
          guest_mode: "{{ is_state('input_boolean.zen_guest_mode', 'on') }}"
          entertainment_mode: "{{ is_state('input_boolean.zen_entertaining', 'on') }}"
          vacation_mode: "{{ is_state('calendar.vacation_mode', 'on') }}"
          quiet_hours: "{{ states('binary_sensor.zen_quiet_hours') }}"
          work_hours: "{{ states('binary_sensor.zen_work_hours') }}"
          person_count_home: "{{ states('zone.home') | int(0) }}"
          persons_home: >-
            {{ states.person | selectattr('state', 'eq', 'home') | map(attribute='name') | list }}
          all_quiet: "{{ is_state('sensor.zen_priority_context', 'clear') }}"
          priority_count: "{{ state_attr('sensor.zen_priority_context', 'count') | default(0, true) | int }}"
          highest_urgency: "{{ state_attr('sensor.zen_priority_context', 'highest_urgency') | default('', true) }}"
          lights_on: "{{ states.light | selectattr('state', 'eq', 'on') | list | count }}"
          active_media: "{{ states.media_player | selectattr('state', 'in', ['playing', 'paused']) | list | count }}"
          battery_low_count: >-
            {%- set _batt = label_entities('battery_sensor') | select('match', 'sensor\\.') | list -%}
            {%- set _batt = _batt if _batt | length > 0 else (states.sensor | selectattr('attributes.device_class', 'eq', 'battery') | map(attribute='entity_id') | list) -%}
            {%- set ns = namespace(low=0) -%}
            {%- for e in _batt -%}{%- set p = states(e) | int(-1) -%}{%- if 0 <= p < 20 -%}{%- set ns.low = ns.low + 1 -%}{%- endif -%}{%- endfor -%}
            {{ ns.low }}
          open_sensor_count: >-
            {{ states.binary_sensor | selectattr('attributes.device_class', 'in', ['door', 'window', 'opening', 'garage_door']) | selectattr('state', 'eq', 'on') | list | count }}
          weather_condition: >-
            {%- set _we = label_entities('zen_weather') | select('match', 'weather\\.') | list | first | default('') -%}
            {{ states(_we) if _we else 'unavailable' }}
          weather_temp_f: >-
            {%- set _we = label_entities('zen_weather') | select('match', 'weather\\.') | list | first | default('') -%}
            {{ state_attr(_we, 'temperature') | default(none, true) if _we else none }}
          rooms: >-
            {#- 2026-08-18: fixed -- was always empty (compact_overview()
               expected a 'rooms' attribute here that never existed). No
               naming convention exists for v3 room-state sensor entity_ids
               (see room_state.yaml blueprint header), so discovery goes by
               a distinctive attribute instead: occupied_active is stamped
               unconditionally (never none) on every v3 room-state sensor,
               nothing else in this house uses that exact attribute name.
               Deliberately lean, to avoid overloading the prompt --
               just {room: state}, not the full per-room attribute set. Full
               depth stays behind room_manager mode=home_overview/get. -#}
            {%- set ns = namespace(out={}) -%}
            {%- for s in states.sensor -%}
              {%- if 'occupied_active' in s.attributes -%}
                {%- set _room = area_name(s.entity_id) | default(s.name, true) -%}
                {%- set ns.out = ns.out | combine({_room: s.state}) -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.out }}
          detail: "room_manager mode=home_overview — full floors, rooms, inventory, autovac, plant, presence"
        icon: mdi:home-analytics

# Scheduler Queue Depth — exposes automation current attribute as recordable state
  - sensor:
      - unique_id: zen_scheduler_queue_depth
        name: zen_scheduler_queue_depth
        state: "{{ state_attr('automation.zen_dojotools_scheduler', 'current') | int(0) }}"
        unit_of_measurement: runs
        icon: mdi:karate

# Vac Alarm Downgrade Active — mirrors security_manager cabinet drawer's
# _auto_arm_config.vacuum_alarm_mode_active for dashboard use (the dashboard's
# home-status card's alarm chip needs a real states()-readable entity; the
# authoritative value only lives in the household cabinet's
# variables.security_manager._auto_arm_config, not an entity). Replaces the
# dead input_boolean.vacuum_alarm_mode_active the card's own JS still
# referenced. First
# attempt registered as binary_sensor.vac_alarm_downgrade_active (name:
# without the zen_ prefix slugified without it) -- that stale registry row
# is now orphaned/unavailable and harmless; this unique_id was freed when
# that block was pulled and reloaded, so reusing it is safe.
  - binary_sensor:
      - unique_id: zen_vac_alarm_downgrade_active
        name: zen_vac_alarm_downgrade_active
        state: >-
          {%- set _hh_cab = states('sensor.zen_default_household_cabinet_resolved') -%}
          {%- set _hh_vars = state_attr(_hh_cab, 'variables') | default({}, true) -%}
          {%- set _sm = _hh_vars.get('security_manager', {}) -%}
          {%- set _sm_val = (_sm.get('value', _sm) if _sm is mapping else {}) -%}
          {{ (_sm_val.get('_auto_arm_config', {}).get('vacuum_alarm_mode_active', false) | bool(false)) if _sm_val is mapping else false }}
        icon: mdi:robot-vacuum-variant