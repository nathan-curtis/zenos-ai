###############################################################################
# ZenOS-AI — Cabinet Health
# Version: 4.5.6
#
# sensor.zen_cabinet_health
#   Validates the presence and health of all Zen cabinets against defaults
#   and the canonical list.
#   State: critical | error | warn | ok
#     critical = one or more required cabinet labels missing from index
#     error    = one or more required slots have multiple or unhealthy cabinets
#     warn     = one or more required labels exist but no cabinet is tagged
#     ok       = all required slots filled, single healthy cabinet each
#
# MIGRATED FROM: zenos_system_health.yaml
###############################################################################

template:
  # BUG FIX (2026-08-01): this sensor never had a trigger: block at all, despite
  # zenos_summarizer_system_health.yaml's own architecture header explicitly
  # documenting it as one of the trigger-based health sensors
  # (zen_health_tick + zen_resolver_refresh + ha_start), matching
  # sensor.zen_monastery_health's actual trigger set below. Without it, this
  # sensor relied on HA's implicit reactive dependency-tracking, which doesn't
  # see through {% import %}'d macros calling label_entities() dynamically —
  # so it never recomputed after cabinetadmin actions, showing a stale
  # snapshot for 8+ minutes past real cabinet-init/mount changes during a
  # virgin-deploy test. Deliberately NOT using a time_pattern/clock trigger —
  # this file's own resolver-sensor comments ("no clock, no race, no
  # unavailable window") already establish why: a periodic tick can fire
  # mid-write (e.g. between cabinetadmin_factory's sequential drawer writes)
  # and misclassify a cabinet that's simply mid-stamp, not broken. Trigger-
  # only, matching monastery_health exactly.
  - trigger:
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: zen_health_tick
      - trigger: event
        event_type: zen_resolver_refresh
        alias: Manual refire
    sensor:
      - name: Zen Cabinet Health
        unique_id: zen_cabinet_health
        device_class: enum
        availability: "true"

        #######################################################################
        # STATE
        #######################################################################
        state: >
          {%- import 'zenos_ai/zenos_health.jinja' as HEALTH -%}
          {{- HEALTH.zen_cabinet_health_state()  -}}
          

        #######################################################################
        # ATTRIBUTES
        #######################################################################
        attributes:

          reason: >-
            {%- import 'zenos_ai/zenos_health.jinja' as HEALTH -%}
            {{- HEALTH.zen_cabinet_health_reason() -}}

          #####################################################################
          # LABEL HEALTH PASS-THROUGH
          #####################################################################
          label_health: >-
            {% set e = 'sensor.zen_label_health' %}
            {% set exists = states[e] is not none %}
            {% set st = states(e) %}
            {% set valid = exists and st not in ['unknown','unavailable', none] %}

            {% if valid and st == 'ok' %}
              ok
            {% else %}
              {{
                {
                  'state': (st if valid else None),
                  'more_detail': (states[e].entity_id if valid else {})
                }
              }}
            {% endif %}

          #####################################################################
          # REQUIRED + OPTIONAL
          #####################################################################
          required_cabinets: >
            {%- import 'zenos_ai/zenos_health.jinja' as HEALTH -%}
            {{ HEALTH.slots_required() | from_json() }}

          optional_cabinets: >-
            {%- import 'zenos_ai/zenos_health.jinja' as HEALTH -%}
            {{ HEALTH.slots_optional() | from_json() }}

          #####################################################################
          # EXISTING CABINETS (BY SLOT)
          #####################################################################
          existing_cabinets: >-
            {%- import 'zenos_ai/zenos_health.jinja' as HEALTH -%}
            {% set slots = HEALTH.slots_all() | from_json() %}
            {% set slot_to_label = HEALTH.slot_to_label() | from_json() %}
            {% set all_cabs = label_entities('Zen Cabinet' | slugify) | list %}
            {% set ns = namespace(found=[]) %}

            {% for slot in slots %}
              {% set label_slug = slot_to_label[slot] | slugify %}
              {% set ents = intersect(all_cabs, label_entities(label_slug) or []) | list %}
              {% if ents | count > 0 %}
                {% set ns.found = ns.found + [slot] %}
              {% endif %}
            {% endfor %}

            {{ ns.found | join(', ') if ns.found else 'none' }}

          #####################################################################
          # MISSING REQUIRED CABINETS (LABEL OR ASSIGNMENT)
          #####################################################################
          missing_cabinets: >-
            {%- import 'zenos_ai/zenos_health.jinja' as HEALTH -%}
            {% set required = HEALTH.slots_required() | from_json() %}
            {% set slot_to_label = HEALTH.slot_to_label() | from_json() %}
            
            {% set parent_slug = 'Zen Cabinet' | slugify %}
            {% set all_cabs = label_entities(parent_slug) | list %}
            {% set label_index = labels() %}
            {% set ns = namespace(miss=[]) %}

            {% for slot in required %}
              {% set label_slug = slot_to_label[slot] | slugify %}
              {% set label_exists = label_slug in label_index %}
              {% set ents = intersect(all_cabs, label_entities(label_slug) or []) | list %}
              {% if not label_exists or ents | count == 0 %}
                {% set ns.miss = ns.miss + [slot] %}
              {% endif %}
            {% endfor %}

            {{ ns.miss | join(', ') if ns.miss else 'none' }}

          #####################################################################
          # INVALID MULTIPLES (REQUIRED ONLY)
          #####################################################################
          invalid_multiples: >-
            {%- import 'zenos_ai/zenos_health.jinja' as HEALTH -%}
            {% set required = HEALTH.slots_required() | from_json() %}
            {% set slot_to_label = HEALTH.slot_to_label() | from_json() %}

            {% set parent_slug = 'Zen Cabinet' | slugify %}
            {% set all_cabs = label_entities(parent_slug) | list %}
            {% set ns = namespace(dupe=[]) %}

            {% for slot in required %}
              {% set label_slug = slot_to_label[slot] | slugify %}
              {% set ents = intersect(all_cabs, label_entities(label_slug) or []) | list %}
              {% if ents | count > 1 %}
                {% set ns.dupe = ns.dupe + [slot] %}
              {% endif %}
            {% endfor %}

            {{ ns.dupe | join(', ') if ns.dupe else 'none' }}

          #####################################################################
          # SLOT ENTITIES (FULL MAP)
          #####################################################################
          slot_entities: >-
            {%- import 'zenos_ai/zenos_health.jinja' as HEALTH -%}
            {% set slots = HEALTH.slots_all() | from_json() %}
            {% set slot_to_label = HEALTH.slot_to_label() | from_json() %}
            {% set all_cabs = label_entities('Zen Cabinet' | slugify) | list %}
            {% set ns = namespace(m={}) %}

            {% for slot in slots %}
              {% set label_slug = slot_to_label[slot] | slugify %}
              {% set ents = intersect(all_cabs, label_entities(label_slug) or []) | list %}
              {% set ns.m = ns.m | combine({ slot: ents }) %}
            {% endfor %}

            {{ ns.m | tojson }}

          #####################################################################
          # RESOLVER SUGGESTIONS (BY SLOT)
          #####################################################################
          resolver_suggestions: >-
            {%- import 'zenos_ai/zenos_health.jinja' as HEALTH -%}
            {% set required      = HEALTH.slots_required() | from_json() %}
            {% set optional      = HEALTH.slots_optional() | from_json() %}
            {% set slot_to_label = HEALTH.slot_to_label() | from_json() %}
            {% set parent_slug   = 'Zen Cabinet' | slugify %}
            {% set all_cabs = label_entities(parent_slug) | list %}
            {% set label_index = labels() %}
            {% set ns = namespace(s={}) %}

            {% for slot in required + optional %}
              {% set label_slug = slot_to_label[slot] | slugify %}
              {% set label_exists = label_slug in label_index %}
              {% set ents = intersect(all_cabs, label_entities(label_slug) or []) | list %}
              {% set bad = ents | selectattr('state','in',['unavailable','unknown']) | list %}

              {% if not label_exists and slot in required %}
                {% set ns.s = ns.s | combine({ slot: "Missing required label: " ~ label_slug }) %}
              {% elif not label_exists and slot in optional %}
                {% set ns.s = ns.s | combine({ slot: "Optional label missing (OK): " ~ label_slug }) %}
              {% elif slot in required and ents | count == 0 %}
                {% set ns.s = ns.s | combine({ slot: "Required label present but no cabinet has it" }) %}
              {% elif slot in required and ents | count > 1 %}
                {% set ns.s = ns.s | combine({ slot: "Multiple cabinets claim this slot: " ~ (ents | join(', ')) }) %}
              {% elif bad | count > 0 %}
                {% set bad_ids = bad | map(attribute='entity_id') | list %}
                {% set ns.s = ns.s | combine({ slot: "Unhealthy cabinet(s): " ~ (bad_ids | join(', ')) }) %}
              {% else %}
                {% set ns.s = ns.s | combine({ slot: "OK" }) %}
              {% endif %}
            {% endfor %}

            {{ ns.s | tojson }}

          #####################################################################
          # CABINET OPERATIONAL STATE (init / online per slot)
          # Computed here — NOT in cabinet sensor state: field.
          # See HALMark FG: this-in-state-trigger-template for why.
          # init   = cabinet exists but AI_Cabinet_VolumeInfo not yet stamped
          # online = stamped and operational
          # absent = no entity with this slot's label
          #####################################################################
          cabinet_states: >-
            {%- import 'zenos_ai/zenos_health.jinja' as HEALTH -%}
            {%- set slots = HEALTH.slots_all() | from_json() -%}
            {%- set slot_to_label = HEALTH.slot_to_label() | from_json() -%}
            {%- set all_cabs = label_entities('Zen Cabinet' | slugify) | list -%}
            {%- set ns = namespace(m={}) -%}
            {%- for slot in slots -%}
              {%- set label_slug = slot_to_label[slot] | slugify -%}
              {%- set ents = intersect(all_cabs, label_entities(label_slug) or []) | list -%}
              {%- if ents | count == 0 -%}
                {%- set ns.m = ns.m | combine({ slot: 'absent' }) -%}
              {%- else -%}
                {%- set eid = (ents | first) -%}
                {%- set ns.m = ns.m | combine({ slot: states(eid) }) -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.m | tojson }}

          #####################################################################
          # SLOT → LABEL MAPPING (single source of truth for Flynn)
          #####################################################################
          slot_to_label: >
            {%- import 'zenos_ai/zenos_health.jinja' as HEALTH -%}
            {{- HEALTH.slot_to_label() | from_json({}) -}}

          #####################################################################
          # SLOT → DEFAULT ENTITY (canonical package entity IDs for Flynn)
          #####################################################################
          slot_to_default_entity: >
            {%- import 'zenos_ai/zenos_health.jinja' as HEALTH -%}
            {{- HEALTH.slot_to_default_entity() | from_json({}) -}}

          #####################################################################
          # SCROLL COUNT — drawers with ro: true across all online_mounted cabs
          # @todo - this code is skipping the drawer.value when trying to read drawer.value.meta
          #####################################################################
          scroll_count: >-
            {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
            {%- set all_cabs = label_entities('Zen Cabinet' | slugify) | list -%}
            {%- set ns = namespace(n=0) -%}
            {%- for eid in all_cabs -%}
              {%- if states(eid) == 'online_mounted' -%}
                {%- set vars = CABS.cabinet_variables(eid) | from_json() -%}
                {%- for key, drawer in vars.items() if key != '_label_index' -%}
                  {%- set entry = drawer if drawer is mapping else {} -%}
                  {%- set mt = entry.get('meta', {}) -%}
                  {%- set mt = mt if mt is mapping else (mt | from_json if mt is string else {}) -%}
                  {%- if mt.get('ro', false) == true -%}
                    {%- set ns.n = ns.n + 1 -%}
                  {%- endif -%}
                {%- endfor -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.n }}

          timestamp: "{{ now().isoformat() }}"
