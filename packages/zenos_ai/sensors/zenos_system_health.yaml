###############################################################################
# ZenOS-AI — System Health Helpers
# Version: 4.5.5
#
# Label and cabinet health sensors migrated to dedicated files:
#   zenos_label_health.yaml   — sensor.zen_label_health
#   zenos_cabinet_health.yaml — sensor.zen_cabinet_health
#
# Remaining:
#   input_text.zenos_selected_cabinet — cabinet slot selection helper
#   select.zenos_cabinet_selector     — UI cabinet slot picker
#   binary_sensor.flynn_system_ready  — true when all 3 health gates green
###############################################################################


input_text:
  zenos_selected_cabinet:
    name: Zenos Selected Cabinet
    icon: mdi:archive
    initial: ""

template:
  - select:
      - name: "ZenOS Cabinet Slot Selector"
        unique_id: zenos_cabinet_selector
        icon: mdi:file-cabinet-multiple

        state: >
          {{ states('input_text.zenos_selected_cabinet') }}

        options: >
          {# Get full cabinet health object #}
          {% set health = state_attr('sensor.zen_cabinet_health', 'slot_entities') | default({}, true) %}
          {% set missing = state_attr('sensor.zen_cabinet_health', 'missing_cabinets') | default([], true) %}
          {% set invalid = state_attr('sensor.zen_cabinet_health', 'invalid_multiples') | default([], true) %}
          {% set unhealthy_opt = state_attr('sensor.zen_cabinet_health', 'unhealthy_opt') | default([], true) %}
          {% set unhealthy_req = state_attr('sensor.zen_cabinet_health', 'unhealthy_req') | default([], true) %}

          {% set opts = [] %}

          {# 1) VALID cabinet slots — exactly one entity & healthy #}
          {% for slot, ents in health.items() %}
            {% if ents | count == 1 %}
              {% set ent = ents[0] %}
              {% if states(ent) not in ['unknown','unavailable', None] %}
                {% set opts = opts + [ent] %}
              {% endif %}
            {% endif %}
          {% endfor %}

          {# 2) EXPOSE missing required slots #}
          {% for slot in missing %}
            {% set opts = opts + ['slot:' ~ slot ~ ' (missing)'] %}
          {% endfor %}

          {# 3) EXPOSE invalid multiples #}
          {% for slot in invalid %}
            {% set opts = opts + ['slot:' ~ slot ~ ' (invalid: multiple)'] %}
          {% endfor %}

          {# 4) EXPOSE unhealthy slots #}
          {% for slot in unhealthy_req + unhealthy_opt %}
            {% set opts = opts + ['slot:' ~ slot ~ ' (unhealthy)'] %}
          {% endfor %}

          {{ opts }}

        select_option:
          - event: custom_template_select
            event_data:
              target: "zen_cabinet_slot"
              value: "{{ option }}"

  ###########################################################################
  # FLYNN SYSTEM READY — derived binary sensor (read-only, not user-editable)
  # True when all three health gates are green, or monastery is warn
  # (degraded-but-functional) or disabled (summarizers intentionally off via
  # zen_summarizers_enabled — orthogonal to system readiness, not a bootstrap
  # condition either).
  # warn = schema ok, agent usable, but summarizer hasn't run yet — not a bootstrap condition.
  ###########################################################################
  - binary_sensor:
      - name: Flynn System Ready
        unique_id: flynn_system_ready
        state: >-
          {%- import 'zenos_ai/zenos_health.jinja' as HEALTH %}
          {%- set _in_warmup = HEALTH.is_warmup() | trim | bool %}
          {%- set mon_st = states('sensor.zen_monastery_health') %}
          {#- BUG FIX (2026-08-01): 'disabled' (summarizers off via the
              zen_summarizers_enabled kill-switch) wasn't in this list, so
              flynn_system_ready could never turn on while summarizers were
              off — permanently, for a reason unrelated to whether the
              agent/identity/household is actually ready. Same conflation as
              Gate 3's monastery_health fix earlier this session: summarizer
              pipeline health is orthogonal to system readiness. -#}
          {%- set mon_ok = mon_st in ['ok', 'warn', 'disabled'] or (mon_st == 'unavailable' and _in_warmup) %}
          {#- BUG FIX (2026-08-01): cabinet_health's 'warn' state is overloaded —
              zen_cabinet_health_state() collapses FOUR distinct conditions into
              one 'warn' value: unassigned_req (a required slot has NO entity
              tagged at all — genuinely not bootstrapped), unhealthy_opt (minor,
              non-blocking), legacy_req (init/Variables state, self-heals), and
              legacy_schema (cosmetic, update available). Only the last three are
              "degraded-but-functional, not a bootstrap condition" as this
              sensor's own doc comment describes. Treating 'warn' as universally
              acceptable meant flynn_system_ready reported 'on' during genuine
              mid-bootstrap (all 7 resolvers unavailable, agents:error,
              no_persona) — a real false-positive readiness signal, found during
              a second full reset+rebuild test. missing_cabinets (already
              computed by this same sensor) is exactly the unassigned_req +
              missing_req list, 'none' when clear — use it to tell the two warn
              cases apart instead of trusting the collapsed enum. #}
          {%- set _cab_st = states('sensor.zen_cabinet_health') %}
          {%- set _cab_missing = state_attr('sensor.zen_cabinet_health', 'missing_cabinets') | default('none', true) %}
          {%- set cab_ok = _cab_st == 'ok' or (_cab_st == 'warn' and _cab_missing == 'none') %}
          {{ states('sensor.zen_label_health') == 'ok'
             and cab_ok
             and mon_ok }}
        icon: "{{ 'mdi:check-circle' if is_state('binary_sensor.flynn_system_ready', 'on') else 'mdi:alert-circle' }}"
