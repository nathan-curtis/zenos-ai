automation:
- alias: Zen DojoTools Volume Redirector
  id: zen_dojotools_volume_redirector
  description: >
    DojoTools Volume Redirector — ZENOS Edition (v4.5.x)
    Clean switchboard redirector for canonical Ring-0 ZENOS cabinets only.
    No legacy handling. No cross-namespace routing. Strict ZENOS core volumes.

  mode: queued
  max: 40

  triggers:
    - trigger: event
      event_type: set_variable_legacy
      id: set
    - trigger: event
      event_type: remove_variable_legacy
      id: remove
    - trigger: event
      event_type: clear_variables_legacy
      id: clear
    - trigger: event
      event_type: dojo_volume_redirector_probe
      id: probe

  conditions: []

  actions:
    - variables:
        # ========================================================
        # CANONICAL RING-0 ZENOS CABINETS ONLY
        # ========================================================

        # SYSTEM (6)
        vol_system: sensor.zenos_system_cabinet
        vol_system_history: sensor.zenos_system_history_cabinet
        vol_dojo: sensor.zenos_dojo_cabinet
        vol_kata: sensor.zenos_kata_cabinet
        vol_history: sensor.zenos_history_cabinet
        vol_scratch: sensor.zenos_scratchpad_cabinet

        # DEFAULT HOUSEHOLD (2)
        vol_household: sensor.zenos_default_household_cabinet
        vol_household_history: sensor.zenos_default_household_history_cabinet

        # DEFAULT FAMILY (2)
        vol_family: sensor.zenos_default_family_cabinet
        vol_family_history: sensor.zenos_default_family_history_cabinet

        # DEFAULT USER (2)
        vol_user: sensor.zenos_default_user_cabinet
        vol_user_history: sensor.zenos_default_user_history_cabinet

        # DEFAULT AI USER (2)
        vol_ai_user: sensor.zenos_default_ai_user_cabinet
        vol_ai_user_history: sensor.zenos_default_ai_user_history_cabinet

        # EXPANSION CABINETS (6)
        vol_expansion_1: sensor.zenos_expansion_cabinet_1
        vol_expansion_2: sensor.zenos_expansion_cabinet_2
        vol_expansion_3: sensor.zenos_expansion_cabinet_3
        vol_expansion_4: sensor.zenos_expansion_cabinet_4
        vol_expansion_5: sensor.zenos_expansion_cabinet_5
        vol_vault: sensor.zenos_vault_cabinet

        # RECOGNIZED RING-0 ZENOS VOLUMES
        recognized_volumes: |
          {{
            [
              vol_system,
              vol_system_history,
              vol_dojo,
              vol_kata,
              vol_history,
              vol_scratch,
              vol_household,
              vol_household_history,
              vol_family,
              vol_family_history,
              vol_user,
              vol_user_history,
              vol_ai_user,
              vol_ai_user_history,
              vol_expansion_1,
              vol_expansion_2,
              vol_expansion_3,
              vol_expansion_4,
              vol_expansion_5,
              vol_vault
            ]
          }}

        # Manifest / metadata access
        manifest_key: zen_library_manifest
        manifest_entity: sensor.zenos_default_household_cabinet
        manifest_data: >
          {% set vars = state_attr(manifest_entity, 'variables') | default({}, true) %}
          {% set slot = vars.get(manifest_key, {}) if vars is mapping else {} %}
          {{ slot.get('value', {}) if slot is mapping else {} }}

        # Incoming event data
        event_type: "{{ trigger.event.event_type }}"
        key: "{{ trigger.event.data.key | default('') }}"
        value: "{{ trigger.event.data.value | default('') }}"
        volume_entity: "{{ trigger.event.data.volume_entity | default('') }}"
        set_timestamp: "{{ trigger.event.data.set_timestamp | default(false) }}"
        force: "{{ trigger.event.data.get('force', false) }}"
        log_events: "{{ trigger.event.data.log_events | default(false) }}"
        is_cabinetadmin_init: "{{ trigger.event.data._cabinetadmin_init | default(false) }}"

        # Manifest → volume entry
        manifest_volume_entry: >
          {% set _md0 = manifest_data if manifest_data is mapping else (manifest_data | from_json(none) if manifest_data is string else none) %}
          {% set md = _md0 if _md0 is mapping else {} %}
          {% set _e0 = md.get(volume_entity | string, {}) %}
          {% set entry = _e0 if _e0 is mapping else ((_e0 | from_json(none)) if _e0 is string else none) %}
          {{ entry if entry is mapping else {} }}

        manifest_metadata: >
          {% set _mve0 = manifest_volume_entry if manifest_volume_entry is mapping else (manifest_volume_entry | from_json(none) if manifest_volume_entry is string else none) %}
          {% set mve = _mve0 if _mve0 is mapping else {} %}
          {% set _mm0 = mve.get('metadata', {}) %}
          {{ _mm0 if _mm0 is mapping else {} }}
        manifest_flags: >
          {% set _mm0 = manifest_metadata if manifest_metadata is mapping else (manifest_metadata | from_json(none) if manifest_metadata is string else none) %}
          {% set mm = _mm0 if _mm0 is mapping else {} %}
          {% set _f0 = mm.get('flags', {}) %}
          {{ _f0 if _f0 is mapping else {} }}
        manifest_guid: >
          {% set _mm0 = manifest_metadata if manifest_metadata is mapping else (manifest_metadata | from_json(none) if manifest_metadata is string else none) %}
          {% set mm = _mm0 if _mm0 is mapping else {} %}
          {% set _id = mm.get('id', '') %}
          {{- _id if _id else '' -}}

        # Cabinet → info
        cabinet_info: >
          {% set vars = state_attr(volume_entity, 'variables') | default({}, true) %}
          {% set entry = vars.get('AI_Cabinet_VolumeInfo', {}) if vars is mapping else {} %}
          {{ entry if entry is mapping else {} }}

        cabinet_info_value: >
          {% set _val0 = cabinet_info.get('value', {}) if cabinet_info is mapping else {} %}
          {% set _val1 = _val0 if _val0 is mapping else (_val0 | from_json(none) if _val0 is string else none) %}
          {{ _val1 if _val1 is mapping else {} }}
        cabinet_guid: >
          {% set _civ0 = cabinet_info_value if cabinet_info_value is mapping else (cabinet_info_value | from_json(none) if cabinet_info_value is string else none) %}
          {% set civ = _civ0 if _civ0 is mapping else {} %}
          {% set _id = civ.get('id', '') %}
          {{- _id if _id else '' -}}

        guid_mismatch: "{{ manifest_guid and cabinet_guid and (manifest_guid != cabinet_guid) }}"

        # Canonical fallback-friendly name mapping
        canonical_volume_name: >
          {% set fn = (state_attr(volume_entity, 'friendly_name') | default('', true)) | string %}
          {% if fn|lower not in ['unknown','unavailable','none','null',''] %}
            {{ fn }}
          {% else %}
            {{ volume_entity | replace('sensor.','') }}
          {% endif %}

        routing_status: pending
        routing_action: none
        routed_volume: "{{ volume_entity }}"

    # -------------------------------------------------------------
    # Optional logging
    # -------------------------------------------------------------
    - alias: Log?
      if:
        - condition: template
          value_template: "{{ log_events }}"
      then:
        - action: logbook.log
          data:
            name: "{{ event_type }}"
            message: >
              {{ key | default('-') }}
              {% if event_type == 'set_variable_legacy' %}
                : {{ value | default('not defined!') }}
              {% endif %}

    # -------------------------------------------------------------
    # PROBE HANDLER
    # -------------------------------------------------------------
    - alias: Handle probe
      choose:
        - conditions:
            - condition: trigger
              id: probe
          sequence:
            - event: dojo_volume_redirector_probe_result
              event_data:
                status: >
                  {% if volume_entity and volume_entity in recognized_volumes %}
                    {% if guid_mismatch %}warning{% else %}ready{% endif %}
                  {% else %}
                    error
                  {% endif %}
                volume_entity: "{{ volume_entity }}"
                volume_name: "{{ canonical_volume_name }}"
                key: "{{ key }}"
                manifest_entry_found: "{{ manifest_volume_entry != {} }}"
                recognized_volume: "{{ volume_entity in recognized_volumes }}"
                manifest_guid: "{{ manifest_guid }}"
                cabinet_guid: "{{ cabinet_guid }}"
                guid_mismatch: "{{ guid_mismatch }}"
                failure_reason: >
                  {% if not volume_entity %}missing_volume_entity
                  {% elif volume_entity not in recognized_volumes %}volume_not_recognized
                  {% elif manifest_volume_entry == {} %}volume_missing_from_manifest
                  {% elif guid_mismatch %}guid_mismatch
                  {% else %}ok{% endif %}
            - stop: Probe Finished

    # -------------------------------------------------------------
    # VALIDATION (unchanged)
    # -------------------------------------------------------------
    - alias: Validate
      choose:
        - conditions:
            - condition: template
              value_template: "{{ volume_entity | trim == '' }}"
          sequence:
            - event: dojo_volume_redirector_result
              event_data:
                status: error
                failure: missing_volume_entity
                volume_entity: "{{ volume_entity }}"
                volume_name: "{{ canonical_volume_name }}"
                event_type: "{{ event_type }}"
                key: "{{ key }}"
            - stop: Validation Failed

        - conditions:
            - condition: template
              value_template: "{{ volume_entity not in recognized_volumes }}"
          sequence:
            - event: dojo_volume_redirector_result
              event_data:
                status: error
                failure: volume_not_recognized
                volume_entity: "{{ volume_entity }}"
                volume_name: "{{ canonical_volume_name }}"
                event_type: "{{ event_type }}"
                key: "{{ key }}"
            - stop: Validation Failed

        - conditions:
            - condition: template
              value_template: "{{ manifest_volume_entry == {} and not is_cabinetadmin_init }}"
          sequence:
            - event: dojo_volume_redirector_result
              event_data:
                status: warning
                failure: volume_missing_from_manifest
                note: Manifest not yet populated — allowing write during bootstrap.
                volume_entity: "{{ volume_entity }}"
                volume_name: "{{ canonical_volume_name }}"
                event_type: "{{ event_type }}"
                manifest_guid: "{{ manifest_guid }}"
                key: "{{ key }}"

        - conditions:
            - condition: template
              value_template: "{{ event_type in ['set_variable_legacy','remove_variable_legacy'] }}"
            - condition: template
              value_template: "{{ key | trim == '' }}"
          sequence:
            - event: dojo_volume_redirector_result
              event_data:
                status: error
                failure: missing_key
                event_type: "{{ event_type }}"
                volume_entity: "{{ volume_entity }}"
                volume_name: "{{ canonical_volume_name }}"
            - stop: Validation Failed

