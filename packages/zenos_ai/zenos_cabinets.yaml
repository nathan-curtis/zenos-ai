###############################################################################
#  ZENOS-AI — RING-0 CABINET PACKAGE
#  File: zenos_cabinets.yaml
#  Version: 5.1.0
#
#  20 canonical Ring-0 Cabinets for ZenOS-AI.
#  14 core cabinets + 6 expansion slots (v4.3.0 cabset + v4.5.1 rename/add).
#  - Fully depersonalized
#  - zenos_ namespace
#  - Deterministic unique_ids
#  - Attribute write guard: blocks set_variable if proposed JSON exceeds
#    131,072 bytes. remove_variable and clear_variables always execute.
#
#  CHANGELOG
#  v4.5.2  2026-03-23  BOOT WIPE FIX. Three changes applied to all 20 cabinets:
#                      (1) Boot guard: action block stops on current is none (recorder
#                      race). Invariant: none=unknown→block, {}=empty→allow. Break-
#                      glass: force:true in event data bypasses (admin/recovery only).
#                      (2) variables attributes template: default {} → none + guard
#                      outputs none at boot for two-layer protection.
#                      (3) clear_variables requires confirm:true. Unconfirmed clears
#                      silently dropped. Also: Volume Redirector auto-init block
#                      REMOVED. No automatic cabinet resets under any conditions.
#                      See: bug_cabinet_boot_wipe_regression_2026-03-23.md
#  v4.5.1  2026-03-22  Startup re-evaluation fix. All 20 cabinet sensors now
#                      listen for zen_event kind: cabinet_boot_touch (fired by
#                      scheduler on ha_start). Forces state re-derivation on
#                      reload so pre-RP2 cabs with no meta drawer correctly
#                      surface online_mounted without waiting for a write event.
#  v4.5.0  2026-03-22  Mount-aware state machine (#97). Cabinet sensor state:
#                      now emits init / online_mounted / online_unmounted
#                      (was: init / online). Truth is meta.mounted in cabinet
#                      variables. FG-38 guard on meta value. Health sensor
#                      cabinet_states reads states() directly — no more
#                      state_attr() recompute.
#  v4.3.0  2026-03-20  Expansion cabinets (5): secondary_user,
#                      tertiary_user, quaternary_user, secondary_ai_user,
#                      vault. Volume Redirector recognized_volumes updated.
#  v4.5.1  2026-03-23  Rename expansion slots: secondary/tertiary/quaternary_user +
#                      secondary_ai_user → expansion_1-4. Add expansion_5.
#                      State template sync fix (one-write-behind bug, all 20 cabs).
#                      Redirector routes expansion_1-5; recognized_volumes updated.
#                      Vault: mdi:safe-square icon, no resolver by design.
#  v1.2.0  2026-03-11  CANONICAL NAMING FIX — unique_ids, event types, and all
#                      entity ID references for Dojo, Kata, History, and
#                      Scratchpad cabinets corrected to match display names
#                      (zenos_dojo_cabinet, not zenos_zen_dojo_cabinet).
#                      BREAKING for installs that completed Flynn gate-3 on the
#                      old IDs — revert to pre-cabinet-rename-fix tag if needed.
#                      This is the canonical naming going forward.
#  v1.1.0  2026-02-28  Restored attribute size guard on all 14 cabinet write
#                      paths (ref FG-21). Blocked writes log a clear error via
#                      logbook. remove/clear always pass through.
#  v1.0.0  (baseline)  14-cabinet package. No write guard.
###############################################################################

template:

  ###########################################################################
  # 1. SYSTEM CABINETS (6)
  ###########################################################################

  - trigger:
      - trigger: event
        event_type: set_variable_zenos_system_cabinet
        id: sensor.zenos_system_cabinet
      - trigger: event
        event_type: remove_variable_zenos_system_cabinet
        id: sensor.zenos_system_cabinet
      - trigger: event
        event_type: clear_variables_zenos_system_cabinet
        id: sensor.zenos_system_cabinet
    action:
      - variables:
          this_entity_id: "{{- trigger.id -}}"
          log_events: "{{- state_attr(this_entity_id, 'log_events') -}}"
          log_enabled: "{{- (log_events is none) or (log_events==true) -}}"
          # BOOT-SAFE: state_attr() + default(none, true) — NOT this.attributes.get().
          # 'this' is undefined in action: variables of trigger-based template sensors
          # (TemplateError: UndefinedError crashes every trigger silently).
          # default(none) — NOT default(none, true). boolean=True catches {} (falsy)
          # which conflates "unknown at boot" with "known empty". default(none) only
          # catches Jinja2 Undefined; None passes through as None. {} stays as {}.
          # none = unknown at boot (block). {} = known empty (allow). {...} = allow.
          # See: FG this_in_trigger_sensor_action, incident 2026-03-23.
          current: >-
            {{- state_attr(this_entity_id, 'variables') | default(none) -}}
      # ── BOOT GUARD ────────────────────────────────────────────────────────────
      # current is none = recorder has not yet restored this cabinet's state.
      # We do not know what is in it. NEVER write into unknown state.
      # Blocks all writes: set_variable, remove_variable, clear_variables.
      # Invariant: none = unknown (block). {} = known empty (allow). {...} = allow.
      # Break-glass: pass force: true in event data to bypass (admin/recovery only).
      # See: boot wipe incident 2026-03-23, bug_cabinet_boot_wipe_regression.md
      - if: "{{ current is none and not trigger.event.data.get('force', false) }}"
        then:
          - stop: "Boot guard — state unconfirmed, all writes suppressed"
      # ──────────────────────────────────────────────────────────────────────────
      - if: "{{ log_enabled }}"
        then:
          - action: logbook.log
            data:
              name: "{{ trigger.event.event_type }}"
              message: >
                {{ trigger.event.data.key | default('-') }}
                {% if trigger.event.event_type.startswith('set_variable') -%}
                  : {{ trigger.event.data.value | default('not defined!') }}
                {%- endif %}
              entity_id: "{{- this_entity_id -}}"
              domain: sensor
      - if:
          condition: template
          value_template: >
            {#-{% set current = this.attributes.get('variables', {}) %}-#}
            {% set evt = trigger.event.event_type %}
            {% set key = trigger.event.data.key %}
            {% set val = trigger.event.data.value %}
            {% if evt.startswith('set_variable') and key is defined and val is defined %}
              {% set value = val.isoformat() if val is datetime else val %}
              {% set use_ts = trigger.event.data.get('set_timestamp', state_attr(this_entity_id, 'default_timestamp') | default(false)) %}
              {% if use_ts %}
                {% set new = { key: { 'value': value, 'timestamp': now().isoformat() } } %}
              {% else %}
                {% set new = { key: {'value': value} } %}
              {% endif %}
              {{ dict(current, **new) | tojson | length > 131072 }}
            {% else %}
              false
            {% endif %}
        then:
          - action: logbook.log
            data:
              name: "{{ state_attr(this_entity_id, 'friendly_name') | default('Cabinet') }} — WRITE BLOCKED"
              message: >
                Cabinet full ({{ current | tojson | length }}/131072 bytes).
                Key '{{ trigger.event.data.key }}' was NOT written.
                Delete or move keys out before writing more.
              entity_id: "{{- this_entity_id -}}"
              domain: sensor
    sensor:
      - name: "ZenOS System Cabinet"
        unique_id: zenos_system_cabinet
        icon: mdi:file-cabinet
        state: >-
          {%- set current = current if current is mapping else {} -%}
          {%- set _sevt = trigger.event.event_type if trigger.platform == 'event' else '' -%}
          {%- set _sk = trigger.event.data.key | default('') if trigger.platform == 'event' else '' -%}
          {%- set _sv = trigger.event.data.value | default(none) if trigger.platform == 'event' else none -%}
          {%- set _sts = trigger.event.data.get('set_timestamp', this.attributes.get('default_timestamp', false)) if trigger.platform == 'event' else false -%}
          {%- if _sevt.startswith('set_variable') and _sk and _sv is not none -%}
            {%- set _svf = _sv.isoformat() if _sv is datetime else _sv -%}
            {%- set _snew = {_sk: {'value': _svf, 'timestamp': now().isoformat()}} if _sts else {_sk: {'value': _svf}} -%}
            {%- set _eff = dict(current, **_snew) -%}
          {%- elif _sevt.startswith('remove_variable') and _sk -%}
            {%- set _eff = dict(current.items() | rejectattr('0', 'eq', _sk)) -%}
          {%- elif _sevt.startswith('clear_variables') and trigger.event.data.get('confirm') == true -%}
            {%- set _eff = {} -%}
          {%- else -%}
            {%- set _eff = current -%}
          {%- endif -%}
          {%- set _vi = _eff is mapping and 'AI_Cabinet_VolumeInfo' in _eff -%}
          {%- set _mr = _eff.get('meta', {}) if _eff is mapping else {} -%}
          {%- set _mraw = _mr if _mr is mapping else (_mr | from_json if _mr is string else {}) -%}
          {%- set _mv = _mraw.get('value', _mraw) if _mraw is mapping else {} -%}
          {%- set _m = _mv if _mv is mapping else (_mv | from_json if _mv is string else {}) -%}
          {%- if not _vi -%}init{%- elif _m.get('mounted', true) != false -%}online_mounted{%- else -%}online_unmounted{%- endif -%}
        attributes:
          default_timestamp: true
          log_events: false
          variables: >
            {% set current = this.attributes.get('variables', none) %}
            {% if current is none and not trigger.event.data.get('force', false) %}
              {{ none }}
            {% else %}
            {% set current = current if current is mapping else {} %}
            {% set evt = trigger.event.event_type %}
            {% set key = trigger.event.data.key %}
            {% set val = trigger.event.data.value %}
            {% set use_ts = trigger.event.data.get('set_timestamp', this.attributes.get('default_timestamp', false)) %}
            {% if evt.startswith('set_variable') and key is defined and val is defined %}
              {% set value = val.isoformat() if val is datetime else val %}
              {% if use_ts %}
                {% set new = { key: { 'value': value, 'timestamp': now().isoformat() } } %}
              {% else %}
                {% set new = { key: {'value': value} } %}
              {% endif %}
              {% set proposed = dict(current, **new) %}
              {{ current if proposed | tojson | length > 131072 else proposed }}
            {% elif evt.startswith('remove_variable') and key is defined %}
              {{ dict(current.items() | rejectattr('0', 'eq', key)) }}
            {% elif evt.startswith('clear_variables') and trigger.event.data.get('confirm') == true %}
              {{ {} }}
            {% else %}
              {{ current }}
            {% endif %}
            {% endif %}

