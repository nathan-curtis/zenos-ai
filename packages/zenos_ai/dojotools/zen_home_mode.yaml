###############################################################################
# ZenOS-AI — Home Mode
# Version 5.1.0
#
# Defines the home mode state machine and all dependent constructs.
# Replaces externally-defined legacy helpers on migration.
#
# Helpers:
#   input_select.zen_home_mode       — 8-state home mode selector
#   input_boolean.zen_guest_mode     — guest presence flag
#   input_boolean.zen_entertaining   — entertaining/hosting flag
#   input_datetime.zen_*_start       — 6 schedule anchors + 4 quiet/work bounds
#
# Sensors:
#   sensor.zen_home_mode             — mirror with per-state icons
#   binary_sensor.zen_quiet_hours    — time-range, midnight-wrap safe, fail-open
#   binary_sensor.zen_work_hours     — time-range, no wrap, fail-open
#
# Scripts:
#   zen_hm_evaluate_window           — single source of truth for window logic
#   zen_home_mode_release            — exits Away or Paused → correct scheduled state
#
# Automations:
#   zen_hm_schedule                  — fires at each anchor, delegates to evaluate_window
#   zen_hm_away                      — zone.home → 0 triggers Away
#   zen_hm_presence_return           — zone.home > 0 from Away calls release
#   zen_hm_init                      — HA start/restart evaluates window
#
# Migration: ships parallel to legacy helpers. Legacy retirement is manual
# on the live install after cutover sweep (PR 2).
#
# Labels:
#   zen_vacation_mode — apply to your calendar entity; resolved by label,
#                       not hardcoded.
###############################################################################


###############################################################################
# HELPERS
###############################################################################

input_select:

  zen_home_mode:
    name: "Zen Home Mode"
    icon: mdi:home-assistant
    options:
      - Home-Wake
      - Home-Morning
      - Home
      - Home-Evening
      - Night
      - Night-Late
      - Away
      - Paused
    initial: Home


input_boolean:

  zen_guest_mode:
    name: "Zen Guest Mode"
    icon: mdi:account-circle-outline

  zen_entertaining:
    name: "Zen Entertaining"
    icon: mdi:glass-cocktail

  zen_vacation_wake_shift_enabled:
    name: "Zen Vacation Wake Shift"
    icon: mdi:clock-plus-outline


input_datetime:

  ###########################################################################
  # SCHEDULE ANCHORS — drive the 6 time-based mode transitions
  ###########################################################################
  zen_am_start:
    name: "Zen Wake Start"
    icon: mdi:weather-sunset-up
    has_time: true
    has_date: false

  zen_morning_start:
    name: "Zen Morning Start"
    icon: mdi:coffee-outline
    has_time: true
    has_date: false

  zen_daytime_start:
    name: "Zen Daytime Start"
    icon: mdi:weather-sunny
    has_time: true
    has_date: false

  zen_evening_start:
    name: "Zen Evening Start"
    icon: mdi:weather-sunset-down
    has_time: true
    has_date: false

  zen_night_start:
    name: "Zen Night Start"
    icon: mdi:weather-night
    has_time: true
    has_date: false

  zen_late_night_start:
    name: "Zen Night-Late Start"
    icon: mdi:power-sleep
    has_time: true
    has_date: false

  ###########################################################################
  # MEAL TIME DEFAULTS — NOT part of the 6 schedule anchors above. These
  # drive zen_dojotools_kitchen prep_brief / zen_dojotools_taskmaster almanac
  # default serving-time math only — they do not feed input_select.zen_home_mode
  # or any of its transition logic, and are deliberately excluded from
  # scheduler_anchors get/set (that setter's ascending-order guard is scoped
  # to the 6 home-mode anchors specifically). Override directly via
  # Developer Tools > States or a dashboard — no dedicated tool needed.
  # Breakfast/dinner don't need an entry here — they derive from
  # zen_morning_start / zen_evening_start above. No initial: — this codebase's
  # own convention avoids it on input_* helpers (it silently resets on every
  # restart, clobbering any override). NOTE: input_datetime has no true
  # "unset" state — a fresh helper reports a concrete 00:00:00, not
  # unknown/unavailable, so prep_brief/almanac's unset-fallback logic is
  # effectively unreachable here. Seeded once to 12:00/15:00 via
  # zen_dojotools_datetime on creation (2026-07-26) — a real, persistent
  # value, not a YAML default. Override the same way, or via Developer
  # Tools > States.
  ###########################################################################
  zen_lunch_time:
    name: "Zen Lunch Time"
    icon: mdi:food-turkey
    has_time: true
    has_date: false

  zen_snack_time:
    name: "Zen Snack Time"
    icon: mdi:food-apple-outline
    has_time: true
    has_date: false

  ###########################################################################
  # QUIET / WORK PERIOD BOUNDARIES
  # Defaults: quiet 23:00-06:00 (midnight wrap), work 09:00-17:00 (no wrap)
  ###########################################################################
  zen_quiet_hours_start:
    name: "Zen Quiet Hours Start"
    icon: mdi:home-clock-outline
    has_time: true
    has_date: false

  zen_quiet_hours_end:
    name: "Zen Quiet Hours End"
    icon: mdi:home-clock-outline
    has_time: true
    has_date: false

  zen_work_hours_start:
    name: "Zen Work Hours Start"
    icon: mdi:briefcase
    has_time: true
    has_date: false

  zen_work_hours_end:
    name: "Zen Work Hours End"
    icon: mdi:briefcase
    has_time: true
    has_date: false


###############################################################################
# TEMPLATE SENSORS
###############################################################################

template:

  ###########################################################################
  # HOME MODE MIRROR — state + per-state icon
  ###########################################################################
  - sensor:
      - name: "Zen Home Mode"
        unique_id: zen_home_mode_sensor
        state: "{{ states('input_select.zen_home_mode') }}"
        icon: >-
          {%- set m = states('input_select.zen_home_mode') %}
          {%- if m == 'Home-Wake' %}    mdi:theme-light-dark
          {%- elif m == 'Home-Morning' %}mdi:weather-sunset-up
          {%- elif m == 'Home' %}        mdi:home
          {%- elif m == 'Home-Evening' %}mdi:weather-sunset-down
          {%- elif m == 'Night' %}       mdi:weather-night
          {%- elif m == 'Night-Late' %}  mdi:power-sleep
          {%- elif m == 'Away' %}        mdi:home-export-outline
          {%- elif m == 'Paused' %}      mdi:pause-circle-outline
          {%- else %}                    mdi:home-assistant
          {%- endif %}

  ###########################################################################
  # QUIET HOURS
  # Defaults: 23:00 – 06:00 (crosses midnight).
  # Fail-open: resolves false if either anchor is unavailable/unset.
  # Midnight wrap: when end < start the active window spans midnight,
  #   so the sensor is ON if now >= start OR now < end.
  ###########################################################################
  - binary_sensor:
      - name: "Zen Quiet Hours"
        unique_id: zen_quiet_hours
        state: >-
          {%- set start = states('input_datetime.zen_quiet_hours_start') %}
          {%- set end   = states('input_datetime.zen_quiet_hours_end') %}
          {%- if start in ['unknown','unavailable',''] or end in ['unknown','unavailable',''] %}
            false
          {%- else %}
            {%- set now_t = now().strftime('%H:%M:%S') %}
            {# Midnight wrap: end < start means range crosses midnight.        #}
            {# e.g. 23:00–06:00 → active when now >= 23:00 OR now < 06:00.    #}
            {%- if end < start %}
              {{ now_t >= start or now_t < end }}
            {%- else %}
              {{ now_t >= start and now_t < end }}
            {%- endif %}
          {%- endif %}
        icon: "{{ 'mdi:sleep' if this.state == 'on' else 'mdi:sleep-off' }}"

      ###########################################################################
      # WORK HOURS
      # Defaults: 09:00 – 17:00 (no midnight wrap).
      # Fail-open: resolves false if either anchor is unavailable/unset.
      ###########################################################################
      - name: "Zen Work Hours"
        unique_id: zen_work_hours
        state: >-
          {%- set start = states('input_datetime.zen_work_hours_start') %}
          {%- set end   = states('input_datetime.zen_work_hours_end') %}
          {%- if start in ['unknown','unavailable',''] or end in ['unknown','unavailable',''] %}
            false
          {%- else %}
            {%- set now_t = now().strftime('%H:%M:%S') %}
            {# No midnight wrap for work hours (end > start by design).        #}
            {# If someone configures a wrap here it will behave unexpectedly — #}
            {# use zen_quiet_hours pattern if a wrap is ever needed.           #}
            {{ now_t >= start and now_t < end }}
          {%- endif %}
        icon: "{{ 'mdi:briefcase' if this.state == 'on' else 'mdi:briefcase-outline' }}"


###############################################################################
# SCRIPTS
###############################################################################

script:

  ###########################################################################
  # ZEN HM EVALUATE WINDOW
  # Single source of truth for time-window → mode mapping.
  # Called by: zen_hm_init, zen_home_mode_resume, zen_home_mode_unpause.
  # Do NOT duplicate this logic elsewhere.
  ###########################################################################
  zen_hm_evaluate_window:
    alias: "Zen Home Mode: Evaluate Window"
    mode: single
    sequence:
      # -- Anchor sanity check ------------------------------------------------
      # scheduler_anchors (the sanctioned setter) already rejects any write
      # that breaks ascending order. This guards the case where anchors were
      # set another way (e.g. direct edit of the input_datetime helpers in
      # HA UI) and slipped past that validation. If broken, fall back to
      # known-good defaults for THIS evaluation only (does not touch the
      # helpers) and emit a warning event — never silently misassign mode.
      - variables:
          _hm_am:         "{{ states('input_datetime.zen_am_start') }}"
          _hm_morning:    "{{ states('input_datetime.zen_morning_start') }}"
          _hm_daytime:    "{{ states('input_datetime.zen_daytime_start') }}"
          _hm_evening:    "{{ states('input_datetime.zen_evening_start') }}"
          _hm_night:      "{{ states('input_datetime.zen_night_start') }}"
          _hm_late_night: "{{ states('input_datetime.zen_late_night_start') }}"
      - variables:
          _hm_anchors_raw: ["{{ _hm_am }}", "{{ _hm_morning }}", "{{ _hm_daytime }}", "{{ _hm_evening }}", "{{ _hm_night }}", "{{ _hm_late_night }}"]
          _hm_anchor_names: ['wake', 'morning', 'daytime', 'evening', 'night', 'late_night']
      - variables:
          _hm_anchors_valid: >-
            {{ _hm_anchors_raw | select('in', ['unknown', 'unavailable', '']) | list | length == 0
               and _hm_anchors_raw == (_hm_anchors_raw | sort) }}
      - if:
          - condition: template
            value_template: "{{ not _hm_anchors_valid }}"
        then:
          - action: script.zen_dojotools_event_emitter
            continue_on_error: true
            data:
              mode: emit
              component: home_mode
              severity: warning
              kind: home_mode_anchor_misconfigured
              summary: "Home mode anchors are out of ascending order or unavailable — falling back to default schedule. Use scheduler_anchors to fix (never edit the input_datetime helpers directly)."
              metadata:
                anchor_names: "{{ _hm_anchor_names }}"
                anchor_values: "{{ _hm_anchors_raw }}"
          - variables:
              _hm_am: "06:00:00"
              _hm_morning: "08:00:00"
              _hm_daytime: "10:00:00"
              _hm_evening: "17:00:00"
              _hm_night: "21:00:00"
              _hm_late_night: "23:00:00"
      # -- Vacation shift: wake/morning/daytime anchors slide while a
      # zen_vacation_mode-labeled calendar is active. Parity-matched against
      # the real legacy NR "Vacation Mode Modifier" group (traced via
      # flows.json 2026-08-30) -- NOT a uniform +1h across two anchors as
      # first guessed: wake +1h, morning +2h, daytime +1h. Evening/night/
      # late_night untouched in the legacy flow too, so left alone here.
      # First real wiring of the zen_vacation_mode label (header comment has
      # documented it since this file's original version; never actually
      # referenced in code until now). --
      - variables:
          _hm_vacation_active: >-
            {{ is_state('input_boolean.zen_vacation_wake_shift_enabled', 'on')
               and (label_entities('zen_vacation_mode') | select('match', 'calendar\\.') | map('states') | select('equalto', 'on') | list | count) > 0 }}
      - variables:
          _hm_am:      "{{ (strptime(_hm_am, '%H:%M:%S') + timedelta(hours=1)).strftime('%H:%M:%S') if _hm_vacation_active else _hm_am }}"
          _hm_morning: "{{ (strptime(_hm_morning, '%H:%M:%S') + timedelta(hours=2)).strftime('%H:%M:%S') if _hm_vacation_active else _hm_morning }}"
          _hm_daytime: "{{ (strptime(_hm_daytime, '%H:%M:%S') + timedelta(hours=1)).strftime('%H:%M:%S') if _hm_vacation_active else _hm_daytime }}"
      - variables:
          target_mode: >-
            {%- set now_t      = now().strftime('%H:%M:%S') %}
            {%- set am         = _hm_am %}
            {%- set morning    = _hm_morning %}
            {%- set daytime    = _hm_daytime %}
            {%- set evening    = _hm_evening %}
            {%- set night      = _hm_night %}
            {%- set late_night = _hm_late_night %}
            {%- if now_t < am %}
              Night-Late
            {%- elif now_t < morning %}
              Home-Wake
            {%- elif now_t < daytime %}
              Home-Morning
            {%- elif now_t < evening %}
              Home
            {%- elif now_t < night %}
              Home-Evening
            {%- elif now_t < late_night %}
              Night
            {%- else %}
              Night-Late
            {%- endif %}
      - action: input_select.select_option
        target:
          entity_id: input_select.zen_home_mode
        data:
          option: "{{ target_mode | trim }}"

  ###########################################################################
  # ZEN HOME MODE RELEASE — exit Away or Paused
  # Single exit path for both hold states → evaluates window → scheduled state
  ###########################################################################
  zen_home_mode_release:
    alias: "Zen Home Mode: Release Hold"
    mode: single
    sequence:
      - condition: template
        value_template: "{{ states('input_select.zen_home_mode') in ['Away', 'Paused'] }}"
      - action: script.zen_hm_evaluate_window
        data: {}


###############################################################################
# AUTOMATIONS
###############################################################################

automation:

  ###########################################################################
  # TIME-BASED TRANSITIONS
  # Fires at each schedule anchor — delegates to zen_hm_evaluate_window.
  # Guarded: will not fire if Away or Paused.
  ###########################################################################
  - id: zen_hm_schedule
    alias: "Zen Home Mode: Schedule"
    triggers:
      - trigger: time
        at: input_datetime.zen_am_start
      - trigger: time
        at: input_datetime.zen_morning_start
      - trigger: time
        at: input_datetime.zen_daytime_start
      - trigger: time
        at: input_datetime.zen_evening_start
      - trigger: time
        at: input_datetime.zen_night_start
      - trigger: time
        at: input_datetime.zen_late_night_start
      # 2026-08-30: the shifted wake/morning anchors above are a Jinja-only
      # shift inside evaluate_window -- the static `at:` triggers here still
      # fire at the UNSHIFTED helper times. Without this, the actual mode
      # transition would only land whenever the NEXT real anchor happened to
      # fire, not within a minute of the true shifted target. 5-min poll
      # closes that gap at effectively the same precision the rest of this
      # scheduler already runs at -- harmless/idempotent when vacation mode
      # is off (evaluate_window computes an unshifted target_mode, same as
      # today, select_option no-ops if already selected).
      - trigger: time_pattern
        minutes: /5
        id: vacation_recheck
    condition:
      - condition: template
        value_template: "{{ states('input_select.zen_home_mode') not in ['Away', 'Paused'] }}"
    action:
      - action: script.zen_hm_evaluate_window
        data: {}

  ###########################################################################
  # AWAY — zone.home drops to 0
  ###########################################################################
  - id: zen_hm_away
    alias: "Zen Home Mode: Away"
    trigger:
      - trigger: numeric_state
        entity_id: zone.home
        below: 1
    condition:
      - condition: template
        value_template: "{{ states('input_select.zen_home_mode') not in ['Away', 'Paused'] }}"
    action:
      - action: input_select.select_option
        target:
          entity_id: input_select.zen_home_mode
        data:
          option: Away

  ###########################################################################
  # PRESENCE RETURN — zone.home rises above 0 while Away
  ###########################################################################
  - id: zen_hm_presence_return
    alias: "Zen Home Mode: Presence Return"
    trigger:
      - trigger: numeric_state
        entity_id: zone.home
        above: 0
    condition:
      - condition: state
        entity_id: input_select.zen_home_mode
        state: Away
    action:
      - action: script.zen_home_mode_release
        data: {}

  ###########################################################################
  # HA INIT — evaluate window on start/restart
  # Restores correct scheduled state after reboot.
  # Guarded: will not overwrite Away or Paused.
  ###########################################################################
  - id: zen_hm_init
    alias: "Zen Home Mode: Init on HA Start"
    trigger:
      - trigger: homeassistant
        event: start
    condition:
      - condition: template
        value_template: "{{ states('input_select.zen_home_mode') not in ['Away', 'Paused'] }}"
    action:
      - action: script.zen_hm_evaluate_window
        data: {}
