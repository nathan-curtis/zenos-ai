# zen_sutra_music_assistant v1.1.0
# Full Music Assistant connector sutra — core MA + optional mass_queue tier.
# Internal sutra — NOT MCP-exposed.
# LLM surface: zen_dojotools_media_manager (stacks_by_anchor, search modes).
#
# Core MA (always available):
#   search             music_assistant.search
#   play_media         music_assistant.play_media
#   queue_command      music_assistant.queue_command
#   get_library        music_assistant.get_library
#
# Lyrics (LRCLIB — free, no auth):
#   lyrics             Fetch plain + synced lyrics. Exact match then fuzzy fallback.
#
# Advanced — mass_queue optional (https://github.com/droans/mass_queue/):
#   queue_get          Read current queue window
#   queue_remove       Remove item from queue
#   queue_play_item    Jump to queue item
#   queue_move_up/down/next  Reorder queue
#   queue_clear_from_here    Truncate queue after current track
#   queue_unfavorite   Unfavorite now-playing item
#   collection_album        Album metadata + tracks by URI
#   collection_artist       Artist metadata + top tracks by URI
#   collection_playlist     Playlist metadata + tracks by URI
#   collection_podcast      Podcast metadata + episodes by URI
#   collection_recommendations  Personalized provider recommendations
#   group_volume_get/set    Multi-room group volume

script:
  zen_sutra_music_assistant:
    alias: Zen Sutra Music Assistant (Internal)
    description: >-
      Internal sutra — full Music Assistant connector. Not MCP-exposed.
      Use zen_dojotools_media_manager for LLM surface.
      Core MA: search, play_media, queue_command, get_library.
      Advanced (mass_queue HACS optional): queue inspection/surgery, collection browsing, group volume.
    icon: mdi:music-note-plus
    mode: parallel
    max: 10
    fields:
      mode:
        description: "Operation mode."
        required: true
        default: search
        selector:
          select:
            options:
              - search
              - play_media
              - queue_command
              - get_library
              - lyrics
              - queue_get
              - queue_remove
              - queue_play_item
              - queue_move_up
              - queue_move_down
              - queue_move_next
              - queue_clear_from_here
              - queue_unfavorite
              - collection_album
              - collection_artist
              - collection_playlist
              - collection_podcast
              - collection_recommendations
              - group_volume_get
              - group_volume_set
              - queue_transfer
              - queue_snapshot
              - queue_restore
              - queue_sync
              - tool_manifest
              - help
      entity_id:
        description: "Music Assistant player entity. Required for playback and queue ops."
        required: false
        selector:
          entity:
            domain: media_player
      query:
        description: "Search query or library search string."
        required: false
        selector:
          text:
      artist:
        description: "Artist filter (search mode)."
        required: false
        selector:
          text:
      album:
        description: "Album filter (search mode)."
        required: false
        selector:
          text:
      media_type:
        description: "Media type filter (search/get_library)."
        required: false
        selector:
          select:
            multiple: true
            options:
              - artist
              - album
              - track
              - playlist
              - radio
              - audiobook
              - podcast
      limit:
        description: "Result or queue read limit. Default 25."
        required: false
        default: 25
        selector:
          number:
            min: 1
            max: 500
      library_only:
        description: "Restrict search to MA library (search mode). Default true."
        required: false
        selector:
          boolean:
      uri:
        description: "MA URI for collection modes (album/artist/playlist/podcast)."
        required: false
        selector:
          text:
      media_id:
        description: "Media URI or name for play_media."
        required: false
        selector:
          text:
      enqueue:
        description: "Enqueue mode for play_media: replace, next, add, play."
        required: false
        selector:
          select:
            options:
              - replace
              - next
              - add
              - play
      command:
        description: "Command for queue_command mode."
        required: false
        selector:
          select:
            options:
              - play
              - pause
              - stop
              - next
              - previous
              - seek
              - shuffle
              - repeat
              - crossfade
              - clear_queue
      command_extra:
        description: "JSON extra data for queue_command (e.g. {\"position\": 60} for seek, {\"repeat_mode\": \"all\"} for repeat)."
        required: false
        selector:
          text:
      queue_item_id:
        description: "Queue item ID for queue_remove, queue_play_item, queue_move_*."
        required: false
        selector:
          text:
      target_entity_id:
        description: "Target MA player entity for queue_transfer and queue_sync."
        required: false
        selector:
          entity:
            domain: media_player
      snapshot_data:
        description: "Snapshot dict from queue_snapshot. Required for queue_restore."
        required: false
        selector:
          text:
      clear_source:
        description: "Clear source queue after transfer (queue_transfer). Default false."
        required: false
        selector:
          boolean:
      volume:
        description: "Volume 0-100 for group_volume_set."
        required: false
        selector:
          number:
            min: 0
            max: 100
      providers:
        description: "Provider filter for collection_recommendations (CSV or JSON array)."
        required: false
        selector:
          text:
      page:
        description: "Page index for paginated collection modes. Default 0."
        required: false
        selector:
          number:
            min: 0
            max: 999
      ma_config_entry_id:
        description: "MA config entry ID. Defaults to installed instance."
        required: false
        selector:
          text:
      duration:
        description: "Track duration in seconds. Improves LRCLIB exact-match accuracy for lyrics mode."
        required: false
        selector:
          number:
            min: 0
            max: 7200
      caller_token:
        description: "Opaque correlation token echoed in response."
        required: false
        selector:
          text:
    sequence:

    # ── tool_manifest ─────────────────────────────────────────────────────────────
    - if: "{{ (mode | default('')) == 'tool_manifest' }}"
      then:
      - variables:
          result: >-
            {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
            {{ MF.tool_manifest(
                tool='zen_sutra_music_assistant',
                display_name='Music Assistant Sutra',
                tier='sutra',
                version='1.0.0',
                health={'configured': true, 'status': 'ok',
                        'mass_queue_available': true,
                        'notes': []},
                required_labels=['dojotools'],
                optional_labels=['music_assistant', 'mass_queue'],
                consumes=['search_query', 'ma_entity', 'uri', 'queue_item_id'],
                returns=['media_results', 'queue_items', 'collection_data', 'playback_confirmation'],
                modes=['search','play_media','queue_command','get_library','queue_get',
                       'queue_remove','queue_play_item','queue_move_up','queue_move_down',
                       'queue_move_next','queue_clear_from_here','queue_unfavorite',
                       'collection_album','collection_artist','collection_playlist',
                       'collection_podcast','collection_recommendations',
                       'group_volume_get','group_volume_set','tool_manifest','help'],
                icon='mdi:music-note-plus',
                color='pink',
                caller_token=caller_token | default('')
            ) | from_json }}
      - stop: tool_manifest
        response_variable: result

    # ── Normalize inputs ──────────────────────────────────────────────────────────
    - variables:
        _mode:          "{{ mode | default('search') | lower | trim }}"
        _entity:        "{{ entity_id | default('', true) | string | trim }}"
        _query:         "{{ query | default('', true) | string | trim }}"
        _artist:        "{{ artist | default('', true) | string | trim }}"
        _album_filter:  "{{ album | default('', true) | string | trim }}"
        _uri:           "{{ uri | default('', true) | string | trim }}"
        _media_id:      "{{ media_id | default('', true) | string | trim }}"
        _limit:         "{{ limit | default(25) | int(25) }}"
        _page:          "{{ page | default(0) | int(0) }}"
        _library_only:  "{{ library_only if library_only is defined else true }}"
        _enqueue:       "{{ enqueue | default('replace', true) | string | trim }}"
        _command:       "{{ command | default('', true) | string | trim }}"
        _queue_item_id: "{{ queue_item_id | default('', true) | string | trim }}"
        _volume:        "{{ volume | default(50) | int(50) }}"
        _config_entry: >-
          {%- set _ma_ent = label_entities('zen_mm_music_assistant') | select('match', 'media_player\\.') | list | first | default('') -%}
          {%- set _dev_id = device_id(_ma_ent) if _ma_ent != '' else '' -%}
          {%- set _derived = (device_attr(_dev_id, 'config_entries') or []) | list | first | default('') if _dev_id != '' else '' -%}
          {{ ma_config_entry_id | default(_derived, true) | string | trim }}
        _caller_token:  "{{ caller_token | default('', true) }}"
        _mq_available:  "true"
        _target_entity: "{{ target_entity_id | default('', true) | string | trim }}"
        _clear_source:  "{{ clear_source | default(false, true) | bool(false) }}"

    # ── help ──────────────────────────────────────────────────────────────────────
    - if: "{{ _mode == 'help' }}"
      then:
      - variables:
          result:
            status: ok
            sutra: zen_sutra_music_assistant
            version: "1.0.0"
            core_modes:
              search: "music_assistant.search — query, artist, album, media_type, limit, library_only"
              play_media: "music_assistant.play_media — entity_id, media_id, media_type, enqueue (replace/next/add/play)"
              queue_command: "music_assistant.queue_command — entity_id, command, command_extra JSON"
              get_library: "music_assistant.get_library — config_entry_id, media_type, query, limit, page"
            advanced_queue_control:
              requires: "mass_queue HACS integration"
              install: "https://github.com/droans/mass_queue/"
              status: available
              unlocks:
                queue_get: "Read queue — entity_id, limit, page"
                queue_remove: "Remove item — entity_id, queue_item_id"
                queue_play_item: "Jump to item — entity_id, queue_item_id"
                queue_move_up: "Move up — entity_id, queue_item_id"
                queue_move_down: "Move down — entity_id, queue_item_id"
                queue_move_next: "Move to next — entity_id, queue_item_id"
                queue_clear_from_here: "Truncate queue after current — entity_id"
                queue_unfavorite: "Unfavorite now-playing — entity_id"
                collection_album: "Album + tracks by URI — uri, config_entry_id, page"
                collection_artist: "Artist + top tracks by URI — uri, config_entry_id, page"
                collection_playlist: "Playlist + tracks by URI — uri, config_entry_id, page"
                collection_podcast: "Podcast + episodes by URI — uri, config_entry_id, page"
                collection_recommendations: "Personalized recs — entity_id, providers CSV"
                group_volume_get: "Group volume read — entity_id"
                group_volume_set: "Group volume set — entity_id, volume"
      - stop: help complete
        response_variable: result

    # ── GUARD: unknown mode ───────────────────────────────────────────────────────
    - if: >-
        {{ _mode not in [
          'search','play_media','queue_command','get_library','lyrics',
          'queue_get','queue_remove','queue_play_item',
          'queue_move_up','queue_move_down','queue_move_next',
          'queue_clear_from_here','queue_unfavorite',
          'queue_transfer','queue_snapshot','queue_restore','queue_sync',
          'collection_album','collection_artist','collection_playlist',
          'collection_podcast','collection_recommendations',
          'group_volume_get','group_volume_set'
        ] }}
      then:
      - variables:
          result:
            status: error
            code: unknown_mode
            mode: "{{ _mode }}"
      - stop: unknown mode
        response_variable: result

    # ════════════════════════════════════════════════════════════════════════════
    # CORE MA MODES
    # ════════════════════════════════════════════════════════════════════════════

    # ── search ────────────────────────────────────────────────────────────────────
    - if: "{{ _mode == 'search' }}"
      then:
      - action: music_assistant.search
        data:
          config_entry_id: "{{ _config_entry }}"
          name: "{{ _query }}"
          artist: "{{ _artist }}"
          album: "{{ _album_filter }}"
          limit: "{{ _limit }}"
          library_only: "{{ _library_only }}"
          media_type: >-
            {%- if media_type is defined and media_type is not none -%}
              {%- if media_type is sequence and media_type is not string -%}{{ media_type | list }}
              {%- elif media_type | string | trim not in ['', 'None', 'none'] -%}[{{ media_type | string | trim }}]
              {%- else -%}{{ none }}{%- endif -%}
            {%- else -%}{{ none }}{%- endif -%}
        response_variable: result
      - stop: search complete
        response_variable: result

    # ── play_media ────────────────────────────────────────────────────────────────
    - if: "{{ _mode == 'play_media' }}"
      then:
      - action: music_assistant.play_media
        target:
          entity_id: "{{ _entity }}"
        data:
          media_id: "{{ _media_id }}"
          media_type: "{{ media_type | default(none, true) }}"
          enqueue: "{{ _enqueue }}"
        continue_on_error: true
      - variables:
          result:
            status: ok
            mode: play_media
            entity_id: "{{ _entity }}"
            media_id: "{{ _media_id }}"
            enqueue: "{{ _enqueue }}"
      - stop: play_media complete
        response_variable: result

    # ── queue_command ─────────────────────────────────────────────────────────────
    - if: "{{ _mode == 'queue_command' }}"
      then:
      - variables:
          _cmd_extra: >-
            {%- set raw = command_extra | default('', true) -%}
            {%- if raw is mapping -%}{{ raw }}
            {%- elif raw is string and raw | trim != '' -%}{{ raw | trim | from_json(none) }}
            {%- else -%}{{ none }}{%- endif -%}
      # Route to standard HA media_player services (music_assistant.queue_command does not exist in this install)
      - choose:
        - conditions: "{{ _command == 'play' }}"
          sequence:
          - action: media_player.media_play
            target:
              entity_id: "{{ _entity }}"
        - conditions: "{{ _command == 'pause' }}"
          sequence:
          - action: media_player.media_pause
            target:
              entity_id: "{{ _entity }}"
        - conditions: "{{ _command == 'stop' }}"
          sequence:
          - action: media_player.media_stop
            target:
              entity_id: "{{ _entity }}"
        - conditions: "{{ _command == 'next' }}"
          sequence:
          - action: media_player.media_next_track
            target:
              entity_id: "{{ _entity }}"
        - conditions: "{{ _command == 'previous' }}"
          sequence:
          - action: media_player.media_previous_track
            target:
              entity_id: "{{ _entity }}"
        - conditions: "{{ _command == 'seek' }}"
          sequence:
          - action: media_player.media_seek
            target:
              entity_id: "{{ _entity }}"
            data:
              seek_position: "{{ (_cmd_extra or {}).get('position', 0) }}"
        - conditions: "{{ _command == 'shuffle' }}"
          sequence:
          - action: media_player.shuffle_set
            target:
              entity_id: "{{ _entity }}"
            data:
              shuffle: "{{ (_cmd_extra or {}).get('shuffle', true) | bool }}"
        - conditions: "{{ _command == 'repeat' }}"
          sequence:
          - action: media_player.repeat_set
            target:
              entity_id: "{{ _entity }}"
            data:
              repeat: "{{ (_cmd_extra or {}).get('repeat_mode', 'off') }}"
        - conditions: "{{ _command == 'clear_queue' }}"
          sequence:
          - action: media_player.clear_playlist
            target:
              entity_id: "{{ _entity }}"
        default:
        - variables:
            _cmd_unsupported: "{{ _command }}"
      - variables:
          result:
            status: ok
            mode: queue_command
            entity_id: "{{ _entity }}"
            command: "{{ _command }}"
      - stop: queue_command complete
        response_variable: result

    # ── get_library ───────────────────────────────────────────────────────────────
    - if: "{{ _mode == 'get_library' }}"
      then:
      - action: music_assistant.get_library
        data:
          config_entry_id: "{{ _config_entry }}"
          media_type: "{{ (media_type | default(['track'], true) | list | first) if (media_type | default(none, true)) is not string else media_type }}"
          search: "{{ _query if _query != '' else none }}"
          limit: "{{ _limit }}"
          offset: "{{ _page * _limit }}"
        response_variable: _lib_raw
        continue_on_error: true
      - variables:
          result:
            status: ok
            mode: get_library
            items: "{{ _lib_raw }}"
            page: "{{ _page }}"
            limit: "{{ _limit }}"
      - stop: get_library complete
        response_variable: result

    # ── lyrics ────────────────────────────────────────────────────────────────────
    # LRCLIB: free, no auth. Exact match first, fuzzy search fallback.
    # query = track_name, artist = artist_name, album_filter = album_name, duration = seconds
    - if: "{{ _mode == 'lyrics' }}"
      then:
      - if: "{{ _query == '' or _artist == '' }}"
        then:
        - variables:
            result:
              status: error
              code: missing_required
              message: "lyrics mode requires query (track name) and artist."
        - stop: missing required
          response_variable: result
      - variables:
          _lrc_dur: "{{ duration | default('', true) | string | trim }}"
      - action: rest_command.lrclib_get
        data:
          track_name: "{{ _query }}"
          artist_name: "{{ _artist }}"
          album_name: "{{ _album_filter }}"
          duration: "{{ _lrc_dur }}"
        response_variable: _lrc_exact_raw
        continue_on_error: true
      - variables:
          _lrc_exact_ok: >-
            {%- set r = _lrc_exact_raw if (_lrc_exact_raw is defined and _lrc_exact_raw is mapping) else {} -%}
            {%- set s = r.get('status', 0) | int(0) -%}
            {%- set rc = r.get('content', none) -%}
            {%- set _d = rc if rc is mapping else (rc | from_json(none) if rc is string and rc | length > 2 else none) -%}
            {{ s == 200 and _d is mapping and not _d.get('code') }}
      - if: "{{ not _lrc_exact_ok | bool(false) }}"
        then:
        - action: rest_command.lrclib_search
          data:
            track_name: "{{ _query }}"
            artist_name: "{{ _artist }}"
          response_variable: _lrc_search_raw
          continue_on_error: true
        - variables:
            result: >-
              {%- set r = _lrc_search_raw if (_lrc_search_raw is defined and _lrc_search_raw is mapping) else {} -%}
              {%- set s = r.get('status', 0) | int(0) -%}
              {%- set rc = r.get('content', none) -%}
              {%- set arr = rc if rc is sequence and rc is not string else (rc | from_json(none) if rc is string and rc | length > 2 else none) -%}
              {%- set _d = arr | first if arr is sequence and arr | length > 0 else none -%}
              {%- if _d is none or not (_d is mapping) -%}
                {{ {'status': 'not_found', 'mode': 'lyrics', 'track': _query, 'artist': _artist} }}
              {%- else -%}
                {%- set _inst = _d.get('instrumental', false) | bool(false) -%}
                {{ {
                  'status': 'ok', 'mode': 'lyrics', 'source': 'search',
                  'track_name': _d.get('trackName', _query),
                  'artist_name': _d.get('artistName', _artist),
                  'album_name': _d.get('albumName', none),
                  'duration': _d.get('duration', none),
                  'instrumental': _inst,
                  'synced_available': _d.get('syncedLyrics') is not none and not _inst,
                  'plain_lyrics': none if _inst else _d.get('plainLyrics', none),
                  'synced_lyrics': none if _inst else _d.get('syncedLyrics', none),
                  'lrclib_id': _d.get('id', none)
                } }}
              {%- endif -%}
        - stop: lyrics complete
          response_variable: result
      - variables:
          result: >-
            {%- set r = _lrc_exact_raw if (_lrc_exact_raw is defined and _lrc_exact_raw is mapping) else {} -%}
            {%- set rc = r.get('content', none) -%}
            {%- set _d = rc if rc is mapping else (rc | from_json(none) if rc is string and rc | length > 2 else none) -%}
            {%- if _d is none or not (_d is mapping) or _d.get('code') -%}
              {{ {'status': 'not_found', 'mode': 'lyrics', 'track': _query, 'artist': _artist} }}
            {%- else -%}
              {%- set _inst = _d.get('instrumental', false) | bool(false) -%}
              {{ {
                'status': 'ok', 'mode': 'lyrics', 'source': 'exact',
                'track_name': _d.get('trackName', _query),
                'artist_name': _d.get('artistName', _artist),
                'album_name': _d.get('albumName', none),
                'duration': _d.get('duration', none),
                'instrumental': _inst,
                'synced_available': _d.get('syncedLyrics') is not none and not _inst,
                'plain_lyrics': none if _inst else _d.get('plainLyrics', none),
                'synced_lyrics': none if _inst else _d.get('syncedLyrics', none),
                'lrclib_id': _d.get('id', none)
              } }}
            {%- endif -%}
      - stop: lyrics complete
        response_variable: result

    # ════════════════════════════════════════════════════════════════════════════
    # MASS_QUEUE MODES — optional, guarded by _mq_available
    # Install: https://github.com/droans/mass_queue/
    # ════════════════════════════════════════════════════════════════════════════

    # ── queue_get ─────────────────────────────────────────────────────────────────
    - if: "{{ _mode == 'queue_get' }}"
      then:
      - if: "{{ not _mq_available | bool(false) }}"
        then:
        - variables:
            result:
              status: error
              code: mass_queue_not_installed
              message: "Advanced queue control requires the mass_queue HACS integration."
              install: "https://github.com/droans/mass_queue/"
        - stop: mass_queue not installed
          response_variable: result
      - action: mass_queue.get_queue_items
        data:
          entity: "{{ _entity }}"
          limit: "{{ _limit }}"
          offset: "{{ _page * _limit }}"
        response_variable: _mq_raw
        continue_on_error: true
      - variables:
          result:
            status: ok
            mode: queue_get
            entity_id: "{{ _entity }}"
            items: "{{ _mq_raw }}"
            page: "{{ _page }}"
      - stop: queue_get complete
        response_variable: result

    # ── queue_remove ──────────────────────────────────────────────────────────────
    - if: "{{ _mode == 'queue_remove' }}"
      then:
      - if: "{{ not _mq_available | bool(false) }}"
        then:
        - variables:
            result: {status: error, code: mass_queue_not_installed, install: "https://github.com/droans/mass_queue/"}
        - stop: mass_queue not installed
          response_variable: result
      - action: mass_queue.remove_queue_item
        data:
          entity: "{{ _entity }}"
          queue_item_id: "{{ _queue_item_id }}"
        continue_on_error: true
      - variables:
          result:
            status: ok
            mode: queue_remove
            entity_id: "{{ _entity }}"
            queue_item_id: "{{ _queue_item_id }}"
      - stop: queue_remove complete
        response_variable: result

    # ── queue_play_item ───────────────────────────────────────────────────────────
    - if: "{{ _mode == 'queue_play_item' }}"
      then:
      - if: "{{ not _mq_available | bool(false) }}"
        then:
        - variables:
            result: {status: error, code: mass_queue_not_installed, install: "https://github.com/droans/mass_queue/"}
        - stop: mass_queue not installed
          response_variable: result
      - action: mass_queue.play_queue_item
        data:
          entity: "{{ _entity }}"
          queue_item_id: "{{ _queue_item_id }}"
        continue_on_error: true
      - variables:
          result:
            status: ok
            mode: queue_play_item
            entity_id: "{{ _entity }}"
            queue_item_id: "{{ _queue_item_id }}"
      - stop: queue_play_item complete
        response_variable: result

    # ── queue_move_up ─────────────────────────────────────────────────────────────
    - if: "{{ _mode == 'queue_move_up' }}"
      then:
      - if: "{{ not _mq_available | bool(false) }}"
        then:
        - variables:
            result: {status: error, code: mass_queue_not_installed, install: "https://github.com/droans/mass_queue/"}
        - stop: mass_queue not installed
          response_variable: result
      - action: mass_queue.move_queue_item_up
        data:
          entity: "{{ _entity }}"
          queue_item_id: "{{ _queue_item_id }}"
        continue_on_error: true
      - variables:
          result: {status: ok, mode: queue_move_up, entity_id: "{{ _entity }}", queue_item_id: "{{ _queue_item_id }}"}
      - stop: queue_move_up complete
        response_variable: result

    # ── queue_move_down ───────────────────────────────────────────────────────────
    - if: "{{ _mode == 'queue_move_down' }}"
      then:
      - if: "{{ not _mq_available | bool(false) }}"
        then:
        - variables:
            result: {status: error, code: mass_queue_not_installed, install: "https://github.com/droans/mass_queue/"}
        - stop: mass_queue not installed
          response_variable: result
      - action: mass_queue.move_queue_item_down
        data:
          entity: "{{ _entity }}"
          queue_item_id: "{{ _queue_item_id }}"
        continue_on_error: true
      - variables:
          result: {status: ok, mode: queue_move_down, entity_id: "{{ _entity }}", queue_item_id: "{{ _queue_item_id }}"}
      - stop: queue_move_down complete
        response_variable: result

    # ── queue_move_next ───────────────────────────────────────────────────────────
    - if: "{{ _mode == 'queue_move_next' }}"
      then:
      - if: "{{ not _mq_available | bool(false) }}"
        then:
        - variables:
            result: {status: error, code: mass_queue_not_installed, install: "https://github.com/droans/mass_queue/"}
        - stop: mass_queue not installed
          response_variable: result
      - action: mass_queue.move_queue_item_next
        data:
          entity: "{{ _entity }}"
          queue_item_id: "{{ _queue_item_id }}"
        continue_on_error: true
      - variables:
          result: {status: ok, mode: queue_move_next, entity_id: "{{ _entity }}", queue_item_id: "{{ _queue_item_id }}"}
      - stop: queue_move_next complete
        response_variable: result

    # ── queue_clear_from_here ─────────────────────────────────────────────────────
    - if: "{{ _mode == 'queue_clear_from_here' }}"
      then:
      - if: "{{ not _mq_available | bool(false) }}"
        then:
        - variables:
            result: {status: error, code: mass_queue_not_installed, install: "https://github.com/droans/mass_queue/"}
        - stop: mass_queue not installed
          response_variable: result
      - action: mass_queue.clear_queue_from_here
        data:
          entity: "{{ _entity }}"
        continue_on_error: true
      - variables:
          result: {status: ok, mode: queue_clear_from_here, entity_id: "{{ _entity }}"}
      - stop: queue_clear_from_here complete
        response_variable: result

    # ── queue_unfavorite ──────────────────────────────────────────────────────────
    - if: "{{ _mode == 'queue_unfavorite' }}"
      then:
      - if: "{{ not _mq_available | bool(false) }}"
        then:
        - variables:
            result: {status: error, code: mass_queue_not_installed, install: "https://github.com/droans/mass_queue/"}
        - stop: mass_queue not installed
          response_variable: result
      - action: mass_queue.unfavorite_current_item
        data:
          entity: "{{ _entity }}"
        continue_on_error: true
      - variables:
          result: {status: ok, mode: queue_unfavorite, entity_id: "{{ _entity }}"}
      - stop: queue_unfavorite complete
        response_variable: result

    # ── queue_transfer ───────────────────────────────────────────────────────────
    # Move queue from source entity to target entity.
    # entity_id=source, target_entity_id=target, clear_source=false
    - if: "{{ _mode == 'queue_transfer' }}"
      then:
      - if: "{{ not _mq_available | bool(false) }}"
        then:
        - variables:
            result: {status: error, code: mass_queue_not_installed, install: "https://github.com/droans/mass_queue/"}
        - stop: mass_queue not installed
          response_variable: result
      - if: "{{ _entity == '' or _target_entity == '' }}"
        then:
        - variables:
            result: {status: error, code: missing_required, message: "queue_transfer requires entity_id (source) and target_entity_id (target)."}
        - stop: missing entities
          response_variable: result
      - action: mass_queue.get_queue_items
        data:
          entity: "{{ _entity }}"
          limit: 500
          offset: 0
        response_variable: _qt_src
        continue_on_error: true
      - variables:
          _qt_items: >-
            {%- set raw = _qt_src if (_qt_src is defined and _qt_src is mapping) else {} -%}
            {%- set lst = raw.get(_entity, raw.values() | list | first | default([])) -%}
            {{ lst if lst is sequence and lst is not string else [] }}
          _qt_count: >-
            {%- set raw = _qt_src if (_qt_src is defined and _qt_src is mapping) else {} -%}
            {%- set lst = raw.get(_entity, raw.values() | list | first | default([])) -%}
            {{ (lst | length) if lst is sequence and lst is not string else 0 }}
      - if: "{{ _qt_count | int(0) == 0 }}"
        then:
        - variables:
            result: {status: error, code: source_queue_empty, entity_id: "{{ _entity }}"}
        - stop: source queue empty
          response_variable: result
      - repeat:
          for_each: >-
            {%- set raw = _qt_src if (_qt_src is defined and _qt_src is mapping) else {} -%}
            {{ raw.get(_entity, raw.values() | list | first | default([])) }}
          sequence:
          - action: music_assistant.play_media
            data:
              entity_id: "{{ _target_entity }}"
              media_id: "{{ repeat.item.get('media_content_id', '') }}"
              enqueue: "{{ 'replace' if repeat.first else 'add' }}"
            continue_on_error: true
      - if: "{{ _clear_source | bool(false) }}"
        then:
        - action: media_player.clear_playlist
          target:
            entity_id: "{{ _entity }}"
          continue_on_error: true
      - variables:
          result:
            status: ok
            mode: queue_transfer
            source_entity_id: "{{ _entity }}"
            target_entity_id: "{{ _target_entity }}"
            items_transferred: "{{ _qt_count }}"
            source_cleared: "{{ _clear_source | bool(false) }}"
            caller_token: "{{ _caller_token }}"
      - stop: queue_transfer complete
        response_variable: result

    # ── queue_snapshot ────────────────────────────────────────────────────────────
    # Capture full queue as a serializable snapshot. Consumer stores to cabinet.
    - if: "{{ _mode == 'queue_snapshot' }}"
      then:
      - if: "{{ not _mq_available | bool(false) }}"
        then:
        - variables:
            result: {status: error, code: mass_queue_not_installed, install: "https://github.com/droans/mass_queue/"}
        - stop: mass_queue not installed
          response_variable: result
      - if: "{{ _entity == '' }}"
        then:
        - variables:
            result: {status: error, code: missing_required, message: "queue_snapshot requires entity_id."}
        - stop: missing entity
          response_variable: result
      - action: mass_queue.get_queue_items
        data:
          entity: "{{ _entity }}"
          limit: 500
          offset: 0
        response_variable: _snap_items
        continue_on_error: true
      - variables:
          result: >-
            {%- set raw = _snap_items if (_snap_items is defined and _snap_items is mapping) else {} -%}
            {%- set items = raw.get(_entity, raw.values() | list | first | default([])) -%}
            {%- set items = items if items is sequence and items is not string else [] -%}
            {%- set ns = namespace(out=[]) -%}
            {%- for item in items -%}
              {%- set ns.out = ns.out + [{'uri': item.get('media_content_id', ''), 'name': item.get('media_title', ''), 'artist': item.get('media_artist', ''), 'album': item.get('media_album_name', '')}] -%}
            {%- endfor -%}
            {{ {
              'status': 'ok',
              'mode': 'queue_snapshot',
              'entity_id': _entity,
              'item_count': items | length,
              'items': ns.out,
              'snapshot_time': now().isoformat(),
              'caller_token': _caller_token
            } }}
      - stop: queue_snapshot complete
        response_variable: result

    # ── queue_restore ─────────────────────────────────────────────────────────────
    # Restore a queue from a snapshot (output of queue_snapshot).
    # entity_id=target, snapshot_data=snapshot dict or JSON string
    - if: "{{ _mode == 'queue_restore' }}"
      then:
      - if: "{{ _entity == '' }}"
        then:
        - variables:
            result: {status: error, code: missing_required, message: "queue_restore requires entity_id and snapshot_data."}
        - stop: missing entity
          response_variable: result
      - repeat:
          for_each: >-
            {%- set sd = snapshot_data | default(none, true) -%}
            {%- set _d = sd if sd is mapping else (sd | from_json(none) if sd is string and sd | length > 2 else none) -%}
            {{ _d.get('items', []) if _d is mapping else [] }}
          sequence:
          - action: music_assistant.play_media
            data:
              entity_id: "{{ _entity }}"
              media_id: "{{ repeat.item.get('uri', '') if repeat.item is mapping else '' }}"
              enqueue: "{{ 'replace' if repeat.first else 'add' }}"
            continue_on_error: true
      - variables:
          result:
            status: ok
            mode: queue_restore
            entity_id: "{{ _entity }}"
            caller_token: "{{ _caller_token }}"
      - stop: queue_restore complete
        response_variable: result

    # ── queue_sync ────────────────────────────────────────────────────────────────
    # Start playing the same track on target at (approximately) the same position.
    # entity_id=source, target_entity_id=target
    - if: "{{ _mode == 'queue_sync' }}"
      then:
      - if: "{{ _entity == '' or _target_entity == '' }}"
        then:
        - variables:
            result: {status: error, code: missing_required, message: "queue_sync requires entity_id (source) and target_entity_id (target)."}
        - stop: missing entities
          response_variable: result
      - variables:
          _sync_uri:      "{{ state_attr(_entity, 'media_content_id') | default('', true) | string | trim }}"
          _sync_pos:      "{{ state_attr(_entity, 'media_position') | default(0, true) | float(0) }}"
          _sync_state:    "{{ states(_entity) | default('', true) }}"
      - if: "{{ _sync_uri == '' }}"
        then:
        - variables:
            result: {status: error, code: source_not_playing, message: "Source entity has no active media_content_id.", entity_id: "{{ _entity }}"}
        - stop: source not playing
          response_variable: result
      - action: music_assistant.play_media
        data:
          entity_id: "{{ _target_entity }}"
          media_id: "{{ _sync_uri }}"
          enqueue: replace
        continue_on_error: true
      - delay:
          milliseconds: 1500
      - action: media_player.media_seek
        data:
          entity_id: "{{ _target_entity }}"
          seek_position: "{{ _sync_pos }}"
        continue_on_error: true
      - variables:
          result:
            status: ok
            mode: queue_sync
            source_entity_id: "{{ _entity }}"
            target_entity_id: "{{ _target_entity }}"
            synced_uri: "{{ _sync_uri }}"
            synced_position: "{{ _sync_pos }}"
            caller_token: "{{ _caller_token }}"
      - stop: queue_sync complete
        response_variable: result

    # ── collection_album ──────────────────────────────────────────────────────────
    - if: "{{ _mode == 'collection_album' }}"
      then:
      - if: "{{ not _mq_available | bool(false) }}"
        then:
        - variables:
            result: {status: error, code: mass_queue_not_installed, install: "https://github.com/droans/mass_queue/"}
        - stop: mass_queue not installed
          response_variable: result
      - action: mass_queue.get_album
        data:
          uri: "{{ _uri }}"
          config_entry_id: "{{ _config_entry }}"
        response_variable: _col_meta
        continue_on_error: true
      - action: mass_queue.get_album_tracks
        data:
          uri: "{{ _uri }}"
          page: "{{ _page }}"
          config_entry_id: "{{ _config_entry }}"
        response_variable: _col_tracks
        continue_on_error: true
      - variables:
          result:
            status: ok
            mode: collection_album
            uri: "{{ _uri }}"
            album: "{{ _col_meta }}"
            tracks: "{{ _col_tracks }}"
            page: "{{ _page }}"
      - stop: collection_album complete
        response_variable: result

    # ── collection_artist ─────────────────────────────────────────────────────────
    - if: "{{ _mode == 'collection_artist' }}"
      then:
      - if: "{{ not _mq_available | bool(false) }}"
        then:
        - variables:
            result: {status: error, code: mass_queue_not_installed, install: "https://github.com/droans/mass_queue/"}
        - stop: mass_queue not installed
          response_variable: result
      - action: mass_queue.get_artist
        data:
          uri: "{{ _uri }}"
          config_entry_id: "{{ _config_entry }}"
        response_variable: _col_meta
        continue_on_error: true
      - action: mass_queue.get_artist_tracks
        data:
          uri: "{{ _uri }}"
          page: "{{ _page }}"
          config_entry_id: "{{ _config_entry }}"
        response_variable: _col_tracks
        continue_on_error: true
      - variables:
          result:
            status: ok
            mode: collection_artist
            uri: "{{ _uri }}"
            artist: "{{ _col_meta }}"
            tracks: "{{ _col_tracks }}"
            page: "{{ _page }}"
      - stop: collection_artist complete
        response_variable: result

    # ── collection_playlist ───────────────────────────────────────────────────────
    - if: "{{ _mode == 'collection_playlist' }}"
      then:
      - if: "{{ not _mq_available | bool(false) }}"
        then:
        - variables:
            result: {status: error, code: mass_queue_not_installed, install: "https://github.com/droans/mass_queue/"}
        - stop: mass_queue not installed
          response_variable: result
      - action: mass_queue.get_playlist
        data:
          uri: "{{ _uri }}"
          config_entry_id: "{{ _config_entry }}"
        response_variable: _col_meta
        continue_on_error: true
      - action: mass_queue.get_playlist_tracks
        data:
          uri: "{{ _uri }}"
          page: "{{ _page }}"
          config_entry_id: "{{ _config_entry }}"
        response_variable: _col_tracks
        continue_on_error: true
      - variables:
          result:
            status: ok
            mode: collection_playlist
            uri: "{{ _uri }}"
            playlist: "{{ _col_meta }}"
            tracks: "{{ _col_tracks }}"
            page: "{{ _page }}"
      - stop: collection_playlist complete
        response_variable: result

    # ── collection_podcast ────────────────────────────────────────────────────────
    - if: "{{ _mode == 'collection_podcast' }}"
      then:
      - if: "{{ not _mq_available | bool(false) }}"
        then:
        - variables:
            result: {status: error, code: mass_queue_not_installed, install: "https://github.com/droans/mass_queue/"}
        - stop: mass_queue not installed
          response_variable: result
      - action: mass_queue.get_podcast
        data:
          uri: "{{ _uri }}"
          config_entry_id: "{{ _config_entry }}"
        response_variable: _col_meta
        continue_on_error: true
      - action: mass_queue.get_podcast_episodes
        data:
          uri: "{{ _uri }}"
          page: "{{ _page }}"
          config_entry_id: "{{ _config_entry }}"
        response_variable: _col_episodes
        continue_on_error: true
      - variables:
          result:
            status: ok
            mode: collection_podcast
            uri: "{{ _uri }}"
            podcast: "{{ _col_meta }}"
            episodes: "{{ _col_episodes }}"
            page: "{{ _page }}"
      - stop: collection_podcast complete
        response_variable: result

    # ── collection_recommendations ────────────────────────────────────────────────
    - if: "{{ _mode == 'collection_recommendations' }}"
      then:
      - if: "{{ not _mq_available | bool(false) }}"
        then:
        - variables:
            result: {status: error, code: mass_queue_not_installed, install: "https://github.com/droans/mass_queue/"}
        - stop: mass_queue not installed
          response_variable: result
      - variables:
          _rec_providers: >-
            {%- set p = providers | default('', true) -%}
            {%- if p is sequence and p is not string -%}{{ p | list }}
            {%- elif p is string and p | trim != '' -%}
              {%- if (p | trim)[:1] == '[' -%}{{ p | trim | from_json | default([]) }}
              {%- else -%}{{ (p | trim).split(',') | map('trim') | select | list }}{%- endif -%}
            {%- else -%}{{ [] }}{%- endif -%}
      - action: mass_queue.get_recommendations
        data:
          entity: "{{ _entity }}"
          providers: "{{ _rec_providers if _rec_providers | length > 0 else none }}"
        response_variable: _mq_raw
        continue_on_error: true
      - variables:
          result:
            status: ok
            mode: collection_recommendations
            entity_id: "{{ _entity }}"
            recommendations: "{{ _mq_raw }}"
      - stop: collection_recommendations complete
        response_variable: result

    # ── group_volume_get ──────────────────────────────────────────────────────────
    - if: "{{ _mode == 'group_volume_get' }}"
      then:
      - if: "{{ not _mq_available | bool(false) }}"
        then:
        - variables:
            result: {status: error, code: mass_queue_not_installed, install: "https://github.com/droans/mass_queue/"}
        - stop: mass_queue not installed
          response_variable: result
      - action: mass_queue.get_group_volume
        data:
          entity: "{{ _entity }}"
        response_variable: _mq_raw
        continue_on_error: true
      - variables:
          result: {status: ok, mode: group_volume_get, entity_id: "{{ _entity }}", group_volume: "{{ _mq_raw }}"}
      - stop: group_volume_get complete
        response_variable: result

    # ── group_volume_set ──────────────────────────────────────────────────────────
    - if: "{{ _mode == 'group_volume_set' }}"
      then:
      - if: "{{ not _mq_available | bool(false) }}"
        then:
        - variables:
            result: {status: error, code: mass_queue_not_installed, install: "https://github.com/droans/mass_queue/"}
        - stop: mass_queue not installed
          response_variable: result
      - action: mass_queue.set_group_volume
        data:
          entity: "{{ _entity }}"
          volume: "{{ _volume }}"
        continue_on_error: true
      - variables:
          result: {status: ok, mode: group_volume_set, entity_id: "{{ _entity }}", volume: "{{ _volume }}"}
      - stop: group_volume_set complete
        response_variable: result

rest_command:
  lrclib_get:
    url: "https://lrclib.net/api/get?track_name={{ track_name | replace(' ', '+') }}&artist_name={{ artist_name | replace(' ', '+') }}&album_name={{ album_name | default('') | replace(' ', '+') }}&duration={{ duration | default('') }}"
    method: GET
    headers:
      User-Agent: "ZenOS-AI/1.0 (home-assistant; lrclib-client)"
      Accept: "application/json"

  lrclib_search:
    url: "https://lrclib.net/api/search?track_name={{ track_name | replace(' ', '+') }}&artist_name={{ artist_name | replace(' ', '+') }}"
    method: GET
    headers:
      User-Agent: "ZenOS-AI/1.0 (home-assistant; lrclib-client)"
      Accept: "application/json"
