###############################################################################
# ZenOS-AI DojoTools: Identity
# Version: 5.4.1
#
# v5.4.0 — resolve_caller_identity performs cert checks on the caller's behalf (2026-07-18)
#   New optional required_cert / required_cert_level inputs. When set, this mode
#   runs the persona_editor cert_list lookup itself against the resolved identity
#   and returns authorized: true/false. Tools must stop calling persona_editor
#   directly for their own cert checks — ask identity, don't check your own
#   borrowed identity yourself. Base-tier default is everyone/guest; elevation
#   is earned via cert, resolved centrally here, not per-tool.
#
# v5.3.1 — sim_mode_allowed defaults FALSE, factory-stamped (2026-07-18)
#   Fail-closed default: unset sim_mode_allowed now blocks, it doesn't allow.
#   zen_admintools_prompt_loader stamps an explicit value into
#   integrations_config.identity.sim_mode_allowed on every factory run, so a
#   fresh install always carries a real, deliberate value — never relies on
#   the in-code default surviving unnoticed.
#
# v5.3.0 — OS-level sim_mode enforcement (2026-07-18)
#   sim_mode is a whole-OS policy, not a per-tool choice. resolve_caller_identity
#   now reads integrations_config.identity.sim_mode_allowed (household cabinet)
#   and returns policy_status: blocked/allowed. Real (sim_mode: false) is
#   always allowed. Consumers must check policy_status, not just
#   resolved_identity, before proceeding.
#
# v5.2.0 — mode: resolve_caller_identity added (2026-07-18)
#   Platform-wide SP1 call-site — any gated dojotool should call this instead
#   of hardcoding its own default-agent fallback. Delegates to
#   zen_root_authentik (stub, no real Authentik yet). Returns sim_mode: true;
#   thread it through your own audit trail rather than swallow it. See
#   feedback_caller_id_not_authenticated + project_sp1_acl_candidates.
#
# Scripts:
#   zen_dojotools_identity — Household identity resolver + family group management
#
# MIGRATED FROM: scripts.yaml (2026-03-06)
#
# === UAT PASS — 2026-03-06 ===
# Auditor: Claude (Anthropic, Sonnet 4.6)
# HALMark: 0.9.11-draft — PASS Level 3 (Steward Safe) — no FG hits
# UAT Cases: 2/2 PASS
#
# zen_dojotools_identity:
#   no-target call → full roster returned (all users), valid JSON ✓
#   target=None normalization → null, zen_cabinets(None) → roster ✓
#
# v4.1.0 — mode: prompt added
#   mode: resolve (default) — identity record, unchanged from v4.0.0
#   mode: prompt  — resolved capsule for the target construct via ai_capsule()
#                   Shows exactly what the model sees for that identity right now.
#
# v4.2.0 — mode: build_identity_manifest added
#   mode: build_identity_manifest — calls identity_roster(), writes
#   zen_identity_manifest drawer to the household cabinet. Same pattern as
#   zen_library_manifest in the manifest builder. Run after onboarding or
#   any time the roster changes.
#
# v4.3.0 — family group management + membership visibility
#
# v4.4.0 — RP2 identity fixes (2026-03-26)
#   FG-38/FG-40 guards on _new_entry/_new_fam_entry (variables: + tojson → HA
#     auto-parses to native dict; guard with 'if is string else')
#   _fvi/_sfvi FG-38 full three-round guard in all 3 tree paths × 2 depths
#     (resolve, membership tree, member_lookup)
#   friendly_name: VolumeInfo.friendly_name not .name — 20 call sites fixed
#   Dedup guards on household_add_family, household_add_member, family_add_member
#   Manifest auto-rebuild fires after all 6 roster-change operations
#   GUID stamping on add operations when member/family cab has no GUID yet
#   Name baked into member/family roster entries at add-time (not read at query-time)
#   FG-38 from_json guard on all _vi_raw reads + profile-first name resolution
#   mode: prompt — FG-40 guard on cab + no-target AI user fallback
#   _fm/_sfm value-unwrap in all tree builder paths
#
# v4.5.0 — RP2 GA (2026-03-26)
#   All response: >- blocks converted to inline {{ {...} }} format (BUG 8)
#   VolumeInfo reads: inline response blocks, zero >- remaining
#   Membership model: System → Household (occupancy) → Family (belonging, unlimited depth)
#   Security resolution caps at depth 2. Data model is unrestricted.
#   First user provisioned auto-joins household + default family.
#   AI auto-joins household only; explicit family invite = "part of the family".
#   Join/leave fires zen_event (family_member_joined / family_member_left) with
#   prompt_profile_update: true so the AI can surface naming/profile suggestions.
#
#   mode: household_add_family    — wire a family cabinet into a household
#   mode: household_remove_family — detach a family cabinet from a household
#   mode: household_add_member    — add user/ai_user to household; first occupant fills HoH/prime slot
#   mode: household_remove_member — remove user/ai_user; warns if removed entity is HoH/prime
#   mode: set_principal           — set/replace HoH (user) or prime AI (ai_user) on any container cabinet
#   mode: family_add_member       — add user/ai_user/family to a family; fires join event
#   mode: family_remove_member    — remove member; fires leave event; warns if removed entity is HoH/prime
#   mode: link_partners            — bidirectional delegation link (any entity pair: user↔user,
#                                    user↔ai_user, ai_user↔ai_user). Writes acls.partner on both sides.
#                                    Partner = authorized to delegate on your behalf (governance, not social).
#   mode: unlink_partners          — sever delegation link; removes each from the other's acls.partner
#   mode: set_default_family      — change which family is the user's default (first = default)
#   mode: membership              — full tree view (principals + members + sub-families to depth 2)
#                                    or reverse lookup (which groups is this member in?)
#   mode: is_member               — depth-2 membership check: is member_entity in family_entity?
#
# v4.7.0 — presence block (2026-05-19)
#   resolve (person): presence { person_entity, zone, at_home, area_id, area_name }
#   All presence fields consent-gated via tracking.gps_zone / tracking.room
#   person_entity + cabinet now explicit top-level keys in person response
#   reverse area_residents: each entry gains person_entity + zone (consent-gated)
#
# v4.6.1 — group-type label collision fix
#   _r3b_entity: when resolved cabinet is ai_user AND normalized is a group-type label
#   (household/family_group), re-resolve excluding ai_user cabinets. Fixes
#   user_label=household returning AI persona instead of household group when
#   AI cabinet carries 'household' as a membership label.
#
# v4.6.0 — resolve: spaces injection + reverse area lookup
#   mode: resolve — response now includes `spaces` (live/work/work_zone from
#     _user_profile/_family_profile drawer) and `area_labels` (non-zen_ entity
#     labels on the resolved cabinet).
#   Reverse area lookup: when normalized is a plain label (no dot) and resolve
#     returns not_found/empty, falls back to label_entities(label) ∩ zen_cabinet
#     (non-ai_user only) → returns {result: 'area_residents', area_residents: [...]}
#     Each resident entry: {entity_id, name, role, spaces}.
#
# config check → go; restart → clean ✓
# ==============================
###############################################################################

script:
  zen_dojotools_identity:
    alias: Zen DojoTools Identity
    mode: parallel
    max: 10
    description: >
      Zen DojoTools Identity 4.6.1 — Household identity resolver, prompt inspector, group management, and area/space lens.

      mode: resolve (default) — resolves identities within the ZenOS-AI household.
      No target: full roster. With target: returns identity record with `spaces` (live/work/work_zone
      from profile drawer) and `area_labels` (room labels on the cabinet entity).
      Area reverse lookup: if the label resolves to no owner cabinet, returns area_residents —
      all non-AI cabinets labeled with that area — each with name, role, and spaces.

      mode: prompt — renders the compiled prompt capsule for the target construct via
      zen.ai_capsule(). Shows exactly what the model sees for that identity right now.
      Includes the rendered capsule, prompt health signals, and signature status.
      Pass any valid target (label, person entity, cabinet entity, GUID).

      mode: render_prompt — renders the FULL assembled system prompt via zen.render_prompt()
      exactly as the active agent receives it — all 10 sections (header, system, manifest,
      index, kata/dojo, capsule, overview, wake, priority_inject). Uses active persona from
      input_text.zenos_persona_name. No target needed. Pair with ha_reload_templates +
      re-render for iterative qualitative prompt editing.

      mode: build_identity_manifest — rebuilds the zen_identity_manifest drawer in the
      household cabinet from the live identity roster. Run after onboarding or any
      roster change. Same pattern as the library manifest builder.

      mode: provision_member — full orchestration for adding a new family member with no
      HA person entity. Finds the first free expansion slot, provisions it, wires into the
      target family, rebuilds manifest. Requires member_name.

      mode: membership — full tree view of principals, members, sub-families to depth 2.
      Reverse lookup when member_entity is a user/ai_user (returns all groups + roles).

      Results are always returned as valid JSON for downstream reasoning.
      Requires zen_os_1.jinja 4.2.0 or newer.

    fields:
      mode:
        name: Mode
        description: >
          REQUIRED. This field takes exactly ONE of the string values listed below —
          pass it as mode: "<value>". These values are NOT separate boolean flags/fields
          of their own; there is no field literally named 'household_add_member' or
          'hoh_provision' or similar — only 'mode' exists as a field, and one of these
          strings is its value. Valid values for mode:
          "resolve" → identity record + spaces + area_labels (default). Area label with no owner → area_residents reverse lookup.
          "prompt" → rendered capsule for this construct.
          "render_prompt" → full assembled prompt as Friday receives it (all sections).
          "build_identity_manifest" → rebuild zen_identity_manifest in household cabinet.
          "household_add_family" → wire a family cabinet into a household.
          "household_remove_family" → detach a family cabinet from a household.
          "household_add_member" → add user or ai_user to a household (member_type selects which).
            First occupant fills the HoH or prime slot. Blocked if slot already occupied — use mode: "set_principal".
          "household_remove_member" → remove user or ai_user from a household. Warns in response if
            removed entity holds the HoH or prime slot (stale pointer — use mode: "set_principal" to transfer).
          "set_principal" → set or replace the HoH (member_type: user) or prime AI partner
            (member_type: ai_user) on any container cabinet. Single-occupant slot — previous occupant replaced.
          "family_add_member" → add user/ai_user/family to a family (nesting allowed; resolver caps at 2).
          "family_remove_member" → remove member from a family. Warns if removed entity is HoH/prime.
          "link_partners" → bidirectional delegation link between any two entities (user↔user,
            user↔ai_user, ai_user↔ai_user). Writes to acls.partner on both sides. Partner
            means the entity is authorized to delegate on your behalf — not a social label.
          "unlink_partners" → sever the delegation link. Removes each entity from the other's
            acls.partner list.
          "set_default_family" → change a user's default family (first family joined is default).
          "membership" → full tree view: principals, members, and sub-families to depth 2.
            If family_entity or member_entity is a container (household/family), returns that tree.
            If member_entity is a user/ai_user, returns all groups they belong to and their role in each.
            Omit both to return the default household tree.
          "is_member" → depth-2 membership check. member_entity = subject, family_entity = container.
            Returns {is_member: bool, depth: 1|2|null}.
          "provision_member" → full orchestration for adding a new family member who has no HA
            person.* entity and no pre-provisioned cabinet. Finds the first expansion slot in init
            state, provisions it as a family cabinet, wires it into the target family, and rebuilds
            the identity manifest. Requires member_name. Optional: family_entity (defaults to
            zen_default_family_cabinet_resolved), member_type (default: user), profile_payload
            (JSON string — additional profile fields: first_name, last_name, pronouns, role, etc.).
            Hard-stops with clear error if all 5 expansion slots are occupied.
          "resolve_caller_identity" → platform-wide SP1 call-site. Delegates to zen_root_authentik
            (stub, no real Authentik yet). Enforces the OS-level sim_mode policy
            (integrations_config.identity.sim_mode_allowed) — returns policy_status:
            blocked/allowed. Real identity is always allowed. Optional required_cert
            (+ required_cert_level, default 1) runs the cert check on the caller's behalf
            against the resolved identity — response includes authorized: true/false.
            Tools must call this instead of calling persona_editor cert_list themselves;
            checking your own cert against your own resolved identity defeats the point
            of a single chokepoint. Use instead of hardcoding a default-agent fallback inline.
        default: resolve
        selector:
          select:
            options:
              - resolve
              - prompt
              - render_prompt
              - build_identity_manifest
              - household_add_family
              - household_remove_family
              - household_add_member
              - household_remove_member
              - set_principal
              - family_add_member
              - family_remove_member
              - link_partners
              - unlink_partners
              - set_default_family
              - membership
              - is_member
              - provision_member
              - resolve_caller_identity
              - request_live_ack
              - cert_list

      user_label:
        selector:
          text:
        name: User Label
        description: Optional, the Index label referring to a valid ZenOS-AI user.
      user_cabinet:
        name: User Cabinet
        description: Under Construction - not functional yet. Optional, the entity_id
          of a valid user cabinet sensor.
        selector:
          entity:
            filter:
              domain: sensor
            multiple: false
      user_entity_id:
        name: Person
        description: >-
          Optional. The entity_id of a valid person.* entity (e.g. person.user).
          Resolved against member entries via person_entity_id field. Takes
          lower priority than user_label and user_cabinet.
        required: false
        selector:
          entity:
            filter:
              domain: person
            multiple: false
      user_guid:
        name: User GUID
        description: Under Construction - not functional yet. Optional, the Zen AI OS
          User GUID of a valid user.
        required: false
        selector:
          text:
            multiline: false
      family_entity:
        name: Family Cabinet
        description: entity_id of the family cabinet sensor. Required for household_add_family,
          family_add_member, family_remove_member.
        required: false
        selector:
          entity:
            filter:
              domain: sensor
            multiple: false
      member_entity:
        name: Member Cabinet
        description: entity_id of the member cabinet sensor (user, ai_user, or sub-family).
          Required for family_add_member, family_remove_member, household_add_member,
          household_remove_member.
        required: false
        selector:
          entity:
            filter:
              domain: sensor
            multiple: false
      member_type:
        name: Member Type
        description: Type of member — user, ai_user, or family. Required for family_add_member,
          household_add_member, household_remove_member.
        required: false
        default: user
        selector:
          select:
            options:
              - user
              - ai_user
              - family
              - tool_manifest
      ai_entity:
        name: Partner Cabinet (Entity B)
        description: entity_id of the second cabinet for partner link operations. Any
          cabinet type — user, ai_user, etc. Required for link_partners, unlink_partners.
          Note — partner in this model means delegation authority, not social relationship.
        required: false
        selector:
          entity:
            filter:
              domain: sensor
            multiple: false
      household_entity:
        name: Household Cabinet
        description: entity_id of a specific household cabinet sensor. Optional — overrides
          the default household resolver (zen_default_household_cabinet_resolved). Use
          for multi-household installations.
        required: false
        selector:
          entity:
            filter:
              domain: sensor
            multiple: false
      member_name:
        name: Member Name
        description: >-
          Display name for the new member. Required for provision_member.
          Stored as preferred_name (and name) in the provisioned cabinet profile drawer.
        required: false
        selector:
          text:
            multiline: false
      profile_payload:
        name: Profile Payload (JSON)
        description: >-
          Optional JSON string with additional profile fields to seed into the
          provisioned cabinet (first_name, last_name, pronouns, role, etc.).
          Merged with member_name. Used only by provision_member.
        required: false
        selector:
          text:
            multiline: true
      required_cert:
        name: Required Cert (resolve_caller_identity only)
        description: >-
          Cert name to check on the caller's behalf (e.g. infra_container_control).
          If set, resolve_caller_identity runs the cert_list lookup itself against the
          resolved identity and returns authorized: true/false — the caller never
          touches persona_editor directly.
        required: false
        default: ''
        selector:
          text:
      required_cert_level:
        name: Required Cert Level (resolve_caller_identity only)
        description: Minimum cert level needed when required_cert is set. Default 1.
        required: false
        default: 1
        selector:
          number:
            min: 0
            max: 10
      target_entity:
        name: Target Entity (resolve_caller_identity only)
        description: >-
          Optional entity_id the caller is about to act on. If set alongside
          required_cert, resolve_caller_identity resolves cert_scope against
          it itself (via the shared cert_scope_check macro) and returns
          scope_decision: allow/deny/default — consumers should use this
          instead of walking cert_scope themselves. Every SASE-shaped tool
          shares this one resolution path so a future deny-ACL rollout is a
          data-shape change here only, not five separate rewrites.
        required: false
        default: ''
        selector:
          text:
      confirm_action:
        name: Confirm Action
        description: >-
          Required by set_principal ONLY when replacing an already-occupied
          HoH/prime slot with a DIFFERENT entity — prevents a takeover of an
          already-established household by a confused or compromised caller.
          Not required to fill an empty slot, or to re-set the same entity
          already occupying it.
        required: false
        default: false
        selector:
          boolean:
      persona_target:
        name: Persona Target (cert_list only)
        description: "ai_user cabinet entity_id to check certs for. Omit for the default agent."
        required: false
        default: ''
        selector:
          entity:
            filter:
              domain: sensor
      ack_message:
        name: Ack Message (request_live_ack only)
        description: >-
          Required for request_live_ack. Text shown to the household admin
          in the approval push, e.g. "Agent requests cert_grant: lock_control
          level 1. Approve?"
        required: false
        default: ''
        selector:
          text:
            multiline: true
      ack_key:
        name: Ack Key (request_live_ack only)
        description: >-
          Optional dedup/audit key for the underlying alert. Auto-generated
          from a timestamp if omitted.
        required: false
        default: ''
        selector:
          text:
      ack_max_wait_seconds:
        name: Ack Max Wait Seconds (request_live_ack only)
        description: >-
          How long to poll for the admin's response before timing out.
          Hard-capped at 150 (2:30) in code regardless of what's passed —
          a longer approval window is a de-escalation attack surface, no
          caller (compromised or not) can push it past this ceiling.
        required: false
        default: 90
        selector:
          number:
            min: 15
            max: 150
            mode: box
      ack_poll_interval_seconds:
        name: Ack Poll Interval Seconds (request_live_ack only)
        description: "How often to check for a response. Floored at 5 in code."
        required: false
        default: 15
        selector:
          number:
            min: 5
            max: 60
            mode: box
      ack_notify_target:
        name: Ack Notify Target (request_live_ack only)
        description: >-
          Where the approval push goes. Default postman -- the ONLY
          alertmanager notify_target that actually wires response_type/
          yes-no capture (via zen_dojotools_postman + kata cabinet
          alert_response_<key> caching that get_response reads). 'mobile'
          is NOT a magic keyword alertmanager recognizes -- it falls
          through to a literal `notify.mobile` service call (doesn't
          exist) and never captures a response at all. Real, pre-existing
          bug: Portainer's original d-class ack (and every consumer of
          this new mode, before this fix) used notify_target=mobile and
          could never have actually captured a real approval -- always
          silent dispatch failure or eternal timeout, fail-closed by
          accident rather than by working as designed.
        required: false
        default: postman
        selector:
          text:
      caller_token:
        name: Caller Token
        required: false
        default: ''
        selector:
          text:
        description: 'Reserved. Governance stub — echoed in response. SP1 enforcement
          not yet active.'

    sequence:

    - if: "{{ (mode | default('') | lower) == 'tool_manifest' }}"
      then:
      - variables:
          result: >-
            {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
            {{ MF.tool_manifest(
                tool='zen_dojotools_identity',
                display_name='Identity',
                tier='dojotools',
                version='1.1.0',
                health={'configured': true, 'status': 'ok', 'notes': []},
                required_labels=['dojotools'],
                optional_labels=['identity', 'personality_module'],
                consumes=['persona_or_user'],
                returns=['identity_data'],
                icon='mdi:account-circle',
                color='cyan',
                stripe=3,
                impact='soft',
                mcp_exposed=true,

                caller_token=caller_token | default('')
            ) | from_json }}
      - stop: tool_manifest
        response_variable: result

    # ── request_live_ack — single chokepoint for "get me a live human
    # yes/no", extracted 2026-08-15 after the same ~40-line fire+poll block
    # turned up hand-rolled FOUR times (zen_dojotools_infra's Portainer
    # d-class ack, zen_dojotools_locks' escalation_request, and
    # zen_dojotools_persona_editor's cert_grant AND cert_revoke). Same
    # "consumers must call identity instead of re-deriving their own
    # resolved-identity fallback" principle resolve_caller_identity already
    # established — this is the ack-flow equivalent. One-shot per call
    # (fire, poll, return approved/declined/timeout) -- callers that need a
    # TIME-BOXED grant (not just one action's approval) still own writing
    # that grant to their own cabinet drawer after a true response here,
    # same as zen_dojotools_locks' escalation_request does today. ──
    - if: "{{ (mode | default('') | lower) == 'request_live_ack' }}"
      then:
      - variables:
          _rla_message: "{{ ack_message | default('', true) | string | trim }}"
      - if: "{{ _rla_message == '' }}"
        then:
        - variables:
            result:
              status: error
              error: ack_message_required
              detail: "request_live_ack requires ack_message."
              caller_token: "{{ caller_token | default('') }}"
        - stop: request_live_ack — missing message
          response_variable: result
      - variables:
          _rla_key: "{{ ack_key | default('', true) | string | trim }}"
          _rla_max_wait: "{{ [(ack_max_wait_seconds | default(90, true) | int(90)), 150] | min }}"
          _rla_poll_interval: "{{ [(ack_poll_interval_seconds | default(15, true) | int(15)), 5] | max }}"
          _rla_notify_target: "{{ ack_notify_target | default('postman', true) | string | trim }}"
      - variables:
          _rla_key: "{{ _rla_key if _rla_key != '' else 'live_ack_' ~ (now().timestamp() | int) }}"
          _rla_max_tries: "{{ ([(ack_max_wait_seconds | default(90, true) | int(90)), 150] | min / [(ack_poll_interval_seconds | default(15, true) | int(15)), 5] | max) | round(0, 'ceil') | int }}"
      - action: script.zen_dojotools_alertmanager
        response_variable: _rla_fire_raw
        continue_on_error: true
        data:
          mode: fire
          alert_key: "{{ _rla_key }}"
          severity: warn
          message: "{{ _rla_message }}"
          notify_target: "{{ _rla_notify_target }}"
          response_type: yes_no
          # A live-ack bypass can be security or
          # life related, so this call needs an urgency/
          # breakthrough override -- severity=warn alone maps to
          # urgency 5, well under the sleep gate's threshold of 9,
          # which would mean every request_live_ack call during quiet/night hours
          # silently never reaches a human.
          # This is the chokepoint gating deliberate human-requested
          # security actions (clearing Paused, cert grants, etc) -- it
          # must never be suppressed by the same gate that correctly
          # holds back routine FYI notifications until morning.
          breakthrough: true
      # ── alertmanager's fire mode is fire-and-forget: it emits a zen_event
      # and returns immediately (real dispatch happens async in a separate
      # listener automation) -- its response is {'mode':'fire',...,
      # 'queued':true}, NEVER a 'status':'success' key. Checking for
      # 'status'=='success' here is always false regardless of real
      # outcome. Same wrong pattern also exists in
      # Portainer's original d-class ack (not fixed there independently --
      # it's the same call shape now that
      # infra delegates to this shared mode, so this fix covers it too).
      # Real signal: did the call even complete without erroring. ──
      - if: "{{ _rla_fire_raw is not mapping or _rla_fire_raw.get('mode') != 'fire' }}"
        then:
        - variables:
            result:
              status: ok
              mode: request_live_ack
              approved: false
              reason: dispatch_failed
              waited_seconds: 0
              caller_token: "{{ caller_token | default('') }}"
        - stop: request_live_ack — dispatch failed
          response_variable: result
      - variables:
          _rla_ack_result: pending
          _rla_ack_tries: 0
      - repeat:
          while:
            - condition: template
              value_template: "{{ _rla_ack_result == 'pending' and _rla_ack_tries < _rla_max_tries }}"
          sequence:
          - delay:
              seconds: "{{ _rla_poll_interval }}"
          - action: script.zen_dojotools_alertmanager
            response_variable: _rla_ack_raw
            continue_on_error: true
            data:
              mode: get_response
              alert_key: "{{ _rla_key }}"
          - variables:
              _rla_ack_result: >-
                {%- if _rla_ack_raw is mapping and _rla_ack_raw.get('status') == 'captured' and _rla_ack_raw.get('ack_action', '') in ['yes', 'no'] -%}
                  {{ _rla_ack_raw.get('ack_action') }}
                {%- else -%}pending{%- endif -%}
              _rla_ack_tries: "{{ _rla_ack_tries + 1 }}"
      - variables:
          result:
            status: ok
            mode: request_live_ack
            approved: "{{ _rla_ack_result == 'yes' }}"
            reason: "{{ 'approved' if _rla_ack_result == 'yes' else ('declined' if _rla_ack_result == 'no' else 'timeout') }}"
            waited_seconds: "{{ _rla_ack_tries * _rla_poll_interval }}"
            caller_token: "{{ caller_token | default('') }}"
      - stop: request_live_ack complete
        response_variable: result

    # ── cert_list — "what could exist, and what do I actually hold right
    # now." This is a protected gate of ident READ, not
    # necessarily admin -- reading your own current permission state isn't
    # dangerous the way granting/revoking is (that's why cert_grant/revoke
    # get the full catalog+live-ack treatment above, and this doesn't), but
    # it shouldn't be wide open to a caller whose identity resolution is
    # itself blocked (sim_mode rejected by OS policy) either. Gate: calls
    # itself (resolve_caller_identity, no required_cert) and requires
    # policy_status == 'allowed' -- no specific cert, no live ack. Combines
    # the LIVE-CALCULATED catalog (zen_dojotools_manifest mode=cert_audit --
    # every cert any tool actually declares via tool_manifest certs_required,
    # no separate hand-maintained file, 2026-08-15 cutover) with the live
    # grant roster from persona_editor's own cert_list (what's actually held
    # right now), so a caller gets one useful answer instead of having to
    # cross-reference two tools itself. ──
    - if: "{{ (mode | default('') | lower) == 'cert_list' }}"
      then:
      - action: script.zen_dojotools_identity
        response_variable: _cl_id_raw
        continue_on_error: true
        data:
          mode: resolve_caller_identity
          caller_token: "{{ caller_token | default('') }}"
      - variables:
          _cl_policy_status: "{{ _cl_id_raw.get('policy_status', 'blocked') if _cl_id_raw is mapping else 'blocked' }}"
      - if: "{{ _cl_policy_status != 'allowed' }}"
        then:
        - variables:
            result:
              status: denied
              mode: cert_list
              reason: identity_policy_blocked
              detail: "resolve_caller_identity did not return an allowed identity -- cert_list refused."
              caller_token: "{{ caller_token | default('') }}"
        - stop: cert_list — identity blocked
          response_variable: result
      - action: script.zen_dojotools_manifest
        response_variable: _cl_catalog_raw
        continue_on_error: true
        data:
          mode: cert_audit
          caller_token: "{{ caller_token | default('') }}"
      - variables:
          _cl_catalog: "{{ (_cl_catalog_raw.get('result', _cl_catalog_raw) if _cl_catalog_raw is mapping else {}).get('catalog', {}) }}"
      - variables:
          _cl_target: "{{ persona_target | default('', true) | string | trim }}"
      - action: script.zen_dojotools_persona_editor
        response_variable: _cl_pe_raw
        continue_on_error: true
        data:
          mode: cert_list
          target: "{{ _cl_target if _cl_target != '' else omit }}"
      - variables:
          _cl_held: "{{ _cl_pe_raw.get('certifications', {}) if _cl_pe_raw is mapping else {} }}"
      - variables:
          _cl_combined: >-
            {%- set ns = namespace(items=[]) -%}
            {%- for _key, _def in _cl_catalog.items() -%}
              {%- set _held_entry = _cl_held.get(_key, none) -%}
              {%- set ns.items = ns.items + [{
                'cert': _key,
                'display_name': _def.get('display_name', _key),
                'description': _def.get('description', ''),
                'gates': _def.get('gates', []),
                'max_level': _def.get('max_level', 4),
                'held': _held_entry is not none,
                'held_level': (_held_entry.get('level', 0) if _held_entry is not none else none),
                'held_scope': (_held_entry.get('scope', []) if _held_entry is not none else []),
                'held_constraints': (_held_entry.get('constraints', []) if _held_entry is not none else [])
              }] -%}
            {%- endfor -%}
            {{ ns.items }}
      - variables:
          result:
            status: ok
            mode: cert_list
            target: "{{ _cl_pe_raw.get('target', '') if _cl_pe_raw is mapping else '' }}"
            certs: "{{ _cl_combined }}"
            caller_token: "{{ caller_token | default('') }}"
      - stop: cert_list complete
        response_variable: result

    # ── resolve_caller_identity — real call-site for SP1, shunted until active ──
    # OS-level sim_mode gate lives HERE, not per-consumer: integrations_config.identity.
    # sim_mode_allowed (household cabinet, default FALSE — fail closed until the
    # prompt loader's factory stamp or an admin explicitly turns it on) is the
    # single policy switch.
    #   sim_mode=true  + allowed=false -> blocked (resolved_identity withheld)
    #   sim_mode=true  + allowed=true  -> allowed (today's default)
    #   sim_mode=false (real)          -> always allowed regardless of the flag
    - if: "{{ (mode | default('') | lower) == 'resolve_caller_identity' }}"
      then:
        - action: script.zen_root_authentik
          response_variable: _rci_raw
          continue_on_error: true
          data:
            caller_token: "{{ caller_token | default('') }}"
        - variables:
            _rci_sim_mode: "{{ _rci_raw.get('sim_mode', true) if _rci_raw is mapping else true }}"
        - action: script.zen_dojotools_filecabinet
          response_variable: _rci_cfg_raw
          continue_on_error: true
          data:
            action_type: get
            volume_entity_id: "{{ states('sensor.zen_default_household_cabinet_resolved') }}"
            path: integrations_config
        - variables:
            _rci_ic: >-
              {%- set r = _rci_cfg_raw.get('value', {}) if _rci_cfg_raw is mapping and _rci_cfg_raw.get('status') == 'success' else {} -%}
              {{ r if r is mapping else {} }}
            _rci_sim_allowed: "{{ _rci_ic.get('identity', {}).get('sim_mode_allowed', false) if _rci_ic is mapping else false }}"
            _rci_blocked: "{{ _rci_sim_mode and not (_rci_ic.get('identity', {}).get('sim_mode_allowed', false) if _rci_ic is mapping else false) }}"
        - variables:
            _rci_resolved_target: >-
              {{ '' if _rci_blocked else ((_rci_raw.get('resolved_identity', {}) if _rci_raw is mapping else {}).get('entity_id', '')) }}
        # ── Cert check on behalf of the caller — tool asks identity, identity
        # asks persona_editor. Consumers must NEVER call persona_editor directly
        # for their own cert_list; pass required_cert (+ required_cert_level) here
        # instead. Only runs when the caller actually asked for a cert check AND
        # policy already allowed the identity resolution — a blocked identity
        # can never pass a cert check regardless of what's asked for.
        - variables:
            _rci_cert_requested: "{{ (required_cert | default('') | string | trim) != '' }}"
        - if: "{{ _rci_cert_requested and not _rci_blocked }}"
          then:
            - action: script.zen_dojotools_persona_editor
              response_variable: _rci_pe_raw
              continue_on_error: true
              data:
                mode: cert_list
                target: "{{ _rci_resolved_target }}"
            - variables:
                _rci_certs: "{{ _rci_pe_raw.get('certifications', {}) if _rci_pe_raw is mapping else {} }}"
                _rci_cert_entry: "{{ _rci_certs.get(required_cert, {}) if _rci_certs is mapping else {} }}"
                _rci_cert_level: "{{ (_rci_cert_entry.get('level', 0) | int(0)) if _rci_cert_entry is mapping else 0 }}"
                _rci_cert_required_level: "{{ required_cert_level | default(1) | int(1) }}"
                _rci_cert_ok: "{{ _rci_pe_raw is mapping and _rci_pe_raw.get('status') == 'ok' and _rci_cert_level >= (required_cert_level | default(1) | int(1)) }}"
            # ── Scope/constraints pass-through -- the "begrudging
            # override" ask: cert_grant already had cert_scope/
            # cert_constraints fields, never consumed anywhere. A tool with
            # its own "ask live every time" tier (locks exterior unlock,
            # security_manager disarm, infra d-class) checks THIS field
            # against its own target before deciding whether to still ask --
            # identity's job is only to surface it, never to interpret it,
            # same separation resolve_caller_identity already keeps between
            # policy/cert resolution and each tool's own gate logic. ──
            - variables:
                _rci_cert_scope: "{{ (_rci_cert_entry.get('scope', []) if _rci_cert_entry is mapping else []) }}"
                _rci_cert_constraints: "{{ (_rci_cert_entry.get('constraints', []) if _rci_cert_entry is mapping else []) }}"
        - variables:
            _rci_cert_level: "{{ _rci_cert_level | default(0) }}"
            _rci_cert_ok: "{{ _rci_cert_ok | default(false) }}"
            _rci_cert_scope: "{{ _rci_cert_scope | default([]) }}"
            _rci_cert_constraints: "{{ _rci_cert_constraints | default([]) }}"
        # ── Scope resolution happens here, once, not re-walked per consumer
        # tool -- see cert_scope_check macro (zen_os_1.jinja) for the shared
        # allow/deny/default normalization; anything touching ACLs
        # goes through identity. Only runs when the caller passed
        # target_entity; if omitted, scope_decision is always 'default' and
        # existing callers that don't pass it are unaffected. ──
        - variables:
            _rci_scope_decision: >-
              {%- import 'zenos_ai/zen_os_1.jinja' as zen -%}
              {{ zen.cert_scope_check(_rci_cert_scope, target_entity | default('', true)) | trim if (target_entity | default('', true)) != '' else 'default' }}
        - variables:
            response: >-
              {{-
                {
                  'mode': 'resolve_caller_identity',
                  'policy_status': 'blocked' if _rci_blocked else 'allowed',
                  'sim_mode': _rci_sim_mode,
                  'sim_mode_allowed': _rci_sim_allowed,
                  'override_attempted': _rci_raw.get('override_attempted', false) if _rci_raw is mapping else false,
                  'token_shape': _rci_raw.get('token_shape', 'none') if _rci_raw is mapping else 'none',
                  'resolved_identity': ({} if _rci_blocked else (_rci_raw.get('resolved_identity', {}) if _rci_raw is mapping else {})),
                  'block_reason': ('sim_mode result rejected: OS policy integrations_config.identity.sim_mode_allowed is false' if _rci_blocked else ''),
                  'cert_checked': _rci_cert_requested,
                  'cert_name': required_cert | default(''),
                  'cert_level': _rci_cert_level,
                  'cert_required_level': required_cert_level | default(1) | int(1),
                  'cert_scope': _rci_cert_scope,
                  'cert_constraints': _rci_cert_constraints,
                  'target_entity': target_entity | default(''),
                  'scope_decision': _rci_scope_decision,
                  'authorized': (not _rci_blocked) and ((not _rci_cert_requested) or _rci_cert_ok),
                  'caller_token_received': caller_token | default(''),
                  'timestamp': now().isoformat()
                }
              -}}
        - stop: "resolve_caller_identity complete"
          response_variable: response

    # ── Step 1: normalize inputs + target ──────────────────────────────────
    - variables:
        caller_token: "{{- caller_token | default('') -}}"

    # ── Step 1: normalize inputs + target ──────────────────────────────────
    - variables:
        _mode: "{{- mode | default('resolve') | lower | trim -}}"
        user_label: "{{- user_label | default('') -}}"
        user_cabinet: "{{- user_cabinet | default('') -}}"
        user_entity_id: "{{- user_entity_id | default('') -}}"
        family_entity: "{{- family_entity | default('') | trim -}}"
        member_entity: "{{- member_entity | default('') | trim -}}"
        member_type: "{{- member_type | default('user') | lower | trim -}}"
        ai_entity: "{{- ai_entity | default('') | trim -}}"
        household_entity: "{{- household_entity | default('') | trim -}}"
        member_name: "{{- member_name | default('') | trim -}}"
        profile_payload: "{{- profile_payload | default('') | trim -}}"
        _hh_target: >
          {%- if household_entity | default('') | trim != '' -%}
            {{- household_entity | trim -}}
          {%- else -%}
            {{- states('sensor.zen_default_household_cabinet_resolved') -}}
          {%- endif -%}
        user_guid: >
          {%- set ug = user_guid | default('') | trim -%}
          {%- set pattern = '(?i)^[0-9a-f]{8}-?[0-9a-f]{4}-?[0-9a-f]{4}-?[0-9a-f]{4}-?[0-9a-f]{12}$' -%}
          {{- ug if ug is match(pattern) else '' -}}
        # @todo - not sure if that awkward default response "''" is handled properly
        target: >
          {%- if user_label | default('') | trim != '' -%}
            {{- user_label | trim -}}
          {%- elif user_cabinet | default('') | trim != '' -%}
            {{- user_cabinet | trim -}}
          {%- elif user_entity_id | default('') | trim != '' -%}
            {{- user_entity_id | trim -}}
          {%- elif user_guid | default('') | trim != '' -%}
            {{- user_guid | trim -}}
          {%- else -%}
            ''
          {%- endif -%}
        raw_target: "{{- target | default('') | trim -}}"
        normalized: >
          {%- set rt = raw_target | string | trim -%}
          
          {#- --- 0. Canonical empty/null detection (kills '', "", ' ', etc.) --- -#}
          {%- if rt in ['', "''", '""', "' '", '" "', None] -%}
            {{- None -}}
          
          {#- --- 1. person.* entity → resolve to cabinet --- -#}
          {#-     Primary:  member entry with matching person_entity_id         -#}
          {#-     Fallback: slug convention (person.user → label 'user'         -#}
          {#-               ∩ zen_user_cabinet) — self-heals pre-patch members  -#}
          {%- elif rt.startswith('person.') -%}
          {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
          {%- set _hh = states('sensor.zen_default_household_cabinet_resolved') -%}
          {%- set _mbrs = CABS.cabinet_drawer_value(_hh, 'members', {}) | from_json() -%}
          {%- set _mbrs = _mbrs if _mbrs is mapping else {} -%}
          {%- set _all = _mbrs.get('users', []) + _mbrs.get('ai_users', []) -%}
          {%- set _hit = _all | selectattr('person_entity_id', 'defined')
                               | selectattr('person_entity_id', 'equalto', rt)
                               | first | default(none) -%}
          {%- if _hit -%}
            {{- _hit.entity_id -}}
          {%- else -%}
            {%- set _slug = rt | replace('person.', '') -%}
            {%- set _cands = label_entities(_slug) | select('match', 'sensor\.')
                             | select('in', label_entities('zen_user_cabinet')) | list -%}
            {{- _cands | first | default(None) -}}
          {%- endif -%}
          
          {#- --- 2. Preserve full cabinet sensors verbatim --- -#}
          {%- elif rt.startswith('sensor.') -%}
            {{- rt -}}
          
          {#- --- 3. Accept UUID formats (with/without hyphens, case-insensitive) --- -#}
          {%- elif rt is match('(?i)^[0-9a-f]{8}-?[0-9a-f]{4}-?[0-9a-f]{4}-?[0-9a-f]{4}-?[0-9a-f]{12}$') -%}
            {{- rt -}}
          
          {#- --- 4. Reject ANYTHING containing a dot that isn't person/sensor --- -#}
          {%- elif '.' in rt -%}
            {{- None -}}
          
          {#- --- 5. Otherwise treat as a plain label --- -#}
          {%- else -%} 
            {{- rt -}}
          {%- endif -%}

    # ── Step 2: resolve identity ────────────────────────────────────────────
    - variables:
        cab_json: >
          {% import 'zenos_ai/zen_os_1.jinja' as zen %}
          {{- zen.identity_resolve_source(normalized) -}}

        cab: >
          {%- set raw = cab_json | trim -%}
          
          {#- 0. Empty/None → valid empty result -#}
          {%- if raw in ['', None] -%}
            {{- {'result': [], 'error': 'empty_input'} | tojson -}}
          
          {#- 1. Detect 'not_found' blocks BEFORE from_json -#}
          {%- elif '"error"' in raw and '"not_found"' in raw -%}
            {{- {'result': [], 'error': 'not_found'} | tojson -}}
          
          {#- 2. Attempt normal JSON load #}
          {%- else -%}
            {{- raw | from_json | tojson -}}
          {%- endif %}

    # ── Step 3a: mode = prompt → render capsule ─────────────────────────────
    - choose:
        - conditions: "{{- _mode == 'prompt' -}}"
          sequence:
            - variables:
                _capsule_raw: >-
                  {% import 'zenos_ai/zen_os_1.jinja' as zen %}
                  {%- set identity_block = cab if cab is mapping else (cab | from_json) -%}
                  {%- if not identity_block.get('identity', {}).get('name', '') -%}
                    {%- set identity_block = zen.identity_resolve_source(states('sensor.zen_default_ai_user_cabinet_resolved')) -%}
                  {%- endif -%}
                  {{- zen.ai_capsule(identity_block) -}}
                _health_raw: >-
                  {% import 'zenos_ai/zen_os_1.jinja' as zen %}
                  {{- zen.prompt_health_check() -}}
            - variables:
                _capsule: >-
                  {%- set raw = _capsule_raw | trim -%}
                  {%- if raw.startswith('{') or raw.startswith('[') -%}
                    {{- raw | from_json | tojson -}}
                  {%- else -%}
                    {{- {'rendered': raw} | tojson -}}
                  {%- endif -%}
                _health: >-
                  {%- set raw = _health_raw | trim -%}
                  {%- if raw.startswith('{') -%}
                    {{- raw | from_json | tojson -}}
                  {%- else -%}
                    {{- {} | tojson -}}
                  {%- endif -%}
            - variables:
                response: >
                  {{-
                    {
                      'mode':               'prompt',
                      'target_normalized':  normalized,
                      'identity':           cab,
                      'capsule':            _capsule,
                      'prompt_health':      _health,
                      'timestamp':          now().isoformat(),
                      'caller_token':       caller_token | default('')
                    }
                  -}}
            - stop: Prompt render complete
              response_variable: response

    # ── Step 3b2: mode = render_prompt → full assembled prompt ───────────────
    - choose:
        - conditions: "{{- _mode == 'render_prompt' -}}"
          sequence:
            - variables:
                _full_raw: >-
                  {%- import 'zenos_ai/zen_os_1.jinja' as zen -%}
                  {{ zen.render_prompt(states('input_text.zenos_persona_name')) }}
            - variables:
                response: >
                  {{-
                    {
                      'mode':        'render_prompt',
                      'persona':     states('input_text.zenos_persona_name'),
                      'rendered':    _full_raw | trim | from_json({'raw': _full_raw | trim}) if (_full_raw | trim).startswith('{') else {'raw': _full_raw | trim},
                      'chars':       _full_raw | trim | length,
                      'timestamp':   now().isoformat(),
                      'caller_token': caller_token | default('')
                    }
                  -}}
            - stop: Full prompt render complete
              response_variable: response

    # ── Step 3c: mode = build_identity_manifest ─────────────────────────────
    - choose:
        - conditions: "{{- _mode == 'build_identity_manifest' -}}"
          sequence:
            - variables:
                _hh_cab: "{{- _hh_target -}}"
            - if: "{{- _hh_cab in ['', 'unknown', 'unavailable'] -}}"
              then:
                - variables:
                    response: >
                      {{-
                        {
                          'mode':      'build_identity_manifest',
                          'status':    'error',
                          'message':   'Household cabinet unavailable — cannot write zen_identity_manifest.',
                          'timestamp': now().isoformat()
                        }
                      -}}
                - stop: Household cabinet unavailable
                  response_variable: response
            - variables:
                _roster_raw: >-
                  {% import 'zenos_ai/zen_os_1.jinja' as zen %}
                  {{- zen.identity_roster() -}}
                # @todo - surely no need to check what is in _roster_raw? - we control its contents - it's a JSON-Stringified dict
                _roster: >-
                  {%- set raw = _roster_raw | trim -%}
                  {%- if raw.startswith('{') -%}
                    {{- raw | from_json | tojson -}}
                  {%- else -%}
                    {{- {'status': 'error', 'count': 0, 'roster': []} | tojson -}}
                  {%- endif -%}
            # — build household tree to depth 2 alongside flat roster —
            - variables:
                _hh_vi_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _vi = CABS.cabinet_drawer_value(_hh_cab, 'AI_Cabinet_VolumeInfo', {}) | from_json() -%}
                  {{- _vi -}}
                _hh_members_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _m = CABS.cabinet_drawer_value(_hh_cab, 'members', {}) | from_json() -%}
                  {{- _m -}}
                # @todo - need to modify CABS.cabinet_drawer_value() so it can take a list of keys and return the first one that exists
                _hh_profile_raw: >-
                  {%- set _v = state_attr(_hh_cab, 'variables') | default({}, true) -%}
                  {%- set _v = _v if _v is mapping else {} -%}
                  {%- set _p = _v.get('_household_profile', _v.get('household_profile', {})) -%}
                  {%- set _p = _p.get('value', _p) if _p is mapping else {} -%}
                  {%- set _p = _p | from_json if _p is string else _p -%}
                  {{- _p -}}
            - variables:
                _hh_tree: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _vi = _hh_vi_raw -%}
                  {%- set _m = _hh_members_raw -%}
                  {%- set _hp = _hh_profile_raw -%}
                  {%- set _acls = _vi.get('acls', {}) -%}
                  {%- set _acls = _acls if _acls is mapping else {} -%}
                  {%- set _owners = _acls.get('owner', []) -%}
                  {%- set _partners = _acls.get('partner', []) -%}
                  {%- set _prime = _partners | selectattr('role', 'defined') | selectattr('role', 'equalto', 'prime') | list -%}
                  {%- set _ns = namespace(fams=[]) -%}{# FG-25: namespace required for list mutation inside for-loop #}
                  {%- for fam in _m.get('families', []) -%}
                    {%- set _fc_entity_id = fam.get('entity_id', '') -%}
                    {%- set _fvi = CABS.cabinet_drawer_value(_fc_entity_id, 'AI_Cabinet_VolumeInfo', {}) | from_json() -%}
                    {%- set _fm = CABS.cabinet_drawer_value(_fc_entity_id, 'members', {}) | from_json() -%}
                    {%- set _facls = _fvi.get('acls', {}) | default({}, true) -%}
                    {%- set _facls = _facls if _facls is mapping else {} -%}
                    {%- set _fowners = _facls.get('owner', []) -%}
                    {%- set _fpartners = _facls.get('partner', []) -%}
                    {%- set _fprime = _fpartners | selectattr('role', 'defined') | selectattr('role', 'equalto', 'prime') | list -%}
                    {%- set _nsf = namespace(subfams=[]) -%}{# FG-25: namespace required for list mutation inside for-loop #}
                    {%- for sf in _fm.get('families', []) -%}
                      {%- set _sf_entity_id = sf.get('entity_id', '') -%}
                      {%- set _sfvi = CABS.cabinet_drawer_value(_sf_entity_id, 'AI_Cabinet_VolumeInfo', {}) | from_json() -%}
                      {%- set _sfm = CABS.cabinet_drawer_value(_sf_entity_id, 'members', {}) | from_json() -%}
                      {%- set _nsf.subfams = _nsf.subfams + [{
                        'entity_id': _sf_entity_id,
                        'guid': _sfvi.get('id', _sfvi.get('guid', '')),
                        'name': sf.get('name', _sfvi.get('friendly_name', _sfvi.get('name', _sf_entity_id))),
                        'depth': 2,
                        'members': {'users': _sfm.get('users', []), 'ai_users': _sfm.get('ai_users', [])}
                      }] -%}
                    {%- endfor -%}
                    {%- set _ns.fams = _ns.fams + [{
                      'entity_id': _fc_entity_id,
                      'guid': _fvi.get('id', _fvi.get('guid', '')),
                      'name': fam.get('name', _fvi.get('friendly_name', _fvi.get('name', _fc_entity_id))),
                      'depth': fam.get('depth', 1),
                      'principals': {'hoh': _fowners[0] if _fowners | count > 0 else none, 'prime': _fprime[0] if _fprime | count > 0 else none},
                      'members': {'users': _fm.get('users', []), 'ai_users': _fm.get('ai_users', []), 'families': _nsf.subfams}
                    }] -%}
                  {%- endfor -%}
                  {{
                    {
                      'entity_id': _hh_cab,
                      'guid': _vi.get('id', _vi.get('guid', '')),
                      'name': _hp.get('friendly_name', _hp.get('name', _vi.get('friendly_name', _vi.get('name', _hh_cab)))),
                      'principals': {'hoh': _owners[0] if _owners | count > 0 else none, 'prime': _prime[0] if _prime | count > 0 else none},
                      'members': {'users': _m.get('users', []), 'ai_users': _m.get('ai_users', []), 'families': _ns.fams}
                    } | tojson
                  }}
                # ------------------------------------------------------------------------------------
                # @note - _manifest: a dict with two keys each having a JSON-STRINGIFIED DICT ()
                # ------------------------------------------------------------------------------------
                _manifest: >-
                  {{
                    {
                      'roster': _roster,
                      'tree':   _hh_tree
                    } | tojson
                  }}
            - action: script.zen_dojotools_filecabinet
              data:
                action_type: create
                force_action: true
                set_timestamp: true
                show_hidden_volumes: false
                volume_entity_id:
                  - "{{- _hh_cab -}}"
                key: zen_identity_manifest
                value: "{{- _manifest -}}"
            - variables:
                response: >
                  {{-
                    {
                      'mode':              'build_identity_manifest',
                      'status':            'ok',
                      'household_cabinet': _hh_cab,
                      'manifest':          _manifest,
                      'timestamp':         now().isoformat(),
                      'caller_token':      caller_token | default('')
                    }
                  -}}
            - event: zen_event
              event_data:
                event:
                  kind: identity_manifest_rebuild
                  component: zen_dojotools_identity
                  severity: info
                  summary: Manifest rebuild triggered by build_identity_manifest.
            - stop: Identity manifest written
              response_variable: response

    # ── Step 3d: mode = household_add_family ────────────────────────────────
    - choose:
        - conditions: "{{- _mode == 'household_add_family' -}}"
          sequence:
            - variables:
                _hh_cab: "{{- _hh_target -}}"
            - if: "{{- _hh_cab in ['', 'unknown', 'unavailable'] or family_entity == '' -}}"
              then:
                - variables:
                    response: > 
                      {{-
                        {
                          'mode':      'household_add_family',
                          'status':    'error',
                          'message':   'household_cabinet and family_entity are both required.',
                          'timestamp': now().isoformat()
                        }
                      -}}
                - stop: Missing required fields
                  response_variable: response
            - variables:
                _fam_vi_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _vi = CABS.cabinet_drawer_value(family_entity, 'AI_Cabinet_VolumeInfo', {}) | from_json() -%}
                  {{- _vi | tojson -}}
                _hh_members_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _vi = CABS.cabinet_drawer_value(_hh_cab, 'members', {}) | from_json() -%}
                  {{- _vi | tojson -}}
            - variables:
                _fam_vi: "{{- _fam_vi_raw | from_json if _fam_vi_raw is string else _fam_vi_raw -}}"
                _fam_guid: >-
                  {%- set _vi = _fam_vi_raw | from_json if _fam_vi_raw is string else _fam_vi_raw -%}
                  {%- set _vi = _vi if _vi is mapping else {} -%}
                  {%- set _existing = _vi.get('id', _vi.get('guid', '')) | string | trim -%}
                  {%- if _existing != '' -%}
                    {{- _existing -}}
                  {%- else -%}
                    {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                    {{- CABS.cabinet_guid_new() | default('') -}}
                  {%- endif -%}
                _fam_guid_is_new: >-
                  {%- set _vi = _fam_vi_raw | from_json if _fam_vi_raw is string else _fam_vi_raw -%}
                  {%- set _vi = _vi if _vi is mapping else {} -%}
                  {{- _vi.get('id', _vi.get('guid', '')) | string | trim == '' -}}
                # @todo - need to modify CABS.cabinet_drawer_value() so it can take a list of keys and return the first one that exists
                _fam_name: >-
                  {%- set _fv = state_attr(family_entity, 'variables') | default({}, true) -%}
                  {%- set _fv = _fv if _fv is mapping else {} -%}
                  {%- set _fp_r = _fv.get('_family_profile', _fv.get('family_profile', {})) -%}
                  {%- set _fp = _fp_r.get('value', _fp_r) if _fp_r is mapping else {} -%}
                  {%- set _fp = _fp | from_json if _fp is string else _fp -%}
                  {%- set _d = _fp.get('display_name', _fp.get('friendly_name', _fp.get('name', ''))) | trim -%}
                  {%- set _vi = _fam_vi_raw | from_json if _fam_vi_raw is string else _fam_vi_raw -%}
                  {%- set _vi = _vi if _vi is mapping else {} -%}
                  {{- _d if _d != '' else _vi.get('friendly_name', family_entity) -}}
                _hh_members: "{{- _hh_members_raw | from_json if _hh_members_raw is string else _hh_members_raw -}}"
            - if: "{{- _fam_guid_is_new | bool -}}"
              then:
                - variables:
                    _fam_vi_stamped: >-
                      {%- set _vi = _fam_vi_raw | from_json if _fam_vi_raw is string else _fam_vi_raw -%}
                      {%- set _vi = _vi if _vi is mapping else {} -%}
                      {{- dict(_vi, **{'guid': _fam_guid}) | tojson -}}
                - event: set_variable_legacy
                  event_data:
                    key: AI_Cabinet_VolumeInfo
                    value: "{{- _fam_vi_stamped -}}"
                    volume_entity: "{{- family_entity -}}"
                    set_timestamp: true
            - variables:
                _existing_fams: >-
                  {%- set _m = _hh_members_raw | from_json if _hh_members_raw is string else _hh_members_raw -%}
                  {%- set _m = _m if _m is mapping else {} -%}
                  {{- _m.get('families', []) | tojson -}}
                _new_fam_entry: >-
                  {{
                    {
                      'guid':      _fam_guid,
                      'entity_id': family_entity,
                      'name':      _fam_name,
                      'depth':     1
                    } | tojson
                  }}
            - variables:
                _already_member: >-
                  {%- set _fams = _existing_fams | from_json if _existing_fams is string else _existing_fams -%}
                  {%- set _fams = _fams if _fams is iterable and _fams is not string else [] -%}
                  {{- _fams | selectattr('entity_id', 'equalto', family_entity) | list | count > 0 -}}
            - if: "{{- _already_member | bool -}}"
              then:
                - variables:
                    response: >
                      {{-
                        {
                          'mode':           'household_add_family',
                          'status':         'already_member',
                          'family_entity':  family_entity,
                          'household_cabinet': _hh_cab,
                          'timestamp':      now().isoformat()
                        }
                      -}}
                - stop: Already a household member
                  response_variable: response
            - variables:
                _updated_members: >-
                  {%- set _m = _hh_members_raw | from_json if _hh_members_raw is string else _hh_members_raw -%}
                  {%- set _m = _m if _m is mapping else {} -%}
                  {%- set _fams = _m.get('families', []) -%}
                  {%- set _fams = _fams if _fams is iterable and _fams is not string else [] -%}
                  {%- set _entry = _new_fam_entry | from_json if _new_fam_entry is string else _new_fam_entry -%}
                  {{
                    dict(_m, **{'families': _fams + [_entry]}) | tojson
                  }}
            - action: script.zen_dojotools_filecabinet
              data:
                action_type: create
                force_action: true
                set_timestamp: true
                show_hidden_volumes: false
                volume_entity_id:
                  - "{{- _hh_cab -}}"
                key: members
                value: "{{- _updated_members -}}"
            - variables:
                response: >-
                  {{-
                    {
                      'mode':              'household_add_family',
                      'status':            'ok',
                      'household_cabinet': _hh_cab,
                      'family_entity':     family_entity,
                      'family_guid':       _fam_guid | default('') | string,
                      'family_name':       _fam_name | default('') | string,
                      'timestamp':         now().isoformat(),
                      'caller_token':      caller_token | default('')
                    } | tojson
                  -}}
            - action: script.zen_dojotools_identity
              data:
                mode: build_identity_manifest
                household_entity: "{{- _hh_cab -}}"
              continue_on_error: true
            - stop: Household family added
              response_variable: response

    # ── Step 3d-2: mode = household_remove_family ────────────────────────────
    - choose:
        - conditions: "{{- _mode == 'household_remove_family' -}}"
          sequence:
            - variables:
                _hh_cab: "{{- _hh_target -}}"
            - if: "{{- _hh_cab in ['', 'unknown', 'unavailable'] or family_entity == '' -}}"
              then:
                - variables:
                    response: >
                      {{-
                        {
                          'mode':    'household_remove_family',
                          'status':  'error',
                          'message': 'household_cabinet and family_entity are both required.',
                          'timestamp': now().isoformat()
                        }
                      -}}
                - stop: Missing required fields
                  response_variable: response
            - variables:
                _hh_members_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _m = CABS.cabinet_drawer_value(_hh_cab, 'members', {}) | from_json() -%}
                  {{- _m | tojson -}}
            - variables:
                _updated_members: >-
                  {%- set _m = _hh_members_raw | from_json if _hh_members_raw is string else _hh_members_raw -%}
                  {%- set _m = _m if _m is mapping else {} -%}
                  {%- set _fams = _m.get('families', []) -%}
                  {%- set _fams = _fams if _fams is iterable and _fams is not string else [] -%}
                  {%- set _filtered = _fams | rejectattr('entity_id', 'equalto', family_entity) | list -%}
                  {{- dict(_m, **{'families': _filtered}) | tojson -}}
            - action: script.zen_dojotools_filecabinet
              data:
                action_type: create
                force_action: true
                set_timestamp: true
                show_hidden_volumes: false
                volume_entity_id:
                  - "{{- _hh_cab -}}"
                key: members
                value: "{{- _updated_members -}}"
            - variables:
                response: >
                  {{-
                    {
                      'mode':              'household_remove_family',
                      'status':            'ok',
                      'household_cabinet': _hh_cab,
                      'family_entity':     family_entity,
                      'timestamp':         now().isoformat(),
                      'caller_token':      caller_token | default('')
                    }
                  -}}
            - action: script.zen_dojotools_identity
              data:
                mode: build_identity_manifest
                household_entity: "{{- _hh_cab -}}"
              continue_on_error: true
            - stop: Household family removed
              response_variable: response

    # ── Step 3e: mode = household_add_member ─────────────────────────────────
    - choose:
        - conditions: "{{- _mode == 'household_add_member' -}}"
          sequence:
            - variables:
                _hh_cab: "{{- _hh_target -}}"
            - if: "{{- _hh_cab in ['', 'unknown', 'unavailable'] or member_entity == '' -}}"
              then:
                # household_entity has a working default fallback
                # (sensor.zen_default_household_cabinet_resolved) — it almost
                # never actually fails this check. The old message blamed
                # BOTH fields every time regardless of which one actually
                # caused it, and even named a field ('household_cabinet')
                # that doesn't exist — the real field is household_entity.
                # Report which specific field is actually missing.
                - variables:
                    response: >
                      {{-
                        {
                          'mode':    'household_add_member',
                          'status':  'error',
                          'message': (
                            'member_entity is required.'
                            if _hh_cab not in ['', 'unknown', 'unavailable']
                            else 'No household could be resolved (household_entity was not given and the default household resolver is unavailable), and member_entity is required.'
                          ),
                          'timestamp': now().isoformat()
                        }
                      -}}
                - stop: Missing required fields
                  response_variable: response
            - variables:
                _hh_vi_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _vi = CABS.cabinet_drawer_value(_hh_cab, 'AI_Cabinet_VolumeInfo', {}) | from_json() -%}
                  {{- _vi | tojson -}}
                _hh_members_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _m = CABS.cabinet_drawer_value(_hh_cab, 'members', {}) | from_json() -%}
                  {{- _m | tojson -}}
                _mem_vi_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _vi = CABS.cabinet_drawer_value(member_entity, 'AI_Cabinet_VolumeInfo', {}) | from_json() -%}
                  {{- _vi | tojson -}}
            - variables:
                _hh_vi: "{{- _hh_vi_raw | from_json if _hh_vi_raw is string else (_hh_vi_raw if _hh_vi_raw is mapping else {}) -}}"
                _mem_vi: "{{- _mem_vi_raw | from_json if _mem_vi_raw is string else (_mem_vi_raw if _mem_vi_raw is mapping else {}) -}}"
                _hh_acls: >-
                  {%- set _vi = _hh_vi_raw | from_json if _hh_vi_raw is string else _hh_vi_raw -%}
                  {%- set _vi = _vi if _vi is mapping else {} -%}
                  {{- _vi.get('acls', {}) | tojson -}}
                _mem_guid: >-
                  {%- set _vi = _mem_vi_raw | from_json if _mem_vi_raw is string else _mem_vi_raw -%}
                  {%- set _vi = _vi if _vi is mapping else {} -%}
                  {%- set _existing = _vi.get('id', _vi.get('guid', '')) | string | trim -%}
                  {%- if _existing != '' -%}{{- _existing -}}{%- else -%}
                    {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                    {{- CABS.cabinet_guid_new() | default('') -}}
                  {%- endif -%}
                _mem_guid_is_new: >-
                  {%- set _vi = _mem_vi_raw | from_json if _mem_vi_raw is string else _mem_vi_raw -%}
                  {%- set _vi = _vi if _vi is mapping else {} -%}
                  {{- _vi.get('id', _vi.get('guid', '')) | string | trim == '' -}}
                # @todo - need to modify CABS.cabinet_drawer_value() so it can take a list of keys and return the first one that exists
                _mem_name: >-
                  {%- set _mv = state_attr(member_entity, 'variables') | default({}, true) -%}
                  {%- set _mv = _mv if _mv is mapping else {} -%}
                  {%- set _up_r = _mv.get('_user_profile', _mv.get('user_profile', _mv.get('_family_profile', _mv.get('family_profile', {})))) -%}
                  {%- set _up = _up_r.get('value', _up_r) if _up_r is mapping else {} -%}
                  {%- set _up = _up | from_json if _up is string else _up -%}
                  {%- set _pn = _up.get('preferred_name', '') | trim -%}
                  {%- set _fn = _up.get('first_name', '') | trim -%}
                  {%- set _ln = _up.get('last_name', '') | trim -%}
                  {%- set _d = _pn if _pn != '' else ((_fn + ' ' + _ln) | trim) -%}
                  {%- set _vi = _mem_vi_raw | from_json if _mem_vi_raw is string else _mem_vi_raw -%}
                  {%- set _vi = _vi if _vi is mapping else {} -%}
                  {{- _d if _d != '' else _vi.get('friendly_name', member_entity) -}}
            - if: "{{- _mem_guid_is_new | bool -}}"
              then:
                - variables:
                    _mem_vi_guid_stamped: >-
                      {%- set _vi = _mem_vi_raw | from_json if _mem_vi_raw is string else _mem_vi_raw -%}
                      {%- set _vi = _vi if _vi is mapping else {} -%}
                      {{- dict(_vi, **{'guid': _mem_guid}) | tojson -}}
                - event: set_variable_legacy
                  event_data:
                    key: AI_Cabinet_VolumeInfo
                    value: "{{- _mem_vi_guid_stamped -}}"
                    volume_entity: "{{- member_entity -}}"
                    set_timestamp: true
            - variables:
                _acls: "{{- _hh_acls | from_json if _hh_acls is string else (_hh_acls if _hh_acls is mapping else {}) -}}"
                _prime_occupied: >-
                  {%- set _a = _hh_acls | from_json if _hh_acls is string else _hh_acls -%}
                  {%- set _a = _a if _a is mapping else {} -%}
                  {%- set _partners = _a.get('partner', []) -%}
                  {%- set _partners = _partners if _partners is iterable and _partners is not string else [] -%}
                  {{- _partners | selectattr('role', 'equalto', 'prime') | list | count > 0 -}}
                _hoh_occupied: >-
                  {%- set _a = _hh_acls | from_json if _hh_acls is string else _hh_acls -%}
                  {%- set _a = _a if _a is mapping else {} -%}
                  {{- _a.get('owner', []) | list | count > 0 -}}
            - if: >-
                {{- (member_type == 'ai_user' and _prime_occupied | bool)
                   or (member_type == 'user' and _hoh_occupied | bool) -}}
              then:
                - variables:
                    response: >
                      {{-
                        {
                          'mode':          'household_add_member',
                          'status':        'error',
                          'code':          'slot_occupied',
                          'message':       ('prime AI partner' if member_type == 'ai_user' else 'Head of Household') ~ ' slot is already occupied for this household. Use an admin operation to transfer.',
                          'member_entity': member_entity,
                          'member_type':   member_type,
                          'timestamp':     now().isoformat()
                        }
                      -}}
                - stop: Prime or HoH slot occupied
                  response_variable: response
            - variables:
                _list_key: "{{- 'ai_users' if member_type == 'ai_user' else 'users' -}}"
                _hh_members: "{{- _hh_members_raw | from_json if _hh_members_raw is string else _hh_members_raw -}}"
            - variables:
                _existing_list: >-
                  {%- set _m = _hh_members_raw | from_json if _hh_members_raw is string else _hh_members_raw -%}
                  {%- set _m = _m if _m is mapping else {} -%}
                  {{- _m.get(_list_key, []) | tojson -}}
            - variables:
                _already_member: >-
                  {%- set _lst = _existing_list | from_json if _existing_list is string else _existing_list -%}
                  {%- set _lst = _lst if _lst is iterable and _lst is not string else [] -%}
                  {{- _lst | selectattr('entity_id', 'equalto', member_entity) | list | count > 0 -}}
            # Previously: already_member unconditionally stopped here, even
            # when the slot itself was still empty. That's a real dead end —
            # if an earlier call added membership but failed before reaching
            # the slot-fill step below (or the slot was cleared some other
            # way), this member could never retry filling it via this mode
            # again; only a direct set_principal call could unblock it. We
            # already know at this point (having passed the slot_occupied
            # gate above) that the relevant slot is free, so just skip the
            # redundant membership write and fall through to fill it.
            - if: "{{- not (_already_member | bool) -}}"
              then:
                - variables:
                    _new_entry: >-
                      {%- set _pid = user_entity_id | default('') | trim -%}
                      {{- {
                        'guid':             _mem_guid,
                        'entity_id':        member_entity,
                        'name':             _mem_name,
                        'person_entity_id': _pid if _pid != '' else none
                      } | tojson -}}
                    _updated_members: >-
                      {%- set _m = _hh_members_raw | from_json if _hh_members_raw is string else _hh_members_raw -%}
                      {%- set _m = _m if _m is mapping else {} -%}
                      {%- set _lst = _m.get(_list_key, []) -%}
                      {%- set _lst = _lst if _lst is iterable and _lst is not string else [] -%}
                      {%- set _entry = _new_entry | from_json if _new_entry is string else _new_entry -%}
                      {{- dict(_m, **{_list_key: _lst + [_entry]}) | tojson -}}
                - action: script.zen_dojotools_filecabinet
                  data:
                    action_type: create
                    force_action: true
                    set_timestamp: true
                    show_hidden_volumes: false
                    volume_entity_id:
                      - "{{- _hh_cab -}}"
                    key: members
                    value: "{{- _updated_members -}}"
            # — first occupant fills the prime/HoH slot in VolumeInfo.acls —
            - variables:
                _slot_filled: >-
                  {{- (member_type == 'user' and not _hoh_occupied | bool)
                     or (member_type == 'ai_user' and not _prime_occupied | bool) -}}
                _hh_vi_updated: >-
                  {%- if (member_type == 'user' and not _hoh_occupied | bool)
                         or (member_type == 'ai_user' and not _prime_occupied | bool) -%}
                    {%- set _vi = _hh_vi_raw | from_json if _hh_vi_raw is string else _hh_vi_raw -%}
                    {%- set _vi = _vi if _vi is mapping else {} -%}
                    {%- set _acls = _vi.get('acls', {}) -%}
                    {%- set _acls = _acls if _acls is mapping else {} -%}
                    {%- if member_type == 'user' -%}
                      {%- set _owner = _acls.get('owner', []) + [{'guid': _mem_guid, 'entity_id': member_entity}] -%}
                      {%- set _acls = dict(_acls, **{'owner': _owner}) -%}
                    {%- else -%}
                      {%- set _partners = _acls.get('partner', []) + [{'guid': _mem_guid, 'entity_id': member_entity, 'role': 'prime'}] -%}
                      {%- set _acls = dict(_acls, **{'partner': _partners}) -%}
                    {%- endif -%}
                    {{- dict(_vi, **{'acls': _acls}) | tojson -}}
                  {%- else -%}
                    {{- '' -}}
                  {%- endif -%}
            - if: "{{- _slot_filled | bool and _hh_vi_updated | trim != '' -}}"
              then:
                - event: set_variable_legacy
                  event_data:
                    key: AI_Cabinet_VolumeInfo
                    value: "{{- _hh_vi_updated -}}"
                    volume_entity: "{{- _hh_cab -}}"
                    set_timestamp: true
            - variables:
                _slot_name: >-
                  {%- if member_type == 'user' and _slot_filled | bool -%}hoh
                  {%- elif member_type == 'ai_user' and _slot_filled | bool -%}prime
                  {%- else -%}{%- endif -%}
            - event: zen_event
              event_data:
                kind: household_member_joined
                household_cabinet: "{{- _hh_cab -}}"
                member_entity: "{{- member_entity -}}"
                member_name: "{{- _mem_name -}}"
                member_type: "{{- member_type -}}"
                slot_filled: "{{- _slot_name -}}"
                prompt_profile_update: "{{- member_type == 'ai_user' -}}"
            - variables:
                response: >
                  {{-
                    {
                      'mode':              'household_add_member',
                      'status':            'ok',
                      'household_cabinet': _hh_cab,
                      'member_entity':     member_entity,
                      'member_type':       member_type,
                      'member_guid':       _mem_guid,
                      'member_name':       _mem_name,
                      'slot_filled':       _slot_name,
                      'timestamp':         now().isoformat(),
                      'caller_token':      caller_token | default('')
                    }
                  -}}
            - action: script.zen_dojotools_identity
              data:
                mode: build_identity_manifest
                household_entity: "{{- _hh_cab -}}"
              continue_on_error: true
            - stop: Household member added
              response_variable: response

    # ── Step 3f: mode = household_remove_member ──────────────────────────────
    - choose:
        - conditions: "{{- _mode == 'household_remove_member' -}}"
          sequence:
            - variables:
                _hh_cab: "{{- _hh_target -}}"
            - if: "{{- _hh_cab in ['', 'unknown', 'unavailable'] or member_entity == '' -}}"
              then:
                - variables:
                    response: >
                      {{-
                        {
                          'mode':    'household_remove_member',
                          'status':  'error',
                          'message': (
                            'member_entity is required.'
                            if _hh_cab not in ['', 'unknown', 'unavailable']
                            else 'No household could be resolved (household_entity was not given and the default household resolver is unavailable), and member_entity is required.'
                          ),
                          'timestamp': now().isoformat()
                        }
                      -}}
                - stop: Missing required fields
                  response_variable: response
            - variables:
                _list_key: "{{- 'ai_users' if member_type == 'ai_user' else 'users' -}}"
                _hh_members_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _m = CABS.cabinet_drawer_value(_hh_cab, 'members', {}) | from_json() -%}
                  {{- _m | tojson -}}
                _hh_vi_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _vi = CABS.cabinet_drawer_value(_hh_cab, 'AI_Cabinet_VolumeInfo', {}) | from_json() -%}
                  {{- _vi | tojson -}}
            - variables:
                _updated_members: >-
                  {%- set _m = _hh_members_raw | from_json if _hh_members_raw is string else _hh_members_raw -%}
                  {%- set _m = _m if _m is mapping else {} -%}
                  {%- set _lst = _m.get(_list_key, []) -%}
                  {%- set _lst = _lst if _lst is iterable and _lst is not string else [] -%}
                  {%- set _filtered = _lst | rejectattr('entity_id', 'equalto', member_entity) | list -%}
                  {{- dict(_m, **{_list_key: _filtered}) | tojson -}}
                _principal_warning: >-
                  {%- set _vi = _hh_vi_raw | from_json if _hh_vi_raw is string else _hh_vi_raw -%}
                  {%- set _vi = _vi if _vi is mapping else {} -%}
                  {%- set _acls = _vi.get('acls', {}) -%}
                  {%- set _acls = _acls if _acls is mapping else {} -%}
                  {%- set _own = _acls.get('owner', []) -%}
                  {%- set _prt = _acls.get('partner', []) -%}
                  {%- set _is_hoh = _own | selectattr('entity_id', 'equalto', member_entity) | list | count > 0 -%}
                  {%- set _is_prime = _prt | selectattr('entity_id', 'equalto', member_entity) | selectattr('role', 'defined') | selectattr('role', 'equalto', 'prime') | list | count > 0 -%}
                  {%- if _is_hoh -%}hoh_slot_stale
                  {%- elif _is_prime -%}prime_slot_stale
                  {%- else -%}{%- endif -%}
            - action: script.zen_dojotools_filecabinet
              data:
                action_type: create
                force_action: true
                set_timestamp: true
                show_hidden_volumes: false
                volume_entity_id:
                  - "{{- _hh_cab -}}"
                key: members
                value: "{{- _updated_members -}}"
            - event: zen_event
              event_data:
                kind: household_member_left
                household_cabinet: "{{- _hh_cab -}}"
                member_entity: "{{- member_entity -}}"
                member_type: "{{- member_type -}}"
                principal_warning: "{{- _principal_warning -}}"
                prompt_profile_update: "{{- member_type == 'ai_user' -}}"
            - variables:
                response: > 
                  {{-
                    {
                      'mode':              'household_remove_member',
                      'status':            'ok',
                      'household_cabinet': _hh_cab,
                      'member_entity':     member_entity,
                      'member_type':       member_type,
                      'principal_warning': _principal_warning,
                      'timestamp':         now().isoformat(),
                      'caller_token':      caller_token | default('')
                    }
                  -}}
            - action: script.zen_dojotools_identity
              data:
                mode: build_identity_manifest
                household_entity: "{{- _hh_cab -}}"
              continue_on_error: true
            - stop: Household member removed
              response_variable: response

    # ── Step 3f-2: mode = set_principal ─────────────────────────────────────
    # Works on households or families — family_entity overrides default household.
    - choose:
        - conditions: "{{- _mode == 'set_principal' -}}"
          sequence:
            - variables:
                _target_cab: >-
                  {%- if family_entity | trim != '' -%}
                    {{- family_entity | trim -}}
                  {%- else -%}
                    {{- _hh_target -}}
                  {%- endif -%}
            - if: "{{- _target_cab in ['', 'unknown', 'unavailable'] or member_entity == '' -}}"
              then:
                - variables:
                    response: >
                      {{-
                        {
                          'mode':    'set_principal',
                          'status':  'error',
                          'message': 'A target cabinet (family_entity or default household) and member_entity are both required.',
                          'timestamp': now().isoformat()
                        }
                      -}}
                - stop: Missing required fields
                  response_variable: response
            - variables:
                _hh_vi_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _vi = CABS.cabinet_drawer_value(_target_cab, 'AI_Cabinet_VolumeInfo', {}) | from_json() -%}
                  {{- _vi | tojson -}}
                _mem_vi_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _vi = CABS.cabinet_drawer_value(member_entity, 'AI_Cabinet_VolumeInfo', {}) | from_json() -%}
                  {{- _vi | tojson -}}
            - variables:
                _mem_guid: >-
                  {%- set _vi = _mem_vi_raw | from_json if _mem_vi_raw is string else _mem_vi_raw -%}
                  {{- (_vi if _vi is mapping else {}).get('id', (_vi if _vi is mapping else {}).get('guid', '')) -}}
                # @todo - need to modify CABS.cabinet_drawer_value() so it can take a list of keys and return the first one that exists
                _mem_name: >-
                  {%- set _mv = state_attr(member_entity, 'variables') | default({}, true) -%}
                  {%- set _mv = _mv if _mv is mapping else {} -%}
                  {%- set _up_r = _mv.get('_user_profile', _mv.get('user_profile', _mv.get('_family_profile', _mv.get('family_profile', {})))) -%}
                  {%- set _up = _up_r.get('value', _up_r) if _up_r is mapping else {} -%}
                  {%- set _up = _up | from_json if _up is string else _up -%}
                  {%- set _pn = _up.get('preferred_name', '') | trim -%}
                  {%- set _fn = _up.get('first_name', '') | trim -%}
                  {%- set _ln = _up.get('last_name', '') | trim -%}
                  {%- set _d = _pn if _pn != '' else ((_fn + ' ' + _ln) | trim) -%}
                  {%- set _vi = _mem_vi_raw | from_json if _mem_vi_raw is string else _mem_vi_raw -%}
                  {{- _d if _d != '' else (_vi if _vi is mapping else {}).get('friendly_name', member_entity) -}}
                _sp_acls_check: >-
                  {%- set _vi = _hh_vi_raw | from_json if _hh_vi_raw is string else _hh_vi_raw -%}
                  {%- set _vi = _vi if _vi is mapping else {} -%}
                  {%- set _a = _vi.get('acls', {}) -%}
                  {{- (_a if _a is mapping else {}) -}}
                _sp_existing_owner: >-
                  {%- set _a = _sp_acls_check | from_json if _sp_acls_check is string else _sp_acls_check -%}
                  {%- set _o = _a.get('owner', []) -%}
                  {%- set _o = _o if _o is iterable and _o is not string else [] -%}
                  {{- (_o[0].get('entity_id', '') if (_o | length > 0 and _o[0] is mapping) else '') -}}
                _sp_existing_prime: >-
                  {%- set _a = _sp_acls_check | from_json if _sp_acls_check is string else _sp_acls_check -%}
                  {%- set _p = _a.get('partner', []) -%}
                  {%- set _p = _p if _p is iterable and _p is not string else [] -%}
                  {%- set _prime = _p | selectattr('role', 'equalto', 'prime') | list -%}
                  {{- (_prime[0].get('entity_id', '') if (_prime | length > 0 and _prime[0] is mapping) else '') -}}
            - variables:
                _sp_existing_slot_holder: >-
                  {{- _sp_existing_owner if member_type == 'user' else _sp_existing_prime -}}
                _sp_is_takeover: >-
                  {{- _sp_existing_slot_holder != '' and _sp_existing_slot_holder != member_entity -}}
            - if: "{{- (_sp_is_takeover | bool) and not (confirm_action | default(false) | bool) -}}"
              then:
                - variables:
                    response: >
                      {{-
                        {
                          'mode':    'set_principal',
                          'status':  'blocked',
                          'message': 'Takeover blocked: ' ~ ('HoH' if member_type == 'user' else 'prime') ~ ' slot on ' ~ _target_cab ~ ' is already occupied by ' ~ _sp_existing_slot_holder ~ '. Replacing an established principal with a different entity requires confirm_action: true.',
                          'existing_holder': _sp_existing_slot_holder,
                          'requested_entity': member_entity,
                          'timestamp': now().isoformat()
                        }
                      -}}
                - stop: Takeover blocked
                  response_variable: response
            - variables:
                _hh_vi_updated: >-
                  {%- set _vi = _hh_vi_raw | from_json if _hh_vi_raw is string else _hh_vi_raw -%}
                  {%- set _vi = _vi if _vi is mapping else {} -%}
                  {%- set _acls = _vi.get('acls', {}) -%}
                  {%- set _acls = _acls if _acls is mapping else {} -%}
                  {%- set _mvi = _mem_vi_raw | from_json if _mem_vi_raw is string else _mem_vi_raw -%}
                  {%- set _mguid = (_mvi if _mvi is mapping else {}).get('id', (_mvi if _mvi is mapping else {}).get('guid', '')) -%}
                  {%- if member_type == 'user' -%}
                    {%- set _acls = dict(_acls, **{'owner': [{'guid': _mguid, 'entity_id': member_entity}]}) -%}
                  {%- else -%}
                    {# replace prime entry, keep any non-prime partner entries #}
                    {%- set _partners = _acls.get('partner', []) -%}
                    {%- set _partners = _partners if _partners is iterable and _partners is not string else [] -%}
                    {%- set _others = _partners | rejectattr('role', 'equalto', 'prime') | list -%}
                    {%- set _acls = dict(_acls, **{'partner': _others + [{'guid': _mguid, 'entity_id': member_entity, 'role': 'prime'}]}) -%}
                  {%- endif -%}
                  {{- dict(_vi, **{'acls': _acls}) | tojson -}}
            - event: set_variable_legacy
              event_data:
                key: AI_Cabinet_VolumeInfo
                value: "{{- _hh_vi_updated -}}"
                volume_entity: "{{- _target_cab -}}"
                set_timestamp: true
            # household_add_member keeps 'members' and 'acls' in sync in one
            # call; set_principal only ever wrote acls, which left a caller
            # that used set_principal directly (rather than
            # household_add_member) with a principal pointer that a
            # membership-based staleness check would wrongly flag as
            # orphaned. Mirror that sync here too — dedup, only add if not
            # already present, matching household_add_member's entry shape.
            - variables:
                _sp_list_key: "{{- 'ai_users' if member_type == 'ai_user' else 'users' -}}"
                _sp_members_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _m = CABS.cabinet_drawer_value(_target_cab, 'members', {}) | from_json() -%}
                  {{- _m | tojson -}}
            - variables:
                _sp_updated_members: >-
                  {%- set _m = _sp_members_raw | from_json if _sp_members_raw is string else _sp_members_raw -%}
                  {%- set _m = _m if _m is mapping else {} -%}
                  {%- set _lst = _m.get(_sp_list_key, []) -%}
                  {%- set _lst = _lst if _lst is iterable and _lst is not string else [] -%}
                  {%- set _already = _lst | selectattr('entity_id', 'equalto', member_entity) | list | count > 0 -%}
                  {%- if _already -%}
                    {{- _m | tojson -}}
                  {%- else -%}
                    {%- set _mvi = _mem_vi_raw | from_json if _mem_vi_raw is string else _mem_vi_raw -%}
                    {%- set _mguid = (_mvi if _mvi is mapping else {}).get('id', (_mvi if _mvi is mapping else {}).get('guid', '')) -%}
                    {%- set _entry = {'guid': _mguid, 'entity_id': member_entity, 'name': member_entity} -%}
                    {{- dict(_m, **{_sp_list_key: _lst + [_entry]}) | tojson -}}
                  {%- endif -%}
            - action: script.zen_dojotools_filecabinet
              data:
                action_type: create
                force_action: true
                set_timestamp: true
                show_hidden_volumes: false
                volume_entity_id:
                  - "{{- _target_cab -}}"
                key: members
                value: "{{- _sp_updated_members -}}"
            - variables:
                _slot: "{{- 'hoh' if member_type == 'user' else 'prime' -}}"
                response: >
                  {{-
                    {
                      'mode':           'set_principal',
                      'status':         'ok',
                      'target_cabinet': _target_cab,
                      'slot':              _slot,
                      'member_entity':     member_entity,
                      'member_type':       member_type,
                      'member_guid':       _mem_guid,
                      'member_name':       _mem_name,
                      'timestamp':         now().isoformat(),
                      'caller_token':      caller_token | default('')
                    }
                  -}}
            - event: zen_event
              event_data:
                kind: principal_changed
                target_cabinet: "{{- _target_cab -}}"
                slot: "{{- _slot -}}"
                member_entity: "{{- member_entity -}}"
                member_name: "{{- _mem_name -}}"
                member_type: "{{- member_type -}}"
                prompt_profile_update: true
            - event: zen_event
              event_data:
                event:
                  kind: identity_manifest_rebuild
                  component: zen_dojotools_identity
                  severity: info
                  summary: Manifest rebuild triggered by set_principal.
            - stop: Principal set
              response_variable: response

    # ── Step 3g: mode = family_add_member ────────────────────────────────────
    # Nesting is allowed — resolver caps security resolution at depth 2.
    - choose:
        - conditions: "{{- _mode == 'family_add_member' -}}"
          sequence:
            - if: "{{- family_entity == '' or member_entity == '' -}}"
              then:
                - variables:
                    response: >
                      {{-
                        {
                          'mode':    'family_add_member',
                          'status':  'error',
                          'message': 'family_entity and member_entity are both required.',
                          'timestamp': now().isoformat()
                        }
                      -}}
                - stop: Missing required fields
                  response_variable: response
            - variables:
                _fam_members_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _m = CABS.cabinet_drawer_value(family_entity, 'members', {}) | from_json() -%}
                  {{- _m | tojson -}}
                _mem_vi_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _vi = CABS.cabinet_drawer_value(member_entity, 'AI_Cabinet_VolumeInfo', {}) | from_json() -%}
                  {{- _vi | tojson -}}
                _fam_vi_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _vi = CABS.cabinet_drawer_value(family_entity, 'AI_Cabinet_VolumeInfo', {}) | from_json() -%}
                  {{- _vi | tojson -}}
            - variables:
                _mem_guid: >-
                  {%- set _vi = _mem_vi_raw | from_json if _mem_vi_raw is string else _mem_vi_raw -%}
                  {%- set _vi = _vi if _vi is mapping else {} -%}
                  {%- set _existing = _vi.get('id', _vi.get('guid', '')) | string | trim -%}
                  {%- if _existing != '' -%}{{- _existing -}}{%- else -%}
                    {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                    {{- CABS.cabinet_guid_new() | default('') -}}
                  {%- endif -%}
                # @todo - need to modify CABS.cabinet_drawer_value() so it can take a list of keys and return the first one that exists
                _mem_name: >-
                  {%- set _mv = state_attr(member_entity, 'variables') | default({}, true) -%}
                  {%- set _mv = _mv if _mv is mapping else {} -%}
                  {%- set _up_r = _mv.get('_user_profile', _mv.get('user_profile', _mv.get('_family_profile', _mv.get('family_profile', {})))) -%}
                  {%- set _up = _up_r.get('value', _up_r) if _up_r is mapping else {} -%}
                  {%- set _up = _up | from_json if _up is string else _up -%}
                  {%- set _pn = _up.get('preferred_name', '') | trim -%}
                  {%- set _fn = _up.get('first_name', '') | trim -%}
                  {%- set _ln = _up.get('last_name', '') | trim -%}
                  {%- set _d = _pn if _pn != '' else ((_fn + ' ' + _ln) | trim) -%}
                  {%- set _vi = _mem_vi_raw | from_json if _mem_vi_raw is string else _mem_vi_raw -%}
                  {%- set _vi = _vi if _vi is mapping else {} -%}
                  {{- _d if _d != '' else _vi.get('friendly_name', member_entity) -}}
                _fam_guid: >-
                  {%- set _vi = _fam_vi_raw | from_json if _fam_vi_raw is string else _fam_vi_raw -%}
                  {%- set _vi = _vi if _vi is mapping else {} -%}
                  {{- _vi.get('id', _vi.get('guid', '')) -}}
                # @todo - need to modify CABS.cabinet_drawer_value() so it can take a list of keys and return the first one that exists
                _fam_name: >-
                  {%- set _fv = state_attr(family_entity, 'variables') | default({}, true) -%}
                  {%- set _fv = _fv if _fv is mapping else {} -%}
                  {%- set _fp_r = _fv.get('_family_profile', _fv.get('family_profile', {})) -%}
                  {%- set _fp = _fp_r.get('value', _fp_r) if _fp_r is mapping else {} -%}
                  {%- set _fp = _fp | from_json if _fp is string else _fp -%}
                  {%- set _d = _fp.get('display_name', _fp.get('friendly_name', _fp.get('name', ''))) | trim -%}
                  {%- set _vi = _fam_vi_raw | from_json if _fam_vi_raw is string else _fam_vi_raw -%}
                  {%- set _vi = _vi if _vi is mapping else {} -%}
                  {{- _d if _d != '' else _vi.get('friendly_name', family_entity) -}}
                _list_key: >-
                  {%- if member_type == 'ai_user' -%}ai_users
                  {%- elif member_type == 'family' -%}families
                  {%- else -%}users{%- endif -%}
            - variables:
                _existing_list: >-
                  {%- set _m = _fam_members_raw | from_json if _fam_members_raw is string else _fam_members_raw -%}
                  {%- set _m = _m if _m is mapping else {} -%}
                  {{- _m.get(_list_key, []) | tojson -}}
                _new_entry: >-
                  {%- set _pid = user_entity_id | default('') | trim -%}
                  {%- if member_type == 'family' -%}
                    {{- {'guid': _mem_guid, 'entity_id': member_entity, 'name': _mem_name, 'depth': 2} | tojson -}}
                  {%- else -%}
                    {{- {
                      'guid':             _mem_guid,
                      'entity_id':        member_entity,
                      'name':             _mem_name,
                      'person_entity_id': _pid if _pid != '' else none
                    } | tojson -}}
                  {%- endif -%}
            - variables:
                _already_member: >-
                  {%- set _lst = _existing_list | from_json if _existing_list is string else _existing_list -%}
                  {%- set _lst = _lst if _lst is iterable and _lst is not string else [] -%}
                  {{- _lst | selectattr('entity_id', 'equalto', member_entity) | list | count > 0 -}}
            - if: "{{- _already_member | bool -}}"
              then:
                - variables:
                    response: >
                      {{-
                        {
                          'mode':          'family_add_member',
                          'status':        'already_member',
                          'family_entity': family_entity,
                          'member_entity': member_entity,
                          'timestamp':     now().isoformat()
                        }
                      -}}
                - stop: Already a family member
                  response_variable: response
            - variables:
                _updated_members: >-
                  {%- set _m = _fam_members_raw | from_json if _fam_members_raw is string else _fam_members_raw -%}
                  {%- set _m = _m if _m is mapping else {} -%}
                  {%- set _lst = _m.get(_list_key, []) -%}
                  {%- set _lst = _lst if _lst is iterable and _lst is not string else [] -%}
                  {%- set _entry = _new_entry | from_json if _new_entry is string else _new_entry -%}
                  {{- dict(_m, **{_list_key: _lst + [_entry]}) | tojson -}}
            - action: script.zen_dojotools_filecabinet
              data:
                action_type: create
                force_action: true
                set_timestamp: true
                show_hidden_volumes: false
                volume_entity_id:
                  - "{{- family_entity -}}"
                key: members
                value: "{{- _updated_members -}}"
            # — if this is the member's first family, set default_family_guid —
            - variables:
                _mem_dfg_raw: >-
                  {%- set _vi = _mem_vi_raw | from_json if _mem_vi_raw is string else _mem_vi_raw -%}
                  {%- set _vi = _vi if _vi is mapping else {} -%}
                  {{- _vi.get('default_family_guid', '') -}}
                _is_first_family: "{{- member_type != 'family' and (_mem_dfg_raw | trim == '') -}}"
            # — always patch member's VolumeInfo: add family to acls.family + set default if first —
            - if: "{{- member_type != 'family' -}}"
              then:
                - variables:
                    _mem_vi_updated: >-
                      {%- set _vi = _mem_vi_raw | from_json if _mem_vi_raw is string else _mem_vi_raw -%}
                      {%- set _vi = _vi if _vi is mapping else {} -%}
                      {%- set _acls = _vi.get('acls', {}) -%}
                      {%- set _acls = _acls if _acls is mapping else {} -%}
                      {%- set _fam_list = _acls.get('family', []) -%}
                      {%- set _fam_list = _fam_list if _fam_list is iterable and _fam_list is not string else [] -%}
                      {%- set _already = _fam_list | selectattr('family_guid', 'equalto', _fam_guid) | list | count > 0 -%}
                      {%- if not _already -%}
                        {%- set _fam_list = _fam_list + [{'family_guid': _fam_guid, 'entity_id': family_entity, 'name': _fam_name}] -%}
                      {%- endif -%}
                      {%- set _acls = dict(_acls, **{'family': _fam_list}) -%}
                      {%- set _dfg = _fam_guid if _is_first_family | bool else _vi.get('default_family_guid', '') -%}
                      {{- dict(_vi, **{'guid': _mem_guid, 'acls': _acls, 'default_family_guid': _dfg}) | tojson -}}
                - event: set_variable_legacy
                  event_data:
                    key: AI_Cabinet_VolumeInfo
                    value: "{{- _mem_vi_updated -}}"
                    volume_entity: "{{- member_entity -}}"
                    set_timestamp: true
            - event: zen_event
              event_data:
                kind: family_member_joined
                family_entity: "{{- family_entity -}}"
                family_name: "{{- _fam_name -}}"
                family_guid: "{{- _fam_guid -}}"
                member_entity: "{{- member_entity -}}"
                member_name: "{{- _mem_name -}}"
                member_type: "{{- member_type -}}"
                is_ai: "{{- member_type == 'ai_user' -}}"
                is_first_family: "{{- _is_first_family | bool -}}"
                prompt_profile_update: true
            - variables:
                response: >
                  {{-
                    {
                      'mode':             'family_add_member',
                      'status':           'ok',
                      'family_entity':    family_entity,
                      'family_guid':      _fam_guid,
                      'family_name':      _fam_name,
                      'member_entity':    member_entity,
                      'member_type':      member_type,
                      'member_guid':      _mem_guid,
                      'member_name':      _mem_name,
                      'is_first_family':  _is_first_family | bool,
                      'timestamp':        now().isoformat(),
                      'caller_token':     caller_token | default('')
                    }
                  -}}
            - action: script.zen_dojotools_identity
              data:
                mode: build_identity_manifest
                household_entity: "{{- _hh_target -}}"
              continue_on_error: true
            - stop: Family member added
              response_variable: response

    # ── Step 3h: mode = family_remove_member ─────────────────────────────────
    - choose:
        - conditions: "{{- _mode == 'family_remove_member' -}}"
          sequence:
            - if: "{{- family_entity == '' or member_entity == '' -}}"
              then:
                - variables:
                    response: >
                      {{-
                        {
                          'mode':    'family_remove_member',
                          'status':  'error',
                          'message': 'family_entity and member_entity are both required.',
                          'timestamp': now().isoformat()
                        }
                      -}}
                - stop: Missing required fields
                  response_variable: response
            - variables:
                _fam_members_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _m = CABS.cabinet_drawer_value(family_entity, 'members', {}) | from_json() -%}
                  {{- _m | tojson -}}
                _mem_vi_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _vi = CABS.cabinet_drawer_value(member_entity, 'AI_Cabinet_VolumeInfo', {}) | from_json() -%}
                  {{- _vi | tojson -}}
                _fam_vi_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _vi = CABS.cabinet_drawer_value(family_entity, 'AI_Cabinet_VolumeInfo', {}) | from_json() -%}
                  {{- _vi | tojson -}}
            - variables:
                _fam_guid: >-
                  {%- set _vi = _fam_vi_raw | from_json if _fam_vi_raw is string else _fam_vi_raw -%}
                  {%- set _vi = _vi if _vi is mapping else {} -%}
                  {{- _vi.get('id', _vi.get('guid', '')) -}}
                # @todo - need to modify CABS.cabinet_drawer_value() so it can take a list of keys and return the first one that exists
                _fam_name: >-
                  {%- set _fv = state_attr(family_entity, 'variables') | default({}, true) -%}
                  {%- set _fv = _fv if _fv is mapping else {} -%}
                  {%- set _fp_r = _fv.get('_family_profile', _fv.get('family_profile', {})) -%}
                  {%- set _fp = _fp_r.get('value', _fp_r) if _fp_r is mapping else {} -%}
                  {%- set _fp = _fp | from_json if _fp is string else _fp -%}
                  {%- set _d = _fp.get('display_name', _fp.get('friendly_name', _fp.get('name', ''))) | trim -%}
                  {%- set _vi = _fam_vi_raw | from_json if _fam_vi_raw is string else _fam_vi_raw -%}
                  {%- set _vi = _vi if _vi is mapping else {} -%}
                  {{- _d if _d != '' else _vi.get('friendly_name', family_entity) -}}
                _mem_guid: >-
                  {%- set _vi = _mem_vi_raw | from_json if _mem_vi_raw is string else _mem_vi_raw -%}
                  {%- set _vi = _vi if _vi is mapping else {} -%}
                  {{- _vi.get('id', _vi.get('guid', '')) -}}
                # @todo - need to modify CABS.cabinet_drawer_value() so it can take a list of keys and return the first one that exists
                _mem_name: >-
                  {%- set _mv = state_attr(member_entity, 'variables') | default({}, true) -%}
                  {%- set _mv = _mv if _mv is mapping else {} -%}
                  {%- set _up_r = _mv.get('_user_profile', _mv.get('user_profile', _mv.get('_family_profile', _mv.get('family_profile', {})))) -%}
                  {%- set _up = _up_r.get('value', _up_r) if _up_r is mapping else {} -%}
                  {%- set _up = _up | from_json if _up is string else _up -%}
                  {%- set _pn = _up.get('preferred_name', '') | trim -%}
                  {%- set _fn = _up.get('first_name', '') | trim -%}
                  {%- set _ln = _up.get('last_name', '') | trim -%}
                  {%- set _d = _pn if _pn != '' else ((_fn + ' ' + _ln) | trim) -%}
                  {%- set _vi = _mem_vi_raw | from_json if _mem_vi_raw is string else _mem_vi_raw -%}
                  {%- set _vi = _vi if _vi is mapping else {} -%}
                  {{- _d if _d != '' else _vi.get('friendly_name', member_entity) -}}
                _list_key: >-
                  {%- if member_type == 'ai_user' -%}ai_users
                  {%- elif member_type == 'family' -%}families
                  {%- else -%}users{%- endif -%}
                _was_default: >-
                  {%- set _vi = _mem_vi_raw | from_json if _mem_vi_raw is string else _mem_vi_raw -%}
                  {%- set _vi = _vi if _vi is mapping else {} -%}
                  {{- _vi.get('default_family_guid', '') == _fam_guid -}}
                _fam_vi_raw2: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _vi = CABS.cabinet_drawer_value(family_entity, 'AI_Cabinet_VolumeInfo', {}) | from_json() -%}
                  {{- _vi | tojson -}}
                _principal_warning: >-
                  {%- set _vi = _fam_vi_raw2 | from_json if _fam_vi_raw2 is string else _fam_vi_raw2 -%}
                  {%- set _vi = _vi if _vi is mapping else {} -%}
                  {%- set _acls = _vi.get('acls', {}) -%}
                  {%- set _acls = _acls if _acls is mapping else {} -%}
                  {%- set _own = _acls.get('owner', []) -%}
                  {%- set _prt = _acls.get('partner', []) -%}
                  {%- set _is_hoh = _own | selectattr('entity_id', 'equalto', member_entity) | list | count > 0 -%}
                  {%- set _is_prime = _prt | selectattr('entity_id', 'equalto', member_entity) | selectattr('role', 'defined') | selectattr('role', 'equalto', 'prime') | list | count > 0 -%}
                  {%- if _is_hoh -%}hoh_slot_stale
                  {%- elif _is_prime -%}prime_slot_stale
                  {%- else -%}{%- endif -%}
            - variables:
                _updated_members: >-
                  {%- set _m = _fam_members_raw | from_json if _fam_members_raw is string else _fam_members_raw -%}
                  {%- set _m = _m if _m is mapping else {} -%}
                  {%- set _lst = _m.get(_list_key, []) -%}
                  {%- set _lst = _lst if _lst is iterable and _lst is not string else [] -%}
                  {%- set _filtered = _lst | rejectattr('entity_id', 'equalto', member_entity) | list -%}
                  {{- dict(_m, **{_list_key: _filtered}) | tojson -}}
            - action: script.zen_dojotools_filecabinet
              data:
                action_type: create
                force_action: true
                set_timestamp: true
                show_hidden_volumes: false
                volume_entity_id:
                  - "{{- family_entity -}}"
                key: members
                value: "{{- _updated_members -}}"
            # — scrub member's VolumeInfo: remove family from acls.family + clear default —
            - if: "{{- member_type != 'family' -}}"
              then:
                - variables:
                    _mem_vi_updated: >-
                      {%- set _vi = _mem_vi_raw | from_json if _mem_vi_raw is string else _mem_vi_raw -%}
                      {%- set _vi = _vi if _vi is mapping else {} -%}
                      {%- set _acls = _vi.get('acls', {}) -%}
                      {%- set _acls = _acls if _acls is mapping else {} -%}
                      {%- set _fam_list = _acls.get('family', []) -%}
                      {%- set _fam_list = _fam_list if _fam_list is iterable and _fam_list is not string else [] -%}
                      {%- set _fam_list = _fam_list | rejectattr('family_guid', 'equalto', _fam_guid) | list -%}
                      {%- set _acls = dict(_acls, **{'family': _fam_list}) -%}
                      {%- set _dfg = '' if _was_default | bool else _vi.get('default_family_guid', '') -%}
                      {{- dict(_vi, **{'acls': _acls, 'default_family_guid': _dfg}) | tojson -}}
                - event: set_variable_legacy
                  event_data:
                    key: AI_Cabinet_VolumeInfo
                    value: "{{- _mem_vi_updated -}}"
                    volume_entity: "{{- member_entity -}}"
                    set_timestamp: true
            - event: zen_event
              event_data:
                kind: family_member_left
                family_entity: "{{- family_entity -}}"
                family_name: "{{- _fam_name -}}"
                family_guid: "{{- _fam_guid -}}"
                member_entity: "{{- member_entity -}}"
                member_name: "{{- _mem_name -}}"
                member_type: "{{- member_type -}}"
                is_ai: "{{- member_type == 'ai_user' -}}"
                was_default_family: "{{- _was_default | bool -}}"
                principal_warning: "{{- _principal_warning -}}"
                prompt_profile_update: true
            - variables:
                response: >
                  {{-
                    {
                      'mode':              'family_remove_member',
                      'status':            'ok',
                      'family_entity':     family_entity,
                      'family_guid':       _fam_guid,
                      'family_name':       _fam_name,
                      'member_entity':     member_entity,
                      'member_type':       member_type,
                      'member_guid':       _mem_guid,
                      'member_name':       _mem_name,
                      'was_default_family': _was_default | bool,
                      'principal_warning': _principal_warning,
                      'timestamp':         now().isoformat(),
                      'caller_token':      caller_token | default('')
                    }
                  -}}
            - action: script.zen_dojotools_identity
              data:
                mode: build_identity_manifest
                household_entity: "{{- _hh_target -}}"
              continue_on_error: true
            - stop: Family member removed
              response_variable: response

    # ── Step 3i: mode = link_partners ─────────────────────────────────────────
    # Works for any entity pair: user↔user, user↔ai_user, ai_user↔ai_user.
    # partner = delegation authority. acls.partner is written on BOTH sides.
    - choose:
        - conditions: "{{- _mode == 'link_partners' -}}"
          sequence:
            - if: "{{- member_entity == '' or ai_entity == '' -}}"
              then:
                - variables:
                    response: >
                      {{-
                        {
                          'mode':    'link_partners',
                          'status':  'error',
                          'message': 'member_entity and ai_entity (the two entities to link) are both required.',
                          'timestamp': now().isoformat()
                        }
                      -}}
                - stop: Missing required fields
                  response_variable: response
            - variables:
                _a_vi_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _vi = CABS.cabinet_drawer_value(member_entity, 'AI_Cabinet_VolumeInfo', {}) | from_json() -%}
                  {{- _vi | tojson -}}
                _b_vi_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _vi = CABS.cabinet_drawer_value(ai_entity, 'AI_Cabinet_VolumeInfo', {}) | from_json() -%}
                  {{- _vi | tojson -}}
            - variables:
                _a_guid: >-
                  {%- set _vi = _a_vi_raw | from_json if _a_vi_raw is string else _a_vi_raw -%}
                  {{- (_vi if _vi is mapping else {}).get('id', (_vi if _vi is mapping else {}).get('guid', '')) -}}
                _a_name: >-
                  {%- set _vi = _a_vi_raw | from_json if _a_vi_raw is string else _a_vi_raw -%}
                  {{- (_vi if _vi is mapping else {}).get('friendly_name', member_entity) -}}
                _a_type: >-
                  {%- set _vi = _a_vi_raw | from_json if _a_vi_raw is string else _a_vi_raw -%}
                  {{- (_vi if _vi is mapping else {}).get('cab_type', 'user') -}}
                _b_guid: >-
                  {%- set _vi = _b_vi_raw | from_json if _b_vi_raw is string else _b_vi_raw -%}
                  {{- (_vi if _vi is mapping else {}).get('id', (_vi if _vi is mapping else {}).get('guid', '')) -}}
                _b_name: >-
                  {%- set _vi = _b_vi_raw | from_json if _b_vi_raw is string else _b_vi_raw -%}
                  {{- (_vi if _vi is mapping else {}).get('friendly_name', ai_entity) -}}
                _b_type: >-
                  {%- set _vi = _b_vi_raw | from_json if _b_vi_raw is string else _b_vi_raw -%}
                  {{- (_vi if _vi is mapping else {}).get('cab_type', 'user') -}}
            # — write B into A's acls.partner (delegation: B is A's partner) —
            - variables:
                _a_vi_updated: >-
                  {%- set _vi = _a_vi_raw | from_json if _a_vi_raw is string else _a_vi_raw -%}
                  {%- set _vi = _vi if _vi is mapping else {} -%}
                  {%- set _acls = _vi.get('acls', {}) -%}
                  {%- set _acls = _acls if _acls is mapping else {} -%}
                  {%- set _pts = _acls.get('partner', []) -%}
                  {%- set _pts = _pts if _pts is iterable and _pts is not string else [] -%}
                  {%- set _already = _pts | selectattr('entity_id', 'equalto', ai_entity) | list | count > 0 -%}
                  {%- if not _already -%}
                    {%- set _pts = _pts + [{'guid': _b_guid, 'entity_id': ai_entity, 'cab_type': _b_type, 'role': 'partner', 'sid': _b_guid}] -%}
                  {%- endif -%}
                  {%- set _acls = dict(_acls, **{'partner': _pts}) -%}
                  {{- dict(_vi, **{'acls': _acls}) | tojson -}}
                # — write A into B's acls.partner (delegation: A is B's partner) —
                _b_vi_updated: >-
                  {%- set _vi = _b_vi_raw | from_json if _b_vi_raw is string else _b_vi_raw -%}
                  {%- set _vi = _vi if _vi is mapping else {} -%}
                  {%- set _acls = _vi.get('acls', {}) -%}
                  {%- set _acls = _acls if _acls is mapping else {} -%}
                  {%- set _pts = _acls.get('partner', []) -%}
                  {%- set _pts = _pts if _pts is iterable and _pts is not string else [] -%}
                  {%- set _already = _pts | selectattr('entity_id', 'equalto', member_entity) | list | count > 0 -%}
                  {%- if not _already -%}
                    {%- set _pts = _pts + [{'guid': _a_guid, 'entity_id': member_entity, 'cab_type': _a_type, 'role': 'partner', 'sid': _a_guid}] -%}
                  {%- endif -%}
                  {%- set _acls = dict(_acls, **{'partner': _pts}) -%}
                  {{- dict(_vi, **{'acls': _acls}) | tojson -}}
            - event: set_variable_legacy
              event_data:
                key: AI_Cabinet_VolumeInfo
                value: "{{- _a_vi_updated -}}"
                volume_entity: "{{- member_entity -}}"
                set_timestamp: true
            - event: set_variable_legacy
              event_data:
                key: AI_Cabinet_VolumeInfo
                value: "{{- _b_vi_updated -}}"
                volume_entity: "{{- ai_entity -}}"
                set_timestamp: true
            - variables:
                response: >
                  {{-
                    {
                      'mode':        'link_partners',
                      'status':      'ok',
                      'entity_a':    member_entity,
                      'guid_a':      _a_guid,
                      'name_a':      _a_name,
                      'type_a':      _a_type,
                      'entity_b':    ai_entity,
                      'guid_b':      _b_guid,
                      'name_b':      _b_name,
                      'type_b':      _b_type,
                      'timestamp':   now().isoformat(),
                      'caller_token': caller_token | default('')
                    }
                  -}}
            - event: zen_event
              event_data:
                event:
                  kind: partner_linked
                  entity_a: "{{- member_entity -}}"
                  name_a: "{{- _a_name -}}"
                  type_a: "{{- _a_type -}}"
                  entity_b: "{{- ai_entity -}}"
                  name_b: "{{- _b_name -}}"
                  type_b: "{{- _b_type -}}"
                  prompt_profile_update: true
            - event: zen_event
              event_data:
                event:
                  kind: identity_manifest_rebuild
                  component: zen_dojotools_identity
                  severity: info
                  summary: Manifest rebuild triggered by link_partners.
            - stop: User-AI link established
              response_variable: response

    # ── Step 3i-2: mode = unlink_partners ─────────────────────────────────────
    # Symmetric: removes each entity from the other's acls.partner list.
    - choose:
        - conditions: "{{- _mode == 'unlink_partners' -}}"
          sequence:
            - if: "{{- member_entity == '' or ai_entity == '' -}}"
              then:
                - variables:
                    response: >
                      {{-
                        {
                          'mode':    'unlink_partners',
                          'status':  'error',
                          'message': 'member_entity and ai_entity (the two entities to unlink) are both required.',
                          'timestamp': now().isoformat()
                        }
                      -}}
                - stop: Missing required fields
                  response_variable: response
            - variables:
                _a_vi_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _vi = CABS.cabinet_drawer_value(member_entity, 'AI_Cabinet_VolumeInfo', {}) | from_json() -%}
                  {{- _vi | tojson -}}
                _b_vi_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _vi = CABS.cabinet_drawer_value(ai_entity, 'AI_Cabinet_VolumeInfo', {}) | from_json() -%}
                  {{- _vi | tojson -}}
            - variables:
                _a_name: >-
                  {%- set _vi = _a_vi_raw | from_json if _a_vi_raw is string else _a_vi_raw -%}
                  {{- (_vi if _vi is mapping else {}).get('friendly_name', member_entity) -}}
                _b_name: >-
                  {%- set _vi = _b_vi_raw | from_json if _b_vi_raw is string else _b_vi_raw -%}
                  {{- (_vi if _vi is mapping else {}).get('friendly_name', ai_entity) -}}
                # — remove B from A's acls.partner —
                _a_vi_updated: >-
                  {%- set _vi = _a_vi_raw | from_json if _a_vi_raw is string else _a_vi_raw -%}
                  {%- set _vi = _vi if _vi is mapping else {} -%}
                  {%- set _acls = _vi.get('acls', {}) -%}
                  {%- set _acls = _acls if _acls is mapping else {} -%}
                  {%- set _pts = _acls.get('partner', []) -%}
                  {%- set _pts = _pts if _pts is iterable and _pts is not string else [] -%}
                  {%- set _filtered = _pts | rejectattr('entity_id', 'equalto', ai_entity) | list -%}
                  {%- set _acls = dict(_acls, **{'partner': _filtered}) -%}
                  {{- dict(_vi, **{'acls': _acls}) | tojson -}}
                # — remove A from B's acls.partner —
                _b_vi_updated: >-
                  {%- set _vi = _b_vi_raw | from_json if _b_vi_raw is string else _b_vi_raw -%}
                  {%- set _vi = _vi if _vi is mapping else {} -%}
                  {%- set _acls = _vi.get('acls', {}) -%}
                  {%- set _acls = _acls if _acls is mapping else {} -%}
                  {%- set _pts = _acls.get('partner', []) -%}
                  {%- set _pts = _pts if _pts is iterable and _pts is not string else [] -%}
                  {%- set _filtered = _pts | rejectattr('entity_id', 'equalto', member_entity) | list -%}
                  {%- set _acls = dict(_acls, **{'partner': _filtered}) -%}
                  {{- dict(_vi, **{'acls': _acls}) | tojson -}}
            - event: set_variable_legacy
              event_data:
                key: AI_Cabinet_VolumeInfo
                value: "{{- _a_vi_updated -}}"
                volume_entity: "{{- member_entity -}}"
                set_timestamp: true
            - event: set_variable_legacy
              event_data:
                key: AI_Cabinet_VolumeInfo
                value: "{{- _b_vi_updated -}}"
                volume_entity: "{{- ai_entity -}}"
                set_timestamp: true
            - event: zen_event
              event_data:
                event:
                  kind: partner_unlinked
                  entity_a: "{{- member_entity -}}"
                  name_a: "{{- _a_name -}}"
                  entity_b: "{{- ai_entity -}}"
                  name_b: "{{- _b_name -}}"
                  prompt_profile_update: true
            - variables:
                response: >
                  {{-
                    {
                      'mode':      'unlink_partners',
                      'status':    'ok',
                      'entity_a':  member_entity,
                      'name_a':    _a_name,
                      'entity_b':  ai_entity,
                      'name_b':    _b_name,
                      'timestamp': now().isoformat(),
                      'caller_token': caller_token | default('')
                    }
                  -}}
            - event: zen_event
              event_data:
                event:
                  kind: identity_manifest_rebuild
                  component: zen_dojotools_identity
                  severity: info
                  summary: Manifest rebuild triggered by unlink_partners.
            - stop: Partners unlinked
              response_variable: response

    # ── Step 3j: mode = set_default_family ───────────────────────────────────
    - choose:
        - conditions: "{{- _mode == 'set_default_family' -}}"
          sequence:
            - if: "{{- member_entity == '' or family_entity == '' -}}"
              then:
                - variables:
                    response: >
                      {{-
                        {
                          'mode':    'set_default_family',
                          'status':  'error',
                          'message': 'member_entity (user cabinet) and family_entity are both required.',
                          'timestamp': now().isoformat()
                        }
                      -}}
                - stop: Missing required fields
                  response_variable: response
            - variables:
                _mem_vi_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _vi = CABS.cabinet_drawer_value(member_entity, 'AI_Cabinet_VolumeInfo', {}) | from_json() -%}
                  {{- _vi | tojson -}}
                _fam_vi_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _vi = CABS.cabinet_drawer_value(family_entity, 'AI_Cabinet_VolumeInfo', {}) | from_json() -%}
                  {{- _vi | tojson -}}
            - variables:
                _fam_guid: >-
                  {%- set _vi = _fam_vi_raw | from_json if _fam_vi_raw is string else _fam_vi_raw -%}
                  {{- (_vi if _vi is mapping else {}).get('id', (_vi if _vi is mapping else {}).get('guid', '')) -}}
                _mem_vi_updated: >-
                  {%- set _vi = _mem_vi_raw | from_json if _mem_vi_raw is string else _mem_vi_raw -%}
                  {%- set _vi = _vi if _vi is mapping else {} -%}
                  {%- set _fvi = _fam_vi_raw | from_json if _fam_vi_raw is string else _fam_vi_raw -%}
                  {%- set _fguid = (_fvi if _fvi is mapping else {}).get('id', (_fvi if _fvi is mapping else {}).get('guid', '')) -%}
                  {{- dict(_vi, **{'default_family_guid': _fguid}) | tojson -}}
            - event: set_variable_legacy
              event_data:
                key: AI_Cabinet_VolumeInfo
                value: "{{- _mem_vi_updated -}}"
                volume_entity: "{{- member_entity -}}"
                set_timestamp: true
            - variables:
                response: >
                  {{-
                    {
                      'mode':           'set_default_family',
                      'status':         'ok',
                      'member_entity':  member_entity,
                      'family_entity':  family_entity,
                      'family_guid':    _fam_guid,
                      'timestamp':      now().isoformat(),
                      'caller_token':   caller_token | default('')
                    }
                  -}}
            - event: zen_event
              event_data:
                event:
                  kind: identity_manifest_rebuild
                  component: zen_dojotools_identity
                  severity: info
                  summary: Manifest rebuild triggered by set_default_family.
            - stop: Default family set
              response_variable: response

    # ── Step 3k: mode = membership ───────────────────────────────────────────
    # Tree view for containers; reverse lookup for members.
    # Reads VolumeInfo + members drawer from state_attr (template-time, no async).
    # Depth-2 tree: household → families (depth 1) → sub-families (depth 2).
    - choose:
        - conditions: "{{- _mode == 'membership' -}}"
          sequence:
            - variables:
                # Determine root: family_entity > member_entity > default household
                _root_entity: >-
                  {%- if family_entity | trim != '' -%}
                    {{- family_entity | trim -}}
                  {%- elif member_entity | trim != '' -%}
                    {{- member_entity | trim -}}
                  {%- else -%}
                    {{- _hh_target -}}
                  {%- endif -%}
                _hh_default: "{{- _hh_target -}}"
            - variables:
                _root_vi_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _vi = CABS.cabinet_drawer_value(_root_entity, 'AI_Cabinet_VolumeInfo', {}) | from_json() -%}
                  {{- _vi | tojson -}}
                _root_members_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _m = CABS.cabinet_drawer_value(_root_entity, 'members', {}) | from_json() -%}
                  {{- _m | tojson -}}
                # @todo - need to modify CABS.cabinet_drawer_value() so it can take a list of keys and return the first one that exists
                _root_profile_raw: >-
                  {%- set _v = state_attr(_root_entity, 'variables') | default({}, true) -%}
                  {%- set _v = _v if _v is mapping else {} -%}
                  {%- set _p = _v.get('_household_profile', _v.get('household_profile', _v.get('_family_profile', _v.get('family_profile', {})))) -%}
                  {%- set _p = _p.get('value', _p) if _p is mapping else {} -%}
                  {%- set _p = _p | from_json if _p is string else _p -%}
                  {{- _p | tojson -}}
            - variables:
                _root_vi: "{{- _root_vi_raw | from_json if _root_vi_raw is string else (_root_vi_raw if _root_vi_raw is mapping else {}) -}}"
                _root_members: "{{- _root_members_raw | from_json if _root_members_raw is string else (_root_members_raw if _root_members_raw is mapping else {}) -}}"
                _root_cab_type: >-
                  {%- set _vi = _root_vi_raw | from_json if _root_vi_raw is string else _root_vi_raw -%}
                  {%- set _vi = _vi if _vi is mapping else {} -%}
                  {{- _vi.get('cab_type', '') -}}
                _root_is_container: >-
                  {%- set _vi = _root_vi_raw | from_json if _root_vi_raw is string else _root_vi_raw -%}
                  {%- set _vi = _vi if _vi is mapping else {} -%}
                  {%- set _ct = _vi.get('cab_type', '') -%}
                  {{- _ct in ['household', 'family'] or 'members' in (state_attr(_root_entity, 'variables') | default({}, true)) -}}
            - choose:
                # ── container tree ────────────────────────────────────────────
                - conditions: "{{- _root_is_container | bool -}}"
                  sequence:
                    - variables:
                        _tree: >-
                          {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                          {%- set _vi = _root_vi_raw | from_json if _root_vi_raw is string else _root_vi_raw -%}
                          {%- set _vi = _vi if _vi is mapping else {} -%}
                          {%- set _m = _root_members_raw | from_json if _root_members_raw is string else _root_members_raw -%}
                          {%- set _m = _m if _m is mapping else {} -%}
                          {%- set _hp = _root_profile_raw | from_json if _root_profile_raw is string else _root_profile_raw -%}
                          {%- set _hp = _hp if _hp is mapping else {} -%}
                          {%- set _acls = _vi.get('acls', {}) -%}
                          {%- set _acls = _acls if _acls is mapping else {} -%}
                          {%- set _owners = _acls.get('owner', []) -%}
                          {%- set _partners = _acls.get('partner', []) -%}
                          {%- set _prime = _partners | selectattr('role', 'defined') | selectattr('role', 'equalto', 'prime') | list -%}
                          {%- set _hoh = _owners[0] if _owners | count > 0 else none -%}
                          {%- set _prime_entry = _prime[0] if _prime | count > 0 else none -%}
                          {# depth-1 families with their members #}
                          {%- set _ns = namespace(fams=[]) -%}{# FG-25: namespace required for list mutation inside for-loop #}
                          {%- for fam in _m.get('families', []) -%}
                            {%- set _fc_entity_id = fam.get('entity_id', '') -%}
                            {%- set _fvi = CABS.cabinet_drawer_value(_fc_entity_id, 'AI_Cabinet_VolumeInfo', {}) | from_json() -%}
                            {%- set _fm = CABS.cabinet_drawer_value(_fc_entity_id, 'members', {}) | from_json() -%}

                            {%- set _facls = _fvi.get('acls', {}) | default({}, true) -%}
                            {%- set _facls = _facls if _facls is mapping else {} -%}
                            {%- set _fowners = _facls.get('owner', []) -%}
                            {%- set _fpartners = _facls.get('partner', []) -%}
                            {%- set _fprime = _fpartners | selectattr('role', 'defined') | selectattr('role', 'equalto', 'prime') | list -%}
                            {# depth-2 sub-families (members only, no further recursion) #}
                            {%- set _nsf = namespace(subfams=[]) -%}{# FG-25: namespace required for list mutation inside for-loop #}
                            {%- for sf in _fm.get('families', []) -%}
                              {%- set _sf_entity_id = sf.get('entity_id', '') -%}
                              {%- set _sfvi = CABS.cabinet_drawer_value(_sf_entity_id, 'AI_Cabinet_VolumeInfo', {}) | from_json() -%}
                              {%- set _sfm = CABS.cabinet_drawer_value(_sf_entity_id, 'members', {}) | from_json() -%}

                              {%- set _nsf.subfams = _nsf.subfams + [{
                                'entity_id': _sf_entity_id,
                                'guid': _sfvi.get('id', _sfvi.get('guid', '')),
                                'name': sf.get('name', _sfvi.get('friendly_name', _sfvi.get('name', _sf_entity_id))),
                                'depth': 2,
                                'members': {
                                  'users': _sfm.get('users', []),
                                  'ai_users': _sfm.get('ai_users', [])
                                }
                              }] -%}
                            {%- endfor -%}
                            {%- set _ns.fams = _ns.fams + [{
                              'entity_id': _fc_entity_id,
                              'guid': _fvi.get('id', _fvi.get('guid', '')),
                              'name': fam.get('name', _fvi.get('friendly_name', _fvi.get('name', _fc_entity_id))),
                              'depth': fam.get('depth', 1),
                              'principals': {
                                'hoh': _fowners[0] if _fowners | count > 0 else none,
                                'prime': _fprime[0] if _fprime | count > 0 else none
                              },
                              'members': {
                                'users': _fm.get('users', []),
                                'ai_users': _fm.get('ai_users', []),
                                'families': _nsf.subfams
                              }
                            }] -%}
                          {%- endfor -%}
                          {{
                            {
                              'entity_id': _root_entity,
                              'guid': _vi.get('id', _vi.get('guid', '')),
                              'name': _hp.get('friendly_name', _hp.get('name', _vi.get('friendly_name', _vi.get('name', _root_entity)))),
                              'cab_type': _vi.get('cab_type', ''),
                              'principals': {
                                'hoh': _hoh,
                                'prime': _prime_entry
                              },
                              'members': {
                                'users': _m.get('users', []),
                                'ai_users': _m.get('ai_users', []),
                                'families': _ns.fams
                              }
                            } | tojson
                          }}
                    - variables:
                        # @todo - weird - returning a dict where one of the values are JSON encoded strings (i.e. _tree)
                        response: >
                          {{-
                            {
                              'mode':             'membership',
                              'view':             'tree',
                              'root_entity':      _root_entity,
                              'tree':             _tree,
                              'timestamp':        now().isoformat(),
                              'caller_token':     caller_token | default('')
                            }
                          -}}
                    - stop: Membership tree returned
                      response_variable: response

                # ── member reverse-lookup ─────────────────────────────────────
                - conditions: "{{- not _root_is_container | bool -}}"
                  sequence:
                    - variables:
                        # Scan the default household and its families for this member
                        _lookup_root: "{{- _hh_default -}}"
                        _target_eid: "{{- _root_entity -}}"
                    - variables:
                        _hh_vi_raw: >-
                          {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                          {%- set _vi = CABS.cabinet_drawer_value(_lookup_root, 'AI_Cabinet_VolumeInfo', {}) | from_json() -%}
                          {{- _vi | tojson -}}
                        _hh_m_raw: >-
                          {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                          {%- set _m = CABS.cabinet_drawer_value(_lookup_root, 'members', {}) | from_json() -%}
                          {{- _m | tojson -}}
                    - variables:
                        _memberships: >-
                          {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                          {%- set _hvi = _hh_vi_raw | from_json if _hh_vi_raw is string else _hh_vi_raw -%}
                          {%- set _hvi = _hvi if _hvi is mapping else {} -%}
                          {%- set _hm = _hh_m_raw | from_json if _hh_m_raw is string else _hh_m_raw -%}
                          {%- set _hm = _hm if _hm is mapping else {} -%}
                          {%- set _eid = _target_eid -%}
                          {%- set _groups = [] -%}
                          {# household direct membership? #}
                          {%- set _hh_users = _hm.get('users', []) + _hm.get('ai_users', []) -%}
                          {%- set _in_hh = _hh_users | selectattr('entity_id', 'equalto', _eid) | list | count > 0 -%}
                          {%- if _in_hh -%}
                            {%- set _hacls = _hvi.get('acls', {}) | default({}, true) -%}
                            {%- set _hacls = _hacls if _hacls is mapping else {} -%}
                            {%- set _own = _hacls.get('owner', []) -%}
                            {%- set _prt = _hacls.get('partner', []) -%}
                            {%- set _is_hoh = _own | selectattr('entity_id', 'equalto', _eid) | list | count > 0 -%}
                            {%- set _is_prime = _prt | selectattr('entity_id', 'equalto', _eid) | selectattr('role', 'defined') | selectattr('role', 'equalto', 'prime') | list | count > 0 -%}
                            {%- set _role = 'hoh' if _is_hoh else ('prime' if _is_prime else 'member') -%}
                            {%- set _groups = _groups + [{'container': _lookup_root, 'container_type': 'household', 'guid': _hvi.get('id', _hvi.get('guid', '')), 'name': _hvi.get('friendly_name', _lookup_root), 'depth': 0, 'role': _role}] -%}
                          {%- endif -%}
                          {# scan depth-1 families #}
                          {%- for fam in _hm.get('families', []) -%}
                            {%- set _fc_entity_id = fam.get('entity_id', '') -%}
                            {%- set _fvi = CABS.cabinet_drawer_value(_fc_entity_id, 'AI_Cabinet_VolumeInfo', {}) | from_json() -%}
                            {%- set _fm = CABS.cabinet_drawer_value(_fc_entity_id, 'members', {}) | from_json() -%}
                            {%- set _f_users = _fm.get('users', []) + _fm.get('ai_users', []) -%}
                            {%- set _in_fam = _f_users | selectattr('entity_id', 'equalto', _eid) | list | count > 0 -%}
                            {%- if _in_fam -%}
                              {%- set _facls = _fvi.get('acls', {}) | default({}, true) -%}
                              {%- set _facls = _facls if _facls is mapping else {} -%}
                              {%- set _fown = _facls.get('owner', []) -%}
                              {%- set _fprt = _facls.get('partner', []) -%}
                              {%- set _is_fhoh = _fown | selectattr('entity_id', 'equalto', _eid) | list | count > 0 -%}
                              {%- set _is_fprime = _fprt | selectattr('entity_id', 'equalto', _eid) | selectattr('role', 'defined') | selectattr('role', 'equalto', 'prime') | list | count > 0 -%}
                              {%- set _frole = 'hoh' if _is_fhoh else ('prime' if _is_fprime else 'member') -%}
                              {%- set _groups = _groups + [{'container': _fc_entity_id, 'container_type': 'family', 'guid': _fvi.get('id', _fvi.get('guid', '')), 'name': fam.get('name', _fvi.get('friendly_name', _fvi.get('name', _fc_entity_id))), 'depth': 1, 'role': _frole}] -%}
                            {%- endif -%}
                            {# scan depth-2 sub-families #}
                            {%- for sf in _fm.get('families', []) -%}
                              {%- set _sf_entity_id = sf.get('entity_id', '') -%}
                              {%- set _sfvi = CABS.cabinet_drawer_value(_sf_entity_id, 'AI_Cabinet_VolumeInfo', {}) | from_json() -%}
                              {%- set _sfm = CABS.cabinet_drawer_value(_sf_entity_id, 'members', {}) | from_json() -%}
                              {%- set _sf_users = _sfm.get('users', []) + _sfm.get('ai_users', []) -%}
                              {%- set _in_sf = _sf_users | selectattr('entity_id', 'equalto', _eid) | list | count > 0 -%}
                              {%- if _in_sf -%}
                                {%- set _groups = _groups + [{'container': _sf_entity_id, 'container_type': 'family', 'guid': _sfvi.get('id', _sfvi.get('guid', '')), 'name': sf.get('name', _sfvi.get('friendly_name', _sfvi.get('name', _sf_entity_id))), 'depth': 2, 'role': 'member'}] -%}
                              {%- endif -%}
                            {%- endfor -%}
                          {%- endfor -%}
                          {{- _groups | tojson -}}
                    - variables:
                        response: >
                          {{-
                            {
                              'mode':          'membership',
                              'view':          'member_lookup',
                              'member_entity': _root_entity,
                              'memberships':   _memberships,
                              'timestamp':     now().isoformat(),
                              'caller_token':  caller_token | default('')
                            }
                          -}}
                    - stop: Member lookup returned
                      response_variable: response

    # ── Step 3l: mode = is_member ─────────────────────────────────────────────
    - choose:
        - conditions: "{{- _mode == 'is_member' -}}"
          sequence:
            - if: "{{- member_entity == '' or family_entity == '' -}}"
              then:
                - variables:
                    response: >
                      {{-
                        {
                          'mode':    'is_member',
                          'status':  'error',
                          'message': 'member_entity (subject) and family_entity (container) are both required.',
                          'timestamp': now().isoformat()
                        }
                      -}}
                - stop: Missing required fields
                  response_variable: response
            - variables:
                _container_m_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _m = CABS.cabinet_drawer_value(family_entity, 'members', {}) | from_json() -%}
                  {{- _m | tojson -}}
            - variables:
                _check: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _m = _container_m_raw | from_json if _container_m_raw is string else _container_m_raw -%}
                  {%- set _m = _m if _m is mapping else {} -%}
                  {%- set _eid = member_entity -%}
                  {%- set _all_direct = _m.get('users', []) + _m.get('ai_users', []) -%}
                  {%- set _d1 = _all_direct | selectattr('entity_id', 'equalto', _eid) | list | count > 0 -%}
                  {%- if _d1 -%}
                    {{- {'is_member': true, 'depth': 1} | tojson -}}
                  {%- else -%}
                    {%- set _found_d2 = false -%}
                    {%- for fam in _m.get('families', []) -%}
                      {%- if not _found_d2 -%}
                        {%- set _fc_entity_id = fam.get('entity_id', '') -%}
                        {%- set _fm = CABS.cabinet_drawer_value(_fc_entity_id, 'members', {}) | from_json() -%}
                        {%- set _d2_all = _fm.get('users', []) + _fm.get('ai_users', []) -%}
                        {%- set _in_d2 = _d2_all | selectattr('entity_id', 'equalto', _eid) | list | count > 0 -%}
                        {%- if _in_d2 -%}
                          {%- set _found_d2 = true -%}
                        {%- endif -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {%- if _found_d2 -%}
                      {{- {'is_member': true, 'depth': 2} | tojson -}}
                    {%- else -%}
                      {{- {'is_member': false, 'depth': none} | tojson -}}
                    {%- endif -%}
                  {%- endif -%}
            - variables:
                _r: "{{- _check if _check is mapping else (_check | from_json if _check is string else {'is_member': false, 'depth': none}) -}}"
            - variables:
                response: >
                  {{-
                    {
                      'mode':             'is_member',
                      'member_entity':    member_entity,
                      'container_entity': family_entity,
                      'is_member':        _r.get('is_member', false),
                      'depth':            _r.get('depth', none),
                      'timestamp':        now().isoformat(),
                      'caller_token':     caller_token | default('')
                    }
                  -}}
            - stop: is_member check complete
              response_variable: response

    # ── Step 3m: mode = provision_member ─────────────────────────────────────
    # Full orchestration: scan expansion slots → provision → family_add_member
    # → manifest rebuild. Handles the complete new-member lifecycle in one call.
    - choose:
        - conditions: "{{- _mode == 'provision_member' -}}"
          sequence:
            # Resolve effective family and validate member_name
            - variables:
                _pm_name: "{{- member_name | default('') | trim -}}"
                _pm_payload_raw: "{{- profile_payload | default('') | trim -}}"
                _pm_mtype: "{{- member_type | default('user') | lower | trim -}}"
                _pm_fam: >-
                  {%- set _f = family_entity | default('') | trim -%}
                  {%- if _f != '' -%}
                    {{- _f -}}
                  {%- else -%}
                    {{- states('sensor.zen_default_family_cabinet_resolved') -}}
                  {%- endif -%}

            # Gate: member_name required
            - if: "{{- _pm_name == '' -}}"
              then:
                - variables:
                    response: >
                      {{-
                        {
                          'mode':      'provision_member',
                          'status':    'error',
                          'message':   'member_name is required for provision_member.',
                          'timestamp': now().isoformat()
                        }
                      -}}
                - stop: member_name required
                  response_variable: response

            # Gate: family entity must resolve
            - if: "{{- _pm_fam == '' or _pm_fam == 'unknown' -}}"
              then:
                - variables:
                    response: >
                      {{-
                        {
                          'mode':      'provision_member',
                          'status':    'error',
                          'message':   'family_entity could not be resolved. Provide family_entity or ensure zen_default_family_cabinet_resolved is set.',
                          'timestamp': now().isoformat()
                        }
                      -}}
                - stop: family_entity unresolved
                  response_variable: response

            # Scan expansion slots for first available init slot
            - variables:
                _pm_slot: >-
                  {%- set _label_slots = label_entities('expansion_cabinet') | select('match','sensor\\.zenos_expansion_cabinet_') | sort | list -%}
                  {%- set _ns2 = namespace(s=[]) -%}
                  {%- if _label_slots | length == 0 -%}
                    {%- for i in range(1, 6) -%}
                      {%- set _ns2.s = _ns2.s + ['sensor.zenos_expansion_cabinet_' ~ i] -%}
                    {%- endfor -%}
                  {%- endif -%}
                  {%- set _slots = _label_slots if _label_slots | length > 0 else _ns2.s -%}
                  {%- set ns = namespace(v='') -%}
                  {%- for s in _slots -%}
                    {%- if ns.v == '' and states(s) == 'init' -%}
                      {%- set ns.v = s -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{- ns.v -}}

            # Gate: no available slot
            - if: "{{- _pm_slot == '' -}}"
              then:
                - variables:
                    response: >
                      {{-
                        {
                          'mode':      'provision_member',
                          'status':    'error',
                          'message':   'All 5 expansion slots are occupied. Deprovision an existing cabinet before adding a new member.',
                          'timestamp': now().isoformat()
                        }
                      -}}
                - stop: no expansion slot available
                  response_variable: response

            # Build profile payload: merge member_name as preferred_name + name
            - variables:
                _pm_profile: >-
                  {%- set _base = _pm_payload_raw | from_json if (_pm_payload_raw is string and _pm_payload_raw != '') else {} -%}
                  {%- set _base = _base if _base is mapping else {} -%}
                  {{- dict(_base, **{'preferred_name': _pm_name, 'name': _pm_name}) | tojson -}}
                _pm_cab_type: "{{- _pm_mtype if _pm_mtype in ['user', 'ai_user', 'family'] else 'user' -}}"

            # Provision the expansion slot (auto-stamps init → online_unmounted → mounts)
            - action: script.zen_dojotools_provisioner
              data:
                mode: provision
                cab_type: "{{- _pm_cab_type -}}"
                target_cabinet: "{{- _pm_slot -}}"
                profile_payload: "{{- _pm_profile -}}"
                caller_token: "{{- caller_token | default('') -}}"
              response_variable: _pm_prov_result

            # Gate: provisioner must succeed
            - variables:
                _pm_prov_ok: >-
                  {%- set _r = _pm_prov_result if _pm_prov_result is mapping else (_pm_prov_result | from_json if _pm_prov_result is string else {}) -%}
                  {{- (_r.get('status', '') == 'success') | bool -}}
                _pm_prov_msg: >-
                  {%- set _r = _pm_prov_result if _pm_prov_result is mapping else (_pm_prov_result | from_json if _pm_prov_result is string else {}) -%}
                  {{- _r.get('message', 'Provisioner returned unknown error.') -}}
            - if: "{{- not (_pm_prov_ok | bool) -}}"
              then:
                - variables:
                    response: >
                      {{-
                        {
                          'mode':               'provision_member',
                          'status':             'error',
                          'message':            'Provisioner failed: ' ~ _pm_prov_msg,
                          'slot':               _pm_slot,
                          'provisioner_result': _pm_prov_result,
                          'timestamp':          now().isoformat()
                        }
                      -}}
                - stop: provisioner failed
                  response_variable: response

            # Wire the new cabinet into the target family
            - action: script.zen_dojotools_identity
              data:
                mode: family_add_member
                family_entity: "{{- _pm_fam -}}"
                member_entity: "{{- _pm_slot -}}"
                member_type: "{{- _pm_cab_type -}}"
                household_entity: "{{- _hh_target -}}"
                caller_token: "{{- caller_token | default('') -}}"
              response_variable: _pm_fam_result

            - variables:
                _pm_fam_ok: >-
                  {%- set _r = _pm_fam_result if _pm_fam_result is mapping else (_pm_fam_result | from_json if _pm_fam_result is string else {}) -%}
                  {{- (_r.get('status', '') in ['ok', 'already_member']) | bool -}}
                _pm_fam_msg: >-
                  {%- set _r = _pm_fam_result if _pm_fam_result is mapping else (_pm_fam_result | from_json if _pm_fam_result is string else {}) -%}
                  {{- _r.get('message', 'family_add_member returned unknown status.') -}}
            - variables:
                response: >
                  {{-
                    {
                      'mode':               'provision_member',
                      'status':             'ok' if (_pm_fam_ok | bool) else 'partial',
                      'member_name':        _pm_name,
                      'member_entity':      _pm_slot,
                      'member_type':        _pm_cab_type,
                      'family_entity':      _pm_fam,
                      'provisioner_result': _pm_prov_result,
                      'family_result':      _pm_fam_result,
                      'warning':            none if (_pm_fam_ok | bool) else ('family_add_member failed: ' ~ _pm_fam_msg),
                      'timestamp':          now().isoformat(),
                      'caller_token':       caller_token | default('')
                    }
                  -}}
            - stop: provision_member complete
              response_variable: response

    # ── Step 3b: mode = resolve (default) ──────────────────────────────────
    # Pre-compute: extract cabinet entity, error state, reverse-lookup flag
    - variables:
        _r3b_entity: >-
          {%- set _c = cab | from_json if cab is string else cab -%}
          {%- set _c = _c if _c is mapping else {} -%}
          {%- set _eid = _c.get('identity', {}).get('cabinet', '') | trim -%}
          {%- set _norm = normalized | default('') | string | lower | trim -%}
          {# Group-type labels collide with AI cabinet membership labels (ai_user cabinet may
             carry 'household' label as membership, not as group identity). Re-resolve excluding
             ai_user cabinets when the target is a group-type label. #}
          {%- if _eid != '' and 'ai_user' in labels(_eid) and _norm in ['household', 'family_group'] -%}
            {{- label_entities(_norm) | select('in', label_entities('zen_cabinet')) | reject('in', label_entities('ai_user')) | list | first | default('') -}}
          {%- else -%}
            {{- _eid -}}
          {%- endif -%}
        _r3b_cab_error: >-
          {%- set _c = cab | from_json if cab is string else cab -%}
          {%- set _c = _c if _c is mapping else {} -%}
          {{- _c.get('error', '') -}}
        _r3b_is_reverse: >-
          {%- set _c = cab | from_json if cab is string else cab -%}
          {%- set _c = _c if _c is mapping else {} -%}
          {%- set _has_err = _c.get('error', '') in ['not_found', 'empty_input'] -%}
          {%- set _norm = normalized | string | trim -%}
          {%- set _is_plain = _norm not in ['', 'None', "''"] and '.' not in _norm -%}
          {{- (_has_err and _is_plain) | bool -}}
    # Pre-compute: entity type flags (step 1b — depend on _r3b_entity, can't be siblings)
    - variables:
        _r3b_is_ai: >-
          {{- (_r3b_entity != '' and 'ai_user' in labels(_r3b_entity)) | bool -}}
        _r3b_is_group: >-
          {{- (_r3b_entity != '' and
               ('household' in labels(_r3b_entity) or
                'family_group' in labels(_r3b_entity))) | bool -}}
        _r3b_group_type: >-
          {%- if _r3b_entity != '' and 'household' in labels(_r3b_entity) -%}household
          {%- elif _r3b_entity != '' and 'family_group' in labels(_r3b_entity) -%}family_group
          {%- else -%}{%- endif -%}
    # Early exit: ai_user cabinet → persona slice
    - choose:
        - conditions: "{{- _r3b_is_ai | bool -}}"
          sequence:
            - variables:
                _ai_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set ent = _r3b_entity | trim -%}
                  {%- set _e = CABS.cabinet_drawer_value(ent, 'zenai_essence', {}) | from_json() -%}
                  {%- set _e = _e.get('value', _e) if _e is mapping and 'value' in _e else _e -%}
                  {{- (_e if _e is mapping else {}) | tojson -}}
            - variables:
                response: >-
                  {%- set _e = _ai_raw | from_json if _ai_raw is string else _ai_raw -%}
                  {%- set _e = _e if _e is mapping else {} -%}
                  {%- set _id = _e.get('identity', {}) -%}
                  {%- set _jk = _e.get('jacket', {}) -%}
                  {{
                    {
                      'result':           'ok',
                      'is_person':        false,
                      'is_group':         false,
                      'is_ai':            true,
                      'cabinet':          _r3b_entity,
                      'persona_name':     _id.get('name', ''),
                      'pronouns':         _id.get('pronouns', ''),
                      'motif':            _id.get('motif', ''),
                      'primary_user':     _id.get('primary_user', ''),
                      'familiarity_level': _jk.get('familiarity_level', 'acquainted'),
                      'target_normalized': normalized,
                      'timestamp':        now().isoformat(),
                      'caller_token':     caller_token | default('')
                    }
                  }}
            - stop: ai_user persona slice
              response_variable: response
    # Early exit: group cabinet (household / family_group) → group slice
    - choose:
        - conditions: "{{- _r3b_is_group | bool -}}"
          sequence:
            - variables:
                _grp_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set ent = _r3b_entity | trim -%}
                  {%- set _key = '_household_profile' if _r3b_group_type == 'household' else '_family_profile' -%}
                  {%- set _g = CABS.cabinet_drawer_value(ent, _key, {}) | from_json() -%}
                  {%- set _g = _g.get('value', _g) if _g is mapping and 'value' in _g else _g -%}
                  {{- (_g if _g is mapping else {}) | tojson -}}
            - variables:
                response: >-
                  {%- set _g = _grp_raw | from_json if _grp_raw is string else _grp_raw -%}
                  {%- set _g = _g if _g is mapping else {} -%}
                  {%- if _r3b_group_type == 'household' -%}
                    {%- set _members = label_entities('user') | select('in', label_entities('zen_cabinet')) | list -%}
                    {%- set _fgroups = label_entities('family_group') | select('in', label_entities('zen_cabinet')) | list -%}
                    {{
                      {
                        'result':               'ok',
                        'is_person':            false,
                        'is_group':             true,
                        'is_ai':                false,
                        'group_type':           'household',
                        'cabinet':              _r3b_entity,
                        'household_name':       _g.get('household_name', ''),
                        'timezone':             _g.get('timezone', ''),
                        'address': {
                          'street':  _g.get('address', ''),
                          'city':    _g.get('city', ''),
                          'state':   _g.get('state', ''),
                          'zip':     _g.get('zip', ''),
                          'country': _g.get('country', '')
                        },
                        'member_cabinets':      _members,
                        'family_group_cabinets': _fgroups,
                        'home_mode':            states('sensor.zen_home_mode') | default(states('input_select.zen_home_mode'), true),
                        'quiet_hours_active':   is_state('binary_sensor.zen_quiet_hours', 'on'),
                        'target_normalized':    normalized,
                        'timestamp':            now().isoformat(),
                        'caller_token':         caller_token | default('')
                      }
                    }}
                  {%- else -%}
                    {%- set _members = label_entities(normalized) | select('in', label_entities('zen_cabinet')) | reject('in', label_entities('ai_user')) | list -%}
                    {{
                      {
                        'result':            'ok',
                        'is_person':         false,
                        'is_group':          true,
                        'is_ai':             false,
                        'group_type':        'family_group',
                        'cabinet':           _r3b_entity,
                        'family_name':       _g.get('family_name', _g.get('name', '')),
                        'relationship_type': _g.get('relationship_type', ''),
                        'member_cabinets':   _members,
                        'target_normalized': normalized,
                        'timestamp':         now().isoformat(),
                        'caller_token':      caller_token | default('')
                      }
                    }}
                  {%- endif -%}
            - stop: group slice
              response_variable: response
    # Pre-compute: spaces block and area labels from resolved cabinet
    - variables:
        _r3b_spaces: >-
          {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
          {%- set ent = _r3b_entity | trim -%}
          {%- if ent == '' -%}
            {{- {} | tojson -}}
          {%- else -%}
            {%- set _up = CABS.cabinet_drawer_value(ent, '_user_profile', {}) | from_json() -%}
            {%- set _fp = CABS.cabinet_drawer_value(ent, '_family_profile', {}) | from_json() -%}
            {%- set _p = _up if (_up is mapping and _up | length > 0) else (_fp if _fp is mapping else {}) -%}
            {{- _p.get('spaces', {}) | tojson -}}
          {%- endif -%}
        _r3b_area_labels: >-
          {%- set ent = _r3b_entity | trim -%}
          {%- if ent == '' -%}
            {{- [] | tojson -}}
          {%- else -%}
            {%- set _all = labels(ent) | default([]) -%}
            {{- (_all | reject('match', '^zen_') | reject('equalto', 'ai_user') | list) | tojson -}}
          {%- endif -%}
    # Pre-compute: reverse area residents (populated only when is_reverse=true)
    - variables:
        _r3b_reverse_residents: >-
          {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
          {%- if not (_r3b_is_reverse | bool) -%}
            {{- [] | tojson -}}
          {%- else -%}
            {%- set _norm = normalized | string | trim -%}
            {%- set _ai_cabs = label_entities('ai_user') | list -%}
            {%- set _area_cabs = label_entities(_norm)
                | select('match', '^sensor\\.')
                | select('in', label_entities('zen_cabinet'))
                | reject('in', _ai_cabs)
                | list -%}
            {%- set ns = namespace(residents=[]) -%}
            {%- for ent in _area_cabs[:10] -%}
              {%- set _up = CABS.cabinet_drawer_value(ent, '_user_profile', {}) | from_json() -%}
              {%- set _fp = CABS.cabinet_drawer_value(ent, '_family_profile', {}) | from_json() -%}
              {%- set _p = _up if (_up is mapping and _up | length > 0) else (_fp if _fp is mapping else {}) -%}
              {%- set _sp = _p.get('spaces', {}) if _p is mapping else {} -%}
              {%- set _nm = _p.get('preferred_name', _p.get('name', '')) if _p is mapping else '' -%}
              {%- set _ro = _p.get('role', '') if _p is mapping else '' -%}
              {%- set _tr = _p.get('tracking', {}) if _p is mapping else {} -%}
              {%- set _zone_ok = _tr.get('gps_zone', false) | bool -%}
              {%- set _area_lbls = labels(ent) | reject('match', '^zen_') | reject('equalto', 'ai_user') | list -%}
              {%- set ns2 = namespace(person_eid='') -%}
              {%- for lbl in _area_lbls if ns2.person_eid == '' -%}
                {%- set _pe = label_entities(lbl) | select('match', '^person\\.') | list | first | default('') -%}
                {%- if _pe != '' -%}{%- set ns2.person_eid = _pe -%}{%- endif -%}
              {%- endfor -%}
              {%- set _zone = states(ns2.person_eid) if _zone_ok and ns2.person_eid != '' else ('consent_required' if ns2.person_eid != '' else none) -%}
              {%- set ns.residents = ns.residents + [{'entity_id': ent, 'name': _nm, 'role': _ro, 'spaces': _sp, 'person_entity': ns2.person_eid if ns2.person_eid != '' else none, 'zone': _zone}] -%}
            {%- endfor -%}
            {{- ns.residents | tojson -}}
          {%- endif -%}
    # Pre-compute: tracking consent + primary_mobile entity ID + person entity from profile
    - variables:
        _r3b_person_entity: >-
          {%- set ent = _r3b_entity | trim -%}
          {%- if ent == '' -%}{{- '' -}}
          {%- else -%}
            {%- set _cab_labels = labels(ent) | reject('match', '^zen_') | reject('equalto', 'ai_user') | list -%}
            {%- set ns = namespace(person_eid='') -%}
            {%- for lbl in _cab_labels if ns.person_eid == '' -%}
              {%- set _pe = label_entities(lbl) | select('match', '^person\\.') | list | first | default('') -%}
              {%- if _pe != '' -%}{%- set ns.person_eid = _pe -%}{%- endif -%}
            {%- endfor -%}
            {{- ns.person_eid -}}
          {%- endif -%}
        _r3b_tracking: >-
          {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
          {%- set ent = _r3b_entity | trim -%}
          {%- if ent == '' -%}{{- {} | tojson -}}
          {%- else -%}
            {%- set _up = CABS.cabinet_drawer_value(ent, '_user_profile', {}) | from_json() -%}
            {%- set _fp = CABS.cabinet_drawer_value(ent, '_family_profile', {}) | from_json() -%}
            {%- set _p = _up if (_up is mapping and _up | length > 0) else (_fp if _fp is mapping else {}) -%}
            {{- _p.get('tracking', {}) | tojson -}}
          {%- endif -%}
        _r3b_primary_mobile: >-
          {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
          {%- set ent = _r3b_entity | trim -%}
          {%- if ent == '' -%}{{- '' -}}
          {%- else -%}
            {%- set _cab_labels = labels(ent) | reject('match', '^zen_') | reject('equalto', 'ai_user') | list -%}
            {%- set ns = namespace(tracker='') -%}
            {%- for lbl in _cab_labels if ns.tracker == '' -%}
              {%- set _pe = label_entities(lbl) | select('match', '^person\\.') | list | first | default('') -%}
              {%- if _pe != '' -%}
                {%- set _src = state_attr(_pe, 'source') | default('') -%}
                {%- if _src != '' -%}{%- set ns.tracker = _src -%}{%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {%- if ns.tracker == '' -%}
              {%- set _up = CABS.cabinet_drawer_value(ent, '_user_profile', {}) | from_json() -%}
              {%- set _fp = CABS.cabinet_drawer_value(ent, '_family_profile', {}) | from_json() -%}
              {%- set _p = _up if (_up is mapping and _up | length > 0) else (_fp if _fp is mapping else {}) -%}
              {%- set ns.tracker = _p.get('primary_mobile', '') | trim -%}
            {%- endif -%}
            {{- ns.tracker -}}
          {%- endif -%}
    # Pre-compute: mobile block — chase device_id → device_entities → filter by label then domain
    - variables:
        _r3b_mobile: >-
          {%- set _mob = _r3b_primary_mobile | trim -%}
          {%- set _tr = _r3b_tracking | from_json if _r3b_tracking is string else _r3b_tracking -%}
          {%- set _tr = _tr if _tr is mapping else {} -%}
          {%- if _mob == '' -%}
            {{- {'configured': false} | tojson -}}
          {%- else -%}
            {%- set _dev = device_id(_mob) | default('') -%}
            {%- if _dev == '' -%}
              {{- {'configured': true, 'entity_id': _mob, 'error': 'device_id not found'} | tojson -}}
            {%- else -%}
              {%- set _ents = device_entities(_dev) | list -%}
              {%- set ns = namespace(battery='', activity='', wifi='', geocoded='', sensors=[], binary_sensors=[]) -%}
              {%- for e in _ents -%}
                {%- set _lbls = labels(e) | list -%}
                {%- set _dom = e.split('.')[0] -%}
                {%- if 'mobile_battery' in _lbls or (ns.battery == '' and 'battery' in e and 'level' in e) -%}
                  {%- set ns.battery = e -%}
                {%- endif -%}
                {%- if 'mobile_activity' in _lbls or (ns.activity == '' and 'activity' in e and _dom == 'sensor') -%}
                  {%- set ns.activity = e -%}
                {%- endif -%}
                {%- if 'mobile_wifi' in _lbls or (ns.wifi == '' and ('ssid' in e or 'wifi_connection' in e) and _dom == 'sensor') -%}
                  {%- set ns.wifi = e -%}
                {%- endif -%}
                {%- if 'mobile_geocoded' in _lbls or (ns.geocoded == '' and 'geocoded' in e and _dom == 'sensor') -%}
                  {%- set ns.geocoded = e -%}
                {%- endif -%}
                {%- if _dom == 'sensor' -%}{%- set ns.sensors = ns.sensors + [e] -%}
                {%- elif _dom == 'binary_sensor' -%}{%- set ns.binary_sensors = ns.binary_sensors + [e] -%}
                {%- endif -%}
              {%- endfor -%}
              {%- set _zone_ok = _tr.get('gps_zone', false) | bool -%}
              {%- set _gps_ok  = _tr.get('gps_full',  false) | bool -%}
              {%- set _mob_d = {
                'configured':       true,
                'entity_id':        _mob,
                'device_id':        _dev,
                'zone':             states(_mob) if _zone_ok else 'consent_required',
                'battery':          states(ns.battery) | default(none) if ns.battery != '' else none,
                'battery_entity':   ns.battery if ns.battery != '' else none,
                'activity':         states(ns.activity) | default(none) if ns.activity != '' else none,
                'activity_entity':  ns.activity if ns.activity != '' else none,
                'wifi_ssid':        states(ns.wifi) | default(none) if ns.wifi != '' else none,
                'wifi_entity':      ns.wifi if ns.wifi != '' else none,
                'geocoded_entity':  ns.geocoded if ns.geocoded != '' else none,
                'all_entities':     _ents,
                'sensors':          ns.sensors,
                'binary_sensors':   ns.binary_sensors
              } -%}
              {%- if _gps_ok -%}
                {%- set _mob_d = _mob_d | combine({
                  'latitude':     state_attr(_mob, 'latitude'),
                  'longitude':    state_attr(_mob, 'longitude'),
                  'gps_accuracy': state_attr(_mob, 'gps_accuracy')
                }) -%}
              {%- endif -%}
              {{- _mob_d | tojson -}}
            {%- endif -%}
          {%- endif -%}
    # Pre-compute: presence block — person zone + device area (consent-gated)
    - variables:
        _r3b_presence: >-
          {%- set _tr = _r3b_tracking | from_json if _r3b_tracking is string else _r3b_tracking -%}
          {%- set _tr = _tr if _tr is mapping else {} -%}
          {%- set _zone_ok = _tr.get('gps_zone', false) | bool -%}
          {%- set _room_ok = _tr.get('room', false) | bool -%}
          {%- set _eid = _r3b_person_entity | default('') | trim -%}
          {%- set _zone = states(_eid) if _zone_ok and _eid != '' else ('consent_required' if _eid != '' else none) -%}
          {%- set _mob = _r3b_mobile | from_json if _r3b_mobile is string else _r3b_mobile -%}
          {%- set _mob = _mob if _mob is mapping else {} -%}
          {%- set _dev = _mob.get('device_id', '') | default('') -%}
          {%- set _raw_area = area_id(_dev) | default(none) if _dev not in ['', none] else none -%}
          {%- set _area_id = _raw_area if _room_ok else ('consent_required' if _raw_area is not none else none) -%}
          {%- set _area_name = area_name(_area_id) | default('') if _room_ok and _area_id is not none else '' -%}
          {{- {
            'person_entity': _eid if _eid != '' else none,
            'zone':          _zone,
            'at_home':       (states(_eid) == 'home') if _zone_ok and _eid != '' else none,
            'area_id':       _area_id,
            'area_name':     _area_name
          } | tojson -}}
    # Branch: reverse area lookup (label had no owner cabinet → find residents by area label)
    - choose:
        - conditions: "{{- _r3b_is_reverse | bool -}}"
          sequence:
            - variables:
                response: >
                  {{-
                    {
                      'result':            'area_residents',
                      'is_person':         false,
                      'is_group':          false,
                      'is_ai':             false,
                      'area_label':        normalized,
                      'area_residents':    _r3b_reverse_residents | from_json if _r3b_reverse_residents is string else _r3b_reverse_residents,
                      'target_normalized': normalized,
                      'timestamp':         now().isoformat(),
                      'caller_token':      caller_token | default('')
                    }
                  -}}
            - stop: Area reverse lookup complete
              response_variable: response
    - variables:
        response: >
          {{-
            {
              'result':           cab,
              'is_person':        not (_r3b_is_ai | bool) and not (_r3b_is_group | bool),
              'is_group':         _r3b_is_group | bool,
              'is_ai':            _r3b_is_ai | bool,
              'cabinet':          _r3b_entity,
              'person_entity':    _r3b_person_entity | default('') | trim,
              'target_normalized': normalized,
              'spaces':      _r3b_spaces      | from_json if _r3b_spaces      is string else _r3b_spaces,
              'area_labels': _r3b_area_labels  | from_json if _r3b_area_labels  is string else _r3b_area_labels,
              'tracking':    _r3b_tracking     | from_json if _r3b_tracking     is string else _r3b_tracking,
              'mobile':      _r3b_mobile       | from_json if _r3b_mobile       is string else _r3b_mobile,
              'presence':    _r3b_presence     | from_json if _r3b_presence     is string else _r3b_presence,
              'timestamp':        now().isoformat(),
              'caller_token':     caller_token | default('')
            }
          -}}
    - stop: Return Variables
      response_variable: response
