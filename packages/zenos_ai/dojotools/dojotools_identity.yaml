###############################################################################
# ZenOS-AI DojoTools: Identity
# Version: 5.10.0
# v5.10.0: acl_set / take_ownership and expansion cabinets. An expansion's
#   cabinet ACL is its host's (CABS acl_record), so a cabinet-scope call on an
#   expansion is refused and names the host. A mount pointer answers with its
#   cabinet's ACL (never a drawer acl), so a drawer-scope call on a host key
#   that expand_drawer moved writes the drawer's own ACL on the copy in the
#   expansion, where the drawer now lives.
# v5.9.3: a live-ack alert no longer lingers as an active alert for 24 hours.
#   It expires shortly after the wait window (clear_after_minutes), and
#   request_live_ack clears it as soon as it is answered or times out, so a
#   satisfied or stale ask never shows as active.
# v5.9.2: cert_list sends target to the persona editor only when one is
#   given ('else omit' rendered an empty target and logged 'omit' is
#   undefined on every call).
# v5.9.1: a clean full acl_migrate apply stamps acl_schema (version
#   CABS.acl_schema_current) on the system cabinet through the admin door;
#   Flynn's bootstrap skips the migration while that stamp is current. A
#   skipped cabinet (nothing loaded) is reported but does not hold the stamp back.
# v5.9.0: acl_migrate stamps each cabinet's class (the default ops row, #10626),
#   proposed from its labels for review in the dry run; the gate reads only
#   the stamp. Kata gets the default agent as owner. Every FileCabinet call
#   names caller_tool zen_dojotools_identity (the vault's only principal).
# v5.8.0: request_live_ack honors the console override (cert_admin_console_bypass,
#   thrown only by hand from the console) for EVERY live ack: the one
#   chokepoint, so hammer, reset, reset_all, take_ownership and every other ack
#   follow it and cannot drift. On an offline install it is the only approval
#   there is. Each use is audited (zen_event live_ack_console_bypass, system_log
#   warning). take_ownership's own copy of the check is retired; its approver
#   comes from the ack's answer.
# v5.7.1: take_ownership honors the console override (cert_admin_console_bypass
#   + a console session, the same condition as cert grants) in place of the
#   phone ack; the audit records approver console_bypass with the user id.
# v5.7.0: ACL writers (#10626). acl_set (owner only) changes ops in a cabinet or
#   drawer ACL; take_ownership is the escape hatch: cert
#   zenos.identity.acl_take_ownership + a live human ack on every call, naming
#   target, current and proposed ACL; only the ACL is rewritten, never the
#   value. Both audited (zen_event acl_changed / acl_ownership_taken with old
#   and new ACL, system_log). New fields drawer_key, acl_ops, reason.
# v5.6.3: acl_migrate also repairs stray VolumeInfo copies (the busted-key case
#   zen_repair_fam_cab_volumeinfo handled for one cabinet, now for every
#   cabinet): a copy that carries an id fills what VolumeInfo lost, and every
#   copy is removed through the admin door.
# v5.6.2: ACL schema gate (#10626). household_add_family, household_add_member,
#   set_principal, family_add_member and provision_member refuse
#   (acl_schema_upgrade_required, with the fix) when their household or family
#   is on the old ACL schema; force_action upgrades it first (acl_migrate on
#   that cabinet), re-checks, and continues. acl_migrate's re-check uses the
#   same CABS.acl_schema_check.
# v5.6.1: mode acl_migrate (#10626): brings every cabinet's VolumeInfo to the
#   ACL v2 record and fixes bad identity data (missing id, legacy guid field,
#   v1 lists, acls.family, a VolumeInfo cut down to acls, members entries with
#   the wrong guid). dry_run by default; apply needs confirm_action and is
#   verified by re-reading each cabinet. Flynn's bootstrap runs it.
# v5.6.0: ACL v2 (#10626). Every identity ACL read goes through the shared
#   record (CABS.acl_record / ID.principals) and every write stores v2:
#   {v: 2, owner, prime, partners, ops} with cabinet GUIDs as principals.
#   VolumeInfo writes go through the admin door's merge with only the changed
#   keys, so a read that comes back empty can never replace the whole drawer.
#   acls.family is no longer written (family membership lives in the members drawers); a
#   cabinet with no GUID gets an id (never 'guid') before it becomes a principal.
# v5.5.8: resolve area_labels holds only labels that are real HA areas; data-
#   routing labels (medical, context, user_cabinet, ...) no longer leak into
#   a who answer. The person-slug label walk is unchanged.
# v5.5.7: resolve answers who from the identity data. A person.* is found
#   anywhere in the household tree (member_index in zen_identity.jinja, not
#   just the household's own users), and resolve returns name, member_type,
#   person_entity and memberships (container, type, depth, role). membership
#   mode's member lookup uses the same walk; its duplicate walk is retired.
# v5.5.6: household_remove_member and family_remove_member find the member in
#   whichever members list holds it (users, ai_users, families) instead of
#   trusting member_type, which defaults to user. A family removed without
#   member_type was left in place with status ok, and family_remove_member
#   scrubbed the family's own VolumeInfo. Not a member now returns not_member
#   and writes nothing.
# v5.5.5 (#10637): the 11 AI_Cabinet_VolumeInfo writes (membership, GUID
#   stamps, partner links) go through zen_admintools_cabinet_writer, the admin
#   door, instead of raw set_variable_legacy events.
#
# v5.5.4: no mode and no identity input returns roots, this tool's own map
#   (who=resolve, belongs=membership, may=cert_list) from its tool_manifest modes.
# v5.5.3: household_add_member slot_occupied (user) points at family_add_member
#   and household_add_family instead of an ownership transfer; adds next_steps.
# v5.5.2 — declares zenos.agent.basic, the certified-agent badge (gates
#   nothing). Flynn OOBE requests it at completion; the grant needs a live ack.
#
# v5.5.1 — build_identity_manifest's home_mode/quiet_hours_active now
#   resolve via label instead of a hardcoded entity.
#
# v5.5.0 — new mode=whoami, the shared console-presence
#   resolver: resolves context.user_id to its person.* entity, plus
#   whether that person is head of household per the household cabinet's
#   ACLs (acls.owner/partner, never a label). context.user_id is also
#   non-empty for an MCP service account, so it does not prove a human is
#   at the console. is_hoh is INFORMATIONAL ONLY -- checked
#   against HA's current Template Functions Reference, the context variable
#   docs, and this project's own REST-only zen_sutra_ha_api that none of
#   them expose real HA-admin status, so there is no way to actually check
#   "is this user an admin" today. Gates needing "a real console session"
#   should check console_user != '' only. certadmin's cert_req_grant
#   console-bypass and (a future pass on) admintools' prompt_loader
#   cert_bypass gate both call this instead of re-deriving their own copy --
#   same chokepoint principle resolve_caller_identity already follows for
#   cert checks.
#
# v5.4.0 — resolve_caller_identity performs cert checks on the caller's behalf (2026-07-18)
#   New optional required_cert / required_cert_level inputs. When set, this mode
#   runs the persona_editor cert_list lookup itself against the resolved identity
#   and returns authorized: true/false. Tools must stop calling persona_editor
#   directly for their own cert checks — ask identity, don't check your own
#   borrowed identity yourself. Base-tier default is everyone/guest; elevation
#   is earned via cert, resolved centrally here, not per-tool.
#
# v5.3.1 — sim_mode_allowed defaults FALSE, factory-stamped (2026-07-18)
#   Fail-closed default: unset sim_mode_allowed now blocks, it doesn't allow.
#   zen_admintools_prompt_loader stamps an explicit value into
#   integrations_config.identity.sim_mode_allowed on every factory run, so a
#   fresh install always carries a real, deliberate value — never relies on
#   the in-code default surviving unnoticed.
#
# v5.3.0 — OS-level sim_mode enforcement (2026-07-18)
#   sim_mode is a whole-OS policy, not a per-tool choice. resolve_caller_identity
#   now reads integrations_config.identity.sim_mode_allowed (household cabinet)
#   and returns policy_status: blocked/allowed. Real (sim_mode: false) is
#   always allowed. Consumers must check policy_status, not just
#   resolved_identity, before proceeding.
#
# v5.2.0 — mode: resolve_caller_identity added (2026-07-18)
#   Platform-wide SP1 call-site — any gated dojotool should call this instead
#   of hardcoding its own default-agent fallback. Delegates to
#   zen_root_authentik (stub, no real Authentik yet). Returns sim_mode: true;
#   thread it through your own audit trail rather than swallow it. See
#   feedback_caller_id_not_authenticated + project_sp1_acl_candidates.
#
# Scripts:
#   zen_dojotools_identity — Household identity resolver + family group management
#
# MIGRATED FROM: scripts.yaml (2026-03-06)
#
# v4.1.0 — mode: prompt added
#   mode: resolve (default) — identity record, unchanged from v4.0.0
#   mode: prompt  — resolved capsule for the target construct via ai_capsule()
#                   Shows exactly what the model sees for that identity right now.
#
# v4.2.0 — mode: build_identity_manifest added
#   mode: build_identity_manifest — calls identity_roster(), writes
#   zen_identity_manifest drawer to the household cabinet. Same pattern as
#   zen_library_manifest in the manifest builder. Run after onboarding or
#   any time the roster changes.
#
# v4.3.0 — family group management + membership visibility
#
# v4.4.0 — RP2 identity fixes (2026-03-26)
#   FG-38/FG-40 guards on _new_entry/_new_fam_entry (variables: + tojson → HA
#     auto-parses to native dict; guard with 'if is string else')
#   _fvi/_sfvi FG-38 full three-round guard in all 3 tree paths × 2 depths
#     (resolve, membership tree, member_lookup)
#   friendly_name: VolumeInfo.friendly_name not .name — 20 call sites fixed
#   Dedup guards on household_add_family, household_add_member, family_add_member
#   Manifest auto-rebuild fires after all 6 roster-change operations
#   GUID stamping on add operations when member/family cab has no GUID yet
#   Name baked into member/family roster entries at add-time (not read at query-time)
#   FG-38 from_json guard on all _vi_raw reads + profile-first name resolution
#   mode: prompt — FG-40 guard on cab + no-target AI user fallback
#   _fm/_sfm value-unwrap in all tree builder paths
#
# v4.5.0 — RP2 GA (2026-03-26)
#   All response: >- blocks converted to inline {{ {...} }} format (BUG 8)
#   VolumeInfo reads: inline response blocks, zero >- remaining
#   Membership model: System → Household (occupancy) → Family (belonging, unlimited depth)
#   Security resolution caps at depth 2. Data model is unrestricted.
#   First user provisioned auto-joins household + default family.
#   AI auto-joins household only; explicit family invite = "part of the family".
#   Join/leave fires zen_event (family_member_joined / family_member_left) with
#   prompt_profile_update: true so the AI can surface naming/profile suggestions.
#
#   mode: household_add_family    — wire a family cabinet into a household
#   mode: household_remove_family — detach a family cabinet from a household
#   mode: household_add_member    — add user/ai_user to household; first occupant fills HoH/prime slot
#   mode: household_remove_member — remove user/ai_user; warns if removed entity is HoH/prime
#   mode: set_principal           — set/replace HoH (user) or prime AI (ai_user) on any container cabinet
#   mode: family_add_member       — add user/ai_user/family to a family; fires join event
#   mode: family_remove_member    — remove member; fires leave event; warns if removed entity is HoH/prime
#   mode: link_partners            — bidirectional delegation link (any entity pair: user↔user,
#                                    user↔ai_user, ai_user↔ai_user). Lists each in the other's ACL partners.
#                                    Partner = authorized to delegate on your behalf (governance, not social).
#   mode: unlink_partners          — sever delegation link; removes each from the other's ACL partners
#   mode: set_default_family      — change which family is the user's default (first = default)
#   mode: membership              — full tree view (principals + members + sub-families to depth 2)
#                                    or reverse lookup (which groups is this member in?)
#   mode: is_member               — depth-2 membership check: is member_entity in family_entity?
#
# v4.7.0 — presence block (2026-05-19)
#   resolve (person): presence { person_entity, zone, at_home, area_id, area_name }
#   All presence fields consent-gated via tracking.gps_zone / tracking.room
#   person_entity + cabinet now explicit top-level keys in person response
#   reverse area_residents: each entry gains person_entity + zone (consent-gated)
#
# v4.6.1 — group-type label collision fix
#   _r3b_entity: when resolved cabinet is ai_user AND normalized is a group-type label
#   (household/family_group), re-resolve excluding ai_user cabinets. Fixes
#   user_label=household returning AI persona instead of household group when
#   AI cabinet carries 'household' as a membership label.
#
# v4.6.0 — resolve: spaces injection + reverse area lookup
#   mode: resolve — response now includes `spaces` (live/work/work_zone from
#     _user_profile/_family_profile drawer) and `area_labels` (non-zen_ entity
#     labels on the resolved cabinet).
#   Reverse area lookup: when normalized is a plain label (no dot) and resolve
#     returns not_found/empty, falls back to label_entities(label) ∩ zen_cabinet
#     (non-ai_user only) → returns {result: 'area_residents', area_residents: [...]}
#     Each resident entry: {entity_id, name, role, spaces}.
###############################################################################

script:
  zen_dojotools_identity:
    alias: Zen DojoTools Identity
    mode: parallel
    max: 10
    description: >
      Household identity resolver, prompt inspector, group/family management,
      and area/space lens. Use for identity lookups, prompt/capsule
      inspection, or managing household/family membership and principals.
      Also the shared chokepoint other tools call for cert checks
      (resolve_caller_identity) and live human acks (request_live_ack) —
      not typically called directly for those. mode=help for the full
      per-mode reference.

    fields:
      mode:
        name: Mode
        description: >
          REQUIRED, exactly ONE value (not a set of boolean flags). resolve
          (default) reads identity/roster; the household_*/family_*/
          set_principal/link_partners modes manage group membership;
          resolve_caller_identity/request_live_ack/cert_list/whoami are the
          shared identity/cert-check/live-ack/console-admin-resolver
          chokepoints other tools call. mode=help for the full per-mode
          field reference.
        default: resolve
        selector:
          select:
            options:
              - resolve
              - prompt
              - render_prompt
              - build_identity_manifest
              - household_add_family
              - household_remove_family
              - household_add_member
              - household_remove_member
              - set_principal
              - family_add_member
              - family_remove_member
              - link_partners
              - unlink_partners
              - set_default_family
              - acl_migrate
              - acl_set
              - take_ownership
              - membership
              - is_member
              - provision_member
              - resolve_caller_identity
              - request_live_ack
              - cert_list
              - whoami
              - help

      user_label:
        selector:
          text:
        name: User Label
        description: Optional, the Index label referring to a valid ZenOS-AI user.
      user_cabinet:
        name: User Cabinet
        description: Under Construction - not functional yet. Optional, the entity_id
          of a valid user cabinet sensor.
        selector:
          entity:
            filter:
              domain: sensor
            multiple: false
      user_entity_id:
        name: Person
        description: >-
          Optional. The entity_id of a valid person.* entity (e.g. person.user).
          Resolved against member entries via person_entity_id field. Takes
          lower priority than user_label and user_cabinet.
        required: false
        selector:
          entity:
            filter:
              domain: person
            multiple: false
      user_guid:
        name: User GUID
        description: Under Construction - not functional yet. Optional, the Zen AI OS
          User GUID of a valid user.
        required: false
        selector:
          text:
            multiline: false
      family_entity:
        name: Family Cabinet
        description: entity_id of the family cabinet sensor. Required for household_add_family,
          family_add_member, family_remove_member.
        required: false
        selector:
          entity:
            filter:
              domain: sensor
            multiple: false
      member_entity:
        name: Member Cabinet
        description: entity_id of the member cabinet sensor (user, ai_user, or sub-family).
          Required for family_add_member, family_remove_member, household_add_member,
          household_remove_member.
        required: false
        selector:
          entity:
            filter:
              domain: sensor
            multiple: false
      member_type:
        name: Member Type
        description: Type of member — user, ai_user, or family. Required for family_add_member,
          household_add_member, household_remove_member.
        required: false
        default: user
        selector:
          select:
            options:
              - user
              - ai_user
              - family
              - tool_manifest
      ai_entity:
        name: Partner Cabinet (Entity B)
        description: entity_id of the second cabinet for partner link operations. Any
          cabinet type — user, ai_user, etc. Required for link_partners, unlink_partners.
          Note — partner in this model means delegation authority, not social relationship.
        required: false
        selector:
          entity:
            filter:
              domain: sensor
            multiple: false
      household_entity:
        name: Household Cabinet
        description: entity_id of a specific household cabinet sensor. Optional — overrides
          the default household resolver (zen_default_household_cabinet_resolved). Use
          for multi-household installations.
        required: false
        selector:
          entity:
            filter:
              domain: sensor
            multiple: false
      member_name:
        name: Member Name
        description: >-
          Display name for the new member. Required for provision_member.
          Stored as preferred_name (and name) in the provisioned cabinet profile drawer.
        required: false
        selector:
          text:
            multiline: false
      profile_payload:
        name: Profile Payload (JSON)
        description: >-
          Optional JSON string with additional profile fields to seed into the
          provisioned cabinet (first_name, last_name, pronouns, role, etc.).
          Merged with member_name. Used only by provision_member.
        required: false
        selector:
          text:
            multiline: true
      required_cert:
        name: Required Cert (resolve_caller_identity only)
        description: >-
          Cert name to check on the caller's behalf (e.g. infra_container_control).
          If set, resolve_caller_identity runs the cert_list lookup itself against the
          resolved identity and returns authorized: true/false — the caller never
          touches persona_editor directly.
        required: false
        default: ''
        selector:
          text:
      required_cert_level:
        name: Required Cert Level (resolve_caller_identity only)
        description: Minimum cert level needed when required_cert is set. Default 1.
        required: false
        default: 1
        selector:
          number:
            min: 0
            max: 10
      target_entity:
        name: Target Entity
        description: >-
          acl_migrate: one cabinet to migrate (default every zen_cabinet).
          acl_set / take_ownership: the cabinet whose ACL to change.
          resolve_caller_identity: optional entity_id the caller is about to act on. If set alongside
          required_cert, resolve_caller_identity resolves cert_scope against
          it itself (via the shared cert_scope_check macro) and returns
          scope_decision: allow/deny/default — consumers should use this
          instead of walking cert_scope themselves. Every SASE-shaped tool
          shares this one resolution path so a future deny-ACL rollout is a
          data-shape change here only, not five separate rewrites.
        required: false
        default: ''
        selector:
          text:
      drawer_key:
        name: Drawer Key
        description: >-
          acl_set / take_ownership: a drawer in target_entity whose own ACL
          (the envelope acl) to change. Omit for the cabinet's ACL.
        required: false
        selector:
          text:
      acl_ops:
        name: ACL Ops
        description: >-
          acl_set / take_ownership: ops to set, e.g. {"w": {"who": ["*"],
          "cert": "zenos.fc.write:1", "ack": false}}. Only r, w, d, a; each op
          named here replaces that op, the others keep what they had.
        required: false
        selector:
          object:
      reason:
        name: Reason
        description: "take_ownership (required) and acl_set: why, recorded in the audit event and shown in the live ack."
        required: false
        selector:
          text:
      dry_run:
        name: Dry Run
        description: >-
          acl_migrate only. true (default) reports what would change and writes
          nothing; false writes it (also needs confirm_action=true).
        selector:
          boolean:
      force_action:
        name: Force Action
        description: >-
          Setup modes (household_add_family, household_add_member,
          set_principal, family_add_member, provision_member): when the
          household or family is on the old ACL schema, upgrade it first
          (acl_migrate on that cabinet), then continue. Without it those modes
          refuse with acl_schema_upgrade_required.
        required: false
        default: false
        selector:
          boolean:
      confirm_action:
        name: Confirm Action
        description: >-
          acl_migrate: required (with dry_run=false) to apply.
          set_principal: required only when replacing an already-occupied
          HoH/prime slot with a DIFFERENT entity — prevents a takeover of an
          already-established household by a confused or compromised caller.
          Not required to fill an empty slot, or to re-set the same entity
          already occupying it.
        required: false
        default: false
        selector:
          boolean:
      persona_target:
        name: Persona Target (cert_list only)
        description: "ai_user cabinet entity_id to check certs for. Omit for the default agent."
        required: false
        default: ''
        selector:
          entity:
            filter:
              domain: sensor
      ack_message:
        name: Ack Message (request_live_ack only)
        description: >-
          Required for request_live_ack. Text shown to the household admin
          in the approval push, e.g. "Agent requests cert_req_grant: lock_control
          level 1. Approve?"
        required: false
        default: ''
        selector:
          text:
            multiline: true
      ack_key:
        name: Ack Key (request_live_ack only)
        description: >-
          Optional dedup/audit key for the underlying alert. Auto-generated
          from a timestamp if omitted.
        required: false
        default: ''
        selector:
          text:
      ack_max_wait_seconds:
        name: Ack Max Wait Seconds (request_live_ack only)
        description: >-
          How long to poll for the admin's response before timing out.
          Hard-capped at 150 (2:30) in code regardless of what's passed —
          a longer approval window is a de-escalation attack surface, no
          caller (compromised or not) can push it past this ceiling.
        required: false
        default: 90
        selector:
          number:
            min: 15
            max: 150
            mode: box
      ack_poll_interval_seconds:
        name: Ack Poll Interval Seconds (request_live_ack only)
        description: "How often to check for a response. Floored at 5 in code."
        required: false
        default: 15
        selector:
          number:
            min: 5
            max: 60
            mode: box
      ack_notify_target:
        name: Ack Notify Target (request_live_ack only)
        description: >-
          Where the approval push goes. Default postman -- phone push via
          zen_dojotools_postman, response cached to alert_response_<key> in the
          kata cabinet that get_response reads. 'zen_display' (2026-09-06, namespaced to avoid
          colliding with any real notify.display service) casts the ask
          to a physical zen_display_target instead (requires display_room= on the
          underlying fire call) -- a Lovelace tap writes into the SAME response
          cache via a non-AI-exposed internal script, so get_response/
          request_live_ack see it identically either way. 'mobile' is NOT a magic
          keyword alertmanager recognizes -- it falls through to a literal
          `notify.mobile` service call (doesn't exist) and never captures a
          response at all. Real, pre-existing bug: Portainer's original d-class ack
          (and every consumer of this mode, before that fix) used
          notify_target=mobile and could never have actually captured a real
          approval -- always silent dispatch failure or eternal timeout,
          fail-closed by accident rather than by working as designed.
        required: false
        default: postman
        selector:
          text:
      display_room:
        name: Display Room (request_live_ack, ack_notify_target includes zen_display only)
        description: >-
          Required when ack_notify_target includes zen_display (comma-composable, e.g.
          postman,zen_display). Room/area to cast the ask to -- passed straight through
          to zen_dojotools_alertmanager's fire call, which forwards it to
          zen_dojotools_display's own room= resolution.
        required: false
        selector:
          text:
      caller_token:
        name: Caller Token
        required: false
        default: ''
        selector:
          text:
        description: 'Reserved. Governance stub — echoed in response. SP1 enforcement
          not yet active.'

    sequence:

    # No mode AND no identity input = roots (this tool's own map). A call
    # that names anyone (user_*, household/family/member, persona, cert)
    # still resolves exactly as before.
    - variables:
        _id_bare: >-
          {{ (mode | default('', true) | string | trim) == ''
             and not (user_label | default('', true) or user_cabinet | default('', true)
                      or user_entity_id | default('', true) or user_guid | default('', true)
                      or household_entity | default('', true) or family_entity | default('', true)
                      or member_entity | default('', true) or ai_entity | default('', true)
                      or persona_target | default('', true) or required_cert | default('', true)) }}

    - if: "{{ (mode | default('') | lower) == 'tool_manifest' or _id_bare }}"
      then:
      - variables:
          response: >-
            {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
            {{ MF.tool_manifest(
                tool='zen_dojotools_identity',
                display_name='Identity',
                tier='dojotools',
                version='1.2.0',
                health={'configured': true, 'status': 'ok', 'notes': []},
                required_labels=['dojotools'],
                optional_labels=['identity', 'personality_module'],
                consumes=['persona_or_user'],
                returns=['identity_data'],
                modes={'who': 'resolve', 'belongs': 'membership', 'may': 'cert_list',
                       'help': 'help', 'manifest': 'tool_manifest'},
                icon='mdi:account-circle',
                color='cyan',
                stripe=3,
                impact='soft',
                mcp_exposed=true,

                caller_token=caller_token | default('')
            ) | from_json | combine({
                'certs_required': [{
                  'cert': 'zenos.agent.basic',
                  'display_name': 'Certified ZenOS Agent',
                  'description': 'Baseline identity badge, requested at Flynn OOBE completion (flynn_oobe.yaml mode=complete). Confirms this is a certified ZenOS Agent and gates nothing. Like every grant it goes through cert_req_grant and needs a live ack. Also a member of the zenos_agent_basic bundle, so a bundle regrant includes it.',
                  'max_level': 1,
                  'gates': [],
                  'live_ack_required_for': [],
                  'grant_via': 'flynn_oobe.yaml mode=complete requests it (live ack); or persona_editor mode=cert_req_grant cert_component=zenos.agent.basic',
                  'bundle': ['zenos_agent_basic']
                }, {
                  'cert': 'zenos.identity.acl_take_ownership',
                  'display_name': 'ACL take-ownership',
                  'description': 'Take ownership of a cabinet or drawer ACL (identity mode=take_ownership): the escape hatch when an ACL locks out what it should not. Every use also asks a live human (the ask names the target, the current and the proposed ACL) and is audited with the old and new ACL.',
                  'max_level': 1,
                  'gates': ['take_ownership'],
                  'live_ack_required_for': ['take_ownership'],
                  'grant_via': 'persona_editor mode=cert_req_grant cert_component=zenos.identity.acl_take_ownership'
                }]
            }) -}}
      - if: "{{ _id_bare }}"
        then:
          - variables:
              response: >-
                {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
                {{- MF.tool_roots_reply(response, about='Who is who in this house: members, families and agents, who belongs where, and who may do what (certs).') | from_json -}}

    - if: "{{ (mode | default('') | lower) == 'help' }}"
      then:
      - variables:
          response:
            status: ok
            mode: help
            tool: zen_dojotools_identity
            modes:
              resolve: "Default. No target: full identity roster. With target (label/person entity/cabinet entity/GUID): identity record + spaces (live/work/work_zone) + area_labels. Area label with no owner cabinet: area_residents reverse lookup instead."
              prompt: "Renders the compiled prompt capsule for target via zen.ai_capsule() -- exactly what the model sees for that identity right now, plus prompt health signals and signature status."
              render_prompt: "Renders the FULL assembled system prompt via zen.render_prompt(), all 10 sections, using the active persona from input_text.zenos_persona_name. No target needed."
              build_identity_manifest: "Rebuilds zen_identity_manifest in the household cabinet from the live roster. Run after onboarding or any roster change."
              household_add_family: "Wire a family cabinet into a household."
              household_remove_family: "Detach a family cabinet from a household."
              household_add_member: "Add a user or ai_user to a household (member_type selects which). First occupant fills HoH/prime slot; blocked if already occupied -- use set_principal instead."
              household_remove_member: "Remove a user or ai_user from a household. Warns if the removed entity held the HoH/prime slot (use set_principal to transfer first)."
              set_principal: "Set or replace the HoH (member_type=user) or prime AI partner (member_type=ai_user) on any container cabinet. Single-occupant slot -- previous occupant replaced."
              family_add_member: "Add a user/ai_user/family to a family. Nesting allowed, resolver caps at depth 2."
              family_remove_member: "Remove a member from a family. Warns if the removed entity is HoH/prime."
              link_partners: "Bidirectional delegation link between any two entities. Lists each in the other's ACL partners (by GUID) -- authorizes delegation, not a social label."
              unlink_partners: "Sever a delegation link. Removes each entity from the other's ACL partners."
              set_default_family: "Change a user's default family (first family joined is default otherwise)."
              acl_set: "Owner only. Changes ops in a cabinet's ACL (target_entity) or one drawer's own ACL (+ drawer_key): acl_ops {r|w|d|a: {who, cert, ack}}. The caller must be the cabinet's ACL owner; anyone else is refused (take_ownership is the escape hatch). Audited (zen_event acl_changed)."
              take_ownership: "The auditable escape hatch for a bad or locked ACL. target_entity (+ drawer_key), reason (required), acl_ops optional. Needs cert zenos.identity.acl_take_ownership and a live human ack on EVERY call (the ask names the target, the current and the proposed ACL); the console override stands in for the ack (request_live_ack honors it for every ack), and the audit says so. Cabinet: the caller becomes the ACL owner, acl_ops replace the named ops. Drawer: its own ACL ops become acl_ops (empty = inherit the cabinet). Rewrites only the ACL, never the value. Audited (zen_event acl_ownership_taken with old and new ACL)."
              acl_migrate: "Brings every cabinet's VolumeInfo to the ACL v2 record and fixes bad identity data: a missing id is stamped (a legacy guid field becomes the id), v1 owner/partner lists become GUIDs, acls.family and placeholders go, a missing flags/friendly_name is restored, members entries get their cabinet's GUID, stray VolumeInfo copies (ai_cabinet_volumeinfo, _ai_cabinet_volumeinfo) fill what VolumeInfo lost and are removed. dry_run (default true) only reports; dry_run=false + confirm_action=true writes, then re-reads each cabinet (remaining lists any it could not fix). target_entity scopes it to one cabinet. Dangling GUIDs (no cabinet has them) are reported, never dropped. Idempotent: a clean install plans nothing. Flynn's bootstrap runs it."
              membership: "Full tree view: principals, members, sub-families to depth 2. If member_entity is a user/ai_user instead of a container, returns their groups + role in each. Omit both for the default household tree."
              is_member: "Depth-2 membership check. member_entity=subject, family_entity=container. Returns {is_member, depth: 1|2|null}."
              provision_member: "Full orchestration for a new family member with no HA person entity: finds a free expansion slot, provisions it, wires into the target family, rebuilds the manifest. Requires member_name. Hard-stops if all 5 expansion slots are occupied."
              resolve_caller_identity: "Platform-wide SP1 call-site -- the single chokepoint every tool's cert-gate should call instead of re-deriving its own identity/cert check. Enforces sim_mode OS policy (blocked/allowed). Optional required_cert(+required_cert_level, default 1) runs that cert check on the caller's behalf, response includes authorized:true/false."
              request_live_ack: "Single chokepoint for 'get me a live human yes/no' -- fires an alertmanager alert (response_type=yes_no, breakthrough=true so it isn't held by the sleep gate) and polls for the answer. Requires ack_message. Returns approved/declined/timeout. One-shot per call; callers needing a time-boxed grant still write that themselves after a true response."
              cert_list: "What could exist, and what do I actually hold right now -- combines the live cert catalog (zen_dojotools_manifest mode=cert_audit) with the live grant roster (persona_editor's own cert_list) in one call. Gated on the caller's own identity resolving policy_status=allowed, no specific cert or live-ack needed."
              help: "This reference."
            fields:
              target: "resolve/prompt: label, person entity, cabinet entity, or GUID to look up."
              member_name: "provision_member: required, name for the new family member."
              ack_message: "request_live_ack: required, the yes/no prompt text shown to the household admin."
              ack_key: "request_live_ack: optional dedup key, auto-generated if omitted."
              required_cert: "resolve_caller_identity: optional cert component to check on the caller's behalf."
              force_action: "household_add_family, household_add_member, set_principal, family_add_member, provision_member: these refuse (code acl_schema_upgrade_required) when their household or family is on the old ACL schema. Fix with acl_migrate, or retry with force_action=true: identity upgrades that cabinet, checks it, and continues (error only if the upgrade fails)."
              dry_run: "acl_migrate: true (default) reports the plan; false writes it (needs confirm_action=true)."
              target_entity: "resolve_caller_identity: the entity the caller acts on. acl_migrate: one cabinet to migrate (default every zen_cabinet)."
            caller_token: "{{ caller_token | default('') }}"
      - variables:
          _id_help_message: >-
            {%- set ns = namespace(out='Identity resolution + household/family membership graph. ') -%}
            {%- for k, v in response.modes.items() -%}
              {%- set ns.out = ns.out ~ 'mode=' ~ k ~ ' -- ' ~ v ~ ' ' -%}
            {%- endfor -%}
            {{ ns.out | trim }}
      - variables:
          response: "{{ response | combine({'status': 'help', 'message': _id_help_message}) }}"

    # ── request_live_ack — single chokepoint for "get me a live human
    # yes/no", shared by zen_dojotools_infra's Portainer d-class ack,
    # zen_dojotools_locks' escalation_request, and
    # zen_dojotools_persona_editor's cert_req_grant/cert_req_revoke instead
    # of each hand-rolling the same ~40-line fire+poll block. Same
    # "consumers must call identity instead of re-deriving their own
    # resolved-identity fallback" principle resolve_caller_identity already
    # established — this is the ack-flow equivalent. One-shot per call
    # (fire, poll, return approved/declined/timeout) -- callers that need a
    # TIME-BOXED grant (not just one action's approval) still own writing
    # that grant to their own cabinet drawer after a true response here,
    # same as zen_dojotools_locks' escalation_request does today. ──
    - if: "{{ response is not defined and (mode | default('') | lower) == 'request_live_ack' }}"
      then:
      - variables:
          _rla_message: "{{ ack_message | default('', true) | string | trim }}"
      - if: "{{ _rla_message == '' }}"
        then:
        - variables:
            response:
              status: error
              error: ack_message_required
              detail: "request_live_ack requires ack_message."
              caller_token: "{{ caller_token | default('') }}"
    # ── Console override (cert_admin_console_bypass). Thrown only by hand, from
    # the console (prompt_loader mode=cert_bypass, never reachable by an agent).
    # Whoever throws it takes the responsibility a live ack would: on an
    # offline install (no agent, no Postman) it is the only approval there is.
    # Every live ack honors it here, the one chokepoint (hammer, reset,
    # reset_all, take_ownership, cert grants, ...), so no caller can drift. Each
    # use is audited (zen_event live_ack_console_bypass + system_log warning).
    - if: "{{ response is not defined and (mode | default('') | lower) == 'request_live_ack' }}"
      then:
      - variables:
          _rla_override: >-
            {%- import 'zenos_ai/zen_identity.jinja' as ID -%}
            {{- ID.console_override() | trim == 'true' -}}
          _rla_uid: "{{ (context.user_id | default('', true) | string | trim) if context is defined else '' }}"
      - if: "{{ _rla_override | bool }}"
        then:
        - event: zen_event
          event_data:
            event:
              timestamp: "{{ now().isoformat() }}"
              component: zen_dojotools_identity
              severity: warning
              kind: live_ack_console_bypass
              summary: "Live ack approved by the console override: {{ _rla_message[:200] }}"
              metadata:
                ack_message: "{{ _rla_message }}"
                user_id: "{{ _rla_uid }}"
        - action: system_log.write
          data:
            level: warning
            logger: zen_dojotools_identity
            message: "live_ack_console_bypass user_id={{ _rla_uid }} ack={{ _rla_message[:300] }}"
        - variables:
            response:
              status: ok
              mode: request_live_ack
              approved: true
              reason: console_bypass
              user_id: "{{ _rla_uid }}"
              waited_seconds: 0
              caller_token: "{{ caller_token | default('') }}"
    - if: "{{ response is not defined and (mode | default('') | lower) == 'request_live_ack' }}"
      then:
      - variables:
          _rla_key: "{{ ack_key | default('', true) | string | trim }}"
          _rla_max_wait: "{{ [(ack_max_wait_seconds | default(90, true) | int(90)), 150] | min }}"
          _rla_poll_interval: "{{ [(ack_poll_interval_seconds | default(15, true) | int(15)), 5] | max }}"
          _rla_notify_target: "{{ ack_notify_target | default('postman', true) | string | trim }}"
      - variables:
          _rla_key: "{{ _rla_key if _rla_key != '' else 'live_ack_' ~ (now().timestamp() | int) }}"
          _rla_max_tries: "{{ ([(ack_max_wait_seconds | default(90, true) | int(90)), 150] | min / [(ack_poll_interval_seconds | default(15, true) | int(15)), 5] | max) | round(0, 'ceil') | int }}"
      - action: script.zen_dojotools_alertmanager
        response_variable: _rla_fire_raw
        continue_on_error: true
        data:
          mode: fire
          alert_key: "{{ _rla_key }}"
          severity: warn
          message: "{{ _rla_message }}"
          notify_target: "{{ _rla_notify_target }}"
          display_room: "{{ display_room | default('', true) | string | trim }}"
          response_type: yes_no
          # The ask is only answerable during the wait window; past it the
          # alert must not linger as active (the 24h default did).
          clear_after_minutes: "{{ (((_rla_max_tries | int) * (_rla_poll_interval | int)) / 60) | round(0, 'ceil') | int + 1 }}"
          # A live-ack bypass can be security or
          # life related, so this call needs an urgency/
          # breakthrough override -- severity=warn alone maps to
          # urgency 5, well under the sleep gate's threshold of 9,
          # which would mean every request_live_ack call during quiet/night hours
          # silently never reaches a human.
          # This is the chokepoint gating deliberate human-requested
          # security actions (clearing Paused, cert grants, etc) -- it
          # must never be suppressed by the same gate that correctly
          # holds back routine FYI notifications until morning.
          breakthrough: true
      # ── alertmanager's fire mode is fire-and-forget: it emits a zen_event
      # and returns immediately (real dispatch happens async in a separate
      # listener automation) -- its response is {'mode':'fire',...,
      # 'queued':true}, NEVER a 'status':'success' key. Checking for
      # 'status'=='success' here is always false regardless of real
      # outcome. Same wrong pattern also exists in
      # Portainer's original d-class ack (not fixed there independently --
      # it's the same call shape now that
      # infra delegates to this shared mode, so this fix covers it too).
      # Real signal: did the call even complete without erroring. ──
      - if: "{{ _rla_fire_raw is not mapping or _rla_fire_raw.get('mode') != 'fire' }}"
        then:
        - variables:
            response:
              status: ok
              mode: request_live_ack
              approved: false
              reason: dispatch_failed
              waited_seconds: 0
              caller_token: "{{ caller_token | default('') }}"
    - if: "{{ response is not defined and (mode | default('') | lower) == 'request_live_ack' }}"
      then:
      - variables:
          _rla_ack_result: pending
          _rla_ack_tries: 0
      - repeat:
          while:
            - condition: template
              value_template: "{{ _rla_ack_result == 'pending' and _rla_ack_tries < _rla_max_tries }}"
          sequence:
          - delay:
              seconds: "{{ _rla_poll_interval }}"
          - action: script.zen_dojotools_alertmanager
            response_variable: _rla_ack_raw
            continue_on_error: true
            data:
              mode: get_response
              alert_key: "{{ _rla_key }}"
          - variables:
              # zen_dojotools_alertmanager wraps its response in the canonical
              # OS.envelope() shape -- its own domain fields
              # (status=captured/ack_action) live under .result, not at the
              # top level. envelope's own top-level
              # 'mode' still matches (passed through unchanged), but 'status'
              # at the top level is now the generic success/error envelope
              # status, not alertmanager's own 'captured' value.
              _rla_ack_inner: "{{ _rla_ack_raw.get('result', {}) if _rla_ack_raw is mapping else {} }}"
              _rla_ack_result: >-
                {%- if _rla_ack_inner is mapping and _rla_ack_inner.get('status') == 'captured' and _rla_ack_inner.get('ack_action', '') in ['yes', 'no'] -%}
                  {{ _rla_ack_inner.get('ack_action') }}
                {%- else -%}pending{%- endif -%}
              _rla_ack_tries: "{{ _rla_ack_tries + 1 }}"
      # Answered or timed out: the ask is over, take it off the active list
      # (the answer itself stays in the alert_response cache).
      - action: script.zen_dojotools_alertmanager
        continue_on_error: true
        data:
          mode: clear
          alert_key: "{{ _rla_key }}"
      - variables:
          response:
            status: ok
            mode: request_live_ack
            approved: "{{ _rla_ack_result == 'yes' }}"
            reason: "{{ 'approved' if _rla_ack_result == 'yes' else ('declined' if _rla_ack_result == 'no' else 'timeout') }}"
            waited_seconds: "{{ _rla_ack_tries * _rla_poll_interval }}"
            caller_token: "{{ caller_token | default('') }}"

    # ── cert_list — "what could exist, and what do I actually hold right
    # now." This is a protected gate of ident READ, not
    # necessarily admin -- reading your own current permission state isn't
    # dangerous the way granting/revoking is (that's why cert_req_grant/revoke
    # get the full catalog+live-ack treatment above, and this doesn't), but
    # it shouldn't be wide open to a caller whose identity resolution is
    # itself blocked (sim_mode rejected by OS policy) either. Gate: calls
    # itself (resolve_caller_identity, no required_cert) and requires
    # policy_status == 'allowed' -- no specific cert, no live ack. Combines
    # the LIVE-CALCULATED catalog (zen_dojotools_manifest mode=cert_audit --
    # every cert any tool actually declares via tool_manifest certs_required,
    # no separate hand-maintained file) with the live
    # grant roster from persona_editor's own cert_list (what's actually held
    # right now), so a caller gets one useful answer instead of having to
    # cross-reference two tools itself. ──
    - if: "{{ response is not defined and (mode | default('') | lower) == 'cert_list' }}"
      then:
      - action: script.zen_dojotools_identity
        response_variable: _cl_id_raw
        continue_on_error: true
        data:
          mode: resolve_caller_identity
          caller_token: "{{ caller_token | default('') }}"
      - variables:
          _cl_policy_status: "{{ _cl_id_raw.get('policy_status', 'blocked') if _cl_id_raw is mapping else 'blocked' }}"
      - if: "{{ _cl_policy_status != 'allowed' }}"
        then:
        - variables:
            response:
              status: denied
              mode: cert_list
              reason: identity_policy_blocked
              detail: "resolve_caller_identity did not return an allowed identity -- cert_list refused."
              caller_token: "{{ caller_token | default('') }}"
    - if: "{{ response is not defined and (mode | default('') | lower) == 'cert_list' }}"
      then:
      - action: script.zen_dojotools_manifest
        response_variable: _cl_catalog_raw
        continue_on_error: true
        data:
          mode: cert_audit
          caller_token: "{{ caller_token | default('') }}"
      - variables:
          # zen_dojotools_manifest wraps its response in the canonical
          # OS.envelope() shape -- its own fields (catalog/etc) live under
          # .result, not at the top level.
          _cl_catalog: "{{ (_cl_catalog_raw.get('result', _cl_catalog_raw) if _cl_catalog_raw is mapping else {}).get('catalog', {}) }}"
      - variables:
          _cl_target: "{{ persona_target | default('', true) | string | trim }}"
      - action: script.zen_dojotools_persona_editor
        response_variable: _cl_pe_raw
        continue_on_error: true
        data: "{{ dict({'mode': 'cert_list'}, target=_cl_target) if _cl_target != '' else {'mode': 'cert_list'} }}"
      - variables:
          _cl_pe_raw: "{{ _cl_pe_raw.get('result', _cl_pe_raw) if _cl_pe_raw is mapping else _cl_pe_raw }}"
      - variables:
          _cl_held: "{{ _cl_pe_raw.get('certifications', {}) if _cl_pe_raw is mapping else {} }}"
      - variables:
          _cl_combined: >-
            {%- set ns = namespace(items=[]) -%}
            {%- for _key, _def in _cl_catalog.items() -%}
              {%- set _held_entry = _cl_held.get(_key, none) -%}
              {%- set ns.items = ns.items + [{
                'cert': _key,
                'display_name': _def.get('display_name', _key),
                'description': _def.get('description', ''),
                'gates': _def.get('gates', []),
                'max_level': _def.get('max_level', 4),
                'held': _held_entry is not none,
                'held_level': (_held_entry.get('level', 0) if _held_entry is not none else none),
                'held_scope': (_held_entry.get('scope', []) if _held_entry is not none else []),
                'held_constraints': (_held_entry.get('constraints', []) if _held_entry is not none else [])
              }] -%}
            {%- endfor -%}
            {{ ns.items }}
      - variables:
          response:
            status: ok
            mode: cert_list
            target: "{{ _cl_pe_raw.get('target', '') if _cl_pe_raw is mapping else '' }}"
            certs: "{{ _cl_combined }}"
            caller_token: "{{ caller_token | default('') }}"

    # ── resolve_caller_identity — real call-site for SP1, shunted until active ──
    # OS-level sim_mode gate lives HERE, not per-consumer: integrations_config.identity.
    # sim_mode_allowed (household cabinet, default FALSE — fail closed until the
    # prompt loader's factory stamp or an admin explicitly turns it on) is the
    # single policy switch.
    #   sim_mode=true  + allowed=false -> blocked (resolved_identity withheld)
    #   sim_mode=true  + allowed=true  -> allowed (today's default)
    #   sim_mode=false (real)          -> always allowed regardless of the flag
    - if: "{{ (mode | default('') | lower) == 'resolve_caller_identity' }}"
      then:
        - action: script.zen_root_authentik
          response_variable: _rci_raw
          continue_on_error: true
          data:
            caller_token: "{{ caller_token | default('') }}"
        - variables:
            _rci_sim_mode: "{{ _rci_raw.get('sim_mode', true) if _rci_raw is mapping else true }}"
        - action: script.zen_sutra_filecabinet
          response_variable: _rci_cfg_raw
          continue_on_error: true
          data:
            caller_tool: zen_dojotools_identity
            action_type: get
            volume_entity_id: "{{ states('sensor.zen_default_household_cabinet_resolved') }}"
            path: integrations_config
        - variables:
            _rci_ic: >-
              {%- set r = _rci_cfg_raw.get('value', {}) if _rci_cfg_raw is mapping and _rci_cfg_raw.get('status') == 'success' else {} -%}
              {{ r if r is mapping else {} }}
            _rci_sim_allowed: "{{ _rci_ic.get('identity', {}).get('sim_mode_allowed', false) if _rci_ic is mapping else false }}"
            _rci_blocked: "{{ _rci_sim_mode and not (_rci_ic.get('identity', {}).get('sim_mode_allowed', false) if _rci_ic is mapping else false) }}"
        - variables:
            _rci_resolved_target: >-
              {{ '' if _rci_blocked else ((_rci_raw.get('resolved_identity', {}) if _rci_raw is mapping else {}).get('entity_id', '')) }}
        # ── Cert check on behalf of the caller — tool asks identity, identity
        # asks persona_editor. Consumers must NEVER call persona_editor directly
        # for their own cert_list; pass required_cert (+ required_cert_level) here
        # instead. Only runs when the caller actually asked for a cert check AND
        # policy already allowed the identity resolution — a blocked identity
        # can never pass a cert check regardless of what's asked for.
        - variables:
            _rci_cert_requested: "{{ (required_cert | default('') | string | trim) != '' }}"
        - if: "{{ _rci_cert_requested and not _rci_blocked }}"
          then:
            - action: script.zen_dojotools_persona_editor
              response_variable: _rci_pe_raw
              continue_on_error: true
              data:
                mode: cert_list
                target: "{{ _rci_resolved_target }}"
            - variables:
                _rci_pe_raw: "{{ _rci_pe_raw.get('result', _rci_pe_raw) if _rci_pe_raw is mapping else _rci_pe_raw }}"
            - variables:
                _rci_certs: "{{ _rci_pe_raw.get('certifications', {}) if _rci_pe_raw is mapping else {} }}"
            # ── OID-style inheritance (steel-mag pattern) -- cert names
            # may be dotted (zenos.<domain>.
            # <capability>). Holding a PARENT node (e.g. zenos.media)
            # satisfies a check against any dotted-boundary descendant
            # (zenos.media.playback_control) at that parent's level. When
            # more than one held cert matches (parent AND a more specific
            # child both held), the MOST SPECIFIC (longest key) wins --
            # an explicit narrower grant can restrict below what the
            # broader grant implies, same precedence X.509 policy OIDs use.
            # A flat (undotted) required_cert can only ever prefix-match
            # itself exactly (no held key can be a dot-truncated prefix of
            # a string with no dots) -- zero behavior change for every cert
            # not yet migrated into the zenos.* namespace. ──
            - variables:
                _rci_cert_matches: >-
                  {%- set ns = namespace(out=[]) -%}
                  {%- if _rci_certs is mapping -%}
                    {%- for _hk, _he in _rci_certs.items() -%}
                      {%- if _hk == required_cert or (required_cert | string).startswith(_hk ~ '.') -%}
                        {%- set ns.out = ns.out + [{'key': _hk, 'entry': _he, 'len': _hk | length}] -%}
                      {%- endif -%}
                    {%- endfor -%}
                  {%- endif -%}
                  {{ ns.out }}
                _rci_cert_entry: >-
                  {%- set _sorted = _rci_cert_matches | sort(attribute='len', reverse=true) -%}
                  {{ (_sorted[0].entry if _sorted | length > 0 else {}) }}
                _rci_cert_entry_key: >-
                  {%- set _sorted = _rci_cert_matches | sort(attribute='len', reverse=true) -%}
                  {{ (_sorted[0].key if _sorted | length > 0 else '') }}
                _rci_cert_level: "{{ (_rci_cert_entry.get('level', 0) | int(0)) if _rci_cert_entry is mapping else 0 }}"
                _rci_cert_required_level: "{{ required_cert_level | default(1) | int(1) }}"
                _rci_cert_ok: "{{ _rci_pe_raw is mapping and _rci_pe_raw.get('status') == 'ok' and _rci_cert_level >= (required_cert_level | default(1) | int(1)) }}"
            # ── Scope/constraints pass-through -- the "begrudging
            # override" ask: cert_req_grant already had cert_scope/
            # cert_constraints fields, never consumed anywhere. A tool with
            # its own "ask live every time" tier (locks exterior unlock,
            # security_manager disarm, infra d-class) checks THIS field
            # against its own target before deciding whether to still ask --
            # identity's job is only to surface it, never to interpret it,
            # same separation resolve_caller_identity already keeps between
            # policy/cert resolution and each tool's own gate logic. ──
            - variables:
                _rci_cert_scope: "{{ (_rci_cert_entry.get('scope', []) if _rci_cert_entry is mapping else []) }}"
                _rci_cert_constraints: "{{ (_rci_cert_entry.get('constraints', []) if _rci_cert_entry is mapping else []) }}"
        - variables:
            _rci_cert_level: "{{ _rci_cert_level | default(0) }}"
            _rci_cert_entry_key: "{{ _rci_cert_entry_key | default('') }}"
            _rci_cert_ok: "{{ _rci_cert_ok | default(false) }}"
            _rci_cert_scope: "{{ _rci_cert_scope | default([]) }}"
            _rci_cert_constraints: "{{ _rci_cert_constraints | default([]) }}"
        # ── Scope resolution happens here, once, not re-walked per consumer
        # tool -- see cert_scope_check macro (zen_os_1.jinja) for the shared
        # allow/deny/default normalization; anything touching ACLs
        # goes through identity. Only runs when the caller passed
        # target_entity; if omitted, scope_decision is always 'default' and
        # existing callers that don't pass it are unaffected. ──
        - variables:
            _rci_scope_decision: >-
              {%- import 'zenos_ai/zen_os_1.jinja' as zen -%}
              {{ zen.cert_scope_check(_rci_cert_scope, target_entity | default('', true)) | trim if (target_entity | default('', true)) != '' else 'default' }}
        - variables:
            response: >-
              {{-
                {
                  'mode': 'resolve_caller_identity',
                  'policy_status': 'blocked' if _rci_blocked else 'allowed',
                  'sim_mode': _rci_sim_mode,
                  'sim_mode_allowed': _rci_sim_allowed,
                  'override_attempted': _rci_raw.get('override_attempted', false) if _rci_raw is mapping else false,
                  'token_shape': _rci_raw.get('token_shape', 'none') if _rci_raw is mapping else 'none',
                  'resolved_identity': ({} if _rci_blocked else (_rci_raw.get('resolved_identity', {}) if _rci_raw is mapping else {})),
                  'block_reason': ('sim_mode result rejected: OS policy integrations_config.identity.sim_mode_allowed is false' if _rci_blocked else ''),
                  'cert_checked': _rci_cert_requested,
                  'cert_name': required_cert | default(''),
                  'cert_satisfied_by': _rci_cert_entry_key | default(''),
                  'cert_level': _rci_cert_level,
                  'cert_required_level': required_cert_level | default(1) | int(1),
                  'cert_scope': _rci_cert_scope,
                  'cert_constraints': _rci_cert_constraints,
                  'target_entity': target_entity | default(''),
                  'scope_decision': _rci_scope_decision,
                  'authorized': (not _rci_blocked) and ((not _rci_cert_requested) or _rci_cert_ok),
                  'caller_token_received': caller_token | default(''),
                  'timestamp': now().isoformat()
                }
              -}}

    # ── WHOAMI — shared console-presence + current-agent resolver ────────────
    # Human side: resolves context.user_id (populated by HA only when a real
    # logged-in human triggers THIS call directly -- never set for an
    # automation/script/agent-initiated chain) to its matching person.*
    # entity. is_hoh is INFORMATIONAL ONLY -- HA has no template-level or
    # REST-level way to check whether a user_id is a real HA admin (verified
    # against the current Template Functions Reference, the
    # context variable docs, and this project's own REST-only
    # zen_sutra_ha_api -- none expose auth/admin status). Gates that need "a
    # real console session, not an agent/automation call" should check
    # console_user != '' only; is_hoh is surfaced for future use once a real
    # admin check becomes available upstream, not as a security boundary
    # today.
    #
    # Agent side: resolves which ai_user persona is asking (persona_target if
    # given, same field cert-check modes already use, else the system
    # default -- same _target pattern dojotools_certadmin.yaml uses) and its
    # display name.
    #
    # Both sides' household/family role and membership (hoh/prime/member per
    # container, at every depth) come from THIS SAME SCRIPT's own
    # mode=membership member_entity=<eid> reverse-lookup (self-call) --
    # reused, not re-derived a third time. is_hoh/is_prime are read off the
    # depth-0 (direct household) entry's role when present. The household's
    # own members list keys entries by CABINET entity_id with a separate
    # person_entity_id field, so the human side resolves person.* -> cabinet
    # first (same person_entity_id match Step 2's target-normalization
    # already uses) before calling mode=membership -- passing the bare
    # person.* entity directly silently returns an empty membership list,
    # not an error.
    #
    # is_hoh is DELIBERATELY sourced from the household cabinet's acls.owner
    # entry (via mode=membership's role field) ONLY -- never from an HA
    # label. A label is something anyone with label-write access can apply
    # to any entity; it proves nothing about real authority, only that a
    # label exists. The cabinet's owner slot is set exclusively via
    # mode=set_principal (single-occupant, confirm_action-gated to replace),
    # which is the actual stamp of record. No label fallback, even for an
    # entity with no resolvable cabinet (e.g. a guest) -- that case is
    # correctly "not HoH," not "fall back to a weaker signal." This
    # distinction matters more as the system gets locked down further, not
    # less -- security-relevant identity never derives from a label.
    #
    # Read-only, no write path, no cert required.
    - if: "{{ response is not defined and (mode | default('') | lower) == 'whoami' }}"
      then:
        - variables:
            _wa_console_user: "{{ (context.user_id | default('', true)) | trim }}"
            _wa_person: >-
              {%- set ns = namespace(found='') -%}
              {%- for p in states.person -%}
                {%- if ns.found == '' and _wa_console_user != ''
                       and state_attr(p.entity_id, 'user_id') == _wa_console_user -%}
                  {%- set ns.found = p.entity_id -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.found }}
            _wa_default_agent: "{{ states('sensor.zen_default_ai_user_cabinet_resolved') }}"
            _wa_agent_target: "{{ (persona_target | default('', true) | trim) or states('sensor.zen_default_ai_user_cabinet_resolved') }}"
        # ── person.* -> user cabinet, same resolution Step 2 (normalized
        # target) already uses for a person.* input: a household members.users[]
        # entry with a matching person_entity_id, same source both read. The
        # household's members list keys entries by CABINET entity_id with a
        # separate person_entity_id field -- the raw person.* id never appears
        # as an 'entity_id' itself, so mode=membership must be called with the
        # resolved cabinet, not the bare person entity (passing the bare
        # person entity silently returns an empty membership list, not an
        # error).
        - variables:
            _wa_person_cabinet: >-
              {%- if _wa_person == '' -%}
                {{- '' -}}
              {%- else -%}
                {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                {%- set _hh = states('sensor.zen_default_household_cabinet_resolved') -%}
                {%- set _mbrs = CABS.cabinet_drawer_value(_hh, 'members', {}) | from_json() -%}
                {%- set _mbrs = _mbrs if _mbrs is mapping else {} -%}
                {%- set _all = _mbrs.get('users', []) + _mbrs.get('ai_users', []) -%}
                {%- set _hit = _all | selectattr('person_entity_id', 'defined')
                                     | selectattr('person_entity_id', 'equalto', _wa_person)
                                     | first | default(none) -%}
                {%- if _hit -%}{{- _hit.entity_id -}}{%- else -%}{{- '' -}}{%- endif -%}
              {%- endif -%}
        - variables:
            _wa_is_default: "{{ _wa_agent_target == _wa_default_agent }}"
            _wa_agent_vars: "{{ state_attr(_wa_agent_target, 'variables') | default({}, true) }}"
            # Same "is this agent set up" signal zen_flynn_oobe's own
            # mode=status uses (flynn_oobe.yaml) -- a written _oobe_complete/
            # oobe_complete drawer key, not jacket-name presence (an onboarded
            # agent can still have an empty/placeholder name; a non-onboarded
            # one is the real "pending" case, not an error).
            _wa_agent_onboarded: "{{ '_oobe_complete' in _wa_agent_vars or 'oobe_complete' in _wa_agent_vars }}"
            _wa_agent_name: >-
              {%- set raw = _wa_agent_vars.get('zenai_essence', {}) if _wa_agent_vars is mapping else {} -%}
              {%- set ev_raw = raw.get('value', {}) if raw is mapping else {} -%}
              {%- set ev = ev_raw if ev_raw is mapping else (ev_raw | from_json if ev_raw is string else {}) -%}
              {%- set _j = ev.get('jacket', {}) if ev.get('jacket') is mapping else {} -%}
              {{ _j.get('name', '') }}
        # ── Self-calls into mode=membership -- one real resolver, reused ──────
        - action: script.zen_dojotools_identity
          continue_on_error: true
          response_variable: _wa_person_mship_raw
          data:
            mode: membership
            member_entity: "{{ _wa_person_cabinet }}"
        - action: script.zen_dojotools_identity
          continue_on_error: true
          response_variable: _wa_agent_mship_raw
          data:
            mode: membership
            member_entity: "{{ _wa_agent_target }}"
        - variables:
            _wa_person_memberships: >-
              {{ (_wa_person_mship_raw.get('memberships', []) if _wa_person_mship_raw is mapping else []) if _wa_person_cabinet != '' else [] }}
            _wa_agent_memberships: "{{ _wa_agent_mship_raw.get('memberships', []) if _wa_agent_mship_raw is mapping else [] }}"
            _wa_person_hh_role: >-
              {%- set _hh = (_wa_person_mship_raw.get('memberships', []) if _wa_person_mship_raw is mapping else [])
                            | selectattr('container_type', 'equalto', 'household') | selectattr('depth', 'equalto', 0) | list -%}
              {{ _hh[0].role if _hh | length > 0 else '' }}
            _wa_agent_hh_role: >-
              {%- set _hh = (_wa_agent_mship_raw.get('memberships', []) if _wa_agent_mship_raw is mapping else [])
                            | selectattr('container_type', 'equalto', 'household') | selectattr('depth', 'equalto', 0) | list -%}
              {{ _hh[0].role if _hh | length > 0 else '' }}
        - variables:
            response:
              mode: whoami
              console_user: "{{ _wa_console_user }}"
              resolved_person: "{{ _wa_person }}"
              is_hoh: "{{ _wa_person_hh_role == 'hoh' }}"
              person_memberships: "{{ _wa_person_memberships }}"
              agent: "{{ _wa_agent_name }}"
              agent_entity: "{{ _wa_agent_target }}"
              agent_onboarded: "{{ _wa_agent_onboarded }}"
              is_default: "{{ _wa_is_default }}"
              is_prime: "{{ _wa_agent_hh_role == 'prime' }}"
              agent_memberships: "{{ _wa_agent_memberships }}"
              caller_token: "{{ caller_token | default('') }}"

    # ── Step 1: normalize inputs + target ──────────────────────────────────
    - variables:
        caller_token: "{{- caller_token | default('') -}}"

    # ── Step 1: normalize inputs + target ──────────────────────────────────
    - variables:
        _mode: "{{- mode | default('resolve') | lower | trim -}}"
        user_label: "{{- user_label | default('') -}}"
        user_cabinet: "{{- user_cabinet | default('') -}}"
        user_entity_id: "{{- user_entity_id | default('') -}}"
        family_entity: "{{- family_entity | default('') | trim -}}"
        member_entity: "{{- member_entity | default('') | trim -}}"
        member_type: "{{- member_type | default('user') | lower | trim -}}"
        ai_entity: "{{- ai_entity | default('') | trim -}}"
        household_entity: "{{- household_entity | default('') | trim -}}"
        member_name: "{{- member_name | default('') | trim -}}"
        profile_payload: "{{- profile_payload | default('') | trim -}}"
        _hh_target: >
          {%- if household_entity | default('') | trim != '' -%}
            {{- household_entity | trim -}}
          {%- else -%}
            {{- states('sensor.zen_default_household_cabinet_resolved') -}}
          {%- endif -%}
        user_guid: >
          {%- set ug = user_guid | default('') | trim -%}
          {%- set pattern = '(?i)^[0-9a-f]{8}-?[0-9a-f]{4}-?[0-9a-f]{4}-?[0-9a-f]{4}-?[0-9a-f]{12}$' -%}
          {{- ug if ug is match(pattern) else '' -}}
        # @todo - not sure if that awkward default response "''" is handled properly
        target: >
          {%- if user_label | default('') | trim != '' -%}
            {{- user_label | trim -}}
          {%- elif user_cabinet | default('') | trim != '' -%}
            {{- user_cabinet | trim -}}
          {%- elif user_entity_id | default('') | trim != '' -%}
            {{- user_entity_id | trim -}}
          {%- elif user_guid | default('') | trim != '' -%}
            {{- user_guid | trim -}}
          {%- else -%}
            ''
          {%- endif -%}
        raw_target: "{{- target | default('') | trim -}}"
        normalized: >
          {%- set rt = raw_target | string | trim -%}
          
          {#- --- 0. Canonical empty/null detection (kills '', "", ' ', etc.) --- -#}
          {%- if rt in ['', "''", '""', "' '", '" "', None] -%}
            {{- None -}}
          
          {#- --- 1. person.* entity → resolve to cabinet --- -#}
          {#-     Primary:  member entry with matching person_entity_id,        -#}
          {#-               anywhere in the household tree (member_index)     -#}
          {#-     Fallback: slug convention (person.user → label 'user'         -#}
          {#-               ∩ zen_user_cabinet) — self-heals pre-patch members  -#}
          {%- elif rt.startswith('person.') -%}
          {%- import 'zenos_ai/zen_identity.jinja' as ID -%}
          {%- set _hit = ID.member_index() | from_json([])
                           | selectattr('person_entity', 'equalto', rt)
                           | map(attribute='entity_id') | first | default('') -%}
          {%- if _hit != '' -%}
            {{- _hit -}}
          {%- else -%}
            {%- set _slug = rt | replace('person.', '') -%}
            {%- set _cands = label_entities(_slug) | select('match', 'sensor\.')
                             | select('in', label_entities('zen_user_cabinet')) | list -%}
            {{- _cands | first | default(None) -}}
          {%- endif -%}
          
          {#- --- 2. Preserve full cabinet sensors verbatim --- -#}
          {%- elif rt.startswith('sensor.') -%}
            {{- rt -}}
          
          {#- --- 3. Accept UUID formats (with/without hyphens, case-insensitive) --- -#}
          {%- elif rt is match('(?i)^[0-9a-f]{8}-?[0-9a-f]{4}-?[0-9a-f]{4}-?[0-9a-f]{4}-?[0-9a-f]{12}$') -%}
            {{- rt -}}
          
          {#- --- 4. Reject ANYTHING containing a dot that isn't person/sensor --- -#}
          {%- elif '.' in rt -%}
            {{- None -}}
          
          {#- --- 5. Otherwise treat as a plain label --- -#}
          {%- else -%} 
            {{- rt -}}
          {%- endif -%}

    # ── Step 2: resolve identity ────────────────────────────────────────────
    - variables:
        cab_json: >
          {% import 'zenos_ai/zen_os_1.jinja' as zen %}
          {{- zen.identity_resolve_source(normalized) -}}

        cab: >
          {%- set raw = cab_json | trim -%}
          
          {#- 0. Empty/None → valid empty result -#}
          {%- if raw in ['', None] -%}
            {{- {'result': [], 'error': 'empty_input'} | tojson -}}
          
          {#- 1. Detect 'not_found' blocks BEFORE from_json -#}
          {%- elif '"error"' in raw and '"not_found"' in raw -%}
            {{- {'result': [], 'error': 'not_found'} | tojson -}}
          
          {#- 2. Attempt normal JSON load #}
          {%- else -%}
            {{- raw | from_json | tojson -}}
          {%- endif %}

    # ── Step 3a: mode = prompt → render capsule ─────────────────────────────
    - if: "{{- response is not defined and _mode == 'prompt' -}}"
      then:
        - variables:
            _capsule_raw: >-
              {% import 'zenos_ai/zen_os_1.jinja' as zen %}
              {%- set identity_block = cab if cab is mapping else (cab | from_json) -%}
              {%- if not identity_block.get('identity', {}).get('name', '') -%}
                {%- set identity_block = zen.identity_resolve_source(states('sensor.zen_default_ai_user_cabinet_resolved')) -%}
              {%- endif -%}
              {{- zen.ai_capsule(identity_block) -}}
            _health_raw: >-
              {% import 'zenos_ai/zen_os_1.jinja' as zen %}
              {{- zen.prompt_health_check() -}}
        - variables:
            _capsule: >-
              {%- set raw = _capsule_raw | trim -%}
              {%- if raw.startswith('{') or raw.startswith('[') -%}
                {{- raw | from_json | tojson -}}
              {%- else -%}
                {{- {'rendered': raw} | tojson -}}
              {%- endif -%}
            _health: >-
              {%- set raw = _health_raw | trim -%}
              {%- if raw.startswith('{') -%}
                {{- raw | from_json | tojson -}}
              {%- else -%}
                {{- {} | tojson -}}
              {%- endif -%}
        - variables:
            response: >
              {{-
                {
                  'mode':               'prompt',
                  'target_normalized':  normalized,
                  'identity':           cab,
                  'capsule':            _capsule,
                  'prompt_health':      _health,
                  'timestamp':          now().isoformat(),
                  'caller_token':       caller_token | default('')
                }
              -}}

    # ── Step 3b2: mode = render_prompt → full assembled prompt ───────────────
    - if: "{{- response is not defined and _mode == 'render_prompt' -}}"
      then:
        - variables:
            _full_raw: >-
              {%- import 'zenos_ai/zen_os_1.jinja' as zen -%}
              {{ zen.render_prompt(states('input_text.zenos_persona_name')) }}
        - variables:
            response: >
              {{-
                {
                  'mode':        'render_prompt',
                  'persona':     states('input_text.zenos_persona_name'),
                  'rendered':    _full_raw | trim | from_json({'raw': _full_raw | trim}) if (_full_raw | trim).startswith('{') else {'raw': _full_raw | trim},
                  'chars':       _full_raw | trim | length,
                  'timestamp':   now().isoformat(),
                  'caller_token': caller_token | default('')
                }
              -}}

    # ── Step 3c: mode = build_identity_manifest ─────────────────────────────
    - if: "{{- response is not defined and _mode == 'build_identity_manifest' -}}"
      then:
            - variables:
                _hh_cab: "{{- _hh_target -}}"
            - if: "{{- _hh_cab in ['', 'unknown', 'unavailable'] -}}"
              then:
                - variables:
                    response: >
                      {{-
                        {
                          'mode':      'build_identity_manifest',
                          'status':    'error',
                          'message':   'Household cabinet unavailable — cannot write zen_identity_manifest.',
                          'timestamp': now().isoformat()
                        }
                      -}}
    - if: "{{- response is not defined and _mode == 'build_identity_manifest' -}}"
      then:
            - variables:
                _roster_raw: >-
                  {% import 'zenos_ai/zen_os_1.jinja' as zen %}
                  {{- zen.identity_roster() -}}
                # @todo - surely no need to check what is in _roster_raw? - we control its contents - it's a JSON-Stringified dict
                _roster: >-
                  {%- set raw = _roster_raw | trim -%}
                  {%- if raw.startswith('{') -%}
                    {{- raw | from_json | tojson -}}
                  {%- else -%}
                    {{- {'status': 'error', 'count': 0, 'roster': []} | tojson -}}
                  {%- endif -%}
            # — build household tree to depth 2 alongside flat roster —
            - variables:
                _hh_vi_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _vi = CABS.cabinet_drawer_value(_hh_cab, 'AI_Cabinet_VolumeInfo', {}) | from_json() -%}
                  {{- _vi -}}
                _hh_members_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _m = CABS.cabinet_drawer_value(_hh_cab, 'members', {}) | from_json() -%}
                  {{- _m -}}
                # @todo - need to modify CABS.cabinet_drawer_value() so it can take a list of keys and return the first one that exists
                _hh_profile_raw: >-
                  {%- set _v = state_attr(_hh_cab, 'variables') | default({}, true) -%}
                  {%- set _v = _v if _v is mapping else {} -%}
                  {%- set _p = _v.get('_household_profile', _v.get('household_profile', {})) -%}
                  {%- set _p = _p.get('value', _p) if _p is mapping else {} -%}
                  {%- set _p = _p | from_json if _p is string else _p -%}
                  {{- _p -}}
            - variables:
                _hh_tree: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _vi = _hh_vi_raw -%}
                  {%- set _m = _hh_members_raw -%}
                  {%- set _hp = _hh_profile_raw -%}
                  {%- import 'zenos_ai/zen_identity.jinja' as ID -%}
                  {%- set _pr = ID.principals(_hh_cab) | from_json -%}
                  {%- set _ns = namespace(fams=[]) -%}{# FG-25: namespace required for list mutation inside for-loop #}
                  {%- for fam in _m.get('families', []) -%}
                    {%- set _fc_entity_id = fam.get('entity_id', '') -%}
                    {%- set _fvi = CABS.cabinet_drawer_value(_fc_entity_id, 'AI_Cabinet_VolumeInfo', {}) | from_json() -%}
                    {%- set _fm = CABS.cabinet_drawer_value(_fc_entity_id, 'members', {}) | from_json() -%}
                    {%- set _fpr = ID.principals(_fc_entity_id) | from_json -%}
                    {%- set _nsf = namespace(subfams=[]) -%}{# FG-25: namespace required for list mutation inside for-loop #}
                    {%- for sf in _fm.get('families', []) -%}
                      {%- set _sf_entity_id = sf.get('entity_id', '') -%}
                      {%- set _sfvi = CABS.cabinet_drawer_value(_sf_entity_id, 'AI_Cabinet_VolumeInfo', {}) | from_json() -%}
                      {%- set _sfm = CABS.cabinet_drawer_value(_sf_entity_id, 'members', {}) | from_json() -%}
                      {%- set _nsf.subfams = _nsf.subfams + [{
                        'entity_id': _sf_entity_id,
                        'guid': _sfvi.get('id', _sfvi.get('guid', '')),
                        'name': sf.get('name', _sfvi.get('friendly_name', _sfvi.get('name', _sf_entity_id))),
                        'depth': 2,
                        'members': {'users': _sfm.get('users', []), 'ai_users': _sfm.get('ai_users', [])}
                      }] -%}
                    {%- endfor -%}
                    {%- set _ns.fams = _ns.fams + [{
                      'entity_id': _fc_entity_id,
                      'guid': _fvi.get('id', _fvi.get('guid', '')),
                      'name': fam.get('name', _fvi.get('friendly_name', _fvi.get('name', _fc_entity_id))),
                      'depth': fam.get('depth', 1),
                      'principals': _fpr,
                      'members': {'users': _fm.get('users', []), 'ai_users': _fm.get('ai_users', []), 'families': _nsf.subfams}
                    }] -%}
                  {%- endfor -%}
                  {{
                    {
                      'entity_id': _hh_cab,
                      'guid': _vi.get('id', _vi.get('guid', '')),
                      'name': _hp.get('friendly_name', _hp.get('name', _vi.get('friendly_name', _vi.get('name', _hh_cab)))),
                      'principals': _pr,
                      'members': {'users': _m.get('users', []), 'ai_users': _m.get('ai_users', []), 'families': _ns.fams}
                    } | tojson
                  }}
                # ------------------------------------------------------------------------------------
                # @note - _manifest: a dict with two keys each having a JSON-STRINGIFIED DICT ()
                # ------------------------------------------------------------------------------------
                _manifest: >-
                  {{
                    {
                      'roster': _roster,
                      'tree':   _hh_tree
                    } | tojson
                  }}
            - action: script.zen_sutra_filecabinet
              data:
                caller_tool: zen_dojotools_identity
                action_type: create
                force_action: true
                set_timestamp: true
                show_hidden_volumes: false
                volume_entity_id:
                  - "{{- _hh_cab -}}"
                key: zen_identity_manifest
                value: "{{- _manifest -}}"
            - variables:
                response: >
                  {{-
                    {
                      'mode':              'build_identity_manifest',
                      'status':            'ok',
                      'household_cabinet': _hh_cab,
                      'manifest':          _manifest,
                      'timestamp':         now().isoformat(),
                      'caller_token':      caller_token | default('')
                    }
                  -}}
            - event: zen_event
              event_data:
                event:
                  kind: identity_manifest_rebuild
                  component: zen_dojotools_identity
                  severity: info
                  summary: Manifest rebuild triggered by build_identity_manifest.

    # ── ACL schema gate (#10626) ────────────────────────────────────────────
    # Identity sets up households and families on the ACL v2 record. A setup
    # mode whose container (household or family) is still on the old schema
    # refuses with acl_schema_upgrade_required and the path to fix it; with
    # force_action it upgrades that cabinet first (acl_migrate), checks it
    # again, and continues. It answers an error only if the upgrade fails.
    - if: >-
        {{- response is not defined and _mode in ['household_add_family', 'household_add_member',
            'set_principal', 'family_add_member', 'provision_member'] -}}
      then:
        - variables:
            _sg_cab: >-
              {%- if _mode in ['household_add_family', 'household_add_member'] -%}{{- _hh_target -}}
              {%- elif _mode == 'set_principal' -%}{{- (family_entity | default('', true) | trim) or _hh_target -}}
              {%- elif _mode == 'family_add_member' -%}{{- family_entity | default('', true) | trim -}}
              {%- else -%}{{- (family_entity | default('', true) | trim) or states('sensor.zen_default_family_cabinet_resolved') -}}
              {%- endif -%}
        - variables:
            _sg_check: >-
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
              {{- CABS.acl_schema_check(_sg_cab) | from_json if _sg_cab not in ['', 'unknown', 'unavailable'] else {'ok': true, 'why': []} -}}
        - if: "{{- not _sg_check.ok and not (force_action | default(false) | bool) -}}"
          then:
            - variables:
                response:
                  mode: "{{ _mode }}"
                  status: error
                  code: acl_schema_upgrade_required
                  cabinet: "{{ _sg_cab }}"
                  why: "{{ _sg_check.why }}"
                  message: >-
                    {{ _sg_cab }} is on the old ACL schema ({{ _sg_check.why | join(', ') }}); nothing was set up.
                    Upgrade it with mode=acl_migrate (dry_run first to see the plan), or retry this call with
                    force_action=true to upgrade it and continue.
                  next_steps: ["acl_migrate target_entity={{ _sg_cab }} (dry_run)", "retry with force_action=true"]
                  timestamp: "{{ now().isoformat() }}"
        - if: "{{- not _sg_check.ok and (force_action | default(false) | bool) -}}"
          then:
            - action: script.zen_dojotools_identity
              response_variable: _sg_up
              continue_on_error: true
              data:
                mode: acl_migrate
                target_entity: "{{ _sg_cab }}"
                dry_run: false
                confirm_action: true
            - variables:
                _sg_after: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {{- CABS.acl_schema_check(_sg_cab) | from_json -}}
            - if: "{{- not _sg_after.ok -}}"
              then:
                - variables:
                    response:
                      mode: "{{ _mode }}"
                      status: error
                      code: acl_schema_upgrade_failed
                      cabinet: "{{ _sg_cab }}"
                      why: "{{ _sg_after.why }}"
                      upgrade: "{{ _sg_up if _sg_up is defined else {} }}"
                      message: "{{ _sg_cab }} could not be upgraded to the ACL v2 schema ({{ _sg_after.why | join(', ') }}); nothing was set up."
                      timestamp: "{{ now().isoformat() }}"

    # ── Step 3d: mode = household_add_family ────────────────────────────────
    - if: "{{- response is not defined and _mode == 'household_add_family' -}}"
      then:
            - variables:
                _hh_cab: "{{- _hh_target -}}"
            - if: "{{- _hh_cab in ['', 'unknown', 'unavailable'] or family_entity == '' -}}"
              then:
                - variables:
                    response: > 
                      {{-
                        {
                          'mode':      'household_add_family',
                          'status':    'error',
                          'message':   'household_cabinet and family_entity are both required.',
                          'timestamp': now().isoformat()
                        }
                      -}}
    - if: "{{- response is not defined and _mode == 'household_add_family' -}}"
      then:
            - variables:
                _fam_vi_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _vi = CABS.cabinet_drawer_value(family_entity, 'AI_Cabinet_VolumeInfo', {}) | from_json() -%}
                  {{- _vi | tojson -}}
                _hh_members_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _vi = CABS.cabinet_drawer_value(_hh_cab, 'members', {}) | from_json() -%}
                  {{- _vi | tojson -}}
            - variables:
                _fam_vi: "{{- _fam_vi_raw | from_json if _fam_vi_raw is string else _fam_vi_raw -}}"
                _fam_guid: >-
                  {%- set _vi = _fam_vi_raw | from_json if _fam_vi_raw is string else _fam_vi_raw -%}
                  {%- set _vi = _vi if _vi is mapping else {} -%}
                  {%- set _existing = _vi.get('id', _vi.get('guid', '')) | string | trim -%}
                  {%- if _existing != '' -%}
                    {{- _existing -}}
                  {%- else -%}
                    {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                    {{- CABS.cabinet_guid_new() | default('') -}}
                  {%- endif -%}
                _fam_guid_is_new: >-
                  {%- set _vi = _fam_vi_raw | from_json if _fam_vi_raw is string else _fam_vi_raw -%}
                  {%- set _vi = _vi if _vi is mapping else {} -%}
                  {{- _vi.get('id', _vi.get('guid', '')) | string | trim == '' -}}
                # @todo - need to modify CABS.cabinet_drawer_value() so it can take a list of keys and return the first one that exists
                _fam_name: >-
                  {%- set _fv = state_attr(family_entity, 'variables') | default({}, true) -%}
                  {%- set _fv = _fv if _fv is mapping else {} -%}
                  {%- set _fp_r = _fv.get('_family_profile', _fv.get('family_profile', {})) -%}
                  {%- set _fp = _fp_r.get('value', _fp_r) if _fp_r is mapping else {} -%}
                  {%- set _fp = _fp | from_json if _fp is string else _fp -%}
                  {%- set _d = _fp.get('display_name', _fp.get('friendly_name', _fp.get('name', ''))) | trim -%}
                  {%- set _vi = _fam_vi_raw | from_json if _fam_vi_raw is string else _fam_vi_raw -%}
                  {%- set _vi = _vi if _vi is mapping else {} -%}
                  {{- _d if _d != '' else _vi.get('friendly_name', family_entity) -}}
                _hh_members: "{{- _hh_members_raw | from_json if _hh_members_raw is string else _hh_members_raw -}}"
            - if: "{{- _fam_guid_is_new | bool -}}"
              then:
                # Admin door (#10637): VolumeInfo is cabinet structure; FileCabinet refuses it.
                # merge: only the new id lands; the rest of VolumeInfo stays as stored.
                - action: script.zen_admintools_cabinet_writer
                  data:
                    mode: merge
                    volume_entity: "{{- family_entity -}}"
                    key: AI_Cabinet_VolumeInfo
                    value: "{{- {'id': _fam_guid} -}}"
                    set_timestamp: true
                    caller: zen_dojotools_identity
                    reason: "identity {{ mode | default('', true) }}"
            - variables:
                _existing_fams: >-
                  {%- set _m = _hh_members_raw | from_json if _hh_members_raw is string else _hh_members_raw -%}
                  {%- set _m = _m if _m is mapping else {} -%}
                  {{- _m.get('families', []) | tojson -}}
                _new_fam_entry: >-
                  {{
                    {
                      'guid':      _fam_guid,
                      'entity_id': family_entity,
                      'name':      _fam_name,
                      'depth':     1
                    } | tojson
                  }}
            - variables:
                _already_member: >-
                  {%- set _fams = _existing_fams | from_json if _existing_fams is string else _existing_fams -%}
                  {%- set _fams = _fams if _fams is iterable and _fams is not string else [] -%}
                  {{- _fams | selectattr('entity_id', 'equalto', family_entity) | list | count > 0 -}}
            - if: "{{- _already_member | bool -}}"
              then:
                - variables:
                    response: >
                      {{-
                        {
                          'mode':           'household_add_family',
                          'status':         'already_member',
                          'family_entity':  family_entity,
                          'household_cabinet': _hh_cab,
                          'timestamp':      now().isoformat()
                        }
                      -}}
    - if: "{{- response is not defined and _mode == 'household_add_family' -}}"
      then:
            - variables:
                _updated_members: >-
                  {%- set _m = _hh_members_raw | from_json if _hh_members_raw is string else _hh_members_raw -%}
                  {%- set _m = _m if _m is mapping else {} -%}
                  {%- set _fams = _m.get('families', []) -%}
                  {%- set _fams = _fams if _fams is iterable and _fams is not string else [] -%}
                  {%- set _entry = _new_fam_entry | from_json if _new_fam_entry is string else _new_fam_entry -%}
                  {{
                    dict(_m, **{'families': _fams + [_entry]}) | tojson
                  }}
            - action: script.zen_sutra_filecabinet
              data:
                caller_tool: zen_dojotools_identity
                action_type: create
                force_action: true
                set_timestamp: true
                show_hidden_volumes: false
                volume_entity_id:
                  - "{{- _hh_cab -}}"
                key: members
                value: "{{- _updated_members -}}"
            - variables:
                response: >-
                  {{-
                    {
                      'mode':              'household_add_family',
                      'status':            'ok',
                      'household_cabinet': _hh_cab,
                      'family_entity':     family_entity,
                      'family_guid':       _fam_guid | default('') | string,
                      'family_name':       _fam_name | default('') | string,
                      'timestamp':         now().isoformat(),
                      'caller_token':      caller_token | default('')
                    } | tojson
                  -}}
            - action: script.zen_dojotools_identity
              data:
                mode: build_identity_manifest
                household_entity: "{{- _hh_cab -}}"
              continue_on_error: true

    # ── Step 3d-2: mode = household_remove_family ────────────────────────────
    - if: "{{- response is not defined and _mode == 'household_remove_family' -}}"
      then:
            - variables:
                _hh_cab: "{{- _hh_target -}}"
            - if: "{{- _hh_cab in ['', 'unknown', 'unavailable'] or family_entity == '' -}}"
              then:
                - variables:
                    response: >
                      {{-
                        {
                          'mode':    'household_remove_family',
                          'status':  'error',
                          'message': 'household_cabinet and family_entity are both required.',
                          'timestamp': now().isoformat()
                        }
                      -}}
    - if: "{{- response is not defined and _mode == 'household_remove_family' -}}"
      then:
            - variables:
                _hh_members_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _m = CABS.cabinet_drawer_value(_hh_cab, 'members', {}) | from_json() -%}
                  {{- _m | tojson -}}
            - variables:
                _updated_members: >-
                  {%- set _m = _hh_members_raw | from_json if _hh_members_raw is string else _hh_members_raw -%}
                  {%- set _m = _m if _m is mapping else {} -%}
                  {%- set _fams = _m.get('families', []) -%}
                  {%- set _fams = _fams if _fams is iterable and _fams is not string else [] -%}
                  {%- set _filtered = _fams | rejectattr('entity_id', 'equalto', family_entity) | list -%}
                  {{- dict(_m, **{'families': _filtered}) | tojson -}}
            - action: script.zen_sutra_filecabinet
              data:
                caller_tool: zen_dojotools_identity
                action_type: create
                force_action: true
                set_timestamp: true
                show_hidden_volumes: false
                volume_entity_id:
                  - "{{- _hh_cab -}}"
                key: members
                value: "{{- _updated_members -}}"
            - variables:
                response: >
                  {{-
                    {
                      'mode':              'household_remove_family',
                      'status':            'ok',
                      'household_cabinet': _hh_cab,
                      'family_entity':     family_entity,
                      'timestamp':         now().isoformat(),
                      'caller_token':      caller_token | default('')
                    }
                  -}}
            - action: script.zen_dojotools_identity
              data:
                mode: build_identity_manifest
                household_entity: "{{- _hh_cab -}}"
              continue_on_error: true

    # ── Step 3e: mode = household_add_member ─────────────────────────────────
    - if: "{{- response is not defined and _mode == 'household_add_member' -}}"
      then:
            - variables:
                _hh_cab: "{{- _hh_target -}}"
            - if: "{{- _hh_cab in ['', 'unknown', 'unavailable'] or member_entity == '' -}}"
              then:
                # household_entity has a working default fallback
                # (sensor.zen_default_household_cabinet_resolved) — it almost
                # never actually fails this check. The old message blamed
                # BOTH fields every time regardless of which one actually
                # caused it, and even named a field ('household_cabinet')
                # that doesn't exist — the real field is household_entity.
                # Report which specific field is actually missing.
                - variables:
                    response: >
                      {{-
                        {
                          'mode':    'household_add_member',
                          'status':  'error',
                          'message': (
                            'member_entity is required.'
                            if _hh_cab not in ['', 'unknown', 'unavailable']
                            else 'No household could be resolved (household_entity was not given and the default household resolver is unavailable), and member_entity is required.'
                          ),
                          'timestamp': now().isoformat()
                        }
                      -}}
    - if: "{{- response is not defined and _mode == 'household_add_member' -}}"
      then:
            - variables:
                _hh_vi_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _vi = CABS.cabinet_drawer_value(_hh_cab, 'AI_Cabinet_VolumeInfo', {}) | from_json() -%}
                  {{- _vi | tojson -}}
                _hh_members_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _m = CABS.cabinet_drawer_value(_hh_cab, 'members', {}) | from_json() -%}
                  {{- _m | tojson -}}
                _mem_vi_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _vi = CABS.cabinet_drawer_value(member_entity, 'AI_Cabinet_VolumeInfo', {}) | from_json() -%}
                  {{- _vi | tojson -}}
            - variables:
                _hh_vi: "{{- _hh_vi_raw | from_json if _hh_vi_raw is string else (_hh_vi_raw if _hh_vi_raw is mapping else {}) -}}"
                _mem_vi: "{{- _mem_vi_raw | from_json if _mem_vi_raw is string else (_mem_vi_raw if _mem_vi_raw is mapping else {}) -}}"
                _mem_guid: >-
                  {%- set _vi = _mem_vi_raw | from_json if _mem_vi_raw is string else _mem_vi_raw -%}
                  {%- set _vi = _vi if _vi is mapping else {} -%}
                  {%- set _existing = _vi.get('id', _vi.get('guid', '')) | string | trim -%}
                  {%- if _existing != '' -%}{{- _existing -}}{%- else -%}
                    {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                    {{- CABS.cabinet_guid_new() | default('') -}}
                  {%- endif -%}
                _mem_guid_is_new: >-
                  {%- set _vi = _mem_vi_raw | from_json if _mem_vi_raw is string else _mem_vi_raw -%}
                  {%- set _vi = _vi if _vi is mapping else {} -%}
                  {{- _vi.get('id', _vi.get('guid', '')) | string | trim == '' -}}
                # @todo - need to modify CABS.cabinet_drawer_value() so it can take a list of keys and return the first one that exists
                _mem_name: >-
                  {%- set _mv = state_attr(member_entity, 'variables') | default({}, true) -%}
                  {%- set _mv = _mv if _mv is mapping else {} -%}
                  {%- set _up_r = _mv.get('_user_profile', _mv.get('user_profile', _mv.get('_family_profile', _mv.get('family_profile', {})))) -%}
                  {%- set _up = _up_r.get('value', _up_r) if _up_r is mapping else {} -%}
                  {%- set _up = _up | from_json if _up is string else _up -%}
                  {%- set _pn = _up.get('preferred_name', '') | trim -%}
                  {%- set _fn = _up.get('first_name', '') | trim -%}
                  {%- set _ln = _up.get('last_name', '') | trim -%}
                  {%- set _d = _pn if _pn != '' else ((_fn + ' ' + _ln) | trim) -%}
                  {%- set _vi = _mem_vi_raw | from_json if _mem_vi_raw is string else _mem_vi_raw -%}
                  {%- set _vi = _vi if _vi is mapping else {} -%}
                  {{- _d if _d != '' else _vi.get('friendly_name', member_entity) -}}
            - if: "{{- _mem_guid_is_new | bool -}}"
              then:
                # Admin door (#10637): VolumeInfo is cabinet structure; FileCabinet refuses it.
                - action: script.zen_admintools_cabinet_writer
                  data:
                    mode: merge
                    volume_entity: "{{- member_entity -}}"
                    key: AI_Cabinet_VolumeInfo
                    value: "{{- {'id': _mem_guid} -}}"
                    set_timestamp: true
                    caller: zen_dojotools_identity
                    reason: "identity {{ mode | default('', true) }}"
            # The household's ACL (#10626): owner = HoH, prime = prime AI, by GUID.
            - variables:
                _acl_rec: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {{- CABS.acl_record(_hh_cab) | from_json -}}
            - variables:
                _prime_occupied: "{{- _acl_rec.prime != '' -}}"
                _hoh_occupied: "{{- _acl_rec.owner != '' -}}"
                # "occupied" alone wrongly blocked a member
                # retrying its OWN already-filled slot (e.g. to backfill a
                # missing person_entity_id on the membership-list entry) --
                # same class of dead-end as the already_member fix below.
                # Only a DIFFERENT occupant should error; self-occupation
                # falls through harmlessly (the slot-fill step further down
                # is itself already a no-op when not _hoh_occupied/
                # _prime_occupied is false, so this never double-fills).
                _prime_occupied_by_other: "{{- _acl_rec.prime not in ['', _mem_guid] -}}"
                _hoh_occupied_by_other: "{{- _acl_rec.owner not in ['', _mem_guid] -}}"
            - if: >-
                {{- (member_type == 'ai_user' and _prime_occupied_by_other | bool)
                   or (member_type == 'user' and _hoh_occupied_by_other | bool) -}}
              then:
                - variables:
                    response: >
                      {{-
                        {
                          'mode':          'household_add_member',
                          'status':        'error',
                          'code':          'slot_occupied',
                          'message':       ('prime AI partner slot is already occupied for this household. Use an admin operation to transfer.'
                                            if member_type == 'ai_user' else
                                            'Head of Household slot is already occupied. household_add_member user only fills that slot; add other residents through a family: family_add_member into a family cabinet, and household_add_family if that family is not in this household yet.'),
                          'next_steps':    ([] if member_type == 'ai_user' else ['family_add_member', 'household_add_family']),
                          'member_entity': member_entity,
                          'member_type':   member_type,
                          'timestamp':     now().isoformat()
                        }
                      -}}
    - if: "{{- response is not defined and _mode == 'household_add_member' -}}"
      then:
            - variables:
                _list_key: "{{- 'ai_users' if member_type == 'ai_user' else 'users' -}}"
                _hh_members: "{{- _hh_members_raw | from_json if _hh_members_raw is string else _hh_members_raw -}}"
            - variables:
                _existing_list: >-
                  {%- set _m = _hh_members_raw | from_json if _hh_members_raw is string else _hh_members_raw -%}
                  {%- set _m = _m if _m is mapping else {} -%}
                  {{- _m.get(_list_key, []) | tojson -}}
            - variables:
                _already_member: >-
                  {%- set _lst = _existing_list | from_json if _existing_list is string else _existing_list -%}
                  {%- set _lst = _lst if _lst is iterable and _lst is not string else [] -%}
                  {{- _lst | selectattr('entity_id', 'equalto', member_entity) | list | count > 0 -}}
            # Previously: already_member unconditionally stopped here, even
            # when the slot itself was still empty. That's a real dead end —
            # if an earlier call added membership but failed before reaching
            # the slot-fill step below (or the slot was cleared some other
            # way), this member could never retry filling it via this mode
            # again; only a direct set_principal call could unblock it. We
            # already know at this point (having passed the slot_occupied
            # gate above) that the relevant slot is free, so just skip the
            # redundant membership write and fall through to fill it.
            #
            # already_member ALSO silently skipped backfilling
            # person_entity_id on an existing entry that never got one (e.g.
            # a member originally added without user_entity_id) -- a retry
            # with the correct user_entity_id this time did nothing, which is
            # not idempotent, it's a dead end identical in spirit to the one
            # just above. Now: if already a member AND a
            # user_entity_id was given AND the existing entry has no
            # person_entity_id yet, update that one field on the existing
            # entry in place -- never touches an entry that already has one.
            - if: "{{- not (_already_member | bool) -}}"
              then:
                - variables:
                    _new_entry: >-
                      {%- set _pid = user_entity_id | default('') | trim -%}
                      {{- {
                        'guid':             _mem_guid,
                        'entity_id':        member_entity,
                        'name':             _mem_name,
                        'person_entity_id': _pid if _pid != '' else none
                      } | tojson -}}
                    _updated_members: >-
                      {%- set _m = _hh_members_raw | from_json if _hh_members_raw is string else _hh_members_raw -%}
                      {%- set _m = _m if _m is mapping else {} -%}
                      {%- set _lst = _m.get(_list_key, []) -%}
                      {%- set _lst = _lst if _lst is iterable and _lst is not string else [] -%}
                      {%- set _entry = _new_entry | from_json if _new_entry is string else _new_entry -%}
                      {{- dict(_m, **{_list_key: _lst + [_entry]}) | tojson -}}
                - action: script.zen_sutra_filecabinet
                  data:
                    caller_tool: zen_dojotools_identity
                    action_type: create
                    force_action: true
                    set_timestamp: true
                    show_hidden_volumes: false
                    volume_entity_id:
                      - "{{- _hh_cab -}}"
                    key: members
                    value: "{{- _updated_members -}}"
            - variables:
                _pid_backfill: "{{- user_entity_id | default('') | trim -}}"
                _existing_entry_pid: >-
                  {%- set _lst = _existing_list | from_json if _existing_list is string else _existing_list -%}
                  {%- set _lst = _lst if _lst is iterable and _lst is not string else [] -%}
                  {%- set _hit = _lst | selectattr('entity_id', 'equalto', member_entity) | first | default(none) -%}
                  {{- (_hit.get('person_entity_id', '') | default('', true) | trim) if _hit else '' -}}
            - if: "{{- (_already_member | bool) and _pid_backfill != '' and _existing_entry_pid == '' -}}"
              then:
                - variables:
                    _backfilled_members: >-
                      {%- set _m = _hh_members_raw | from_json if _hh_members_raw is string else _hh_members_raw -%}
                      {%- set _m = _m if _m is mapping else {} -%}
                      {%- set _lst = _m.get(_list_key, []) -%}
                      {%- set _lst = _lst if _lst is iterable and _lst is not string else [] -%}
                      {%- set ns = namespace(out=[]) -%}{# FG-25: namespace required for list mutation inside for-loop -- a plain {% set %} inside {% for %} does not persist past the loop, confirmed live 2026-10-02 (silently produced an empty list and corrupted real household data on T) #}
                      {%- for _e in _lst -%}
                        {%- if _e.get('entity_id', '') == member_entity -%}
                          {%- set ns.out = ns.out + [dict(_e, **{'person_entity_id': _pid_backfill})] -%}
                        {%- else -%}
                          {%- set ns.out = ns.out + [_e] -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {{- dict(_m, **{_list_key: ns.out}) | tojson -}}
                - action: script.zen_sutra_filecabinet
                  data:
                    caller_tool: zen_dojotools_identity
                    action_type: create
                    force_action: true
                    set_timestamp: true
                    show_hidden_volumes: false
                    volume_entity_id:
                      - "{{- _hh_cab -}}"
                    key: members
                    value: "{{- _backfilled_members -}}"
            # First occupant fills the prime/HoH slot in the household ACL (v2).
            - variables:
                _slot_filled: >-
                  {{- (member_type == 'user' and not _hoh_occupied | bool)
                     or (member_type == 'ai_user' and not _prime_occupied | bool) -}}
                _hh_acl_updated: >-
                  {%- set r = _acl_rec -%}
                  {{- {'v': 2,
                       'owner': _mem_guid if member_type == 'user' else r.owner,
                       'prime': _mem_guid if member_type == 'ai_user' else r.prime,
                       'partners': r.partners | reject('equalto', _mem_guid) | list,
                       'ops': r.ops_stored} -}}
            - if: "{{- _slot_filled | bool -}}"
              then:
                # Admin door (#10637): VolumeInfo is cabinet structure; FileCabinet refuses it.
                - action: script.zen_admintools_cabinet_writer
                  data:
                    mode: merge
                    volume_entity: "{{- _hh_cab -}}"
                    key: AI_Cabinet_VolumeInfo
                    value: "{{- {'acls': _hh_acl_updated} -}}"
                    set_timestamp: true
                    caller: zen_dojotools_identity
                    reason: "identity {{ mode | default('', true) }}"
            - variables:
                _slot_name: >-
                  {%- if member_type == 'user' and _slot_filled | bool -%}hoh
                  {%- elif member_type == 'ai_user' and _slot_filled | bool -%}prime
                  {%- else -%}{%- endif -%}
            - event: zen_event
              event_data:
                kind: household_member_joined
                household_cabinet: "{{- _hh_cab -}}"
                member_entity: "{{- member_entity -}}"
                member_name: "{{- _mem_name -}}"
                member_type: "{{- member_type -}}"
                slot_filled: "{{- _slot_name -}}"
                prompt_profile_update: "{{- member_type == 'ai_user' -}}"
            - variables:
                response: >
                  {{-
                    {
                      'mode':              'household_add_member',
                      'status':            'ok',
                      'household_cabinet': _hh_cab,
                      'member_entity':     member_entity,
                      'member_type':       member_type,
                      'member_guid':       _mem_guid,
                      'member_name':       _mem_name,
                      'slot_filled':       _slot_name,
                      'timestamp':         now().isoformat(),
                      'caller_token':      caller_token | default('')
                    }
                  -}}
            - action: script.zen_dojotools_identity
              data:
                mode: build_identity_manifest
                household_entity: "{{- _hh_cab -}}"
              continue_on_error: true

    # ── Step 3f: mode = household_remove_member ──────────────────────────────
    - if: "{{- response is not defined and _mode == 'household_remove_member' -}}"
      then:
            - variables:
                _hh_cab: "{{- _hh_target -}}"
            - if: "{{- _hh_cab in ['', 'unknown', 'unavailable'] or member_entity == '' -}}"
              then:
                - variables:
                    response: >
                      {{-
                        {
                          'mode':    'household_remove_member',
                          'status':  'error',
                          'message': (
                            'member_entity is required.'
                            if _hh_cab not in ['', 'unknown', 'unavailable']
                            else 'No household could be resolved (household_entity was not given and the default household resolver is unavailable), and member_entity is required.'
                          ),
                          'timestamp': now().isoformat()
                        }
                      -}}
    - if: "{{- response is not defined and _mode == 'household_remove_member' -}}"
      then:
            - variables:
                _hh_members_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _m = CABS.cabinet_drawer_value(_hh_cab, 'members', {}) | from_json() -%}
                  {{- _m | tojson -}}
            # The members drawer is the truth on remove: match the entity in
            # whichever list holds it, so an omitted member_type cannot miss.
            - variables:
                _found_key: >-
                  {%- set _m = _hh_members_raw | from_json if _hh_members_raw is string else _hh_members_raw -%}
                  {%- set _m = _m if _m is mapping else {} -%}
                  {%- set ns = namespace(k='') -%}
                  {%- for k in ['users', 'ai_users', 'families'] -%}
                    {%- set _l = _m.get(k, []) -%}
                    {%- set _l = _l if _l is iterable and _l is not string else [] -%}
                    {%- if ns.k == '' and (_l | selectattr('entity_id', 'defined') | selectattr('entity_id', 'equalto', member_entity) | list | count > 0) -%}
                      {%- set ns.k = k -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{- ns.k -}}
            - variables:
                _eff_type: "{{- {'users': 'user', 'ai_users': 'ai_user', 'families': 'family'}.get(_found_key, member_type) -}}"
            - if: "{{- _found_key == '' -}}"
              then:
                - variables:
                    response: >
                      {{-
                        {
                          'mode':          'household_remove_member',
                          'status':        'error',
                          'code':          'not_member',
                          'message':       member_entity ~ ' is not a member of ' ~ _hh_cab ~ '; nothing was written.',
                          'member_entity': member_entity,
                          'timestamp':     now().isoformat(),
                          'caller_token':  caller_token | default('')
                        }
                      -}}
            - if: "{{- _found_key != '' -}}"
              then:
                - variables:
                    _updated_members: >-
                      {%- set _m = _hh_members_raw | from_json if _hh_members_raw is string else _hh_members_raw -%}
                      {%- set _m = _m if _m is mapping else {} -%}
                      {%- set _lst = _m.get(_found_key, []) -%}
                      {%- set _lst = _lst if _lst is iterable and _lst is not string else [] -%}
                      {%- set _filtered = _lst | rejectattr('entity_id', 'equalto', member_entity) | list -%}
                      {{- dict(_m, **{_found_key: _filtered}) | tojson -}}
                    _principal_warning: >-
                      {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                      {%- set r = CABS.acl_record(_hh_cab) | from_json -%}
                      {%- set g = CABS.acl_guid_of(member_entity) | trim -%}
                      {%- if g != '' and g == r.owner -%}hoh_slot_stale
                      {%- elif g != '' and g == r.prime -%}prime_slot_stale
                      {%- else -%}{%- endif -%}
                - action: script.zen_sutra_filecabinet
                  data:
                    caller_tool: zen_dojotools_identity
                    action_type: create
                    force_action: true
                    set_timestamp: true
                    show_hidden_volumes: false
                    volume_entity_id:
                      - "{{- _hh_cab -}}"
                    key: members
                    value: "{{- _updated_members -}}"
                - event: zen_event
                  event_data:
                    kind: household_member_left
                    household_cabinet: "{{- _hh_cab -}}"
                    member_entity: "{{- member_entity -}}"
                    member_type: "{{- _eff_type -}}"
                    principal_warning: "{{- _principal_warning -}}"
                    prompt_profile_update: "{{- _eff_type == 'ai_user' -}}"
                - variables:
                    response: > 
                      {{-
                        {
                          'mode':              'household_remove_member',
                          'status':            'ok',
                          'household_cabinet': _hh_cab,
                          'member_entity':     member_entity,
                          'member_type':       _eff_type,
                          'principal_warning': _principal_warning,
                          'timestamp':         now().isoformat(),
                          'caller_token':      caller_token | default('')
                        }
                      -}}
                - action: script.zen_dojotools_identity
                  data:
                    mode: build_identity_manifest
                    household_entity: "{{- _hh_cab -}}"
                  continue_on_error: true

    # ── Step 3f-2: mode = set_principal ─────────────────────────────────────
    # Works on households or families — family_entity overrides default household.
    - if: "{{- response is not defined and _mode == 'set_principal' -}}"
      then:
        - variables:
            _target_cab: >-
              {%- if family_entity | trim != '' -%}
                {{- family_entity | trim -}}
              {%- else -%}
                {{- _hh_target -}}
              {%- endif -%}
        - if: "{{- _target_cab in ['', 'unknown', 'unavailable'] or member_entity == '' -}}"
          then:
            - variables:
                response: >
                  {{-
                    {
                      'mode':    'set_principal',
                      'status':  'error',
                      'message': 'A target cabinet (family_entity or default household) and member_entity are both required.',
                      'timestamp': now().isoformat()
                    }
                  -}}
        - if: "{{- response is not defined -}}"
          then:
            - variables:
                _hh_vi_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _vi = CABS.cabinet_drawer_value(_target_cab, 'AI_Cabinet_VolumeInfo', {}) | from_json() -%}
                  {{- _vi | tojson -}}
                _mem_vi_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _vi = CABS.cabinet_drawer_value(member_entity, 'AI_Cabinet_VolumeInfo', {}) | from_json() -%}
                  {{- _vi | tojson -}}
            - variables:
                # A member with no GUID gets one: an ACL principal is a GUID.
                _mem_guid: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {{- (CABS.acl_guid_of(member_entity) | trim) or (CABS.cabinet_guid_new() | trim) -}}
                _mem_guid_is_new: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {{- CABS.acl_guid_of(member_entity) | trim == '' -}}
                # @todo - need to modify CABS.cabinet_drawer_value() so it can take a list of keys and return the first one that exists
                _mem_name: >-
                  {%- set _mv = state_attr(member_entity, 'variables') | default({}, true) -%}
                  {%- set _mv = _mv if _mv is mapping else {} -%}
                  {%- set _up_r = _mv.get('_user_profile', _mv.get('user_profile', _mv.get('_family_profile', _mv.get('family_profile', {})))) -%}
                  {%- set _up = _up_r.get('value', _up_r) if _up_r is mapping else {} -%}
                  {%- set _up = _up | from_json if _up is string else _up -%}
                  {%- set _pn = _up.get('preferred_name', '') | trim -%}
                  {%- set _fn = _up.get('first_name', '') | trim -%}
                  {%- set _ln = _up.get('last_name', '') | trim -%}
                  {%- set _d = _pn if _pn != '' else ((_fn + ' ' + _ln) | trim) -%}
                  {%- set _vi = _mem_vi_raw | from_json if _mem_vi_raw is string else _mem_vi_raw -%}
                  {{- _d if _d != '' else (_vi if _vi is mapping else {}).get('friendly_name', member_entity) -}}
                # The target's ACL (#10626): owner = HoH, prime = prime AI, by GUID.
                _sp_rec: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {{- CABS.acl_record(_target_cab) | from_json -}}
                _sp_pr: >-
                  {%- import 'zenos_ai/zen_identity.jinja' as ID -%}
                  {{- ID.principals(_target_cab) | from_json -}}
            - variables:
                _sp_existing_guid: "{{- _sp_rec.owner if member_type == 'user' else _sp_rec.prime -}}"
                _sp_existing_slot_holder: >-
                  {%- set e = _sp_pr.get('hoh' if member_type == 'user' else 'prime') -%}
                  {{- ((e.entity_id or e.guid) if e is mapping else '') -}}
                _sp_is_takeover: "{{- _sp_existing_guid not in ['', _mem_guid] -}}"
            - if: "{{- (_sp_is_takeover | bool) and not (confirm_action | default(false) | bool) -}}"
              then:
                - variables:
                    response: >
                      {{-
                        {
                          'mode':    'set_principal',
                          'status':  'blocked',
                          'message': 'Takeover blocked: ' ~ ('HoH' if member_type == 'user' else 'prime') ~ ' slot on ' ~ _target_cab ~ ' is already occupied by ' ~ _sp_existing_slot_holder ~ '. Replacing an established principal with a different entity requires confirm_action: true.',
                          'existing_holder': _sp_existing_slot_holder,
                          'requested_entity': member_entity,
                          'timestamp': now().isoformat()
                        }
                      -}}
            - if: "{{- response is not defined -}}"
              then:
                - if: "{{- _mem_guid_is_new | bool -}}"
                  then:
                    # Admin door (#10637): VolumeInfo is cabinet structure; FileCabinet refuses it.
                    - action: script.zen_admintools_cabinet_writer
                      data:
                        mode: merge
                        volume_entity: "{{- member_entity -}}"
                        key: AI_Cabinet_VolumeInfo
                        value: "{{- {'id': _mem_guid} -}}"
                        caller: zen_dojotools_identity
                        reason: "identity {{ mode | default('', true) }}"
                - variables:
                    _sp_acl_updated: >-
                      {%- set r = _sp_rec -%}
                      {{- {'v': 2,
                           'owner': _mem_guid if member_type == 'user' else r.owner,
                           'prime': _mem_guid if member_type != 'user' else r.prime,
                           'partners': r.partners | reject('equalto', _mem_guid) | list,
                           'ops': r.ops_stored} -}}
                # Admin door (#10637): VolumeInfo is cabinet structure; FileCabinet refuses it.
                - action: script.zen_admintools_cabinet_writer
                  data:
                    mode: merge
                    volume_entity: "{{- _target_cab -}}"
                    key: AI_Cabinet_VolumeInfo
                    value: "{{- {'acls': _sp_acl_updated} -}}"
                    set_timestamp: true
                    caller: zen_dojotools_identity
                    reason: "identity {{ mode | default('', true) }}"
                # household_add_member keeps 'members' and 'acls' in sync in one
                # call; set_principal only ever wrote acls, which left a caller
                # that used set_principal directly (rather than
                # household_add_member) with a principal pointer that a
                # membership-based staleness check would wrongly flag as
                # orphaned. Mirror that sync here too — dedup, only add if not
                # already present, matching household_add_member's entry shape.
                - variables:
                    _sp_list_key: "{{- 'ai_users' if member_type == 'ai_user' else 'users' -}}"
                    _sp_members_raw: >-
                      {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                      {%- set _m = CABS.cabinet_drawer_value(_target_cab, 'members', {}) | from_json() -%}
                      {{- _m | tojson -}}
                - variables:
                    _sp_updated_members: >-
                      {%- set _m = _sp_members_raw | from_json if _sp_members_raw is string else _sp_members_raw -%}
                      {%- set _m = _m if _m is mapping else {} -%}
                      {%- set _lst = _m.get(_sp_list_key, []) -%}
                      {%- set _lst = _lst if _lst is iterable and _lst is not string else [] -%}
                      {%- set _already = _lst | selectattr('entity_id', 'equalto', member_entity) | list | count > 0 -%}
                      {%- if _already -%}
                        {{- _m | tojson -}}
                      {%- else -%}
                        {%- set _entry = {'guid': _mem_guid, 'entity_id': member_entity, 'name': member_entity} -%}
                        {{- dict(_m, **{_sp_list_key: _lst + [_entry]}) | tojson -}}
                      {%- endif -%}
                - action: script.zen_sutra_filecabinet
                  data:
                    caller_tool: zen_dojotools_identity
                    action_type: create
                    force_action: true
                    set_timestamp: true
                    show_hidden_volumes: false
                    volume_entity_id:
                      - "{{- _target_cab -}}"
                    key: members
                    value: "{{- _sp_updated_members -}}"
                - variables:
                    _slot: "{{- 'hoh' if member_type == 'user' else 'prime' -}}"
                    response: >
                      {{-
                        {
                          'mode':           'set_principal',
                          'status':         'ok',
                          'target_cabinet': _target_cab,
                          'slot':              _slot,
                          'member_entity':     member_entity,
                          'member_type':       member_type,
                          'member_guid':       _mem_guid,
                          'member_name':       _mem_name,
                          'timestamp':         now().isoformat(),
                          'caller_token':      caller_token | default('')
                        }
                      -}}
                - event: zen_event
                  event_data:
                    kind: principal_changed
                    target_cabinet: "{{- _target_cab -}}"
                    slot: "{{- _slot -}}"
                    member_entity: "{{- member_entity -}}"
                    member_name: "{{- _mem_name -}}"
                    member_type: "{{- member_type -}}"
                    prompt_profile_update: true
                - event: zen_event
                  event_data:
                    event:
                      kind: identity_manifest_rebuild
                      component: zen_dojotools_identity
                      severity: info
                      summary: Manifest rebuild triggered by set_principal.

    # ── Step 3g: mode = family_add_member ────────────────────────────────────
    # Nesting is allowed — resolver caps security resolution at depth 2.
    - if: "{{- response is not defined and _mode == 'family_add_member' -}}"
      then:
            - if: "{{- family_entity == '' or member_entity == '' -}}"
              then:
                - variables:
                    response: >
                      {{-
                        {
                          'mode':    'family_add_member',
                          'status':  'error',
                          'message': 'family_entity and member_entity are both required.',
                          'timestamp': now().isoformat()
                        }
                      -}}
    - if: "{{- response is not defined and _mode == 'family_add_member' -}}"
      then:
            - variables:
                _fam_members_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _m = CABS.cabinet_drawer_value(family_entity, 'members', {}) | from_json() -%}
                  {{- _m | tojson -}}
                _mem_vi_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _vi = CABS.cabinet_drawer_value(member_entity, 'AI_Cabinet_VolumeInfo', {}) | from_json() -%}
                  {{- _vi | tojson -}}
                _fam_vi_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _vi = CABS.cabinet_drawer_value(family_entity, 'AI_Cabinet_VolumeInfo', {}) | from_json() -%}
                  {{- _vi | tojson -}}
            - variables:
                _mem_guid: >-
                  {%- set _vi = _mem_vi_raw | from_json if _mem_vi_raw is string else _mem_vi_raw -%}
                  {%- set _vi = _vi if _vi is mapping else {} -%}
                  {%- set _existing = _vi.get('id', _vi.get('guid', '')) | string | trim -%}
                  {%- if _existing != '' -%}{{- _existing -}}{%- else -%}
                    {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                    {{- CABS.cabinet_guid_new() | default('') -}}
                  {%- endif -%}
                # @todo - need to modify CABS.cabinet_drawer_value() so it can take a list of keys and return the first one that exists
                _mem_name: >-
                  {%- set _mv = state_attr(member_entity, 'variables') | default({}, true) -%}
                  {%- set _mv = _mv if _mv is mapping else {} -%}
                  {%- set _up_r = _mv.get('_user_profile', _mv.get('user_profile', _mv.get('_family_profile', _mv.get('family_profile', {})))) -%}
                  {%- set _up = _up_r.get('value', _up_r) if _up_r is mapping else {} -%}
                  {%- set _up = _up | from_json if _up is string else _up -%}
                  {%- set _pn = _up.get('preferred_name', '') | trim -%}
                  {%- set _fn = _up.get('first_name', '') | trim -%}
                  {%- set _ln = _up.get('last_name', '') | trim -%}
                  {%- set _d = _pn if _pn != '' else ((_fn + ' ' + _ln) | trim) -%}
                  {%- set _vi = _mem_vi_raw | from_json if _mem_vi_raw is string else _mem_vi_raw -%}
                  {%- set _vi = _vi if _vi is mapping else {} -%}
                  {{- _d if _d != '' else _vi.get('friendly_name', member_entity) -}}
                _fam_guid: >-
                  {%- set _vi = _fam_vi_raw | from_json if _fam_vi_raw is string else _fam_vi_raw -%}
                  {%- set _vi = _vi if _vi is mapping else {} -%}
                  {{- _vi.get('id', _vi.get('guid', '')) -}}
                # @todo - need to modify CABS.cabinet_drawer_value() so it can take a list of keys and return the first one that exists
                _fam_name: >-
                  {%- set _fv = state_attr(family_entity, 'variables') | default({}, true) -%}
                  {%- set _fv = _fv if _fv is mapping else {} -%}
                  {%- set _fp_r = _fv.get('_family_profile', _fv.get('family_profile', {})) -%}
                  {%- set _fp = _fp_r.get('value', _fp_r) if _fp_r is mapping else {} -%}
                  {%- set _fp = _fp | from_json if _fp is string else _fp -%}
                  {%- set _d = _fp.get('display_name', _fp.get('friendly_name', _fp.get('name', ''))) | trim -%}
                  {%- set _vi = _fam_vi_raw | from_json if _fam_vi_raw is string else _fam_vi_raw -%}
                  {%- set _vi = _vi if _vi is mapping else {} -%}
                  {{- _d if _d != '' else _vi.get('friendly_name', family_entity) -}}
                _list_key: >-
                  {%- if member_type == 'ai_user' -%}ai_users
                  {%- elif member_type == 'family' -%}families
                  {%- else -%}users{%- endif -%}
            - variables:
                _existing_list: >-
                  {%- set _m = _fam_members_raw | from_json if _fam_members_raw is string else _fam_members_raw -%}
                  {%- set _m = _m if _m is mapping else {} -%}
                  {{- _m.get(_list_key, []) | tojson -}}
                _new_entry: >-
                  {%- set _pid = user_entity_id | default('') | trim -%}
                  {%- if member_type == 'family' -%}
                    {{- {'guid': _mem_guid, 'entity_id': member_entity, 'name': _mem_name, 'depth': 2} | tojson -}}
                  {%- else -%}
                    {{- {
                      'guid':             _mem_guid,
                      'entity_id':        member_entity,
                      'name':             _mem_name,
                      'person_entity_id': _pid if _pid != '' else none
                    } | tojson -}}
                  {%- endif -%}
            - variables:
                _already_member: >-
                  {%- set _lst = _existing_list | from_json if _existing_list is string else _existing_list -%}
                  {%- set _lst = _lst if _lst is iterable and _lst is not string else [] -%}
                  {{- _lst | selectattr('entity_id', 'equalto', member_entity) | list | count > 0 -}}
            - if: "{{- _already_member | bool -}}"
              then:
                # Re-adding an existing member with user_entity_id backfills a missing
                # person_entity_id (same idempotent repair as household_add_member);
                # never overwrites an entry that already has one.
                - variables:
                    _fam_pid_backfill: "{{- user_entity_id | default('') | trim -}}"
                    _fam_existing_pid: >-
                      {%- set _lst = _existing_list | from_json if _existing_list is string else _existing_list -%}
                      {%- set _lst = _lst if _lst is iterable and _lst is not string else [] -%}
                      {%- set _hit = _lst | selectattr('entity_id', 'equalto', member_entity) | first | default(none) -%}
                      {{- (_hit.get('person_entity_id', '') | default('', true) | trim) if _hit else '' -}}
                - if: "{{- _fam_pid_backfill != '' and _fam_existing_pid == '' -}}"
                  then:
                    - variables:
                        _fam_backfilled: >-
                          {%- set _m = _fam_members_raw | from_json if _fam_members_raw is string else _fam_members_raw -%}
                          {%- set _m = _m if _m is mapping else {} -%}
                          {%- set _lst = _m.get(_list_key, []) -%}
                          {%- set _lst = _lst if _lst is iterable and _lst is not string else [] -%}
                          {%- set ns = namespace(out=[]) -%}
                          {%- for _e in _lst -%}
                            {%- if _e.get('entity_id', '') == member_entity -%}
                              {%- set ns.out = ns.out + [dict(_e, **{'person_entity_id': _fam_pid_backfill})] -%}
                            {%- else -%}
                              {%- set ns.out = ns.out + [_e] -%}
                            {%- endif -%}
                          {%- endfor -%}
                          {{- dict(_m, **{_list_key: ns.out}) | tojson -}}
                    - action: script.zen_sutra_filecabinet
                      data:
                        caller_tool: zen_dojotools_identity
                        action_type: create
                        force_action: true
                        set_timestamp: true
                        show_hidden_volumes: false
                        volume_entity_id:
                          - "{{- family_entity -}}"
                        key: members
                        value: "{{- _fam_backfilled -}}"
                - variables:
                    response: >
                      {{-
                        {
                          'mode':          'family_add_member',
                          'status':        'already_member',
                          'person_entity_id_backfilled': (_fam_pid_backfill != '' and _fam_existing_pid == ''),
                          'family_entity': family_entity,
                          'member_entity': member_entity,
                          'timestamp':     now().isoformat()
                        }
                      -}}
    - if: "{{- response is not defined and _mode == 'family_add_member' -}}"
      then:
            - variables:
                _updated_members: >-
                  {%- set _m = _fam_members_raw | from_json if _fam_members_raw is string else _fam_members_raw -%}
                  {%- set _m = _m if _m is mapping else {} -%}
                  {%- set _lst = _m.get(_list_key, []) -%}
                  {%- set _lst = _lst if _lst is iterable and _lst is not string else [] -%}
                  {%- set _entry = _new_entry | from_json if _new_entry is string else _new_entry -%}
                  {{- dict(_m, **{_list_key: _lst + [_entry]}) | tojson -}}
            - action: script.zen_sutra_filecabinet
              data:
                caller_tool: zen_dojotools_identity
                action_type: create
                force_action: true
                set_timestamp: true
                show_hidden_volumes: false
                volume_entity_id:
                  - "{{- family_entity -}}"
                key: members
                value: "{{- _updated_members -}}"
            # — if this is the member's first family, set default_family_guid —
            - variables:
                _mem_dfg_raw: >-
                  {%- set _vi = _mem_vi_raw | from_json if _mem_vi_raw is string else _mem_vi_raw -%}
                  {%- set _vi = _vi if _vi is mapping else {} -%}
                  {{- _vi.get('default_family_guid', '') -}}
                _is_first_family: "{{- member_type != 'family' and (_mem_dfg_raw | trim == '') -}}"
            # Patch the member's VolumeInfo: its id, the default family if first,
            #   and its ACL as v2 (family membership lives in the members drawers,
            #   not in acls).
            - if: "{{- member_type != 'family' -}}"
              then:
                - variables:
                    _mem_vi_patch: >-
                      {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                      {%- set r = CABS.acl_record(member_entity) | from_json -%}
                      {%- set _vi = _mem_vi_raw | from_json if _mem_vi_raw is string else _mem_vi_raw -%}
                      {%- set _vi = _vi if _vi is mapping else {} -%}
                      {%- set _dfg = _fam_guid if _is_first_family | bool else _vi.get('default_family_guid', '') -%}
                      {{- {'id': _mem_guid, 'default_family_guid': _dfg,
                           'acls': {'v': 2, 'owner': r.owner, 'prime': r.prime, 'partners': r.partners, 'ops': r.ops_stored}} -}}
                # Admin door (#10637): VolumeInfo is cabinet structure; FileCabinet refuses it.
                - action: script.zen_admintools_cabinet_writer
                  data:
                    mode: merge
                    volume_entity: "{{- member_entity -}}"
                    key: AI_Cabinet_VolumeInfo
                    value: "{{- _mem_vi_patch -}}"
                    set_timestamp: true
                    caller: zen_dojotools_identity
                    reason: "identity {{ mode | default('', true) }}"
            - event: zen_event
              event_data:
                kind: family_member_joined
                family_entity: "{{- family_entity -}}"
                family_name: "{{- _fam_name -}}"
                family_guid: "{{- _fam_guid -}}"
                member_entity: "{{- member_entity -}}"
                member_name: "{{- _mem_name -}}"
                member_type: "{{- member_type -}}"
                is_ai: "{{- member_type == 'ai_user' -}}"
                is_first_family: "{{- _is_first_family | bool -}}"
                prompt_profile_update: true
            - variables:
                response: >
                  {{-
                    {
                      'mode':             'family_add_member',
                      'status':           'ok',
                      'family_entity':    family_entity,
                      'family_guid':      _fam_guid,
                      'family_name':      _fam_name,
                      'member_entity':    member_entity,
                      'member_type':      member_type,
                      'member_guid':      _mem_guid,
                      'member_name':      _mem_name,
                      'is_first_family':  _is_first_family | bool,
                      'timestamp':        now().isoformat(),
                      'caller_token':     caller_token | default('')
                    }
                  -}}
            - action: script.zen_dojotools_identity
              data:
                mode: build_identity_manifest
                household_entity: "{{- _hh_target -}}"
              continue_on_error: true

    # ── Step 3h: mode = family_remove_member ─────────────────────────────────
    - if: "{{- response is not defined and _mode == 'family_remove_member' -}}"
      then:
            - if: "{{- family_entity == '' or member_entity == '' -}}"
              then:
                - variables:
                    response: >
                      {{-
                        {
                          'mode':    'family_remove_member',
                          'status':  'error',
                          'message': 'family_entity and member_entity are both required.',
                          'timestamp': now().isoformat()
                        }
                      -}}
    - if: "{{- response is not defined and _mode == 'family_remove_member' -}}"
      then:
            - variables:
                _fam_members_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _m = CABS.cabinet_drawer_value(family_entity, 'members', {}) | from_json() -%}
                  {{- _m | tojson -}}
                _mem_vi_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _vi = CABS.cabinet_drawer_value(member_entity, 'AI_Cabinet_VolumeInfo', {}) | from_json() -%}
                  {{- _vi | tojson -}}
                _fam_vi_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _vi = CABS.cabinet_drawer_value(family_entity, 'AI_Cabinet_VolumeInfo', {}) | from_json() -%}
                  {{- _vi | tojson -}}
            - variables:
                _fam_guid: >-
                  {%- set _vi = _fam_vi_raw | from_json if _fam_vi_raw is string else _fam_vi_raw -%}
                  {%- set _vi = _vi if _vi is mapping else {} -%}
                  {{- _vi.get('id', _vi.get('guid', '')) -}}
                # @todo - need to modify CABS.cabinet_drawer_value() so it can take a list of keys and return the first one that exists
                _fam_name: >-
                  {%- set _fv = state_attr(family_entity, 'variables') | default({}, true) -%}
                  {%- set _fv = _fv if _fv is mapping else {} -%}
                  {%- set _fp_r = _fv.get('_family_profile', _fv.get('family_profile', {})) -%}
                  {%- set _fp = _fp_r.get('value', _fp_r) if _fp_r is mapping else {} -%}
                  {%- set _fp = _fp | from_json if _fp is string else _fp -%}
                  {%- set _d = _fp.get('display_name', _fp.get('friendly_name', _fp.get('name', ''))) | trim -%}
                  {%- set _vi = _fam_vi_raw | from_json if _fam_vi_raw is string else _fam_vi_raw -%}
                  {%- set _vi = _vi if _vi is mapping else {} -%}
                  {{- _d if _d != '' else _vi.get('friendly_name', family_entity) -}}
                _mem_guid: >-
                  {%- set _vi = _mem_vi_raw | from_json if _mem_vi_raw is string else _mem_vi_raw -%}
                  {%- set _vi = _vi if _vi is mapping else {} -%}
                  {{- _vi.get('id', _vi.get('guid', '')) -}}
                # @todo - need to modify CABS.cabinet_drawer_value() so it can take a list of keys and return the first one that exists
                _mem_name: >-
                  {%- set _mv = state_attr(member_entity, 'variables') | default({}, true) -%}
                  {%- set _mv = _mv if _mv is mapping else {} -%}
                  {%- set _up_r = _mv.get('_user_profile', _mv.get('user_profile', _mv.get('_family_profile', _mv.get('family_profile', {})))) -%}
                  {%- set _up = _up_r.get('value', _up_r) if _up_r is mapping else {} -%}
                  {%- set _up = _up | from_json if _up is string else _up -%}
                  {%- set _pn = _up.get('preferred_name', '') | trim -%}
                  {%- set _fn = _up.get('first_name', '') | trim -%}
                  {%- set _ln = _up.get('last_name', '') | trim -%}
                  {%- set _d = _pn if _pn != '' else ((_fn + ' ' + _ln) | trim) -%}
                  {%- set _vi = _mem_vi_raw | from_json if _mem_vi_raw is string else _mem_vi_raw -%}
                  {%- set _vi = _vi if _vi is mapping else {} -%}
                  {{- _d if _d != '' else _vi.get('friendly_name', member_entity) -}}
                _was_default: >-
                  {%- set _vi = _mem_vi_raw | from_json if _mem_vi_raw is string else _mem_vi_raw -%}
                  {%- set _vi = _vi if _vi is mapping else {} -%}
                  {{- _vi.get('default_family_guid', '') == _fam_guid -}}
                _principal_warning: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set r = CABS.acl_record(family_entity) | from_json -%}
                  {%- set g = CABS.acl_guid_of(member_entity) | trim -%}
                  {%- if g != '' and g == r.owner -%}hoh_slot_stale
                  {%- elif g != '' and g == r.prime -%}prime_slot_stale
                  {%- else -%}{%- endif -%}
            # The members drawer is the truth on remove: match the entity in
            # whichever list holds it, so an omitted member_type cannot miss.
            - variables:
                _found_key: >-
                  {%- set _m = _fam_members_raw | from_json if _fam_members_raw is string else _fam_members_raw -%}
                  {%- set _m = _m if _m is mapping else {} -%}
                  {%- set ns = namespace(k='') -%}
                  {%- for k in ['users', 'ai_users', 'families'] -%}
                    {%- set _l = _m.get(k, []) -%}
                    {%- set _l = _l if _l is iterable and _l is not string else [] -%}
                    {%- if ns.k == '' and (_l | selectattr('entity_id', 'defined') | selectattr('entity_id', 'equalto', member_entity) | list | count > 0) -%}
                      {%- set ns.k = k -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{- ns.k -}}
            - variables:
                _eff_type: "{{- {'users': 'user', 'ai_users': 'ai_user', 'families': 'family'}.get(_found_key, member_type) -}}"
            - if: "{{- _found_key == '' -}}"
              then:
                - variables:
                    response: >
                      {{-
                        {
                          'mode':          'family_remove_member',
                          'status':        'error',
                          'code':          'not_member',
                          'message':       member_entity ~ ' is not a member of ' ~ family_entity ~ '; nothing was written.',
                          'member_entity': member_entity,
                          'timestamp':     now().isoformat(),
                          'caller_token':  caller_token | default('')
                        }
                      -}}
            - if: "{{- _found_key != '' -}}"
              then:
                - variables:
                    _updated_members: >-
                      {%- set _m = _fam_members_raw | from_json if _fam_members_raw is string else _fam_members_raw -%}
                      {%- set _m = _m if _m is mapping else {} -%}
                      {%- set _lst = _m.get(_found_key, []) -%}
                      {%- set _lst = _lst if _lst is iterable and _lst is not string else [] -%}
                      {%- set _filtered = _lst | rejectattr('entity_id', 'equalto', member_entity) | list -%}
                      {{- dict(_m, **{_found_key: _filtered}) | tojson -}}
                - action: script.zen_sutra_filecabinet
                  data:
                    caller_tool: zen_dojotools_identity
                    action_type: create
                    force_action: true
                    set_timestamp: true
                    show_hidden_volumes: false
                    volume_entity_id:
                      - "{{- family_entity -}}"
                    key: members
                    value: "{{- _updated_members -}}"
                # Patch the member's VolumeInfo: clear the default family if it
                #   was this one, and its ACL as v2 (no acls.family).
                - if: "{{- _eff_type != 'family' -}}"
                  then:
                    - variables:
                        _mem_vi_patch: >-
                          {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                          {%- set r = CABS.acl_record(member_entity) | from_json -%}
                          {%- set _vi = _mem_vi_raw | from_json if _mem_vi_raw is string else _mem_vi_raw -%}
                          {%- set _vi = _vi if _vi is mapping else {} -%}
                          {%- set _dfg = '' if _was_default | bool else _vi.get('default_family_guid', '') -%}
                          {{- {'default_family_guid': _dfg,
                               'acls': {'v': 2, 'owner': r.owner, 'prime': r.prime, 'partners': r.partners, 'ops': r.ops_stored}} -}}
                    # Admin door (#10637): VolumeInfo is cabinet structure; FileCabinet refuses it.
                    - action: script.zen_admintools_cabinet_writer
                      data:
                        mode: merge
                        volume_entity: "{{- member_entity -}}"
                        key: AI_Cabinet_VolumeInfo
                        value: "{{- _mem_vi_patch -}}"
                        set_timestamp: true
                        caller: zen_dojotools_identity
                        reason: "identity {{ mode | default('', true) }}"
                - event: zen_event
                  event_data:
                    kind: family_member_left
                    family_entity: "{{- family_entity -}}"
                    family_name: "{{- _fam_name -}}"
                    family_guid: "{{- _fam_guid -}}"
                    member_entity: "{{- member_entity -}}"
                    member_name: "{{- _mem_name -}}"
                    member_type: "{{- _eff_type -}}"
                    is_ai: "{{- _eff_type == 'ai_user' -}}"
                    was_default_family: "{{- _was_default | bool -}}"
                    principal_warning: "{{- _principal_warning -}}"
                    prompt_profile_update: true
                - variables:
                    response: >
                      {{-
                        {
                          'mode':              'family_remove_member',
                          'status':            'ok',
                          'family_entity':     family_entity,
                          'family_guid':       _fam_guid,
                          'family_name':       _fam_name,
                          'member_entity':     member_entity,
                          'member_type':       _eff_type,
                          'member_guid':       _mem_guid,
                          'member_name':       _mem_name,
                          'was_default_family': _was_default | bool,
                          'principal_warning': _principal_warning,
                          'timestamp':         now().isoformat(),
                          'caller_token':      caller_token | default('')
                        }
                      -}}
                - action: script.zen_dojotools_identity
                  data:
                    mode: build_identity_manifest
                    household_entity: "{{- _hh_target -}}"
                  continue_on_error: true

    # ── Step 3i: mode = link_partners ─────────────────────────────────────────
    # Works for any entity pair: user↔user, user↔ai_user, ai_user↔ai_user.
    # partner = delegation authority. Each side's ACL lists the other's GUID.
    - if: "{{- response is not defined and _mode == 'link_partners' -}}"
      then:
            - if: "{{- member_entity == '' or ai_entity == '' -}}"
              then:
                - variables:
                    response: >
                      {{-
                        {
                          'mode':    'link_partners',
                          'status':  'error',
                          'message': 'member_entity and ai_entity (the two entities to link) are both required.',
                          'timestamp': now().isoformat()
                        }
                      -}}
    - if: "{{- response is not defined and _mode == 'link_partners' -}}"
      then:
            - variables:
                _a_vi_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _vi = CABS.cabinet_drawer_value(member_entity, 'AI_Cabinet_VolumeInfo', {}) | from_json() -%}
                  {{- _vi | tojson -}}
                _b_vi_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _vi = CABS.cabinet_drawer_value(ai_entity, 'AI_Cabinet_VolumeInfo', {}) | from_json() -%}
                  {{- _vi | tojson -}}
            - variables:
                # A cabinet with no GUID gets one: an ACL principal is a GUID.
                _a_guid: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {{- (CABS.acl_guid_of(member_entity) | trim) or (CABS.cabinet_guid_new() | trim) -}}
                _a_name: >-
                  {%- set _vi = _a_vi_raw | from_json if _a_vi_raw is string else _a_vi_raw -%}
                  {{- (_vi if _vi is mapping else {}).get('friendly_name', member_entity) -}}
                _a_type: >-
                  {%- set _vi = _a_vi_raw | from_json if _a_vi_raw is string else _a_vi_raw -%}
                  {{- (_vi if _vi is mapping else {}).get('cab_type', 'user') -}}
                _b_guid: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {{- (CABS.acl_guid_of(ai_entity) | trim) or (CABS.cabinet_guid_new() | trim) -}}
                _b_name: >-
                  {%- set _vi = _b_vi_raw | from_json if _b_vi_raw is string else _b_vi_raw -%}
                  {{- (_vi if _vi is mapping else {}).get('friendly_name', ai_entity) -}}
                _b_type: >-
                  {%- set _vi = _b_vi_raw | from_json if _b_vi_raw is string else _b_vi_raw -%}
                  {{- (_vi if _vi is mapping else {}).get('cab_type', 'user') -}}
            # Each side's ACL lists the other's GUID as a partner (delegation).
            - variables:
                _a_patch: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set r = CABS.acl_record(member_entity) | from_json -%}
                  {%- set _p = r.partners if _b_guid in r.partners else r.partners + [_b_guid] -%}
                  {{- {'id': _a_guid, 'acls': {'v': 2, 'owner': r.owner, 'prime': r.prime, 'partners': _p, 'ops': r.ops_stored}} -}}
                _b_patch: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set r = CABS.acl_record(ai_entity) | from_json -%}
                  {%- set _p = r.partners if _a_guid in r.partners else r.partners + [_a_guid] -%}
                  {{- {'id': _b_guid, 'acls': {'v': 2, 'owner': r.owner, 'prime': r.prime, 'partners': _p, 'ops': r.ops_stored}} -}}
            # Admin door (#10637): VolumeInfo is cabinet structure; FileCabinet refuses it.
            - action: script.zen_admintools_cabinet_writer
              data:
                mode: merge
                volume_entity: "{{- member_entity -}}"
                key: AI_Cabinet_VolumeInfo
                value: "{{- _a_patch -}}"
                set_timestamp: true
                caller: zen_dojotools_identity
                reason: "identity {{ mode | default('', true) }}"
            # Admin door (#10637): VolumeInfo is cabinet structure; FileCabinet refuses it.
            - action: script.zen_admintools_cabinet_writer
              data:
                mode: merge
                volume_entity: "{{- ai_entity -}}"
                key: AI_Cabinet_VolumeInfo
                value: "{{- _b_patch -}}"
                set_timestamp: true
                caller: zen_dojotools_identity
                reason: "identity {{ mode | default('', true) }}"
            - variables:
                response: >
                  {{-
                    {
                      'mode':        'link_partners',
                      'status':      'ok',
                      'entity_a':    member_entity,
                      'guid_a':      _a_guid,
                      'name_a':      _a_name,
                      'type_a':      _a_type,
                      'entity_b':    ai_entity,
                      'guid_b':      _b_guid,
                      'name_b':      _b_name,
                      'type_b':      _b_type,
                      'timestamp':   now().isoformat(),
                      'caller_token': caller_token | default('')
                    }
                  -}}
            - event: zen_event
              event_data:
                event:
                  kind: partner_linked
                  entity_a: "{{- member_entity -}}"
                  name_a: "{{- _a_name -}}"
                  type_a: "{{- _a_type -}}"
                  entity_b: "{{- ai_entity -}}"
                  name_b: "{{- _b_name -}}"
                  type_b: "{{- _b_type -}}"
                  prompt_profile_update: true
            - event: zen_event
              event_data:
                event:
                  kind: identity_manifest_rebuild
                  component: zen_dojotools_identity
                  severity: info
                  summary: Manifest rebuild triggered by link_partners.

    # ── Step 3i-2: mode = unlink_partners ─────────────────────────────────────
    # Symmetric: removes each entity's GUID from the other's ACL partners.
    - if: "{{- response is not defined and _mode == 'unlink_partners' -}}"
      then:
        - if: "{{- member_entity == '' or ai_entity == '' -}}"
          then:
            - variables:
                response: >
                  {{-
                    {
                      'mode':    'unlink_partners',
                      'status':  'error',
                      'message': 'member_entity and ai_entity (the two entities to unlink) are both required.',
                      'timestamp': now().isoformat()
                    }
                  -}}
        - if: "{{- response is not defined -}}"
          then:
            - variables:
                _a_vi_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _vi = CABS.cabinet_drawer_value(member_entity, 'AI_Cabinet_VolumeInfo', {}) | from_json() -%}
                  {{- _vi | tojson -}}
                _b_vi_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _vi = CABS.cabinet_drawer_value(ai_entity, 'AI_Cabinet_VolumeInfo', {}) | from_json() -%}
                  {{- _vi | tojson -}}
            - variables:
                _a_name: >-
                  {%- set _vi = _a_vi_raw | from_json if _a_vi_raw is string else _a_vi_raw -%}
                  {{- (_vi if _vi is mapping else {}).get('friendly_name', member_entity) -}}
                _b_name: >-
                  {%- set _vi = _b_vi_raw | from_json if _b_vi_raw is string else _b_vi_raw -%}
                  {{- (_vi if _vi is mapping else {}).get('friendly_name', ai_entity) -}}
                # Each side's ACL drops the other's GUID.
                _a_patch: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set r = CABS.acl_record(member_entity) | from_json -%}
                  {%- set g = CABS.acl_guid_of(ai_entity) | trim -%}
                  {{- {'acls': {'v': 2, 'owner': r.owner, 'prime': r.prime, 'partners': r.partners | reject('equalto', g) | list, 'ops': r.ops_stored}} -}}
                _b_patch: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set r = CABS.acl_record(ai_entity) | from_json -%}
                  {%- set g = CABS.acl_guid_of(member_entity) | trim -%}
                  {{- {'acls': {'v': 2, 'owner': r.owner, 'prime': r.prime, 'partners': r.partners | reject('equalto', g) | list, 'ops': r.ops_stored}} -}}
            # Admin door (#10637): VolumeInfo is cabinet structure; FileCabinet refuses it.
            - action: script.zen_admintools_cabinet_writer
              data:
                mode: merge
                volume_entity: "{{- member_entity -}}"
                key: AI_Cabinet_VolumeInfo
                value: "{{- _a_patch -}}"
                set_timestamp: true
                caller: zen_dojotools_identity
                reason: "identity {{ mode | default('', true) }}"
            # Admin door (#10637): VolumeInfo is cabinet structure; FileCabinet refuses it.
            - action: script.zen_admintools_cabinet_writer
              data:
                mode: merge
                volume_entity: "{{- ai_entity -}}"
                key: AI_Cabinet_VolumeInfo
                value: "{{- _b_patch -}}"
                set_timestamp: true
                caller: zen_dojotools_identity
                reason: "identity {{ mode | default('', true) }}"
            - event: zen_event
              event_data:
                event:
                  kind: partner_unlinked
                  entity_a: "{{- member_entity -}}"
                  name_a: "{{- _a_name -}}"
                  entity_b: "{{- ai_entity -}}"
                  name_b: "{{- _b_name -}}"
                  prompt_profile_update: true
            - variables:
                response: >
                  {{-
                    {
                      'mode':      'unlink_partners',
                      'status':    'ok',
                      'entity_a':  member_entity,
                      'name_a':    _a_name,
                      'entity_b':  ai_entity,
                      'name_b':    _b_name,
                      'timestamp': now().isoformat(),
                      'caller_token': caller_token | default('')
                    }
                  -}}
            - event: zen_event
              event_data:
                event:
                  kind: identity_manifest_rebuild
                  component: zen_dojotools_identity
                  severity: info
                  summary: Manifest rebuild triggered by unlink_partners.

    # ── Step 3j: mode = set_default_family ───────────────────────────────────
    - if: "{{- response is not defined and _mode == 'set_default_family' -}}"
      then:
        - if: "{{- member_entity == '' or family_entity == '' -}}"
          then:
            - variables:
                response: >
                  {{-
                    {
                      'mode':    'set_default_family',
                      'status':  'error',
                      'message': 'member_entity (user cabinet) and family_entity are both required.',
                      'timestamp': now().isoformat()
                    }
                  -}}
        - if: "{{- response is not defined -}}"
          then:
            - variables:
                _mem_vi_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _vi = CABS.cabinet_drawer_value(member_entity, 'AI_Cabinet_VolumeInfo', {}) | from_json() -%}
                  {{- _vi | tojson -}}
                _fam_vi_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _vi = CABS.cabinet_drawer_value(family_entity, 'AI_Cabinet_VolumeInfo', {}) | from_json() -%}
                  {{- _vi | tojson -}}
            - variables:
                _fam_guid: >-
                  {%- set _vi = _fam_vi_raw | from_json if _fam_vi_raw is string else _fam_vi_raw -%}
                  {{- (_vi if _vi is mapping else {}).get('id', (_vi if _vi is mapping else {}).get('guid', '')) -}}
            # Admin door (#10637): VolumeInfo is cabinet structure; FileCabinet refuses it.
            - action: script.zen_admintools_cabinet_writer
              data:
                mode: merge
                volume_entity: "{{- member_entity -}}"
                key: AI_Cabinet_VolumeInfo
                value: "{{- {'default_family_guid': _fam_guid} -}}"
                set_timestamp: true
                caller: zen_dojotools_identity
                reason: "identity {{ mode | default('', true) }}"
            - variables:
                response: >
                  {{-
                    {
                      'mode':           'set_default_family',
                      'status':         'ok',
                      'member_entity':  member_entity,
                      'family_entity':  family_entity,
                      'family_guid':    _fam_guid,
                      'timestamp':      now().isoformat(),
                      'caller_token':   caller_token | default('')
                    }
                  -}}
            - event: zen_event
              event_data:
                event:
                  kind: identity_manifest_rebuild
                  component: zen_dojotools_identity
                  severity: info
                  summary: Manifest rebuild triggered by set_default_family.

    # ── Step 3j-2: mode = acl_migrate (#10626) ───────────────────────────────
    # Brings every cabinet's VolumeInfo to the ACL v2 record and fixes the bad
    # identity data older writers left: no id (a legacy guid field becomes the
    # id, else a new one), v1 owner/partner lists (principals resolve to GUIDs,
    # placeholders dropped), acls.family (membership lives in the members
    # drawers), no flags / friendly_name (a VolumeInfo cut down to acls), and
    # members entries whose guid is not their cabinet's. Ids for every cabinet
    # are planned first, so an ACL that names a cabinet getting its id now
    # still resolves. A GUID no cabinet holds is reported, never dropped.
    # dry_run (default) only reports. Apply writes each cabinet through the
    # admin door's merge (changed keys only), then re-reads every cabinet it
    # touched; remaining lists any still not clean. A clean cabinet plans
    # nothing, so a second run writes nothing.
    - if: "{{- response is not defined and _mode == 'acl_migrate' -}}"
      then:
        - variables:
            _mg_dry: "{{- dry_run | default(true) | bool -}}"
            _mg_confirm: "{{- confirm_action | default(false) | bool -}}"
        - if: "{{- not _mg_dry and not _mg_confirm -}}"
          then:
            - variables:
                response:
                  mode: acl_migrate
                  status: error
                  message: "guarded: acl_migrate writes only with dry_run=false and confirm_action=true; run it with dry_run (the default) first to see the plan."
                  timestamp: "{{ now().isoformat() }}"
        - if: "{{- response is not defined -}}"
          then:
            - variables:
                _mg_plan: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _all = label_entities('zen_cabinet') | select('match', 'sensor[.]') | list | sort -%}
                  {%- set _scope = target_entity | default('', true) | string | trim -%}
                  {%- set _cabs = [_scope] if _scope != '' else _all -%}
                  {%- set _kata = states('sensor.zen_kata_cabinet_resolved') -%}
                  {%- set ns = namespace(idmap={}, out=[], clean=[], dangling=[], skipped=[]) -%}
                  {%- for c in _all + ([_scope] if _scope != '' and _scope not in _all else []) -%}
                    {%- set _vars = state_attr(c, 'variables') -%}
                    {%- if _vars is mapping -%}
                      {%- set _env = _vars.get('AI_Cabinet_VolumeInfo') -%}
                      {%- set _vi = _env.get('value') if _env is mapping else none -%}
                      {%- set _vi = (_vi | from_json(none)) if _vi is string else _vi -%}
                      {%- set _vi = _vi if _vi is mapping else {} -%}
                      {%- set _cur = (_vi.get('id') or '') | string | trim -%}
                      {%- set _leg = (_vi.get('guid') or '') | string | trim -%}
                      {%- set _cpid = ((CABS.volumeinfo_copies(c) | from_json).best.get('id') or '') | string | trim -%}
                      {%- set _g = _cur or ('' if _leg == 'default-guid' else _leg) or _cpid or (CABS.cabinet_guid_new_v4() | trim) -%}
                      {%- set ns.idmap = dict(ns.idmap, **{c: _g}) -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {%- set _known = ns.idmap.values() | list -%}
                  {%- for c in _cabs -%}
                    {%- set _vars = state_attr(c, 'variables') -%}
                    {%- if not (_vars is mapping) -%}
                      {%- set ns.skipped = ns.skipped + [c] -%}
                    {%- else -%}
                      {%- set _env = _vars.get('AI_Cabinet_VolumeInfo') -%}
                      {%- set _vi = _env.get('value') if _env is mapping else none -%}
                      {%- set _vi = (_vi | from_json(none)) if _vi is string else _vi -%}
                      {%- set _vi = _vi if _vi is mapping else {} -%}
                      {%- set _a = _vi.get('acls') if _vi.get('acls') is mapping else {} -%}
                      {%- set _rec = CABS.acl_record(c, ns.idmap) | from_json -%}
                      {%- set p = namespace(patch={}, unset=[], notes=[]) -%}
                      {%- if not (_env is mapping) -%}{%- set p.notes = p.notes + ['VolumeInfo missing: created'] -%}{%- endif -%}
                      {#- Stray VolumeInfo copies (writes before the key guard): a copy
                          that carries an id fills what VolumeInfo lacks when VolumeInfo
                          has no id (acls go through the conversion below); every copy
                          is removed. -#}
                      {%- set _cp = CABS.volumeinfo_copies(c) | from_json -%}
                      {%- if _cp.best and (_vi.get('id') or '') | string | trim == '' -%}
                        {%- for k, v in _cp.best.items() if k not in _vi and k not in ['acls', 'guid', 'id'] -%}
                          {%- set p.patch = dict(p.patch, **{k: v}) -%}
                        {%- endfor -%}
                        {%- set p.notes = p.notes + ['VolumeInfo fields restored from a stray copy'] -%}
                      {%- endif -%}
                      {%- if _cp['keys'] | count > 0 -%}{%- set p.notes = p.notes + ['stray VolumeInfo copies removed: ' ~ (_cp['keys'] | join(', '))] -%}{%- endif -%}
                      {%- if (_vi.get('id') or '') | string | trim == '' -%}
                        {%- set p.patch = dict(p.patch, **{'id': ns.idmap[c]}) -%}
                        {%- set p.notes = p.notes + ['id stamped' ~ (' from the legacy guid field' if ns.idmap[c] == ((_vi.get('guid') or '') | string | trim) else '')] -%}
                      {%- endif -%}
                      {%- if 'guid' in _vi -%}
                        {%- set p.unset = p.unset + ['guid'] -%}
                        {%- set p.notes = p.notes + ['legacy guid field removed'] -%}
                      {%- endif -%}
                      {%- set _is_v2 = (_a.get('v', 1) | int(1)) == 2 and (_a.keys() | list | reject('in', ['v', 'owner', 'prime', 'partners', 'ops']) | list | count) == 0 -%}
                      {%- if not _is_v2 -%}
                        {%- set p.patch = dict(p.patch, **{'acls': {'v': 2, 'owner': _rec.owner, 'prime': _rec.prime, 'partners': _rec.partners, 'ops': _rec.ops_stored}}) -%}
                        {%- set _fam = _a.get('family') if _a.get('family') is list else [] -%}
                        {%- set p.notes = p.notes + ['acls to v2' ~ ((' (acls.family dropped: ' ~ (_fam | count) ~ ')') if _fam | count > 0 else '')] -%}
                      {%- endif -%}
                      {%- for e in _rec.unresolved -%}{%- set p.notes = p.notes + ['principal with no GUID dropped: ' ~ e] -%}{%- endfor -%}
                      {%- for g in ([_rec.owner, _rec.prime] + _rec.partners) | reject('equalto', '') | list if g not in _known -%}
                        {%- set ns.dangling = ns.dangling + [{'cabinet': c, 'guid': g}] -%}
                      {%- endfor -%}
                      {%- if not (_vi.get('flags') is mapping) and not (p.patch.get('flags') is mapping) -%}
                        {%- set p.patch = dict(p.patch, **{'flags': {'gc_eligible': c == _kata, 'hidden': false, 'read_only': false, 'secure_mode': false, 'system': false}}) -%}
                        {%- set p.notes = p.notes + ['flags restored (defaults)'] -%}
                      {%- endif -%}
                      {%- if (_vi.get('friendly_name') or p.patch.get('friendly_name') or '') | string | trim == '' -%}
                        {%- set p.patch = dict(p.patch, **{'friendly_name': state_attr(c, 'friendly_name') or c}) -%}
                        {%- set p.notes = p.notes + ['friendly_name restored'] -%}
                      {%- endif -%}
                      {#- Class (#10626): the default ops row. Proposed from labels
                          here, once, for review; the gate reads only the stamp. -#}
                      {%- set _cls = (_vi.get('class') or '') | string | lower | trim -%}
                      {%- if _cls == '' -%}
                        {%- set _cls = CABS.acl_class_plan(c) | trim -%}
                        {%- if _cls != '' -%}
                          {%- set p.patch = dict(p.patch, **{'class': _cls}) -%}
                          {%- set p.notes = p.notes + ['class stamped: ' ~ _cls ~ ' (from its labels)'] -%}
                        {%- endif -%}
                      {%- endif -%}
                      {#- Kata belongs to the default agent. -#}
                      {%- set _dai = ns.idmap.get(states('sensor.zen_default_ai_user_cabinet_resolved'), '') -%}
                      {%- if _cls == 'kata' and _rec.owner == '' and _dai != '' -%}
                        {%- set _acl0 = p.patch.get('acls') if p.patch.get('acls') is mapping
                                        else {'v': 2, 'owner': _rec.owner, 'prime': _rec.prime, 'partners': _rec.partners, 'ops': _rec.ops_stored} -%}
                        {%- set p.patch = dict(p.patch, **{'acls': dict(_acl0, **{'owner': _dai})}) -%}
                        {%- set p.notes = p.notes + ['owner set to the default agent'] -%}
                      {%- endif -%}
                      {%- set _menv = _vars.get('members') -%}
                      {%- set _m = _menv.get('value') if _menv is mapping else none -%}
                      {%- set _m = (_m | from_json(none)) if _m is string else _m -%}
                      {%- set mf = namespace(m={}, n=0) -%}
                      {%- if _m is mapping -%}
                        {%- set mf.m = _m -%}
                        {%- for k in ['users', 'ai_users', 'families'] if _m.get(k) is list -%}
                          {%- set lst = namespace(l=[]) -%}
                          {%- for e in _m.get(k) -%}
                            {%- set want = ns.idmap.get(e.get('entity_id', ''), '') if e is mapping else '' -%}
                            {%- if want != '' and (e.get('guid') or '') != want -%}
                              {%- set lst.l = lst.l + [dict(e, **{'guid': want})] -%}
                              {%- set mf.n = mf.n + 1 -%}
                            {%- else -%}
                              {%- set lst.l = lst.l + [e] -%}
                            {%- endif -%}
                          {%- endfor -%}
                          {%- set mf.m = dict(mf.m, **{k: lst.l}) -%}
                        {%- endfor -%}
                      {%- endif -%}
                      {%- if mf.n > 0 -%}{%- set p.notes = p.notes + ['members entries given their cabinet GUID: ' ~ mf.n] -%}{%- endif -%}
                      {%- if p.patch or p.unset or mf.n > 0 or _cp['keys'] | count > 0 -%}
                        {%- set ns.out = ns.out + [{'cabinet': c, 'patch': p.patch, 'unset': p.unset, 'remove': _cp['keys'],
                                                    'members': (mf.m if mf.n > 0 else none), 'notes': p.notes}] -%}
                      {%- else -%}
                        {%- set ns.clean = ns.clean + [c] -%}
                      {%- endif -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{- {'changes': ns.out, 'clean': ns.clean, 'dangling': ns.dangling, 'skipped': ns.skipped, 'scanned': _cabs | count} -}}
            - if: "{{- not _mg_dry -}}"
              then:
                - repeat:
                    for_each: "{{ _mg_plan.changes }}"
                    sequence:
                      - if: "{{- repeat.item.patch | count > 0 or repeat.item.unset | count > 0 -}}"
                        then:
                          # Admin door (#10637): VolumeInfo is cabinet structure; merge
                          # lays only the changed keys over what is stored.
                          - action: script.zen_admintools_cabinet_writer
                            continue_on_error: true
                            data:
                              mode: merge
                              volume_entity: "{{- repeat.item.cabinet -}}"
                              key: AI_Cabinet_VolumeInfo
                              value: "{{- repeat.item.patch -}}"
                              unset: "{{- repeat.item.unset -}}"
                              caller: zen_dojotools_identity
                              reason: identity acl_migrate
                      - if: "{{- repeat.item.members is mapping -}}"
                        then:
                          - action: script.zen_sutra_filecabinet
                            continue_on_error: true
                            data:
                              caller_tool: zen_dojotools_identity
                              action_type: upsert
                              mode: replace
                              set_timestamp: true
                              volume_entity_id: "{{- repeat.item.cabinet -}}"
                              key: members
                              value: "{{- repeat.item.members -}}"
                      - variables:
                          _mg_cab: "{{ repeat.item.cabinet }}"
                          _mg_rm: "{{ repeat.item.remove }}"
                      - repeat:
                          for_each: "{{ _mg_rm }}"
                          sequence:
                            # Admin door: FileCabinet refuses '_' keys, the door does not.
                            - action: script.zen_admintools_cabinet_writer
                              continue_on_error: true
                              data:
                                mode: remove
                                volume_entity: "{{- _mg_cab -}}"
                                key: "{{- repeat.item -}}"
                                caller: zen_dojotools_identity
                                reason: identity acl_migrate stray VolumeInfo copy
            # Independent re-read of every cabinet the plan touched.
            - variables:
                _mg_remaining: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set ns = namespace(r=[]) -%}
                  {%- if not _mg_dry -%}
                    {%- for ch in _mg_plan.changes -%}
                      {%- set _chk = CABS.acl_schema_check(ch.cabinet) | from_json -%}
                      {%- if not _chk.ok -%}{%- set ns.r = ns.r + [{'cabinet': ch.cabinet, 'why': _chk.why}] -%}{%- endif -%}
                    {%- endfor -%}
                  {%- endif -%}
                  {{- ns.r -}}
            # A clean full run stamps the ACL schema version on the system
            # cabinet; Flynn's bootstrap skips the migration while it is current.
            # A cabinet with nothing loaded (skipped) does not hold the stamp
            # back: it is reported, and the identity schema gate or a forced
            # cabinet_schema_upgrade migrates it once it loads.
            - variables:
                _mg_stamp: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {{- not _mg_dry and (target_entity | default('', true) | string | trim) == ''
                      and _mg_remaining | count == 0
                      and not (CABS.acl_schema_is_current() | trim | bool) -}}
            - if: "{{- _mg_stamp | bool -}}"
              then:
                - action: script.zen_admintools_cabinet_writer
                  continue_on_error: true
                  data:
                    mode: set
                    volume_entity: "{{ states('sensor.zen_system_cabinet_resolved') }}"
                    key: acl_schema
                    value:
                      version: "{%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}{{ CABS.acl_schema_current() | int }}"
                      migrated: "{{ now().isoformat() }}"
                    caller: zen_dojotools_identity
                    reason: identity acl_migrate schema stamp
            - variables:
                response:
                  mode: acl_migrate
                  schema_stamped: "{{ _mg_stamp | bool }}"
                  status: "{{ 'dry_run' if _mg_dry else ('ok' if _mg_remaining | count == 0 else 'error') }}"
                  dry_run: "{{ _mg_dry }}"
                  scanned: "{{ _mg_plan.scanned }}"
                  changed: "{{ _mg_plan.changes | count }}"
                  changes: "{{ _mg_plan.changes }}"
                  clean: "{{ _mg_plan.clean }}"
                  dangling: "{{ _mg_plan.dangling }}"
                  skipped: "{{ _mg_plan.skipped }}"
                  remaining: "{{ _mg_remaining }}"
                  message: >-
                    {{ ('Plan only; nothing written. Run with dry_run=false and confirm_action=true to apply.' if _mg_dry
                        else ('Applied and verified.' if _mg_remaining | count == 0 else 'Applied; some cabinets are still not clean (see remaining).'))
                       ~ ((' Dangling GUIDs reported, not dropped: ' ~ (_mg_plan.dangling | count) ~ '.') if _mg_plan.dangling | count > 0 else '') }}
                  timestamp: "{{ now().isoformat() }}"
                  caller_token: "{{ caller_token | default('') }}"
            - if: "{{- not _mg_dry and _mg_plan.changes | count > 0 -}}"
              then:
                - event: zen_event
                  event_data:
                    event:
                      kind: identity_manifest_rebuild
                      component: zen_dojotools_identity
                      severity: info
                      summary: Manifest rebuild triggered by acl_migrate.

    # ── Step 3j-3: modes acl_set / take_ownership (#10626) ───────────────────
    # The only ACL writers besides identity's own membership writes. acl_set is
    # owner-only. take_ownership is the escape hatch: cert + a live human ack
    # on every call, the ack naming target, current and proposed ACL; it
    # rewrites only the ACL, never the value, and both are audited.
    - if: "{{- response is not defined and _mode in ['acl_set', 'take_ownership'] -}}"
      then:
        - variables:
            _ao_cab: "{{- target_entity | default('', true) | string | trim -}}"
            _ao_key: "{{- drawer_key | default('', true) | string | trim -}}"
            _ao_reason: "{{- reason | default('', true) | string | trim -}}"
            _ao_ops_in: >-
              {%- set _o = acl_ops if acl_ops is defined else {} -%}
              {%- set _o = (_o | from_json({})) if _o is string else _o -%}
              {%- set ns = namespace(o={}) -%}
              {%- for k, v in (_o if _o is mapping else {}).items() if k in ['r', 'w', 'd', 'a'] and v is mapping -%}
                {%- set ns.o = dict(ns.o, **{k: {'who': (v.get('who') if v.get('who') is list else ['*']), 'cert': (v.get('cert') or '') | string, 'ack': v.get('ack', false) | bool}}) -%}
              {%- endfor -%}
              {{- ns.o -}}
        - variables:
            _ao_err: >-
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
              {%- set _vars = state_attr(_ao_cab, 'variables') if _ao_cab else none -%}
              {%- set _slot = (CABS.cabinet_slot_status(_ao_cab) | from_json({})) if _ao_cab else {} -%}
              {%- if _ao_cab == '' -%}target_entity (the cabinet) is required
              {%- elif _slot.get('cabinet_class') == 'expansion' -%}{{ _ao_cab }} is an expansion of {{ _slot.get('hosted_by') or 'its host' }}: its ACL is the host's. Set the cabinet ACL, or a moved drawer's ACL, on {{ _slot.get('hosted_by') or 'the host' }}
              {%- elif _ao_cab not in label_entities('zen_cabinet') or not (_vars is mapping) -%}{{ _ao_cab }} is not a readable zen_cabinet
              {%- elif _ao_key != '' and _ao_key not in _vars -%}drawer {{ _ao_key }} does not exist in {{ _ao_cab }}
              {%- elif _ao_key in ['AI_Cabinet_VolumeInfo'] -%}VolumeInfo carries the cabinet ACL; omit drawer_key
              {%- elif _mode == 'acl_set' and _ao_ops_in | count == 0 -%}acl_set needs acl_ops (r, w, d or a)
              {%- elif _mode == 'take_ownership' and _ao_reason == '' -%}take_ownership needs a reason (it is shown in the live ack and audited)
              {%- endif -%}
        - if: "{{- _ao_err | trim != '' -}}"
          then:
            - variables:
                response:
                  mode: "{{ _mode }}"
                  status: error
                  code: invalid_request
                  message: "guarded: {{ _ao_err | trim }}"
                  timestamp: "{{ now().isoformat() }}"
        - variables:
            _ao_caller: >-
              {%- import 'zenos_ai/zen_identity.jinja' as ID -%}
              {{- ID.caller('zenos.identity.acl_take_ownership' if _mode == 'take_ownership' else '', 1) | from_json -}}
            _ao_rec: >-
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
              {{- CABS.acl_record(_ao_cab) | from_json -}}
            # A drawer expand_drawer moved: the pointer stays here (cabinet ACL),
            # the drawer and its own ACL are in an expansion hosted by this cabinet.
            _ao_mirror: >-
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
              {%- set t = (CABS.fc_resolve(_ao_cab, _ao_key) | from_json) if _ao_key != '' and _ao_cab != '' else {} -%}
              {%- set s = (CABS.cabinet_slot_status(t.vol) | from_json({})) if t.get('status') == 'resolved' else {} -%}
              {{- t.vol if s.get('cabinet_class') == 'expansion' and s.get('hosted_by') == _ao_cab else '' -}}
        - variables:
            _ao_dcab: "{{- _ao_mirror if _ao_mirror != '' else _ao_cab -}}"
            _ao_old: >-
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
              {%- set r = CABS.acl_record(_ao_cab) | from_json -%}
              {%- if _ao_key != '' -%}
                {%- set _env = (state_attr(_ao_mirror if _ao_mirror != '' else _ao_cab, 'variables') or {}).get(_ao_key) -%}
                {%- set _a = _env.get('acl') if _env is mapping else none -%}
                {{- {'scope': 'drawer', 'ops': ((_a.get('ops') or {}) if _a is mapping else {})} -}}
              {%- else -%}
                {{- {'scope': 'cabinet', 'owner': r.owner, 'prime': r.prime, 'partners': r.partners, 'ops': r.ops_stored} -}}
              {%- endif -%}
        - variables:
            _ao_new: >-
              {%- if _ao_key != '' -%}
                {%- set _base = {} if _mode == 'take_ownership' else _ao_old.ops -%}
                {{- {'scope': 'drawer', 'ops': dict(_base, **_ao_ops_in)} -}}
              {%- else -%}
                {{- {'scope': 'cabinet', 'owner': (_ao_caller.guid if _mode == 'take_ownership' else _ao_old.owner),
                     'prime': _ao_old.prime, 'partners': _ao_old.partners, 'ops': dict(_ao_old.ops, **_ao_ops_in)} -}}
              {%- endif -%}
            _ao_refuse: >-
              {%- if _ao_caller.policy_status != 'allowed' or _ao_caller.guid == '' -%}caller_unresolved
              {%- elif _mode == 'acl_set' and (_ao_rec.owner == '' or _ao_caller.guid != _ao_rec.owner) -%}not_owner
              {%- elif _mode == 'take_ownership' and not _ao_caller.cert_ok -%}cert_required
              {%- endif -%}
        - if: "{{- response is not defined and _ao_refuse | trim != '' -}}"
          then:
            - variables:
                response:
                  mode: "{{ _mode }}"
                  status: error
                  code: "{{ _ao_refuse | trim }}"
                  target: "{{ _ao_cab }}{{ ('/' ~ _ao_key) if _ao_key else '' }}"
                  message: >-
                    {%- set c = _ao_refuse | trim -%}
                    {%- if c == 'caller_unresolved' -%}The caller's identity did not resolve (policy {{ _ao_caller.policy_status }}); nothing was changed.
                    {%- elif c == 'not_owner' -%}acl_set is owner-only and the caller is not this ACL's owner; nothing was changed. take_ownership (cert + live ack) is the way to change an ACL you do not own.
                    {%- else -%}take_ownership needs cert zenos.identity.acl_take_ownership (request it: persona_editor mode=cert_req_grant cert_component=zenos.identity.acl_take_ownership); nothing was changed.
                    {%- endif -%}
                  timestamp: "{{ now().isoformat() }}"
        # The live ack (request_live_ack honors the console override itself).
        - if: "{{- response is not defined and _mode == 'take_ownership' -}}"
          then:
            - action: script.zen_dojotools_identity
              response_variable: _ao_ack
              continue_on_error: true
              data:
                mode: request_live_ack
                ack_message: >-
                  Your agent asks to TAKE OWNERSHIP of the ACL on {{ _ao_cab }}{{ ('/' ~ _ao_key) if _ao_key else '' }}.
                  Reason: {{ _ao_reason }}. Current: {{ _ao_old | tojson }}. Proposed: {{ _ao_new | tojson }}. Approve?
                ack_max_wait_seconds: 120
            - if: "{{- not (_ao_ack is mapping and _ao_ack.get('approved', false) | bool) -}}"
              then:
                - variables:
                    response:
                      mode: take_ownership
                      status: error
                      code: "{{ 'ack_declined' if (_ao_ack is mapping and _ao_ack.get('reason', '') == 'declined') else 'ack_not_approved' }}"
                      target: "{{ _ao_cab }}{{ ('/' ~ _ao_key) if _ao_key else '' }}"
                      ack: "{{ _ao_ack if _ao_ack is mapping else {} }}"
                      message: "No live human approval; nothing was changed."
                      timestamp: "{{ now().isoformat() }}"
        - variables:
            _ao_approver: >-
              {%- import 'zenos_ai/zen_identity.jinja' as ID -%}
              {%- if _mode != 'take_ownership' -%}owner
              {%- elif ID.console_override() | trim == 'true' -%}console_bypass
              {%- else -%}live_ack
              {%- endif -%}
        - if: "{{- response is not defined -}}"
          then:
            # Admin door (#10637): the cabinet ACL lives in VolumeInfo (merge, acls
            # only); a drawer's own ACL rides on a set with its value sent back unchanged.
            - action: script.zen_admintools_cabinet_writer
              response_variable: _ao_w
              continue_on_error: true
              data:
                mode: "{{- 'merge' if _ao_key == '' else 'set' -}}"
                volume_entity: "{{- _ao_dcab if _ao_key != '' else _ao_cab -}}"
                key: "{{- 'AI_Cabinet_VolumeInfo' if _ao_key == '' else _ao_key -}}"
                value: >-
                  {{- {'acls': {'v': 2, 'owner': _ao_new.owner, 'prime': _ao_new.prime, 'partners': _ao_new.partners, 'ops': _ao_new.ops}}
                      if _ao_key == '' else ((state_attr(_ao_dcab, 'variables') or {}).get(_ao_key) or {}).get('value') -}}
                acl: "{{- {'ops': _ao_new.ops} if _ao_key != '' else none -}}"
                caller: zen_dojotools_identity
                reason: "identity {{ _mode }}: {{ _ao_reason }}"
            - variables:
                _ao_ok: "{{- _ao_w is mapping and _ao_w.get('status') == 'success' -}}"
                _ao_kind: "{{- 'acl_ownership_taken' if _mode == 'take_ownership' else 'acl_changed' -}}"
            - event: zen_event
              event_data:
                event:
                  timestamp: "{{ now().isoformat() }}"
                  component: zen_dojotools_identity
                  severity: "{{ 'warning' if _mode == 'take_ownership' else 'info' }}"
                  kind: "{{ _ao_kind }}"
                  summary: "{{ _mode }} {{ _ao_cab }}{{ ('/' ~ _ao_key) if _ao_key else '' }} ({{ 'written' if _ao_ok else 'write failed' }}): {{ _ao_reason }}"
                  metadata:
                    target: "{{ _ao_cab }}{{ ('/' ~ _ao_key) if _ao_key else '' }}"
                    caller_guid: "{{ _ao_caller.guid }}"
                    reason: "{{ _ao_reason }}"
                    old_acl: "{{ _ao_old }}"
                    new_acl: "{{ _ao_new }}"
                    approver: "{{ _ao_approver }}"
                    written: "{{ _ao_ok }}"
                    expansion_copy: "{{ _ao_mirror }}"
            - action: system_log.write
              data:
                level: warning
                logger: zen_dojotools_identity
                message: "{{ _ao_kind }} target={{ _ao_cab }}{{ ('/' ~ _ao_key) if _ao_key else '' }} written={{ _ao_ok }} approver={{ _ao_approver }} reason={{ _ao_reason }} old={{ _ao_old | tojson }} new={{ _ao_new | tojson }}"
            - variables:
                response:
                  mode: "{{ _mode }}"
                  status: "{{ 'ok' if _ao_ok else 'error' }}"
                  target: "{{ _ao_cab }}{{ ('/' ~ _ao_key) if _ao_key else '' }}"
                  old_acl: "{{ _ao_old }}"
                  new_acl: "{{ _ao_new }}"
                  approver: "{{ _ao_approver }}"
                  expansion_copy: "{{ _ao_mirror }}"
                  message: "{{ 'ACL written and audited.' if _ao_ok else 'The admin door did not confirm the ACL write.' }}"
                  timestamp: "{{ now().isoformat() }}"

    # ── Step 3k: mode = membership ───────────────────────────────────────────
    # Tree view for containers; reverse lookup for members.
    # Reads VolumeInfo + members drawer from state_attr (template-time, no async).
    # Depth-2 tree: household → families (depth 1) → sub-families (depth 2).
    - if: "{{- response is not defined and _mode == 'membership' -}}"
      then:
            - variables:
                # Determine root: family_entity > member_entity > default household
                _root_entity: >-
                  {%- if family_entity | trim != '' -%}
                    {{- family_entity | trim -}}
                  {%- elif member_entity | trim != '' -%}
                    {{- member_entity | trim -}}
                  {%- else -%}
                    {{- _hh_target -}}
                  {%- endif -%}
                _hh_default: "{{- _hh_target -}}"
            - variables:
                _root_vi_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _vi = CABS.cabinet_drawer_value(_root_entity, 'AI_Cabinet_VolumeInfo', {}) | from_json() -%}
                  {{- _vi | tojson -}}
                _root_members_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _m = CABS.cabinet_drawer_value(_root_entity, 'members', {}) | from_json() -%}
                  {{- _m | tojson -}}
                # @todo - need to modify CABS.cabinet_drawer_value() so it can take a list of keys and return the first one that exists
                _root_profile_raw: >-
                  {%- set _v = state_attr(_root_entity, 'variables') | default({}, true) -%}
                  {%- set _v = _v if _v is mapping else {} -%}
                  {%- set _p = _v.get('_household_profile', _v.get('household_profile', _v.get('_family_profile', _v.get('family_profile', {})))) -%}
                  {%- set _p = _p.get('value', _p) if _p is mapping else {} -%}
                  {%- set _p = _p | from_json if _p is string else _p -%}
                  {{- _p | tojson -}}
            - variables:
                _root_vi: "{{- _root_vi_raw | from_json if _root_vi_raw is string else (_root_vi_raw if _root_vi_raw is mapping else {}) -}}"
                _root_members: "{{- _root_members_raw | from_json if _root_members_raw is string else (_root_members_raw if _root_members_raw is mapping else {}) -}}"
                _root_cab_type: >-
                  {%- set _vi = _root_vi_raw | from_json if _root_vi_raw is string else _root_vi_raw -%}
                  {%- set _vi = _vi if _vi is mapping else {} -%}
                  {{- _vi.get('cab_type', '') -}}
                _root_is_container: >-
                  {%- set _vi = _root_vi_raw | from_json if _root_vi_raw is string else _root_vi_raw -%}
                  {%- set _vi = _vi if _vi is mapping else {} -%}
                  {%- set _ct = _vi.get('cab_type', '') -%}
                  {{- _ct in ['household', 'family'] or 'members' in (state_attr(_root_entity, 'variables') | default({}, true)) -}}
            - choose:
                # ── container tree ────────────────────────────────────────────
                - conditions: "{{- _root_is_container | bool -}}"
                  sequence:
                    - variables:
                        _tree: >-
                          {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                          {%- set _vi = _root_vi_raw | from_json if _root_vi_raw is string else _root_vi_raw -%}
                          {%- set _vi = _vi if _vi is mapping else {} -%}
                          {%- set _m = _root_members_raw | from_json if _root_members_raw is string else _root_members_raw -%}
                          {%- set _m = _m if _m is mapping else {} -%}
                          {%- set _hp = _root_profile_raw | from_json if _root_profile_raw is string else _root_profile_raw -%}
                          {%- set _hp = _hp if _hp is mapping else {} -%}
                          {%- import 'zenos_ai/zen_identity.jinja' as ID -%}
                          {%- set _pr = ID.principals(_root_entity) | from_json -%}
                          {# depth-1 families with their members #}
                          {%- set _ns = namespace(fams=[]) -%}{# FG-25: namespace required for list mutation inside for-loop #}
                          {%- for fam in _m.get('families', []) -%}
                            {%- set _fc_entity_id = fam.get('entity_id', '') -%}
                            {%- set _fvi = CABS.cabinet_drawer_value(_fc_entity_id, 'AI_Cabinet_VolumeInfo', {}) | from_json() -%}
                            {%- set _fm = CABS.cabinet_drawer_value(_fc_entity_id, 'members', {}) | from_json() -%}

                            {%- set _fpr = ID.principals(_fc_entity_id) | from_json -%}
                            {# depth-2 sub-families (members only, no further recursion) #}
                            {%- set _nsf = namespace(subfams=[]) -%}{# FG-25: namespace required for list mutation inside for-loop #}
                            {%- for sf in _fm.get('families', []) -%}
                              {%- set _sf_entity_id = sf.get('entity_id', '') -%}
                              {%- set _sfvi = CABS.cabinet_drawer_value(_sf_entity_id, 'AI_Cabinet_VolumeInfo', {}) | from_json() -%}
                              {%- set _sfm = CABS.cabinet_drawer_value(_sf_entity_id, 'members', {}) | from_json() -%}

                              {%- set _nsf.subfams = _nsf.subfams + [{
                                'entity_id': _sf_entity_id,
                                'guid': _sfvi.get('id', _sfvi.get('guid', '')),
                                'name': sf.get('name', _sfvi.get('friendly_name', _sfvi.get('name', _sf_entity_id))),
                                'depth': 2,
                                'members': {
                                  'users': _sfm.get('users', []),
                                  'ai_users': _sfm.get('ai_users', [])
                                }
                              }] -%}
                            {%- endfor -%}
                            {%- set _ns.fams = _ns.fams + [{
                              'entity_id': _fc_entity_id,
                              'guid': _fvi.get('id', _fvi.get('guid', '')),
                              'name': fam.get('name', _fvi.get('friendly_name', _fvi.get('name', _fc_entity_id))),
                              'depth': fam.get('depth', 1),
                              'principals': _fpr,
                              'members': {
                                'users': _fm.get('users', []),
                                'ai_users': _fm.get('ai_users', []),
                                'families': _nsf.subfams
                              }
                            }] -%}
                          {%- endfor -%}
                          {{
                            {
                              'entity_id': _root_entity,
                              'guid': _vi.get('id', _vi.get('guid', '')),
                              'name': _hp.get('friendly_name', _hp.get('name', _vi.get('friendly_name', _vi.get('name', _root_entity)))),
                              'cab_type': _vi.get('cab_type', ''),
                              'principals': _pr,
                              'members': {
                                'users': _m.get('users', []),
                                'ai_users': _m.get('ai_users', []),
                                'families': _ns.fams
                              }
                            } | tojson
                          }}
                    - variables:
                        # @todo - weird - returning a dict where one of the values are JSON encoded strings (i.e. _tree)
                        response: >
                          {{-
                            {
                              'mode':             'membership',
                              'view':             'tree',
                              'root_entity':      _root_entity,
                              'tree':             _tree,
                              'timestamp':        now().isoformat(),
                              'caller_token':     caller_token | default('')
                            }
                          -}}

                # ── member reverse-lookup ─────────────────────────────────────
                - conditions: "{{- not _root_is_container | bool -}}"
                  sequence:
                    - variables:
                        # Scan the default household and its families for this member
                        _lookup_root: "{{- _hh_default -}}"
                        _target_eid: "{{- _root_entity -}}"
                    - variables:
                        # One walk of the household tree, shared with resolve (zen_identity.jinja)
                        _memberships: >-
                          {%- import 'zenos_ai/zen_identity.jinja' as ID -%}
                          {{- ID.memberships_of(ID.member_index(_lookup_root), _target_eid) -}}
                    - variables:
                        response: >
                          {{-
                            {
                              'mode':          'membership',
                              'view':          'member_lookup',
                              'member_entity': _root_entity,
                              'memberships':   (_memberships | from_json([]) if _memberships is string else _memberships),
                              'timestamp':     now().isoformat(),
                              'caller_token':  caller_token | default('')
                            }
                          -}}

    # ── Step 3l: mode = is_member ─────────────────────────────────────────────
    - if: "{{- response is not defined and _mode == 'is_member' -}}"
      then:
        - if: "{{- member_entity == '' or family_entity == '' -}}"
          then:
            - variables:
                response: >
                  {{-
                    {
                      'mode':    'is_member',
                      'status':  'error',
                      'message': 'member_entity (subject) and family_entity (container) are both required.',
                      'timestamp': now().isoformat()
                    }
                  -}}
        - if: "{{- response is not defined -}}"
          then:
            - variables:
                _container_m_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _m = CABS.cabinet_drawer_value(family_entity, 'members', {}) | from_json() -%}
                  {{- _m | tojson -}}
            - variables:
                _check: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _m = _container_m_raw | from_json if _container_m_raw is string else _container_m_raw -%}
                  {%- set _m = _m if _m is mapping else {} -%}
                  {%- set _eid = member_entity -%}
                  {%- set _all_direct = _m.get('users', []) + _m.get('ai_users', []) -%}
                  {%- set _d1 = _all_direct | selectattr('entity_id', 'equalto', _eid) | list | count > 0 -%}
                  {%- if _d1 -%}
                    {{- {'is_member': true, 'depth': 1} | tojson -}}
                  {%- else -%}
                    {%- set _found_d2 = false -%}
                    {%- for fam in _m.get('families', []) -%}
                      {%- if not _found_d2 -%}
                        {%- set _fc_entity_id = fam.get('entity_id', '') -%}
                        {%- set _fm = CABS.cabinet_drawer_value(_fc_entity_id, 'members', {}) | from_json() -%}
                        {%- set _d2_all = _fm.get('users', []) + _fm.get('ai_users', []) -%}
                        {%- set _in_d2 = _d2_all | selectattr('entity_id', 'equalto', _eid) | list | count > 0 -%}
                        {%- if _in_d2 -%}
                          {%- set _found_d2 = true -%}
                        {%- endif -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {%- if _found_d2 -%}
                      {{- {'is_member': true, 'depth': 2} | tojson -}}
                    {%- else -%}
                      {{- {'is_member': false, 'depth': none} | tojson -}}
                    {%- endif -%}
                  {%- endif -%}
            - variables:
                _r: "{{- _check if _check is mapping else (_check | from_json if _check is string else {'is_member': false, 'depth': none}) -}}"
            - variables:
                response: >
                  {{-
                    {
                      'mode':             'is_member',
                      'member_entity':    member_entity,
                      'container_entity': family_entity,
                      'is_member':        _r.get('is_member', false),
                      'depth':            _r.get('depth', none),
                      'timestamp':        now().isoformat(),
                      'caller_token':     caller_token | default('')
                    }
                  -}}

    # ── Step 3m: mode = provision_member ─────────────────────────────────────
    # Full orchestration: scan expansion slots → provision → family_add_member
    # → manifest rebuild. Handles the complete new-member lifecycle in one call.
    - if: "{{- response is not defined and _mode == 'provision_member' -}}"
      then:
            # Resolve effective family and validate member_name
            - variables:
                _pm_name: "{{- member_name | default('') | trim -}}"
                _pm_payload_raw: "{{- profile_payload | default('') | trim -}}"
                _pm_mtype: "{{- member_type | default('user') | lower | trim -}}"
                _pm_fam: >-
                  {%- set _f = family_entity | default('') | trim -%}
                  {%- if _f != '' -%}
                    {{- _f -}}
                  {%- else -%}
                    {{- states('sensor.zen_default_family_cabinet_resolved') -}}
                  {%- endif -%}

            # Gate: member_name required
            - if: "{{- _pm_name == '' -}}"
              then:
                - variables:
                    response: >
                      {{-
                        {
                          'mode':      'provision_member',
                          'status':    'error',
                          'message':   'member_name is required for provision_member.',
                          'timestamp': now().isoformat()
                        }
                      -}}
    - if: "{{- response is not defined and _mode == 'provision_member' -}}"
      then:

            # Gate: family entity must resolve
            - if: "{{- _pm_fam == '' or _pm_fam == 'unknown' -}}"
              then:
                - variables:
                    response: >
                      {{-
                        {
                          'mode':      'provision_member',
                          'status':    'error',
                          'message':   'family_entity could not be resolved. Provide family_entity or ensure zen_default_family_cabinet_resolved is set.',
                          'timestamp': now().isoformat()
                        }
                      -}}
    - if: "{{- response is not defined and _mode == 'provision_member' -}}"
      then:

            # Scan expansion slots for first available init slot
            - variables:
                _pm_slot: >-
                  {#- One free-slot rule for every tool: slots and their status come from
                      zenos_cabinets.jinja (cabinet_slot_candidates / cabinet_slot_status).
                      The provisioner initializes the slot, so ready is not required. -#}
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set ns = namespace(v='') -%}
                  {%- for s in CABS.cabinet_slot_candidates() | from_json([]) -%}
                    {%- if ns.v == '' and (CABS.cabinet_slot_status(s) | from_json({})).get('free', false) -%}
                      {%- set ns.v = s -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{- ns.v -}}

            # Gate: no available slot
            - if: "{{- _pm_slot == '' -}}"
              then:
                - variables:
                    response: >
                      {{-
                        {
                          'mode':      'provision_member',
                          'status':    'error',
                          'message':   'No free slot: every member/expansion cabinet is in use or reserved. Deprovision a member cabinet before adding a new one.',
                          'timestamp': now().isoformat()
                        }
                      -}}
    - if: "{{- response is not defined and _mode == 'provision_member' -}}"
      then:

            # Build profile payload: merge member_name as preferred_name + name
            - variables:
                _pm_profile: >-
                  {#- HA hands profile_payload over already parsed when it looks like
                      JSON, so accept a mapping as well as a JSON string. -#}
                  {%- set _base = _pm_payload_raw if _pm_payload_raw is mapping else (_pm_payload_raw | from_json({}) if (_pm_payload_raw is string and _pm_payload_raw != '') else {}) -%}
                  {%- set _base = _base if _base is mapping else {} -%}
                  {{- dict(_base, **{'preferred_name': _pm_name, 'name': _pm_name}) | tojson -}}
                _pm_person: >-
                  {%- set _b = _pm_payload_raw if _pm_payload_raw is mapping else (_pm_payload_raw | from_json({}) if (_pm_payload_raw is string and _pm_payload_raw != '') else {}) -%}
                  {%- set _b = _b if _b is mapping else {} -%}
                  {%- set _p = (_b.get('person_entity_id') or _b.get('person_entity') or '') | string | trim -%}
                  {{- _p if _p.startswith('person.') else '' -}}
                _pm_cab_type: "{{- _pm_mtype if _pm_mtype in ['user', 'ai_user', 'family'] else 'user' -}}"

            # Provision the expansion slot (auto-stamps init → online_unmounted → mounts)
            - action: script.zen_dojotools_provisioner
              data:
                mode: provision
                cab_type: "{{- _pm_cab_type -}}"
                target_cabinet: "{{- _pm_slot -}}"
                profile_payload: "{{- _pm_profile -}}"
                person_entity: "{{- _pm_person -}}"
                caller_token: "{{- caller_token | default('') -}}"
              response_variable: _pm_prov_result

            # Gate: provisioner must succeed
            - variables:
                _pm_prov_result: >-
                  {%- set _r = _pm_prov_result if _pm_prov_result is mapping else (_pm_prov_result | from_json if _pm_prov_result is string else {}) -%}
                  {{- _r.get('result', _r) -}}
            - variables:
                _pm_prov_ok: >-
                  {%- set _r = _pm_prov_result if _pm_prov_result is mapping else {} -%}
                  {{- (_r.get('status', '') == 'success') | bool -}}
                _pm_prov_msg: >-
                  {%- set _r = _pm_prov_result if _pm_prov_result is mapping else {} -%}
                  {{- _r.get('message', 'Provisioner returned unknown error.') -}}
            - if: "{{- not (_pm_prov_ok | bool) -}}"
              then:
                - variables:
                    response: >
                      {{-
                        {
                          'mode':               'provision_member',
                          'status':             'error',
                          'message':            'Provisioner failed: ' ~ _pm_prov_msg,
                          'slot':               _pm_slot,
                          'provisioner_result': _pm_prov_result,
                          'timestamp':          now().isoformat()
                        }
                      -}}
    - if: "{{- response is not defined and _mode == 'provision_member' -}}"
      then:

            # Wire the new cabinet into the target family
            - action: script.zen_dojotools_identity
              data:
                mode: family_add_member
                force_action: "{{ force_action | default(false) | bool }}"
                family_entity: "{{- _pm_fam -}}"
                member_entity: "{{- _pm_slot -}}"
                member_type: "{{- _pm_cab_type -}}"
                user_entity_id: "{{- _pm_person -}}"
                household_entity: "{{- _hh_target -}}"
                caller_token: "{{- caller_token | default('') -}}"
              response_variable: _pm_fam_result

            - variables:
                _pm_fam_ok: >-
                  {%- set _r = _pm_fam_result if _pm_fam_result is mapping else (_pm_fam_result | from_json if _pm_fam_result is string else {}) -%}
                  {{- (_r.get('status', '') in ['ok', 'already_member']) | bool -}}
                _pm_fam_msg: >-
                  {%- set _r = _pm_fam_result if _pm_fam_result is mapping else (_pm_fam_result | from_json if _pm_fam_result is string else {}) -%}
                  {{- _r.get('message', 'family_add_member returned unknown status.') -}}
            - variables:
                response: >
                  {{-
                    {
                      'mode':               'provision_member',
                      'status':             'ok' if (_pm_fam_ok | bool) else 'partial',
                      'member_name':        _pm_name,
                      'member_entity':      _pm_slot,
                      'member_type':        _pm_cab_type,
                      'family_entity':      _pm_fam,
                      'provisioner_result': _pm_prov_result,
                      'family_result':      _pm_fam_result,
                      'warning':            none if (_pm_fam_ok | bool) else ('family_add_member failed: ' ~ _pm_fam_msg),
                      'timestamp':          now().isoformat(),
                      'caller_token':       caller_token | default('')
                    }
                  -}}

    # ── Step 3b: mode = resolve (default) ──────────────────────────────────
    # Pre-compute: extract cabinet entity, error state, reverse-lookup flag
    - variables:
        _r3b_entity: >-
          {%- set _c = cab | from_json if cab is string else cab -%}
          {%- set _c = _c if _c is mapping else {} -%}
          {%- set _eid = _c.get('identity', {}).get('cabinet', '') | trim -%}
          {%- set _norm = normalized | default('') | string | lower | trim -%}
          {# Group-type labels collide with AI cabinet membership labels (ai_user cabinet may
             carry 'household' label as membership, not as group identity). Re-resolve excluding
             ai_user cabinets when the target is a group-type label. #}
          {%- if _eid != '' and 'ai_user' in labels(_eid) and _norm in ['household', 'family_group'] -%}
            {{- label_entities(_norm) | select('in', label_entities('zen_cabinet')) | reject('in', label_entities('ai_user')) | list | first | default('') -}}
          {%- else -%}
            {{- _eid -}}
          {%- endif -%}
        _r3b_cab_error: >-
          {%- set _c = cab | from_json if cab is string else cab -%}
          {%- set _c = _c if _c is mapping else {} -%}
          {{- _c.get('error', '') -}}
        _r3b_is_reverse: >-
          {%- set _c = cab | from_json if cab is string else cab -%}
          {%- set _c = _c if _c is mapping else {} -%}
          {%- set _has_err = _c.get('error', '') in ['not_found', 'empty_input'] -%}
          {%- set _norm = normalized | string | trim -%}
          {%- set _is_plain = _norm not in ['', 'None', "''"] and '.' not in _norm -%}
          {{- (_has_err and _is_plain) | bool -}}
    # Pre-compute: this cabinet's rows in the household tree (who it is to the
    # identity data: name, person, type, and every container it belongs to)
    - variables:
        _r3b_rows: >-
          {%- import 'zenos_ai/zen_identity.jinja' as ID -%}
          {%- if _r3b_entity == '' -%}{{- [] | tojson -}}
          {%- else -%}
            {{- ID.member_index() | from_json([]) | selectattr('entity_id', 'equalto', _r3b_entity) | list | tojson -}}
          {%- endif -%}
    - variables:
        _r3b_memberships: >-
          {%- import 'zenos_ai/zen_identity.jinja' as ID -%}
          {{- ID.memberships_of(_r3b_rows, _r3b_entity) -}}
    # Pre-compute: entity type flags (step 1b — depend on _r3b_entity, can't be siblings)
    - variables:
        _r3b_is_ai: >-
          {%- set _rows = _r3b_rows | from_json([]) if _r3b_rows is string else _r3b_rows -%}
          {{- (_r3b_entity != '' and ('ai_user' in labels(_r3b_entity)
               or 'ai_user' in (_rows | map(attribute='member_type') | list))) | bool -}}
        _r3b_is_group: >-
          {{- (_r3b_entity != '' and
               ('household' in labels(_r3b_entity) or
                'family_group' in labels(_r3b_entity))) | bool -}}
        _r3b_group_type: >-
          {%- if _r3b_entity != '' and 'household' in labels(_r3b_entity) -%}household
          {%- elif _r3b_entity != '' and 'family_group' in labels(_r3b_entity) -%}family_group
          {%- else -%}{%- endif -%}
    # Early exit: ai_user cabinet → persona slice
    - choose:
        - conditions: "{{- response is not defined and (_r3b_is_ai | bool) -}}"
          sequence:
            - variables:
                _ai_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set ent = _r3b_entity | trim -%}
                  {%- set _e = CABS.cabinet_drawer_value(ent, 'zenai_essence', {}) | from_json() -%}
                  {%- set _e = _e.get('value', _e) if _e is mapping and 'value' in _e else _e -%}
                  {{- (_e if _e is mapping else {}) | tojson -}}
            - variables:
                response: >-
                  {%- set _e = _ai_raw | from_json if _ai_raw is string else _ai_raw -%}
                  {%- set _e = _e if _e is mapping else {} -%}
                  {%- set _id = _e.get('identity', {}) -%}
                  {%- set _jk = _e.get('jacket', {}) -%}
                  {{
                    {
                      'result':           'ok',
                      'is_person':        false,
                      'is_group':         false,
                      'is_ai':            true,
                      'cabinet':          _r3b_entity,
                      'persona_name':     _id.get('name', ''),
                      'pronouns':         _id.get('pronouns', ''),
                      'motif':            _id.get('motif', ''),
                      'primary_user':     _id.get('primary_user', ''),
                      'familiarity_level': _jk.get('familiarity_level', 'acquainted'),
                      'memberships':      (_r3b_memberships | from_json([]) if _r3b_memberships is string else _r3b_memberships),
                      'target_normalized': normalized,
                      'timestamp':        now().isoformat(),
                      'caller_token':     caller_token | default('')
                    }
                  }}
    # Early exit: group cabinet (household / family_group) → group slice
    - choose:
        - conditions: "{{- response is not defined and (_r3b_is_group | bool) -}}"
          sequence:
            - variables:
                _grp_raw: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set ent = _r3b_entity | trim -%}
                  {%- set _key = '_household_profile' if _r3b_group_type == 'household' else '_family_profile' -%}
                  {%- set _g = CABS.cabinet_drawer_value(ent, _key, {}) | from_json() -%}
                  {%- set _g = _g.get('value', _g) if _g is mapping and 'value' in _g else _g -%}
                  {{- (_g if _g is mapping else {}) | tojson -}}
            - variables:
                response: >-
                  {%- set _g = _grp_raw | from_json if _grp_raw is string else _grp_raw -%}
                  {%- set _g = _g if _g is mapping else {} -%}
                  {%- if _r3b_group_type == 'household' -%}
                    {%- set _members = label_entities('user') | select('in', label_entities('zen_cabinet')) | list -%}
                    {%- set _fgroups = label_entities('family_group') | select('in', label_entities('zen_cabinet')) | list -%}
                    {{
                      {
                        'result':               'ok',
                        'is_person':            false,
                        'is_group':             true,
                        'is_ai':                false,
                        'group_type':           'household',
                        'cabinet':              _r3b_entity,
                        'household_name':       _g.get('household_name', ''),
                        'timezone':             _g.get('timezone', ''),
                        'address': {
                          'street':  _g.get('address', ''),
                          'city':    _g.get('city', ''),
                          'state':   _g.get('state', ''),
                          'zip':     _g.get('zip', ''),
                          'country': _g.get('country', '')
                        },
                        'member_cabinets':      _members,
                        'family_group_cabinets': _fgroups,
                        'memberships':          (_r3b_memberships | from_json([]) if _r3b_memberships is string else _r3b_memberships),
                        'home_mode':            states(label_entities('zen_home_mode') | select('match', '(sensor|input_select)\\.') | list | first | default('', true)),
                        'quiet_hours_active':   is_state(label_entities('zen_quiet_hours') | select('match', 'binary_sensor\\.') | list | first | default('none', true), 'on'),
                        'target_normalized':    normalized,
                        'timestamp':            now().isoformat(),
                        'caller_token':         caller_token | default('')
                      }
                    }}
                  {%- else -%}
                    {%- set _members = label_entities(normalized) | select('in', label_entities('zen_cabinet')) | reject('in', label_entities('ai_user')) | list -%}
                    {{
                      {
                        'result':            'ok',
                        'is_person':         false,
                        'is_group':          true,
                        'is_ai':             false,
                        'group_type':        'family_group',
                        'cabinet':           _r3b_entity,
                        'family_name':       _g.get('family_name', _g.get('name', '')),
                        'relationship_type': _g.get('relationship_type', ''),
                        'member_cabinets':   _members,
                        'memberships':       (_r3b_memberships | from_json([]) if _r3b_memberships is string else _r3b_memberships),
                        'target_normalized': normalized,
                        'timestamp':         now().isoformat(),
                        'caller_token':      caller_token | default('')
                      }
                    }}
                  {%- endif -%}
    # Pre-compute: spaces block and area labels from resolved cabinet
    - variables:
        _r3b_spaces: >-
          {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
          {%- set ent = _r3b_entity | trim -%}
          {%- if ent == '' -%}
            {{- {} | tojson -}}
          {%- else -%}
            {%- set _up = CABS.cabinet_drawer_value(ent, '_user_profile', {}) | from_json() -%}
            {%- set _fp = CABS.cabinet_drawer_value(ent, '_family_profile', {}) | from_json() -%}
            {%- set _p = _up if (_up is mapping and _up | length > 0) else (_fp if _fp is mapping else {}) -%}
            {{- _p.get('spaces', {}) | tojson -}}
          {%- endif -%}
        _r3b_area_labels: >-
          {%- set ent = _r3b_entity | trim -%}
          {%- if ent == '' -%}
            {{- [] | tojson -}}
          {%- else -%}
            {#- Only real HA areas: data-routing labels (medical, context, ...) never surface in who. -#}
            {{- (labels(ent) | default([]) | select('in', areas()) | list) | tojson -}}
          {%- endif -%}
    # Pre-compute: reverse area residents (populated only when is_reverse=true)
    - variables:
        _r3b_reverse_residents: >-
          {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
          {%- if not (_r3b_is_reverse | bool) -%}
            {{- [] | tojson -}}
          {%- else -%}
            {%- set _norm = normalized | string | trim -%}
            {%- set _ai_cabs = label_entities('ai_user') | list -%}
            {%- set _area_cabs = label_entities(_norm)
                | select('match', '^sensor\\.')
                | select('in', label_entities('zen_cabinet'))
                | reject('in', _ai_cabs)
                | list -%}
            {%- set ns = namespace(residents=[]) -%}
            {%- for ent in _area_cabs[:10] -%}
              {%- set _up = CABS.cabinet_drawer_value(ent, '_user_profile', {}) | from_json() -%}
              {%- set _fp = CABS.cabinet_drawer_value(ent, '_family_profile', {}) | from_json() -%}
              {%- set _p = _up if (_up is mapping and _up | length > 0) else (_fp if _fp is mapping else {}) -%}
              {%- set _sp = _p.get('spaces', {}) if _p is mapping else {} -%}
              {%- set _nm = _p.get('preferred_name', _p.get('name', '')) if _p is mapping else '' -%}
              {%- set _ro = _p.get('role', '') if _p is mapping else '' -%}
              {%- set _tr = _p.get('tracking', {}) if _p is mapping else {} -%}
              {%- set _zone_ok = _tr.get('gps_zone', false) | bool -%}
              {%- set _area_lbls = labels(ent) | reject('match', '^zen_') | reject('equalto', 'ai_user') | list -%}
              {%- set ns2 = namespace(person_eid='') -%}
              {%- for lbl in _area_lbls if ns2.person_eid == '' -%}
                {%- set _pe = label_entities(lbl) | select('match', '^person\\.') | list | first | default('') -%}
                {%- if _pe != '' -%}{%- set ns2.person_eid = _pe -%}{%- endif -%}
              {%- endfor -%}
              {%- set _zone = states(ns2.person_eid) if _zone_ok and ns2.person_eid != '' else ('consent_required' if ns2.person_eid != '' else none) -%}
              {%- set ns.residents = ns.residents + [{'entity_id': ent, 'name': _nm, 'role': _ro, 'spaces': _sp, 'person_entity': ns2.person_eid if ns2.person_eid != '' else none, 'zone': _zone}] -%}
            {%- endfor -%}
            {{- ns.residents | tojson -}}
          {%- endif -%}
    # Pre-compute: tracking consent + primary_mobile entity ID + person entity from profile
    - variables:
        _r3b_person_entity: >-
          {%- set ent = _r3b_entity | trim -%}
          {%- if ent == '' -%}{{- '' -}}
          {%- else -%}
            {%- set _cab_labels = labels(ent) | reject('match', '^zen_') | reject('equalto', 'ai_user') | list -%}
            {%- set ns = namespace(person_eid='') -%}
            {%- for lbl in _cab_labels if ns.person_eid == '' -%}
              {%- set _pe = label_entities(lbl) | select('match', '^person\\.') | list | first | default('') -%}
              {%- if _pe != '' -%}{%- set ns.person_eid = _pe -%}{%- endif -%}
            {%- endfor -%}
            {%- if ns.person_eid == '' -%}
              {%- set _rows = _r3b_rows | from_json([]) if _r3b_rows is string else _r3b_rows -%}
              {%- set ns.person_eid = _rows | map(attribute='person_entity') | reject('equalto', '') | first | default('') -%}
            {%- endif -%}
            {{- ns.person_eid -}}
          {%- endif -%}
        _r3b_name: >-
          {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
          {%- set ent = _r3b_entity | trim -%}
          {%- if ent == '' -%}{{- '' -}}
          {%- else -%}
            {%- set _up = CABS.cabinet_drawer_value(ent, '_user_profile', {}) | from_json({}) -%}
            {%- set _fp = CABS.cabinet_drawer_value(ent, '_family_profile', {}) | from_json({}) -%}
            {%- set _p = _up if (_up is mapping and _up | length > 0) else (_fp if _fp is mapping else {}) -%}
            {%- set _rows = _r3b_rows | from_json([]) if _r3b_rows is string else _r3b_rows -%}
            {{- (_p.get('preferred_name', _p.get('name', '')) | trim)
                or (_rows | map(attribute='name') | reject('equalto', '') | first | default(''))
                or ent -}}
          {%- endif -%}
        _r3b_member_type: >-
          {%- set _rows = _r3b_rows | from_json([]) if _r3b_rows is string else _r3b_rows -%}
          {{- _rows | map(attribute='member_type') | first | default('') -}}
        _r3b_tracking: >-
          {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
          {%- set ent = _r3b_entity | trim -%}
          {%- if ent == '' -%}{{- {} | tojson -}}
          {%- else -%}
            {%- set _up = CABS.cabinet_drawer_value(ent, '_user_profile', {}) | from_json() -%}
            {%- set _fp = CABS.cabinet_drawer_value(ent, '_family_profile', {}) | from_json() -%}
            {%- set _p = _up if (_up is mapping and _up | length > 0) else (_fp if _fp is mapping else {}) -%}
            {{- _p.get('tracking', {}) | tojson -}}
          {%- endif -%}
        _r3b_primary_mobile: >-
          {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
          {%- set ent = _r3b_entity | trim -%}
          {%- if ent == '' -%}{{- '' -}}
          {%- else -%}
            {%- set _cab_labels = labels(ent) | reject('match', '^zen_') | reject('equalto', 'ai_user') | list -%}
            {%- set ns = namespace(tracker='') -%}
            {%- for lbl in _cab_labels if ns.tracker == '' -%}
              {%- set _pe = label_entities(lbl) | select('match', '^person\\.') | list | first | default('') -%}
              {%- if _pe != '' -%}
                {%- set _src = state_attr(_pe, 'source') | default('') -%}
                {%- if _src != '' -%}{%- set ns.tracker = _src -%}{%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {%- if ns.tracker == '' -%}
              {%- set _up = CABS.cabinet_drawer_value(ent, '_user_profile', {}) | from_json() -%}
              {%- set _fp = CABS.cabinet_drawer_value(ent, '_family_profile', {}) | from_json() -%}
              {%- set _p = _up if (_up is mapping and _up | length > 0) else (_fp if _fp is mapping else {}) -%}
              {%- set ns.tracker = _p.get('primary_mobile', '') | trim -%}
            {%- endif -%}
            {{- ns.tracker -}}
          {%- endif -%}
    # Pre-compute: mobile block — chase device_id → device_entities → filter by label then domain
    - variables:
        _r3b_mobile: >-
          {%- set _mob = _r3b_primary_mobile | trim -%}
          {%- set _tr = _r3b_tracking | from_json if _r3b_tracking is string else _r3b_tracking -%}
          {%- set _tr = _tr if _tr is mapping else {} -%}
          {%- if _mob == '' -%}
            {{- {'configured': false} | tojson -}}
          {%- else -%}
            {%- set _dev = device_id(_mob) | default('') -%}
            {%- if _dev == '' -%}
              {{- {'configured': true, 'entity_id': _mob, 'error': 'device_id not found'} | tojson -}}
            {%- else -%}
              {%- set _ents = device_entities(_dev) | list -%}
              {%- set ns = namespace(battery='', activity='', wifi='', geocoded='', sensors=[], binary_sensors=[]) -%}
              {%- for e in _ents -%}
                {%- set _lbls = labels(e) | list -%}
                {%- set _dom = e.split('.')[0] -%}
                {%- if 'mobile_battery' in _lbls or (ns.battery == '' and 'battery' in e and 'level' in e) -%}
                  {%- set ns.battery = e -%}
                {%- endif -%}
                {%- if 'mobile_activity' in _lbls or (ns.activity == '' and 'activity' in e and _dom == 'sensor') -%}
                  {%- set ns.activity = e -%}
                {%- endif -%}
                {%- if 'mobile_wifi' in _lbls or (ns.wifi == '' and ('ssid' in e or 'wifi_connection' in e) and _dom == 'sensor') -%}
                  {%- set ns.wifi = e -%}
                {%- endif -%}
                {%- if 'mobile_geocoded' in _lbls or (ns.geocoded == '' and 'geocoded' in e and _dom == 'sensor') -%}
                  {%- set ns.geocoded = e -%}
                {%- endif -%}
                {%- if _dom == 'sensor' -%}{%- set ns.sensors = ns.sensors + [e] -%}
                {%- elif _dom == 'binary_sensor' -%}{%- set ns.binary_sensors = ns.binary_sensors + [e] -%}
                {%- endif -%}
              {%- endfor -%}
              {%- set _zone_ok = _tr.get('gps_zone', false) | bool -%}
              {%- set _gps_ok  = _tr.get('gps_full',  false) | bool -%}
              {%- set _mob_d = {
                'configured':       true,
                'entity_id':        _mob,
                'device_id':        _dev,
                'zone':             states(_mob) if _zone_ok else 'consent_required',
                'battery':          states(ns.battery) | default(none) if ns.battery != '' else none,
                'battery_entity':   ns.battery if ns.battery != '' else none,
                'activity':         states(ns.activity) | default(none) if ns.activity != '' else none,
                'activity_entity':  ns.activity if ns.activity != '' else none,
                'wifi_ssid':        states(ns.wifi) | default(none) if ns.wifi != '' else none,
                'wifi_entity':      ns.wifi if ns.wifi != '' else none,
                'geocoded_entity':  ns.geocoded if ns.geocoded != '' else none,
                'all_entities':     _ents,
                'sensors':          ns.sensors,
                'binary_sensors':   ns.binary_sensors
              } -%}
              {%- if _gps_ok -%}
                {%- set _mob_d = _mob_d | combine({
                  'latitude':     state_attr(_mob, 'latitude'),
                  'longitude':    state_attr(_mob, 'longitude'),
                  'gps_accuracy': state_attr(_mob, 'gps_accuracy')
                }) -%}
              {%- endif -%}
              {{- _mob_d | tojson -}}
            {%- endif -%}
          {%- endif -%}
    # Pre-compute: presence block — person zone + device area (consent-gated)
    - variables:
        _r3b_presence: >-
          {%- set _tr = _r3b_tracking | from_json if _r3b_tracking is string else _r3b_tracking -%}
          {%- set _tr = _tr if _tr is mapping else {} -%}
          {%- set _zone_ok = _tr.get('gps_zone', false) | bool -%}
          {%- set _room_ok = _tr.get('room', false) | bool -%}
          {%- set _eid = _r3b_person_entity | default('') | trim -%}
          {%- set _zone = states(_eid) if _zone_ok and _eid != '' else ('consent_required' if _eid != '' else none) -%}
          {%- set _mob = _r3b_mobile | from_json if _r3b_mobile is string else _r3b_mobile -%}
          {%- set _mob = _mob if _mob is mapping else {} -%}
          {%- set _dev = _mob.get('device_id', '') | default('') -%}
          {%- set _raw_area = area_id(_dev) | default(none) if _dev not in ['', none] else none -%}
          {%- set _area_id = _raw_area if _room_ok else ('consent_required' if _raw_area is not none else none) -%}
          {%- set _area_name = area_name(_area_id) | default('') if _room_ok and _area_id is not none else '' -%}
          {{- {
            'person_entity': _eid if _eid != '' else none,
            'zone':          _zone,
            'at_home':       (states(_eid) == 'home') if _zone_ok and _eid != '' else none,
            'area_id':       _area_id,
            'area_name':     _area_name
          } | tojson -}}
    # Branch: reverse area lookup (label had no owner cabinet → find residents by area label)
    - choose:
        - conditions: "{{- response is not defined and (_r3b_is_reverse | bool) -}}"
          sequence:
            - variables:
                response: >
                  {{-
                    {
                      'result':            'area_residents',
                      'is_person':         false,
                      'is_group':          false,
                      'is_ai':             false,
                      'area_label':        normalized,
                      'area_residents':    _r3b_reverse_residents | from_json if _r3b_reverse_residents is string else _r3b_reverse_residents,
                      'target_normalized': normalized,
                      'timestamp':         now().isoformat(),
                      'caller_token':      caller_token | default('')
                    }
                  -}}
    - if: "{{- response is not defined -}}"
      then:
        - variables:
            response: >
              {{-
                {
                  'result':           cab,
                  'is_person':        not (_r3b_is_ai | bool) and not (_r3b_is_group | bool),
                  'is_group':         _r3b_is_group | bool,
                  'is_ai':            _r3b_is_ai | bool,
                  'cabinet':          _r3b_entity,
                  'name':             _r3b_name,
                  'member_type':      _r3b_member_type,
                  'person_entity':    _r3b_person_entity | default('') | trim,
                  'memberships':      (_r3b_memberships | from_json([]) if _r3b_memberships is string else _r3b_memberships),
                  'target_normalized': normalized,
                  'spaces':      _r3b_spaces      | from_json if _r3b_spaces      is string else _r3b_spaces,
                  'area_labels': _r3b_area_labels  | from_json if _r3b_area_labels  is string else _r3b_area_labels,
                  'tracking':    _r3b_tracking     | from_json if _r3b_tracking     is string else _r3b_tracking,
                  'mobile':      _r3b_mobile       | from_json if _r3b_mobile       is string else _r3b_mobile,
                  'presence':    _r3b_presence     | from_json if _r3b_presence     is string else _r3b_presence,
                  'timestamp':        now().isoformat(),
                  'caller_token':     caller_token | default('')
                }
              -}}

    # ═══════════════════════════════════════════════════════════════════════
    # SINGLE EXIT — every mode above sets response and falls through; this is
    # the only stop point in the whole script (cadillac SESE,
    # dojotools_locks.yaml is the reference shape — one stop per SCRIPT,
    # not one per mode.)
    # ═══════════════════════════════════════════════════════════════════════
    - stop: identity response
      response_variable: response
