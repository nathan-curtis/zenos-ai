###############################################################################
# ZenOS-AI DojoTools: Print Shop
# Version: 0.4.0-experimental
# v0.4.0: read-only 3D printer support (Bambu Lab, through the installed
#   ha-bambulab integration). printers now lists 3D printers with a kind
#   (epson_ipp, fdm_bambu, fdm_octoprint) and whether control is available.
#   status for a 3D printer (printer_entity = its 'Print status' sensor from
#   mode=printers) returns a digest: state, stage, progress, remaining time,
#   layers, temperatures, job, nozzle, AMS trays and humidity, alarms (HMS and
#   print error), door, SD card, firmware, connection, control and camera.
#   New mode readiness: device checks plus the human checks a sensor cannot
#   make (clear build plate, someone watching). Control is reported from the
#   printer's own sensors and fails closed; nothing here sends a command to a
#   3D printer. OctoPrint printers are listed only.
# v0.3.0: status merges every source a printer has. The IPP sensors give the
#   job state, the paper reason (paper_empty) and the ink markers with the
#   printer's own low-level threshold (ink_low); the epson_workforce sensors of
#   the same physical printer, matched by device model, add the maintenance
#   level and page counters and fill any ink color IPP does not report. No
#   entity names are hardcoded, so a second printer works the same
#   way as the first. printer_ip now comes from the printer's own IPP address.
#   The default printer is the first 'printer'-labeled sensor that is a printer
#   (has an IPP uri), not just the first labeled sensor. New read-only mode
#   printers lists every IPP printer with its area, labels and sensor count.
# v0.2.2: HA naming (2026.11): name outputs carry entity_name and device_name
#   next to the legacy friendly_name (kept while HA still sets it), and
#   composed names are built from those parts, so they survive HA dropping
#   friendly_name. entity_name() is used only where HA has it (2026.4+).
# v0.2.1: each cert this tool declares gets a short plain description for
#   the approval prompt (the old text moves to detail) and its real max_level.
# v0.2.0: onboarding gate (zen_os_1 entry_gate). An agent without
#   zenos.agent.basic gets help and tool_manifest; anything else (a bare call
#   is status) answers onboarding_required with next_step zen_flynn_oobe.
#
# v0.1.1: default printer resolved by 'printer' label when epson_entity not configured;
#   literal printer entity fallback removed.
#
# EXPERIMENTAL — print path via Rudd-O homeassistant-ipp-printing HACS integration.
# If test_page does not produce output, this path is abandoned.
#
# Scripts:
#   zen_dojotools_print_shop  — print jobs + printer maintenance (v0.2.0-experimental)
#
# Prerequisites (manual setup before use):
#   1. Install HA native IPP integration (Settings → Integrations → IPP):
#        Points at printer directly (e.g. 192.0.2.10:631/ipp/print) or CUPS queue.
#        Creates sensor e.g. sensor.epson_wf_7840_series — note this entity_id.
#      Repeat for each additional household printer — each gets its own IPP entry.
#   2. Install Rudd-O via HACS: Rudd-O/homeassistant-ipp-printing
#      (single confirm-only config step — no printer config in Rudd-O itself)
#   3. Expose the IPP sensor via Settings → Voice Assistants.
#   4. Run mode=configure with epson_ip + epson_entity to seed system cabinet.
#
# Modes:
#   configure    — write print_shop cabinet drawer (epson_ip + epson_entity)
#   test_page    — print a timestamped plain-text test page
#   print_text   — print arbitrary text (content field)
#   status       — printer state, paper, ink, maintenance (reads HA entity state, no IPP call)
#   printers     — list every IPP printer with area, labels and sensor count
#   list_jobs    — all jobs (complete + incomplete) via IPP
#   clean        — trigger head cleaning cycle via printer HTTP maintenance UI
#   nozzle_check — trigger nozzle check via printer HTTP maintenance UI
#   help         — field reference + examples
#
# Known limitations (v0.1):
#   - PDF / binary file printing NOT supported (base64 file encoding not feasible
#     from Jinja2 templates — requires a future bridge layer)
#   - clean/nozzle_check URLs are best-guess Epson WF-7840 embedded web server
#     paths — validate on first run and adjust if needed
#   - clean/nozzle_check use the single epson_ip in the print_shop cabinet
#
###############################################################################

rest_command:
  epson_print_clean:
    url: >-
      {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
      {%- set _cab = CABS.cabinet_id_from_slot('default_ai_user') -%}
      {%- set _vars = CABS.cabinet_variables(_cab) | from_json -%}
      {%- set _d = _vars.get('print_shop', {}) | default({}, true) -%}
      {%- set _ps = _d.get('value', _d) if _d is mapping else {} -%}
      http://{{ _ps.get('epson_ip', '') }}/PRESENTATION/HTML/TOP/CLEANING.HTML
    method: POST
    headers:
      Content-Type: "application/x-www-form-urlencoded"

  epson_print_nozzle:
    url: >-
      {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
      {%- set _cab = CABS.cabinet_id_from_slot('default_ai_user') -%}
      {%- set _vars = CABS.cabinet_variables(_cab) | from_json -%}
      {%- set _d = _vars.get('print_shop', {}) | default({}, true) -%}
      {%- set _ps = _d.get('value', _d) if _d is mapping else {} -%}
      http://{{ _ps.get('epson_ip', '') }}/PRESENTATION/HTML/TOP/NOZZLECHECK.HTML
    method: POST
    headers:
      Content-Type: "application/x-www-form-urlencoded"

script:
  zen_dojotools_print_shop:
    alias: Zen DojoTools Print Shop
    description: >-
      Printer control (experimental): submit text/image print jobs and
      trigger maintenance on household printers via IPP. PDF/binary not
      supported. Actuating modes need zenos.media.print_control cert level
      1. CALL mode=help FIRST for the full mode reference, field list, and
      examples: do not guess at fields from this description.
      Aliases: ['Zen DojoTools Print Shop', 'Print Shop']
    fields:
      mode:
        name: Mode
        description: "Operation mode"
        required: true
        selector:
          select:
            options:
              - configure
              - test_page
              - print_text
              - print_image
              - status
              - printers
              - readiness
              - list_jobs
              - clean
              - nozzle_check
              - help
              - tool_manifest
      epson_ip:
        name: Epson IP Address
        description: "LAN IP of the WF-7840 (mode=configure only)"
        required: false
        selector:
          text:
      epson_entity:
        name: Epson IPP Entity
        description: "entity_id of IPP sensor (mode=configure only, e.g. sensor.epson_wf_7840_series)"
        required: false
        selector:
          text:
      content:
        name: Content
        description: "Text to print (mode=print_text only)"
        required: false
        selector:
          text:
            multiline: true
      job_filter:
        name: Job Filter
        description: "all | incomplete | complete (mode=list_jobs only, default: all)"
        required: false
        selector:
          select:
            options:
              - all
              - incomplete
              - complete
      printer_entity:
        name: Printer Entity
        description: "entity_id of IPP sensor. Defaults to print_shop cabinet value."
        required: false
        selector:
          text:
      paper_size:
        name: Paper Size
        description: "IPP media name (mode=configure only, default: na_letter_8.5x11in)"
        required: false
        selector:
          text:
      orientation:
        name: Orientation
        description: "portrait | landscape (default: portrait)"
        required: false
        selector:
          select:
            options:
              - portrait
              - landscape
              - reverse-portrait
              - reverse-landscape
      slot:
        name: Image Slot
        description: "Generated image slot to print (mode=print_image only)"
        required: false
        selector:
          select:
            options:
              - canvas
              - portrait
              - wallpaper
              - id_pic
              - dashboard_snap
              - home_state
    mode: parallel
    sequence:

    - if: "{{ (mode | default('') | lower) == 'tool_manifest' }}"
      then:
      - variables:
          final_response:
            mode: tool_manifest
            result: ok
            status: ok
            tool: zen_dojotools_print_shop
            display_name: Print Shop
            version: 0.4.0-experimental
            tier: dojotools
            required_labels: ['dojotools']
            optional_labels: ['printer']
            health:
              configured: true
              status: ok
              notes: []
            summary: >-
              Printer control: submit text print jobs and trigger maintenance
              on household printers via IPP. Experimental — PDF/binary not supported.
            preferred_state:
              required_labels: ['dojotools']
              optional_labels: ['printer']
              setup_steps: ['mode=configure with epson_ip + epson_entity to seed print_shop cabinet']
            certs_required:
              - cert: zenos.media.print_control
                display_name: Print Control
                description: Print and run printer maintenance
                detail: >-
                  Physical printer actuation (configure/test_page/print_text/
                  print_image/clean/nozzle_check) via zen_dojotools_print_shop
                  — consumes real paper/ink.
                max_level: 1
                gates: ['mode=configure/test_page/print_text/print_image/clean/nozzle_check (cert only)']
                grant_via: "persona_editor mode=cert_req_grant cert_component=zenos.media.print_control (or zen_dojotools_identity mode=cert_list to see current status)"
            caller_token: "{{ caller_token | default('') }}"

    - variables:
        _mode: "{{ mode | default('status') | lower }}"
        _orient: "{{ orientation | default('', true) }}"
    - variables:
        _ps: >-
          {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
          {%- set _cab = CABS.cabinet_id_from_slot('default_ai_user') -%}
          {%- set _vars = CABS.cabinet_variables(_cab) | from_json -%}
          {%- set _d = _vars.get('print_shop', {}) | default({}, true) -%}
          {{ (_d.get('value', _d) if _d is mapping else {}) | default({}, true) }}
    - variables:
        # An explicit printer_entity wins, then the cabinet's entity, then the
        # first 'printer'-labeled sensor that is a printer itself (it has an IPP
        # uri), so an ink or uptime sensor carrying the label is never chosen.
        _printer_entity: >-
          {%- if (printer_entity | default('', true)) != '' -%}
            {{ printer_entity }}
          {%- elif _ps.get('epson_entity') -%}
            {{ _ps.get('epson_entity') }}
          {%- else -%}
            {%- set ns = namespace(p='') -%}
            {%- for e in label_entities('printer') | select('match', 'sensor\\.') | list -%}
              {%- if ns.p == '' and state_attr(e, 'uri_supported') is not none -%}
                {%- set ns.p = e -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.p }}
          {%- endif -%}
        _content: "{{ content | default('') }}"
        _ts: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
        _final_orient: "{{ _orient if _orient != '' else _ps.get('orientation', 'portrait') }}"
    # Printer kind: a printer entity that belongs to the Bambu Lab integration
    # is a 3D printer (read-only adapter, see mode=status / readiness); anything
    # else is the paper (IPP) path this tool always had.
    - variables:
        _pe_in: "{{ printer_entity | default('', true) }}"
    - variables:
        _kind: >-
          {%- if _pe_in != '' and _pe_in in integration_entities('bambu_lab') -%}fdm_bambu
          {%- elif _pe_in != '' and _pe_in in integration_entities('octoprint') -%}fdm_octoprint
          {%- else -%}epson_ipp{%- endif -%}
    # Read-only digest of a Bambu Lab printer, built from its own entities
    # (found by device and entity name, no entity ids hardcoded). Control is
    # reported from the printer's own sensors and fails closed: anything
    # unknown or unavailable reads as read-only.
    - variables:
        _bl_json: >-
          {%- if _kind != 'fdm_bambu' or _mode not in ['status', 'readiness'] -%}
            {}
          {%- else -%}
            {%- set pe = _pe_in -%}
            {%- set dev = device_id(pe) -%}
            {%- set pdev = ((device_attr(dev, 'name') or '') | lower) -%}
            {%- set want = {
              'print status': 'state', 'current stage': 'stage', 'print progress': 'progress_pct',
              'remaining time': 'remaining_h', 'chamber temperature': 'chamber_c',
              'bed temperature': 'bed_c', 'bed target temperature': 'bed_target_c', 'target bed temperature': 'bed_target_c',
              'nozzle temperature': 'nozzle_c', 'nozzle target temperature': 'nozzle_target_c',
              'task name': 'task', 'gcode filename': 'file', 'current layer': 'layer',
              'total layer count': 'layers', 'print weight': 'est_weight_g', 'print length': 'est_length_m',
              'online': 'online', 'door': 'door_open', 'sd card status': 'sd_card',
              'extruder filament': 'extruder_filament', 'hms errors': 'hms_problem',
              'print error': 'print_error', 'firmware': 'firmware_update',
              'developer lan mode': 'developer_lan_mode', 'mqtt encryption': 'mqtt_encryption',
              'hybrid mqtt control blocked': 'hybrid_blocked', 'mqtt connection mode': 'connection_mode',
              'nozzle size': 'nozzle_mm', 'nozzle type': 'nozzle_type', 'active tray': 'active_tray',
              'speed profile': 'speed_profile', 'total usage': 'total_usage_h', 'external spool': 'external_spool'
            } -%}
            {%- set ns = namespace(v={}, cam='', hms=0) -%}
            {%- for e in (device_entities(dev) if dev else []) -%}
              {%- set n = ((entity_name(e) if entity_name is defined else '') or '') | lower | trim -%}
              {%- if n in want -%}
                {%- set ns.v = ns.v | combine({want[n]: states(e)}) -%}
                {%- if n == 'hms errors' -%}
                  {%- set ns.hms = state_attr(e, 'Count') | int(0) -%}
                {%- endif -%}
              {%- elif n == 'camera' and e.startswith('camera.') -%}
                {%- set ns.cam = e -%}
              {%- endif -%}
            {%- endfor -%}
            {%- set ams = namespace(trays=[], hum={}) -%}
            {%- for e in integration_entities('bambu_lab') -%}
              {%- set d = device_id(e) -%}
              {%- if d and d != dev and ((device_attr(d, 'name') or '') | lower).startswith(pdev ~ '_ams') -%}
                {%- set n = ((entity_name(e) if entity_name is defined else '') or '') | lower | trim -%}
                {%- set an = ((device_attr(d, 'name') or '') | lower) | replace(pdev ~ '_', '') -%}
                {%- if n.startswith('tray ') -%}
                  {%- set rm = state_attr(e, 'remain') -%}
                  {%- set ams.trays = ams.trays + [{
                    'ams': an, 'slot': state_attr(e, 'slot'), 'filament': states(e),
                    'type': state_attr(e, 'type'), 'color': state_attr(e, 'color'),
                    'remaining_pct': (rm if (rm is number and rm >= 0) else none),
                    'active': state_attr(e, 'active'), 'empty': state_attr(e, 'empty'),
                    'unknown': state_attr(e, 'unknown') == true
                  }] -%}
                {%- elif n == 'humidity index' -%}
                  {%- set ams.hum = ams.hum | combine({an: states(e) | int(none)}) -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {%- set v = ns.v -%}
            {%- set enc = v.get('mqtt_encryption') -%}
            {%- set dl = v.get('developer_lan_mode') -%}
            {%- set hy = v.get('hybrid_blocked') -%}
            {%- set known = enc in ['on', 'off'] and dl in ['on', 'off'] and hy in ['on', 'off'] -%}
            {%- set ctrl = known and (enc == 'off' or dl == 'on') and hy == 'off' -%}
            {%- set reason = '' if ctrl else (
              'Control state is unknown (a sensor is missing or unavailable), so this printer is treated as read-only.' if not known else (
              'MQTT encryption is on and Developer LAN mode is off, so Home Assistant can only read this printer.' if (enc == 'on' and dl != 'on') else
              'The printer connection mode blocks control from Home Assistant.')) -%}
            {%- set st = v.get('state') -%}
            {# A slot the printer cannot identify (type "?") is not counted as loaded. #}
            {%- set filled = ams.trays | rejectattr('empty') | rejectattr('unknown') | list | length -%}
            {%- set cam_state = states(ns.cam) if ns.cam != '' else 'none' -%}
            {%- set checks = [
              {'check': 'online', 'ok': v.get('online') == 'on', 'detail': v.get('online')},
              {'check': 'idle_or_finished', 'ok': st in ['idle', 'finish'], 'detail': st},
              {'check': 'no_hardware_alarms', 'ok': v.get('hms_problem') == 'off', 'detail': (ns.hms | string) ~ ' HMS errors'},
              {'check': 'no_print_error', 'ok': v.get('print_error') == 'off', 'detail': v.get('print_error')},
              {'check': 'door_closed', 'ok': v.get('door_open') == 'off', 'detail': v.get('door_open')},
              {'check': 'sd_card', 'ok': v.get('sd_card') == 'normal', 'detail': v.get('sd_card')},
              {'check': 'filament_available', 'ok': (filled > 0 or v.get('extruder_filament') == 'on'), 'detail': (filled | string) ~ ' of ' ~ (ams.trays | length | string) ~ ' AMS slots loaded and identified'},
              {'check': 'camera', 'ok': cam_state not in ['none', 'unavailable', 'unknown'], 'detail': cam_state}
            ] -%}
            {%- set ready = checks | rejectattr('ok') | list | length == 0 -%}
            {{ {
              'digest': {
                'printer_state': st,
                'stage': v.get('stage'),
                'progress_pct': v.get('progress_pct') | float(0),
                'remaining_minutes': ((v.get('remaining_h') | float(0)) * 60) | round(0) | int,
                'layer': (v.get('layer') | string) ~ '/' ~ (v.get('layers') | string),
                'temperatures_c': {
                  'nozzle': v.get('nozzle_c') | float(none), 'nozzle_target': v.get('nozzle_target_c') | float(none),
                  'bed': v.get('bed_c') | float(none), 'bed_target': v.get('bed_target_c') | float(none),
                  'chamber': v.get('chamber_c') | float(none)
                },
                'job': {
                  'task': v.get('task'), 'file': v.get('file'),
                  'estimated_weight_g': v.get('est_weight_g') | float(none),
                  'estimated_length_m': v.get('est_length_m') | float(none)
                },
                'nozzle': {'size_mm': v.get('nozzle_mm') | float(none), 'type': v.get('nozzle_type')},
                'filament': {
                  'active_tray': v.get('active_tray'), 'extruder_has_filament': v.get('extruder_filament') == 'on',
                  'external_spool': v.get('external_spool'), 'ams_trays': ams.trays, 'ams_humidity_index': ams.hum
                },
                'alarms': {'hms_problem': v.get('hms_problem') == 'on', 'hms_count': ns.hms, 'print_error': v.get('print_error') == 'on'},
                'door_closed': v.get('door_open') == 'off',
                'sd_card': v.get('sd_card'),
                'firmware_update_available': v.get('firmware_update') == 'on',
                'total_print_hours': v.get('total_usage_h') | float(none),
                'connection': {'mode': v.get('connection_mode'), 'developer_lan_mode': dl, 'mqtt_encryption': enc, 'hybrid_blocked': hy},
                'control': {'available': ctrl, 'reason': reason},
                'camera': cam_state,
                'name': device_attr(dev, 'name'),
                'model': device_attr(dev, 'model')
              },
              'readiness': {
                'ready_for_a_job': ready,
                'checks': checks,
                'control_available': ctrl,
                'control_reason': reason,
                'can_start_remotely': ready and ctrl,
                'human_checks_always_needed': [
                  'The build plate is clear and the right plate is installed.',
                  'Someone can watch the print and stop it.',
                  'The loaded filament matches the job.'
                ]
              }
            } | tojson }}
          {%- endif -%}
    - variables:
        _bl: "{{ _bl_json | from_json({}) }}"
    - variables:
        _img_w: "{{ 800 if _final_orient in ['portrait', 'reverse-portrait'] else 1200 }}"
        _img_h: "{{ 1200 if _final_orient in ['portrait', 'reverse-portrait'] else 800 }}"
        _text_w: "{{ 740 if _final_orient in ['portrait', 'reverse-portrait'] else 1140 }}"
        _text_h: "{{ 1140 if _final_orient in ['portrait', 'reverse-portrait'] else 740 }}"

    # Onboarding gate (zen_os_1 entry_gate): an agent without
    # zenos.agent.basic gets help and tool_manifest only. Calls no user
    # started pass.
    - variables:
        _ps_gate: >-
          {%- import 'zenos_ai/zen_os_1.jinja' as OS -%}
          {{ OS.entry_gate((context.user_id if context is defined else '') or '', 'zen_dojotools_print_shop', (_mode or 'status')) | from_json({'pass': false, 'reason': 'guarded: the onboarding gate could not be read'}) }}
    - if: "{{ final_response is not defined and not _ps_gate.get('pass', false) }}"
      then:
        - variables:
            final_response:
              status: error
              mode: "{{ (_mode or 'status') }}"
              reason: "{{ _ps_gate.reason }}"
              next_step: "{{ _ps_gate.next_step }}"
              caller_token: "{{ caller_token | default('') }}"
        - action: system_log.write
          data:
            level: warning
            logger: zen_entry_gate
            message: "{{ _ps_gate.get('log') or 'onboarding gate refused a call (gate result unreadable)' }}"
    # zenos.media.print_control cert gate. All 6 actuating modes
    # (configure writes the cabinet drawer; the other 5 consume real
    # paper/ink or hit the printer directly) require it. status/list_jobs/
    # help/tool_manifest are read-only and stay open.
    - if: >-
        {{ final_response is not defined and _mode in
           ['configure', 'test_page', 'print_text', 'print_image', 'clean', 'nozzle_check'] }}
      then:
      - action: script.zen_dojotools_identity
        response_variable: _ps_id_raw
        continue_on_error: true
        data:
          mode: resolve_caller_identity
          required_cert: zenos.media.print_control
          required_cert_level: 1
          caller_token: "{{ caller_token | default('') }}"
      - variables:
          _ps_id_fields: >-
            {%- import 'zenos_ai/zen_os_1.jinja' as OS -%}
            {%- set _raw = OS.resolve_identity_fields(_ps_id_raw) -%}
            {{- (_raw | from_json) if _raw is string else _raw -}}
          _ps_authorized: "{{ _ps_id_fields.authorized }}"
          _ps_cert_level: "{{ _ps_id_fields.cert_level }}"
          _ps_policy_status: "{{ _ps_id_fields.policy_status }}"
      - if: "{{ final_response is not defined and not _ps_authorized }}"
        then:
          - variables:
              final_response:
                status: error
                error: cert_insufficient
                message: >-
                  zenos.media.print_control cert level {{ _ps_cert_level }} is below
                  the required minimum (1) for mode={{ _mode }}.
                can_request: "{{ _ps_policy_status == 'allowed' }}"
                request_via:
                  tool: zen_dojotools_persona_editor
                  mode: cert_req_grant
                  cert_component: zenos.media.print_control
                  cert_level: 1
                caller_token: "{{ caller_token | default('') }}"

    - if: "{{ final_response is not defined }}"
      then:
      - choose:

        # ── configure ────────────────────────────────────────────────────────────
        - conditions:
            - condition: template
              value_template: "{{ _mode == 'configure' }}"
          sequence:
            - variables:
                _ps_new: >-
                  {{
                    _ps | combine({
                      'epson_ip':     epson_ip     | default(_ps.get('epson_ip', ''),                   true),
                      'epson_entity': epson_entity | default(_ps.get('epson_entity', ''),               true),
                      'paper_size':   paper_size   | default(_ps.get('paper_size',   'na_letter_8.5x11in'), true),
                      'orientation':  orientation  | default(_ps.get('orientation',  'portrait'),           true),
                    })
                  }}
            - service: script.zen_dojotools_filecabinet
              data:
                action_type: create
                force_action: true
                set_timestamp: true
                show_hidden_volumes: false
                volume_entity_id:
                  - "{{ states('sensor.zen_default_ai_user_cabinet_resolved') }}"
                key: print_shop
                value: "{{ _ps_new }}"
            - variables:
                final_response:
                  status: ok
                  mode: configure
                  print_shop: "{{ _ps_new }}"
                  message: "print_shop drawer written to AI user cabinet."

        # ── test_page ────────────────────────────────────────────────────────────
        # simpleimageraster.draw renders text → JPEG, then ipp_printing.print sends it.
        - conditions:
            - condition: template
              value_template: "{{ _mode == 'test_page' }}"
          sequence:
            - variables:
                _raster_result: {}
                _print_result: {}
            - service: simpleimageraster.draw
              data:
                payload:
                  - type: new_multiline
                    x: 30
                    y: 30
                    size: 60
                    spacing: 30
                    width: "{{ _text_w }}"
                    height: "{{ _text_h }}"
                    fit: true
                    font: rbm.ttf
                    value: >-
                      ZenOS Print Shop Test
                      Printer: {{ ((([device_name(_printer_entity) if device_id(_printer_entity) else '', entity_name(_printer_entity)] | select | unique | join(' ')) if entity_name is defined else '') or (state_attr(_printer_entity, 'friendly_name') | default(_printer_entity))) }}
                      State  : {{ states(_printer_entity) }}
                      Time   : {{ _ts }}
                width: "{{ _img_w }}"
                height: "{{ _img_h }}"
                mimetype: image/jpeg
              response_variable: _raster_result
            - service: ipp_printing.print
              target:
                entity_id: "{{ _printer_entity }}"
              data:
                data: "{{ _raster_result.image.data }}"
                mimetype: "{{ _raster_result.image.mimetype }}"
                paper_size: "{{ _ps.get('paper_size', 'na_letter_8.5x11in') }}"
                orientation: "{{ _final_orient }}"
              response_variable: _print_result
            - variables:
                final_response:
                  status: "{{ 'ok' if _print_result is mapping and 'job' in _print_result else 'error' }}"
                  mode: test_page
                  printer_entity: "{{ _printer_entity }}"
                  job: "{{ _print_result.get('job', {}) if _print_result is mapping else {} }}"
                  error: "{{ _print_result if _print_result is string else '' }}"

        # ── print_text ───────────────────────────────────────────────────────────
        # simpleimageraster.draw renders content text → JPEG, then ipp_printing.print sends it.
        - conditions:
            - condition: template
              value_template: "{{ _mode == 'print_text' }}"
          sequence:
            - variables:
                _raster_result: {}
                _print_result: {}
            - service: simpleimageraster.draw
              data:
                payload:
                  - type: new_multiline
                    x: 30
                    y: 30
                    size: 60
                    spacing: 30
                    width: "{{ _text_w }}"
                    height: "{{ _text_h }}"
                    fit: true
                    font: rbm.ttf
                    value: "{{ _content }}"
                width: "{{ _img_w }}"
                height: "{{ _img_h }}"
                mimetype: image/jpeg
              response_variable: _raster_result
            - service: ipp_printing.print
              target:
                entity_id: "{{ _printer_entity }}"
              data:
                data: "{{ _raster_result.image.data }}"
                mimetype: "{{ _raster_result.image.mimetype }}"
                paper_size: "{{ _ps.get('paper_size', 'na_letter_8.5x11in') }}"
                orientation: "{{ _final_orient }}"
              response_variable: _print_result
              continue_on_error: true
            - variables:
                final_response:
                  status: "{{ 'ok' if _print_result is mapping and 'job' in _print_result else 'error' }}"
                  mode: print_text
                  printer_entity: "{{ _printer_entity }}"
                  job: "{{ _print_result.get('job', {}) if _print_result is mapping else {} }}"
                  error: "{{ _print_result if _print_result is string else '' }}"

        # ── status / readiness: 3D printer (Bambu Lab, read-only) ────────────────
        # Pass printer_entity = the printer's 'Print status' sensor, as listed by
        # mode=printers. Everything is read from the printer's own entities.
        # Control is reported (control.available / reason), never used here.
        - conditions:
            - condition: template
              value_template: "{{ _mode == 'status' and _kind == 'fdm_bambu' }}"
          sequence:
            - variables:
                final_response:
                  status: ok
                  mode: status
                  kind: fdm_bambu
                  printer_entity: "{{ _pe_in }}"
                  name: "{{ _bl.digest.name }}"
                  model: "{{ _bl.digest.model }}"
                  printer_state: "{{ _bl.digest.printer_state }}"
                  stage: "{{ _bl.digest.stage }}"
                  progress_pct: "{{ _bl.digest.progress_pct }}"
                  remaining_minutes: "{{ _bl.digest.remaining_minutes }}"
                  layer: "{{ _bl.digest.layer }}"
                  temperatures_c: "{{ _bl.digest.temperatures_c }}"
                  job: "{{ _bl.digest.job }}"
                  nozzle: "{{ _bl.digest.nozzle }}"
                  filament: "{{ _bl.digest.filament }}"
                  alarms: "{{ _bl.digest.alarms }}"
                  door_closed: "{{ _bl.digest.door_closed }}"
                  sd_card: "{{ _bl.digest.sd_card }}"
                  firmware_update_available: "{{ _bl.digest.firmware_update_available }}"
                  total_print_hours: "{{ _bl.digest.total_print_hours }}"
                  connection: "{{ _bl.digest.connection }}"
                  control: "{{ _bl.digest.control }}"
                  camera: "{{ _bl.digest.camera }}"

        - conditions:
            - condition: template
              value_template: "{{ _mode == 'readiness' and _kind == 'fdm_bambu' }}"
          sequence:
            - variables:
                final_response:
                  status: ok
                  mode: readiness
                  kind: fdm_bambu
                  printer_entity: "{{ _pe_in }}"
                  ready_for_a_job: "{{ _bl.readiness.ready_for_a_job }}"
                  checks: "{{ _bl.readiness.checks }}"
                  control_available: "{{ _bl.readiness.control_available }}"
                  control_reason: "{{ _bl.readiness.control_reason }}"
                  can_start_remotely: "{{ _bl.readiness.can_start_remotely }}"
                  human_checks_always_needed: "{{ _bl.readiness.human_checks_always_needed }}"
                  note: "A printer that looks ready is not safe to start remotely: the sensors cannot see an empty build plate or who is watching."

        - conditions:
            - condition: template
              value_template: "{{ _mode in ['status', 'readiness'] and _kind == 'fdm_octoprint' }}"
          sequence:
            - variables:
                final_response:
                  status: error
                  mode: "{{ _mode }}"
                  kind: fdm_octoprint
                  message: "OctoPrint printers are listed by mode=printers, but status and readiness for them are not built yet."

        - conditions:
            - condition: template
              value_template: "{{ _mode == 'readiness' }}"
          sequence:
            - variables:
                final_response:
                  status: error
                  mode: readiness
                  message: "readiness is available for 3D printers only. Pass printer_entity from mode=printers, or use mode=status for a paper printer."

        # ── status ───────────────────────────────────────────────────────────────
        - conditions:
            - condition: template
              value_template: "{{ _mode == 'status' }}"
          sequence:
            # One answer from every source the printer has. The IPP sensors
            # give the job state, the paper reason and the ink markers (with
            # the printer's own low-level threshold). The epson_workforce
            # sensors of the same physical printer (matched by device model,
            # no entity ids) add the maintenance level and page counters, and
            # fill any ink color IPP does not report. Nothing is hardcoded to
            # one printer's entity names.
            - variables:
                _pr_json: >-
                  {%- set pe = _printer_entity -%}
                  {%- set dev = device_id(pe) if pe != '' else none -%}
                  {%- set model = ((device_attr(dev, 'model') or '') | lower | replace(' series', '') | trim) if dev else '' -%}
                  {%- set alias = {'c': 'cyan', 'm': 'magenta', 'y': 'yellow', 'k': 'black', 'bk': 'black', 'mb': 'black', 'pb': 'photoblack', 'gy': 'gray'} -%}
                  {%- set ns = namespace(ipp={}, thr={}, wf={}, mt={}, up='unknown', wf_n=0) -%}
                  {%- for e in (device_entities(dev) if dev else []) -%}
                    {%- if e.startswith('sensor.') -%}
                      {%- set raw = ((entity_name(e) if entity_name is defined else '') or (state_attr(e, 'friendly_name') or '')) | lower -%}
                      {%- if state_attr(e, 'marker_type') is not none -%}
                        {%- set nm = raw | replace((device_attr(dev, 'name') or 'zzz') | lower, '') | replace(' ink', '') | trim -%}
                        {%- set c = alias.get(nm, nm) | replace(' ', '_') -%}
                        {%- set ns.ipp = ns.ipp | combine({c: states(e) | int(none)}) -%}
                        {%- set ns.thr = ns.thr | combine({c: state_attr(e, 'marker_low_level') | int(15)}) -%}
                      {%- elif 'uptime' in raw -%}
                        {%- set ns.up = states(e) -%}
                      {%- endif -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {%- if model != '' -%}
                    {%- for e in integration_entities('epson_workforce') -%}
                      {%- if model in ((device_attr(device_id(e), 'model') or '') | lower) -%}
                        {%- set ns.wf_n = ns.wf_n + 1 -%}
                        {%- set raw = ((entity_name(e) if entity_name is defined else '') or (state_attr(e, 'friendly_name') or '')) | lower -%}
                        {%- set v = states(e) -%}
                        {%- if 'ink level ' in raw -%}
                          {%- set c = raw | regex_replace('^.*ink level ', '') | trim | replace(' ', '_') -%}
                          {%- set ns.wf = ns.wf | combine({c: v | int(none)}) -%}
                        {%- elif raw.endswith('cleaning level') -%}
                          {%- set ns.mt = ns.mt | combine({'cleaning_level_pct': v | int(none)}) -%}
                        {%- elif raw.endswith('total pages printed') -%}
                          {%- set ns.mt = ns.mt | combine({'pages_total': v | int(none)}) -%}
                        {%- elif raw | regex_search('b.{0,6}w pages printed') -%}
                          {%- set ns.mt = ns.mt | combine({'pages_bw': v | int(none)}) -%}
                        {%- elif raw.endswith('color pages printed') -%}
                          {%- set ns.mt = ns.mt | combine({'pages_color': v | int(none)}) -%}
                        {%- elif raw.endswith('printer status') -%}
                          {%- set ns.mt = ns.mt | combine({'device_status': v}) -%}
                        {%- elif raw.endswith('scanner status') -%}
                          {%- set ns.mt = ns.mt | combine({'scanner_status': v}) -%}
                        {%- endif -%}
                      {%- endif -%}
                    {%- endfor -%}
                  {%- endif -%}
                  {%- set ink = namespace(d=ns.wf) -%}
                  {%- for k, v in ns.ipp.items() -%}
                    {%- if v is not none -%}
                      {%- set ink.d = ink.d | combine({k: v}) -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {%- set low = namespace(l=[]) -%}
                  {%- for k, v in ink.d.items() -%}
                    {%- if v is not none and v <= (ns.thr.get(k, 15)) -%}
                      {%- set low.l = low.l + [k] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {%- set uri = (state_attr(pe, 'uri_supported') or '') if pe != '' else '' -%}
                  {%- set ips = uri | regex_findall('://([^:/,]+)') -%}
                  {%- set reason = (state_attr(pe, 'state_reason') or '') | string if pe != '' else '' -%}
                  {{ {
                    'ink': ink.d,
                    'ink_low': low.l,
                    'maintenance': ns.mt,
                    'uptime': ns.up,
                    'ip': (ips | first) if ips | length > 0 else '',
                    'reason': reason,
                    'paper_empty': ('media-empty' in reason or 'media-needed' in reason),
                    'ink_source': 'ipp' if ns.ipp else ('epson_workforce' if ns.wf else 'none'),
                    'telemetry_sensors': ns.wf_n
                  } | tojson }}
            - variables:
                _pr: "{{ _pr_json | from_json({}) }}"
            - if: "{{ _printer_entity == '' }}"
              then:
                - variables:
                    final_response:
                      status: error
                      mode: status
                      message: "No printer found. Label a printer's IPP status sensor 'printer', pass printer_entity, or run mode=configure."
            - if: "{{ final_response is not defined }}"
              then:
                - variables:
                    final_response:
                      status: ok
                      mode: status
                      printer_entity: "{{ _printer_entity }}"
                      printer_state: "{{ states(_printer_entity) }}"
                      printer_name: "{{ ((([device_name(_printer_entity) if device_id(_printer_entity) else '', entity_name(_printer_entity)] | select | unique | join(' ')) if entity_name is defined else '') or (state_attr(_printer_entity, 'friendly_name') | default(_printer_entity))) }}"
                      printer_ip: "{{ _pr.ip if _pr.ip != '' else _ps.get('epson_ip', 'not configured') }}"
                      paper_empty: "{{ _pr.paper_empty }}"
                      state_reason: "{{ _pr.reason if _pr.reason not in ['', 'None'] else none }}"
                      ink: "{{ _pr.ink }}"
                      ink_low: "{{ _pr.ink_low }}"
                      maintenance: "{{ _pr.maintenance }}"
                      uptime_secs: "{{ _pr.uptime }}"
                      sources:
                        state: ipp
                        ink: "{{ _pr.ink_source }}"
                        maintenance: "{{ 'epson_workforce' if _pr.telemetry_sensors > 0 else 'not available' }}"
                        telemetry_sensors: "{{ _pr.telemetry_sensors }}"

        # ── printers ─────────────────────────────────────────────────────────────
        # Every IPP printer the house has, with the area, its labels and how
        # many companion telemetry sensors it has, so labeling and areas can be
        # checked at a glance. Read-only.
        - conditions:
            - condition: template
              value_template: "{{ _mode == 'printers' }}"
          sequence:
            - variables:
                _printer_list: >-
                  {%- set ns = namespace(out=[]) -%}
                  {%- for e in integration_entities('ipp') -%}
                    {%- if e.startswith('sensor.') and state_attr(e, 'uri_supported') is not none -%}
                      {%- set dev = device_id(e) -%}
                      {%- set model = ((device_attr(dev, 'model') or '') | lower | replace(' series', '') | trim) if dev else '' -%}
                      {%- set cnt = namespace(n=0) -%}
                      {%- if model != '' -%}
                        {%- for w in integration_entities('epson_workforce') -%}
                          {%- if model in ((device_attr(device_id(w), 'model') or '') | lower) -%}
                            {%- set cnt.n = cnt.n + 1 -%}
                          {%- endif -%}
                        {%- endfor -%}
                      {%- endif -%}
                      {%- set ns.out = ns.out + [{
                        'printer_entity': e,
                        'name': ((([device_name(e) if dev else '', entity_name(e)] | select | unique | join(' ')) if entity_name is defined else '') or (state_attr(e, 'friendly_name') | default(e))),
                        'model': (device_attr(dev, 'model') or '') if dev else '',
                        'area': area_name(e) or '',
                        'state': states(e),
                        'selected': e == _printer_entity,
                        'labels': labels(e),
                        'telemetry_sensors': cnt.n,
                        'kind': 'epson_ipp'
                      }] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {%- for e in integration_entities('bambu_lab') -%}
                    {%- set en = ((entity_name(e) if entity_name is defined else '') or '') | lower | trim -%}
                    {%- if e.startswith('sensor.') and en == 'print status' -%}
                      {%- set dev = device_id(e) -%}
                      {%- set c = namespace(enc='', dl='', hy='') -%}
                      {%- for s in (device_entities(dev) if dev else []) -%}
                        {%- set sn = ((entity_name(s) if entity_name is defined else '') or '') | lower | trim -%}
                        {%- if sn == 'mqtt encryption' -%}
                          {%- set c.enc = states(s) -%}
                        {%- elif sn == 'developer lan mode' -%}
                          {%- set c.dl = states(s) -%}
                        {%- elif sn == 'hybrid mqtt control blocked' -%}
                          {%- set c.hy = states(s) -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {%- set known = c.enc in ['on', 'off'] and c.dl in ['on', 'off'] and c.hy in ['on', 'off'] -%}
                      {%- set ns.out = ns.out + [{
                        'printer_entity': e,
                        'name': (device_attr(dev, 'name') or '') if dev else '',
                        'model': (device_attr(dev, 'model') or '') if dev else '',
                        'area': area_name(e) or '',
                        'state': states(e),
                        'selected': false,
                        'labels': labels(e),
                        'kind': 'fdm_bambu',
                        'control_available': known and (c.enc == 'off' or c.dl == 'on') and c.hy == 'off'
                      }] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {%- for e in integration_entities('octoprint') -%}
                    {%- set en = ((entity_name(e) if entity_name is defined else '') or '') | lower | trim -%}
                    {%- if e.startswith('sensor.') and 'printer state' in en -%}
                      {%- set dev = device_id(e) -%}
                      {%- set ns.out = ns.out + [{
                        'printer_entity': e,
                        'name': (device_attr(dev, 'name') or '') if dev else '',
                        'model': 'OctoPrint',
                        'area': area_name(e) or '',
                        'state': states(e),
                        'selected': false,
                        'labels': labels(e),
                        'kind': 'fdm_octoprint',
                        'control_available': none
                      }] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ ns.out | tojson }}
            - variables:
                _printers_parsed: "{{ _printer_list | from_json([]) }}"
            - variables:
                final_response:
                  status: ok
                  mode: printers
                  printers: "{{ _printers_parsed }}"
                  printer_count: "{{ _printers_parsed | length }}"
                  selected: "{{ _printer_entity }}"

        # ── print_image ──────────────────────────────────────────────────────────
        # Prints a generated image from a named slot (/config/www/zen_images/<slot>.jpg).
        # dlimg fetches via http://127.0.0.1:8123/local/ (no auth required).
        - conditions:
            - condition: template
              value_template: "{{ _mode == 'print_image' }}"
          sequence:
            - variables:
                _slot: "{{ slot | default('canvas', true) }}"
                _img_url: "http://127.0.0.1:8123/local/zen_images/{{ _slot }}.jpg"
                _raster_result: {}
                _print_result: {}
            - service: simpleimageraster.draw
              data:
                payload:
                  - type: dlimg
                    x: 0
                    y: 0
                    url: "{{ _img_url }}"
                    xsize: "{{ _img_w }}"
                    ysize: "{{ _img_h }}"
                width: "{{ _img_w }}"
                height: "{{ _img_h }}"
                mimetype: image/jpeg
              response_variable: _raster_result
            - service: ipp_printing.print
              target:
                entity_id: "{{ _printer_entity }}"
              data:
                data: "{{ _raster_result.image.data }}"
                mimetype: "{{ _raster_result.image.mimetype }}"
                paper_size: "{{ _ps.get('paper_size', 'na_letter_8.5x11in') }}"
                orientation: "{{ _final_orient }}"
              response_variable: _print_result
              continue_on_error: true
            - variables:
                final_response:
                  status: "{{ 'ok' if _print_result is mapping and 'job' in _print_result else 'error' }}"
                  mode: print_image
                  slot: "{{ _slot }}"
                  printer_entity: "{{ _printer_entity }}"
                  job: "{{ _print_result.get('job', {}) if _print_result is mapping else {} }}"
                  error: "{{ _print_result if _print_result is string else '' }}"

        # ── list_jobs ────────────────────────────────────────────────────────────
        - conditions:
            - condition: template
              value_template: "{{ _mode == 'list_jobs' }}"
          sequence:
            - variables:
                _jf: "{{ job_filter | default('all') | lower }}"
                _info_result: {}
            - service: ipp_printing.get_printer_information
              target:
                entity_id: "{{ _printer_entity }}"
              data:
                job_filter: "{{ _jf }}"
              response_variable: _info_result
              continue_on_error: true
            - variables:
                final_response:
                  status: "{{ 'ok' if _info_result is mapping and 'jobs' in _info_result else 'error' }}"
                  mode: list_jobs
                  job_filter: "{{ _jf }}"
                  printer_entity: "{{ _printer_entity }}"
                  jobs: "{{ _info_result.get('jobs', []) if _info_result is mapping else [] }}"
                  job_count: "{{ (_info_result.get('jobs', []) if _info_result is mapping else []) | length }}"
                  error: "{{ _info_result if _info_result is string else '' }}"

        # ── clean ────────────────────────────────────────────────────────────────
        - conditions:
            - condition: template
              value_template: "{{ _mode == 'clean' }}"
          sequence:
            - variables:
                _clean_result: {}
            - service: rest_command.epson_print_clean
              response_variable: _clean_result
              continue_on_error: true
            - variables:
                final_response:
                  status: "{{ 'ok' if (_clean_result.get('status') | default(0) | int) in [200, 302] else 'error' }}"
                  mode: clean
                  note: "Head cleaning cycle triggered. Takes ~3 minutes. Do not power off printer."
                  http_status: "{{ _clean_result.get('status') | default('unknown') }}"

        # ── nozzle_check ─────────────────────────────────────────────────────────
        - conditions:
            - condition: template
              value_template: "{{ _mode == 'nozzle_check' }}"
          sequence:
            - variables:
                _nozzle_result: {}
            - service: rest_command.epson_print_nozzle
              response_variable: _nozzle_result
              continue_on_error: true
            - variables:
                final_response:
                  status: "{{ 'ok' if (_nozzle_result.get('status') | default(0) | int) in [200, 302] else 'error' }}"
                  mode: nozzle_check
                  note: "Nozzle check page printing. Inspect the pattern for gaps or missing lines."
                  http_status: "{{ _nozzle_result.get('status') | default('unknown') }}"

        # ── help ─────────────────────────────────────────────────────────────────
        - conditions:
            - condition: template
              value_template: "{{ _mode == 'help' }}"
          sequence:
            - variables:
                _ps_modes:
                  configure: "Seed print_shop cabinet. Fields: epson_ip, epson_entity."
                  test_page: "Print a timestamped test page. No extra fields needed."
                  print_text: "Print plain text. Field: content (required)."
                  print_image: "Print a generated image from a named slot (canvas default). Field: slot."
                  status: "Printer state, paper, ink (with low colors), maintenance level and page counters, merged from the IPP and epson_workforce sensors. Reads HA entity states, no IPP call. Field: printer_entity for a specific printer."
                  printers: "List every printer: paper (IPP) and 3D (Bambu Lab, OctoPrint) with its kind, area, labels, and for 3D whether control is available. Read-only."
                  readiness: "3D printer only, read-only. Device checks (online, idle, alarms, door, SD card, filament, camera) plus the human checks a sensor cannot make. Field: printer_entity from mode=printers."
                  list_jobs: "All jobs via IPP. Field: job_filter (all|incomplete|complete, default all)."
                  clean: "Trigger WF-7840 head cleaning via printer HTTP. ~3 minutes."
                  nozzle_check: "Print nozzle check page via printer HTTP."
                  help: "This help response."
            - variables:
                _ps_help_message: >-
                  {%- set ns = namespace(out='Printer control via IPP -- experimental, PDF/binary not supported, text only. ') -%}
                  {%- for k, v in _ps_modes.items() -%}
                    {%- set ns.out = ns.out ~ 'mode=' ~ k ~ ' -- ' ~ v ~ ' ' -%}
                  {%- endfor -%}
                  {{ ns.out | trim }}
            - variables:
                final_response:
                  status: help
                  message: "{{ _ps_help_message }}"
                  mode: help
                  version: "0.4.0-experimental"
                  modes: "{{ _ps_modes }}"
                  modes_full:
                    configure: "Seed print_shop cabinet. Fields: epson_ip, epson_entity."
                    test_page: "Print a timestamped test page. No extra fields needed."
                    print_text: "Print plain text. Field: content (required)."
                    print_image: "Print a generated image from a named slot (canvas default). Field: slot."
                    status: "Printer state, paper, ink (with low colors), maintenance level and page counters, merged from the IPP and epson_workforce sensors. Reads HA entity states, no IPP call. Field: printer_entity for a specific printer."
                    printers: "List every printer: paper (IPP) and 3D (Bambu Lab, OctoPrint) with its kind, area, labels, and for 3D whether control is available. Read-only."
                    readiness: "3D printer only, read-only. Device checks (online, idle, alarms, door, SD card, filament, camera) plus the human checks a sensor cannot make. Field: printer_entity from mode=printers."
                    list_jobs: "All jobs via IPP. Field: job_filter (all|incomplete|complete, default all)."
                    clean: "Trigger WF-7840 head cleaning via printer HTTP. ~3 minutes."
                    nozzle_check: "Print nozzle check page via printer HTTP."
                    help: "This help response."
                  notes:
                    - "3D printers (Bambu Lab) are read-only here: status and readiness read the printer's own entities, and control is reported (control.available, control.reason) from its MQTT encryption, Developer LAN mode and connection-mode sensors. A printer that looks ready is never safe to start remotely: a clear build plate and someone watching are human checks."
                    - "PDF/binary printing not supported in v0.1 — text only."
                    - "clean/nozzle_check hit printer IP directly (not CUPS). Must configure epson_ip first."
                    - "printer_entity field overrides cabinet default for multi-printer use."
                    - "status reads the printer's own IPP sensors plus the epson_workforce sensors of the same physical printer (matched by device model). Label both 'print_shop' and 'epson_printer'; only the IPP status sensor carries 'printer' (it is the print target)."
                    - "status: ink_low lists colors at or under the printer's own low-level threshold; paper_empty comes from the IPP state reason; maintenance is the epson_workforce cleaning level and page counters."
                    - "clean and nozzle_check still use the epson_ip in the print_shop cabinet (one printer)."
                    - "configure/test_page/print_text/print_image/clean/nozzle_check require zenos.media.print_control cert level 1. status/list_jobs/help stay open."
                  examples:
                    - "mode=configure epson_ip=192.0.2.10 epson_entity=sensor.epson_wf_7840_series"
                    - "mode=status"
                    - "mode=test_page"
                    - "mode=print_text content='Hello from ZenOS'"
                    - "mode=print_image slot=canvas"
                    - "mode=list_jobs job_filter=all"
                    - "mode=clean"

        # ── unknown mode ─────────────────────────────────────────────────────────
        default:
          - variables:
              final_response:
                status: error
                mode: "{{ _mode }}"
                message: "Unknown mode. Run mode=help for reference."
    # ── SINGLE EXIT ──────────────────────────────────────────────────────
    - variables:
        final_response: >-
          {%- import 'zenos_ai/zen_os_1.jinja' as OS -%}
          {{- OS.envelope(
            status='error' if (final_response is mapping and final_response.get('status') == 'error') else 'success',
            mode=(mode | default('') | lower) if (mode | default('') | lower) == 'tool_manifest' else _mode | default(''),
            result=final_response,
            tool='zen_dojotools_print_shop',
            caller_token=caller_token | default('')
          ) | from_json -}}
    - stop: Return
      response_variable: final_response
