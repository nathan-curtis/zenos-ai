###############################################################################
# zen_dojotools_covers (codename: ZenShade)
# Version: 6.0.0
# Room-aware cover, blind, shade, and smart-vent manager
#
# v6.0.0 — identity-gate cadillac pass, matching locks/security_manager
# (2026-08-15, "speaking of covers... :)"):
#   - Migrated onto the shared zen_target_resolve.jinja targeting core
#     (closes the #10308 gap -- covers was the other tool hand-rolling its
#     own area_entities(room)+domain-filter+label-narrowing pattern all
#     session, called out explicitly back when the shared core was cut
#     from covers' and locks' pre-existing logic in the first place).
#   - Full SESE + envelope() conversion (Zammad #10297/#10304 shape) --
#     every mode below builds `result` and falls through to one shared
#     stop at the bottom.
#   - New cover_control cert, same asymmetric-risk shape as lock_control/
#     security_control: closing a cover increases enclosure/security
#     (cert only). Opening a cover is cert-only UNLESS it's a barrier-
#     class cover (device_class in [garage, door, gate] -- the same
#     barrier-exclusion classification this tool already used for
#     scene_set), in which case it's cert AND a fresh live household-
#     admin ack every single call -- exact parallel to locks' exterior-
#     unlock gate and security_manager's disarm gate. Non-barrier window
#     covers (blinds/shades/curtains) stay cert-only for open too --
#     opening the living room blinds is not a security event; opening the
#     garage door is.
#   - Same per-target cert_scope admin-override mechanism as locks: an
#     admin can grant cert_grant cert_component=cover_control
#     cert_scope=["cover.garage_door"] to exempt one specific barrier
#     from the every-call ack. Mixed coverage in one call still asks for
#     the whole set, exactly like locks.
#   - tool_manifest self-publishes certs_required (display_name/
#     description/gates/max_level/live_ack_required_for/grant_via) --
#     this IS the cert catalog now, calculated live by
#     zen_dojotools_manifest mode=cert_audit, no separate hand-
#     maintained file (2026-08-15 cutover, see dojotools_manifest.yaml).
#   - discover/set/scene_set output shape is UNCHANGED from v5.1.0 --
#     only how targets are resolved and how actuation is gated changed.
#     Regression-verified: all v5.1.0 fields still present in results.
#
# ── LABEL TAXONOMY ──────────────────────────────────────────────────────────
#   zen_cv_blackout  — blackout blind/shade. base_light_tx: 0.02
#   zen_cv_sheer     — sheer/solar-diffuser shade. base_light_tx: 0.50
#   zen_cv_curtain   — motorized curtain rod. base_light_tx: 0.45
#   zen_cv_vent      — smart HVAC vent (Flair, Keen). AIRFLOW, not window light.
#                      Excluded from window scenes unless include_vents=true.
#   zen_cv_primary   — primary cover surface (wins tiebreak per room)
#
# ── BARRIER AUTO-EXCLUSION (v5.1.0, still true in v6.0.0) ──────────────────
#   device_class in [garage, door, gate] → ALWAYS excluded from scene_set.
#   These are security/access barriers, not window light covers.
#   Explicit set mode with entity_id bypasses the scene_set exclusion --
#   direct targeting still works, now behind the cover_control identity
#   gate described above (open=live-ack-every-time, close=cert-only).
#
# ── SCENE MAPPINGS ──────────────────────────────────────────────────────────
#   movie    — blackout→0, sheer→0, curtain→100  (dark room, soft frame)
#   work     — blackout→100, sheer→100, curtain→100  (max natural light)
#   morning  — all window covers → 100
#   sleep    — all window covers → 0
#   privacy  — blackout→0, sheer→80, curtain→100  (diffuse, no sightline)
#              tilt-capable: tilt→45 (angled for diffuse light, no sightline)
#   natural  — all window covers → 100. tilt-capable: tilt→100
#   movie/sleep: tilt→0 (slats closed). work/morning/natural: tilt→100.
#
# ── TILT SUPPORT (v5.1.0) ───────────────────────────────────────────────────
#   Tilt-capable covers detected via supported_features bitmask (bit 7 = 128).
#   set mode: tilt_position=0–100 (0=horizontal/closed slats, 100=vertical/open).
#   Both position + tilt_position can be provided in one call. Either alone is valid.
#   scene_set: tilt auto-applied per scene for any tilt-capable cover.
#
# ── DYNAMIC LIGHT_TX ────────────────────────────────────────────────────────
#   If cover device exposes sensor.{slug}_illuminance AND zen_outdoor_lux exists:
#     effective_light_tx = sensor_lux / outdoor_lux  (clamped 0–1)
#   Else:
#     effective_light_tx = base_light_tx[role] × (position / 100)
#     base defaults: blackout=0.02, sheer=0.50, curtain=0.45, unlabeled=0.40
#
# ── SETUP FLOW ───────────────────────────────────────────────────────────────
#   1. mode=setup          — create all zen_cv_* label definitions in HA
#   2. HA UI: label each cover with its role
#   3. mode=discover room=X — verify roles, effective_light_tx populated
###############################################################################

script:
  zen_dojotools_covers:
    alias: Zen DojoTools Covers
    description: >-
      Room-aware cover, blind, shade, and smart-vent manager. Supports
      entity_id=, label=, and room= targeting. discover room=X maps covers
      with position, tilt_supported, and effective_light_tx. set targets
      by role or entity_id; tilt_position (0–100) for venetian tilt
      control — position and tilt_position can both be set in one call.
      Closing a cover is cert-only; opening a barrier-class cover (garage/
      door/gate device_class) requires cover_control cert AND a fresh live
      household-admin ack every call. scene_set applies named scenes with
      auto tilt for tilt-capable covers (privacy=45°, sleep/movie=0,
      work/morning/natural=100) — barriers always excluded from scenes.
      Smart vents excluded from window scenes unless include_vents=true.
      setup creates zen_cv_* labels. mode=help.
    icon: mdi:blinds
    mode: queued
    max: 5

    fields:
      mode:
        name: Mode
        description: >-
          discover=map covers + effective_light_tx (room/label/entity_id
          scoped). set=position a cover, gated by cover_control cert (+
          live ack every call for opening a barrier-class cover).
          scene_set=apply named scene (barriers always excluded, cert
          only). setup=create zen_cv_* labels. help=schema.
        default: discover
        selector:
          select:
            options:
              - discover
              - set
              - scene_set
              - setup
              - help
              - tool_manifest

      room:
        name: Room
        description: "Area name/slug OR a Room Manager room label — both resolve. Required for discover, set (unless entity_id/label), scene_set."
        selector:
          text:

      label:
        name: Label
        description: "HA label id (zen_cv_* role, or any other label). Combined with room= narrows to that room; alone, targets every cover carrying it anywhere in the house."
        selector:
          text:

      entity_id:
        name: Entity ID
        description: "Explicit cover entity override. Beats label/room if given."
        selector:
          entity:
            domain: cover

      target_role:
        name: Target Role
        description: "zen_cv_blackout / zen_cv_sheer / zen_cv_curtain / zen_cv_vent / zen_cv_primary. Convenience alias for label= on set mode. Omit for auto-resolve."
        selector:
          text:

      position:
        name: Position
        description: "0=fully closed, 100=fully open. Required for set mode (position and/or tilt_position)."
        selector:
          number:
            min: 0
            max: 100
            step: 5
            mode: slider

      tilt_position:
        name: Tilt Position
        description: "0=slats closed/horizontal, 100=slats open/vertical. set mode. Can combine with position."
        selector:
          number:
            min: 0
            max: 100
            step: 5
            mode: slider

      scene:
        name: Scene
        description: "Named scene for scene_set: movie / work / morning / sleep / privacy / natural"
        selector:
          select:
            options:
              - movie
              - work
              - morning
              - sleep
              - privacy
              - natural

      include_vents:
        name: Include Vents
        description: "Include zen_cv_vent covers in scene_set. Default false — vents are HVAC, not window light."
        default: false
        selector:
          boolean:

      dry_run:
        name: Dry Run
        description: "Preview without moving hardware or firing any ack. Returns would_apply list."
        default: false
        selector:
          boolean:

      caller_token:
        name: Caller Token
        description: "Opaque audit token echoed in response."
        selector:
          text:

    sequence:

      - variables:
          _tm_check: "{{ mode | default('') | lower }}"
          _caller_token_early: "{{ caller_token | default('', true) }}"

      # ═══════════════════════════════════════════════════════════════════════
      # tool_manifest keeps its own early exit — self-description, not a
      # domain result (same precedent as locks/security_manager/infra).
      # ═══════════════════════════════════════════════════════════════════════
      - if: "{{ _tm_check == 'tool_manifest' }}"
        then:
          - variables:
              result: >-
                {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
                {%- set _tm = MF.tool_manifest(
                    tool='zen_dojotools_covers',
                    display_name='Cover Manager',
                    tier='dojotools',
                    version='6.0.0',
                    health={'configured': true, 'status': 'ok', 'notes': []},
                    required_labels=['dojotools'],
                    optional_labels=['cover', 'zen_cv_blackout', 'zen_cv_sheer', 'zen_cv_curtain', 'zen_cv_vent', 'zen_cv_primary'],
                    consumes=['entity_or_label_or_room'],
                    returns=['cover_state'],
                    icon='mdi:window-shutter',
                    color='brown',
                    stripe=3,
                    impact='soft',
                    mcp_exposed=true,
                    caller_token=_caller_token_early
                ) | from_json -%}
                {{- _tm | combine({
                    'certs_required': [{
                      'cert': 'cover_control',
                      'display_name': 'Cover Control',
                      'description': 'Cover/blind/shade position and scene actuation via zen_dojotools_covers, including exterior barrier (garage/door/gate device_class) covers.',
                      'max_level': 4,
                      'gates': ['mode=set (close, any cover -- cert only)', 'mode=set (open, non-barrier cover -- cert only)', 'mode=scene_set (cert only, barriers always excluded)'],
                      'live_ack_required_for': ['mode=set (open, barrier-class cover: garage/door/gate device_class) -- every call, cert alone is never sufficient'],
                      'grant_via': "persona_editor mode=cert_grant cert_component=cover_control (or zen_dojotools_identity mode=cert_list to see current status)"
                    }]
                  }) -}}
          - stop: tool_manifest
            response_variable: result

      # ── Normalize inputs ──────────────────────────────────────────────────
      - variables:
          _mode: "{{ mode | default('discover', true) | lower | trim }}"
          _room: "{{ room | default('', true) | string | trim }}"
          _label: "{{ label | default('', true) | string | trim }}"
          _entity_id: "{{ entity_id | default('', true) | string | trim }}"
          _target_role: "{{ target_role | default('', true) | lower | trim }}"
          _position: "{{ -1 if (position is not defined or position is none) else position | int(-1) }}"
          _scene: "{{ scene | default('', true) | lower | trim }}"
          _include_vents: "{{ include_vents | default(false, true) | bool(false) }}"
          _dry_run: "{{ dry_run | default(false, true) | bool(false) }}"
          _tilt_position: "{{ -1 if (tilt_position is not defined or tilt_position is none) else tilt_position | int(-1) }}"
          _caller_token: "{{ caller_token | default('', true) }}"

      # target_role is a convenience alias for label= on set mode (kept from
      # v5.1.0's field surface) -- if label wasn't given but target_role was,
      # feed it into the same _label the shared targeting core reads.
      - variables:
          _label: "{{ _target_role if (_label == '' and _target_role != '') else _label }}"

      - variables:
          _room_resolved: "{{ _room | slugify if _room != '' else '' }}"

      # ── Outdoor lux reference ─────────────────────────────────────────────
      - variables:
          _outdoor_lux_ent: "{{ label_entities('zen_outdoor_lux') | list | first | default('') }}"

      - variables:
          _outdoor_lux: >-
            {%- if _outdoor_lux_ent != '' and states(_outdoor_lux_ent) not in ['unavailable','unknown',''] -%}
              {{ states(_outdoor_lux_ent) | float(0) }}
            {%- else -%}{{ -1 }}{%- endif -%}

      # ── Base light_tx by role ─────────────────────────────────────────────
      - variables:
          _base_ltx:
            zen_cv_blackout: 0.02
            zen_cv_sheer: 0.50
            zen_cv_curtain: 0.45

      # ═══════════════════════════════════════════════════════════════════════
      # Single-entry/single-exit: every branch below builds `result` and falls
      # through. ONE stop point at the bottom wraps it in OS.envelope().
      # ═══════════════════════════════════════════════════════════════════════
      - choose:

          # ── HELP ──────────────────────────────────────────────────────────
          - conditions: "{{ _mode == 'help' }}"
            sequence:
              - variables:
                  result:
                    status: ok
                    mode: help
                    tool: zen_dojotools_covers
                    version: "6.0.0"
                    codename: ZenShade
                    modes:
                      discover: "Map covers (room/label/entity_id scoped). Returns position, tilt_supported, current_tilt_position, role, effective_light_tx."
                      set: "Set position (0–100) and/or tilt_position (0–100). Either or both. 0=close, 100=open. cover_control cert required; opening a barrier-class (garage/door/gate) cover also needs a fresh live ack every call, unless an admin-granted cert_scope override covers that exact entity_id."
                      scene_set: "Apply named scene. Barriers (garage/door/gate) always excluded. Tilt auto-applied for tilt-capable covers. cover_control cert required."
                      setup: "Create all zen_cv_* label definitions in HA."
                      help: "This schema."
                    labels:
                      zen_cv_blackout: "Blackout blind/shade. base_light_tx=0.02."
                      zen_cv_sheer: "Sheer/solar diffuser. base_light_tx=0.50."
                      zen_cv_curtain: "Motorized curtain rod. base_light_tx=0.45."
                      zen_cv_vent: "Smart HVAC vent (Flair, Keen). Airflow only — excluded from light scenes unless include_vents=true."
                      zen_cv_primary: "Primary cover surface. Wins tiebreak per room."
                    scenes:
                      movie: "blackout→0, sheer→0, curtain→100 (dark room, soft frame)"
                      work: "all window covers → 100 (max natural light)"
                      morning: "all window covers → 100"
                      sleep: "all window covers → 0"
                      privacy: "blackout→0, sheer→80, curtain→100 (diffuse light, no sightline)"
                      natural: "all window covers → 100"
                    light_tx_method: >-
                      sensor_direct: cover device has sensor.{slug}_illuminance → effective_light_tx = lux / outdoor_lux.
                      position_estimate: effective_light_tx = base_light_tx[role] × (position/100). Unlabeled base=0.40.
                      zen_outdoor_lux label required for sensor_direct method.
                    tilt:
                      detection: "supported_features bit 7 (128). Auto-detected — no label needed."
                      position: "0=slats horizontal/closed (max block), 100=slats vertical/open (max light)."
                      set_mode: "tilt_position=N applies set_cover_tilt_position. Combine with position for lift+tilt in one call."
                      scene_tilts:
                        movie: 0
                        work: 100
                        morning: 100
                        sleep: 0
                        privacy: 45
                        natural: 100
                    identity_gate: >-
                      cover_control cert required for set and scene_set. Closing (any
                      cover) and opening a non-barrier cover are cert-only. Opening a
                      barrier-class cover (device_class in garage/door/gate) requires a
                      fresh live household-admin ack EVERY call, unless the admin has
                      granted a cert_scope override naming that exact entity_id (via
                      persona_editor cert_grant cert_component=cover_control
                      cert_scope=["cover.X"]). scene_set never touches barriers, so it
                      never triggers the ack tier.
                    setup_flow:
                      - "1. mode=setup — create zen_cv_* label definitions"
                      - "2. HA UI: Settings → Entities → label each cover"
                      - "3. mode=discover room=X — verify roles + effective_light_tx"
                    caller_token: "{{ _caller_token }}"

          # ═══════════════════════════════════════════════════════════════════
          # SETUP — create zen_cv_* label definitions
          # ═══════════════════════════════════════════════════════════════════
          - conditions: "{{ _mode == 'setup' }}"
            sequence:
              - action: script.zen_dojotools_labels
                data:
                  action_type: create
                  label_list:
                    - zen_cv_blackout
                    - zen_cv_sheer
                    - zen_cv_curtain
                    - zen_cv_vent
                    - zen_cv_primary
                  new_description: "ZenShade cover role — zen_dojotools_covers"
                  new_icon: mdi:blinds
                  new_color: teal
                  confirm: true
                response_variable: _setup_raw
              - variables:
                  result:
                    status: ok
                    mode: setup
                    labels_created: "{{ _setup_raw.result.created_labels | default([]) }}"
                    labels_existed: "{{ _setup_raw.result.already_existed | default([]) }}"
                    next_step: "Label each cover entity with its zen_cv_* role in HA UI (Settings → Entities), then run mode=discover room=X to verify."
                    caller_token: "{{ _caller_token }}"

          # ═══════════════════════════════════════════════════════════════════
          # DISCOVER
          # ═══════════════════════════════════════════════════════════════════
          - conditions: "{{ _mode == 'discover' }}"
            sequence:
              - choose:
                  - conditions: "{{ _room_resolved == '' and _label == '' and _entity_id == '' }}"
                    sequence:
                      - variables:
                          result:
                            status: error
                            error: room_required
                            detail: "Provide room= (area name/slug or Room Manager label), label=, and/or entity_id=."
                            caller_token: "{{ _caller_token }}"
                default:
                  - variables:
                      _cov_targets_raw: >-
                        {%- import 'zenos_ai/zen_target_resolve.jinja' as TARGET -%}
                        {{ TARGET.resolve_targets(_entity_id, _room_resolved, _label, 'cover\\.') }}
                  - variables:
                      _cov_targets: "{{ (_cov_targets_raw | from_json) if _cov_targets_raw is string else _cov_targets_raw }}"

                  - variables:
                      _discovered: >-
                        {%- set ns = namespace(items=[]) -%}
                        {%- set olux = _outdoor_lux | float(-1) -%}
                        {%- set bltx = _base_ltx -%}
                        {%- set vent_list = label_entities('zen_cv_vent') | list -%}
                        {%- set black_list = label_entities('zen_cv_blackout') | list -%}
                        {%- set sheer_list = label_entities('zen_cv_sheer') | list -%}
                        {%- set curtain_list = label_entities('zen_cv_curtain') | list -%}
                        {%- set primary_list = label_entities('zen_cv_primary') | list -%}
                        {%- for e in _cov_targets -%}
                          {%- set _st = states(e) -%}
                          {%- set _dc = state_attr(e, 'device_class') | default('', true) | string | lower -%}
                          {%- set _is_barrier = _dc in ['garage', 'door', 'gate'] -%}
                          {%- set _pos_raw = state_attr(e, 'current_position') | default(none, true) -%}
                          {%- set _pos = _pos_raw | int(-1) if _pos_raw is not none else -1 -%}
                          {%- set _feat = state_attr(e, 'supported_features') | int(0) -%}
                          {%- set _tilt_ok = (_feat // 128) % 2 == 1 -%}
                          {%- set _tilt_pos_raw = state_attr(e, 'current_tilt_position') | default(none, true) -%}
                          {%- set _tilt_pos = _tilt_pos_raw | int(-1) if _tilt_pos_raw is not none else -1 -%}
                          {%- set _is_vent = e in vent_list -%}
                          {%- set _is_primary = e in primary_list -%}
                          {%- set _role = 'zen_cv_vent' if _is_vent
                              else 'zen_cv_blackout' if e in black_list
                              else 'zen_cv_sheer' if e in sheer_list
                              else 'zen_cv_curtain' if e in curtain_list
                              else 'unlabeled' -%}
                          {%- set _slug = e | replace('cover.', '') -%}
                          {%- set _illum_ent = 'sensor.' ~ _slug ~ '_illuminance' -%}
                          {%- set _illum_ok = states(_illum_ent) not in ['unavailable','unknown',''] -%}
                          {%- set _illum_val = states(_illum_ent) | float(0) if _illum_ok else none -%}
                          {%- if _is_vent -%}
                            {%- set _eltx = none -%}
                            {%- set _eltx_method = 'n/a (vent)' -%}
                          {%- elif _illum_ok and olux > 0 -%}
                            {%- set _eltx = [(_illum_val / olux), 1.0] | min | round(3) -%}
                            {%- set _eltx_method = 'sensor_direct' -%}
                          {%- elif _pos >= 0 -%}
                            {%- set _bval = bltx.get(_role, 0.40) | float(0.40) -%}
                            {%- set _eltx = (_bval * (_pos / 100)) | round(3) -%}
                            {%- set _eltx_method = 'position_estimate' -%}
                          {%- else -%}
                            {%- set _eltx = none -%}
                            {%- set _eltx_method = 'unknown (no position)' -%}
                          {%- endif -%}
                          {%- set ns.items = ns.items + [{
                            'entity_id': e,
                            'friendly_name': state_attr(e, 'friendly_name') | default(e),
                            'state': _st,
                            'device_class': _dc,
                            'is_barrier': _is_barrier,
                            'position': _pos if _pos >= 0 else none,
                            'tilt_supported': _tilt_ok,
                            'current_tilt_position': _tilt_pos if _tilt_pos >= 0 else none,
                            'role': _role,
                            'is_primary': _is_primary,
                            'illuminance_entity': _illum_ent if _illum_ok else none,
                            'illuminance_lux': _illum_val if _illum_ok else none,
                            'effective_light_tx': _eltx,
                            'light_tx_method': _eltx_method
                          }] -%}
                        {%- endfor -%}
                        {{ ns.items }}

                  - variables:
                      _window_covers: "{{ _discovered | selectattr('role', 'ne', 'zen_cv_vent') | list }}"
                      _vent_covers: "{{ _discovered | selectattr('role', 'equalto', 'zen_cv_vent') | list }}"
                      _unlabeled: "{{ _discovered | selectattr('role', 'equalto', 'unlabeled') | list }}"
                      _has_direct_lux: "{{ _discovered | selectattr('light_tx_method', 'equalto', 'sensor_direct') | list | length > 0 }}"

                  - variables:
                      result:
                        status: ok
                        mode: discover
                        room: "{{ _room_resolved if _room_resolved != '' else none }}"
                        label: "{{ _label if _label != '' else none }}"
                        cover_count: "{{ _discovered | length }}"
                        window_covers: "{{ _window_covers }}"
                        vent_covers: "{{ _vent_covers }}"
                        unlabeled_count: "{{ _unlabeled | length }}"
                        outdoor_lux: "{{ _outdoor_lux if _outdoor_lux >= 0 else none }}"
                        outdoor_lux_entity: "{{ _outdoor_lux_ent if _outdoor_lux_ent != '' else none }}"
                        light_tx_method: "{{ 'sensor_direct' if _has_direct_lux else 'position_estimate' }}"
                        setup_advisory: >-
                          {{ 'Run mode=setup then label ' ~ (_unlabeled | length | string) ~ ' unlabeled cover(s) with zen_cv_* roles for accurate light_tx.' if _unlabeled | length > 0 else none }}
                        next_step: >-
                          {{ 'Label unlabeled covers via zen_dojotools_labels then re-run discover.' if _unlabeled | length > 0 else 'Use scene_set room=' ~ _room_resolved ~ ' scene=movie|work|morning|sleep|privacy|natural.' }}
                        caller_token: "{{ _caller_token }}"

          # ═══════════════════════════════════════════════════════════════════
          # SET
          # ═══════════════════════════════════════════════════════════════════
          - conditions: "{{ _mode == 'set' }}"
            sequence:
              - variables:
                  _set_targets_raw: >-
                    {%- import 'zenos_ai/zen_target_resolve.jinja' as TARGET -%}
                    {{ TARGET.resolve_targets(_entity_id, _room_resolved, _label, 'cover\\.') }}
              - variables:
                  _set_targets: "{{ (_set_targets_raw | from_json) if _set_targets_raw is string else _set_targets_raw }}"
              - choose:
                  - conditions: "{{ _set_targets | length == 0 }}"
                    sequence:
                      - variables:
                          result:
                            status: error
                            error: no_targets
                            detail: "Provide entity_id=, label=, target_role=, and/or room= that resolves to at least one cover."
                            caller_token: "{{ _caller_token }}"
                  - conditions: "{{ _position < 0 and _tilt_position < 0 }}"
                    sequence:
                      - variables:
                          result:
                            status: error
                            error: position_or_tilt_required
                            detail: "Provide position (0–100) and/or tilt_position (0–100) for set mode."
                            caller_token: "{{ _caller_token }}"
                default:
                  # ── Barrier classification of the resolved target set --
                  # same device_class check scene_set already uses to
                  # auto-exclude these, now used here to decide which risk
                  # tier applies. "Opening" = _position > 0 (any nonzero
                  # position increases the physical opening -- treat ANY
                  # nonzero target position as an open for barrier gating
                  # purposes, not just position==100, since a barrier
                  # partway open is still a reduced-security state). ──
                  - variables:
                      _set_barrier_targets: >-
                        {%- set ns = namespace(items=[]) -%}
                        {%- for e in _set_targets -%}
                          {%- set _dc = state_attr(e, 'device_class') | default('', true) | string | lower -%}
                          {%- if _dc in ['garage', 'door', 'gate'] -%}
                            {%- set ns.items = ns.items + [e] -%}
                          {%- endif -%}
                        {%- endfor -%}
                        {{ ns.items }}
                      _set_is_open_request: "{{ _position > 0 }}"

                  # ── Resolve identity/cert_scope BEFORE branching on
                  # dry_run -- this is a read-only call (resolve_caller_
                  # identity doesn't mutate anything), so it's safe to run
                  # unconditionally. Real bug found and fixed here: the
                  # dry_run preview used to compute would_require_live_ack
                  # from barrier_targets alone, with no visibility into an
                  # admin-granted cert_scope override -- it would report
                  # true even for a barrier the admin had already exempted,
                  # because the identity call only happened in the actuation
                  # branch, after dry_run had already returned. Moving the
                  # resolve up means both branches see the same real
                  # cert_scope and the preview is accurate. ──
                  - action: script.zen_dojotools_identity
                    response_variable: _set_id_raw
                    continue_on_error: true
                    data:
                      mode: resolve_caller_identity
                      required_cert: cover_control
                      required_cert_level: 1
                      caller_token: "{{ _caller_token }}"
                  - variables:
                      _set_policy_status: "{{ _set_id_raw.get('policy_status', 'blocked') if _set_id_raw is mapping else 'blocked' }}"
                      _set_authorized: "{{ _set_id_raw.get('authorized', false) if _set_id_raw is mapping else false }}"
                      _set_cert_level: "{{ _set_id_raw.get('cert_level', 0) if _set_id_raw is mapping else 0 }}"
                      _set_cert_scope: "{{ _set_id_raw.get('cert_scope', []) if _set_id_raw is mapping else [] }}"
                  - variables:
                      _set_barrier_uncovered: >-
                        {%- set ns = namespace(items=[]) -%}
                        {%- for e in _set_barrier_targets if e not in _set_cert_scope -%}
                          {%- set ns.items = ns.items + [e] -%}
                        {%- endfor -%}
                        {{ ns.items }}

                  - choose:
                      - conditions: "{{ _dry_run }}"
                        sequence:
                          - variables:
                              result:
                                status: ok
                                mode: set
                                dry_run: true
                                would_apply: "{{ _set_targets }}"
                                barrier_targets: "{{ _set_barrier_targets }}"
                                barrier_uncovered_by_scope: "{{ _set_barrier_uncovered }}"
                                would_require_live_ack: "{{ _set_is_open_request and _set_barrier_uncovered | length > 0 }}"
                                would_be_authorized: "{{ _set_policy_status == 'allowed' and _set_authorized }}"
                                caller_token: "{{ _caller_token }}"
                    default:
                      # ── Tier X (act) identity gate -- same shape as
                      # locks/security_manager/infra. Read (discover) stays
                      # open; actuation requires cover_control, fail-closed
                      # by design until certified. caller_token is audit-
                      # only, never a trust input. ──
                      - choose:
                          - conditions: "{{ _set_policy_status != 'allowed' or not _set_authorized }}"
                            sequence:
                              - variables:
                                  result:
                                    status: error
                                    error: "{{ 'identity_policy_blocked' if _set_policy_status != 'allowed' else 'cert_insufficient' }}"
                                    mode: set
                                    detail: >-
                                      {%- if _set_policy_status != 'allowed' -%}
                                        resolve_caller_identity did not return an allowed identity -- action denied.
                                      {%- else -%}
                                        cover_control cert level {{ _set_cert_level }} is below the required minimum (1) to act on {{ _set_targets | map('regex_replace', '^cover\.', '') | map('replace', '_', ' ') | join(', ') }}.
                                      {%- endif -%}
                                    can_request: "{{ _set_policy_status == 'allowed' }}"
                                    request_via:
                                      tool: zen_dojotools_persona_editor
                                      mode: cert_grant
                                      cert_component: cover_control
                                      cert_level: 1
                                      note: "Fires a live household-admin approval push -- see zen_dojotools_identity mode=cert_list for current status."
                                    would_apply: "{{ _set_targets }}"
                                    caller_token: "{{ _caller_token }}"
                        default:
                          # ── Opening a barrier requires a FRESH live ack
                          # every time, even with cover_control already
                          # held -- UNLESS the admin has granted a scoped
                          # override for that specific barrier via
                          # cert_grant cert_scope=["cover.garage_door"].
                          # Exact same shape as locks' exterior-unlock
                          # gate: mixed coverage in the target set still
                          # asks for the whole set, never a partial
                          # silent open. _set_barrier_uncovered is already
                          # computed above (shared with the dry_run
                          # preview). ──
                          - choose:
                              - conditions: "{{ _set_is_open_request and _set_barrier_uncovered | length > 0 }}"
                                sequence:
                                  - action: script.zen_dojotools_identity
                                    response_variable: _set_ack_raw
                                    continue_on_error: true
                                    data:
                                      mode: request_live_ack
                                      ack_message: >-
                                        Open request: {{ _set_barrier_targets | map('regex_replace', '^cover\.', '') | map('replace', '_', ' ') | join(', ') }}
                                        (barrier cover -- opening reduces security, same risk class
                                        as an exterior unlock). No standing override on file for
                                        this barrier, so asking every time as designed. Approve
                                        this one open, to position {{ _position }}? (Tip: grant
                                        cert_grant cert_component=cover_control cert_scope=["{{ _set_barrier_targets[0] }}"]
                                        via persona_editor if you want this specific barrier to
                                        stop asking.)
                                      caller_token: "{{ _caller_token }}"
                                  - variables:
                                      _set_ack_approved: "{{ _set_ack_raw.get('approved', false) if _set_ack_raw is mapping else false }}"
                                      _set_ack_reason: "{{ _set_ack_raw.get('reason', 'dispatch_failed') if _set_ack_raw is mapping else 'dispatch_failed' }}"
                                  - if: "{{ not _set_ack_approved }}"
                                    then:
                                      - variables:
                                          result:
                                            status: denied
                                            mode: set
                                            reason: "{{ _set_ack_reason }}"
                                            detail: "Opening a barrier cover requires a fresh live household-admin ack every time -- not granted."
                                            would_apply: "{{ _set_targets }}"
                                            caller_token: "{{ _caller_token }}"
                              - conditions: "{{ _set_is_open_request and _set_barrier_targets | length > 0 and _set_barrier_uncovered | length == 0 }}"
                                sequence:
                                  - action: script.zen_dojotools_event_emitter
                                    continue_on_error: true
                                    data:
                                      mode: emit
                                      component: covers
                                      kind: cover_ack_skipped_scoped_override
                                      severity: info
                                      summary: >-
                                        Barrier open ack skipped -- admin-granted scope override
                                        covers {{ _set_barrier_targets | join(', ') }}.
                                      metadata:
                                        targets: "{{ _set_barrier_targets }}"
                                        cert_scope: "{{ _set_cert_scope }}"
                                        caller_token: "{{ _caller_token }}"
                          - if: "{{ result is not defined }}"
                            then:
                              - if: "{{ _position >= 0 }}"
                                then:
                                  - repeat:
                                      for_each: "{{ _set_targets }}"
                                      sequence:
                                        - choose:
                                            - conditions: "{{ _position == 0 }}"
                                              sequence:
                                                - action: cover.close_cover
                                                  continue_on_error: true
                                                  target:
                                                    entity_id: "{{ repeat.item }}"
                                            - conditions: "{{ _position == 100 }}"
                                              sequence:
                                                - action: cover.open_cover
                                                  continue_on_error: true
                                                  target:
                                                    entity_id: "{{ repeat.item }}"
                                          default:
                                            - action: cover.set_cover_position
                                              continue_on_error: true
                                              target:
                                                entity_id: "{{ repeat.item }}"
                                              data:
                                                position: "{{ _position }}"
                              - if: "{{ _tilt_position >= 0 }}"
                                then:
                                  - repeat:
                                      for_each: "{{ _set_targets }}"
                                      sequence:
                                        - action: cover.set_cover_tilt_position
                                          continue_on_error: true
                                          target:
                                            entity_id: "{{ repeat.item }}"
                                          data:
                                            tilt_position: "{{ _tilt_position }}"
                              # ── Audit trail -- same gap-closure as locks'
                              # lock_actuation event, applied here so
                              # cover_control actuations have a durable
                              # record too, not just HA's last_changed. ──
                              - action: script.zen_dojotools_event_emitter
                                continue_on_error: true
                                data:
                                  mode: emit
                                  component: covers
                                  kind: cover_actuation
                                  severity: info
                                  summary: >-
                                    set applied to
                                    {{ _set_targets | map('regex_replace', '^cover\.', '') | join(', ') }}
                                    via zen_dojotools_covers.
                                  metadata:
                                    position: "{{ _position if _position >= 0 else none }}"
                                    tilt_position: "{{ _tilt_position if _tilt_position >= 0 else none }}"
                                    targets: "{{ _set_targets }}"
                                    barrier_targets: "{{ _set_barrier_targets }}"
                                    ack_required: "{{ _set_is_open_request and _set_barrier_uncovered | length > 0 }}"
                                    scope_override_used: "{{ _set_is_open_request and _set_barrier_targets | length > 0 and _set_barrier_uncovered | length == 0 }}"
                                    caller_token: "{{ _caller_token }}"
                              - variables:
                                  result:
                                    status: ok
                                    mode: set
                                    entity_id: "{{ _set_targets | join(',') }}"
                                    targets: "{{ _set_targets }}"
                                    position_set: "{{ _position if _position >= 0 else none }}"
                                    tilt_position_set: "{{ _tilt_position if _tilt_position >= 0 else none }}"
                                    caller_token: "{{ _caller_token }}"

          # ═══════════════════════════════════════════════════════════════════
          # SCENE_SET
          # ═══════════════════════════════════════════════════════════════════
          - conditions: "{{ _mode == 'scene_set' }}"
            sequence:
              - choose:
                  - conditions: "{{ _room_resolved == '' or _scene == '' }}"
                    sequence:
                      - variables:
                          result:
                            status: error
                            error: room_and_scene_required
                            detail: "Provide room= and scene= (movie/work/morning/sleep/privacy/natural)."
                            caller_token: "{{ _caller_token }}"
                default:
                  # ── scene_set never targets barriers (same auto-exclusion
                  # as v5.1.0), so it stays cert-only regardless of scene --
                  # no barrier can ever be in _apply_list below. ──
                  - action: script.zen_dojotools_identity
                    response_variable: _sc_id_raw
                    continue_on_error: true
                    data:
                      mode: resolve_caller_identity
                      required_cert: cover_control
                      required_cert_level: 1
                      caller_token: "{{ _caller_token }}"
                  - variables:
                      _sc_policy_status: "{{ _sc_id_raw.get('policy_status', 'blocked') if _sc_id_raw is mapping else 'blocked' }}"
                      _sc_authorized: "{{ _sc_id_raw.get('authorized', false) if _sc_id_raw is mapping else false }}"
                      _sc_cert_level: "{{ _sc_id_raw.get('cert_level', 0) if _sc_id_raw is mapping else 0 }}"
                  - choose:
                      - conditions: "{{ _sc_policy_status != 'allowed' or not _sc_authorized }}"
                        sequence:
                          - variables:
                              result:
                                status: error
                                error: "{{ 'identity_policy_blocked' if _sc_policy_status != 'allowed' else 'cert_insufficient' }}"
                                mode: scene_set
                                detail: >-
                                  {%- if _sc_policy_status != 'allowed' -%}
                                    resolve_caller_identity did not return an allowed identity -- action denied.
                                  {%- else -%}
                                    cover_control cert level {{ _sc_cert_level }} is below the required minimum (1) for scene_set.
                                  {%- endif -%}
                                can_request: "{{ _sc_policy_status == 'allowed' }}"
                                request_via:
                                  tool: zen_dojotools_persona_editor
                                  mode: cert_grant
                                  cert_component: cover_control
                                  cert_level: 1
                                caller_token: "{{ _caller_token }}"
                    default:
                      # Scene → position per role
                      - variables:
                          _scene_positions: >-
                            {%- set scenes = {
                              'movie':   {'zen_cv_blackout': 0,   'zen_cv_sheer': 0,   'zen_cv_curtain': 100, 'unlabeled': 0},
                              'work':    {'zen_cv_blackout': 100,  'zen_cv_sheer': 100,  'zen_cv_curtain': 100, 'unlabeled': 100},
                              'morning': {'zen_cv_blackout': 100,  'zen_cv_sheer': 100,  'zen_cv_curtain': 100, 'unlabeled': 100},
                              'sleep':   {'zen_cv_blackout': 0,   'zen_cv_sheer': 0,   'zen_cv_curtain': 0,   'unlabeled': 0},
                              'privacy': {'zen_cv_blackout': 0,   'zen_cv_sheer': 80,  'zen_cv_curtain': 100, 'unlabeled': 0},
                              'natural': {'zen_cv_blackout': 100,  'zen_cv_sheer': 100,  'zen_cv_curtain': 100, 'unlabeled': 100}
                            } -%}
                            {{ scenes.get(_scene, {}) }}
                          _scene_tilt_pos: >-
                            {%- set tilts = {'movie': 0, 'work': 100, 'morning': 100, 'sleep': 0, 'privacy': 45, 'natural': 100} -%}
                            {{ tilts.get(_scene, -1) | int(-1) }}
                          _area_covers: >-
                            {{ area_entities(_room_resolved) | select('match', 'cover\\.') | list }}
                          _vent_list: "{{ label_entities('zen_cv_vent') | list }}"

                      # Live door/window state — advisory for privacy scene
                      - variables:
                          _cs_open_sensors: >-
                            {%- set _contact_dc = ['door', 'window', 'opening'] -%}
                            {%- set ns = namespace(ids=[]) -%}
                            {%- for eid in area_entities(_room_resolved) | select('match', 'binary_sensor\\.') -%}
                              {%- set _dc = state_attr(eid, 'device_class') | default('', true) | lower -%}
                              {%- if _dc in _contact_dc and states(eid) == 'on' -%}{%- set ns.ids = ns.ids + [eid] -%}{%- endif -%}
                            {%- endfor -%}
                            {{ ns.ids }}

                      - variables:
                          _apply_list: >-
                            {%- set ns = namespace(items=[]) -%}
                            {%- set sp = _scene_positions -%}
                            {%- set stp = _scene_tilt_pos | int(-1) -%}
                            {%- set bl = label_entities('zen_cv_blackout') | list -%}
                            {%- set sl = label_entities('zen_cv_sheer') | list -%}
                            {%- set cl = label_entities('zen_cv_curtain') | list -%}
                            {%- set vl = _vent_list -%}
                            {%- for e in _area_covers -%}
                              {%- set _dc = state_attr(e, 'device_class') | default('', true) | string | lower -%}
                              {%- set _is_barrier = _dc in ['garage', 'door', 'gate'] -%}
                              {%- set _is_vent = e in vl -%}
                              {%- if not _is_barrier and (not _is_vent or _include_vents) -%}
                                {%- if _is_vent -%}
                                  {%- set _role = 'zen_cv_vent' -%}
                                {%- elif e in bl -%}
                                  {%- set _role = 'zen_cv_blackout' -%}
                                {%- elif e in sl -%}
                                  {%- set _role = 'zen_cv_sheer' -%}
                                {%- elif e in cl -%}
                                  {%- set _role = 'zen_cv_curtain' -%}
                                {%- else -%}
                                  {%- set _role = 'unlabeled' -%}
                                {%- endif -%}
                                {%- set _tgt = sp.get(_role, sp.get('unlabeled', 100)) | int(100) -%}
                                {%- set _feat = state_attr(e, 'supported_features') | int(0) -%}
                                {%- set _tilt_ok = (_feat // 128) % 2 == 1 -%}
                                {%- set _tp = stp if (_tilt_ok and stp >= 0) else -1 -%}
                                {%- set ns.items = ns.items + [{'entity_id': e, 'role': _role, 'position': _tgt, 'tilt_supported': _tilt_ok, 'tilt_position': _tp}] -%}
                              {%- endif -%}
                            {%- endfor -%}
                            {{ ns.items }}

                      - if: "{{ not _dry_run and _apply_list | length > 0 }}"
                        then:
                          - repeat:
                              for_each: "{{ _apply_list }}"
                              sequence:
                                - choose:
                                    - conditions: "{{ repeat.item.position == 0 }}"
                                      sequence:
                                        - action: cover.close_cover
                                          continue_on_error: true
                                          target:
                                            entity_id: "{{ repeat.item.entity_id }}"
                                    - conditions: "{{ repeat.item.position == 100 }}"
                                      sequence:
                                        - action: cover.open_cover
                                          continue_on_error: true
                                          target:
                                            entity_id: "{{ repeat.item.entity_id }}"
                                  default:
                                    - action: cover.set_cover_position
                                      continue_on_error: true
                                      target:
                                        entity_id: "{{ repeat.item.entity_id }}"
                                      data:
                                        position: "{{ repeat.item.position }}"
                                - if: "{{ repeat.item.tilt_position >= 0 }}"
                                  then:
                                    - action: cover.set_cover_tilt_position
                                      continue_on_error: true
                                      target:
                                        entity_id: "{{ repeat.item.entity_id }}"
                                      data:
                                        tilt_position: "{{ repeat.item.tilt_position }}"

                      - if: "{{ not _dry_run and _apply_list | length > 0 }}"
                        then:
                          - action: script.zen_dojotools_event_emitter
                            continue_on_error: true
                            data:
                              mode: emit
                              component: covers
                              kind: cover_scene_applied
                              severity: info
                              summary: >-
                                scene={{ _scene }} applied to {{ _apply_list | length }}
                                cover(s) in {{ _room_resolved }} via zen_dojotools_covers.
                              metadata:
                                scene: "{{ _scene }}"
                                room: "{{ _room_resolved }}"
                                applied: "{{ _apply_list | map(attribute='entity_id') | list }}"
                                caller_token: "{{ _caller_token }}"

                      - variables:
                          result:
                            status: ok
                            mode: scene_set
                            scene: "{{ _scene }}"
                            room: "{{ _room_resolved }}"
                            dry_run: "{{ _dry_run }}"
                            applied_count: "{{ _apply_list | length }}"
                            tilt_applied_count: "{{ _apply_list | selectattr('tilt_supported') | list | length }}"
                            scene_tilt_pos: "{{ _scene_tilt_pos | int(-1) if _scene_tilt_pos | int(-1) >= 0 else none }}"
                            applied: "{{ _apply_list }}"
                            vents_included: "{{ _include_vents }}"
                            privacy_advisory: >-
                              {{ 'WARNING: ' + (_cs_open_sensors | count | string) + ' sensor(s) show open/active — privacy scene set but physical openings may compromise privacy.'
                                 if (_scene == 'privacy' and _cs_open_sensors | count > 0) else none }}
                            open_sensors_in_area: "{{ _cs_open_sensors if _scene == 'privacy' else none }}"
                            caller_token: "{{ _caller_token }}"

        default:
          - variables:
              result:
                status: error
                error: unknown_mode
                valid_modes: [discover, set, scene_set, setup, help, tool_manifest]
                received: "{{ _mode }}"
                caller_token: "{{ _caller_token }}"

      # ═══════════════════════════════════════════════════════════════════════
      # SINGLE EXIT — envelope() wrap (Zammad #10297)
      # ═══════════════════════════════════════════════════════════════════════
      - variables:
          _envelope_raw: >-
            {%- import 'zenos_ai/zen_os_1.jinja' as OS -%}
            {{- OS.envelope(
              status='success',
              mode=_mode,
              result=result,
              tool='zen_dojotools_covers',
              caller_token=_caller_token
            ) -}}
      - variables:
          _envelope: "{{ (_envelope_raw | from_json) if _envelope_raw is string else _envelope_raw }}"
      - stop: covers response
        response_variable: _envelope
