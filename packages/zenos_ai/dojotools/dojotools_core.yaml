###############################################################################
# ZenOS-AI DojoTools: Core Package
# Version: 4.5.7
#
# Scripts:
#   zen_dojotools_filecabinet_gc — Cabinet GC: hide/delete/recycle/unhide lifecycle (v4.5.x)
#
# SETUP:
#   No secrets or additional configuration required.
#   Kata cabinet resolves via sensor.zen_kata_cabinet_resolved (health stack).
#   Fallback: sensor.zen_kata_storage_cabinet.
#
# USED BY:
#   automation.zen_dojotools_scheduler → Kata GC branch (daily_midnight trigger)
#
# MCP EXPOSURE:
#   zen_dojotools_filecabinet_gc — expose to conversation agent (maintenance utility)
#
# PROTECTION RULES (zen_dojotools_filecabinet_gc):
#   1. Keys starting with _ or . — always protected (system convention)
#   2. Explicit named list — AI_Cabinet_VolumeInfo, zen_template, zen_summary,
#      kata_template, kata_structure (supersummary schema + prompt drawer)
#   3. All other drawers subject to TTL (max_age_hours, default 24h)
#
# === UAT PASS — 2026-03-03 ===
# Auditor: Claude (Anthropic, Sonnet 4.6)
# HALMark: 0.9.10-draft — PASS Level 3 (Steward Safe) — 13/14 PASS, 1 KNOWN BEHAVIOR
# UAT Cases: 7/7 PASS
#
# zen_dojotools_filecabinet_gc:
#   dry_run=true, stale present → would_evict populated, nothing deleted ✓
#   dry_run=true, clean cabinet → would_evict=[], kept=13, protected=5 ✓
#   dry_run=false, clean cabinet → status=complete, evicted=0, supersummary_triggered=false ✓
#   protected key audit → AI_Cabinet_VolumeInfo, zen_template, zen_summary,
#     kata_template, kata_structure all shielded; prefix rule (_/.) confirmed ✓
#   ghost shadow (zen_dojotools_filecabinet_gc.yaml) found + removed → correct script runs ✓
#   cabinet entity resolution → sensor.zen_kata_cabinet_resolved → correct entity ✓
#   config check → go; restart → clean ✓
#
# Live verified (session 2026-03-03):
#   dry_run=true → {would_evict_count: 0, kept_count: 13, protected_count: 5} ✓
#   dry_run=false → {status: complete, evicted_count: 0, supersummary_triggered: false} ✓
#
# KNOWN BEHAVIOR:
#   all_drawers references kata_entity as a sibling key in the same variables step.
#   Works correctly in all tested scenarios. Flag for review at migration time.
#
# PENDING LIVE VERIFICATION (no stale drawers available at UAT time):
#   - Actual eviction path (delete loop + filecabinet response)
#   - post_supersummary=true with evictions (supersummary chain fires)
#   - max_age_hours custom value
#   - volume_entity_id override
# ==============================
###############################################################################

script:

  zen_dojotools_filecabinet_gc:
    alias: Zen DojoTools FileCabinet GC
    description: >-
      Cabinet garbage collector (v4.5.x). Implements the hide/delete/recycle/unhide
      lifecycle for drawers using meta.expires_after, meta.no_autoexpire, and
      meta.no_autorecycle. Visible drawers past expiry are hidden (foo → .foo).
      Already-hidden drawers past expiry are hard-deleted. Recycle hides a drawer
      and sets expiry to now+24h. Unhide promotes a hidden drawer back to visible.
      Also supports legacy max_age_hours timestamp eviction on the kata cabinet.
      Protected system drawers (_prefix) are never touched. Supports dry_run.
    mode: single
    icon: mdi:delete-clock
    fields:
      action_type:
        name: Action
        description: >-
          gc (default) — auto-scan and process all drawers by expiry metadata.
          recycle — hide a specific drawer and set expiry to now+24h.
          hide — hide a specific drawer (no expiry change).
          unhide — promote a hidden .drawer back to visible.
        required: false
        default: gc
        selector:
          select:
            options:
              - gc
              - recycle
              - hide
              - unhide
      key:
        name: Drawer Key
        description: Required for recycle/hide/unhide actions. The visible drawer name (without leading dot).
        required: false
        selector:
          text:
      dry_run:
        name: Dry Run
        description: Report what would happen without making changes. gc mode only.
        required: false
        default: false
        selector:
          boolean:
      max_age_hours:
        name: Max Age (hours)
        description: Legacy timestamp-based eviction for kata drawers without expires_after. Default 24.
        required: false
        default: 24
        selector:
          number:
            min: 1
            max: 168
            mode: box
      post_supersummary:
        name: Post Supersummary (deprecated)
        description: >-
          Deprecated — GC now always emits a summary_force event after eviction.
          Scheduler + drain router handle re-dispatch. Field ignored.
        required: false
        default: true
        selector:
          boolean:
      volume_entity_id:
        name: Volume
        description: Target cabinet entity. Defaults to kata cabinet.
        required: false
        selector:
          entity:
            filter:
            - domain: sensor
      caller_token:
        name: Caller Token
        description: Opaque token passed through by the caller for correlation. Not interpreted by this script.
        required: false
        selector:
          text:

    sequence:

      # --------------------------------------------------------------
      # Always normalize User/AI inputs so we don't have to react JIT
      # --------------------------------------------------------------
      - variables:
          caller_token: "{{- caller_token | default('') -}}"

      # ── 1. Resolve inputs ──────────────────────────────────────────────────
      - alias: Resolve inputs
        variables:
          gc_action: "{{ action_type | default('gc') }}"
          dry_run: "{{ dry_run | default(false) | bool }}"
          post_supersummary: "{{ post_supersummary | default(true) | bool }}"
          max_age_hours: "{{ max_age_hours | default(24) | int }}"
          target_key: "{{ key | default('') | trim }}"
          kata_entity: >-
            {%- if volume_entity_id is defined and volume_entity_id not in ['', none] -%}
              {{ volume_entity_id }}
            {%- else -%}
              {%- set resolved = states('sensor.zen_kata_cabinet_resolved') -%}
              {%- if resolved not in ['', 'unknown', 'unavailable', none] -%}
                {{ resolved }}
              {%- else -%}
                sensor.zen_kata_storage_cabinet
              {%- endif -%}
            {%- endif -%}
          protected_explicit:
            - AI_Cabinet_VolumeInfo
            - zen_template
            - zen_summary
            - kata_template
            - kata_structure
          all_drawers: "{{ state_attr(kata_entity, 'variables') | default({}, true) }}"

      # ── 2. Single-drawer actions: recycle / hide / unhide ─────────────────
      - alias: Recycle — hide drawer and set expires_after to now+24h
        if:
          - condition: template
            value_template: >-
              {{
                gc_action == 'recycle'
                and target_key != ''
                and target_key[:1] != '_'
                and target_key | lower not in protected_explicit | map('lower') | list
              }}
        then:
          - variables:
              src_data: "{{ all_drawers.get(target_key, {}) if all_drawers is mapping else {} }}"
              expiry_ts: "{{ (now() + timedelta(hours=24)).isoformat() }}"
              recycled_meta: >-
                {%- set m = src_data.get('meta', {}) if src_data is mapping else {} -%}
                {{ m | combine({'expires_after': expiry_ts}) }}
              recycled_entry: "{{ src_data | combine({'meta': recycled_meta}) if src_data is mapping else src_data }}"
          - event: set_variable_legacy
            event_data:
              key: ".{{ target_key }}"
              value: "{{ recycled_entry }}"
              volume_entity: "{{ kata_entity }}"
          - event: remove_variable_legacy
            event_data:
              key: "{{ target_key }}"
              volume_entity: "{{ kata_entity }}"
          - variables:
              final:
                status: complete
                action: recycle
                drawer: "{{ target_key }}"
                hidden_as: ".{{ target_key }}"
                expires_after: "{{ expiry_ts }}"
                caller_token: '{{ caller_token }}'
          - stop: recycle_complete
            response_variable: final

      - alias: Hide — rename drawer to .drawer
        if:
          - condition: template
            value_template: >-
              {{
                gc_action == 'hide'
                and target_key != ''
                and target_key[:1] != '_'
                and target_key | lower not in protected_explicit | map('lower') | list
              }}
        then:
          - variables:
              src_data: "{{ all_drawers.get(target_key, {}) if all_drawers is mapping else {} }}"
          - event: set_variable_legacy
            event_data:
              key: ".{{ target_key }}"
              value: "{{ src_data }}"
              volume_entity: "{{ kata_entity }}"
          - event: remove_variable_legacy
            event_data:
              key: "{{ target_key }}"
              volume_entity: "{{ kata_entity }}"
          - variables:
              final:
                status: complete
                action: hide
                drawer: "{{ target_key }}"
                hidden_as: ".{{ target_key }}"
                caller_token: '{{ caller_token }}'
          - stop: hide_complete
            response_variable: final

      - alias: Unhide — promote .drawer back to visible
        if:
          - condition: template
            value_template: >-
              {{
                gc_action == 'unhide'
                and target_key != ''
                and target_key[:1] != '_'
                and target_key | lower not in protected_explicit | map('lower') | list
              }}
        then:
          - variables:
              hidden_key: ".{{ target_key }}"
              src_data: "{{ all_drawers.get(hidden_key, {}) if all_drawers is mapping else {} }}"
          - event: set_variable_legacy
            event_data:
              key: "{{ target_key }}"
              value: "{{ src_data }}"
              volume_entity: "{{ kata_entity }}"
          - event: remove_variable_legacy
            event_data:
              key: ".{{ target_key }}"
              volume_entity: "{{ kata_entity }}"
          - variables:
              final:
                status: complete
                action: unhide
                drawer: "{{ target_key }}"
                restored_from: ".{{ target_key }}"
                caller_token: '{{ caller_token }}'
          - stop: unhide_complete
            response_variable: final

      # ── 3. Resolve cabinet list for GC scan ───────────────────────────────
      - alias: Resolve cabinet list
        variables:
          gc_cabinet_entities: >-
            {%- if volume_entity_id is defined and volume_entity_id not in ['', none] -%}
              {{ [volume_entity_id] }}
            {%- else -%}
              {%- import 'zenos_ai/library_index.jinja' as library_index -%}
              {%- set cabs_json = library_index.parse_index_command('AI Data Storage Cabinet') -%}
              {%- set fixed = cabs_json
                    | replace("['", '["')
                    | replace("']", '"]')
                    | replace("', '", '", "')
                    | trim -%}
              {%- set cabs = fixed | from_json | default([]) -%}
              {%- set sensors = states['sensor'] | map(attribute='entity_id') | list -%}
              {{ intersect(sensors, cabs) | list }}
            {%- endif -%}

      # ── 4. GC scan + execute: iterate all cabinets in series ──────────────
      - alias: GC scan and process all cabinets in series
        if:
          - condition: template
            value_template: "{{ gc_action == 'gc' }}"
        then:
          - repeat:
              for_each: "{{ gc_cabinet_entities }}"
              sequence:
                - variables:
                    current_cab: "{{ repeat.item }}"
                    cab_drawers: >-
                      {{ state_attr(current_cab, 'variables') | default({}, true) }}
                    explicit_lc: "{{ protected_explicit | map('lower') | list }}"
                    to_hide: >-
                      {%- set ns = namespace(out=[]) -%}
                      {%- if cab_drawers is mapping -%}
                        {%- for key, val in cab_drawers.items() -%}
                          {%- set is_system = key[:1] == '_' -%}
                          {%- set is_hidden = key[:1] == '.' -%}
                          {%- set is_protected = is_system or key | lower in explicit_lc -%}
                          {%- if not is_protected and not is_hidden and val is mapping -%}
                            {%- set meta = val.get('meta', {}) -%}
                            {%- set no_autoexpire = meta.get('no_autoexpire', false) -%}
                            {%- set exp_raw = meta.get('expires_after', '') | string | trim -%}
                            {%- if not no_autoexpire and exp_raw != '' -%}
                              {%- set exp_dt = exp_raw | as_datetime -%}
                              {%- if exp_dt is not none and now() > exp_dt -%}
                                {%- set ns.out = ns.out + [key] -%}
                              {%- endif -%}
                            {%- endif -%}
                          {%- endif -%}
                        {%- endfor -%}
                      {%- endif -%}
                      {{ ns.out }}
                    to_delete: >-
                      {%- set ns = namespace(out=[]) -%}
                      {%- if cab_drawers is mapping -%}
                        {%- for key, val in cab_drawers.items() -%}
                          {%- set is_hidden = key[:1] == '.' -%}
                          {%- set base_key = key[1:] if is_hidden else key -%}
                          {%- set is_protected = base_key | lower in explicit_lc -%}
                          {%- if is_hidden and not is_protected and val is mapping -%}
                            {%- set meta = val.get('meta', {}) -%}
                            {%- set exp_raw = meta.get('expires_after', '') | string | trim -%}
                            {%- if exp_raw != '' -%}
                              {%- set exp_dt = exp_raw | as_datetime -%}
                              {%- if exp_dt is not none and now() > exp_dt -%}
                                {%- set ns.out = ns.out + [key] -%}
                              {%- endif -%}
                            {%- endif -%}
                          {%- endif -%}
                        {%- endfor -%}
                      {%- endif -%}
                      {{ ns.out }}
                    stale_drawers: >-
                      {%- set ns = namespace(stale=[]) -%}
                      {%- if cab_drawers is mapping -%}
                        {%- for key, val in cab_drawers.items() -%}
                          {%- set is_protected = key[:1] in ['_', '.'] or key | lower in explicit_lc -%}
                          {%- if not is_protected and val is mapping -%}
                            {%- set meta = val.get('meta', {}) -%}
                            {%- set exp_raw = meta.get('expires_after', '') | string | trim -%}
                            {%- set no_autoexpire = meta.get('no_autoexpire', false) -%}
                            {%- if exp_raw == '' and not no_autoexpire -%}
                              {%- set ts_raw = val.get('timestamp', '') -%}
                              {%- if ts_raw != '' -%}
                                {%- set age_h = (now() - ts_raw | as_datetime).total_seconds() / 3600 -%}
                                {%- if age_h > max_age_hours -%}
                                  {%- set ns.stale = ns.stale + [key] -%}
                                {%- endif -%}
                              {%- endif -%}
                            {%- endif -%}
                          {%- endif -%}
                        {%- endfor -%}
                      {%- endif -%}
                      {{ ns.stale }}
                    _vol_info_raw: >-
                      {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                      {%- set _val = CABS.cabinet_drawer_value(current_cab, 'AI_Cabinet_VolumeInfo', {}) | from_json() -%}
                      {{ _val }}
                    _cab_flags: >-
                      {{ _vol_info_raw.get('flags', {}) }}
                    gc_flag_present: >-
                      {{ 'gc_eligible' in _cab_flags }}
                    gc_eligible: >-
                      {{ _cab_flags.get('gc_eligible', false) | bool }}
                - alias: Hide expired visible drawers (foo → .foo)
                  if:
                    - condition: template
                      value_template: "{{ not dry_run and gc_eligible and to_hide | length > 0 }}"
                  then:
                    - repeat:
                        for_each: "{{ to_hide }}"
                        sequence:
                          - variables:
                              _key: "{{ repeat.item }}"
                              _data: "{{ cab_drawers.get(_key, {}) }}"
                          - event: set_variable_legacy
                            event_data:
                              key: ".{{ _key }}"
                              value: "{{ _data }}"
                              volume_entity: "{{ current_cab }}"
                          - event: remove_variable_legacy
                            event_data:
                              key: "{{ _key }}"
                              volume_entity: "{{ current_cab }}"
                - alias: Delete expired hidden drawers (.foo → gone)
                  if:
                    - condition: template
                      value_template: "{{ not dry_run and gc_eligible and to_delete | length > 0 }}"
                  then:
                    - repeat:
                        for_each: "{{ to_delete }}"
                        sequence:
                          - event: remove_variable_legacy
                            event_data:
                              key: "{{ repeat.item }}"
                              volume_entity: "{{ current_cab }}"
                - alias: Evict legacy stale drawers (no expires_after, old timestamp)
                  if:
                    - condition: template
                      value_template: "{{ not dry_run and gc_eligible and stale_drawers | length > 0 }}"
                  then:
                    - repeat:
                        for_each: "{{ stale_drawers }}"
                        sequence:
                          - event: remove_variable_legacy
                            event_data:
                              key: "{{ repeat.item }}"
                              volume_entity: "{{ current_cab }}"
                - alias: Self-heal — stamp gc_eligible default if absent from header
                  if:
                    - condition: template
                      value_template: "{{ not dry_run and not gc_flag_present }}"
                  then:
                    - variables:
                        _new_flags: >-
                          {{ _cab_flags | combine({'gc_eligible': false}) if _cab_flags is mapping else {'gc_eligible': false} }}
                        _new_vol_info: >-
                          {{ _vol_info_raw | combine({'flags': _new_flags}) if _vol_info_raw is mapping else {'flags': _new_flags} }}
                    - event: set_variable_legacy
                      event_data:
                        key: AI_Cabinet_VolumeInfo
                        value: "{{ _new_vol_info | tojson }}"
                        set_timestamp: false
                        volume_entity: "{{ current_cab }}"

      # ── 4b. Priority inject GC — per-entry scan of _zen_priority_inject ────────
      # _-prefixed drawers are protected from the normal GC loop above.
      # This step specifically reads inside _zen_priority_inject to validate,
      # clamp, and evict stale/invalid entries. Runs only on full gc action.
      - alias: Priority inject GC — validate, clamp, and evict priority inject slot
        if:
          - condition: template
            value_template: "{{ gc_action == 'gc' and not dry_run }}"
        then:
          - variables:
              _pi_hh: "{{ states('sensor.zen_default_household_cabinet_resolved') }}"
          - if:
              - condition: template
                value_template: >-
                  {{ _pi_hh not in ['', 'unavailable', 'unknown'] }}
            then:
              - action: script.zen_dojotools_filecabinet
                data:
                  action_type: read
                  volume_entity_id: "{{ _pi_hh }}"
                  key: _zen_priority_inject
                  force_action: true
                response_variable: _pi_fc_read
              - variables:
                  _pi_slot_json: >-
                    {%- set r = _pi_fc_read.get('result', '{}') -%}
                    {%- set r = r | from_json if r is string else (r if r is mapping else {}) -%}
                    {%- set raw = r.get('_zen_priority_inject', {}) -%}
                    {%- set raw = raw if raw is mapping else (raw | from_json if raw is string else {}) -%}
                    {{ raw.get('value', raw) | tojson if raw is mapping else '{}' }}
              - variables:
                  _pi_final: >-
                    {%- set inject = _pi_slot_json if _pi_slot_json is mapping else (_pi_slot_json | from_json if _pi_slot_json is string else {}) -%}
                    {%- set inject = inject if inject is mapping else {} -%}
                    {%- set ns = namespace(out={}) -%}
                    {%- for pid, entry in inject.items() -%}
                      {%- if entry is mapping -%}
                        {%- set urg = entry.get('urgency', '') -%}
                        {%- set exp_s = entry.get('expires', '') | string | trim -%}
                        {%- set since_s = entry.get('since', '') | string | trim -%}
                        {%- set summary = entry.get('summary', '') | string | trim -%}
                        {%- if urg in ['critical', 'urgent'] and exp_s != '' and since_s != '' -%}
                          {%- set exp_dt = exp_s | as_datetime -%}
                          {%- if exp_dt is not none and now() < exp_dt -%}
                            {%- set max_exp = (now() + timedelta(hours=24)).isoformat() -%}
                            {%- set exp_clamped = max_exp if exp_s > max_exp else exp_s -%}
                            {%- set clean_sum = summary[:254] ~ '…' if summary | length > 255 else summary -%}
                            {%- set ents = entry.get('entities', []) -%}
                            {%- set ents = ents[:3] if ents is sequence else [] -%}
                            {%- set clean_entry = {
                              'summary': clean_sum, 'urgency': urg,
                              'since': since_s, 'expires': exp_clamped, 'entities': ents
                            } -%}
                            {%- set ns.out = dict(ns.out, **{pid: clean_entry}) -%}
                          {%- endif -%}
                        {%- endif -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {%- if ns.out | length > 5 -%}
                      {%- set ns2 = namespace(scored=[]) -%}
                      {%- for pid, entry in ns.out.items() -%}
                        {%- set tier = '0' if entry.urgency == 'urgent' else '1' -%}
                        {%- set ns2.scored = ns2.scored + [{'k': tier ~ '_' ~ entry.since, 'pid': pid, 'entry': entry}] -%}
                      {%- endfor -%}
                      {%- set kept = ns2.scored | sort(attribute='k') | list -%}
                      {%- set kept = kept[-5:] -%}
                      {%- set ns3 = namespace(d={}) -%}
                      {%- for item in kept -%}
                        {%- set ns3.d = dict(ns3.d, **{item.pid: item.entry}) -%}
                      {%- endfor -%}
                      {{ ns3.d | tojson }}
                    {%- else -%}
                      {{ ns.out | tojson }}
                    {%- endif -%}
              - if:
                  - condition: template
                    value_template: "{{ _pi_slot_json != _pi_final }}"
                then:
                  - action: script.zen_dojotools_filecabinet
                    data:
                      action_type: update
                      volume_entity_id: "{{ _pi_hh }}"
                      key: _zen_priority_inject
                      value: "{{ _pi_final }}"
                      force_action: true

      # ── 4c. Active alerts GC — TTL sweep of _zen_active_alerts ────────────────
      # _-prefixed drawers are protected from the normal GC loop above.
      # This step reads _zen_active_alerts, finds entries whose expires_at is in
      # the past, and fires alert_clear for each — the AlertManager clear path
      # handles notification dismissal, priority inject cleanup, and key removal.
      # Handles keys orphaned by HA restarts that abort the caller's post-fire
      # delay. Permanent alerts (no expires_at) are never touched.
      - alias: Active alerts GC — fire alert_clear for expired _zen_active_alerts entries
        if:
          - condition: template
            value_template: "{{ gc_action == 'gc' and not dry_run }}"
        then:
          - variables:
              _aa_hh: "{{ states('sensor.zen_default_household_cabinet_resolved') }}"
          - if:
              - condition: template
                value_template: >-
                  {{ _aa_hh not in ['', 'unavailable', 'unknown'] }}
            then:
              - action: script.zen_dojotools_filecabinet
                data:
                  action_type: read
                  volume_entity_id: "{{ _aa_hh }}"
                  key: _zen_active_alerts
                  force_action: true
                response_variable: _aa_fc_read
              - variables:
                  _aa_alerts: >-
                    {%- set r = _aa_fc_read.get('result', '{}') -%}
                    {%- set r = r | from_json if r is string else (r if r is mapping else {}) -%}
                    {%- set raw = r.get('_zen_active_alerts', {}) -%}
                    {%- set raw = raw if raw is mapping else (raw | from_json if raw is string else {}) -%}
                    {{ raw.get('value', raw) if raw is mapping else {} }}
              - variables:
                  _aa_expired: >-
                    {%- set ns = namespace(keys=[]) -%}
                    {%- for k, v in _aa_alerts.items() if v is mapping -%}
                      {%- set exp = v.get('expires_at', '') | string | trim -%}
                      {%- if exp != '' -%}
                        {%- set exp_dt = exp | as_datetime -%}
                        {%- if exp_dt is not none and now() > exp_dt -%}
                          {%- set ns.keys = ns.keys + [k] -%}
                        {%- endif -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {{ ns.keys }}
              - repeat:
                  for_each: "{{ _aa_expired }}"
                  sequence:
                    - event: zen_event
                      event_data:
                        event:
                          kind: alert_clear
                          alert_key: "{{ repeat.item }}"

      # ── 4d. Postman log GC — TTL sweep of zen_postman_log ─────────────────────
      # zen_postman_log is a list in the kata cabinet. Each entry has timestamp
      # and ttl_s. GC evicts entries older than ttl_s, marks orphaned pending
      # entries (>300s old) as timeout, and caps the list at 50.
      - alias: Postman log GC — evict stale entries, mark orphaned pending as timeout
        if:
          - condition: template
            value_template: "{{ gc_action == 'gc' and not dry_run }}"
        then:
          - variables:
              _pl_kata: "{{ states('sensor.zen_kata_cabinet_resolved') }}"
          - if:
              - condition: template
                value_template: >-
                  {{ _pl_kata not in ['', 'unavailable', 'unknown'] }}
            then:
              - action: script.zen_dojotools_filecabinet
                data:
                  action_type: read
                  volume_entity_id: "{{ _pl_kata }}"
                  key: zen_postman_log
                  force_action: true
                response_variable: _pl_fc_read
              - variables:
                  _pl_raw_list: >-
                    {%- set r = _pl_fc_read.get('result', '{}') -%}
                    {%- set r = r | from_json if r is string else (r if r is mapping else {}) -%}
                    {%- set raw = r.get('zen_postman_log', none) -%}
                    {%- set raw = raw if raw is mapping else (raw | from_json if raw is string else none) -%}
                    {%- set log_str = raw.get('value', raw) if raw is mapping else (raw if raw is string else '[]') -%}
                    {%- set log_list = log_str | from_json if log_str is string else (log_str if log_str is sequence else []) -%}
                    {{ log_list | tojson }}
              - variables:
                  _pl_cleaned: >-
                    {%- set now_ts = as_timestamp(now()) | float -%}
                    {%- set entries = _pl_raw_list if _pl_raw_list is sequence and _pl_raw_list is not string else (_pl_raw_list | from_json if _pl_raw_list is string else []) -%}
                    {%- set entries = entries if entries is sequence else [] -%}
                    {%- set ns = namespace(out=[]) -%}
                    {%- for entry in entries if entry is mapping -%}
                      {%- set ts = entry.get('timestamp', '') | string | trim -%}
                      {%- set ttl = entry.get('ttl_s', 86400) | int -%}
                      {%- set status = entry.get('status', 'dispatched') -%}
                      {%- if ts != '' -%}
                        {%- set ts_val = as_timestamp(ts) -%}
                        {%- set age_s = (now_ts - ts_val) | int if ts_val is not none else 999999 -%}
                        {%- if age_s < ttl -%}
                          {%- if status == 'pending' and age_s > 300 -%}
                            {%- set entry = dict(entry, **{'status': 'timeout', 'ack_timed_out': true, 'ttl_s': 86400}) -%}
                          {%- endif -%}
                          {%- set ns.out = ns.out + [entry] -%}
                        {%- endif -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {{ ns.out[-10:] | tojson }}
              - if:
                  - condition: template
                    value_template: "{{ _pl_raw_list != _pl_cleaned }}"
                then:
                  - action: script.zen_dojotools_filecabinet
                    data:
                      action_type: update
                      volume_entity_id: "{{ _pl_kata }}"
                      key: zen_postman_log
                      value: >-
                        {{ _pl_cleaned | tojson if _pl_cleaned is sequence and _pl_cleaned is not string else _pl_cleaned }}
                      force_action: true

      # ── 5. Post-prune scheduler nudge ────────────────────────────────────────
      # GC doesn't decide what to re-summarize — it just announces what it collected.
      # Drain router sees evicted drawers as maximally stale (age_min: 9999) and
      # bubbles them to the top of the priority queue on the next scheduler run.
      - alias: Broadcast kata_gc_complete + nudge scheduler
        if:
          - condition: template
            value_template: "{{ gc_action == 'gc' and not dry_run }}"
        then:
          - event: zen_event
            event_data:
              event:
                kind: kata_gc_complete
                severity: info
                summary: >-
                  FileCabinet GC complete — evicted kata drawers are now stale
                  and will be prioritized on next scheduler run.
                metadata:
                  cabinets_scanned: "{{ gc_cabinet_entities | default([]) }}"
                  caller_token: '{{ caller_token }}'
          - event: zen_event
            event_data:
              event:
                kind: summary_force
                component: ''

      # ── 6. Report ──────────────────────────────────────────────────────────
      - alias: Build GC report
        variables:
          final:
            status: "{{ 'dry_run' if dry_run else 'complete' }}"
            action: "{{ gc_action }}"
            cabinets_scanned: "{{ gc_cabinet_entities | default([]) }}"
            max_age_hours: "{{ max_age_hours }}"
            dry_run: "{{ dry_run }}"
            scheduler_nudged: "{{ gc_action == 'gc' and not dry_run }}"
            caller_token: '{{ caller_token }}'

      - stop: filecabinet_gc_complete
        response_variable: final
