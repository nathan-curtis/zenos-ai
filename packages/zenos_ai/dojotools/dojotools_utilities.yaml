        minutes: 0
        seconds: '{{ duration | default(15) }} '
        milliseconds: 0
    - variables:
        _wait_response:
          status: success
          message: '{{ duration }} second wait complete'
          caller_token: '{{ caller_token }}'
    - stop: done
      response_variable: _wait_response
    fields:
      mode:
        description: "Pass tool_manifest to get self-description."
        required: false
        selector:
          select:
            options:
              - tool_manifest
      duration:
        selector:
          number:
            min: 1
            max: 120
            step: 1
        name: Duration
        description: Duration to wait in seconds. Default, 15 seconds.
        default: 15
        required: true
      caller_token:
        name: Caller Token
        description: Opaque token passed through by the caller for correlation. Not interpreted by this script.
        required: false
        selector:
          text:
    alias: Zen DojoTools Wait
    description: 'Use this tool to insert a timed delay of 1–120 seconds (default: 15)
      between actions in a conversation or chained tool call. Useful for narrative pacing,
      suspense, or waiting on a timed task. After the delay, the conversation or sequence
      resumes automatically. Example: ''Wait 30 seconds, then speak'' or ''Pause 10
      seconds, then continue.'' Returns a short message: ''Waited X second(s).'' Use
      for dramatic effect or execution timing.'
    icon: mdi:home-clock

  dojotools_volume_auditor:
    alias: DojoTools Volume Auditor
    mode: parallel
    icon: mdi:clipboard-text-search-outline
    description: 'Scans known Cabinet Volumes, filters by labels, and reports which
      are inaccessible with reasons. Does NOT modify anything. Output is a JSON object:
      { scanned: n, accessible: [...], issues: {...} }

      '
    fields:
      required_labels:
        description: Comma- or space-separated labels to match (case-insensitive). Leave
          blank for any.
        selector:
          text:
            multiple: false
        required: true
        default: cabinet
      require_all:
        description: Require ALL labels to match (otherwise ANY).
        selector:
          boolean:
        default: false
      include_hidden:
        description: Include hidden/system volumes in scan.
        selector:
          boolean:
        default: false
      caller_token:
        name: Caller Token
        description: Opaque token passed through by the caller for correlation. Not interpreted by this script.
        required: false
        selector:
          text:
    sequence:
    # --------------------------------------------------------------
    # Always normalize User/AI inputs so we don't have to react JIT
    # --------------------------------------------------------------
    - variables:
        caller_token: "{{- caller_token | default('') -}}"

    - variables:
        _labels_in: >-
          {%- set raw = (required_labels | default('')) | replace(',', ' ') | trim -%}
          {%- set toks = raw | regex_findall('[^\s]+') -%}
          {{ toks | map('lower') | list | tojson }}
        _require_all: '{{ require_all | default(false) }}'
        _include_hidden: '{{ include_hidden | default(false) }}'
        _filtered: >-
          {%- set cabs = label_entities('zen_cabinet') | select('match', '^sensor\.') | list -%}
          {%- set ns = namespace(out=[]) -%}
          {%- for e in cabs -%}
            {%- set vars = state_attr(e, 'variables') -%}
            {%- if vars is mapping -%}
              {%- set vi_raw = vars.get('AI_Cabinet_VolumeInfo') -%}
              {%- set vi = vi_raw.get('value', vi_raw) if vi_raw is mapping else none -%}
              {%- if vi is mapping -%}
                {%- set hidden = vi.get('flags', {}).get('hidden', false) or e.startswith('sensor._') -%}
                {%- if (not hidden) or _include_hidden -%}
                  {%- set labels1 = vi.get('entity_labels', []) | map('lower') | list -%}
                  {%- set li_raw = vars.get('_label_index') -%}
                  {%- set li = li_raw.get('value', li_raw) if li_raw is mapping else {} -%}
                  {%- set labels2 = li.keys() | list | map('lower') | list if li is mapping else [] -%}
                  {%- set labset = (labels1 + labels2) | unique | list -%}
                  {%- if _labels_in | length == 0 -%}
                    {%- set ok = true -%}
                  {%- elif _require_all -%}
                    {%- set ok = (_labels_in | difference(labset) | length == 0) -%}
                  {%- else -%}
                    {%- set ok = (_labels_in | select('in', labset) | list | length > 0) -%}
                  {%- endif -%}
                  {%- if ok -%}{%- set ns.out = ns.out + [e] -%}{%- endif -%}
                {%- endif -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
          {{ ns.out | tojson }}
    - variables:
        _accessible: >-
          {%- set ns = namespace(acc=[]) -%}
          {%- for e in _filtered -%}
            {%- if states(e) not in ['unknown', 'unavailable'] -%}
              {%- set ns.acc = ns.acc + [e] -%}
            {%- endif -%}
          {%- endfor -%}
          {{ ns.acc | tojson }}
        _issues: >-
          {%- set ns = namespace(iss={}) -%}
          {%- for e in _filtered -%}
            {%- if states(e) in ['unknown', 'unavailable'] -%}
              {%- set ns.iss = ns.iss | combine({e: {'reason': states(e)}}) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ ns.iss | tojson }}
        _report:
          scanned: "{{ _filtered | length }}"
          accessible: "{{ _accessible | tojson }}"
          issues: "{{ _issues | tojson }}"
    - variables:
        final_response:
          status: success
          message: Volume audit complete
          result: '{{ _report }}'
          caller_token: '{{ caller_token }}'
    - stop: done
      response_variable: final_response

  # ============================================================================
  # zen_dojotools_select_control
  # Migrated from intent_script/select_control v1.0.0 — 2026-04-08
  # ============================================================================
  zen_dojotools_select_control:
    alias: Zen DojoTools Select Control
    mode: parallel
    max: 10
    description: >-
      zen_dojotools_select_control (v5.1.0)

      CANONICAL HA DOMAIN TOOL — select / input_select
      Preferred over select_control intent and HA MCP built-ins for this domain.
      Fall back to HA built-ins ONLY if this tool is confirmed non-functional.

      GET+SET for select and input_select entities. Resolves shorthand names or
      full entity_ids. Validates option against supported list before applying.
      Omit option (or pass get=true) to read current state and options.

      Examples:
        Read:       { "name": "office_occupancy" }
        Set:        { "name": "office_occupancy", "option": "Occupied" }
        Full id:    { "name": "input_select.master_bedroom_occupancy", "option": "Asleep" }
        Force read: { "name": "office_occupancy", "get": "true" }

    fields:
      name:
        name: Entity
        description: select or input_select entity_id, or shorthand name
        required: true
        selector:
          text:

      option:
        name: Option
        description: Option value to set. Omit to read current state.
        required: false
        selector:
          text:

      get:
        name: Read-only
        description: Pass any truthy value to force read-only mode even if option is set.
        required: false
        selector:
          text:

      mode:
        description: "Pass tool_manifest to get self-description."
        required: false
        selector:
          select:
            options:
              - tool_manifest

      caller_token:
        name: Caller Token
        description: Opaque audit token echoed in response.
        required: false
        selector:
          text:

    sequence:
      # ── Input normalization ────────────────────────────────────────────────
      - variables:
          _tm_mode: "{{ mode | default('') | lower }}"
      - choose:
        - conditions: "{{ _tm_mode == 'tool_manifest' }}"
          sequence:
          - variables:
              result: >-
                {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
                {{ MF.tool_manifest(
                    tool='zen_dojotools_select_control',
                    display_name='Select Control',
                    tier='dojotools',
                    version='1.0.0',
                    health={'configured': true, 'status': 'ok', 'notes': []},
                    required_labels=['dojotools'],
                    optional_labels=['input_select','select'],
                    consumes=['entity_name_or_id'],
                    returns=['select_state'],
                    icon='mdi:form-select',
                    color='blue-grey',
                    stripe=3,
                    impact='soft',
                    mcp_exposed=true,

                    caller_token=caller_token | default('')
                ) | from_json }}
          - stop: tool_manifest
            response_variable: result
      - variables:
          raw: "{{ name | string | trim }}"
          opt_raw: "{{ option | default(none, true) }}"
          get_raw: "{{ get | default(none, true) }}"
          _token: "{{ caller_token | default('', true) }}"

      # ── Entity resolution ─────────────────────────────────────────────────
      - variables:
          _slug: "{{ raw | replace(':', '') | slugify }}"
          _input_ent: "input_select.{{ _slug }}"
          _select_ent: "select.{{ _slug }}"
          _entity_id: >-
            {%- if '.' in raw -%}
              {{ raw }}
            {%- elif states(_input_ent) not in ['unknown', 'unavailable'] -%}
              {{ _input_ent }}
            {%- elif states(_select_ent) not in ['unknown', 'unavailable'] -%}
              {{ _select_ent }}
            {%- else -%}
              INVALID
            {%- endif -%}
          _domain: >-
            {%- if _entity_id.startswith('input_select.') -%}input_select
            {%- elif _entity_id.startswith('select.') -%}select
            {%- else -%}invalid{%- endif -%}

      - if:
          - condition: template
            value_template: "{{ _domain == 'invalid' }}"
        then:
          - variables:
              result:
                ok: false
                tool: zen_dojotools_select_control
                caller_token: "{{ _token }}"
                error: invalid_entity
                input: "{{ raw }}"
          - stop: error
            response_variable: result

      # ── Fetch current state + options ─────────────────────────────────────
      - variables:
          _state: "{{ states(_entity_id) }}"
          _options: "{{ state_attr(_entity_id, 'options') | default([]) }}"

      # ── Read-only path ────────────────────────────────────────────────────
      - if:
          - condition: template
            value_template: "{{ get_raw is not none or opt_raw is none }}"
        then:
          - variables:
              result:
                ok: true
                tool: zen_dojotools_select_control
                caller_token: "{{ _token }}"
                mode: read
                entity_id: "{{ _entity_id }}"
                domain: "{{ _domain }}"
                state: "{{ _state }}"
                options: "{{ _options }}"
          - stop: read
            response_variable: result

      # ── Option validation ─────────────────────────────────────────────────
      - if:
          - condition: template
            value_template: "{{ opt_raw not in _options }}"
        then:
          - variables:
              result:
                ok: false
                tool: zen_dojotools_select_control
                caller_token: "{{ _token }}"
                error: invalid_option
                entity_id: "{{ _entity_id }}"
                requested: "{{ opt_raw }}"
                supported: "{{ _options }}"
          - stop: invalid_option
            response_variable: result

      # ── Apply option ──────────────────────────────────────────────────────
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ _domain == 'input_select' }}"
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: "{{ _entity_id }}"
                data:
                  option: "{{ opt_raw }}"
          - conditions:
              - condition: template
                value_template: "{{ _domain == 'select' }}"
            sequence:
              - action: select.select_option
                target:
                  entity_id: "{{ _entity_id }}"
                data:
                  option: "{{ opt_raw }}"

      # ── Response ──────────────────────────────────────────────────────────
      - variables:
          result:
            ok: true
            tool: zen_dojotools_select_control
            caller_token: "{{ _token }}"
            mode: set
            entity_id: "{{ _entity_id }}"
            domain: "{{ _domain }}"
            previous: "{{ _state }}"
            state: "{{ opt_raw }}"
            options: "{{ _options }}"
      - stop: set
        response_variable: result

  # ============================================================================
  # zen_dojotools_number
  # Migrated from intent_script/numeric_set_value v1.0.0 — 2026-04-08
  # ============================================================================
  zen_dojotools_number:
    alias: Zen DojoTools Number
    mode: parallel
    max: 10
    description: >-
      zen_dojotools_number (v5.1.0)

      CANONICAL HA DOMAIN TOOL — number / input_number
      Preferred over numeric_set_value intent and HA MCP built-ins for this domain.
      Fall back to HA built-ins ONLY if this tool is confirmed non-functional.

      GET+SET+arithmetic for number and input_number entities. Resolves shorthand
      or full entity_ids. Enforces entity min/max. Optional int/float cast.
      Operations: set, add, sub, mul, div, inc, dec.

      Examples:
        Read:      { "name": "ninja_governor" }
        Set:       { "name": "ninja_governor", "value": 60 }
        Add:       { "name": "Office Brightness", "operation": "add", "amount": 10 }
        Increment: { "name": "ninja_governor", "operation": "inc" }
        Div+cast:  { "name": "ninja_governor", "operation": "div", "amount": 2, "cast": "int" }

    fields:
      name:
        name: Entity
        description: number or input_number entity_id, or shorthand name
        required: true
        selector:
          text:

      value:
        name: Value
        description: Direct value to set (used when operation=set or omitted)
        required: false
        selector:
          number:
            min: -1000000000
            max: 1000000000
            step: 0.001
            mode: box

      operation:
        name: Operation
        description: Math operation to perform. Default is set.
        required: false
        selector:
          select:
            options:
              - set
              - add
              - sub
              - mul
              - div
              - inc
              - dec

      amount:
        name: Amount
        description: Operand for add/sub/mul/div operations
        required: false
        selector:
          number:
            min: -1000000000
            max: 1000000000
            step: 0.001
            mode: box

      cast:
        name: Cast
        description: Final value cast mode. Default is float.
        required: false
        selector:
          select:
            options:
              - float
              - int

      mode:
        description: "Pass tool_manifest to get self-description."
        required: false
        selector:
          select:
            options:
              - tool_manifest

      caller_token:
        name: Caller Token
        description: Opaque audit token echoed in response.
        required: false
        selector:
          text:

    sequence:
      # ── Input normalization ────────────────────────────────────────────────
      - variables:
          _tm_mode: "{{ mode | default('') | lower }}"
      - choose:
        - conditions: "{{ _tm_mode == 'tool_manifest' }}"
          sequence:
          - variables:
              result: >-
                {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
                {{ MF.tool_manifest(
                    tool='zen_dojotools_number',
                    display_name='Number Control',
                    tier='dojotools',
                    version='1.0.0',
                    health={'configured': true, 'status': 'ok', 'notes': []},
                    required_labels=['dojotools'],
                    optional_labels=['number'],
                    consumes=['entity_name_or_id'],
                    returns=['number_value'],
                    icon='mdi:numeric',
                    color='blue-grey',
                    stripe=3,
                    impact='soft',
                    mcp_exposed=true,

                    caller_token=caller_token | default('')
                ) | from_json }}
          - stop: tool_manifest
            response_variable: result
      - variables:
          raw: "{{ name | string | trim }}"
          op: "{{ operation | default('set') | lower }}"
          amt: "{{ amount | float(0) if amount is defined else 0 }}"
          cast_mode: "{{ cast | default('float') | lower }}"
          value_raw: "{{ value | float(0) if value is defined and value is not none else none }}"
          _token: "{{ caller_token | default('', true) }}"

      # ── Entity resolution ─────────────────────────────────────────────────
      - variables:
          _slug: "{{ raw | replace(':', '') | slugify }}"
          _input_ent: "input_number.{{ _slug }}"
          _number_ent: "number.{{ _slug }}"
          _entity_id: >-
            {%- if '.' in raw and states(raw) not in ['unknown', 'unavailable'] -%}
              {{ raw }}
            {%- elif states(_input_ent) not in ['unknown', 'unavailable'] -%}
              {{ _input_ent }}
            {%- elif states(_number_ent) not in ['unknown', 'unavailable'] -%}
              {{ _number_ent }}
            {%- else -%}
              INVALID
            {%- endif -%}

      - if:
          - condition: template
            value_template: "{{ _entity_id == 'INVALID' }}"
        then:
          - variables:
              result:
                ok: false
                tool: zen_dojotools_number
                caller_token: "{{ _token }}"
                error: invalid_entity
                input: "{{ raw }}"
          - stop: error
            response_variable: result

      # ── Read current state + constraints ─────────────────────────────────
      - variables:
          _current: "{{ states(_entity_id) | float(0) }}"
          _min: >-
            {%- set a = state_attr(_entity_id, 'min') -%}
            {%- set b = state_attr(_entity_id, 'native_min_value') -%}
            {{ (a | float) if a is not none else ((b | float) if b is not none else none) }}
          _max: >-
            {%- set a = state_attr(_entity_id, 'max') -%}
            {%- set b = state_attr(_entity_id, 'native_max_value') -%}
            {{ (a | float) if a is not none else ((b | float) if b is not none else none) }}

      # ── Compute ───────────────────────────────────────────────────────────
      - variables:
          _computed: >-
            {%- if op == 'set' -%}{{ value_raw | float if value_raw is not none else none }}
            {%- elif op == 'add' -%}{{ _current + amt }}
            {%- elif op == 'sub' -%}{{ _current - amt }}
            {%- elif op == 'mul' -%}{{ _current * amt }}
            {%- elif op == 'div' -%}{{ (_current / amt) if amt != 0 else none }}
            {%- elif op == 'inc' -%}{{ _current + 1 }}
            {%- elif op == 'dec' -%}{{ _current - 1 }}
            {%- else -%}{{ none }}{%- endif -%}
          _final_val: >-
            {%- if _computed is none -%}{{ none }}
            {%- elif cast_mode == 'int' -%}{{ _computed | int }}
            {%- else -%}{{ _computed | float }}{%- endif -%}

      # ── Validation ────────────────────────────────────────────────────────
      - if:
          - condition: template
            value_template: >-
              {{ _final_val is none
                 or _final_val is not number
                 or (_min is not none and _final_val < _min)
                 or (_max is not none and _final_val > _max) }}
        then:
          - variables:
              result:
                ok: false
                tool: zen_dojotools_number
                caller_token: "{{ _token }}"
                error: out_of_range
                entity_id: "{{ _entity_id }}"
                current: "{{ _current }}"
                requested: "{{ _final_val }}"
                min: "{{ _min }}"
                max: "{{ _max }}"
          - stop: error
            response_variable: result

      # ── Apply ─────────────────────────────────────────────────────────────
      - action: >-
          {{ 'input_number' if _entity_id.startswith('input_number.') else 'number' }}.set_value
        target:
          entity_id: "{{ _entity_id }}"
        data:
          value: "{{ _final_val }}"

      # ── Response ──────────────────────────────────────────────────────────
      - variables:
          result:
            ok: true
            tool: zen_dojotools_number
            caller_token: "{{ _token }}"
            entity_id: "{{ _entity_id }}"
            operation: "{{ op }}"
            previous: "{{ _current }}"
            amount: "{{ amt }}"
            value: "{{ _final_val }}"
            cast: "{{ cast_mode }}"
      - stop: set
        response_variable: result

