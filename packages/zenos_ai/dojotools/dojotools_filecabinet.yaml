                    "You need to read, write, search, or manage knowledge documents in WikiJS (stack=wiki — optional, requires zen_sutra_wikijs).",
                    "You need to copy or move content between wiki and cabinet (cross-stack transfer).",
                    "You need to list, search, or aggregate knowledge across both stacks.",
