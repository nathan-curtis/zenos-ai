                    "Example 2 — Create a cabinet drawer": {"mode": "create", "stack": "cabinet", "volume_entity_id": "sensor.zenos_dojo_cabinet", "path": "projects/status", "title": "Status", "value": {"state": "active"}, "tags": "project,active"},
                    "Example 3 — Upsert cabinet (merge into existing)": {"mode": "upsert", "stack": "cabinet", "volume_entity_id": "sensor.zenos_kata_cabinet", "path": "ai/context", "title": "AI Context", "value": {"key": "value"}},
                    "Example 4 — Cross-stack copy wiki to cabinet": {"mode": "copy", "stack": "wiki", "path": "/home/notes/my-note", "destination_stack": "cabinet", "destination_volume_entity_id": "sensor.zenos_dojo_cabinet", "destination_path": "notes/my-note"},
                    "Example 5 — List cabinet drawers with prefix": {"mode": "list", "stack": "cabinet", "volume_entity_id": "sensor.zenos_dojo_cabinet", "path_prefix": "projects"},
                    "Example 6 — Relabel a cabinet drawer (full replace)": {"mode": "relabel", "stack": "cabinet", "volume_entity_id": "sensor.zenos_dojo_cabinet", "path": "projects/status", "tags": "project,archived"},
                    "Example 7 — Aggregate list across both stacks": {"mode": "list", "stack": "all", "volume_entity_id": "sensor.zenos_dojo_cabinet", "path_prefix": "notes"},
                    "Example 8 — Mount a cabinet": {"mode": "mount_cabinet", "stack": "cabinet", "volume_entity_id": "sensor.zenos_expansion_cabinet_1"},
                    "Example 9 — Clone a cabinet to expansion slot": {"mode": "clone", "stack": "cabinet", "volume_entity_id": "sensor.zenos_dojo_cabinet", "destination_cabinet": "sensor.zenos_expansion_cabinet_1"},
                    "Example 10 — Wiki full-text search": {"mode": "search", "stack": "wiki", "query": "meeting notes june"},
                    "Example 11 — Nested drawer write (Cabception)": {"mode": "upsert", "stack": "cabinet", "volume_entity_id": "sensor.zenos_dojo_cabinet", "path": "projects/alpha/status", "title": "Alpha Status", "value": {"state": "active"}},
                    "Example 12 — Get parent node (shows subdrawers)": {"mode": "get", "stack": "cabinet", "volume_entity_id": "sensor.zenos_dojo_cabinet", "path": "projects/alpha"},
                    "Example 13 — List subtree": {"mode": "list", "stack": "cabinet", "volume_entity_id": "sensor.zenos_dojo_cabinet", "path_prefix": "projects/alpha"},
                    "Example 14 — Virtual drawer (cross-cabinet mount)": {"_what": "Drawer 'shared/config' in expansion cab transparently reads from dojo cab. Get target_guid from action_type=manifest first.", "mode": "set_mount", "stack": "cabinet", "volume_entity_id": "sensor.zenos_expansion_cabinet_1", "path": "shared/config", "target_guid": "<guid from manifest>"},
                    "Example 15 — Live drawer (tool-backed mount)": {"_what": "Drawer 'rooms/snapshot' returns live room list on every read — no stored data. tool must be a zen_* script name; params are passed through to that script.", "mode": "set_mount", "stack": "cabinet", "volume_entity_id": "sensor.zenos_dojo_cabinet", "path": "rooms/snapshot", "fc_args": {"tool": "zen_dojotools_room_manager", "params": {"mode": "list"}}}
                  },
                  "mount_system": {
                    "overview": "A mount point is a special drawer that acts as a transparent pointer to another cabinet. When FC reads a mount point drawer it follows the chain to the target and returns the value from there. The caller sees a normal drawer value plus a mount_traversal metadata block. Mounts are invisible to readers — the traversal is automatic.",
                    "set_mount": {
                      "two_mount_types": {
                        "cross_cabinet": "target_guid points to another cabinet volume. FC follows the chain at read time and returns that cabinet's drawer value.",
                        "live_drawer": "fc_args with no target_guid. FC executes the whitelisted tool inline and returns its result as the drawer value. Caller sees a normal drawer — no redirect. Also called a live drawer."
                      },
                      "required_fields": ["path — drawer key to create the mount at in volume_entity_id", "volume_entity_id — cabinet to create the mount in", "EITHER target_guid (cross-cabinet) OR fc_args (virtual mount) — one is required"],
                      "optional_fields": ["force_action — overwrite a non-mount drawer at path (default: blocked)"],
                      "how_to_get_target_guid": "Call action_type=manifest. Each cabinet entry includes AI_Cabinet_VolumeInfo.id — that is the GUID to pass as target_guid.",
                      "what_gets_written": "{mount_point: true, target_guid: '...' (omitted for virtual mounts), target_entity_id: '...' (omitted for virtual mounts), fc_args: {...} if provided}",
                      "guards_in_order": [
                        "1. Missing path AND missing both target_guid + fc_args → error",
                        "2. target_guid provided but not found in any zen_cabinet entity → error",
                        "3. target resolves to source volume itself → BLOCKED — same-volume mount is a traversal loop, read the drawer directly",
                        "4. Non-mount drawer already exists at path → blocked unless force_action=true"
                      ]
                    },
                    "traversal": {
                      "trigger": "Automatic on read (get/list) when drawer value has mount_point=true.",
                      "max_depth": 8,
                      "loop_detection": "Tracks visited entity_id/key pairs. Returns loop_detected if the chain revisits any location.",
                      "same_key_policy": "The SAME key name is followed at each hop. If drawer 'config' is a mount, FC looks for 'config' in the target cabinet too. The key does not change across hops.",
                      "response_resolved": "Normal drawer value PLUS mount_traversal: {status: 'resolved', depth: N, resolved_from: 'vol/key', resolved_to: 'target_vol/key', visited: [...]}",
                      "response_errors": "mount_traversal: {status: 'loop_detected'|'depth_limit_exceeded'|'error'|'tool_call_blocked', reason, depth, visited}"
                    },
                    "fc_args_tool_call_mount": {
                      "what_it_is": "A LIVE DRAWER — a drawer backed by a live tool call instead of cabinet data. FC executes the whitelisted tool inline and returns its result as the drawer value. No caller-side handling required. Terminology: 'virtual drawer' = cross-cabinet pointer (target_guid); 'live drawer' = tool-backed (fc_args). Both are transparent to the reader.",
                      "fc_args_format": {"tool": "REQUIRED — zen_* script name, must be in fc_mount_callout_whitelist. Use 'tool' not 'action_type'. action_type is accepted as a fallback alias but must still be a zen_* script name — lens verbs like 'read' return tool_call_blocked.", "params": "OPTIONAL — dict passed as-is to the target script. Include any fields the target tool accepts.", "cache": "OPTIONAL — {ttl_seconds: int, digest_fields: [dot.path, ...]}. Cache the result in the cabinet for ttl_seconds. digest_fields limits what gets stored."},
                      "whitelist_management": {"drawer": "fc_mount_callout_whitelist in sensor.zenos_system_cabinet — field: value.allowed_action_types (list)","tool": "zen_admintools_prompt_loader (SUPPORTED METHOD — system cabinet is hard read-only, use this tool)","how_to_list": {"action": "script.zen_admintools_prompt_loader", "data": {"mode": "whitelist", "whitelist_type": "fc", "action_type": "list"}},"how_to_add": {"action": "script.zen_admintools_prompt_loader", "data": {"mode": "whitelist", "whitelist_type": "fc", "action_type": "add", "item": "<tool_name>"}},"how_to_remove": {"action": "script.zen_admintools_prompt_loader", "data": {"mode": "whitelist", "whitelist_type": "fc", "action_type": "remove", "item": "<tool_name>"}},"how_to_reset": {"action": "script.zen_admintools_prompt_loader", "data": {"mode": "whitelist", "whitelist_type": "fc", "action_type": "reset"}},"note": "tool name must exactly match the script name (e.g. zen_dojotools_inventory). Unrecognised tools return tool_call_blocked at traversal time. FC write via upsert is blocked — always use zen_admintools_prompt_loader."},
                      "caller_receives": "Normal drawer value = live tool result. mount_traversal block shows {status: 'resolved_via_tool_call', tool_called, depth, visited}. Zero special handling required by the caller.",
                      "execution": "FC dispatches to `script.<tool>` dynamically — any whitelisted tool fires automatically. The whitelist is the ONLY gate. To add a new tool: add it to the whitelist (syscab fc_mount_callout_whitelist or _hard_wl fallback in YAML). No code changes required. tool_call_required only appears when the tool is NOT whitelisted (blocked).",
                      "patterns": {
                        "index_mount": {"desc": "Live entity graph by label", "fc_args": {"tool": "zen_dojotools_index", "params": {"label_1": "<label>", "mode": "hypergraph", "expand_entities": true}}},
                        "wiki_mount": {"desc": "Wiki page content inline in cabinet drawer", "fc_args": {"tool": "zen_dojotools_filecabinet", "params": {"action_type": "get", "stack": "wiki", "path": "<wiki/page/path>"}}},
                        "paperless_mount": {"desc": "Paperless document inline in cabinet drawer — PENDING: no zen_stack_paperless script yet; use zen_dojotools_lens_dispatch when available"},
                        "room_mount": {"desc": "Live room context snapshot", "fc_args": {"tool": "zen_dojotools_room_manager", "params": {"mode": "get", "area_id": "<area_id>"}}},
                        "manifest_mount": {"desc": "Live system manifest slice", "fc_args": {"tool": "zen_dojotools_manifest", "params": {"mode": "<cabinets|tools|health>"}}}
                      },
                      "note_on_stacks": "Live drawers MUST use zen_* script names in fc_args.tool — lens verbs like 'read' and 'manifest' are not HA scripts and will return tool_call_blocked. Use zen_dojotools_filecabinet for wiki/cabinet reads; use the specific zen_stack_* tool for other lens providers.",
                      "capability": "fc_args can carry any fields the target tool accepts. No hardcoded schema beyond action_type. Supports the full kf4 tool-call surface."
                    },
                    "remove_mount": {
                      "required_fields": ["path", "volume_entity_id"],
                      "behavior": "Deletes the mount point drawer entirely. Does NOT touch the target cabinet. Any reader that relied on this mount will get key_not_found after removal."
                    },
                    "caveats": [
                      "SAME-VOLUME MOUNTS ARE BLOCKED at creation time — a mount in cabinet V pointing back to V is a loop. Read the drawer directly.",
                      "Mount point drawers CANNOT be moved or copied — set_mount/remove_mount are the only management operations.",
                      "DON'T create many mounts pointing to each other within the same cabinet — loop detection catches this at read time but NOT at creation time (only same-volume is blocked at creation).",
                      "fc_args action_type MUST be whitelisted in syscab. Unwhitelisted calls return tool_call_blocked — not an error, but the value is unreadable.",
                      "Max traversal depth is 8 hops. Deep chains return depth_limit_exceeded.",
                      "target_guid must match a live zen_cabinet entity at traversal time (cross-cabinet mounts only). Deleted or dismounted cabinets leave dangling mounts that return unresolvable.",
                      "The SAME KEY is followed at every hop — if you mount 'config' to cabinet B, FC looks for 'config' in B, not some other key."
                    ]
                  },
                  "tapestry_system": {
                    "overview": "Tapestry (mode=weave/weave_preview/weave_save) is a READ-ONLY report compiler — it composes multiple existing cabinet drawers into a single nested dict. It does NOT create a mount and does NOT write to the source drawers. The compiled output is either returned inline (mode=weave) or saved as its own new drawer (mode=weave_save) that other callers can then read like any other drawer.",
                    "three_modes": {
                      "weave": "Execute a definition right now — inline weave_sources, or weave_drawer=<name of a saved definition>, or weave_label=<HA label, merges all zen_tapestry drawers with that label>. Returns the compiled dict directly. No side effects.",
                      "weave_preview": "Dry run of a definition — validates sources, computes size and depth_map, and returns a preview_token. ALWAYS call this before weave_save. No side effects — nothing is written yet.",
                      "weave_save": "Writes a definition (not the compiled output — the SOURCES LIST itself) to a cabinet drawer as a reusable, named tapestry. Requires the preview_token from weave_preview, plus force_action=true. The token is only valid for the clock minute it was issued in — weave_preview and weave_save must happen back-to-back in the same tool-call sequence, not as two separate user-triggered steps with a gap between them."
                    },
                    "path_vs_weave_drawer": "These are NOT interchangeable. 'path' (used by get/create/update/upsert) is the drawer key for a REGULAR drawer holding plain data. 'weave_drawer' (used by weave/weave_preview) is specifically the name of a drawer that holds a STORED TAPESTRY DEFINITION (the sources list) — it's how you re-run a tapestry you already saved. weave_save also takes 'path' — that's the drawer key it will save the NEW definition under. In short: path = where to read/write a drawer of ANY kind; weave_drawer = read a drawer that specifically already contains a saved tapestry definition.",
                    "worked_example_print_shop": {
                      "goal": "Compose a single 'print_shop_snapshot' tapestry from three separate live drawers: printer inventory status (household cabinet), consumables stock (household cabinet), and open service tickets tagged printer (household cabinet) — so one call returns a full print shop status instead of three.",
                      "step_1_confirm_sources_exist": "Before weaving, confirm the source drawers you want to reference actually exist and hold the shape you expect. mode=get on each candidate drawer (e.g. path=printer_inventory, path=printer_consumables, path=printer_service_tickets in sensor.zenos_default_household_cabinet) — a tapestry source that points at a drawer that doesn't exist yet will fail at weave time, not at save time.",
                      "step_2_weave_preview": {
                        "call": {
                          "mode": "weave_preview",
                          "volume_entity_id": "sensor.zenos_default_household_cabinet",
                          "weave_sources": {
                            "sources": [
                              {"key": "inventory", "cabinet": "sensor.zenos_default_household_cabinet", "drawer": "printer_inventory"},
                              {"key": "consumables", "cabinet": "sensor.zenos_default_household_cabinet", "drawer": "printer_consumables"},
                              {"key": "tickets", "cabinet": "sensor.zenos_default_household_cabinet", "drawer": "printer_service_tickets", "mask": ["open_count", "oldest_open_days"]}
                            ],
                            "description": "Print shop status — inventory, consumables, and open service tickets in one read."
                          }
                        },
                        "returns": "size check, depth_map, and a preview_token — e.g. preview_token: '187-2026-07-02T14:32'. This token expires at the next minute rollover."
                      },
                      "step_3_weave_save_same_minute": {
                        "rule": "Call weave_save IMMEDIATELY after weave_preview, in the same exchange — not after a pause. If the clock minute rolls over between the two calls, preview_token is rejected with token_expired and you must call weave_preview again to get a fresh token.",
                        "call": {
                          "mode": "weave_save",
                          "volume_entity_id": "sensor.zenos_default_household_cabinet",
                          "path": "print_shop_snapshot",
                          "preview_token": "187-2026-07-02T14:32",
                          "weave_sources": "<same sources object passed to weave_preview>",
                          "force_action": true
                        },
                        "result": "A new drawer 'print_shop_snapshot' tagged zen_tapestry now exists. It stores the DEFINITION (the sources list), not a cached result — every future read re-composes fresh from the three live source drawers."
                      },
                      "step_4_use_it": "From now on, mode=weave weave_drawer=print_shop_snapshot volume_entity_id=sensor.zenos_default_household_cabinet returns the composed inventory+consumables+tickets dict in one call — no need to remember the three individual drawer names or re-supply weave_sources."
                    },
                    "common_mistakes": [
                      "Calling weave_save without calling weave_preview first — always rejected, token_required.",
                      "Letting time pass between weave_preview and weave_save (e.g. asking the user a question in between) — token expires at minute rollover, must re-preview.",
                      "Using 'weave_drawer' when you meant the plain drawer-key field 'path' (or vice versa) — weave_drawer only works if that drawer already holds a saved tapestry definition, not arbitrary data.",
                      "Omitting mask on a source drawer with more than 20 keys — required, not optional, above that threshold.",
                      "Expecting weave_save to store a snapshot of the CURRENT compiled data — it does not; it stores the definition, and every read recomposes live from the current source drawers."
                    ]
                  },
                  "ai_user_guidance": [
                    "stack=cabinet is always available. stack=wiki is optional — requires zen_sutra_wikijs installed and registered. If not available, stack=wiki returns status=error with failure=stack_not_available.",
                    "Default stack is cabinet (backwards-compat with FC callers). Always specify stack=wiki explicitly for wiki operations.",
                    "For cabinet: pass the real sensor.zenos_*_cabinet entity ID — not a resolver sensor.",
                    "update defaults to replace (overwrite); create/upsert default to merge (deep-merge). Pass merge: true to force merge on update.",
                    "tags on create/update/upsert is additive — use relabel for full label replacement.",
                    "stacks_by_anchor requires both anchor_type and anchor_ids (list).",
                    "Cross-stack: set destination_stack + destination_volume_entity_id (if dest=cabinet).",
                    "Cabinet writes include 30s write-verification — write_verified:true confirms the write landed.",
                    "sensor.zenos_system_cabinet is HARD READ-ONLY — writes are blocked at the sutra level.",
                    "GC fields (expires_after, no_autoexpire, no_autorecycle): omit to preserve existing; pass explicitly to change.",
                    "Use stack=all for list/health aggregation across both stacks in a single call.",
                    "Protected drawers (all cabinets): ai_cabinet_volumeinfo, label_index, zen_relationships, meta — writes always blocked.",
                    "Drawers with meta.ro=true are read-only — all writes blocked on that drawer.",
                    "Health gate: cabinet must be writeable and healthy for writes to proceed."
                  ]
                }
              | tojson -}}
        - variables:
            _dom_inner: "{{ (help_json | from_json) | combine({'domain': 'knowledge', 'peers': {'inventory': 'zen_dojotools_inventory', 'finance': 'zen_dojotools_finance'}, 'see_also': 'zen_dojotools_manifest mode=domains name=knowledge'}) }}"
        - variables:
            result: "{{ {'status': 'help', 'help': _dom_inner} }}"
        - stop: knowledge help done
          response_variable: result

    # --- Cross-stack copy/move ---
    # Fires when destination_stack is explicitly set. Orchestrates: get source →
    # write destination → (move only) delete source. Source is never deleted if
    # destination write fails.
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ _action_type in ['copy', 'move'] and _dest_stack != '' }}"
        sequence:

        # 1. Get source content
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _stack == 'wiki' }}"
            sequence:
            - action: script.zen_sutra_wikijs
              response_variable: _src_raw
              continue_on_error: true
              data:
                action: get
                path: "{{ _path }}"
                caller_token: "{{ _caller_token }}"
          - conditions:
            - condition: template
              value_template: "{{ _stack == 'cabinet' }}"
            sequence:
            - action: script.zen_sutra_filecabinet
              response_variable: _src_raw
              continue_on_error: true
              data:
                action: get
                volume_entity_id: "{{ _vol }}"
                path: "{{ _path }}"
                caller_token: "{{ _caller_token }}"

        # 2. Normalize source response — wiki nests content under 'page'; cabinet is flat
        - variables:
            _src_page: >-
              {%- if _src_raw is mapping and _src_raw.get('page') is mapping -%}
                {{ _src_raw.get('page') }}
              {%- elif _src_raw is mapping -%}{{ _src_raw }}
              {%- else -%}{{ {} }}{%- endif -%}
        - variables:
            _src_ok: "{{ _src_raw is mapping and _src_raw.get('status') == 'success' }}"
            _src_title: "{{ _src_page.get('title', '') if _src_page is mapping else '' }}"
            _src_content: "{{ _src_page.get('content', '') if _src_page is mapping else '' }}"
            _src_desc: "{{ _src_page.get('description', '') if _src_page is mapping else '' }}"
            _src_created_at: >-
              {%- if _src_page is mapping -%}
                {{ _src_page.get('created_at') or _src_page.get('createdAt') or '' }}
              {%- else -%}{%- endif -%}
            _src_tags: >-
              {%- if _src_page is mapping -%}
                {%- set _t = _src_page.get('tags', []) -%}
                {{ _t if _t is sequence else [] }}
              {%- else -%}{{ [] }}{%- endif -%}
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ not _src_ok }}"
            sequence:
            - variables:
                result:
                  status: error
                  tool: zen_dojotools_filecabinet
                  action: "{{ _action_type }}"
                  message: "Source {{ _stack }} get failed — nothing written."
                  source_status: "{{ _src_raw.get('status', 'unknown') if _src_raw is mapping else 'no_response' }}"
                  trace:
                    caller_token: "{{ _caller_token }}"
            - stop: knowledge cross-stack source get failed
              response_variable: result

        # 2c. Pre-check destination existence (wiki — upsert has no 'created' flag)
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _dest_stack == 'wiki' }}"
            sequence:
            - action: script.zen_sutra_wikijs
              response_variable: _dest_pre_raw
              continue_on_error: true
              data:
                action: get
                path: "{{ destination_path | default('', true) }}"
                caller_token: "{{ _caller_token }}"
        - variables:
            _dest_existed: >-
              {%- if _dest_stack == 'wiki' -%}
                {{ _dest_pre_raw is mapping and _dest_pre_raw.get('status') == 'success' }}
              {%- else -%}false{%- endif -%}

        # 3. Write to destination (upsert/replace — overwrites if already exists)
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _dest_stack == 'wiki' }}"
            sequence:
            - action: script.zen_sutra_wikijs
              response_variable: _dest_raw
              continue_on_error: true
              data:
                action: upsert
                path: "{{ destination_path | default('', true) }}"
                title: "{{ _src_title }}"
                description: "{{ _src_desc }}"
                content: "{{ _src_content }}"
                mode: replace
                tags_json: "{{ _src_tags | tojson if _src_tags is sequence and _src_tags | length > 0 else '' }}"
                caller_token: "{{ _caller_token }}"
          - conditions:
            - condition: template
              value_template: "{{ _dest_stack == 'cabinet' }}"
            sequence:
            - action: script.zen_sutra_filecabinet
              response_variable: _dest_raw
              continue_on_error: true
              data:
                action: upsert
                volume_entity_id: "{{ _dest_vol }}"
                path: "{{ destination_path | default('', true) }}"
                title: "{{ _src_title }}"
                description: "{{ _src_desc }}"
                content: "{{ _src_content }}"
                mode: replace
                tags: "{{ _src_tags | join(',') if _src_tags is sequence and _src_tags | length > 0 else '' }}"
                source_created_at: "{{ _src_created_at }}"
                caller_token: "{{ _caller_token }}"

        # 4. Guard: destination write must succeed before any source deletion
        - variables:
            _dest_ok: "{{ _dest_raw is mapping and _dest_raw.get('status') == 'success' }}"
            _overwritten: >-
              {%- if _dest_stack == 'wiki' -%}{{ _dest_existed }}
              {%- elif _dest_raw is mapping and _dest_raw.get('created') == false -%}true
              {%- else -%}false{%- endif -%}
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ not _dest_ok }}"
            sequence:
            - variables:
                result:
                  status: error
                  tool: zen_dojotools_filecabinet
                  action: "{{ _action_type }}"
                  message: "Destination {{ _dest_stack }} write failed — source intact."
                  dest_status: "{{ _dest_raw.get('status', 'unknown') if _dest_raw is mapping else 'no_response' }}"
                  from_stack: "{{ _stack }}"
                  from_path: "{{ path | default('', true) }}"
                  to_stack: "{{ _dest_stack }}"
                  to_path: "{{ destination_path | default('', true) }}"
                  trace:
                    caller_token: "{{ _caller_token }}"
            - stop: knowledge cross-stack dest write failed
              response_variable: result

        # 5. Copy result — stops here for copy
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _action_type == 'copy' }}"
            sequence:
            - variables:
                result:
                  status: success
                  tool: zen_dojotools_filecabinet
                  action: copy
                  from_stack: "{{ _stack }}"
                  from_path: "{{ _path }}"
                  from_volume: "{{ _vol }}"
                  to_stack: "{{ _dest_stack }}"
                  to_path: "{{ destination_path | default('', true) }}"
                  to_volume: "{{ _dest_vol }}"
                  overwritten: "{{ _overwritten }}"
                  provenance:
                    source_created_at: "{{ _src_created_at }}"
                    transferred_at: "{{ now().isoformat() }}"
                  tags_note: "{{ 'tags_transferred' if (_src_tags is sequence and _src_tags | length > 0) else 'no_tags' }}"
                  trace:
                    caller_token: "{{ _caller_token }}"
            - stop: knowledge cross-stack copy done
              response_variable: result

        # 6. Move: delete source
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _stack == 'wiki' }}"
            sequence:
            - action: script.zen_sutra_wikijs
              response_variable: _del_raw
              continue_on_error: true
              data:
                action: delete
                path: "{{ path | default('', true) }}"
                caller_token: "{{ _caller_token }}"
          - conditions:
            - condition: template
              value_template: "{{ _stack == 'cabinet' }}"
            sequence:
            - action: script.zen_sutra_filecabinet
              response_variable: _del_raw
              continue_on_error: true
              data:
                action: delete
                volume_entity_id: "{{ _vol }}"
                path: "{{ _path }}"
                caller_token: "{{ _caller_token }}"

        # 7. Move result
        - variables:
            result: >-
              {%- set _del_ok = _del_raw is mapping and _del_raw.get('status') == 'success' -%}
              {{
                {
                  'status': 'success' if _del_ok else 'partial',
                  'tool': 'zen_dojotools_filecabinet',
                  'action': 'move',
                  'from_stack': _stack,
                  'from_path': _path,
                  'from_volume': _vol,
                  'to_stack': _dest_stack,
                  'to_path': destination_path | default('', true),
                  'to_volume': _dest_vol,
                  'overwritten': _overwritten,
                  'provenance': {
                    'source_created_at': _src_created_at,
                    'transferred_at': now().isoformat()
                  },
                  'tags_note': 'tags_transferred' if (_src_tags is sequence and _src_tags | length > 0) else 'no_tags',
                  'warning': (none if _del_ok else
                    'source_delete_failed — content exists at both locations'),
                  'trace': {'caller_token': _caller_token}
                }
              }}
        - stop: knowledge cross-stack move done
          response_variable: result

    # --- stack=all aggregation ---
    # Read-only surface: list, health, stacks_by_anchor, register, unregister, inspect, audit.
    # Write ops return error — use stack=wiki or stack=cabinet explicitly.
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ _stack == 'all' }}"
        sequence:

        # Guard: write operations not supported with stack=all
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _action_type in ['get', 'create', 'update', 'upsert', 'delete', 'move', 'copy', 'relabel', 'search'] }}"
            sequence:
            - variables:
                result:
                  status: error
                  tool: zen_dojotools_filecabinet
                  action: "{{ _action_type }}"
                  message: "stack=all is read-only. Use stack=wiki or stack=cabinet for write operations."
                  trace:
                    caller_token: "{{ _caller_token }}"
            - stop: knowledge all write guard
              response_variable: result

        # Call wiki sutra
        - action: script.zen_sutra_wikijs
          response_variable: _wiki_raw
          continue_on_error: true
          data:
            action: "{{ _action_type }}"
            path_prefix: "{{ path_prefix | default('', true) }}"
            anchor_type: "{{ anchor_type | default('label') }}"
            anchor_ids: "{{ anchor_ids | default('', true) }}"
            caller_token: "{{ _caller_token }}"

        # Initialize cabinet response as skipped (overwritten below if volume provided)
        - variables:
            _cab_raw:
              status: skipped
              reason: no volume_entity_id provided

        # Call cabinet sutra only if volume_entity_id provided
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _vol != '' }}"
            sequence:
            - action: script.zen_sutra_filecabinet
              response_variable: _cab_raw
              continue_on_error: true
              data:
                action: "{{ _action_type }}"
                volume_entity_id: "{{ _vol }}"
                path_prefix: "{{ path_prefix | default('', true) }}"
                anchor_type: "{{ anchor_type | default('label') }}"
                anchor_ids: "{{ anchor_ids | default('', true) }}"
                caller_token: "{{ _caller_token }}"

        # Aggregate results by action type
        - choose:

          # health — aggregate both health statuses
          - conditions:
            - condition: template
              value_template: "{{ _action_type == 'health' }}"
            sequence:
            - variables:
                result: >-
                  {%- set _w_ok = _wiki_raw is mapping and _wiki_raw.get('status') == 'success' -%}
                  {%- set _c_ok = _cab_raw is mapping and _cab_raw.get('status') in ['success', 'skipped'] -%}
                  {{
                    {
                      'status': 'success' if (_w_ok and _c_ok) else 'error',
                      'tool': 'zen_dojotools_filecabinet',
                      'action': 'health',
                      'stacks': {
                        'wiki': _wiki_raw if _wiki_raw is mapping else {'status': 'error', 'message': 'no_response'},
                        'cabinet': _cab_raw if _cab_raw is mapping else {'status': 'error', 'message': 'no_response'}
                      },
                      'trace': {'caller_token': _caller_token}
                    }
                  }}
            - stop: knowledge all health done
              response_variable: result

          # list — merge pages (wiki) + items (cabinet), each tagged with stack
          - conditions:
            - condition: template
              value_template: "{{ _action_type == 'list' }}"
            sequence:
            - variables:
                result: >-
                  {%- set _w_pages = (_wiki_raw.get('pages', []) if _wiki_raw is mapping else []) -%}
                  {%- set _c_items = (_cab_raw.get('items', []) if _cab_raw is mapping else []) -%}
                  {%- set ns = namespace(merged=[]) -%}
                  {%- for p in (_w_pages if _w_pages is sequence else []) -%}
                    {%- set ns.merged = ns.merged + [p | combine({'stack': 'wiki'})] -%}
                  {%- endfor -%}
                  {%- for i in (_c_items if _c_items is sequence else []) -%}
                    {%- set ns.merged = ns.merged + [i | combine({'stack': 'cabinet', 'path': i.get('key', '')})] -%}
                  {%- endfor -%}
                  {{
                    {
                      'status': 'success',
                      'tool': 'zen_dojotools_filecabinet',
                      'action': 'list',
                      'items': ns.merged,
                      'count': ns.merged | length,
                      'stacks': {
                        'wiki': {'status': _wiki_raw.get('status', 'error') if _wiki_raw is mapping else 'error', 'count': _w_pages | length},
                        'cabinet': {'status': _cab_raw.get('status', 'skipped') if _cab_raw is mapping else 'skipped', 'count': _c_items | length}
                      },
                      'trace': {'caller_token': _caller_token}
                    }
                  }}
            - stop: knowledge all list done
              response_variable: result

          # stacks_by_anchor — concatenate evidence arrays from both backends
          - conditions:
            - condition: template
              value_template: "{{ _action_type == 'stacks_by_anchor' }}"
            sequence:
            - variables:
                result: >-
                  {%- set _w_ev = (_wiki_raw.get('evidence', []) if _wiki_raw is mapping else []) -%}
                  {%- set _c_ev = (_cab_raw.get('evidence', []) if _cab_raw is mapping else []) -%}
                  {%- set _ev = (_w_ev if _w_ev is sequence else []) + (_c_ev if _c_ev is sequence else []) -%}
                  {{
                    {
                      'status': 'success',
                      'tool': 'zen_dojotools_filecabinet',
                      'action': 'stacks_by_anchor',
                      'anchor_type': anchor_type | default('label'),
                      'anchor_ids': anchor_ids | default('', true),
                      'evidence': _ev,
                      'count': _ev | length,
                      'stacks': {
                        'wiki': {'status': _wiki_raw.get('status', 'error') if _wiki_raw is mapping else 'error', 'count': _w_ev | length},
                        'cabinet': {'status': _cab_raw.get('status', 'skipped') if _cab_raw is mapping else 'skipped', 'count': _c_ev | length}
                      },
                      'trace': {'caller_token': _caller_token}
                    }
                  }}
            - stop: knowledge all stacks_by_anchor done
              response_variable: result

          # lens bus passthrough (register, unregister, inspect, audit)
          - conditions:
            - condition: template
              value_template: "{{ _action_type in ['register', 'unregister', 'inspect', 'audit'] }}"
            sequence:
            - variables:
                result:
                  status: success
                  tool: zen_dojotools_filecabinet
                  action: "{{ _action_type }}"
                  stacks:
                    wiki: "{{ _wiki_raw }}"
                    cabinet: "{{ _cab_raw }}"
                  trace:
                    caller_token: "{{ _caller_token }}"
            - stop: knowledge all lens bus done
              response_variable: result

        # stack=all fallback — action not supported
        - variables:
            result:
              status: error
              tool: zen_dojotools_filecabinet
              action: "{{ _action_type }}"
              message: "{{ _action_type }} not supported for stack=all."
              supported: [list, health, stacks_by_anchor, register, unregister, inspect, audit]
              trace:
                caller_token: "{{ _caller_token }}"
        - stop: knowledge all unsupported action
          response_variable: result

    # --- Route: wiki ---
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ _stack == 'wiki' }}"
        sequence:
        - action: script.zen_sutra_wikijs
          response_variable: result
          continue_on_error: true
          data:
            action: "{{ _action_type }}"
            path: "{{ path | default('', true) }}"
            title: "{{ title | default('', true) }}"
            description: "{{ description | default('', true) }}"
            content: "{{ _content | tojson if _content is mapping else _content }}"
            mode: >-
              {%- set _ml = mode | default('', true) | string | trim | lower -%}
              {{ _ml if _ml in ['merge', 'replace'] else 'replace' }}
            tags_json: "{{ tags | default('', true) }}"
            destination_path: "{{ destination_path | default('', true) }}"
            path_prefix: "{{ path_prefix | default('', true) }}"
            query: "{{ query | default('', true) }}"
            anchor_type: "{{ anchor_type | default('label') }}"
            anchor_ids: "{{ anchor_ids | default('', true) }}"
            caller_token: "{{ _caller_token }}"
        - variables:
            result: >-
              {%- if result is mapping and result.get('status') in ['success', 'error'] -%}
                {{ result }}
              {%- else -%}
                {{
                  {
                    'status': 'error',
                    'tool': 'zen_dojotools_filecabinet',
                    'action': _action_type,
                    'stack': 'wiki',
                    'failure': 'stack_not_available',
                    'message': 'stack=wiki is not available on this instance. Install and register zen_sutra_wikijs to enable wiki support. Use stack=cabinet (always available) for cabinet operations.',
                    'trace': {'caller_token': _caller_token}
                  }
                }}
              {%- endif -%}
        - stop: knowledge wiki done
          response_variable: result

    # --- Route: weave / weave_preview / weave_save ---
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ _action_type in ['weave', 'weave_preview', 'weave_save'] }}"
        sequence:

        # --- weave_save: write a tapestry definition to a cabinet drawer ---
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _action_type == 'weave_save' }}"
            sequence:
            - variables:
                _ws_src: >-
                  {%- set raw = weave_sources | default('', true) -%}
                  {%- if raw is mapping -%}{{ raw }}
                  {%- elif raw is string and raw | trim != '' -%}{{ raw | trim | from_json(none) }}
                  {%- else -%}{{ none }}{%- endif -%}
                _ws_token_expected: >-
                  {{ (weave_sources | default('', true) | string | length | string) + '-' + now().strftime('%Y-%m-%dT%H:%M') }}
                _ws_token_given: "{{ preview_token | default('', true) | string | trim }}"
                _ws_force: "{{ force_action | default(false) | bool }}"
            - variables:
                _ws_error: >-
                  {%- if not _ws_force -%}confirm_required
                  {%- elif _ws_token_given == '' or _ws_token_given != _ws_token_expected -%}token_expired
                  {%- elif _vol == '' -%}cabinet_required
                  {%- elif _path == '' -%}drawer_name_required
                  {%- elif _ws_src is none or _ws_src.get('sources') is none -%}invalid_definition
                  {%- elif (_ws_src | tojson | length) > 2048 -%}definition_too_large
                  {%- else -%}{%- endif -%}
            - choose:
              - conditions:
                - condition: template
                  value_template: "{{ _ws_error != '' }}"
                sequence:
                - variables:
                    result:
                      status: error
                      tool: zen_dojotools_filecabinet
                      action: weave_save
                      code: "{{ _ws_error }}"
                      message: >-
                        {%- if _ws_error == 'confirm_required' -%}Set force_action=true to confirm intent to write a tapestry definition.
                        {%- elif _ws_error == 'token_expired' -%}preview_token missing or expired. Call weave_preview first — token is valid for the current clock minute only.
                        {%- elif _ws_error == 'cabinet_required' -%}volume_entity_id required for weave_save.
                        {%- elif _ws_error == 'drawer_name_required' -%}path/key required — name to save the tapestry definition under.
                        {%- elif _ws_error == 'invalid_definition' -%}weave_sources must be a JSON object with a 'sources' key.
                        {%- elif _ws_error == 'definition_too_large' -%}Tapestry definition exceeds 2048 byte limit. Reduce sources or descriptions.
                        {%- else -%}{{ _ws_error }}{%- endif -%}
                      trace:
                        caller_token: "{{ _caller_token }}"
                - stop: weave_save error
                  response_variable: result
              default:
              - action: script.zen_sutra_filecabinet
                response_variable: _ws_write_raw
                continue_on_error: true
                data:
                  action: upsert
                  volume_entity_id: "{{ _vol }}"
                  path: "{{ _path }}"
                  value: "{{ _ws_src }}"
                  force_action: true
                  tags: "zen_tapestry{{ (','+(_ws_src.get('labels', []) | join(','))) if _ws_src.get('labels') else '' }}"
                  create_label: false
                  caller_token: "{{ _caller_token }}"
              - variables:
                  result: >-
                    {%- set _wr = _ws_write_raw if _ws_write_raw is mapping else {} -%}
                    {%- if _wr.get('status') in ['success'] -%}
                      {{
                        {
                          'status': 'ok',
                          'action': 'weave_save',
                          'tool': 'zen_dojotools_filecabinet',
                          'drawer': _path,
                          'cabinet': _vol,
                          'size_bytes': (_ws_src | tojson | length),
                          'labels_applied': ['zen_tapestry'] + (_ws_src.get('labels', []) or []),
                          'write_verified': _wr.get('write_verified', false),
                          'trace': {'caller_token': _caller_token}
                        }
                      }}
                    {%- else -%}
                      {{ _wr | combine({'action': 'weave_save', 'tool': 'zen_dojotools_filecabinet'}) }}
                    {%- endif -%}
              - stop: weave_save done
                response_variable: result

        # --- weave + weave_preview: compile tapestry ---
        - variables:
            _w_raw_src: >-
              {%- set raw = weave_sources | default('', true) -%}
              {%- if raw is mapping -%}{{ raw }}
              {%- elif raw is string and raw | trim != '' -%}{{ raw | trim | from_json(none) }}
              {%- else -%}{{ none }}{%- endif -%}
            _w_drawer: "{{ weave_drawer | default('', true) | string | trim }}"
            _w_label: "{{ weave_label | default('', true) | string | trim }}"
            _w_max_depth: "{{ [1, [3, (weave_max_depth | default(2) | int)] | min] | max }}"

        # Load definition: inline > drawer > label
        - variables:
            _w_def: >-
              {%- if _w_raw_src is mapping and _w_raw_src.get('sources') is not none -%}
                {{ _w_raw_src }}
              {%- elif _w_drawer != '' -%}
                {%- set _search_cabs = ([_vol] if _vol != '' else []) + (label_entities('Zen Cabinet') | select('match', 'sensor\\.') | list) -%}
                {%- set _ns = namespace(found=none) -%}
                {%- for _ce in _search_cabs -%}
                  {%- if _ns.found is none -%}
                    {%- set _cv = state_attr(_ce, 'variables') | default({}, true) -%}
                    {%- set _dk = _w_drawer.split('/') | map('lower') | map('slugify') | join('/') -%}
                    {%- set _entry = (_cv or {}).get(_dk, {}) -%}
                    {%- set _val = (_entry.get('value') if _entry is mapping else none) -%}
                    {%- set _val = _val.get('content', _val) if (_val is mapping and _val.get('v') == 1) else _val -%}
                    {%- set _val = (_val | from_json(none)) if (_val is string and _val | trim not in ['', 'null', 'None']) else _val -%}
                    {%- if _val is mapping and _val.get('sources') is not none -%}
                      {%- set _ns.found = _val -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ _ns.found if _ns.found is not none else none }}
              {%- elif _w_label != '' -%}
                {%- set _all_cabs = label_entities('Zen Cabinet') | select('match', 'sensor\\.') | list -%}
                {%- set _ns = namespace(srcs=[]) -%}
                {%- for _ce in _all_cabs | sort -%}
                  {%- set _cv = state_attr(_ce, 'variables') | default({}, true) -%}
                  {%- set _idx_entry = (_cv or {}).get('_label_index', {}) -%}
                  {%- set _idx_val = (_idx_entry.get('value') if _idx_entry is mapping else none) -%}
                  {%- set _idx_val = (_idx_val | from_json(none)) if (_idx_val is string and _idx_val | trim not in ['', 'null', 'None']) else _idx_val -%}
                  {%- set _idx = _idx_val if _idx_val is mapping else {} -%}
                  {%- for _dk in (_idx.get(_w_label, []) or []) -%}
                    {%- set _dk_s = _dk.split('/') | map('lower') | map('slugify') | join('/') -%}
                    {%- set _entry = (_cv or {}).get(_dk_s, {}) -%}
                    {%- set _val = (_entry.get('value') if _entry is mapping else none) -%}
                    {%- set _val = _val.get('content', _val) if (_val is mapping and _val.get('v') == 1) else _val -%}
                    {%- set _val = (_val | from_json(none)) if (_val is string and _val | trim not in ['', 'null', 'None']) else _val -%}
                    {%- if _val is mapping and _val.get('sources') is not none -%}
                      {%- for _s in (_val.get('sources', []) or []) -%}
                        {%- set _ns.srcs = _ns.srcs + [_s] -%}
                      {%- endfor -%}
                    {%- endif -%}
                  {%- endfor -%}
                {%- endfor -%}
                {{ {'sources': _ns.srcs, 'description': 'Merged from label: ' ~ _w_label} if _ns.srcs | length > 0 else none }}
              {%- else -%}{{ none }}{%- endif -%}

        # Guard: definition not found or source count
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _w_def is none }}"
            sequence:
            - variables:
                result:
                  status: error
                  tool: zen_dojotools_filecabinet
                  action: "{{ _action_type }}"
                  code: definition_not_found
                  message: "No weave definition found. Provide weave_sources inline, weave_drawer name, or weave_label."
                  trace:
                    caller_token: "{{ _caller_token }}"
            - stop: weave no definition
              response_variable: result
          - conditions:
            - condition: template
              value_template: "{{ (_w_def.get('sources', []) | length) > 10 }}"
            sequence:
            - variables:
                result:
                  status: error
                  tool: zen_dojotools_filecabinet
                  action: "{{ _action_type }}"
                  code: too_many_sources
                  message: "Tapestry has {{ _w_def.get('sources', []) | length }} sources — max is 10."
                  trace:
                    caller_token: "{{ _caller_token }}"
            - stop: weave too many sources
              response_variable: result

        # Compile — all 3 depth passes in one template
        - variables:
            _w_compiled: >-
              {%- set _def = _w_def -%}
              {%- set _max_d = _w_max_depth | int -%}
              {%- set _all_cabs = label_entities('Zen Cabinet') | select('match', 'sensor\\.') | list -%}

              {#- Helper macro-substitute: resolve one leaf source dict → {key: data} or error dict #}
              {#- Inline as a sub-loop below for each pass #}

              {%- set ns = namespace(compiled={}, queue=[], visited=[_w_drawer], errors=[]) -%}

              {#- PASS 0: leaves from root definition #}
              {%- for src in (_def.get('sources', []) or []) -%}
                {%- if src.get('weave') is not none -%}
                  {%- set ns.queue = ns.queue + [{'src': src, 'parent_key': none}] -%}
                {%- elif src.get('key') and src.get('cabinet') and src.get('drawer') -%}
                  {%- set _cv = state_attr(src['cabinet'], 'variables') | default({}, true) -%}
                  {%- set _entry = (_cv or {}).get(src['drawer'].split('/') | map('lower') | map('slugify') | join('/'), {}) -%}
                  {%- set _raw = (_entry.get('value') if _entry is mapping else none) -%}
                  {%- set _raw = _raw.get('content', _raw) if (_raw is mapping and _raw.get('v') == 1) else _raw -%}
                  {%- set _raw = (_raw | from_json(none)) if (_raw is string and _raw | trim not in ['', 'null', 'None']) else _raw -%}
                  {%- set _raw = _raw if _raw is mapping else {} -%}
                  {%- if _raw | length > 20 and src.get('mask') is none -%}
                    {%- set ns.errors = ns.errors + [{'code': 'mask_required', 'source_key': src['key'], 'drawer': src['drawer'], 'key_count': _raw | length}] -%}
                  {%- else -%}
                    {%- set _mask_ns = namespace(d={}) -%}
                    {%- for k, v in _raw.items() -%}
                      {%- if src.get('mask') is none or k in src['mask'] -%}
                        {%- set _nk = src.get('rename', {}).get(k, k) if src.get('rename') else k -%}
                        {%- set _mask_ns.d = _mask_ns.d | combine({_nk: v}) -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {%- set ns.compiled = ns.compiled | combine({src['key']: _mask_ns.d}) -%}
                  {%- endif -%}
                {%- else -%}
                  {%- set ns.errors = ns.errors + [{'code': 'invalid_source', 'source_key': src.get('key', '?'), 'message': 'Drawer source requires key+cabinet+drawer. Weave source requires key+weave.'}] -%}
                {%- endif -%}
              {%- endfor -%}

              {#- PASS 1: depth-1 weave sources #}
              {%- set _q1 = ns.queue -%}
              {%- set ns.queue = [] -%}
              {%- for item in _q1 -%}
                {%- set src = item['src'] -%}
                {%- set _wname = src.get('weave', '') -%}
                {%- if _wname in ns.visited -%}
                  {%- set ns.errors = ns.errors + [{'code': 'cycle_detected', 'weave': _wname, 'cycle_path': ns.visited + [_wname]}] -%}
                {%- else -%}
                  {%- set ns.visited = ns.visited + [_wname] -%}
                  {%- set _sub_cabs = ([src['cabinet']] if src.get('cabinet') else []) + _all_cabs -%}
                  {%- set _sub_ns = namespace(sub_def=none) -%}
                  {%- for _ce in _sub_cabs -%}
                    {%- if _sub_ns.sub_def is none -%}
                      {%- set _cv = state_attr(_ce, 'variables') | default({}, true) -%}
                      {%- set _entry = (_cv or {}).get(_wname.split('/') | map('lower') | map('slugify') | join('/'), {}) -%}
                      {%- set _val = (_entry.get('value') if _entry is mapping else none) -%}
                      {%- set _val = _val.get('content', _val) if (_val is mapping and _val.get('v') == 1) else _val -%}
                      {%- set _val = (_val | from_json(none)) if (_val is string and _val | trim not in ['', 'null', 'None']) else _val -%}
                      {%- if _val is mapping and _val.get('sources') is not none -%}
                        {%- set _sub_ns.sub_def = _val -%}
                      {%- endif -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {%- if _sub_ns.sub_def is none -%}
                    {%- set ns.errors = ns.errors + [{'code': 'weave_not_found', 'weave': _wname}] -%}
                  {%- elif _max_d < 1 -%}
                    {%- set ns.errors = ns.errors + [{'code': 'depth_exceeded', 'weave': _wname, 'at_depth': 1}] -%}
                  {%- else -%}
                    {%- set _leaf_ns = namespace(d={}) -%}
                    {%- for _ss in (_sub_ns.sub_def.get('sources', []) or []) -%}
                      {%- if _ss.get('weave') is not none -%}
                        {%- set ns.queue = ns.queue + [{'src': _ss, 'parent_key': src['key']}] -%}
                      {%- elif _ss.get('key') and _ss.get('cabinet') and _ss.get('drawer') -%}
                        {%- set _cv2 = state_attr(_ss['cabinet'], 'variables') | default({}, true) -%}
                        {%- set _entry2 = (_cv2 or {}).get(_ss['drawer'].split('/') | map('lower') | map('slugify') | join('/'), {}) -%}
                        {%- set _raw2 = (_entry2.get('value') if _entry2 is mapping else none) -%}
                        {%- set _raw2 = _raw2.get('content', _raw2) if (_raw2 is mapping and _raw2.get('v') == 1) else _raw2 -%}
                        {%- set _raw2 = (_raw2 | from_json(none)) if (_raw2 is string and _raw2 | trim not in ['', 'null', 'None']) else _raw2 -%}
                        {%- set _raw2 = _raw2 if _raw2 is mapping else {} -%}
                        {%- if _raw2 | length > 20 and _ss.get('mask') is none -%}
                          {%- set ns.errors = ns.errors + [{'code': 'mask_required', 'source_key': src['key'] ~ '.' ~ _ss['key'], 'drawer': _ss['drawer'], 'key_count': _raw2 | length}] -%}
                        {%- else -%}
                          {%- set _mn2 = namespace(d={}) -%}
                          {%- for k2, v2 in _raw2.items() -%}
                            {%- if _ss.get('mask') is none or k2 in _ss['mask'] -%}
                              {%- set _nk2 = _ss.get('rename', {}).get(k2, k2) if _ss.get('rename') else k2 -%}
                              {%- set _mn2.d = _mn2.d | combine({_nk2: v2}) -%}
                            {%- endif -%}
                          {%- endfor -%}
                          {%- set _leaf_ns.d = _leaf_ns.d | combine({_ss['key']: _mn2.d}) -%}
                        {%- endif -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {%- set ns.compiled = ns.compiled | combine({src['key']: _leaf_ns.d}) -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}

              {#- PASS 2: depth-2 weave sources #}
              {%- set _q2 = ns.queue -%}
              {%- set ns.queue = [] -%}
              {%- for item in _q2 -%}
                {%- set src = item['src'] -%}
                {%- set _pk = item.get('parent_key', '') -%}
                {%- set _wname = src.get('weave', '') -%}
                {%- if _max_d < 2 -%}
                  {%- set ns.errors = ns.errors + [{'code': 'depth_exceeded', 'weave': _wname, 'at_depth': 2}] -%}
                {%- elif _wname in ns.visited -%}
                  {%- set ns.errors = ns.errors + [{'code': 'cycle_detected', 'weave': _wname, 'cycle_path': ns.visited + [_wname]}] -%}
                {%- else -%}
                  {%- set ns.visited = ns.visited + [_wname] -%}
                  {%- set _sub_cabs2 = ([src['cabinet']] if src.get('cabinet') else []) + _all_cabs -%}
                  {%- set _sub_ns2 = namespace(sub_def=none) -%}
                  {%- for _ce in _sub_cabs2 -%}
                    {%- if _sub_ns2.sub_def is none -%}
                      {%- set _cv = state_attr(_ce, 'variables') | default({}, true) -%}
                      {%- set _entry = (_cv or {}).get(_wname.split('/') | map('lower') | map('slugify') | join('/'), {}) -%}
                      {%- set _val = (_entry.get('value') if _entry is mapping else none) -%}
                      {%- set _val = _val.get('content', _val) if (_val is mapping and _val.get('v') == 1) else _val -%}
                      {%- set _val = (_val | from_json(none)) if (_val is string and _val | trim not in ['', 'null', 'None']) else _val -%}
                      {%- if _val is mapping and _val.get('sources') is not none -%}
                        {%- set _sub_ns2.sub_def = _val -%}
                      {%- endif -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {%- if _sub_ns2.sub_def is none -%}
                    {%- set ns.errors = ns.errors + [{'code': 'weave_not_found', 'weave': _wname}] -%}
                  {%- else -%}
                    {%- set _leaf_ns2 = namespace(d={}) -%}
                    {%- for _ss in (_sub_ns2.sub_def.get('sources', []) or []) -%}
                      {%- if _ss.get('weave') is not none -%}
                        {%- set ns.errors = ns.errors + [{'code': 'depth_exceeded', 'weave': _ss['weave'], 'at_depth': 3, 'message': 'max_depth reached — increase weave_max_depth (max 3) or flatten this definition'}] -%}
                      {%- elif _ss.get('key') and _ss.get('cabinet') and _ss.get('drawer') -%}
                        {%- set _cv3 = state_attr(_ss['cabinet'], 'variables') | default({}, true) -%}
                        {%- set _entry3 = (_cv3 or {}).get(_ss['drawer'].split('/') | map('lower') | map('slugify') | join('/'), {}) -%}
                        {%- set _raw3 = (_entry3.get('value') if _entry3 is mapping else none) -%}
                        {%- set _raw3 = _raw3.get('content', _raw3) if (_raw3 is mapping and _raw3.get('v') == 1) else _raw3 -%}
                        {%- set _raw3 = (_raw3 | from_json(none)) if (_raw3 is string and _raw3 | trim not in ['', 'null', 'None']) else _raw3 -%}
                        {%- set _raw3 = _raw3 if _raw3 is mapping else {} -%}
                        {%- if _raw3 | length > 20 and _ss.get('mask') is none -%}
                          {%- set ns.errors = ns.errors + [{'code': 'mask_required', 'source_key': _pk ~ '.' ~ src['key'] ~ '.' ~ _ss['key'], 'drawer': _ss['drawer'], 'key_count': _raw3 | length}] -%}
                        {%- else -%}
                          {%- set _mn3 = namespace(d={}) -%}
                          {%- for k3, v3 in _raw3.items() -%}
                            {%- if _ss.get('mask') is none or k3 in _ss['mask'] -%}
                              {%- set _nk3 = _ss.get('rename', {}).get(k3, k3) if _ss.get('rename') else k3 -%}
                              {%- set _mn3.d = _mn3.d | combine({_nk3: v3}) -%}
                            {%- endif -%}
                          {%- endfor -%}
                          {%- set _leaf_ns2.d = _leaf_ns2.d | combine({_ss['key']: _mn3.d}) -%}
                        {%- endif -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {# Merge into parent key's dict if parent_key exists #}
                    {%- if _pk and _pk in ns.compiled -%}
                      {%- set _parent_existing = ns.compiled[_pk] if ns.compiled[_pk] is mapping else {} -%}
                      {%- set ns.compiled = ns.compiled | combine({_pk: _parent_existing | combine({src['key']: _leaf_ns2.d})}) -%}
                    {%- else -%}
                      {%- set ns.compiled = ns.compiled | combine({src['key']: _leaf_ns2.d}) -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}

              {{ {'compiled': ns.compiled, 'errors': ns.errors} | tojson }}

        # Size check + VirtualDrawer hint + final result
        - variables:
            _w_result: >-
              {%- set _cr = _w_compiled if _w_compiled is mapping else (_w_compiled | from_json({})) -%}
              {%- set _compiled = _cr.get('compiled', {}) -%}
              {%- set _errors = _cr.get('errors', []) -%}
              {%- set _out_json = _compiled | tojson -%}
              {%- set _size = _out_json | length -%}
              {%- set _status = 'error' if (_errors | selectattr('code', 'in', ['mask_required','cycle_detected','definition_not_found','too_many_sources','invalid_source']) | list | length > 0) else 'ok' -%}
              {%- set _hint = none -%}
              {%- if _size > 2048 -%}
                {%- set _hint = 'Virtual tapestry: ' ~ _w_drawer ~ ' (' ~ _size ~ ' bytes, ' ~ (_w_def.get('sources', []) | length) ~ ' sources). Call mode=weave weave_drawer=' ~ _w_drawer ~ ' with a tighter mask to read inline.' -%}
              {%- endif -%}
              {%- set _truncated = _size > 8192 -%}
              {%- set _final_compiled = _compiled -%}
              {%- if _truncated -%}
                {%- set _trunc_ns = namespace(d={}, dropped=[], size=0) -%}
                {%- for k, v in _compiled.items() -%}
                  {%- set _entry_size = {k: v} | tojson | length -%}
                  {%- if _trunc_ns.size + _entry_size <= 8000 -%}
                    {%- set _trunc_ns.d = _trunc_ns.d | combine({k: v}) -%}
                    {%- set _trunc_ns.size = _trunc_ns.size + _entry_size -%}
                  {%- else -%}
                    {%- set _trunc_ns.dropped = _trunc_ns.dropped + [k] -%}
                  {%- endif -%}
                {%- endfor -%}
                {%- set _final_compiled = _trunc_ns.d -%}
              {%- endif -%}
              {{
                {
                  'status': _status,
                  'tool': 'zen_dojotools_filecabinet',
                  'action': _action_type,
                  'tapestry': _w_drawer if _w_drawer != '' else (_w_label if _w_label != '' else 'inline'),
                  'compiled': _final_compiled,
                  'value': _hint,
                  'size_bytes': _size,
                  'truncated': _truncated,
                  'dropped_sources': (_trunc_ns.dropped if _truncated else []),
                  'errors': _errors,
                  'trace': {'caller_token': _caller_token}
                }
              }}

        # For weave_preview: add depth_map + preview_token
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _action_type == 'weave_preview' }}"
            sequence:
            - variables:
                _w_preview_token: >-
                  {{ (weave_sources | default('', true) | string | length | string) + '-' + now().strftime('%Y-%m-%dT%H:%M') }}
                _w_depth_map: >-
                  {%- set _srcs = _w_def.get('sources', []) or [] -%}
                  {%- set _ns = namespace(d={}) -%}
                  {%- for src in _srcs -%}
                    {%- if src.get('weave') -%}
                      {%- set _ns.d = _ns.d | combine({src['key']: {'depth': 1, 'type': 'weave', 'weave': src['weave']}}) -%}
                    {%- elif src.get('key') -%}
                      {%- set _ns.d = _ns.d | combine({src['key']: {'depth': 0, 'type': 'drawer', 'cabinet': src.get('cabinet', ''), 'drawer': src.get('drawer', '')}}) -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ _ns.d }}
            - variables:
                result: >-
                  {{ _w_result | combine({
                    'preview_token': _w_preview_token,
                    'depth_map': _w_depth_map,
                    'hint': 'Call mode=weave_save weave_sources=<definition> preview_token=' ~ _w_preview_token ~ ' volume_entity_id=<cabinet> path=<drawer_name> force_action=true to save this definition.'
                  }) }}
            - stop: weave_preview done
              response_variable: result
        - variables:
            result: "{{ _w_result }}"
        - stop: weave done
          response_variable: result

    # --- Route: cabinet ---
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ _stack == 'cabinet' }}"
        sequence:
        - action: script.zen_sutra_filecabinet
          response_variable: result
          continue_on_error: true
          data:
            action: "{{ _action_type }}"
            volume_entity_id: "{{ _vol }}"
            path: "{{ _path }}"
            title: "{{ title | default('', true) }}"
            description: "{{ description | default('', true) }}"
            value: "{{ _content }}"
            mode: "{{ mode | default('', true) }}"
            tags: "{{ _tags }}"
            query: "{{ query | default('', true) }}"
            destination_path: "{{ destination_path | default('', true) }}"
            path_prefix: "{{ path_prefix | default('', true) }}"
            anchor_type: "{{ anchor_type | default('label') }}"
            anchor_ids: "{{ anchor_ids | default('', true) }}"
            expires_after: "{{ expires_after | default('', true) }}"
            no_autoexpire: "{{ no_autoexpire | default(none) }}"
            no_autorecycle: "{{ no_autorecycle | default(none) }}"
            force_action: "{{ force_action | default(false) }}"
            raw_key: "{{ raw_key | default(false) }}"
            create_label: "{{ create_label | default(false) }}"
            destination_cabinet: "{{ destination_cabinet | default('', true) }}"
            destination_volume_entity_id: "{{ destination_volume_entity_id | default('', true) }}"
            target_guid: "{{ target_guid | default('', true) }}"
            show_hidden_volumes: "{{ show_hidden_volumes | default(false) }}"
            show_stacks: "{{ show_stacks | default(false) }}"
            transfer_guid: "{{ transfer_guid | default(false) }}"
            fc_args: "{{ fc_args | default('', true) }}"
            source_created_at: "{{ source_created_at | default('', true) }}"
            source_cabinet: "{{ source_cabinet | default('', true) }}"
            target_cabinet: "{{ target_cabinet | default('', true) }}"
            space_threshold: "{{ space_threshold | default(85) }}"
            caller_token: "{{ _caller_token }}"
        - variables:
            result: >-
              {%- if _is_read_alias and result is mapping and result.get('status') == 'success' and result.get('value') is not none -%}
                {{ result | combine({'result': {_path: result.get('value')}}) }}
              {%- else -%}
                {{ result }}
              {%- endif -%}
        - stop: knowledge cabinet done
          response_variable: result

    # --- Unknown stack fallback ---
    - variables:
        result:
          status: error
          tool: zen_dojotools_filecabinet
          action: "{{ _action_type }}"
          message: "Unknown stack: {{ _stack }}. Use wiki, cabinet, or all."
    - stop: knowledge unknown stack
      response_variable: result
