                      'action': 'get',
                      'key': _key,
                      'volume': _vol,
                      'trace': {'caller_token': _caller_token}
                    }
                  }}
                {%- else -%}
                  {{
                    {
                      'status': 'success',
                      'tool': 'zen_sutra_filecabinet',
                      'action': 'get',
                      'key': _key,
                      'volume': _vol,
                      'title': _gt,
                      'value': _gv,
                      'description': _gd,
                      'created_at': _gca,
                      'updated_at': _gua,
                      'expires_after': _gea,
                      'no_autoexpire': _gna,
                      'no_autorecycle': _gnr,
                      'tags': _get_tags,
                      'v': 1,
                      'trace': {'caller_token': _caller_token}
                    } | combine({'mount_traversal': _g_mt} if _g_mt is mapping else {})
                      | combine({'drawers': _drawers} if _drawers is mapping else {})
                      | combine({'has_children': true, 'subdrawers': _subdrawers} if _subdrawers | length > 0 else {})
