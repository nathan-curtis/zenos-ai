                      "actions": ["get", "create", "update", "upsert", "delete", "list", "move", "copy", "relabel", "search", "stacks_by_anchor", "clone", "set_mount", "remove_mount", "mount_cabinet", "dismount_cabinet", "set_cabinet_ro", "manifest", "register", "unregister", "inspect", "health", "audit"],
                      "not_supported": ["render"],
