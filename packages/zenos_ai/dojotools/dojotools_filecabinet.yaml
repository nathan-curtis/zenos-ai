###############################################################################
# ZenOS-AI: FileCabinet DojoTool + FileCabinet Sutra
# File: dojotools_filecabinet.yaml
# Version: 6.13.0 — hard block _label_index in set_mount + expand_drawer: unsupported until traversal handles mount-pointer index reads.
#   Previous: 6.12.0 — fleet discovery: broad zenos_.*_cabinet pattern (catches history, index, expansion); history role classification.
#   Previous: 6.11.0 — fleet mode: single-call full cabinet fleet view (named + expansion), GUIDs, mount resolution, fat/broken/slot hints.
#   Previous: 6.10.0 — sutra fields: add destination_volume_entity_id (was missing, caused _dest_vol='' on cross-cabinet copy).
#   Previous: 6.9.0 — copy cross-cabinet bug fix: write + verify now target _dest_vol, not source _vol.
#   Previous: 6.8.0 — sitrep discovery via states.sensor (finds unlabeled cabs); system drawers excluded from empty-target + user_keys checks.
#   Previous: 6.7.0 — raw_key=true (REPAIRS ONLY): skip slugification, requires force_action=true confirmation.
#   Previous: 6.6.0 — expansion_sitrep: inventory all expansion cabinets, usage, % full, target eligibility.
#   Previous: 6.5.0 — expansion cabinet class: locked write target, hosted_by parent, stamp on expand_drawer completion.
#   Previous: 6.3.0 — Write-mount traversal: create/update/upsert follow mount_point drawers transparently.
#   Previous: 6.2.0 — Cabception: nested drawer trees via / path separator.
#   get returns subdrawers+has_children when children exist (additive, no contract break).
#   move/delete cascade to all children (prefix scan). move child cascade is
#   write-verified before delete (same safety guarantee as parent node).
#   copy cascades subtree. inspect drawer_key surfaces subdrawers inline.
#   Previous: 6.1.2 — v5-parity repair pass (A1–A11)
#
# zen_sutra_filecabinet — internal terminus (NOT MCP-exposed)
# zen_dojotools_filecabinet       — MCP-facing surface (expose this to MCP)
#
# Layer stack:
#   zen_dojotools_filecabinet (DojoTool, MCP face)
#     ├─ stack=wiki    → zen_sutra_wikijs (existing)
#     └─ stack=cabinet → zen_sutra_filecabinet (this file)
#                          → CABS (reads) + set/remove_variable_legacy (writes)
#
# Storage format (v6.2+):
#   Each drawer:   { value: <raw content>, timestamp: <auto-set> }
#   value can be anything — string, dict, list.
#   Migration:     Old v1-envelope drawers (value = dict with v:1 + content key) are
#                  auto-detected on GET/LIST/SEARCH and unwrapped transparently.
#   meta key:      Reserved for future ACL use — not yet written by this sutra.
#
# Tags: HA Labels ARE the tag system — stored in _label_index drawer.
# Path: used as cabinet key directly (strip leading /).
#
# IMPORTANT — Two licensed cabinet access paths (HARD RULE, forever):
#   1. Call script.zen_dojotools_filecabinet — for ALL consumers
#   2. import CABS — ONLY here in zen_sutra_filecabinet (terminus)
#   This file is the terminus. It does NOT call script.zen_dojotools_filecabinet
#   on its own volume — that would create a loop at prod rename.
###############################################################################

script:

  ##############################################################################
  # SUTRA — Internal terminus. NOT MCP-exposed.
  ##############################################################################
  zen_sutra_filecabinet:
    alias: Zen DojoTools FileCabinet Sutra (Internal)
    description: >
      Internal FileCabinet terminus. NOT MCP-exposed. Implements the cabinet
      knowledge stack: get/create/update/upsert/delete/list/move/copy and
      Lens Bus contract v0.2.0. Called only by zen_dojotools_filecabinet.
      Cabception (v6.2.0): drawer keys using / as path separator form virtual
      trees. get returns subdrawers+has_children. move/delete/copy cascade
      to all children. move child writes are verified before source delete.
    mode: parallel
    icon: mdi:cabinet
    fields:
      mode:
        name: Mode
        description: "Dispatch: get|create|update|upsert|delete|list|move|copy|search|relabel|manifest|clone|set_mount|remove_mount|mount_cabinet|dismount_cabinet|set_cabinet_ro|stacks_by_anchor|register|unregister|inspect|health|audit|fleet|help. Preferred over action: (legacy)."
        selector:
          select:
            options:
            - get
            - create
            - update
            - upsert
            - delete
            - list
            - move
            - copy
            - search
            - relabel
            - manifest
            - clone
            - set_mount
            - remove_mount
            - mount_cabinet
            - dismount_cabinet
            - set_cabinet_ro
            - stacks_by_anchor
            - register
            - unregister
            - inspect
            - health
            - audit
            - help
            - expand_drawer
            - tool_manifest
      action_type:
        name: Action Type (legacy)
        description: "Legacy alias for mode:. Accepted for backcompat — use mode: going forward."
        selector:
          select:
            options:
            - get
            - create
            - update
            - upsert
            - delete
            - list
            - move
            - copy
            - search
            - relabel
            - manifest
            - clone
            - set_mount
            - remove_mount
            - mount_cabinet
            - dismount_cabinet
            - set_cabinet_ro
            - stacks_by_anchor
            - register
            - unregister
            - inspect
            - health
            - audit
            - expand_drawer
      volume_entity_id:
        name: Volume Entity ID
        description: Cabinet sensor entity ID to operate on.
        selector:
          text:
      path:
        name: Path
        description: "Drawer key (path is used as key). Required for get/create/update/upsert/delete/move/copy."
        selector:
          text:
      title:
        name: Title
        description: Document title (required for create/upsert).
        selector:
          text:
      description:
        name: Description
        description: Short document description.
        selector:
          text:
      value:
        name: Value
        description: Drawer value (cabinet) or page content (wiki). Required for create/update/upsert. FC handles serialization — do NOT tojson before passing.
        selector:
          text:
            multiline: true
      merge:
        name: Merge
        description: "Force merge (deep-merge into existing value) regardless of action. Omit to use action default (update=replace, all others=merge)."
        required: false
        selector:
          boolean:
      destination_path:
        name: Destination Path
        description: Target key for move or copy.
        selector:
          text:
      destination_volume_entity_id:
        name: Destination Volume Entity ID
        description: "Target cabinet entity_id for cross-cabinet copy/move (e.g. sensor.zenos_expansion_cabinet_1)."
        required: false
        selector:
          text:
      path_prefix:
        name: Path Prefix
        description: Filter list results to keys starting with this prefix.
        selector:
          text:
      anchor_type:
        name: Anchor Type
        description: "Lens anchor type: label | concept | area_id | zone | person"
        selector:
          select:
            options:
            - label
            - concept
            - area_id
            - zone
            - person
            - product
            - ticket
            - document
            - company
            - household
        default: label
      anchor_ids:
        name: Anchor IDs
        description: Comma-separated or JSON array of anchor IDs for stacks_by_anchor.
        selector:
          text:
      tags:
        name: Tags / Labels
        description: "Comma-separated or JSON array of HA labels. Used by relabel (updates _label_index for the drawer)."
        selector:
          text:
      query:
        name: Search Query
        description: "Text to match against drawer key, title, content, or description. Used by search action."
        selector:
          text:
      source_created_at:
        name: Source Created At
        description: "Provenance timestamp from cross-stack transfer source. Sets created_at in envelope."
        required: false
        selector:
          text:
      expires_after:
        name: Expires After
        description: "ISO 8601 datetime after which this drawer may be GC'd."
        required: false
        selector:
          text:
      no_autoexpire:
        name: No Auto-expire
        description: "If true, GC will not expire this drawer even past expires_after."
        required: false
        selector:
          boolean:
      no_autorecycle:
        name: No Auto-recycle
        description: "If true, GC will not recycle this drawer."
        required: false
        selector:
          boolean:
      force_action:
        name: Force Action
        description: "If true, create overwrites an existing key (same as upsert mode=replace)."
        required: false
        selector:
          boolean:
      raw_key:
        name: Raw Key
        description: "REPAIRS ONLY. Skip key slugification — use path exactly as given. Requires force_action=true or hard-rejects. Use only to repair keys written outside FC (e.g. raw events with hyphens) that can no longer be reached. Logs a warning on every use."
        required: false
        selector:
          boolean:
      create_label:
        name: Create Label
        description: "If true, auto-create any HA labels in tags that are not in the registry."
        required: false
        selector:
          boolean:
      destination_cabinet:
        name: Destination Cabinet
        description: "Target cabinet entity_id for clone."
        required: false
        selector:
          text:
      target_guid:
        name: Target GUID
        description: "Cabinet GUID to mount (required for set_mount)."
        required: false
        selector:
          text:
      show_hidden_volumes:
        name: Show Hidden Volumes
        description: "manifest: include hidden/system volumes."
        required: false
        selector:
          boolean:
      show_stacks:
        name: Show Stacks
        description: "manifest: include online_unmounted cabinets."
        required: false
        selector:
          boolean:
      transfer_guid:
        name: Transfer GUID
        description: "clone: GUID travels to destination (Highlander mode). Requires force_action=true."
        required: false
        selector:
          boolean:
      fc_args:
        name: FC Args
        description: "set_mount: JSON object for tool-call mount args."
        required: false
        selector:
          text:
      source_cabinet:
        name: Source Cabinet (expand_drawer only)
        description: Entity ID of the cabinet that currently holds the drawer to migrate.
        required: false
        selector:
          text:
      target_cabinet:
        name: Target Cabinet (expand_drawer only)
        description: Entity ID of the expansion cabinet to migrate the drawer into.
        required: false
        selector:
          text:
      space_threshold:
        name: Space Threshold % (expand_drawer only)
        description: Abort if source stays at or above this % after migration. Default 85.
        required: false
        selector:
          number:
            min: 50
            max: 99
            mode: box
      caller_token:
        name: Caller Token
        selector:
          text:

    sequence:

    # --- Normalize inputs ---
    - variables:
        _action: >-
          {%- set _m = mode | default('', true) | string | trim | lower -%}
          {%- if _m != '' and _m not in ['merge', 'replace'] -%}{{ _m }}
          {%- else -%}{{ action_type | default(action | default('get', true), true) | string | trim | lower }}
          {%- endif -%}
        _vol: >-
          {%- set _vi = volume_entity_id | default('', true) -%}
          {%- if _vi is string -%}{{ _vi | trim }}
          {%- elif _vi is sequence and _vi is not mapping -%}{{ _vi | first | default('') | string | trim }}
          {%- elif _vi is mapping -%}
          {%- else -%}{{ _vi | string | trim }}{%- endif -%}
        _key: >-
          {%- set _rk = path | default(key | default('', true), true) | string | trim | regex_replace('^/', '') -%}
          {%- set _segs = _rk.split('/') -%}
          {%- set _ns = namespace(parts=[]) -%}
          {%- for _seg in _segs -%}
            {%- set _s = _seg | lower | slugify -%}
            {%- if loop.first and _rk.startswith('_') -%}
              {%- set _ns.parts = _ns.parts + ['_' ~ _s[1:] if _s.startswith('_') else '_' ~ _s] -%}
            {%- else -%}
              {%- set _ns.parts = _ns.parts + [_s] -%}
            {%- endif -%}
          {%- endfor -%}
          {{- _ns.parts | join('/') -}}
        _title: "{{ title | default('', true) | string | trim }}"
        _description: "{{ description | default('', true) | string | trim }}"
        _content: >-
          {%- set _craw = value | default('') -%}
          {%- if _craw is mapping or (_craw is sequence and _craw is not string) -%}
            {{- _craw -}}
          {%- elif (_craw | string | trim)[:1] in ['{', '['] or (_craw | string | trim) in ['true', 'false', 'null'] -%}
            {%- set _cparsed = _craw | from_json(none) -%}
            {{- _cparsed if _cparsed is not none else _craw -}}
          {%- else -%}
            {{- _craw | string | trim -}}
          {%- endif -%}
        _mode: >-
          {%- set _ml = mode | default('', true) | string | trim | lower -%}
          {%- if _ml in ['merge', 'replace'] -%}{{ _ml }}
          {%- elif _action == 'update' -%}replace
          {%- else -%}merge{%- endif -%}
        _dest: >-
          {%- set _rd = destination_path | default('', true) | string | trim | regex_replace('^/', '') -%}
          {%- set _ns = namespace(parts=[]) -%}
          {%- for _seg in _rd.split('/') -%}{%- set _ns.parts = _ns.parts + [_seg | lower | slugify] -%}{%- endfor -%}
          {{- _ns.parts | join('/') -}}
        _path_prefix: >-
          {%- set _rp = path_prefix | default('', true) | string | trim | regex_replace('^/', '') -%}
          {%- set _ns = namespace(parts=[]) -%}
          {%- for _seg in _rp.split('/') -%}{%- set _ns.parts = _ns.parts + [_seg | lower | slugify] -%}{%- endfor -%}
          {{- _ns.parts | join('/') -}}
        _caller_token: "{{ caller_token | default('') }}"
        _hh: "{{ states('sensor.zen_default_household_cabinet_resolved') }}"
        _anchor_type: "{{ anchor_type | default('label') | string | trim | lower }}"
        _sc_at: "{{ source_created_at | default('', true) | string | trim }}"
        _anchor_ids_raw: >-
          {%- set raw = anchor_ids | default('', true) -%}
          {%- if raw is sequence and raw is not string -%}{{ raw | list }}
          {%- else -%}
            {%- set rs = raw | string | trim -%}
            {%- if rs == '' or rs == '[]' -%}{{ [] }}
            {%- elif rs[:1] == '[' -%}{{ rs | from_json | default([]) }}
            {%- else -%}{{ rs.split(',') | map('trim') | select | list }}{%- endif -%}
          {%- endif -%}
        _expires_after: "{{ expires_after | default('', true) | string | trim }}"
        _no_autoexpire: "{{ no_autoexpire | default(none) }}"
        _no_autorecycle: "{{ no_autorecycle | default(none) }}"
        _force_action: "{{ force_action | default(false) | bool }}"
        _create_label: "{{ create_label | default(false) | bool }}"
        _dest_cab: "{{ destination_cabinet | default('', true) | string | trim }}"
        _dest_vol: "{{ destination_volume_entity_id | default('', true) | string | trim }}"
        _target_guid: "{{ target_guid | default('', true) | string | trim }}"
        _show_hidden: "{{ show_hidden_volumes | default(false) | bool }}"
        _show_stacks: "{{ show_stacks | default(false) | bool }}"
        _transfer_guid: "{{ transfer_guid | default(false) | bool }}"
        _fc_args: >-
          {%- set _r = fc_args | default('', true) -%}
          {%- if _r is mapping -%}{{ _r | tojson }}
          {%- elif _r is string and _r | trim != '' -%}{{ _r | trim }}
          {%- else -%}{%- endif -%}
        _now: "{{ now().isoformat() }}"
        _raw_key: "{{ raw_key | default(false) | bool }}"

    # --- tool_manifest early exit ---
    - if: "{{ _action == 'tool_manifest' }}"
      then:
      - variables:
          result: >-
            {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
            {{- MF.tool_manifest(
              tool='zen_sutra_filecabinet',
              display_name='FileCabinet Sutra (Internal)',
              tier='sutra',
              version='6.2.0',
              health={'configured': true, 'status': 'ok', 'notes': []},
              required_labels=['dojotools'],
              optional_labels=['cabinet', 'knowledge'],
              failure_policy='hard',
              mcp_exposed=false,
              stripe=0,
              impact='hard',
              caller_token=_caller_token
            ) | from_json -}}
      - stop: zen_sutra_filecabinet tool_manifest
        response_variable: result

    # --- raw_key gate: requires force_action=true or hard-rejects ---
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ _raw_key and not _force_action }}"
        sequence:
        - variables:
            result:
              status: error
              tool: zen_sutra_filecabinet
              action: "{{ _action }}"
              message: >-
                raw_key=true bypasses key slugification and can delete keys that were written
                outside FC — this is a destructive admin operation with no undo.
                You MUST also pass force_action=true to confirm you know what you are doing.
              trace:
                caller_token: "{{ _caller_token }}"
        - stop: filecabinet raw_key requires force_action confirmation
          response_variable: result

    # --- raw_key override: skip slugification, log warning on use ---
    - variables:
        _key: >-
          {%- if _raw_key -%}
            {{- path | default(key | default('', true), true) | string | trim | regex_replace('^/', '') -}}
          {%- else -%}
            {{- _key -}}
          {%- endif -%}

    - if: "{{ _raw_key and _force_action }}"
      then:
      - action: logbook.log
        data:
          name: "FileCabinet — RAW_KEY REPAIR"
          message: >
            ⚠ raw_key REPAIR used on {{ _vol }} key='{{ _key }}'.
            Slugification skipped — repair mode only. I hope you knew what you were doing.
          entity_id: "{{ _vol }}"
          domain: sensor

    # --- Guard: volume required for data actions ---
    - choose:
      - conditions:
        - condition: template
          value_template: >-
            {{ _vol == '' and _action not in
               ['register', 'unregister', 'inspect', 'health', 'audit', 'stacks_by_anchor', 'manifest', 'expand_drawer', 'expansion_sitrep', 'fleet'] }}
        sequence:
        - variables:
            result:
              status: error
              tool: zen_sutra_filecabinet
              action: "{{ _action }}"
              message: "volume_entity_id is required for action={{ _action }}"
              trace:
                caller_token: "{{ _caller_token }}"
        - stop: filecabinet sutra missing volume
          response_variable: result

    # --- Guard: volume must be a real cabinet (has variables attribute) ---
    - choose:
      - conditions:
        - condition: template
          value_template: >-
            {{ _vol != '' and state_attr(_vol, 'variables') is none and
               _action not in ['register', 'unregister', 'inspect', 'audit', 'expand_drawer'] }}
        sequence:
        - variables:
            result:
              status: error
              tool: zen_sutra_filecabinet
              action: "{{ _action }}"
              volume: "{{ _vol }}"
              message: >-
                {{ _vol }} is not a cabinet entity (no variables attribute).
                Pass the actual cabinet entity_id (e.g. sensor.zenos_expansion_cabinet_1),
                not a resolver sensor (e.g. sensor.zen_dojo_cabinet_resolved).
              trace:
                caller_token: "{{ _caller_token }}"
        - stop: filecabinet sutra not a cabinet
          response_variable: result

    # --- Guard: system cabinet HARD READ-ONLY ---
    - choose:
      - conditions:
        - condition: template
          value_template: >-
            {{ _vol == 'sensor.zenos_system_cabinet' and
               _action in ['create', 'update', 'upsert', 'delete', 'move', 'copy',
                           'relabel', 'set_mount', 'remove_mount', 'mount_cabinet', 'dismount_cabinet'] }}
        sequence:
        - variables:
            result:
              status: error
              tool: zen_sutra_filecabinet
              action: "{{ _action }}"
              volume: "{{ _vol }}"
              message: "sensor.zenos_system_cabinet is HARD READ-ONLY. No writes permitted."
              trace:
                caller_token: "{{ _caller_token }}"
        - stop: filecabinet sutra syscab lockout
          response_variable: result

    # --- Guard: cabinet RO flag ---
    - choose:
      - conditions:
        - condition: template
          value_template: >-
            {%- set _g_vars = state_attr(_vol, 'variables') or {} -%}
            {%- set _g_vi = _g_vars.get('AI_Cabinet_VolumeInfo', {}) -%}
            {%- set _g_vi = _g_vi if _g_vi is mapping else {} -%}
            {%- set _g_viv = _g_vi.get('value', _g_vi) -%}
            {%- set _g_viv = _g_viv if _g_viv is mapping else (_g_viv | from_json(none) if _g_viv is string and _g_viv | trim not in ['', 'null'] else {}) -%}
            {%- set _g_viv = _g_viv if _g_viv is mapping else {} -%}
            {%- set _g_flags = _g_viv.get('flags', {}) -%}
            {%- set _g_ro = (_g_flags.get('cabinet_ro', false) == true) if _g_flags is mapping else false -%}
            {%- set _g_rof_e = _g_vars.get('ro_flag', {}) -%}
            {%- set _g_rof = (_g_rof_e.get('value', false) | bool(false)) if _g_rof_e is mapping else false -%}
            {{ _vol != '' and _action in ['create', 'update', 'upsert', 'delete', 'move', 'copy'] and (_g_ro or _g_rof) }}
        sequence:
        - variables:
            result:
              status: error
              tool: zen_sutra_filecabinet
              action: "{{ _action }}"
              volume: "{{ _vol }}"
              message: "Cabinet is read-only (ro_flag set). No writes permitted."
              trace:
                caller_token: "{{ _caller_token }}"
        - stop: filecabinet sutra cabinet ro
          response_variable: result

    # --- Guard: zen_scroll is read-only ---
    - choose:
      - conditions:
        - condition: template
          value_template: >-
            {{ _key == 'zen_scroll' and
               _action in ['create', 'update', 'upsert', 'delete', 'move', 'copy'] }}
        sequence:
        - variables:
            result:
              status: error
              tool: zen_sutra_filecabinet
              action: "{{ _action }}"
              key: "{{ _key }}"
              volume: "{{ _vol }}"
              message: "zen_scroll is a read-only system drawer and cannot be modified."
              trace:
                caller_token: "{{ _caller_token }}"
        - stop: filecabinet sutra zen_scroll ro
          response_variable: result

    # --- Guard: reserved _ keys require force_action ---
    - choose:
      - conditions:
        - condition: template
          value_template: >-
            {{ _key.startswith('_') and not _force_action and
               _action in ['create', 'update', 'upsert', 'delete', 'move', 'copy'] }}
        sequence:
        - variables:
            result:
              status: error
              tool: zen_sutra_filecabinet
              action: "{{ _action }}"
              key: "{{ _key }}"
              volume: "{{ _vol }}"
              message: "Keys starting with _ are reserved. Pass force_action=true to write/delete system drawers."
              trace:
                caller_token: "{{ _caller_token }}"
        - stop: filecabinet sutra reserved key
          response_variable: result

    # --- Guard: protected system drawers (non-underscore spellings) ---
    - choose:
      - conditions:
        - condition: template
          value_template: >-
            {%- set _prot = ['ai_cabinet_volumeinfo', 'label_index', 'zen_relationships', 'meta'] -%}
            {{ (_key in _prot and _action in ['create', 'update', 'upsert', 'delete', 'move', 'copy', 'set_mount'])
               or (_dest in _prot and _action in ['move', 'copy']) }}
        sequence:
        - variables:
            result:
              status: error
              failure: protected_drawer
              tool: zen_sutra_filecabinet
              action: "{{ _action }}"
              key: "{{ _key }}"
              volume: "{{ _vol }}"
              message: >-
                Write blocked: '{{ _key }}' is a protected system drawer
                (ai_cabinet_volumeinfo, label_index, zen_relationships, meta).
                Use the appropriate admin tool for this operation.
              trace:
                caller_token: "{{ _caller_token }}"
        - stop: filecabinet sutra protected drawer
          response_variable: result

    # --- Guard: per-drawer read-only (meta.ro) ---
    - choose:
      - conditions:
        - condition: template
          value_template: >-
            {%- set _e = (state_attr(_vol, 'variables') or {}).get(_key, {}) -%}
            {%- set _m = _e.get('meta', {}) if _e is mapping else {} -%}
            {{ _action in ['create', 'update', 'upsert', 'delete', 'move', 'copy']
               and _m is mapping and _m.get('ro', false) == true }}
        sequence:
        - variables:
            result:
              status: error
              failure: drawer_ro
              tool: zen_sutra_filecabinet
              action: "{{ _action }}"
              key: "{{ _key }}"
              volume: "{{ _vol }}"
              message: "Write blocked: drawer '{{ _key }}' is read-only. Use CabinetAdmin set_ro_flag to clear before writing."
              trace:
                caller_token: "{{ _caller_token }}"
        - stop: filecabinet sutra drawer ro
          response_variable: result

    # --- Guard: volume health gate on writes ---
    - choose:
      - conditions:
        - condition: template
          value_template: >-
            {%- set _h = state_attr(_vol, 'health') or {} -%}
            {{ _vol != '' and _action in ['create', 'update', 'upsert', 'delete', 'move', 'copy',
                                          'set_mount', 'remove_mount', 'mount_cabinet', 'dismount_cabinet']
               and ( _h.get('status', '') == 'error'
                     or _h.get('guid_mismatch', false)
                     or not _h.get('writeable', true)
                     or (_h.get('storage_warning', false) and not _force_action) ) }}
        sequence:
        - variables:
            result: >-
              {%- set _h = state_attr(_vol, 'health') or {} -%}
              {{
                {
                  'status': 'error',
                  'failure': 'volume_not_healthy',
                  'tool': 'zen_sutra_filecabinet',
                  'action': _action,
                  'volume': _vol,
                  'message': 'Write blocked: volume not healthy.',
                  'health_snapshot': {
                    'status': _h.get('status', ''),
                    'mismatch': _h.get('guid_mismatch', false),
                    'writeable': _h.get('writeable', true),
                    'storage_warning': _h.get('storage_warning', false),
                    'force_action': _force_action
                  },
                  'trace': {'caller_token': _caller_token}
                }
              }}
        - stop: filecabinet sutra health blocked
          response_variable: result

    # --- RELABEL ---
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ _action == 'relabel' }}"
        sequence:
        - variables:
            _rl_exists: >-
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
              {{ CABS.cabinet_drawer_exists(_vol, _key) | from_json }}
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ not _rl_exists }}"
            sequence:
            - variables:
                result:
                  status: error
                  failure: drawer_not_found
                  tool: zen_sutra_filecabinet
                  action: relabel
                  key: "{{ _key }}"
                  volume: "{{ _vol }}"
                  message: "relabel requires an existing drawer. '{{ _key }}' not found."
                  trace:
                    caller_token: "{{ _caller_token }}"
            - stop: filecabinet sutra relabel not found
              response_variable: result
        - variables:
            _tags_for_index: >-
              {%- set _tr = tags | default('', true) -%}
              {%- if _tr is sequence and not _tr is string -%}
                {{- _tr | map('string') | map('lower') | map('slugify') | select('string') | list -}}
              {%- elif _tr is string and _tr | trim != '' -%}
                {{- _tr | replace('\n', ',') | regex_findall('[^,]+') | map('trim') | map('lower') | map('slugify') | select('string') | list -}}
              {%- else -%}
                []
              {%- endif -%}
        - variables:
            _relabel_idx: >-
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
              {%- set _v_s = CABS.cabinet_variables(_vol) -%}
              {%- set _v = _v_s if _v_s is mapping else (_v_s | from_json(none) if _v_s is string else none) -%}
              {%- set _ci = ((_v if _v is mapping else {}).get('_label_index', {}).get('value', {})) -%}
              {%- set _ci = _ci if _ci is mapping else (_ci | from_json(none) if _ci is string and _ci | trim not in ['', '{}', 'null'] else {}) -%}
              {%- set _ci = _ci if _ci is mapping else {} -%}
              {%- set _ds = _key -%}
              {%- set _ns = namespace(val = {}) -%}
              {%- for lbl, drawers in _ci.items() -%}
                {%- if drawers is iterable and not drawers is string -%}
                  {%- set _cleaned = drawers | reject('equalto', _ds) | list -%}
                  {%- if _cleaned | length > 0 -%}
                    {%- set _ns.val = _ns.val | combine({lbl: _cleaned}) -%}
                  {%- endif -%}
                {%- elif drawers != _ds -%}
                  {%- set _ns.val = _ns.val | combine({lbl: [drawers]}) -%}
                {%- endif -%}
              {%- endfor -%}
              {%- for _lbl in _tags_for_index -%}
                {%- if _lbl in labels() -%}
                  {%- set _e = _ns.val.get(_lbl) -%}
                  {%- set _ex = (_e if _e is iterable and not _e is string else [_e] if _e not in [none, ''] else []) -%}
                  {%- set _ns.val = _ns.val | combine({_lbl: (_ex + [_ds]) | unique | list}) -%}
                {%- endif -%}
              {%- endfor -%}
              {{- _ns.val -}}
        - event: set_variable_legacy
          event_data:
            key: _label_index
            value: "{{- _relabel_idx | tojson -}}"
            set_timestamp: true
            volume_entity: "{{- _vol -}}"
        - variables:
            _tags_dropped: >-
              {%- set _all = labels() -%}
              {%- set _ns = namespace(d=[]) -%}
              {%- for _lbl in _tags_for_index -%}
                {%- if _lbl not in _all -%}{%- set _ns.d = _ns.d + [_lbl] -%}{%- endif -%}
              {%- endfor -%}
              {{ _ns.d }}
        - variables:
            _labels_applied: >-
              {%- set _ns2 = namespace(a=[]) -%}
              {%- for _lbl in _tags_for_index -%}
                {%- if _lbl not in _tags_dropped -%}{%- set _ns2.a = _ns2.a + [_lbl] -%}{%- endif -%}
              {%- endfor -%}
              {{ _ns2.a }}
        - variables:
            result:
              status: success
              tool: zen_sutra_filecabinet
              action: relabel
              key: "{{ _key }}"
              volume: "{{ _vol }}"
              message: "Labels updated on drawer '{{ _key }}' (index only — drawer value unchanged)."
              labels_applied: "{{ _labels_applied }}"
              labels_dropped: "{{ _tags_dropped }}"
              trace:
                caller_token: "{{ _caller_token }}"
        - stop: filecabinet sutra relabel done
          response_variable: result

    # --- SEARCH (label match via _label_index + text scan via CABS) ---
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ _action == 'search' }}"
        sequence:
        - variables:
            _vars: >-
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
              {%- set _r = CABS.cabinet_variables(_vol, {}) -%}
              {%- if _r is mapping -%}{{ _r }}
              {%- elif _r is string and _r | trim not in ['', '{}'] -%}{{ _r | from_json | default({}) }}
              {%- else -%}{{ {} }}{%- endif -%}
        - variables:
            result: >-
              {%- set _q = query | default('', true) | string | trim | lower -%}
              {%- set _use_labels = _anchor_ids_raw is sequence and _anchor_ids_raw | length > 0 -%}
              {# Build label-matched key set from _label_index (source of truth for relabel) #}
              {%- set _idx = (_vars.get('_label_index', {}).get('value', {}) if _vars is mapping else {}) -%}
              {%- set _idx = _idx if _idx is mapping else (_idx | from_json(none) if _idx is string and _idx | trim not in ['', '{}', 'null'] else {}) -%}
              {%- set _idx = _idx if _idx is mapping else {} -%}
              {%- set _lm = namespace(keys=[]) -%}
              {%- if _use_labels -%}
                {%- for aid in _anchor_ids_raw -%}
                  {%- set _e = _idx.get(aid | lower | slugify, []) -%}
                  {%- set _lm.keys = (_lm.keys + (_e if _e is sequence else [])) | unique | list -%}
                {%- endfor -%}
              {%- endif -%}
              {%- set ns = namespace(results=[]) -%}
              {%- for k, drawer in (_vars if _vars is mapping else {}).items() -%}
                {%- if k != 'AI_Cabinet_VolumeInfo' and not k.startswith('_') -%}
                  {%- set _dv = drawer.get('value') if drawer is mapping else none -%}
                  {%- if _dv is mapping and _dv.get('v') == 1 and 'content' in _dv -%}
                    {%- set _sr_title = _dv.get('title', k) -%}
                    {%- set _sr_content = _dv.get('content', '') -%}
                    {%- set _sr_desc = _dv.get('description', '') -%}
                    {%- set _sr_ca = _dv.get('created_at', '') -%}
                    {%- set _sr_ua = _dv.get('updated_at', '') -%}
                  {%- else -%}
                    {%- set _sr_title = k -%}
                    {%- set _sr_content = (_dv | tojson) if (_dv is not none and _dv is not string) else (_dv if _dv is string else '') -%}
                    {%- set _sr_desc = '' -%}
                    {%- set _sr_ca = '' -%}
                    {%- set _sr_ua = (drawer.get('timestamp', '') if drawer is mapping else '') -%}
                  {%- endif -%}
                  {%- set _label_match = _use_labels and ((k | lower | slugify) in _lm.keys) -%}
                  {%- set _k_lc = k | lower -%}
                  {%- set _t_lc = _sr_title | string | lower -%}
                  {%- set _c_lc = _sr_content | string | lower -%}
                  {%- set _d_lc = _sr_desc | string | lower -%}
                  {%- set _text_match = _q != '' and (_q in _k_lc or _q in _t_lc or _q in _c_lc or _q in _d_lc) -%}
                  {%- if _label_match or _text_match -%}
                    {%- set _item = {
                      'key': k,
                      'path': k,
                      'title': _sr_title,
                      'description': _sr_desc,
                      'created_at': _sr_ca,
                      'updated_at': _sr_ua,
                      'entity_labels': []
                    } -%}
                    {%- set ns.results = ns.results + [_item] -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
              {{
                {
                  'status': 'success',
                  'tool': 'zen_sutra_filecabinet',
                  'action': 'search',
                  'volume': _vol,
                  'query': query | default('', true),
                  'anchor_type': _anchor_type,
                  'anchor_ids': _anchor_ids_raw,
                  'items': ns.results,
                  'count': ns.results | length,
                  'trace': {'caller_token': _caller_token}
                }
              }}
        - stop: filecabinet sutra search done
          response_variable: result

    # --- NO-OPS (render — no cabinet equivalent) ---
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ _action == 'render' }}"
        sequence:
        - variables:
            result:
              status: not_supported
              tool: zen_sutra_filecabinet
              action: "{{ _action }}"
              stack_type: cabinet
              reason: "render has no cabinet equivalent."
              trace:
                caller_token: "{{ _caller_token }}"
        - stop: filecabinet sutra noop
          response_variable: result

    # --- GET ---
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ _action == 'get' }}"
        sequence:
        - variables:
            _g_vol0: "{{ state_attr(_vol, 'variables') | default({}, true) }}"
        - variables:
            _g_trav: >-
              {%- set _max = 8 -%}
              {%- set _v0 = _g_vol0 if _g_vol0 is mapping else {} -%}
              {%- if _key not in _v0 -%}
                {{- {'status': 'absent'} -}}
              {%- else -%}
                {%- set ns = namespace(entity=_vol, key=_key, vol=_v0, depth=0, visited=[_vol ~ '/' ~ _key], done=false, entry=none, status='', reason='', loop_at='', fc=none) -%}
                {%- for _ in range(_max) -%}
                  {%- if not ns.done -%}
                    {%- set _cur = ns.vol.get(ns.key) -%}
                    {%- set _cv_s = (_cur.get('value') or none) if _cur is mapping else none -%}
                    {%- set _cv = _cv_s if _cv_s is mapping else (_cv_s | from_json(none) if _cv_s is string and _cv_s | trim not in ['', 'null', 'None'] else none) -%}
                    {%- set _is_mount = _cv is mapping and _cv.get('mount_point', false) == true -%}
                    {%- if not _is_mount -%}
                      {%- set ns.entry = _cur -%}
                      {%- set ns.status = 'resolved' if ns.depth > 0 else 'direct' -%}
                      {%- set ns.done = true -%}
                    {%- elif _cv.get('fc_args') is not none -%}
                      {%- set _wl_vars = state_attr('sensor.zenos_system_cabinet', 'variables') | default({}, true) -%}
                      {%- set _wl_raw = (_wl_vars.get('fc_mount_callout_whitelist') or {}) if _wl_vars is mapping else {} -%}
                      {%- set _wl_val = (_wl_raw.get('value') or {}) if _wl_raw is mapping else {} -%}
                      {%- set _hard_wl = ['zen_dojotools_index:*', 'zen_dojotools_inspect:*', 'zen_dojotools_query:*', 'zen_dojotools_room_manager:*', 'zen_dojotools_manifest:*', 'zen_dojotools_inventory:*', 'zen_dojotools_filecabinet:*', 'zen_dojotools_finance:kfc_manifest', 'zen_dojotools_finance:report', 'zen_dojotools_autovac:kfc_manifest', 'zen_dojotools_autovac:register', 'zen_dojotools_autovac:unregister'] -%}
                      {%- set _syscab_wl = (_wl_val.get('allowed_action_types', []) if _wl_val is mapping else []) -%}
                      {%- set _allowed = (_hard_wl + _syscab_wl) | unique | list -%}
                      {%- set _fa = _cv.get('fc_args') -%}
                      {%- set _act = (_fa.get('action_type') or _fa.get('tool', '')) if _fa is mapping else '' -%}
                      {%- set _call_mode = ((_fa.get('params') or {}).get('mode', '') if _fa is mapping else '') | lower | trim -%}
                      {%- set ns_wl = namespace(ok=false) -%}
                      {%- for entry in _allowed -%}
                        {%- if ':' in entry -%}
                          {%- set parts = entry | regex_findall('[^:]+') -%}
                          {%- set etool = parts[0] | default('') -%}
                          {%- set emode = parts[1] | default('') -%}
                          {%- if etool == _act and (emode == '*' or emode == _call_mode) -%}{%- set ns_wl.ok = true -%}{%- endif -%}
                        {%- else -%}
                          {%- if entry == _act -%}{%- set ns_wl.ok = true -%}{%- endif -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {%- if ns_wl.ok -%}
                        {%- set ns.entry = _cur -%}
                        {%- set ns.fc = _fa -%}
                        {%- set ns.status = 'tool_call_required' -%}
                      {%- else -%}
                        {%- set ns.status = 'tool_call_blocked' -%}
                        {%- set ns.reason = 'action_type not in fc_mount_callout_whitelist — blocked by: ' ~ ('system_cabinet_whitelist' if _wl_val is mapping and _wl_val.get('allowed_action_types') else 'hardcode_default') ~ ' (missing: ' ~ _act ~ ((':' ~ _call_mode) if _call_mode != '' else '') ~ ')' -%}
                      {%- endif -%}
                      {%- set ns.done = true -%}
                    {%- else -%}
                      {%- set _target = _cv.get('target_entity_id', _cv.get('target_volume_id', '')) -%}
                      {%- set _next = _target ~ '/' ~ ns.key -%}
                      {%- if _target == '' -%}
                        {%- set ns.status = 'unresolvable' -%}
                        {%- set ns.reason = 'mount has no target_entity_id' -%}
                        {%- set ns.done = true -%}
                      {%- elif ns.depth >= _max - 1 -%}
                        {%- set ns.status = 'depth_limit_exceeded' -%}
                        {%- set ns.done = true -%}
                      {%- elif _next in ns.visited -%}
                        {%- set ns.status = 'loop_detected' -%}
                        {%- set ns.loop_at = _next -%}
                        {%- set ns.done = true -%}
                      {%- else -%}
                        {%- set ns.visited = ns.visited + [_next] -%}
                        {%- set ns.entity = _target -%}
                        {%- set ns.vol = state_attr(_target, 'variables') | default({}, true) -%}
                        {%- set ns.depth = ns.depth + 1 -%}
                        {%- if ns.key not in ns.vol -%}
                          {%- set ns.status = 'not_found_in_target' -%}
                          {%- set ns.reason = 'key not found in target volume: ' ~ _target -%}
                          {%- set ns.done = true -%}
                        {%- endif -%}
                      {%- endif -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endfor -%}
                {{- {'status': ns.status, 'entry': ns.entry, 'depth': ns.depth, 'visited': ns.visited,
                     'entity': ns.entity, 'reason': ns.reason, 'loop_at': ns.loop_at, 'fc_args': ns.fc} -}}
              {%- endif -%}
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _g_trav is mapping and _g_trav.get('status') in ['loop_detected', 'depth_limit_exceeded', 'unresolvable', 'not_found_in_target', 'tool_call_blocked'] }}"
            sequence:
            - variables:
                result: >-
                  {%- set _t = _g_trav -%}
                  {{
                    {
                      'status': 'error',
                      'tool': 'zen_sutra_filecabinet',
                      'action': 'get',
                      'key': _key,
                      'volume': _vol,
                      'mount_traversal': {
                        'status': _t.get('status'),
                        'reason': _t.get('reason', ''),
                        'loop_at': _t.get('loop_at', ''),
                        'depth': _t.get('depth', 0),
                        'visited': _t.get('visited', [])
                      },
                      'trace': {'caller_token': _caller_token}
                    }
                  }}
            - stop: filecabinet sutra get mount error
              response_variable: result
        - variables:
            _get_raw: >-
              {{ _g_trav.get('entry') if _g_trav is mapping and _g_trav.get('status') in ['direct', 'resolved', 'tool_call_required'] else none }}
            _g_mt: >-
              {%- set _t = _g_trav if _g_trav is mapping else {} -%}
              {%- if _t.get('status') == 'resolved' -%}
                {{ {'status': 'resolved', 'depth': _t.get('depth', 0), 'resolved_from': _vol ~ '/' ~ _key, 'resolved_to': _t.get('entity', '') ~ '/' ~ _key, 'visited': _t.get('visited', [])} }}
              {%- elif _t.get('status') == 'tool_call_required' -%}
                {{ {'status': 'tool_call_required', 'fc_args': _t.get('fc_args'), 'depth': _t.get('depth', 0), 'visited': _t.get('visited', [])} }}
              {%- else -%}
                {{ none }}
              {%- endif -%}
        - if:
          - condition: template
            value_template: "{{ _g_mt is mapping and _g_mt.get('status') == 'tool_call_required' }}"
          then:
          - variables:
              _tc_tool: >-
                {%- set _fa = _g_mt.get('fc_args') or {} -%}
                {{ _fa.get('tool') or _fa.get('action_type', '') }}
              _tc_params: "{{ (_g_mt.get('fc_args') or {}).get('params', {}) }}"
              _tc_cache_cfg: "{{ (_g_mt.get('fc_args') or {}).get('cache') or none }}"
          - variables:
              _tc_cache_raw: >-
                {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                {%- set _cv = CABS.cabinet_variables(_vol) -%}
                {%- set _cv = _cv if _cv is mapping else (_cv | from_json(none) if _cv is string else none) -%}
                {{ ((_cv if _cv is mapping else {}).get(_key ~ '/cache') or {}).get('value') }}
              _tc_cache_ts: >-
                {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                {%- set _cv = CABS.cabinet_variables(_vol) -%}
                {%- set _cv = _cv if _cv is mapping else (_cv | from_json(none) if _cv is string else none) -%}
                {{ ((_cv if _cv is mapping else {}).get(_key ~ '/cache') or {}).get('timestamp') }}
          - variables:
              _tc_cache_hit: >-
                {%- set _ttl = (_tc_cache_cfg if _tc_cache_cfg is mapping else {}).get('ttl_seconds', 300) | int -%}
                {%- set _ts = _tc_cache_ts | default('', true) | trim -%}
                {%- if _ttl == 0 or _ts == '' or _tc_cache_raw is none -%}false
                {%- else -%}
                  {{ (now().timestamp() - (as_datetime(_ts) | as_timestamp(0))) < _ttl }}
                {%- endif -%}
          - if:
            - condition: template
              value_template: "{{ _tc_cache_hit | bool }}"
            then:
            - variables:
                result:
                  status: success
                  tool: zen_sutra_filecabinet
                  action: get
                  key: "{{ _key }}"
                  volume: "{{ _vol }}"
                  title: "{{ _key }}"
                  value: "{{ _tc_cache_raw }}"
                  mount_traversal:
                    status: resolved_via_cache
                    tool_called: "{{ _tc_tool }}"
                    cache: hit
                  trace:
                    caller_token: "{{ _caller_token }}"
            - stop: filecabinet tool-call mount cache hit
              response_variable: result
          - choose:
            - conditions:
              - condition: template
                value_template: "{{ not (_tc_tool | regex_search('^zen_')) }}"
              sequence:
              - variables:
                  result:
                    status: error
                    tool: zen_sutra_filecabinet
                    action: get
                    key: "{{ _key }}"
                    volume: "{{ _vol }}"
                    mount_traversal:
                      status: tool_call_blocked
                      reason: >-
                        Live drawer tool '{{ _tc_tool }}' is a lens verb, not a dispatchable script.
                        Use a zen_* script name in fc_args.tool (e.g. zen_dojotools_filecabinet,
                        zen_sutra_filecabinet). Lens verbs like 'read' and 'manifest' are not
                        HA scripts and cannot be dispatched inline.
                      tool: "{{ _tc_tool }}"
                    trace:
                      caller_token: "{{ _caller_token }}"
              - stop: filecabinet live drawer not a script
                response_variable: result
          - action: "script.{{ _tc_tool }}"
            data: "{{ _tc_params }}"
            response_variable: _tc_raw
          - if:
            - condition: template
              value_template: "{{ _tc_raw is defined and _tc_raw is not none }}"
            then:
            - variables:
                _tc_digest: >-
                  {%- set _fields = (_tc_cache_cfg if _tc_cache_cfg is mapping else {}).get('digest_fields', []) -%}
                  {%- if _fields | length == 0 -%}{{ _tc_raw }}
                  {%- else -%}
                    {%- set ns = namespace(d={}) -%}
                    {%- for _f in _fields -%}
                      {%- set _parts = _f.split('.') -%}
                      {%- set _v = _tc_raw -%}
                      {%- for _p in _parts -%}{%- set _v = (_v if _v is mapping else {}).get(_p) -%}{%- endfor -%}
                      {%- set ns.d = ns.d | combine({_f: _v}) -%}
                    {%- endfor -%}
                    {{ ns.d }}
                  {%- endif -%}
            - if:
              - condition: template
                value_template: >-
                  {{ _tc_cache_cfg is mapping and
                     (_tc_cache_cfg.get('ttl_seconds', 0) | int) > 0 }}
              then:
              - action: script.zen_sutra_filecabinet
                data:
                  mode: upsert
                  volume_entity_id: "{{ _vol }}"
                  path: "{{ _key }}/cache"
                  value: "{{ _tc_digest }}"
                  expires_after: >-
                    {{ (now().timestamp() + (_tc_cache_cfg.get('ttl_seconds', 300) | int))
                       | timestamp_custom('%Y-%m-%dT%H:%M:%S%z', true) }}
            - variables:
                result:
                  status: success
                  tool: zen_sutra_filecabinet
                  action: get
                  key: "{{ _key }}"
                  volume: "{{ _vol }}"
                  title: "{{ _key }}"
                  value: "{{ _tc_digest }}"
                  mount_traversal:
                    status: resolved_via_tool_call
                    tool_called: "{{ _tc_tool }}"
                    cache: miss
                    depth: "{{ _g_mt.get('depth', 0) }}"
                    visited: "{{ _g_mt.get('visits', []) }}"
                  trace:
                    caller_token: "{{ _caller_token }}"
            - stop: filecabinet tool-call mount resolved
              response_variable: result
        - variables:
            _get_val: >-
              {{ _get_raw.get('value') if _get_raw is mapping else none }}
        - variables:
            _get_is_v1: >-
              {{ _get_val is mapping and _get_val.get('v') == 1 and 'content' in _get_val }}
        - variables:
            _get_tags: >-
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
              {%- set _v_s = CABS.cabinet_variables(_vol) -%}
              {%- set _v = _v_s if _v_s is mapping else (_v_s | from_json(none) if _v_s is string else none) -%}
              {%- set _ci = ((_v if _v is mapping else {}).get('_label_index', {}).get('value', {})) -%}
              {%- set _ci = _ci if _ci is mapping else (_ci | from_json(none) if _ci is string and _ci | trim not in ['', '{}', 'null'] else {}) -%}
              {%- set _ci = _ci if _ci is mapping else {} -%}
              {%- set _ds = _key -%}
              {%- set _ns = namespace(t=[]) -%}
              {%- for _lbl, _drawers in _ci.items() -%}
                {%- if _drawers is iterable and not _drawers is string and _ds in _drawers -%}
                  {%- set _ns.t = _ns.t + [_lbl] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ _ns.t }}
            _gformat: >-
              {%- if _get_val is mapping and _get_val.get('v') == 1 and 'content' in _get_val -%}v1
              {%- elif _get_raw is not none -%}raw
              {%- else -%}notfound{%- endif -%}
        - variables:
            _gc: >-
              {%- if _gformat == 'v1' -%}{{ _get_val.get('content', '') }}
              {%- elif _gformat == 'raw' -%}{{ _get_val if _get_val is string else (_get_val | tojson if _get_val is not none else '') }}
              {%- else -%}{%- endif -%}
            _gt: >-
              {%- if _gformat == 'v1' -%}{{ _get_val.get('title', _key) }}
              {%- else -%}{{ _key }}{%- endif -%}
            _gd: >-
              {%- if _gformat == 'v1' -%}{{ _get_val.get('description', '') }}
              {%- else -%}{%- endif -%}
            _gca: >-
              {%- if _gformat == 'v1' -%}{{ _get_val.get('created_at', '') }}
              {%- else -%}{%- endif -%}
            _gua: >-
              {%- if _gformat == 'v1' -%}{{ _get_val.get('updated_at', '') }}
              {%- else -%}{{ (_get_raw if _get_raw is mapping else {}).get('timestamp', '') }}{%- endif -%}
            _gea: >-
              {%- if _gformat == 'v1' -%}{{ _get_val.get('expires_after', '') }}
              {%- else -%}{%- endif -%}
            _gna: >-
              {%- if _gformat == 'v1' -%}{{ _get_val.get('no_autoexpire', false) }}
              {%- else -%}false{%- endif -%}
            _gnr: >-
              {%- if _gformat == 'v1' -%}{{ _get_val.get('no_autorecycle', false) }}
              {%- else -%}false{%- endif -%}
        - variables:
            _gv: >-
              {%- if _gc is string and _gc | trim != '' -%}
                {%- set _p = _gc | from_json(none) -%}
                {{ _p if _p is not none else _gc }}
              {%- elif _gc is mapping -%}
                {{ _gc }}
              {%- else -%}
                {{ none }}
              {%- endif -%}
        - variables:
            _drawers: >-
              {%- set _prefix = _key ~ '/' -%}
              {%- set _vol0 = _g_vol0 if _g_vol0 is mapping else {} -%}
              {%- set _ns = namespace(d={}) -%}
              {%- for _ck, _cv in _vol0.items() -%}
                {%- if _ck.startswith(_prefix) and '/' not in _ck[_prefix | length:] -%}
                  {%- set _child = _ck[_prefix | length:] -%}
                  {%- set _cval = (_cv.get('value') or none) if _cv is mapping else none -%}
                  {%- set _is_m = _cval is mapping and _cval.get('mount_point', false) == true -%}
                  {%- set _cua = (_cv.get('timestamp', '')) if _cv is mapping else '' -%}
                  {%- set _ns.d = _ns.d | combine({_child: {'is_mount': _is_m, 'updated_at': _cua}}) -%}
                {%- endif -%}
              {%- endfor -%}
              {{ _ns.d if _ns.d | length > 0 else none }}
        - variables:
            _subdrawers: >-
              {%- if _drawers is mapping and _drawers | length > 0 -%}
                {%- set _ns = namespace(keys=[]) -%}
                {%- for ck in _drawers.keys() -%}
                  {%- set _ns.keys = _ns.keys + [_key ~ '/' ~ ck] -%}
                {%- endfor -%}
                {{- _ns.keys -}}
              {%- else -%}
                {{- [] -}}
              {%- endif -%}
        - variables:
            result: >-
              {%- if _gformat == 'notfound' -%}
                {{
                  {
                    'status': 'not_found',
                    'tool': 'zen_sutra_filecabinet',
                    'action': 'get',
                    'key': _key,
                    'volume': _vol,
                    'trace': {'caller_token': _caller_token}
                  }
                }}
              {%- else -%}
                {{
                  {
                    'status': 'success',
                    'tool': 'zen_sutra_filecabinet',
                    'action': 'get',
                    'key': _key,
                    'volume': _vol,
                    'title': _gt,
                    'value': _gv,
                    'description': _gd,
                    'created_at': _gca,
                    'updated_at': _gua,
                    'expires_after': _gea,
                    'no_autoexpire': _gna,
                    'no_autorecycle': _gnr,
                    'tags': _get_tags,
                    'v': 1,
                    'trace': {'caller_token': _caller_token}
                  } | combine({'mount_traversal': _g_mt} if _g_mt is mapping else {})
                    | combine({'drawers': _drawers} if _drawers is mapping else {})
                    | combine({'has_children': true, 'subdrawers': _subdrawers} if _subdrawers | length > 0 else {})
                }}
              {%- endif -%}
        - stop: filecabinet sutra get done
          response_variable: result

    # --- CREATE ---
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ _action == 'create' }}"
        sequence:
        - variables:
            _expansion_vi: >-
              {%- set _vi = ((state_attr(_vol, 'variables') or {}).get('AI_Cabinet_VolumeInfo') or {}) -%}
              {{ (_vi.get('value') or {}) if _vi is mapping else {} }}
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ (_expansion_vi if _expansion_vi is mapping else {}).get('cabinet_class') == 'expansion' }}"
            sequence:
            - variables:
                result:
                  status: error
                  tool: zen_sutra_filecabinet
                  action: create
                  volume: "{{ _vol }}"
                  cabinet_class: expansion
                  hosted_by: "{{ (_expansion_vi if _expansion_vi is mapping else {}).get('hosted_by', '') }}"
                  message: >-
                    Direct writes to expansion cabinets are blocked. Write to the source cabinet
                    ({{ (_expansion_vi if _expansion_vi is mapping else {}).get('hosted_by', 'unknown') }})
                    — mount traversal routes writes to this cabinet automatically.
                  trace:
                    caller_token: "{{ _caller_token }}"
            - stop: filecabinet expansion cabinet write blocked
              response_variable: result
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _key == '' or (_content == '' and _title == '' and _description == '') }}"
            sequence:
            - variables:
                result:
                  status: error
                  tool: zen_sutra_filecabinet
                  action: create
                  volume: "{{ _vol }}"
                  message: "create requires 'path' and non-empty 'value' (or title/description)."
                  trace:
                    caller_token: "{{ _caller_token }}"
            - stop: filecabinet sutra create missing args
              response_variable: result
        - variables:
            _w_vol: >-
              {%- set _dr = (state_attr(_vol, 'variables') or {}).get(_key) -%}
              {%- set _dv_s = (_dr.get('value') or none) if _dr is mapping else none -%}
              {%- set _dv = _dv_s if _dv_s is mapping else (_dv_s | from_json(none) if _dv_s is string and _dv_s | trim not in ['', 'null', 'None'] else none) -%}
              {{ _dv.get('target_entity_id', _vol) if (_dv is mapping and _dv.get('mount_point', false) == true and _dv.get('target_entity_id', '') != '') else _vol }}
            _w_is_mount: >-
              {%- set _dr = (state_attr(_vol, 'variables') or {}).get(_key) -%}
              {%- set _dv_s = (_dr.get('value') or none) if _dr is mapping else none -%}
              {%- set _dv = _dv_s if _dv_s is mapping else (_dv_s | from_json(none) if _dv_s is string and _dv_s | trim not in ['', 'null', 'None'] else none) -%}
              {{ _dv is mapping and _dv.get('mount_point', false) == true and _dv.get('target_entity_id', '') != '' }}
        - variables:
            _exists: >-
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
              {{ CABS.cabinet_drawer_exists(_vol, _key) | from_json }}
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _exists and not _force_action and not _w_is_mount }}"
            sequence:
            - variables:
                result:
                  status: error
                  tool: zen_sutra_filecabinet
                  action: create
                  key: "{{ _key }}"
                  volume: "{{ _vol }}"
                  message: Key already exists. Use upsert to overwrite, update to modify, or force_action=true to overwrite.
                  trace:
                    caller_token: "{{ _caller_token }}"
            - stop: filecabinet sutra create exists
              response_variable: result
        - variables:
            _cr_value: "{{ _content }}"
        - event: set_variable_legacy
          event_data:
            key: "{{- _key -}}"
            value: "{{ _cr_value }}"
            volume_entity: "{{- _w_vol -}}"
            set_timestamp: true
        - wait_template: >-
            {{ (state_attr(_w_vol, 'variables') or {}).get(_key, {}).get('timestamp', '') >= _now }}
          timeout: "00:00:30"
          continue_on_timeout: true
        - variables:
            _write_verified: "{{ wait.completed }}"
        - variables:
            _tags_for_index: >-
              {%- set _tr = tags | default('', true) -%}
              {%- if _tr is sequence and not _tr is string -%}
                {{- _tr | map('string') | map('lower') | map('slugify') | select('string') | list -}}
              {%- elif _tr is string and _tr | trim != '' -%}
                {{- _tr | replace('\n', ',') | regex_findall('[^,]+') | map('trim') | map('lower') | map('slugify') | select('string') | list -}}
              {%- else -%}
                []
              {%- endif -%}
        - variables:
            _updated_label_index: >-
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
              {%- set _v_s = CABS.cabinet_variables(_vol) -%}
              {%- set _v = _v_s if _v_s is mapping else (_v_s | from_json(none) if _v_s is string else none) -%}
              {%- set _ci = ((_v if _v is mapping else {}).get('_label_index', {}).get('value', {})) -%}
              {%- set _ci = _ci if _ci is mapping else (_ci | from_json(none) if _ci is string and _ci | trim not in ['', '{}', 'null'] else {}) -%}
              {%- set _ci = _ci if _ci is mapping else {} -%}
              {%- set _ds = _key -%}
              {%- set _ns = namespace(val = dict(_ci)) -%}
              {%- for _lbl in _tags_for_index -%}
                {%- if _create_label or _lbl in labels() -%}
                  {%- set _e = _ns.val.get(_lbl) -%}
                  {%- set _ex = (_e if _e is iterable and not _e is string else [_e] if _e not in [none, ''] else []) -%}
                  {%- set _ns.val = _ns.val | combine({_lbl: (_ex + [_ds]) | unique | list}) -%}
                {%- endif -%}
              {%- endfor -%}
              {{- _ns.val -}}
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _tags_for_index | length > 0 }}"
            sequence:
            - event: set_variable_legacy
              event_data:
                key: _label_index
                value: "{{- _updated_label_index | tojson -}}"
                set_timestamp: true
                volume_entity: "{{- _vol -}}"
        - variables:
            _tags_dropped: >-
              {%- set _all = labels() -%}
              {%- set _ns = namespace(d=[]) -%}
              {%- for _lbl in _tags_for_index -%}
                {%- if _lbl not in _all -%}{%- set _ns.d = _ns.d + [_lbl] -%}{%- endif -%}
              {%- endfor -%}
              {{ _ns.d }}
        - if: "{{ _create_label and _tags_dropped | length > 0 }}"
          then:
            - repeat:
                for_each: "{{ _tags_dropped }}"
                sequence:
                  - action: homeassistant.create_label
                    data:
                      name: "{{ repeat.item }}"
        - variables:
            result:
              status: success
              tool: zen_sutra_filecabinet
              action: create
              key: "{{ _key }}"
              volume: "{{ _vol }}"
              title: "{{ _title if _title != '' else _key }}"
              created_at: "{{ _now }}"
              created: "{{ not _exists }}"
              write_verified: "{{ _write_verified }}"
              tags_dropped: "{{ [] if _create_label else _tags_dropped }}"
              labels_created: "{{ _tags_dropped if _create_label else [] }}"
              trace:
                caller_token: "{{ _caller_token }}"
        - stop: filecabinet sutra create done
          response_variable: result

    # --- UPDATE ---
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ _action == 'update' }}"
        sequence:
        - variables:
            _expansion_vi: >-
              {%- set _vi = ((state_attr(_vol, 'variables') or {}).get('AI_Cabinet_VolumeInfo') or {}) -%}
