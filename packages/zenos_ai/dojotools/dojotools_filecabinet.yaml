                      "actions": ["get", "create", "update", "upsert", "delete", "list", "move", "copy", "relabel", "search", "render", "stacks_by_anchor", "register", "unregister", "inspect", "health", "audit"],
                      "not_supported": ["mount_cabinet", "set_mount", "remove_mount", "clone", "set_cabinet_ro"]
                    },
