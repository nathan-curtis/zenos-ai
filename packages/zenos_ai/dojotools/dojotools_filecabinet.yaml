                  for_each: "{{ _tags_dropped }}"
                  sequence:
                    - action: homeassistant.create_label
                      data:
                        name: "{{ repeat.item }}"
          - variables:
              result:
                status: "{{ 'success' if _write_verified else 'error' }}"
                tool: zen_sutra_filecabinet
                action: upsert
                key: "{{ _key }}"
                volume: "{{ _vol }}"
                title: "{{ _new_title }}"
                mode: "{{ _mode }}"
                created: "{{ not _existed }}"
                updated_at: "{{ _now }}"
                write_verified: "{{ _write_verified }}"
                code: "{{ '' if _write_verified else 'write_unverified' }}"
                message: "{{ '' if _write_verified else 'The cabinet did not confirm the write within 30s (full, blocked or not running); the drawer may be unchanged.' }}"
                mount_traversal: "{{ {'traversed': true, 'target_vol': _w_vol} if _w_is_mount else none }}"
                tags_dropped: "{{ [] if _create_label else _tags_dropped }}"
                labels_created: "{{ _tags_dropped if _create_label else [] }}"
                trace:
                  caller_token: "{{ _caller_token }}"

    # --- DELETE ---
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ result is not defined and _action == 'delete' }}"
        sequence:
        - variables:
            _exists: >-
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
              {{ CABS.cabinet_drawer_exists(_vol, _key) | from_json }}
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ not _exists }}"
            sequence:
            - variables:
                result:
                  status: not_found
                  tool: zen_sutra_filecabinet
                  action: delete
                  key: "{{ _key }}"
                  volume: "{{ _vol }}"
                  message: Key not found — nothing deleted.
                  trace:
                    caller_token: "{{ _caller_token }}"
        - if: "{{ result is not defined }}"
          then:
          - event: remove_variable_legacy
            event_data:
              key: "{{- _key -}}"
              volume_entity: "{{- _vol -}}"
          - wait_template: >-
              {{ state_attr(_vol, 'variables') is mapping and
                 state_attr(_vol, 'variables').get(_key) is none }}
            timeout: "00:00:30"
            continue_on_timeout: true
          - variables:
              _delete_verified: "{{ wait.completed }}"
          - if: "{{ not _delete_verified }}"
            then:
              - action: system_log.write
                continue_on_error: true
                data:
                  level: warning
                  logger: zen_sutra_filecabinet
                  message: "FileCabinet delete: '{{ _key }}' in {{ _vol }} was not confirmed by the cabinet within 30s."
          - variables:
              _key_slug: "{{- _key -}}"
          - variables:
              _raw_index_del: >-
                {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                {%- set _v_s = (state_attr(_vol, 'variables') if state_attr(_vol, 'variables') is mapping else {}) -%}
                {%- set _v = _v_s if _v_s is mapping else (_v_s | from_json(none) if _v_s is string else none) -%}
                {%- set _ci = ((_v if _v is mapping else {}).get('_label_index', {}).get('value', {})) -%}
                {%- set _ci = _ci if _ci is mapping else (_ci | from_json(none) if _ci is string and _ci | trim not in ['', '{}', 'null'] else {}) -%}
                {{- _ci if _ci is mapping else {} -}}
          - variables:
              _pruned_index: >-
                {%- if _raw_index_del is mapping -%}
                  {%- set _ns = namespace(val = {}) -%}
                  {%- set _kp = _key_slug ~ '/' -%}
                  {%- for label, drawers in _raw_index_del.items() -%}
                    {%- if drawers is iterable and not drawers is string -%}
                      {#- The drawer and its children (delete cascades) leave the index. -#}
                      {%- set _cl = namespace(l=[]) -%}
                      {%- for d in drawers if d != _key_slug and not (d | string).startswith(_kp) -%}{%- set _cl.l = _cl.l + [d] -%}{%- endfor -%}
                      {%- set cleaned_list = _cl.l -%}
                      {%- if cleaned_list | length > 0 -%}
                        {%- set _ns.val = _ns.val | combine({label: cleaned_list}) -%}
                      {%- endif -%}
                    {%- elif drawers != _key_slug -%}
                      {%- set _ns.val = _ns.val | combine({label: [drawers]}) -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{- _ns.val -}}
                {%- else -%}
                  {}
                {%- endif -%}
          - choose:
            - conditions:
              - condition: template
                value_template: "{{ _pruned_index != _raw_index_del }}"
              sequence:
              - event: set_variable_legacy
                event_data:
                  key: _label_index
                  value: "{{- _pruned_index | tojson -}}"
                  set_timestamp: true
                  volume_entity: "{{- _vol -}}"
          - variables:
              result:
                status: "{{ 'success' if _delete_verified else 'error' }}"
                tool: zen_sutra_filecabinet
                action: delete
                key: "{{ _key }}"
                volume: "{{ _vol }}"
                write_verified: "{{ _delete_verified }}"
                code: "{{ '' if _delete_verified else 'write_unverified' }}"
                message: "{{ '' if _delete_verified else 'The cabinet did not confirm the delete within 30s; the drawer may still be there.' }}"
                trace:
                  caller_token: "{{ _caller_token }}"
          - variables:
              _child_keys_del: >-
                {%- set _v0 = state_attr(_vol, 'variables') | default({}, true) -%}
                {%- set _prefix = _key ~ '/' -%}
                {%- set _ns = namespace(keys=[]) -%}
                {%- for k in (_v0 if _v0 is mapping else {}).keys() -%}
                  {%- if k.startswith(_prefix) -%}
                    {%- set _ns.keys = _ns.keys + [k] -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ _ns.keys }}
          - variables:
              result: "{{ result | combine({'children_deleted': _child_keys_del | count}) }}"
          - repeat:
              for_each: "{{ _child_keys_del }}"
              sequence:
              - event: remove_variable_legacy
                event_data:
                  key: "{{ repeat.item }}"
                  volume_entity: "{{ _vol }}"

    # --- LIST ---
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ result is not defined and _action == 'list' }}"
        sequence:
        - variables:
            _vars: >-
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
              {%- set _r = (CABS.cabinet_expanded_view(_vol) | from_json({})) if CABS.cabinet_hosts_expansion(_vol) | trim == 'true'
                           else (state_attr(_vol, 'variables') if state_attr(_vol, 'variables') is mapping else {}) -%}
              {%- if _r is mapping -%}{{ _r }}
              {%- elif _r is string and _r | trim not in ['', '{}'] -%}{{ _r | from_json | default({}) }}
              {%- else -%}{{ {} }}{%- endif -%}
        - variables:
            _items: >-
              {%- set ns = namespace(items=[]) -%}
              {%- for k, drawer in (_vars if _vars is mapping else {}).items() -%}
                {%- if k != 'AI_Cabinet_VolumeInfo' and not k.startswith('_')
                   and (_path_prefix == '' or k.startswith(_path_prefix)) -%}
                  {%- set _dv = drawer.get('value') if drawer is mapping else none -%}
                  {%- if _dv is mapping and _dv.get('v') == 1 and 'content' in _dv -%}
                    {%- set _item = {
                      'key': k,
                      'title': _dv.get('title', k),
                      'description': _dv.get('description', ''),
                      'created_at': _dv.get('created_at', ''),
                      'updated_at': _dv.get('updated_at', '')
                    } -%}
                  {%- else -%}
                    {%- set _item = {
                      'key': k,
                      'title': k,
                      'description': '',
                      'created_at': '',
                      'updated_at': (drawer.get('timestamp', '') if drawer is mapping else '')
                    } -%}
                  {%- endif -%}
                  {%- set ns.items = ns.items + [_item] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.items }}
        - variables:
            result:
              status: success
              tool: zen_sutra_filecabinet
              action: list
              volume: "{{ _vol }}"
              path_prefix: "{{ _path_prefix }}"
              count: "{{ _items | length }}"
              items: "{{ _items }}"
              trace:
                caller_token: "{{ _caller_token }}"

    # --- MOVE ---
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ result is not defined and _action == 'move' }}"
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _dest == '' }}"
            sequence:
            - variables:
                result:
                  status: error
                  tool: zen_sutra_filecabinet
                  action: move
                  message: destination_path is required for move.
                  trace:
                    caller_token: "{{ _caller_token }}"
          - conditions:
            - condition: template
              value_template: "{{ _dest == _key and (_dest_vol in ['', _vol]) }}"
            sequence:
            - variables:
                result:
                  status: error
                  tool: zen_sutra_filecabinet
                  action: move
                  code: same_key
                  key: "{{ _key }}"
                  volume: "{{ _vol }}"
                  message: "guarded: destination '{{ destination_path | default('') }}' resolves to the source key '{{ _key }}'; nothing was moved."
                  trace:
                    caller_token: "{{ _caller_token }}"
        - if: "{{ result is not defined }}"
          then:
          - variables:
              _mov_raw: >-
                {{ (state_attr(_vol, 'variables') or {}).get(_key) }}
          - variables:
              _mov_val: >-
                {{ _mov_raw.get('value') if _mov_raw is mapping else none }}
          - choose:
            - conditions:
              - condition: template
                value_template: "{{ _mov_raw is none }}"
              sequence:
              - variables:
                  result:
                    status: not_found
                    tool: zen_sutra_filecabinet
                    action: move
                    key: "{{ _key }}"
                    volume: "{{ _vol }}"
                    message: Source key not found.
                    trace:
                      caller_token: "{{ _caller_token }}"
          - if: "{{ result is not defined }}"
            then:
            - variables:
                _mov_val_parsed: >-
                  {%- set _mv = (_mov_raw.get('value') if _mov_raw is mapping else none) -%}
                  {%- if _mv is mapping -%}
                    {{ _mv }}
                  {%- elif _mv is string and _mv | trim not in ['', 'null', 'None'] -%}
                    {{ _mv | from_json(none) }}
                  {%- endif -%}
            - choose:
              - conditions:
                - condition: template
                  value_template: >-
                    {{ _mov_val_parsed is mapping and _mov_val_parsed.get('mount_point', false) == true and not (force_action | default(false) | bool) }}
                sequence:
                - variables:
                    result:
                      status: error
                      tool: zen_sutra_filecabinet
                      action: move
                      code: mounted_drawer
                      key: "{{ _key }}"
                      volume: "{{ _vol }}"
                      mount_type: "{{ 'live_drawer' if (_mov_val_parsed is mapping and _mov_val_parsed.get('fc_args') is not none) else 'cross_cabinet' }}"
                      message: >-
                        '{{ _key }}' is a {{ 'live_drawer' if (_mov_val_parsed is mapping and _mov_val_parsed.get('fc_args') is not none) else 'cross_cabinet' }} mount — move is blocked.
                        Create the mount at the destination first (set_mount), then delete this drawer (delete).
                      trace:
                        caller_token: "{{ _caller_token }}"
            - if: "{{ result is not defined }}"
              then:
              - event: set_variable_legacy
                event_data:
                  key: "{{- _dest -}}"
                  value: "{{- _mov_val -}}"
                  meta: "{{ (_mov_raw.get('meta') if _mov_raw is mapping else none) or {} }}"
                  volume_entity: "{{- _dest_vol if _dest_vol != '' else _vol -}}"
                  set_timestamp: true
              - wait_template: >-
                  {{ (state_attr(_dest_vol if _dest_vol != '' else _vol, 'variables') or {}).get(_dest, {}).get('timestamp', '') >= _now }}
                timeout: "00:00:30"
                continue_on_timeout: true
              - choose:
                - conditions:
                  - condition: template
                    value_template: "{{ not wait.completed }}"
                  sequence:
                  - variables:
                      result:
                        status: partial
                        tool: zen_sutra_filecabinet
                        action: move
                        from_key: "{{ _key }}"
                        to_key: "{{ _dest }}"
                        volume: "{{ _vol }}"
                        message: "Destination write timed out (30s). Source key preserved. Retry or check cabinet state."
                        trace:
                          caller_token: "{{ _caller_token }}"
              - if: "{{ result is not defined }}"
                then:
                - event: remove_variable_legacy
                  event_data:
                    key: "{{- _key -}}"
                    volume_entity: "{{- _vol -}}"
                - variables:
                    _src_slug: "{{- _key -}}"
                    _dest_slug: "{{- _dest -}}"
                - variables:
                    _raw_index_move: >-
                      {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                      {%- set _v_s = (state_attr(_vol, 'variables') if state_attr(_vol, 'variables') is mapping else {}) -%}
                      {%- set _v = _v_s if _v_s is mapping else (_v_s | from_json(none) if _v_s is string else none) -%}
                      {%- set _ci = ((_v if _v is mapping else {}).get('_label_index', {}).get('value', {})) -%}
                      {%- set _ci = _ci if _ci is mapping else (_ci | from_json(none) if _ci is string and _ci | trim not in ['', '{}', 'null'] else {}) -%}
                      {{- _ci if _ci is mapping else {} -}}
                    _is_xcab_move: "{{ _dest_vol != '' and _dest_vol != _vol }}"
                - variables:
                    _src_index_pruned: >-
                      {%- if _raw_index_move is mapping -%}
                        {%- set _ns = namespace(val = {}) -%}
                        {%- for label, drawers in _raw_index_move.items() -%}
                          {%- if drawers is iterable and not drawers is string -%}
                            {%- set new_list = drawers | reject('equalto', _src_slug) | list -%}
                            {%- if new_list | length > 0 -%}
                              {%- set _ns.val = _ns.val | combine({label: new_list}) -%}
                            {%- endif -%}
                          {%- elif drawers not in [_src_slug, '', none] -%}
                            {%- set _ns.val = _ns.val | combine({label: [drawers]}) -%}
                          {%- endif -%}
                        {%- endfor -%}
                        {{- _ns.val -}}
                      {%- else -%}
                        {}
                      {%- endif -%}
                    _moved_labels: >-
                      {%- if _raw_index_move is mapping -%}
                        {%- set _ns = namespace(labels=[]) -%}
                        {%- for label, drawers in _raw_index_move.items() -%}
                          {%- if (drawers is iterable and not drawers is string and _src_slug in drawers) or drawers == _src_slug -%}
                            {%- set _ns.labels = _ns.labels + [label] -%}
                          {%- endif -%}
                        {%- endfor -%}
                        {{- _ns.labels -}}
                      {%- else -%}
                        []
                      {%- endif -%}
                    _migrated_index: >-
                      {%- if _raw_index_move is mapping and not _is_xcab_move -%}
                        {%- set _ns = namespace(val = {}) -%}
                        {%- for label, drawers in _raw_index_move.items() -%}
                          {%- if drawers is iterable and not drawers is string -%}
                            {%- set had_src = _src_slug in drawers -%}
                            {%- set new_list = drawers | reject('equalto', _src_slug) | list -%}
                            {%- if had_src -%}
                              {%- set new_list = (new_list + [_dest_slug]) | unique | list -%}
                            {%- endif -%}
                            {%- if new_list | length > 0 -%}
                              {%- set _ns.val = _ns.val | combine({label: new_list}) -%}
                            {%- endif -%}
                          {%- elif drawers == _src_slug -%}
                            {%- set _ns.val = _ns.val | combine({label: [_dest_slug]}) -%}
                          {%- elif drawers not in ['', none] -%}
                            {%- set _ns.val = _ns.val | combine({label: [drawers]}) -%}
                          {%- endif -%}
                        {%- endfor -%}
                        {{- _ns.val -}}
                      {%- else -%}
                        {}
                      {%- endif -%}
                - choose:
                  - conditions:
                    - condition: template
                      value_template: "{{ _is_xcab_move and _moved_labels | length > 0 }}"
                    sequence:
                    - event: set_variable_legacy
                      event_data:
                        key: _label_index
                        value: "{{- _src_index_pruned | tojson -}}"
                        set_timestamp: true
                        volume_entity: "{{- _vol -}}"
                    - variables:
                        _dest_raw_index: >-
                          {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                          {%- set _v_s = (state_attr(_dest_vol, 'variables') if state_attr(_dest_vol, 'variables') is mapping else {}) -%}
                          {%- set _v = _v_s if _v_s is mapping else (_v_s | from_json(none) if _v_s is string else none) -%}
                          {%- set _ci = ((_v if _v is mapping else {}).get('_label_index', {}).get('value', {})) -%}
                          {%- set _ci = _ci if _ci is mapping else (_ci | from_json(none) if _ci is string and _ci | trim not in ['', '{}', 'null'] else {}) -%}
                          {{- _ci if _ci is mapping else {} -}}
                    - variables:
                        _dest_merged_index: >-
                          {%- set _ns = namespace(val = _dest_raw_index if _dest_raw_index is mapping else {}) -%}
                          {%- for label in _moved_labels -%}
                            {%- set existing = _ns.val.get(label, []) -%}
                            {%- set existing = existing if existing is iterable and existing is not string else [existing] -%}
                            {%- set _ns.val = _ns.val | combine({label: (existing + [_dest_slug]) | unique | list}) -%}
                          {%- endfor -%}
                          {{- _ns.val -}}
                    - event: set_variable_legacy
                      event_data:
                        key: _label_index
                        value: "{{- _dest_merged_index | tojson -}}"
                        set_timestamp: true
                        volume_entity: "{{- _dest_vol -}}"
                  - conditions:
                    - condition: template
                      value_template: "{{ not _is_xcab_move and _migrated_index != _raw_index_move }}"
                    sequence:
                    - event: set_variable_legacy
                      event_data:
                        key: _label_index
                        value: "{{- _migrated_index | tojson -}}"
                        set_timestamp: true
                        volume_entity: "{{- _vol -}}"
                - variables:
                    result:
                      status: success
                      tool: zen_sutra_filecabinet
                      action: move
                      from_key: "{{ _key }}"
                      to_key: "{{ _dest }}"
                      from_volume: "{{ _vol }}"
                      to_volume: "{{ _dest_vol if _dest_vol != '' else _vol }}"
                      write_verified: true
                      trace:
                        caller_token: "{{ _caller_token }}"
                - variables:
                    _child_keys_mov: >-
                      {%- set _v0 = state_attr(_vol, 'variables') | default({}, true) -%}
                      {%- set _prefix = _key ~ '/' -%}
                      {%- set _ns = namespace(keys=[]) -%}
                      {%- for k in (_v0 if _v0 is mapping else {}).keys() -%}
                        {%- if k.startswith(_prefix) -%}
                          {%- set _ns.keys = _ns.keys + [k] -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {{ _ns.keys }}
                - repeat:
                    for_each: "{{ _child_keys_mov }}"
                    sequence:
                    - variables:
                        _child_dest_mov: "{{ repeat.item | replace(_key ~ '/', _dest ~ '/', 1) }}"
                        _child_val_mov: "{{ ((state_attr(_vol, 'variables') or {}).get(repeat.item) or {}).get('value') }}"
                    - event: set_variable_legacy
                      event_data:
                        key: "{{ _child_dest_mov }}"
                        value: "{{ _child_val_mov }}"
                        volume_entity: "{{ _dest_vol if _dest_vol != '' else _vol }}"
                        set_timestamp: true
                    - wait_template: >-
                        {{ (state_attr(_dest_vol if _dest_vol != '' else _vol, 'variables') or {}).get(_child_dest_mov, {}).get('timestamp', '') >= _now }}
                      timeout: "00:00:30"
                      continue_on_timeout: true
                    - if:
                      - condition: template
                        value_template: "{{ wait.completed }}"
                      then:
                      - event: remove_variable_legacy
                        event_data:
                          key: "{{ repeat.item }}"
                          volume_entity: "{{ _vol }}"
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ result is not defined and _action == 'copy' }}"
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _dest == '' }}"
            sequence:
            - variables:
                result:
                  status: error
                  tool: zen_sutra_filecabinet
                  action: copy
                  message: destination_path is required for copy.
                  trace:
                    caller_token: "{{ _caller_token }}"
        - if: "{{ result is not defined }}"
          then:
          - variables:
              _cpy_raw: >-
                {{ (state_attr(_vol, 'variables') or {}).get(_key) }}
          - variables:
              _cpy_val: >-
                {{ _cpy_raw.get('value') if _cpy_raw is mapping else none }}
          - choose:
            - conditions:
              - condition: template
                value_template: "{{ _cpy_raw is none }}"
              sequence:
              - variables:
                  result:
                    status: not_found
                    tool: zen_sutra_filecabinet
                    action: copy
                    key: "{{ _key }}"
                    volume: "{{ _vol }}"
                    message: Source key not found.
                    trace:
                      caller_token: "{{ _caller_token }}"
          - if: "{{ result is not defined }}"
            then:
            - variables:
                _cpy_val_parsed: >-
                  {%- set _cv = (_cpy_raw.get('value') if _cpy_raw is mapping else none) -%}
                  {%- if _cv is mapping -%}
                    {{ _cv }}
                  {%- elif _cv is string and _cv | trim not in ['', 'null', 'None'] -%}
                    {{ _cv | from_json(none) }}
                  {%- endif -%}
            - choose:
              - conditions:
                - condition: template
                  value_template: >-
                    {{ _cpy_val_parsed is mapping and _cpy_val_parsed.get('mount_point', false) == true and not (force_action | default(false) | bool) }}
                sequence:
                - variables:
                    result:
                      status: error
                      tool: zen_sutra_filecabinet
                      action: copy
                      code: mounted_drawer
                      key: "{{ _key }}"
                      volume: "{{ _vol }}"
                      mount_type: "{{ 'live_drawer' if (_cpy_val_parsed is mapping and _cpy_val_parsed.get('fc_args') is not none) else 'cross_cabinet' }}"
                      message: >-
                        '{{ _key }}' is a {{ 'live_drawer' if (_cpy_val_parsed is mapping and _cpy_val_parsed.get('fc_args') is not none) else 'cross_cabinet' }} mount — copy is blocked.
                        Create the mount at the destination instead (set_mount). Mounts must be set up explicitly — they cannot be duplicated by copy.
                      trace:
                        caller_token: "{{ _caller_token }}"
            - if: "{{ result is not defined }}"
              then:
              - variables:
                  _cpy_dest_vol: "{{ _dest_vol if _dest_vol != '' else _vol }}"
              - event: set_variable_legacy
                event_data:
                  key: "{{- _dest -}}"
                  value: "{{- _cpy_val -}}"
                  volume_entity: "{{- _cpy_dest_vol -}}"
                  set_timestamp: true
              - wait_template: >-
                  {{ (state_attr(_cpy_dest_vol, 'variables') or {}).get(_dest, {}).get('timestamp', '') >= _now }}
                timeout: "00:00:30"
                continue_on_timeout: true
              - variables:
                  _write_verified: "{{ wait.completed }}"
              - variables:
                  _tags_for_index: >-
                    {%- set _tr = tags | default('', true) -%}
                    {%- if _tr is sequence and not _tr is string -%}
                      {{- _tr | map('string') | map('lower') | map('slugify') | select('string') | list -}}
                    {%- elif _tr is string and _tr | trim != '' -%}
                      {{- _tr | replace('\n', ',') | regex_findall('[^,]+') | map('trim') | map('lower') | map('slugify') | select('string') | list -}}
                    {%- else -%}
                      {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                      {%- set _v_s = (state_attr(_vol, 'variables') if state_attr(_vol, 'variables') is mapping else {}) -%}
                      {%- set _v = _v_s if _v_s is mapping else (_v_s | from_json(none) if _v_s is string else none) -%}
                      {%- set _src_ci = ((_v if _v is mapping else {}).get('_label_index', {}).get('value', {})) -%}
                      {%- set _src_ci = _src_ci if _src_ci is mapping else (_src_ci | from_json(none) if _src_ci is string and _src_ci | trim not in ['', '{}', 'null'] else {}) -%}
                      {%- set _src_ci = _src_ci if _src_ci is mapping else {} -%}
                      {%- set _src_ds = _key -%}
                      {%- set _ns = namespace(t=[]) -%}
                      {%- for _lbl, _drawers in _src_ci.items() -%}
                        {%- if _drawers is iterable and not _drawers is string and _src_ds in _drawers -%}
                          {%- set _ns.t = _ns.t + [_lbl] -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {{- _ns.t -}}
                    {%- endif -%}
              - variables:
                  _updated_label_index: >-
                    {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                    {%- set _v_s = (state_attr(_cpy_dest_vol, 'variables') if state_attr(_cpy_dest_vol, 'variables') is mapping else {}) -%}
                    {%- set _v = _v_s if _v_s is mapping else (_v_s | from_json(none) if _v_s is string else none) -%}
                    {%- set _ci = ((_v if _v is mapping else {}).get('_label_index', {}).get('value', {})) -%}
                    {%- set _ci = _ci if _ci is mapping else (_ci | from_json(none) if _ci is string and _ci | trim not in ['', '{}', 'null'] else {}) -%}
                    {%- set _ci = _ci if _ci is mapping else {} -%}
                    {%- set _ds = _dest -%}
                    {%- set _ns = namespace(val = dict(_ci)) -%}
                    {%- for _lbl in _tags_for_index -%}
                      {%- if _create_label or _lbl in labels() -%}
                        {%- set _e = _ns.val.get(_lbl) -%}
                        {%- set _ex = (_e if _e is iterable and not _e is string else [_e] if _e not in [none, ''] else []) -%}
                        {%- set _ns.val = _ns.val | combine({_lbl: (_ex + [_ds]) | unique | list}) -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {{- _ns.val -}}
              - choose:
                - conditions:
                  - condition: template
                    value_template: "{{ _tags_for_index | length > 0 }}"
                  sequence:
                  - event: set_variable_legacy
                    event_data:
                      key: _label_index
                      value: "{{- _updated_label_index | tojson -}}"
                      set_timestamp: true
                      volume_entity: "{{- _cpy_dest_vol -}}"
              - variables:
                  _tags_dropped: >-
                    {%- set _all = labels() -%}
                    {%- set _ns = namespace(d=[]) -%}
                    {%- for _lbl in _tags_for_index -%}
                      {%- if _lbl not in _all -%}{%- set _ns.d = _ns.d + [_lbl] -%}{%- endif -%}
                    {%- endfor -%}
                    {{ _ns.d }}
              - if: "{{ _create_label and _tags_dropped | length > 0 }}"
                then:
                  - repeat:
                      for_each: "{{ _tags_dropped }}"
                      sequence:
                        - action: homeassistant.create_label
                          data:
                            name: "{{ repeat.item }}"
              - variables:
                  result:
                    status: success
                    tool: zen_sutra_filecabinet
                    action: copy
                    from_key: "{{ _key }}"
                    to_key: "{{ _dest }}"
                    volume: "{{ _vol }}"
                    write_verified: "{{ _write_verified }}"
                    tags_dropped: "{{ [] if _create_label else _tags_dropped }}"
                    labels_created: "{{ _tags_dropped if _create_label else [] }}"
                    trace:
                      caller_token: "{{ _caller_token }}"
              - variables:
                  _child_keys_cpy: >-
                    {%- set _v0 = state_attr(_vol, 'variables') | default({}, true) -%}
                    {%- set _prefix = _key ~ '/' -%}
                    {%- set _ns = namespace(keys=[]) -%}
                    {%- for k in (_v0 if _v0 is mapping else {}).keys() -%}
                      {%- if k.startswith(_prefix) -%}
                        {%- set _ns.keys = _ns.keys + [k] -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {{ _ns.keys }}
              - repeat:
                  for_each: "{{ _child_keys_cpy }}"
                  sequence:
                  - variables:
                      _child_dest_cpy: "{{ repeat.item | replace(_key ~ '/', _dest ~ '/', 1) }}"
                      _child_val_cpy: "{{ ((state_attr(_vol, 'variables') or {}).get(repeat.item) or {}).get('value') }}"
                  - event: set_variable_legacy
                    event_data:
                      key: "{{ _child_dest_cpy }}"
                      value: "{{ _child_val_cpy }}"
                      volume_entity: "{{ _vol }}"
                      set_timestamp: true
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ result is not defined and _action == 'stacks_by_anchor' }}"
        sequence:
        - variables:
            _evidence: >-
              {%- set _ids = _anchor_ids_raw if _anchor_ids_raw is sequence else [] -%}
              {%- set ns = namespace(ev=[]) -%}
              {%- if _anchor_type == 'label' -%}
                {%- for aid in _ids -%}
                  {%- if aid in labels() -%}
                    {%- for eid in label_entities(aid) | select('match', 'sensor[.]') | list -%}
                      {%- set _fname = state_attr(eid, 'friendly_name') | default(eid, true) -%}
                      {%- set _e = {
                        'evidence_id': 'filecabinet:volume:' ~ eid,
                        'provider': 'filecabinet',
                        'object_type': 'cabinet_volume',
                        'title': _fname,
                        'path': eid,
                        'anchor_contexts': [{'type': _anchor_type, 'id': aid, 'confidence': 'label_match'}],
                        'content_redacted': true
                      } -%}
                      {%- set ns.ev = ns.ev + [_e] -%}
                    {%- endfor -%}
                  {%- endif -%}
                {%- endfor -%}
              {%- endif -%}
              {{ ns.ev }}
        - variables:
            result:
              status: success
              tool: zen_sutra_filecabinet
              action: stacks_by_anchor
              anchor_type: "{{ _anchor_type }}"
              anchor_ids: "{{ _anchor_ids_raw }}"
              evidence: "{{ _evidence if _evidence is sequence else [] }}"
              count: "{{ (_evidence | length) if _evidence is sequence else 0 }}"
              trace:
                caller_token: "{{ _caller_token }}"
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ result is not defined and _action == 'register' }}"
        sequence:
        - variables:
            _entry:
              provider: filecabinet
              tool: zen_sutra_filecabinet
              mode: stacks_by_anchor
              consumes: [label]
              returns: [cabinet_volume]
              security_act:
                model: rwxda
                required: r
                allowed: [r]
                denied: [w, x, d, a]
              failure_policy: soft
        # Through the central lens writer (prompt_loader lens_registry): it runs
        # queued and writes through FileCabinet, so the registry is found
        # wherever it lives (an expanded drawer too) and two registrations
        # never overwrite each other.
        - action: script.zen_admintools_prompt_loader
          continue_on_error: true
          response_variable: _reg_write_raw
          data:
            mode: lens_registry
            action_type: register
            item: filecabinet
            payload_json: "{{ _entry | tojson }}"
        - variables:
            _reg_write: "{{ _reg_write_raw.get('result', _reg_write_raw) if _reg_write_raw is defined and _reg_write_raw is mapping else {} }}"
            _reg_ok: "{{ _reg_write is mapping and _reg_write.get('status') == 'success' }}"
        - if: "{{ _reg_ok }}"
          then:
          - event: lens.provider_registered
            event_data:
              provider: filecabinet
              tool: zen_sutra_filecabinet
        - variables:
            result:
              status: "{{ 'success' if _reg_ok else 'error' }}"
              tool: zen_sutra_filecabinet
              action: register
              provider: filecabinet
              registry_entry: "{{ _entry }}"
              write_result: "{{ _reg_write }}"
              trace:
                caller_token: "{{ _caller_token }}"
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ result is not defined and _action == 'unregister' }}"
        sequence:
        # Through the central lens writer, like register.
        - action: script.zen_admintools_prompt_loader
          continue_on_error: true
          response_variable: _unreg_write_raw
          data:
            mode: lens_registry
            action_type: unregister
            item: filecabinet
        - variables:
            _unreg_write: "{{ _unreg_write_raw.get('result', _unreg_write_raw) if _unreg_write_raw is defined and _unreg_write_raw is mapping else {} }}"
        - variables:
            result:
              status: "{{ 'success' if _unreg_write is mapping and _unreg_write.get('status') == 'success' else 'error' }}"
              tool: zen_sutra_filecabinet
              action: unregister
              provider: filecabinet
              write_result: "{{ _unreg_write }}"
              trace:
                caller_token: "{{ _caller_token }}"
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ result is not defined and _action == 'inspect' }}"
        sequence:
        - variables:
            _reg_raw: >-
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
              {{ CABS.cabinet_drawer_value_mounted(_hh, 'lens_registry', '{}') }}
        - variables:
            _registry: >-
              {%- if _reg_raw is mapping -%}{{ _reg_raw }}
              {%- elif _reg_raw is string and (_reg_raw | trim)[:1] == '{' -%}
                {{ _reg_raw | from_json | default({}) }}
              {%- else -%}{{ {} }}{%- endif -%}
        - variables:
            result: >-
              {%- set _reg = _registry if _registry is mapping else {} -%}
              {%- set _e = _reg.get('filecabinet', {}) -%}
              {{
                {
                  'status': 'success',
                  'tool': 'zen_sutra_filecabinet',
                  'action': 'inspect',
                  'registered': 'filecabinet' in _reg,
                  'registry_entry': _e if _e is mapping else {},
                  'trace': {'caller_token': _caller_token}
                }
              }}
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ result is not defined and _action == 'health' }}"
        sequence:
        - choose:
          # ── System-wide status (no volume passed) ──────────────────────────────
          - conditions:
            - condition: template
              value_template: "{{ _vol == '' }}"
            sequence:
            - variables:
                _h_states: "{{ state_attr('sensor.zen_cabinet_health', 'cabinet_states') | default({}, true) }}"
                _h_slot_ents: "{{ state_attr('sensor.zen_cabinet_health', 'slot_entities') | default({}, true) }}"
                _h_cab_health: "{{ states('sensor.zen_cabinet_health') }}"
            - variables:
                result: >-
                  {%- set _states = _h_states if _h_states is mapping else {} -%}
                  {%- set ns = namespace(mounted=[], unmounted=[]) -%}
                  {%- for slot, st in _states.items() -%}
                    {%- if st == 'online_mounted' -%}{%- set ns.mounted = ns.mounted + [slot] -%}
                    {%- elif st == 'online_unmounted' -%}{%- set ns.unmounted = ns.unmounted + [slot] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{
                    {
                      'status': 'success',
                      'tool': 'zen_sutra_filecabinet',
                      'action': 'health',
                      'provider': 'filecabinet',
                      'cabinet_health': _h_cab_health,
                      'cabinet_states': _states,
                      'mounted': ns.mounted,
                      'unmounted': ns.unmounted,
                      'pipeline': {
                        'master': is_state('input_boolean.zen_summarizers_enabled', 'on'),
                        'supersummary': is_state('input_boolean.zen_supersummarizer_enabled', 'on'),
                        'ninja': is_state('input_boolean.zen_ninja_summarizer_enabled', 'on')
                      },
                      'slot_entities': (_h_slot_ents if _h_slot_ents is mapping else {}),
                      'trace': {'caller_token': _caller_token}
                    }
                  }}
          default:
          - variables:
              result: >-
                {%- set _vol_ok = _vol != '' and has_value(_vol) -%}
                {{
                  {
                    'status': 'ok' if _vol_ok else ('degraded' if _vol != '' else 'error'),
                    'tool': 'zen_sutra_filecabinet',
                    'action': 'health',
                    'provider': 'filecabinet',
                    'volume': _vol,
                    'volume_available': _vol_ok,
                    'trace': {'caller_token': _caller_token}
                  }
                }}
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ result is not defined and _action == 'audit' }}"
        sequence:
        - variables:
            result:
              status: success
              tool: zen_sutra_filecabinet
              action: audit
              provider: filecabinet
              policy:
                consumes: [label]
                returns: [cabinet_volume]
                security_act:
                  model: rwxda
                  required: r
                  allowed: [r]
                  denied: [w, x, d, a]
                failure_policy: soft
                content_redacted: true
              trace:
                caller_token: "{{ _caller_token }}"
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ result is not defined and _action == 'expansion_sitrep' }}"
        sequence:
        - variables:
            result: >-
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
              {%- set _exp_cabs = CABS.cabinet_slot_candidates() | from_json([]) -%}
              {%- set _sys_drawers = ['AI_Cabinet_VolumeInfo', 'meta', '_label_index', '_zen_relationships'] -%}
              {%- set ns = namespace(cabs=[]) -%}
              {%- for _eid in _exp_cabs -%}
                {%- set _raw = state_attr(_eid, 'variables') | default(none) -%}
                {%- set _vars = _raw if _raw is mapping else {} -%}
                {%- set _vi_outer = (_vars.get('AI_Cabinet_VolumeInfo') or {}) -%}
                {%- set _vi_outer = _vi_outer if _vi_outer is mapping else {} -%}
                {%- set _vi = (_vi_outer.get('value') or {}) if _vi_outer else {} -%}
                {%- set _vi = _vi if _vi is mapping else {} -%}
                {%- set _user_keys = _vars.keys() | reject('in', _sys_drawers) | list -%}
                {%- set _bytes = _vars | tojson | length -%}
                {%- set _pct = ((_bytes / 131072) * 100) | round(1) -%}
                {%- set _cab_class = _vi.get('cabinet_class', none) -%}
                {%- set _hosted_by = _vi.get('hosted_by', none) -%}
                {%- set _is_empty = _user_keys | length == 0 -%}
                {%- set _boot_ready = _raw is not none -%}
                {%- set _slot = CABS.cabinet_slot_status(_eid) | from_json({}) -%}
                {%- set _qualifies = _slot.get('free', false) and _slot.get('ready', false) -%}
                {%- if _cab_class == 'expansion' -%}
                  {%- set _note = 'expansion slave — writes blocked, parent: ' ~ (_hosted_by | default('unknown')) -%}
                {%- elif not _boot_ready -%}
                  {%- set _note = 'not ready (boot guard active)' -%}
                {%- elif _qualifies -%}
                  {%- set _note = 'available as expand_drawer target' -%}
                {%- else -%}
                  {%- set _note = 'in use — ' ~ (_user_keys | length) ~ ' drawer(s): ' ~ (_user_keys | join(', ')) -%}
                {%- endif -%}
                {%- set _rec = {
                  'entity_id': _eid,
                  'friendly_name': state_attr(_eid, 'friendly_name') | default(_eid, true),
                  'state': states(_eid),
                  'boot_ready': _boot_ready,
                  'drawer_count': _user_keys | length,
                  'drawer_keys': _user_keys,
                  'bytes_used': _bytes,
                  'bytes_total': 131072,
                  'pct_full': _pct,
                  'cabinet_class': _cab_class,
                  'hosted_by': _hosted_by,
                  'qualifies_as_target': _qualifies,
                  'note': _note
                } -%}
                {%- set ns.cabs = ns.cabs + [_rec] -%}
              {%- endfor -%}
              {%- set _available = ns.cabs | selectattr('qualifies_as_target') | list -%}
              {%- set _stamped = ns.cabs | selectattr('cabinet_class', 'equalto', 'expansion') | list -%}
              {{
                {
                  'status': 'success',
                  'tool': 'zen_sutra_filecabinet',
                  'action': 'expansion_sitrep',
                  'cabinets': ns.cabs,
                  'summary': {
                    'total_expansion_cabs': ns.cabs | length,
                    'available_as_targets': _available | length,
                    'stamped_as_expansion_slaves': _stamped | length,
                    'in_use': (ns.cabs | length) - (_available | length) - (_stamped | length),
                    'available_entities': _available | map(attribute='entity_id') | list
                  },
                  'trace': {'caller_token': _caller_token}
                }
              }}
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ result is not defined and _action == 'fleet' }}"
        sequence:
        - variables:
            result: >-
              {%- set _sys_drawers = ['AI_Cabinet_VolumeInfo', 'meta', '_label_index', '_zen_relationships'] -%}
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
              {%- set _slot_cabs = CABS.cabinet_slot_candidates() | from_json([]) -%}
              {%- set _labeled = label_entities('Zen Cabinet') | select('match', 'sensor\\.') | list -%}
              {%- set _pattern = states.sensor | selectattr('entity_id', 'search', 'zenos_.*_cabinet') | map(attribute='entity_id') | list -%}
              {%- set _ns_all = namespace(eids=[]) -%}
              {%- for e in (_labeled + _pattern) -%}
                {%- if e not in _ns_all.eids -%}{%- set _ns_all.eids = _ns_all.eids + [e] -%}{%- endif -%}
              {%- endfor -%}
              {%- set ns = namespace(cabs=[], fat=[], critical=[], broken_mounts=[], exp_clean=[], exp_stamped=[]) -%}
              {%- for _eid in _ns_all.eids | sort -%}
                {%- set _raw = state_attr(_eid, 'variables') | default(none) -%}
                {%- set _vars = _raw if _raw is mapping else {} -%}
                {%- set _vi_outer = (_vars.get('AI_Cabinet_VolumeInfo') or {}) -%}
                {%- set _vi_outer = _vi_outer if _vi_outer is mapping else {} -%}
                {%- set _vi = (_vi_outer.get('value') or {}) -%}
                {%- set _vi = _vi if _vi is mapping else (_vi | from_json({}) if _vi is string else {}) -%}
                {%- set _guid = _vi.get('id', none) -%}
                {%- set _cab_class = _vi.get('cabinet_class', none) -%}
                {%- set _hosted_by = _vi.get('hosted_by', none) -%}
                {%- set _ro = (_vi.get('flags', {}) or {}).get('cabinet_ro', false) -%}
                {%- set _boot_ready = _raw is not none -%}
                {%- set _bytes = _vars | tojson | length -%}
                {%- set _pct = ((_bytes / 131072) * 100) | round(1) -%}
                {%- set _in_exp = _eid in _slot_cabs -%}
                {%- set _is_history = '_history_cabinet' in _eid -%}
                {%- set _role = 'expansion' if _in_exp else ('history' if _is_history else 'named') -%}
                {%- set _user_keys = _vars.keys() | reject('in', _sys_drawers) | list -%}
                {%- set _ns_m = namespace(mounts=[]) -%}
                {%- for k in _user_keys -%}
                  {%- set _dv = (_vars.get(k) or {}) -%}
                  {%- if _dv is mapping -%}
                    {%- set _dval = _dv.get('value') -%}
                    {%- set _dval = _dval if _dval is mapping else (_dval | from_json(none) if _dval is string and _dval | trim not in ['', 'null'] else none) -%}
                    {%- if _dval is mapping and _dval.get('mount_point', false) == true -%}
                      {%- set _fc_args = _dval.get('fc_args', none) -%}
                      {%- if _fc_args is mapping -%}
                        {%- set _live_tool = _fc_args.get('tool', _fc_args.get('action_type', '')) -%}
                        {%- set _live_blocked = _live_tool in ['read', 'manifest'] or not _live_tool.startswith('zen_') -%}
                        {%- set _ns_m.mounts = _ns_m.mounts + [{'key': k, 'type': 'live_drawer', 'tool': _live_tool, 'resolved': not _live_blocked}] -%}
                        {%- if _live_blocked -%}
                          {%- set ns.broken_mounts = ns.broken_mounts + [{'cabinet': _eid, 'key': k, 'type': 'live_drawer', 'tool': _live_tool, 'reason': 'fc_args.tool is a lens verb or invalid — must be a zen_* script name'}] -%}
                        {%- endif -%}
                      {%- else -%}
                        {%- set _tgt = _dval.get('target_entity_id', '') -%}
                        {%- set _tgt_vars = (state_attr(_tgt, 'variables') or {}) if _tgt != '' else {} -%}
                        {%- set _res = k in _tgt_vars -%}
                        {%- set _ns_m.mounts = _ns_m.mounts + [{'key': k, 'type': 'cross_cabinet', 'target': _tgt, 'resolved': _res}] -%}
                        {%- if not _res -%}
                          {%- set ns.broken_mounts = ns.broken_mounts + [{'cabinet': _eid, 'key': k, 'type': 'cross_cabinet', 'target': _tgt, 'reason': 'key not found in target'}] -%}
                        {%- endif -%}
                      {%- endif -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endfor -%}
                {%- set _rec = {
                  'entity_id': _eid,
                  'friendly_name': state_attr(_eid, 'friendly_name') | default(_eid, true),
                  'guid': _guid,
                  'role': _role,
                  'cabinet_class': _cab_class,
                  'hosted_by': _hosted_by,
                  'state': states(_eid),
                  'cabinet_ro': _ro,
                  'boot_ready': _boot_ready,
                  'drawer_count': _user_keys | length,
                  'drawer_keys': _user_keys,
                  'pct_full': _pct,
                  'bytes_used': _bytes,
                  'bytes_total': 131072,
                  'mounts_out': _ns_m.mounts
                } -%}
                {%- set ns.cabs = ns.cabs + [_rec] -%}
                {%- if _pct >= 90 -%}{%- set ns.critical = ns.critical + [{'entity_id': _eid, 'pct_full': _pct, 'guid': _guid}] -%}
                {%- elif _pct >= 70 -%}{%- set ns.fat = ns.fat + [{'entity_id': _eid, 'pct_full': _pct, 'guid': _guid}] -%}
                {%- endif -%}
                {%- if _in_exp -%}
                  {%- if _cab_class == 'expansion' -%}{%- set ns.exp_stamped = ns.exp_stamped + [_eid] -%}
                  {%- elif (CABS.cabinet_slot_status(_eid) | from_json({})).get('free', false) and _boot_ready -%}{%- set ns.exp_clean = ns.exp_clean + [{'entity_id': _eid, 'guid': _guid}] -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
              {%- set _hints = namespace(h=[]) -%}
              {%- if ns.critical | length > 0 -%}
                {%- set _hints.h = _hints.h + ['CRITICAL: ' ~ (ns.critical | length) ~ ' cab(s) >90% full — expand_drawer immediately: ' ~ (ns.critical | map(attribute='entity_id') | join(', '))] -%}
              {%- endif -%}
              {%- if ns.fat | length > 0 -%}
                {%- set _hints.h = _hints.h + ['WARNING: ' ~ (ns.fat | length) ~ ' cab(s) 70-90% full: ' ~ (ns.fat | map(attribute='entity_id') | join(', '))] -%}
              {%- endif -%}
              {%- if ns.broken_mounts | length > 0 -%}
                {%- set _hints.h = _hints.h + ['BROKEN: ' ~ (ns.broken_mounts | length) ~ ' mount pointer(s) do not resolve — check mount_broken in summary'] -%}
              {%- endif -%}
              {%- if ns.exp_clean | length > 0 -%}
                {%- set _ns_sl = namespace(parts=[]) -%}
                {%- for s in ns.exp_clean -%}{%- set _ns_sl.parts = _ns_sl.parts + [s.entity_id ~ ' (guid=' ~ (s.guid | default('unknown')) ~ ')'] -%}{%- endfor -%}
                {%- set _hints.h = _hints.h + ['OK: ' ~ (ns.exp_clean | length) ~ ' clean expansion slot(s) ready — call expand_drawer with target_guid from expansion_pool.available: ' ~ (_ns_sl.parts | join(', '))] -%}
              {%- else -%}
                {%- set _hints.h = _hints.h + ['NO SLOTS: all expansion cabs in use — provision a new one before expanding'] -%}
              {%- endif -%}
              {{
                {
                  'status': 'success',
                  'tool': 'zen_sutra_filecabinet',
                  'action': 'fleet',
                  'cabinets': ns.cabs,
                  'summary': {
                    'total_cabs': ns.cabs | length,
                    'named_cabs': ns.cabs | selectattr('role', 'equalto', 'named') | list | length,
                    'history_cabs': ns.cabs | selectattr('role', 'equalto', 'history') | list | length,
                    'expansion_cabs': ns.cabs | selectattr('role', 'equalto', 'expansion') | list | length,
                    'fat': ns.fat,
                    'critical': ns.critical,
                    'broken_mounts': ns.broken_mounts,
                    'expansion_pool': {
                      'total': (ns.exp_stamped | length) + (ns.exp_clean | length),
                      'stamped_in_use': ns.exp_stamped | length,
                      'clean_available': ns.exp_clean | length,
                      'available': ns.exp_clean
                    },
                    'action_hints': _hints.h
                  },
                  'trace': {'caller_token': _caller_token}
                }
              }}
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ result is not defined and _action == 'manifest' }}"
        sequence:
        - action: script.zen_dojotools_manifest
          response_variable: _fc_raw
          continue_on_error: true
          data:
            mode: cabinets
            show_hidden_volumes: "{{ _show_hidden }}"
            show_stacks: "{{ _show_stacks }}"
        - variables:
            # zen_dojotools_manifest wraps its response in the canonical
            # OS.envelope() shape -- its own fields live under .result, not
            # at the top level.
            result: >-
              {%- set _r = (_fc_raw.get('result', {}) if _fc_raw is mapping else {}) -%}
              {%- set _r = _r if _r is mapping and _r | length > 0 else {'status': 'error', 'message': 'no_response'} -%}
              {{ _r | combine({'tool': 'zen_sutra_filecabinet', 'action': 'manifest'}) }}
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ result is not defined and _action == 'clone' }}"
        sequence:
        - variables:
            _clone_vol: "{{ state_attr(_vol, 'variables') | default({}, true) }}"
        - variables:
            _clone_src_health: "{{ state_attr(_vol, 'health') or {} }}"
            _clone_dest_health: "{{ state_attr(_dest_cab, 'health') or {} }}"
        - variables:
            _clone_src_ok: >-
              {{ _clone_src_health.get('status', '') != 'error'
                 and not _clone_src_health.get('guid_mismatch', false) }}
            _clone_dest_ok: >-
              {{ _clone_dest_health.get('status', '') != 'error'
                 and not _clone_dest_health.get('guid_mismatch', false)
                 and _clone_dest_health.get('writeable', true) }}
            _clone_mount_keys: >-
              {%- set ns = namespace(mounts=[]) -%}
              {%- for k, v in (_clone_vol if _clone_vol is mapping else {}).items() -%}
                {%- set val = v.get('value', v) if v is mapping else v -%}
                {%- if val is mapping and val.get('mount_point', false) == true -%}
                  {%- set ns.mounts = ns.mounts + [k] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.mounts }}
            _drawers_to_clone: >-
              {%- set skip = [] if _transfer_guid else ['AI_Cabinet_VolumeInfo'] -%}
              {%- set ns = namespace(drawers=[]) -%}
              {%- for k in (_clone_vol if _clone_vol is mapping else {}).keys() -%}
                {%- if k not in skip -%}{%- set ns.drawers = ns.drawers + [k] -%}{%- endif -%}
              {%- endfor -%}
              {{ ns.drawers }}
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _dest_cab == '' }}"
            sequence:
            - variables:
                result:
                  status: error
                  tool: zen_sutra_filecabinet
                  action: clone
                  message: destination_cabinet is required for clone.
                  trace:
                    caller_token: "{{ _caller_token }}"
          - conditions:
            - condition: template
              value_template: "{{ _dest_cab == _vol }}"
            sequence:
            - variables:
                result:
                  status: error
                  tool: zen_sutra_filecabinet
                  action: clone
                  message: Cannot clone a cabinet to itself.
                  trace:
                    caller_token: "{{ _caller_token }}"
          - conditions:
            - condition: template
              value_template: "{{ _transfer_guid and not _force_action }}"
            sequence:
            - variables:
                result:
                  status: error
                  tool: zen_sutra_filecabinet
                  action: clone
                  message: GUID transfer is destructive and irreversible. Set force_action true to confirm.
                  trace:
                    caller_token: "{{ _caller_token }}"
          - conditions:
            - condition: template
              value_template: "{{ not _clone_src_ok }}"
            sequence:
            - variables:
                result:
                  status: error
                  tool: zen_sutra_filecabinet
                  action: clone
                  message: clone blocked — source cabinet not healthy.
                  health: "{{ _clone_src_health }}"
                  trace:
                    caller_token: "{{ _caller_token }}"
          - conditions:
            - condition: template
              value_template: "{{ not _clone_dest_ok }}"
            sequence:
            - variables:
                result:
                  status: error
                  tool: zen_sutra_filecabinet
                  action: clone
                  message: clone blocked — destination cabinet not healthy or not writeable.
                  health: "{{ _clone_dest_health }}"
                  trace:
                    caller_token: "{{ _caller_token }}"
        - if: "{{ result is not defined }}"
          then:
          - repeat:
              for_each: "{{ _drawers_to_clone }}"
              sequence:
              - event: set_variable_legacy
                event_data:
                  key: "{{ repeat.item }}"
                  value: >-
                    {%- set src = (_clone_vol if _clone_vol is mapping else {}).get(repeat.item) -%}
                    {%- set ns = namespace(d=src) -%}
                    {%- if ns.d is string and (ns.d | trim)[:1] in ['{', '['] -%}
                      {%- set _parsed = ns.d | from_json(none) -%}
                      {%- if _parsed is not none and _parsed is not string -%}
                        {%- set ns.d = _parsed -%}
                      {%- endif -%}
                    {%- endif -%}
                    {{ (ns.d.get('value', ns.d) if ns.d is mapping else ns.d) }}
                  set_timestamp: true
                  volume_entity: "{{ _dest_cab }}"
          - wait_template: >-
              {{ (state_attr(_dest_cab, 'variables') or {}) | length >= _drawers_to_clone | length }}
            timeout: "00:00:05"
            continue_on_timeout: true
          - variables:
              _clone_verified: >-
                {{ (state_attr(_dest_cab, 'variables') or {}) | length >= _drawers_to_clone | length }}
          - choose:
            - conditions:
              - condition: template
                value_template: "{{ _transfer_guid }}"
              sequence:
              - repeat:
                  for_each: "{{ _drawers_to_clone }}"
                  sequence:
                  - event: remove_variable_legacy
                    event_data:
                      key: "{{ repeat.item }}"
                      volume_entity: "{{ _vol }}"
              - event: set_variable_legacy
                event_data:
                  key: AI_Cabinet_VolumeInfo
                  value: "{{ {'id': 'pending_' ~ now().timestamp() | int | string, 'needs_restamp': true, 'note': 'GUID transferred to ' ~ _dest_cab ~ ' on ' ~ _now} }}"
                  set_timestamp: true
                  volume_entity: "{{ _vol }}"
          - variables:
              _clone_src_vi: >-
                {%- set vi = (_clone_vol if _clone_vol is mapping else {}).get('AI_Cabinet_VolumeInfo', {}) -%}
                {%- set v = vi.get('value', vi) if vi is mapping else {} -%}
                {{ v if v is mapping else {} }}
          - variables:
              result:
                status: "{{ 'success' if _clone_verified else 'warning' }}"
                tool: zen_sutra_filecabinet
                action: clone
                transfer_guid: "{{ _transfer_guid }}"
                source: "{{ _vol }}"
                destination: "{{ _dest_cab }}"
                drawers_cloned: "{{ _drawers_to_clone | length }}"
                mounts_copied: "{{ _clone_mount_keys }}"
                source_guid: "{{ _clone_src_vi.get('id', '') if _clone_src_vi is mapping else '' }}"
                verification:
                  confirmed: "{{ _clone_verified }}"
                trace:
                  caller_token: "{{ _caller_token }}"
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ result is not defined and _action == 'set_mount' }}"
        sequence:
        # Hard block — _label_index mount-out not yet supported
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _key == '_label_index' }}"
            sequence:
            - variables:
                result:
                  status: error
                  tool: zen_sutra_filecabinet
                  action: set_mount
                  message: >-
                    Mounting out _label_index is not yet supported. The label index is read
                    directly during cabinet traversal — mount-pointer following for this
                    system drawer requires dedicated work. Planned for a future release.
                  trace:
                    caller_token: "{{ _caller_token }}"
        - if: "{{ result is not defined }}"
          then:
          - variables:
              _sm_vol: "{{ state_attr(_vol, 'variables') | default({}, true) }}"
          - variables:
              _sm_target_entity: >-
                {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                {%- set ns = namespace(found='') -%}
                {%- for eid in label_entities('zen_cabinet') | list -%}
                  {%- set vi = CABS.cabinet_drawer_value(eid, 'AI_Cabinet_VolumeInfo', none) | from_json() -%}
                  {%- if vi is mapping and vi.get('id', '') == _target_guid -%}
                    {%- set ns.found = eid -%}
                    {%- break -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.found }}
              _sm_old_entry: "{{ (_sm_vol if _sm_vol is mapping else {}).get(_key, {}) }}"
          - variables:
              _sm_old_guid: >-
                {%- set e = _sm_old_entry -%}
                {%- set ev = e.get('value', {}) if e is mapping else {} -%}
                {{ ev.get('target_guid', '') if ev is mapping and ev.get('mount_point', false) else '' }}
              _sm_existing_is_mount: >-
                {%- set e = _sm_old_entry -%}
                {%- set ev = e.get('value', {}) if e is mapping else {} -%}
                {{ ev is mapping and ev.get('mount_point', false) == true }}
              _sm_key_exists: "{{ (_sm_vol if _sm_vol is mapping else {}).get(_key) is not none }}"
          - choose:
            - conditions:
              - condition: template
                value_template: "{{ _key == '' or (_target_guid == '' and (_fc_args is none or _fc_args | trim == '')) }}"
              sequence:
              - variables:
                  result:
                    status: error
                    tool: zen_sutra_filecabinet
                    action: set_mount
                    message: "set_mount requires key and either target_guid (cross-cabinet mount) or fc_args (live drawer — tool-backed mount)."
                    trace:
                      caller_token: "{{ _caller_token }}"
            - conditions:
              - condition: template
                value_template: "{{ _target_guid != '' and _sm_target_entity == '' }}"
              sequence:
              - variables:
                  result:
                    status: error
                    tool: zen_sutra_filecabinet
                    action: set_mount
                    message: "set_mount failed: target_guid '{{ _target_guid }}' not found in any cabinet."
                    trace:
                      caller_token: "{{ _caller_token }}"
            - conditions:
              - condition: template
                value_template: "{{ _sm_target_entity == _vol }}"
              sequence:
              - variables:
                  result:
                    status: error
                    tool: zen_sutra_filecabinet
                    action: set_mount
                    message: "set_mount blocked: target_guid '{{ _target_guid }}' resolves to this volume. Same-volume mounts create a traversal loop. Read the drawer directly."
                    trace:
                      caller_token: "{{ _caller_token }}"
            - conditions:
              - condition: template
                value_template: "{{ _sm_key_exists and not _sm_existing_is_mount and not _force_action }}"
              sequence:
              - variables:
                  result:
                    status: error
                    tool: zen_sutra_filecabinet
                    action: set_mount
                    message: "set_mount blocked: drawer '{{ _key }}' exists and is not a mount point. Use force_action to overwrite."
                    trace:
                      caller_token: "{{ _caller_token }}"
          - if: "{{ result is not defined }}"
            then:
            - variables:
                _sm_fc_parsed: "{{ _fc_args if _fc_args is mapping else (_fc_args | from_json(none) if _fc_args | trim != '' else none) }}"
            - variables:
                _sm_val: "{{ {'mount_point': true, 'target_guid': _target_guid, 'target_entity_id': _sm_target_entity} | combine({'fc_args': _sm_fc_parsed} if _sm_fc_parsed is mapping else {}) }}"
            - event: set_variable_legacy
              event_data:
                key: "{{ _key }}"
                value: "{{ _sm_val | tojson }}"
                volume_entity: "{{ _vol }}"
                set_timestamp: true
            - wait_template: >-
                {%- set vol = state_attr(_vol, 'variables') | default({}, true) -%}
                {%- set entry = vol.get(_key, {}) if vol is mapping else {} -%}
                {%- set ev = (entry.get('value') if entry is mapping else none) -%}
                {%- set ev = ev if ev is mapping else (ev | from_json(none) if ev is string and ev | trim not in ['', 'null', 'None'] else none) -%}
                {{ ev is mapping and ev.get('mount_point', false) == true }}
              timeout: "00:00:05"
              continue_on_timeout: true
            - variables:
                _sm_verify_vol: "{{ state_attr(_vol, 'variables') | default({}, true) }}"
                _sm_verify_entry: "{{ (_sm_verify_vol if _sm_verify_vol is mapping else {}).get(_key, {}) }}"
            - variables:
                _sm_verified: >-
                  {%- set ev = (_sm_verify_entry.get('value') if _sm_verify_entry is mapping else none) -%}
                  {%- set ev = ev if ev is mapping else (ev | from_json(none) if ev is string and ev | trim not in ['', 'null', 'None'] else none) -%}
                  {{ ev is mapping and ev.get('mount_point', false) == true }}
            - variables:
                result:
                  status: "{{ 'success' if _sm_verified else 'warning' }}"
                  tool: zen_sutra_filecabinet
                  action: set_mount
                  message: >-
                    {%- if _sm_verified -%}
                      {%- if _target_guid != '' -%}
                        Mount point '{{ _key }}' set to target '{{ _target_guid }}' ({{ _sm_target_entity }}) (verified).
                      {%- else -%}
                        Virtual mount point '{{ _key }}' set with fc_args (verified).
                      {%- endif -%}
                    {%- else -%}
                      Mount point '{{ _key }}' write issued but not yet confirmed.
                    {%- endif %}
                  mount:
                    drawer: "{{ _key }}"
                    target_guid: "{{ _target_guid if _target_guid != '' else none }}"
                    target_entity_id: "{{ _sm_target_entity if _sm_target_entity != '' else none }}"
                  previous_guid: "{{ _sm_old_guid }}"
                  verification:
                    confirmed: "{{ _sm_verified }}"
                  trace:
                    caller_token: "{{ _caller_token }}"
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ result is not defined and _action == 'remove_mount' }}"
        sequence:
        - variables:
            _rm_vol: "{{ state_attr(_vol, 'variables') | default({}, true) }}"
        - variables:
            _rm_existing: "{{ (_rm_vol if _rm_vol is mapping else {}).get(_key, {}) }}"
        - variables:
            _rm_is_mount: >-
              {%- set ev = (_rm_existing.get('value') if _rm_existing is mapping else none) -%}
              {%- set ev = ev if ev is mapping else (ev | from_json(none) if ev is string and ev | trim not in ['', 'null', 'None'] else none) -%}
              {{ ev is mapping and ev.get('mount_point', false) == true }}
            _rm_old_guid: >-
              {%- set ev = (_rm_existing.get('value') if _rm_existing is mapping else none) -%}
              {%- set ev = ev if ev is mapping else (ev | from_json(none) if ev is string and ev | trim not in ['', 'null', 'None'] else none) -%}
              {{ ev.get('target_guid', '') if ev is mapping else '' }}
            _rm_key_exists: "{{ (_rm_vol if _rm_vol is mapping else {}).get(_key) is not none }}"
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ not _rm_key_exists }}"
            sequence:
            - variables:
                result:
                  status: error
                  tool: zen_sutra_filecabinet
                  action: remove_mount
                  message: "remove_mount failed: drawer '{{ _key }}' not found in volume."
                  trace:
                    caller_token: "{{ _caller_token }}"
          - conditions:
            - condition: template
              value_template: "{{ not _rm_is_mount }}"
            sequence:
            - variables:
                result:
                  status: error
                  tool: zen_sutra_filecabinet
                  action: remove_mount
                  message: "remove_mount failed: drawer '{{ _key }}' is not a mount point."
                  trace:
                    caller_token: "{{ _caller_token }}"
        - if: "{{ result is not defined }}"
          then:
          - event: remove_variable_legacy
            event_data:
              key: "{{ _key }}"
              volume_entity: "{{ _vol }}"
          - wait_template: >-
              {%- set vol = state_attr(_vol, 'variables') | default({}, true) -%}
              {{ vol is mapping and (_key not in vol) }}
            timeout: "00:00:05"
            continue_on_timeout: true
          - variables:
              _rm_verify_vol: "{{ state_attr(_vol, 'variables') | default({}, true) }}"
              _rm_verified: "{{ _rm_verify_vol is mapping and (_key not in _rm_verify_vol) }}"
          - variables:
              result:
                status: "{{ 'success' if _rm_verified else 'warning' }}"
                tool: zen_sutra_filecabinet
                action: remove_mount
                message: >-
                  {{ "Mount point '" ~ _key ~ "' removed (verified)."
                     if _rm_verified else
                     "Remove issued for '" ~ _key ~ "' but not yet confirmed." }}
                previous_guid: "{{ _rm_old_guid }}"
                verification:
                  confirmed: "{{ _rm_verified }}"
                trace:
                  caller_token: "{{ _caller_token }}"
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ result is not defined and _action == 'mount_cabinet' }}"
        sequence:
        - variables:
            _mc_state: "{{ states(_vol) }}"
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _mc_state == 'init' }}"
            sequence:
            - variables:
                result:
                  status: error
                  tool: zen_sutra_filecabinet
                  action: mount_cabinet
                  message: "mount_cabinet failed: '{{ _vol }}' is in 'init' state — VolumeInfo not yet loaded."
                  trace:
                    caller_token: "{{ _caller_token }}"
          - conditions:
            - condition: template
              value_template: "{{ _mc_state == 'online_mounted' }}"
            sequence:
            - variables:
                result:
                  status: success
                  tool: zen_sutra_filecabinet
                  action: mount_cabinet
                  message: "Cabinet '{{ _vol }}' is already mounted (idempotent)."
                  state: online_mounted
                  trace:
                    caller_token: "{{ _caller_token }}"
        - if: "{{ result is not defined }}"
          then:
          - event: set_variable_legacy
            event_data:
              key: meta
              value: "{{ {'mounted': true} }}"
              volume_entity: "{{ _vol }}"
              set_timestamp: true
          - wait_template: "{{ states(_vol) == 'online_mounted' }}"
            timeout: "00:00:05"
            continue_on_timeout: true
          - variables:
              _mc_verified: "{{ states(_vol) == 'online_mounted' }}"
          - variables:
              result:
                status: "{{ 'success' if _mc_verified else 'warning' }}"
                tool: zen_sutra_filecabinet
                action: mount_cabinet
                message: >-
                  {{ "Cabinet '" ~ _vol ~ "' mounted (verified)."
                     if _mc_verified else
                     "Mount write issued for '" ~ _vol ~ "' but state not yet confirmed." }}
                state: "{{ states(_vol) }}"
                verification:
                  confirmed: "{{ _mc_verified }}"
                trace:
                  caller_token: "{{ _caller_token }}"
          - event: zen_event
            event_data:
              event:
                kind: cabinet_mounted
                component: "{{ _vol }}"
                severity: info
                summary: "Cabinet '{{ _vol }}' mounted."
    - choose:
      - conditions:
        - condition: template
          value_template: >-
            {%- if _action != 'dismount_cabinet' -%}false{%- else -%}
            {%- set _pipe_cabs = label_entities('zen_dojo_cabinet') | list
                               + label_entities('zen_kata_cabinet') | list -%}
            {{ _vol in _pipe_cabs }}
            {%- endif -%}
        sequence:
        - variables:
            _pipe_live: >-
              {%- set checks = [
                ('zen_summarizers_enabled',      'input_boolean.zen_summarizers_enabled'),
                ('zen_supersummarizer_enabled',  'input_boolean.zen_supersummarizer_enabled'),
                ('zen_ninja_summarizer_enabled', 'input_boolean.zen_ninja_summarizer_enabled')
              ] -%}
              {%- set ns = namespace(on=[]) -%}
              {%- for name, eid in checks -%}
                {%- if is_state(eid, 'on') -%}{%- set ns.on = ns.on + [name] -%}{%- endif -%}
              {%- endfor -%}
              {{ ns.on }}
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _pipe_live | length > 0 }}"
            sequence:
            - variables:
                result:
                  status: error
                  tool: zen_sutra_filecabinet
                  action: dismount_cabinet
                  message: >-
                    dismount_cabinet blocked: '{{ _vol }}' is a pipeline cabinet and the summarizer
                    pipeline is live. Dismounting it would kill the summarizer.
                    Turn off the following switch(es) first, then retry dismount:
                    {{ _pipe_live | join(', ') }}.
                    Use zen_dojotools_systemtools (tool=select_control, mode=toggle) or the HA helper UI.
                  pipeline_switches_live: "{{ _pipe_live }}"
                  trace:
                    caller_token: "{{ _caller_token }}"
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ result is not defined and _action == 'dismount_cabinet' }}"
        sequence:
        - variables:
            _dc_default_labels:
            - zen_default_household_cabinet
            - zen_default_family_cabinet
            - zen_default_user_cabinet
            - zen_default_ai_user_cabinet
        - variables:
            _dc_is_default: >-
              {%- set ns = namespace(v=false) -%}
              {%- for lbl in _dc_default_labels -%}
                {%- if _vol in (label_entities(lbl) | list) -%}{%- set ns.v = true -%}{%- endif -%}
              {%- endfor -%}
              {{ ns.v }}
            _dc_state: "{{ states(_vol) }}"
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _dc_is_default }}"
            sequence:
            - variables:
                result:
                  status: error
                  tool: zen_sutra_filecabinet
                  action: dismount_cabinet
                  message: "dismount_cabinet blocked: '{{ _vol }}' holds a zen_default_* label. Transfer the default label before dismounting."
                  trace:
                    caller_token: "{{ _caller_token }}"
          - conditions:
            - condition: template
              value_template: "{{ _dc_state == 'init' }}"
            sequence:
            - variables:
                result:
                  status: error
                  tool: zen_sutra_filecabinet
                  action: dismount_cabinet
                  message: "dismount_cabinet failed: '{{ _vol }}' is in 'init' state — VolumeInfo not yet loaded."
                  trace:
                    caller_token: "{{ _caller_token }}"
          - conditions:
            - condition: template
              value_template: "{{ _dc_state == 'online_unmounted' }}"
            sequence:
            - variables:
                result:
                  status: success
                  tool: zen_sutra_filecabinet
                  action: dismount_cabinet
                  message: "Cabinet '{{ _vol }}' is already dismounted (idempotent)."
                  state: online_unmounted
                  trace:
                    caller_token: "{{ _caller_token }}"
        - if: "{{ result is not defined }}"
          then:
          - event: set_variable_legacy
            event_data:
              key: meta
              value: "{{ {'mounted': false} }}"
              volume_entity: "{{ _vol }}"
              set_timestamp: true
          - wait_template: "{{ states(_vol) == 'online_unmounted' }}"
            timeout: "00:00:05"
            continue_on_timeout: true
          - variables:
              _dc_verified: "{{ states(_vol) == 'online_unmounted' }}"
          - variables:
              result:
                status: "{{ 'success' if _dc_verified else 'warning' }}"
                tool: zen_sutra_filecabinet
                action: dismount_cabinet
                message: >-
                  {{ "Cabinet '" ~ _vol ~ "' dismounted and in the stacks (verified)."
                     if _dc_verified else
                     "Dismount write issued for '" ~ _vol ~ "' but state not yet confirmed." }}
                state: "{{ states(_vol) }}"
                verification:
                  confirmed: "{{ _dc_verified }}"
                trace:
                  caller_token: "{{ _caller_token }}"
          - event: zen_event
            event_data:
              event:
                kind: cabinet_dismounted
                component: "{{ _vol }}"
                severity: info
                summary: "Cabinet '{{ _vol }}' dismounted (in the stacks)."
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ result is not defined and _action == 'set_cabinet_ro' }}"
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _vol == 'sensor.zenos_system_cabinet' }}"
            sequence:
            - variables:
                result:
                  status: error
                  failure: syscab_write_blocked
                  tool: zen_sutra_filecabinet
                  action: set_cabinet_ro
                  message: "set_cabinet_ro blocked on sensor.zenos_system_cabinet. Use zen_admintools_prompt_loader or zen_admintools_cabinetadmin_factory."
                  volume: "{{ _vol }}"
                  trace:
                    caller_token: "{{ _caller_token }}"
        - if: "{{ result is not defined }}"
          then:
          - variables:
              _scro_vi_raw: "{{ (state_attr(_vol, 'variables') or {}).get('AI_Cabinet_VolumeInfo', {}) }}"
          - variables:
              _scro_vi_mapped: "{{ _scro_vi_raw if _scro_vi_raw is mapping else {} }}"
          - variables:
              _scro_vi_val_raw: "{{ _scro_vi_mapped.get('value', _scro_vi_mapped) }}"
          - variables:
              _scro_vi_val: "{{ _scro_vi_val_raw if _scro_vi_val_raw is mapping else (_scro_vi_val_raw | from_json if _scro_vi_val_raw is string and _scro_vi_val_raw | trim not in ['', 'null'] else {}) }}"
          - variables:
              _scro_flags: "{{ (_scro_vi_val.get('flags', {}) if _scro_vi_val is mapping else {}) }}"
          - variables:
              _scro_flags_mapped: "{{ _scro_flags if _scro_flags is mapping else {} }}"
              _scro_ro_already: "{{ (_scro_flags if _scro_flags is mapping else {}).get('cabinet_ro', false) == true }}"
          - choose:
            - conditions:
              - condition: template
                value_template: "{{ _scro_ro_already }}"
              sequence:
              - variables:
                  result:
                    status: ok
                    tool: zen_sutra_filecabinet
                    action: set_cabinet_ro
                    message: "cabinet_ro already true on '{{ _vol }}'. No change."
                    volume: "{{ _vol }}"
                    cabinet_ro: true
                    trace:
                      caller_token: "{{ _caller_token }}"
          - if: "{{ result is not defined }}"
            then:
            - event: set_variable_legacy
              event_data:
                key: AI_Cabinet_VolumeInfo
                value: "{{ _scro_vi_val | combine({'flags': _scro_flags_mapped | combine({'cabinet_ro': true})}) }}"
                volume_entity: "{{ _vol }}"
                set_timestamp: true
            - variables:
                result:
                  status: success
                  tool: zen_sutra_filecabinet
                  action: set_cabinet_ro
                  message: "cabinet_ro: true stamped on '{{ _vol }}'."
                  volume: "{{ _vol }}"
                  cabinet_ro: true
                  trace:
                    caller_token: "{{ _caller_token }}"
    - if:
      - condition: template
        value_template: "{{ result is not defined and _action == 'expand_drawer' }}"
      then:
      # expand_drawer: moves a drawer and its whole subtree (path, path/...) into
      # an expansion slot unchanged (value, meta and the drawer's own acl), and
      # leaves one mount pointer per key in the source. The expansion answers
      # with its host's ACL (CABS.acl_record). Order: plan, mount the slot,
      # stamp it (VolumeInfo merged, nothing else in it changes), copy, verify,
      # cut over, prove each read resolves. A failed step puts everything back.
      - variables:
          _ed_src: "{{ source_cabinet | default('', true) | string | trim }}"
          _ed_tgt_in: "{{ target_cabinet | default('', true) | string | trim }}"
          _ed_key: "{{ _key }}"
          _ed_thresh: "{{ space_threshold | default(85, true) | int(85) }}"
          _ed_max: 131072
          _ed_headroom: 2048
          _ed_max_keys: 30
      - variables:
          _ed_src_vars: "{{ (state_attr(_ed_src, 'variables') if _ed_src != '' else none) or {} }}"
      # The subtree. Any key that is already a mount pointer (an earlier move,
      # set_mount or a live drawer) refuses the whole call below.
      - variables:
          _ed_plan: >-
            {%- set _pre = _ed_key ~ '/' -%}
            {#- The root must be a plain drawer. A softlink below it moves as
                is (its pointer, unchanged); a pointer into an expansion never
                sits below a root. -#}
            {%- set ns = namespace(all=[], move=[], stay=[], links=[], xptr=[]) -%}
            {%- for k in (_ed_src_vars.keys() | list | sort) if _ed_key != '' and (k == _ed_key or k.startswith(_pre)) -%}
              {%- set e = _ed_src_vars[k] -%}
              {%- set v = e.get('value') if e is mapping else none -%}
              {%- set v = (v | from_json(none)) if v is string else v -%}
              {%- set ns.all = ns.all + [k] -%}
              {%- set _tg = ((v.get('target_entity_id') or '') | string) if v is mapping and v.get('mount_point', false) == true and v.get('fc_args') is none else '' -%}
              {%- set _te = (state_attr(_tg, 'variables') or {}).get('AI_Cabinet_VolumeInfo') if _tg != '' else none -%}
              {%- set _tvi = _te.get('value') if _te is mapping else none -%}
              {%- set _tvi = (_tvi | from_json(none)) if _tvi is string else _tvi -%}
              {%- if k == _ed_key and v is mapping and v.get('mount_point', false) == true -%}
                {%- set ns.stay = ns.stay + [k] -%}
              {%- elif _tvi is mapping and _tvi.get('cabinet_class') == 'expansion' -%}
                {%- set ns.xptr = ns.xptr + [k] -%}
              {%- else -%}
                {%- set ns.move = ns.move + [k] -%}
                {%- if v is mapping and v.get('mount_point', false) == true -%}{%- set ns.links = ns.links + [{'k': k, 'target': _tg}] -%}{%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {{- {'all': ns.all, 'move': ns.move, 'stay': ns.stay, 'links': ns.links, 'xptr': ns.xptr} -}}
      - variables:
          _ed_env: >-
            {%- set ns = namespace(d={}) -%}
            {%- for k in _ed_plan.move -%}
              {%- set ns.d = dict(ns.d, **{k: _ed_src_vars[k]}) -%}
            {%- endfor -%}
            {{- ns.d -}}
      - variables:
          _ed_move_bytes: "{{ _ed_env | tojson | length }}"
          _ed_src_size: "{{ _ed_src_vars | tojson | length }}"
          _ed_ptr_bytes: "{{ (_ed_plan.move | map('length') | sum) + 160 * (_ed_plan.move | count) }}"
          _ed_src_slot: >-
            {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
            {{- (CABS.cabinet_slot_status(_ed_src) | from_json({})) if _ed_src != '' else {} -}}
          _ed_slots: >-
            {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
            {{- CABS.cabinet_slot_candidates() | from_json([]) -}}
      - variables:
          _ed_err: >-
            {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
            {%- set _sys = ['AI_Cabinet_VolumeInfo', 'meta', '_label_index', '_zen_relationships'] -%}
            {%- set ns = namespace(locked=[]) -%}
            {%- for k in _ed_plan.move -%}
              {%- if CABS.acl_builtin_ops(k) | from_json({}) | count > 0 -%}{%- set ns.locked = ns.locked + [k] -%}{%- endif -%}
            {%- endfor -%}
            {%- if _ed_src == '' or _ed_key == '' -%}source_cabinet and path are required
            {%- elif _ed_key in _sys or _ed_key.startswith('_') -%}{{ _ed_key }} is a system drawer and does not move
            {%- elif '/' in _ed_key -%}{{ _ed_key }} is not a root drawer; an expansion mounts at a root drawer and takes its whole tree
            {%- elif not (state_attr(_ed_src, 'variables') is mapping) or states(_ed_src) in ['init', 'unavailable', 'unknown'] -%}{{ _ed_src }} is not a ready cabinet
            {%- elif _ed_src in _ed_slots or _ed_src_slot.get('cabinet_class') is not none -%}{{ _ed_src }} is an expansion slot; move from its host
            {%- elif _ed_plan.all | count == 0 -%}{{ _ed_key }} is not in {{ _ed_src }}
            {%- elif ns.locked | count > 0 -%}{{ ns.locked | join(', ') }}: credential and approval drawers do not move
            {%- elif _ed_key in _ed_plan.stay -%}{{ _ed_key }} is already expanded (a mount pointer); expand_drawer runs once per drawer
            {%- elif _ed_plan.xptr | count > 0 -%}{{ _ed_plan.xptr | join(', ') }} under {{ _ed_key }} is an expanded drawer; expansions mount at root drawers only
            {%- elif _ed_plan.move | count > _ed_max_keys -%}{{ _ed_plan.move | count }} keys under {{ _ed_key }}; one call moves at most {{ _ed_max_keys }} (move a deeper path first)
            {%- endif -%}
      - if: "{{ _ed_err | trim != '' }}"
        then:
        - variables:
            result:
              status: error
              tool: zen_sutra_filecabinet
              action: expand_drawer
              step_failed: validate
              reason: "guarded: {{ _ed_err | trim }}"
              source_cabinet: "{{ _ed_src }}"
              source_drawer: "{{ _ed_key }}"
              caller_token: "{{ _caller_token }}"
      # Target: the slot named, else the first free slot that has room. One
      # expansion holds one drawer and its children, so a slot holding any
      # drawer is never a target (an empty expansion of this source may be
      # reused: it holds nothing).
      - if: "{{ result is not defined }}"
        then:
        - variables:
            _ed_pick: >-
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
              {%- set _need = (_ed_move_bytes | int) + 64 * (_ed_plan.move | count) + (_ed_headroom | int) -%}
              {%- set ns = namespace(rows=[]) -%}
              {%- for eid in _ed_slots -%}
                {%- set s = CABS.cabinet_slot_status(eid) | from_json({}) -%}
                {%- set _sz = ((state_attr(eid, 'variables') or {}) | tojson | length) -%}
                {%- set _pre = _ed_key ~ '/' -%}
                {%- set no = namespace(l=[]) -%}
                {%- for k in s.get('user_drawers', []) if k != _ed_key and not k.startswith(_pre) -%}{%- set no.l = no.l + [k] -%}{%- endfor -%}
                {%- set _other = no.l -%}
                {%- set _host_ok = s.get('cabinet_class') == 'expansion' and s.get('hosted_by') == _ed_src and s.get('ready', false) and s.get('state') not in ['init', 'unavailable', 'unknown'] -%}
                {%- set _mine = _host_ok and s.get('user_drawers', []) | count == 0 -%}
                {%- set _free = s.get('free', false) and s.get('ready', false) and s.get('state') not in ['init', 'unavailable', 'unknown'] -%}
                {%- set _why = '' if (_mine or _free) and _sz + _need <= (_ed_max | int)
                               else ('insufficient_target_space' if (_mine or _free)
                               else ('target_holds_another_drawer: ' ~ (_other | join(', ')) if _host_ok
                               else ('target_is_expansion_of_' ~ s.get('hosted_by') if s.get('cabinet_class') is not none
                               else ('target_cabinet_not_empty' if s.get('user_drawers', []) | count > 0 else 'target_cabinet_not_ready')))) -%}
                {%- set ns.rows = ns.rows + [{'eid': eid, 'kind': 'expansion_of_source' if _mine else 'free', 'size': _sz, 'why': _why}] -%}
              {%- endfor -%}
              {%- set _ok = ns.rows | selectattr('why', 'equalto', '') | list -%}
              {%- if _ed_tgt_in != '' -%}
                {%- set _r = ns.rows | selectattr('eid', 'equalto', _ed_tgt_in) | list -%}
                {%- if _r | count == 0 -%}
                  {{- {'eid': '', 'why': 'target_not_an_expansion_slot', 'chosen': 'given', 'need': _need} -}}
                {%- else -%}
                  {{- dict(_r[0], chosen='given', need=_need) -}}
                {%- endif -%}
              {%- else -%}
                {%- set _m = _ok | selectattr('kind', 'equalto', 'expansion_of_source') | list -%}
                {%- set _f = _ok | selectattr('kind', 'equalto', 'free') | list -%}
                {%- set _c = (_m + _f) -%}
                {{- dict(_c[0], chosen='auto', need=_need) if _c | count > 0 else {'eid': '', 'why': 'no_expansion_slot_has_room', 'chosen': 'auto', 'need': _need} -}}
              {%- endif -%}
        - if: "{{ _ed_pick.why != '' }}"
          then:
          - variables:
              result:
                status: "{{ 'abort' if _ed_pick.why in ['insufficient_target_space', 'no_expansion_slot_has_room'] else 'error' }}"
                tool: zen_sutra_filecabinet
                action: expand_drawer
                step_failed: target
                reason: "{{ _ed_pick.why if _ed_pick.why in ['insufficient_target_space', 'no_expansion_slot_has_room'] else 'guarded: ' ~ _ed_pick.why }}"
                target_cabinet: "{{ _ed_pick.eid if _ed_pick.eid != '' else _ed_tgt_in }}"
                bytes_needed: "{{ _ed_pick.need }}"
                message: >-
                  One expansion holds one drawer and its children. The target must be a
                  free slot (empty, ready, not hosted, or an empty expansion of
                  {{ _ed_src }}) with room for {{ _ed_pick.need }} bytes.
                  expansion_sitrep lists the slots.
                caller_token: "{{ _caller_token }}"
      - if: "{{ result is not defined }}"
        then:
        - variables:
            _ed_tgt: "{{ _ed_pick.eid }}"
            _ed_src_pre_pct: "{{ ((_ed_src_size | int) * 100 / (_ed_max | int)) | round(1) }}"
            _ed_src_post_pct: "{{ (((_ed_src_size | int) - (_ed_move_bytes | int) + (_ed_ptr_bytes | int)) * 100 / (_ed_max | int)) | round(1) }}"
        - variables:
            _ed_selflinks: "{{ _ed_plan.links | selectattr('target', 'equalto', _ed_tgt) | map(attribute='k') | list }}"
        - if: "{{ _ed_selflinks | count > 0 }}"
          then:
          - variables:
              result:
                status: error
                tool: zen_sutra_filecabinet
                action: expand_drawer
                step_failed: validate
                reason: "guarded: {{ _ed_selflinks | join(', ') }} is a softlink into {{ _ed_tgt }}; in the expansion it would point at its own cabinet. Remove or repoint it first."
                source_cabinet: "{{ _ed_src }}"
                target_cabinet: "{{ _ed_tgt }}"
                caller_token: "{{ _caller_token }}"
        - if: "{{ result is not defined and _ed_src_post_pct | float >= _ed_thresh | float }}"
          then:
          - variables:
              result:
                status: abort
                tool: zen_sutra_filecabinet
                action: expand_drawer
                step_failed: space_check
                reason: source_will_remain_above_threshold
                source_cabinet: "{{ _ed_src }}"
                space_before_pct: "{{ _ed_src_pre_pct }}"
                space_after_pct: "{{ _ed_src_post_pct }}"
                threshold: "{{ _ed_thresh }}"
                caller_token: "{{ _caller_token }}"
      # Step 1: mount the slot (its meta is put back if anything fails).
      - if: "{{ result is not defined }}"
        then:
        - variables:
            _ed_tvars0: "{{ state_attr(_ed_tgt, 'variables') or {} }}"
        - variables:
            _ed_meta0: "{{ (_ed_tvars0.get('meta') or {}).get('value') if _ed_tvars0.get('meta') is mapping else none }}"
            _ed_vi0: >-
              {%- set e = _ed_tvars0.get('AI_Cabinet_VolumeInfo') -%}
              {%- set v = e.get('value') if e is mapping else none -%}
              {{- ((v | from_json(none)) if v is string else v) or {} -}}
            _ed_did_mount: "{{ states(_ed_tgt) == 'online_unmounted' }}"
            _ed_did_stamp: "{{ _ed_pick.kind == 'free' }}"
        - if: "{{ _ed_did_mount }}"
          then:
          - event: set_variable_legacy
            event_data:
              key: meta
              value: "{{ {'mounted': true} }}"
              volume_entity: "{{- _ed_tgt -}}"
              set_timestamp: true
          - wait_template: "{{ states(_ed_tgt) == 'online_mounted' }}"
            timeout: "00:00:10"
            continue_on_timeout: true
          - if: "{{ not wait.completed }}"
            then:
            - variables:
                _ed_fail: {step: mount, reason: target_mount_not_confirmed, key: ''}
      # Step 2: stamp the slot as an expansion of the source: VolumeInfo is
      # merged, so its id, flags and acls stay. From here it answers with the
      # source's ACL.
      - if: "{{ result is not defined and _ed_fail is not defined and _ed_did_stamp }}"
        then:
        - event: set_variable_legacy
          event_data:
            key: AI_Cabinet_VolumeInfo
            value: "{{ dict(_ed_vi0, cabinet_class='expansion', hosted_by=_ed_src) }}"
            volume_entity: "{{- _ed_tgt -}}"
            set_timestamp: true
        - wait_template: >-
            {%- set e = (state_attr(_ed_tgt, 'variables') or {}).get('AI_Cabinet_VolumeInfo') -%}
            {%- set v = e.get('value') if e is mapping else none -%}
            {%- set v = (v | from_json(none)) if v is string else v -%}
            {{ v is mapping and v.get('cabinet_class') == 'expansion' and v.get('hosted_by') == _ed_src
               and v.get('id') == _ed_vi0.get('id') }}
          timeout: "00:00:15"
          continue_on_timeout: true
        - if: "{{ not wait.completed }}"
          then:
          - variables:
              _ed_fail: {step: stamp, reason: expansion_stamp_not_confirmed, key: ''}
      # Step 3: copy each key with its whole envelope.
      - if: "{{ result is not defined and _ed_fail is not defined }}"
        then:
        - repeat:
            for_each: "{{ _ed_plan.move }}"
            sequence:
            - if: "{{ _ed_fail is not defined }}"
              then:
              - variables:
                  _ed_e: "{{ _ed_env[repeat.item] }}"
              - event: set_variable_legacy
                event_data:
                  key: "{{- repeat.item -}}"
                  value: "{{ _ed_e.get('value') }}"
                  meta: "{{ _ed_e.get('meta') if _ed_e.get('meta') is mapping else {} }}"
                  acl: "{{ _ed_e.get('acl') if _ed_e.get('acl') is mapping else '' }}"
                  volume_entity: "{{- _ed_tgt -}}"
                  set_timestamp: true
              - wait_template: >-
                  {%- set t = (state_attr(_ed_tgt, 'variables') or {}).get(repeat.item) -%}
                  {{ t is mapping and (t.get('value') | tojson) == (_ed_e.get('value') | tojson) }}
                timeout: "00:00:15"
                continue_on_timeout: true
              - if: "{{ not wait.completed }}"
                then:
                - variables:
                    _ed_fail: "{{ {'step': 'copy', 'reason': 'copy_to_target_not_confirmed', 'key': repeat.item} }}"
      # Step 4: verify every copy is the source envelope, byte for byte.
      - if: "{{ result is not defined and _ed_fail is not defined }}"
        then:
        - variables:
            _ed_diff: >-
              {%- set tv = state_attr(_ed_tgt, 'variables') or {} -%}
              {%- set ns = namespace(bad=[]) -%}
              {%- for k in _ed_plan.move -%}
                {%- set s = _ed_env[k] -%}
                {%- set t = tv.get(k) if tv.get(k) is mapping else {} -%}
                {%- if (t.get('value') | tojson) != (s.get('value') | tojson)
                       or ((t.get('meta') or {}) | tojson) != ((s.get('meta') or {}) | tojson)
                       or ((t.get('acl') or {}) | tojson) != ((s.get('acl') or {}) | tojson) -%}
                  {%- set ns.bad = ns.bad + [k] -%}
                {%- endif -%}
              {%- endfor -%}
              {{- ns.bad -}}
        - if: "{{ _ed_diff | count > 0 }}"
          then:
          - variables:
              _ed_fail: "{{ {'step': 'verify', 'reason': 'copy_differs_from_source', 'key': _ed_diff | join(', ')} }}"
      # Step 5: cut over. Each source key becomes a pointer; the envelope's
      # meta and acl stay on it.
      - if: "{{ result is not defined and _ed_fail is not defined }}"
        then:
        - variables:
            _ed_ptr: "{{ {'mount_point': true, 'target_entity_id': _ed_tgt, 'target_guid': _ed_vi0.get('id', '')} }}"
        - repeat:
            for_each: "{{ _ed_plan.move }}"
            sequence:
            - if: "{{ _ed_fail is not defined }}"
              then:
              - event: set_variable_legacy
                event_data:
                  key: "{{- repeat.item -}}"
                  value: "{{ _ed_ptr }}"
                  volume_entity: "{{- _ed_src -}}"
                  set_timestamp: true
              - wait_template: >-
                  {%- set e = (state_attr(_ed_src, 'variables') or {}).get(repeat.item) -%}
                  {%- set v = e.get('value') if e is mapping else none -%}
                  {%- set v = (v | from_json(none)) if v is string else v -%}
                  {{ v is mapping and v.get('mount_point', false) == true and v.get('target_entity_id') == _ed_tgt }}
                timeout: "00:00:15"
                continue_on_timeout: true
              - if: "{{ not wait.completed }}"
                then:
                - variables:
                    _ed_fail: "{{ {'step': 'cutover', 'reason': 'mount_pointer_not_confirmed_in_source', 'key': repeat.item} }}"
      # Step 6: prove each key read through the source lands on the copy.
      - if: "{{ result is not defined and _ed_fail is not defined }}"
        then:
        - variables:
            _ed_unres: >-
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
              {%- set ns = namespace(bad=[]) -%}
              {%- for k in _ed_plan.move -%}
                {#- The chain's first hop lands on the copy (a softlink in the
                    tree is chased on from there). -#}
                {%- set r = CABS.fc_resolve(_ed_src, k) | from_json -%}
                {%- set ent = (state_attr(_ed_tgt, 'variables') or {}).get(k) -%}
                {%- set ent = ent if ent is mapping else {} -%}
                {%- if (r.visited | count) < 2 or r.visited[1] != _ed_tgt ~ '/' ~ k or (ent.get('value') | tojson) != (_ed_env[k].get('value') | tojson) -%}
                  {%- set ns.bad = ns.bad + [k] -%}
                {%- endif -%}
              {%- endfor -%}
              {{- ns.bad -}}
        - if: "{{ _ed_unres | count > 0 }}"
          then:
          - variables:
              _ed_fail: "{{ {'step': 'resolve', 'reason': 'read_through_source_not_proven', 'key': _ed_unres | join(', ')} }}"
      # Any failure: every source key gets its value back (meta and acl never
      # left it), the copies go, and the slot's VolumeInfo and meta are restored.
      - if: "{{ result is not defined and _ed_fail is defined }}"
        then:
        - repeat:
            for_each: "{{ _ed_plan.move }}"
            sequence:
            - if: >-
                {%- set e = (state_attr(_ed_src, 'variables') or {}).get(repeat.item) -%}
                {{ e is not mapping or (e.get('value') | tojson) != (_ed_env[repeat.item].get('value') | tojson) }}
              then:
              - event: set_variable_legacy
                event_data:
                  key: "{{- repeat.item -}}"
                  value: "{{ _ed_env[repeat.item].get('value') }}"
                  volume_entity: "{{- _ed_src -}}"
                  set_timestamp: true
            - event: remove_variable_legacy
              event_data:
                key: "{{- repeat.item -}}"
                volume_entity: "{{- _ed_tgt -}}"
        - if: "{{ _ed_did_stamp }}"
          then:
          - event: set_variable_legacy
            event_data:
              key: AI_Cabinet_VolumeInfo
              value: "{{ _ed_vi0 }}"
              volume_entity: "{{- _ed_tgt -}}"
              set_timestamp: true
        - if: "{{ _ed_did_mount }}"
          then:
          - event: set_variable_legacy
            event_data:
              key: meta
              value: "{{ _ed_meta0 if _ed_meta0 is mapping else {'mounted': false} }}"
              volume_entity: "{{- _ed_tgt -}}"
              set_timestamp: true
        - wait_template: >-
            {%- set sv = state_attr(_ed_src, 'variables') or {} -%}
            {%- set tv = state_attr(_ed_tgt, 'variables') or {} -%}
            {%- set ns = namespace(ok=true) -%}
            {%- for k in _ed_plan.move -%}
              {%- set e = sv.get(k) -%}
              {%- if not (e is mapping and (e.get('value') | tojson) == (_ed_env[k].get('value') | tojson)) or k in tv -%}
                {%- set ns.ok = false -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.ok }}
          timeout: "00:00:20"
          continue_on_timeout: true
        - variables:
            result:
              status: error
              tool: zen_sutra_filecabinet
              action: expand_drawer
              step_failed: "{{ _ed_fail.step }}"
              reason: "{{ _ed_fail.reason }}"
              failed_key: "{{ _ed_fail.key }}"
              rolled_back: "{{ wait.completed }}"
              source_cabinet: "{{ _ed_src }}"
              target_cabinet: "{{ _ed_tgt }}"
              source_drawer: "{{ _ed_key }}"
              message: >-
                {{ 'Nothing moved: every source key holds its original value again and the slot is as it was.'
                   if wait.completed else
                   'Rollback not confirmed in time: check ' ~ _ed_src ~ ' and ' ~ _ed_tgt ~ ' before retrying.' }}
              caller_token: "{{ _caller_token }}"
      # Success.
      - if: "{{ result is not defined }}"
        then:
        - variables:
            _ed_tgt_post_pct: "{{ (((state_attr(_ed_tgt, 'variables') or {}) | tojson | length) * 100 / (_ed_max | int)) | round(1) }}"
            _ed_src_now_pct: "{{ (((state_attr(_ed_src, 'variables') or {}) | tojson | length) * 100 / (_ed_max | int)) | round(1) }}"
        - event: zen_event
          event_data:
            event:
              timestamp: "{{ now().isoformat() }}"
              component: zen_sutra_filecabinet
              severity: info
              kind: drawer_expanded
              summary: "{{ _ed_src }}/{{ _ed_key }}: {{ _ed_plan.move | count }} key(s) moved to {{ _ed_tgt }}"
              metadata:
                source_cabinet: "{{ _ed_src }}"
                target_cabinet: "{{ _ed_tgt }}"
                moved_keys: "{{ _ed_plan.move }}"
                bytes_moved: "{{ _ed_move_bytes }}"
              content_redacted: true
            trace:
              caller_token: "{{ _caller_token }}"
        - variables:
            result:
              status: success
              tool: zen_sutra_filecabinet
              action: expand_drawer
              source_cabinet: "{{ _ed_src }}"
              source_drawer: "{{ _ed_key }}"
              target_cabinet: "{{ _ed_tgt }}"
              target_chosen: "{{ _ed_pick.chosen }}"
              target_was: "{{ _ed_pick.kind }}"
              target_mounted: "{{ _ed_did_mount }}"
              moved_keys: "{{ _ed_plan.move }}"
              kept_pointers: "{{ _ed_plan.stay }}"
              bytes_moved: "{{ _ed_move_bytes }}"
              space_before_pct: "{{ _ed_src_pre_pct }}"
              space_after_pct: "{{ _ed_src_now_pct }}"
              target_pct: "{{ _ed_tgt_post_pct }}"
              acl: "{{ _ed_tgt }} answers with the ACL of {{ _ed_src }}; each drawer keeps its own acl"
              mount_installed: true
              round_trip_verified: true
              caller_token: "{{ _caller_token }}"
    - if:
      - condition: template
        value_template: "{{ result is not defined and _action == 'collapse_drawer' }}"
      then:
      # collapse_drawer: undoes expand_drawer. The drawer and its whole tree
      # (path, path/...) come back from the expansion into the source unchanged
      # (value, meta, acl) over their pointers, are verified, and the slot is
      # torn down: its copies removed, the expansion stamp taken off VolumeInfo
      # (nothing else in it changes) and the slot dismounted. Until the copy
      # back verifies nothing in the expansion is touched; a failure there puts
      # the pointers back.
      - variables:
          _cd_src: "{{ source_cabinet | default('', true) | string | trim }}"
          _cd_key: "{{ _key }}"
          _cd_max: 131072
          _cd_headroom: 2048
      - variables:
          _cd_svars: "{{ (state_attr(_cd_src, 'variables') if _cd_src != '' else none) or {} }}"
          _cd_root: >-
            {%- set e = ((state_attr(_cd_src, 'variables') if _cd_src != '' else none) or {}).get(_cd_key) -%}
            {%- set v = e.get('value') if e is mapping else none -%}
            {%- set v = (v | from_json(none)) if v is string else v -%}
            {{- v if v is mapping else {} -}}
      - variables:
          _cd_tgt: "{{ (_cd_root.get('target_entity_id') or '') | string if _cd_root.get('mount_point', false) == true and _cd_root.get('fc_args') is none else '' }}"
      - variables:
          _cd_tslot: >-
            {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
            {{- (CABS.cabinet_slot_status(_cd_tgt) | from_json({})) if _cd_tgt != '' else {} -}}
          _cd_tvars: "{{ (state_attr(_cd_tgt, 'variables') if _cd_tgt != '' else none) or {} }}"
      # The tree as the expansion holds it, and what the source holds under it.
      - variables:
          _cd_keys: >-
            {%- set _pre = _cd_key ~ '/' -%}
            {%- set ns = namespace(l=[]) -%}
            {%- for k in _cd_tvars.keys() | list | sort if k.startswith(_pre) -%}{%- set ns.l = ns.l + [k] -%}{%- endfor -%}
            {#- Children first, the root last: until the root is back, a child
                with no pointer of its own still resolves through it. -#}
            {{- ns.l + ([_cd_key] if _cd_key in _cd_tvars else []) -}}
          _cd_conflicts: >-
            {%- set _pre = _cd_key ~ '/' -%}
            {%- set ns = namespace(l=[]) -%}
            {%- for k, e in _cd_svars.items() if k == _cd_key or k.startswith(_pre) -%}
              {%- set v = e.get('value') if e is mapping else none -%}
              {%- set v = (v | from_json(none)) if v is string else v -%}
              {%- if not (v is mapping and v.get('mount_point', false) == true and v.get('target_entity_id') == _cd_tgt) -%}{%- set ns.l = ns.l + [k] -%}{%- endif -%}
            {%- endfor -%}
            {{- ns.l -}}
      - variables:
          _cd_other: >-
            {%- set _pre = _cd_key ~ '/' -%}
            {%- set ns = namespace(l=[]) -%}
            {%- for k in _cd_tslot.get('user_drawers', []) if k != _cd_key and not k.startswith(_pre) -%}{%- set ns.l = ns.l + [k] -%}{%- endfor -%}
            {{- ns.l -}}
          _cd_selflinks: >-
            {%- set ns = namespace(l=[]) -%}
            {%- for k in _cd_keys -%}
              {%- set v = _cd_tvars[k].get('value') if _cd_tvars[k] is mapping else none -%}
              {%- set v = (v | from_json(none)) if v is string else v -%}
              {%- if v is mapping and v.get('mount_point', false) == true and v.get('fc_args') is none and (v.get('target_entity_id') or '') == _cd_src -%}{%- set ns.l = ns.l + [k] -%}{%- endif -%}
            {%- endfor -%}
            {{- ns.l -}}
          _cd_back_bytes: >-
            {%- set ns = namespace(d={}) -%}
            {%- for k in _cd_keys -%}{%- set ns.d = dict(ns.d, **{k: _cd_tvars[k]}) -%}{%- endfor -%}
            {{- ns.d | tojson | length -}}
          _cd_ptr_bytes: >-
            {%- set _pre = _cd_key ~ '/' -%}
            {%- set ns = namespace(d={}) -%}
            {%- for k, e in _cd_svars.items() if k == _cd_key or k.startswith(_pre) -%}{%- set ns.d = dict(ns.d, **{k: e}) -%}{%- endfor -%}
            {{- ns.d | tojson | length -}}
      - variables:
          _cd_err: >-
            {%- if _cd_src == '' or _cd_key == '' -%}source_cabinet and path are required
            {%- elif not (state_attr(_cd_src, 'variables') is mapping) -%}{{ _cd_src }} is not a ready cabinet
            {%- elif _cd_key not in _cd_svars -%}{{ _cd_key }} is not in {{ _cd_src }}
            {%- elif _cd_tgt == '' or _cd_tslot.get('cabinet_class') != 'expansion' or _cd_tslot.get('hosted_by') != _cd_src -%}{{ _cd_key }} is not expanded (not a mount pointer into an expansion {{ _cd_src }} hosts); nothing to collapse
            {%- elif _cd_key not in _cd_tvars -%}{{ _cd_tgt }} does not hold {{ _cd_key }}; nothing to bring back (fix the pointer by hand)
            {%- elif _cd_conflicts | count > 0 -%}{{ _cd_conflicts | join(', ') }} in {{ _cd_src }} is not a pointer into {{ _cd_tgt }}; resolve that before collapsing
            {%- elif _cd_other | count > 0 -%}{{ _cd_tgt }} also holds {{ _cd_other | join(', ') }}; one expansion holds one drawer
            {%- elif _cd_selflinks | count > 0 -%}{{ _cd_selflinks | join(', ') }} in {{ _cd_tgt }} is a softlink into {{ _cd_src }}; back in {{ _cd_src }} it would point at its own cabinet. Remove or repoint it first
            {%- elif (_cd_svars | tojson | length) - (_cd_ptr_bytes | int) + (_cd_back_bytes | int) + 64 * (_cd_keys | count) + (_cd_headroom | int) > (_cd_max | int) -%}insufficient_source_space
            {%- endif -%}
      - if: "{{ _cd_err | trim != '' }}"
        then:
        - variables:
            result:
              status: "{{ 'abort' if _cd_err | trim == 'insufficient_source_space' else 'error' }}"
              tool: zen_sutra_filecabinet
              action: collapse_drawer
              step_failed: validate
              reason: "{{ _cd_err | trim if _cd_err | trim == 'insufficient_source_space' else 'guarded: ' ~ (_cd_err | trim) }}"
              source_cabinet: "{{ _cd_src }}"
              source_drawer: "{{ _cd_key }}"
              target_cabinet: "{{ _cd_tgt }}"
              caller_token: "{{ _caller_token }}"
      # Step 1: copy back over each pointer (or into the source for a child the
      # expansion gained after the move).
      - if: "{{ result is not defined }}"
        then:
        - variables:
            _cd_ptrs: >-
              {%- set ns = namespace(d={}) -%}
              {%- for k in _cd_keys if k in _cd_svars -%}{%- set ns.d = dict(ns.d, **{k: _cd_svars[k].get('value')}) -%}{%- endfor -%}
              {{- ns.d -}}
        - repeat:
            for_each: "{{ _cd_keys }}"
            sequence:
            - if: "{{ _cd_fail is not defined }}"
              then:
              - variables:
                  _cd_e: "{{ _cd_tvars[repeat.item] }}"
              - event: set_variable_legacy
                event_data:
                  key: "{{- repeat.item -}}"
                  value: "{{ _cd_e.get('value') }}"
                  meta: "{{ _cd_e.get('meta') if _cd_e.get('meta') is mapping else {} }}"
                  acl: "{{ _cd_e.get('acl') if _cd_e.get('acl') is mapping else '' }}"
                  volume_entity: "{{- _cd_src -}}"
                  set_timestamp: true
              - wait_template: >-
                  {%- set s = (state_attr(_cd_src, 'variables') or {}).get(repeat.item) -%}
                  {{ s is mapping and (s.get('value') | tojson) == (_cd_e.get('value') | tojson) }}
                timeout: "00:00:15"
                continue_on_timeout: true
              - if: "{{ not wait.completed }}"
                then:
                - variables:
                    _cd_fail: "{{ {'step': 'copy_back', 'reason': 'copy_to_source_not_confirmed', 'key': repeat.item} }}"
      # Step 2: verify each source drawer is the expansion's, byte for byte.
      - if: "{{ result is not defined and _cd_fail is not defined }}"
        then:
        - variables:
            _cd_diff: >-
              {%- set sv = state_attr(_cd_src, 'variables') or {} -%}
              {%- set ns = namespace(bad=[]) -%}
              {%- for k in _cd_keys -%}
                {%- set t = _cd_tvars[k] -%}
                {%- set s = sv.get(k) if sv.get(k) is mapping else {} -%}
                {%- if (s.get('value') | tojson) != (t.get('value') | tojson)
                       or ((s.get('meta') or {}) | tojson) != ((t.get('meta') or {}) | tojson)
                       or ((s.get('acl') or {}) | tojson) != ((t.get('acl') or {}) | tojson) -%}
                  {%- set ns.bad = ns.bad + [k] -%}
                {%- endif -%}
              {%- endfor -%}
              {{- ns.bad -}}
        - if: "{{ _cd_diff | count > 0 }}"
          then:
          - variables:
              _cd_fail: "{{ {'step': 'verify', 'reason': 'source_differs_from_expansion', 'key': _cd_diff | join(', ')} }}"
      # A failure before teardown: the pointers go back, a key that had none is
      # removed again. The expansion was never touched.
      - if: "{{ result is not defined and _cd_fail is defined }}"
        then:
        - repeat:
            for_each: "{{ _cd_keys }}"
            sequence:
            - if: "{{ repeat.item in _cd_ptrs }}"
              then:
              - event: set_variable_legacy
                event_data:
                  key: "{{- repeat.item -}}"
                  value: "{{ _cd_ptrs[repeat.item] }}"
                  volume_entity: "{{- _cd_src -}}"
                  set_timestamp: true
              else:
              - event: remove_variable_legacy
                event_data:
                  key: "{{- repeat.item -}}"
                  volume_entity: "{{- _cd_src -}}"
        - wait_template: >-
            {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
            {%- set ns = namespace(ok=true) -%}
            {%- for k in _cd_keys -%}
              {%- set r = CABS.fc_resolve(_cd_src, k) | from_json -%}
              {%- if (r.visited | count) < 2 or r.visited[1] != _cd_tgt ~ '/' ~ k -%}{%- set ns.ok = false -%}{%- endif -%}
            {%- endfor -%}
            {{ ns.ok }}
          timeout: "00:00:20"
          continue_on_timeout: true
        - variables:
            result:
              status: error
              tool: zen_sutra_filecabinet
              action: collapse_drawer
              step_failed: "{{ _cd_fail.step }}"
              reason: "{{ _cd_fail.reason }}"
              failed_key: "{{ _cd_fail.key }}"
              rolled_back: "{{ wait.completed }}"
              source_cabinet: "{{ _cd_src }}"
              target_cabinet: "{{ _cd_tgt }}"
              source_drawer: "{{ _cd_key }}"
              message: >-
                {{ 'Nothing changed: the drawer still lives in ' ~ _cd_tgt ~ ' behind its pointers.'
                   if wait.completed else
                   'Rollback not confirmed in time: check ' ~ _cd_src ~ ' before retrying (the expansion copy is intact).' }}
              caller_token: "{{ _caller_token }}"
      # Step 3: teardown. The source holds the tree now; the slot goes back to
      # free: copies removed, expansion stamp off VolumeInfo, dismounted.
      # Labels the expansion holds itself for the tree fold into the source's
      # index first.
      - if: "{{ result is not defined }}"
        then:
        - variables:
            _cd_lx: >-
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
              {%- set ti = CABS.label_index(_cd_tgt) | from_json({}) -%}
              {%- set tl = CABS.label_index_keys(ti, _cd_keys) | from_json({}) -%}
              {%- set si = CABS.label_index(_cd_src) | from_json({}) -%}
              {{- {'n': tl | count, 'src': CABS.label_index_apply(si, [], tl) | from_json({}), 'tgt': CABS.label_index_apply(ti, _cd_keys, {}) | from_json({})} -}}
        - if: "{{ _cd_lx.n > 0 }}"
          then:
          - event: set_variable_legacy
            event_data:
              key: _label_index
              value: "{{- _cd_lx.src | tojson -}}"
              volume_entity: "{{- _cd_src -}}"
              set_timestamp: true
          - event: set_variable_legacy
            event_data:
              key: _label_index
              value: "{{- _cd_lx.tgt | tojson -}}"
              volume_entity: "{{- _cd_tgt -}}"
              set_timestamp: true
          - wait_template: >-
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
              {{ (CABS.label_index(_cd_src) | from_json({})) == _cd_lx.src and (CABS.label_index(_cd_tgt) | from_json({})) == _cd_lx.tgt }}
            timeout: "00:00:15"
            continue_on_timeout: true
        - repeat:
            for_each: "{{ _cd_keys }}"
            sequence:
            - event: remove_variable_legacy
              event_data:
                key: "{{- repeat.item -}}"
                volume_entity: "{{- _cd_tgt -}}"
        - variables:
            _cd_vi: >-
              {%- set e = (state_attr(_cd_tgt, 'variables') or {}).get('AI_Cabinet_VolumeInfo') -%}
              {%- set v = e.get('value') if e is mapping else none -%}
              {{- ((v | from_json(none)) if v is string else v) or {} -}}
        - event: set_variable_legacy
          event_data:
            key: AI_Cabinet_VolumeInfo
            value: "{{ dict(_cd_vi.items() | rejectattr('0', 'in', ['cabinet_class', 'hosted_by'])) }}"
            volume_entity: "{{- _cd_tgt -}}"
            set_timestamp: true
        - if: "{{ states(_cd_tgt) == 'online_mounted' }}"
          then:
          - event: set_variable_legacy
            event_data:
              key: meta
              value: "{{ {'mounted': false} }}"
              volume_entity: "{{- _cd_tgt -}}"
              set_timestamp: true
        - wait_template: >-
            {%- set tv = state_attr(_cd_tgt, 'variables') or {} -%}
            {%- set e = tv.get('AI_Cabinet_VolumeInfo') -%}
            {%- set v = e.get('value') if e is mapping else none -%}
            {%- set v = ((v | from_json(none)) if v is string else v) or {} -%}
            {{ (_cd_keys | select('in', tv.keys() | list) | list | count) == 0 and 'cabinet_class' not in v
               and v.get('id') == _cd_vi.get('id') and states(_cd_tgt) == 'online_unmounted' }}
          timeout: "00:00:20"
          continue_on_timeout: true
        - variables:
            _cd_torn: "{{ wait.completed }}"
        - event: zen_event
          event_data:
            event:
              timestamp: "{{ now().isoformat() }}"
              component: zen_sutra_filecabinet
              severity: "{{ 'info' if _cd_torn else 'warning' }}"
              kind: drawer_collapsed
              summary: "{{ _cd_src }}/{{ _cd_key }}: {{ _cd_keys | count }} key(s) back from {{ _cd_tgt }}{{ '' if _cd_torn else ' (slot teardown not confirmed)' }}"
              metadata:
                source_cabinet: "{{ _cd_src }}"
                target_cabinet: "{{ _cd_tgt }}"
                keys: "{{ _cd_keys }}"
              content_redacted: true
            trace:
              caller_token: "{{ _caller_token }}"
        - variables:
            result:
              status: "{{ 'success' if _cd_torn else 'warning' }}"
              tool: zen_sutra_filecabinet
              action: collapse_drawer
              source_cabinet: "{{ _cd_src }}"
              source_drawer: "{{ _cd_key }}"
              target_cabinet: "{{ _cd_tgt }}"
              keys_back: "{{ _cd_keys }}"
              bytes_back: "{{ _cd_back_bytes }}"
              verified: true
              slot_torn_down: "{{ _cd_torn }}"
              labels_folded_back: "{{ _cd_lx.n }}"
              message: >-
                {{ 'The drawer and its tree live in ' ~ _cd_src ~ ' again; ' ~ _cd_tgt ~ ' is a free slot.'
                   if _cd_torn else
                   'The drawer and its tree live in ' ~ _cd_src ~ ' again (verified), but ' ~ _cd_tgt ~ ' did not confirm its teardown: check expansion_sitrep.' }}
              caller_token: "{{ _caller_token }}"
    - if: "{{ result is not defined }}"
      then:
      - variables:
          result:
            status: error
            tool: zen_sutra_filecabinet
            action: "{{ _action }}"
            message: >-
              Unknown action: {{ _action }}.
              Use get|create|update|upsert|delete|list|move|copy|search|relabel|expand_drawer|collapse_drawer|
              manifest|clone|set_mount|remove_mount|mount_cabinet|dismount_cabinet|set_cabinet_ro|
              stacks_by_anchor|register|unregister|inspect|health (no volume = system status)|audit.

    # -- Single exit. Converted branches and the gate fall through to here.
    # The ACL gate's audit rides on the answer when it would deny or ask.
    - if: "{{ _g is mapping and (_g.would_deny or _g.would_ack) and result is mapping }}"
      then:
        - variables:
            result: "{{ dict(result, **{'acl_audit': _g}) }}"
    - stop: filecabinet sutra done
      response_variable: result


  ##############################################################################
  # DOJOTOOL — MCP-facing surface. Expose this to MCP.
  ##############################################################################
  zen_dojotools_filecabinet:
    alias: Zen DojoTools FileCabinet
    description: >
      Knowledge surface — stack=cabinet (always available) and stack=wiki (optional, requires
      zen_sutra_wikijs). Cross-stack copy/move via destination_stack.
      Cabception: drawer keys with / form nested trees — get returns subdrawers+has_children,
      move/delete/copy cascade to all children, child writes verified before delete.
      Use mode=help for field reference.
    mode: parallel
    icon: mdi:bookshelf
    fields:
      mode:
        description: "The action: list|get|create|update|upsert|delete|move|copy|relabel|search|manifest|clone|set_mount|remove_mount|mount_cabinet|dismount_cabinet|set_cabinet_ro|stacks_by_anchor|register|unregister|inspect|health|audit|expansion_sitrep|fleet|help|expand_drawer|collapse_drawer|weave|weave_preview|weave_save|tool_manifest. Aliases: read=get, scan=list. Use write_mode= (merge|replace) for how a write lands."
        required: false
        selector:
          select:
            options:
            - list
            - get
            - create
            - update
            - upsert
            - delete
            - move
            - copy
            - relabel
            - search
            - manifest
            - clone
            - set_mount
            - remove_mount
            - mount_cabinet
            - dismount_cabinet
            - set_cabinet_ro
            - stacks_by_anchor
            - register
            - unregister
            - inspect
            - health
            - audit
            - help
            - expand_drawer
            - collapse_drawer
            - fleet
            - expansion_sitrep
            - weave
            - weave_preview
            - weave_save
            - tool_manifest
            - read
            - scan
      write_mode:
        description: "How a write lands: merge (deep-merge into the existing value) or replace (the value replaces it). Omit for the action's default (update replaces, the rest merge)."
        required: false
        selector:
          select:
            options:
            - merge
            - replace
      action_type:
        description: "Legacy alias for mode (kept so existing callers work). New code uses mode. list|get|create|update|upsert|delete|move|copy|relabel|search|manifest|clone|set_mount|remove_mount|mount_cabinet|dismount_cabinet|set_cabinet_ro|stacks_by_anchor|register|unregister|inspect|health|audit|expansion_sitrep|fleet|help|expand_drawer|collapse_drawer|weave|weave_preview|weave_save. Aliases: read=get, write=upsert, scan=list"
        required: false
        selector:
          select:
            options:
            - list
            - get
            - create
            - update
            - upsert
            - delete
            - move
            - copy
            - relabel
            - search
            - manifest
            - clone
            - set_mount
            - remove_mount
            - mount_cabinet
            - dismount_cabinet
            - set_cabinet_ro
            - stacks_by_anchor
            - register
            - unregister
            - inspect
            - health
            - audit
            - help
            - expand_drawer
            - collapse_drawer
            - fleet
            - expansion_sitrep
            - read
            - write
            - scan
            - tool_manifest
            - weave
            - weave_preview
            - weave_save
        default: list
      stack:
        description: "Backend: cabinet (FileCabinet, default) | wiki (WikiJS) | all (read-only aggregate)."
        required: false
        selector:
          select:
            options:
            - cabinet
            - wiki
            - all
        default: cabinet
        name: Stack
      volume_entity_id:
        description: Cabinet sensor entity ID. Required when stack=cabinet.
        required: false
        selector:
          text:
        name: Volume Entity ID
      path:
        description: "Page path (wiki) or drawer key (cabinet)."
        required: false
        selector:
          text:
        name: Path
      title:
        description: Document title. Required for create/upsert.
        required: false
        selector:
          text:
        name: Title
      description:
        description: Short document description.
        required: false
        selector:
          text:
        name: Description
      value:
        description: Drawer value (cabinet) or page content (wiki). Required for create/update/upsert. FC handles serialization — do NOT tojson before passing.
        required: false
        selector:
          text:
            multiline: true
        name: Value
      merge:
        description: "Force merge (deep-merge into existing value) regardless of action. Omit for action default."
        required: false
        selector:
          boolean:
        name: Merge
      tags:
        description: "Tags/labels: wiki: page tags (comma-sep or JSON array). cabinet: HA label names (comma-sep). Applied to entity on write."
        required: false
        selector:
          text:
        name: Tags
      destination_path:
        description: Target path/key for move or copy.
        required: false
        selector:
          text:
        name: Destination Path
      destination_stack:
        description: "Target stack for cross-stack copy/move: wiki or cabinet. Omit for same-stack."
        required: false
        selector:
          select:
            options:
            - wiki
            - cabinet
        name: Destination Stack
      destination_volume_entity_id:
        description: "Target cabinet entity for cross-stack copy/move to cabinet destination."
        required: false
        selector:
          text:
        name: Destination Volume
      expires_after:
        description: "ISO 8601 datetime after which this drawer may be GC'd (cabinet only)."
        required: false
        selector:
          text:
        name: Expires After
      no_autoexpire:
        description: "If true, GC will not expire this drawer (cabinet only)."
        required: false
        selector:
          boolean:
        name: No Auto-expire
      no_autorecycle:
        description: "If true, GC will not recycle this drawer (cabinet only)."
        required: false
        selector:
          boolean:
        name: No Auto-recycle
      force_action:
        description: "create: overwrite existing key instead of erroring (cabinet only)."
        required: false
        selector:
          boolean:
        name: Force Action
      create_label:
        description: "If true, auto-create HA labels in tags that are not in registry (cabinet only)."
        required: false
        selector:
          boolean:
        name: Create Label
      destination_cabinet:
        description: "Target cabinet entity_id for clone (cabinet only)."
        required: false
        selector:
          text:
        name: Destination Cabinet
      target_guid:
        description: "Cabinet GUID to mount. Required for set_mount (cabinet only)."
        required: false
        selector:
          text:
        name: Target GUID
      show_hidden_volumes:
        description: "manifest: include hidden/system volumes (cabinet only)."
        required: false
        selector:
          boolean:
        name: Show Hidden Volumes
      show_stacks:
        description: "manifest: include online_unmounted cabinets (cabinet only)."
        required: false
        selector:
          boolean:
        name: Show Stacks
      transfer_guid:
        description: "clone: GUID travels to destination (Highlander mode, requires force_action)."
        required: false
        selector:
          boolean:
        name: Transfer GUID
      fc_args:
        description: "set_mount LIVE DRAWER: JSON object — {tool: 'zen_dojotools_*', params: {...}}. tool MUST be a zen_* script name (not a lens verb like 'read'). FC executes the tool inline on every read; caller sees live result as the drawer value. Omit target_guid when using fc_args."
        required: false
        selector:
          text:
        name: FC Args
      path_prefix:
        description: Filter list results to entries whose path starts with this prefix.
        required: false
        selector:
          text:
        name: Path Prefix
      query:
        description: "wiki: full-text search. cabinet: label + text scan (query matches content/title/key)."
        required: false
        selector:
          text:
        name: Search Query
      anchor_type:
        description: "Lens anchor type: label|concept|area_id|zone|person"
        required: false
        selector:
          select:
            options:
            - label
            - concept
            - area_id
            - zone
            - person
            - product
            - ticket
            - document
            - company
            - household
        default: label
        name: Anchor Type
      anchor_ids:
        description: Comma-separated or JSON array of anchor IDs for stacks_by_anchor.
        required: false
        selector:
          text:
        name: Anchor IDs
      source_cabinet:
        description: "expand_drawer / collapse_drawer: the cabinet that holds the drawer. path = the drawer; its children (path/...) move with it. collapse_drawer brings an expanded drawer back and frees its slot."
        required: false
        selector:
          text:
        name: Source Cabinet
      target_cabinet:
        description: "expand_drawer: expansion slot to move into. Omit to pick a free slot. One expansion holds one drawer and its children; a drawer expands once."
        required: false
        selector:
          text:
        name: Target Cabinet
      space_threshold:
        description: "expand_drawer: abort if source stays at or above this % after migration (default 85)."
        required: false
        selector:
          number:
            min: 50
            max: 99
            mode: box
        name: Space Threshold
      weave_drawer:
        description: "weave/weave_preview: drawer name containing the tapestry definition. Resolves from volume_entity_id cabinet if provided, else searches all Zen Cabinet entities."
        required: false
        selector:
          text:
        name: Weave Drawer
      weave_label:
        description: "weave/weave_preview: HA label — collect all zen_tapestry drawers with this label and merge their sources lists."
        required: false
        selector:
          text:
        name: Weave Label
      weave_sources:
        description: "weave/weave_preview/weave_save: inline tapestry definition JSON. Schema: {sources:[{key,cabinet,drawer,mask?,rename?}|{key,weave,cabinet?}], description?}. Call weave_preview first before weave_save."
        required: false
        selector:
          text:
        name: Weave Sources
      weave_max_depth:
        description: "weave/weave_preview: max nesting depth for weave sources (1-3, default 2)."
        required: false
        selector:
          number:
            min: 1
            max: 3
            mode: box
        name: Weave Max Depth
      preview_token:
        description: "weave_save: token returned by weave_preview — required to commit a tapestry definition. Token is valid for the clock minute it was issued."
        required: false
        selector:
          text:
        name: Preview Token
      caller_token:
        required: false
        selector:
          text:
        name: Caller Token

    sequence:

    - variables:
        _action_type: >-
          {%- set _m = mode | default('', true) | string | trim | lower -%}
          {%- set _a = (_m if _m not in ['merge', 'replace'] and _m != '' else action_type | default('list', true)) | string | trim | lower -%}
          {%- if _a == 'read' -%}get
          {%- elif _a == 'write' -%}upsert
          {%- elif _a == 'scan' -%}list
          {%- else -%}{{ _a }}{%- endif -%}
        # How a write lands: write= (merge|replace); the legacy mode: merge|replace
        # still counts. '' = the action's default.
        _write_mode: >-
          {%- set _w = write_mode | default('', true) | string | trim | lower -%}
          {%- set _m = mode | default('', true) | string | trim | lower -%}
          {{ _w if _w in ['merge', 'replace'] else (_m if _m in ['merge', 'replace'] else '') }}
        # No mode, no action_type, no volume and no path = roots (this tool's
        # own map). A call with any of those runs exactly as before.
        _fc_bare: >-
          {{ (mode | default('', true) | string | trim) == ''
             and (action_type | default('', true) | string | trim) == ''
             and not (volume_entity_id | default('', true)) and not (path | default('', true))
             and not (key | default('', true)) }}
        _stack: "{{ stack | default('cabinet') | string | trim | lower }}"
        _caller_token: "{{ caller_token | default('') }}"
        _dest_stack: "{{ destination_stack | default('', true) | string | trim | lower }}"
        _dest_vol: "{{ destination_volume_entity_id | default('', true) | string | trim }}"
        _vol: >-
          {%- set _vi = volume_entity_id | default('', true) -%}
          {%- if _vi is sequence and _vi is not string -%}{{ _vi | first | string | trim }}
          {%- else -%}{{ _vi | string | trim }}{%- endif -%}
        _path: >-
          {%- set _p = path | default('', true) | string | trim -%}
          {{ _p if _p != '' else (key | default('', true) | string | trim) }}
        _content: >-
          {%- set _craw = value | default('') -%}
          {%- if _craw is mapping or (_craw is sequence and _craw is not string) -%}
            {{- _craw -}}
          {%- elif (_craw | string | trim)[:1] in ['{', '['] or (_craw | string | trim) in ['true', 'false', 'null'] -%}
            {%- set _cparsed = _craw | from_json(none) -%}
            {{- _cparsed if _cparsed is not none else _craw -}}
          {%- else -%}
            {{- _craw | string | trim -}}
          {%- endif -%}
        _title: >-
          {%- set _t = title | default('', true) | string | trim -%}
          {{ _t }}
        _tags: >-
          {%- set _tg = tags | default('', true) | string | trim -%}
          {{ _tg if _tg != '' else (label_input | default('', true) | string | trim) }}

    # ── Init-state write guard ──────────────────────────────────────────────
    # mount_cabinet/dismount_cabinet already refuse on a target cabinet in
    # 'init' state ("VolumeInfo not yet loaded") — but that check was never
    # extended to the actual data write path (create/update/upsert/delete/
    # move/copy/relabel/weave_save), which is what real callers use. Found
    # live: the scheduler's own heartbeat write landed in a cabinet still
    # sitting in 'init' state with zero guard anywhere blocking it. A
    # cabinet in 'init' has no GUID/identity and per cabinetadmin's own
    # contract "cannot hold user data" — writing into one anyway produces
    # exactly the residue that later confuses cabinetadmin's own virgin-vs-
    # broken classifier. Centralized here rather than patched at each of the
    # 20+ individual write call-sites in this file.
    - variables:
        _fc_write_ops:
          - create
          - update
          - upsert
          - delete
          - move
          - copy
          - relabel
          - weave_save
        _fc_target_state: "{{ states(_vol) if _vol != '' else '' }}"
        _fc_init_write_blocked: >-
          {{ _stack == 'cabinet' and _action_type in _fc_write_ops and _fc_target_state == 'init' }}
    - if: "{{ _fc_init_write_blocked }}"
      then:
      - variables:
          result:
            status: error
            action_type: "{{ _action_type }}"
            message: >-
              Write refused — '{{ _vol }}' is in 'init' state (no VolumeInfo
              loaded yet, not a real cabinet). Same guard mount_cabinet and
              dismount_cabinet already use, now applied to data writes too.
              Run zen_admintools_cabinetadmin mode=init to provision this
              cabinet before writing to it.
            caller_token: "{{ _caller_token }}"

    # Single exit: every step below runs only while result is not defined;
    # the one stop at the bottom returns it.

    # --- tool_manifest ---
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ result is not defined and (_action_type == 'tool_manifest' or _fc_bare) }}"
        sequence:
        - action: script.zen_sutra_wikijs
          response_variable: _wiki_manifest
          continue_on_error: true
          data:
            mode: tool_manifest
            caller_token: "{{ _caller_token }}"
        - variables:
            result: >-
              {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
              {{- MF.tool_manifest(
                tool='zen_dojotools_filecabinet',
                display_name='FileCabinet — Knowledge Stack Surface',
                tier='dojotools',
                version='6.35.0',
                health={'configured': true, 'status': 'ok', 'notes': []},
                required_labels=['dojotools'],
                optional_labels=['cabinet', 'wiki_js', 'knowledge', 'documents'],
                consumes=['label', 'person', 'area_id', 'zone', 'concept'],
                returns=['cabinet_evidence', 'wiki_evidence'],
                failure_policy='soft',
                content_policy='redacted_by_default',
                risk_class='read_redacted',
                modes={'knowledge': 'manifest', 'what': 'list', 'read': 'get', 'find': 'search',
                       'help': 'help', 'copy': 'copy', 'health': 'health', 'list': 'list',
                       'lookup': 'stacks_by_anchor', 'weave_preview': 'weave_preview',
                       'weave_save': 'weave_save', 'manifest': 'tool_manifest'},
                children=[{
                  'tool': 'zen_sutra_wikijs',
                  'stack': 'wiki',
                  'manifest': _wiki_manifest if _wiki_manifest is mapping else {},
                  'manifest_via': {'tool': 'zen_dojotools_filecabinet', 'action_type': 'tool_manifest'}
                }],
                icon='mdi:file-cabinet',
                color='blue-grey',
                stripe=3,
                impact='soft',
                mcp_exposed=true,

                caller_token=_caller_token
              ) | from_json -}}
        - if: "{{ _fc_bare }}"
          then:
            - variables:
                result: >-
                  {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
                  {{- MF.tool_roots_reply(result, about='Everything written down: cabinets (root = manifest), their drawers, and the wiki stack. Reads are open; writes and admin actions are in mode=help.') | from_json -}}

    # --- help ---
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ result is not defined and _action_type == 'help' }}"
        sequence:
        - variables:
            help_json: |-
              {{-
                {
                  "tool": "zen_dojotools_filecabinet",
                  "version": "6.35.0",
                  "intent": "Stack-agnostic knowledge surface. stack=cabinet is always available (built-in FileCabinet key-value store). stack=wiki is optional — requires zen_sutra_wikijs installed and registered; returns stack_not_available if missing. HA Labels are the shared tag/anchor system across both stacks.",
                  "you_should_use_this_tool_when": [
                    "You need to read, write, or manage key-value knowledge drawers in a FileCabinet volume (stack=cabinet — always available).",
