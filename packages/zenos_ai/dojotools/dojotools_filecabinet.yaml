###############################################################################
# ZenOS-AI DojoTools: FileCabinet
# Version: 4.7.1
#
# Scripts:
#   zen_dojotools_filecabinet — Cabinet volume K/V storage engine (v4.7.x)
#
# MIGRATED FROM: scripts.yaml (2026-03-06)
#
# FG-14 FIXED: boolean: {} selectors stripped on migration
###############################################################################

script:
  zen_dojotools_filecabinet:
    mode: queued
    max: 2
    sequence:
    # --------------------------------------------------------------
    # Always normalize User/AI inputs so we don't have to react JIT
    # --------------------------------------------------------------
    - variables:
        action_type: "{{- action_type | default('help') -}}"
        #volume_entity_id: "{{- volume_entity_id | default('') -}}"
        #key: "{{- key | default('') | trim -}}"
        #value: "{{- value | default('') -}}"
        set_timestamp: "{{- set_timestamp | default(true) -}}"
        label_input: "{{- label_input | default('') -}}"
        expires_after: "{{- expires_after | default('') | trim -}}"
        no_autoexpire: "{{- no_autoexpire | default(false) -}}"
        no_autorecycle: "{{- no_autorecycle | default(false) -}}"
        acl: "{{- acl | default('') -}}"
        description: "{{- description | default('') | truncate(255, True, '', 0) | trim -}}"
        label_targets: "{{- label_targets | default('') -}}"
        show_hidden_volumes: "{{- show_hidden_volumes | default(false) -}}"
        show_stacks:  "{{- show_stacks | default(false) -}}"
        #start:
        #end:
        #filter_domain:
        #filter_state_operand:
        #filter_op:
        force_action: "{{- force_action | default(false) -}}"
        destination_cabinet: "{{- destination_cabinet | default('') -}}"
        destination_drawer: "{{- destination_drawer | default('') | slugify -}}"
        transfer_guid: "{{- transfer_guid | default(false) -}}"
        target_guid: "{{- target_guid | default('') | trim -}}"
        caller_token: "{{- caller_token | default('') -}}"
        create_label: "{{- create_label | default(false) -}}"

    - variables:
        routing_status: init
        normalized_label_targets: "{{- [] -}}"
        resolved_label_drawers: "{{- [] -}}"
        resolved_label_entities: "{{- [] -}}"
        label_input_list: "{{- [] -}}"
        read_volume: "{{- {} -}}"
        volume_entity: >
          {%- set _veid = volume_entity_id | default('') -%}
          {%- if _veid is string -%}
            {{- _veid -}}
          {%- elif _veid is iterable and not _veid is string and _veid | length > 0 -%}
            {{- _veid[0] -}}
          {%- else -%}
            {{- '' -}}
          {%- endif -%}
        raw_key: "{{- key | default('') | trim -}}"
        key: >-
          {%- set _rk = key | default('') | trim -%}
          {%- if _rk.startswith('_') -%}
            _{{- _rk[1:] | slugify -}}
          {%- else -%}
            {{- _rk | slugify -}}
          {%- endif -%}
        raw_value: "{{- value | default('') -}}"
        protect_write: "{{- protect_write | default(true) -}}"
        now_iso: "{{- now().isoformat() -}}"
        drawer_acl: >
          {%- set _acl = acl | default('') -%}
          {%- if _acl is mapping -%}
           {{- _acl -}}
          {%- elif _acl is string and _acl | trim | length > 0 -%}
            {{- _acl | from_json | default({}) -}}
          {%- else -%}
            {}
          {%- endif -%}
        is_create: "{{- action_type == 'create' -}}"
        is_update: "{{- action_type == 'update' -}}"
        is_read: "{{- action_type == 'read' -}}"
        is_delete: "{{- action_type == 'delete' -}}"
        is_help: "{{- action_type == 'help' -}}"
        is_clone: "{{- action_type == 'clone' -}}"
        is_relabel: "{{- action_type == 'relabel' -}}"
        is_write_action: "{{- action_type in ['create','update','delete','move','copy','mount_cabinet','dismount_cabinet','relabel']}}"
        #initial_volume_raw: "{{- state_attr(volume_entity, 'variables') | default({}, true) -}}"
        #initial_volume: >
        #  {%- if initial_volume_raw is mapping -%}
        #  {{- initial_volume_raw -}}
        #  {%- else -%}
        #  {}
        #  {%- endif -%}
        initial_volume: >-
          {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
          {{- CABS.cabinet_variables(volume_entity) | from_json() -}}
        key_exists_initial: "{{- (key != '') and (key in initial_volume) -}}"
        #prewrite_volume_raw: "{{- state_attr(volume_entity, 'variables') | default({}, true) -}}"
        #prewrite_volume: >
        #  {%- if prewrite_volume_raw is mapping -%}
        #    {{- prewrite_volume_raw -}}
        #  {%- else -%}
        #    {}
        #  {%- endif -%}
        prewrite_volume: >
          {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
          {{- CABS.cabinet_variables(volume_entity) | from_json() -}}
        prettify_json_on_fail: "{{- prettify_json_on_fail | default(false) -}}"
        label_raw: "{{- label_targets | default('') -}}"
        resolved_label_targets: >
          {{
            label_raw
            | replace('\\n', ',')
            | regex_findall('[^,]+')
            | map('trim')
            | map('lower')
            | list
          -}}
        label_index_map: "{{- (read_volume.get('_label_index', {}).get('value', {}) if read_volume is mapping else {})}}"
        resolved_drawers: >
          {%- set targets = resolved_label_targets if resolved_label_targets is sequence else [] -%}
          {%- set idx = label_index_map if label_index_map is mapping else {} -%}
          
          {%- set ns = namespace(accum=[]) -%}
          {#- Build one merged list of drawers without using append() -#}
          {%- for t in targets -%}
            {%- set arr = idx.get(t, []) -%}
          
            {#- Normalize arr into clean list -#}
            {%- if arr is mapping -%}
              {%- set arr = arr.keys() | list -%}
            {%- elif arr is iterable and not arr is string -%}
              {%- set arr = arr | list -%}
            {%- elif arr not in [none, ''] -%}
              {%- set arr = [arr] -%}
            {%- else -%}
              {%- set arr = [] -%}
            {%- endif -%}
            {#- Functional merge — no append — safe union -#}
            {%- set ns.accum = (ns.accum + arr) | unique | list -%}
          {%- endfor -%}
          {%- if ns.accum | length == 0 -%}
            {{- [] -}}
          {%- else -%}
            {{- ns.accum -}}
          {%- endif -%}
        is_label_mode: "{{- (resolved_label_targets | length > 0) -}}"
        current_label_index_raw: >
          {%- set idx = initial_volume.get('_label_index', {}) -%}
          {%- set val = idx.get('value') -%}
          {%- if val is mapping -%}
            {{- val -}}
          {%- elif val is sequence -%}
            {%- set mapped = {} -%}
            {%- for label in val if label is string -%}
              {%- set mapped = mapped | combine({ label: [] }) -%}
            {%- endfor -%}
            {{- mapped -}}
          {%- else -%}
            {} 
          {%- endif -%}
        current_label_index: >
          {%- import 'zenos_ai/library_index.jinja' as library_index -%}
          {{- library_index.normalize_label_index(current_label_index_raw) -}}
        parsed_value: >
          {%- set _v = raw_value | trim -%}
          {%- set error = none -%}
          {%- set parsed = none -%}
          {%- if raw_value is mapping or (raw_value is iterable and raw_value is not string and raw_value is not none) -%}
            {%- set parsed = raw_value -%}
          {%- elif _v == '' -%}
            {%- set error = "Write failed: Input value is blank." -%}
          {%- else -%}
            {%- set temp = _v -%}
            {%- set try_json = false -%}
            {%- if temp[:1] in ['{', '['] or temp in ['true', 'false', 'null'] -%}
              {%- set try_json = true -%}
            {%- elif temp | regex_match('^-?\d+$') -%}
              {%- set try_json = true -%}
            {%- endif -%}
            {%- if try_json -%}
              {# from_json(none) — returns none on invalid JSON instead of raising ValueError.
                 Without the default, embedded markdown/newlines in a JSON blob crash the
                 entire scheduler run (incident: 2026-03-23 zen_system ha_start deadlock). #}
              {%- set parsed = temp | from_json(none) -%}
              {%- if parsed is none -%}
                {%- set error = "Write failed: Input value is not valid JSON. Please reformat using proper JSON syntax (e.g., escaped quotes, valid brackets)." -%}
              {%- endif -%}
            {%- else -%}
              {%- set js = temp
                | replace('\\\\', '\\\\\\\\')
                | replace('\"', '\\\\\"')
                | replace('\\r', '\\\\r')
                | replace('\\n', '\\\\n')
                | replace('\\t', '\\\\t')
              -%}
              {%- set wrapped = '"' ~ js ~ '"' -%}
              {%- set parsed = wrapped | from_json(none) -%}
              {%- if parsed is none -%}
                {%- set error = "Write failed: Could not coerce string to JSON—possibly invalid input or encoding." -%}
              {%- endif -%}
            {%- endif -%}
          {%- endif -%}
          {%- if error -%}
            {{- error -}}
          {%- else -%}
            {{- parsed -}}
          {%- endif -%}
        parsed_entity_labels: >
          {%- if is_create or is_update or is_relabel -%}
            {%- if label_input is string -%}
              {%- set s = label_input | replace('\\n', ',') -%}
              {{
                (
                  s
                  | regex_findall('[^,]+')
                  | map('trim')
                  | map('lower')
                  | map('slugify')
                  | select('string')
                  | sort
                  | list
                )
              -}}
            {%- elif label_input is sequence -%}
              {{
                (
                  label_input
                  | map('trim')
                  | map('lower')
                  | map('slugify')
                  | select('string')
                  | sort
                  | list
                )
              -}}
            {%- else -%}
              []
            {%- endif -%}
          {%- else -%}
            []
          {%- endif -%}
        all_system_labels: >
          {%- if is_create or is_update or is_relabel -%}
            {{- labels() | map('lower') | sort | list -}}
          {%- else -%}
            []
          {%- endif -%}
        dropped_labels: "{{- parsed_entity_labels | reject('in', all_system_labels) | sort | list -}}"
        accepted_entity_labels: "{{- parsed_entity_labels | select('in', all_system_labels) | sort | list -}}"
        updated_label_index: >
          {%- if (is_create | default(false)) or (is_update | default(false)) or (is_relabel | default(false)) -%}
            {%- set vol = (prewrite_volume if prewrite_volume is mapping else initial_volume) -%}
            {%- set current_index = vol.get('_label_index', {}).get('value', {}) -%}
            {%- set current = current_index if current_index is mapping else {} -%}
          
            {%- set drawer_name = key | lower | slugify -%}
             {%- set new_labels = (
                    parsed_entity_labels
                    | map('string')
                    | map('lower')
                    | map('slugify')
                    | list)
              -%}
          
            {%- set acc = namespace(val = dict(current)) -%}
            {%- for label in new_labels -%}
              {%- set entry = acc.val.get(label) -%}
              {%- set existing = (
                                    entry if entry is iterable and not entry is string 
                                    else [entry] if entry not in [None, ''] 
                                    else []
                                  )
              -%}
              {%- set acc.val = acc.val | combine({
                    label: (existing + [drawer_name]) | unique | list
                  })
              -%}
            {%- endfor -%}
          
            {{- acc.val -}}
          {%- else -%}
            {}
          {%- endif -%}
        extended_label_index: >
          {%- set raw = initial_volume.get('_label_index', {}).get('value') -%}
          {%- set index = {} -%}
          {%- if raw is mapping -%}
            {#- Full nested label index (expected case) -#}
            {%- for _label, drawers in raw.items() -%}
              {%- set label = _label | lower | slugify -%}
          
              {#- Normalize drawers to a clean list -#}
              {%- if drawers is mapping -%}
                {#- A dict of drawers → copy keys only, normalized -#}
                {%- set clean = drawers.keys() | list -%}
          
              {%- elif drawers is iterable and not drawers is string -%}
                {# Could be list, tuple, generator → normalize -#}
                {%- set clean = drawers | list -%}
          
              {%- else -%}
                {#- Single string or other scalar -#}
                  {%- set clean = [drawers] -%}
              {%- endif -%}
          
              {#- Force all drawers to become lowercase-slugified names -#}
              {%- set clean = clean
                              | map('string')
                              | map('lower')
                              | map('slugify')
                              | list
              -%}
          
              {#- Remove duplicates, ensure real list -#}
              {%- set clean = clean | unique | list -%}
          
              {%- set index = index | combine({ label: clean }) -%}
            {%- endfor -%}
          
          {%- elif raw is iterable and not raw is string -%}
            {#- Legacy format: ['label1','label2'] -#}
            {%- for _label in raw -%}
              {%- set label = _label | lower | slugify -%}
              {%- set index = index | combine({ label: ['_unknown_drawer'] }) -%}
            {%- endfor -%}
          
          {%- else -%}
            {#- Fallback: rebuild from drawers' meta -#}
            {%- for drawer, val in initial_volume.items() -%}
              {%- set labels = [] -%}
              {%- if val is mapping and 'meta' in val and val.meta is mapping -%}
                {%- set labels = val.meta.get('entity_labels', []) -%}
              {%- elif val is mapping and 'entity_labels' in val -%}
                {%- set labels = val.get('entity_labels', []) -%}
              {%- endif -%}
          
              {%- for _label in labels -%}
                {%- set label = _label | lower | slugify -%}
                {%- set existing = index.get(label, []) -%}
                {%- set index = index | combine({
                      label: (existing + [drawer]) 
                             | map('string')
                             | map('lower')
                             | map('slugify')
                             | unique
                             | list
                    })
                -%}
          
              {%- endfor -%}
            {%- endfor -%}
          {%- endif -%}
          {{- index -}}
        new_entry: >
          {%- if is_create or is_update -%}
            {%- set base = {'value': parsed_value} -%}
            {%- set with_ts = base | combine({'timestamp': now_iso}) if set_timestamp else base -%}
            {%- set meta = {} -%}
            {%- if accepted_entity_labels | length > 0 -%}
              {%- set meta = meta | combine({'entity_labels': accepted_entity_labels | list}) -%}
            {%- endif -%}
            {%- if expires_after | trim != '' -%}
              {%- set meta = meta | combine({'expires_after': expires_after | trim}) -%}
            {%- endif -%}
            {%- if no_autoexpire -%}
              {%- set meta = meta | combine({'no_autoexpire': true}) -%}
            {%- endif -%}
            {%- if no_autorecycle -%}
              {%- set meta = meta | combine({'no_autorecycle': true}) -%}
            {%- endif -%}
            {%- if 'zen_scroll' in accepted_entity_labels -%}
              {%- set meta = meta | combine({'ro': true}) -%}
            {%- endif -%}
            {%- if drawer_acl is mapping and drawer_acl | length > 0 -%}
              {%- set meta = meta | combine({'acl': drawer_acl}) -%}
            {%- endif -%}
            {%- if description | trim | length > 0 -%}
              {%- set meta = meta | combine({'description': description | trim}) -%}
            {%- endif -%}
            {%- set full = with_ts | combine({'meta': meta}) if meta | length > 0 else with_ts -%}
            {{- full -}}
          {%- else -%}
            {}
          {%- endif -%}
        new_volume: >
          {%- if is_create or is_update -%}
            {%- set vol = state_attr(volume_entity, 'variables') | default(initial_volume, true) -%}
            {{- vol | combine({
              (key): new_entry,
              '_label_index': {
                'value': updated_label_index,
                'timestamp': now_iso
              }
            }, recursive=true) -}}
          {%- else -%}
            {{- initial_volume -}}
          {%- endif -%}
        initial_norm: '{{- initial_volume -}}
  
          '
        current_norm: "{{- ( state_attr(volume_entity, 'variables') | default({}, true) )}}"
        volume_unmodified: "{{- (not protect_write) or (initial_norm == current_norm) -}}"
        cabinet_volumeinfo: >
          {%- set info = initial_volume.get('AI_Cabinet_VolumeInfo', {}) -%} 
          {%- if info is mapping and info.get('value') is mapping -%}
            {{- info.get('value') -}}
          {%- else -%}
            {}
          {%- endif -%}
        zen_relationships: >
          {%- set z = initial_volume.get('_zen_relationships', {}) -%}
          {%- if z is mapping and z.get('value') is mapping -%}
            {{- z.get('value') -}}
          {%- else -%}
          {}
          {%- endif -%}
        existing_drawer_is_ro: >
          {%- set _e = initial_volume.get(key, {}) if initial_volume is mapping else {} -%}
          {%- set _m = _e.get('meta', {}) if _e is mapping else {} -%}
          {%- set _m = _m if _m is mapping else (_m | from_json if _m is string else {}) -%}
          {{- _m.get('ro', false) == true if _m is mapping else false -}}
        cabinet_ro_blocked: >
          {%- set _vi_raw = initial_volume.get('AI_Cabinet_VolumeInfo', {}) if initial_volume is mapping else {} -%}
          {%- set _vi_raw = _vi_raw if _vi_raw is mapping else {} -%}
          {%- set _vi = _vi_raw.get('value', _vi_raw) if _vi_raw is mapping else {} -%}
          {%- set _vi = _vi if _vi is mapping else (_vi | from_json if _vi is string else {}) -%}
          {{- _vi.get('flags', {}).get('cabinet_ro', false) == true -}}
        # Slugified names of system drawers that FileCabinet must never write.
        # Keys starting with _ are caught by the _ guard above; these catch
        # non-_ variants that slugify to the same system drawer name.
        # meta: mount state — managed by mount_cabinet/dismount_cabinet only.
        # label_index: slugified _label_index — internal label registry.
        # zen_relationships: slugified _zen_relationships — relationship graph.
        # ai_cabinet_volumeinfo: VolumeInfo — cabinetadmin_factory / set_variable_legacy only.
        protected_system_drawers:
          - ai_cabinet_volumeinfo
          - label_index
          - zen_relationships
          - meta
        is_protected_drawer: "{{- is_write_action and key in protected_system_drawers -}}"
        is_create_new: "{{- action_type == 'create' and key != '' and not key_exists_initial -}}"
        is_force_update_new: "{{- action_type == 'update' and key != '' and not key_exists_initial and force_action -}}"
        is_force_create_over_existing: "{{- action_type == 'create' and key != '' and key_exists_initial and force_action -}}"
        is_create_path: "{{- is_create_new or is_force_update_new or is_force_create_over_existing -}}"
        is_update_path: "{{- is_update and key_exists_initial -}}"
        json_parse_failed: >
          {{- (parsed_value is string and parsed_value.startswith('Write failed')) 
              or (parsed_value is mapping and (parsed_value.get('error','') | string).startswith('Write failed'))
          -}}
        health_blocked: >
          {{- (state_attr(volume_entity, 'health') or {}).get('status') == 'error'
              or (state_attr(volume_entity, 'health') or {}).get('guid_mismatch', false)
              or not (state_attr(volume_entity, 'health') or {}).get('writeable', true)
              or ( (state_attr(volume_entity, 'health') or {}).get('storage_warning', false) and not force_action)
          -}}
    - choose:
      - conditions:
        - alias: Error - Fatal JSON Parsing
          condition: template
          value_template: >
            {{
              (action_type not in ['manifest', 'read', 'delete', 'move', 'copy', 'clone', 'set_mount', 'remove_mount', 'mount_cabinet', 'dismount_cabinet', 'set_cabinet_ro', 'relabel', 'help' ])
                and (
                      (parsed_value is string and parsed_value.startswith('Write failed'))
                      or
                      (parsed_value is mapping and (parsed_value.get('error','') | string).startswith('Write failed') )
                    )
            -}}
        sequence:
        - action: system_log.write
          data:
            level: error
            message: 'ZenDojoTools FileCabinet: FATAL — JSON parse error, write aborted.
              Key: {{ key }} | Volume: {{ volume_entity }} Parsed Value: {{ parsed_value }} Raw Value: ```\n{{ raw_value }}\n```
  
              '
        - variables:
            fatal_response:
              status: error
              failure: json_parse_error
              volume_entity: "{{ volume_entity }}"
              key: "{{ key }}"
              message: >-
                Write aborted — value could not be parsed as JSON.
                Common causes: markdown fencing (```), unescaped quotes, bare
                colons, or multiline text without proper quoting.
                Fix: pass value as a plain quoted string, a YAML dict, or a
                JSON object. Avoid markdown code blocks in FC values.
              raw_preview: "{{ raw_value | truncate(120, true, '...') }}"
        - stop: JSON Parse Failure
          response_variable: fatal_response
    # ── create_label: auto-create unknown HA labels before write ──────────────
    - if: "{{- create_label | bool and is_write_action and dropped_labels | length > 0 -}}"
      then:
        - repeat:
            for_each: "{{- dropped_labels -}}"
            sequence:
              - action: homeassistant.create_label
                data:
                  name: "{{- repeat.item -}}"
    - choose:
      # ── WIRE-LEVEL LOCKOUT: SYSTEM CABINET ────────────────────────────────────
      # sensor.zenos_system_cabinet is ALWAYS read-only to this tool. No exceptions.
      # No force_action bypass. No caller_token override.
      #
      # WHY: The system cabinet holds the AI prompt substrate (Purpose, Directives,
      # Cortex). If the agent could write here, it could rewrite its own prompt.
      # This is the wire-level enforcement of that constraint — the tool physically
      # cannot write to syscab regardless of caller, mode, or flags.
      #
      # Legitimate syscab writes (prompt_loader, Flynn bootstrap, cabinetadmin)
      # fire set_variable_zenos_system_cabinet directly — they never touch this tool.
      # ──────────────────────────────────────────────────────────────────────────
      - conditions:
        - alias: Error - Syscab hard RO (wire-level lockout)
          condition: template
          value_template: "{{- is_write_action and volume_entity == 'sensor.zenos_system_cabinet' -}}"
        sequence:
        - variables:
            final_response:
              status: error
              failure: syscab_write_blocked
              message: >-
                Write blocked: sensor.zenos_system_cabinet is read-only to FileCabinet.
                This cabinet holds the AI prompt substrate and cannot be written by
                any agent-accessible tool. Use the designated admin scripts for
                system cabinet operations.
              volume_entity: "{{- volume_entity -}}"
              key: "{{- key -}}"
        - stop: Syscab write blocked
          response_variable: final_response
      - conditions:
        - alias: Error - Reserved key (leading underscore)
          condition: template
          value_template: "{{- is_write_action and raw_key.startswith('_') and not force_action -}}"
        sequence:
        - variables:
            final_response:
              status: error
              failure: reserved_key
              message: >-
                Write blocked: key '{{- raw_key -}}' starts with '_'.
                System-reserved keys require force_action: true to write via FileCabinet.
                Use the appropriate admin tool or pass force_action: true for system drawer operations.
              key_raw: "{{- raw_key -}}"
              key_slugified: "{{- key -}}"
              volume_entity: "{{- volume_entity -}}"
        - stop: Reserved key
          response_variable: final_response
      - conditions:
        - alias: Error - Protected system drawer
          condition: template
          value_template: "{{- is_protected_drawer -}}"
        sequence:
        - variables:
            final_response:
              status: error
              failure: protected_drawer
              message: >-
                Write blocked: key '{{- raw_key -}}' slugifies to '{{- key -}}'
                which is a protected system drawer. FileCabinet cannot write
                system drawers ({{- protected_system_drawers | join(', ') -}}).
                Use the appropriate admin tool for this operation.
              key_raw: "{{- raw_key -}}"
              key_slugified: "{{- key -}}"
              volume_entity: "{{- volume_entity -}}"
              protected_drawers: "{{- protected_system_drawers -}}"
        - stop: Protected system drawer
          response_variable: final_response
      - conditions:
        - alias: Error - Cabinet is read-only
          condition: template
          value_template: "{{- is_write_action and cabinet_ro_blocked -}}"
        sequence:
        - variables:
            final_response:
              status: error
              failure: cabinet_ro
              message: >-
                Write blocked: cabinet '{{- volume_entity -}}' is marked read-only
                (flags.cabinet_ro: true). Writes must go through the designated
                admin tool for this cabinet.
              volume_entity: "{{- volume_entity -}}"
              key: "{{- key -}}"
        - stop: Cabinet read-only
          response_variable: final_response
      - conditions:
        - condition: template
          value_template: "{{- action_type in ['create','update','delete','move','copy','set_mount','remove_mount','mount_cabinet','dismount_cabinet'] -}}"
          alias: Is a 'write' action
        sequence:
        - variables:
            vol_health: "{{- state_attr(volume_entity, 'health') or {} -}}"
            h_status: "{{- vol_health.get('status','') -}}"
            h_mismatch: "{{- vol_health.get('guid_mismatch', false) -}}"
            h_writeable: "{{- vol_health.get('writeable', true) -}}"
            h_storage_warning: "{{- vol_health.get('storage_warning', false) -}}"
            health_blocked: >
              {{
                (h_status == 'error')
                or h_mismatch
                or (not h_writeable)
                or (h_storage_warning and not force_action)
              -}}
        - choose:
          - conditions:
            - condition: template
              value_template: "{{- health_blocked -}}"
              alias: 'Error: Not Healthy'
            sequence:
            - variables:
                final_response:
                  status: error
                  message: 'Write blocked: Volume not healthy.'
                  health_snapshot:
                    status: "{{- h_status -}}"
                    mismatch: "{{- h_mismatch -}}"
                    writeable: "{{- h_writeable -}}"
                    storage_warning: "{{- h_storage_warning -}}"
                    force_action: "{{- force_action -}}"
            - stop: Health-blocked write
              response_variable: final_response
    - choose:
      - conditions:
        - condition: template
          value_template: "{{- action_type in ['create','update'] and (key == '' or raw_value == '') -}}"
          alias: Error - Create Update, Drawer (Key) or Value Missing
        sequence:
        - variables:
            final_response:
              status: error
              message: For '{{- action_type -}}', you must supply both 'key' and 'value'.
        - stop: Missing key/value
          response_variable: final_response
      - conditions:
        - condition: template
          value_template: "{{- action_type == 'delete' and key == '' -}}"
          alias: Error - Delete, Drawer (Key) Missing
        sequence:
        - variables:
            final_response:
              status: error
              message: For 'delete', you must supply a 'key'.
        - stop: Missing key for delete
          response_variable: final_response
      - conditions:
        - alias: Error - Update, Drawer (Key) does not exist
          condition: template
          value_template: "{{- action_type == 'update' and not key_exists_initial and not force_action -}}"
        sequence:
        - variables:
            final_response:
              status: error
              message: "Cannot update: key '{{- key -}}' does not exist."
        - stop: Key not found
          response_variable: final_response
      - conditions:
        - alias: Error — Create, Drawer Exists and Not Force_Action
          condition: template
          value_template: >
            {{
              action_type == 'create'
              and key != ''
              and key_exists_initial
              and not force_action
            -}}
        sequence:
        - variables:
            final_response:
              status: error
              message: "Cannot create: key '{{- key -}}' exists. Use Update or retry with override approval using force_action. (Will be logged)"
        - stop: Drawer Exists and not force_action
          response_variable: final_response
      - conditions:
        - condition: template
          value_template: "{{- action_type in ['create', 'update', 'delete'] and key != '' and key_exists_initial and existing_drawer_is_ro -}}"
          alias: Error - Read-only drawer (zen_scroll)
        sequence:
        - variables:
            final_response:
              status: error
              message: "Write blocked: drawer '{{- key -}}' is read-only (zen_scroll). Use CabinetAdmin set_ro_flag to clear before writing."
        - stop: Read-only drawer
          response_variable: final_response
      - conditions:
        - condition: template
          value_template: "{{- action_type == 'set_mount' and (key == '' or target_guid == '') -}}"
          alias: Error - set_mount missing key or target_guid
        sequence:
        - variables:
            final_response:
              status: error
              message: For 'set_mount', you must supply both 'key' (drawer name) and
                'target_guid'.
        - stop: Missing key or target_guid for set_mount
          response_variable: final_response
      - conditions:
        - condition: template
          value_template: "{{- action_type == 'remove_mount' and key == '' -}}"
          alias: Error - remove_mount missing key
        sequence:
        - variables:
            final_response:
              status: error
              message: For 'remove_mount', you must supply a 'key' (drawer name).
        - stop: Missing key for remove_mount
          response_variable: final_response
      - conditions:
        - condition: template
          value_template: "{{- action_type == 'help' -}}"
          alias: Help
        sequence:
        - variables:
            final_response:
              status: info
              message: Zen DojoTools File Cabinet Help
              actions:
                manifest: Use MANIFEST function for the Volume Manifest (list all volumes)
                  Errors may silently return Manifest - if you unexpectedly got a manifest...
                  Yeah...
                create: Optional set_timestamp, protect_write, label_input Requires
                  'drawer' and 'value'; drawer must exist; must write WHOLE drawer'
                  at once. AS AN OVERWRITE. 'value' must be valid JSON; will attempt
                  to parse, error returned on failure.
                read: >
                  manifest: >-
                    Set 'volume_entity' to '*'
                    Same as Volume Manifest (all volumes)
                  volume: >-
                    directory: >-
                      Set 'volume_entity' to [your_volume_entity]
                      Set 'drawer' to any of [None, '', '*']
                      to obtain volume directory
                    content: >-
                      Set 'volume_entity' to [your_volume_entity]
                      set 'drawer' to [your_valid_drawer]
                   special: >-
                      Use label_targets for filtered read.
                update: Requires 'drawer' and 'value'; drawer must exist; must write
                  WHOLE drawer' at once. 'value' must be valid JSON; will attempt to
                  parse.  With force_action, will silently create drawer. error returned
                  on failure.
                delete: Requires 'drawer'
                copy: "Requires (source) 'drawer' only the first in list will be accepted,
                  all others will be dropped\n  'destination drawer', 'destination cabinet'\noptional
                  'force_action' Attempts to move a drawer from source ot dest.  Must
                  be valid Cabinet, Source and Dest drawer. Use force_action to overwrite
                  destination drawer with action."
                move: Requirements and usage identical to Copy,  will also attempt a
                  delete source after copy.
                set_cabinet_ro: "Stamps cabinet_ro: true in AI_Cabinet_VolumeInfo.flags for the
                  target cabinet. Idempotent. BLOCKED on sensor.zenos_system_cabinet (syscab is
                  hard RO — use zen_admintools_prompt_loader or zen_admintools_cabinetadmin_factory
                  to update syscab). No force_action bypass for syscab. Requires volume_entity."
                relabel: "Updates _label_index only for the specified drawer — does NOT touch the
                  drawer value. No value param required (ignored if supplied). Use when you need to
                  update entity labels on a drawer without re-serializing or re-validating its value.
                  Bypasses JSON parse check. Drawer must exist; returns drawer_not_found if absent."
                help: Returns help
              system_cabinet_note: "sensor.zenos_system_cabinet is HARD READ-ONLY to FileCabinet.
                This is a wire-level lockout — no exceptions, no force_action bypass. It holds the
                AI prompt substrate (Purpose, Directives, Cortex). To update prompt primitives use
                zen_admintools_prompt_loader. For VolumeInfo repair use
                zen_admintools_cabinetadmin_factory. This prevents the AI from rewriting its own
                directives."
              about:
                version: 4.5.x
                branch: beta
                manual: "summary: >\n  The Zen DojoTools File Cabinet is your go-to
                  tool for managing data in volumes.\n  Volumes are digital storage
                  units made of drawers that hold organized chunks\n  of information.
                  When using the controller, first locate the correct volume and\n  drawer
                  for your data task. Always maintain data integrity by reading current
                  data\n  before updating to avoid accidental overwrites. Volumes and
                  drawers come\n  with labels, indexes, and metadata applied at the
                  drawer level—these are key\n  to making data searchable and easily
                  manageable. Think of drawers as\n  entities in a many-to-many relationship
                  with labels, allowing flexible,\n  powerful querying across multiple
                  volumes.\n  Decide between read-optimized and write-optimized data
                  structures based on\n  usage.\n  Read-optimized for stable, quickly
                  accessible nested data via dotted\n  notation, and write-optimized
                  for isolated, rapidly changing contexts like\n  game states. Ownership
                  and role distinctions segment data access across\n  multiple volumes,
                  keeping data secure and context-appropriate.\n  The volume index performs
                  table scans across all accessible volumes to\n  find labels and locate
                  data, highlighting the critical importance of\n  thorough labeling.
                  Metadata at the drawer level enriches data with context,\n  enhancing
                  findability and decision-making.\n  With this approach, data stays
                  organized, accessible, and scalable, enabling\n  efficient management
                  for all smart home or AI project needs. Use this guide\n  to keep
                  your data game solid, agile, and Friday-approved.    \nauthor: person.friday
                  date: 6/8/2025"
              defaults:
                protect_write: true
        - stop: Returning help
          response_variable: final_response
      - conditions:
        - alias: Read by Label
          condition: template
          value_template: "{{- (label_targets | default('') | trim | length > 0) -}}"
        sequence:
        - variables:
            always_hide_drawers:
            - AI_Cabinet_VolumeInfo
            read_volume: "{{- state_attr(volume_entity, 'variables') | default({}, true) -}}"
            vol: "{{- read_volume if read_volume is mapping else {} -}}"
            normalized_label_targets: >
              {{
                (
                  (label_targets | default('') | replace('\\n', ','))
                  | regex_findall('[^,]+')
                  | map('trim')
                  | map('lower')
                  | map('slugify')
                  | list  )
              -}}
            label_index: >
              {{- ( vol.get('_label_index', {}).get('value', {}) if vol is mapping else {} ) -}}
            resolved_label_drawers: >
              {#- Step 1: detect bad python literal -#}
              {%- set is_python_literal =
                (label_index is string)
                and ("{" in label_index)
                and ("'" in label_index)
                and not ('"' in label_index)
              -%}
              
              {# Step 2: fix it if needed -#}
              {%- if is_python_literal -%}
                {%- set json_str = label_index
                  | replace("'", '"')
                  | replace("None", "null")
                  | replace("True", "true")
                  | replace("False", "false")
               -%}
                {%- set idx = json_str | from_json -%}
              {%- elif label_index is string -%}
                {%- set idx = label_index | from_json -%}
              {%- else -%}
                {%- set idx = label_index -%}
              {%- endif -%}
              
              {%- set targets = (normalized_label_targets | list) -%}
              {%- set ns = namespace(out=[]) -%}
              
              {#- Iterate through targets -#}
              {%- for t in targets -%}
                {%- set raw_arr = idx[t] | default('__MISS__') -%}
                {#- normalize arr -#}
                {%- if raw_arr is mapping -%}
                  {%- set arr = raw_arr.keys() | list -%}
                {%- elif raw_arr is iterable and raw_arr is not string and raw_arr != '__MISS__' -%}
                  {%- set arr = raw_arr | list -%}
                {%- elif raw_arr not in [none, '', '__MISS__'] -%}
                  {%- set arr = [raw_arr] -%}
                {%- else -%}
                  {%- set arr = [] -%}
                {%- endif -%}
              
                {#- merge -#}
                {%- set ns.out = (ns.out + arr) | unique | list -%}
              {%- endfor -%}
              
              {{- ns.out -}}
            is_label_mode: "{{- normalized_label_targets | length > 0 -}}"
            read_payload: >
              {%- set vol = read_volume if read_volume is mapping else {} -%}
              {%- if vol|length == 0 -%}
                {{- 
                  {"error": "Volume attribute missing or empty."} 
                -}}
              {%- else -%}
                {%- set targets = normalized_label_targets -%}
                {%- set drawers = resolved_label_drawers -%}
                {%- set has_targets = targets|length > 0 -%}
                {%- if has_targets -%}
                  {%- set ns = namespace(out={}) -%}
                  {%- for d in drawers -%}
                    {%- if d in vol and d not in always_hide_drawers and not (d[:1] in ['_', '.']) -%}
                      {%- set _d = vol[d] -%}
                      {%- set _desc = _d.get('meta', {}).get('description', '') | trim if _d is mapping else '' -%}
                      {%- set _exp = _d.get('meta', {}).get('expires_after', '') | trim if _d is mapping else '' -%}
                      {%- if _desc | length > 0 -%}
                        {%- set _blurb = _desc -%}
                      {%- else -%}
                        {%- set _val = (_d.get('value', '') if _d is mapping else _d) | string -%}
                        {%- set _blurb = _val[:120] ~ ('...' if _val | length > 120 else '') -%}
                      {%- endif -%}
                      {%- if _exp | length > 0 -%}
                        {%- set _blurb = '[exp:' ~ _exp ~ '] ' ~ _blurb -%}
                      {%- endif -%}
                      {%- set ns.out = ns.out | combine({ d: _blurb }) -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{
                    {
                      "mode": "label",
                      "label_targets": targets,
                      "resolved_drawers": drawers,
                      "count": ns.out|length,
                      "drawers": ns.out,
                      "note": "Label read returns blurbs only. Use direct read for full drawer content.",
                      "message": (
                        "No drawers found for requested labels." if ns.out|length == 0 else "OK" )
                    }
                  -}}
                {%- else -%}
                  {{- {
                    "error": "Label mode requested but no labels found.",
                    "label_targets": targets
                  } -}}
                {%- endif -%}
              {%- endif -%}
        - variables:
            final_response:
              status: >
                {{- 'error' if (read_payload is string and read_payload[:8] == '{"error"') else 'success' -}}
              message: >
                {%- if read_payload is string and read_payload[:8] == '{"error"' -%}
                  There was a problem reading from the volume.
                {%- else -%} 
                  Read succeeded.
                {%- endif -%}
              result: "{{- read_payload -}}"
              caller_token: "{{- caller_token | trim -}}"
        - stop: Read complete
          response_variable: final_response
      - conditions:
        - alias: Directory - Read all drawers in volume
          condition: template
          value_template: >
            {{- action_type == 'read' and ((label_targets | trim)  == '')
              and (volume_entity not in ['', '*', None])
              and (key in ['', None, '*']) 
            -}}
        sequence:
        - variables:
            ignore_label_prefixes:
            - _
            - .
            always_hide_drawers:
            - AI_Cabinet_VolumeInfo
            read_volume: "{{- state_attr(volume_entity, 'variables') | default({}, true) -}}"
            raw_drawers: >
              {%- if read_volume is mapping -%}
                {{- read_volume.keys() | list -}}
              {%- else -%}
                []
              {%- endif -%}
            read_label_index: >
              {%- if read_volume -%}
                {{- read_volume.get('_label_index', {}).get('value', []) -}}
              {%- else -%}
                []
              {%- endif -%}
            parsed_key: "{{- key | default('', true) | trim | lower -}}"
            initial_volume: "{{- read_volume if read_volume is mapping else {} -}}"
            read_payload: >
              {#- Ensure read_volume is a mapping; else fallback to empty dict -#}
              {%- set safe_read_volume = read_volume if read_volume is mapping else {} -%}

              {%- if safe_read_volume | length == 0 -%}
                {{- {'error': 'Volume attribute missing or empty.'} -}}
              {%- elif parsed_key in ['', '*'] -%}
                {%- set raw_drawers = safe_read_volume.keys() | list | default([]) -%}
                {%- set filtered_drawers_ns = namespace(items=[]) -%}
                {%- for d in raw_drawers -%}
                  {%- if d not in always_hide_drawers and not (d[:1] == '_' or d[:1] == '.') -%}
                    {%- set val = safe_read_volume.get(d, {}) -%}
                    {%- set val_value = val.get('value') if val is mapping else {} -%}
                    {%- if val is mapping and val_value is mapping and val_value.get('mount_point', false) -%}
                      {%- set mp_target = (
                          val_value.get('target_entity_id')
                          if val_value.get('target_entity_id')
                            else val_value.get('target_volume_id')
                            if val_value.get('target_volume_id')
                              else '?'
                         )
                      -%}
                      {%- set drawer_name = d ~ ' [mount:' ~ mp_target ~ ']' -%}
                    {%- else -%}
                      {%- set drawer_name = d -%}
                    {%- endif -%}
                    {%- set filtered_drawers_ns.items = filtered_drawers_ns.items + [drawer_name] -%}
                  {%- endif -%}
                {%- endfor -%}
                {%- set drawer_list = filtered_drawers_ns.items -%}

                {{
                  {
                    'drawers': drawer_list,
                     'label_index': read_label_index
                  } | tojson
                -}}
              {%- endif -%}
        - variables:
            final_response:
              status: >
                {{- 'error' if (read_payload is string and read_payload[:8] == '{"error"') else 'success' -}}
              message: >
                {%- if read_payload is string and read_payload[:8] == '{"error"' -%}
                There was a problem reading drawers in the volume.
                {%- else -%}
                Directory read succeeded.
                {%- endif -%}
              result: "{{- read_payload -}}"
              caller_token: "{{- caller_token | trim -}}"
        - stop: Volume directory read complete
          response_variable: final_response
      - conditions:
        - alias: Read
          condition: template
          value_template: >
            {%- set is_direct_read =
                 (action_type == 'read')
                 and (volume_entity not in [None, '', '*'])
                 and (key not in [None, '', '*'])
            -%}

            {%- set is_wildcard_read =
                 (action_type == 'read')
                 and (volume_entity not in [None, '', '*'])
                 and (key in [None, '', '*'])
            -%}

            {%- set has_labels = normalized_label_targets is iterable and (normalized_label_targets | length) > 0 -%}

            {%- set is_label_read = (action_type == 'read') and has_labels -%}

            {{- is_direct_read or is_wildcard_read or is_label_read -}}
        sequence:
        - variables:
            ignore_label_prefixes:
            - _
            - .
            always_hide_drawers:
            - AI_Cabinet_VolumeInfo
            read_volume: "{{- state_attr(volume_entity, 'variables') | default({}, true) -}}"
            parsed_key: "{{- key | default('', true) | trim | lower -}}"
            vol: "{{- read_volume if read_volume is mapping else {} -}}"
            label_index: "{{- ( vol.get('_label_index', {}).get('value', {}) if vol is mapping else {} ) -}}"
            read_payload: >
              {%- if vol | length == 0 -%}
                {{- {"error": "Volume attribute missing or empty."} -}}
              {%- else -%}
              
                {#- --------------------------------------------------
                    CASE 1: WILDCARD READ ("", "*") — return all drawers with full values
                    -------------------------------------------------- -#}
                {%- if parsed_key in ['', '*'] -%}
                  {%- set ns_draw = namespace(result={}) -%}
                  {%- for d in vol.keys() | list -%}
                    {%- if d not in always_hide_drawers and not (d[:1] in ['_', '.']) -%}
                      {%- set ns_draw.result = ns_draw.result | combine({d: vol[d]}) -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{- ns_draw.result -}}
              
                {#- --------------------------------------------------
                   CASE 2: DIRECT KEY READ
                   -------------------------------------------------- -#}
                {%- elif parsed_key in vol -%}
                  {{- {parsed_key: vol[parsed_key]} | tojson -}}
               
                {#- --------------------------------------------------
                     CASE 3: NOT FOUND
                    -------------------------------------------------- -#}
                {%- else -%}
                  {{- {"error": "Requested drawer not found in volume."} -}}
                {%- endif -%}
              {%- endif -%}
        - variables:
            final_response:
              status: >
                {{- 'error' if (read_payload is string and read_payload[:8] == '{"error"') else 'success' -}}
              message: > 
                {%- if read_payload is string and read_payload[:8] == '{"error"' -%}
                  There was a problem reading from the volume.
                {%- else -%}
                  Read succeeded.
                {%- endif -%}
              result: "{{- read_payload -}}"
              caller_token: "{{- caller_token | trim -}}"
        - stop: Read complete
          response_variable: final_response
      - conditions:
        - alias: Manifest - Read Volume( '', '*' )
          condition: template
          value_template: "{{- action_type == 'manifest' or ( action_type == 'read' and (label_targets | trim) == '' and (volume_entity in ['', '*', None]) )  -}}"
        sequence:
        - action: script.zen_dojotools_manifest
          metadata: {}
          data:
            show_hidden_volumes: "{{- show_hidden_volumes -}}"
            show_stacks: "{{- show_stacks -}}"
          response_variable: final_response
        - stop: Manifest read complete
          response_variable: final_response
      - conditions:
        - alias: Create (or Update when Key not Exist and Force)
          condition: template
          value_template: "{{- is_create_new or is_force_update_new or is_force_create_over_existing}}"
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: "  {{- protect_write and not force_action and not volume_unmodified -}}"
            sequence:
            - variables:
                final_response:
                  status: error
                  message: 'Protected write blocked: volume was modified. Retry.'
            - stop: Concurrent modification
              response_variable: final_response
        - event: set_variable_legacy
          event_data:
            key: "{{- key -}}"
            value: '{{- new_entry.value | tojson -}}'
            set_timestamp: "{{- set_timestamp -}}"
            volume_entity: "{{- volume_entity -}}"
        - choose:
          - conditions:
            - condition: template
              value_template: '{{- parsed_entity_labels | length > 0 -}}'
              alias: Valid Labels
            sequence:
            - alias: Update the index
              event: set_variable_legacy
              event_data:
                key: _label_index
                value: "{{- updated_label_index | tojson -}}"
                set_timestamp: true
                volume_entity: "{{- volume_entity -}}"
        - alias: Read after Write Verification
          # Waits for cabinet to store the new JSON value. entry is mapping resolves
          # quickly once the wrapped drawer lands (create path).
          wait_template: >
            {%- set vol = state_attr(volume_entity, 'variables') -%}
            {%- if vol is mapping -%}
              {%- set entry = vol.get(key) -%}
              {{- entry is mapping -}}
            {%- else -%}
              {{- false -}}
            {%- endif -%}
          timeout: 00:00:30
          continue_on_timeout: true
        - variables:
            verify_volume: "{{- state_attr(volume_entity, 'variables') | default({}, true) -}}"
            verify_entry: "{%- if verify_volume is mapping -%}{{- verify_volume.get(key, {}) -}}{%- else -%}{}{%- endif -%}"
            write_verified: "{{- verify_entry is mapping and verify_entry.get('value') == new_entry.value | tojson }}"
        - variables:
            final_response:
              status: "{{- 'success' if write_verified else 'warning' -}}"
              message: >
                {%- if write_verified -%}
                  Created drawer '{{- key -}}' (verification confirmed).
                {%- else -%}
                  Created drawer '{{- key -}}' (value written but verification delayed).
                {%- endif -%}
              entry:
                drawer: "{{- key -}}"
                value: '{{- new_entry.value -}}'
                timestamp: '{{- new_entry.timestamp if new_entry.timestamp is defined else None -}}'
              verification:
                confirmed: "{{- write_verified -}}"
              warnings: >
                {%- if dropped_labels | length > 0 and not create_label -%}
                  Warning: {{ dropped_labels | length }} ignored label(s): {{ dropped_labels }}. Pass create_label: true to auto-create.
                {%- else -%}
                  None
                {%- endif -%}
              caller_token: "{{- caller_token | trim -}}"
        - stop: Create fired
          response_variable: final_response
      - conditions:
        - alias: Update
          condition: template
          value_template: "{{- action_type == 'update' and key_exists_initial and not is_force_update_new -}}"
        sequence:
        - choose:
          - conditions:
            - alias: 'Error - Concurrent Modification Blocked: Modified'
              condition: template
              value_template: "{{- protect_write and not force_action and not volume_unmodified -}}"
            sequence:
            - variables:
                final_response:
                  status: error
                  message: 'Protected write blocked: volume was modified. Retry.'
            - stop: Concurrent modification
              response_variable: final_response
        - event: set_variable_legacy
          event_data:
            key: "{{- key -}}"
            value: '{{- new_entry.value | tojson -}}'
            set_timestamp: "{{- set_timestamp -}}"
            volume_entity: "{{- volume_entity -}}"
        - choose:
          - conditions:
            - condition: template
              value_template: '{{- parsed_entity_labels | length > 0 -}}'
              alias: Valid Labels
            sequence:
            - alias: Update the Index
              event: set_variable_legacy
              event_data:
                key: _label_index
                value: "{{- updated_label_index | tojson -}}"
                set_timestamp: true
                volume_entity: "{{- volume_entity -}}"
        - alias: Read after Write Verification (update)
          # Compare JSON strings on both sides — entry.get('value') is the stored JSON
          # string; new_entry.value | tojson is the expected JSON string. Type-safe.
          wait_template: >
            {%- set vol = state_attr(volume_entity, 'variables') -%}
            {%- if vol is mapping -%}
              {%- set entry = vol.get(key, {}) -%}
              {{- entry.get('value') == new_entry.value | tojson -}}
            {%- else -%}
              {{- false -}}
            {%- endif -%}
          timeout: 00:00:30
          continue_on_timeout: true
        - variables:
            verify_volume: "{{- state_attr(volume_entity, 'variables') | default({}, true) -}}"
            verify_entry: >
              {%- if verify_volume is mapping -%}
                {{- verify_volume.get(key, {}) -}}
              {%- else -%}
                {}
              {%- endif -%}
            write_verified: "{{- verify_entry is mapping and verify_entry.get('value') == new_entry.value | tojson }}"
        - variables:
            final_response:
              status: "{{- 'success' if write_verified else 'warning' -}}"
              message: >
                {%- if write_verified -%}
                  Updated drawer '{{- key -}}' (verification confirmed).
                {%- else -%}
                  Updated drawer '{{- key -}}' (value written but verification delayed).
                {%- endif -%}
              entry:
                drawer: "{{- key -}}"
                value: '{{- new_entry.value -}}'
                timestamp: '{{- new_entry.timestamp if new_entry.timestamp is defined else None -}}'
              verification:
                confirmed: "{{- write_verified -}}"
              warnings: >
                {%- if dropped_labels | length > 0 -%}
                  Warning: {{ dropped_labels | length }} ignored label(s): {{ dropped_labels }}
                {%- else -%}
                None
                {%- endif -%}
              caller_token: "{{- caller_token | trim -}}"
        - stop: Update fired
          response_variable: final_response
      - conditions:
        - condition: template
          value_template: "{{- action_type == 'delete' and key_exists_initial -}}"
          alias: Delete
        sequence:
        - event: remove_variable_legacy
          event_data:
            key: "{{- key -}}"
            volume_entity: "{{- volume_entity -}}"
        - wait_template: >
            {%- set vol = state_attr(volume_entity, 'variables') | default({}, true) -%} 
            {{- vol is mapping and (key not in vol) -}}
          timeout: 00:00:01
          continue_on_timeout: true
          alias: Read after Delete Verification
        - variables:
            verify_volume: "{{- state_attr(volume_entity, 'variables') | default({}, true) -}}"
            delete_verified: "{{- verify_volume is mapping and (key not in verify_volume) -}}"
        - variables:
            _index_src: "{{- state_attr(volume_entity, 'variables') | default({}, true) -}}"
            _raw_index: >
              {%- if _index_src is mapping -%}
                {{- _index_src.get('_label_index', {}).get('value', {}) -}}
              {%- else -%}
                {}
              {%- endif -%}
            pruned_index: >
              {%- if _raw_index is mapping -%}
                {#- Build a cleaned copy with `key` removed everywhere -#}
                {%- set cleaned = {} -%}
                {%- for label, drawers in _raw_index.items() -%}
                  {%- if drawers is mapping -%}
                    {# Nested form: label -> {sub: [drawers]} -#}
                    {%- set kept_sub = {} -%}
                    {%- for sub, arr in drawers.items() -%}
                      {%- set al = arr if (arr is iterable and not arr is string) else [arr] -%}
                      {%- set cleaned_arr = al | reject('equalto', key) | list -%}
                      {%- if cleaned_arr | length > 0 -%}
                        {%- set kept_sub = kept_sub | combine({ sub: cleaned_arr }) -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {%- if kept_sub | length > 0 -%}
                      {%- set cleaned = cleaned | combine({ label: kept_sub }) -%}
                    {%- endif -%}
                  {%- elif drawers is iterable and not drawers is string -%}
                    {#- Flat list form: label -> [drawers] -#}
                    {%- set cleaned_list = drawers | reject('equalto', key) | list -%}
                    {%- if cleaned_list | length > 0 -%}
                      {%- set cleaned = cleaned | combine({ label: cleaned_list }) -%}
                    {%- endif -%}
                  {%- else -%}
                    {#- Single value fallback -#}
                    {%- if drawers != key -%}
                      {%- set cleaned = cleaned | combine({ label: [drawers] }) -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endfor -%}
                {{- cleaned -}}
              {%-  else -%}
                {}
              {%- endif -%}
            index_changed: '{{- pruned_index != _raw_index -}}'
        - choose:
          - conditions:
            - condition: template
              value_template: "{{- index_changed -}}"
              alias: Prune needed
            sequence:
            - event: set_variable_legacy
              event_data:
                key: _label_index
                value: "{{- pruned_index -}}"
                set_timestamp: true
                volume_entity: "{{- volume_entity -}}"
            - alias: Index prune verification
              wait_template: >
                {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                {%- set raw = CABS.cabinet_drawer_value(volume_entity, '_label_index', {}) | from_json() -%}
                {%- set found = false -%} 
                {%- if raw is mapping -%}
                  {%- for label, drawers in raw.items() -%}
                    {%- if drawers is mapping -%}
                      {%- for sub, arr in drawers.items() -%}
                        {%- set al = arr if (arr is iterable and not arr is string) else [arr] -%}                
                        {%- if key in al -%}{%- set found = true -%}{%- endif -%}
                      {%- endfor -%}
                    {%- elif drawers is iterable and not drawers is string -%}
                      {%- if key in drawers -%}{%- set found = true -%}{%- endif -%}
                    {%- else -%}
                      {%- if drawers == key -%}{%- set found = true -%}{%- endif -%}
                    {%- endif -%}
                  {%- endfor -%}
                {%- endif -%} 
                {{- not found -}}
              timeout: 00:00:01
              continue_on_timeout: true
            - variables:
                index_pruned_verified: >
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set raw = CABS.cabinet_drawer_value(volume_entity, '_label_index', {}) | from_json() -%}
                  {%- set found = false -%} 
                  {%- if raw is mapping -%}
                    {%- for label, drawers in raw.items() -%}
                      {%- if drawers is mapping -%}
                        {%- for sub, arr in drawers.items() -%}
                          {%- set al = arr if (arr is iterable and not arr is string) else [arr] -%}
                          {%- if key in al -%}{%- set found = true -%}{%- endif -%}
                        {%- endfor -%}
                      {%- elif drawers is iterable and not drawers is string -%}
                        {%- if key in drawers -%}{%- set found = true -%}{%- endif -%}
                      {%- else -%}
                        {%- if drawers == key -%}{%- set found = true -%}{%- endif -%}
                      {%- endif -%}
                    {%- endfor -%}
                  {%- endif -%}
                  {{- not found -}}
        - variables:
            final_response:
              status: "{{- 'success' if delete_verified else 'warning' -}}"
              index_maintenance:
                pruned: "{{- index_changed -}}"
                verified: "{{- index_pruned_verified if index_changed else true -}}"
              message: >
                {%- if delete_verified -%}
                  Deleted drawer '{{- key -}}' (verification confirmed).
                {%- else -%}
                  Delete requested for '{{- key -}}' (verification not confirmed — key still present or state not yet updated).
                {%- endif -%}
              caller_token: "{{- caller_token | trim -}}"
        - stop: Delete fired
          response_variable: final_response
      - conditions:
        - condition: template
          value_template: "{{- action_type in ['move', 'copy'] -}}"
          alias: Move/Copy Drawer
        sequence:
        - variables:
            dest_cabinet: "{{- destination_cabinet -}}"
            dest_drawer: "{{- destination_drawer -}}"
            dest_volume: "{{- state_attr(dest_cabinet, 'variables') | default({}, true) -}}"
            src_drawer_data: '{{- initial_volume.get(key, {}) -}}'
            src_drawer_value: >-
              {%- set ns = namespace(d=src_drawer_data) -%}
              {%- if ns.d is string and (ns.d | trim)[:1] in ['{', '['] -%}
                {%- set _parsed = ns.d | from_json(none) -%}
                {%- if _parsed is not none and _parsed is not string -%}
                  {%- set ns.d = _parsed -%}
                {%- endif -%}
              {%- endif -%}
              {{- ns.d.get('value', ns.d) if ns.d is mapping else ns.d -}}
            can_write_dest: "{{- not protect_write or ((state_attr(dest_cabinet, 'variables') or {}).get(dest_drawer) is none) or force_action -}}"
            is_mount_point: "{{- src_drawer_value is mapping and src_drawer_value.get('mount_point', false) == true -}}"
        - choose:
          - conditions:
            - condition: template
              value_template: "{{- dest_cabinet == '' or dest_drawer == '' -}}"
            sequence:
            - variables:
                final_response:
                  status: error
                  message: Missing destination_cabinet or destination_drawer.
            - stop: Incomplete destination
              response_variable: final_response
          - conditions:
            - condition: template
              value_template: "{{- is_mount_point -}}"
            sequence:
            - variables:
                final_response:
                  status: error
                  message: Drawer '{{- key -}}' is a mount point and cannot be moved
                    or copied. Use set_mount / remove_mount to manage mount links.
            - stop: Mount point block
              response_variable: final_response
          - conditions:
            - condition: template
              value_template: "{{- not can_write_dest -}}"
            sequence:
            - variables:
                final_response:
                  status: error
                  message: Target drawer '{{- dest_drawer -}}' already exists in '{{- dest_cabinet
                    -}}'. Use force_action to overwrite.
            - stop: Overwrite blocked
              response_variable: final_response
        - event: set_variable_legacy
          event_data:
            key: "{{- dest_drawer -}}"
            value: "{{- src_drawer_value -}}"
            set_timestamp: true
            volume_entity: "{{- dest_cabinet -}}"
        - choose:
          - conditions:
            - condition: template
              value_template: '{{- parsed_entity_labels | length > 0 -}}'
              alias: Valid Labels
            sequence:
            - alias: Update the Index
              event: set_variable_legacy
              event_data:
                key: _label_index
                value: "{{- updated_label_index -}}"
                set_timestamp: true
                volume_entity: "{{- dest_cabinet -}}"
        - wait_template: >
            {%- set vol = state_attr(dest_cabinet, 'variables') | default({}, true) -%}
            {{- vol.get(dest_drawer, {}).get('value') == src_drawer_value -}}
          timeout: 00:00:01
          continue_on_timeout: true
        - variables:
            write_verified: >
              {%- set vol = state_attr(dest_cabinet, 'variables') | default({}, true) -%}
              {{- vol.get(dest_drawer, {}).get('value') == src_drawer_value -}}'
        - choose:
          - conditions:
            - condition: template
              value_template: "{{- action_type == 'move' and key_exists_initial -}}"
              alias: Move - Source Delete Required
            sequence:
            - event: remove_variable_legacy
              event_data:
                key: "{{- key -}}"
                volume_entity: "{{- volume_entity -}}"
            - wait_template: "{%- set vol = state_attr(volume_entity, 'variables') | default({}, true) -%}{{- key not in vol -}}"
              timeout: 00:00:01
              continue_on_timeout: true
            - variables:
                _raw_index: "{{- initial_volume.get('_label_index', {}).get('value') | default({}) -}}"
                _index_src: "{{- state_attr(volume_entity, 'variables') | default({}, true) -}}"
                pruned_index: >
                  {%- if _raw_index is mapping -%}
                    {#- Build a cleaned copy with `key` removed everywhere -#}
                    {%- set cleaned = {} -%}
                    {%- for label, drawers in _raw_index.items() -%}
                      {%- if drawers is mapping -%}
                        {#- Nested form: label -> {sub: [drawers]} -#}
                        {%- set kept_sub = {} -%}
                        {%- for sub, arr in drawers.items() -%}
                          {%- set al = arr if (arr is iterable and not arr is string) else [arr] -%}
                          {%- set cleaned_arr = al | reject('equalto', key) | list -%}
                          {%- if cleaned_arr | length > 0 -%}
                            {%- set kept_sub = kept_sub | combine({ sub: cleaned_arr }) -%}
                          {%- endif -%}
                        {%- endfor -%}
                        {%- if kept_sub | length > 0 -%}
                          {%- set cleaned = cleaned | combine({ label: kept_sub }) -%}
                        {%- endif -%}
                      {%- elif drawers is iterable and not drawers is string -%}
                        {#- Flat list form: label -> [drawers] -#}
                        {%- set cleaned_list = drawers | reject('equalto', key) | list -%}
                        {%- if cleaned_list | length > 0 -%}
                          {%- set cleaned = cleaned | combine({ label: cleaned_list }) -%}
                        {%- endif -%}
                      {%- else -%}
                        {#- Single value fallback -#}
                        {%- if drawers != key -%}
                          {%- set cleaned = cleaned | combine({ label: [drawers] }) -%}
                        {%- endif -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {{- cleaned -}}
                  {%- else -%}
                  {}
                  {%- endif -%}
                index_changed: "{{- _raw_index != pruned_index -}}"
            - choose:
              - conditions:
                - condition: template
                  value_template: "{{- index_changed -}}"
                  alias: Prune needed
                sequence:
                - event: set_variable_legacy
                  event_data:
                    key: _label_index
                    value: "{{- pruned_index -}}"
                    set_timestamp: true
                    volume_entity: "{{- volume_entity -}}"
                - alias: Index prune verification
                  wait_template: >
                    {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                    {%- set raw = CABS.cabinet_drawer_value(volume_entity, '_label_index', {}) | from_json() -%}
                    {%- set found = false -%} 
                    {%- if raw is mapping -%}
                      {%- for label, drawers in raw.items() -%}
                        {%- if drawers is mapping -%}
                          {%- for sub, arr in drawers.items() -%}
                            {%- set al = arr if (arr is iterable and not arr is string) else [arr] -%}
                            {%- if key in al -%}{%- set found = true -%}{%- endif -%}
                          {%- endfor -%}
                        {%- elif drawers is iterable and not drawers is string -%}
                          {%- if key in drawers -%}{%- set found = true -%}{%- endif -%}
                        {%- else -%}
                          {%- if drawers == key -%}{%- set found = true -%}{%- endif -%}
                        {%- endif -%}
                      {%- endfor -%}
                    {%- endif -%} 
                    {{- not found -}}
                  timeout: 00:00:01
                  continue_on_timeout: true
                - variables:
                    index_pruned_verified: >
                      {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                      {%- set raw = CABS.cabinet_drawer_value(volume_entity, '_label_index', {}) | from_json() -%}
                      {%- set found = false -%}
                      {%- if raw is mapping -%}
                        {%- for label, drawers in raw.items() -%}
                          {%- if drawers is mapping -%}
                            {%- for sub, arr in drawers.items() -%}
                              {%- set al = arr if (arr is iterable and not arr is string) else [arr] -%}
                              {%- if key in al -%}{%- set found = true -%}{%- endif -%}
                            {%- endfor -%}
                          {%- elif drawers is iterable and not drawers is string -%}
                            {%- if key in drawers -%}{%- set found = true -%}{%- endif -%}
                          {%- else -%}
                            {%- if drawers == key -%}{%- set found = true -%}{%- endif -%}
                          {%- endif -%}
                        {%- endfor -%}
                      {%- endif -%}
                      {{- not found -}}
        - variables:
            final_response:
              status: "{{- 'success' if write_verified else 'warning' -}}"
              message: >
                {%- if write_verified -%}
                  Drawer '{{- key -}}' {{ action_type -}}d to '{{- dest_drawer -}}' in '{{- dest_cabinet -}}'.
                {%- else -%}
                  {{- action_type | title }} completed but write verification failed or delayed.
                {%- endif -%}
              verification:
                confirmed: "{{- write_verified -}}"
        - stop: Move/Copy complete
          response_variable: final_response
      - conditions:
        - condition: template
          value_template: "{{- action_type == 'clone' -}}"
          alias: Clone Cabinet (Highlander mode)
        sequence:
        - variables:
            dest_cabinet: "{{- destination_cabinet -}}"
            transfer_guid: "{{- transfer_guid -}}"
            src_health: "{{- state_attr(volume_entity, 'health') or {} -}}"
            dest_health: "{{- state_attr(destination_cabinet, 'health') or {} -}}"
            src_health_ok: >-
              {{- src_health.get('status', '') != 'error'
                  and not src_health.get('guid_mismatch', false) -}}
            dest_health_ok: >-
              {{- dest_health.get('status', '') != 'error'
                  and not dest_health.get('guid_mismatch', false)
                  and dest_health.get('writeable', true) -}}
            src_mount_keys: >-
              {%- set ns = namespace(mounts=[]) -%}
              {%- for k, v in initial_volume.items() -%}
                {%- set val = v.get('value', v) if v is mapping else v -%}
                {%- if val is mapping and val.get('mount_point', false) == true -%}
                  {%- set ns.mounts = ns.mounts + [k] -%}
                {%- endif -%}
              {%- endfor -%}
              {{- ns.mounts -}}
            has_mount_points: '{{- src_mount_keys | length > 0 -}}'
            drawers_to_clone: >-
              {%- set skip = [] if transfer_guid else ['AI_Cabinet_VolumeInfo'] -%}
              {%- set ns = namespace(drawers=[]) -%}
              {%- for k in initial_volume.keys() -%}
                {%- if k not in skip -%}
                  {%- set ns.drawers = ns.drawers + [k] -%}
                {%- endif -%}
              {%- endfor -%}
              {{- ns.drawers -}}
        - choose:
          - conditions:
            - condition: template
              value_template: "{{- dest_cabinet == '' -}}"
            sequence:
            - variables:
                final_response:
                  status: error
                  message: clone requires destination_cabinet.
            - stop: Missing destination_cabinet
              response_variable: final_response
          - conditions:
            - condition: template
              value_template: "{{- dest_cabinet == volume_entity -}}"
            sequence:
            - variables:
                final_response:
                  status: error
                  message: Cannot clone a cabinet to itself.
            - stop: Clone to self blocked
              response_variable: final_response
          - conditions:
            - condition: template
              value_template: "{{- transfer_guid and not force_action -}}"
            sequence:
            - variables:
                final_response:
                  status: error
                  message: GUID transfer is destructive and irreversible. Set force_action
                    true to confirm.
            - stop: GUID transfer requires force_action
              response_variable: final_response
          - conditions:
            - condition: template
              value_template: "{{- not src_health_ok -}}"
            sequence:
            - variables:
                final_response:
                  status: error
                  message: clone blocked — source cabinet not healthy.
                  health: "{{- src_health -}}"
            - stop: Source health blocked
              response_variable: final_response
          - conditions:
            - condition: template
              value_template: "{{- not dest_health_ok -}}"
            sequence:
            - variables:
                final_response:
                  status: error
                  message: clone blocked — destination cabinet not healthy or not writeable.
                  health: "{{- dest_health -}}"
            - stop: Dest health blocked
              response_variable: final_response
        - repeat:
            for_each: "{{- drawers_to_clone -}}"
            sequence:
            - event: set_variable_legacy
              event_data:
                key: '{{- repeat.item -}}'
                value: >-
                  {%- set src = initial_volume.get(repeat.item) -%}
                  {%- set ns = namespace(d=src) -%}
                  {%- if ns.d is string and (ns.d | trim)[:1] in ['{', '['] -%}
                    {%- set _parsed = ns.d | from_json(none) -%}
                    {%- if _parsed is not none and _parsed is not string -%}
                      {%- set ns.d = _parsed -%}
                    {%- endif -%}
                  {%- endif -%}
                  {{- ns.d.get('value', ns.d) if ns.d is mapping else ns.d -}}
                set_timestamp: true
                volume_entity: "{{- dest_cabinet -}}"
        - wait_template: >-
            {{- (state_attr(dest_cabinet, 'variables') or {}) | length >= drawers_to_clone | length -}}
          timeout: '00:00:05'
          continue_on_timeout: true
        - variables:
            clone_verified: >-
              {{- (state_attr(dest_cabinet, 'variables') or {}) | length >= drawers_to_clone | length -}}
        - choose:
          - conditions:
            - condition: template
              value_template: "{{- transfer_guid -}}"
              alias: GUID Transfer — clear source and mark for restamp
            sequence:
            - repeat:
                for_each: "{{- drawers_to_clone -}}"
                sequence:
                - event: remove_variable_legacy
                  event_data:
                    key: '{{- repeat.item -}}'
                    volume_entity: "{{- volume_entity -}}"
            - event: set_variable_legacy
              event_data:
                key: AI_Cabinet_VolumeInfo
                value:
                  id: pending_{{- now().timestamp() | int -}}
                  needs_restamp: true
                  note: GUID transferred to {{ dest_cabinet }} on {{ now_iso -}}
                set_timestamp: true
                volume_entity: "{{- volume_entity -}}"
        - variables:
            src_guid: >-
              {%- set vi = initial_volume.get('AI_Cabinet_VolumeInfo', {}) -%}
              {%- set v = vi.get('value', vi) if vi is mapping else {} -%}
              {{- v.get('id', '') if v is mapping else '' -}}
            final_response:
              status: "{{- 'success' if clone_verified else 'warning' -}}"
              action: clone
              transfer_guid: "{{- transfer_guid -}}"
              source: "{{- volume_entity -}}"
              destination: "{{- dest_cabinet -}}"
              drawers_cloned: '{{- drawers_to_clone | length -}}'
              mounts_copied: "{{- src_mount_keys -}}"
              source_guid: "{{- src_guid -}}"
              verification:
                confirmed: "{{- clone_verified -}}"
        - stop: Clone complete
          response_variable: final_response
      - conditions:
        - condition: template
          value_template: "{{- action_type == 'set_mount' -}}"
          alias: Set Mount Point
        sequence:
        - variables:
            target_entity_resolved: >
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
              {%- set ns = namespace(found='') -%}
              {%- for eid in label_entities('zen_cabinet') | list -%}
                {%- set vi = CABS.cabinet_drawer_value(eid, 'AI_Cabinet_VolumeInfo', none) | from_json() -%}
                {%- if vinfo is mapping -%}
                  {#- @todo - ensure we can never compare empty with empty (''=='')-#}
                  {%- if  vi.get('id', '') == target_guid -%}
                    {%- set ns.found = eid -%}
                    {%- break -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
              {{- ns.found -}}
            old_mount_entry: "{{- initial_volume.get(key, {}) -}}"
            old_mount_guid: >
              {%- set e = old_mount_entry -%}
              {%- set ev = e.get('value', {}) if e is mapping else {} -%}
              {%- if ev is mapping and ev.get('mount_point', false) -%}
                {{- ev.get('target_guid', '') -}}
              {%- else -%}
                {{- '' -}}
              {%- endif -%}
            existing_is_mount: >
              {%- set e = old_mount_entry -%}
              {%- set ev = e.get('value', {}) if e is mapping else {} -%}
              {{- ev is mapping and ev.get('mount_point', false) == true -}}
        - choose:
          - conditions:
            - condition: template
              value_template: "{{- target_entity_resolved == '' -}}"
              alias: GUID not found in any cabinet
            sequence:
            - variables:
                final_response:
                  status: error
                  message: "set_mount failed: target_guid '{{- target_guid -}}' not found in any cabinet volume."
            - stop: Target GUID not found
              response_variable: final_response
          - conditions:
            - condition: template
              value_template: "{{- key_exists_initial and not existing_is_mount and not force_action -}}"
              alias: Drawer exists and is not a mount — require force_action to overwrite
            sequence:
            - variables:
                final_response:
                  status: error
                  message: "set_mount blocked: drawer '{{- key -}}' exists and is not a mount point. Use force_action to overwrite."
            - stop: Non-mount drawer would be overwritten
              response_variable: final_response
        - event: set_variable_legacy
          event_data:
            key: "{{- key -}}"
            value: "{{- {'mount_point': true, 'target_guid': target_guid, 'target_entity_id': target_entity_resolved} -}}"
            volume_entity: "{{- volume_entity -}}"
            set_timestamp: true
        - alias: set_mount write verification
          wait_template: >
            {%- set vol = state_attr(volume_entity, 'variables') | default({}, true) -%} 
            {%- set entry = vol.get(key, {}) if vol is mapping else {} -%} 
            {{- entry.get('value', {}).get('mount_point', false) == true -}}
          timeout: 00:00:05
          continue_on_timeout: true
        - variables:
            verify_vol: "{{- state_attr(volume_entity, 'variables') | default({}, true) -}}"
            verify_entry: "{{- verify_vol.get(key, {}) if verify_vol is mapping else {} -}}"
            mount_write_verified: "{{- verify_entry.get('value', {}).get('mount_point',  false) == true -}}"
        - variables:
            final_response:
              status: "{{- 'success' if mount_write_verified else 'warning' -}}"
              message: >
                {%- if mount_write_verified -%}
                    Mount point '{{- key -}}' set to target '{{- target_guid -}}' ({{- target_entity_resolved -}}) (verified).
                {%- else -%}
                  Mount point '{{- key -}}' write issued but not yet confirmed.
                {%- endif -%}
              mount:
                drawer: "{{- key -}}"
                target_guid: "{{- target_guid -}}"
                target_entity_id: "{{- target_entity_resolved -}}"
              previous_guid: "{{- old_mount_guid -}}"
              verification:
                confirmed: "{{- mount_write_verified -}}"
        - stop: set_mount complete
          response_variable: final_response
      - conditions:
        - condition: template
          value_template: "{{- action_type == 'remove_mount' -}}"
          alias: Remove Mount Point
        sequence:
        - variables:
            existing_entry: "{{- initial_volume.get(key, {}) -}}"
            is_mount: >
              {%- set e = existing_entry -%}
              {%- set ev = e.get('value', {}) if e is mapping else {} -%}
              {{- ev is mapping and ev.get('mount_point', false) == true -}}
            old_mount_guid: >
              {%- set e = existing_entry -%}
              {%- set ev = e.get('value', {}) if e is mapping else {} -%}
              {%- if ev is mapping -%}
                {{- ev.get('target_guid', '') -}}
              {%- else -%}
                {{- '' -}}
              {%- endif -%}
        - choose:
          - conditions:
            - condition: template
              value_template: "{{- not key_exists_initial -}}"
              alias: Drawer not found
            sequence:
            - variables:
                final_response:
                  status: error
                  message: "remove_mount failed: drawer '{{- key -}}' not found in volume."
            - stop: Mount drawer not found
              response_variable: final_response
          - conditions:
            - condition: template
              value_template: "{{- not is_mount -}}"
              alias: Drawer is not a mount point
            sequence:
            - variables:
                final_response:
                  status: error
                  message: "remove_mount failed: drawer '{{- key -}}' is not a mount point."
            - stop: Not a mount
              response_variable: final_response
        - event: remove_variable_legacy
          event_data:
            key: "{{- key -}}"
            volume_entity: "{{- volume_entity -}}"
        - alias: remove_mount delete verification
          wait_template: >
            {%- set vol = state_attr(volume_entity, 'variables') | default({}, true) -%}
            {{- vol is mapping and (key not in vol) -}}
          timeout: 00:00:01
          continue_on_timeout: true
        - variables:
            verify_vol: "{{- state_attr(volume_entity, 'variables') | default({}, true) -}}"
            remove_verified: "{{- verify_vol is mapping and (key not in verify_vol) -}}"
        - variables:
            final_response:
              status: "{{- 'success' if remove_verified else 'warning' -}}"
              message: >
                {%- if remove_verified -%}
                  Mount point '{{- key -}}' removed (verified).
                {%- else -%}
                  Remove issued for '{{- key -}}' but not yet confirmed.
                {%- endif -%}
              previous_guid: "{{- old_mount_guid -}}"
              verification:
                confirmed: "{{- remove_verified -}}"
        - stop: remove_mount complete
          response_variable: final_response
      - conditions:
        - condition: template
          value_template: "{{- action_type == 'mount_cabinet' -}}"
          alias: Mount Cabinet
        sequence:
        - variables:
            cab_current_state: "{{- states(volume_entity) -}}"
        - choose:
          - conditions:
            - condition: template
              value_template: "{{- cab_current_state == 'init' -}}"
              alias: Cabinet not loaded yet
            sequence:
            - variables:
                final_response:
                  status: error
                  message: "mount_cabinet failed: '{{- volume_entity -}}' is in 'init' state — VolumeInfo not yet loaded."
            - stop: Cabinet in init
              response_variable: final_response
          - conditions:
            - condition: template
              value_template: "{{- cab_current_state == 'online_mounted' -}}"
              alias: Already mounted — idempotent
            sequence:
            - variables:
                final_response:
                  status: success
                  message: "Cabinet '{{- volume_entity -}}' is already mounted (idempotent)."
                  state: online_mounted
            - stop: Already mounted
              response_variable: final_response
        - event: set_variable_legacy
          event_data:
            key: meta
            value: "{{- {'mounted': true} -}}"
            volume_entity: "{{- volume_entity -}}"
            set_timestamp: true
        - alias: mount_cabinet state transition wait
          wait_template: "{{- states(volume_entity) == 'online_mounted' -}}"
          timeout: 00:00:05
          continue_on_timeout: true
        - variables:
            mount_verified: "{{- states(volume_entity) == 'online_mounted' -}}"
        - variables:
            final_response:
              status: "{{- 'success' if mount_verified else 'warning' -}}"
              message: >
                {%- if mount_verified -%}
                  Cabinet '{{- volume_entity -}}' mounted (verified).
                {%- else -%}
                  Mount write issued for '{{- volume_entity -}}' but state not yet confirmed.
                {%- endif -%}
              state: "{{- states(volume_entity) -}}"
              verification:
                confirmed: "{{- mount_verified -}}"
        - event: zen_event
          event_data:
            event:
              kind: cabinet_mounted
              component: "{{- volume_entity -}}"
              severity: info
              summary: "Cabinet '{{- volume_entity -}}' mounted."
        - stop: mount_cabinet complete
          response_variable: final_response
      - conditions:
        - condition: template
          value_template: "{{- action_type == 'dismount_cabinet' -}}"
          alias: Dismount Cabinet
        sequence:
        - variables:
            _default_label_slugs:
              - zen_default_household_cabinet
              - zen_default_family_cabinet
              - zen_default_user_cabinet
              - zen_default_ai_user_cabinet
        - variables:
            cab_is_default: >
              {%- set ns = namespace(v=false) -%}
              {%- for lbl in _default_label_slugs -%}
                {%- if volume_entity in (label_entities(lbl) | list) -%}
                  {%- set ns.v = true -%}
                {%- endif -%}
              {%- endfor -%}
              {{- ns.v -}}
            cab_current_state: "{{- states(volume_entity) -}}"
        - choose:
          - conditions:
            - condition: template
              value_template: "{{- cab_is_default -}}"
              alias: Dismount lock — default label holder
            sequence:
            - variables:
                final_response:
                  status: error
                  message: "dismount_cabinet blocked: '{{- volume_entity -}}' holds a zen_default_* label. Transfer the default label before dismounting."
            - stop: Default label lock
              response_variable: final_response
          - conditions:
            - condition: template
              value_template: "{{- cab_current_state == 'init' -}}"
              alias: Cabinet not loaded
            sequence:
            - variables:
                final_response:
                  status: error
                  message: "dismount_cabinet failed: '{{- volume_entity -}}' is in 'init' state — VolumeInfo not yet loaded."
            - stop: Cabinet in init
              response_variable: final_response
          - conditions:
            - condition: template
              value_template: "{{- cab_current_state == 'online_unmounted' -}}"
              alias: Already dismounted — idempotent
            sequence:
            - variables:
                final_response:
                  status: success
                  message: "Cabinet '{{- volume_entity -}}' is already dismounted (in the stacks, idempotent)."
                  state: online_unmounted
            - stop: Already dismounted
              response_variable: final_response
        - event: set_variable_legacy
          event_data:
            key: meta
            value: "{{- {'mounted': false} -}}"
            volume_entity: "{{- volume_entity -}}"
            set_timestamp: true
        - alias: dismount_cabinet state transition wait
          wait_template: "{{- states(volume_entity) == 'online_unmounted' -}}"
          timeout: 00:00:05
          continue_on_timeout: true
        - variables:
            dismount_verified: "{{- states(volume_entity) == 'online_unmounted' -}}"
        - variables:
            final_response:
              status: "{{- 'success' if dismount_verified else 'warning' -}}"
              message: >
                {%- if dismount_verified -%}
                  Cabinet '{{- volume_entity -}}' dismounted and in the stacks (verified).
                {%- else -%}
                  Dismount write issued for '{{- volume_entity -}}' but state not yet confirmed.
                {%- endif -%}
              state: "{{- states(volume_entity) -}}"
              verification:
                confirmed: "{{- dismount_verified -}}"
        - event: zen_event
          event_data:
            event:
              kind: cabinet_dismounted
              component: "{{- volume_entity -}}"
              severity: info
              summary: "Cabinet '{{- volume_entity -}}' dismounted (in the stacks)."
        - stop: dismount_cabinet complete
          response_variable: final_response
      # ── set_cabinet_ro — stamp cabinet_ro: true in VolumeInfo flags ──────────
      # Blocked on syscab — use zen_admintools_prompt_loader or
      # zen_admintools_cabinetadmin_factory to manage the syscab RO flag.
      # Idempotent: safe to call if cabinet_ro is already true.
      - conditions:
        - condition: template
          value_template: "{{- action_type == 'set_cabinet_ro' -}}"
          alias: Set Cabinet RO Flag
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: "{{- volume_entity == 'sensor.zenos_system_cabinet' -}}"
            sequence:
            - variables:
                final_response:
                  status: error
                  failure: syscab_write_blocked
                  message: >-
                    set_cabinet_ro blocked on sensor.zenos_system_cabinet.
                    The syscab cabinet_ro flag is managed by zen_admintools_prompt_loader
                    and zen_admintools_cabinetadmin_factory (admin plane). Use those tools.
                  volume_entity: "{{- volume_entity -}}"
            - stop: Syscab set_cabinet_ro blocked
              response_variable: final_response
          default:
          - variables:
              _scro_vi_raw: '{{- initial_volume.get(''AI_Cabinet_VolumeInfo'', {}) if initial_volume is mapping else {} -}}'
              _scro_vi_mapped: '{{- _scro_vi_raw if _scro_vi_raw is mapping else {} -}}'
              _scro_vi_val_raw: '{{- _scro_vi_mapped.get(''value'', _scro_vi_mapped) -}}'
              _scro_vi_val: '{{- _scro_vi_val_raw if _scro_vi_val_raw is mapping else (_scro_vi_val_raw | from_json if _scro_vi_val_raw is string else {}) -}}'
              _scro_flags: '{{- _scro_vi_val.get(''flags'', {}) -}}'
              _scro_flags_mapped: '{{- _scro_flags if _scro_flags is mapping else {} -}}'
              _scro_ro_already: '{{- _scro_flags_mapped.get(''cabinet_ro'', false) == true -}}'
          - if: '{{- _scro_ro_already -}}'
            then:
            - variables:
                final_response:
                  status: ok
                  message: "cabinet_ro already true on '{{- volume_entity -}}'. No change."
                  volume_entity: "{{- volume_entity -}}"
                  cabinet_ro: true
            - stop: Already RO
              response_variable: final_response
          - event: set_variable_legacy
            event_data:
              key: AI_Cabinet_VolumeInfo
              value: "{{- {'value': _scro_vi_val | combine({'flags': _scro_flags_mapped | combine({'cabinet_ro': true})})} -}}"
              volume_entity: "{{- volume_entity -}}"
              set_timestamp: true
          - variables:
              final_response:
                status: success
                message: "cabinet_ro: true stamped on '{{- volume_entity -}}'."
                volume_entity: "{{- volume_entity -}}"
                cabinet_ro: true
          - stop: set_cabinet_ro complete
            response_variable: final_response
      # ── RELABEL ────────────────────────────────────────────────────────────────
      # Updates _label_index only — does NOT touch the drawer value.
      # Use when tagging an existing drawer without modifying its content.
      # Large payload drawers (kata components, etc.) should ALWAYS use relabel
      # instead of passing the full value through an update call.
      # ───────────────────────────────────────────────────────────────────────────
      - conditions:
        - condition: template
          value_template: "{{- action_type == 'relabel' -}}"
          alias: Relabel drawer (label index only)
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: "{{- key == '' or not key_exists_initial -}}"
            sequence:
            - variables:
                final_response:
                  status: error
                  failure: drawer_not_found
                  message: "relabel requires an existing drawer key. '{{- raw_key -}}' not found in this cabinet."
                  volume_entity: "{{- volume_entity -}}"
                  key: "{{- key -}}"
            - stop: relabel — drawer not found
              response_variable: final_response
          - conditions:
            - condition: template
              value_template: "{{- existing_drawer_is_ro -}}"
            sequence:
            - variables:
                final_response:
                  status: error
                  failure: drawer_ro
                  message: "relabel blocked: drawer '{{- key -}}' is read-only (zen_scroll)."
                  volume_entity: "{{- volume_entity -}}"
                  key: "{{- key -}}"
            - stop: relabel — drawer is ro
              response_variable: final_response
          default:
          - event: set_variable_legacy
            event_data:
              key: _label_index
              value: "{{- updated_label_index -}}"
              set_timestamp: true
              volume_entity: "{{- volume_entity -}}"
          - variables:
              final_response:
                status: success
                message: "Labels updated on drawer '{{- key -}}' (index only — drawer value unchanged)."
                volume_entity: "{{- volume_entity -}}"
                entry:
                  drawer: "{{- key -}}"
                  labels_applied: "{{- accepted_entity_labels -}}"
                  labels_dropped: "{{- dropped_labels -}}"
                caller_token: "{{- caller_token | trim -}}"
          - stop: relabel complete
            response_variable: final_response
      default:
      - variables:
          final_response:
            status: error
            message: Uncaught Exception. Use 'help' for usage.
      - stop: Invalid parameters
        response_variable: final_response
    alias: Zen DojoTools FileCabinet
    description: "Zen DojoTools FileCabinet (v4.5.x+) 100% More Health, No Bad JSON!
      No more ghost Writes, output mapping, Parser engages on Create / Update to validate
      input.\nCabinetVolumes are The Library's storage. To use ALWAYS pull a Volume
      Manifest 'Manifest' (list of all volumes with rich metadata) FIRST if you do not
      already have it loaded to see what's available. calling the manifest by issuing
      a READ - with None, '', or '*' for 'volume_entity' A directory of a single volume
      (with labels) can be obtained by sending \n  read - valid 'volume_entity' and
      'drawer' with None, '', or '*'\nSUPERPOWER! Combine with The Index - Read by label_targets
      (yes, a list) to scan drawers for subjects. STRONG recommendation to HELP() and
      pull a manifest - READ() immediately.\nIMPORTANT: Read By Label is currently limited
      to ONE cabinet at a time.\nMOUNT OPS: set_mount links a drawer in this volume to another cabinet by GUID (requires key +
      target_guid). remove_mount unlinks it. Both verify the write and return previous_guid for undo.\nCABINET MOUNT/DISMOUNT: mount_cabinet / dismount_cabinet flip meta.mounted (state: online_mounted / online_unmounted). dismount_cabinet blocked if cabinet holds a zen_default_* label — transfer first. Both fire zen_event on completion.\nRO DRAWERS: Include 'zen_scroll' in label_input to make a drawer read-only (one-way — removing the label later does NOT revert ro). ro drawers block all create/update/delete — no force bypass. Use CabinetAdmin set_ro_flag to clear.\nCLONE: clone copies all cabinet drawers to destination_cabinet. Default: destination gets a new GUID (source untouched). With transfer_guid+force_action: GUID travels to destination, source is cleared and marked needs_restamp (Highlander mode — one cabinet owns a GUID).\n\u26a0\ufe0f SYSTEM CABINET (sensor.zenos_system_cabinet) IS HARD READ-ONLY to FileCabinet. It holds the AI prompt substrate (Purpose, Directives, Cortex). All writes are blocked — no force_action bypass. Use zen_admintools_prompt_loader to update prompt primitives, or zen_admintools_cabinetadmin_factory for VolumeInfo repair. This is wire-level lockout — the tool cannot write there."
    fields:
      action_type:
        description: "'manifest', 'create', 'read', 'update', 'delete', 'move', 'copy', 'clone', 'set_mount', 'remove_mount', 'mount_cabinet', 'dismount_cabinet', 'set_cabinet_ro', 'relabel', 'help' (default: help). relabel: updates _label_index only — does NOT touch drawer value, no value param required. NOTE: sensor.zenos_system_cabinet (syscab) is hard read-only — all write actions blocked. Use zen_admintools_prompt_loader or zen_admintools_cabinetadmin_factory for syscab operations."
        required: true
        selector:
          select:
            options:
            - manifest
            - create
            - read
            - update
            - delete
            - move
            - copy
            - clone
            - set_mount
            - remove_mount
            - mount_cabinet
            - dismount_cabinet
            - set_cabinet_ro
            - relabel
            - help
        default: manifest
      volume_entity_id:
        description: Target volume entity_id (NOT guid, must be valid cabinet). Use
          any of [ None, '', '*'] to return manifest.  On move / copy only accepts first
          entry as source.
        required: false
        selector:
          entity:
            multiple: true
            filter:
            - domain: sensor
        name: volume_entity
      key:
        description: Drawer to act on.  Drawer names are slugified so 'My Partner' ==
          'my_partner' (required for create/update/delete; blank or '*' returns all
          values)
        required: false
        selector:
          text:
        name: drawer
      value:
        description: Raw value to store under the drawer (required for create/update)
        required: false
        selector:
          text:
            multiline: true
      set_timestamp:
        description: Boolean. Store ISO timestamp alongside value. Defaults to false.
        required: false
        selector:
          boolean:
        default: false
      label_input:
        description: Optional. A list of label/tags to associate with this drawer (create/update).
          Comma- or newline-separated.
        required: false
        selector:
          text:
            multiline: false
        name: labels
      expires_after:
        description: Optional. ISO 8601 datetime after which the GC system may expire
          this drawer (e.g. 2026-12-31T23:59:59). Stored in meta. Enforcement is handled
          by the GC kata, not the write path.
        required: false
        selector:
          text:
        name: Expires After
      no_autoexpire:
        description: Optional. When true, the GC system will not auto-expire this drawer
          even if expires_after has passed. Useful for pinned drawers.
        required: false
        selector:
          boolean:
        default: false
        name: No Autoexpire
      no_autorecycle:
        description: Optional. When true, the GC system will not recycle (delete) this
          drawer during cleanup passes. Preserves the drawer indefinitely.
        required: false
        selector:
          boolean:
        default: false
        name: No Autorecycle
      acl:
        description: Optional. JSON object defining drawer-level access control. Same
          structure as cabinet-level ACL. Stored in meta for GC / policy enforcement.
        required: false
        selector:
          text:
            multiline: true
        name: Drawer ACL
      description:
        description: Optional. Human-readable description of this drawer (max 255 chars).
          Surfaced by the Inspect tool.
        required: false
        selector:
          text:
            multiline: false
        name: Description
      label_targets:
        description: Optional. When reading, filters the returned data by label(s).
          Accepts list of valid labels, a single label, or '*'. Blank returns all.
        required: false
        selector:
          text:
            multiline: false
      show_hidden_volumes:
        selector:
          boolean:
        name: Show Hidden Volumes
        description: Show Hidden / System Volumes (Usually, this is not recommended,
          only use when you're trying to debug, confirm etc.)  System Drawers are always
          hidden.
        required: true
      show_stacks:
        selector:
          boolean:
        name: Show Stacks
        description: Include online_unmounted (stacks) cabinets in manifest results.
        required: false
        default: false
      #start:
      #  description: Start time in ISO 8601. Used when searching for entities updated
      #    or changed after... Defaults to no end date [Experimental - currently unused]
      #  required: false
      #  selector:
      #    text:
      #end:
      #  description: End time in ISO 8601. Used when searching for entities updated
      #    or changed before... Defaults to no end date [Experimental - currently unused]
      #  required: false
      #  selector:
      #    text:
      #filter_domain:
      #  description: Filter result list for entities in this domain Defaults to no end
      #    date [Experimental - currently unused]
      #  selector:
      #    text:
      #filter_state_operand:
      #  description: Filter result list for entities with this operand (must use filter_op)  [Experimental
      #    - currently unused]
      #  selector:
      #    text:
      #  name: Filter Operand
      filter_op:
        description: Filter entity by entity matching state using this operation with
          filter operand to obtain a filtered result [Experimental - currently unused]
        selector:
          select:
            options:
            - equals
            - contains
            - not
            - above
            - below
            - 'true'
            - 'false'
        name: Filter Operation
      force_action:
        description: Set flag true to pre-confirm certain advanced actions - see documentation
          for details
        required: false
        selector:
          boolean:
        default: false
      destination_cabinet:
        selector:
          entity:
        name: Destination Cabinet
        description: Target Cabinet, REQUIRED for Move / Copy / Clone Actions. Must
          be valid cabinet.
      destination_drawer:
        selector:
          text:
        name: Destination Drawer
        description: "Target Drawer, REQUIRED for Move / Copy Actions. Drawer name will be slugified - 'My Partner' == 'my_partner'"
      transfer_guid:
        selector:
          boolean:
        name: Transfer GUID
        description: 'Clone only. When true: GUID travels with content to destination,
          source is cleared and marked for restamp. Destructive and irreversible —
          requires force_action: true.'
        default: false
        required: false
      target_guid:
        selector:
          text:
        name: Target GUID
        description: Cabinet volume GUID to mount. REQUIRED for set_mount. Must match
          AI_Cabinet_VolumeInfo.value.id on an existing cabinet sensor.
        required: false
      caller_token:
        name: Caller Token
        description: >-
          Optional. Caller identity token. When provided, echoed in response
          to confirm receipt. Reserved for SP1 access control enforcement —
          no behavior change in current version. Defaults to '' (anonymous/guest).
        required: false
        default: ''
        selector:
          text:
      create_label:
        name: Create Label
        description: >-
          When true, auto-creates any HA labels in label_input that do not exist
          in the label registry before writing. Errors with failure: label_create_failed
          if creation fails. Default false.
        required: false
        default: false
        selector:
          boolean:
    icon: mdi:folder-key
