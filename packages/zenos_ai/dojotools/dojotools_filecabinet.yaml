                    "destination_path": "Required for same-stack move/copy.",
                    "destination_stack": "Cross-stack target (wiki|cabinet). Omit for same-stack.",
                    "destination_volume_entity_id": "Required when destination_stack=cabinet.",
                    "path_prefix": "Prefix filter for list action.",
                    "query": "Full-text search. wiki: supported. cabinet: label + text scan (matches content/title/key).",
                    "anchor_type": "Anchor type for stacks_by_anchor.",
                    "anchor_ids": "List of anchor IDs for stacks_by_anchor.",
                    "force_action": "create: overwrite if key exists. Default: fail if exists.",
                    "expires_after": "GC: ISO8601 expiry datetime string.",
                    "no_autoexpire": "GC bool: suppress auto-expire on this drawer. Omit to preserve existing.",
                    "no_autorecycle": "GC bool: suppress auto-recycle on this drawer. Omit to preserve existing.",
                    "destination_cabinet": "Infra: target cabinet entity for clone/set_mount operations.",
