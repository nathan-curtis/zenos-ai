                    — mount traversal routes writes to this cabinet automatically.
                  trace:
                    caller_token: "{{ _caller_token }}"
            - stop: filecabinet expansion cabinet write blocked
              response_variable: result
        - variables:
            _w_vol: >-
              {%- set _dr = (state_attr(_vol, 'variables') or {}).get(_key) -%}
              {%- set _dv_s = (_dr.get('value') or none) if _dr is mapping else none -%}
              {%- set _dv = _dv_s if _dv_s is mapping else (_dv_s | from_json(none) if _dv_s is string and _dv_s | trim not in ['', 'null', 'None'] else none) -%}
              {{ _dv.get('target_entity_id', _vol) if (_dv is mapping and _dv.get('mount_point', false) == true and _dv.get('target_entity_id', '') != '') else _vol }}
            _w_is_mount: >-
              {%- set _dr = (state_attr(_vol, 'variables') or {}).get(_key) -%}
              {%- set _dv_s = (_dr.get('value') or none) if _dr is mapping else none -%}
              {%- set _dv = _dv_s if _dv_s is mapping else (_dv_s | from_json(none) if _dv_s is string and _dv_s | trim not in ['', 'null', 'None'] else none) -%}
              {{ _dv is mapping and _dv.get('mount_point', false) == true and _dv.get('target_entity_id', '') != '' }}
        - variables:
            _upd_raw: >-
              {{ (state_attr(_w_vol, 'variables') or {}).get(_key) }}
        - variables:
            _upd_val: >-
              {{ _upd_raw.get('value') if _upd_raw is mapping else none }}
        - variables:
            _upd_is_v1: >-
              {{ _upd_val is mapping and _upd_val.get('v') == 1 and 'content' in _upd_val }}
        - choose:
          - conditions:
            - condition: template
              value_template: >-
                {%- set _prefix = _key ~ '/' -%}
                {%- set _chk_vars = state_attr(_vol, 'variables') or {} -%}
                {%- set ns = namespace(has_children=false) -%}
                {%- for _ck in (_chk_vars.keys() | list) -%}
                  {%- if _ck.startswith(_prefix) -%}{%- set ns.has_children = true -%}{%- endif -%}
                {%- endfor -%}
                {{ _upd_raw is none and not _force_action and not ns.has_children }}
            sequence:
            - variables:
                result:
                  status: not_found
                  tool: zen_sutra_filecabinet
                  action: update
                  key: "{{ _key }}"
                  volume: "{{ _vol }}"
                  message: Key not found. Use create or upsert, or pass force_action=true to create-if-missing.
                  trace:
                    caller_token: "{{ _caller_token }}"
            - stop: filecabinet sutra update not found
              response_variable: result
        - variables:
            _old_content: >-
              {%- if _upd_is_v1 -%}{{ _upd_val.get('content', {}) }}
              {%- elif _upd_val is mapping -%}{{ _upd_val }}
              {%- elif _upd_val is string and (_upd_val | trim)[:1] in ['{','['] -%}{{ _upd_val | from_json({}) }}
              {%- else -%}{{ _upd_val | default('') }}{%- endif -%}
            _new_title: >-
              {%- if _title != '' -%}{{ _title }}
              {%- elif _upd_is_v1 -%}{{ _upd_val.get('title', _key) }}
              {%- else -%}{{ _key }}{%- endif -%}
        - variables:
            _new_content: >-
              {%- if _content == '' -%}{{ _old_content }}
              {%- elif _mode == 'replace' -%}{{ _content }}
              {%- elif _old_content is mapping and _content is mapping -%}{{ _old_content | combine(_content, recursive=true) }}
              {%- elif _old_content is mapping -%}{{ _old_content | combine(_content if _content is mapping else {}, recursive=true) }}
              {%- else -%}{{ _content }}{%- endif -%}
        - variables:
            _upd_value: "{{ _new_content }}"
        - event: set_variable_legacy
          event_data:
            key: "{{- _key -}}"
            value: "{{ _upd_value }}"
            volume_entity: "{{- _w_vol -}}"
            set_timestamp: true
        - wait_template: >-
            {{ (state_attr(_w_vol, 'variables') or {}).get(_key, {}).get('timestamp', '') >= _now }}
          timeout: "00:00:30"
          continue_on_timeout: true
        - variables:
            _write_verified: "{{ wait.completed }}"
        - variables:
            _tags_for_index: >-
              {%- set _tr = tags | default('', true) -%}
              {%- if _tr is sequence and not _tr is string -%}
                {{- _tr | map('string') | map('lower') | map('slugify') | select('string') | list -}}
              {%- elif _tr is string and _tr | trim != '' -%}
                {{- _tr | replace('\n', ',') | regex_findall('[^,]+') | map('trim') | map('lower') | map('slugify') | select('string') | list -}}
              {%- else -%}
                []
              {%- endif -%}
        - variables:
            _updated_label_index: >-
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
              {%- set _v_s = CABS.cabinet_variables(_vol) -%}
              {%- set _v = _v_s if _v_s is mapping else (_v_s | from_json(none) if _v_s is string else none) -%}
              {%- set _ci = ((_v if _v is mapping else {}).get('_label_index', {}).get('value', {})) -%}
              {%- set _ci = _ci if _ci is mapping else (_ci | from_json(none) if _ci is string and _ci | trim not in ['', '{}', 'null'] else {}) -%}
              {%- set _ci = _ci if _ci is mapping else {} -%}
              {%- set _ds = _key -%}
              {%- set _ns = namespace(val = dict(_ci)) -%}
              {%- for _lbl in _tags_for_index -%}
                {%- if _create_label or _lbl in labels() -%}
                  {%- set _e = _ns.val.get(_lbl) -%}
                  {%- set _ex = (_e if _e is iterable and not _e is string else [_e] if _e not in [none, ''] else []) -%}
                  {%- set _ns.val = _ns.val | combine({_lbl: (_ex + [_ds]) | unique | list}) -%}
                {%- endif -%}
              {%- endfor -%}
              {{- _ns.val -}}
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _tags_for_index | length > 0 }}"
            sequence:
            - event: set_variable_legacy
              event_data:
                key: _label_index
                value: "{{- _updated_label_index | tojson -}}"
                set_timestamp: true
                volume_entity: "{{- _vol -}}"
        - variables:
            _tags_dropped: >-
              {%- set _all = labels() -%}
              {%- set _ns = namespace(d=[]) -%}
              {%- for _lbl in _tags_for_index -%}
                {%- if _lbl not in _all -%}{%- set _ns.d = _ns.d + [_lbl] -%}{%- endif -%}
              {%- endfor -%}
              {{ _ns.d }}
        - if: "{{ _create_label and _tags_dropped | length > 0 }}"
          then:
            - repeat:
                for_each: "{{ _tags_dropped }}"
                sequence:
                  - action: homeassistant.create_label
                    data:
                      name: "{{ repeat.item }}"
        - variables:
            result:
              status: success
              tool: zen_sutra_filecabinet
              action: update
              key: "{{ _key }}"
              volume: "{{ _vol }}"
              title: "{{ _new_title }}"
              mode: "{{ _mode }}"
              updated_at: "{{ _now }}"
              write_verified: "{{ _write_verified }}"
              mount_traversal: "{{ {'traversed': true, 'target_vol': _w_vol} if _w_is_mount else none }}"
              tags_dropped: "{{ [] if _create_label else _tags_dropped }}"
              labels_created: "{{ _tags_dropped if _create_label else [] }}"
              trace:
                caller_token: "{{ _caller_token }}"
        - stop: filecabinet sutra update done
          response_variable: result

