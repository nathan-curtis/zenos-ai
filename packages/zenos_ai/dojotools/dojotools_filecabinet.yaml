                    "per_drawer_meta_ro": "A drawer with meta.ro=true is read-only. All write actions blocked on that drawer — no override.",
                    "health_gate": "Writes are blocked when cabinet health.status=error, guid_mismatch, not writeable, or storage_warning (unless force_action=true on storage_warning)."
                  },
                  "usage_examples": {
