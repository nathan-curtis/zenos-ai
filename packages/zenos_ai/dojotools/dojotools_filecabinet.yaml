###############################################################################
# ZenOS-AI: FileCabinet DojoTool + FileCabinet Sutra
# File: dojotools_filecabinet.yaml
# Version: 6.35.0 -- mode is the action field on the agent-facing wrapper too
#   (#10259, option A); write_mode (merge|replace) says how a write lands,
#   on the wrapper and the engine. action_type and the legacy mode:
#   merge|replace stay as aliases, so existing callers keep working (the
#   caller sweep is future work). Every FileCabinet call in this file now
#   uses mode and write_mode.
# 6.34.0 -- the agent-facing wrapper (zen_dojotools_filecabinet) is
#   single-exit (#10402 / #10561 / #10437): every route sets result and falls
#   through to one stop; a later step runs only while result is not defined,
#   so a cross-stack move never deletes its source after a failed write or a
#   copy, and weave never compiles after weave_save or a missing definition.
#   A failed engine call now answers with an error naming the stack instead
#   of returning nothing. The tool manifest reports the real version.
# 6.33.1 -- lens register and unregister go through the central
#   lens writer (prompt_loader lens_registry) instead of writing the
#   household cabinet directly, and inspect reads the registry through an
#   expanded drawer, so lens_registry can be expanded without being wiped.
#   The gate names the cabinet on expand_drawer / collapse_drawer (their
#   source_cabinet) in its refusal, the live-ack prompt and the audit log;
#   it printed an empty volume there.
# 6.33.0 -- the ACL gate can enforce (#10630 / #10633). Its mode
#   is the system cabinet's fc_acl_mode drawer (CABS acl_enforce_mode 1.7.0),
#   which only the admin door writes; missing means audit, the default, and
#   nothing changes until it is set. In enforce, a would-deny is refused with
#   guarded: (the checks ride on the answer as acl_audit), and an op whose rule
#   asks for a live ack asks the household admin through identity
#   request_live_ack (the console override stands in); not granted = denied.
#   Every check is logged as before, now with the mode.
# 6.32.0 -- labels follow drawers in expanded trees. The label index
#   lives in the cabinet a caller addresses, keyed by the drawer's path, so an
#   expanded drawer's labels stay in its host's index. move / copy / delete of
#   an expanded tree carry its labels to the destination keys (move, delete
#   take them off the source); relabel takes a key the expansion holds; search
#   reads the real drawers behind an expanded root (CABS cabinet_resolved_view
#   1.6.4), so a label or text match finds them; collapse_drawer folds any
#   labels the expansion itself holds back into the host. Fixed: a copy to
#   another cabinet built the destination's index from the source's index and
#   replaced the destination's labels with it; delete left its children's
#   labels in the index; relabel and create answered before their index write
#   landed, so two label writes in a row lost the first; a label search
#   missed every nested drawer (a/b) because it compared a slug.
# 6.31.0 -- softlinks from and to expanded drawers. set_mount and
#   remove_mount under an expanded root act in the expansion that holds the
#   tree (the root's own pointer stays immutable); a softlink pointing at an
#   expanded drawer, or one inside an expanded tree, resolves through every hop
#   (CABS fc_resolve 1.6.3) and the gate checks each one, the expansion hop
#   included, before the target's ACL decides. Inside an expanded tree delete
#   removes a softlink like any drawer; move and copy refuse it as they do any
#   mount (force_action carries the pointer as is). expand_drawer and
#   collapse_drawer carry softlinks in the tree unchanged and refuse one that
#   would point at its own cabinet afterwards.
# 6.30.0 -- expanded trees are transparent to move / copy / delete:
#   they run on the real drawers wherever they live (a destination under an
#   expanded root lands in its expansion), with a size check per destination
#   cabinet before any write and a take-back on a failed write. Pointers are
#   immutable: expand_drawer creates them, move / delete / collapse_drawer
#   remove them; remove_mount and set_mount refuse them. An expansion an
#   operation leaves empty is torn down. expand_drawer takes root drawers only.
# 6.29.0 -- an expanded drawer is a permanent redirect for its whole
#   tree: a child written after the move lands in the expansion (CABS
#   fc_resolve), and get/list show the cabinet and its expansions as one tree
#   (CABS cabinet_expanded_view). expand_drawer runs once per drawer: a drawer
#   that is already expanded, or a tree holding any mount pointer, is refused
#   before anything is written. One expansion holds ONE drawer and its children.
#   New collapse_drawer undoes it: size preflight (refused if the tree will not
#   fit back), copies the tree back over its pointers (children first, root
#   last), verifies byte for byte (a failure puts the pointers back, the
#   expansion untouched), then tears the slot down (copies removed, expansion
#   stamp off VolumeInfo, dismounted).
# 6.28.1 -- expand_drawer moves a drawer and its whole subtree into an
#   expansion slot unchanged (value, meta, the drawer's own acl), one mount
#   pointer per key; target optional (a free slot). Mounts the slot; VolumeInfo merged (id, flags, acls
#   kept); byte-for-byte verify and a resolve proof before success; full
#   rollback on any failure. The expansion answers with its host's ACL.
#   ACL gate: every hop of a mount chain is checked (r on each pointer, the
#   action's op on the drawer it ends on); expand_drawer checks a on the source.
# 6.27.0 -- caller origin (#10626): zen_dojotools_filecabinet stamps
#   caller_origin=agent on every engine call; any other caller is internal
#   (@internal, and @tool:<caller_tool> in an ACL). The gate checks the
#   class default ops and the built-in drawer locks; still audit only.
# 6.26.0 -- ACL gate, audit only (#10626/#10633): the resolved target's ACL
#   (drawer -> cabinet -> default per op; move/copy also check w on the
#   destination) against the caller (ID.caller, only when a rule needs it).
#   A would-deny or would-ack is logged (fc_acl_audit) and answered as
#   acl_audit; nothing is refused yet.
# 6.25.0 -- the target resolves once, before the gate (CABS.fc_resolve, #10626):
#   get and the writes follow the whole mount chain (writes followed one hop);
#   a chain that loops, runs too deep or has no target refuses before dispatch.
# 6.24.0 -- every dispatch branch is single-exit: a refusal sets result and
#   the rest of its sequence runs only while nothing has answered; the engine has
#   one exit at the bottom.
# 6.23.0 -- the pre-dispatch guards fall through (each sets result and
#   only fires while nothing has answered), and the read/write/scan aliases resolve
#   before them: a direct engine call with action write skipped every write guard
#   (system cabinet, read-only, protected drawer, reserved key, health).
# 6.22.0 -- delete is single-exit (not found and done fall through); an
#   unconfirmed delete answers error/write_unverified and logs a warning; the
#   answer counts the child drawers removed. list falls through to the one exit.
# 6.21.0 -- create is single-exit (expansion refusal, missing args, exists
#   and done fall through); an unconfirmed write answers error/write_unverified
#   and logs a warning. Callers call the engine directly.
# 6.20.0 -- update is single-exit (expansion refusal, not found and done
#   fall through); an unconfirmed write answers error/write_unverified, and both
#   a missing key and an unconfirmed write log a warning (callers that never read
#   the answer still leave a trace). Callers state replace and call the engine.
# 6.19.0 -- upsert is single-exit (expansion refusal and done fall through)
#   and reports status error, code write_unverified, when the cabinet never
#   confirmed the write (it said success regardless). Callers state merge or
#   replace and call the engine directly.
# 6.18.0 -- one taxonomy: drawer content is read from value, result is
#   only the tool envelope. read stays an alias of get and returns exactly what
#   get returns (the {path: value} result map is retired, engine and wrapper).
# 6.17.1 -- get is single-exit: its seven exits (mount error, cache hit,
#   cycle, not-a-script, resolved, mount error, done) set result and fall through
#   to the engine's one exit.
# 6.17.0 -- SESE frame (#10561): one gate block before dispatch (read/
#   write/scan aliases, label_input, init-state write guard -- refusals set
#   result); every dispatch runs only while result is undefined; one exit at the
#   bottom (read-alias reshape). Branches convert to fall-through as touched.
# 6.16.1 -- perf: cabinet reads take the variables attribute as the mapping
#   it is (CABS.cabinet_variables pretty-printed the whole cabinet to JSON and
#   each caller parsed it back, on every get/write/move/list: O(cabinet size)).
# 6.16.0 -- expiry is universal: create/update/upsert send expires_after/
#   no_autoexpire/no_autorecycle as the drawer's envelope meta (beside value);
#   move carries meta; get reports it (v1 value as legacy fallback).
# 6.15.4 -- move refuses a destination that resolves to the source key
#   (it wrote the drawer onto itself, then deleted it: data loss).
# 6.15.3 -- no mode/action_type/volume/path returns roots, this tool's own map
#   (knowledge=manifest, what=list, read=get, find=search) from its tool_manifest modes.
#   Previous: 6.15.2 -- expand_drawer refusal names the real reason (target_is_expansion_slave /
#   target_cabinet_not_empty / target_cabinet_not_ready); tool_manifest version synced to the header.
#   Previous: Version: 6.15.1 — expansion-slot candidates and the free-slot rule come from the canonical slot map (cabinet_slot_candidates / cabinet_slot_status in zenos_cabinets.jinja), so expand_drawer and the expansion cleanup agree on what counts as a free slot. (zen_sutra_filecabinet 6.2.2).
#   Previous: Version: 6.15.0 — live-mount tool-call resolver refuses a self-referential or circular fc_args mount (tool_call_cycle_detected). An in-flight marker on the drawer is checked before dispatch and cleared on every exit (success, blocked, error); the cache-hit check runs first and never touches the marker. (zen_sutra_filecabinet 6.2.1). zen_dojotools_filecabinet 6.9.1: move/copy carries a cabinet source's value field.
#   Previous: 6.14.0 — live-mount (fc_args) tool-call resolver now unwraps the cadillac {result:{...}} envelope immediately after the call, before digest_fields/raw-store (#10481 root cause — every fc_args mount was storing/serving the raw envelope).
#   Previous: 6.13.0 — hard block _label_index in set_mount + expand_drawer: unsupported until traversal handles mount-pointer index reads.
#   Previous: 6.12.0 — fleet discovery: broad zenos_.*_cabinet pattern (catches history, index, expansion); history role classification.
#   Previous: 6.11.0 — fleet mode: single-call full cabinet fleet view (named + expansion), GUIDs, mount resolution, fat/broken/slot hints.
#   Previous: 6.10.0 — sutra fields: add destination_volume_entity_id (was missing, caused _dest_vol='' on cross-cabinet copy).
#   Previous: 6.9.0 — copy cross-cabinet bug fix: write + verify now target _dest_vol, not source _vol.
#   Previous: 6.8.0 — sitrep discovery via states.sensor (finds unlabeled cabs); system drawers excluded from empty-target + user_keys checks.
#   Previous: 6.7.0 — raw_key=true (REPAIRS ONLY): skip slugification, requires force_action=true confirmation.
#   Previous: 6.6.0 — expansion_sitrep: inventory all expansion cabinets, usage, % full, target eligibility.
#   Previous: 6.5.0 — expansion cabinet class: locked write target, hosted_by parent, stamp on expand_drawer completion.
#   Previous: 6.3.0 — Write-mount traversal: create/update/upsert follow mount_point drawers transparently.
#   Previous: 6.2.0 — Cabception: nested drawer trees via / path separator.
#   get returns subdrawers+has_children when children exist (additive, no contract break).
#   move/delete cascade to all children (prefix scan). move child cascade is
#   write-verified before delete (same safety guarantee as parent node).
#   copy cascades subtree. inspect drawer_key surfaces subdrawers inline.
#   Previous: 6.1.2 — v5-parity repair pass (A1–A11)
#
# zen_sutra_filecabinet — internal terminus (NOT MCP-exposed)
# zen_dojotools_filecabinet       — MCP-facing surface (expose this to MCP)
#
# Layer stack:
#   zen_dojotools_filecabinet (DojoTool, MCP face)
#     ├─ stack=wiki    → zen_sutra_wikijs (existing)
#     └─ stack=cabinet → zen_sutra_filecabinet (this file)
#                          → CABS (reads) + set/remove_variable_legacy (writes)
#
# Storage format (v6.2+):
#   Each drawer:   { value: <raw content>, timestamp: <auto-set> }
#   value can be anything — string, dict, list.
#   Migration:     Old v1-envelope drawers (value = dict with v:1 + content key) are
#                  auto-detected on GET/LIST/SEARCH and unwrapped transparently.
#   meta key:      Reserved for future ACL use — not yet written by this sutra.
#
# Tags: HA Labels ARE the tag system — stored in _label_index drawer.
# Path: used as cabinet key directly (strip leading /).
#
# IMPORTANT — Two licensed cabinet access paths (HARD RULE, forever):
#   1. Call script.zen_dojotools_filecabinet — for ALL consumers
#   2. import CABS — ONLY here in zen_sutra_filecabinet (terminus)
#   This file is the terminus. It does NOT call script.zen_dojotools_filecabinet
#   on its own volume — that would create a loop at prod rename.
###############################################################################

script:

  ##############################################################################
  # SUTRA — Internal terminus. NOT MCP-exposed.
  ##############################################################################
  zen_sutra_filecabinet:
    alias: Zen DojoTools FileCabinet Sutra (Internal)
    description: >
      Internal FileCabinet terminus. NOT MCP-exposed. Implements the cabinet
      knowledge stack: get/create/update/upsert/delete/list/move/copy and
      Lens Bus contract v0.2.0. Called only by zen_dojotools_filecabinet.
      Cabception (v6.2.0): drawer keys using / as path separator form virtual
      trees. get returns subdrawers+has_children. move/delete/copy cascade
      to all children. move child writes are verified before source delete.
    mode: parallel
    icon: mdi:cabinet
    fields:
      mode:
        name: Mode
        description: "Dispatch: get|create|update|upsert|delete|list|move|copy|search|relabel|manifest|clone|set_mount|remove_mount|mount_cabinet|dismount_cabinet|set_cabinet_ro|stacks_by_anchor|register|unregister|inspect|health|audit|expand_drawer|collapse_drawer|fleet|help. Preferred over action: (legacy)."
        selector:
          select:
            options:
            - get
            - create
            - update
            - upsert
            - delete
            - list
            - move
            - copy
            - search
            - relabel
            - manifest
            - clone
            - set_mount
            - remove_mount
            - mount_cabinet
            - dismount_cabinet
            - set_cabinet_ro
            - stacks_by_anchor
            - register
            - unregister
            - inspect
            - health
            - audit
            - help
            - expand_drawer
            - collapse_drawer
            - tool_manifest
      action_type:
        name: Action Type (legacy)
        description: "Legacy alias for mode:. Accepted for backcompat — use mode: going forward."
        selector:
          select:
            options:
            - get
            - create
            - update
            - upsert
            - delete
            - list
            - move
            - copy
            - search
            - relabel
            - manifest
            - clone
            - set_mount
            - remove_mount
            - mount_cabinet
            - dismount_cabinet
            - set_cabinet_ro
            - stacks_by_anchor
            - register
            - unregister
            - inspect
            - health
            - audit
            - expand_drawer
            - collapse_drawer
      volume_entity_id:
        name: Volume Entity ID
        description: Cabinet sensor entity ID to operate on.
        selector:
          text:
      path:
        name: Path
        description: "Drawer key (path is used as key). Required for get/create/update/upsert/delete/move/copy."
        selector:
          text:
      title:
        name: Title
        description: Document title (required for create/upsert).
        selector:
          text:
      description:
        name: Description
        description: Short document description.
        selector:
          text:
      value:
        name: Value
        description: Drawer value (cabinet) or page content (wiki). Required for create/update/upsert. FC handles serialization — do NOT tojson before passing.
        selector:
          text:
            multiline: true
      merge:
        name: Merge
        description: "Force merge (deep-merge into existing value) regardless of action. Omit to use action default (update=replace, all others=merge)."
        required: false
        selector:
          boolean:
      write_mode:
        name: Write Mode
        description: "How a write lands: merge or replace. Wins over merge and the legacy mode: merge|replace. Omit for the action's default."
        required: false
        selector:
          select:
            options:
            - merge
            - replace
      destination_path:
        name: Destination Path
        description: Target key for move or copy.
        selector:
          text:
      destination_volume_entity_id:
        name: Destination Volume Entity ID
        description: "Target cabinet entity_id for cross-cabinet copy/move (e.g. sensor.zenos_expansion_cabinet_1)."
        required: false
        selector:
          text:
      path_prefix:
        name: Path Prefix
        description: Filter list results to keys starting with this prefix.
        selector:
          text:
      anchor_type:
        name: Anchor Type
        description: "Lens anchor type: label | concept | area_id | zone | person"
        selector:
          select:
            options:
            - label
            - concept
            - area_id
            - zone
            - person
            - product
            - ticket
            - document
            - company
            - household
        default: label
      anchor_ids:
        name: Anchor IDs
        description: Comma-separated or JSON array of anchor IDs for stacks_by_anchor.
        selector:
          text:
      tags:
        name: Tags / Labels
        description: "Comma-separated or JSON array of HA labels. Used by relabel (updates _label_index for the drawer)."
        selector:
          text:
      query:
        name: Search Query
        description: "Text to match against drawer key, title, content, or description. Used by search action."
        selector:
          text:
      source_created_at:
        name: Source Created At
        description: "Provenance timestamp from cross-stack transfer source. Sets created_at in envelope."
        required: false
        selector:
          text:
      expires_after:
        name: Expires After
        description: "ISO 8601 datetime after which this drawer may be GC'd."
        required: false
        selector:
          text:
      no_autoexpire:
        name: No Auto-expire
        description: "If true, GC will not expire this drawer even past expires_after."
        required: false
        selector:
          boolean:
      no_autorecycle:
        name: No Auto-recycle
        description: "If true, GC will not recycle this drawer."
        required: false
        selector:
          boolean:
      force_action:
        name: Force Action
        description: "If true, create overwrites an existing key (same as upsert mode=replace)."
        required: false
        selector:
          boolean:
      raw_key:
        name: Raw Key
        description: "REPAIRS ONLY. Skip key slugification — use path exactly as given. Requires force_action=true or hard-rejects. Use only to repair keys written outside FC (e.g. raw events with hyphens) that can no longer be reached. Logs a warning on every use."
        required: false
        selector:
          boolean:
      create_label:
        name: Create Label
        description: "If true, auto-create any HA labels in tags that are not in the registry."
        required: false
        selector:
          boolean:
      destination_cabinet:
        name: Destination Cabinet
        description: "Target cabinet entity_id for clone."
        required: false
        selector:
          text:
      target_guid:
        name: Target GUID
        description: "Cabinet GUID to mount (required for set_mount)."
        required: false
        selector:
          text:
      show_hidden_volumes:
        name: Show Hidden Volumes
        description: "manifest: include hidden/system volumes."
        required: false
        selector:
          boolean:
      show_stacks:
        name: Show Stacks
        description: "manifest: include online_unmounted cabinets."
        required: false
        selector:
          boolean:
      transfer_guid:
        name: Transfer GUID
        description: "clone: GUID travels to destination (Highlander mode). Requires force_action=true."
        required: false
        selector:
          boolean:
      fc_args:
        name: FC Args
        description: "set_mount: JSON object for tool-call mount args."
        required: false
        selector:
          text:
      source_cabinet:
        name: Source Cabinet (expand_drawer only)
        description: Entity ID of the cabinet that currently holds the drawer to migrate.
        required: false
        selector:
          text:
      target_cabinet:
        name: Target Cabinet (expand_drawer only)
        description: Expansion slot to move the drawer into. Omit to pick a free slot. One expansion holds one drawer and its children; a drawer expands once.
        required: false
        selector:
          text:
      space_threshold:
        name: Space Threshold % (expand_drawer only)
        description: Abort if source stays at or above this % after migration. Default 85.
        required: false
        selector:
          number:
            min: 50
            max: 99
            mode: box
      caller_token:
        name: Caller Token
        selector:
          text:
      caller_origin:
        name: Caller Origin
        description: >-
          Set to agent by zen_dojotools_filecabinet on every call it makes
          here. Absent means a tool called the engine (@internal in an ACL).
        selector:
          text:
      caller_tool:
        name: Caller Tool
        description: >-
          The calling script's name, for @tool:<script> ACL rules. Ignored on
          an agent call. A tool sets it from a constant, never from its own input.
        selector:
          text:

    sequence:

    # --- Normalize inputs ---
    - variables:
        _action: >-
          {%- set _m = mode | default('', true) | string | trim | lower -%}
          {%- if _m != '' and _m not in ['merge', 'replace'] -%}{{ _m }}
          {%- else -%}{{ action_type | default(action | default('get', true), true) | string | trim | lower }}
          {%- endif -%}
        _vol: >-
          {%- set _vi = volume_entity_id | default('', true) -%}
          {%- if _vi is string -%}{{ _vi | trim }}
          {%- elif _vi is sequence and _vi is not mapping -%}{{ _vi | first | default('') | string | trim }}
          {%- elif _vi is mapping -%}
          {%- else -%}{{ _vi | string | trim }}{%- endif -%}
        _key: >-
          {%- set _rk = path | default(key | default('', true), true) | string | trim | regex_replace('^/', '') -%}
          {#- Special-cased system drawers are deliberately NOT lowercase
              (AI_Cabinet_VolumeInfo) or carry a leading underscore a caller
              may omit (_label_index, _zen_relationships) -- without this
              lookup, blind lowercase+slugify below permanently mismatches
              their real stored key, so action_type=get always falsely
              returns not_found for them regardless of cabinet, even though
              the data is present and valid. This is a lookup-layer
              fix only -- the real drawer names stay exactly as designed,
              on purpose; do not "normalize" them elsewhere. -#}
          {%- set _special_drawers = {
            'ai_cabinet_volumeinfo': 'AI_Cabinet_VolumeInfo',
            'label_index':           '_label_index',
            'zen_relationships':     '_zen_relationships'
          } -%}
          {%- set _segs = _rk.split('/') -%}
          {%- set _ns = namespace(parts=[]) -%}
          {%- for _seg in _segs -%}
            {%- set _s = _seg | lower | slugify -%}
            {%- set _s_nolead = _s[1:] if _s.startswith('_') else _s -%}
            {%- if loop.first and _s_nolead in _special_drawers -%}
              {%- set _ns.parts = _ns.parts + [_special_drawers[_s_nolead]] -%}
            {%- elif loop.first and _rk.startswith('_') -%}
              {%- set _ns.parts = _ns.parts + ['_' ~ _s[1:] if _s.startswith('_') else '_' ~ _s] -%}
            {%- else -%}
              {%- set _ns.parts = _ns.parts + [_s] -%}
            {%- endif -%}
          {%- endfor -%}
          {{- _ns.parts | join('/') -}}
        _title: "{{ title | default('', true) | string | trim }}"
        _description: "{{ description | default('', true) | string | trim }}"
        _content: >-
          {%- set _craw = value | default('') -%}
          {%- if _craw is mapping or (_craw is sequence and _craw is not string) -%}
            {{- _craw -}}
          {%- elif (_craw | string | trim)[:1] in ['{', '['] or (_craw | string | trim) in ['true', 'false', 'null'] -%}
            {%- set _cparsed = _craw | from_json(none) -%}
            {{- _cparsed if _cparsed is not none else _craw -}}
          {%- else -%}
            {{- _craw | string | trim -}}
          {%- endif -%}
        _mode: >-
          {%- set _ml = mode | default('', true) | string | trim | lower -%}
          {%- set _wm = write_mode | default('', true) | string | trim | lower -%}
          {%- if _wm in ['merge', 'replace'] -%}{{ _wm }}
          {%- elif merge | default(false) | bool -%}merge
          {%- elif _ml in ['merge', 'replace'] -%}{{ _ml }}
          {%- elif _action == 'update' -%}replace
          {%- else -%}merge{%- endif -%}
        _dest: >-
          {%- set _rd = destination_path | default('', true) | string | trim | regex_replace('^/', '') -%}
          {%- set _ns = namespace(parts=[]) -%}
          {%- for _seg in _rd.split('/') -%}{%- set _ns.parts = _ns.parts + [_seg | lower | slugify] -%}{%- endfor -%}
          {{- _ns.parts | join('/') -}}
        _path_prefix: >-
          {%- set _rp = path_prefix | default('', true) | string | trim | regex_replace('^/', '') -%}
          {%- set _ns = namespace(parts=[]) -%}
          {%- for _seg in _rp.split('/') -%}{%- set _ns.parts = _ns.parts + [_seg | lower | slugify] -%}{%- endfor -%}
          {{- _ns.parts | join('/') -}}
        _caller_token: "{{ caller_token | default('') }}"
        _origin: "{{ 'agent' if (caller_origin | default('', true) | string | trim | lower) == 'agent' else 'internal' }}"
        _hh: "{{ states('sensor.zen_default_household_cabinet_resolved') }}"
        _anchor_type: "{{ anchor_type | default('label') | string | trim | lower }}"
        _sc_at: "{{ source_created_at | default('', true) | string | trim }}"
        _anchor_ids_raw: >-
          {%- set raw = anchor_ids | default('', true) -%}
          {%- if raw is sequence and raw is not string -%}{{ raw | list }}
          {%- else -%}
            {%- set rs = raw | string | trim -%}
            {%- if rs == '' or rs == '[]' -%}{{ [] }}
            {%- elif rs[:1] == '[' -%}{{ rs | from_json | default([]) }}
            {%- else -%}{{ rs.split(',') | map('trim') | select | list }}{%- endif -%}
          {%- endif -%}
        _expires_after: "{{ expires_after | default('', true) | string | trim }}"
        _no_autoexpire: "{{ no_autoexpire | default(none) }}"
        _no_autorecycle: "{{ no_autorecycle | default(none) }}"
        # Drawer meta (expiry): sent with the write, kept on the drawer envelope
        # beside value. Omitted fields leave the stored meta alone.
        _gc_meta: >-
          {%- set ns = namespace(p={}) -%}
          {%- if (expires_after | default('', true) | string | trim) != '' -%}{%- set ns.p = dict(ns.p, expires_after=(expires_after | string | trim)) -%}{%- endif -%}
          {%- if no_autoexpire is defined and no_autoexpire is not none -%}{%- set ns.p = dict(ns.p, no_autoexpire=(no_autoexpire | bool)) -%}{%- endif -%}
          {%- if no_autorecycle is defined and no_autorecycle is not none -%}{%- set ns.p = dict(ns.p, no_autorecycle=(no_autorecycle | bool)) -%}{%- endif -%}
          {{ ns.p }}
        _force_action: "{{ force_action | default(false) | bool }}"
        _create_label: "{{ create_label | default(false) | bool }}"
        _dest_cab: "{{ destination_cabinet | default('', true) | string | trim }}"
        _dest_vol: "{{ destination_volume_entity_id | default('', true) | string | trim }}"
        _target_guid: "{{ target_guid | default('', true) | string | trim }}"
        _show_hidden: "{{ show_hidden_volumes | default(false) | bool }}"
        _show_stacks: "{{ show_stacks | default(false) | bool }}"
        _transfer_guid: "{{ transfer_guid | default(false) | bool }}"
        _fc_args: >-
          {%- set _r = fc_args | default('', true) -%}
          {%- if _r is mapping -%}{{ _r | tojson }}
          {%- elif _r is string and _r | trim != '' -%}{{ _r | trim }}
          {%- else -%}{%- endif -%}
        _now: "{{ now().isoformat() }}"
        _raw_key: "{{ raw_key | default(false) | bool }}"

    # Aliases resolve first: every guard below reads the canonical action, so a
    # write alias meets the same write guards as upsert.
    - variables:
        _action_in: "{{ _action }}"
        _action: "{{ {'read': 'get', 'write': 'upsert', 'scan': 'list'}.get(_action, _action) }}"
        tags: >-
          {%- set _t = tags | default('', true) -%}
          {{ _t if _t not in ['', none, []] else (label_input | default('', true)) }}

    # --- tool_manifest early exit ---
    - if: "{{ _action == 'tool_manifest' }}"
      then:
      - variables:
          result: >-
            {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
            {{- MF.tool_manifest(
              tool='zen_sutra_filecabinet',
              display_name='FileCabinet Sutra (Internal)',
              tier='sutra',
              version='6.2.3',
              health={'configured': true, 'status': 'ok', 'notes': []},
              required_labels=['dojotools'],
              optional_labels=['cabinet', 'knowledge'],
              failure_policy='hard',
              mcp_exposed=false,
              stripe=0,
              impact='hard',
              caller_token=_caller_token
            ) | from_json -}}

    # --- raw_key gate: requires force_action=true or hard-rejects ---
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ result is not defined }}"
        - condition: template
          value_template: "{{ _raw_key and not _force_action }}"
        sequence:
        - variables:
            result:
              status: error
              tool: zen_sutra_filecabinet
              action: "{{ _action }}"
              message: >-
                raw_key=true bypasses key slugification and can delete keys that were written
                outside FC — this is a destructive admin operation with no undo.
                You MUST also pass force_action=true to confirm you know what you are doing.
              trace:
                caller_token: "{{ _caller_token }}"

    # --- raw_key override: skip slugification, log warning on use ---
    - variables:
        _key: >-
          {%- if _raw_key -%}
            {{- path | default(key | default('', true), true) | string | trim | regex_replace('^/', '') -}}
          {%- else -%}
            {{- _key -}}
          {%- endif -%}

    - if: "{{ _raw_key and _force_action }}"
      then:
      - action: logbook.log
        data:
          name: "FileCabinet — RAW_KEY REPAIR"
          message: >
            ⚠ raw_key REPAIR used on {{ _vol }} key='{{ _key }}'.
            Slugification skipped — repair mode only. I hope you knew what you were doing.
          entity_id: "{{ _vol }}"
          domain: sensor

    # --- Guard: volume required for data actions ---
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ result is not defined }}"
        - condition: template
          value_template: >-
            {{ _vol == '' and _action not in
               ['register', 'unregister', 'inspect', 'health', 'audit', 'stacks_by_anchor', 'manifest', 'expand_drawer', 'collapse_drawer', 'expansion_sitrep', 'fleet'] }}
        sequence:
        - variables:
            result:
              status: error
              tool: zen_sutra_filecabinet
              action: "{{ _action }}"
              message: "volume_entity_id is required for action={{ _action }}"
              trace:
                caller_token: "{{ _caller_token }}"

    # --- Guard: volume must be a real cabinet (has variables attribute) ---
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ result is not defined }}"
        - condition: template
          value_template: >-
            {{ _vol != '' and state_attr(_vol, 'variables') is none and
               _action not in ['register', 'unregister', 'inspect', 'audit', 'expand_drawer', 'collapse_drawer'] }}
        sequence:
        - variables:
            result:
              status: error
              tool: zen_sutra_filecabinet
              action: "{{ _action }}"
              volume: "{{ _vol }}"
              message: >-
                {{ _vol }} is not a cabinet entity (no variables attribute).
                Pass the actual cabinet entity_id (e.g. sensor.zenos_expansion_cabinet_1),
                not a resolver sensor (e.g. sensor.zen_dojo_cabinet_resolved).
              trace:
                caller_token: "{{ _caller_token }}"

    # --- Guard: system cabinet HARD READ-ONLY ---
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ result is not defined }}"
        - condition: template
          value_template: >-
            {{ _vol == 'sensor.zenos_system_cabinet' and
               _action in ['create', 'update', 'upsert', 'delete', 'move', 'copy',
                           'relabel', 'set_mount', 'remove_mount', 'mount_cabinet', 'dismount_cabinet'] }}
        sequence:
        - variables:
            result:
              status: error
              tool: zen_sutra_filecabinet
              action: "{{ _action }}"
              volume: "{{ _vol }}"
              message: "sensor.zenos_system_cabinet is HARD READ-ONLY. No writes permitted."
              trace:
                caller_token: "{{ _caller_token }}"

    # --- Guard: cabinet RO flag ---
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ result is not defined }}"
        - condition: template
          value_template: >-
            {%- set _g_vars = state_attr(_vol, 'variables') or {} -%}
            {%- set _g_vi = _g_vars.get('AI_Cabinet_VolumeInfo', {}) -%}
            {%- set _g_vi = _g_vi if _g_vi is mapping else {} -%}
            {%- set _g_viv = _g_vi.get('value', _g_vi) -%}
            {%- set _g_viv = _g_viv if _g_viv is mapping else (_g_viv | from_json(none) if _g_viv is string and _g_viv | trim not in ['', 'null'] else {}) -%}
            {%- set _g_viv = _g_viv if _g_viv is mapping else {} -%}
            {%- set _g_flags = _g_viv.get('flags', {}) -%}
            {%- set _g_ro = (_g_flags.get('cabinet_ro', false) == true) if _g_flags is mapping else false -%}
            {%- set _g_rof_e = _g_vars.get('ro_flag', {}) -%}
            {%- set _g_rof = (_g_rof_e.get('value', false) | bool(false)) if _g_rof_e is mapping else false -%}
            {{ _vol != '' and _action in ['create', 'update', 'upsert', 'delete', 'move', 'copy'] and (_g_ro or _g_rof) }}
        sequence:
        - variables:
            result:
              status: error
              tool: zen_sutra_filecabinet
              action: "{{ _action }}"
              volume: "{{ _vol }}"
              message: "Cabinet is read-only (ro_flag set). No writes permitted."
              trace:
                caller_token: "{{ _caller_token }}"

    # --- Guard: zen_scroll is read-only ---
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ result is not defined }}"
        - condition: template
          value_template: >-
            {{ _key == 'zen_scroll' and
               _action in ['create', 'update', 'upsert', 'delete', 'move', 'copy'] }}
        sequence:
        - variables:
            result:
              status: error
              tool: zen_sutra_filecabinet
              action: "{{ _action }}"
              key: "{{ _key }}"
              volume: "{{ _vol }}"
              message: "zen_scroll is a read-only system drawer and cannot be modified."
              trace:
                caller_token: "{{ _caller_token }}"

    # --- Guard: reserved _ keys require force_action ---
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ result is not defined }}"
        - condition: template
          value_template: >-
            {{ _key.startswith('_') and not _force_action and
               _action in ['create', 'update', 'upsert', 'delete', 'move', 'copy'] }}
        sequence:
        - variables:
            result:
              status: error
              tool: zen_sutra_filecabinet
              action: "{{ _action }}"
              key: "{{ _key }}"
              volume: "{{ _vol }}"
              message: "Keys starting with _ are reserved. Pass force_action=true to write/delete system drawers."
              trace:
                caller_token: "{{ _caller_token }}"

    # --- Guard: protected system drawers ---
    # The list uses the same casing as _key (AI_Cabinet_VolumeInfo,
    # _label_index and _zen_relationships keep their real casing; see the
    # lookup above). If the two ever disagree, these keys lose write protection.
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ result is not defined }}"
        - condition: template
          value_template: >-
            {%- set _prot = ['AI_Cabinet_VolumeInfo', '_label_index', '_zen_relationships', 'meta'] -%}
            {{ (_key in _prot and _action in ['create', 'update', 'upsert', 'delete', 'move', 'copy', 'set_mount'])
               or (_dest in _prot and _action in ['move', 'copy']) }}
        sequence:
        - variables:
            result:
              status: error
              failure: protected_drawer
              tool: zen_sutra_filecabinet
              action: "{{ _action }}"
              key: "{{ _key }}"
              volume: "{{ _vol }}"
              message: >-
                Write blocked: '{{ _key }}' is a protected system drawer
                (AI_Cabinet_VolumeInfo, _label_index, _zen_relationships, meta).
                Use the appropriate admin tool for this operation.
              trace:
                caller_token: "{{ _caller_token }}"

    # --- Guard: per-drawer read-only (meta.ro) ---
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ result is not defined }}"
        - condition: template
          value_template: >-
            {%- set _e = (state_attr(_vol, 'variables') or {}).get(_key, {}) -%}
            {%- set _m = _e.get('meta', {}) if _e is mapping else {} -%}
            {{ _action in ['create', 'update', 'upsert', 'delete', 'move', 'copy']
               and _m is mapping and _m.get('ro', false) == true }}
        sequence:
        - variables:
            result:
              status: error
              failure: drawer_ro
              tool: zen_sutra_filecabinet
              action: "{{ _action }}"
              key: "{{ _key }}"
              volume: "{{ _vol }}"
              message: "Write blocked: drawer '{{ _key }}' is read-only. Use CabinetAdmin set_ro_flag to clear before writing."
              trace:
                caller_token: "{{ _caller_token }}"

    # --- Guard: volume health gate on writes ---
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ result is not defined }}"
        - condition: template
          value_template: >-
            {%- set _h = state_attr(_vol, 'health') or {} -%}
            {{ _vol != '' and _action in ['create', 'update', 'upsert', 'delete', 'move', 'copy',
                                          'set_mount', 'remove_mount', 'mount_cabinet', 'dismount_cabinet']
               and ( _h.get('status', '') == 'error'
                     or _h.get('guid_mismatch', false)
                     or not _h.get('writeable', true)
                     or (_h.get('storage_warning', false) and not _force_action) ) }}
        sequence:
        - variables:
            result: >-
              {%- set _h = state_attr(_vol, 'health') or {} -%}
              {{
                {
                  'status': 'error',
                  'failure': 'volume_not_healthy',
                  'tool': 'zen_sutra_filecabinet',
                  'action': _action,
                  'volume': _vol,
                  'message': 'Write blocked: volume not healthy.',
                  'health_snapshot': {
                    'status': _h.get('status', ''),
                    'mismatch': _h.get('guid_mismatch', false),
                    'writeable': _h.get('writeable', true),
                    'storage_warning': _h.get('storage_warning', false),
                    'force_action': _force_action
                  },
                  'trace': {'caller_token': _caller_token}
                }
              }}

    # ── Target (#10626): the real cabinet and drawer behind the key, resolved
    #    once, before the gate (CABS.fc_resolve). get/create/update/upsert act
    #    on it; delete/move/copy/relabel/mounts act on the pointer itself. A
    #    mount chain that cannot resolve refuses here for those four.
    - variables:
        _t: >-
          {%- if result is not defined and _vol != '' and _key != '' -%}
            {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
            {{- CABS.fc_resolve(_vol, _key) | from_json -}}
          {%- else -%}
            {{- {'status': 'none', 'vol': _vol, 'key': _key, 'depth': 0, 'visited': [], 'reason': '', 'loop_at': '', 'fc_args': none, 'entry': none} -}}
          {%- endif -%}
    - if: >-
        {{ result is not defined and _action in ['get', 'create', 'update', 'upsert']
           and _t.status in ['loop_detected', 'depth_limit_exceeded', 'unresolvable']
           or (result is not defined and _action == 'get' and _t.status == 'not_found_in_target') }}
      then:
        - variables:
            result:
              status: error
              tool: zen_sutra_filecabinet
              action: "{{ _action }}"
              key: "{{ _key }}"
              volume: "{{ _vol }}"
              mount_traversal:
                status: "{{ _t.status }}"
                reason: "{{ _t.reason }}"
                loop_at: "{{ _t.loop_at }}"
                depth: "{{ _t.depth }}"
                visited: "{{ _t.visited }}"
              trace:
                caller_token: "{{ _caller_token }}"

    # ── ACL gate (#10626), AUDIT ONLY (#10633) ─────────────────────────────
    #    The target's ACL decides: CABS.acl_for on the resolved target (reads
    #    and writes go through a mount; delete/move/copy/relabel/mounts act on
    #    the pointer), each op inheriting drawer -> cabinet -> default; move and
    #    copy also need w on the destination. The caller (ID.caller, no script
    #    call) is looked up only when a rule names principals or a cert. Audit
    #    only: nothing is refused here yet; a would-deny or would-ack is logged
    #    (zen_event fc_acl_audit + system_log) and rides on the answer as
    #    acl_audit.
    - variables:
        _g: >-
          {%- set _xd_src = (source_cabinet | default('', true) | string | trim) if _action in ['expand_drawer', 'collapse_drawer'] else '' -%}
          {%- if result is not defined and ((_vol != '' and _action in ['get', 'list', 'search', 'create', 'update', 'upsert', 'delete', 'move', 'copy',
                                                                      'relabel', 'set_mount', 'remove_mount', 'mount_cabinet', 'dismount_cabinet', 'set_cabinet_ro'])
                                            or _xd_src != '') -%}
            {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
            {%- import 'zenos_ai/zen_identity.jinja' as ID -%}
            {%- set _through = _action in ['get', 'create', 'update', 'upsert'] and _t.status in ['direct', 'resolved', 'live', 'not_found_in_target'] -%}
            {#- Every hop is checked: each mount pointer the chain passes needs r
                (a caller that cannot read a pointer does not get past it), and the
                drawer the chain ends on needs the action's op. No hop is skipped. -#}
            {%- set _hops = _t.visited[:-1] if _through and (_t.depth | int(0)) > 0 else [] -%}
            {#- set_mount / remove_mount under an expanded root act in the
                expansion: the host's hop needs r, the drawer there the op. -#}
            {%- set _xsm = (CABS.expansion_root_of(_vol, _key) | from_json({})) if _action in ['set_mount', 'remove_mount'] and _key not in (state_attr(_vol, 'variables') or {}) else {} -%}
            {%- set _xsm_t = _xsm.get('target', '') -%}
            {%- set _hops = [_vol ~ '/' ~ _key] if _xsm_t != '' else _hops -%}
            {%- set nh = namespace(c=[]) -%}
            {%- for h in _hops -%}
              {%- set nh.c = nh.c + [{'op': 'r', 'vol': h[:(h | length) - (_key | length) - 1], 'key': _key}] -%}
            {%- endfor -%}
            {%- set _checks = ([{'op': 'a', 'vol': _xd_src, 'key': ''}] if _xd_src != '' else
                               nh.c + [{'op': CABS.acl_op_class(_action) | trim, 'vol': (_t.vol if _through else (_xsm_t if _xsm_t != '' else _vol)), 'key': _key}]
                               + ([{'op': 'w', 'vol': (_dest_vol if _dest_vol != '' else _vol), 'key': _dest}] if _action in ['move', 'copy'] and _dest != '' else [])) -%}
            {%- set ns = namespace(out=[], deny=[], ack=false, who=none) -%}
            {%- for c in _checks -%}
              {%- set _acl = CABS.acl_for(c.vol, c.key) | from_json -%}
              {%- set _rule = _acl.ops[c.op] -%}
              {%- set _cert = (_rule.get('cert') or '') | string | trim -%}
              {%- set _need = ('*' not in (_rule.get('who') or [])) or _cert != '' -%}
              {%- set _cname = _cert | regex_replace(':[0-9]+$', '') -%}
              {%- set _clvl = (_cert | regex_findall(':([0-9]+)$') | first | default('1')) | int(1) -%}
              {%- set _who = (ID.caller(_cname, _clvl) | from_json) if _need else {'guid': '', 'cert_ok': true} -%}
              {%- set _chk = CABS.acl_check(_acl, c.op, {'guid': _who.guid, 'origin': _origin,
                                                         'tool': '' if _origin == 'agent' else (caller_tool | default('', true) | string | trim)}) | from_json -%}
              {%- set _why = ([_chk.reason] if not _chk.who_ok else []) + (['cert ' ~ _cert ~ ' not held'] if _chk.cert != '' and not _who.cert_ok else []) -%}
              {%- set ns.deny = ns.deny + _why -%}
              {%- set ns.ack = ns.ack or _chk.ack -%}
              {%- set ns.out = ns.out + [{'op': c.op, 'target': c.vol ~ ('/' ~ c.key if c.key else ''), 'source': _chk.source, 'via': _chk.via, 'why': _why}] -%}
            {%- endfor -%}
            {{- {'mode': CABS.acl_enforce_mode() | trim, 'action': _action, 'origin': _origin, 'checks': ns.out, 'would_deny': ns.deny | count > 0, 'reasons': ns.deny, 'would_ack': ns.ack} -}}
          {%- else -%}
            {{- none -}}
          {%- endif -%}
    # _g_vol: the cabinet the call names (expand/collapse name it as
    # source_cabinet, not volume_entity_id).
    - variables:
        _g_vol: "{{ _vol if _vol != '' else (source_cabinet | default('', true) | string | trim) }}"
    - if: "{{ _g is mapping and (_g.would_deny or _g.would_ack) }}"
      then:
        - event: zen_event
          event_data:
            event:
              timestamp: "{{ now().isoformat() }}"
              component: zen_sutra_filecabinet
              severity: warning
              kind: fc_acl_audit
              summary: "{{ _action }} {{ _g_vol }}{{ ('/' ~ _key) if _key else '' }}: {{ (('denied (' if _g.mode == 'enforce' else 'would deny (') ~ (_g.reasons | join('; ')) ~ ')') if _g.would_deny else ('asks for a live ack' if _g.mode == 'enforce' else 'would ask for a live ack') }}"
              metadata: "{{ _g }}"
        - action: system_log.write
          data:
            level: warning
            logger: zen_sutra_filecabinet
            message: "fc_acl_audit mode={{ _g.mode }} action={{ _action }} volume={{ _g_vol }} key={{ _key }} origin={{ _origin }} would_deny={{ _g.would_deny }} would_ack={{ _g.would_ack }} reasons={{ _g.reasons | join('; ') }}"

    # ── Enforcement (#10633). With fc_acl_mode enforce the gate refuses what
    #    the ACL denies, and asks the household admin when the rule wants a
    #    live ack (identity request_live_ack; the console override stands in).
    #    In audit, the default, nothing below refuses.
    - if: "{{ result is not defined and _g is mapping and _g.mode == 'enforce' and _g.would_deny }}"
      then:
        - variables:
            result:
              status: error
              tool: zen_sutra_filecabinet
              action: "{{ _action }}"
              key: "{{ _key }}"
              volume: "{{ _g_vol }}"
              reason: "guarded: the ACL denies {{ _action }} on {{ _g_vol }}{{ ('/' ~ _key) if _key else '' }}: {{ _g.reasons | join('; ') }}"
              trace:
                caller_token: "{{ _caller_token }}"
    - if: "{{ result is not defined and _g is mapping and _g.mode == 'enforce' and _g.would_ack }}"
      then:
        - action: script.zen_dojotools_identity
          response_variable: _acl_ack_raw
          continue_on_error: true
          data:
            mode: request_live_ack
            ack_message: >-
              Your agent is attempting to {{ _action }} {{ _g_vol }}{{ ('/' ~ _key) if _key else '' }}.
              The ACL asks for your approval every time. Approve?
            caller_token: "{{ _caller_token }}"
        - if: "{{ not (_acl_ack_raw.get('approved', false) if _acl_ack_raw is mapping else false) }}"
          then:
            - variables:
                result:
                  status: denied
                  tool: zen_sutra_filecabinet
                  action: "{{ _action }}"
                  key: "{{ _key }}"
                  volume: "{{ _g_vol }}"
                  reason: "guarded: the ACL asks for a live ack for {{ _action }} on {{ _g_vol }}{{ ('/' ~ _key) if _key else '' }}; not granted ({{ _acl_ack_raw.get('reason', 'dispatch_failed') if _acl_ack_raw is mapping else 'dispatch_failed' }})"
                  trace:
                    caller_token: "{{ _caller_token }}"

    # ── Gate (#10561 / #10637): the one place a call is refused before
    #    dispatch (aliases are resolved above, before the guards). A refusal sets result and every dispatch below is
    #    skipped (result is not defined); the single exit at the bottom returns
    #    it. The FileCabinet cert check and the target-ACL check land here.
    - if: >-
        {{ _action in ['create', 'update', 'upsert', 'delete', 'move', 'copy', 'relabel']
           and _vol != '' and states(_vol) == 'init' }}
      then:
        - variables:
            result:
              status: error
              tool: zen_sutra_filecabinet
              action: "{{ _action }}"
              message: >-
                Write refused: '{{ _vol }}' is in 'init' state (no VolumeInfo loaded
                yet, not a real cabinet). Run zen_admintools_cabinetadmin mode=init
                to provision it before writing.
              trace:
                caller_token: "{{ _caller_token }}"

    # ── Expanded trees: an expansion is a permanent redirect for one drawer
    #    and its whole tree. A move, copy or delete that touches one (the key,
    #    an ancestor or anything below it) or lands in one runs here, on the
    #    real drawers wherever they live. Pointers are never copied, moved or
    #    rewritten: expand_drawer creates them, move / delete / collapse_drawer
    #    remove them. An expansion an operation leaves empty is torn down.
    #    A softlink under an expanded root lives in the expansion: set_mount and
    #    remove_mount run there.
    - variables:
        _xo: >-
          {%- if result is not defined and _action in ['move', 'copy', 'delete', 'remove_mount', 'set_mount'] and _vol != '' and _key != '' -%}
            {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
            {%- set p = CABS.expansion_plan(_vol, _key) | from_json -%}
            {%- set dv = _dest_vol if _dest_vol != '' else _vol -%}
            {%- set dr = (CABS.expansion_root_of(dv, _dest) | from_json) if _action in ['move', 'copy'] and _dest != '' else {'target': ''} -%}
            {%- set dp = (CABS.expansion_plan(dv, _dest) | from_json) if _action in ['move', 'copy'] and _dest != '' else {'mode': 'none'} -%}
            {#- xptr: the key is itself one of expand_drawer's pointers (the
                root's or a child's), never a softlink to manage. -#}
            {%- set xp = (CABS.expansion_root_of(_vol, _key ~ '/_') | from_json).root == _key -%}
            {{- {'on': p.mode != 'none' or dr.target != '' or dp.mode != 'none', 'mode': p.mode, 'dv': dv, 'xptr': xp} -}}
          {%- else -%}{{- {'on': false, 'mode': 'none', 'dv': '', 'xptr': false} -}}{%- endif -%}
    - if: "{{ _xo.on and _action in ['remove_mount', 'set_mount'] and (_xo.mode == 'self' or _xo.xptr) }}"
      then:
        - variables:
            result:
              status: error
              tool: zen_sutra_filecabinet
              action: "{{ _action }}"
              key: "{{ _key }}"
              volume: "{{ _vol }}"
              reason: "guarded: {{ _key }} is part of an expanded drawer. Its pointer is created by expand_drawer and removed only by move, delete or collapse_drawer."
              trace:
                caller_token: "{{ _caller_token }}"
    - if: "{{ result is not defined and _xo.on and _action in ['remove_mount', 'set_mount'] and _xo.mode == 'ancestor' and _key not in (state_attr(_vol, 'variables') or {}) }}"
      then:
        - variables:
            _xo_host: "{{ _vol }}"
            _vol: >-
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
              {{- (CABS.expansion_root_of(_vol, _key) | from_json).target -}}
    - if: "{{ result is not defined and _xo.on and _action in ['move', 'copy', 'delete'] }}"
      then:
        - variables:
            _xo_max: 131072
            _xo_headroom: 2048
            # The tree as one: every key of it, where its real drawer lives, and
            # the pointers this cabinet holds for it.
            _xo_tree: >-
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
              {%- set sv = state_attr(_vol, 'variables') or {} -%}
              {%- set view = CABS.cabinet_expanded_view(_vol) | from_json({}) -%}
              {%- set _pre = _key ~ '/' -%}
              {#- Each key where its drawer is stored: the host, or the
                  expansion behind an expanded root. A softlink (any other mount
                  pointer or live drawer) is a link: delete removes it like a
                  drawer, move / copy refuse it unless force_action. -#}
              {%- set ns = namespace(items=[], ptrs=[], links=[]) -%}
              {%- for k in view.keys() | list | sort if k == _key or k.startswith(_pre) -%}
                {%- set e0 = sv.get(k) -%}
                {%- set v0 = e0.get('value') if e0 is mapping else none -%}
                {%- set v0 = (v0 | from_json(none)) if v0 is string else v0 -%}
                {%- set p0 = v0 is mapping and v0.get('mount_point', false) == true -%}
                {%- set t0 = ((v0.get('target_entity_id') or '') | string) if p0 and v0.get('fc_args') is none else '' -%}
                {%- set s0 = (CABS.cabinet_slot_status(t0) | from_json({})) if t0 != '' else {} -%}
                {%- if t0 != '' and s0.get('cabinet_class') == 'expansion' and s0.get('hosted_by') == _vol -%}
                  {%- set ns.ptrs = ns.ptrs + [k] -%}
                  {%- set loc = t0 -%}
                {%- elif e0 is mapping -%}
                  {%- set loc = _vol -%}
                {%- else -%}
                  {%- set loc = (CABS.expansion_root_of(_vol, k) | from_json).target -%}
                {%- endif -%}
                {%- set e = (state_attr(loc, 'variables') or {}).get(k) if loc != '' else none -%}
                {%- set v = e.get('value') if e is mapping else none -%}
                {%- set v = (v | from_json(none)) if v is string else v -%}
                {%- if e is mapping and v is mapping and v.get('mount_point', false) == true -%}
                  {%- set ns.links = ns.links + [{'k': k, 'vol': loc, 'env': e}] -%}
                {%- elif e is mapping -%}
                  {%- set ns.items = ns.items + [{'k': k, 'vol': loc, 'env': e}] -%}
                {%- endif -%}
              {%- endfor -%}
              {%- set carry = _action == 'delete' or _force_action -%}
              {{- {'items': ns.items + (ns.links if carry else []), 'ptrs': ns.ptrs,
                   'foreign': [] if carry else ns.links | map(attribute='k') | list} -}}
        - variables:
            # Where each drawer goes (copy / move): the destination key, resolved
            # like any write, so a key under an expanded root lands in that
            # expansion and a pointer is written through, never over.
            _xo_writes: >-
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
              {%- set ns = namespace(w=[]) -%}
              {%- if _action in ['move', 'copy'] -%}
                {%- for it in _xo_tree['items'] -%}
                  {%- set d = _dest ~ it.k[_key | length:] -%}
                  {%- set r = CABS.fc_resolve(_xo.dv, d) | from_json -%}
                  {%- set ns.w = ns.w + [{'k': it.k, 'd': d, 'dvol': r.vol if r.status in ['direct', 'resolved', 'not_found_in_target'] else _xo.dv,
                                          'exists': r.status in ['direct', 'resolved'], 'env': it.env}] -%}
                {%- endfor -%}
              {%- endif -%}
              {{- ns.w -}}
        - variables:
            _xo_err: >-
              {%- set _pre = _key ~ '/' -%}
              {%- if _xo_tree['items'] | count == 0 and _xo_tree.foreign | count == 0 -%}{{ _key }} is not in {{ _vol }}
              {%- elif _xo_tree.foreign | count > 0 -%}{{ _xo_tree.foreign | join(', ') }} under {{ _key }} is a softlink (a mount or live drawer); {{ _action }} does not carry a mount: create it at the destination with set_mount, or pass force_action to carry the pointer as is
              {%- elif _action in ['move', 'copy'] and _dest == '' -%}destination_path is required for {{ _action }}
              {%- elif _action in ['move', 'copy'] and _xo.dv == _vol and (_dest == _key or _dest.startswith(_pre)) -%}destination {{ _dest }} is inside the tree being {{ 'moved' if _action == 'move' else 'copied' }}
              {%- elif _action in ['move', 'copy'] and _xo_writes | selectattr('exists') | list | count > 0 -%}destination already holds {{ _xo_writes | selectattr('exists') | map(attribute='d') | join(', ') }}
              {%- else -%}
                {%- set ns = namespace(by={}) -%}
                {%- for w in _xo_writes -%}
                  {%- set ns.by = dict(ns.by, **{w.dvol: (ns.by.get(w.dvol, 0) + ({w.d: w.env} | tojson | length) + 64)}) -%}
                {%- endfor -%}
                {%- set nf = namespace(full=[]) -%}
                {%- for v, b in ns.by.items() -%}
                  {%- if ((state_attr(v, 'variables') or {}) | tojson | length) + b + (_xo_headroom | int) > (_xo_max | int) -%}{%- set nf.full = nf.full + [v] -%}{%- endif -%}
                {%- endfor -%}
                {%- if nf.full | count > 0 -%}insufficient_space: {{ nf.full | join(', ') }}{%- endif -%}
              {%- endif -%}
        - if: "{{ _xo_err | trim != '' }}"
          then:
            - variables:
                result:
                  status: "{{ 'abort' if (_xo_err | trim).startswith('insufficient_space') else 'error' }}"
                  tool: zen_sutra_filecabinet
                  action: "{{ _action }}"
                  key: "{{ _key }}"
                  volume: "{{ _vol }}"
                  reason: "{{ _xo_err | trim if (_xo_err | trim).startswith('insufficient_space') else 'guarded: ' ~ (_xo_err | trim) }}"
                  trace:
                    caller_token: "{{ _caller_token }}"
        # Write every drawer at its destination and verify it; a failure takes
        # back what was written, nothing at the source has changed yet.
        - if: "{{ result is not defined and _xo_writes | count > 0 }}"
          then:
            - repeat:
                for_each: "{{ _xo_writes }}"
                sequence:
                  - if: "{{ _xo_fail is not defined }}"
                    then:
                      - event: set_variable_legacy
                        event_data:
                          key: "{{- repeat.item.d -}}"
                          value: "{{ repeat.item.env.get('value') }}"
                          meta: "{{ repeat.item.env.get('meta') if repeat.item.env.get('meta') is mapping else {} }}"
                          acl: "{{ repeat.item.env.get('acl') if repeat.item.env.get('acl') is mapping else '' }}"
                          volume_entity: "{{- repeat.item.dvol -}}"
                          set_timestamp: true
                      - wait_template: >-
                          {%- set t = (state_attr(repeat.item.dvol, 'variables') or {}).get(repeat.item.d) -%}
                          {{ t is mapping and (t.get('value') | tojson) == (repeat.item.env.get('value') | tojson) }}
                        timeout: "00:00:15"
                        continue_on_timeout: true
                      - if: "{{ not wait.completed }}"
                        then:
                          - variables:
                              _xo_fail: "{{ repeat.item.d }}"
            - if: "{{ _xo_fail is defined }}"
              then:
                - repeat:
                    for_each: "{{ _xo_writes }}"
                    sequence:
                      - event: remove_variable_legacy
                        event_data:
                          key: "{{- repeat.item.d -}}"
                          volume_entity: "{{- repeat.item.dvol -}}"
                - variables:
                    result:
                      status: error
                      tool: zen_sutra_filecabinet
                      action: "{{ _action }}"
                      key: "{{ _key }}"
                      volume: "{{ _vol }}"
                      reason: "write_unverified: {{ _xo_fail }}"
                      message: "Nothing changed: the destination write was not confirmed and what was written was taken back."
                      trace:
                        caller_token: "{{ _caller_token }}"
        # Labels follow the drawers: the index of the cabinet addressed (and
        # any the expansion holds itself) loses the tree's keys on move /
        # delete, and the destination's index gains the new keys on move / copy.
        - if: "{{ result is not defined }}"
          then:
            - variables:
                _xo_lx: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set keys = _xo_tree['items'] | map(attribute='k') | list -%}
                  {%- set vols = ([_vol, _xo.dv] + (_xo_tree['items'] | map(attribute='vol') | list)) | unique | list -%}
                  {%- set ns = namespace(lab={}, cur={}, add={}, out=[]) -%}
                  {%- for v in vols -%}
                    {%- set idx = CABS.label_index(v) | from_json({}) -%}
                    {%- set ns.cur = dict(ns.cur, **{v: idx}) -%}
                    {%- for k, ls in (CABS.label_index_keys(idx, keys) | from_json({})).items() -%}
                      {%- set ns.lab = dict(ns.lab, **{k: (ns.lab.get(k, []) + ls) | unique | list}) -%}
                    {%- endfor -%}
                  {%- endfor -%}
                  {%- for w in _xo_writes if w.k in ns.lab -%}{%- set ns.add = dict(ns.add, **{w.d: ns.lab[w.k]}) -%}{%- endfor -%}
                  {%- set drop = keys if _action in ['move', 'delete'] else [] -%}
                  {%- for v, idx in ns.cur.items() -%}
                    {%- set new = CABS.label_index_apply(idx, drop, ns.add if v == _xo.dv else {}) | from_json({}) -%}
                    {%- if new != idx -%}{%- set ns.out = ns.out + [{'vol': v, 'idx': new}] -%}{%- endif -%}
                  {%- endfor -%}
                  {{- ns.out -}}
            - repeat:
                for_each: "{{ _xo_lx }}"
                sequence:
                  - event: set_variable_legacy
                    event_data:
                      key: _label_index
                      value: "{{- repeat.item.idx | tojson -}}"
                      volume_entity: "{{- repeat.item.vol -}}"
                      set_timestamp: true
            - if: "{{ _xo_lx | count > 0 }}"
              then:
                - wait_template: >-
                    {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                    {%- set ns = namespace(ok=true) -%}
                    {%- for x in _xo_lx if (CABS.label_index(x.vol) | from_json({})) != x.idx -%}{%- set ns.ok = false -%}{%- endfor -%}
                    {{ ns.ok }}
                  timeout: "00:00:15"
                  continue_on_timeout: true
        # move / delete: the real drawers leave where they live, and this
        # cabinet's pointers for them go.
        - if: "{{ result is not defined and _action in ['move', 'delete'] }}"
          then:
            - repeat:
                for_each: "{{ _xo_tree['items'] }}"
                sequence:
                  - event: remove_variable_legacy
                    event_data:
                      key: "{{- repeat.item.k -}}"
                      volume_entity: "{{- repeat.item.vol -}}"
            - repeat:
                for_each: "{{ _xo_tree.ptrs }}"
                sequence:
                  - event: remove_variable_legacy
                    event_data:
                      key: "{{- repeat.item -}}"
                      volume_entity: "{{- _vol -}}"
            - wait_template: >-
                {%- set ns = namespace(ok=true) -%}
                {%- for it in _xo_tree['items'] if it.k in (state_attr(it.vol, 'variables') or {}) -%}{%- set ns.ok = false -%}{%- endfor -%}
                {%- for k in _xo_tree.ptrs if k in (state_attr(_vol, 'variables') or {}) -%}{%- set ns.ok = false -%}{%- endfor -%}
                {{ ns.ok }}
              timeout: "00:00:20"
              continue_on_timeout: true
            - variables:
                _xo_removed: "{{ wait.completed }}"
            # An expansion left holding nothing is torn down: expansion stamp
            # off VolumeInfo (nothing else in it changes), dismounted.
            - variables:
                _xo_empty: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set ns = namespace(l=[]) -%}
                  {%- for v in _xo_tree['items'] | map(attribute='vol') | unique | list if v != _vol -%}
                    {%- set s = CABS.cabinet_slot_status(v) | from_json({}) -%}
                    {%- if s.get('cabinet_class') == 'expansion' and s.get('hosted_by') == _vol and s.get('user_drawers', []) | count == 0 -%}{%- set ns.l = ns.l + [v] -%}{%- endif -%}
                  {%- endfor -%}
                  {{- ns.l -}}
            - repeat:
                for_each: "{{ _xo_empty }}"
                sequence:
                  - variables:
                      _xo_vi: >-
                        {%- set e = (state_attr(repeat.item, 'variables') or {}).get('AI_Cabinet_VolumeInfo') -%}
                        {%- set v = e.get('value') if e is mapping else none -%}
                        {{- ((v | from_json(none)) if v is string else v) or {} -}}
                  - event: set_variable_legacy
                    event_data:
                      key: AI_Cabinet_VolumeInfo
                      value: "{{ dict(_xo_vi.items() | rejectattr('0', 'in', ['cabinet_class', 'hosted_by'])) }}"
                      volume_entity: "{{- repeat.item -}}"
                      set_timestamp: true
                  - if: "{{ states(repeat.item) == 'online_mounted' }}"
                    then:
                      - event: set_variable_legacy
                        event_data:
                          key: meta
                          value: "{{ {'mounted': false} }}"
                          volume_entity: "{{- repeat.item -}}"
                          set_timestamp: true
            - wait_template: >-
                {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                {%- set ns = namespace(ok=true) -%}
                {%- for v in _xo_empty -%}
                  {%- set s = CABS.cabinet_slot_status(v) | from_json({}) -%}
                  {%- if s.get('cabinet_class') is not none or states(v) != 'online_unmounted' -%}{%- set ns.ok = false -%}{%- endif -%}
                {%- endfor -%}
                {{ ns.ok }}
              timeout: "00:00:20"
              continue_on_timeout: true
            - variables:
                _xo_torn: "{{ wait.completed }}"
        - if: "{{ result is not defined }}"
          then:
            - variables:
                result:
                  status: "{{ 'success' if (_action == 'copy' or (_xo_removed and _xo_torn)) else 'warning' }}"
                  tool: zen_sutra_filecabinet
                  action: "{{ _action }}"
                  key: "{{ _key }}"
                  volume: "{{ _vol }}"
                  destination: "{{ _dest if _action in ['move', 'copy'] else '' }}"
                  keys: "{{ _xo_tree['items'] | map(attribute='k') | list }}"
                  written_to: "{{ _xo_writes | map(attribute='dvol') | unique | list }}"
                  pointers_removed: "{{ _xo_tree.ptrs if _action in ['move', 'delete'] else [] }}"
                  expansions_torn_down: "{{ _xo_empty if _action in ['move', 'delete'] else [] }}"
                  label_index_updated: "{{ (_xo_lx | default([])) | map(attribute='vol') | list }}"
                  expanded_tree: true
                  message: >-
                    {{ '' if (_action == 'copy' or (_xo_removed and _xo_torn)) else 'Done, but the cabinets did not confirm every removal or teardown in time: check expansion_sitrep.' }}
                  trace:
                    caller_token: "{{ _caller_token }}"

    # --- RELABEL ---
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ result is not defined and _action == 'relabel' }}"
        sequence:
        - variables:
            _rl_exists: >-
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
              {%- set _xt = (CABS.expansion_root_of(_vol, _key) | from_json({})).get('target', '') -%}
              {{ CABS.cabinet_drawer_exists(_vol, _key) | from_json or (_xt != '' and _key in (state_attr(_xt, 'variables') or {})) }}
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ not _rl_exists }}"
            sequence:
            - variables:
                result:
                  status: error
                  failure: drawer_not_found
                  tool: zen_sutra_filecabinet
                  action: relabel
                  key: "{{ _key }}"
                  volume: "{{ _vol }}"
                  message: "relabel requires an existing drawer. '{{ _key }}' not found."
                  trace:
                    caller_token: "{{ _caller_token }}"
        - if: "{{ result is not defined }}"
          then:
          - variables:
              _tags_for_index: >-
                {%- set _tr = tags | default('', true) -%}
                {%- if _tr is sequence and not _tr is string -%}
                  {{- _tr | map('string') | map('lower') | map('slugify') | select('string') | list -}}
                {%- elif _tr is string and _tr | trim != '' -%}
                  {{- _tr | replace('\n', ',') | regex_findall('[^,]+') | map('trim') | map('lower') | map('slugify') | select('string') | list -}}
                {%- else -%}
                  []
                {%- endif -%}
          - variables:
              _relabel_idx: >-
                {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                {%- set _v_s = (state_attr(_vol, 'variables') if state_attr(_vol, 'variables') is mapping else {}) -%}
                {%- set _v = _v_s if _v_s is mapping else (_v_s | from_json(none) if _v_s is string else none) -%}
                {%- set _ci = ((_v if _v is mapping else {}).get('_label_index', {}).get('value', {})) -%}
                {%- set _ci = _ci if _ci is mapping else (_ci | from_json(none) if _ci is string and _ci | trim not in ['', '{}', 'null'] else {}) -%}
                {%- set _ci = _ci if _ci is mapping else {} -%}
                {%- set _ds = _key -%}
                {%- set _ns = namespace(val = {}) -%}
                {%- for lbl, drawers in _ci.items() -%}
                  {%- if drawers is iterable and not drawers is string -%}
                    {%- set _cleaned = drawers | reject('equalto', _ds) | list -%}
                    {%- if _cleaned | length > 0 -%}
                      {%- set _ns.val = _ns.val | combine({lbl: _cleaned}) -%}
                    {%- endif -%}
                  {%- elif drawers != _ds -%}
                    {%- set _ns.val = _ns.val | combine({lbl: [drawers]}) -%}
                  {%- endif -%}
                {%- endfor -%}
                {%- for _lbl in _tags_for_index -%}
                  {%- if _lbl in labels() -%}
                    {%- set _e = _ns.val.get(_lbl) -%}
                    {%- set _ex = (_e if _e is iterable and not _e is string else [_e] if _e not in [none, ''] else []) -%}
                    {%- set _ns.val = _ns.val | combine({_lbl: (_ex + [_ds]) | unique | list}) -%}
                  {%- endif -%}
                {%- endfor -%}
                {{- _ns.val -}}
          - event: set_variable_legacy
            event_data:
              key: _label_index
              value: "{{- _relabel_idx | tojson -}}"
              set_timestamp: true
              volume_entity: "{{- _vol -}}"
          # The index is read-modify-write: answer once it has landed, so the
          # next label write builds on this one instead of an older index.
          - wait_template: >-
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
              {{ (CABS.label_index(_vol) | from_json({})) == _relabel_idx }}
            timeout: "00:00:15"
            continue_on_timeout: true
          - variables:
              _tags_dropped: >-
                {%- set _all = labels() -%}
                {%- set _ns = namespace(d=[]) -%}
                {%- for _lbl in _tags_for_index -%}
                  {%- if _lbl not in _all -%}{%- set _ns.d = _ns.d + [_lbl] -%}{%- endif -%}
                {%- endfor -%}
                {{ _ns.d }}
          - variables:
              _labels_applied: >-
                {%- set _ns2 = namespace(a=[]) -%}
                {%- for _lbl in _tags_for_index -%}
                  {%- if _lbl not in _tags_dropped -%}{%- set _ns2.a = _ns2.a + [_lbl] -%}{%- endif -%}
                {%- endfor -%}
                {{ _ns2.a }}
          - variables:
              result:
                status: success
                tool: zen_sutra_filecabinet
                action: relabel
                key: "{{ _key }}"
                volume: "{{ _vol }}"
                message: "Labels updated on drawer '{{ _key }}' (index only — drawer value unchanged)."
                labels_applied: "{{ _labels_applied }}"
                labels_dropped: "{{ _tags_dropped }}"
                trace:
                  caller_token: "{{ _caller_token }}"
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ result is not defined and _action == 'search' }}"
        sequence:
        - variables:
            # An expanded tree is searched where its drawers really live.
            _vars: >-
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
              {%- set _r = (CABS.cabinet_resolved_view(_vol) | from_json({})) if CABS.cabinet_hosts_expansion(_vol) | trim == 'true'
                           else (state_attr(_vol, 'variables') if state_attr(_vol, 'variables') is mapping else {}) -%}
              {%- if _r is mapping -%}{{ _r }}
              {%- elif _r is string and _r | trim not in ['', '{}'] -%}{{ _r | from_json | default({}) }}
              {%- else -%}{{ {} }}{%- endif -%}
        - variables:
            result: >-
              {%- set _q = query | default('', true) | string | trim | lower -%}
              {%- set _use_labels = _anchor_ids_raw is sequence and _anchor_ids_raw | length > 0 -%}
              {# Build label-matched key set from _label_index (source of truth for relabel) #}
              {%- set _idx = (_vars.get('_label_index', {}).get('value', {}) if _vars is mapping else {}) -%}
              {%- set _idx = _idx if _idx is mapping else (_idx | from_json(none) if _idx is string and _idx | trim not in ['', '{}', 'null'] else {}) -%}
              {%- set _idx = _idx if _idx is mapping else {} -%}
              {%- set _lm = namespace(keys=[]) -%}
              {%- if _use_labels -%}
                {%- for aid in _anchor_ids_raw -%}
                  {%- set _e = _idx.get(aid | lower | slugify, []) -%}
                  {%- set _lm.keys = (_lm.keys + (_e if _e is sequence else [])) | unique | list -%}
                {%- endfor -%}
              {%- endif -%}
              {%- set ns = namespace(results=[]) -%}
              {%- for k, drawer in (_vars if _vars is mapping else {}).items() -%}
                {%- if k != 'AI_Cabinet_VolumeInfo' and not k.startswith('_') -%}
                  {%- set _dv = drawer.get('value') if drawer is mapping else none -%}
                  {%- if _dv is mapping and _dv.get('v') == 1 and 'content' in _dv -%}
                    {%- set _sr_title = _dv.get('title', k) -%}
                    {%- set _sr_content = _dv.get('content', '') -%}
                    {%- set _sr_desc = _dv.get('description', '') -%}
                    {%- set _sr_ca = _dv.get('created_at', '') -%}
                    {%- set _sr_ua = _dv.get('updated_at', '') -%}
                  {%- else -%}
                    {%- set _sr_title = k -%}
                    {%- set _sr_content = (_dv | tojson) if (_dv is not none and _dv is not string) else (_dv if _dv is string else '') -%}
                    {%- set _sr_desc = '' -%}
                    {%- set _sr_ca = '' -%}
                    {%- set _sr_ua = (drawer.get('timestamp', '') if drawer is mapping else '') -%}
                  {%- endif -%}
                  {#- The index holds drawer keys as written (a/b): match those, and
                      the slug form older index entries used. -#}
                  {%- set _label_match = _use_labels and (k in _lm.keys or (k | lower | slugify) in _lm.keys) -%}
                  {%- set _k_lc = k | lower -%}
                  {%- set _t_lc = _sr_title | string | lower -%}
                  {%- set _c_lc = _sr_content | string | lower -%}
                  {%- set _d_lc = _sr_desc | string | lower -%}
                  {%- set _text_match = _q != '' and (_q in _k_lc or _q in _t_lc or _q in _c_lc or _q in _d_lc) -%}
                  {%- if _label_match or _text_match -%}
                    {%- set _item = {
                      'key': k,
                      'path': k,
                      'title': _sr_title,
                      'description': _sr_desc,
                      'created_at': _sr_ca,
                      'updated_at': _sr_ua,
                      'entity_labels': []
                    } -%}
                    {%- set ns.results = ns.results + [_item] -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
              {{
                {
                  'status': 'success',
                  'tool': 'zen_sutra_filecabinet',
                  'action': 'search',
                  'volume': _vol,
                  'query': query | default('', true),
                  'anchor_type': _anchor_type,
                  'anchor_ids': _anchor_ids_raw,
                  'items': ns.results,
                  'count': ns.results | length,
                  'trace': {'caller_token': _caller_token}
                }
              }}
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ result is not defined and _action == 'render' }}"
        sequence:
        - variables:
            result:
              status: not_supported
              tool: zen_sutra_filecabinet
              action: "{{ _action }}"
              stack_type: cabinet
              reason: "render has no cabinet equivalent."
              trace:
                caller_token: "{{ _caller_token }}"

    # --- GET ---
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ result is not defined and _action == 'get' }}"
        sequence:
        - variables:
            # The cabinet as one tree: children an expanded drawer gained after
            # its move live in the expansion and are listed here too.
            _g_vol0: >-
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
              {%- if CABS.cabinet_hosts_expansion(_vol) | trim == 'true' -%}{{- CABS.cabinet_expanded_view(_vol) | from_json({}) -}}
              {%- else -%}{{- state_attr(_vol, 'variables') | default({}, true) -}}{%- endif -%}
        - variables:
            _g_trav: >-
              {%- set _t0 = _t if _t is mapping else {} -%}
              {%- set _st = _t0.get('status', 'absent') -%}
              {%- if _st == 'absent' -%}
                {{- {'status': 'absent'} -}}
              {%- elif _st == 'live' -%}
                {%- set _wl_vars = state_attr('sensor.zenos_system_cabinet', 'variables') | default({}, true) -%}
                {%- set _wl_raw = (_wl_vars.get('fc_mount_callout_whitelist') or {}) if _wl_vars is mapping else {} -%}
                {%- set _wl_val = (_wl_raw.get('value') or {}) if _wl_raw is mapping else {} -%}
                {%- set _hard_wl = ['zen_dojotools_index:*', 'zen_dojotools_inspect:*', 'zen_dojotools_query:*', 'zen_dojotools_room_manager:*', 'zen_dojotools_manifest:*', 'zen_dojotools_inventory:*', 'zen_dojotools_filecabinet:*', 'zen_dojotools_finance:kfc_manifest', 'zen_dojotools_finance:report', 'zen_dojotools_autovac:kfc_manifest', 'zen_dojotools_autovac:register', 'zen_dojotools_autovac:unregister'] -%}
                {%- set _syscab_wl = (_wl_val.get('allowed_action_types', []) if _wl_val is mapping else []) -%}
                {%- set _allowed = (_hard_wl + _syscab_wl) | unique | list -%}
                {%- set _fa = _t0.get('fc_args') -%}
                {%- set _act = (_fa.get('action_type') or _fa.get('tool', '')) if _fa is mapping else '' -%}
                {%- set _call_mode = ((_fa.get('params') or {}).get('mode', '') if _fa is mapping else '') | lower | trim -%}
                {%- set ns_wl = namespace(ok=false) -%}
                {%- for entry in _allowed -%}
                  {%- if ':' in entry -%}
                    {%- set parts = entry | regex_findall('[^:]+') -%}
                    {%- if (parts[0] | default('')) == _act and ((parts[1] | default('')) == '*' or (parts[1] | default('')) == _call_mode) -%}{%- set ns_wl.ok = true -%}{%- endif -%}
                  {%- elif entry == _act -%}{%- set ns_wl.ok = true -%}
                  {%- endif -%}
                {%- endfor -%}
                {{- {'status': 'tool_call_required' if ns_wl.ok else 'tool_call_blocked',
                     'reason': '' if ns_wl.ok else ('action_type not in fc_mount_callout_whitelist — blocked by: ' ~ ('system_cabinet_whitelist' if _wl_val is mapping and _wl_val.get('allowed_action_types') else 'hardcode_default') ~ ' (missing: ' ~ _act ~ ((':' ~ _call_mode) if _call_mode != '' else '') ~ ')'),
                     'entry': _t0.get('entry'), 'fc_args': _fa if ns_wl.ok else none, 'depth': _t0.get('depth', 0),
                     'visited': _t0.get('visited', []), 'entity': _t0.get('vol', _vol), 'loop_at': ''} -}}
              {%- else -%}
                {{- {'status': _st, 'entry': _t0.get('entry'), 'depth': _t0.get('depth', 0), 'visited': _t0.get('visited', []),
                     'entity': _t0.get('vol', _vol), 'reason': _t0.get('reason', ''), 'loop_at': _t0.get('loop_at', ''), 'fc_args': none} -}}
              {%- endif -%}
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ _g_trav is mapping and _g_trav.get('status') == 'tool_call_blocked' }}"
            sequence:
            - variables:
                result: >-
                  {%- set _t1 = _g_trav -%}
                  {{
                    {
                      'status': 'error',
                      'tool': 'zen_sutra_filecabinet',
                      'action': 'get',
                      'key': _key,
                      'volume': _vol,
                      'mount_traversal': {
                        'status': _t1.get('status'),
                        'reason': _t1.get('reason', ''),
                        'loop_at': '',
                        'depth': _t1.get('depth', 0),
                        'visited': _t1.get('visited', [])
                      },
                      'trace': {'caller_token': _caller_token}
                    }
                  }}
        - variables:
            _get_raw: >-
              {{ _g_trav.get('entry') if _g_trav is mapping and _g_trav.get('status') in ['direct', 'resolved', 'tool_call_required'] else none }}
            _g_mt: >-
              {%- set _t = _g_trav if _g_trav is mapping else {} -%}
              {%- if _t.get('status') == 'resolved' -%}
                {{ {'status': 'resolved', 'depth': _t.get('depth', 0), 'resolved_from': _vol ~ '/' ~ _key, 'resolved_to': _t.get('entity', '') ~ '/' ~ _key, 'visited': _t.get('visited', [])} }}
              {%- elif _t.get('status') == 'tool_call_required' -%}
                {{ {'status': 'tool_call_required', 'fc_args': _t.get('fc_args'), 'depth': _t.get('depth', 0), 'visited': _t.get('visited', [])} }}
              {%- else -%}
                {{ none }}
              {%- endif -%}
        - if:
          - condition: template
            value_template: "{{ result is not defined and _g_mt is mapping and _g_mt.get('status') == 'tool_call_required' }}"
          then:
          - variables:
              _tc_tool: >-
                {%- set _fa = _g_mt.get('fc_args') or {} -%}
                {{ _fa.get('tool') or _fa.get('action_type', '') }}
              _tc_params: "{{ (_g_mt.get('fc_args') or {}).get('params', {}) }}"
              _tc_cache_cfg: "{{ (_g_mt.get('fc_args') or {}).get('cache') or none }}"
          # Cache check runs before the re-entrancy guard: a cache hit never
          # dispatches, so it can't recurse and doesn't touch the marker.
          - variables:
              _tc_cache_raw: >-
                {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                {%- set _cv = (state_attr(_vol, 'variables') if state_attr(_vol, 'variables') is mapping else {}) -%}
                {%- set _cv = _cv if _cv is mapping else (_cv | from_json(none) if _cv is string else none) -%}
                {{ ((_cv if _cv is mapping else {}).get(_key ~ '/cache') or {}).get('value') }}
              _tc_cache_ts: >-
                {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                {%- set _cv = (state_attr(_vol, 'variables') if state_attr(_vol, 'variables') is mapping else {}) -%}
                {%- set _cv = _cv if _cv is mapping else (_cv | from_json(none) if _cv is string else none) -%}
                {{ ((_cv if _cv is mapping else {}).get(_key ~ '/cache') or {}).get('timestamp') }}
          - variables:
              _tc_cache_hit: >-
                {%- set _ttl = (_tc_cache_cfg if _tc_cache_cfg is mapping else {}).get('ttl_seconds', 300) | int -%}
                {%- set _ts = _tc_cache_ts | default('', true) | trim -%}
                {%- set _ts_dt = as_datetime(_ts, none) if _ts != '' else none -%}
                {%- if _ttl == 0 or _ts_dt is none or _tc_cache_raw is none -%}false
                {%- else -%}
                  {{ (now().timestamp() - (_ts_dt | as_timestamp(0))) < _ttl }}
                {%- endif -%}
          - if:
            - condition: template
              value_template: "{{ _tc_cache_hit | bool }}"
            then:
            - variables:
                result:
                  status: success
                  tool: zen_sutra_filecabinet
                  action: get
                  key: "{{ _key }}"
                  volume: "{{ _vol }}"
                  title: "{{ _key }}"
                  value: "{{ _tc_cache_raw }}"
                  mount_traversal:
                    status: resolved_via_cache
                    tool_called: "{{ _tc_tool }}"
                    cache: hit
                  trace:
                    caller_token: "{{ _caller_token }}"
          - if: "{{ result is not defined }}"
            then:
            # Re-entrancy guard — a live-mount drawer dispatches a real script
            # call on every read (cache already ruled out above). Nested script
            # calls each get a fresh context.id, so the guard is presence-based:
            # if a resolution of this drawer is already in flight (marker
            # present, under 30s old), refuse. A second resolution before the
            # first finishes is a cycle (self-reference or A->B->A). The marker
            # is cleared on every exit below; the 30s expiry only covers a run
            # that died mid-resolution.
            - variables:
                _tc_guard_key: "{{ _key }}/mount_resolving"
                _tc_guard_raw: "{{ (_g_vol0.get(_tc_guard_key) or {}).get('value') }}"
                _tc_guard_ts: "{{ (_tc_guard_raw if _tc_guard_raw is mapping else {}).get('started_at', '') }}"
            - variables:
                _tc_cycle_detected: >-
                  {%- set _gts = as_datetime(_tc_guard_ts, none) if _tc_guard_ts != '' else none -%}
                  {{ _gts is not none and (now() - _gts).total_seconds() < 30 }}
            - if:
              - condition: template
                value_template: "{{ _tc_cycle_detected }}"
              then:
              - variables:
                  result:
                    status: error
                    tool: zen_sutra_filecabinet
                    action: get
                    key: "{{ _key }}"
                    volume: "{{ _vol }}"
                    mount_traversal:
                      status: tool_call_cycle_detected
                      reason: >-
                        Live drawer '{{ _key }}' on {{ _vol }} is already being
                        resolved — a nested call tried to read it again before
                        the first resolution finished. Self-referential or
                        circular fc_args mount. Refused instead of recursing.
                        Check the drawer's fc_args (tool={{ _tc_tool }}) for a
                        mount that points back at its own reader.
                      tool: "{{ _tc_tool }}"
                    trace:
                      caller_token: "{{ _caller_token }}"
            - if: "{{ result is not defined }}"
              then:
              - action: script.zen_sutra_filecabinet
                data:
                  mode: upsert
                  write_mode: replace
                  volume_entity_id: "{{ _vol }}"
                  path: "{{ _tc_guard_key }}"
                  value:
                    started_at: "{{ now().isoformat() }}"
                  expires_after: "{{ (now() + timedelta(seconds=30)).isoformat() }}"
                continue_on_error: true
              - choose:
                - conditions:
                  - condition: template
                    value_template: "{{ not (_tc_tool | regex_search('^zen_')) }}"
                  sequence:
                  - action: script.zen_sutra_filecabinet
                    data:
                      mode: delete
                      volume_entity_id: "{{ _vol }}"
                      path: "{{ _tc_guard_key }}"
                    continue_on_error: true
                  - variables:
                      result:
                        status: error
                        tool: zen_sutra_filecabinet
                        action: get
                        key: "{{ _key }}"
                        volume: "{{ _vol }}"
                        mount_traversal:
                          status: tool_call_blocked
                          reason: >-
                            Live drawer tool '{{ _tc_tool }}' is a lens verb, not a dispatchable script.
                            Use a zen_* script name in fc_args.tool (e.g. zen_dojotools_filecabinet,
                            zen_sutra_filecabinet). Lens verbs like 'read' and 'manifest' are not
                            HA scripts and cannot be dispatched inline.
                          tool: "{{ _tc_tool }}"
                        trace:
                          caller_token: "{{ _caller_token }}"
              - if: "{{ result is not defined }}"
                then:
                - action: "script.{{ _tc_tool }}"
                  data: "{{ _tc_params }}"
                  continue_on_error: true
                  response_variable: _tc_raw
                - action: script.zen_sutra_filecabinet
                  data:
                    mode: delete
                    volume_entity_id: "{{ _vol }}"
                    path: "{{ _tc_guard_key }}"
                  continue_on_error: true
                - variables:
                    # Cadillac-enveloped tools return {mode,status,tool,version,result:{...}}.
                    # Unwrap immediately, one chokepoint, before anything downstream
                    # (digest_fields extraction or the raw-store fallback) ever sees
                    # it. Sutra/legacy callees with no 'result' key pass through
                    # untouched, so this stays compatible with non-enveloped tools.
                    _tc_unwrapped: >-
                      {{ _tc_raw.get('result', _tc_raw) if _tc_raw is mapping else _tc_raw }}
                - if:
                  - condition: template
                    value_template: "{{ _tc_raw is defined and _tc_raw is not none }}"
                  then:
                  - variables:
                      _tc_digest: >-
                        {%- set _fields = (_tc_cache_cfg if _tc_cache_cfg is mapping else {}).get('digest_fields', []) -%}
                        {%- if _fields | length == 0 -%}{{ _tc_unwrapped }}
                        {%- else -%}
                          {%- set ns = namespace(d={}) -%}
                          {%- for _f in _fields -%}
                            {%- set _parts = _f.split('.') -%}
                            {%- set _v = _tc_unwrapped -%}
                            {%- for _p in _parts -%}{%- set _v = (_v if _v is mapping else {}).get(_p) -%}{%- endfor -%}
                            {%- set ns.d = ns.d | combine({_f: _v}) -%}
                          {%- endfor -%}
                          {{ ns.d }}
                        {%- endif -%}
                  - if:
                    - condition: template
                      value_template: >-
                        {{ _tc_cache_cfg is mapping and
                           (_tc_cache_cfg.get('ttl_seconds', 0) | int) > 0 }}
                    then:
                    - action: script.zen_sutra_filecabinet
                      data:
                        mode: upsert
                        write_mode: replace
                        volume_entity_id: "{{ _vol }}"
                        path: "{{ _key }}/cache"
                        value: "{{ _tc_digest }}"
                        expires_after: >-
                          {{ (now().timestamp() + (_tc_cache_cfg.get('ttl_seconds', 300) | int))
                             | timestamp_custom('%Y-%m-%dT%H:%M:%S%z', true) }}
                  - variables:
                      result:
                        status: success
                        tool: zen_sutra_filecabinet
                        action: get
                        key: "{{ _key }}"
                        volume: "{{ _vol }}"
                        title: "{{ _key }}"
                        value: "{{ _tc_digest }}"
                        mount_traversal:
                          status: resolved_via_tool_call
                          tool_called: "{{ _tc_tool }}"
                          cache: miss
                          depth: "{{ _g_mt.get('depth', 0) }}"
                          visited: "{{ _g_mt.get('visits', []) }}"
                        trace:
                          caller_token: "{{ _caller_token }}"
                  else:
                    - variables:
                        result:
                          status: error
                          tool: zen_sutra_filecabinet
                          action: get
                          key: "{{ _key }}"
                          volume: "{{ _vol }}"
                          mount_traversal:
                            status: tool_call_error
                            reason: "Live drawer tool call returned no response."
                            tool: "{{ _tc_tool }}"
                          trace:
                            caller_token: "{{ _caller_token }}"
        - if: "{{ result is not defined }}"
          then:
          - variables:
              _get_val: >-
                {{ _get_raw.get('value') if _get_raw is mapping else none }}
          - variables:
              _get_is_v1: >-
                {{ _get_val is mapping and _get_val.get('v') == 1 and 'content' in _get_val }}
          - variables:
              _get_tags: >-
                {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                {%- set _v_s = (state_attr(_vol, 'variables') if state_attr(_vol, 'variables') is mapping else {}) -%}
                {%- set _v = _v_s if _v_s is mapping else (_v_s | from_json(none) if _v_s is string else none) -%}
                {%- set _ci = ((_v if _v is mapping else {}).get('_label_index', {}).get('value', {})) -%}
                {%- set _ci = _ci if _ci is mapping else (_ci | from_json(none) if _ci is string and _ci | trim not in ['', '{}', 'null'] else {}) -%}
                {%- set _ci = _ci if _ci is mapping else {} -%}
                {%- set _ds = _key -%}
                {%- set _ns = namespace(t=[]) -%}
                {%- for _lbl, _drawers in _ci.items() -%}
                  {%- if _drawers is iterable and not _drawers is string and _ds in _drawers -%}
                    {%- set _ns.t = _ns.t + [_lbl] -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ _ns.t }}
              _gformat: >-
                {%- if _get_val is mapping and _get_val.get('v') == 1 and 'content' in _get_val -%}v1
                {%- elif _get_raw is not none -%}raw
                {%- else -%}notfound{%- endif -%}
          - variables:
              _gc: >-
                {%- if _gformat == 'v1' -%}{{ _get_val.get('content', '') }}
                {%- elif _gformat == 'raw' -%}{{ _get_val if _get_val is string else (_get_val | tojson if _get_val is not none else '') }}
                {%- else -%}{%- endif -%}
              _gt: >-
                {%- if _gformat == 'v1' -%}{{ _get_val.get('title', _key) }}
                {%- else -%}{{ _key }}{%- endif -%}
              _gd: >-
                {%- if _gformat == 'v1' -%}{{ _get_val.get('description', '') }}
                {%- else -%}{%- endif -%}
              _gca: >-
                {%- if _gformat == 'v1' -%}{{ _get_val.get('created_at', '') }}
                {%- else -%}{%- endif -%}
              _gua: >-
                {%- if _gformat == 'v1' -%}{{ _get_val.get('updated_at', '') }}
                {%- else -%}{{ (_get_raw if _get_raw is mapping else {}).get('timestamp', '') }}{%- endif -%}
              _gea: >-
                {%- set _em = (_get_raw.get('meta') if _get_raw is mapping else none) -%}
                {%- if _em is mapping and 'expires_after' in _em -%}{{ _em.get('expires_after') }}
                {%- elif _gformat == 'v1' -%}{{ _get_val.get('expires_after', '') }}
                {%- else -%}{%- endif -%}
              _gna: >-
                {%- set _em = (_get_raw.get('meta') if _get_raw is mapping else none) -%}
                {%- if _em is mapping and 'no_autoexpire' in _em -%}{{ _em.get('no_autoexpire') }}
                {%- elif _gformat == 'v1' -%}{{ _get_val.get('no_autoexpire', false) }}
                {%- else -%}false{%- endif -%}
              _gnr: >-
                {%- set _em = (_get_raw.get('meta') if _get_raw is mapping else none) -%}
                {%- if _em is mapping and 'no_autorecycle' in _em -%}{{ _em.get('no_autorecycle') }}
                {%- elif _gformat == 'v1' -%}{{ _get_val.get('no_autorecycle', false) }}
                {%- else -%}false{%- endif -%}
          - variables:
              _gv: >-
                {%- if _gc is string and _gc | trim != '' -%}
                  {%- set _p = _gc | from_json(none) -%}
                  {{ _p if _p is not none else _gc }}
                {%- elif _gc is mapping -%}
                  {{ _gc }}
                {%- else -%}
                  {{ none }}
                {%- endif -%}
          - variables:
              _drawers: >-
                {%- set _prefix = _key ~ '/' -%}
                {%- set _vol0 = _g_vol0 if _g_vol0 is mapping else {} -%}
                {%- set _ns = namespace(d={}) -%}
                {%- for _ck, _cv in _vol0.items() -%}
                  {%- if _ck.startswith(_prefix) and '/' not in _ck[_prefix | length:] -%}
                    {%- set _child = _ck[_prefix | length:] -%}
                    {%- set _cval = (_cv.get('value') or none) if _cv is mapping else none -%}
                    {%- set _is_m = _cval is mapping and _cval.get('mount_point', false) == true -%}
                    {%- set _cua = (_cv.get('timestamp', '')) if _cv is mapping else '' -%}
                    {%- set _ns.d = _ns.d | combine({_child: {'is_mount': _is_m, 'updated_at': _cua}}) -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ _ns.d if _ns.d | length > 0 else none }}
          - variables:
              _subdrawers: >-
                {%- if _drawers is mapping and _drawers | length > 0 -%}
                  {%- set _ns = namespace(keys=[]) -%}
                  {%- for ck in _drawers.keys() -%}
                    {%- set _ns.keys = _ns.keys + [_key ~ '/' ~ ck] -%}
                  {%- endfor -%}
                  {{- _ns.keys -}}
                {%- else -%}
                  {{- [] -}}
                {%- endif -%}
          - variables:
              result: >-
                {%- if _gformat == 'notfound' -%}
