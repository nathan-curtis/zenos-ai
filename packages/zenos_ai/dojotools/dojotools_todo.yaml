###############################################################################
# ZenOS-AI DojoTools: ToDo
# Version: 5.1.0
# 2.4.0 — Multi-entity read (inspect_export): entity_ids[] + include_task_ids flag.
#          Called by Inspect domain context to feed domain_context.todo without GUIDs.
#          +task_ids output_fields flag opts in to uid field.
# 2.3.0 — Read: use all_todos entity attr for MS365 lists (due field was
#          returning reminderDateTime instead of dueDateTime via todo.get_items)
#
# Scripts:
#   zen_dojotools_todo  — HA Todo domain CRUD (v5.1.0)
#
# SPLIT FROM: dojotools_office.yaml (2026-05-15)
# Previously bundled with M365 office tools (Teams, Mail).
# Now standalone as a generalist HA todo domain tool.
#
# === CARRIED UAT PASS from dojotools_office.yaml (2026-03-06) ===
###############################################################################

script:
  zen_dojotools_todo:
    alias: Zen DojoTools ToDo
    description: >-
      zen_dojotools_todo 2.5.0 — Household and person-centric todos: shopping
      lists, trash day reminders, health tasks, medication schedules, async
      backlogs. Never call HA todo services directly
      — wraps all ops with continue_on_error so auth failures return clean JSON
      instead of crashing pipelines. Resolves list names and label targets automatically.
      ROUTING: Tasks attached to a product or physical location (spa checks,
      equipment maintenance, asset chores) belong in zen_dojotools_inventory,
      not here. action_type: read (default)|create|update|delete|help.
      Complete a task: action_type=update items=['Name'] status=completed
      list_name='List'. list_name: friendly name or entity_id; omit/'*' =
      wildcard. items: strings or {item,status,due_date,description,rename}.
      Bulk complete: multiple item strings + status=completed. MS365: reminder field routes through ms365_todo.new_todo.
      label_targets: read across label-tagged lists. Errors return {status:error,message}.
      Use action_type=help for field docs + examples.
      Aliases: ['Zen DojoTools ToDo', 'Domain tool for ToDo lists']
    sequence:
    # --------------------------------------------------------------
    # Always normalize User/AI inputs so we don't have to react JIT
    # --------------------------------------------------------------
    - variables:
        caller_token: "{{- caller_token | default('') -}}"
    - variables:
        action_type: '{{ action_type | default(action | default(''read'')) }}'
        items: "{%- if items is defined and items is iterable and items|length > 0\
          \ -%}\n  {{ items }}\n{%- else -%}\n  ['']\n{%- endif -%}"
        due_date: '{{ due_date | default('''') }}'
        description: '{{ description | default('''') }}'
        rename: '{{ rename | default('''') }}'
        list_name: '{{ list_name | default(list_id | default('''')) }}'
        status: '{{ status | default(''needs_action'') }}'
        todo_lists: '{{ states.todo | map(attribute=''entity_id'') | list }}'
        valid_todo_entities: '{{ states.todo | map(attribute=''entity_id'') | map(''lower'')
          | list }}'
        todo_list_entity: "{%- if list_name[0:5] == 'todo.' -%}\n  {{ list_name |\
          \ lower | replace(' ', '_') }}\n{%- else -%}\n  todo.{{ list_name | lower\
          \ | replace(' ', '_') }}\n{%- endif -%}"
        todo_list_entity_exists: '{{ todo_list_entity in valid_todo_entities }}'
        label_targets: "{{\n  (\n    label_targets\n    if label_targets is iterable\
          \ and label_targets is not string\n    else label_targets.splitlines() if\
          \ '\\n' in label_targets\n    else label_targets.split(',')\n  )\n  | map('trim')\
          \ | map('lower') | select('string') | list\n}}"
        label_entities: "{{\n  label_targets | map('label_entities') | sum(start=[])\n\
          \  | select('match', '^todo\\\\.') | unique | list\n}}"
        target_lists: '{{ label_entities if label_entities | length > 0 else [todo_list_entity]
          }}'
        is_list_wildcard: '{{ list_name in ['''', None, ''*''] }}'
        is_items_wildcard: '{{ items is not defined or items|length == 0 or (items|length
          == 1 and items[0] in ['''', None, ''*'']) }}'
        list_query: '{{ is_list_wildcard or action_type not in [''create'',''read'',''update'',''delete'']
          }}'
        todo_lists_data: >-
          {%- set _pool = states.todo | map(attribute='entity_id') | list -%}
          {%- set ns = namespace(items=[]) -%}
          {%- for lid in _pool -%}
            {%- set ns2 = namespace(lbls=[]) -%}
            {%- for llid in labels(lid) -%}
              {%- set ns2.lbls = ns2.lbls + [label_name(llid)] -%}
            {%- endfor -%}
            {%- set ns.items = ns.items + [{'entity_id': lid, 'friendly_name': state_attr(lid, 'friendly_name') | default(''), 'labels': ns2.lbls}] -%}
          {%- endfor -%}
          {{ ns.items | tojson }}
        is_ms365_todo: '{{ todo_list_entity in integration_entities(''ms365'') }}'
        reminder: '{{ reminder | default('''') }}'
        entity_ids_list: >-
          {%- if entity_ids is defined and entity_ids not in ['', none] -%}
            {%- if entity_ids is string -%}{{ entity_ids | from_json | default([]) }}{%- elif entity_ids is iterable -%}{{ entity_ids | list }}{%- else -%}[]{%- endif -%}
          {%- else -%}[]{%- endif -%}
        include_task_ids: "{{ include_task_ids | default(false) | bool }}"
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ is_list_wildcard and action_type in [''read'',''list'']
            and entity_ids_list | length == 0 }}'
        sequence:
        - variables:
            final_response: >-
              {{
                {
                  "status": "info",
                  "message": "All available to-do lists with labels.",
                  "lists": todo_lists_data if todo_lists_data is not string else (todo_lists_data | from_json)
                } | tojson
              }}
        - variables:
            final_response: "{{ (final_response if final_response is mapping else (final_response | from_json)) | combine({'caller_token': caller_token | default('')}) }}"
        - stop: Pass response variables back to LLM
          response_variable: final_response
        - set_conversation_response: '{{ final_response }}'
        alias: show all lists and labels on wildcard
      - conditions:
        - condition: template
          value_template: '{{ action_type == ''help'' or action_type not in [''create'',''read'',''update'',''delete'']
            }}'
        sequence:
        - variables:
            help_data: >-
              {{
                {
                  "status": "info",
                  "version": "2.5.0",
                  "message": "Zen DojoTools ToDo v2.3.0 Help",
                  "why_use_this": "Wraps HA todo services with continue_on_error isolation. Auth failures (401s) return clean errors instead of crashing the pipeline. Consistent JSON responses, automatic list name resolution, label targeting.",
                  "actions": {
                    "read": "Read items. Omit list_name or use '*' for wildcard (discovers all lists). Filter by status field.",
                    "create": "Create items as strings or {item, due_date, description, reminder} objects.",
                    "update": "Single-item full edit (rename/due_date/description/status) or bulk status update for multiple items.",
                    "delete": "Delete item(s) by exact name. Uses continue_on_error — check list if auth is stale.",
                    "help": "Show this help."
                  },
                  "fields": {
                    "list_name": "Friendly name or entity_id (todo.*). Omit or '*' = wildcard.",
                    "items": "Strings or {item, status, due_date, description, rename} objects.",
                    "status": "needs_action (default) or completed.",
                    "due_date": "ISO YYYY-MM-DD. Create or single-item update only.",
                    "description": "Notes text. Create or single-item update only.",
                    "rename": "New title. Single-item update only.",
                    "label_targets": "HA label names — reads across all todo lists bearing those labels.",
                    "reminder": "MS365 only: ISO datetime. Routes create through ms365_todo.new_todo."
                  },
                  "errors": {
                    "list_not_found": "Check list_name spelling. Wildcard read returns all valid list names.",
                    "auth_failure": "Integration token expired (401). Re-authenticate via HA Settings > Integrations. Operations use continue_on_error — items may not persist; verify the list after.",
                    "bulk_complex": "Bulk update supports status changes only. For multi-field edits send one item at a time."
                  },
                  "examples": [
                    "Read all lists: {action_type: read}",
                    "Read one list: {action_type: read, list_name: 'Household Chores'}",
                    "Create: {action_type: create, list_name: 'Household Chores', items: ['Take out trash'], due_date: '2026-05-25'}",
                    "Complete one: {action_type: update, list_name: 'Household Chores', items: ['Take out trash'], status: completed}",
                    "Bulk complete: {action_type: update, list_name: 'Household Chores', items: ['Task A', 'Task B'], status: completed}",
                    "Delete: {action_type: delete, list_name: 'Household Chores', items: ['Old task']}"
                  ]
                } | tojson
              }}
        - variables:
            help_data: "{{ (help_data if help_data is mapping else (help_data | from_json)) | combine({'caller_token': caller_token | default('')}) }}"
        - stop: Pass response variables back to LLM
          response_variable: help_data
        - set_conversation_response: '{{ help_data }}'
        alias: return help
      - conditions:
        - condition: template
          value_template: "{{ action_type == 'read' and entity_ids_list | length > 0 }}"
        sequence:
        - variables:
            multi_lists: >-
              {%- set ns = namespace(out={}) -%}
              {%- for eid in entity_ids_list -%}
                {%- set _at = state_attr(eid, 'all_todos') -%}
                {%- set _fn = state_attr(eid, 'friendly_name') | default(eid) -%}
                {%- set ns_itms = namespace(items=[]) -%}
                {%- if _at is not none and _at is not string and _at | length > 0 -%}
                  {%- for itm_raw in _at -%}
                    {%- set itm = (itm_raw | from_json) if itm_raw is string else itm_raw -%}
                    {%- if itm is mapping -%}
                      {%- set _ms_status = itm.get('status', 'notStarted') -%}
                      {%- set _ha_status = 'completed' if _ms_status == 'completed' else 'needs_action' -%}
                      {%- set _due_raw = itm.get('due', none) -%}
                      {%- set _due = _due_raw.isoformat() if _due_raw is not none and _due_raw is not string else _due_raw | default('') -%}
                      {%- set _base = {
                        'summary': itm.get('subject', ''),
                        'status': _ha_status,
                        'due': _due,
                        'description': itm.get('description', '') | default('')
                      } -%}
                      {%- set _entry = _base | combine({'uid': itm.get('todo_id', '')}) if include_task_ids else _base -%}
                      {%- set ns_itms.items = ns_itms.items + [_entry] -%}
                    {%- endif -%}
                  {%- endfor -%}
                {%- endif -%}
                {%- set ns.out = ns.out | combine({eid: {
                  'friendly_name': _fn,
                  'count': ns_itms.items | length,
                  'items': ns_itms.items
                }}) -%}
              {%- endfor -%}
              {{ ns.out | tojson }}
        - variables:
            final_response: >-
              {{
                {
                  "status": "success",
                  "message": "Multi-entity todo read",
                  "lists": multi_lists if multi_lists is mapping else (multi_lists | from_json),
                  "caller_token": caller_token | default('')
                }
              }}
        - stop: Pass items back to LLM
          response_variable: final_response
        - set_conversation_response: '{{ final_response }}'
        alias: Multi-entity read for inspect_export
      - conditions:
        - condition: template
          value_template: '{{ action_type == ''update'' and todo_list_entity_exists
            }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: >-
                {{ items | length > 1 and (
                  (items | selectattr('status','defined') | list | count == items | count)
                  or (items | selectattr('status','defined') | list | count == 0
                      and items[0] is string
                      and status in ['needs_action','completed'])
                ) }}
            sequence:
            - repeat:
                for_each: '{{ items }}'
                sequence:
                - variables:
                    bulk_update_data: "{% set itm = repeat.item %} {{ {\n  'item': itm.get('item', itm) if itm\
                      \ is mapping else itm,\n  'status': (itm.get('status', status) if itm is mapping else status)\n\
                      } }}"
                - data: '{{ bulk_update_data }}'
                  target:
                    entity_id: '{{ todo_list_entity }}'
                  action: todo.update_item
                  continue_on_error: true
            - variables:
                final_response: "{{\n  {\n    \"status\": \"success\",\n    \"message\"\
                  : \"Updated status for \" ~ (items | length) ~ \" item(s) in list\
                  \ '\" ~ list_name ~ \"'.\",\n    \"list_name\": list_name,\n   \
                  \ \"items\": items\n  } | tojson\n}}"
            - variables:
                final_response: "{{ (final_response if final_response is mapping else (final_response | from_json)) | combine({'caller_token': caller_token | default('')}) }}"
            - stop: Pass response variables back to LLM
              response_variable: final_response
            - set_conversation_response: '{{ final_response }}'
          - conditions:
            - condition: template
              value_template: "{{\n  items | length > 1 and not\n  (items | selectattr('status','defined')\
                \ | list | count == items | count)\n}}"
            sequence:
            - variables:
                final_response: "{{\n  {\n    \"status\": \"error\",\n    \"message\"\
                  : \"Multiple complex updates not supported. Only bulk status updates\
                  \ allowed.\",\n    \"list_name\": list_name\n  } | tojson\n}}"
            - variables:
                final_response: "{{ (final_response if final_response is mapping else (final_response | from_json)) | combine({'caller_token': caller_token | default('')}) }}"
            - stop: Pass response variables back to LLM
              response_variable: final_response
            - set_conversation_response: '{{ final_response }}'
          default:
          - variables:
              update_data: >-
                {%- set itm = items[0] if items|length > 0 else {} -%}
                {%- set _name   = itm.get('item','')                      if itm is mapping else itm -%}
                {%- set _status = itm.get('status', status)               if itm is mapping else status -%}
                {%- set _due    = itm.get('due_date', due_date)           if itm is mapping else due_date -%}
                {%- set _desc   = itm.get('description', description)     if itm is mapping else description -%}
                {%- set _rename = itm.get('rename', rename)               if itm is mapping else rename -%}
                {%- set ns = namespace(obj={'item': _name, 'list_id': list_name}) -%}
                {%- if _status -%}{%- set ns.obj = dict(ns.obj, status=_status)           -%}{%- endif -%}
                {%- if _due    -%}{%- set ns.obj = dict(ns.obj, due_date=_due)            -%}{%- endif -%}
                {%- if _desc   -%}{%- set ns.obj = dict(ns.obj, description=_desc)        -%}{%- endif -%}
                {%- if _rename -%}{%- set ns.obj = dict(ns.obj, rename=_rename)           -%}{%- endif -%}
                {{ ns.obj }}
          - data: >-
              {{ {'item': update_data.get('item','')}
                 | combine({'status':      update_data.get('status')}      if update_data.get('status')      else {})
                 | combine({'due_date':    update_data.get('due_date')}    if update_data.get('due_date')    else {})
                 | combine({'description': update_data.get('description')} if update_data.get('description') else {})
                 | combine({'rename':      update_data.get('rename')}      if update_data.get('rename')      else {}) }}
            target:
              entity_id: '{{ todo_list_entity }}'
            action: todo.update_item
            continue_on_error: true
          - variables:
              final_response: "{{\n  {\n    \"status\": \"success\",\n    \"message\"\
                : \"Updated item '\" ~ update_data.get('item','') ~ \"' in list '\"\
                \ ~ list_name ~ \"'.\",\n    \"item\": update_data,\n    \"list_name\"\
                : list_name\n  } | tojson\n}}"
          - variables:
              final_response: "{{ (final_response if final_response is mapping else (final_response | from_json)) | combine({'caller_token': caller_token | default('')}) }}"
          - stop: Pass response variables back to LLM
            response_variable: final_response
          - set_conversation_response: '{{ final_response }}'
        alias: update (list exists)
      - conditions:
        - condition: template
          value_template: "{{ action_type == 'read'\n   and todo_list_entity_exists\n\
            \   and is_items_wildcard\n   and not is_list_wildcard }}\n"
        sequence:
        - action: todo.get_items
          target:
            entity_id: '{{ todo_list_entity }}'
          response_variable: list_items
          continue_on_error: true
        - variables:
            _svc_items: '{{ (list_items if list_items is mapping else {}).get(todo_list_entity, {}).get(''items'', []) }}'
        - variables:
            _all_items: >-
              {%- set _at = state_attr(todo_list_entity, 'all_todos') -%}
              {%- if _at is not none and _at is not string and _at | length > 0 -%}
                {%- set ns = namespace(items=[]) -%}
                {%- for itm_raw in _at -%}
                  {%- set itm = (itm_raw | from_json) if itm_raw is string else itm_raw -%}
                  {%- if itm is mapping -%}
                    {%- set _ms_status = itm.get('status', 'notStarted') -%}
                    {%- set _ha_status = 'completed' if _ms_status == 'completed' else 'needs_action' -%}
                    {%- set _due_raw = itm.get('due', none) -%}
                    {%- set _due = _due_raw.isoformat() if _due_raw is not none and _due_raw is not string else _due_raw | default('') -%}
                    {%- set ns.items = ns.items + [{'uid': itm.get('todo_id',''), 'summary': itm.get('subject',''), 'status': _ha_status, 'due': _due, 'description': itm.get('description','')}] -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.items }}
              {%- else -%}
                {{ _svc_items }}
              {%- endif -%}
        - variables:
            items_only: "{% if status in ['needs_action','completed'] %}\n  {{ _all_items\
              \ | selectattr('status','equalto', status) | list }}\n{% else %}\n \
              \ {{ _all_items }}\n{% endif %}"
        - variables:
            final_response: "{{ {\n  \"status\": \"success\",\n  \"message\": \"All\
              \ items for list '\" ~ list_name ~ \"'\",\n  \"list_name\": list_name,\n\
              \  \"count\": items_only | length,\n  \"items\": items_only\n} | tojson\
              \ }}\n"
        - variables:
            final_response: "{{ (final_response if final_response is mapping else (final_response | from_json)) | combine({'caller_token': caller_token | default('')}) }}"
        - stop: Pass items back to LLM
          response_variable: final_response
        - set_conversation_response: '{{ final_response }}'
        alias: Read List
      - conditions:
        - condition: template
          value_template: '{{ action_type == ''create'' and todo_list_entity_exists and not is_items_wildcard }}'
        sequence:
        - repeat:
            for_each: '{{ items }}'
            sequence:
            - variables:
                item_name: '{{ repeat.item if repeat.item is string else repeat.item.get(''item'', repeat.item) }}'
                item_due: '{{ repeat.item.get(''due_date'', due_date) if repeat.item is mapping else due_date }}'
                item_desc: '{{ repeat.item.get(''description'', description) if repeat.item is mapping else description }}'
                item_reminder: '{{ repeat.item.get(''reminder'', reminder) if repeat.item is mapping else reminder }}'
            - choose:
              - conditions:
                - condition: template
                  value_template: '{{ is_ms365_todo and item_reminder }}'
                sequence:
                - data:
                    subject: '{{ item_name }}'
                    due: '{{ item_due }}'
                    description: '{{ item_desc }}'
                    reminder: '{{ item_reminder }}'
                  target:
                    entity_id: '{{ todo_list_entity }}'
                  action: ms365_todo.new_todo
                  continue_on_error: true
              default:
              - data: >-
                  {{ {'item': item_name}
                     | combine({'due_date': item_due} if item_due else {})
                     | combine({'description': item_desc} if item_desc else {}) }}
                target:
                  entity_id: '{{ todo_list_entity }}'
                action: todo.add_item
                continue_on_error: true
        - variables:
            final_response: "{{\n  {\n    \"status\": \"success\",\n    \"message\": \"Created \" ~ (items | length) ~ \" item(s) in '\" ~ list_name ~ \"'.\",\n    \"list_name\": list_name,\n    \"items\": items\n  } | tojson\n}}"
        - variables:
            final_response: "{{ (final_response if final_response is mapping else (final_response | from_json)) | combine({'caller_token': caller_token | default('')}) }}"
        - stop: Pass response variables back to LLM
          response_variable: final_response
        - set_conversation_response: '{{ final_response }}'
        alias: create items
      - conditions:
        - condition: template
          value_template: '{{ action_type == ''delete'' and todo_list_entity_exists and not is_items_wildcard }}'
        sequence:
        - if: '{{ is_ms365_todo }}'
          then:
          - action: todo.get_items
            target:
              entity_id: '{{ todo_list_entity }}'
            response_variable: _del_raw
            continue_on_error: true
          - variables:
              _del_auth_issue: "{{ not (_del_raw is mapping and _del_raw | length > 0) }}"
          - variables:
              _del_uid_map: >-
                {%- set _at = state_attr(todo_list_entity, 'all_todos') -%}
                {%- set ns = namespace(map={}) -%}
                {%- if _at is not none and _at is iterable and _at is not string -%}
                  {%- for itm_raw in _at -%}
                    {%- set itm = (itm_raw | from_json) if itm_raw is string else itm_raw -%}
                    {%- if itm is mapping and itm.get('todo_id','') != '' -%}
                      {%- set ns.map = ns.map | combine({itm.get('subject',''): itm.get('todo_id','')}) -%}
                    {%- endif -%}
                  {%- endfor -%}
                {%- endif -%}
                {{ ns.map }}
          - repeat:
              for_each: '{{ items }}'
              sequence:
              - variables:
                  item_name: '{{ repeat.item if repeat.item is string else repeat.item.get(''item'', repeat.item) }}'
                  _del_uid: '{{ _del_uid_map.get(item_name, '''') }}'
              - if: '{{ _del_uid != '''' }}'
                then:
                - data:
                    todo_id: '{{ _del_uid }}'
                  target:
                    entity_id: '{{ todo_list_entity }}'
                  action: ms365_todo.delete_todo
                  continue_on_error: true
                else:
                - data:
                    item: '{{ item_name }}'
                  target:
                    entity_id: '{{ todo_list_entity }}'
                  action: todo.remove_item
                  continue_on_error: true
          else:
          - repeat:
              for_each: '{{ items }}'
              sequence:
              - variables:
                  item_name: '{{ repeat.item if repeat.item is string else repeat.item.get(''item'', repeat.item) }}'
              - data:
                  item: '{{ item_name }}'
                target:
                  entity_id: '{{ todo_list_entity }}'
                action: todo.remove_item
                continue_on_error: true
        - variables:
            final_response: >-
              {%- if _del_auth_issue | default(false) -%}
                {{ {"status": "error", "message": "auth_failure — MS365 token expired or access denied. Re-authenticate via Settings → Integrations. Items may not have been deleted — verify the list.", "list_name": list_name} | tojson }}
              {%- else -%}
                {{ {"status": "success", "message": "Deleted " ~ (items | length) ~ " item(s) from '" ~ list_name ~ "'.", "list_name": list_name} | tojson }}
              {%- endif -%}
        - variables:
            final_response: "{{ (final_response if final_response is mapping else (final_response | from_json)) | combine({'caller_token': caller_token | default('')}) }}"
        - stop: Pass response variables back to LLM
          response_variable: final_response
        - set_conversation_response: '{{ final_response }}'
        alias: delete items
    - if:
        - condition: template
          value_template: >-
            {{ not todo_list_entity_exists
               and action_type in ['read','create','update','delete']
               and not is_list_wildcard }}
      then:
        - variables:
            final_response: >-
              {{
                {
                  "status": "error",
                  "message": "List not found: '" ~ list_name ~ "'. Use action_type=read (no list_name) to see all valid lists.",
                  "list_name": list_name
                } | tojson
              }}
        - variables:
            final_response: "{{ (final_response if final_response is mapping else (final_response | from_json)) | combine({'caller_token': caller_token | default('')}) }}"
        - stop: list not found error
          response_variable: final_response
    - variables:
        final_response: "{{\n  final_response\n  | default(\n    {\n      \"status\"\
          : \"noop\",\n      \"message\": \"No matching branch produced a response.\"\
          \n    } | tojson\n  )\n}}"
    - variables:
        final_response: "{{ (final_response if final_response is mapping else (final_response | from_json)) | combine({'caller_token': caller_token | default('')}) }}"
    - stop: Pass context
      response_variable: final_response
    - set_conversation_response: '{{ final_response }}'
    fields:
      action_type:
        description: '''create'', ''read'', ''update'', ''delete'', ''help'' (Default:
          read)'
        selector:
          select:
            options:
            - create
            - read
            - update
            - delete
            - help
        default: read
      action:
        description: Alias for action_type. Invalid values return help.
        selector:
          text:
      list_name:
        description: To-do list name (default '' or '*' = all lists)
        selector:
          text:
      list_id:
        description: Alias for list_name. Accepts entity_id or friendly name.
        selector:
          text:
      items:
        description: >-
          Strings or objects {item,status,due_date,description,rename}. Bulk complete: multiple strings + status=completed.
        selector:
          text:
            multiple: true
      status:
        description: "completed|needs_action. Complete: action_type=update items=['Name'] status=completed list_name='X'."
        selector:
          select:
            options:
            - needs_action
            - completed
        default: needs_action
      due_date:
        description: 'ISO date (YYYY-MM-DD). Sets or changes the due date on create or single-item update.'
        required: false
        selector:
          text:
      description:
        description: 'Item notes/description text. Supported on create and single-item update.'
        required: false
        selector:
          text:
      rename:
        description: 'New summary/title for the item. Single-item update only.'
        required: false
        selector:
          text:
      label_targets:
        description: "HA labels to scope read across multiple lists. e.g. ['household_tasks']"
        selector:
          text:
            multiple: true
      reminder:
        description: 'MS365 only: reminder datetime (ISO format). Uses ms365_todo.new_todo if set.'
        required: false
        selector:
          text:
      entity_ids:
        description: 'JSON array of todo entity_ids for multi-entity read (inspect_export path). Passed by Inspect domain context — not for direct human use.'
        required: false
        selector:
          text:
      include_task_ids:
        description: 'When true, include uid (MS365 todo_id) in multi-entity read output. Controlled by +task_ids in output_fields. Default false.'
        required: false
        selector:
          text:
      caller_token:
        name: Caller Token
        description: Opaque token passed through by the caller for correlation. Not interpreted by this script.
        required: false
        selector:
          text:
    icon: mdi:clipboard-check-multiple

