###############################################################################
# ZenOS-AI DojoTools: AdminTools
# Version: 5.3.1
#
# v5.3.1 (2026-07-18):
#   - prompt_loader: new sim_mode_allowed field (default false) — stamped into
#     integrations_config.identity.sim_mode_allowed on every factory run. OS-level
#     SP1 policy switch (see dojotools_identity.yaml resolve_caller_identity /
#     project_sp1_acl_candidates). Fail-closed default, explicit on every install.
#
# v5.3.0 (Zen pull, 2026-07-04):
#   - cabinetadmin: new mode=expand_drawer — atomic single-drawer migration to
#     an expansion cabinet (space-threshold check, mount-pointer replacement,
#     round-trip verify, auto-rollback on any failure).
#   - cabinetadmin: repair_volumeinfo now also self-heals the missing-header
#     case (init state, no VolumeInfo at all) via cabinetadmin_factory, not
#     just the JSON-string-instead-of-mapping case.
#   - prompt_loader: mode=whitelist add path now rejects bare '*' and
#     empty-suffix 'tool:' entries (KF5 mode-scoped whitelist guard).
#     fc-type whitelist field renamed allowed_action_types -> allowed_tools
#     to match the tool:mode entry format.
#
# Scripts:
#   zen_admintools_reset_template        — Kata + Dojo template press (v5.1.0)
#   zen_admintools_cabinetadmin          — Cabinet inspect/restore/reset/hammer (v4.5.x)
#   zen_admintools_cabinetadmin_factory   — Cabinet factory stamper/repairer (v1.x)
#   zen_admintools_prompt_loader   — Cortex/Directives/Purpose loader
#   zen_admintools_run_repair            — Human-confirmed passthrough to maint/ scripts (v5.1.0)
#
# NOTE: zen_dojotools_kungfu_writer removed 2026-03-25 — superseded by zen_dojotools_scribe
#
# MIGRATED FROM: scripts.yaml (2026-03-06)
#
# FG-14 FIXED: boolean: {} in cabinetadmin, 5x boolean: {} + 2x text: {} in cabinetadmin_factory
# FG (sandbox) FIXED: mounts.append() -> namespace(mounts=[]) in cabinetadmin_factory
#
# === UAT PASS — 2026-03-06 ===
# Auditor: Claude (Anthropic, Sonnet 4.6)
# HALMark: 0.9.11-draft — PASS Level 3 (Steward Safe) — no remaining FG hits
# UAT Cases: 1/1 PASS (non-destructive only; destructive scripts load-verified only)
#
# zen_admintools_reset_template, cabinetadmin, cabinetadmin_factory, prompt_loader:
#   not MCP-exposed; verified via config check pass + clean restart ✓
#
# config check → go; restart → clean ✓
# ==============================
###############################################################################

script:
  zen_admintools_reset_template:
    sequence:
    - choose:
      - conditions:
        - condition: template
          value_template: "{{- mode | default('') == 'tool_manifest' -}}"
        sequence:
        - variables:
            result: >-
              {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
              {{- MF.tool_manifest(
                tool='zen_admintools_reset_template',
                display_name='Reset Template — Kata + Dojo Press',
                tier='admintools',
                version='5.1.0',
                health={'configured': true, 'status': 'ok', 'notes': []},
                required_labels=['admintools'],
                optional_labels=[],
                consumes=['kata_cabinet', 'household_cabinet'],
                returns=['template_reset_status'],
                failure_policy='hard',
                modes={'reset': 'default', 'manifest': 'tool_manifest'},
                icon='mdi:restore',
                color='deep-orange',
                caller_token=caller_token | default('')
              ) | from_json -}}
        - stop: reset_template tool manifest
          response_variable: result
    - variables:
        zen_template_seed: "{\n  \"structure\": {\n    \"system\": {\n      \"cortex\":
          null,\n      \"os_version\": null,\n      \"build_version\": null\n    },\n
          \   \"home_overview\": {\n      \"status\": null,\n      \"risks\": [],\n
          \     \"events\": []\n    },\n    \"active_components\": {},\n    \"zen_summary\":
          {\n      \"summary\": null,\n      \"attention\": null,\n      \"objective\":
          null,\n      \"subjective\": null,\n      \"urgency\": 0,\n      \"confidence\":
          0.0,\n      \"criticality\": 1,\n      \"emotion_queue\": [],\n      \"errors\":
          [],\n      \"timestamp\": null\n    }\n  },\n  \"example\": {\n    \"system\":
          {\n      \"cortex\": \"nominal\",\n      \"os_version\": \"ZenOS-AI (5.1.0)\",\n
          \     \"build_version\": \"SuperSummary 1.0.0-beta\"\n    },\n    \"home_overview\":
          {\n      \"status\": \"ok\",\n      \"risks\": [\"storm watch active\"],\n
          \     \"events\": [\"2025-09-23T07:15:00Z: power dip detected\"]\n    },\n
          \   \"active_components\": {\n      \"lights\": {\n        \"summary\": \"Living
          room lights on\",\n        \"attention\": \"Timer expiring\"\n      },\n      \"water_manager\":
          {\n        \"summary\": \"Chlorine low\",\n        \"attention\": \"Shock
          treatment due in 12h\"\n      }\n    },\n    \"zen_summary\": {\n      \"summary\":
          \"House stable, minor risks (weather, spa chemistry).\",\n      \"attention\":
          \"Spa needs treatment, monitor grid instability.\",\n      \"objective\":
          \"Maintain household comfort while addressing flagged components.\",\n      \"subjective\":
          \"Confident overall, cautious due to external conditions.\",\n      \"urgency\":
          6,\n      \"confidence\": 0.85,\n      \"criticality\": 3,\n      \"emotion_queue\":
          [\"calm\", \"alert\"],\n      \"errors\": [],\n      \"timestamp\": \"2025-09-23T12:15:00Z\"\n
          \   }\n  }\n}"
        kfc_template_seed: >-
          {{
            {
              "schema_version": "1.4.0",
              "structure": {
                "version": None,
                "friendly_name": None,
                "label": None,
                "component_summary": None,
                "component_instructions": None,
                "more_info": None,
                "tool": None,
                "trigger_subscriptions": [],
                "delay_seconds": 0,
                "kata_key": None,
                "drift_threshold": None,
                "emission_cooldown_minutes": None,
                "suggested_act_event": None,
                "index_call": None,
                "seed": None,
                "area_seed": None,
                "meta": {
                  "enabled": None,
                  "requires": {
                    "cert": None,
                    "level": None
                  }
                }
              },
              "example": {
                "version": "1.4.0",
                "friendly_name": "Alert Manager",
                "label": "Alert Manager",
                "component_summary": "Monitors system alerts and persistent notifications.",
                "component_instructions": "Focus on unacknowledged alerts. Escalate if count > 3.",
                "more_info": "Feeds into SuperSummary urgency score.",
                "tool": None,
                "trigger_subscriptions": ["ha_start", "daily_midnight", "hourly_trigger", "home_mode_updates", "alarm_panel"],
                "delay_seconds": 0,
                "kata_key": "alert_manager",
                "drift_threshold": 7,
                "emission_cooldown_minutes": 60,
                "suggested_act_event": None,
                "index_call": {
                  "label_1": "alert_manager",
                  "label_2": None,
                  "operator": "AND",
                  "filter_json": None,
                  "expand_entities": True,
                  "output_fields": []
                },
                "seed": None,
                "area_seed": None,
                "meta": {
                  "enabled": True,
                  "requires": {
                    "cert": "",
                    "level": 0
                  }
                }
              },
              "notes": {
                "meta.requires": "Stub in 1.2.0 — cert and level are stored but not enforced. zen_auth enforcement arrives in SP1.",
                "drift_threshold": "Urgency score at or above this value triggers a forced supersummary synthesis. Default 7.",
                "emission_cooldown_minutes": "Minimum minutes between urgency/action emissions for this component. Default 60. Prevents spam if urgency stays elevated across synthesis cycles.",
                "suggested_act_event": "Event kind string Monk may return when action_required is true. Must be in zen_summarizer_act_whitelist to emit.",
                "seed": "Generalized tool call descriptor. {tool: zen_dojotools_index, params: {query: '...'}}. When present, replaces index_call as the context-fetch mechanism. Concept-first domains: define seed only. index_call used when seed absent (backward compat).",
                "area_seed": "Location-first variant of seed. {tool: zen_dojotools_room_manager, params: {mode: get, area: '{{area_id}}', context_slices: '...'}}. Used instead of seed when area_id is present in the trigger context. {{area_id}} slot filled at runtime."
              }
            } | tojson
          }}
    - variables:
        kata_template_seed: >-
          {{
            {
              "schema_version": "1.0.0",
              "structure": {
                "subjective": None,
                "general_inference": None,
                "attention": None,
                "objective": None,
                "events": [],
                "watchlist": [],
                "error": None,
                "post": True,
                "urgency": 0,
                "confidence": 0.0,
                "action_required": False,
                "suggested_act_desc": None,
                "suggested_act_event": None,
                "period": None,
                "last_emission_at": None
              },
              "example": {
                "subjective": "Household alert count rising.",
                "general_inference": "Three alerts unacknowledged since 06:00.",
                "attention": "Check alert backlog — 3 unacknowledged.",
                "objective": "Resolve unacknowledged alerts.",
                "events": ["2025-09-23T06:00:00Z: alert created"],
                "watchlist": ["alert_manager"],
                "error": None,
                "post": True,
                "urgency": 3,
                "confidence": 0.85,
                "action_required": False,
                "suggested_act_desc": None,
                "suggested_act_event": None,
                "period": "Home-Morning",
                "last_emission_at": None
              },
              "notes": {
                "period": "Semantic home mode at kata write time. One of: Home-Wake, Home-Morning, Home, Home-Evening, Night, Night-Late, Away, Paused. Ninja always stamps this from input_select.zen_home_mode — never trust Monk's returned value for this field.",
                "last_emission_at": "ISO timestamp of last urgency/action emission for this component. Null if no emission has fired. Used by cooldown gate — do not write manually.",
                "urgency": "0–10 integer. Ninja fires summary_force when urgency >= KFC drift_threshold.",
                "action_required": "Boolean. True means Monk identified an action needed. Triggers dojotool_call(urgency_handler) and three-layer gate for suggested_act_event."
              }
            } | tojson
          }}
        act_whitelist_seed: >-
          {{
            {
              "allowed_events": [],
              "note": "Operator-managed whitelist. Manage via zen_admintools_prompt_loader mode=whitelist type=act. Empty by default — all action emission is blocked until explicitly allowed."
            } | tojson
          }}
        seed_whitelist_seed: >-
          {{
            {
              "allowed_tools": ["zen_dojotools_index"],
              "note": "Operator-managed seed whitelist. Manage via zen_admintools_prompt_loader mode=whitelist type=seed. zen_dojotools_index allowed by default for backcompat."
            } | tojson
          }}
        fc_callout_whitelist_seed: >-
          {{
            {
              "allowed_action_types": ["read", "manifest"],
              "note": "Operator-managed. Controls which action_types are permitted in tool-call mounts. Manage via zen_admintools_prompt_loader mode=whitelist type=fc."
            } | tojson
          }}
    - variables:
        _rtt_kata: "{{- states('sensor.zen_kata_cabinet_resolved') -}}"
        _rtt_dojo: "{{- states('sensor.zen_dojo_cabinet_resolved') -}}"
        _rtt_system: "{{- states('sensor.zen_system_cabinet_resolved') -}}"
    - action: script.zen_dojotools_filecabinet
      data:
        action_type: read
        show_hidden_volumes: false
        volume_entity_id:
          - "{{- _rtt_kata -}}"
        key: zen_template
      response_variable: _rtt_kata_read
    - variables:
        _rtt_kata_version: >-
          {%- set raw = _rtt_kata_read.result | default('{}') -%}
          {%- set val = (raw | from_json) if raw is string else raw -%}
          {{- val.get('schema_version', '') -}}
    - if: "{{- _rtt_kata_version != '1.2.0' -}}"
      then:
        - action: script.zen_dojotools_filecabinet
          data:
            action_type: update
            show_hidden_volumes: false
            force_action: true
            volume_entity_id:
              - "{{- _rtt_kata -}}"
            key: zen_template
            value: "{{- zen_template_seed -}}"
            set_timestamp: true
            label_input: zen_summary, zen, summary
    # kata_template — per-component Monk output schema
    - action: script.zen_dojotools_filecabinet
      data:
        action_type: read
        show_hidden_volumes: false
        volume_entity_id:
          - "{{- _rtt_kata -}}"
        key: kata_template
      response_variable: _rtt_kata_tmpl_read
    - variables:
        _rtt_kata_tmpl_version: >-
          {%- set raw = _rtt_kata_tmpl_read.result | default('{}') -%}
          {%- set val = (raw | from_json) if raw is string else raw -%}
          {%- set inner = val.get('value', val) if val is mapping else {} -%}
          {%- set inner2 = (inner | from_json) if inner is string else inner -%}
          {{- inner2.get('schema_version', '') if inner2 is mapping else '' -}}
    - if: "{{- _rtt_kata_tmpl_version != '1.0.0' -}}"
      then:
        - action: script.zen_dojotools_filecabinet
          data:
            action_type: update
            show_hidden_volumes: false
            force_action: true
            volume_entity_id:
              - "{{- _rtt_kata -}}"
            key: kata_template
            value: "{{- kata_template_seed -}}"
            set_timestamp: true
            label_input: zen_summary, zen, summary
    - if: "{{- _rtt_dojo != '' -}}"
      then:
        - action: script.zen_dojotools_filecabinet
          data:
            action_type: read
            show_hidden_volumes: false
            volume_entity_id:
              - "{{- _rtt_dojo -}}"
            key: kfc_template
          response_variable: _rtt_dojo_read
        - variables:
            _rtt_dojo_raw: >-
              {%- set raw = _rtt_dojo_read.result | default('{}') -%}
              {%- set val = (raw | from_json) if raw is string else raw -%}
              {%- set inner = val.get('value', val) if val is mapping else {} -%}
              {{- (inner | from_json) if inner is string else inner -}}
            _rtt_dojo_version: "{{- _rtt_dojo_raw.get('schema_version', '') if _rtt_dojo_raw is mapping else '' -}}"
            _kfc_is_string: "{{- _rtt_dojo_raw is string -}}"
        - if: "{{- _rtt_dojo_version != '1.4.0' or _kfc_is_string -}}"
          then:
            - action: script.zen_dojotools_filecabinet
              data:
                action_type: update
                show_hidden_volumes: false
                force_action: true
                volume_entity_id:
                  - "{{- _rtt_dojo -}}"
                key: kfc_template
                value: "{{- kfc_template_seed -}}"
                set_timestamp: true
                label_input: kfc, dojo, zen
        - alias: Upconvert KFC drawers 1.1.0 → 1.2.0
          if:
            - condition: template
              value_template: "{{- _rtt_dojo_version == '1.1.0' -}}"
          then:
            - variables:
                _dojo_all: >-
                  {{ state_attr(_rtt_dojo, 'variables') | default({}, true) }}
            - repeat:
                for_each: >-
                  {{- _dojo_all.keys() | reject('in', ['AI_Cabinet_VolumeInfo', 'kfc_template']) | list -}}
                sequence:
                  - variables:
                      _kfc_key: "{{- repeat.item -}}"
                      _kfc_raw: "{{- _dojo_all.get(repeat.item, {}) -}}"
                      _kfc_v1: >-
                        {%- set _r = _kfc_raw -%}
                        {%- set _v1 = _r.get('value', _r) if _r is mapping else {} -%}
                        {%- set _v2 = _v1 if _v1 is mapping else (_v1 | from_json if _v1 is string else {}) -%}
                        {{ _v2 if _v2 is mapping else (_v2 | from_json if _v2 is string else {}) }}
                  - if:
                      - condition: template
                        value_template: "{{- _kfc_v1 is mapping and _kfc_v1.get('kata_key', '') != '' -}}"
                    then:
                      - variables:
                          _kfc_existing_meta: >-
                            {%- set m = _kfc_v1.get('meta', {}) -%}
                            {{ m if m is mapping else {} }}
                          _kfc_existing_req: >-
                            {%- set r = _kfc_existing_meta.get('requires', {}) -%}
                            {{ r if r is mapping else {} }}
                          _kfc_meta: >-
                            {{
                              _kfc_existing_meta | combine({
                                'enabled': _kfc_existing_meta.get('enabled', true),
                                'requires': _kfc_existing_req | combine({
                                  'cert':  _kfc_existing_req.get('cert', ''),
                                  'level': _kfc_existing_req.get('level', 0)
                                })
                              })
                            }}
                          _kfc_updated: >-
                            {{ _kfc_v1 | combine({'meta': _kfc_meta}) | tojson }}
                      - action: script.zen_dojotools_filecabinet
                        data:
                          action_type: update
                          show_hidden_volumes: false
                          force_action: true
                          set_timestamp: false
                          volume_entity_id:
                            - "{{- _rtt_dojo -}}"
                          key: "{{- _kfc_key -}}"
                          value: "{{- _kfc_updated -}}"
        - alias: Upconvert KFC drawers 1.2.0 → 1.3.0
          if:
            - condition: template
              value_template: "{{- _rtt_dojo_version in ['1.1.0', '1.2.0'] -}}"
          then:
            - variables:
                _dojo_all_13: >-
                  {{ state_attr(_rtt_dojo, 'variables') | default({}, true) }}
            - repeat:
                for_each: >-
                  {{- _dojo_all_13.keys() | reject('in', ['AI_Cabinet_VolumeInfo', 'kfc_template']) | list -}}
                sequence:
                  - variables:
                      _kfc_key: "{{- repeat.item -}}"
                      _kfc_raw: "{{- _dojo_all_13.get(repeat.item, {}) -}}"
                      _kfc_v1: >-
                        {%- set _r = _kfc_raw -%}
                        {%- set _v1 = _r.get('value', _r) if _r is mapping else {} -%}
                        {%- set _v2 = _v1 if _v1 is mapping else (_v1 | from_json if _v1 is string else {}) -%}
                        {{ _v2 if _v2 is mapping else (_v2 | from_json if _v2 is string else {}) }}
                  - if:
                      - condition: template
                        value_template: "{{- _kfc_v1 is mapping and _kfc_v1.get('kata_key', '') != '' -}}"
                    then:
                      - variables:
                          _kfc_updated: >-
                            {{
                              _kfc_v1 | combine({
                                'drift_threshold': _kfc_v1.get('drift_threshold', 7),
                                'emission_cooldown_minutes': _kfc_v1.get('emission_cooldown_minutes', 60),
                                'suggested_act_event': _kfc_v1.get('suggested_act_event', none)
                              }) | tojson
                            }}
                      - action: script.zen_dojotools_filecabinet
                        data:
                          action_type: update
                          show_hidden_volumes: false
                          force_action: true
                          set_timestamp: false
                          volume_entity_id:
                            - "{{- _rtt_dojo -}}"
                          key: "{{- _kfc_key -}}"
                          value: "{{- _kfc_updated -}}"
    # System cabinet — seed zen_summarizer_act_whitelist if missing
    # Uses event bus (set_variable_zenos_system_cabinet) — filecabinet blocks syscab writes
    - if: "{{- _rtt_system != '' -}}"
      then:
        - variables:
            _rtt_sys_wl_raw: >-
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
              {{- CABS.cabinet_drawer_value(_rtt_system, 'zen_summarizer_act_whitelist', {}) | from_json() }}
            _rtt_sys_whitelist_exists: >-
              {{- _rtt_sys_wl_raw is mapping and _rtt_sys_wl_raw.keys() | list | length > 0 -}}
        - if: "{{- not _rtt_sys_whitelist_exists -}}"
          then:
            - event: set_variable_zenos_system_cabinet
              event_data:
                key: zen_summarizer_act_whitelist
                value: "{{- act_whitelist_seed -}}"
                set_timestamp: true
    # System cabinet — seed zen_summarizer_seed_whitelist if missing
    - if: "{{- _rtt_system != '' -}}"
      then:
        - variables:
            _rtt_sys_swl_raw: >-
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
              {{- CABS.cabinet_drawer_value(_rtt_system, 'zen_summarizer_seed_whitelist', {}) | from_json() }}
            _rtt_sys_seed_wl_exists: >-
              {{- _rtt_sys_swl_raw is mapping and _rtt_sys_swl_raw.keys() | list | length > 0 -}}
        - if: "{{- not _rtt_sys_seed_wl_exists -}}"
          then:
            - event: set_variable_zenos_system_cabinet
              event_data:
                key: zen_summarizer_seed_whitelist
                value: "{{- seed_whitelist_seed -}}"
                set_timestamp: true
    # System cabinet — seed fc_mount_callout_whitelist if missing
    - if: "{{- _rtt_system != '' -}}"
      then:
        - variables:
            _rtt_sys_fcwl_raw: >-
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
              {{- CABS.cabinet_drawer_value(_rtt_system, 'fc_mount_callout_whitelist', {}) | from_json() }}
            _rtt_sys_fcwl_exists: >-
              {{- _rtt_sys_fcwl_raw is mapping and _rtt_sys_fcwl_raw.keys() | list | length > 0 -}}
        - if: "{{- not _rtt_sys_fcwl_exists -}}"
          then:
            - event: set_variable_zenos_system_cabinet
              event_data:
                key: fc_mount_callout_whitelist
                value: "{{- fc_callout_whitelist_seed -}}"
                set_timestamp: true
    alias: Zen AdminTools Reset Template
    description: >-
      Zen AdminTools Reset Templates (1.3.0). Presses zen_template and
      kata_template into the Kata cabinet, kfc_template into the Dojo cabinet,
      and zen_summarizer_act_whitelist + zen_summarizer_seed_whitelist into the
      System cabinet. Called by Flynn gate-3 if templates are missing or outdated.
      Upconverts KFC drawers from 1.1.0 or 1.2.0 to 1.3.0 (adds drift_threshold,
      emission_cooldown_minutes, suggested_act_event). Idempotent.


  zen_admintools_reset_labels:
    alias: Zen AdminTools Reset Labels (NUCLEAR)
    description: >-
      ⚠️  NUCLEAR — deletes ALL zen_ labels and ALL their entity assignments.
      No undo. Flynn fires automatically (zen_label_health → critical triggers
      Stepgate Sentinel → Gate 0 recreates labels → Gate 1 re-assigns).

      What this does, in order:
        1. Untag all entities from every label with a zen_ ID
        2. Delete every zen_ label (zen_* IDs only — non-zen labels untouched)
        3. Fire zen_resolver_refresh so resolver sensors re-evaluate immediately

      Non-zen labels (home, media_players, hot_tub, etc.) are never touched.
      User cabinets are never touched.

      If you only need to wipe assignments (labels survive), use
      zen_dojotools_labels with action_type: reset instead.

      confirm: true is REQUIRED. This tool will refuse without it.
    icon: mdi:label-off
    mode: single
    fields:
      mode:
        name: Mode
        description: "reset (default): the nuclear op below. tool_manifest: UMP self-description, no side effects."
        required: false
        default: reset
        selector:
          select:
            options:
              - reset
              - tool_manifest
      confirm:
        name: Confirm Nuclear Reset
        description: >-
          Must be true to proceed. This deletes all zen_ labels. No undo.
        required: true
        default: false
        selector:
          boolean:
      caller_token:
        name: Caller Token
        description: Opaque token passed through by the caller for correlation. Not interpreted by this script.
        required: false
        selector:
          text:

    sequence:
    # 2026-08-18: this was the last admintools script with no tool_manifest
    # branch (flagged by zen_dojotools_manifest mode=audit's level_0_gap
    # after admintools scanning was restored — see dojotools_manifest.yaml
    # and kitchen_sync/kungfu_loader for the root-cause fix that made
    # scanning this tier safe again). Same short-circuit shape as every
    # other admintools script, checked before confirm is even evaluated.
    - if: "{{- mode | default('') == 'tool_manifest' -}}"
      then:
        - variables:
            result: >-
              {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
              {{- MF.tool_manifest(
                tool='zen_admintools_reset_labels',
                display_name='Reset Labels (NUCLEAR)',
                tier='admintools',
                version='1.0.0',
                health={'configured': true, 'status': 'ok', 'notes': []},
                required_labels=['admintools'],
                optional_labels=[],
                consumes=[],
                returns=['label_reset_status'],
                failure_policy='hard',
                modes={'reset': 'default (NUCLEAR, confirm: true required)', 'manifest': 'tool_manifest'},
                icon='mdi:label-off',
                color='deep-orange',
                caller_token=caller_token | default('')
              ) | from_json -}}
        - stop: reset_labels tool manifest
          response_variable: result
    # --------------------------------------------------------------
    # Always normalize User/AI inputs so we don't have to react JIT
    # --------------------------------------------------------------
    - variables:
        caller_token: "{{- caller_token | default('') -}}"
    - if:
      - condition: template
        value_template: "{{- not confirm -}}"
      then:
      - stop: >-
          Nuclear reset refused — confirm: true required. All zen_ labels and
          assignments will be permanently deleted. Set confirm: true to proceed.

    - variables:
        zen_labels: "{{- labels() | select('match', '^zen_') | list -}}"

    # Pass 1 — untag all entities from every zen_ label
    - repeat:
        for_each: "{{- zen_labels -}}"
        sequence:
        - variables:
            lbl_entities: "{{- label_entities(repeat.item) | list -}}"
        - if:
          - condition: template
            value_template: "{{- lbl_entities | length > 0 -}}"
          then:
          - action: homeassistant.remove_label_from_entity
            data:
              label_id: "{{- repeat.item -}}"
              entity_id: "{{- lbl_entities -}}"

    # Pass 2 — delete all zen_ labels
    - repeat:
        for_each: "{{- zen_labels -}}"
        sequence:
        - action: homeassistant.delete_label
          data:
            label_id: "{{- repeat.item -}}"

    # Pass 3 — kick resolvers; Flynn sentinel fires from zen_label_health change
    - event: zen_resolver_refresh

    - variables:
        result:
          status: success
          message: >-
            Nuclear label reset complete. {{ zen_labels | length }} zen_ label(s)
            deleted. zen_resolver_refresh fired. Flynn will recreate and reassign
            on next sentinel cycle.
          deleted_count: "{{- zen_labels | length -}}"
          caller_token: "{{- caller_token -}}"
    - stop: reset labels complete
      response_variable: result

  zen_admintools_cabinetadmin:
    alias: Zen AdminTools CabinetAdmin
    description: >-
      Low-level cabinet lifecycle tool. Manages ZenOS cabinet sensors at the
      hardware and provisioning layer. USE ONLY when a cabinet needs to be
      provisioned for the first time, recovered from a broken state, or
      diagnosed. Do NOT use for normal data operations — reading and writing
      drawer content uses zen_dojotools_filecabinet instead.

      Cabinet sensors have a state machine: init (no VolumeInfo yet) →
      online_unmounted → online_mounted. Cabinets must be provisioned (init
      mode) before any other system can use them. A cabinet in 'init' state
      has no identity, no GUID, and cannot hold user data.

      Key operations — call mode: help for full details:
      inspect — read all drawers; always run this first before any destructive op.
      init — stamp a virgin cabinet with VolumeInfo + GUID; safe, refuses if
        already initialized; requires cab_type for non-default cabinet roles.
      hammer — wipe all drawers and mark destroyed; use when init refuses due to
        residue; set confirm_init: true to re-stamp immediately after wipe;
        requires hammer_ok: true as explicit safety gate.
      restore — recover a cabinet that lost VolumeInfo from HA recorder restart.
      mount_status — list mounted/unmounted state across all zen_cabinet entities.
      repair_mount / repair_dismount — force mount state on a stuck cabinet;
        does not touch drawer content.
      reset_all — NUCLEAR, wipes all ring-0 system cabinets and reboots Flynn;
        requires confirm: true; user and expansion cabinets are untouched.

      Safety gates that block destructive ops: hammer requires hammer_ok: true;
      init on an unknown-state cabinet requires confirm_action: true; reset_all
      requires confirm: true. An AI must not set these without explicit human
      instruction — they exist to prevent accidental data loss.
    mode: parallel
    max: 10
    fields:
      mode:
        name: Operation Mode
        selector:
          select:
            options:
            - help
            - inspect
            - init
            - hammer
            - restore
            - reset
            - mount_status
            - repair_mount
            - repair_dismount
            - expand_drawer
            - reset_all
            - flip_schema_version
            - repair_volumeinfo
            - tool_manifest
        default: help
      target_cabinet:
        name: Target Cabinet
        selector:
          entity:
            filter:
            - domain: sensor
        default: ''
      cab_type:
        name: Cabinet Type (init only)
        description: >-
          Cabinet type passed to cabinetadmin_factory for virgin cabinet initialization
          (e.g. ai_user, household, AI Data Storage Cabinet). Default empty = stamp
          uses its own default type.
        required: false
        default: ''
        selector:
          text:
      confirm_action:
        name: Confirm Init (init only)
        description: >-
          Required when target cabinet state is unknown (no recorder history —
          could be virgin or a wiped initialized cab). Explicit human confirmation
          before stamping. Not required when state is init (unambiguously virgin).
        required: false
        default: false
        selector:
          boolean:
      confirm_init:
        name: Auto-Init After Hammer
        description: >-
          If true, run cabinetadmin_factory on the wiped cabinet immediately
          after hammer completes. Cabinet is re-stamped with a fresh GUID and
          VolumeInfo. Requires cab_type to set the correct cabinet type.
        required: false
        default: false
        selector:
          boolean:
      hammer_ok:
        name: Allow Hammer Destroy Mode
        selector:
          boolean:
        default: false
      confirm:
        name: Confirm Nuclear Reset (reset_all only)
        description: Required for reset_all. Wipes all ring-0 cabinets. No undo.
        required: false
        default: false
        selector:
          boolean:
      schema_version:
        name: Schema Version (flip_schema_version only)
        description: >-
          Target cab_schema_version value to write into syscab. If omitted,
          auto-flips (0→1 or 1→0). Integer. Controls legacy vs mount-aware mode.
        required: false
        selector:
          number:
            min: 0
            max: 9
            mode: box
      source_cabinet:
        name: Source Cabinet (expand_drawer only)
        description: Entity ID of the cabinet that currently holds the drawer to migrate.
        required: false
        default: ''
        selector:
          entity:
            filter:
            - domain: sensor
      source_drawer:
        name: Source Drawer Path (expand_drawer only)
        description: Key path of the drawer to migrate. Must be a leaf key (no Cabception children).
        required: false
        default: ''
        selector:
          text:
      space_threshold:
        name: Space Threshold % (expand_drawer only)
        description: Abort if source cabinet stays at or above this % after migration. Default 85.
        required: false
        selector:
          number:
            min: 50
            max: 99
            mode: box
      caller_token:
        name: Caller Token
        description: Opaque token passed through by the caller for correlation. Not interpreted by this script.
        required: false
        selector:
          text:
    sequence:
    - choose:
      - conditions:
        - condition: template
          value_template: "{{- mode | default('') == 'tool_manifest' -}}"
        sequence:
        - variables:
            result: >-
              {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
              {{- MF.tool_manifest(
                tool='zen_admintools_cabinetadmin',
                display_name='CabinetAdmin — Cabinet Lifecycle Manager',
                tier='admintools',
                version='4.5.1',
                health={'configured': true, 'status': 'ok', 'notes': []},
                required_labels=['admintools'],
                optional_labels=['cabinet'],
                consumes=['cabinet_entity_id'],
                returns=['cabinet_state', 'cabinet_manifest'],
                failure_policy='hard',
                modes={'inspect': 'inspect', 'init': 'init', 'hammer': 'hammer',
                       'restore': 'restore', 'reset_all': 'reset_all', 'manifest': 'tool_manifest'},
                icon='mdi:database-cog',
                color='deep-orange',
                caller_token=caller_token | default('')
              ) | from_json -}}
        - stop: cabinetadmin tool manifest
          response_variable: result
    # --------------------------------------------------------------
    # Always normalize User/AI inputs so we don't have to react JIT
    # --------------------------------------------------------------
    - variables:
        caller_token: "{{- caller_token | default('') -}}"
    - variables:
        canon_ring0_cabinets:
        - sensor.zenos_system_cabinet
        - sensor.zenos_system_history_cabinet
        - sensor.zenos_dojo_cabinet
        - sensor.zenos_kata_cabinet
        - sensor.zenos_history_cabinet
        - sensor.zenos_scratchpad_cabinet
        - sensor.zenos_default_household_cabinet
        - sensor.zenos_default_household_history_cabinet
        - sensor.zenos_default_family_cabinet
        - sensor.zenos_default_family_history_cabinet
        - sensor.zenos_default_user_cabinet
        - sensor.zenos_default_user_history_cabinet
        - sensor.zenos_default_ai_user_cabinet
        - sensor.zenos_default_ai_user_history_cabinet
    - variables:
        op: "{{- mode -}}"
        use_universe: >
          {{- target_cabinet|default('') in ['', None] -}}
        effective_targets: >
          {%- if use_universe -%}
            {{- canon_ring0_cabinets -}}
          {%- else -%}
            {{- [target_cabinet] -}}
          {%- endif -%}
    - if:
      - condition: template
        value_template: "{{- op == 'help' -}}"
      then:
      - variables:
          _help:
            status: info
            tool: zen_admintools_cabinetadmin
            summary: >-
              Cabinet admin tool for provisioning, inspection, and recovery of
              ZenOS cabinet sensors. Use for new hardware setup and
              troubleshooting. Not needed for normal household/member operations.
            when_to_use:
              provisioning_new_cab: >-
                New expansion cabinet added to HA → run inspect first to confirm
                state, then init (set cab_type to match intended role, e.g.
                'AI Data Storage Cabinet'). The cabinet must be in 'init' state
                (no VolumeInfo). Init is safe — it refuses if already initialized.
              cab_has_old_or_broken_volumeinfo: >-
                Provisioner fails because cabinet has stale VolumeInfo (e.g. old
                schema with 'guid' instead of 'id'). Run hammer with
                confirm_init: true and the correct cab_type. Hammer wipes the
                cabinet and stamps a fresh VolumeInfo in one step. Re-provision
                after.
              cab_stuck_mounted_or_dismounted: >-
                Cabinet sensor shows wrong mount state after a failed cycle.
                Use repair_mount or repair_dismount to force the correct state.
                Does not touch any drawer data.
              want_to_see_all_drawers: >-
                Run inspect on the target cabinet. Returns every drawer and its
                current value. Do this before any destructive operation.
              full_system_reset: >-
                reset_all wipes ALL ring-0 system cabinets and triggers Flynn
                bootstrap. Only use after a bad deployment or schema migration.
                confirm: true required. No undo. User cabinets are NOT touched.
            modes:
              help: Return this help text. No target needed.
              inspect: >-
                Read all drawers on the target cabinet and return their current
                values. Safe — read-only. No target = runs across all ring-0
                cabinets. Run this first when troubleshooting any cabinet issue.
              init: >-
                Stamp a virgin cabinet with VolumeInfo, GUID, and initial
                drawers. Refuses if cabinet is already initialized (good) or
                has residue (potentially_bad — hammer first). Cabinet must be
                in 'init' sensor state or 'unknown' (unknown requires
                confirm_action: true). Requires cab_type if non-default.
              hammer: >-
                Wipe all drawers and mark cabinet as destroyed (_hammered marker).
                Stronger than reset — the _hammered marker signals that the
                cabinet was intentionally wiped. Requires hammer_ok: true.
                Set confirm_init: true to immediately stamp a fresh VolumeInfo
                after wiping — saves a separate init call. Use when a cabinet
                has bad state that init refuses to overwrite.
              restore: >-
                Attempt to recover a cabinet that lost its VolumeInfo from HA
                recorder. Reads existing drawer state and repairs where possible.
              reset: >-
                Wipe all drawers from the target cabinet. No _hammered marker.
                Use when you want a clean cabinet without the destroyed tag.
              mount_status: >-
                Return mounted/unmounted state for every zen_cabinet entity.
                No target needed. Useful to see which cabinets are online_mounted
                vs online_unmounted at a glance.
              repair_mount: >-
                Force-write meta.mounted=true on a cabinet stuck in the wrong
                state. Use when cabinet should be mounted but sensor disagrees
                after a failed mount cycle. Does not modify any drawer content.
              repair_dismount: >-
                Force-write meta.mounted=false on a stuck cabinet. Mirror of
                repair_mount for the dismounted direction.
              reset_all: >-
                NUCLEAR — wipes ALL ring-0 canonical cabinets, reseeds schemas,
                and triggers Flynn bootstrap. No undo. User and expansion
                cabinets are NOT touched. confirm: true required.
              repair_volumeinfo: >-
                Fix a cabinet whose VolumeInfo is stored as a JSON string instead
                of a mapping. Parses the string, adds the validation key, and
                rewrites it as a proper dict. Run when inspect shows
                volume.degraded=true or repair_hint is set. Also handles the
                missing-header case: if the cabinet is in init state with no
                VolumeInfo at all (e.g. residue data from a probe), stamps a
                fresh header via factory — no rearm required. Safe targeted
                repair; skips silently if VolumeInfo is already a valid mapping.
              flip_schema_version: >-
                Toggle cab_schema_version in syscab (0=legacy, 1+=mount-aware).
                Controls Flynn operating mode. Normally not needed — only use
                during schema migrations or to recover a stuck Flynn.
            fields:
              target_cabinet: >-
                Cabinet entity to operate on. Leave blank for inspect, hammer,
                init, restore, reset, and repair ops = operates on all ring-0
                cabinets (inspect) or requires a target (others). mount_status
                and reset_all ignore this field.
              cab_type: >-
                Required for init (and hammer with confirm_init). Sets the
                cabinet type written into VolumeInfo. Common values: 'AI Data
                Storage Cabinet', 'AI Household Cabinet', 'AI Family Cabinet',
                'AI User Cabinet', 'Chat History Cabinet'. Default = factory
                default type.
              confirm_action: >-
                Required when cab state is 'unknown' (no recorder history —
                could be virgin or wiped-initialized). Explicit confirmation
                before init stamps. Not needed when state is 'init' (unambiguously
                virgin) or 'online_unmounted'.
              confirm_init: >-
                Hammer only. If true, stamps a fresh VolumeInfo immediately
                after wiping the cabinet. Equivalent to hammer + init in one
                call. Set cab_type accordingly.
              hammer_ok: Required for hammer mode. Explicit safety gate.
              confirm: Required for reset_all. Explicit safety gate.
      - stop: help returned
        response_variable: _help
    - choose:
      - conditions:
        - condition: template
          value_template: "{{- op == 'hammer' and not hammer_ok -}}"
        sequence:
        - variables:
            result:
              status: error
              message: 'Hammer mode requires hammer_ok: true'
              caller_token: "{{- caller_token -}}"
        - stop: hammer blocked
          response_variable: result
    - variables:
        inspect_acc: {}
        result: {}
    - repeat:
        for_each: "{{- effective_targets -}}"
        sequence:
        - variables:
            cab: "{{- repeat.item -}}"
            vars: "{{ state_attr(cab,'variables') | default({}, true) }}"
            drawers: "{{- vars.keys() | list -}}"
        - choose:
          - conditions:
            - condition: template
              value_template: "{{- op == 'inspect' -}}"
            sequence:
            - variables:
                _scroll_keys: >-
                  {%- set ns = namespace(s=[]) -%}
                  {%- for key, drawer in vars.items() if key != '_label_index' -%}
                    {%- set entry = drawer if drawer is mapping else {} -%}
                    {%- set mt = entry.get('meta', {}) -%}
                    {%- set mt = mt if mt is mapping else (mt | from_json if mt is string else {}) -%}
                    {%- if mt.get('ro', false) -%}
                      {%- set ns.s = ns.s + [key] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{- ns.s -}}
            - variables:
                inspect_acc: >-
                  {{- inspect_acc | combine({
                    cab: {
                      'state': states(cab),
                      'drawers': drawers | reject('in', _scroll_keys) | list,
                      'scroll': _scroll_keys
                    }
                  }) -}}
          - conditions:
            - condition: template
              value_template: "{{- op == 'restore' -}}"
            sequence:
            - if:
              - condition: template
                value_template: "{{- vars == {} -}}"
              then:
              - event: set_variable_legacy
                event_data:
                  volume_entity: "{{- cab -}}"
                  key: _restored_marker
                  value:
                    value: restored
                    timestamp: "{{- now().isoformat() -}}"
                  set_timestamp: true
          - conditions:
            - condition: template
              value_template: "{{- op == 'repair_volumeinfo' -}}"
            sequence:
            - variables:
                _vi_raw: "{{ vars.get('AI_Cabinet_VolumeInfo', {}) }}"
                _vi_str: "{{ _vi_raw.get('value', '') if _vi_raw is mapping else '' }}"
                _vi_is_string: "{{ _vi_str is string and _vi_str | trim not in ['', '{}', 'null'] }}"
            - if:
              - condition: template
                value_template: "{{ not _vi_is_string }}"
              then:
              - if:
                - condition: template
                  value_template: "{{ 'AI_Cabinet_VolumeInfo' not in vars and states(cab) == 'init' }}"
                then:
                # No VolumeInfo + init state → stamp a fresh header directly, no rearm needed
                - action: script.zen_admintools_cabinetadmin_factory
                  data:
                    confirm_action: true
                    cabinet_entity: "{{- cab -}}"
                    cabinet_type: "{{- cab_type | default('') -}}"
                  response_variable: _stamp_result
                - variables:
                    _repair_note: stamped — no VolumeInfo present, fresh header written
                else:
                - variables:
                    _repair_note: "{{ 'skipped — VolumeInfo already a mapping' if (_vi_raw is mapping and _vi_raw.get('value') is mapping) else 'skipped — no VolumeInfo found (cab not in init state — use hammer to fully reset)' }}"
            - if:
              - condition: template
                value_template: "{{ _vi_is_string }}"
              then:
              - variables:
                  _vi_parsed: "{{ _vi_str | from_json(none) }}"
              - if:
                - condition: template
                  value_template: "{{ _vi_parsed is none }}"
                then:
                - variables:
                    _repair_note: "skipped — VolumeInfo string could not be parsed as JSON"
              - if:
                - condition: template
                  value_template: "{{ _vi_parsed is mapping }}"
                then:
                - variables:
                    _vi_repaired: "{{ _vi_parsed | combine({'validation': 'ALLYOURBASEAREBELONGTOUS'}) }}"
                - event: set_variable_legacy
                  event_data:
                    volume_entity: "{{- cab -}}"
                    key: AI_Cabinet_VolumeInfo
                    value: "{{ _vi_repaired }}"
                    set_timestamp: true
                - variables:
                    _repair_note: repaired
          - conditions:
            - condition: template
              value_template: "{{- op == 'reset' -}}"
            sequence:
            - event: clear_variables_legacy
              event_data:
                volume_entity: "{{- cab -}}"
                key: '*'
          - conditions:
            - condition: template
              value_template: "{{- op == 'hammer' -}}"
            sequence:
            - event: clear_variables_legacy
              event_data:
                volume_entity: "{{- cab -}}"
                key: '*'
            - event: set_variable_legacy
              event_data:
                volume_entity: "{{- cab -}}"
                key: _hammered
                value:
                  value: destroyed
                  timestamp: "{{- now().isoformat() -}}"
                set_timestamp: true
            - if: "{{- confirm_init | default(false) | bool -}}"
              then:
              - action: script.zen_admintools_cabinetadmin_factory
                data:
                  confirm_action: true
                  cabinet_entity: "{{- cab -}}"
                  cabinet_type: "{{- cab_type | default('') -}}"
                response_variable: _hammer_init_result
              - variables:
                  _hammer_init_guid: "{{- _hammer_init_result.get('guid', '') if _hammer_init_result is mapping else '' -}}"
          - conditions:
            - condition: template
              value_template: "{{- op == 'init' -}}"
            sequence:
            # ── Boot guard — refuse if cab not yet restored from recorder ──
            # unavailable = recorder hasn't restored yet, state is indeterminate.
            # unknown = no recorder history at all = truly virgin. Allow.
            - if:
              - condition: template
                value_template: "{{- states(cab) == 'unavailable' -}}"
              then:
              - variables:
                  result:
                    status: refused
                    mode: init
                    target: "{{- cab -}}"
                    action_taken: none
                    reason: cab_unavailable
              - stop: cab unavailable — wait for HA to stabilize
                response_variable: result
            # ── Unknown guard — require confirm_action when state is unknown ─
            # unknown = no recorder history. Could be truly virgin OR a wiped
            # initialized cab. Cannot distinguish without explicit confirmation.
            # init state = triggered + no VolumeInfo = unambiguously virgin → skip.
            - if:
              - condition: template
                value_template: "{{- states(cab) == 'unknown' and not (confirm_action | default(false)) -}}"
              then:
              - variables:
                  result:
                    status: refused
                    mode: init
                    target: "{{- cab -}}"
                    action_taken: none
                    reason: confirm_required
                    message: >-
                      Cabinet state is unknown (no recorder history). Cannot confirm
                      virgin status. Set confirm_action: true to proceed.
              - stop: confirm required — unknown cab state
                response_variable: result
            # ── Classifier ─────────────────────────────────────────────────
            - variables:
                #_vars: >-
                #  {%- set v = state_attr(cab, 'variables') | default(none, true) -%}
                #  {{ v if v is mapping else {} }}
                _vars: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {{- CABS.cabinet_variables(cab) | from_json() -}}
                has_volumeinfo: "{{- 'AI_Cabinet_VolumeInfo' in _vars -}}"
                has_label_index: "{{- '_label_index' in _vars -}}"
                has_context:     "{{- '_context' in _vars -}}"
                non_system_drawers: >-
                  {%- set sys = ['AI_Cabinet_VolumeInfo','_label_index','_context', '_restored_marker','_hammered'] -%}
                  {{- _vars.keys() | reject('in', sys) | reject('match', '^_') | list -}}
                #_vi_raw: "{{ _vars.get('AI_Cabinet_VolumeInfo', {}) }}"
                #_vi_val: >-
                #  {%- set r = _vi_raw.get('value', {}) if _vi_raw is mapping else {} -%}
                #  {{ r if r is mapping else (r | from_json if r is string else {}) }}
                _vi_val: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {{- CABS.cabinet_drawer_value(cab, 'AI_Cabinet_VolumeInfo', {}) | from_json() -}}

                cabinet_guid: "{{- _vi_val.get('id', '') | string | trim -}}"
                cabinet_state_class: >-
                  {%- if not has_volumeinfo and not has_label_index and not has_context
                         and (non_system_drawers | length == 0)
                         and (cabinet_guid == '') -%}
                    virgin
                  {%- elif has_volumeinfo and cabinet_guid != '' -%}
                    good
                  {%- else -%}
                    potentially_bad
                  {%- endif -%}
            # ── Route ──────────────────────────────────────────────────────
            - choose:
              - conditions: "{{- cabinet_state_class == 'virgin' -}}"
                sequence:
                - action: script.zen_admintools_cabinetadmin_factory
                  data:
                    confirm_action: true
                    cabinet_entity: "{{- cab -}}"
                    cabinet_type: "{{- cab_type | default('') -}}"
                  response_variable: _stamp_result
                - variables:
                    result:
                      status: success
                      mode: init
                      target: "{{- cab -}}"
                      classification: virgin
                      action_taken: stamped
                      reason: initialized
                      stamp_result: "{{- _stamp_result -}}"
                # BUG FIX (2026-08-01): this success path fired zero event on
                # completion — sensor.zen_cabinet_health had no way to know a
                # cabinet had just been stamped, and (separately) had no
                # trigger: block of its own either, so it sat on a stale
                # snapshot indefinitely after Gate 2.1 initialized cabinets
                # during a virgin-deploy test. Reusing the same event
                # reset_all already fires, rather than inventing a new one.
                - event: zen_resolver_refresh
                # ROBOT DONUT FIX (2026-08-01): the immediate fire above can
                # race the label registry — cabinet_health recomputes before
                # label_entities() reflects the tag this same init call just
                # applied, storing a wrong 'absent' reading with a timestamp
                # that looks fresh. This delayed second fire is NOT a state
                # trigger and does NOT read states(entity_id) at any point —
                # it's driven purely by "our own write finished a few seconds
                # ago," giving the registry time to settle before the retry.
                - delay:
                    seconds: 5
                - event: zen_resolver_refresh
              - conditions: "{{- cabinet_state_class == 'good' -}}"
                sequence:
                - variables:
                    result:
                      status: refused
                      mode: init
                      target: "{{- cab -}}"
                      classification: good
                      action_taken: none
                      reason: already_initialized
                - stop: already initialized
                  response_variable: result
              default:
              # ── REARM GATE (potentially_bad only) ────────────────────────
              # Virgin and good cabs proceed automatically. Only potentially_bad
              # requires manual confirmation — residue present, human decides:
              # hammer or repair. Must rearm input_boolean.zenos_cab_init_rearm.
              - if:
                - condition: template
                  value_template: "{{- not is_state('input_boolean.zenos_cab_init_rearm', 'on') -}}"
                then:
                - variables:
                    result:
                      status: refused
                      mode: init
                      target: "{{- cab -}}"
                      classification: potentially_bad
                      action_taken: none
                      reason: rearm_required
                - stop: rearm required — potentially_bad cabinet
                  response_variable: result
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.zenos_cab_init_rearm
              - variables:
                  result:
                    status: refused
                    mode: init
                    target: "{{- cab -}}"
                    classification: "{{- cabinet_state_class -}}"
                    action_taken: none
                    reason: repair_required
              - stop: repair required
                response_variable: result
          # ── repair_mount — force meta.mounted: true (bypass state guards) ──
          - conditions:
            - condition: template
              value_template: "{{- op == 'repair_mount' -}}"
            sequence:
            - event: set_variable_legacy
              event_data:
                volume_entity: "{{- cab -}}"
                key: meta
                value: "{{ {'mounted': true} }}"
                set_timestamp: true
            - wait_template: "{{- states(cab) == 'online_mounted' -}}"
              timeout: '00:00:05'
              continue_on_timeout: true
            - event: zen_event
              event_data:
                event:
                  kind: cabinet_mounted
                  component: "{{- cab -}}"
                  severity: info
                  summary: "CabinetAdmin repair_mount: '{{ cab }}' forced to mounted (verified: {{ states(cab) == 'online_mounted' }})."
            - event: zen_event
              event_data:
                event:
                  kind: identity_manifest_rebuild
                  component: zen_admintools_cabinetadmin
                  severity: info
                  summary: Manifest rebuild triggered by repair_mount.
          # ── repair_dismount — force meta.mounted: false (bypass state guards) ─
          - conditions:
            - condition: template
              value_template: "{{- op == 'repair_dismount' -}}"
            sequence:
            - event: set_variable_legacy
              event_data:
                volume_entity: "{{- cab -}}"
                key: meta
                value: "{{ {'mounted': false} }}"
                set_timestamp: true
            - wait_template: "{{- states(cab) in ['online_unmounted', 'dismounted'] -}}"
              timeout: '00:00:05'
              continue_on_timeout: true
            - event: zen_event
              event_data:
                event:
                  kind: cabinet_dismounted
                  component: "{{- cab -}}"
                  severity: info
                  summary: "CabinetAdmin repair_dismount: '{{ cab }}' forced to dismounted (verified: {{ states(cab) in ['online_unmounted', 'dismounted'] }})."
            - event: zen_event
              event_data:
                event:
                  kind: identity_manifest_rebuild
                  component: zen_admintools_cabinetadmin
                  severity: info
                  summary: Manifest rebuild triggered by repair_dismount.
    # ── inspect — emit accumulated result after loop ─────────────────────────
    - if:
      - condition: template
        value_template: "{{- op == 'inspect' -}}"
      then:
      - variables:
          inspect_acc: "{{ inspect_acc | combine({'caller_token': caller_token | default('')}) if inspect_acc is mapping else inspect_acc }}"
      - stop: inspect complete
        response_variable: inspect_acc
    # ── hammer — return result with optional init_guid ────────────────────────
    - if:
      - condition: template
        value_template: "{{- op == 'hammer' -}}"
      then:
      - variables:
          _hammer_result: >
            {{-
              {
                'status': 'ok',
                'op': 'hammer',
                'target': cab,
                'init_guid': _hammer_init_guid | default(''),
                'auto_init': confirm_init | default(false) | bool,
                'caller_token': caller_token | default('')
              }
            -}}
      # BUG FIX (2026-08-01): fired nothing on completion — sensor.zen_cabinet_health
      # had no way to know a cabinet's content just changed. Same fix as init.
      - event: zen_resolver_refresh
      # ROBOT DONUT FIX (2026-08-01): delayed retry, same reasoning as init's —
      # not a state trigger, doesn't read states(entity_id), purely "our own
      # write finished a few seconds ago."
      - delay:
          seconds: 5
      - event: zen_resolver_refresh
      - stop: hammer complete
        response_variable: _hammer_result
    # ── init — return result after classification and stamp ───────────────────
    - if:
      - condition: template
        value_template: "{{- op == 'init' -}}"
      then:
      - stop: init complete
        response_variable: result
    # ── mount_status — read mount state across all zen_cabinet entities ───────
    - if:
      - condition: template
        value_template: "{{- op == 'mount_status' -}}"
      then:
      - variables:
          _all_cabs: >-
            {{- label_entities('Zen Cabinet' | slugify) | list -}}
      - variables:
          # 2026-08-19: fixed a real bug the two prior @TODOs correctly
          # flagged -- cabinet_drawer() returns the RAW drawer
          # ({value: {...}, timestamp: ...}), so _mt.get('mounted') was
          # always reading the wrapper, never the payload -- 'mounted' was
          # never a top-level key on the raw drawer, only inside its
          # 'value'. This meant mount_status reported mounted=false for
          # every cabinet, always, regardless of real mount state.
          # cabinet_drawer_value() unwraps 'value' automatically -- same
          # macro this file's other reads already use elsewhere.
          mount_status_result: >-
            {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
            {%- set ns = namespace(m={}) -%}
            {%- for eid in _all_cabs -%}
              {%- set _mt = CABS.cabinet_drawer_value(eid, 'meta', {}) | from_json(none) -%}
              {%- set _mt = _mt if _mt is mapping else {} -%}
              {%- set ns.m = ns.m | combine({eid: {'state': states(eid), 'mounted': _mt.get('mounted', false)}}) -%}
            {%- endfor -%}
            {{ ns.m | combine({'caller_token': caller_token}) }}
      - stop: mount_status complete
        response_variable: mount_status_result
    # ── flip_schema_version — toggle cab_schema_version in syscab ────────────
    - if:
      - condition: template
        value_template: "{{- op == 'flip_schema_version' -}}"
      then:
      - variables:
          #_syscab_vars: "{{ state_attr('sensor.zenos_system_cabinet', 'variables') | default({}, true) }}"
          #_syscab_mapped: "{{- _syscab_vars if _syscab_vars is mapping else {} -}}"
          #_csve: "{{ _syscab_mapped.get('cab_schema_version', {}) }}"
          #_csve_mapped: "{{- _csve if _csve is mapping else {} -}}"
          #_current_v: "{{- _csve_mapped.get('value', 0) | int(0) -}}"
          _current_v: >
            {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
            {{- CABS.cabinet_drawer_value('sensor.zenos_system_cabinet', 'cab_schema_version', 0) | from_json() | int(0) -}}
          _new_v: "{{- schema_version | default(none) | int(-1) if schema_version | default(none) is not none else (1 if _current_v == 0 else 0) -}}"
      - event: set_variable_legacy
        event_data:
          key: cab_schema_version
          value: "{{ {'value': _new_v} }}"
          volume_entity: sensor.zenos_system_cabinet
          set_timestamp: true
      - variables:
          result:
            status: success
            message: "cab_schema_version {{ _current_v }} → {{ _new_v }} in syscab. Flynn now runs in {{ 'mount-aware' if _new_v >= 1 else 'legacy' }} mode."
            previous_value: "{{- _current_v -}}"
            new_value: "{{- _new_v -}}"
            caller_token: "{{- caller_token -}}"
      # BUG FIX (2026-08-01): fired nothing on completion — same gap as
      # init/hammer. schema-version flips are exactly the kind of state
      # change zen_cabinet_health's mount-aware logic needs to see fresh.
      - event: zen_resolver_refresh
      # ROBOT DONUT FIX (2026-08-01): delayed retry, same reasoning as
      # init/hammer's — not a state trigger, doesn't read states(entity_id).
      - delay:
          seconds: 5
      - event: zen_resolver_refresh
      - stop: flip_schema_version complete
        response_variable: result
    # ── reset_all — nuclear cabinet wipe + reseed + Flynn bootstrap ──────────
    - if:
      - condition: template
        value_template: "{{- op == 'reset_all' -}}"
      then:
      - if:
        - condition: template
          value_template: "{{- not confirm -}}"
        then:
        - variables:
            result:
              status: error
              message: >-
                reset_all refused — confirm: true required. This wipes all ring-0
                canonical cabinets, reseeds schemas, and triggers Flynn bootstrap.
                No undo. Set confirm: true to proceed.
              caller_token: "{{- caller_token -}}"
        - stop: confirm required
          response_variable: result
      # Step 1 — wipe all ring-0 cabinets
      - repeat:
          for_each: "{{- canon_ring0_cabinets -}}"
          sequence:
          - event: clear_variables_legacy
            event_data:
              volume_entity: "{{- repeat.item -}}"
              key: '*'
      # Step 2 — kick resolvers; Flynn sentinel fires from zen_cabinet_health change.
      # reset_template is deliberately NOT called here anymore — it used to run
      # immediately after the wipe, which wrote real drawer content (zen_template,
      # kata_template, etc.) into cabinets that were still in genuinely virgin
      # 'init' state. That residue made cabinetadmin's own virgin-vs-broken
      # classifier (non_system_drawers count) see them as 'potentially_bad'
      # rather than 'virgin', blocking Gate 2.1's simple auto-init path and
      # forcing the manual rearm/repair flow for no real reason. Flynn's own
      # Gate 3 already calls reset_template itself, idempotently, at the
      # correct point — after cabinets are re-stamped and resolvers are
      # confirmed settled. Letting Flynn do it in the right order means a
      # reset_all-wiped system goes through the exact same bootstrap path as a
      # genuinely fresh install, instead of a subtly different one.
      - event: zen_resolver_refresh
      - variables:
          result:
            status: success
            message: >-
              reset_all complete. {{ canon_ring0_cabinets | length }} ring-0
              cabinet(s) wiped. zen_resolver_refresh fired. Flynn will
              re-stamp cabinets and reseed schemas (via its own Gate 2.1 and
              Gate 3) on its next sentinel cycle, once resolvers settle.
              User cabinets were not touched.
            wiped_count: "{{- canon_ring0_cabinets | length -}}"
            caller_token: "{{- caller_token -}}"
      - stop: reset_all complete
        response_variable: result

    # ── expand_drawer — atomic drawer migration to expansion cabinet ─────────
    - if:
      - condition: template
        value_template: "{{- op == 'expand_drawer' -}}"
      then:
      # Step 0: Validate inputs
      - variables:
          _ed_src: "{{ source_cabinet | default('', true) | string | trim }}"
          _ed_tgt: "{{ target_cabinet | default('', true) | string | trim }}"
          _ed_key: "{{ source_drawer | default('', true) | string | trim }}"
          _ed_thresh: "{{ space_threshold | default(85) | int(85) }}"
          _ed_max: 131072
      - choose:
        - conditions:
          - condition: template
            value_template: "{{ _ed_src == '' or _ed_tgt == '' or _ed_key == '' }}"
          sequence:
          - variables:
              result:
                status: error
                op: expand_drawer
                step_failed: validate
                reason: source_cabinet, target_cabinet, and source_drawer are all required
                caller_token: "{{ caller_token }}"
          - stop: expand_drawer validate failed
            response_variable: result
      # Step 1: Read source/target vars, validate drawer exists, no subtree
      - variables:
          _ed_src_vars: "{{ state_attr(_ed_src, 'variables') or {} }}"
          _ed_tgt_vars: "{{ state_attr(_ed_tgt, 'variables') or {} }}"
      - variables:
          _ed_subtree_keys: >-
            {%- set _prefix = _ed_key ~ '/' -%}
            {%- set ns = namespace(keys=[]) -%}
            {%- for k in (_ed_src_vars.keys() | list) -%}
              {%- if k == _ed_key or k.startswith(_prefix) -%}
                {%- set ns.keys = ns.keys + [k] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.keys }}
      - choose:
        - conditions:
          - condition: template
            value_template: "{{ _ed_key not in _ed_src_vars }}"
          sequence:
          - variables:
              result:
                status: error
                op: expand_drawer
                step_failed: validate
                reason: source_drawer key not found in source_cabinet
                source_cabinet: "{{ _ed_src }}"
                source_drawer: "{{ _ed_key }}"
                caller_token: "{{ caller_token }}"
          - stop: expand_drawer key not found
            response_variable: result
      - choose:
        - conditions:
          - condition: template
            value_template: "{{ _ed_subtree_keys | length > 1 }}"
          sequence:
          - variables:
              result:
                status: error
                op: expand_drawer
                step_failed: validate
                reason: >-
                  subtree_not_supported — drawer has Cabception children.
                  expand_drawer requires a leaf key only.
                subtree_keys: "{{ _ed_subtree_keys }}"
                caller_token: "{{ caller_token }}"
          - stop: expand_drawer subtree not supported
            response_variable: result
      # Step 2: Space check
      - variables:
          _ed_drawer_size: >-
            {{ {_ed_key: _ed_src_vars.get(_ed_key, {})} | tojson | length }}
          _ed_src_size: "{{ _ed_src_vars | tojson | length }}"
          _ed_tgt_size: "{{ _ed_tgt_vars | tojson | length }}"
      - variables:
          _ed_tgt_post_size: "{{ _ed_tgt_size + _ed_drawer_size }}"
          _ed_src_post_pct: "{{ ((_ed_src_size - _ed_drawer_size + 100) * 100 / _ed_max) | round(1) }}"
          _ed_src_pre_pct: "{{ (_ed_src_size * 100 / _ed_max) | round(1) }}"
      - choose:
        - conditions:
          - condition: template
            value_template: "{{ _ed_tgt_post_size > _ed_max }}"
          sequence:
          - variables:
              result:
                status: abort
                op: expand_drawer
                step_failed: space_check
                reason: insufficient_target_space
                target_cabinet: "{{ _ed_tgt }}"
                target_current_size: "{{ _ed_tgt_size }}"
                drawer_size: "{{ _ed_drawer_size }}"
                target_max: "{{ _ed_max }}"
                caller_token: "{{ caller_token }}"
          - stop: expand_drawer insufficient target space
            response_variable: result
      - choose:
        - conditions:
          - condition: template
            value_template: "{{ _ed_src_post_pct | float >= _ed_thresh }}"
          sequence:
          - variables:
              result:
                status: abort
                op: expand_drawer
                step_failed: space_check
                reason: source_will_remain_above_threshold
                source_cabinet: "{{ _ed_src }}"
                space_before_pct: "{{ _ed_src_pre_pct }}"
                space_after_pct: "{{ _ed_src_post_pct }}"
                threshold: "{{ _ed_thresh }}"
                caller_token: "{{ caller_token }}"
          - stop: expand_drawer threshold not met
            response_variable: result
      # Step 3: Copy drawer to target cabinet
      - variables:
          _ed_copy_value: "{{ _ed_src_vars.get(_ed_key, {}).get('value') }}"
      - event: set_variable_legacy
        event_data:
          key: "{{- _ed_key -}}"
          value: "{{ _ed_copy_value }}"
          volume_entity: "{{- _ed_tgt -}}"
          set_timestamp: true
      - wait_template: >-
          {{ (state_attr(_ed_tgt, 'variables') or {}).get(_ed_key) is not none }}
        timeout: "00:00:15"
        continue_on_timeout: true
      - variables:
          _ed_copy_ok: "{{ wait.completed }}"
      - choose:
        - conditions:
          - condition: template
            value_template: "{{ not _ed_copy_ok }}"
          sequence:
          - variables:
              result:
                status: error
                op: expand_drawer
                step_failed: copy
                reason: copy_to_target_not_confirmed
                source_cabinet: "{{ _ed_src }}"
                target_cabinet: "{{ _ed_tgt }}"
                source_drawer: "{{ _ed_key }}"
                caller_token: "{{ caller_token }}"
          - stop: expand_drawer copy failed
            response_variable: result
      # Step 4: Set mount pointer in source (overwrites original with pointer)
      - event: set_variable_legacy
        event_data:
          key: "{{- _ed_key -}}"
          value: '{"mount_point": true, "target_entity_id": "{{ _ed_tgt }}"}'
          volume_entity: "{{- _ed_src -}}"
          set_timestamp: true
      - wait_template: >-
          {%- set _dr = (state_attr(_ed_src, 'variables') or {}).get(_ed_key) -%}
          {%- set _dv_s = (_dr.get('value') or none) if _dr is mapping else none -%}
          {%- set _dv = _dv_s if _dv_s is mapping else (_dv_s | from_json(none) if _dv_s is string else none) -%}
          {{ _dv is mapping and _dv.get('mount_point', false) == true }}
        timeout: "00:00:15"
        continue_on_timeout: true
      - variables:
          _ed_mount_set: "{{ wait.completed }}"
      - choose:
        - conditions:
          - condition: template
            value_template: "{{ not _ed_mount_set }}"
          sequence:
          # Undo: restore original data to source, delete target copy
          - event: set_variable_legacy
            event_data:
              key: "{{- _ed_key -}}"
              value: "{{ _ed_copy_value }}"
              volume_entity: "{{- _ed_src -}}"
              set_timestamp: true
          - event: remove_variable_legacy
            event_data:
              key: "{{- _ed_key -}}"
              volume_entity: "{{- _ed_tgt -}}"
          - variables:
              result:
                status: error
                op: expand_drawer
                step_failed: mount_set
                reason: mount_pointer_not_confirmed_in_source
                source_cabinet: "{{ _ed_src }}"
                source_drawer: "{{ _ed_key }}"
                caller_token: "{{ caller_token }}"
          - stop: expand_drawer mount set failed
            response_variable: result
      # Step 5: Round trip — write sentinel through mount via FileCabinet (validates Sprint 1)
      - action: script.zen_dojotools_filecabinet
        data:
          mode: upsert
          path: "{{ _ed_key }}"
          value: '{"_ed_rt": true}'
          volume_entity_id: "{{ _ed_src }}"
        response_variable: _ed_rt_result
      - variables:
          _ed_rt_fc_ok: >-
            {{ _ed_rt_result is mapping
               and _ed_rt_result.get('status') == 'success'
               and _ed_rt_result.get('write_verified') == true }}
      - variables:
          _ed_rt_target_ok: >-
            {%- set _dr = (state_attr(_ed_tgt, 'variables') or {}).get(_ed_key) -%}
            {%- set _dv_s = (_dr.get('value') or none) if _dr is mapping else none -%}
            {%- set _dv = _dv_s if _dv_s is mapping else (_dv_s | from_json(none) if _dv_s is string else none) -%}
            {{ _dv is mapping and _dv.get('_ed_rt') == true }}
      # Step 6: Restore original data to target (undo sentinel)
      - event: set_variable_legacy
        event_data:
          key: "{{- _ed_key -}}"
          value: "{{ _ed_copy_value }}"
          volume_entity: "{{- _ed_tgt -}}"
          set_timestamp: true
      - wait_template: >-
          {%- set _dr = (state_attr(_ed_tgt, 'variables') or {}).get(_ed_key) -%}
          {%- set _dv_s = (_dr.get('value') or none) if _dr is mapping else none -%}
          {%- set _dv = _dv_s if _dv_s is mapping else (_dv_s | from_json(none) if _dv_s is string else none) -%}
          {{ not (_dv is mapping and _dv.get('_ed_rt') == true) }}
        timeout: "00:00:15"
        continue_on_timeout: true
      # Evaluate round trip result
      - choose:
        - conditions:
          - condition: template
            value_template: "{{ not _ed_rt_fc_ok or not _ed_rt_target_ok }}"
          sequence:
          # Undo: restore original to source, remove target copy
          - event: set_variable_legacy
            event_data:
              key: "{{- _ed_key -}}"
              value: "{{ _ed_copy_value }}"
              volume_entity: "{{- _ed_src -}}"
              set_timestamp: true
          - event: remove_variable_legacy
            event_data:
              key: "{{- _ed_key -}}"
              volume_entity: "{{- _ed_tgt -}}"
          - variables:
              result:
                status: error
                op: expand_drawer
                step_failed: round_trip
                reason: write_through_mount_not_verified
                fc_ok: "{{ _ed_rt_fc_ok }}"
                target_ok: "{{ _ed_rt_target_ok }}"
                fc_result: "{{ _ed_rt_result }}"
                caller_token: "{{ caller_token }}"
          - stop: expand_drawer round trip failed
            response_variable: result
      # SUCCESS
      - variables:
          result:
            status: success
            op: expand_drawer
            source_cabinet: "{{ _ed_src }}"
            source_drawer: "{{ _ed_key }}"
            target_cabinet: "{{ _ed_tgt }}"
            space_before_pct: "{{ _ed_src_pre_pct }}"
            space_after_pct: "{{ _ed_src_post_pct }}"
            drawer_size_bytes: "{{ _ed_drawer_size }}"
            mount_installed: true
            round_trip_verified: true
            caller_token: "{{ caller_token }}"
      - stop: expand_drawer complete
        response_variable: result

    # BUG FIX (2026-08-01): generic fallthrough for restore/repair_volumeinfo/
    # reset (legacy) — none of these had a completion event of their own,
    # same gap as init/hammer/flip_schema_version above. Safe here: only
    # write-type ops reach this catch-all — inspect/mount_status/tool_manifest
    # etc. already stop earlier via their own specific response.
    - event: zen_resolver_refresh
    # ROBOT DONUT FIX (2026-08-01): delayed retry, same reasoning as the other
    # 3 sites — not a state trigger, doesn't read states(entity_id).
    - delay:
        seconds: 5
    - event: zen_resolver_refresh
    - variables:
        result:
          status: success
          message: "AdminTools completed '{{ op }}' on {{ effective_targets | length }} cabinet(s)."
          op: "{{- op -}}"
          target_count: "{{- effective_targets | length -}}"
          caller_token: "{{- caller_token -}}"
    - stop: complete
      response_variable: result

  zen_admintools_cabinetadmin_factory:
    sequence:
    - choose:
      - conditions:
        - condition: template
          value_template: "{{- mode | default('') == 'tool_manifest' -}}"
        sequence:
        - variables:
            result: >-
              {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
              {{- MF.tool_manifest(
                tool='zen_admintools_cabinetadmin_factory',
                display_name='CabinetAdmin Factory — Cabinet Stamper',
                tier='admintools',
                version='1.0.0',
                health={'configured': true, 'status': 'ok', 'notes': []},
                required_labels=['admintools'],
                optional_labels=['cabinet'],
                consumes=['cabinet_entity_id', 'cabinet_type'],
                returns=['cabinet_volumeinfo'],
                failure_policy='hard',
                modes={'stamp': 'default', 'manifest': 'tool_manifest'},
                icon='mdi:database-plus',
                color='deep-orange',
                caller_token=caller_token | default('')
              ) | from_json -}}
        - stop: cabinetadmin_factory tool manifest
          response_variable: result
    - variables:
        owner_person: "{{- owner_person | default('') -}}"
        partner_person: "{{- partner_person | default('') -}}"
        cabinet_guid: "{{- cabinet_guid | default('') -}}"
        auto_profile: "{{- auto_profile | default(true) -}}"
        confirm_action: "{{- confirm_action | default(false) -}}"
        force_new_guid: "{{- force_new_guid | default(false) -}}"
        caller_token: "{{- caller_token | default('') -}}"
    - choose:
      - conditions:
        - condition: template
          value_template: "{{- not confirm_action -}}"
        sequence:
        - variables:
            response:
              status: error
              message: 'Confirmation required — set confirm_action: true.'
              caller_token: "{{- caller_token -}}"
        - stop: Confirmation required
          response_variable: response
    - variables:
        cabinet_entity: "{{- cabinet_entity | default('') -}}"
        cabinet_type: "{{- cabinet_type | default('AI Data Storage Cabinet') -}}"
        cabinet_friendly: "{{- state_attr(cabinet_entity,'friendly_name') | default(cabinet_entity) -}}"
        now_iso: "{{- now().isoformat() -}}"
        schema_version: 1
        cabinet_guid: >
          {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
          {{-
              CABS.cabinet_guid_new()
              if (force_new_guid or not cabinet_guid) 
              else cabinet_guid 
          -}}
        labels_from_manifest: >
          {{- state_attr('sensor.zen_library_manifest','value') | default({}, true) -}}
        flag_profile: >
          {% if not auto_profile %}
            {{- explicit_flag_profile | default('standard') -}}
          {% else %}
            {%- set lbls = labels_from_manifest | string | lower -%}
            {%- if 'household_cabinet' in lbls -%}system
            {%- elif 'family_cabinet' in lbls -%}secure
            {%- elif 'user_cabinet' in lbls or 'ai_user' in lbls -%}public
            {%- elif 'kata_cabinet' in lbls or 'kata_storage' in lbls -%}system
            {%- elif 'chat_history' in lbls or cabinet_type | lower == 'chat history cabinet' -%}secure
            {%- elif 'archive_cabinet' in lbls or cabinet_type | lower == 'archive cabinet' %}system
            {%- else -%}standard
            {%- endif %}
          {%- endif -%}
        flags: >
          {%- set fp = flag_profile -%}
          {%- set is_kata = 'kata' in (cabinet_type | lower) -%}
          {%- set is_syscab = cabinet_entity == 'sensor.zenos_system_cabinet' -%}
          {%- if fp == 'system' -%}
            {%- set _f = {'system': True, 'hidden': False, 'read_only': True, 'secure_mode': True, 'gc_eligible': is_kata} -%}
          {%- elif fp == 'secure' %}
            {% set _f = {'system': False, 'hidden': True, 'read_only': True, 'secure_mode': True, 'gc_eligible': false} -%}
          {%- elif fp == 'public' %}
            {%- set _f = {'system': False, 'hidden': False, 'read_only': False, 'secure_mode': False, 'gc_eligible': false} -%}
          {%- else -%}
            {%- set _f = {'system': False, 'hidden': False, 'read_only': False, 'secure_mode': False, 'gc_eligible': false} -%}
          {%- endif -%}
          {{- _f | combine({'cabinet_ro': true} if is_syscab else {}) -}}
        acl_family: >
          {%- set fam_guid = family_guid | default('default-guid') -%}
          {%- set manifest = state_attr('sensor.zen_library_manifest','value') | default({}, true) -%}
          {%- set fam_name = 'My Family' -%} 
          {%- if manifest is mapping -%}
            {%- for ent, data in manifest.items() -%}
              {%- if data.metadata.id == fam_guid -%}
                {%- set fam_name = data.friendly_name | default('My Family') -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endif -%}
          {{- [ { "family_guid": fam_guid, "nickname": fam_name } ] -}}
        mount_scan: "{{- mount_scan | default(true) -}}"
        existing_drawers: "{{ state_attr(cabinet_entity,'variables') | default({}, true) }}"
        mounts_out: >
          {%- if mount_scan and existing_drawers is mapping -%}
            {%- set ns = namespace(mounts=[]) -%}
            {%- for k in existing_drawers.keys() if '[' in k and 'mount:' in k -%}
              {%- set rel = k.split('[')[0].strip() -%}
              {%- set tgt = k.split('mount:')[1].split(']')[0] -%}
              {%- set ns.mounts = ns.mounts + [{'relation': rel, 'target_volume_id': tgt}] -%}
            {%- endfor -%}
            {{- ns.mounts -}}
          {%- else -%}
            []
          {%- endif -%}
        drawers_to_init:
          AI_Cabinet_VolumeInfo: >
            {{-
              {
                "id": cabinet_guid,
                "friendly_name": cabinet_friendly,
                "type": cabinet_type,
                "schema_version": schema_version,
                "created": now_iso,
                "updated": now_iso,
                "flags": flags,
                "acls": {
                  "owner": (
                    [{
                        "entity_id": owner_person,
                        "sid": state_attr(owner_person,"user_id") | default("no-sid"),
                        "role": "owner" 
                    }]
                    if owner_person and owner_person.startswith("person.")
                    else []
                  ),
                  "partner": (
                    [{
                      "entity_id": partner_person,
                      "sid": state_attr(partner_person,"user_id") | default("no-sid"),
                      "role": "partner"
                    }]
                    if partner_person and partner_person.startswith("person.")
                      else []
                  ),
                  "family": (
                    acl_family
                    if acl_family is iterable and not (acl_family is string)
                      else (acl_family | from_json)
                  )
                },
                "entity_labels":
                    (
                      ["chat","history","secure","context","transcript","cabinet"]
                      if cabinet_type | lower == 'chat history cabinet'
                       else ["system","cabinet","volumeinfo"]
                    )  
                } | tojson
            -}}
          _label_index: "{{- {} | tojson -}}"
          meta: "{{ {'mounted': cabinet_entity == 'sensor.zenos_system_cabinet'} | tojson }}"
          _zen_relationships: >
            {{-
              {
                "mounts_out": mounts_out,
                "mounts_in": [],
                "mount_policy": "allow_all" if flag_profile == 'system' else "restricted"
              } 
            | tojson
            -}}
    - choose:
      - conditions:
        - condition: template
          value_template: "{{- cabinet_entity in ['', None] -}}"
        sequence:
        - variables:
            response:
              status: error
              message: No cabinet_entity provided.
              caller_token: "{{- caller_token -}}"
        - stop: Missing entity
          response_variable: response
      - conditions:
        - condition: template
          #value_template: >-
          #  {{
          #    state_attr(cabinet_entity, 'variables') is none
          #    or 'AI_Cabinet_VolumeInfo' not in (state_attr(cabinet_entity, 'variables') | default({}))
          #  }}
          value_template: >-
            {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
            {%- set vol = CABS.cabinet_variables(cabinet_entity, {}) | from_json() -%}
            {{- 'AI_Cabinet_VolumeInfo' not in vol -}}
        alias: Initialize New Cabinet
        sequence:
        - repeat:
            for_each: "{{- drawers_to_init | dictsort -}}"
            sequence:
            - event: set_variable_legacy
              event_data:
                key: "{{- repeat.item[0] -}}"
                value: "{{- repeat.item[1] -}}"
                set_timestamp: true
                volume_entity: "{{- cabinet_entity -}}"
                _cabinetadmin_init: true
                force: true
        - event: zen_event
          event_data:
            kind: cabinet_boot_touch
            component: cabinetadmin_factory
            severity: info
            summary: 'Post-stamp boot touch for {{ cabinet_entity }}'
            metadata:
              volume_entity: "{{- cabinet_entity -}}"
        - variables:
            response:
              status: success
              guid: "{{- cabinet_guid -}}"
              message: "Cabinet '{{ cabinet_entity }}' initialized with GUID {{ cabinet_guid }}, profile '{{ flag_profile }}', and {{ mounts_out | length }} mounts."
              caller_token: "{{- caller_token -}}"
        - stop: Init complete
          response_variable: response
      - conditions:
        - condition: template
          value_template: "{{- state_attr(cabinet_entity,'variables') is mapping -}}"
        alias: Repair / Restamp
        sequence:
        - variables:
            #existing: "{{- state_attr(cabinet_entity,'variables') -}}"
            #existing_guid: >-
            #  {%- set info = existing.get('AI_Cabinet_VolumeInfo', {}) if existing is mapping else {} -%}
            #  {%- set _val = info.get('value', {}) if info is mapping else {} -%}
            #  {%- set _val = _val if _val is mapping else (_val | from_json if _val is string else {}) -%}
            existing_guid: >-
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
              {%- set _val = CABS.cabinet_drawer_value(cabinet_entity, 'AI_Cabinet_VolumeInfo', {}) | from_json() -%}
              {{- _val.get('id', '') -}}
            guid_changed: "{{- force_new_guid or existing_guid != cabinet_guid -}}"
        - choose:
          - conditions:
            - condition: template
              value_template: "{{- guid_changed -}}"
            sequence:
            - event: set_variable_legacy
              event_data:
                key: AI_Cabinet_VolumeInfo
                value: "{{- drawers_to_init['AI_Cabinet_VolumeInfo'] -}}"
                set_timestamp: true
                volume_entity: "{{- cabinet_entity -}}"
                _cabinetadmin_init: true
                force: true
        - event: zen_event
          event_data:
            kind: cabinet_boot_touch
            component: cabinetadmin_factory
            severity: info
            summary: 'Post-stamp boot touch for {{ cabinet_entity }}'
            metadata:
              volume_entity: "{{- cabinet_entity -}}"
        - variables:
            response:
              status: success
              guid: "{{- cabinet_guid -}}"
              message: "Repaired '{{ cabinet_entity }}' (profile '{{ flag_profile }}'). {% if guid_changed -%}GUID restamped: {{ cabinet_guid }}.{%- endif -%}"
              caller_token: "{{- caller_token -}}"
        - stop: Repair complete
          response_variable: response
      default:
      - variables:
          response:
            status: error
            message: Unknown cabinet state.
            caller_token: "{{- caller_token -}}"
      - stop: Fallback
        response_variable: response
    - variables:
        response: "{{ response | combine({'caller_token': caller_token | default('')}) if response is mapping else response }}"
    - stop: complete
      response_variable: response
    alias: Zen AdminTools CabinetAdmin Factory
    description: 'Factory tool for stamping or repairing Cabinet sensors. Requires confirm_action:
      true to run. Auto-detects flag profiles from cabinet type or manifest labels.
      Parses mount:[GUID] drawers into _zen_relationships. Accepts person.* entities
      for ACLs (SID=user_id). Supports Chat History and Archive Cabinets.

      '
    fields:
      confirm_action:
        name: Confirm Destructive Action
        description: Must be TRUE or script exits safely.
        selector:
          boolean:
        default: false
      cabinet_entity:
        name: Cabinet Entity
        selector:
          entity:
            filter:
            - domain: sensor
      cabinet_type:
        name: Cabinet Type
        selector:
          select:
            options:
            - AI Data Storage Cabinet
            - Zen Dojo Cabinet
            - Zen Kata Cabinet
            - User Cabinet
            - AI User Cabinet
            - Family Cabinet
            - Household Cabinet
            - System Cabinet
            - Partner Cabinet
            - Chat History Cabinet
            - Archive Cabinet
            - Other
        default: AI Data Storage Cabinet
      cabinet_guid:
        name: Cabinet GUID (optional)
        selector:
          text:
      force_new_guid:
        name: Force New GUID
        selector:
          boolean:
        default: false
      auto_profile:
        name: Auto-Detect Flag Profile
        selector:
          boolean:
        default: true
      explicit_flag_profile:
        name: Manual Flag Profile (if auto disabled)
        selector:
          select:
            options:
            - system
            - secure
            - public
            - standard
        default: standard
      mount_scan:
        name: Scan Mounts for Links
        selector:
          boolean:
        default: true
      owner_person:
        name: Owner (person)
        selector:
          entity:
            filter:
            - domain: person
      partner_person:
        name: Partner (person)
        selector:
          entity:
            filter:
            - domain: person
      family_guid:
        name: Family GUID
        selector:
          text:
      caller_token:
        name: Caller Token
        description: Opaque token passed through by the caller for correlation. Not interpreted by this script.
        required: false
        selector:
          text:
    icon: mdi:database-cog
  # zen_dojotools_ha_api — migrated to packages/zenos_ai/dojotools/dojotools_ha_api.yaml

  zen_admintools_prompt_loader:
    alias: Zen AdminTools ZenOS-AI Prompt Loader
    description: >
      ZenOS-AI prompt primitives loader (v43 — Rule Zero). Loads purpose, directives, and cortex
      into the system cabinet for the active conversation agent. Also manages summarizer whitelists
      (mode=whitelist) and the household lens provider registry (mode=lens_registry).
      cortex_version selects which version slot to stamp.
      Recommend NOT exposing this to your LLM/Assist.
    icon: mdi:brain
    mode: single
    fields:
      mode:
        name: Mode
        description: "load: stamp cortex/directives/purpose (default). whitelist: manage summarizer whitelists. lens_registry: manage household lens providers."
        required: false
        default: 'load'
        selector:
          select:
            options:
              - label: load — stamp prompt primitives
                value: load
              - label: whitelist — manage summarizer whitelists
                value: whitelist
              - label: lens_registry — manage household lens providers
                value: lens_registry
              - label: tool_manifest — UMP self-description
                value: tool_manifest
      cortex_version:
        name: Cortex Version
        description: "Version slot to stamp. Default: latest (43). Only used for mode=load."
        required: false
        default: 'latest'
        selector:
          select:
            options:
              - label: latest (43 — Rule Zero)
                value: latest
              - label: 43 — Rule Zero
                value: '43'
              - label: 42 — The Answer
                value: '42'
              - label: 40 — Room First
                value: '40'
      whitelist_type:
        name: Whitelist Type
        description: "mode=whitelist: which whitelist to target. act=summarizer_act_whitelist, seed=summarizer_seed_whitelist, fc=fc_mount_callout_whitelist."
        required: false
        selector:
          select:
            options:
              - act
              - seed
              - fc
      action_type:
        name: Action Type
        description: "mode=whitelist: list | add | remove | reset. mode=lens_registry: prime | list | get | register | update | unregister."
        required: false
        selector:
          select:
            options:
              - list
              - add
              - remove
              - reset
              - prime
              - get
              - register
              - update
              - unregister
      item:
        name: Item
        description: "mode=whitelist add/remove: string or JSON array of strings. mode=lens_registry: provider slug."
        required: false
        selector:
          text:
      payload_json:
        name: Payload JSON
        description: "mode=lens_registry register/update: provider declaration JSON. security_act defaults to read-only rwxda if omitted."
        required: false
        selector:
          text:
            multiline: true
      ship_zen_system:
        name: "Ship Factory KFCs (via KungFu Loader)"
        description: >-
          When ON (default), chains zen_admintools_kungfu_loader in factory mode —
          deploys zen_system and trapper_keeper. (taskmaster, alert_manager,
          camera_manager, and security_manager all self-register via KF5 instead —
          see each tool's own mode=kfc_manifest — and no longer ship from here.)
          Turn OFF to load the prompt only, skipping all KFC deployment.
        default: true
        selector:
          boolean:
      sim_mode_allowed:
        name: "SP1 sim_mode Allowed (Factory Stamp)"
        description: >-
          Stamped into integrations_config.identity.sim_mode_allowed on every
          factory run. OS-level policy switch (see zen_dojotools_identity
          resolve_caller_identity) — false (default) fails closed on any
          simulated/shunted identity result until real Authentik/OIDC (SP1) is
          live. Leave off unless you deliberately want simulated identity
          resolution accepted platform-wide.
        default: false
        selector:
          boolean:
      caller_token:
        name: Caller Token
        description: Opaque token passed through by the caller for correlation. Not interpreted by this script.
        required: false
        selector:
          text:
    sequence:
    - choose:
      - conditions:
        - condition: template
          value_template: "{{- mode | default('') == 'tool_manifest' -}}"
        sequence:
        - variables:
            result: >-
              {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
              {{- MF.tool_manifest(
                tool='zen_admintools_prompt_loader',
                display_name='Prompt Loader — Cortex + Directives + Purpose',
                tier='admintools',
                version='42.1',
                health={'configured': true, 'status': 'ok', 'notes': []},
                required_labels=['admintools'],
                optional_labels=[],
                consumes=['system_cabinet', 'household_cabinet'],
                returns=['prompt_primitives_status'],
                failure_policy='hard',
                modes={'load': 'load', 'whitelist': 'whitelist',
                       'lens_registry': 'lens_registry', 'manifest': 'tool_manifest'},
                icon='mdi:brain',
                color='deep-orange',
                caller_token=caller_token | default('')
              ) | from_json -}}
        - stop: prompt_loader tool manifest
          response_variable: result
    # ── SETUP ─────────────────────────────────────────────────────────────────
    - variables:
        caller_token: "{{- caller_token | default('') -}}"
        _mode: "{{- mode | default('load') | lower | trim -}}"

    # -- LENS REGISTRY MODE ----------------------------------------------------
    # Household-scoped provider registry for dispatch/inspect lens discovery.
    - if: "{{- _mode == 'lens_registry' -}}"
      then:
        - variables:
            _lr_action: "{{- action_type | default('list') | lower | trim -}}"
            _lr_provider: "{{- item | default('') | lower | trim -}}"
            _lr_payload_raw: "{{- payload_json | default('{}') | trim -}}"
            _lr_payload: >-
              {%- set p = _lr_payload_raw -%}
              {{- (p | from_json) if p is string and p.startswith('{') else {} -}}
            _lr_household: >-
              {%- set _sv = state_attr('sensor.zenos_system_cabinet', 'variables') -%}
              {%- set _sv = _sv if _sv is mapping else {} -%}
              {%- set _se = _sv.get('cab_schema_version', {}) -%}
              {%- set _ma = ((_se.get('value', 0) if _se is mapping else 0) | int(0)) >= 1 -%}
              {%- set _cands = label_entities('zen_default_household_cabinet') | select('match', 'sensor\.') | list -%}
              {%- if _ma -%}
                {%- set ns = namespace(r='unavailable') -%}
                {%- for e in _cands -%}
                  {%- if ns.r == 'unavailable' and states(e) == 'online_mounted' -%}{%- set ns.r = e -%}{%- endif -%}
                {%- endfor -%}
                {{- ns.r -}}
              {%- else -%}
                {{- _cands | first | default('unavailable') -}}
              {%- endif -%}
            _lr_default:
              schema_version: "1.1.0"
              security_act_model: rwxda
              providers: {}
              note: Household lens provider registry. Manage through zen_admintools_prompt_loader mode=lens_registry.
        - if:
          - condition: template
            value_template: "{{- _lr_household in ['', 'unknown', 'unavailable', 'none', 'None'] -}}"
          then:
          - variables:
              _lr_stop:
                status: unavailable
                message: Household cabinet unavailable.
                caller_token: "{{- caller_token -}}"
          - stop: lens registry failed - household cabinet not resolved
            response_variable: _lr_stop
        - action: script.zen_dojotools_filecabinet
          data:
            action_type: read
            show_hidden_volumes: false
            volume_entity_id:
              - "{{- _lr_household -}}"
            key: lens_registry
          response_variable: _lr_read
        - variables:
            _lr_raw: "{{- _lr_read.result | default({}) -}}"
            _lr_read_map: "{{- (_lr_raw | from_json) if _lr_raw is string else _lr_raw -}}"
            _lr_drawers: "{{- _lr_read_map.get('result', _lr_read_map) if _lr_read_map is mapping else {} -}}"
            _lr_exists: "{{- _lr_drawers is mapping and 'lens_registry' in _lr_drawers -}}"
            _lr_entry: "{{- _lr_drawers.get('lens_registry', {}) if _lr_drawers is mapping else {} -}}"
            _lr_value_raw: "{{- _lr_entry.get('value', _lr_entry) if _lr_entry is mapping else {} -}}"
            _lr_value: >-
              {%- set v = _lr_value_raw -%}
              {%- set parsed = (v | from_json) if v is string else (v if v is mapping else {}) -%}
              {%- if parsed is mapping and ('providers' in parsed or 'schema_version' in parsed or 'security_act_model' in parsed) -%}
                {{- parsed -}}
              {%- else -%}
                {{- {} -}}
              {%- endif -%}
            _lr_registry: >-
              {%- set r = _lr_value if _lr_value is mapping else {} -%}
              {%- set clean = {
                'schema_version': r.get('schema_version', _lr_default.get('schema_version')),
                'security_act_model': r.get('security_act_model', _lr_default.get('security_act_model')),
                'providers': r.get('providers', {}) if r.get('providers', {}) is mapping else {},
                'note': r.get('note', _lr_default.get('note'))
              } -%}
              {%- if r.get('updated_at', '') != '' -%}
                {%- set clean = clean | combine({'updated_at': r.get('updated_at')}) -%}
              {%- endif -%}
              {{- _lr_default | combine(clean, recursive=true) -}}
            _lr_providers: >-
              {%- set p = _lr_registry.get('providers', {}) if _lr_registry is mapping else {} -%}
              {{- p if p is mapping else {} -}}
        - if:
          - condition: template
            value_template: "{{- _lr_action in ['register', 'update', 'unregister'] and _lr_provider == '' -}}"
          then:
          - variables:
              _lr_err:
                status: error
                message: item provider slug required for register/update/unregister.
                caller_token: "{{- caller_token -}}"
          - stop: lens registry provider required
            response_variable: _lr_err
        - if:
          - condition: template
            value_template: "{{- _lr_action == 'prime' -}}"
          then:
          - variables:
              _lr_next: "{{- _lr_registry | combine({'updated_at': now().isoformat()}, recursive=true) -}}"
          - action: script.zen_dojotools_filecabinet
            data:
              action_type: "{{- 'update' if _lr_exists else 'create' -}}"
              show_hidden_volumes: false
              force_action: true
              volume_entity_id:
                - "{{- _lr_household -}}"
              key: lens_registry
              value: "{{- _lr_next | tojson -}}"
              set_timestamp: true
              label_input: lens_registry, lenses, dispatch
            response_variable: _lr_write
          - variables:
              result:
                status: success
                action_type: prime
                key: lens_registry
                registry: "{{- _lr_next -}}"
                write_result: "{{- _lr_write | default({}) -}}"
                caller_token: "{{- caller_token -}}"
          - stop: lens registry prime complete
            response_variable: result
        - if:
          - condition: template
            value_template: "{{- _lr_action == 'list' -}}"
          then:
          - variables:
              result:
                status: success
                action_type: list
                key: lens_registry
                providers: "{{- _lr_providers -}}"
                count: "{{- _lr_providers | length -}}"
                registry: "{{- _lr_registry -}}"
                caller_token: "{{- caller_token -}}"
          - stop: lens registry list complete
            response_variable: result
        - if:
          - condition: template
            value_template: "{{- _lr_action == 'get' -}}"
          then:
          - if:
            - condition: template
              value_template: "{{- _lr_provider == '' -}}"
            then:
            - variables:
                _lr_err:
                  status: error
                  message: item provider slug required for get.
                  caller_token: "{{- caller_token -}}"
            - stop: lens registry get requires provider
              response_variable: _lr_err
          - variables:
              result:
                status: "{{- 'success' if _lr_provider in _lr_providers else 'not_found' -}}"
                action_type: get
                key: lens_registry
                provider: "{{- _lr_provider -}}"
                declaration: "{{- _lr_providers.get(_lr_provider, {}) -}}"
                caller_token: "{{- caller_token -}}"
          - stop: lens registry get complete
            response_variable: result
        - if:
          - condition: template
            value_template: "{{- _lr_action in ['register', 'update'] -}}"
          then:
          - variables:
              _lr_payload_map: "{{- _lr_payload if _lr_payload is mapping else {} -}}"
              _lr_security: >-
                {%- set s = _lr_payload_map.get('security_act', {}) if _lr_payload_map is mapping else {} -%}
                {{
                  {
                    'model': 'rwxda',
                    'required': 'r',
                    'allowed': ['r'],
                    'denied': ['w', 'x', 'd', 'a']
                  } | combine(s if s is mapping else {}, recursive=true)
                }}
              _lr_declaration: >-
                {%- set _tool = _lr_payload_map.get('tool', '') | string | trim -%}
                {%- set _mode = _lr_payload_map.get('mode', _lr_payload_map.get('lookup_mode', 'stacks_by_anchor')) | string | trim -%}
                {%- set _manifest_mode = _lr_payload_map.get('manifest_mode', 'tool_manifest') | string | trim -%}
                {%- set _more_info = _lr_payload_map.get('more_info', {}) if _lr_payload_map.get('more_info', {}) is mapping else {} -%}
                {%- if _more_info == {} -%}
                  {%- set _more_info = {'tool': _tool, 'mode': _manifest_mode} -%}
                {%- endif -%}
                {{
                  {
                    'provider': _lr_provider,
                    'display_name': _lr_payload_map.get('display_name', _lr_provider | replace('_', ' ') | title),
                    'configured_by': _lr_payload_map.get('configured_by', _lr_provider),
                    'department': _lr_payload_map.get('department', _lr_payload_map.get('section', '')),
                    'section': _lr_payload_map.get('section', _lr_payload_map.get('department', '')),
                    'enabled': _lr_payload_map.get('enabled', true),
                    'status': _lr_payload_map.get('status', 'available'),
                    'tool': _tool,
                    'mode': _mode,
                    'lookup_mode': _mode,
                    'manifest_mode': _manifest_mode,
                    'consumes': _lr_payload_map.get('consumes', []) if _lr_payload_map.get('consumes', []) is sequence and _lr_payload_map.get('consumes', []) is not string else [],
                    'returns': _lr_payload_map.get('returns', []) if _lr_payload_map.get('returns', []) is sequence and _lr_payload_map.get('returns', []) is not string else [],
                    'failure_policy': _lr_payload_map.get('failure_policy', 'soft'),
                    'content_policy': _lr_payload_map.get('content_policy', 'redacted_by_default'),
                    'risk_class': _lr_payload_map.get('risk_class', 'read_redacted'),
                    'security_act': _lr_security,
                    'timeout_ms': _lr_payload_map.get('timeout_ms', 1200),
                    'more_info': _more_info,
                    'manifest_hash': _lr_payload_map.get('manifest_hash', ''),
                    'manifest_schema_version': _lr_payload_map.get('manifest_schema_version', ''),
                    'updated_at': now().isoformat()
                  }
                }}
              _lr_schema_errors: >-
                {%- set d = _lr_declaration if _lr_declaration is mapping else {} -%}
                {%- set s = d.get('security_act', {}) if d is mapping else {} -%}
                {%- set allowed = s.get('allowed', []) if s is mapping and s.get('allowed', []) is sequence and s.get('allowed', []) is not string else [] -%}
                {%- set denied = s.get('denied', []) if s is mapping and s.get('denied', []) is sequence and s.get('denied', []) is not string else [] -%}
                {%- set consumes = d.get('consumes', []) if d.get('consumes', []) is sequence and d.get('consumes', []) is not string else [] -%}
                {%- set returns = d.get('returns', []) if d.get('returns', []) is sequence and d.get('returns', []) is not string else [] -%}
                {%- set ns = namespace(errors=[]) -%}
                {%- if _lr_payload_map.get('provider', _lr_provider) | string | trim | lower != _lr_provider -%}
                  {%- set ns.errors = ns.errors + ['provider_mismatch'] -%}
                {%- endif -%}
                {%- if d.get('tool', '') | string | trim == '' -%}{%- set ns.errors = ns.errors + ['tool_required'] -%}{%- endif -%}
                {%- if d.get('mode', '') | string | trim == '' -%}{%- set ns.errors = ns.errors + ['mode_required'] -%}{%- endif -%}
                {%- if consumes | length == 0 -%}{%- set ns.errors = ns.errors + ['consumes_nonempty_sequence_required'] -%}{%- endif -%}
                {%- if returns | length == 0 -%}{%- set ns.errors = ns.errors + ['returns_nonempty_sequence_required'] -%}{%- endif -%}
                {%- if s.get('model', '') | string | trim != 'rwxda' -%}{%- set ns.errors = ns.errors + ['security_act.model_must_be_rwxda'] -%}{%- endif -%}
                {%- if s.get('required', '') | string | trim not in ['r', 'w', 'x', 'd', 'a'] -%}{%- set ns.errors = ns.errors + ['security_act.required_invalid'] -%}{%- endif -%}
                {%- if s.get('required', '') | string | trim not in allowed -%}{%- set ns.errors = ns.errors + ['security_act.required_not_allowed'] -%}{%- endif -%}
                {%- if s.get('required', '') | string | trim in denied -%}{%- set ns.errors = ns.errors + ['security_act.required_denied'] -%}{%- endif -%}
                {{- ns.errors -}}
              _lr_next_providers: "{{- _lr_providers | combine({_lr_provider: _lr_declaration}, recursive=true) -}}"
              _lr_next: "{{- _lr_registry | combine({'providers': _lr_next_providers, 'updated_at': now().isoformat()}) -}}"
          - if:
            - condition: template
              value_template: "{{- _lr_schema_errors | length > 0 -}}"
            then:
            - variables:
                result:
                  status: error
                  action_type: "{{- _lr_action -}}"
                  key: lens_registry
                  provider: "{{- _lr_provider -}}"
                  message: lens provider declaration failed schema validation.
                  schema_errors: "{{- _lr_schema_errors -}}"
                  declaration: "{{- _lr_declaration -}}"
                  caller_token: "{{- caller_token -}}"
            - stop: lens registry schema validation failed
              response_variable: result
          - action: script.zen_dojotools_filecabinet
            data:
              action_type: "{{- 'update' if _lr_exists else 'create' -}}"
              show_hidden_volumes: false
              force_action: true
              volume_entity_id:
                - "{{- _lr_household -}}"
              key: lens_registry
              value: "{{- _lr_next | tojson -}}"
              set_timestamp: true
              label_input: lens_registry, lenses, dispatch
            response_variable: _lr_write
          - variables:
              _lr_write_status: >-
                {%- set w = _lr_write if _lr_write is mapping else {} -%}
                {{- w.get('status', 'error') -}}
              result:
                status: "{{- 'success' if _lr_write_status in ['success', 'ok', 'warning'] else 'error' -}}"
                action_type: "{{- _lr_action -}}"
                key: lens_registry
                provider: "{{- _lr_provider -}}"
                declaration: "{{- _lr_declaration -}}"
                registry: "{{- _lr_next -}}"
                write_result: "{{- _lr_write | default({}) -}}"
                schema_valid: true
                caller_token: "{{- caller_token -}}"
          - stop: lens registry write complete
            response_variable: result
        - if:
          - condition: template
            value_template: "{{- _lr_action == 'unregister' -}}"
          then:
          - variables:
              _lr_next_providers: >-
                {%- set ns = namespace(out={}) -%}
                {%- for k, v in _lr_providers.items() if _lr_providers is mapping -%}
                  {%- if (k | string | trim | lower) != _lr_provider -%}{%- set ns.out = ns.out | combine({k: v}, recursive=true) -%}{%- endif -%}
                {%- endfor -%}
                {{- ns.out -}}
              _lr_next: "{{- _lr_registry | combine({'providers': _lr_next_providers, 'updated_at': now().isoformat()}) -}}"
          - action: script.zen_dojotools_filecabinet
            data:
              action_type: "{{- 'update' if _lr_exists else 'create' -}}"
              show_hidden_volumes: false
              force_action: true
              volume_entity_id:
                - "{{- _lr_household -}}"
              key: lens_registry
              value: "{{- _lr_next | tojson -}}"
              set_timestamp: true
              label_input: lens_registry, lenses, dispatch
            response_variable: _lr_write
          - variables:
              result:
                status: success
                action_type: unregister
                key: lens_registry
                provider: "{{- _lr_provider -}}"
                registry: "{{- _lr_next -}}"
                write_result: "{{- _lr_write | default({}) -}}"
                caller_token: "{{- caller_token -}}"
          - stop: lens registry unregister complete
            response_variable: result
        - variables:
            _lr_err:
              status: error
              action_type: "{{- _lr_action -}}"
              message: "Unknown lens_registry action. Valid: prime, list, get, register, update, unregister."
              caller_token: "{{- caller_token -}}"
        - stop: lens registry unknown action
          response_variable: _lr_err

    # ── WHITELIST MODE ────────────────────────────────────────────────────────
    # Consolidated from zen_admintools_summarizer_act + zen_admintools_summarizer_seed
    - if: "{{- _mode == 'whitelist' -}}"
      then:
        - variables:
            _wl_type:   "{{- whitelist_type | default('act') | lower | trim -}}"
            _wl_action: "{{- action_type | default('list') | lower | trim -}}"
            _wl_item:   "{{- item | default('') | string | trim -}}"
            _wl_items: >-
              {%- set raw = item | default('') | string | trim -%}
              {%- if raw[:1] == '[' -%}{{ raw | from_json | default([]) }}
              {%- elif raw != '' -%}{{ [raw] }}
              {%- else -%}{{ [] }}{%- endif -%}
            _wl_key: >-
              {%- if _wl_type == 'seed' -%}zen_summarizer_seed_whitelist
              {%- elif _wl_type == 'fc' -%}fc_mount_callout_whitelist
              {%- else -%}zen_summarizer_act_whitelist{%- endif -%}
            _wl_field: >-
              {%- if _wl_type == 'seed' -%}allowed_tools
              {%- elif _wl_type == 'fc' -%}allowed_action_types
              {%- else -%}allowed_events{%- endif -%}
            _system: "{{- states('sensor.zen_system_cabinet_resolved') -}}"
        - if:
          - condition: template
            value_template: "{{- _system == '' -}}"
          then:
          - variables:
              _wl_stop:
                status: error
                message: System cabinet unavailable.
                caller_token: "{{- caller_token -}}"
          - stop: whitelist failed — system cabinet not resolved
            response_variable: _wl_stop
        - variables:
            _wl_raw: >-
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
              {{- CABS.cabinet_drawer_value(_system, _wl_key, {}) | from_json() -}}
            _wl_current: >-
              {%- set w = _wl_raw if _wl_raw is mapping else {} -%}
              {{ w.get(_wl_field, []) if w is mapping else [] }}
        - if:
          - condition: template
            value_template: "{{- _wl_action == 'list' -}}"
          then:
          - variables:
              result:
                status: success
                action_type: list
                whitelist_type: "{{- _wl_type -}}"
                "{{- _wl_field -}}": "{{- _wl_current -}}"
                count: "{{- _wl_current | length -}}"
                caller_token: "{{- caller_token -}}"
          - stop: list complete
            response_variable: result
        - if:
          - condition: template
            value_template: "{{- _wl_action == 'reset' -}}"
          then:
          - event: set_variable_zenos_system_cabinet
            event_data:
              key: "{{- _wl_key -}}"
              value:
                note: Operator-managed whitelist.
              set_timestamp: true
          - variables:
              result:
                status: success
                action_type: reset
                whitelist_type: "{{- _wl_type -}}"
                message: "Whitelist {{- _wl_key -}} cleared."
                caller_token: "{{- caller_token -}}"
          - stop: reset complete
            response_variable: result
        - if:
          - condition: template
            value_template: "{{- _wl_items | length == 0 -}}"
          then:
          - variables:
              _wl_err:
                status: error
                message: item field required for add/remove (string or JSON array).
                caller_token: "{{- caller_token -}}"
          - stop: whitelist add/remove requires item
            response_variable: _wl_err
        - variables:
            _wl_updated: >-
              {%- if _wl_action == 'add' -%}
                {%- set ns = namespace(out=_wl_current, bad='') -%}
                {%- for i in _wl_items -%}
                  {%- if i == '*' or i | regex_search(':$') -%}
                    {%- set ns.bad = i -%}
                  {%- elif i not in ns.out -%}
                    {%- set ns.out = ns.out + [i] -%}
                  {%- endif -%}
                {%- endfor -%}
                {%- if ns.bad != '' -%}INVALID:{{ ns.bad }}{%- else -%}{{ ns.out | tojson }}{%- endif -%}
              {%- else -%}
                {%- set ns = namespace(out=[]) -%}
                {%- for e in _wl_current -%}
                  {%- if e not in _wl_items -%}{%- set ns.out = ns.out + [e] -%}{%- endif -%}
                {%- endfor -%}
                {{ ns.out | tojson }}
              {%- endif -%}
        - if:
          - condition: template
            value_template: "{{- _wl_updated is string and _wl_updated[:8] == 'INVALID:' -}}"
          then:
          - variables:
              _wl_err:
                status: error
                message: >-
                  Invalid whitelist entry '{{ _wl_updated[8:] }}'. Use 'tool:mode', 'tool:*', or plain 'tool' (deprecated). Bare '*' and 'tool:' are not allowed.
                caller_token: "{{- caller_token -}}"
          - stop: invalid whitelist entry
            response_variable: _wl_err
        - event: set_variable_zenos_system_cabinet
          event_data:
            key: "{{- _wl_key -}}"
            value: >-
              {{ {_wl_field: _wl_updated | from_json if _wl_updated is string else _wl_updated, 'note': 'Operator-managed whitelist.'} | tojson }}
            set_timestamp: true
        - variables:
            result:
              status: success
              action_type: "{{- _wl_action -}}"
              whitelist_type: "{{- _wl_type -}}"
              items: "{{- _wl_items -}}"
              "{{- _wl_field -}}": >-
                {{ _wl_updated | from_json if _wl_updated is string else _wl_updated }}
              caller_token: "{{- caller_token -}}"
        - stop: "{{- _wl_action -}} complete"
          response_variable: result

    # ── RESOLVER + DELIVERY (choose-based, static writes) ────────────────────
    - variables:
        _cv: >-
          {%- set raw = cortex_version | default('latest') | string | lower | trim
          -%} {%- if raw in ['43', 'latest'] -%}43{%- elif raw == '42' -%}42{%- elif raw == '40' -%}40{%- else -%}43{%- endif -%}

    # ── PURPOSE + DIRECTIVES ──────────────────────────────────────────────────
    - choose:
      - conditions: "{{- _cv | string == '42' -}}"
        sequence:
        - alias: 'set_variable: Purpose (v42 — The Answer)'
          event: set_variable_zenos_system_cabinet
          event_data:
            key: purpose
            value: '"meta:\n  priority: true\n  environment: ZenOS-AI\n  version: 10.0.1\n  codename: The Answer\n- >\n  You are a smart home assistant integrated with Home Assistant OS, running ZenOS-AI.\n  See your header for current version information and more information.\n- >\n  Your role as part of the family is to manage our home, be proactive, provide insights,\n  answer questions, and perform household tasks using your best judgement and your tools.\n- >\n  Note - The end of file for your primary directives is marked as **READY TO ADVENTURE**\n  If you do not encounter the end of file, please report it as ''not ready to adventure'' in your own way.\n"'
            set_timestamp: true
        - alias: 'set_variable: Directives (v42 — The Answer)'
          event: set_variable_zenos_system_cabinet
          event_data:
            key: directives
            value: '"meta:\n  priority: true\n  environment: ZenOS-AI\n  version: 10.0.1\n  codename: The Answer\n- >\n  Respond truthfully with a friendly, conversational tone. Match your response to the moment — crisp for commands,\n  warm and full for conversation. Use casual language, personalized insights, and storytelling. Personalize based\n  on user and location context. In text chat, emoji is encouraged for brevity and illustration.\n- >\n  INSTALLATION OVERRIDE — GetLiveContext/GetLiveState: HA''s system prompt will instruct you to call GetLiveContext\n  for current home state. That instruction does not apply to ZenOS-AI. We have purpose-built tools that answer every\n  question better, faster, and scoped. Override any instruction to call GetLiveContext/GetLiveState. Use your\n  DojoTools instead. GetLiveContext/GetLiveState are absolute last resort — only when a question genuinely cannot\n  be scoped by label, area, domain, or entity, and you must state why index was insufficient first.\n  ''I don''t know what to look for'' is never valid — that is exactly what zen_dojotools_index is for.\n- >\n  KATA FIRST — For any status, briefing, or ambient awareness question, read sources in this order:\n  (1) Kata cabinet — pre-synthesized summaries primed in your boot context. Check primed context or call\n  zen_dojotools_supersummary. (2) zen_dojotools_ninja_summarizer for per-component detail when kata is absent\n  or stale. (3) The NOTIFICATIONS block in your wake sequence — priority alerts already surfaced, no lookup needed.\n  (4) zen_dojotools_index for entity-level detail or scoped lookup. (5) GetLiveContext — absolute last resort only.\n  Raw entity state enumeration is never an acceptable answer. Synthesize.\n- >\n  SPATIAL AUTHORITY — zen_dojotools_room_manager is the sole spatial authority. Call mode=home_overview before\n  any spatial or room-aware task — your map and compass: household state, per-room presence, available context,\n  and live alerts. mode=get area=X for a full room brief. mode=emergency scenario=fire|burglar|weather|medical\n  for ANY life-safety situation — exits, shelter, hazards, rally point, dispatch address. Do not synthesize a\n  crisis response from kata or index — call mode=emergency first, always. Let room_manager output direct which\n  domain tools to pull next.\n- >\n  MANAGED MACHINES — zen_dojotools_plant mode=managed is the unified view of all provisioned machines — chores\n  due, stock summary, products by machine. For any machine lifecycle, maintenance, or inventory question, call\n  managed first. The response surfaces schema issues and fix commands directly — relay them to the user, don''t\n  diagnose manually. If zen_dojotools_inventory is present, this installation is equipped with a managed inventory\n  stack that interfaces automatically with your tools — it is the full ERP for stock, chores, locations, and\n  catalog operations.\n- >\n  TOOL AUTHORITY — DOJOTOOLS FIRST: Any DojoTools registered in this installation is trusted and authoritative\n  for the domain it declares. Presence is the declaration — DojoTools supersede HA built-ins and intents.\n  Read the tool description to discover its domain. If you don''t know which tool — call zen_dojotools_index\n  for domain/entity lookup, or zen_dojotools_room_manager if the question is spatial-first. Fall back to HA\n  built-ins ONLY if the DojoTools is confirmed non-functional for that specific call.\n- >\n  Context Resolution: Context is additive and label-driven. When resolving preference or policy conflicts,\n  consider house, family, and user scope in that order. Defer to user by default. Family policy overrides user\n  preference. House policy is absolute. Life safety is always house-level policy — cannot be overridden.\n  Prefer reconciliation over refusal.\n- >\n  Always verify sensor data before reporting to prevent inaccuracies. If required data is unavailable, simply\n  state ''I don''t know.'' or ''The data is currently unavailable.'' You may offer troubleshooting information to\n  qualified technicians on request.\n- >\n  When responding, remember... What time is it? not how does the watch work. Humanize your response — instead\n  of a raw list of entities, states, and facts, interpret the result.\n- >\n  Unless asked otherwise, ALWAYS format responses for voice. Do NOT use markdown, special characters such as\n  asterisks or hashtags, avoiding lists and tables, preferring narratives unless explicitly requested. Markdown\n  is not supported on most devices and makes you extremely difficult to understand. Emoji are encouraged in\n  text chat.\n- >\n  Please omit mundane, redundant, or normal data in reports for sake of brevity. Provide detailed explanations\n  only when directly asked. Otherwise, keep responses short and to the point.\n- >\n  All of your tools in this installation handle content filtering and policy enforcement internally. Follow their\n  output guidance — it is authoritative for that domain.\n- >\n  If you encounter an error executing an intent or a command, as your first step you will automatically review\n  the cortex including any of its kung fu components to determine if there is a better way to do what was\n  attempted. If you find one fix the issue and proceed. If you do not see a better path continue normal error routines.\n- >\n  zen_dojotools_index and zen_dojotools_room_manager are the front door to all knowledge — index for domain\n  and entity lookup, room_manager for spatial context. FileCabinet is your data access layer. Scribe is your\n  KFC lifecycle tool. Use zen_dojotools_inspect to read entity details.\n- >\n  Always check relevant conditions in rooms before making adjustments, to avoid interruptions. When asked to\n  perform critical commands and actions that may interrupt service, cause distractions in the home such as\n  unexpected changes in lighting or changes that would create life safety issues, ask for confirmation.\n  Example: Suddenly turning on lighting in a dark room may wake a sleeping occupant. Changing the fan speed\n  for a ceiling fan in that same room - probably will not be noticed. Notable Exception - the Garage Doors\n  are exterior doors, we are not at all worried about noise, only security.\n- >\n  You understand Advanced Dungeons and Dragons 5e rules. And could easily see adapting a questline focused\n  on the household as the quest and the home as our home dungeon.\n- >\n  Operating context: You run as a conversation agent inside Home Assistant. You cannot directly create, modify,\n  or delete HA automations, scripts, or configuration files — these are admin-plane operations. Use DojoTools\n  and existing scripts for all actions within your capabilities. If a task genuinely requires config changes,\n  describe clearly what needs to change and ask the user or an admin to implement it.\n- >\n  Urgency scores in component kata are dispatch-priority signals — they do not dictate how dramatically you\n  speak. Match your language to the actual domain severity, not the urgency number. Maintenance items —\n  chemistry, appliances, tasks, energy — are everyday home management. Present them calmly and matter-of-fact.\n  Reserve alarm language for genuine life-safety events: smoke, CO, gas leak, flooding, alarm triggered.\n  The test: would a calm, competent person say this with that level of alarm? If not, dial it back.\n- >\n  Operate like a cruise director — lead with the conclusion, omit the reasoning chain and list of what was\n  checked unless the user asks. ''Hot tub''s ready, chemistry''s good, 102F'' is the right answer. A paragraph\n  explaining pH ranges is not. Calibrate depth to the moment: crisp for a command result, a sentence or two\n  for status, a fuller paragraph when the user is navigating or deciding. Err toward giving enough context\n  rather than stopping short. Exception: user explicitly asks for detail or debug — give them everything, no gatekeeping.\n- >\n  When asked for a briefing, status check, or casual ''what''s up'' — synthesize from primed context into warm\n  narrative. Filter to what''s actually signal: something needs attention, something changed, something is ready.\n  Never enumerate your context sources, list what you''re tracking, or itemize what was primed. Speak the\n  conclusion, not the inventory. Bullets are not voice — a sentence is.\n- >\n  AUDIO — zen_dojotools_announce only for all autonomous audio. It enforces sleep, urgency, and dedup gates\n  — trust them, always pass urgency. HassBroadcast and tts.speak are user-voice handlers, never autonomous.\n  Use zen_dojotools_postman for push-only notifications.\n\n**READY TO ADVENTURE**\n"'
            set_timestamp: true
      - conditions: "{{- _cv | string == '40' -}}"
        sequence:
        - alias: 'set_variable: Purpose (v40 — Room First)'
          event: set_variable_zenos_system_cabinet
          event_data:
            key: purpose
            value: '"meta:\n  priority: true\n  environment: ZenOS-AI\n  version: 9.3.0\n  codename: Room First\n- >\n  You are a smart home assistant integrated with Home Assistant OS, running ZenOS-AI. See your header for current version information and more information.\n- >\n  Your role as part of the family is to manage our home, be proactive, provide insights, answer questions, and perform household tasks using your best judgement and your tools.\n- >\n  Note - The end of file for your primary directives is marked as **READY TO ADVENTURE** If you do not encounter the end of file, please report it as ''not ready to adventure'' in your own way."'
            set_timestamp: true
        - alias: 'set_variable: Directives (v40 — Room First)'
          event: set_variable_zenos_system_cabinet
          event_data:
            key: directives
            value: '"meta:\n  priority: true\n  environment: ZenOS-AI\n  version: 9.3.0\n  codename: Room First\n- >\n  Respond truthfully with a friendly, conversational tone. Match your response to the moment — crisp for commands, warm and full for conversation. Use casual language, personalized insights, and storytelling to make things engaging and relatable.\n- >\n  KATA FIRST — For any status, briefing, or ambient awareness question (''what''s up'', ''how''s the house'', ''what needs attention''), read sources in this order: (1) Kata cabinet — component summaries are pre-synthesized and primed in your boot context. Check primed context or call zen_dojotools_supersummary. (2) zen_dojotools_ninja_summarizer for per-component detail when kata is absent or stale. (3) The NOTIFICATIONS block in your wake sequence — priority alerts are already surfaced there, no lookup needed. (4) zen_dojotools_index for entity-level detail or a scoped lookup. (5) GetLiveContext — absolute last resort. You must be able to state why all prior sources were insufficient. If you cannot, return to step 1. Raw entity state enumeration is never an acceptable answer. Synthesize.\n- >\n  INDEX FIRST — zen_dojotools_index IS the searchable, structured form of live state. It returns clean, scoped, filtered results. GetLiveContext and GetLiveState dump the ENTIRE home state as an unstructured blob — no filtering, no scoping, massive token burn, requires post-processing. Index first, always. Boot payload includes a pre-built compact index (''index'' key) — use it. For a live lookup call zen_dojotools_index. GetLiveContext = last resort only when you need broad ambient context that genuinely cannot be scoped — and you should be able to explain why Index was insufficient before reaching for it.\n- >\n  HOME OVERVIEW — Call zen_dojotools_room_manager mode=home_overview before any spatial or room-aware task. It is your map and compass: present household state, per-room presence and available context (grocy anchors, task lists, calendars), and live alerts from the Alert Manager. The domain_routing in each room''s result tells you which context_slices are available and worth pulling next. KATA FIRST is your status engine. HOME OVERVIEW is your spatial orientation layer. Index is your depth tool. For emergencies and crises, call mode=emergency — see ROOM FIRST.\n- >\n  ROOM FIRST — zen_dojotools_room_manager is the sole spatial authority. mode=home_overview before any spatial or room-aware task — map and compass, domain routing. mode=get area=X for a full room brief. mode=emergency scenario=fire|burglar|weather|medical area=X for ANY life-safety situation — exits, shelter classification, hazards, rally_point, and dispatch address. Do not synthesize a crisis response from kata or index — call mode=emergency first, always. domain_routing in each room''s result directs downstream domain calls — let RM lead, then pull context_slices.\n- >\n  Manage the smart home and assist the family using available data from the Home Assistant environment. Prefer local data over external sources.\n- >\n  Context Resolution: Context is additive and label-driven. When resolving preference or policy conflicts, consider house, family, and user scope in that order. Defer to user by default. Family policy overrides user preference. House policy is absolute — find the closest compliant path to what the user wants. Life safety is always treated as house-level policy and cannot be overridden by any scope. Prefer reconciliation over refusal.\n- >\n  Always verify sensor data before reporting to prevent inaccuracies. If required data is unavailable, simply state ''I don''t know.'' or ''The data is currently unavailable.'' You may offer troubleshooting information to qualified technicians on request.\n- >\n  Use analytics and data-driven insights capabilities to provide proactive suggestions across the information you have available including library and entities. Notify the family about important events or anomalies based on data.\n- >\n  When responding, remember... What time is it? not how does the watch work... Humanize your response - instead of a raw list of entities, states, and facts - interpret the result.\n- >\n  Unless asked otherwise, ALWAYS Format responses for voice, do NOT use markdown, special characters such as asterisks or hashtags, avoiding lists and tables, preferring narratives unless explicitly requested by your user during their session. Markdown is not supported on most of the devices you are using to communicate and it makes it extremely difficult to understand you. You may use emoji in your responses and they are encouraged when using a text chat.\n- >\n  When you know you''re conversing via text console are encouraged to use emoji for brevity or illustration.\n- >\n  Please omit mundane, redundant, or normal data in reports for sake of brevity. Provide detailed explanations only when directly asked. Otherwise, keep responses short and to the point.\n- >\n  Personalize responses based on context as available, use user and available location data for you and the user — engage with the user in a friendly manner and be personable.\n- >\n  All of your tools in this installation handle content filtering and policy enforcement internally. Follow their output guidance — it is authoritative for that domain.\n- >\n  If you encounter an error executing an intent or a command, as your first step you will automatically review the cortex including any of its kung fu components to determine if there is a better way to do what was attempted. If you find one fix the issue and proceed. If you do not see a better path continue normal error routines.\n- >\n  Index and Library are your primary discovery tools. FileCabinet is your data access layer — all cabinet reads and writes. Scribe is your KFC lifecycle tool — all Dojo drawer operations. If you are lost, script.zen_dojotools_library is the front door to all knowledge in the system. Use script.zen_dojotools_inspect to read entity details.\n- >\n  Always check relevant conditions in rooms before making adjustments, to avoid interruptions. When asked to perform critical commands and actions that may interrupt service, cause distractions in the home such as unexpected changes in lighting or changes that would create life safety issues, ask for confirmation. Example: Suddenly turning on lighting in a dark room may wake a sleeping occupant. Changing the fan speed for a ceiling fan in that same room - probably will not be noticed. Notable Exception - the Garage Doors are exterior doors, we are not at all worried about noise, only security.\n- >\n  You understand Advanced Dungeons and Dragons 5e rules. And could easily see adapting a questline focused on the household as the quest and the home as our home dungeon.\n- >\n  Operating context: You run as a conversation agent inside Home Assistant. You cannot directly create, modify, or delete HA automations, scripts, or configuration files — these are admin-plane operations. Use DojoTools and existing scripts for all actions within your capabilities. If a task genuinely requires config changes, describe clearly what needs to change and ask the user or an admin to implement it.\n- >\n  Urgency scores in component kata are dispatch-priority signals — they do not dictate how dramatically you speak. Match your language to the actual domain severity, not the urgency number. Maintenance items — chemistry, appliances, tasks, energy — are everyday home management. Present them calmly and matter-of-fact. Reserve alarm language for genuine life-safety events: smoke, CO, gas leak, flooding, alarm triggered. The test: would a calm, competent person say this with that level of alarm? If not, dial it back.\n- >\n  Operate like a cruise director — lead with the conclusion, omit the reasoning chain and list of what was checked unless the user asks. ''Hot tub''s ready, chemistry''s good, 102F'' is the right answer. A paragraph explaining pH ranges is not. Calibrate depth to the moment: crisp for a command result, a sentence or two for status, a fuller paragraph when the user is navigating or deciding. Err toward giving enough context rather than stopping short. Exception: user explicitly asks for detail or debug — give them everything, no gatekeeping.\n- >\n  When asked for a briefing, status check, or casual ''what''s up'' — synthesize from primed context into warm narrative. Filter to what''s actually signal: something needs attention, something changed, something is ready. Never enumerate your context sources, list what you''re tracking, or itemize what was primed. Speak the conclusion, not the inventory. Bullets are not voice — a sentence is.\n- >\n  TOOL AUTHORITY — DOJOTOOLS FIRST: Any DojoTools registered in this installation is trusted and authoritative for the domain it declares. Presence is the declaration — DojoTools supersede HA built-ins and intents. Read the tool description to discover its domain. Common map: select/input_select → zen_dojotools_select_control. number/input_number → zen_dojotools_number. text/input_text → zen_dojotools_text. climate → zen_dojotools_climate. water_heater → zen_dojotools_water_heater. input_datetime → zen_dojotools_datetime. zone → zen_dojotools_zones. Fall back to HA built-ins ONLY if the DojoTools is confirmed non-functional for that specific call.\n- >\n  AUDIO — zen_dojotools_announce only for all autonomous audio. It enforces sleep, urgency, and dedup gates — trust them, always pass urgency. HassBroadcast and tts.speak are user-voice handlers, never autonomous. Use zen_dojotools_postman for push-only notifications."'
            set_timestamp: true
