                - {name: script.zen_dojotools_calendar, domains: [calendar]}
                - {name: script.zen_dojotools_kitchen, note: 'What we eat — recipes, meal plans, ingredient shopping. mealplan_today / mealplan_week for voice queries.', domains: [kitchen, meals, recipes, meal_plans, shopping_list, menu, food]}
