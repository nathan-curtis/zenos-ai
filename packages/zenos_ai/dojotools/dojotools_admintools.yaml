        sequence:
        - event: set_variable_zenos_system_cabinet
          event_data:
            key: os_release
            value: >-
              {{
                {
                  'os_version': '2026.7.0',
                  'os_tag': '',
                  'cortex': '43',
                  'cortex_codename': 'Rule Zero',
                  'index': '4.9.1',
                  'filecabinet': '6.2.0',
                  'library': '5.5.0',
                  'query': '4.9.0',
                  'inspect': '4.9.1',
                  'supersummary': '3.6.0',
