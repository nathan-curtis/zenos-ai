                  \ 'index' key available immediately). GetLiveContext only when index cannot\
                  \ answer AND you can state specifically why. 'I don't know what to look for'\
                  \ = call index, not GetLiveContext. Calling GetLiveContext as a convenience\
                  \ shortcut is a bug."
