                    humidity, aux_heat. Replaces HassClimateSetTemperature.'}
                  water_heater: {tool: script.zen_dojotools_water_heater, note: 'GET+SET.
                    Replaces water_heater_set intent.'}
                  input_datetime: {tool: script.zen_dojotools_datetime, note: 'GET+SET.
                    Replaces input_datetime_set_datetime intent.'}
