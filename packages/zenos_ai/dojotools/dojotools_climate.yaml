###############################################################################
# ZenOS-AI DojoTools: Climate
# zen_dojotools_climate (v2.5.0)
# v2.5.0: the envelope offer. Exterior doors, windows and openings are the sensors
#   labeled exterior (device_class door, window, opening or garage_door). With
#   envelope_offer_enabled on (mode=envelope, needs zenos.system.home_config_write,
#   default off), one open five minutes while heating or cooling brings an
#   announcement and a Yes/No on the household's phones. A Yes turns off the units
#   that serve that area (the hvac_air_handler label the area and its thermostats
#   share, else a thermostat in the same area, else every unit running) and saves
#   each one's mode in the household drawer climate_envelope. Once everything has
#   been closed two minutes, it offers to put them back the same way. The new
#   automation Zen Climate Envelope Watcher calls the internal mode envelope_check;
#   nothing happens while the setting is off. The message carries the outdoor
#   temperature when the Weather tool is installed. Quiet while the house sleeps
#   (Postman's sleep rule): nothing is announced or asked; a Yes meant "off until it's
#   closed", so closing up overnight puts the units back quietly, and a courtesy note
#   is sent when the house wakes (Postman drops a message sent into the sleep gate).
# v2.4.1: zenos.climate.read also allows stage l (st_ok isl) and names its mode
#   (modes: ['summary'], level 1), so a live drawer mounted on mode=summary can read it,
#   like Print Shop. Grant with cert_stages=isl.
# v2.4.0: the climate KFC (mode=kfc_manifest: one component, climate, ambient tier, seeded
#   by summary, cert zenos.climate.read) and the Weather feed: summary carries outdoor
#   (current temperature and humidity, the next 24 hours' high and low, freeze_expected)
#   read from zen_dojotools_weather mode=summary when that tool is installed, and a
#   freeze_forecast reason (urgency 2, ambient) when a freeze is forecast. Without the
#   Weather tool, outdoor is {available: false}.
# v2.3.1: summary skips climate entities that are not room comfort: anything labeled
#   spa_climate, zen_plant_hot_tub, zen_plant_thermal or zen_rm_ignore. A hot tub held at
#   103 F on purpose scored overheat (urgency 4) on the first real house. The skipped
#   entities are listed under excluded.
# v2.3.0: mode=summary, a scored, read-only, whole-house answer (urgency 0-5, reasons,
#   units, attention) for the climate KFC to seed from; no entity name needed (name is
#   optional now, so a bare MCP call reaches help). It scores for the ambient tier:
#   freeze risk 5, overheat and a main thermostat unavailable 4, a spare unit
#   unavailable 3, conditioning with a door or window open 2, conditioning while the
#   house is Away 1. New read cert zenos.climate.read (level 1, stage s) declared with
#   seed_modes summary@zenos.climate.read:1. Info only: nothing here sets a thermostat.
# v2.2.2: moved out of the Utilities bundle (dojotools_utilities.yaml) into this
#   file, so Climate can be worked on and versioned by itself. The script is
#   unchanged: same entity, same fields, same behavior, same cert
#   (zenos.actuation.climate_control).
#
# GET and SET for climate and fan entities. See the field and mode help in the
# script itself (mode=help) and the version notes below.
###############################################################################

script:
  # ============================================================================
  # zen_dojotools_climate
  # Migrated from intent_script/climate_set — 2026-04-08
  # Additions: swing_mode, humidity, aux_heat, shorthand resolution,
  #            min/max_temp in capabilities, full GET response
  #
  # v2.0.0 — three changes:
  #   1. SESE conversion (matching locks/covers/
  #      ZenLux): this tool isn't mode-dispatch shaped (multiple setters can
  #      combine in one call, always could), so instead of a choose: block
  #      per mode, every former `- stop:` point now just sets `result` and
  #      falls through -- every subsequent step's own condition gained an
  #      explicit `result is not defined and` guard (flat, not nested,
  #      since the original behavior was already "first failure aborts
  #      immediately," which a flat guard reproduces exactly). ONE
  #      envelope()-wrapped exit at the very end.
  #   2. Real identity gate, like every other actuation-capable domain
  #      tool. climate_control cert (cert-only tier, same shape as ZenLux's
  #      lighting_control -- no live-ack tier, nothing here has the same
  #      physical-exposure shape as an exterior unlock). Read (GET) stays
  #      open; any real setter requires the cert. cert_scope deny is
  #      enforced as a hard block via the shared cert_scope_check macro,
  #      same as every other tool.
  #   3. Fan domain ownership: `name` now accepts fan.* as well as
  #      climate.*, domain-detected after resolution. New fan_percentage/
  #      fan_preset_mode/fan_oscillate/fan_direction setter fields (power=
  #      on/off is shared with climate, same field). Capability-detected
  #      via the real FanEntityFeature bitmask (SET_SPEED=1, OSCILLATE=2,
  #      DIRECTION=4, PRESET_MODE=8), same fail-closed-on-unsupported-
  #      feature philosophy climate already had. GET response is domain-
  #      aware -- fan state/capabilities shape, not climate's HVAC shape,
  #      when the resolved entity is fan.*. topology_context (open doors/
  #      windows, natural vent advisory) still applies to fans -- airflow
  #      context is if anything MORE relevant for a fan than a thermostat --
  #      but natural_vent's setpoint-delta math is climate-only (a fan has
  #      no target temperature), so it's null for fan entities.
  # ============================================================================
  zen_dojotools_climate:
    alias: Zen DojoTools Climate Manager
    mode: parallel
    max: 10
    description: >-
      GET+SET for climate AND fan entities (domain auto-detected from the
      resolved entity_id). Inspects supported_features before applying: 
      fails closed on unsupported feature. Climate: temperature (single or
      range), HVAC mode, fan mode, preset mode, swing mode, humidity, aux
      heat, power. Fan: percentage, preset mode, oscillate, direction,
      power. Multiple setters may be sent in one call. Omit all to read
      state + capabilities. GET response includes topology_context: open
      doors/windows, area temp/humidity sensors, adjacent HVAC bleed
      portals (via RM), and natural vent advisory (climate only).
      Actuation (any setter) requires the zenos.actuation.climate_control cert: read
      (GET) stays open.

      Examples:
        Read:      { "name": "climate.home" }
        Temp:      { "name": "climate.home", "temperature": 72 }
        Range:     { "name": "climate.home", "target_low": 68, "target_high": 74 }
        Mode:      { "name": "climate.home", "hvac_mode": "heat" }
        Multi:     { "name": "climate.home", "swing_mode": "vertical", "fan_mode": "auto" }
        Off:       { "name": "climate.home", "power": "off" }
        Fan speed: { "name": "fan.bedroom_ceiling", "fan_percentage": 60 }
        Fan off:   { "name": "fan.bedroom_ceiling", "power": "off" }

    fields:
      name:
        name: Entity
        description: climate or fan entity_id, or shorthand name
        required: false
        selector:
          entity:
            domain: [climate, fan]

      room:
        name: Room
        description: "Area for topology context in GET mode. Auto-detected from entity if omitted."
        required: false
        selector:
          text:

      temperature:
        name: Temperature
        description: Target temperature (single setpoint). Climate only.
        required: false
        selector:
          number:
            min: 40
            max: 110
            step: 0.5
            mode: box

      target_low:
        name: Target Low
        description: Lower bound for auto/heat-cool temperature range. Climate only.
        required: false
        selector:
          number:
            min: 40
            max: 110
            step: 0.5
            mode: box

      target_high:
        name: Target High
        description: Upper bound for auto/heat-cool temperature range. Climate only.
        required: false
        selector:
          number:
            min: 40
            max: 110
            step: 0.5
            mode: box

      hvac_mode:
        name: HVAC Mode
        description: HVAC operating mode - use get first to see supported modes. Climate only.
        required: false
        selector:
          text:

      fan_mode:
        name: Fan Mode (climate)
        description: Climate entity's own internal fan mode (e.g. thermostat fan setting) - use get first to see supported modes. NOT the same as fan_percentage/fan_preset_mode below, which target a real fan.* entity.
        required: false
        selector:
          text:

      swing_mode:
        name: Swing Mode
        description: Swing mode - use get first to see supported modes. Climate only.
        required: false
        selector:
          text:

      preset:
        name: Preset
        description: Preset or program mode (eco, sleep, away, etc.). Climate only.
        required: false
        selector:
          text:

      humidity:
        name: Target Humidity
        description: Target humidity percentage (if supported). Climate only.
        required: false
        selector:
          number:
            min: 0
            max: 100
            step: 1
            mode: box

      aux_heat:
        name: Aux Heat
        description: Enable or disable auxiliary heat (on/off/true/false). Climate only.
        required: false
        selector:
          text:

      power:
        name: Power
        description: "Power control: on or off. Climate: via hvac_mode. Fan: via fan.turn_on/turn_off. Shared field, domain-routed."
        required: false
        selector:
          text:

      fan_percentage:
        name: Fan Percentage
        description: Fan speed 0-100 (0 = off). Fan only. Requires SET_SPEED feature.
        required: false
        selector:
          number:
            min: 0
            max: 100
            step: 1
            mode: box

      fan_preset_mode:
        name: Fan Preset Mode
        description: Named fan preset (e.g. auto, sleep, eco) - use get first to see supported presets. Fan only. Requires PRESET_MODE feature.
        required: false
        selector:
          text:

      fan_oscillate:
        name: Fan Oscillate
        description: Enable or disable oscillation (on/off/true/false). Fan only. Requires OSCILLATE feature.
        required: false
        selector:
          text:

      fan_direction:
        name: Fan Direction
        description: forward | reverse. Fan only. Requires DIRECTION feature.
        required: false
        selector:
          select:
            options:
              - forward
              - reverse

      component:
        name: Component
        description: kfc_manifest only. A kata_key filter; omit for the list.
        required: false
        selector:
          text:

      get:
        name: Read Only
        description: Pass any truthy value to force read-only mode
        required: false
        selector:
          text:

      mode:
        description: >-
          Optional explicit operation selector: "read" to force a read-only
          reply regardless of any setter fields you also passed (same as
          get=true), "set" to require at least one real setter field
          (fails clearly with missing_setter if none are given, rather than
          silently reading), or "tool_manifest" for this tool's own self-
          description/schema dump instead of touching the entity. You can
          also just omit mode and use the setter fields / get directly: 
          both styles work identically.
        required: false
        selector:
          select:
            options:
              - read
              - set
              - tool_manifest
              - help
              - summary
              - kfc_manifest
              - envelope
              - envelope_check

      envelope_offer_enabled:
        name: Envelope offer
        description: >-
          mode=envelope only. Omit to read. true/false writes the setting (needs
          zenos.system.home_config_write): with it on, an exterior door, window or
          opening open five minutes while heating or cooling brings an announcement and
          a Yes/No on the household's phones to turn those units off, and an offer to
          turn them back on once everything is closed. Default off.
        required: false
        selector:
          boolean:

      envelope_event:
        name: Envelope event
        description: "Internal (mode=envelope_check, the Climate Envelope Watcher only): open or closed."
        required: false
        selector:
          text:

      caller_token:
        name: Caller Token
        description: Opaque audit token echoed in response.
        required: false
        selector:
          text:

    sequence:
      # ── Input normalization ────────────────────────────────────────────────
      - variables:
          _tm_mode: "{{ mode | default('') | lower }}"
      - choose:
        # bare call (no mode, no name passed) = help. name="" is NOT bare: some tools
        # resolve an explicitly empty name to a labeled default (e.g. main thermostat).
        - conditions: "{{ _tm_mode == 'help' or (_tm_mode == '' and name is not defined) }}"
          sequence:
          - variables:
              result:
                status: help
                message: >-
                  mode=read name=X — read state + capabilities (+ topology_context for
                  climate). Also the default when no setter fields are given.
                  mode=set name=X + one or more setters (temperature/hvac_mode/fan_mode/
                  etc for climate; fan_percentage/fan_preset_mode/etc for fan) — requires
                  zenos.actuation.climate_control cert. mode=summary — scored whole-house
                  climate. mode=envelope — exterior doors and windows (label exterior), which
                  are open, and the offer setting; envelope_offer_enabled=true/false writes it
                  (zenos.system.home_config_write). With it on, five minutes open while heating
                  or cooling brings an announcement and a phone Yes/No to turn the units that
                  serve that area off, and an offer to turn them back on once everything is
                  closed. mode=tool_manifest — this tool's manifest
                  declaration. mode=help — this reference, name field not required.
        - conditions: "{{ _tm_mode == 'tool_manifest' }}"
          sequence:
          - variables:
              result: >-
                {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
                {%- set _tm = MF.tool_manifest(
                    tool='zen_dojotools_climate',
                    summary='Read or set thermostats and fans',
                    display_name='Climate Manager',
                    tier='dojotools',
                    version='2.5.0',
                    health={'configured': true, 'status': 'ok', 'notes': []},
                    required_labels=['dojotools'],
                    optional_labels=['climate', 'fan', 'exterior', 'hvac_air_handler'],
                    consumes=['entity_name_or_id'],
                    returns=['climate_state', 'fan_state', 'climate_summary'],
                    modes={
                      'read': 'State and capabilities of one climate or fan entity (the default), with topology_context for climate',
                      'set': 'Change setpoint, mode, fan, swing, preset, humidity or power; needs zenos.actuation.climate_control',
                      'summary': 'Scored read-only whole-house climate: urgency, reasons, units, attention. The seed of the climate KFC (ambient tier); no name needed',
                      'kfc_manifest': 'The climate KFC definition (consumed by bootstrap_kfc)',
                      'envelope': 'Exterior doors and windows (label exterior), which are open, and the offer to turn the HVAC off when one stays open; envelope_offer_enabled writes the setting (needs zenos.system.home_config_write)',
                      'tool_manifest': 'Return tool identity + capabilities',
                      'help': 'This reference; the bare call'
                    },
                    icon='mdi:thermostat',
                    color='orange',
                    stripe=3,
                    impact='soft',
                    mcp_exposed=true,
                    seed_modes=['summary@zenos.climate.read:1'],
                    caller_token=caller_token | default('')
                ) | from_json -%}
                {{- _tm | combine({
                    'kfc_manifest': true, 'kfc_components': ['climate'],
                    'certs_required': [{
                      'cert': 'zenos.actuation.climate_control',
                      'display_name': 'Basic Climate/Fan Control',
                      'description': "Change thermostat and fan settings", 'detail': 'Setpoint/mode/speed actuation via zen_dojotools_climate (any setter field, climate.* or fan.*). Cert-only, same shape as ZenLux zenos.actuation.lighting_control -- no live-ack requirement, nothing here has the same physical-exposure shape as an exterior unlock. cert_scope deny is enforced as a hard block via the shared cert_scope_check macro (zen_os_1.jinja).',
                      'max_level': 1,
                      'gates': ['any setter field on climate.* or fan.* (cert only, deny enforced)'],
                      'live_ack_required_for': [],
                      'grant_via': "persona_editor mode=cert_req_grant cert_component=zenos.actuation.climate_control (or zen_dojotools_identity mode=cert_list to see current status)",
                      'bundle': ['zenos_agent_basic']
                    }, {
                      'cert': 'zenos.climate.read',
                      'display_name': 'Climate Read',
                      'description': "Read the whole-house thermostat picture for the background summary",
                      'detail': 'The climate summary seeds through mode=summary (every thermostat, its mode, temperature, open doors and windows around it, and whether it is unavailable). Granted with the Ninja seed stage (s), the background summary may read it; without it the summary stops and its last kata leaves the prompt. Asking in conversation does not need it.',
                      'max_level': 1,
                      'level': 1,
                      'modes': ['summary'],
                      'st_ok': 'isl',
                      'gates': ['mode=summary (interactive, stage i)', 'the Ninja seed of the climate component (stage s)', 'a live drawer mounted on mode=summary (stage l)'],
                      'live_ack_required_for': [],
                      'grant_via': "persona_editor mode=cert_req_grant cert_component=zenos.climate.read cert_stages=isl"
                    }, {
                      'cert': 'zenos.system.home_config_write',
                      'display_name': 'House Settings',
                      'description': "Turn the open-door HVAC offer on or off",
                      'detail': 'Write path of mode=envelope (envelope_offer_enabled), a house-wide behavior setting stored in the household cabinet drawer climate_envelope. Reading the status needs nothing. The shutoff and the restore each also wait for a person to answer Yes on the phone.',
                      'max_level': 1,
                      'level': 1,
                      'modes': ['envelope'],
                      'gates': ['mode=envelope with envelope_offer_enabled (write only)'],
                      'live_ack_required_for': [],
                      'grant_via': "persona_editor mode=cert_req_grant cert_component=zenos.system.home_config_write"
                    }]
                  }) -}}
        - conditions: "{{ _tm_mode == 'kfc_manifest' }}"
          sequence:
          - variables:
              _kfc_filter: "{{ component | default('', true) | string | trim | lower if component is defined else '' }}"
              _kfc_defs:
                - kata_key: climate
                  friendly_name: Climate
                  label: main_thermostat
                  component_summary: >-
                    Thermostats and room climate across the house: freeze and overheat
                    risk, a main thermostat that is unavailable, heating or cooling with a
                    door or window open or while nobody is home, and the outdoor weather
                    that bears on it. Consult for any question about the indoor climate.
                  component_instructions: >-
                    SCOPE: Indoor climate for the house. Tool: zen_dojotools_climate.
                      Ambient tier: you are read through the ambient index; keep it to one
                      line unless something is wrong. Spa and thermal loads are not room
                      climate and are skipped.

                    DATA ACCESS:
                      The seed is zen_dojotools_climate mode=summary (scored, read-only).
                      Use its fields; do not invent temperatures or units. Fields: urgency
                      (0-5), action_required (urgency 3 or more), reasons[], unit_count,
                      home_mode, units[]{entity_id, name, area, mode, action, current,
                      target, unit, main, unavailable, open_openings[]}, attention[]{reason,
                      entity_id, name}, excluded[], outdoor{available, temperature, humidity,
                      temp_high, temp_low, freeze_expected, unit}, watch_entities[].
                      A reason of no_climate_units means the house has no room climate to
                      read: say so, do not guess.
                      Detail on demand: zen_dojotools_climate name=<entity_id>.

                    WHAT TO SURFACE:
                      1. Errors first (urgency 4 or more): freeze risk, overheat, the main
                         thermostat unavailable, with the entity and the number.
                      2. Otherwise one line: the main thermostat's temperature and mode.
                      3. Waste (conditioning with an opening open, or while Away) and a
                         freeze forecast, if any, in one short clause.

                    OUTPUT FORMAT:
                      Nominal: "Home 73F, auto. Outside 52F, high 66." One line.
                      Error: "Freeze risk: Master Bedroom reads 41F. Check the heater."

                    TONE: Plain and brief, like a note on the thermostat.
                  trigger_subscriptions:
                    - hourly_trigger
                    - ha_start
                    - home_mode_updates
                    - force_summary
                  pipeline_tier: ambient
                  drift_threshold: 5
                  emission_cooldown_minutes: 60
                  delay_seconds: 0
                  suggested_act_event: null
                  seed:
                    tool: zen_dojotools_climate
                    params:
                      mode: summary
                  master_switch: ""
                  index_call:
                    domain_inspect_domains: []
                    domain_inspect_limit: 25
                    expand_entities: false
                    filter_json: {}
                    label_1: main_thermostat
                    label_2: ""
                    operator: AND
                    output_fields: ""
                  meta:
                    enabled: true
                    requires:
                      cert: zenos.climate.read
                      level: 1
          - variables:
              _kfc_out: >-
                {%- if _kfc_filter == '' -%}
                  {{ _kfc_defs }}
                {%- else -%}
                  {{ _kfc_defs | selectattr('kata_key', 'equalto', _kfc_filter) | list }}
                {%- endif -%}
              result:
                status: ok
                tool: zen_dojotools_climate
                version: "2.5.0"
                mode: kfc_manifest
                kfc: "{{ _kfc_out }}"
                count: "{{ _kfc_out | length }}"
                caller_token: "{{ caller_token | default('', true) }}"
      - variables:
          raw: "{{ name | default('', true) | string | trim }}"
          temperature_raw: "{{ temperature | default(none, true) }}"
          low_raw: "{{ target_low | default(none, true) }}"
          high_raw: "{{ target_high | default(none, true) }}"
          hvac_raw: "{{ hvac_mode | default(none, true) }}"
          fan_raw: "{{ fan_mode | default(none, true) }}"
          swing_raw: "{{ swing_mode | default(none, true) }}"
          preset_raw: "{{ preset | default(none, true) }}"
          humidity_raw: "{{ humidity | default(none, true) }}"
          aux_raw: "{{ aux_heat | default(none, true) }}"
          power_raw: "{{ power | default(none, true) }}"
          fanpct_raw: "{{ fan_percentage | default(none, true) }}"
          fanpreset_raw: "{{ fan_preset_mode | default(none, true) }}"
          fanosc_raw: "{{ fan_oscillate | default(none, true) }}"
          fandir_raw: "{{ fan_direction | default(none, true) }}"
          get_raw: "{{ get | default(none, true) }}"
          _token: "{{ caller_token | default('', true) }}"
          room_raw: "{{ room | default(none, true) }}"
          r_temp_status: null
          r_range_status: null
          r_hvac_status: null
          r_fan_status: null
          r_swing_status: null
          r_preset_status: null
          r_humidity_status: null
          r_aux_status: null
          r_power_status: null
          r_fanpct_status: null
          r_fanpreset_status: null
          r_fanosc_status: null
          r_fandir_status: null

      # ── Entity resolution ─────────────────────────────────────────────────
      # Only an EMPTY name hunts by label -- "the main thermostat/fan,
      # whichever entity_id it currently has" (survives hardware swaps).
      # main_thermostat tried first (climate is the original/primary use
      # case), then main_fan. An explicit name, including
      # a literal entity_id, is resolved literally -- if it doesn't exist,
      # fail with not_found rather than silently rewriting it.
      - variables:
          _slug: "{{ raw | replace(':', '') | slugify }}"
          _labeled_thermostat: "{{ label_entities('main_thermostat') | select('match', '^climate\\.') | list | first | default('', true) }}"
          _labeled_fan: "{{ label_entities('main_fan') | select('match', '^fan\\.') | list | first | default('', true) }}"
          _entity_id: >-
            {%- if raw == '' and _labeled_thermostat -%}{{ _labeled_thermostat }}
            {%- elif raw == '' and _labeled_fan -%}{{ _labeled_fan }}
            {%- elif '.' in raw -%}{{ raw }}
            {%- elif states('climate.' ~ _slug) not in ['unknown', 'unavailable'] -%}climate.{{ _slug }}
            {%- elif states('fan.' ~ _slug) not in ['unknown', 'unavailable'] -%}fan.{{ _slug }}
            {%- else -%}{{ raw }}{%- endif -%}
          _domain: "{{ _entity_id.split('.')[0] if '.' in _entity_id else '' }}"

      # Onboarding gate (zen_os_1 entry_gate): an agent without
      # zenos.agent.basic gets help and tool_manifest only. Automations and
      # REFLEX (no user) pass.
      - variables:
          _cl_gate: >-
            {%- import 'zenos_ai/zen_os_1.jinja' as OS -%}
            {{ OS.entry_gate((context.user_id if context is defined else '') or '', 'zen_dojotools_climate', _tm_mode or 'get') | from_json({'pass': false, 'reason': 'guarded: the onboarding gate could not be read'}) }}
      - if: "{{ result is not defined and not _cl_gate.get('pass', false) }}"
        then:
          - variables:
              result:
                status: error
                mode: "{{ _tm_mode }}"
                reason: "{{ _cl_gate.reason }}"
                next_step: "{{ _cl_gate.next_step }}"
          - action: system_log.write
            data:
              level: warning
              logger: zen_entry_gate
              message: "{{ _cl_gate.get('log') or 'onboarding gate refused a call (gate result unreadable)' }}"

      # ── summary: scored, read-only, whole house (the seed of the climate KFC) ──
      # No entity needed. Reads every climate entity once, scores it in code (the model
      # never scores): urgency 0-5, reasons, and the units that earned them. Freeze and
      # overheat read the unit's own current temperature (Fahrenheit when the entity's
      # max_temp is 50 or more, Celsius otherwise). Info only: nothing here changes a
      # thermostat.
      - if: "{{ result is not defined and _tm_mode == 'summary' }}"
        then:
          - variables:
              _cs_home_mode: "{{ states('sensor.zen_home_mode') }}"
              _cs_main: "{{ label_entities('main_thermostat') | list }}"
              # Climate entities that are not room comfort: a spa held at 103 F on purpose,
              # a thermal load, anything the household told Room Manager to ignore. They are
              # not scored (a hot tub is not "overheating") and are listed as excluded.
              _cs_skip: "{{ (label_entities('spa_climate') + label_entities('zen_plant_hot_tub') + label_entities('zen_plant_thermal') + label_entities('zen_rm_ignore')) | unique | list }}"
          # Outdoor context from the Weather tool when it is installed (optional): the
          # current outdoor temperature and humidity, the next 24 hours' high and low, and
          # whether a freeze is forecast. Without the Weather tool, outdoor is just
          # {available: false}.
          - action: script.zen_dojotools_weather
            enabled: "{{ states('script.zen_dojotools_weather') in ['on', 'off'] }}"
            continue_on_error: true
            data:
              mode: summary
            response_variable: _cs_wx
          - variables:
              _cs_wxr: "{{ _cs_wx.get('result', {}) if (_cs_wx is defined and _cs_wx is mapping) else {} }}"
              _cs_outdoor: >-
                {%- set r = _cs_wxr if _cs_wxr is mapping else {} -%}
                {%- set n = r.get('now', {}) if r.get('now') is mapping else {} -%}
                {%- set nx = r.get('next_24h', {}) if r.get('next_24h') is mapping else {} -%}
                {%- if r.get('status') == 'ok' and n.get('temperature') is not none -%}
                  {{ {'available': true, 'temperature': n.get('temperature'), 'humidity': n.get('humidity'), 'condition': n.get('condition'), 'temp_high': nx.get('temp_high'), 'temp_low': nx.get('temp_low'), 'unit': (r.get('units', {}) or {}).get('temperature'), 'freeze_expected': (r.get('reasons', []) | select('in', ['freeze', 'hard_freeze']) | list | count) > 0} }}
                {%- else -%}{{ {'available': false} }}{%- endif -%}
          - variables:
              _cs_excluded: "{{ states.climate | map(attribute='entity_id') | select('in', _cs_skip) | list }}"
              _cs_units: >-
                {%- set ns = namespace(u=[]) -%}
                {%- for s in states.climate if s.entity_id not in _cs_skip -%}
                  {%- set a = s.attributes -%}
                  {%- set f = (a.get('max_temp', 0) | float(0)) >= 50 -%}
                  {%- set ct = a.get('current_temperature', none) -%}
                  {%- set area = area_id(s.entity_id) or '' -%}
                  {%- set op = namespace(o=[]) -%}
                  {%- if area != '' -%}
                    {%- for b in area_entities(area) | select('match', 'binary_sensor\\.') -%}
                      {%- if state_attr(b, 'device_class') in ['door', 'window', 'opening', 'garage_door'] and is_state(b, 'on') -%}
                        {%- set op.o = op.o + [b] -%}
                      {%- endif -%}
                    {%- endfor -%}
                  {%- endif -%}
                  {%- set ns.u = ns.u + [{
                    'entity_id': s.entity_id,
                    'name': a.get('friendly_name', s.entity_id),
                    'area': area,
                    'mode': s.state,
                    'action': a.get('hvac_action', none),
                    'current': ct,
                    'target': a.get('temperature', none),
                    'unit': 'F' if f else 'C',
                    'main': s.entity_id in _cs_main,
                    'unavailable': s.state in ['unavailable', 'unknown'],
                    'open_openings': op.o
                  }] -%}
                {%- endfor -%}
                {{ ns.u }}
          - variables:
              _cs_attn: >-
                {%- set ns = namespace(a=[]) -%}
                {%- for u in _cs_units -%}
                  {%- set ct = u.current | float(none) if u.current is not none else none -%}
                  {%- set f = u.unit == 'F' -%}
                  {%- if u.unavailable -%}
                    {%- set ns.a = ns.a + [{'reason': 'main_thermostat_unavailable' if u.main else 'thermostat_unavailable', 'entity_id': u.entity_id, 'name': u.name}] -%}
                  {%- endif -%}
                  {%- if ct is not none and ((f and ct <= 45) or ((not f) and ct <= 7)) -%}
                    {%- set ns.a = ns.a + [{'reason': 'freeze_risk', 'entity_id': u.entity_id, 'name': u.name, 'current': ct, 'unit': u.unit}] -%}
                  {%- endif -%}
                  {%- if ct is not none and ((f and ct >= 90) or ((not f) and ct >= 32)) -%}
                    {%- set ns.a = ns.a + [{'reason': 'overheat', 'entity_id': u.entity_id, 'name': u.name, 'current': ct, 'unit': u.unit}] -%}
                  {%- endif -%}
                  {%- if u.action in ['heating', 'cooling'] and (u.open_openings | count) > 0 -%}
                    {%- set ns.a = ns.a + [{'reason': 'conditioning_with_opening', 'entity_id': u.entity_id, 'name': u.name, 'openings': u.open_openings}] -%}
                  {%- endif -%}
                  {%- if u.action in ['heating', 'cooling'] and _cs_home_mode == 'Away' -%}
                    {%- set ns.a = ns.a + [{'reason': 'conditioning_while_away', 'entity_id': u.entity_id, 'name': u.name}] -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.a }}
          - variables:
              # The HVAC is paused for an open door or window (the envelope offer): the
              # units it turned off that are still off, so an off unit has its reason.
              _cs_env_paused: >-
                {%- set cab = label_entities('Zen Household Cabinet') | select('match', 'sensor\\.') | list | first | default('') -%}
                {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                {%- set d = (CABS.cabinet_drawer_value_mounted(cab, 'climate_envelope') | from_json({})) if cab != '' else {} -%}
                {%- set so = d.get('shut_off', {}) if (d is mapping and d.get('shut_off') is mapping) else {} -%}
                {%- set ns = namespace(o=[]) -%}
                {%- for p in so.get('units', []) if p is sequence and p | count == 2 and states(p[0]) == 'off' -%}{%- set ns.o = ns.o + [p[0]] -%}{%- endfor -%}
                {{ ns.o }}
          - variables:
              _cs_reasons: "{{ ((_cs_attn | map(attribute='reason') | list) + (['no_climate_units'] if (_cs_units | count) == 0 else []) + (['freeze_forecast'] if (_cs_outdoor.get('freeze_expected') or false) else []) + (['paused_for_envelope'] if (_cs_env_paused | count) > 0 else [])) | unique | list }}"
          - variables:
              # Scored for the ambient tier (Trapper Keeper): 0-3 stays in the ambient index,
              # 4-5 is promoted to a line in the attention list. So an error scores 4 or 5:
              # freeze risk 5, overheat and a main thermostat that is unavailable 4. A spare
              # unit unavailable is 3, and waste (an opening or an empty house while
              # conditioning) is 1 or 2, which stay ambient.
              _cs_urgency: >-
                {%- set r = _cs_reasons -%}
                {{- 5 if 'freeze_risk' in r else
                    (4 if ('main_thermostat_unavailable' in r or 'overheat' in r) else
                    (3 if 'thermostat_unavailable' in r else
                    (2 if ('conditioning_with_opening' in r or 'freeze_forecast' in r) else
                    (1 if ('conditioning_while_away' in r or 'paused_for_envelope' in r) else 0)))) -}}
          - variables:
              result:
                status: ok
                mode: summary
                urgency: "{{ _cs_urgency | int(0) }}"
                action_required: "{{ (_cs_urgency | int(0)) >= 3 }}"
                reasons: "{{ _cs_reasons }}"
                unit_count: "{{ _cs_units | count }}"
                excluded: "{{ _cs_excluded }}"
                outdoor: "{{ _cs_outdoor }}"
                envelope_paused: "{{ _cs_env_paused }}"
                home_mode: "{{ _cs_home_mode }}"
                units: "{{ _cs_units[:8] }}"
                attention: "{{ _cs_attn[:8] }}"
                watch_entities: "{{ (_cs_attn | map(attribute='entity_id') | list | unique | list)[:12] }}"
                suggested_act_event: null
                caller_token: "{{ _token }}"

      # ── envelope: offer to turn the HVAC off when the house is open ────────────
      # The envelope is every door, window or opening sensor labeled exterior
      # (binary_sensor, device_class door, window, opening or garage_door). When one
      # has been open for five minutes while heating or cooling runs, the Climate
      # Envelope Watcher calls envelope_check: it announces in the house and sends a
      # Yes/No to the household's phones. A Yes turns off the units that serve the
      # open area (the hvac_air_handler label the area and its thermostats share, else
      # a thermostat in the same area, else every unit that is running) and saves the
      # mode each was in. When every opening has been closed for two minutes it offers
      # to put them back. Off by default (envelope_offer_enabled): the setting is the
      # household's approval, and each shutoff and restore also waits for a person's
      # Yes. mode=envelope reads the status; envelope_offer_enabled=true/false writes
      # the setting (needs zenos.system.home_config_write).
      - variables:
          _ce_on_mode: "{{ result is not defined and _tm_mode in ['envelope', 'envelope_check'] }}"
      - if: "{{ _ce_on_mode }}"
        then:
          - variables:
              _ce_cab: "{{ label_entities('Zen Household Cabinet') | select('match', 'sensor\\.') | list | first | default('') }}"
              _ce_skip: "{{ (label_entities('spa_climate') + label_entities('zen_plant_hot_tub') + label_entities('zen_plant_thermal') + label_entities('zen_rm_ignore')) | unique | list }}"
          - variables:
              _ce_drawer: >-
                {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                {%- set d = (CABS.cabinet_drawer_value_mounted(_ce_cab, 'climate_envelope') | from_json({})) if _ce_cab != '' else {} -%}
                {{ d if d is mapping else {} }}
              _ce_envelope: >-
                {%- set ns = namespace(o=[]) -%}
                {%- for s in expand(label_entities('exterior')) if s.domain == 'binary_sensor' and s.attributes.get('device_class') in ['door', 'window', 'opening', 'garage_door'] -%}
                  {%- set ns.o = ns.o + [{'entity_id': s.entity_id, 'name': s.name, 'area': area_id(s.entity_id) or '', 'open': s.state == 'on'}] -%}
                {%- endfor -%}
                {{ ns.o }}
          - variables:
              _ce_enabled: "{{ _ce_drawer.get('enabled', false) | bool(false) }}"
              _ce_open: "{{ _ce_envelope | selectattr('open') | list }}"
              _ce_saved: "{{ _ce_drawer.get('shut_off', {}) if _ce_drawer.get('shut_off') is mapping else {} }}"

      # mode=envelope: status, and the setting write.
      - if: "{{ _ce_on_mode and _tm_mode == 'envelope' }}"
        then:
          - variables:
              _ce_write: "{{ envelope_offer_enabled is defined and envelope_offer_enabled not in [none, ''] }}"
          - if: "{{ _ce_write }}"
            then:
              - action: script.zen_dojotools_identity
                response_variable: _ce_id_raw
                continue_on_error: true
                data:
                  mode: resolve_caller_identity
                  required_cert: zenos.system.home_config_write
                  required_cert_level: 1
                  caller_token: "{{ _token }}"
              - variables:
                  _ce_id: >-
                    {%- import 'zenos_ai/zen_os_1.jinja' as OS -%}
                    {%- set _raw = OS.resolve_identity_fields(_ce_id_raw) -%}
                    {{- (_raw | from_json) if _raw is string else _raw -}}
              - if: "{{ not (_ce_id.authorized | default(false)) }}"
                then:
                  - variables:
                      result:
                        status: error
                        mode: envelope
                        error: cert_insufficient
                        message: "zenos.system.home_config_write level 1 is needed to change envelope_offer_enabled. Reading the status needs nothing."
                        can_request: "{{ _ce_id.policy_status | default('') == 'allowed' }}"
                        request_via:
                          tool: zen_dojotools_persona_editor
                          mode: cert_req_grant
                          cert_component: zenos.system.home_config_write
                          cert_level: 1
                        caller_token: "{{ _token }}"
              - if: "{{ result is not defined and _ce_cab == '' }}"
                then:
                  - variables:
                      result:
                        status: error
                        mode: envelope
                        error: no_household_cabinet
                        message: "No cabinet is labeled Zen Household Cabinet, so the setting has nowhere to live."
                        caller_token: "{{ _token }}"
              - if: "{{ result is not defined }}"
                then:
                  - action: script.zen_sutra_filecabinet
                    continue_on_error: true
                    data:
                      mode: upsert
                      write_mode: replace
                      key: climate_envelope
                      volume_entity_id: "{{ _ce_cab }}"
                      value: >-
                        {{ _ce_drawer | combine({'enabled': envelope_offer_enabled | bool, 'updated_at': now().isoformat()}) | tojson }}
                    response_variable: _ce_fc
          - if: "{{ result is not defined }}"
            then:
              - variables:
                  result:
                    status: ok
                    mode: envelope
                    enabled: "{{ (envelope_offer_enabled | bool) if _ce_write else _ce_enabled }}"
                    written: "{{ (envelope_offer_enabled | bool) if _ce_write else none }}"
                    envelope: "{{ _ce_envelope }}"
                    open_now: "{{ _ce_open | map(attribute='entity_id') | list }}"
                    shut_off: "{{ _ce_saved if _ce_saved else none }}"
                    how_to: >-
                      The envelope is every door, window or opening sensor labeled exterior
                      (zen_dojotools_labels mode=tag label_list=[exterior] target_entities=[...]).
                      Which units an opening turns off: the hvac_air_handler (or
                      hvac_air_handler_<n>) label its area shares with thermostats, else a
                      thermostat in the same area, else every unit running. With
                      envelope_offer_enabled=true, five minutes open while heating or cooling
                      brings an announcement and a Yes/No on the household's phones; a Yes turns
                      those units off, and closing everything for two minutes brings an offer to
                      turn them back on.
                    caller_token: "{{ _token }}"

      # mode=envelope_check: internal, the Climate Envelope Watcher only. A user or
      # agent session could otherwise turn the HVAC off without the setter's cert.
      - if: "{{ _ce_on_mode and _tm_mode == 'envelope_check' and ((context.user_id if context is defined else '') or '') != '' }}"
        then:
          - variables:
              result:
                status: error
                mode: envelope_check
                reason: "guarded: envelope_check is internal; only the Climate Envelope Watcher calls it. Use mode=envelope to read the status."
                caller_token: "{{ _token }}"
      - if: "{{ result is not defined and _ce_on_mode and _tm_mode == 'envelope_check' }}"
        then:
          - variables:
              _ce_event: "{{ envelope_event | default('', true) | string | lower | trim }}"
              # Quiet while the house sleeps: the same rule Postman's sleep gate uses (quiet
              # hours on, or the home mode Night or Night-Late). No announcement and no push.
              _ce_sleep: >-
                {{ is_state(label_entities('zen_quiet_hours') | select('match', 'binary_sensor\\.') | list | first | default('none', true), 'on')
                   or is_state(label_entities('zen_home_mode') | select('match', 'input_select\\.') | list | first | default('none', true), 'Night')
                   or is_state(label_entities('zen_home_mode') | select('match', 'input_select\\.') | list | first | default('none', true), 'Night-Late') }}
              # Outdoor temperature for the message, from the Weather tool when installed.
          - action: script.zen_dojotools_weather
            enabled: "{{ states('script.zen_dojotools_weather') in ['on', 'off'] }}"
            continue_on_error: true
            data:
              mode: current
            response_variable: _ce_wx
          - variables:
              _ce_outside: >-
                {%- set r = _ce_wx.get('result', {}) if (_ce_wx is defined and _ce_wx is mapping) else {} -%}
                {%- set n = r.get('now', {}) if (r is mapping and r.get('now') is mapping) else {} -%}
                {%- set u = ((r.get('units', {}) or {}).get('temperature', '')) if r is mapping else '' -%}
                {{ ('It is ' ~ (n.temperature | round(0) | int) ~ u ~ ' outside. ') if n.get('temperature') is number else '' }}

          # Open five minutes: pick the units, then ask.
          - if: "{{ _ce_event == 'open' }}"
            then:
              - variables:
                  _ce_units: >-
                    {%- set running = states.climate | rejectattr('entity_id', 'in', _ce_skip) | rejectattr('state', 'in', ['off', 'unavailable', 'unknown']) | list -%}
                    {%- set areas = _ce_open | map(attribute='area') | reject('eq', '') | unique | list -%}
                    {%- set ns = namespace(ah=[], o=[]) -%}
                    {%- for a in areas -%}{%- set ns.ah = ns.ah + (labels(a) | select('match', '^hvac_air_handler(_[0-9]+)?$') | list) -%}{%- endfor -%}
                    {%- for s in running -%}
                      {%- if (labels(s.entity_id) | select('in', ns.ah) | list | count) > 0 or (area_id(s.entity_id) or '') in areas -%}
                        {%- set ns.o = ns.o + [s] -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {%- set picked = ns.o if ns.o | count > 0 else running -%}
                    {{ picked | map(attribute='entity_id') | list }}
                  _ce_what: >-
                    {%- set ns = namespace(a=[], m=[]) -%}
                    {%- for s in expand(_ce_units) -%}
                      {%- set ns.a = ns.a + [s.attributes.get('hvac_action', '') | string] -%}{%- set ns.m = ns.m + [s.state] -%}
                    {%- endfor -%}
                    {{ 'the heat' if ('heating' in ns.a or (ns.m | select('eq', 'heat') | list | count > 0 and 'cooling' not in ns.a)) else ('the air conditioning' if ('cooling' in ns.a or 'cool' in ns.m) else 'the HVAC') }}
                  _ce_names: "{{ (_ce_open | map(attribute='name') | list)[:3] | join(', ') }}"
              - variables:
                  _ce_go: "{{ _ce_enabled and not _ce_sleep and (_ce_open | count) > 0 and (_ce_units | count) > 0 and not _ce_saved }}"
              - if: "{{ _ce_go }}"
                then:
                  - action: script.zen_dojotools_announce
                    continue_on_error: true
                    data:
                      message: >-
                        {{ _ce_names }} {{ 'has' if (_ce_open | count) == 1 else 'have' }} been open five minutes with {{ _ce_what }} on. {{ _ce_outside }}I sent a question to your phone about turning it off.
                      urgency: 5
                      caller_token: climate_envelope
                  - action: script.zen_dojotools_postman
                    continue_on_error: true
                    response_variable: _ce_pm
                    data:
                      mode: resolve_and_dispatch
                      title: "Open with {{ _ce_what }} on"
                      message: >-
                        {{ _ce_names }} {{ 'has' if (_ce_open | count) == 1 else 'have' }} been open five minutes with {{ _ce_what }} running. {{ _ce_outside }}Turn it off until it's closed?
                      urgency: 6
                      channel_hint: push
                      response_type: yes_no
                      response_timeout_s: 300
                      ack_owner: climate
                      # One tag per question (the minute it was sent), so a tap on an
                      # older notification cannot answer this one.
                      tag: "pm_climate_off_{{ (now().timestamp() // 60) | int }}"
                      caller_token: climate_envelope_off
                  - variables:
                      _ce_ack: >-
                        {%- set r = _ce_pm if (_ce_pm is defined and _ce_pm is mapping) else {} -%}
                        {%- set r = r.get('result', r) if r.get('result') is mapping else r -%}
                        {%- set r = r.get('result', r) if r.get('result') is mapping else r -%}
                        {{ (r.get('ack_action', '') or '') | string | lower }}
                      # Still open? A door closed while the question waited is not turned off.
                      _ce_still_open: >-
                        {%- set ns = namespace(n=0) -%}
                        {%- for s in expand(label_entities('exterior')) if s.domain == 'binary_sensor' and s.state == 'on' and s.attributes.get('device_class') in ['door', 'window', 'opening', 'garage_door'] -%}{%- set ns.n = ns.n + 1 -%}{%- endfor -%}
                        {{ ns.n > 0 }}
                  - if: "{{ _ce_ack == 'yes' and _ce_still_open }}"
                    then:
                      - variables:
                          # Each unit and the mode it was in, saved before it is turned off.
                          _ce_record: >-
                            {%- set ns = namespace(u=[]) -%}
                            {%- for s in expand(_ce_units) -%}{%- set ns.u = ns.u + [[s.entity_id, s.state]] -%}{%- endfor -%}
                            {{ {'at': now().isoformat(), 'openings': _ce_open | map(attribute='entity_id') | list, 'units': ns.u} }}
                      - action: climate.set_hvac_mode
                        continue_on_error: true
                        target:
                          entity_id: "{{ _ce_units }}"
                        data:
                          hvac_mode: "off"
                      - action: script.zen_sutra_filecabinet
                        continue_on_error: true
                        data:
                          mode: upsert
                          write_mode: replace
                          key: climate_envelope
                          volume_entity_id: "{{ _ce_cab }}"
                          value: "{{ _ce_drawer | combine({'shut_off': _ce_record}) | tojson }}"
                      - action: script.zen_dojotools_announce
                        continue_on_error: true
                        data:
                          message: "Turned {{ _ce_what }} off. When everything is closed I'll offer to turn it back on."
                          urgency: 4
                          caller_token: climate_envelope
                      # One line in the agent's active context while the pause lasts, so a
                      # "why is it cold" or "turn the heat on" is answered knowing why.
                      # Cleared when the record is (restore, or any answer to the offer).
                      - event: zen_event
                        event_data:
                          event:
                            kind: priority_inject_write
                            provider_id: climate_envelope
                            summary: >-
                              {{ _ce_what[:1] | upper ~ _ce_what[1:] }} paused: {{ _ce_names }} open since {{ now().strftime('%H:%M') }}, and the household said yes to turning it off. It goes back on with their yes once everything is closed (quietly if overnight).
                            urgency: urgent
                            expires_minutes: 1440
                            entities: "{{ ((_ce_open | map(attribute='entity_id') | list)[:1] + _ce_units)[:3] }}"
                            display: prompt
              - variables:
                  result:
                    status: ok
                    mode: envelope_check
                    event: open
                    result: >-
                      {{ ('turned_off' if (_ce_ack | default('')) == 'yes' and (_ce_still_open | default(false)) else
                          ('closed_before_answer' if (_ce_ack | default('')) == 'yes' else
                          ('declined' if (_ce_ack | default('')) == 'no' else 'no_answer'))) if _ce_go else
                         ('option_off' if not _ce_enabled else ('house_asleep' if _ce_sleep else ('already_off' if _ce_saved else ('nothing_running' if (_ce_units | count) == 0 else 'nothing_open')))) }}
                    units: "{{ _ce_units }}"
                    openings: "{{ _ce_open | map(attribute='entity_id') | list }}"
                    caller_token: "{{ _token }}"

          # Closed two minutes after a shutoff: offer to put it back.
          - if: "{{ _ce_event == 'closed' }}"
            then:
              - variables:
                  _ce_pairs: "{{ _ce_saved.get('units', []) if _ce_saved else [] }}"
                  _ce_back: >-
                    {%- set ns = namespace(o=[]) -%}
                    {%- for p in _ce_pairs if p is sequence and p | count == 2 and states(p[0]) == 'off' -%}{%- set ns.o = ns.o + [p] -%}{%- endfor -%}
                    {{ ns.o }}
              - variables:
                  _ce_rgo: "{{ (_ce_back | count) > 0 and (_ce_open | count) == 0 and not _ce_sleep }}"
                  _ce_rwhat: >-
                    {%- set ns = namespace(m=[]) -%}
                    {%- for p in _ce_back -%}{%- set ns.m = ns.m + [p[1]] -%}{%- endfor -%}
                    {{ 'the heat' if 'heat' in ns.m else ('the air conditioning' if 'cool' in ns.m else 'the HVAC') }}
              - if: "{{ _ce_rgo }}"
                then:
                  - action: script.zen_dojotools_announce
                    continue_on_error: true
                    data:
                      message: "Everything is closed. {{ _ce_outside }}I sent a question to your phone about turning {{ _ce_rwhat }} back on."
                      urgency: 4
                      caller_token: climate_envelope
                  - action: script.zen_dojotools_postman
                    continue_on_error: true
                    response_variable: _ce_pm2
                    data:
                      mode: resolve_and_dispatch
                      title: "Closed: turn {{ _ce_rwhat }} back on?"
                      message: "Doors and windows are closed. {{ _ce_outside }}Turn {{ _ce_rwhat }} back on?"
                      urgency: 6
                      channel_hint: push
                      response_type: yes_no
                      response_timeout_s: 300
                      ack_owner: climate
                      tag: "pm_climate_on_{{ (now().timestamp() // 60) | int }}"
                      caller_token: climate_envelope_on
                  - variables:
                      _ce_ack2: >-
                        {%- set r = _ce_pm2 if (_ce_pm2 is defined and _ce_pm2 is mapping) else {} -%}
                        {%- set r = r.get('result', r) if r.get('result') is mapping else r -%}
                        {%- set r = r.get('result', r) if r.get('result') is mapping else r -%}
                        {{ (r.get('ack_action', '') or '') | string | lower }}
                  - if: "{{ _ce_ack2 == 'yes' }}"
                    then:
                      - repeat:
                          for_each: "{{ _ce_back }}"
                          sequence:
                            - action: climate.set_hvac_mode
                              continue_on_error: true
                              target:
                                entity_id: "{{ repeat.item[0] }}"
                              data:
                                hvac_mode: "{{ repeat.item[1] }}"
              # While the house sleeps nothing is asked: the Yes was "off until it's
              # closed", so closing it puts each unit back quietly (only units still off;
              # one someone changed is left alone). Postman drops a message sent into the
              # sleep gate, so the courtesy note is saved and sent when the house wakes.
              - variables:
                  _ce_quiet: "{{ (_ce_back | count) > 0 and (_ce_open | count) == 0 and _ce_sleep }}"
              - if: "{{ _ce_quiet }}"
                then:
                  - repeat:
                      for_each: "{{ _ce_back }}"
                      sequence:
                        - action: climate.set_hvac_mode
                          continue_on_error: true
                          target:
                            entity_id: "{{ repeat.item[0] }}"
                          data:
                            hvac_mode: "{{ repeat.item[1] }}"
              # The record is cleared after any answer, or none: it is one offer, not a nag.
              - if: "{{ _ce_saved and (_ce_open | count) == 0 }}"
                then:
                  - action: script.zen_sutra_filecabinet
                    continue_on_error: true
                    data:
                      mode: upsert
                      write_mode: replace
                      key: climate_envelope
                      volume_entity_id: "{{ _ce_cab }}"
                      value: >-
                        {%- set note = ('Overnight, once the doors and windows were closed, I turned ' ~ _ce_rwhat ~ ' back on. It had been off while one was open.') if _ce_quiet else (_ce_drawer.get('pending_note', '') or '') -%}
                        {{ _ce_drawer | combine({'shut_off': {}, 'pending_note': note}) | tojson }}
                  - event: zen_event
                    event_data:
                      event:
                        kind: priority_inject_clear
                        provider_id: climate_envelope
              - variables:
                  result:
                    status: ok
                    mode: envelope_check
                    event: closed
                    result: >-
                      {{ 'restored_quietly' if _ce_quiet else
                         ((('restored' if (_ce_ack2 | default('')) == 'yes' else ('declined' if (_ce_ack2 | default('')) == 'no' else 'no_answer')) if _ce_rgo else
                          ('nothing_to_restore' if (_ce_back | count) == 0 else 'still_open'))) }}
                    restored: "{{ _ce_back if (_ce_quiet or (_ce_ack2 | default('')) == 'yes') else [] }}"
                    caller_token: "{{ _token }}"

          # The house woke (home mode left Night or Night-Late): send the note saved by
          # a quiet overnight restore, then clear it.
          - if: "{{ _ce_event == 'wake' }}"
            then:
              - variables:
                  _ce_note: "{{ _ce_drawer.get('pending_note', '') or '' }}"
              - if: "{{ _ce_note != '' and not _ce_sleep }}"
                then:
                  - action: script.zen_dojotools_postman
                    continue_on_error: true
                    data:
                      mode: resolve_and_dispatch
                      title: "HVAC back on overnight"
                      message: "{{ _ce_note }}"
                      urgency: 3
                      channel_hint: push
                      ack_owner: climate
                      caller_token: climate_envelope_note
                  - action: script.zen_sutra_filecabinet
                    continue_on_error: true
                    data:
                      mode: upsert
                      write_mode: replace
                      key: climate_envelope
                      volume_entity_id: "{{ _ce_cab }}"
                      value: "{{ _ce_drawer | combine({'pending_note': ''}) | tojson }}"
              - variables:
                  result:
                    status: ok
                    mode: envelope_check
                    event: wake
                    result: "{{ ('note_sent' if not _ce_sleep else 'house_asleep') if _ce_note != '' else 'nothing_pending' }}"
                    caller_token: "{{ _token }}"
          - if: "{{ result is not defined }}"
            then:
              - variables:
                  result:
                    status: error
                    mode: envelope_check
                    reason: "guarded: envelope_event must be open, closed or wake"
                    caller_token: "{{ _token }}"

      - if: >-
          {{ result is not defined and
             (states(_entity_id) in ['unknown', 'unavailable'] or _domain not in ['climate', 'fan']) }}
        then:
          - variables:
              result:
                ok: false
                tool: zen_dojotools_climate
                caller_token: "{{ _token }}"
                error: not_found
                input: "{{ raw }}"
                message: >-
                  Entity '{{ raw }}' not found (or not climate.*/fan.*). If
                  you don't know the exact entity_id, pass name as an empty
                  string ("") to resolve the main thermostat/fan by its
                  main_thermostat/main_fan label — see mode: tool_manifest
                  / help for details.

      # ── Identity gate -- any real
      # setter requires climate_control; GET stays open. Runs after entity
      # resolution so target_entity is the real thing, not a raw/empty
      # caller string (same lesson ZenLux's own gate learned earlier
      # today: checking scope against an unresolved target makes deny
      # unenforceable for the common case). ──
      - variables:
          _cc_any_setter: >-
            {{ result is not defined and
               (temperature_raw is not none or low_raw is not none or high_raw is not none
                or hvac_raw is not none or fan_raw is not none or swing_raw is not none
                or preset_raw is not none or humidity_raw is not none or aux_raw is not none
                or power_raw is not none or fanpct_raw is not none or fanpreset_raw is not none
                or fanosc_raw is not none or fandir_raw is not none) }}
      - if: "{{ result is not defined and _cc_any_setter }}"
        then:
          - action: script.zen_dojotools_identity
            response_variable: _cc_id_raw
            continue_on_error: true
            data:
              mode: resolve_caller_identity
              required_cert: zenos.actuation.climate_control
              required_cert_level: 1
              target_entity: "{{ _entity_id }}"
              caller_token: "{{ _token }}"
          - variables:
              _cc_id_fields: >-
                {%- import 'zenos_ai/zen_os_1.jinja' as OS -%}
                {%- set _raw = OS.resolve_identity_fields(_cc_id_raw) -%}
                {{- (_raw | from_json) if _raw is string else _raw -}}
              _cc_policy_status: "{{ _cc_id_fields.policy_status }}"
              _cc_authorized: "{{ _cc_id_fields.authorized }}"
              _cc_cert_level: "{{ _cc_id_fields.cert_level }}"
              _cc_scope_decision: "{{ _cc_id_fields.scope_decision }}"
          - if: "{{ _cc_scope_decision == 'deny' }}"
            then:
              - variables:
                  result:
                    ok: false
                    tool: zen_dojotools_climate
                    caller_token: "{{ _token }}"
                    error: cert_scope_denied
                    entity_id: "{{ _entity_id }}"
                    message: >-
                      zenos.actuation.climate_control cert_scope explicitly denies
                      {{ _entity_id }} -- an admin has scoped this entity out
                      via cert_req_grant. No ack is offered for a denied target;
                      removing the denial requires cert_req_grant cert_scope=
                      [{"entity":"{{ _entity_id }}","acl":"remove"}].
          - if: "{{ result is not defined and (_cc_policy_status != 'allowed' or not _cc_authorized) }}"
            then:
              - variables:
                  result:
                    ok: false
                    tool: zen_dojotools_climate
                    caller_token: "{{ _token }}"
                    error: "{{ 'identity_policy_blocked' if _cc_policy_status != 'allowed' else 'cert_insufficient' }}"
                    detail: >-
                      {%- if _cc_policy_status != 'allowed' -%}
                        resolve_caller_identity did not return an allowed identity -- action denied.
                      {%- else -%}
                        zenos.actuation.climate_control cert level {{ _cc_cert_level }} is below the required minimum (1).
                      {%- endif -%}
                    can_request: "{{ _cc_policy_status == 'allowed' }}"
                    request_via:
                      tool: zen_dojotools_persona_editor
                      mode: cert_req_grant
                      cert_component: zenos.actuation.climate_control
                      cert_level: 1
                      note: "Fires a live household-admin approval push -- see zen_dojotools_identity mode=cert_list for current status."

      # ── Read capabilities ─────────────────────────────────────────────────
      - variables:
          cur_temp: "{{ state_attr(_entity_id, 'current_temperature') }}"
          cur_humidity: "{{ state_attr(_entity_id, 'current_humidity') }}"
          tgt_temp: "{{ state_attr(_entity_id, 'temperature') }}"
          tgt_humidity: "{{ state_attr(_entity_id, 'humidity') }}"
          low_temp: "{{ state_attr(_entity_id, 'target_temp_low') }}"
          high_temp: "{{ state_attr(_entity_id, 'target_temp_high') }}"
          min_temp: "{{ state_attr(_entity_id, 'min_temp') }}"
          max_temp: "{{ state_attr(_entity_id, 'max_temp') }}"
          min_humidity: "{{ state_attr(_entity_id, 'min_humidity') }}"
          max_humidity: "{{ state_attr(_entity_id, 'max_humidity') }}"
          hvac_cur: "{{ state_attr(_entity_id, 'hvac_mode') }}"
          hvac_action: "{{ state_attr(_entity_id, 'hvac_action') }}"
          hvac_modes: "{{ (state_attr(_entity_id, 'hvac_modes') or []) | map(attribute='value') | list if _domain == 'climate' else [] }}"
          fan_cur: "{{ state_attr(_entity_id, 'fan_mode') }}"
          fan_modes: "{{ state_attr(_entity_id, 'fan_modes') or [] if _domain == 'climate' else [] }}"
          swing_cur: "{{ state_attr(_entity_id, 'swing_mode') }}"
          swing_modes: "{{ state_attr(_entity_id, 'swing_modes') or [] }}"
          preset_cur: "{{ state_attr(_entity_id, 'preset_mode') }}"
          preset_modes: "{{ state_attr(_entity_id, 'preset_modes') or [] }}"
          aux_cur: "{{ state_attr(_entity_id, 'aux_heat') }}"
          can_temp: "{{ tgt_temp is not none }}"
          can_range: "{{ low_temp is not none and high_temp is not none }}"
          can_hvac: "{{ hvac_modes | length > 0 }}"
          can_fan: "{{ fan_modes | length > 0 }}"
          can_swing: "{{ swing_modes | length > 0 }}"
          can_preset: "{{ preset_modes | length > 0 }}"
          can_humidity: "{{ min_humidity is not none }}"
          can_aux_heat: "{{ aux_cur is not none }}"
          can_off: "{{ 'off' in hvac_modes }}"
          can_on: "{{ hvac_modes | reject('equalto', 'off') | list | length > 0 }}"
          # ── Fan domain capability bits -- real FanEntityFeature bitmask
          # (SET_SPEED=1, OSCILLATE=2, DIRECTION=4, PRESET_MODE=8). Same
          # fail-closed-on-unsupported-feature philosophy as climate. ──
          fan_features: "{{ state_attr(_entity_id, 'supported_features') | default(0, true) | int(0) if _domain == 'fan' else 0 }}"
          fan_pct_cur: "{{ state_attr(_entity_id, 'percentage') if _domain == 'fan' else none }}"
          fan_osc_cur: "{{ state_attr(_entity_id, 'oscillating') if _domain == 'fan' else none }}"
          fan_dir_cur: "{{ state_attr(_entity_id, 'direction') if _domain == 'fan' else none }}"
          fan_preset_cur: "{{ state_attr(_entity_id, 'preset_mode') if _domain == 'fan' else none }}"
          fan_preset_modes: "{{ state_attr(_entity_id, 'preset_modes') or [] if _domain == 'fan' else [] }}"
      - variables:
          can_fan_speed: "{{ (fan_features | int(0)) | bitwise_and(1) > 0 }}"
          can_fan_oscillate: "{{ (fan_features | int(0)) | bitwise_and(2) > 0 }}"
          can_fan_direction: "{{ (fan_features | int(0)) | bitwise_and(4) > 0 }}"
          can_fan_preset: "{{ (fan_features | int(0)) | bitwise_and(8) > 0 }}"

      # ── mode: set with no setter fields is a real caller mistake ──────────
      - if: >-
          {{ result is not defined and _tm_mode == 'set'
             and temperature_raw is none and low_raw is none and high_raw is none
             and hvac_raw is none and fan_raw is none and swing_raw is none
             and preset_raw is none and humidity_raw is none
             and aux_raw is none and power_raw is none
             and fanpct_raw is none and fanpreset_raw is none
             and fanosc_raw is none and fandir_raw is none }}
        then:
          - variables:
              result:
                ok: false
                tool: zen_dojotools_climate
                caller_token: "{{ _token }}"
                error: missing_setter
                message: "mode: \"set\" requires at least one setter field (temperature/hvac_mode/fan_mode/swing_mode/preset/humidity/aux_heat/power/fan_percentage/fan_preset_mode/fan_oscillate/fan_direction) — omit mode entirely (or use mode: \"read\") if you only meant to read."

      # ── GET mode ──────────────────────────────────────────────────────────
      - if: >-
          {{ result is not defined and
             (_tm_mode == 'read' or get_raw is not none
              or (temperature_raw is none and low_raw is none and high_raw is none
                  and hvac_raw is none and fan_raw is none and swing_raw is none
                  and preset_raw is none and humidity_raw is none
                  and aux_raw is none and power_raw is none
                  and fanpct_raw is none and fanpreset_raw is none
                  and fanosc_raw is none and fandir_raw is none)) }}
        then:
          # ── Topology: area detection ────────────────────────────────────
          - variables:
              _topo_area_id: >-
                {%- if room_raw is not none and room_raw | trim != '' -%}
                  {{ room_raw | trim }}
                {%- else -%}
                  {{ area_id(_entity_id) | default('') }}
                {%- endif -%}

          # ── Topology: open doors/windows + area sensors ─────────────────
          - variables:
              _open_dw: >-
                {%- set _dc_ok = ['door', 'window', 'opening'] -%}
                {%- set ns = namespace(items=[]) -%}
                {%- if _topo_area_id -%}
                  {%- for e in area_entities(_topo_area_id) if e.startswith('binary_sensor.') and state_attr(e, 'device_class') | default('', true) in _dc_ok and is_state(e, 'on') -%}
                    {%- set ns.items = ns.items + [{'entity_id': e, 'device_class': state_attr(e, 'device_class') | default('', true), 'friendly_name': state_attr(e, 'friendly_name') | default(e, true), 'entity_name': (entity_name(e) if entity_name is defined else none), 'device_name': (device_name(e) if device_id(e) else none)}] -%}
                  {%- endfor -%}
                {%- endif -%}
                {{ ns.items }}
              _area_temp_sensors: >-
                {%- set ns = namespace(items=[]) -%}
                {%- if _topo_area_id -%}
                  {%- for e in area_entities(_topo_area_id) if e.startswith('sensor.') and state_attr(e, 'device_class') | default('', true) == 'temperature' -%}
                    {%- set ns.items = ns.items + [{'entity_id': e, 'state': states(e), 'unit': state_attr(e, 'unit_of_measurement') | default('', true)}] -%}
                  {%- endfor -%}
                {%- endif -%}
                {{ ns.items }}
              _area_hum_sensors: >-
                {%- set ns = namespace(items=[]) -%}
                {%- if _topo_area_id -%}
                  {%- for e in area_entities(_topo_area_id) if e.startswith('sensor.') and state_attr(e, 'device_class') | default('', true) == 'humidity' -%}
                    {%- set ns.items = ns.items + [{'entity_id': e, 'state': states(e), 'unit': state_attr(e, 'unit_of_measurement') | default('', true)}] -%}
                  {%- endfor -%}
                {%- endif -%}
                {{ ns.items }}

          # ── Topology: adjacent HVAC bleed via RM portals ────────────────
          - variables:
              # Detect spa_climate label — suppresses HVAC-specific topology for water-temp entities
              _is_spa_climate: "{{ _entity_id in label_entities('spa_climate') }}"
              _hvac_portals: >-
                {%- set _hh_cab = label_entities('Zen Household Cabinet') | select('match', 'sensor\\.') | list | first | default('') -%}
                {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}{%- set _td = CABS.cabinet_drawer_value_mounted(_hh_cab, 'room_topology') | from_json -%}
                {%- set _portals = _td.get(_topo_area_id, {}).get('portals', []) -%}
                {%- set ns = namespace(items=[]) -%}
                {%- for p in _portals if p is mapping and p.get('to') and p.get('to') in _td -%}
                  {%- set _to = p.get('to') -%}
                  {%- set _adj_c = area_entities(_to) | select('match', 'climate\\.') | list | first | default('') -%}
                  {%- if _adj_c -%}
                    {%- set ns.items = ns.items + [{'portal_to': _to, 'portal_normally': p.get('normally', 'closed'), 'portal_type': p.get('type', 'unknown'), 'adjacent_climate': _adj_c, 'adjacent_hvac_mode': states(_adj_c), 'adjacent_current_temp': state_attr(_adj_c, 'current_temperature')}] -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.items }}

          # ── Topology: natural vent advisory (suppressed for spa_water context) ──
          - variables:
              _natural_vent: >-
                {%- if _is_spa_climate %}{{ none }}{%- else -%}
                {%- set _we = states.weather | map(attribute='entity_id') | list | first | default('') -%}
                {%- set _ot_raw = state_attr(_we, 'temperature') if _we else none -%}
                {%- set _ot = _ot_raw | float(0) if _ot_raw is not none else none -%}
                {%- set _sp_raw = tgt_temp -%}
                {%- set _sp = _sp_raw | float(0) if _sp_raw is not none else none -%}
                {%- if _ot is not none and _sp is not none -%}
                  {%- set _delta = (_ot - _sp) | abs -%}
                  {%- if _delta <= 5.0 -%}{%- set _adv = 'viable' -%}
                  {%- elif hvac_cur == 'heat' and _ot > (_sp - 5.0) -%}{%- set _adv = 'heating_assist' -%}
                  {%- elif hvac_cur in ['cool', 'fan_only'] and _ot < (_sp + 5.0) -%}{%- set _adv = 'cooling_assist' -%}
                  {%- else -%}{%- set _adv = 'not_beneficial' -%}{%- endif -%}
                  {{ {'weather_entity': _we, 'outdoor_temp': _ot, 'setpoint': _sp, 'delta_f': _delta | round(1), 'advisory': _adv} }}
                {%- else -%}
                  {{ {'weather_entity': _we if _we else none, 'outdoor_temp': none, 'setpoint': _sp, 'advisory': 'no_outdoor_data'} }}
                {%- endif -%}
                {%- endif -%}

          - variables:
              result:
                ok: true
                tool: zen_dojotools_climate
                caller_token: "{{ _token }}"
                mode: read
                entity_id: "{{ _entity_id }}"
                domain: "{{ _domain }}"
                state:
                  hvac_mode: "{{ hvac_cur }}"
                  hvac_action: "{{ hvac_action }}"
                  current_temperature: "{{ cur_temp }}"
                  temperature: "{{ tgt_temp }}"
                  target_low: "{{ low_temp }}"
                  target_high: "{{ high_temp }}"
                  fan_mode: "{{ fan_cur }}"
                  swing_mode: "{{ swing_cur }}"
                  preset_mode: "{{ preset_cur }}"
                  current_humidity: "{{ cur_humidity }}"
                  target_humidity: "{{ tgt_humidity }}"
                  aux_heat: "{{ aux_cur }}"
                  fan_percentage: "{{ fan_pct_cur }}"
                  fan_preset_mode: "{{ fan_preset_cur }}"
                  fan_oscillating: "{{ fan_osc_cur }}"
                  fan_direction: "{{ fan_dir_cur }}"
                capabilities:
                  hvac_modes: "{{ hvac_modes }}"
                  fan_modes: "{{ fan_modes }}"
                  swing_modes: "{{ swing_modes }}"
                  preset_modes: "{{ preset_modes }}"
                  min_temp: "{{ min_temp }}"
                  max_temp: "{{ max_temp }}"
                  min_humidity: "{{ min_humidity }}"
                  max_humidity: "{{ max_humidity }}"
                  can_temp: "{{ can_temp }}"
                  can_range: "{{ can_range }}"
                  can_hvac: "{{ can_hvac }}"
                  can_fan: "{{ can_fan }}"
                  can_swing: "{{ can_swing }}"
                  can_preset: "{{ can_preset }}"
                  can_humidity: "{{ can_humidity }}"
                  can_aux_heat: "{{ can_aux_heat }}"
                  can_on: "{{ can_on }}"
                  can_off: "{{ can_off }}"
                  fan_preset_modes: "{{ fan_preset_modes }}"
                  can_fan_speed: "{{ can_fan_speed }}"
                  can_fan_oscillate: "{{ can_fan_oscillate }}"
                  can_fan_direction: "{{ can_fan_direction }}"
                  can_fan_preset: "{{ can_fan_preset }}"
                topology_context:
                  area_id: "{{ _topo_area_id }}"
                  open_doors_windows: "{{ _open_dw }}"
                  area_temp_sensors: "{{ _area_temp_sensors }}"
                  area_humidity_sensors: "{{ _area_hum_sensors }}"
                  hvac_bleed_portals: "{{ _hvac_portals }}"
                  natural_vent: "{{ _natural_vent }}"
                  context: "{{ 'spa_water' if _is_spa_climate else none }}"
                  spa_master: "{{ 'zen_dojotools_spamaster — use for all spa intents including water temperature' if _is_spa_climate else none }}"

      # ── Power (climate: via hvac_mode; fan: via fan.turn_on/turn_off) ──────
      - if: "{{ result is not defined and power_raw is not none and _domain == 'climate' }}"
        then:
          - if: "{{ power_raw | lower == 'off' and not can_off }}"
            then:
              - variables:
                  result: {ok: false, tool: zen_dojotools_climate, caller_token: "{{ _token }}", error: unsupported_feature, feature: power_off}
          - if: "{{ result is not defined and power_raw | lower == 'on' and not can_on }}"
            then:
              - variables:
                  result: {ok: false, tool: zen_dojotools_climate, caller_token: "{{ _token }}", error: unsupported_feature, feature: power_on}
          - if: "{{ result is not defined }}"
            then:
              - action: climate.set_hvac_mode
                target:
                  entity_id: "{{ _entity_id }}"
                data:
                  hvac_mode: >-
                    {{ 'off' if power_raw | lower == 'off'
                       else (hvac_modes | reject('equalto', 'off') | first) }}
              - variables:
                  r_power_status: ok
      - if: "{{ result is not defined and power_raw is not none and _domain == 'fan' }}"
        then:
          - action: "{{ 'fan.turn_off' if power_raw | lower == 'off' else 'fan.turn_on' }}"
            target:
              entity_id: "{{ _entity_id }}"
          - variables:
              r_power_status: ok

      # ── HVAC mode (climate only) ─────────────────────────────────────────
      - if: "{{ result is not defined and hvac_raw is not none }}"
        then:
          - if: "{{ _domain != 'climate' or hvac_raw not in hvac_modes }}"
            then:
              - variables:
                  result: {ok: false, tool: zen_dojotools_climate, caller_token: "{{ _token }}", error: invalid_hvac_mode, requested: "{{ hvac_raw }}", supported: "{{ hvac_modes }}"}
          - if: "{{ result is not defined }}"
            then:
              - action: climate.set_hvac_mode
                target:
                  entity_id: "{{ _entity_id }}"
                data:
                  hvac_mode: "{{ hvac_raw }}"
              - variables:
                  r_hvac_status: ok

      # ── Fan mode (climate's own internal fan setting) ───────────────────
      - if: "{{ result is not defined and fan_raw is not none }}"
        then:
          - if: "{{ _domain != 'climate' or not can_fan or fan_raw not in fan_modes }}"
            then:
              - variables:
                  result: {ok: false, tool: zen_dojotools_climate, caller_token: "{{ _token }}", error: invalid_fan_mode, requested: "{{ fan_raw }}", supported: "{{ fan_modes }}"}
          - if: "{{ result is not defined }}"
            then:
              - action: climate.set_fan_mode
                target:
                  entity_id: "{{ _entity_id }}"
                data:
                  fan_mode: "{{ fan_raw }}"
              - variables:
                  r_fan_status: ok

      # ── Swing mode (climate only) ────────────────────────────────────────
      - if: "{{ result is not defined and swing_raw is not none }}"
        then:
          - if: "{{ _domain != 'climate' or not can_swing or swing_raw not in swing_modes }}"
            then:
              - variables:
                  result: {ok: false, tool: zen_dojotools_climate, caller_token: "{{ _token }}", error: invalid_swing_mode, requested: "{{ swing_raw }}", supported: "{{ swing_modes }}"}
          - if: "{{ result is not defined }}"
            then:
              - action: climate.set_swing_mode
                target:
                  entity_id: "{{ _entity_id }}"
                data:
                  swing_mode: "{{ swing_raw }}"
              - variables:
                  r_swing_status: ok

      # ── Preset (climate only — fan preset is fan_preset_mode below) ─────
      - if: "{{ result is not defined and preset_raw is not none }}"
        then:
          - if: "{{ _domain != 'climate' or not can_preset or preset_raw not in preset_modes }}"
            then:
              - variables:
                  result: {ok: false, tool: zen_dojotools_climate, caller_token: "{{ _token }}", error: invalid_preset, requested: "{{ preset_raw }}", supported: "{{ preset_modes }}"}
          - if: "{{ result is not defined }}"
            then:
              - action: climate.set_preset_mode
                target:
                  entity_id: "{{ _entity_id }}"
                data:
                  preset_mode: "{{ preset_raw }}"
              - variables:
                  r_preset_status: ok

      # ── Temperature (single, climate only) ───────────────────────────────
      - if: "{{ result is not defined and temperature_raw is not none }}"
        then:
          - if: "{{ _domain != 'climate' or not can_temp }}"
            then:
              - variables:
                  result: {ok: false, tool: zen_dojotools_climate, caller_token: "{{ _token }}", error: unsupported_feature, feature: temperature}
          - if: "{{ result is not defined }}"
            then:
              - action: climate.set_temperature
                target:
                  entity_id: "{{ _entity_id }}"
                data:
                  temperature: "{{ temperature_raw | float }}"
              - variables:
                  r_temp_status: ok

      # ── Temperature range (climate only) ─────────────────────────────────
      - if: "{{ result is not defined and low_raw is not none and high_raw is not none }}"
        then:
          - if: "{{ _domain != 'climate' or not can_range }}"
            then:
              - variables:
                  result: {ok: false, tool: zen_dojotools_climate, caller_token: "{{ _token }}", error: unsupported_feature, feature: temperature_range}
          - if: "{{ result is not defined }}"
            then:
              - action: climate.set_temperature
                target:
                  entity_id: "{{ _entity_id }}"
                data:
                  target_temp_low: "{{ low_raw | float }}"
                  target_temp_high: "{{ high_raw | float }}"
              - variables:
                  r_range_status: ok

      # ── Humidity (climate only) ──────────────────────────────────────────
      - if: "{{ result is not defined and humidity_raw is not none }}"
        then:
          - if: "{{ _domain != 'climate' or not can_humidity }}"
            then:
              - variables:
                  result: {ok: false, tool: zen_dojotools_climate, caller_token: "{{ _token }}", error: unsupported_feature, feature: humidity}
          - if: "{{ result is not defined }}"
            then:
              - action: climate.set_humidity
                target:
                  entity_id: "{{ _entity_id }}"
                data:
                  humidity: "{{ humidity_raw | int }}"
              - variables:
                  r_humidity_status: ok

      # ── Aux heat (climate only, always not_implemented — HA removed the service) ──
      - if: "{{ result is not defined and aux_raw is not none }}"
        then:
          - if: "{{ _domain != 'climate' or not can_aux_heat }}"
            then:
              - variables:
                  result: {ok: false, tool: zen_dojotools_climate, caller_token: "{{ _token }}", error: unsupported_feature, feature: aux_heat}
          - if: "{{ result is not defined }}"
            then:
              - variables:
                  result:
                    ok: false
                    tool: zen_dojotools_climate
                    caller_token: "{{ _token }}"
                    error: not_implemented
                    feature: aux_heat
                    message: >-
                      climate.set_aux_heat was removed from Home Assistant. Aux heat control
                      is no longer available as a standalone service. Check your thermostat
                      integration's documentation for platform-specific support.

      # ── Fan percentage (fan only, requires SET_SPEED) ────────────────────
      - if: "{{ result is not defined and fanpct_raw is not none }}"
        then:
          - if: "{{ _domain != 'fan' or not can_fan_speed }}"
            then:
              - variables:
                  result: {ok: false, tool: zen_dojotools_climate, caller_token: "{{ _token }}", error: unsupported_feature, feature: fan_percentage}
          - if: "{{ result is not defined }}"
            then:
              - action: fan.set_percentage
                target:
                  entity_id: "{{ _entity_id }}"
                data:
                  percentage: "{{ fanpct_raw | int }}"
              - variables:
                  r_fanpct_status: ok

      # ── Fan preset mode (fan only, requires PRESET_MODE) ─────────────────
      - if: "{{ result is not defined and fanpreset_raw is not none }}"
        then:
          - if: "{{ _domain != 'fan' or not can_fan_preset or fanpreset_raw not in fan_preset_modes }}"
            then:
              - variables:
                  result: {ok: false, tool: zen_dojotools_climate, caller_token: "{{ _token }}", error: invalid_fan_preset, requested: "{{ fanpreset_raw }}", supported: "{{ fan_preset_modes }}"}
          - if: "{{ result is not defined }}"
            then:
              - action: fan.set_preset_mode
                target:
                  entity_id: "{{ _entity_id }}"
                data:
                  preset_mode: "{{ fanpreset_raw }}"
              - variables:
                  r_fanpreset_status: ok

      # ── Fan oscillate (fan only, requires OSCILLATE) ─────────────────────
      - if: "{{ result is not defined and fanosc_raw is not none }}"
        then:
          - if: "{{ _domain != 'fan' or not can_fan_oscillate }}"
            then:
              - variables:
                  result: {ok: false, tool: zen_dojotools_climate, caller_token: "{{ _token }}", error: unsupported_feature, feature: fan_oscillate}
          - if: "{{ result is not defined }}"
            then:
              - action: fan.oscillate
                target:
                  entity_id: "{{ _entity_id }}"
                data:
                  oscillating: "{{ fanosc_raw | lower in ['on', 'true', 'yes', '1'] }}"
              - variables:
                  r_fanosc_status: ok

      # ── Fan direction (fan only, requires DIRECTION) ─────────────────────
      - if: "{{ result is not defined and fandir_raw is not none }}"
        then:
          - if: "{{ _domain != 'fan' or not can_fan_direction or fandir_raw | lower not in ['forward', 'reverse'] }}"
            then:
              - variables:
                  result: {ok: false, tool: zen_dojotools_climate, caller_token: "{{ _token }}", error: invalid_fan_direction, requested: "{{ fandir_raw }}"}
          - if: "{{ result is not defined }}"
            then:
              - action: fan.set_direction
                target:
                  entity_id: "{{ _entity_id }}"
                data:
                  direction: "{{ fandir_raw | lower }}"
              - variables:
                  r_fandir_status: ok

      # ── Response (single SESE exit) ──────────────────────────────────────
      - if: "{{ result is not defined }}"
        then:
          - variables:
              result:
                ok: true
                tool: zen_dojotools_climate
                caller_token: "{{ _token }}"
                mode: set
                entity_id: "{{ _entity_id }}"
                domain: "{{ _domain }}"
                applied:
                  temperature: "{{ r_temp_status }}"
                  range: "{{ r_range_status }}"
                  hvac_mode: "{{ r_hvac_status }}"
                  fan_mode: "{{ r_fan_status }}"
                  swing_mode: "{{ r_swing_status }}"
                  preset: "{{ r_preset_status }}"
                  humidity: "{{ r_humidity_status }}"
                  aux_heat: "{{ r_aux_status }}"
                  power: "{{ r_power_status }}"
                  fan_percentage: "{{ r_fanpct_status }}"
                  fan_preset_mode: "{{ r_fanpreset_status }}"
                  fan_oscillate: "{{ r_fanosc_status }}"
                  fan_direction: "{{ r_fandir_status }}"
                capabilities:
                  hvac_modes: "{{ hvac_modes }}"
                  fan_modes: "{{ fan_modes }}"
                  swing_modes: "{{ swing_modes }}"
                  preset_modes: "{{ preset_modes }}"
      - variables:
          result: >-
            {%- import 'zenos_ai/zen_os_1.jinja' as OS -%}
            {{- OS.envelope(
              status='error' if (result is mapping and (result.get('ok') == false or result.get('status') == 'error')) else 'success',
              mode=_tm_mode,
              result=result,
              tool='zen_dojotools_climate',
              caller_token=_token
            ) | from_json -}}
      - stop: set
        response_variable: result

###############################################################################
# Zen Climate Envelope Watcher
# Calls zen_dojotools_climate mode=envelope_check when an exterior door, window or
# opening (label exterior) has been open five minutes, and again when every one has
# been closed two minutes. The script does nothing while envelope_offer_enabled is
# off (the default), so this costs nothing until the household turns it on.
# Queued, not single: the closed edge must still be handled after an open question
# that is waiting up to five minutes for an answer.
###############################################################################
automation:
  - id: zen_climate_envelope_watcher
    alias: Zen Climate Envelope Watcher
    description: >-
      Offers to turn the HVAC off when an exterior door or window (label exterior)
      stays open five minutes while heating or cooling, and to turn it back on once
      everything is closed. Off unless zen_dojotools_climate mode=envelope
      envelope_offer_enabled=true.
    mode: queued
    max: 3
    triggers:
      # expand(label_entities(...)) is used, not states() over a label result: that
      # chain does not track reliably in a template trigger. It watches the sensors
      # labeled exterior when the automation starts: a sensor labeled later is seen after
      # the watcher is turned off and on, or a restart. A reload is not enough (it skips
      # an automation whose config did not change). No now() tick on purpose (a scan
      # every minute).
      - trigger: template
        value_template: >-
          {%- set ns = namespace(n=0) -%}
          {%- for s in expand(label_entities('exterior')) if s.domain == 'binary_sensor' and s.state == 'on' and s.attributes.get('device_class') in ['door', 'window', 'opening', 'garage_door'] -%}{%- set ns.n = ns.n + 1 -%}{%- endfor -%}
          {{ ns.n > 0 }}
        for: "00:05:00"
        id: open
      - trigger: template
        value_template: >-
          {%- set ns = namespace(n=0, all=0) -%}
          {%- for s in expand(label_entities('exterior')) if s.domain == 'binary_sensor' and s.attributes.get('device_class') in ['door', 'window', 'opening', 'garage_door'] -%}
            {%- set ns.all = ns.all + 1 -%}{%- if s.state == 'on' -%}{%- set ns.n = ns.n + 1 -%}{%- endif -%}
          {%- endfor -%}
          {{ ns.all > 0 and ns.n == 0 }}
        for: "00:02:00"
        id: closed
      # The house woke: send the note saved by a quiet overnight restore. Two edges, the
      # same rule as the sleep gate: the home mode leaving Night or Night-Late, and quiet
      # hours ending. zen_home_mode is the singleton global sensor (same precedent as
      # the Security Auto-Arm Watcher).
      - trigger: state
        entity_id: sensor.zen_home_mode
        from:
        - Night
        - Night-Late
        not_to:
        - Night
        - Night-Late
        - unknown
        - unavailable
        id: wake
      - trigger: template
        value_template: >-
          {{ is_state(label_entities('zen_quiet_hours') | select('match', 'binary_sensor\\.') | list | first | default('none', true), 'off') }}
        id: wake
    conditions: []
    actions:
      - action: script.zen_dojotools_climate
        continue_on_error: true
        data:
          mode: envelope_check
          envelope_event: "{{ trigger.id }}"
          caller_token: climate_envelope_watcher
