###############################################################################
# zen_dojotools_lights v2.6.0 (codename: ZenLux)
# Room-aware lighting intent resolver with memory + label-driven topology
#
# 2.6.0 (2026-08-30, Vee + household, morning after Spook 5.2 dropped) —
#   brightness_set/color_temp_set/rgb_set gained adjust_only=true (Spook
#   v5.2.0+): routes through Spook's own light.set_brightness/
#   light.set_color_temperature/light.set_color instead of light.turn_on,
#   so adjusting a room leaves lights
#   that are deliberately off alone and steps group members from their own
#   level instead of flattening to an average. Default false — today's
#   force-on behavior is completely unchanged unless a caller opts in. Two
#   brand-new modes, both Spook-only with no safe core fallback:
#   brightness_increase/brightness_decrease (step_pct=, ZenLux never had a
#   relative dim mode before this) and effect_set (effect= — confirmed live
#   against the hot tub's own color-wheel light channel, which already
#   carries a real effect_list + EFFECT feature flag, no extra wiring
#   needed). All three gate cleanly via the same has_service capability
#   probe zen_health_report/ectoplasm already use for Spook 5.1 features —
#   never a raw "unknown action" error on older Spook, always a clean
#   spook_version_required status with nothing changed.
#
# 2.0.0-2.2.0 (2026-08-16) — SESE conversion (all 21 modes now live in one
#   choose: block, single envelope()-wrapped exit, matching locks/covers/
#   security_manager's shape) plus real switch.* write support that never
#   existed before (mode=toggle, mode=switch_set — both, plus the new
#   switch-domain room/role resolution chain, are gated by the SAME
#   room_control_manager+hold guard and RM Hold hard-block every other
#   write mode has). Tool-manifest version numbering restarted from 1.0.0
#   at the start of this rewrite -- the "5.2.0" below is the last version
#   under the OLD numbering scheme, kept for history.
#
# 5.2.0 (2026-08-06, design note: "respect rm and use its
#   scenes") — two additions:
#   1. room_control_manager + hold guard on all write-taking modes (scene_set/
#      brightness_set/color_temp_set/rgb_set/bleed_set/prefs_apply): reads
#      the SAME room_control_manager select AND hold-labeled entities room_state.
#      yaml's cascade uses; blocks the action while Paused/Automation/
#      Cleaning is active OR a hold entity (e.g. a door) is open,
#      force=true bypasses for an explicit human override.
#   2. mode=reflex_sync — fires whatever zen_reflex_dispatch.yaml Stage 2
#      would resolve for the room's CURRENT v3 state right now, by calling
#      zen_dojotools_room_manager mode=reflex_wire and reading its
#      wired_matrix (not a re-derivation of the resolution logic — that
#      already exists in two places and has drifted before). NOT guarded by
#      the room_control_manager check — firing the override's OWN scene (scene_
#      paused/scene_automation/scene_cleaning) while that override is active
#      is compliant by definition, not a violation of it.
#
# ── LABEL TAXONOMY ──────────────────────────────────────────────────────────
#
# HARDWARE ROLE — zen_lm_* (tool-owned, smash-rebuild via mode=setup)
#   zen_lm_main       — Primary ambient/overhead. Top of resolution chain.
#   zen_lm_accent     — Accent/decorative: LED strips, bias lighting, uplights.
#   zen_lm_task       — Task lighting: under-cabinet, desk lamp, reading.
#   zen_lm_night      — Night/safety lighting. Low-level, always reachable.
#   zen_lm_outdoor    — Exterior/perimeter: porch, pathway, security wash.
#   zen_lm_dusk_dawn  — Photosensor/auto-managed. Tool warns before override.
#   zen_lm_group      — Light group entity. Single command surface for a room.
#   zen_lm_scene      — HA scene entity. Activating sets a whole-room look.
#
# LEGACY FALLBACK (Option B — resolved when zen_lm_* not present)
#   lighting / main_lighting  → zen_lm_main
#   accent_lighting           → zen_lm_accent
#   lights_task               → zen_lm_task
#   night                     → zen_lm_night
#   lights_security           → zen_lm_outdoor
#   light_group               → zen_lm_group
#
# CAPABILITY DISCOVERY (runtime — not labeled)
#   supported_color_modes attr — 'rgb','hs','rgbw','rgbww','xy','color_temp'
#   effect_list length > 20   — WLED heuristic (WLED ships 100+ effects)
#
# PRIORITY
#   primary — Wins tiebreaks within a role slot. Tag the group entity or
#             preferred individual with 'primary' to guarantee it resolves first.
#
# ── PREFS STORAGE ────────────────────────────────────────────────────────────
#   Household cabinet. Key: light_prefs_{room_slug}
#   Value: { context: { target_role, brightness, color_temp_k, rgb_color,
#                       transition, scene_entity }, default_role: zen_lm_* }
#
# ── SETUP FLOW ───────────────────────────────────────────────────────────────
#   1. mode=setup          — create all zen_lm_* label definitions in HA
#   2. mode=discover       — map every room, flag unlabeled + setup_advisory
#   3. mode=label_suggest room=X — propose zen_lm_* assignments
#   4. Apply via zen_dojotools_labels
#   5. mode=discover       — verify slots resolve, advisory gone
#   6. Optional: prune legacy labels via zen_dojotools_labels
###############################################################################

script:
  zen_dojotools_lights:
    alias: Zen DojoTools Lights
    description: >-
      Act now: brightness_set/scene_set/rgb_set room=X work immediately — no
      setup needed, legacy labels resolve the right entity automatically. Get
      smarter: discover room=X maps every light, scene, and capability —
      next_step always tells you what to explore next. scene_list search=room
      surfaces all scenes including untagged, with entities_affected. Remember
      it: prefs_set/prefs_apply give a room lighting memory (movie, work,
      sleep). Respects RM: write modes are blocked while the room's
      room_control_manager is Paused/Automation/Cleaning (force=true overrides).
      mode=reflex_sync fires whatever RM's own REFLEX cascade currently
      resolves for the room instead of an ad-hoc intent. mode=toggle and
      mode=switch_set (state=on/off/toggle) give real switch.* write
      control, room=/target_role= resolution included (light.*/light-group
      writes already worked via the modes above; switch.* had none until
      now). mode=help for the full map.
    icon: mdi:lightbulb-group
    mode: queued
    max: 3

    fields:
      mode:
        name: Mode
        description: >-
          Act now — brightness_set/scene_set/rgb_set/color_temp_set work
          immediately, no setup needed (blocked while room_control_manager is
          Paused/Automation/Cleaning — force=true to override). discover
          room=X maps a room; next_step guides exploration. scene_list
          search=X finds scenes by name. prefs_set/apply = lighting memory.
          setup+label_suggest assign zen_lm_* roles. resolve_debug traces
          entity selection. reflex_sync fires whatever RM's REFLEX cascade
          currently resolves for the room's live v3 state (via
          zen_dojotools_room_manager mode=reflex_wire) — not guarded, since
          it's already following RM's own resolution including any override.
          toggle entity_id=X — domain-agnostic (homeassistant.toggle),
          works on light.* or switch.*. switch_set entity_id=X (or room=
          [+ target_role=]) switch_state=on|off|toggle — explicit switch.*
          write control, same room/role/'primary'-tiebreak resolution as
          the light modes (no fixed role-label taxonomy for switches
          though — target_role= is just a plain label filter).
          brightness_set/color_temp_set/rgb_set accept adjust_only=true
          (Spook v5.2.0+) to adjust only lights already on instead of the
          default force-on behavior — see the adjust_only field for detail.
          brightness_increase/brightness_decrease (step_pct=) and effect_set
          (effect=) are new, Spook v5.2.0+ only modes with no core fallback.
        selector:
          select:
            options:
              - discover
              - inspect
              - setup
              - label_suggest
              - resolve_debug
              - bleed_set
              - scene_set
              - brightness_set
              - color_temp_set
              - rgb_set
              - prefs_get
              - prefs_set
              - prefs_apply
              - room_default_get
              - room_default_set
              - room_state
              - scene_list
              - auto_label
              - prefs_sweep
              - reflex_sync
              - scene_stage
              - toggle
              - switch_set
              - brightness_increase
              - brightness_decrease
              - effect_set
              - nightlight_scene_sync
              - tool_manifest
              - help

      entity_id:
        name: Entity ID
        description: "Explicit override. Omit when room= provided — auto-resolved (write modes). Required for mode=inspect — light.* or switch.*."
        selector:
          entity:
            domain: [light, switch]

      room:
        name: Room
        description: "Target area. Omit for whole-home discover."
        selector:
          area:

      target_role:
        name: Target Role
        description: >-
          zen_lm_main / zen_lm_accent / zen_lm_task / zen_lm_night /
          zen_lm_outdoor / zen_lm_dusk_dawn / zen_lm_group. Omit for
          auto-chain (group → main → legacy → first_in_room).
        selector:
          text:

      intent:
        name: Scene Intent
        description: >-
          Named scene context. movie=dim warm accent. sleep=near-off warm.
          morning=cool white ramp. work=task cool white. away=off. party=rgb.
          Maps to role + brightness + color_temp defaults; overridden by prefs.
        selector:
          select:
            options:
              - movie
              - sleep
              - morning
              - work
              - away
              - party

      brightness:
        name: Brightness
        description: "0–100 percent. Required for brightness_set. Optional for prefs_set."
        selector:
          number:
            min: 0
            max: 100

      adjust_only:
        name: Adjust Only (Spook v5.2.0+)
        description: >-
          For brightness_set/color_temp_set/rgb_set. Default false — today's
          behavior, unchanged: light.turn_on, which also turns ON any light
          that's currently off (or a whole group, flattened to one value).
          Pass true to instead route through Spook's real light.set_brightness/
          light.set_color_temperature/light.set_color — adjusts only lights
          already on, leaves off lights off, steps group members from their
          own level rather than averaging. Requires Spook v5.2.0+; returns a
          clean spook_version_required error (nothing changed) if unavailable
          — never silently falls back to the force-on behavior you explicitly
          asked to avoid.
        default: false
        selector:
          boolean:

      step_pct:
        name: Brightness Step
        description: "1–100 percent. Required for brightness_increase/brightness_decrease (Spook v5.2.0+ only — no safe core fallback, core's own brightness_step_pct has the same off-light/group-flattening bug Spook fixed)."
        selector:
          number:
            min: 1
            max: 100

      effect:
        name: Effect
        description: "Effect name, e.g. 'Colorloop', 'Cycle Slow'. Required for effect_set (Spook v5.2.0+ only). Names differ per manufacturer/device — check the target entity's effect_list first (mode=inspect)."
        selector:
          text:

      color_temp_k:
        name: Color Temperature (Kelvin)
        description: "2700=warm, 3000=soft white, 4000=neutral, 5000=daylight, 6500=cool."
        selector:
          number:
            min: 2700
            max: 6500

      rgb_color:
        name: RGB Color
        description: "Comma-separated R,G,B (0-255). Example: '255,100,0'."
        selector:
          text:

      scene:
        name: Scene Entity
        description: "scene entity_id to activate. Use scene_list search=room to discover options."
        selector:
          entity:
            domain: scene

      switch_state:
        name: Switch State
        description: "For mode=switch_set, with entity_id= (or room=, optionally + target_role=) required. on/off sets the switch explicitly. toggle flips its current state (homeassistant.toggle)."
        selector:
          select:
            options:
              - "on"
              - "off"
              - toggle

      scene_phase:
        name: Scene Stage Phase
        description: "For mode=scene_stage, with room= required. before=snapshot current state as an undo reference. after=snapshot the STAGED target look + returns hand-off instructions. confirm=attempt to auto-detect and tag the real scene the human just saved."
        selector:
          select:
            options:
              - before
              - after
              - confirm

      scene_tier:
        name: Scene Stage Tier
        description: "For mode=scene_stage. Which REFLEX cascade tier this scene targets (vacant/occupied/engaged/asleep/hold/paused/automation/cleaning/emergency) — applies the scene_<tier> label on scene_phase=confirm so it's immediately REFLEX-wireable. Optional but recommended."
        selector:
          text:

      scene_daypart:
        name: Scene Stage Daypart
        description: "For mode=scene_stage scene_phase=confirm. Optional home_mode daypart label (home_wake/home_morning/home/home_evening/night/night_late) to also tag, for a mode-specific scene rather than an any-mode fallback."
        selector:
          text:

      scene_name_hint:
        name: Scene Stage Name Hint
        description: "For mode=scene_stage scene_phase=after. Suggested real scene name, echoed back in the hand-off instructions for the human to use (or ignore) when saving for real."
        selector:
          text:

      transition:
        name: Transition (seconds)
        description: "Light transition duration. Default 1."
        default: 1
        selector:
          number:
            min: 0
            max: 30

      home_context:
        name: Home Context
        description: >-
          Mode this pref applies to: morning, work, evening, movie, sleep,
          away, party, etc. Required for prefs_set. Omit on prefs_apply —
          uses room RM state (Engaged→work, Asleep→sleep, Away→away) or
          zen_home_mode as fallback. Optional on prefs_sweep — defaults to
          zen_home_mode.
        selector:
          text:

      bleed_threshold:
        name: Bleed Threshold
        description: "Min light_tx to include adjacent room in bleed_set propagation. Default 0.20. 0.65=open passages only, 0.20=includes glass doors, 0.10=all non-opaque."
        selector:
          number:
            min: 0.05
            max: 1.0
            step: 0.05
            mode: box

      sync_shades:
        name: Sync Shades
        description: "bleed_set + intent: also calls ZenShade scene_set for the same room. movie/work/morning/sleep map directly; party→natural, away→sleep."
        default: false
        selector:
          boolean:

      dry_run:
        name: Dry Run
        description: "Preview without touching hardware. Returns would_set values."
        default: false
        selector:
          boolean:

      caller_token:
        name: Caller Token
        description: "Opaque audit token echoed in all responses."
        selector:
          text:

      search:
        name: Search
        description: "Substring match on scene name or entity_id. Used with scene_list."
        selector:
          text:

      force:
        name: Force
        description: >-
          Bypass the room_control_manager guard (Paused/Automation/Cleaning override
          active for this room). Only the write-taking modes (scene_set,
          brightness_set, color_temp_set, rgb_set, bleed_set, prefs_apply,
          brightness_increase, brightness_decrease, effect_set)
          are guarded — pass true for an explicit human override. Default
          false.
        default: false
        selector:
          boolean:

    sequence:

      - variables:
          _tm_check: "{{ mode | default('') | lower }}"
      - choose:
        - conditions: "{{ _tm_check == 'tool_manifest' }}"
          sequence:
          - variables:
              result: >-
                {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
                {%- set _tm = MF.tool_manifest(
                    tool='zen_dojotools_lights',
                    display_name='Lights',
                    tier='dojotools',
                    version='2.6.0',
                    health={'configured': true, 'status': 'ok', 'notes': []},
                    required_labels=['dojotools'],
                    optional_labels=['light'],
                    consumes=['entity_or_room'],
                    returns=['light_state'],
                    icon='mdi:lightbulb',
                    color='yellow',
                    stripe=3,
                    impact='soft',
                    mcp_exposed=true,

                    caller_token=caller_token | default('')
                ) | from_json -%}
                {{- _tm | combine({
                    'certs_required': [{
                      'cert': 'lighting_control',
                      'display_name': 'Basic Lighting Control',
                      'description': 'Brightness/color/scene actuation via zen_dojotools_lights (brightness_set/color_temp_set/rgb_set/scene_set/bleed_set/prefs_apply). Cert-only, same shape as locks/covers own SAFE tier -- no live-ack requirement yet, since no write action here has the same physical-exposure shape as an exterior unlock/barrier-open. cert_scope is an allow-list (same semantic as locks), resolved and carried on every identity check, ready for the moment a real ack-requiring action lands here (e.g. scene_stage confirm, or a future switch-toggle mode) -- for scene/lamp/switch targets specifically.',
                      'max_level': 4,
                      'gates': ['mode=brightness_set/color_temp_set/rgb_set/scene_set/bleed_set/prefs_apply (cert only)'],
                      'live_ack_required_for': [],
                      'grant_via': "persona_editor mode=cert_grant cert_component=lighting_control (or zen_dojotools_identity mode=cert_list to see current status)"
                    }, {
                      'cert': 'scene_handling',
                      'display_name': 'Basic Scene Handling',
                      'description': 'Scene creation/staging via zen_dojotools_lights mode=scene_stage (relocated here 2026-08-16 from zen_dojotools_room_manager, RBAC locality -- room_manager now delegates to this tool instead of owning the logic directly). Gated at the action level -- scene_stage snapshots/restores light/cover/climate/media_player/switch/fan/humidifier state for a whole room in one call, so it is its own gated surface regardless of which of those domains'' own certs the caller separately holds.',
                      'max_level': 4,
                      'gates': ['mode=scene_stage (cert only)'],
                      'live_ack_required_for': [],
                      'grant_via': "persona_editor mode=cert_grant cert_component=scene_handling (or zen_dojotools_identity mode=cert_list to see current status)"
                    }]
                  }) -}}
          - stop: tool_manifest
            response_variable: result
      # ── 0a. Resolve inputs ────────────────────────────────────────────────
      - variables:
          _mode:         "{{ mode | default('discover') | string | trim | lower }}"
          _entity_id:    "{{ entity_id | default('', true) | string | trim }}"
          _room_raw:     "{{ room | default('', true) | string | trim }}"
          _room_slug:    "{{ _room_raw | lower | replace(' ', '_') }}"
          _target_role:  "{{ target_role | default('', true) | string | trim | lower }}"
          _intent:       "{{ intent | default('', true) | string | trim | lower }}"
          _brightness:   "{{ brightness | default(-1) | int(-1) }}"
          _color_temp_k: "{{ color_temp_k | default(-1) | int(-1) }}"
          # REAL BUG (found live 2026-08-16, household mid-session), TWO
          # LAYERS DEEP: naive `| string | trim` on rgb_color silently
          # mis-coerced. First fix attempt stored an intermediate
          # bare-comma string (e.g. "75,20,140", no brackets/quotes) into
          # a named `variables:` key -- but HA's NativeEnvironment
          # re-coerces the OUTPUT of ANY stored template value that
          # RENDERS in a shape matching a Python literal, independent of
          # what internal Jinja logic produced it. A bare comma-separated
          # string is exactly what Python's literal_eval parses as a
          # TUPLE, so the "fixed" intermediate variable got silently
          # turned back into a tuple on storage -- same failure, one hop
          # later. Real fix: never store an intermediate bare-comma
          # string in a named variable at all. _rgb_parts is computed in
          # ONE inline expression (local `set`, not a separate `variables:`
          # key) straight from rgb_color, branching on native-sequence vs
          # string BEFORE any split/membership check -- only the FINAL
          # bracketed-list output (which does NOT resemble a bare tuple
          # literal) ever gets assigned to an HA variable, so it coerces
          # back into a real list, not a tuple-membership trap. Same
          # general class of "HA auto-coerces rendered literals to native
          # Python types" bug that's recurred multiple times elsewhere in
          # this codebase -- this time the coercion applies recursively to
          # every intermediate hop, not just the first.
          _rgb_parts: >-
            {%- set _rc = rgb_color if rgb_color is defined else none -%}
            {%- if _rc is none -%}
              {{ [] }}
            {%- elif _rc is string -%}
              {%- set ns = namespace(list=[]) -%}
              {%- for p in (_rc.split(',') if ',' in _rc else []) -%}
                {%- set ns.list = ns.list + [p | trim] -%}
              {%- endfor -%}
              {{ ns.list }}
            {%- else -%}
              {%- set ns = namespace(list=[]) -%}
              {%- for p in _rc -%}
                {%- set ns.list = ns.list + [(p | string | trim)] -%}
              {%- endfor -%}
              {{ ns.list }}
            {%- endif -%}
          _rgb_raw: "{{ rgb_color | default('', true) | string | trim }}"
          _scene:        "{{ scene | default('', true) | string | trim }}"
          _transition:   "{{ transition | default(1) | int(1) }}"
          _context_raw:  "{{ home_context | default('', true) | string | trim }}"
          _dry_run:      "{{ dry_run | default(false) | bool }}"
          _caller_token: "{{ caller_token | default('') | string | trim }}"
          _search:       "{{ search | default('', true) | string | trim | lower }}"
          _adjust_only:  "{{ adjust_only | default(false) | bool }}"
          _step_pct:     "{{ step_pct | default(-1) | int(-1) }}"
          _effect_want:  "{{ effect | default('', true) | string | trim }}"

      # ── 0a2. Shade sync ───────────────────────────────────────────────────
      - variables:
          _sync_shades: "{{ sync_shades | default(false, true) | bool(false) }}"
          _shade_scene: >-
            {%- set m = {'movie': 'movie', 'work': 'work', 'morning': 'morning',
                         'sleep': 'sleep', 'party': 'natural', 'away': 'sleep'} -%}
            {{ m.get(_intent, '') }}

      # ── 0b. Cabinet + area ID ─────────────────────────────────────────────
      - variables:
          _hh_cabinet: >-
            {{ states('sensor.zen_default_household_cabinet_resolved')
               | default('', true) | string | trim }}
          _room_area_id: >-
            {%- if _room_slug != '' -%}
              {%- set ns = namespace(aid='') -%}
              {%- for a in areas() -%}
                {%- if area_name(a) | lower | replace(' ', '_') == _room_slug or a == _room_slug -%}
                  {%- set ns.aid = a -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.aid }}
            {%- else -%}{{ '' }}{%- endif -%}

      # ── 0b2. Room entities — area-first, label fallback ───────────────────
      - variables:
          _room_ents: >-
            {%- if _room_slug == '' -%}
              {{ [] }}
            {%- elif _room_area_id != '' -%}
              {{ area_entities(_room_area_id) | select('match', 'light\\.') | list }}
            {%- else -%}
              {{ label_entities(_room_slug) | select('match', 'light\\.') | list }}
            {%- endif -%}
          # Same area-first/label-fallback shape, switch\. domain -- for
          # mode=switch_set's room=/target_role= resolution (2026-08-16,
          # household: "extended into it now"). No zen_lm_*-style role taxonomy
          # exists for switches (there's nothing equivalent to main/accent/
          # task lighting roles), so resolution is flatter: target_role=
          # still works as a plain label filter (any label name, not
          # restricted to a fixed vocabulary), 'primary' still wins
          # tiebreaks, but there's no group/main tiering -- just first match.
          _room_switch_ents: >-
            {%- if _room_slug == '' -%}
              {{ [] }}
            {%- elif _room_area_id != '' -%}
              {{ area_entities(_room_area_id) | select('match', 'switch\\.') | list }}
            {%- else -%}
              {{ label_entities(_room_slug) | select('match', 'switch\\.') | list }}
            {%- endif -%}

      # ── 0c. RM room_control_manager + hold guard (2026-08-06, design note:
      #     "respect rm and use its scenes", then "guard hold too") — mirrors
      #     room_state.yaml's own resolution for BOTH signals: ONE select
      #     tagged 'room_control_manager' + this room's
      #     label (Paused = automation safety all-stop, human-only clear;
      #     Automation = another automation currently owns this room;
      #     Cleaning = zen_cleaning_dispatch has it while a vacuum is
      #     inside), AND any entity tagged 'hold' + this room's label
      #     reading on/open (fridge-door mode — door open means don't touch
      #     this room's lights out from under whatever hold is protecting).
      #     Blocks the WRITE-taking modes only; force=true bypasses for an
      #     explicit human override. reflex_sync is NOT in this list — it
      #     fires whatever RM's own cascade currently resolves for this
      #     room's state, which already accounts for BOTH signals (a locked
      #     room resolves to that state and fires its own scene if wired,
      #     not a violation of the lock — it IS the lock's own scene).
      - variables:
          _force: "{{ force | default(false, true) | bool(false) }}"
          _zl_rc_ent: >-
            {{ (label_entities('room_control_manager') | intersect(label_entities(_room_slug)) | list | first) | default('', true) }}
          _zl_rc_val: "{{ states(_zl_rc_ent) if _zl_rc_ent != '' else '' }}"
          _zl_rc_locked: "{{ _zl_rc_val in ['Paused', 'Automation', 'Cleaning'] }}"
          _zl_hold_ents: "{{ label_entities('hold') | intersect(label_entities(_room_slug)) | list }}"
          _zl_hold_active: "{{ (_zl_hold_ents | map('states') | select('in', ['on', 'open']) | list | count) > 0 }}"
          _zl_room_locked: "{{ _zl_rc_locked or _zl_hold_active }}"
          _zl_write_modes: [scene_set, brightness_set, color_temp_set, rgb_set, bleed_set, prefs_apply, toggle, switch_set, brightness_increase, brightness_decrease, effect_set]
      - if: "{{ (_mode in _zl_write_modes or _mode == 'scene_stage') and _zl_room_locked and not _force }}"
        then:
          - variables:
              _zl_lock_reason: >-
                {%- if _zl_rc_locked -%}room_control_manager:{{ _zl_rc_val }}
                {%- elif _zl_hold_active -%}hold_active
                {%- endif -%}
              result:
                ok: false
                tool: zen_dojotools_lights
                mode: "{{ _mode }}"
                error: room_locked
                room: "{{ _room_slug }}"
                room_control_manager: "{{ _zl_rc_val }}"
                hold_active: "{{ _zl_hold_active }}"
                lock_reason: "{{ _zl_lock_reason }}"
                message: >-
                  {{ _room_slug }} is locked ({{ _zl_lock_reason }}) — ZenLux write
                  actions are blocked while room_control_manager is Paused/Automation/Cleaning
                  or a hold-labeled entity (e.g. a door) is open (same convention
                  room_state.yaml's cascade uses). Pass force=true for an explicit
                  human override, or use mode=reflex_sync to fire whatever RM's own
                  cascade currently resolves for this room (which already accounts
                  for the lock).
          - stop: room locked — write blocked
            response_variable: result

      # ── 0c-2. LIGHTING_CONTROL cert gate (2026-08-16, household: "now add
      # the gates" -- turning on the cert declared earlier this session).
      # Cert-only, matching the SAFE tier of locks'/covers' asymmetric-risk
      # shape (the "lock"/"close" direction) -- no live-ack tier yet, since
      # ZenLux has no built write action with the same physical-exposure
      # shape as an exterior unlock/barrier-open. cert_scope IS resolved
      # and carried on the identity result regardless, so the exemption
      # mechanism (household: "allow certain lamps to be excepted/exempted...
      # for scene and lamp and switch", same cert_scope semantic as locks
      # -- an allow-list, not a disallow-list) is structurally ready the
      # moment a real ack-requiring action lands here (e.g. scene_stage's
      # confirm phase, once relocated, or a future switch-toggle mode).
      # Same _zl_write_modes list the room-lock guard above already uses.
      - if: "{{ _mode in _zl_write_modes }}"
        then:
          # target_entity is the raw caller-supplied _entity_id (role/room
          # resolution hasn't run yet at this point in the sequence) --
          # good enough to pre-resolve scope_decision via the shared
          # cert_scope_check macro now, so it's already sitting on
          # _zl_id_raw the moment a real ack-consuming action lands here
          # (2026-08-16, same chokepoint locks/covers/security_manager/
          # room_manager/infra all use -- see dojotools_identity.yaml).
          - action: script.zen_dojotools_identity
            response_variable: _zl_id_raw
            continue_on_error: true
            data:
              mode: resolve_caller_identity
              required_cert: lighting_control
              required_cert_level: 1
              target_entity: "{{ _entity_id }}"
              caller_token: "{{ _caller_token }}"
          - variables:
              _zl_policy_status: "{{ _zl_id_raw.get('policy_status', 'blocked') if _zl_id_raw is mapping else 'blocked' }}"
              _zl_authorized: "{{ _zl_id_raw.get('authorized', false) if _zl_id_raw is mapping else false }}"
              _zl_cert_level: "{{ _zl_id_raw.get('cert_level', 0) if _zl_id_raw is mapping else 0 }}"
              _zl_cert_scope: "{{ _zl_id_raw.get('cert_scope', []) if _zl_id_raw is mapping else [] }}"
              _zl_scope_decision: "{{ _zl_id_raw.get('scope_decision', 'default') if _zl_id_raw is mapping else 'default' }}"
          - if: "{{ _zl_policy_status != 'allowed' or not _zl_authorized }}"
            then:
              - variables:
                  result:
                    ok: false
                    tool: zen_dojotools_lights
                    mode: "{{ _mode }}"
                    error: "{{ 'identity_policy_blocked' if _zl_policy_status != 'allowed' else 'cert_insufficient' }}"
                    detail: >-
                      {%- if _zl_policy_status != 'allowed' -%}
                        resolve_caller_identity did not return an allowed identity -- action denied.
                      {%- else -%}
                        lighting_control cert level {{ _zl_cert_level }} is below the required minimum (1).
                      {%- endif -%}
                    can_request: "{{ _zl_policy_status == 'allowed' }}"
                    request_via:
                      tool: zen_dojotools_persona_editor
                      mode: cert_grant
                      cert_component: lighting_control
                      cert_level: 1
                      note: "Fires a live household-admin approval push -- see zen_dojotools_identity mode=cert_list for current status."
                    caller_token: "{{ _caller_token }}"
              - stop: lighting_control cert insufficient
                response_variable: result

      # ── 0c-3. SCENE_HANDLING cert gate (2026-08-19) -- closing the gap the
      # 0c-2 comment above flagged as the chokepoint's next real consumer.
      # scene_stage snapshots/restores light+cover+climate+media_player+
      # switch+fan+humidifier state for a whole room (see _ss_domains) --
      # gated at the ACTION level (staging/tagging a scene), same shape as
      # room_control_override/room_topology_edit, not per-entity/per-domain.
      # A caller without scene_handling cannot use scene_stage to write
      # cover/climate/etc. state even if they separately hold those
      # domains' own certs -- scene_stage is its own gated surface.
      - if: "{{ _mode == 'scene_stage' }}"
        then:
          - action: script.zen_dojotools_identity
            response_variable: _ss_id_raw
            continue_on_error: true
            data:
              mode: resolve_caller_identity
              required_cert: scene_handling
              required_cert_level: 1
              target_entity: ""
              caller_token: "{{ _caller_token }}"
          - variables:
              _ss_policy_status: "{{ _ss_id_raw.get('policy_status', 'blocked') if _ss_id_raw is mapping else 'blocked' }}"
              _ss_authorized: "{{ _ss_id_raw.get('authorized', false) if _ss_id_raw is mapping else false }}"
              _ss_cert_level: "{{ _ss_id_raw.get('cert_level', 0) if _ss_id_raw is mapping else 0 }}"
          - if: "{{ _ss_policy_status != 'allowed' or not _ss_authorized }}"
            then:
              - variables:
                  result:
                    ok: false
                    tool: zen_dojotools_lights
                    mode: scene_stage
                    error: "{{ 'identity_policy_blocked' if _ss_policy_status != 'allowed' else 'cert_insufficient' }}"
                    detail: >-
                      {%- if _ss_policy_status != 'allowed' -%}
                        resolve_caller_identity did not return an allowed identity -- action denied.
                      {%- else -%}
                        scene_handling cert level {{ _ss_cert_level }} is below the required minimum (1).
                      {%- endif -%}
                    can_request: "{{ _ss_policy_status == 'allowed' }}"
                    request_via:
                      tool: zen_dojotools_persona_editor
                      mode: cert_grant
                      cert_component: scene_handling
                      cert_level: 1
                      note: "Fires a live household-admin approval push -- see zen_dojotools_identity mode=cert_list for current status."
                    caller_token: "{{ _caller_token }}"
              - stop: scene_handling cert insufficient
                response_variable: result

      # ── 0c. Stored room default role (guarded) ────────────────────────────
      - variables:
          _room_default_role: ""

      - if: >-
          {{ _room_slug != '' and _entity_id == '' and _target_role == ''
             and _mode not in ['help','prefs_get','prefs_set','prefs_apply',
                                'room_default_get','room_default_set','auto_label','prefs_sweep']
             and _hh_cabinet not in ['','unavailable','unknown'] }}
        then:
          - action: script.zen_dojotools_filecabinet
            data:
              action_type: read
              key: "light_prefs_{{ _room_slug }}"
              volume_entity_id: "{{ _hh_cabinet }}"
              caller_token: "{{ _caller_token }}"
            response_variable: _fc_rdef_raw
          - variables:
              _room_default_role: >-
                {%- set r = _fc_rdef_raw.get('result', {}) if _fc_rdef_raw is mapping else {} -%}
                {%- set d = r.get('light_prefs_' + _room_slug, {}) if r is mapping else {} -%}
                {%- set v = d.get('value', d) if d is mapping else {} -%}
                {%- set role = v.get('default_role', '') if v is mapping else '' -%}
                {{ '' if role == 'auto' else role }}

      # ── 0d. Role intersections — tiered: zen_lm_* beats named legacy beats broad ─
      #       Within each tier, 'primary' label wins tiebreaks.
      - variables:
          _r_group: >-
            {%- set t1 = _room_ents | select('in', label_entities('zen_lm_group') | list) | list -%}
            {%- set t2 = _room_ents | select('in', label_entities('light_group') | list) | list -%}
            {%- set cands = t1 if t1 else t2 -%}
            {%- set prim = cands | select('in', label_entities('primary') | list) | list -%}
            {{ (prim | first) if prim else (cands | first | default('')) }}
          _r_main: >-
            {%- set t1 = _room_ents | select('in', label_entities('zen_lm_main') | list) | list -%}
            {%- set t2 = _room_ents | select('in', label_entities('main_lighting') | list) | list -%}
            {%- set t3 = _room_ents | select('in', label_entities('lighting') | list) | list -%}
            {%- set cands = t1 if t1 else (t2 if t2 else t3) -%}
            {%- set prim = cands | select('in', label_entities('primary') | list) | list -%}
            {{ (prim | first) if prim else (cands | first | default('')) }}
          _r_accent: >-
            {%- set t1 = _room_ents | select('in', label_entities('zen_lm_accent') | list) | list -%}
            {%- set t2 = _room_ents | select('in', label_entities('accent_lighting') | list) | list -%}
            {%- set cands = t1 if t1 else t2 -%}
            {%- set prim = cands | select('in', label_entities('primary') | list) | list -%}
            {{ (prim | first) if prim else (cands | first | default('')) }}
          _r_task: >-
            {%- set t1 = _room_ents | select('in', label_entities('zen_lm_task') | list) | list -%}
            {%- set t2 = _room_ents | select('in', label_entities('lights_task') | list) | list -%}
            {%- set cands = t1 if t1 else t2 -%}
            {%- set prim = cands | select('in', label_entities('primary') | list) | list -%}
            {{ (prim | first) if prim else (cands | first | default('')) }}
          _r_night: >-
            {%- set t1 = _room_ents | select('in', label_entities('zen_lm_night') | list) | list -%}
            {%- set t2 = _room_ents | select('in', label_entities('night') | list) | list -%}
            {%- set cands = t1 if t1 else t2 -%}
            {%- set prim = cands | select('in', label_entities('primary') | list) | list -%}
            {{ (prim | first) if prim else (cands | first | default('')) }}
          _r_outdoor: >-
            {%- set t1 = _room_ents | select('in', label_entities('zen_lm_outdoor') | list) | list -%}
            {%- set t2 = _room_ents | select('in', label_entities('lights_security') | list) | list -%}
            {%- set cands = t1 if t1 else t2 -%}
            {%- set prim = cands | select('in', label_entities('primary') | list) | list -%}
            {{ (prim | first) if prim else (cands | first | default('')) }}
          _r_dusk_dawn: >-
            {%- set cands = _room_ents | select('in', label_entities('zen_lm_dusk_dawn') | list) | list -%}
            {%- set prim = cands | select('in', label_entities('primary') | list) | list -%}
            {{ (prim | first) if prim else (cands | first | default('')) }}
          _r_stored: >-
            {{ _room_ents | select('in', label_entities(_room_default_role) | list) | list | first | default('')
               if _room_default_role != '' else '' }}

      # ── 0e. Auto-resolve default entity ───────────────────────────────────
      - variables:
          _auto_resolved: >-
            {{ _r_stored if _r_stored != ''
               else (_r_group if _r_group != ''
               else (_r_main if _r_main != ''
               else (_room_ents | list | first | default('')))) }}

      # ── 0f. Role-targeted entity ──────────────────────────────────────────
      - variables:
          _role_resolved: >-
            {%- if _target_role != '' -%}
              {{ _room_ents | select('in', label_entities(_target_role)) | list | first | default(_auto_resolved) }}
            {%- else -%}{{ _auto_resolved }}{%- endif -%}

      # ── 0g. Intent → role + preset hints ─────────────────────────────────
      - variables:
          _intent_role: >-
            {%- if _intent == 'movie' %}zen_lm_accent
            {%- elif _intent == 'sleep' %}zen_lm_night
            {%- elif _intent in ['morning','work'] %}zen_lm_task
            {%- elif _intent == 'party' %}zen_lm_accent
            {%- else %}zen_lm_main{%- endif %}
          _intent_bri: >-
            {%- if _intent == 'movie' %}15
            {%- elif _intent == 'sleep' %}3
            {%- elif _intent == 'morning' %}80
            {%- elif _intent == 'work' %}90
            {%- elif _intent == 'away' %}0
            {%- elif _intent == 'party' %}80
            {%- else %}-1{%- endif %}
          _intent_ct_k: >-
            {%- if _intent == 'movie' %}2700
            {%- elif _intent == 'sleep' %}2200
            {%- elif _intent == 'morning' %}5000
            {%- elif _intent == 'work' %}5500
            {%- else %}-1{%- endif %}

      - variables:
          _intent_entity: >-
            {%- if _intent != '' -%}
              {%- set ic = _room_ents | select('in', label_entities(_intent_role)) | list -%}
              {%- set p = ic | select('in', label_entities('primary')) | list | first | default('') -%}
              {{ p if p != '' else ic | first | default(_role_resolved) }}
            {%- else %}{{ _role_resolved }}{%- endif %}

      - variables:
          _resolved_entity: >-
            {{ _entity_id if _entity_id != '' else _intent_entity }}

      # ── 0f2. Switch role/auto-resolve — same target_role=/'primary'
      # tiebreak convention as the light chain above, flattened (no
      # group/main tiering, see _room_switch_ents comment). ──
      - variables:
          _sw_role_resolved: >-
            {%- if _target_role != '' -%}
              {%- set cands = _room_switch_ents | select('in', label_entities(_target_role)) | list -%}
              {%- set prim = cands | select('in', label_entities('primary') | list) | list -%}
              {{ (prim | first) if prim else (cands | first | default('')) }}
            {%- else -%}
              {%- set prim = _room_switch_ents | select('in', label_entities('primary') | list) | list -%}
              {{ (prim | first) if prim else (_room_switch_ents | first | default('')) }}
            {%- endif -%}
          _sw_resolved_entity: >-
            {{ _entity_id if _entity_id != '' else _sw_role_resolved }}

      # ── 0g2. LIGHTING_CONTROL deny enforcement (2026-08-16, household: "fix
      # lighting controls missing gates with appropriate cert checks" --
      # part 4 of the deny-ACL plan, enforcement half). The earlier cert
      # gate (0c-2) only ever checked scope_decision against the RAW
      # caller-supplied _entity_id -- for the common room=/target_role=
      # call shape, _entity_id is '' at that point (resolution hasn't run
      # yet), so scope_decision was always 'default' and a deny entry on a
      # room-resolved lamp/switch was silently never checked. Also:
      # scope_decision was computed but never actually gated on anywhere --
      # a deny result was functionally identical to 'default'. Both fixed
      # here: re-resolve scope_decision (reusing the already-fetched
      # _zl_cert_scope, no second identity call needed) against whichever
      # entity THIS mode is actually about to act on, and hard-block on
      # deny. Per-mode target:
      #   toggle          -> _entity_id (already the real, explicit target)
      #   switch_set      -> _sw_resolved_entity (room/role-resolved switch)
      #   scene_set       -> _scene if given (real HA scene), else
      #                      _resolved_entity (intent path)
      #   brightness_set/color_temp_set/rgb_set/bleed_set -> _resolved_entity
      #   prefs_apply     -> NOT covered -- its real target isn't resolved
      #     until deep inside the mode body (stored pref -> role -> entity,
      #     computed live at apply time). Flagging as a known gap rather
      #     than silently checking the wrong entity.
      # bleed_set's chain propagation to ADJACENT rooms (_bt_main per
      # portal) is also NOT covered -- this only checks the primary target.
      # That's the real "block travels up the chain" work, still open.
      - variables:
          _zl_deny_target: >-
            {%- if _mode == 'toggle' -%}{{ _entity_id }}
            {%- elif _mode == 'switch_set' -%}{{ _sw_resolved_entity }}
            {%- elif _mode == 'scene_set' -%}{{ _scene if _scene != '' else _resolved_entity }}
            {%- elif _mode in ['brightness_set', 'color_temp_set', 'rgb_set', 'bleed_set'] -%}{{ _resolved_entity }}
            {%- else -%}{{ '' }}{%- endif -%}
      - if: >-
          {{ _mode in _zl_write_modes and _zl_deny_target != ''
             and _zl_policy_status == 'allowed' and _zl_authorized }}
        then:
          - variables:
              _zl_final_scope_decision: >-
                {%- import 'zenos_ai/zen_os_1.jinja' as OS -%}
                {{ OS.cert_scope_check(_zl_cert_scope, _zl_deny_target) | trim }}
          - if: "{{ _zl_final_scope_decision == 'deny' }}"
            then:
              - variables:
                  result:
                    ok: false
                    tool: zen_dojotools_lights
                    mode: "{{ _mode }}"
                    error: cert_scope_denied
                    detail: >-
                      lighting_control cert_scope explicitly denies
                      '{{ _zl_deny_target }}' -- an admin has scoped this
                      entity out via cert_grant cert_scope=[{"entity":
                      "{{ _zl_deny_target }}","acl":"deny"}]. Removing the
                      denial requires cert_grant cert_scope=[{"entity":
                      "{{ _zl_deny_target }}","acl":"remove"}].
                    target_entity: "{{ _zl_deny_target }}"
                    caller_token: "{{ _caller_token }}"
              - stop: lighting_control cert_scope deny
                response_variable: result

      # ── 0h. Capability snapshot ───────────────────────────────────────────
      # REAL BUG (found live 2026-08-16, same session as the rgb_color
      # parsing fix, TWO layers): (1) supported_color_modes mixes real
      # ColorMode enum members (e.g. <ColorMode.RGB: 'rgb'>, from most
      # integrations) with plain strings (e.g. 'xy', seen live on a light
      # GROUP entity specifically) in the SAME list -- exact equality/`in`
      # checks against plain string literals silently failed for every
      # enum-typed entry, so a real light that DOES support RGB was
      # reported as not supporting it. (2) First fix attempt stored the
      # raw enum-containing list in its own `_caps_raw` variable first --
      # but HA's re-coercion of stored template output uses something
      # ast.literal_eval-shaped, and enum reprs like <ColorMode.RGB: 'rgb'>
      # are NOT valid Python literal syntax, so the coercion attempt
      # failed and the WHOLE list collapsed into one flat STRING instead
      # (its own bracketed repr, as text) -- then iterating "for c in
      # _caps_raw" iterated that string's individual CHARACTERS, not its
      # elements. Same class of bug as the rgb_color fix, same real fix:
      # never store the raw enum-bearing collection in a named `variables:`
      # key at all -- reduce it to plain lowercase strings in ONE inline
      # expression first, and only the already-safe, enum-free result
      # (which DOES re-coerce correctly, no enum reprs left to break
      # literal_eval) ever gets assigned to an HA variable.
      - variables:
          _caps: >-
            {%- set ns = namespace(list=[]) -%}
            {%- for c in (state_attr(_resolved_entity, 'supported_color_modes') | default([], true)) -%}
              {%- set ns.list = ns.list + [c | string | lower] -%}
            {%- endfor -%}
            {{ ns.list }}
          _has_rgb: >-
            {{ (_caps | select('search', 'rgb|hs|xy') | list | length) > 0 }}
          _has_ct:  "{{ (_caps | select('search', 'color_temp') | list | length) > 0 }}"
          _has_dim: >-
            {{ (_caps | select('search', 'brightness') | list | length) > 0 or _has_rgb or _has_ct }}
          _effects:   >-
            {{ state_attr(_resolved_entity, 'effect_list') | default([], true) | list }}
          _is_wled:      "{{ _effects | length > 20 }}"
          _is_dusk_dawn: >-
            {{ _resolved_entity in (label_entities('zen_lm_dusk_dawn') | list) }}

      # ── 0i. Setup advisory ────────────────────────────────────────────────
      - variables:
          _setup_advisory: >-
            {%- set s = ['zen_lm_main','zen_lm_accent','zen_lm_task','zen_lm_group'] -%}
            {%- set ns = namespace(n=0) -%}
            {%- for l in s -%}{%- set ns.n = ns.n + (label_entities(l) | list | length) -%}{%- endfor -%}
            {%- if ns.n == 0 -%}
              {{ {'status': 'no_zenlux_labels', 'message': 'No light entities use zen_lm_* labels yet. Run mode=setup to create label definitions, then mode=label_suggest per room.', 'next_steps': ['mode=setup','mode=help']} }}
            {%- else -%}null{%- endif -%}

      # ── 0j. Room Manager — label-based discovery, pattern fallback, suggest ───
      - variables:
          _rm_entity: >-
            {%- if _room_slug != '' -%}
              {%- set by_label = label_entities('room_manager')
                  | select('in', label_entities(_room_slug) | list)
                  | select('match', 'input_select\\.') | list -%}
              {%- if by_label -%}
                {{ by_label | first }}
              {%- else -%}
                {%- set fallback = 'input_select.' + _room_slug + '_occupancy' -%}
                {{ fallback if states(fallback) not in ['unknown','unavailable',''] else '' }}
              {%- endif -%}
            {%- else -%}{{ '' }}{%- endif -%}
          _rm_suggest: >-
            {%- if _room_slug != '' -%}
              {%- set by_label = label_entities('room_manager')
                  | select('in', label_entities(_room_slug) | list)
                  | select('match', 'input_select\\.') | list -%}
              {%- set fallback = 'input_select.' + _room_slug + '_occupancy' -%}
              {%- set has_fallback = states(fallback) not in ['unknown','unavailable',''] -%}
              {%- if not by_label and not has_fallback and _room_area_id != '' -%}
                {{ area_entities(_room_area_id) | select('match', 'input_select\\.') | list }}
              {%- else -%}{{ [] }}{%- endif -%}
            {%- else -%}{{ [] }}{%- endif -%}
          _rm_timer: >-
            {%- if _room_slug != '' -%}
              {%- set by_label = label_entities('occupancy')
                  | select('in', label_entities(_room_slug) | list)
                  | select('match', 'sensor\\.') | list -%}
              {%- if by_label -%}
                {{ by_label | first }}
              {%- else -%}
                {%- set fallback = 'sensor.' + _room_slug + '_occupancy_timer' -%}
                {{ fallback if states(fallback) not in ['unknown','unavailable',''] else '' }}
              {%- endif -%}
            {%- else -%}{{ '' }}{%- endif -%}
          _mc_entity: >-
            {%- if _room_slug != '' -%}
              {%- set by_label = label_entities('universal_media_player')
                  | select('in', label_entities(_room_slug) | list) | list -%}
              {%- if by_label -%}
                {{ by_label | first }}
              {%- else -%}
                {%- set fallback = 'media_player.' + _room_slug + '_universal_media_player' -%}
                {{ fallback if states(fallback) not in ['unknown','unavailable',''] else '' }}
              {%- endif -%}
            {%- else -%}{{ '' }}{%- endif -%}
          _spa_entity: >-
            {%- if _room_slug != '' -%}
              {{ label_entities('spa_climate')
                 | select('in', area_entities(_room_slug) | list) | list | first | default('') }}
            {%- else -%}{{ '' }}{%- endif -%}

      - variables:
          _rm_state: >-
            {{ states(_rm_entity) | default('', true) if _rm_entity != '' else '' }}
          _rm_hold: >-
            {{ states(_rm_entity) | default('', true) | lower in ['hold','pause','paused']
               if _rm_entity != '' else false }}
          _rm_timer_remain: >-
            {{ state_attr(_rm_timer, 'timeremain') | default('', true)
               if _rm_timer != '' else '' }}
          _rm_timer_seconds: >-
            {{ state_attr(_rm_timer, 'seconds') | default(0, true) | int(0)
               if _rm_timer != '' else 0 }}

      - variables:
          _rm_active: >-
            {{ _rm_state not in ['','unknown','unavailable','Vacant','vacant'] }}

      # ── 0k. RM Hold gate — hard block all hardware writes ──────────────────
      - if: >-
          {{ _rm_hold and _room_slug != ''
             and _mode in ['brightness_set','color_temp_set','rgb_set',
                           'scene_set','prefs_apply','toggle','switch_set',
                           'bleed_set'] }}
        then:
          - variables:
              _result:
                status: blocked
                reason: rm_hold
                rm_entity: "{{ _rm_entity }}"
                rm_state: "{{ _rm_state }}"
                message: >-
                  Room Manager '{{ _rm_entity }}' is in '{{ _rm_state }}' —
                  ZenLux will not override a held room. To proceed: set
                  {{ _rm_entity }} to Engaged (unhold), then retry. Note:
                  RM may disallow Hold→Engaged transitions. A de-escalation
                  override will be available in RM v2.
                caller_token: "{{ _caller_token }}"
          - stop: rm_hold blocked
            response_variable: _result

      # ═══════════════════════════════════════════════════════════════════════
      # SESE conversion complete (2026-08-16,
      # matching locks/covers/security_manager's shape). Every mode
      # lives in this ONE choose: block, sets `result`, and falls through --
      # NO internal stop anywhere in this file. default: handles unknown
      # mode the same way every real mode does. The final envelope()+stop
      # lives at the very end of the sequence, after result is set.
      # ═══════════════════════════════════════════════════════════════════════
      - choose:
          # ── 1. HELP ──────────────────────────────────────────────────────
          - conditions: "{{ _mode == 'help' }}"
            sequence:
              - variables:
                  result:
                    status: ok
                    tool: zen_dojotools_lights
                    codename: ZenLux
                    version: "2.2.0"
                    summary: >-
                      Say 'set the office to work mode' and this tool handles it.
                      Discover room layout once, teach a pref, apply it forever.
                      No entity IDs. zen_lm_* role label + room label does all
                      resolution. Capabilities discovered at runtime from entity
                      attributes — no capability labels needed.
                    resolution: >-
                      Role path: target_role= intersects room entities with zen_lm_*
                      label. Intent path: intent= maps to role → primary wins tiebreak.
                      Auto chain: stored_default → zen_lm_group → zen_lm_main →
                      legacy labels → first_in_room. entity_id = direct override only.
                      prefs_apply re-resolves entity live — IDs can change.
                    label_taxonomy:
                      hardware_role:
                        zen_lm_main: "Primary ambient/overhead. Top of auto chain."
                        zen_lm_accent: "Accent/decorative — LED strips, bias, uplights."
                        zen_lm_task: "Task lighting — under-cabinet, desk, reading."
                        zen_lm_night: "Night/safety — low-level, always reachable."
                        zen_lm_outdoor: "Exterior/perimeter — porch, pathway, security wash."
                        zen_lm_dusk_dawn: "Photosensor/auto-managed. Tool warns before override."
                        zen_lm_group: "Light group entity. Top of auto chain. One per room."
                        zen_lm_scene: "HA scene entity. Activating sets whole-room look."
                      legacy_fallback:
                        lighting: "→ zen_lm_main"
                        main_lighting: "→ zen_lm_main"
                        accent_lighting: "→ zen_lm_accent"
                        lights_task: "→ zen_lm_task"
                        night: "→ zen_lm_night"
                        lights_security: "→ zen_lm_outdoor"
                        light_group: "→ zen_lm_group"
                      capability_discovery:
                        note: "Read from entity attributes at runtime. No labeling needed."
                        rgb: "supported_color_modes contains rgb/hs/rgbw/rgbww/xy"
                        color_temp: "supported_color_modes contains color_temp"
                        wled: "effect_list length > 20 (WLED ships 100+ effects)"
                    intent_presets:
                      movie: "zen_lm_accent, 15%, 2700K warm"
                      sleep: "zen_lm_night, 3%, 2200K ultra-warm"
                      morning: "zen_lm_task, 80%, 5000K daylight"
                      work: "zen_lm_task, 90%, 5500K cool white"
                      away: "zen_lm_main, off"
                      party: "zen_lm_accent, 80%, rgb if available"
                    prefs_storage: "Household cabinet. Key: light_prefs_{room_slug}."
                    setup_flow:
                      - "1. mode=setup — create all zen_lm_* label definitions"
                      - "2. mode=discover — map rooms, see unlabeled + advisory"
                      - "3. mode=label_suggest room=X — get zen_lm_* proposals"
                      - "4. Apply via zen_dojotools_labels"
                      - "5. mode=discover — verify. Then prune legacy labels optionally."
                    modes:
                      discover: "No room = whole-home map. Room = full role detail + capabilities."
                      inspect: "entity_id=X (light.* or switch.*) — full single-entity detail: labels, area, device tree, group membership."
                      setup: "Creates all zen_lm_* label definitions. Run once. Safe to re-run."
                      label_suggest: "Analyzes room entities, proposes zen_lm_* assignments."
                      resolve_debug: "Traces full selection chain + capability snapshot. Read-only."
                      reflex_sync: "Fires whatever RM's REFLEX cascade currently resolves for the room's live v3 state."
                      scene_set: "Activate HA scene entity or apply named intent preset."
                      scene_stage: "before/after/confirm workflow to turn a live-staged look into a real, REFLEX-tagged scene."
                      scene_list: "List scenes. room= filters to room label. search= substring on name/entity_id. No filters = all scenes."
                      brightness_set: "Set brightness 0-100. Resolves entity via room + role."
                      color_temp_set: "Set color temp in Kelvin (2700-6500)."
                      rgb_set: "Set RGB color 'r,g,b'. Resolves entity via room + role."
                      bleed_set: "Set primary room + propagate to adjacent rooms via room_manager light_tx."
                      toggle: "entity_id=X (light.* or switch.*) — domain-agnostic homeassistant.toggle."
                      switch_set: "entity_id=X (or room= [+ target_role=]) switch_state=on|off|toggle — switch.* write control."
                      prefs_get: "Read all stored prefs for a room."
                      prefs_set: "Teach a context: room + home_context + bri/ct/role/scene."
                      prefs_apply: "Apply stored pref. Context: explicit > room RM state (Engaged→work, Asleep→sleep, Away→away) > zen_home_mode. Re-resolves live."
                      prefs_sweep: "Apply a stored context pref to every room that has one. home_context= selects context (or reads zen_home_mode). dry_run=true previews. RM-held rooms skipped silently."
                      room_default_get: "Stored default role + current resolution."
                      room_default_set: "Store zen_lm_* role as room default. auto clears it."
                      auto_label: "Tag unlabeled area lights with the room= label. dry_run=true previews targets. Dispatches via zen_dojotools_labels — no manual label calls needed."
                    example_flows:
                      whole_home: "discover → every area with lights, on/off count, roles found"
                      drill_room: "discover room='Office' → all slots, capabilities, current state"
                      movie_now: "brightness_set room='Living Room' intent=movie"
                      teach_movie: "prefs_set room='Living Room' home_context=movie target_role=zen_lm_accent brightness=15 color_temp_k=2700"
                      apply_movie: "prefs_apply room='Living Room' home_context=movie"
                      dry_first: "prefs_apply room='Living Room' dry_run=true"
                      sweep_movie: "prefs_sweep home_context=movie — dims every room that knows movie"
                      flip_switch: "toggle entity_id=switch.office_outlets"
                      switch_by_room: "switch_set room='Office' switch_state=on"
                    whitelist_note: >-
                      To surface ZenLux in ninja_summarizer: add
                      'zen_dojotools_lights_called' to
                      zen_summarizer_act_whitelist.allowed_events in
                      dojotools_summarizers.yaml — ask Nyx when ready.
                    caller_token: "{{ _caller_token }}"
          - conditions: "{{ _mode == 'discover' }}"
            sequence:
              - if: "{{ _room_slug == '' }}"
                then:
                  # Whole-home map
                  - variables:
                      _home_map: >-
                        {%- set role_check = ['zen_lm_group','zen_lm_main','zen_lm_accent','zen_lm_task',
                                              'zen_lm_night','zen_lm_outdoor','zen_lm_dusk_dawn',
                                              'lighting','main_lighting','accent_lighting','light_group',
                                              'lights_task','night','lights_security'] -%}
                        {%- set _pre = namespace(on=[], un=[]) -%}
                        {%- for _a in areas() -%}
                          {%- for _e in area_entities(_a) | select('match','light\\.') | list -%}
                            {%- if states(_e) == 'on' -%}{%- set _pre.on = _pre.on + [_e] -%}{%- endif -%}
                            {%- if states(_e) == 'unavailable' -%}{%- set _pre.un = _pre.un + [_e] -%}{%- endif -%}
                          {%- endfor -%}
                        {%- endfor -%}
                        {%- set on_list = _pre.on -%}
                        {%- set unavail = _pre.un -%}
                        {%- set ns = namespace(rooms=[]) -%}
                        {%- for aid in areas() -%}
                          {%- set a_ents = area_entities(aid) | select('match', 'light\\.') | list -%}
                          {%- if a_ents | length > 0 -%}
                            {%- set t1g = a_ents | select('in', label_entities('zen_lm_group') | list) | list -%}
                            {%- set t2g = a_ents | select('in', label_entities('light_group') | list) | list -%}
                            {%- set r_g = (t1g | first) if t1g else (t2g | first | default('')) -%}
                            {%- set t1m = a_ents | select('in', label_entities('zen_lm_main') | list) | list -%}
                            {%- set t2m = a_ents | select('in', label_entities('main_lighting') | list) | list -%}
                            {%- set t3m = a_ents | select('in', label_entities('lighting') | list) | list -%}
                            {%- set r_m = (t1m | first) if t1m else ((t2m | first) if t2m else (t3m | first | default(''))) -%}
                            {%- set avail = a_ents | reject('in', unavail) | list -%}
                            {%- set def_ent = r_g if r_g != '' else (r_m if r_m != '' else (avail | first | default(a_ents | first | default('')))) -%}
                            {%- set def_via = 'zen_lm_group' if r_g != '' else ('zen_lm_main/legacy' if r_m != '' else 'first_in_room') -%}
                            {%- set ns2 = namespace(roles=[], matched=[]) -%}
                            {%- for rl in role_check -%}
                              {%- set m = a_ents | select('in', label_entities(rl)) | list | first | default('') -%}
                              {%- if m != '' -%}
                                {%- set ns2.roles = ns2.roles + [rl] -%}
                                {%- if m not in ns2.matched -%}{%- set ns2.matched = ns2.matched + [m] -%}{%- endif -%}
                              {%- endif -%}
                            {%- endfor -%}
                            {%- set entry = {
                              'area_id': aid,
                              'area_name': area_name(aid),
                              'default_entity': def_ent,
                              'default_name': state_attr(def_ent,'friendly_name') | default(def_ent,true) if def_ent != '' else none,
                              'default_via': def_via,
                              'roles_found': ns2.roles,
                              'light_count': a_ents | length,
                              'on_count': a_ents | select('in', on_list) | list | length,
                              'unlabeled_count': a_ents | reject('in', ns2.matched) | list | length
                            } -%}
                            {%- set ns.rooms = ns.rooms + [entry] -%}
                          {%- endif -%}
                        {%- endfor -%}
                        {{ ns.rooms }}
                  - variables:
                      result:
                        status: ok
                        scope: whole_home
                        rooms: "{{ _home_map }}"
                        setup_advisory: "{{ _setup_advisory if _setup_advisory != 'null' else none }}"
                        next_step: "Drill in: discover room='Room Name' — full role slots, live state, and scene inventory per room. Then scene_list search='room' to surface all scenes including untagged."
                        caller_token: "{{ _caller_token }}"

                else:
                  # Per-room discover
                  - variables:
                      _room_discover: >-
                        {%- set role_labels = ['zen_lm_group','zen_lm_main','zen_lm_accent','zen_lm_task',
                                               'zen_lm_night','zen_lm_outdoor','zen_lm_dusk_dawn','zen_lm_scene',
                                               'lighting','main_lighting','accent_lighting','light_group',
                                               'lights_task','night','lights_security'] -%}
                        {%- set ns = namespace(roles={}, seen=[]) -%}
                        {%- for rl in role_labels -%}
                          {%- set ents = _room_ents | select('in', label_entities(rl)) | list -%}
                          {%- if ents | length > 0 -%}
                            {%- set ns2 = namespace(slot=[]) -%}
                            {%- for e in ents -%}
                              {%- set caps = state_attr(e,'supported_color_modes') | default([],true) | list -%}
                              {%- set effects = state_attr(e,'effect_list') | default([],true) | list -%}
                              {%- set bri_raw = state_attr(e,'brightness') | default(0,true) | int(0) -%}
                              {%- set ct_raw = state_attr(e,'color_temp') | default(0,true) | int(0) -%}
                              {%- set einfo = {
                                'entity_id': e,
                                'name': state_attr(e,'friendly_name') | default(e,true),
                                'state': states(e),
                                'brightness_pct': (bri_raw / 2.55) | round(0) | int if states(e) == 'on' else none,
                                'color_temp_k': (1000000 / ct_raw) | round(0) | int if ct_raw > 0 else none,
                                'rgb_color': state_attr(e,'rgb_color') | default(none,true),
                                'capabilities': {
                                  'dimmable': ('brightness' in caps or (caps | select('in',['rgb','hs','rgbw','rgbww','xy','color_temp']) | list | length > 0)),
                                  'color_temp': 'color_temp' in caps,
                                  'rgb': (caps | select('in',['rgb','hs','rgbw','rgbww','xy']) | list | length) > 0,
                                  'wled': effects | length > 20,
                                  'effect_count': effects | length
                                },
                                'primary': e in (label_entities('primary') | list),
                                'dusk_dawn': e in (label_entities('zen_lm_dusk_dawn') | list)
                              } -%}
                              {%- set ns2.slot = ns2.slot + [einfo] -%}
                              {%- if e not in ns.seen -%}{%- set ns.seen = ns.seen + [e] -%}{%- endif -%}
                            {%- endfor -%}
                            {%- set ns.roles = dict(ns.roles, **{rl: ns2.slot}) -%}
                          {%- endif -%}
                        {%- endfor -%}
                        {{ {
                          'roles': ns.roles,
                          'unlabeled': _room_ents | reject('in', ns.seen) | list,
                          'default_entity': _auto_resolved,
                          'default_via': 'zen_lm_group' if _r_group != '' else ('zen_lm_main/legacy' if _r_main != '' else 'first_in_room'),
                          'light_count': _room_ents | length
                        } }}
                  - variables:
                      _room_scenes: >-
                        {%- set s_ents = label_entities(_room_slug) | select('match', 'scene\\.') | list -%}
                        {%- set ns = namespace(out=[]) -%}
                        {%- for s in s_ents -%}
                          {%- set affected = state_attr(s, 'entity_id') | default([], true) | list -%}
                          {%- set ns.out = ns.out + [{'entity_id': s, 'name': state_attr(s,'friendly_name') | default(s,true), 'entities_affected': affected, 'light_count': affected | select('match', 'light\\.') | list | length}] -%}
                        {%- endfor -%}
                        {{ ns.out }}
                  - variables:
                      _disc_topo: >-
                        {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}{%- set topo = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'room_topology') | from_json -%}
                        {{ topo.get(_room_area_id, none) if _room_area_id != '' else none }}
                      _disc_bleed: >-
                        {%- set _sp=_disc_topo if _disc_topo is mapping else {} -%}
                        {%- set ns=namespace(b=[]) -%}
                        {%- for p in (_sp.get('portals',[])|list) -%}
                          {%- if p is mapping and p.get('to',none) is not none -%}
                            {%- set _ltx=p.get('light_tx',0.0)|float(0.0) -%}
                            {%- set _stx=p.get('sound_tx',0.0)|float(0.0) -%}
                            {%- if _ltx >= 0.1 or _stx >= 0.65 -%}
                              {%- set ns.b=ns.b+[{'to':p.get('to'),'via':'portal','type':p.get('type',''),'normally':p.get('normally',''),'light_tx':_ltx,'sound_tx':_stx}] -%}
                            {%- endif -%}
                          {%- endif -%}
                        {%- endfor -%}
                        {%- for bl in (_sp.get('boundary_links',[])|list) -%}
                          {%- if bl is mapping -%}
                            {%- set _ltx=bl.get('light_tx',0.0)|float(0.0) -%}
                            {%- set _stx=bl.get('sound_tx',0.0)|float(0.0) -%}
                            {%- if _ltx >= 0.1 or _stx >= 0.30 -%}
                              {%- set ns.b=ns.b+[{'to':bl.get('to'),'via':'boundary_link','light_tx':_ltx,'sound_tx':_stx,'note':bl.get('note','')}] -%}
                            {%- endif -%}
                          {%- endif -%}
                        {%- endfor -%}
                        {{ ns.b | sort(attribute='light_tx', reverse=true) }}
                      _disc_acoustic_zone: >-
                        {%- set _sp=_disc_topo if _disc_topo is mapping else {} -%}
                        {%- set ns=namespace(z=[]) -%}
                        {%- for p in (_sp.get('portals',[])|list) -%}
                          {%- if p is mapping and p.get('to',none) is not none and p.get('sound_tx',0.0)|float(0.0) >= 0.65 -%}
                            {%- set ns.z=ns.z+[p.get('to')] -%}
                          {%- endif -%}
                        {%- endfor -%}
                        {{ ns.z }}

                  - variables:
                      result:
                        status: ok
                        scope: room
                        room: "{{ _room_slug }}"
                        discovery: "{{ _room_discover }}"
                        scenes: "{{ _room_scenes }}"
                        room_manager: >-
                          {%- if _rm_entity != '' -%}
                            {%- set _timer = {'entity': _rm_timer,
                                              'time_remaining': _rm_timer_remain,
                                              'seconds_remaining': _rm_timer_seconds,
                                              'holdswitch': state_attr(_rm_timer, 'holdswitch') | default(none, true),
                                              'occupiedswitch': state_attr(_rm_timer, 'occupiedswitch') | default(none, true),
                                              'engagedswitch': state_attr(_rm_timer, 'engagedswitch') | default(none, true),
                                              'sleepswitch': state_attr(_rm_timer, 'sleepswitch') | default(none, true)}
                                 if _rm_timer != '' else none -%}
                            {{ {'entity': _rm_entity, 'state': _rm_state, 'active': _rm_active,
                                'hold': _rm_hold,
                                'burnout_timer': _timer,
                                'advisory': ('HOLD — ZenLux blocked. Release hold to allow lighting changes.'
                                             if _rm_hold else
                                             ('Room Manager active — RM may override on next occupancy event.'
                                             if _rm_active else none))} }}
                          {%- elif _rm_suggest | length > 0 -%}
                            {{ {'entity': none, 'not_found': true,
                                'suggest_candidates': _rm_suggest,
                                'advisory': "No room_manager entity labeled for '" + _room_slug + "'. Tag one from suggest_candidates with labels 'room_manager' + '" + _room_slug + "' to enable RM-aware control."} }}
                          {%- else -%}{{ none }}{%- endif -%}
                        media_controller: >-
                          {%- if _mc_entity != '' -%}
                            {{ {'entity': _mc_entity, 'state': states(_mc_entity),
                                'note': 'NyxMau5 compatible — use zen_dojotools_media_manager for control'} }}
                          {%- else -%}{{ none }}{%- endif -%}
                        spa_master: >-
                          {%- if _spa_entity != '' -%}
                            {{ {'entity': _spa_entity,
                                'note': 'SpaMaster manages spa lights, jets, cover, chemistry, audio — use zen_dojotools_spamaster'} }}
                          {%- else -%}{{ none }}{%- endif -%}
                        setup_advisory: "{{ _setup_advisory if _setup_advisory != 'null' else none }}"
                        topology: >-
                          {%- if _disc_bleed | length > 0 or _disc_acoustic_zone | length > 0 -%}
                            {{ {
                              'bleed_exposure': _disc_bleed,
                              'acoustic_zone': _disc_acoustic_zone,
                              'advisory': 'bleed_exposure: optical/acoustic paths from this room (light_tx≥0.10 or sound_tx≥0.30). acoustic_zone: rooms in same open acoustic space (sound_tx≥0.65). Use bleed_set to propagate scenes across connected zones.'
                            } }}
                          {%- else -%}{{ none }}{%- endif -%}
                        next_step: >-
                          {%- if _setup_advisory != 'null' -%}
                            {{ _room_scenes | length }} labeled scene(s) found — run scene_list room={{ _room_slug }} search={{ _room_slug }} to surface all scenes + flag unlabeled lights. Then mode=setup + label_suggest room={{ _room_slug }} to assign zen_lm_* roles.
                          {%- elif _room_scenes | length > 0 -%}
                            {{ _room_scenes | length }} labeled scene(s) — run scene_list room={{ _room_slug }} search={{ _room_slug }} to find all scenes including untagged, with unlabeled_in_room check.
                          {%- else -%}
                            Run scene_list room={{ _room_slug }} search={{ _room_slug }} to find scenes by name. Then label_suggest room={{ _room_slug }} for zen_lm_* role proposals.
                          {%- endif -%}
                        caller_token: "{{ _caller_token }}"
          - conditions: "{{ _mode == 'inspect' }}"
            sequence:
              - if: "{{ _entity_id == '' }}"
                then:
                  - variables:
                      result: {status: error, mode: inspect, message: "entity_id= required (light.* or switch.*).", caller_token: "{{ _caller_token }}"}
              - if: "{{ result is not defined }}"
                then:
                - variables:
                    _insp_all_lights_switches: "{{ (states.light | map(attribute='entity_id') | list) + (states.switch | map(attribute='entity_id') | list) }}"
                - if: "{{ _entity_id not in _insp_all_lights_switches }}"
                  then:
                    - variables:
                        result: {status: error, mode: inspect, entity_id: "{{ _entity_id }}", message: "Entity '{{ _entity_id }}' not found, or not a light.*/switch.* entity.", caller_token: "{{ _caller_token }}"}
                - if: "{{ result is not defined }}"
                  then:
                  - variables:
                      _insp_ent: "{{ _entity_id }}"
                      _insp_domain: "{{ _insp_ent.split('.')[0] }}"
                      _insp_area_id: "{{ area_id(_insp_ent) | default(none, true) }}"
                      _insp_device_id: "{{ device_id(_insp_ent) | default(none, true) }}"
                      _insp_labels: "{{ labels(_insp_ent) }}"
                  - variables:
                      _insp_caps: >-
                        {%- if _insp_domain == 'light' -%}
                          {%- set ns = namespace(list=[]) -%}
                          {%- for c in (state_attr(_insp_ent, 'supported_color_modes') | default([], true)) -%}
                            {%- set ns.list = ns.list + [c | string | lower] -%}
                          {%- endfor -%}
                          {{ ns.list }}
                        {%- else -%}
                          {{ [] }}
                        {%- endif -%}
                      _insp_effects: >-
                        {{ state_attr(_insp_ent, 'effect_list') | default([], true) | list }}
                  - variables:
                      # Device-tree walk — same pattern as locks' inspect, every
                      # other entity sharing this one's physical HA device.
                      _insp_device_siblings: >-
                        {%- set ns = namespace(items=[]) -%}
                        {%- if _insp_device_id -%}
                          {%- for e in device_entities(_insp_device_id) if e != _insp_ent -%}
                            {%- set ns.items = ns.items + [{
                              'entity_id': e,
                              'domain': e.split('.')[0],
                              'friendly_name': state_attr(e, 'friendly_name') | default(e, true),
                              'state': states(e)
                            }] -%}
                          {%- endfor -%}
                        {%- endif -%}
                        {{ ns.items }}
                  - variables:
                      # GROUP MEMBERSHIP — both directions. member_of_groups: any
                      # light.* entity elsewhere whose own 'entity_id' attribute
                      # (HA's native light-group member list) contains this one.
                      # contains_members: if THIS entity is itself a group, its
                      # own member list.
                      _insp_member_of_groups: >-
                        {%- set ns = namespace(items=[]) -%}
                        {%- for g in states.light -%}
                          {%- set _members = state_attr(g.entity_id, 'entity_id') | default([], true) -%}
                          {%- if _members and _insp_ent in _members -%}
                            {%- set ns.items = ns.items + [g.entity_id] -%}
                          {%- endif -%}
                        {%- endfor -%}
                        {{ ns.items }}
                      _insp_contains_members: >-
                        {{ state_attr(_insp_ent, 'entity_id') | default([], true) | list }}
                  - variables:
                      _insp_role_labels: "{{ _insp_labels | select('match', '^zen_lm_') | list }}"
                  - variables:
                      result:
                        status: ok
                        mode: inspect
                        entity_id: "{{ _insp_ent }}"
                        domain: "{{ _insp_domain }}"
                        friendly_name: "{{ state_attr(_insp_ent, 'friendly_name') | default(_insp_ent, true) }}"
                        state: "{{ states(_insp_ent) }}"
                        last_changed: "{{ states[_insp_ent].last_changed.isoformat() if states[_insp_ent] is not none else none }}"
                        area_id: "{{ _insp_area_id }}"
                        area_name: "{{ area_name(_insp_area_id) if _insp_area_id else none }}"
                        labels: "{{ _insp_labels }}"
                        zenlux_roles: "{{ _insp_role_labels if _insp_role_labels | length > 0 else none }}"
                        brightness_pct: "{{ ((state_attr(_insp_ent, 'brightness') | default(0, true) | int(0)) / 255 * 100) | round | int if _insp_domain == 'light' and state_attr(_insp_ent, 'brightness') is not none else none }}"
                        color_temp_kelvin: "{{ state_attr(_insp_ent, 'color_temp_kelvin') if _insp_domain == 'light' else none }}"
                        rgb_color: "{{ state_attr(_insp_ent, 'rgb_color') if _insp_domain == 'light' else none }}"
                        supported_color_modes: "{{ _insp_caps if _insp_domain == 'light' else none }}"
                        effect_current: "{{ state_attr(_insp_ent, 'effect') if _insp_domain == 'light' else none }}"
                        effect_list: "{{ _insp_effects if (_insp_domain == 'light' and _insp_effects | length > 0) else none }}"
                        is_wled: "{{ (_insp_effects | length > 20) if _insp_domain == 'light' else none }}"
                        device_id: "{{ _insp_device_id }}"
                        device_name: "{{ device_attr(_insp_device_id, 'name') if _insp_device_id else none }}"
                        device_manufacturer: "{{ device_attr(_insp_device_id, 'manufacturer') if _insp_device_id else none }}"
                        device_model: "{{ device_attr(_insp_device_id, 'model') if _insp_device_id else none }}"
                        device_entities: "{{ _insp_device_siblings }}"
                        member_of_groups: "{{ _insp_member_of_groups if _insp_member_of_groups | length > 0 else none }}"
                        contains_members: "{{ _insp_contains_members if _insp_contains_members | length > 0 else none }}"
                        availability_note: >-
                          {{ ('This entity is unavailable/unreachable right now -- a real device connectivity issue (check power/network/integration), not a tool problem. Any group calls targeting it will silently skip it.' if states(_insp_ent) in ['unavailable', 'unknown'] else none) }}
                        caller_token: "{{ _caller_token }}"
          - conditions: "{{ _mode == 'resolve_debug' }}"
            sequence:
              - variables:
                  _bri_raw: "{{ state_attr(_resolved_entity,'brightness') | default(0,true) | int(0) }}"
                  _ct_raw:  "{{ state_attr(_resolved_entity,'color_temp') | default(0,true) | int(0) }}"
              - variables:
                  result:
                    status: ok
                    mode: resolve_debug
                    debug:
                      input:
                        room: "{{ _room_slug }}"
                        target_role: "{{ _target_role }}"
                        intent: "{{ _intent }}"
                        entity_id: "{{ _entity_id }}"
                      chain:
                        stored_default: "{{ _r_stored }}"
                        zen_lm_group: "{{ _r_group }}"
                        zen_lm_main: "{{ _r_main }}"
                        zen_lm_accent: "{{ _r_accent }}"
                        zen_lm_task: "{{ _r_task }}"
                        zen_lm_night: "{{ _r_night }}"
                        zen_lm_outdoor: "{{ _r_outdoor }}"
                        zen_lm_dusk_dawn: "{{ _r_dusk_dawn }}"
                        auto_resolved: "{{ _auto_resolved }}"
                        role_resolved: "{{ _role_resolved }}"
                        intent_entity: "{{ _intent_entity }}"
                        final: "{{ _resolved_entity }}"
                      intent_defaults:
                        role: "{{ _intent_role }}"
                        brightness_pct: "{{ _intent_bri }}"
                        color_temp_k: "{{ _intent_ct_k }}"
                      capabilities:
                        entity: "{{ _resolved_entity }}"
                        dimmable: "{{ _has_dim }}"
                        color_temp: "{{ _has_ct }}"
                        rgb: "{{ _has_rgb }}"
                        wled: "{{ _is_wled }}"
                        effect_count: "{{ _effects | length }}"
                        is_dusk_dawn: "{{ _is_dusk_dawn }}"
                      current_state:
                        state: "{{ states(_resolved_entity) }}"
                        brightness_pct: >-
                          {{ (_bri_raw / 2.55) | round(0) | int if states(_resolved_entity) == 'on' else none }}
                        color_temp_k: >-
                          {{ (1000000 / _ct_raw) | round(0) | int if _ct_raw > 0 else none }}
                        rgb_color: "{{ state_attr(_resolved_entity,'rgb_color') | default(none,true) }}"
                      warnings: >-
                        {%- set w = [] -%}
                        {%- if _is_dusk_dawn -%}{%- set w = w + ['dusk_dawn entity — photosensor may fight command'] -%}{%- endif -%}
                        {%- if _resolved_entity == '' -%}{%- set w = w + ['no entity resolved — check room label on light entities'] -%}{%- endif -%}
                        {{ w }}
                    caller_token: "{{ _caller_token }}"
          - conditions: "{{ _mode == 'prefs_get' }}"
            sequence:
              - if: "{{ _room_slug == '' or _hh_cabinet in ['','unavailable','unknown'] }}"
                then:
                  - variables:
                      result:
                        status: error
                        error: "room required. Household cabinet must be reachable."
                        caller_token: "{{ _caller_token }}"
              - if: "{{ result is not defined }}"
                then:
                  - action: script.zen_dojotools_filecabinet
                    data:
                      action_type: read
                      key: "light_prefs_{{ _room_slug }}"
                      volume_entity_id: "{{ _hh_cabinet }}"
                      caller_token: "{{ _caller_token }}"
                    response_variable: _fc_pg
                  - variables:
                      _pg_data: >-
                        {%- set r = _fc_pg.get('result', {}) if _fc_pg is mapping else {} -%}
                        {%- set d = r.get('light_prefs_' + _room_slug, {}) if r is mapping else {} -%}
                        {{ d.get('value', d) if d is mapping else {} }}
                  - variables:
                      result:
                        status: ok
                        mode: prefs_get
                        room: "{{ _room_slug }}"
                        prefs: "{{ _pg_data }}"
                        caller_token: "{{ _caller_token }}"
          - conditions: "{{ _mode == 'room_default_get' }}"
            sequence:
              - if: "{{ _room_slug == '' or _hh_cabinet in ['','unavailable','unknown'] }}"
                then:
                  - variables:
                      result:
                        status: error
                        error: "room required."
                        caller_token: "{{ _caller_token }}"
              - if: "{{ result is not defined }}"
                then:
                  - action: script.zen_dojotools_filecabinet
                    data:
                      action_type: read
                      key: "light_prefs_{{ _room_slug }}"
                      volume_entity_id: "{{ _hh_cabinet }}"
                      caller_token: "{{ _caller_token }}"
                    response_variable: _fc_rdg
                  - variables:
                      _rdg_stored: >-
                        {%- set r = _fc_rdg.get('result', {}) if _fc_rdg is mapping else {} -%}
                        {%- set d = r.get('light_prefs_' + _room_slug, {}) if r is mapping else {} -%}
                        {%- set v = d.get('value', d) if d is mapping else {} -%}
                        {{ v.get('default_role', 'auto') if v is mapping else 'auto' }}
                  - variables:
                      result:
                        status: ok
                        mode: room_default_get
                        room: "{{ _room_slug }}"
                        stored_default_role: "{{ _rdg_stored }}"
                        resolved_entity: "{{ _auto_resolved }}"
                        resolved_via: >-
                          {{ 'zen_lm_group' if _r_group != ''
                             else ('zen_lm_main/legacy' if _r_main != ''
                             else 'first_in_room') }}
                        caller_token: "{{ _caller_token }}"
          - conditions: "{{ _mode == 'room_state' }}"
            sequence:
              # Lightweight per-room light aggregate -- lights_total/on/
              # avg_brightness_pct only, no role/scene/topology payload
              # (that's what discover room=X is for). Built 2026-08-16 so
              # RM's +light context slice can call a real domain-tool mode
              # instead of re-deriving this itself with a raw states() loop
              # (same "read from domain tool" fix already applied to
              # +climate). Pure read, cert-ungated like every other GET in
              # this tool -- only actuation modes require lighting_control.
              - if: "{{ _room_slug == '' }}"
                then:
                  - variables:
                      result:
                        status: error
                        error: "room required."
                        caller_token: "{{ _caller_token }}"
              - if: "{{ result is not defined }}"
                then:
                  - variables:
                      _rs_bvals: >-
                        {%- set ns = namespace(v=[]) -%}
                        {%- for eid in _room_ents if states(eid) == 'on' -%}
                          {%- set _b = state_attr(eid, 'brightness') -%}
                          {%- if _b is number -%}{%- set ns.v = ns.v + [_b] -%}{%- endif -%}
                        {%- endfor -%}
                        {{ ns.v }}
                      _rs_on: >-
                        {%- set ns = namespace(v=[]) -%}
                        {%- for eid in _room_ents if states(eid) == 'on' -%}{%- set ns.v = ns.v + [eid] -%}{%- endfor -%}
                        {{ ns.v }}
                  - variables:
                      result:
                        status: ok
                        mode: room_state
                        room: "{{ _room_slug }}"
                        lights_total: "{{ _room_ents | length }}"
                        lights_on: "{{ _rs_on }}"
                        avg_brightness_pct: "{{ ((_rs_bvals | sum / (_rs_bvals | count) / 255 * 100) | round(0)) if _rs_bvals | count > 0 else 0 }}"
                        caller_token: "{{ _caller_token }}"
          - conditions: "{{ _mode == 'scene_list' }}"
            sequence:
              - variables:
                  _sl_pool: >-
                    {{ states.scene | map(attribute='entity_id') | list }}
              - variables:
                  _sl_results: >-
                    {%- set ns = namespace(out=[]) -%}
                    {%- for s in _sl_pool -%}
                      {%- set name = state_attr(s, 'friendly_name') | default(s, true) -%}
                      {%- if _search == '' or _search in name | lower or _search in s | lower -%}
                        {%- set affected = state_attr(s, 'entity_id') | default([], true) | list -%}
                        {%- set area = area_name(s) | default('', true) -%}
                        {%- set ns.out = ns.out + [{
                          'entity_id': s,
                          'name': name,
                          'area': area,
                          'entities_affected': affected,
                          'light_count': affected | select('match', 'light\\.') | list | length
                        }] -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {{ ns.out }}
              - variables:
                  _sl_mystery: >-
                    {%- if _room_slug != '' -%}
                      {%- set room_lights = label_entities(_room_slug) | select('match', 'light\\.') | list -%}
                      {%- set ns = namespace(all=[]) -%}
                      {%- for s in _sl_results -%}
                        {%- set s_area = s.get('area', '') | lower | replace(' ', '_') -%}
                        {%- if s_area == _room_slug -%}
                          {%- for e in s.get('entities_affected', []) -%}
                            {%- if 'light.' in e and e not in ns.all -%}
                              {%- set ns.all = ns.all + [e] -%}
                            {%- endif -%}
                          {%- endfor -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {{ ns.all | reject('in', room_lights) | list }}
                    {%- else -%}
                      {{ [] }}
                    {%- endif -%}
              - variables:
                  result:
                    status: ok
                    mode: scene_list
                    filter_room: "{{ _room_slug if _room_slug != '' else none }}"
                    search: "{{ _search if _search != '' else none }}"
                    count: "{{ _sl_results | length }}"
                    scenes: "{{ _sl_results }}"
                    unlabeled_in_room: "{{ _sl_mystery if _sl_mystery | length > 0 else none }}"
                    next_step: >-
                      {%- if _room_slug != '' and _sl_mystery | length > 0 -%}
                        {{ _sl_mystery | length }} lights in these scenes lack the '{{ _room_slug }}' label — invisible to discover. Add label via zen_dojotools_labels, then discover room={{ _room_slug }} to see them in resolution.
                      {%- elif _room_slug != '' -%}
                        All scene lights are labeled '{{ _room_slug }}'. Run label_suggest room={{ _room_slug }} for zen_lm_* role proposals.
                      {%- else -%}
                        Narrow down: add room='Room Name' to filter by label, or keep search= to find by name across all rooms.
                      {%- endif -%}
                    caller_token: "{{ _caller_token }}"
          - conditions: "{{ _mode == 'setup' }}"
            sequence:
              - variables:
                  _zen_lm_labels:
                    - id: zen_lm_main
                      name: "ZenLux: Main"
                      description: "Primary ambient/overhead. Top of ZenLux resolution chain."
                      color: "#F5E642"
                      icon: "mdi:ceiling-light"
                    - id: zen_lm_accent
                      name: "ZenLux: Accent"
                      description: "Accent/decorative — LED strips, bias lighting, uplights."
                      color: "#FF8C00"
                      icon: "mdi:led-strip-variant"
                    - id: zen_lm_task
                      name: "ZenLux: Task"
                      description: "Task lighting — under-cabinet, desk lamp, reading."
                      color: "#42A5F5"
                      icon: "mdi:desk-lamp"
                    - id: zen_lm_night
                      name: "ZenLux: Night"
                      description: "Night/safety lighting. Low-level, always reachable."
                      color: "#7E57C2"
                      icon: "mdi:weather-night"
                    - id: zen_lm_outdoor
                      name: "ZenLux: Outdoor"
                      description: "Exterior/perimeter — porch, pathway, security wash."
                      color: "#66BB6A"
                      icon: "mdi:outdoor-lamp"
                    - id: zen_lm_dusk_dawn
                      name: "ZenLux: Dusk/Dawn"
                      description: "Photosensor/auto-managed exterior. Tool warns before override."
                      color: "#FF7043"
                      icon: "mdi:weather-sunset"
                    - id: zen_lm_group
                      name: "ZenLux: Group"
                      description: "Light group entity. Single command surface for a room."
                      color: "#ECEFF1"
                      icon: "mdi:lightbulb-group"
                    - id: zen_lm_scene
                      name: "ZenLux: Scene"
                      description: "HA scene entity. Activating sets a whole-room look."
                      color: "#EC407A"
                      icon: "mdi:palette"

              - repeat:
                  for_each: "{{ _zen_lm_labels }}"
                  sequence:
                    - action: script.zen_dojotools_labels
                      data:
                        action_type: create
                        label_list:
                          - "{{ repeat.item.id }}"
                        new_description: "{{ repeat.item.description }}"
                        new_color:      "{{ repeat.item.color }}"
                        new_icon:       "{{ repeat.item.icon }}"
                        confirm: true
                      response_variable: _lbl_r

              - variables:
                  result:
                    status: ok
                    mode: setup
                    created: "{{ _zen_lm_labels | map(attribute='id') | list }}"
                    next_steps:
                      - "mode=discover — see current room light map"
                      - "mode=label_suggest room=X — get zen_lm_* proposals"
                      - "Apply via zen_dojotools_labels, then mode=discover to verify"
                    caller_token: "{{ _caller_token }}"
          - conditions: "{{ _mode == 'label_suggest' }}"
            sequence:
              - if: "{{ _room_slug == '' }}"
                then:
                  - variables:
                      result:
                        status: error
                        error: "room required for label_suggest."
                        caller_token: "{{ _caller_token }}"
              - if: "{{ result is not defined }}"
                then:
                  - variables:
                      _suggestions: >-
                        {%- set zen_all = (label_entities('zen_lm_main') | list)
                                        + (label_entities('zen_lm_accent') | list)
                                        + (label_entities('zen_lm_task') | list)
                                        + (label_entities('zen_lm_night') | list)
                                        + (label_entities('zen_lm_outdoor') | list)
                                        + (label_entities('zen_lm_dusk_dawn') | list)
                                        + (label_entities('zen_lm_group') | list)
                                        + (label_entities('zen_lm_scene') | list) -%}
                        {%- set ns = namespace(out=[]) -%}
                        {%- for e in _room_ents -%}
                          {%- set n = state_attr(e,'friendly_name') | default(e,true) | lower -%}
                          {%- set caps = state_attr(e,'supported_color_modes') | default([],true) | list -%}
                          {%- set effects = state_attr(e,'effect_list') | default([],true) | list -%}
                          {%- set role =
                            'zen_lm_group'     if ('group' in n or 'all_' in e or e == 'light.' + _room_slug)
                            else 'zen_lm_night'     if ('night' in n or 'safe' in n or 'step' in n)
                            else 'zen_lm_task'      if ('task' in n or 'desk' in n or 'cabinet' in n or 'reading' in n or 'shelf' in n)
                            else 'zen_lm_dusk_dawn' if ('dusk' in n or 'dawn' in n or 'photosensor' in n)
                            else 'zen_lm_outdoor'   if ('porch' in n or 'exterior' in n or 'outdoor' in n or 'pathway' in n or 'yard' in n or 'garden' in n)
                            else 'zen_lm_accent'    if ('accent' in n or 'strip' in n or 'bias' in n or 'led' in n or 'rgb' in n or 'color' in n or effects | length > 20)
                            else 'zen_lm_main'
                          -%}
                          {%- set entry = {
                            'entity_id': e,
                            'name': state_attr(e,'friendly_name') | default(e,true),
                            'suggested_role': role,
                            'already_zen_labeled': e in zen_all,
                            'has_rgb': (caps | select('in',['rgb','hs','rgbw','rgbww','xy']) | list | length) > 0,
                            'has_ct': 'color_temp' in caps,
                            'is_wled': effects | length > 20,
                            'effect_count': effects | length,
                            'confidence': 'high' if ('group' in n or 'night' in n or 'desk' in n or 'porch' in n or 'strip' in n or effects | length > 20) else 'medium'
                          } -%}
                          {%- set ns.out = ns.out + [entry] -%}
                        {%- endfor -%}
                        {{ ns.out }}
                  - variables:
                      result:
                        status: ok
                        mode: label_suggest
                        room: "{{ _room_slug }}"
                        suggestions: "{{ _suggestions }}"
                        note: "Review before applying. Apply via zen_dojotools_labels mode=apply_entity."
                        next_step: "Apply each suggestion via zen_dojotools_labels mode=apply_entity. Then discover room={{ _room_slug }} to verify slots filled, followed by prefs_set to teach contexts (work, movie, sleep)."
                        caller_token: "{{ _caller_token }}"
          - conditions: "{{ _mode == 'reflex_sync' }}"
            sequence:
              - if: "{{ _room_area_id == '' }}"
                then:
                  - variables:
                      result:
                        ok: false
                        tool: zen_dojotools_lights
                        mode: reflex_sync
                        error: missing_room
                        message: "room= required and must resolve to a real HA area."
              - if: "{{ result is not defined }}"
                then:
                - action: script.zen_dojotools_room_manager
                  response_variable: _zl_rw_raw
                  continue_on_error: true
                  data:
                    mode: reflex_wire
                    area: "{{ _room_area_id }}"
                    caller_token: "{{ _caller_token }}"
                - variables:
                    _zl_rw: "{{ _zl_rw_raw if _zl_rw_raw is mapping else {} }}"
                    # 2026-08-30 (found live, testing the site-1/site-3
                    # migration onto this mode): was guessing entity_id as
                    # sensor.<room>_room_state -- wrong suffix AND wrong
                    # approach. Real entity is sensor.<room>_state, and the
                    # established convention everywhere else in this
                    # codebase (dispatch itself, repeatedly) resolves it via
                    # the zen_room_state LABEL intersected with the room's
                    # own entities, never a guessed string -- label-driven
                    # discovery, never hardcode IDs. This mode has never
                    # actually worked in production before this fix; every
                    # call hit room_state_unavailable regardless of real
                    # live state.
                    _zl_room_state_ent: "{{ (label_entities('zen_room_state') | intersect(label_entities(_room_area_id)) | list | first) | default('', true) }}"
                    _zl_current_state: "{{ states((label_entities('zen_room_state') | intersect(label_entities(_room_area_id)) | list | first) | default('', true)) }}"
                    _zl_mode_slug: "{{ states('sensor.zen_home_mode') | lower | replace(' ', '_') | replace('-', '_') }}"
                - if: "{{ _zl_rw.get('status', '') != 'ok' or _zl_current_state in ['unknown', 'unavailable', ''] }}"
                  then:
                    - variables:
                        result:
                          ok: false
                          tool: zen_dojotools_lights
                          mode: reflex_sync
                          error: room_state_unavailable
                          room: "{{ _room_area_id }}"
                          room_state_entity: "{{ _zl_room_state_ent }}"
                          current_state: "{{ _zl_current_state }}"
                          message: "Could not read reflex_wire data or this room has no v3 room_state sensor deployed (no entity carries both the zen_room_state and {{ _room_area_id }} labels)."
                - if: "{{ result is not defined }}"
                  then:
                  - variables:
                      _zl_matrix_row: "{{ _zl_rw.get('wired_matrix', {}).get(_zl_current_state, {}) }}"
                      _zl_scene_to_fire: >-
                        {%- set _r = _zl_rw.get('wired_matrix', {}).get(_zl_current_state, {}) -%}
                        {{ (_r.get(_zl_mode_slug) if _r.get(_zl_mode_slug) is not none else _r.get('_fallback_any_mode')) if _r is mapping else none }}
                  - if: "{{ _zl_scene_to_fire is none }}"
                    then:
                      - variables:
                          result:
                            ok: false
                            tool: zen_dojotools_lights
                            mode: reflex_sync
                            error: no_scene_wired
                            room: "{{ _room_area_id }}"
                            state: "{{ _zl_current_state }}"
                            home_mode: "{{ _zl_mode_slug }}"
                            message: "No scene_{{ _zl_current_state }} wired for this room/mode. Use zen_dojotools_room_manager mode=reflex_wire area={{ _room_area_id }} to see gaps."
                  - if: "{{ result is not defined }}"
                    then:
                    - if: "{{ not _dry_run }}"
                      then:
                        # TRAP (2026-08-30, real incident): if this throws
                        # -- 'NoneType' object is not subscriptable or
                        # similar mid-service-call errors -- this
                        # resolution code is very likely NOT the bug.
                        # Confirmed live: scene.office_occupied_day crashed
                        # here, traced three layers deep through HA core's
                        # scene reproduction into custom_components/
                        # localtuya/light.py's async_turn_on indexing
                        # self._hs[0] with no None-check on a light whose
                        # cached HS value was stale. Fixed by disabling
                        # localtuya; scene fired clean immediately after.
                        # Before suspecting resolution/routing logic here,
                        # check what the scene's OWN member entities do on
                        # reproduction -- "does firing the identical scene
                        # a different way (NR, frontend, another tool) also
                        # error" is the fastest way to tell whether the bug
                        # is in this call or in what it's calling.
                        - action: scene.turn_on
                          target:
                            entity_id: "{{ _zl_scene_to_fire }}"
                          data:
                            transition: "{{ _transition }}"
                    - variables:
                        result:
                          ok: true
                          tool: zen_dojotools_lights
                          mode: reflex_sync
                          room: "{{ _room_area_id }}"
                          state: "{{ _zl_current_state }}"
                          home_mode: "{{ _zl_mode_slug }}"
                          scene_fired: "{{ _zl_scene_to_fire }}"
                          dry_run: "{{ _dry_run }}"
                          caller_token: "{{ _caller_token }}"
          # ── NIGHTLIGHT_SCENE_SYNC ──────────────────────────────────────────
          # 2026-08-30 (household: "pull in site 2 as well be we have a second
          # scene-less mode coming for that"). Same shape and same
          # deliberately-ungated rationale as reflex_sync above -- pure
          # replay of a decision dispatch's own room_state/nightlight-timer
          # logic already made, nothing here for an external caller to
          # authorize. Resolves scene_nightlight (mode-qualified preferred,
          # same tie-break dispatch's own nightlight-timer-start site
          # already used), NOT scene_<state> -- deliberately not folded into
          # reflex_sync, which resolves a different label entirely. This
          # separate mode is also the intended seam for a future scene-less
          # nightlight implementation: when that lands, only THIS mode's
          # internals change -- dispatch's call site never has to move
          # again.
          - conditions: "{{ _mode == 'nightlight_scene_sync' }}"
            sequence:
              - if: "{{ _room_area_id == '' }}"
                then:
                  - variables:
                      result:
                        ok: false
                        tool: zen_dojotools_lights
                        mode: nightlight_scene_sync
                        error: missing_room
                        message: "room= required and must resolve to a real HA area."
              - if: "{{ result is not defined }}"
                then:
                - variables:
                    _nls_room_ents: "{{ label_entities(_room_area_id) }}"
                    _nls_mode_ents: "{{ label_entities(states('sensor.zen_home_mode') | lower | replace(' ', '_') | replace('-', '_')) }}"
                    _nls_scene_ents: "{{ label_entities('scene_nightlight') }}"
                - variables:
                    _nls_scene_with_mode: "{{ (_nls_scene_ents | intersect(_nls_room_ents) | intersect(_nls_mode_ents) | select('match', 'scene\\.') | list | first) | default('', true) }}"
                    _nls_scene_no_mode: "{{ (_nls_scene_ents | intersect(_nls_room_ents) | select('match', 'scene\\.') | list | first) | default('', true) }}"
                - variables:
                    _nls_scene_to_fire: "{{ _nls_scene_with_mode if _nls_scene_with_mode != '' else _nls_scene_no_mode }}"
                - if: "{{ _nls_scene_to_fire | trim == '' }}"
                  then:
                    - variables:
                        result:
                          ok: false
                          tool: zen_dojotools_lights
                          mode: nightlight_scene_sync
                          error: no_scene_wired
                          room: "{{ _room_area_id }}"
                          message: "No scene_nightlight wired for this room/mode."
                - if: "{{ result is not defined }}"
                  then:
                  - if: "{{ not _dry_run }}"
                    then:
                      # TRAP -- same note as reflex_sync's fire site above.
                      # If this throws, check the scene's own member
                      # entities/integrations first (real 2026-08-30
                      # incident: a localtuya null-check bug, not this
                      # resolution code).
                      - action: scene.turn_on
                        target:
                          entity_id: "{{ _nls_scene_to_fire | trim }}"
                        data:
                          transition: "{{ _transition }}"
                  - variables:
                      result:
                        ok: true
                        tool: zen_dojotools_lights
                        mode: nightlight_scene_sync
                        room: "{{ _room_area_id }}"
                        scene_fired: "{{ _nls_scene_to_fire | trim }}"
                        dry_run: "{{ _dry_run }}"
                        caller_token: "{{ _caller_token }}"
          - conditions: "{{ _mode == 'brightness_set' }}"
            sequence:
              - variables:
                  _eff_bri: >-
                    {{ _brightness if _brightness >= 0
                       else (_intent_bri | int(-1) if _intent != '' else -1) }}
              - if: "{{ _eff_bri < 0 or _resolved_entity == '' }}"
                then:
                  - variables:
                      result:
                        status: error
                        error: "brightness (0-100) and room/entity required."
                        caller_token: "{{ _caller_token }}"
              - if: "{{ result is not defined }}"
                then:
                - if: "{{ _dry_run }}"
                  then:
                    - variables:
                        result:
                          status: ok
                          dry_run: true
                          would_set_entity: "{{ _resolved_entity }}"
                          would_set_brightness_pct: "{{ _eff_bri }}"
                          dusk_dawn_warning: "{{ 'auto-managed entity' if _is_dusk_dawn else none }}"
                          caller_token: "{{ _caller_token }}"
                - if: "{{ result is not defined and _adjust_only }}"
                  then:
                    # 2026-08-30 (Vee + household, morning after Spook 5.2
                    # dropped: "gate the new adjust actions on Spook >=5.2
                    # using the same feature-detection pattern already used
                    # for 5.1; preserve existing authoritative set/scene
                    # behavior, but use Spook for non-destructive adjustments
                    # that must leave currently-off lights off"). Same
                    # has_service probe zen_health_report/ectoplasm already
                    # use for the spook_installed / automation_snooze checks
                    # -- never assume, always confirm the real service
                    # exists before calling it.
                    - action: script.zen_sutra_ha_api
                      continue_on_error: true
                      data:
                        mode: services
                        has_service: light.set_brightness
                      response_variable: _bri_svc_check
                    - if: "{{ not (_bri_svc_check is mapping and _bri_svc_check.get('found', false) == true) }}"
                      then:
                        - variables:
                            result:
                              status: error
                              error: spook_version_required
                              mode: brightness_set
                              message: >-
                                adjust_only=true requires Spook v5.2.0+
                                (light.set_brightness not found). Nothing
                                was changed -- retry without adjust_only for
                                today's force-on behavior, or upgrade Spook.
                              caller_token: "{{ _caller_token }}"
              - if: "{{ result is not defined }}"
                then:
                  - if: "{{ _adjust_only }}"
                    then:
                      - action: light.set_brightness
                        target:
                          entity_id: "{{ _resolved_entity }}"
                        data:
                          brightness_pct: "{{ _eff_bri }}"
                          transition: "{{ _transition }}"
                    else:
                      - if: "{{ _eff_bri == 0 }}"
                        then:
                          - action: light.turn_off
                            target:
                              entity_id: "{{ _resolved_entity }}"
                            data:
                              transition: "{{ _transition }}"
                        else:
                          - action: light.turn_on
                            target:
                              entity_id: "{{ _resolved_entity }}"
                            data:
                              brightness: "{{ (_eff_bri * 2.55) | round(0) | int }}"
                              transition: "{{ _transition }}"
                  - variables:
                      result:
                        status: ok
                        mode: brightness_set
                        entity: "{{ _resolved_entity }}"
                        brightness_pct: "{{ _eff_bri }}"
                        transition: "{{ _transition }}"
                        adjust_only: "{{ _adjust_only }}"
                        dusk_dawn_warning: "{{ 'auto-managed — verify photosensor not fighting command' if _is_dusk_dawn else none }}"
                        room_manager_advisory: "{{ 'Room Manager active (' + _rm_state + ') — occupancy automation may override this command' if _rm_active else none }}"
                        caller_token: "{{ _caller_token }}"
          - conditions: "{{ _mode == 'color_temp_set' }}"
            sequence:
              - variables:
                  _eff_ct_k: >-
                    {{ _color_temp_k if _color_temp_k > 0
                       else (_intent_ct_k | int(-1) if _intent != '' else -1) }}
              - if: "{{ _eff_ct_k <= 0 or not _has_ct or _resolved_entity == '' }}"
                then:
                  - variables:
                      result:
                        status: error
                        error: >-
                          {{ 'color_temp_k required (2700-6500)' if _eff_ct_k <= 0
                             else ('entity does not support color_temp' if not _has_ct
                             else 'no entity resolved') }}
                        caller_token: "{{ _caller_token }}"
              - if: "{{ result is not defined }}"
                then:
                - variables:
                    _ct_mired: "{{ (1000000 / _eff_ct_k) | round(0) | int }}"
                - if: "{{ _dry_run }}"
                  then:
                    - variables:
                        result:
                          status: ok
                          dry_run: true
                          would_set_entity: "{{ _resolved_entity }}"
                          would_set_color_temp_k: "{{ _eff_ct_k }}"
                          would_set_mired: "{{ _ct_mired }}"
                          caller_token: "{{ _caller_token }}"
                - if: "{{ result is not defined and _adjust_only }}"
                  then:
                    - action: script.zen_sutra_ha_api
                      continue_on_error: true
                      data:
                        mode: services
                        has_service: light.set_color_temperature
                      response_variable: _ct_svc_check
                    - if: "{{ not (_ct_svc_check is mapping and _ct_svc_check.get('found', false) == true) }}"
                      then:
                        - variables:
                            result:
                              status: error
                              error: spook_version_required
                              mode: color_temp_set
                              message: >-
                                adjust_only=true requires Spook v5.2.0+
                                (light.set_color_temperature not found).
                                Nothing was changed -- retry without
                                adjust_only for today's force-on behavior,
                                or upgrade Spook.
                              caller_token: "{{ _caller_token }}"
              - if: "{{ result is not defined }}"
                then:
                  - if: "{{ _adjust_only }}"
                    then:
                      - action: light.set_color_temperature
                        target:
                          entity_id: "{{ _resolved_entity }}"
                        data:
                          kelvin: "{{ _eff_ct_k }}"
                          transition: "{{ _transition }}"
                    else:
                      - action: light.turn_on
                        target:
                          entity_id: "{{ _resolved_entity }}"
                        data:
                          color_temp_kelvin: "{{ _eff_ct_k }}"
                          transition: "{{ _transition }}"
                  - variables:
                      result:
                        status: ok
                        mode: color_temp_set
                        entity: "{{ _resolved_entity }}"
                        color_temp_k: "{{ _eff_ct_k }}"
                        color_temp_mired: "{{ _ct_mired }}"
                        transition: "{{ _transition }}"
                        adjust_only: "{{ _adjust_only }}"
                        room_manager_advisory: "{{ 'Room Manager active (' + _rm_state + ') — occupancy automation may override this command' if _rm_active else none }}"
                        caller_token: "{{ _caller_token }}"
          - conditions: "{{ _mode == 'rgb_set' }}"
            sequence:
              # _rgb_parts is computed once, globally, in the 0-section input
              # normalization (see the real-bug comment there) -- not
              # recomputed here, since redoing it via _rgb_raw would
              # re-introduce the exact tuple-coercion bug that comment
              # documents. Error MESSAGE priority also fixed here: the `if`
              # below checks three independent failure causes (bad rgb_color
              # format / entity lacks RGB support / no entity resolved), and
              # the message now names whichever one actually tripped instead
              # of always blaming format first.
              - if: "{{ _rgb_parts | length != 3 or _resolved_entity == '' or not _has_rgb }}"
                then:
                  - variables:
                      result:
                        status: error
                        mode: rgb_set
                        error: >-
                          {%- if _rgb_parts | length != 3 -%}
                            rgb_color must be r,g,b (e.g. 255,100,0) -- got '{{ _rgb_raw }}', parsed to {{ _rgb_parts | length }} part(s) after trim, need exactly 3.
                          {%- elif _resolved_entity == '' -%}
                            no entity resolved -- provide entity_id= or room= (+ optional target_role=) that resolves to a real light.
                          {%- else -%}
                            entity '{{ _resolved_entity }}' does not support RGB -- supported_color_modes: {{ _caps }}.
                          {%- endif -%}
                        caller_token: "{{ _caller_token }}"
              - if: "{{ result is not defined }}"
                then:
                - if: "{{ _dry_run }}"
                  then:
                    - variables:
                        result:
                          status: ok
                          dry_run: true
                          would_set_entity: "{{ _resolved_entity }}"
                          would_set_rgb: "{{ _rgb_raw }}"
                          caller_token: "{{ _caller_token }}"
                - if: "{{ result is not defined and _adjust_only }}"
                  then:
                    - action: script.zen_sutra_ha_api
                      continue_on_error: true
                      data:
                        mode: services
                        has_service: light.set_color
                      response_variable: _rgb_svc_check
                    - if: "{{ not (_rgb_svc_check is mapping and _rgb_svc_check.get('found', false) == true) }}"
                      then:
                        - variables:
                            result:
                              status: error
                              error: spook_version_required
                              mode: rgb_set
                              message: >-
                                adjust_only=true requires Spook v5.2.0+
                                (light.set_color not found). Nothing was
                                changed -- retry without adjust_only for
                                today's force-on behavior, or upgrade Spook.
                              caller_token: "{{ _caller_token }}"
              - if: "{{ result is not defined }}"
                then:
                  - if: "{{ _adjust_only }}"
                    then:
                      - action: light.set_color
                        target:
                          entity_id: "{{ _resolved_entity }}"
                        data:
                          rgb_color:
                            - "{{ _rgb_parts[0] | int }}"
                            - "{{ _rgb_parts[1] | int }}"
                            - "{{ _rgb_parts[2] | int }}"
                          transition: "{{ _transition }}"
                    else:
                      - action: light.turn_on
                        target:
                          entity_id: "{{ _resolved_entity }}"
                        data:
                          rgb_color:
                            - "{{ _rgb_parts[0] | int }}"
                            - "{{ _rgb_parts[1] | int }}"
                            - "{{ _rgb_parts[2] | int }}"
                          transition: "{{ _transition }}"
                  - variables:
                      result:
                        status: ok
                        mode: rgb_set
                        entity: "{{ _resolved_entity }}"
                        rgb_color: "{{ _rgb_raw }}"
                        transition: "{{ _transition }}"
                        adjust_only: "{{ _adjust_only }}"
                        room_manager_advisory: "{{ 'Room Manager active (' + _rm_state + ') — occupancy automation may override this command' if _rm_active else none }}"
                        caller_token: "{{ _caller_token }}"
          # ── BRIGHTNESS_INCREASE / BRIGHTNESS_DECREASE (Spook v5.2.0+) ────────
          # 2026-08-30 (Vee + household). Genuinely new capability -- ZenLux had
          # no relative dim/brighten mode before this. No safe core fallback:
          # HA's own light.turn_on brightness_step_pct has the exact bug
          # Spook's PR #1503 measured and fixed (turns an OFF light on at a
          # low level; averages a group then flattens every member to the
          # same value on one step). Spook-only, clean gate, no silent
          # fallback to the flawed core primitive.
          - conditions: "{{ _mode in ['brightness_increase', 'brightness_decrease'] }}"
            sequence:
              - if: "{{ _step_pct <= 0 or _resolved_entity == '' }}"
                then:
                  - variables:
                      result:
                        status: error
                        mode: "{{ _mode }}"
                        error: "step_pct (1-100) and room/entity required."
                        caller_token: "{{ _caller_token }}"
              - if: "{{ result is not defined }}"
                then:
                - if: "{{ _dry_run }}"
                  then:
                    - variables:
                        result:
                          status: ok
                          dry_run: true
                          mode: "{{ _mode }}"
                          would_step_entity: "{{ _resolved_entity }}"
                          would_step_pct: "{{ _step_pct }}"
                          caller_token: "{{ _caller_token }}"
                - if: "{{ result is not defined }}"
                  then:
                    - action: script.zen_sutra_ha_api
                      continue_on_error: true
                      data:
                        mode: services
                        has_service: "light.{{ 'increase_brightness' if _mode == 'brightness_increase' else 'decrease_brightness' }}"
                      response_variable: _step_svc_check
                    - if: "{{ not (_step_svc_check is mapping and _step_svc_check.get('found', false) == true) }}"
                      then:
                        - variables:
                            result:
                              status: error
                              error: spook_version_required
                              mode: "{{ _mode }}"
                              message: >-
                                {{ _mode }} requires Spook v5.2.0+ (no safe
                                core fallback -- light.turn_on's own
                                brightness_step_pct turns off lights on and
                                flattens groups, the exact bug this mode
                                exists to avoid). Nothing was changed.
                              caller_token: "{{ _caller_token }}"
              - if: "{{ result is not defined }}"
                then:
                  - action: "light.{{ 'increase_brightness' if _mode == 'brightness_increase' else 'decrease_brightness' }}"
                    target:
                      entity_id: "{{ _resolved_entity }}"
                    data:
                      step_pct: "{{ _step_pct }}"
                      transition: "{{ _transition }}"
                  - variables:
                      result:
                        status: ok
                        mode: "{{ _mode }}"
                        entity: "{{ _resolved_entity }}"
                        step_pct: "{{ _step_pct }}"
                        transition: "{{ _transition }}"
                        room_manager_advisory: "{{ 'Room Manager active (' + _rm_state + ') — occupancy automation may override this command' if _rm_active else none }}"
                        caller_token: "{{ _caller_token }}"
          # ── EFFECT_SET (Spook v5.2.0+) ────────────────────────────────────────
          # 2026-08-30 (Vee + household, hot tub lights as the motivating case --
          # confirmed live those carry a real effect_list + EFFECT feature
          # flag already, no extra wiring needed once this mode exists).
          # Generic to any light with an effect_list -- not integration-
          # specific, works the same for a Govee-on-local-control light as
          # for the spa's own color-wheel channel.
          - conditions: "{{ _mode == 'effect_set' }}"
            sequence:
              - if: "{{ _effect_want == '' or _resolved_entity == '' }}"
                then:
                  - variables:
                      result:
                        status: error
                        mode: effect_set
                        error: "effect and room/entity required."
                        caller_token: "{{ _caller_token }}"
              - if: "{{ result is not defined and (_effects | count) > 0 and _effect_want not in _effects }}"
                then:
                  - variables:
                      result:
                        status: error
                        mode: effect_set
                        error: >-
                          '{{ _effect_want }}' not in this entity's
                          effect_list: {{ _effects }}.
                        caller_token: "{{ _caller_token }}"
              - if: "{{ result is not defined }}"
                then:
                - if: "{{ _dry_run }}"
                  then:
                    - variables:
                        result:
                          status: ok
                          dry_run: true
                          would_set_entity: "{{ _resolved_entity }}"
                          would_set_effect: "{{ _effect_want }}"
                          caller_token: "{{ _caller_token }}"
                - if: "{{ result is not defined }}"
                  then:
                    - action: script.zen_sutra_ha_api
                      continue_on_error: true
                      data:
                        mode: services
                        has_service: light.set_effect
                      response_variable: _fx_svc_check
                    - if: "{{ not (_fx_svc_check is mapping and _fx_svc_check.get('found', false) == true) }}"
                      then:
                        - variables:
                            result:
                              status: error
                              error: spook_version_required
                              mode: effect_set
                              message: >-
                                effect_set requires Spook v5.2.0+
                                (light.set_effect not found). Nothing was
                                changed.
                              caller_token: "{{ _caller_token }}"
              - if: "{{ result is not defined }}"
                then:
                  - action: light.set_effect
                    target:
                      entity_id: "{{ _resolved_entity }}"
                    data:
                      effect: "{{ _effect_want }}"
                  - variables:
                      result:
                        status: ok
                        mode: effect_set
                        entity: "{{ _resolved_entity }}"
                        effect: "{{ _effect_want }}"
                        room_manager_advisory: "{{ 'Room Manager active (' + _rm_state + ') — occupancy automation may override this command' if _rm_active else none }}"
                        caller_token: "{{ _caller_token }}"
          - conditions: "{{ _mode == 'scene_set' }}"
            sequence:
              - if: "{{ _scene == '' and _intent == '' }}"
                then:
                  - variables:
                      result:
                        status: error
                        error: "scene entity_id or intent required for scene_set."
                        caller_token: "{{ _caller_token }}"

              # HA scene entity path
              - if: "{{ result is not defined }}"
                then:
                - if: "{{ _scene != '' }}"
                  then:
                    - if: "{{ not _dry_run }}"
                      then:
                        - action: scene.turn_on
                          target:
                            entity_id: "{{ _scene }}"
                          data:
                            transition: "{{ _transition }}"
                    - variables:
                        result:
                          status: ok
                          mode: scene_set
                          dry_run: "{{ _dry_run }}"
                          scene: "{{ _scene }}"
                          caller_token: "{{ _caller_token }}"

                - if: "{{ result is not defined }}"
                  then:
                  # Intent preset path
                  - if: "{{ not _dry_run and _resolved_entity != '' }}"
                    then:
                      - if: "{{ _intent_bri | int(0) == 0 }}"
                        then:
                          - action: light.turn_off
                            target:
                              entity_id: "{{ _resolved_entity }}"
                            data:
                              transition: "{{ _transition }}"
                        else:
                          - action: light.turn_on
                            target:
                              entity_id: "{{ _resolved_entity }}"
                            data:
                              brightness: "{{ (_intent_bri | int * 2.55) | round(0) | int }}"
                              color_temp_kelvin: >-
                                {{ _intent_ct_k | int
                                   if (_intent_ct_k | int(-1) > 0 and _has_ct) else omit }}
                              transition: "{{ _transition }}"
                  - variables:
                      result:
                        status: ok
                        mode: scene_set
                        dry_run: "{{ _dry_run }}"
                        intent: "{{ _intent }}"
                        entity: "{{ _resolved_entity }}"
                        applied:
                          role: "{{ _intent_role }}"
                          brightness_pct: "{{ _intent_bri }}"
                          color_temp_k: "{{ _intent_ct_k if _intent_ct_k | int(-1) > 0 else none }}"
                        room_manager_advisory: "{{ 'Room Manager active (' + _rm_state + ') — occupancy automation may override this command' if _rm_active else none }}"
                        caller_token: "{{ _caller_token }}"
          - conditions: "{{ _mode == 'prefs_set' }}"
            sequence:
              - if: "{{ _room_slug == '' or _context_raw == '' or _hh_cabinet in ['','unavailable','unknown'] }}"
                then:
                  - variables:
                      result:
                        status: error
                        error: "room and home_context required. Household cabinet must be reachable."
                        caller_token: "{{ _caller_token }}"
              - if: "{{ result is not defined }}"
                then:
                - action: script.zen_dojotools_filecabinet
                  data:
                    action_type: read
                    key: "light_prefs_{{ _room_slug }}"
                    volume_entity_id: "{{ _hh_cabinet }}"
                    caller_token: "{{ _caller_token }}"
                  response_variable: _fc_ps_existing
                - variables:
                    _ps_existing: >-
                      {%- set r = _fc_ps_existing.get('result', {}) if _fc_ps_existing is mapping else {} -%}
                      {%- set d = r.get('light_prefs_' + _room_slug, {}) if r is mapping else {} -%}
                      {{ d.get('value', d) if d is mapping and d else {} }}
                - variables:
                    _new_entry: >-
                      {%- set e = {} -%}
                      {%- if _target_role != '' -%}{%- set e = dict(e, target_role=_target_role) -%}{%- endif -%}
                      {%- if _brightness >= 0 -%}{%- set e = dict(e, brightness=_brightness) -%}{%- endif -%}
                      {%- if _color_temp_k > 0 -%}{%- set e = dict(e, color_temp_k=_color_temp_k) -%}{%- endif -%}
                      {%- if _rgb_raw != '' -%}{%- set e = dict(e, rgb_color=_rgb_raw) -%}{%- endif -%}
                      {%- if _scene != '' -%}{%- set e = dict(e, scene_entity=_scene) -%}{%- endif -%}
                      {%- if _transition != 1 -%}{%- set e = dict(e, transition=_transition) -%}{%- endif -%}
                      {{ e }}
                - variables:
                    _merged: >-
                      {{ dict((_ps_existing if _ps_existing is mapping else {}), **{_context_raw: _new_entry}) }}
                - action: script.zen_dojotools_filecabinet
                  data:
                    action_type: "{{ 'update' if (_ps_existing is mapping and _ps_existing | length > 0) else 'create' }}"
                    key: "light_prefs_{{ _room_slug }}"
                    volume_entity_id: "{{ _hh_cabinet }}"
                    value: "{{ _merged | tojson }}"
                    description: "ZenLux prefs — {{ _room_slug }}"
                    caller_token: "{{ _caller_token }}"
                  response_variable: _fc_ps_write
                - variables:
                    result:
                      status: ok
                      mode: prefs_set
                      room: "{{ _room_slug }}"
                      context: "{{ _context_raw }}"
                      stored: "{{ _new_entry }}"
                      caller_token: "{{ _caller_token }}"
          - conditions: "{{ _mode == 'prefs_apply' }}"
            sequence:
              - if: "{{ _room_slug == '' or _hh_cabinet in ['','unavailable','unknown'] }}"
                then:
                  - variables:
                      result:
                        status: error
                        error: "room required. Household cabinet must be reachable."
                        caller_token: "{{ _caller_token }}"
              - if: "{{ result is not defined }}"
                then:
                - variables:
                    _apply_ctx: >-
                      {%- if _context_raw != '' -%}
                        {{ _context_raw }}
                      {%- elif _rm_entity != '' -%}
                        {%- set _rm_map = {'engaged': 'work', 'asleep': 'sleep', 'away': 'away'} -%}
                        {%- set _rm_ctx = _rm_map.get(_rm_state | lower, '') -%}
                        {{ _rm_ctx if _rm_ctx != '' else states('input_select.zen_home_mode') | lower | replace(' ','_') }}
                      {%- else -%}
                        {{ states('input_select.zen_home_mode') | lower | replace(' ','_') }}
                      {%- endif -%}
                    _apply_ctx_source: >-
                      {%- if _context_raw != '' -%}explicit
                      {%- elif _rm_entity != '' -%}
                        {%- set _rm_map = {'engaged': 'work', 'asleep': 'sleep', 'away': 'away'} -%}
                        {{ 'room_manager' if _rm_map.get(_rm_state | lower, '') != '' else 'zen_home_mode' }}
                      {%- else -%}zen_home_mode
                      {%- endif -%}
                - action: script.zen_dojotools_filecabinet
                  data:
                    action_type: read
                    key: "light_prefs_{{ _room_slug }}"
                    volume_entity_id: "{{ _hh_cabinet }}"
                    caller_token: "{{ _caller_token }}"
                  response_variable: _fc_pa
                - variables:
                    _pa_all: >-
                      {%- set r = _fc_pa.get('result', {}) if _fc_pa is mapping else {} -%}
                      {%- set d = r.get('light_prefs_' + _room_slug, {}) if r is mapping else {} -%}
                      {{ d.get('value', d) if d is mapping else {} }}
                - variables:
                    _pa_pref: >-
                      {{ _pa_all.get(_apply_ctx, {}) if _pa_all is mapping else {} }}
                - if: "{{ not _pa_pref or not (_pa_pref is mapping) or _pa_pref | length == 0 }}"
                  then:
                    - variables:
                        result:
                          status: not_found
                          mode: prefs_apply
                          room: "{{ _room_slug }}"
                          context: "{{ _apply_ctx }}"
                          message: "No pref stored for this room + context. Use prefs_set first."
                          available_contexts: "{{ _pa_all.keys() | list if _pa_all is mapping else [] }}"
                          caller_token: "{{ _caller_token }}"
                - if: "{{ result is not defined }}"
                  then:
                  - variables:
                      _pa_role:   "{{ _pa_pref.get('target_role', '') }}"
                      _pa_bri:    "{{ _pa_pref.get('brightness', -1) | int(-1) }}"
                      _pa_ct_k:   "{{ _pa_pref.get('color_temp_k', -1) | int(-1) }}"
                      _pa_rgb:    "{{ _pa_pref.get('rgb_color', '') }}"
                      _pa_scene:  "{{ _pa_pref.get('scene_entity', '') }}"
                      _pa_trans:  "{{ _pa_pref.get('transition', _transition) | int(1) }}"
                  - variables:
                      _pa_entity: >-
                        {%- if _pa_role != '' -%}
                          {{ _room_ents | select('in', label_entities(_pa_role)) | list | first | default(_auto_resolved) }}
                        {%- else -%}{{ _auto_resolved }}{%- endif -%}
                  # "Block travels up the chain" part 2 (2026-08-16, household:
                  # "fix those pls") -- prefs_apply's real target isn't
                  # known until the stored pref is read and its role
                  # resolved (right above), well after the earlier deny
                  # gate (0g2) already ran against '' -- so it was never
                  # covered. Checked here against both possible targets
                  # (the resolved light entity, and the stored scene if the
                  # pref includes one) -- deny on either blocks the whole
                  # apply, matching brightness_set/rgb_set/etc.'s single-
                  # target block semantics rather than bleed_set's partial-
                  # skip (a room's stored "look" is one unit, not a
                  # multi-room propagation).
                  - variables:
                      _pa_denied_target: >-
                        {%- import 'zenos_ai/zen_os_1.jinja' as OS -%}
                        {%- if _pa_entity != '' and OS.cert_scope_check(_zl_cert_scope, _pa_entity) | trim == 'deny' -%}
                          {{ _pa_entity }}
                        {%- elif _pa_scene != '' and OS.cert_scope_check(_zl_cert_scope, _pa_scene) | trim == 'deny' -%}
                          {{ _pa_scene }}
                        {%- else -%}{{ '' }}{%- endif -%}
                  - if: "{{ _pa_denied_target != '' }}"
                    then:
                      - variables:
                          result:
                            ok: false
                            status: error
                            mode: prefs_apply
                            error: cert_scope_denied
                            detail: >-
                              lighting_control cert_scope explicitly denies
                              '{{ _pa_denied_target }}' -- an admin has
                              scoped this entity out via cert_grant
                              cert_scope=[{"entity":"{{ _pa_denied_target }}",
                              "acl":"deny"}]. Removing the denial requires
                              cert_grant cert_scope=[{"entity":
                              "{{ _pa_denied_target }}","acl":"remove"}].
                            target_entity: "{{ _pa_denied_target }}"
                            caller_token: "{{ _caller_token }}"
                  - if: "{{ result is not defined and _dry_run }}"
                    then:
                      - variables:
                          result:
                            status: ok
                            dry_run: true
                            mode: prefs_apply
                            room: "{{ _room_slug }}"
                            context: "{{ _apply_ctx }}"
                            would_set_entity: "{{ _pa_entity }}"
                            would_set_brightness_pct: "{{ _pa_bri if _pa_bri >= 0 else none }}"
                            would_set_color_temp_k: "{{ _pa_ct_k if _pa_ct_k > 0 else none }}"
                            would_set_rgb: "{{ _pa_rgb if _pa_rgb != '' else none }}"
                            would_activate_scene: "{{ _pa_scene if _pa_scene != '' else none }}"
                            caller_token: "{{ _caller_token }}"
                  - if: "{{ result is not defined }}"
                    then:
                    - if: "{{ _pa_scene != '' }}"
                      then:
                        - action: scene.turn_on
                          target:
                            entity_id: "{{ _pa_scene }}"
                          data:
                            transition: "{{ _pa_trans }}"
                    - if: "{{ _pa_bri >= 0 and _pa_entity != '' }}"
                      then:
                        - if: "{{ _pa_bri == 0 }}"
                          then:
                            - action: light.turn_off
                              target:
                                entity_id: "{{ _pa_entity }}"
                              data:
                                transition: "{{ _pa_trans }}"
                          else:
                            - action: light.turn_on
                              target:
                                entity_id: "{{ _pa_entity }}"
                              data:
                                brightness: "{{ (_pa_bri * 2.55) | round(0) | int }}"
                                color_temp_kelvin: >-
                                  {{ _pa_ct_k | int
                                     if _pa_ct_k > 0 else omit }}
                                transition: "{{ _pa_trans }}"
                    - variables:
                        result:
                          status: ok
                          mode: prefs_apply
                          room: "{{ _room_slug }}"
                          context: "{{ _apply_ctx }}"
                          context_source: "{{ _apply_ctx_source | trim }}"
                          entity: "{{ _pa_entity }}"
                          applied:
                            brightness_pct: "{{ _pa_bri if _pa_bri >= 0 else none }}"
                            color_temp_k: "{{ _pa_ct_k if _pa_ct_k > 0 else none }}"
                            rgb_color: "{{ _pa_rgb if _pa_rgb != '' else none }}"
                            scene_entity: "{{ _pa_scene if _pa_scene != '' else none }}"
                            transition: "{{ _pa_trans }}"
                          dusk_dawn_warning: >-
                            {{ 'auto-managed entity — verify photosensor not fighting command'
                               if _pa_entity in (label_entities('zen_lm_dusk_dawn') | list) else none }}
                          room_manager_advisory: "{{ 'Room Manager active (' + _rm_state + ') — occupancy automation may override this command' if _rm_active else none }}"
                          caller_token: "{{ _caller_token }}"
          - conditions: "{{ _mode == 'room_default_set' }}"
            sequence:
              - if: "{{ _room_slug == '' or _target_role == '' or _hh_cabinet in ['','unavailable','unknown'] }}"
                then:
                  - variables:
                      result:
                        status: error
                        error: "room and target_role required. Pass target_role=auto to clear."
                        caller_token: "{{ _caller_token }}"
              - if: "{{ result is not defined }}"
                then:
                - action: script.zen_dojotools_filecabinet
                  data:
                    action_type: read
                    key: "light_prefs_{{ _room_slug }}"
                    volume_entity_id: "{{ _hh_cabinet }}"
                    caller_token: "{{ _caller_token }}"
                  response_variable: _fc_rds
                - variables:
                    _rds_existing: >-
                      {%- set r = _fc_rds.get('result', {}) if _fc_rds is mapping else {} -%}
                      {%- set d = r.get('light_prefs_' + _room_slug, {}) if r is mapping else {} -%}
                      {{ d.get('value', d) if d is mapping and d else {} }}
                - variables:
                    _rds_merged: >-
                      {{ dict((_rds_existing if _rds_existing is mapping else {}), default_role=_target_role) }}
                - action: script.zen_dojotools_filecabinet
                  data:
                    action_type: "{{ 'update' if (_rds_existing is mapping and _rds_existing | length > 0) else 'create' }}"
                    key: "light_prefs_{{ _room_slug }}"
                    volume_entity_id: "{{ _hh_cabinet }}"
                    value: "{{ _rds_merged | tojson }}"
                    description: "ZenLux prefs — {{ _room_slug }}"
                    caller_token: "{{ _caller_token }}"
                  response_variable: _fc_rds_write
                - variables:
                    result:
                      status: ok
                      mode: room_default_set
                      room: "{{ _room_slug }}"
                      default_role: "{{ _target_role }}"
                      note: "Pass target_role=auto to clear back to auto-chain."
                      caller_token: "{{ _caller_token }}"
          # scene_stage -- relocated from zen_dojotools_room_manager
          # 2026-08-16 (household: "put the appr scene handlers in zenlux as
          # necc"). Works around scene.create's real platform limit (never
          # persists, gone on restart). before/after: ephemeral snapshot
          # pair. confirm: auto-detects the real scene the human saved by
          # hand and tags it for REFLEX.
          - conditions: "{{ _mode == 'scene_stage' }}"
            sequence:
              - variables:
                  _ss_phase: "{{ scene_phase | default('', true) | lower | trim }}"
                  _ss_tier: "{{ scene_tier | default('', true) | lower | trim }}"
                  _ss_daypart: "{{ scene_daypart | default('', true) | lower | trim }}"
                  _ss_name_hint: "{{ scene_name_hint | default('', true) | trim }}"
                  _ss_area_id: "{{ _room_area_id }}"
              - if: "{{ _ss_area_id == '' or _ss_phase not in ['before', 'after', 'confirm'] }}"
                then:
                  - variables:
                      result: {status: error, mode: scene_stage, message: "room= (must resolve to a real area) and scene_phase=before|after|confirm both required.", caller_token: "{{ _caller_token }}"}

              - if: "{{ result is not defined }}"
                then:
                - if: "{{ _ss_phase in ['before', 'after'] }}"
                  then:
                    - variables:
                        _ss_domains: ['light', 'cover', 'climate', 'media_player', 'switch', 'fan', 'humidifier']
                        _ss_snapshot_ents: >-
                          {%- set ns = namespace(list=[]) -%}
                          {%- for e in area_entities(_ss_area_id) -%}
                            {%- if e.split('.')[0] in ['light', 'cover', 'climate', 'media_player', 'switch', 'fan', 'humidifier'] -%}
                              {%- set ns.list = ns.list + [e] -%}
                            {%- endif -%}
                          {%- endfor -%}
                          {{ ns.list }}
                    - if: "{{ _ss_snapshot_ents | length == 0 }}"
                      then:
                        - variables:
                            result:
                              status: error
                              mode: scene_stage
                              area: "{{ _ss_area_id }}"
                              error: no_entities
                              detail: "No light/cover/climate/media_player/switch/fan/humidifier entities found in area '{{ _ss_area_id }}' to snapshot."
                              caller_token: "{{ _caller_token }}"
                      else:
                        - action: scene.create
                          continue_on_error: true
                          data:
                            scene_id: "zen_stage_{{ _ss_area_id }}_{{ _ss_phase }}"
                            snapshot_entities: "{{ _ss_snapshot_ents }}"
                        - variables:
                            result:
                              status: ok
                              mode: scene_stage
                              phase: "{{ _ss_phase }}"
                              area: "{{ _ss_area_id }}"
                              staged_scene: "scene.zen_stage_{{ _ss_area_id }}_{{ _ss_phase }}"
                              entities_captured: "{{ _ss_snapshot_ents }}"
                              ephemeral: true
                              note: >-
                                {%- if _ss_phase == 'before' -%}
                                  This is a live in-memory scene -- it vanishes on the next HA restart. That's HA's own design for scene.create, not a bug on our end. Kept as an undo reference for the staged look about to be applied.
                                {%- else -%}
                                  This captures the STAGED target look. To make it permanent: Settings -> Automations & Scenes -> Scenes, open scene.zen_stage_{{ _ss_area_id }}_after, and Save it under whatever real name you want{{ ' (suggested: ' ~ _ss_name_hint ~ ')' if _ss_name_hint != '' else '' }}. Once saved for real, call mode=scene_stage room={{ _ss_area_id }} scene_phase=confirm{{ ' scene_tier=' ~ _ss_tier if _ss_tier != '' else '' }} to auto-tag it for REFLEX.
                                {%- endif -%}
                              caller_token: "{{ _caller_token }}"

                - if: "{{ _ss_phase == 'confirm' }}"
                  then:
                    # Same name/label/area_id candidate-match logic as room_manager's
                    # own reflex_wire _rw_candidates, restricted to untagged scenes
                    # (an already-tagged scene was matched and wired on a PRIOR
                    # confirm call, never re-surfaced) and excluding our own
                    # ephemeral zen_stage_ scratch scenes.
                    - variables:
                        _ss_candidates: >-
                          {%- set ns = namespace(list=[]) -%}
                          {%- for e in states.scene -%}
                            {%- if not (e.entity_id.startswith('scene.zen_stage_')) -%}
                              {%- set _name_match = _ss_area_id in (e.entity_id | lower) or _ss_area_id in (e.name | lower | replace(' ', '_') | replace('-', '_')) -%}
                              {%- set _label_match = _ss_area_id in labels(e.entity_id) -%}
                              {%- set _area_match = area_id(e.entity_id) == _ss_area_id -%}
                              {%- set _already_tagged = (('scene_' ~ _ss_tier) in labels(e.entity_id)) if _ss_tier != '' else (_ss_area_id in labels(e.entity_id)) -%}
                              {%- if (_name_match or _label_match or _area_match) and not _already_tagged -%}
                                {%- set ns.list = ns.list + [{'entity_id': e.entity_id, 'friendly_name': e.name, 'current_labels': labels(e.entity_id)}] -%}
                              {%- endif -%}
                            {%- endif -%}
                          {%- endfor -%}
                          {{ ns.list }}
                    - if: "{{ _ss_candidates | length == 0 }}"
                      then:
                        - variables:
                            result:
                              status: needs_human
                              mode: scene_stage
                              area: "{{ _ss_area_id }}"
                              message: "No matching untagged real scene found for '{{ _ss_area_id }}' -- did you save it yet? If it's saved under a name that doesn't mention the room, tell me the exact entity_id and I'll tag it directly."
                              caller_token: "{{ _caller_token }}"
                    - if: "{{ _ss_candidates | length > 1 }}"
                      then:
                        - variables:
                            result:
                              status: ambiguous
                              mode: scene_stage
                              area: "{{ _ss_area_id }}"
                              candidates: "{{ _ss_candidates }}"
                              message: "Found {{ _ss_candidates | length }} possible matches -- tell me which entity_id is the one you just saved."
                              caller_token: "{{ _caller_token }}"
                    - if: "{{ result is not defined }}"
                      then:
                        - variables:
                            _ss_target_scene: "{{ _ss_candidates[0].entity_id }}"
                            _ss_tag_list: >-
                              {%- set ns = namespace(list=[_ss_area_id]) -%}
                              {%- if _ss_tier != '' -%}{%- set ns.list = ns.list + ['scene_' ~ _ss_tier] -%}{%- endif -%}
                              {%- if _ss_daypart != '' -%}{%- set ns.list = ns.list + [_ss_daypart] -%}{%- endif -%}
                              {{ ns.list }}
                        - action: script.zen_dojotools_labels
                          data:
                            action_type: tag
                            label_list: "{{ _ss_tag_list }}"
                            target_entities: ["{{ _ss_target_scene }}"]
                            confirm: true
                          response_variable: _ss_tag_result
                        - variables:
                            result:
                              status: ok
                              mode: scene_stage
                              area: "{{ _ss_area_id }}"
                              tagged_scene: "{{ _ss_target_scene }}"
                              tags_applied: "{{ _ss_tag_list }}"
                              note: "Real, persisted scene tagged and REFLEX-wireable. Run zen_dojotools_room_manager mode=reflex_wire area={{ _ss_area_id }} to confirm it resolves correctly."
                              caller_token: "{{ _caller_token }}"

          - conditions: "{{ _mode == 'auto_label' }}"
            sequence:
              - if: "{{ _room_slug == '' }}"
                then:
                  - variables:
                      result:
                        status: error
                        error: room_required
                        message: "auto_label requires room=. Example: room='Office'."
                        caller_token: "{{ _caller_token }}"

              - if: "{{ result is not defined }}"
                then:
                - variables:
                    _al_already:   "{{ _room_ents | select('in', label_entities(_room_slug) | list) | list }}"
                    _al_unlabeled: "{{ _room_ents | reject('in', label_entities(_room_slug) | list) | list }}"

                - if: "{{ _dry_run or _al_unlabeled | length == 0 }}"
                  then:
                    - variables:
                        result:
                          status: "{{ 'dry_run' if _dry_run else 'ok' }}"
                          mode: auto_label
                          room: "{{ _room_slug }}"
                          label: "{{ _room_slug }}"
                          total_area_lights: "{{ _room_ents | length }}"
                          already_labeled_count: "{{ _al_already | length }}"
                          would_label: "{{ _al_unlabeled }}"
                          would_label_count: "{{ _al_unlabeled | length }}"
                          dispatched: false
                          message: >-
                            {%- if _al_unlabeled | length == 0 -%}
                              All {{ _room_ents | length }} area lights already carry the '{{ _room_slug }}' label.
                            {%- else -%}
                              dry_run: {{ _al_unlabeled | length }} unlabeled light(s) found. Set dry_run=false to tag them.
                            {%- endif -%}
                          next_step: >-
                            {%- if _al_unlabeled | length == 0 -%}
                              discover room={{ _room_slug }}
                            {%- else -%}
                              Call again with dry_run=false to apply '{{ _room_slug }}' label to {{ _al_unlabeled | length }} light(s)
                            {%- endif -%}
                          caller_token: "{{ _caller_token }}"

                - if: "{{ result is not defined }}"
                  then:
                  - variables:
                      _act_cid: >-
                        {%- set _a = range(0, 65535) | random -%}
                        {%- set _b = range(0, 65535) | random -%}
                        {%- set _c = range(0, 65535) | random -%}
                        {%- set _d = range(0, 65535) | random -%}
                        {{ '%04x%04x-%04x-%04x' | format(_a, _b, _c, _d) }}

                  - event: zen_event
                    event_data:
                      event:
                        kind: dojotool_call
                        tool: zen_dojotools_labels
                        version: "1"
                        correlation_id: "{{ _act_cid }}"
                        payload:
                          action_type: tag
                          target_entities: "{{ _al_unlabeled | tojson }}"
                          label_list: "{{ [_room_slug] | tojson }}"
                          confirm: true
                          caller_token: "{{ _caller_token }}"

                  - wait_for_trigger:
                      - trigger: event
                        event_type: zen_event
                        event_data:
                          event:
                            kind: dojotool_return
                            correlation_id: "{{ _act_cid }}"
                    timeout: "00:00:30"
                    continue_on_timeout: true

                  - variables:
                      _al_timed_out: "{{ wait.trigger is none }}"

                  - variables:
                      _al_label_result: >-
                        {%- if not _al_timed_out -%}
                          {{ wait.trigger.event.data.event.result | default({}) }}
                        {%- else -%}{{ {} }}{%- endif -%}

                  - variables:
                      result:
                        status: "{{ 'timeout' if _al_timed_out else (_al_label_result.get('status', 'ok') if _al_label_result is mapping else 'ok') }}"
                        mode: auto_label
                        room: "{{ _room_slug }}"
                        label: "{{ _room_slug }}"
                        total_area_lights: "{{ _room_ents | length }}"
                        labeled: "{{ _al_unlabeled }}"
                        labeled_count: "{{ _al_unlabeled | length }}"
                        dispatched: true
                        label_result: "{{ _al_label_result }}"
                        message: >-
                          {%- if _al_timed_out -%}
                            Dispatcher timeout — zen_dojotools_labels did not return within 30s. Check HA logs.
                          {%- else -%}
                            Tagged {{ _al_unlabeled | length }} light(s) with '{{ _room_slug }}'. Run discover room={{ _room_slug }} to verify resolution.
                          {%- endif -%}
                        next_step: "{{ 'discover room=' + _room_slug if not _al_timed_out else 'check HA logs for dispatcher errors' }}"
                        caller_token: "{{ _caller_token }}"
          - conditions: "{{ _mode == 'bleed_set' }}"
            sequence:
              - variables:
                  _bs_eff_bri: >-
                    {{ _brightness if _brightness >= 0
                       else (_intent_bri | int(-1) if _intent != '' else -1) }}
              - if: "{{ _bs_eff_bri < 0 or _room_slug == '' or _resolved_entity == '' }}"
                then:
                  - variables:
                      result:
                        status: error
                        error: "bleed_set requires room= and brightness= (or intent=). No entity resolved."
                        caller_token: "{{ _caller_token }}"

              # Apply to primary room
              - if: "{{ result is not defined }}"
                then:
                - if: "{{ not _dry_run }}"
                  then:
                    - if: "{{ _bs_eff_bri == 0 }}"
                      then:
                        - action: light.turn_off
                          target:
                            entity_id: "{{ _resolved_entity }}"
                          data:
                            transition: "{{ _transition }}"
                      else:
                        - action: light.turn_on
                          target:
                            entity_id: "{{ _resolved_entity }}"
                          data:
                            brightness: "{{ (_bs_eff_bri * 2.55) | round(0) | int }}"
                            color_temp_kelvin: >-
                              {{ _intent_ct_k | int
                                 if (_intent_ct_k | int(-1) > 0 and _has_ct) else omit }}
                            transition: "{{ _transition }}"

                # Read topology inline from cabinet
                - variables:
                    _bs_topo: >-
                      {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}{%- set topo = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'room_topology') | from_json -%}
                      {{ topo.get(_room_area_id, none) if _room_area_id != '' else none }}
                    _bs_threshold: "{{ bleed_threshold | default(0.20) | float(0.20) }}"

                # Live door state — gate normally-closed portals (RM +topo inline)
                - variables:
                    _bs_open_sensors: >-
                      {%- if _room_area_id != '' -%}
                        {%- set _contact_dc = ['door', 'window', 'opening'] -%}
                        {%- set ns = namespace(ids=[]) -%}
                        {%- for eid in area_entities(_room_area_id) | select('match', 'binary_sensor\\.') -%}
                          {%- set _dc = state_attr(eid, 'device_class') | default('', true) | lower -%}
                          {%- if _dc in _contact_dc and states(eid) == 'on' -%}{%- set ns.ids = ns.ids + [eid] -%}{%- endif -%}
                        {%- endfor -%}
                        {{ ns.ids }}
                      {%- else -%}{{ [] }}{%- endif -%}

                # Build bleed map from portals + boundary_links
                - variables:
                    _bs_bleed_map: >-
                      {%- set _sp=_bs_topo if _bs_topo is mapping else {} -%}
                      {%- set ns=namespace(b=[]) -%}
                      {%- for p in (_sp.get('portals',[])|list) -%}
                        {%- if p is mapping and p.get('to',none) is not none -%}
                          {%- set _ltx=p.get('light_tx',0.0)|float(0.0) -%}
                          {%- set _normally=p.get('normally','open') -%}
                          {%- set _door_open=_normally != 'closed' or _bs_open_sensors|count > 0 -%}
                          {%- if _ltx >= _bs_threshold and _door_open -%}
                            {%- set _bmode='propagate' if _ltx >= 0.65 else 'scale' -%}
                            {%- set _bbri=(_bs_eff_bri | int) if _ltx >= 0.65 else ((_bs_eff_bri | int * _ltx) | round(0) | int) -%}
                            {%- set ns.b=ns.b+[{'to':p.get('to'),'source':'portal','light_tx':_ltx,'blend_mode':_bmode,'bleed_bri':_bbri}] -%}
                          {%- endif -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {%- for bl in (_sp.get('boundary_links',[])|list) -%}
                        {%- if bl is mapping and bl.get('to',none) is not none -%}
                          {%- set _ltx=bl.get('light_tx',0.0)|float(0.0) -%}
                          {%- if _ltx >= _bs_threshold -%}
                            {%- set _bmode='propagate' if _ltx >= 0.65 else 'scale' -%}
                            {%- set _bbri=(_bs_eff_bri | int) if _ltx >= 0.65 else ((_bs_eff_bri | int * _ltx) | round(0) | int) -%}
                            {%- set ns.b=ns.b+[{'to':bl.get('to'),'source':'boundary_link','light_tx':_ltx,'blend_mode':_bmode,'bleed_bri':_bbri}] -%}
                          {%- endif -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {{ ns.b | sort(attribute='light_tx', reverse=true) }}

                # "Block travels up the chain" (2026-08-16, household: "fix those
                # pls" -- the two gaps flagged in the deny-enforcement
                # commit). bleed_set's propagation targets are resolved
                # per-adjacent-room INSIDE this repeat loop -- the earlier
                # deny gate (0g2) only ever saw the PRIMARY target, so a
                # denied lamp in an adjacent room's bleed path was never
                # checked. Each iteration now re-checks cert_scope_check
                # against its own resolved _bt_main (reusing the same
                # _zl_cert_scope already fetched once by the cert gate, no
                # extra identity call) and skips actuation on deny --
                # doesn't abort the whole bleed_set, just that one member,
                # same as a real chain-propagated block should behave.
                - variables:
                    _bs_denied_targets: []
                - if: "{{ not _dry_run and _bs_bleed_map | length > 0 }}"
                  then:
                    - repeat:
                        for_each: "{{ _bs_bleed_map }}"
                        sequence:
                          - variables:
                              _bt_main: >-
                                {%- set _bl_ents=area_entities(repeat.item.to)|select('match','light\\.')|list -%}
                                {%- set t1=_bl_ents|select('in',label_entities('zen_lm_group')|list)|list -%}
                                {%- set t2=_bl_ents|select('in',label_entities('zen_lm_main')|list)|list -%}
                                {%- set t3=_bl_ents|select('in',label_entities('main_lighting')|list)|list -%}
                                {%- set t4=_bl_ents|select('in',label_entities('lighting')|list)|list -%}
                                {{ (t1|first) if t1 else ((t2|first) if t2 else ((t3|first) if t3 else ((t4|first) if t4 else (_bl_ents|first|default(''))))) }}
                          - variables:
                              _bt_denied: >-
                                {%- import 'zenos_ai/zen_os_1.jinja' as OS -%}
                                {{ (OS.cert_scope_check(_zl_cert_scope, _bt_main) | trim == 'deny') if _bt_main != '' else false }}
                          - if: "{{ _bt_denied }}"
                            then:
                              - variables:
                                  _bs_denied_targets: "{{ _bs_denied_targets + [_bt_main] }}"
                          - if: "{{ _bt_main != '' and not _bt_denied }}"
                            then:
                              - if: "{{ repeat.item.bleed_bri | int == 0 }}"
                                then:
                                  - action: light.turn_off
                                    target:
                                      entity_id: "{{ _bt_main }}"
                                    data:
                                      transition: "{{ _transition }}"
                                else:
                                  - action: light.turn_on
                                    target:
                                      entity_id: "{{ _bt_main }}"
                                    data:
                                      brightness: "{{ (repeat.item.bleed_bri | int * 2.55) | round(0) | int }}"
                                      color_temp_kelvin: >-
                                        {{ _intent_ct_k | int
                                           if (_intent_ct_k | int(-1) > 0) else omit }}
                                      transition: "{{ _transition }}"

                - variables:
                    result:
                      status: ok
                      mode: bleed_set
                      dry_run: "{{ _dry_run }}"
                      primary:
                        room: "{{ _room_slug }}"
                        entity: "{{ _resolved_entity }}"
                        brightness_pct: "{{ _bs_eff_bri }}"
                        intent: "{{ _intent if _intent != '' else none }}"
                        color_temp_k: "{{ _intent_ct_k if _intent_ct_k | int(-1) > 0 else none }}"
                      bleed_applied: "{{ _bs_bleed_map }}"
                      bleed_count: "{{ _bs_bleed_map | length }}"
                      denied_targets: "{{ _bs_denied_targets if _bs_denied_targets | length > 0 else none }}"
                      threshold_used: "{{ _bs_threshold }}"
                      topology_source: "{{ 'room_manager' if _bs_topo is mapping else 'none — register room first via zen_dojotools_room_manager' }}"
                      blend_modes: "propagate (light_tx≥0.65) = same brightness as primary. scale (0.20-0.65) = primary_bri × light_tx."
                      door_gate_active: "{{ _bs_open_sensors | count == 0 }}"
                      open_sensors_in_area: "{{ _bs_open_sensors }}"
                      room_manager_advisory: "{{ 'Room Manager active (' + _rm_state + ') — occupancy automation may override adjacent room commands' if _rm_active else none }}"
                      shade_sync: none
                      caller_token: "{{ _caller_token }}"

                - if: "{{ _sync_shades and _shade_scene != '' and _room_area_id != '' and not _dry_run }}"
                  then:
                    - action: script.zen_dojotools_covers
                      data:
                        mode: scene_set
                        room: "{{ _room_area_id }}"
                        scene: "{{ _shade_scene }}"
                      response_variable: _shade_raw
                    - variables:
                        result: >-
                          {{ result | combine({'shade_sync': {
                            'status': _shade_raw.status | default('unknown'),
                            'scene': _shade_scene,
                            'applied_count': _shade_raw.applied_count | default(0),
                            'tilt_applied_count': _shade_raw.tilt_applied_count | default(0)
                          }}) }}

          - conditions: "{{ _mode == 'prefs_sweep' }}"
            sequence:
              - if: "{{ _hh_cabinet in ['','unavailable','unknown'] }}"
                then:
                  - variables:
                      result:
                        status: error
                        error: "Household cabinet not reachable."
                        caller_token: "{{ _caller_token }}"
              - if: "{{ result is not defined }}"
                then:
                - variables:
                    _sweep_ctx: >-
                      {{ _context_raw if _context_raw != ''
                         else states('input_select.zen_home_mode') | lower | replace(' ','_') }}
                - variables:
                    _sweep_vars: "{{ state_attr(_hh_cabinet, 'variables') | default({}, true) }}"
                - variables:
                    _sweep_found: >-
                      {%- set ns = namespace(rooms=[]) -%}
                      {%- for k, v in _sweep_vars.items() -%}
                        {%- if k.startswith('light_prefs_') -%}
                          {%- set slug = k[12:] -%}
                          {%- set raw = v.get('value', v) if v is mapping else {} -%}
                          {%- set prefs = raw if raw is mapping else (raw | from_json(default={}) if raw is string else {}) -%}
                          {%- set ctx_pref = prefs.get(_sweep_ctx, none) -%}
                          {%- if ctx_pref is not none and ctx_pref is mapping and ctx_pref | length > 0 -%}
                            {%- set ns.rooms = ns.rooms + [{'room': slug, 'pref': ctx_pref}] -%}
                          {%- endif -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {{ ns.rooms }}
                    _sweep_no_pref: >-
                      {%- set ns = namespace(rooms=[]) -%}
                      {%- for k, v in _sweep_vars.items() -%}
                        {%- if k.startswith('light_prefs_') -%}
                          {%- set slug = k[12:] -%}
                          {%- set raw = v.get('value', v) if v is mapping else {} -%}
                          {%- set prefs = raw if raw is mapping else (raw | from_json(default={}) if raw is string else {}) -%}
                          {%- if not (prefs.get(_sweep_ctx, none) is mapping and prefs.get(_sweep_ctx, none) | length > 0) -%}
                            {%- set ns.rooms = ns.rooms + [slug] -%}
                          {%- endif -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {{ ns.rooms }}
                - if: "{{ _dry_run or _sweep_found | length == 0 }}"
                  then:
                    - variables:
                        result:
                          status: "{{ 'dry_run' if _dry_run else 'no_prefs_found' }}"
                          mode: prefs_sweep
                          context: "{{ _sweep_ctx }}"
                          would_apply: "{{ _sweep_found | map(attribute='room') | list }}"
                          no_pref: "{{ _sweep_no_pref }}"
                          caller_token: "{{ _caller_token }}"
                - if: "{{ result is not defined }}"
                  then:
                  - repeat:
                      for_each: "{{ _sweep_found }}"
                      sequence:
                        - variables:
                            _sw_area_id: >-
                              {%- set ns = namespace(aid='') -%}
                              {%- for a in areas() -%}
                                {%- if area_name(a) | lower | replace(' ', '_') == repeat.item.room
                                       or a == repeat.item.room -%}
                                  {%- set ns.aid = a -%}
                                {%- endif -%}
                              {%- endfor -%}
                              {{ ns.aid }}
                        - variables:
                            _sw_ents: >-
                              {{ area_entities(_sw_area_id) | select('match', 'light\.') | list
                                 if _sw_area_id != '' else [] }}
                            _sw_role: "{{ repeat.item.pref.get('target_role', '') }}"
                            _sw_bri: "{{ repeat.item.pref.get('brightness', -1) | int(-1) }}"
                            _sw_ct_k: "{{ repeat.item.pref.get('color_temp_k', -1) | int(-1) }}"
                            _sw_scene: "{{ repeat.item.pref.get('scene_entity', '') }}"
                            _sw_trans: "{{ repeat.item.pref.get('transition', 1) | int(1) }}"
                        - variables:
                            _sw_entity: >-
                              {%- set role_ent = _sw_ents | select('in', label_entities(_sw_role) | list) | list | first | default('')
                                   if _sw_role != '' else '' -%}
                              {%- set grp = _sw_ents | select('in', label_entities('zen_lm_group') | list) | list | first | default('') -%}
                              {%- set main = _sw_ents | select('in', label_entities('zen_lm_main') | list) | list | first | default('') -%}
                              {{ role_ent if role_ent != '' else (grp if grp != '' else (main if main != '' else _sw_ents | first | default(''))) }}
                            _sw_rm_held: >-
                              {%- set rm_ent = label_entities('room_manager')
                                  | select('in', label_entities(repeat.item.room) | list)
                                  | select('match', 'input_select\.') | list | first | default('') -%}
                              {%- set rm_ent = 'input_select.' ~ repeat.item.room ~ '_occupancy'
                                  if rm_ent == '' else rm_ent -%}
                              {{ states(rm_ent) | lower in ['hold', 'pause', 'paused']
                                 if states(rm_ent) not in ['unknown', 'unavailable', ''] else false }}
                        - if: "{{ not _sw_rm_held }}"
                          then:
                            - if: "{{ _sw_scene != '' }}"
                              then:
                                - action: scene.turn_on
                                  target:
                                    entity_id: "{{ _sw_scene }}"
                                  data:
                                    transition: "{{ _sw_trans }}"
                            - if: "{{ _sw_entity != '' and _sw_bri >= 0 }}"
                              then:
                                - if: "{{ _sw_bri == 0 }}"
                                  then:
                                    - action: light.turn_off
                                      target:
                                        entity_id: "{{ _sw_entity }}"
                                      data:
                                        transition: "{{ _sw_trans }}"
                                  else:
                                    - action: light.turn_on
                                      target:
                                        entity_id: "{{ _sw_entity }}"
                                      data:
                                        brightness: "{{ (_sw_bri * 2.55) | round(0) | int }}"
                                        color_temp_kelvin: >-
                                          {{ _sw_ct_k | int if _sw_ct_k > 0 else omit }}
                                        transition: "{{ _sw_trans }}"
                  - variables:
                      result:
                        status: ok
                        mode: prefs_sweep
                        context: "{{ _sweep_ctx }}"
                        applied: "{{ _sweep_found | map(attribute='room') | list }}"
                        no_pref: "{{ _sweep_no_pref }}"
                        note: RM-held rooms were skipped — they appear in applied[] but no hardware was commanded.
                        caller_token: "{{ _caller_token }}"

          # toggle -- domain-agnostic (homeassistant.toggle), works on
          # light.* or switch.* without needing per-domain branching. Fixes
          # zenzork's own mode=toggle call (dead until now -- this mode
          # never existed, so it always fell through to unknown_mode).
          - conditions: "{{ _mode == 'toggle' }}"
            sequence:
              - if: "{{ _entity_id == '' }}"
                then:
                  - variables:
                      result:
                        status: error
                        error: "entity_id required (light.* or switch.*)."
                        caller_token: "{{ _caller_token }}"
              - if: "{{ result is not defined }}"
                then:
                - if: "{{ _dry_run }}"
                  then:
                    - variables:
                        result:
                          status: ok
                          dry_run: true
                          would_toggle: "{{ _entity_id }}"
                          caller_token: "{{ _caller_token }}"
                - if: "{{ result is not defined }}"
                  then:
                  - action: homeassistant.toggle
                    target:
                      entity_id: "{{ _entity_id }}"
                  - variables:
                      result:
                        status: ok
                        mode: toggle
                        entity: "{{ _entity_id }}"
                        caller_token: "{{ _caller_token }}"

          # switch_set -- explicit switch.* write control. entity_id=
          # overrides; otherwise room= (+ optional target_role=) resolves
          # via the switch chain above (_sw_resolved_entity) -- same
          # room/role/'primary'-tiebreak convention as the light modes,
          # just without a fixed role-label taxonomy (2026-08-16, household:
          # "extended into it now").
          - conditions: "{{ _mode == 'switch_set' }}"
            sequence:
              - variables:
                  _sw_state: "{{ switch_state | default('', true) | lower | trim }}"
              - if: "{{ _sw_resolved_entity == '' or _sw_state not in ['on', 'off', 'toggle'] }}"
                then:
                  - variables:
                      result:
                        status: error
                        error: "no switch resolved (pass entity_id=, or room= that resolves to a switch) and switch_state=on|off|toggle both required."
                        caller_token: "{{ _caller_token }}"
              - if: "{{ result is not defined }}"
                then:
                - if: "{{ _dry_run }}"
                  then:
                    - variables:
                        result:
                          status: ok
                          dry_run: true
                          would_set_entity: "{{ _sw_resolved_entity }}"
                          would_set_state: "{{ _sw_state }}"
                          caller_token: "{{ _caller_token }}"
                - if: "{{ result is not defined }}"
                  then:
                  - if: "{{ _sw_state == 'toggle' }}"
                    then:
                      - action: homeassistant.toggle
                        target:
                          entity_id: "{{ _sw_resolved_entity }}"
                    else:
                      - action: "switch.turn_{{ _sw_state }}"
                        target:
                          entity_id: "{{ _sw_resolved_entity }}"
                  - variables:
                      result:
                        status: ok
                        mode: switch_set
                        entity: "{{ _sw_resolved_entity }}"
                        state: "{{ _sw_state }}"
                        caller_token: "{{ _caller_token }}"

        default:
          - variables:
              result:
                status: error
                error: "Unknown mode '{{ _mode }}'. See mode=help for valid modes."
                caller_token: "{{ _caller_token }}"

      # SINGLE EXIT — envelope() wrap (SESE conversion complete 2026-08-16,
      # same shape as locks/covers/security_manager). Every mode, including
      # the choose's own default: unknown_mode branch, sets `result` and
      # falls through to here -- no other stop point exists in this file.
      - if: "{{ result is defined }}"
        then:
          - variables:
              _envelope_raw: >-
                {%- import 'zenos_ai/zen_os_1.jinja' as OS -%}
                {{- OS.envelope(
                  status='success',
                  mode=_mode,
                  result=result,
                  tool='zen_dojotools_lights',
                  caller_token=_caller_token
                ) -}}
          - variables:
              _envelope: "{{ (_envelope_raw | from_json) if _envelope_raw is string else _envelope_raw }}"
          - stop: zen_dojotools_lights response (SESE)
            response_variable: _envelope
