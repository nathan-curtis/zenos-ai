      - conditions:
        - alias: Health Report
          condition: template
          value_template: '{{ tool == ''zen_health_report'' }}'
        sequence:
        - variables:
            _dojo: "{{ states('sensor.zen_dojo_cabinet_resolved') }}"
            _kata: "{{ states('sensor.zen_kata_cabinet_resolved') }}"
            _system: "{{ states('sensor.zen_system_cabinet_resolved') }}"
            _household: "{{ states('sensor.zen_default_household_cabinet_resolved') }}"
            _ai_user: "{{ states('sensor.zen_default_ai_user_cabinet_resolved') }}"
            _family: "{{ states('sensor.zen_default_family_cabinet_resolved') }}"
            _user: "{{ states('sensor.zen_default_user_cabinet_resolved') }}"
        # ── Capsule/essence schema check (2026-08-02) ───────────────────────────
        # Surfaces prompt_health_check()'s corrected severity ladder here too —
        # previously zen_health_report had zero visibility into essence schema
        # at all, so a customer had to separately call mode=prompt_health and
        # was confused by what used to be a miscalibrated 'error' for the
        # universal 'legacy' schema every real install actually runs on
        # (H's own Friday persona included). 'error' now means genuinely
        # missing/corrupt essence; 'legacy' is 'warn' (functional, just hasn't
        # opted into the newer three_layer + signing schema — optional, not
        # required, and Flynn does not gate loading on it either way).
        - variables:
            _capsule_raw: >-
              {%- import 'zenos_ai/zen_os_1.jinja' as zen -%}
              {{ zen.prompt_health_check() }}
            _capsule: "{{ _capsule_raw | trim | from_json if (_capsule_raw | trim).startswith('{') else {} }}"
            _capsule_state:  "{{ _capsule.get('state', 'error') }}"
            _capsule_schema: "{{ _capsule.get('schema', 'missing') }}"
            _capsule_sig:    "{{ _capsule.get('signature_status', 'unsigned') }}"
        # ── Spook prerequisite check ──────────────────────────────────────────
        # homeassistant.create_label / rename_label / remove_label are NOT core
        # HA services — they're only registered by the Spook HACS integration
        # (spook.boo). Flynn's Gate 0 (auto-create missing labels) and manual
        # label repair both hard-depend on this. Without Spook, Gate 0 fails
        # with an opaque "unknown action" automation error that gives zero
        # indication it's a missing prerequisite — this check makes that
        # explicit and actionable instead of requiring a log dive.
        # Uses zen_sutra_ha_api's has_service narrow check (not the general
        # services dump) — the full services registry on this system is large
        # enough to get truncated at 220000 chars, and a truncated cut mid-JSON
        # silently fails to parse and reports a false negative for any service
        # whose domain entry lands past the cut. has_service filters server-side
        # against the full untruncated response and returns only a boolean.
        - action: script.zen_sutra_ha_api
          continue_on_error: true
          data:
            mode: services
            has_service: homeassistant.create_label
          response_variable: _hr_services_raw
        - variables:
            _spook_installed: >-
              {%- if _hr_services_raw is mapping and _hr_services_raw.get('status', '') == 'success' -%}
                {{ _hr_services_raw.get('found', false) }}
              {%- else -%}unknown
              {%- endif -%}
        # ── Persistent log file status (2026-08-08) ──────────────────────────
        # HA 2026.1+ dropped the persistent home-assistant.log file by default
        # (journal-mode logging) — this is the exact gap zen_log_check's
        # journal_mode guard degrades around, and it silently blocks
        # log-based diagnosis until someone notices and re-enables it via
        # mode=zen_log_enable (see below). Surfaced here so it shows up in
        # routine health checks instead of only being discovered mid-
        # incident. continue_on_error — degrades to 'unknown' rather than
        # failing the whole health report if the Supervisor API is
        # unreachable for any reason.
        - action: shell_command.zen_supervisor_token
          continue_on_error: true
          response_variable: _hr_sup_token_raw
        - variables:
            _hr_sup_bearer: "{{ (_hr_sup_token_raw.stdout | default('')) | trim if _hr_sup_token_raw is mapping else '' }}"
        - if: "{{ _hr_sup_bearer not in ['', 'Bearer'] }}"
          then:
            - action: rest_command.zen_supervisor_get
              continue_on_error: true
              data:
                path: core/info
                token: "{{ _hr_sup_bearer }}"
              response_variable: _hr_sup_info
        - variables:
            _persistent_log_enabled: >-
              {%- if _hr_sup_info is defined and _hr_sup_info is mapping and (_hr_sup_info.status | default(0)) == 200 -%}
                {{ (_hr_sup_info.content | default({})).get('data', {}).get('duplicate_log_file', none) }}
              {%- else -%}
                {{ none }}
              {%- endif -%}
        # ── Disk space (2026-08-08, Nathan: "that's the risk a persistent log
        # may exhaust disk on large install with many errors... low but real
        # risk") — /host/info, not /core/info (different Supervisor
        # endpoint). Surfaced alongside the logging status specifically so
        # the two read together: "logging is on/off" next to "here's how
        # much room you'd be filling if it's on." Same graceful-degrade
        # pattern — reuses the token already fetched above, one extra call.
        - if: "{{ _hr_sup_bearer not in ['', 'Bearer'] }}"
          then:
            - action: rest_command.zen_supervisor_get
              continue_on_error: true
              data:
                path: host/info
                token: "{{ _hr_sup_bearer }}"
              response_variable: _hr_sup_host_info
        - variables:
            _disk_total_gb: >-
              {%- if _hr_sup_host_info is defined and _hr_sup_host_info is mapping and (_hr_sup_host_info.status | default(0)) == 200 -%}
                {{ (_hr_sup_host_info.content | default({})).get('data', {}).get('disk_total', none) }}
              {%- else -%}
                {{ none }}
              {%- endif -%}
            _disk_used_gb: >-
              {%- if _hr_sup_host_info is defined and _hr_sup_host_info is mapping and (_hr_sup_host_info.status | default(0)) == 200 -%}
                {{ (_hr_sup_host_info.content | default({})).get('data', {}).get('disk_used', none) }}
              {%- else -%}
                {{ none }}
              {%- endif -%}
            _disk_free_gb: >-
              {%- if _hr_sup_host_info is defined and _hr_sup_host_info is mapping and (_hr_sup_host_info.status | default(0)) == 200 -%}
                {{ (_hr_sup_host_info.content | default({})).get('data', {}).get('disk_free', none) }}
              {%- else -%}
                {{ none }}
              {%- endif -%}
            _disk_free_pct: >-
              {%- if _disk_total_gb not in [none, 0] and _disk_free_gb is not none -%}
                {{ ((_disk_free_gb / _disk_total_gb) * 100) | round(1) }}
              {%- else -%}
                {{ none }}
              {%- endif -%}
        # ── Known-issue cross-reference ─────────────────────────────────────────
        # Every open HA repair issue (via issues(), the only way to reach the
        # Issue Registry from a template — there is no REST endpoint for it,
        # confirmed 404 on /api/repairs/issues) is matched against a curated map
        # of known causes: most of these are Spook "ghost" warnings caused by an
        # optional integration not being installed, not something wrong with the
        # tool itself. We do NOT kill the affected feature when the dependency is
        # missing — we degrade gracefully — but the user should see plainly what
        # requires what, so they can choose to install it or accept the gap.
        - variables:
            _dependency_map:
            - match: zen_dojotools_todo
              dependency: Microsoft 365 integration (ms365_todo platform)
              install_hint: Install/configure the Microsoft 365 HACS integration and enable its todo platform.
              degrades: ['ToDo: Microsoft 365 task list sync (create/delete)']
            - match: zen_dojotools_calendar
              dependency: Microsoft 365 integration (ms365_calendar platform)
              install_hint: Install/configure the Microsoft 365 HACS integration and enable its calendar platform.
              degrades: ['Calendar: Microsoft 365 event create/modify/remove']
            - match: zen_dojotools_mail
              dependency: Microsoft 365 integration (ms365_mail platform)
              install_hint: Install/configure the Microsoft 365 HACS integration and enable its mail platform.
              degrades: ['Mail: Microsoft 365 inbox notify']
            - match: zen_dojotools_teams
              dependency: Microsoft 365 integration (ms365_teams platform)
              install_hint: Install/configure the Microsoft 365 HACS integration and enable its Teams platform.
              degrades: ['Teams: chat message send, status update']
            - match: zen_sutra_music_assistant
              dependency: Music Assistant integration (mass_queue actions)
              install_hint: Install/configure the Music Assistant integration.
              degrades: ['Music Assistant: queue management (get/move/remove/play queue items, favorites, group volume)']
            - match: zen_dojotools_print_shop
              dependency: IPP Printing integration + SimpleImageRaster (HACS)
              install_hint: Install the IPP Printing integration and the SimpleImageRaster HACS integration.
              degrades: ['Print Shop: label/photo printing']
            - match: zen_dojotools_postman
              dependency: notify.* targets (mobile_app/notify group configuration, not an integration)
              install_hint: Confirm the named notify targets/groups (admin_devices, default_user, family_devices, family_devices_verbose, secondary_user) are configured in notify.yaml or via the UI.
              degrades: ['Postman: push notification dispatch to configured targets']
            - match: zen_dojotools_inventory
              dependency: Battery Notes integration (HACS)
              install_hint: Install the Battery Notes HACS integration.
              degrades: ['Inventory: mark battery as replaced']
            - match: flynn_stepgate_sentinel
              dependency: System Monitor integration (core, provides sensor.system_monitor_last_boot)
              install_hint: Add the core System Monitor integration and enable the last boot sensor.
              degrades: ['Flynn Stepgate Sentinel: boot-time detection']
            - match: zen_dojotools_autovac
              dependency: Xiaomi Miio integration
              install_hint: Install/configure the Xiaomi Miio integration for the vacuum entity.
              degrades: ['Autovac: segment-clean command']
        - variables:
            _known_issues: >-
              {%- set ns = namespace(l=[]) -%}
              {%- for k, v in issues().items() -%}
                {%- set _domain = v.get('domain', k[0] if k is sequence and k | length > 0 else '') -%}
                {%- set _iid = v.get('issue_id', k[1] if k is sequence and k | length > 1 else '') -%}
                {%- set _cat = namespace(val='unclassified', dep='', hint='', deg=[]) -%}
                {%- if 'unknown_label' in _iid -%}
                  {%- set _cat.val = 'label_gap' -%}
                  {%- set _cat.hint = 'Missing HA label reference — use zen_dojotools_manifest mode=repair confirm=true to create it (Spook self-clears this ghost once the label exists).' -%}
                {%- elif _domain == 'hacs' and 'restart_required' in _iid -%}
                  {%- set _cat.val = 'informational' -%}
                  {%- set _cat.hint = 'HACS package updated — restart required to apply, not a functional gap.' -%}
                {%- else -%}
                  {%- for m in _dependency_map if m.match in _iid -%}
                    {%- set _cat.val = 'missing_dependency' -%}
                    {%- set _cat.dep = m.dependency -%}
                    {%- set _cat.hint = m.install_hint -%}
                    {%- set _cat.deg = m.degrades -%}
                  {%- endfor -%}
                {%- endif -%}
                {%- set ns.l = ns.l + [{
                  'issue_id': _iid, 'domain': _domain, 'category': _cat.val,
                  'dependency': _cat.dep, 'install_hint': _cat.hint, 'degrades': _cat.deg
                }] -%}
              {%- endfor -%}
              {{ ns.l }}
        - variables:
            _kata_vars: >-
              {{ state_attr(_kata, 'variables') or {}
                 if _kata not in ['unknown','unavailable','none',''] else {} }}
            _dojo_vars: >-
              {{ state_attr(_dojo, 'variables') or {}
                 if _dojo not in ['unknown','unavailable','none',''] else {} }}
        # Per-KFC-component last-run freshness — same computation as mode=pipeline's
        # components[], kept here (not factored into a shared macro, matching this
        # file's existing convention of self-contained case bodies) so a single
        # zen_health_report call surfaces per-component staleness for user-issue
        # triage without a second mode=pipeline call.
        - variables:
            _direct_kfc_components:
            - camera
            - trapper_keeper
            - laundry
            - dishwasher
            - autovac
            _dual_path_components:
            - laundry
            - camera_security
        - variables:
            _component_freshness: >-
              {%- set _ns = namespace(l=[]) -%}
              {%- set _protected = ['AI_Cabinet_VolumeInfo', 'kfc_template', 'zen_library_manifest', 'zen_identity_manifest', '_context'] -%}
              {%- if _dojo_vars is mapping -%}
                {%- for slug, drawer in _dojo_vars.items() -%}
                  {%- if not slug.startswith('_') and slug not in _protected -%}
                    {%- set _sub_d = drawer.get('value', drawer) if drawer is mapping else (drawer | from_json if drawer is string else {}) -%}
                    {%- set _sub_d = _sub_d if _sub_d is mapping else {} -%}
                    {%- if _sub_d.get('trigger_subscriptions', []) | length > 0 -%}
                      {%- set _source = 'direct_kfc' if slug in _direct_kfc_components else ('dual_path' if slug in _dual_path_components else 'scheduler') -%}
                      {%- set _last_raw = _kata_vars.get('zen_ninja_last_run_' ~ slug, {}) -%}
                      {%- set _last_v = _last_raw.get('value', _last_raw) if _last_raw is mapping else (_last_raw | from_json if _last_raw is string else {}) -%}
                      {%- set _last_d = _last_v if _last_v is mapping else (_last_v | from_json if _last_v is string else {}) -%}
                      {%- set _last_d = _last_d if _last_d is mapping else {} -%}
                      {%- set _ran_at = _last_d.get('run_started_at', '') -%}
                      {%- set _age = ((now() - as_datetime(_ran_at)).total_seconds() / 60) | round(1) if _ran_at and _ran_at != '' else none -%}
                      {%- set _fresh = 'ok' if _age is not none and _age | float < 20 else ('stale' if _age is not none and _age | float < 60 else 'very_stale') -%}
                      {%- set _ns.l = _ns.l + [{'slug': slug, 'source': _source, 'last_ran_at': _ran_at, 'age_min': _age, 'freshness': _fresh}] -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endfor -%}
              {%- endif -%}
              {{ _ns.l }}
        - variables:
            _ts: "{{ _kata_vars.get('zen_summary', {}).get('timestamp', '') }}"
            _sched_ts: "{{ _kata_vars.get('zen_scheduler', {}).get('timestamp', '') }}"
            _monk_status: >-
              {%- set _ss_raw = _kata_vars.get('zen_supersummary_status', {}) -%}
              {%- set _ss_v1 = _ss_raw.get('value', _ss_raw) if _ss_raw is mapping else (_ss_raw | from_json if _ss_raw is string else {}) -%}
              {%- set _ss_d = _ss_v1 if _ss_v1 is mapping else (_ss_v1 | from_json if _ss_v1 is string else {}) -%}
              {{ _ss_d.get('status', 'unknown') if _ss_d is mapping else 'unknown' }}
            _schema_ok: >-
              {%- set _zt_raw = _kata_vars.get('zen_template', {}) -%}
              {%- set _zt_v1 = _zt_raw.get('value', _zt_raw) if _zt_raw is mapping else (_zt_raw | from_json if _zt_raw is string else {}) -%}
              {%- set _zt_d = _zt_v1 if _zt_v1 is mapping else (_zt_v1 | from_json if _zt_v1 is string else {}) -%}
              {{ (_zt_d.get('structure', none) is mapping) if _zt_d is mapping else false }}
            _resolver_all_ok: >-
              {{ [_dojo, _kata, _system, _household, _ai_user, _family, _user]
                 | select('in', ['unknown','unavailable','none',''])
                 | list | count == 0 }}
            _active_raw: "{{ state_attr('sensor.zen_monastery_health', 'active_components') | default('[]') }}"
            _label_health_st: "{{ states('sensor.zen_label_health') }}"
            _label_missing: >-
              {%- set _m = state_attr('sensor.zen_label_health', 'missing_label_ids') | default([]) -%}
              {{ _m if _m is sequence and _m is not string else (_m | from_json if _m is string else []) }}
            _cabinet_health_st: "{{ states('sensor.zen_cabinet_health') }}"
            _label_cab_conflict: >-
              {{ _label_health_st == 'critical' and _cabinet_health_st != 'critical' and _label_missing | count > 0 }}
        - variables:
            _ts_age_min: >-
              {%- if _ts and _ts != '' -%}
                {{ ((now() - as_datetime(_ts)).total_seconds() / 60) | round(1) }}
              {%- else -%}none{%- endif -%}
            _sched_age_min: >-
              {%- if _sched_ts and _sched_ts != '' -%}
                {{ ((now() - as_datetime(_sched_ts)).total_seconds() / 60) | round(1) }}
              {%- else -%}none{%- endif -%}
        - variables:
            _legacy_cabinets: >-
              {%- set r = state_attr('sensor.zen_cabinet_health', 'cabinet_states') | default({}, true) -%}
              {%- set cs = r if r is mapping else (r | from_json if r is string else {}) -%}
              {%- set ns = namespace(l=[]) -%}
              {%- for slot, st in cs.items() if st == 'Variables' -%}
                {%- set ns.l = ns.l + [slot] -%}
              {%- endfor -%}
              {{ ns.l | join(', ') if ns.l else '' }}
        - variables:
            _init_cabinets: >-
              {%- set _sde = state_attr('sensor.zen_cabinet_health', 'slot_to_default_entity') | default({}) -%}
              {%- set _sde = _sde if _sde is mapping else (_sde | from_json if _sde is string else {}) -%}
              {%- set ns = namespace(l=[]) -%}
              {%- for slot, eid in _sde.items() if states(eid) == 'init' -%}
                {%- set ns.l = ns.l + [slot] -%}
              {%- endfor -%}
              {{ ns.l | join(', ') if ns.l else '' }}
        - variables:
            # BUG FIX (2026-08-01): ai_task_set only ever checked "is the
            # helper non-empty" — a malformed value (missing domain prefix,
            # e.g. "gemma4_e4b_gemma4_e4b" instead of "ai_task.gemma4_e4b_gemma4_e4b")
            # passed this check fine and sailed through Gate 3 silently, only
            # surfacing as a crash much later when something actually called
            # the entity (e.g. ninja_summarizer force-run: "invalid entity ID
            # ... Got None"). _ai_task_valid checks the helper's value is an
            # entity_id that genuinely exists in states.ai_task — not just
            # non-empty. _ai_task_hint tries to find the real entity the
            # customer probably meant (matching the object_id half after the
            # dot, since the missing-prefix case is the common one) before
            # falling back to listing every real ai_task entity.
            _ai_task_raw: "{{ states('input_text.zenos_ai_task_entity') | trim }}"
            _ai_task_all: "{{ states.ai_task | map(attribute='entity_id') | list }}"
            _ai_task_valid: "{{ _ai_task_raw in _ai_task_all }}"
            _ai_task_hint: >-
              {%- if _ai_task_raw not in ['', 'unknown', 'unavailable'] and not _ai_task_valid -%}
                {%- set _obj = _ai_task_raw.split('.')[-1] -%}
                {%- set _match = _ai_task_all | select('match', '.*\\.' ~ _obj ~ '$') | list -%}
                {%- if _match | count > 0 -%}
                  Did you mean {{ _match[0] }}? (helper is missing its "ai_task." domain prefix)
                {%- elif _ai_task_all | count > 0 -%}
                  Not a real entity. Available ai_task entities: {{ _ai_task_all | join(', ') }}
                {%- else -%}
                  Not a real entity, and no ai_task entities exist on this system at all.
                {%- endif -%}
              {%- else -%}
                {{ '' }}
              {%- endif -%}
        - variables:
            _diagnosis: >-
              {%- set _ns = namespace(issues=[]) -%}
              {%- if _ai_task_raw not in ['', 'unknown', 'unavailable'] and not _ai_task_valid -%}
                {%- set _ns.issues = _ns.issues + ['CRITICAL: input_text.zenos_ai_task_entity is set to "' ~ _ai_task_raw ~ '", which is not a real entity — ' ~ _ai_task_hint] -%}
              {%- endif -%}
              {%- if _capsule_state == 'error' -%}
                {%- set _ns.issues = _ns.issues + ['CRITICAL: agent persona capsule missing or unreadable — no zenai_essence to load.'] -%}
              {%- elif _capsule_schema == 'legacy' -%}
                {%- set _ns.issues = _ns.issues + ['warn: essence on legacy schema (functional, unsigned) — three_layer + signing is optional, not required.'] -%}
              {%- endif -%}
              {%- if _spook_installed == 'False' -%}
                {%- set _ns.issues = _ns.issues + ['CRITICAL: Spook integration not installed — homeassistant.create_label unavailable, Flynn Gate 0 cannot auto-create missing labels and will fail silently with an "unknown action" automation error. Install via HACS: https://spook.boo/installation/'] -%}
              {%- elif _spook_installed == 'unknown' -%}
                {%- set _ns.issues = _ns.issues + ['warn: could not determine Spook install status — the internal HA API check (rest_command.ha_api_get) returned HTTP ' ~ (_hr_services_raw.get('api_status', 'no response') | string) ~ ', not Spook itself. Check the ha_bearer secret (missing/expired long-lived token causes this) before assuming Spook is absent.'] -%}
              {%- endif -%}
              {%- if _dojo in ['unknown','unavailable','none',''] -%}
                {%- set _ns.issues = _ns.issues + ['CRITICAL: dojo resolver unavailable — label zen_dojo_cabinet has no sensor entities'] -%}
              {%- endif -%}
              {%- if _kata in ['unknown','unavailable','none',''] -%}
                {%- set _ns.issues = _ns.issues + ['CRITICAL: kata resolver unavailable — label zen_kata_cabinet has no sensor entities'] -%}
              {%- endif -%}
              {%- if _system in ['unknown','unavailable','none',''] -%}
                {%- set _ns.issues = _ns.issues + ['CRITICAL: system resolver unavailable — label zen_system_cabinet has no sensor entities'] -%}
              {%- endif -%}
              {%- if _household in ['unknown','unavailable','none',''] -%}
                {%- set _ns.issues = _ns.issues + ['CRITICAL: household resolver unavailable — label zen_default_household_cabinet has no sensor entities'] -%}
              {%- endif -%}
              {%- if _ai_user in ['unknown','unavailable','none',''] -%}
                {%- set _ns.issues = _ns.issues + ['CRITICAL: ai_user resolver unavailable — label zen_default_ai_user_cabinet has no sensor entities'] -%}
              {%- endif -%}
              {%- if _family in ['unknown','unavailable','none',''] -%}
                {%- set _ns.issues = _ns.issues + ['warn: family resolver unavailable — label zen_default_family_cabinet has no sensor entities'] -%}
              {%- endif -%}
              {%- if _user in ['unknown','unavailable','none',''] -%}
                {%- set _ns.issues = _ns.issues + ['warn: user resolver unavailable — label zen_default_user_cabinet has no sensor entities'] -%}
              {%- endif -%}
              {%- set _mon_st = states('sensor.zen_monastery_health') -%}
              {%- if _mon_st == 'unknown' -%}
                {%- set _ns.issues = _ns.issues + ['Monastery health has not woken up yet. Run resolver refresh to kick it.'] -%}
              {%- elif _mon_st == 'unavailable' -%}
                {%- set _ns.issues = _ns.issues + ['Monastery health tried to evaluate but hit an error. Check HA logs for template errors.'] -%}
              {%- elif _mon_st == 'critical' -%}
                {%- set _r = state_attr('sensor.zen_monastery_health', 'reason') | default('Schema missing, resolver down, or summary very stale with monk errors.') -%}
                {%- set _ns.issues = _ns.issues + ['Monastery CRITICAL: ' ~ _r] -%}
              {%- elif _mon_st == 'warn' -%}
                {%- set _r = state_attr('sensor.zen_monastery_health', 'reason') | default('Summary stale, monk error, or no active components.') -%}
                {%- set _ns.issues = _ns.issues + ['Monastery warn: ' ~ _r] -%}
              {%- endif -%}
              {%- set _ninja_st = states('sensor.zen_summarizer_health') -%}
              {%- if _ninja_st == 'unknown' -%}
                {%- set _ns.issues = _ns.issues + ['Ninja summarizer health has not woken up yet. Run resolver refresh.'] -%}
              {%- elif _ninja_st == 'unavailable' -%}
                {%- set _ns.issues = _ns.issues + ['Ninja summarizer health hit an error. Check HA logs.'] -%}
              {%- elif _ninja_st not in ['ok', 'disabled'] -%}
                {%- set _r = state_attr('sensor.zen_summarizer_health', 'reason') | default('Scheduler stale or ai_task entity not set.') -%}
                {%- set _ns.issues = _ns.issues + ['Ninja summarizer ' ~ _ninja_st ~ ': ' ~ _r] -%}
              {%- endif -%}
              {%- set _ss_st = states('sensor.zen_supersummary_health') -%}
              {%- if _ss_st == 'unknown' -%}
                {%- set _ns.issues = _ns.issues + ['Supersummary health has not woken up yet. Run resolver refresh.'] -%}
              {%- elif _ss_st == 'unavailable' -%}
                {%- set _ns.issues = _ns.issues + ['Supersummary health hit an error. Check HA logs.'] -%}
              {%- elif _ss_st not in ['ok', 'disabled'] -%}
                {%- set _r = state_attr('sensor.zen_supersummary_health', 'reason') | default('Summary stale or monk returned an error.') -%}
                {%- set _ns.issues = _ns.issues + ['Supersummary ' ~ _ss_st ~ ': ' ~ _r] -%}
              {%- endif -%}
              {%- if not is_state('input_boolean.zen_summarizers_enabled', 'on') -%}
                {%- set _ns.issues = _ns.issues + ['pipeline master kill switch OFF'] -%}
              {%- endif -%}
              {%- if not is_state('input_boolean.zen_ninja_summarizer_enabled', 'on') -%}
                {%- set _ns.issues = _ns.issues + ['ninja summarizer kill switch OFF'] -%}
              {%- endif -%}
              {%- if not is_state('input_boolean.zen_supersummarizer_enabled', 'on') -%}
                {%- set _ns.issues = _ns.issues + ['supersummary kill switch OFF'] -%}
              {%- endif -%}
              {%- if _schema_ok == 'False' -%}
                {%- set _ns.issues = _ns.issues + ['CRITICAL: zen_template schema missing — run zen_admintools_reset_template'] -%}
              {%- endif -%}
              {%- if states('input_text.zenos_ai_task_entity') | trim in ['','unknown','unavailable'] -%}
                {%- set _ns.issues = _ns.issues + ['ai_task entity not set (input_text.zenos_ai_task_entity empty)'] -%}
              {%- endif -%}
              {%- if _ts == '' -%}
                {%- set _ns.issues = _ns.issues + ['no zen_summary timestamp — pipeline has never run or kata not bootstrapped'] -%}
              {%- elif _ts_age_min != 'none' and _ts_age_min | float > 30 -%}
                {%- set _ns.issues = _ns.issues + ['zen_summary critically stale (' ~ _ts_age_min ~ ' min, threshold 30 min)'] -%}
              {%- elif _ts_age_min != 'none' and _ts_age_min | float > 15 -%}
                {%- set _ns.issues = _ns.issues + ['zen_summary stale (' ~ _ts_age_min ~ ' min, threshold 15 min)'] -%}
              {%- endif -%}
              {%- if _sched_ts == '' -%}
                {%- set _ns.issues = _ns.issues + ['no scheduler timestamp — ninja has never run'] -%}
              {%- elif _sched_age_min != 'none' and _sched_age_min | float > 20 -%}
                {%- set _ns.issues = _ns.issues + ['ninja scheduler stale (' ~ _sched_age_min ~ ' min, threshold 20 min)'] -%}
              {%- endif -%}
              {%- if _monk_status in ['error','timeout','none','null','unknown'] -%}
                {%- set _ns.issues = _ns.issues + ['supersummary monk status: ' ~ _monk_status] -%}
              {%- endif -%}
              {%- set _agent_st = states('sensor.zen_agent_health') -%}
              {%- if _agent_st in ['warn','error','critical'] -%}
                {%- set _flynn_blocking = state_attr('sensor.zen_flynn_health', 'blocking') | default('none') -%}
                {%- set _roster_raw = state_attr('sensor.zen_agent_health', 'roster') | default('[]') -%}
                {%- set _roster = _roster_raw | from_json if _roster_raw is string else _roster_raw -%}
                {%- set _notes = _roster | map(attribute='note') | list | join(', ') if _roster is iterable else '' -%}
                {%- set _ns.issues = _ns.issues + ['Agent health ' ~ _agent_st ~ ' — Flynn blocking: ' ~ _flynn_blocking ~ (' | agents: ' ~ _notes if _notes else '')] -%}
              {%- endif -%}
              {%- if _init_cabinets != '' -%}
                {%- set _ns.issues = _ns.issues + ['Virgin cabinets in init state: ' ~ _init_cabinets ~ ' — Flynn Gate 2.1 will auto-init post-warmup. If stuck >5 min, run cabinetadmin mode: init manually.'] -%}
              {%- endif -%}
              {%- if _label_cab_conflict -%}
                {%- set _ns.issues = _ns.issues + ['SENSOR CONFLICT: zen_label_health reports missing label(s) (' ~ (_label_missing | join(', ')) ~ ') but zen_cabinet_health does not agree (state=' ~ _cabinet_health_st ~ '). Both derive from the same live label registry — a disagreement means one sensor has not re-rendered since a recent label change, not a real second problem. Try ha_reload_templates first; treat zen_label_health as authoritative (it computes missing labels directly) if they still disagree after that.'] -%}
              {%- endif -%}
              {%- if _legacy_cabinets != '' -%}
                {%- set _ns.issues = _ns.issues + ['Cabinet schema upgrade available: ' ~ _legacy_cabinets ~ ' — say "upgrade my cabinets"'] -%}
              {%- endif -%}
              {%- if _ns.issues | count == 0 -%}
                All gates nominal.
              {%- else -%}
                {{ _ns.issues | join(' | ') }}
              {%- endif -%}
        - variables:
            response:
              generated: "{{ now().isoformat() }}"
              overall: "{{ 'ok' if 'All gates nominal.' in _diagnosis else 'issues_found' }}"
              resolvers:
                dojo: "{{ _dojo }}"
                kata: "{{ _kata }}"
                system: "{{ _system }}"
                household: "{{ _household }}"
                ai_user: "{{ _ai_user }}"
                family: "{{ _family }}"
                user: "{{ _user }}"
                all_ok: "{{ _resolver_all_ok }}"
              # BUG FIX (2026-08-02): flat health_sensors/reasons dicts gave zero
              # indication of the real dependency cascade — ninja_summarizer and
              # supersummary both actually feed monastery_health's own rollup
              # (see zenos_summarizer_system_health.yaml), and flynn_system_ready
              # itself is derived from labels + cabinet + monastery together
              # (zenos_system_health.yaml). Restructured into a tree mirroring
              # that real cascade instead of a same-level flat list, so a reader
              # can see AT A GLANCE that e.g. a monastery problem is what's
              # actually driving an agents warning, rather than treating five
              # sibling entries as independent unrelated signals.
              flynn_ready:
                state: "{{ 'ok' if is_state('binary_sensor.flynn_system_ready', 'on') else 'issues_found' }}"
                dependencies:
                  labels:
                    state: "{{ _label_health_st }}"
                    reason: "{{ state_attr('sensor.zen_label_health', 'reason') | default('') }}"
                  cabinet:
                    state: "{{ states('sensor.zen_cabinet_health') }}"
                    reason: "{{ state_attr('sensor.zen_cabinet_health', 'reason') | default('') }}"
                    legacy_schema_cabinets: "{{ _legacy_cabinets }}"
                    init_cabinets: "{{ _init_cabinets }}"
                  monastery:
                    state: "{{ states('sensor.zen_monastery_health') }}"
                    reason: "{{ state_attr('sensor.zen_monastery_health', 'reason') | default('') }}"
                    dependencies:
                      ninja_summarizer:
                        state: "{{ states('sensor.zen_summarizer_health') }}"
                        reason: "{{ state_attr('sensor.zen_summarizer_health', 'reason') | default('') }}"
                      supersummary:
                        state: "{{ states('sensor.zen_supersummary_health') }}"
                        reason: "{{ state_attr('sensor.zen_supersummary_health', 'reason') | default('') }}"
                  agents:
                    state: "{{ states('sensor.zen_agent_health') }}"
                    reason: "{{ state_attr('sensor.zen_agent_health', 'reason') | default('') }}"
                  capsule:
                    state: "{{ _capsule_state }}"
                    schema: "{{ _capsule_schema }}"
                    signature_status: "{{ _capsule_sig }}"
                    reason: >-
                      {%- if _capsule_state == 'error' -%}
                        Essence missing or unreadable — agent has no persona capsule to load.
                      {%- elif _capsule_schema == 'legacy' -%}
                        Legacy essence schema (functional, unsigned) — Flynn loads this fine; three_layer + signing is an optional, unmigrated upgrade, not required.
                      {%- elif _capsule_sig != 'signed' -%}
                        Three-layer essence present but not signed — optional, run zen_dojotools_persona_editor mode=sign to certify.
                      {%- else -%}
                        All checks passed.
                      {%- endif -%}
              label_cabinet_consistency:
                consistent: "{{ not _label_cab_conflict }}"
                label_health_state: "{{ _label_health_st }}"
                label_health_missing: "{{ _label_missing }}"
                cabinet_health_state: "{{ _cabinet_health_st }}"
              kill_switches:
                pipeline_master: "{{ is_state('input_boolean.zen_summarizers_enabled', 'on') }}"
                ninja_enabled: "{{ is_state('input_boolean.zen_ninja_summarizer_enabled', 'on') }}"
                supersummary_enabled: "{{ is_state('input_boolean.zen_supersummarizer_enabled', 'on') }}"
              schema_ok: "{{ _schema_ok }}"
              dependencies:
                spook_installed: "{{ _spook_installed }}"
                spook_note: "Provides homeassistant.create_label/rename_label/remove_label — required by Flynn Gate 0. Not core HA. https://spook.boo/installation/"
                internal_api_ok: "{{ _hr_services_raw.get('api_ok', none) if _hr_services_raw is mapping else none }}"
                internal_api_status: "{{ _hr_services_raw.get('api_status', none) if _hr_services_raw is mapping else none }}"
              ai_task_entity: "{{ _ai_task_raw }}"
              ai_task_set: "{{ _ai_task_raw not in ['','unknown','unavailable'] }}"
              ai_task_entity_valid: "{{ _ai_task_valid if _ai_task_raw not in ['','unknown','unavailable'] else none }}"
              ai_task_entity_hint: "{{ _ai_task_hint }}"
              timestamps:
                zen_summary: "{{ _ts | default('none') }}"
                zen_summary_age_min: "{{ _ts_age_min }}"
                zen_scheduler: "{{ _sched_ts | default('none') }}"
                zen_scheduler_age_min: "{{ _sched_age_min }}"
              monk_status: "{{ _monk_status }}"
              active_components: "{{ _active_raw }}"
              component_freshness: "{{ _component_freshness }}"
              known_issues: "{{ _known_issues }}"
              diagnosis: "{{ _diagnosis }}"
              logging:
                persistent_log_enabled: "{{ _persistent_log_enabled }}"
                note: >-
                  {%- if _persistent_log_enabled == true -%}
                    home-assistant.log is being written — full log-based diagnosis available.
                  {%- elif _persistent_log_enabled == false -%}
                    Journal-mode only (HA 2026.1+ default) — no persistent log file, log-based diagnosis is blind. Ships off by default; enable via mode=zen_log_enable confirm_action=true (disruptive: triggers a core rebuild + restart).
                  {%- else -%}
                    Could not reach Supervisor API to check — status unknown.
                  {%- endif -%}
              disk:
                total_gb: "{{ _disk_total_gb }}"
                used_gb: "{{ _disk_used_gb }}"
                free_gb: "{{ _disk_free_gb }}"
                free_pct: "{{ _disk_free_pct }}"
                note: >-
                  {%- if _disk_free_pct is none -%}
                    Could not reach Supervisor API to check — status unknown.
                  {%- elif _disk_free_pct < 10 -%}
                    LOW DISK — under 10% free. Do not enable persistent logging (mode=zen_log_enable) until this is addressed; a verbose install with many errors can genuinely fill remaining space.
                  {%- elif _disk_free_pct < 20 -%}
                    Getting tight — under 20% free. Fine to enable persistent logging, but worth keeping an eye on growth.
                  {%- else -%}
                    Healthy headroom.
                  {%- endif -%}
      - conditions:
        - alias: Cabinet Schema Upgrade
          condition: template
          value_template: "{{ tool == 'cabinet_schema_upgrade' }}"
        sequence:
        - alias: 'Upgrade cabinet schema to v1 (mount-aware)'
          action: script.zen_admintools_cabinetadmin
          data:
            op: flip_schema_version
            schema_version: 1
            caller_token: "{{ caller_token | default('') }}"
        - variables:
            response:
              tool: "{{ tool }}"
              result: success
              message: "Cabinet schema upgraded to v1 (mount-aware). Run zen_health_report to verify."
              caller_token: "{{ caller_token | default('') }}"
      - conditions:
        - alias: Pipeline Monitor
          condition: template
          value_template: "{{ tool == 'pipeline' }}"
        sequence:
        - variables:
            _hours: "{{ [[period_hours | default(3) | int, 1] | max, 24] | min }}"
            _page: "{{ [page | default(1) | int, 1] | max }}"
            _page_size: 20
            _now: "{{ now().isoformat() }}"
            _lb_start: "{{ (now() - timedelta(hours=_hours | int)).strftime('%Y-%m-%dT%H:%M:%S') }}"
        - variables:
            _kata: "{{ states('sensor.zen_kata_cabinet_resolved') }}"
            _dojo: "{{ states('sensor.zen_dojo_cabinet_resolved') }}"
        - variables:
            _kata_vars: >-
              {{ state_attr(_kata, 'variables') | default({}, true)
                 if _kata not in ['unknown','unavailable','none',''] else {} }}
            _dojo_vars: >-
              {{ state_attr(_dojo, 'variables') | default({}, true)
                 if _dojo not in ['unknown','unavailable','none',''] else {} }}
        - variables:
            _sched_raw: >-
              {%- set _r = _kata_vars.get('zen_scheduler', {}) -%}
              {%- set _v = _r.get('value', _r) if _r is mapping else (_r | from_json if _r is string else {}) -%}
              {{ (_v | from_json(none)) if _v is string and _v | trim not in ['', 'null'] else (_v if _v is mapping else none) }}
        - variables:
            _recent_runs: >-
              {{ _sched_raw.get('recent_runs', []) if _sched_raw is mapping else [] }}
            _sched_ts: "{{ _sched_raw.get('timestamp', '') if _sched_raw is mapping else '' }}"
            _sched_age_min: >-
              {%- if _sched_ts and _sched_ts != '' -%}
                {{ ((now() - as_datetime(_sched_ts)).total_seconds() / 60) | round(1) }}
              {%- else -%}none{%- endif -%}
        - action: rest_command.ha_api_get
          data:
            path: "logbook/{{ _lb_start }}?entity_id=script.zen_dojotools_ninja_summarizer"
          response_variable: _lb_raw
        - variables:
            _lb_count: >-
              {%- set _c = _lb_raw.content | default('[]') -%}
              {%- set _entries = _c | from_json if _c is string else (_c if _c is iterable else []) -%}
              {{ _entries | selectattr('state', 'eq', 'on') | selectattr('name', 'eq', 'Zen DojoTools Ninja Summarizer') | list | length }}
        - variables:
            _lb_page_start: "{{ ((_page | int) - 1) * (_page_size | int) }}"
            _lb_total_pages: >-
              {{ ((_lb_count | int) / (_page_size | int)) | round(0, 'ceil') | int }}
        - variables:
            _lb_page: >-
              {%- set _c = _lb_raw.content | default('[]') -%}
              {%- set _entries = _c | from_json if _c is string else (_c if _c is iterable else []) -%}
              {%- set _ninja_on = _entries | selectattr('state', 'eq', 'on') | selectattr('name', 'eq', 'Zen DojoTools Ninja Summarizer') | list -%}
              {%- set _start = _lb_page_start | int -%}
              {%- set _ns = namespace(out=[]) -%}
              {%- for e in _ninja_on[_start : _start + _page_size | int] -%}
                {%- set _ns.out = _ns.out + [{'when': e.get('when', e.get('last_changed', '')), 'state': 'on'}] -%}
              {%- endfor -%}
              {{ _ns.out }}
        - variables:
            _ninja_attr: "{{ state_attr('script.zen_dojotools_ninja_summarizer', 'current') | default(0) }}"
            _ninja_last: "{{ state_attr('script.zen_dojotools_ninja_summarizer', 'last_triggered') | default('') }}"
            _super_attr: "{{ state_attr('script.zen_dojotools_supersummary', 'current') | default(0) }}"
        - variables:
            _direct_kfc_components:
            - camera
            - trapper_keeper
            - laundry
            - dishwasher
            - autovac
            _dual_path_components:
            - laundry
            - camera_security
        - variables:
            _subs_list: >-
              {%- set _ns = namespace(l=[]) -%}
              {%- set _protected = ['AI_Cabinet_VolumeInfo', 'kfc_template', 'zen_library_manifest', 'zen_identity_manifest', '_context'] -%}
              {%- if _dojo_vars is mapping -%}
                {%- for slug, drawer in _dojo_vars.items() -%}
                  {%- if not slug.startswith('_') and slug not in _protected -%}
                    {%- set _sub_d = drawer.get('value', drawer) if drawer is mapping else (drawer | from_json if drawer is string else {}) -%}
                    {%- set _sub_d = _sub_d if _sub_d is mapping else {} -%}
                    {%- if _sub_d.get('trigger_subscriptions', []) | length > 0 -%}
                      {%- set _source = 'direct_kfc' if slug in _direct_kfc_components else ('dual_path' if slug in _dual_path_components else 'scheduler') -%}
                      {%- set _last_raw = _kata_vars.get('zen_ninja_last_run_' ~ slug, {}) -%}
                      {%- set _last_v = _last_raw.get('value', _last_raw) if _last_raw is mapping else (_last_raw | from_json if _last_raw is string else {}) -%}
                      {%- set _last_d = _last_v if _last_v is mapping else (_last_v | from_json if _last_v is string else {}) -%}
                      {%- set _last_d = _last_d if _last_d is mapping else {} -%}
                      {%- set _ran_at = _last_d.get('run_started_at', '') -%}
                      {%- set _dur = _last_d.get('duration_seconds', none) -%}
                      {%- set _age = ((now() - as_datetime(_ran_at)).total_seconds() / 60) | round(1) if _ran_at and _ran_at != '' else none -%}
                      {%- set _fresh = 'ok' if _age is not none and _age | float < 20 else ('stale' if _age is not none and _age | float < 60 else 'very_stale') -%}
                      {%- set _ns.l = _ns.l + [{'slug': slug, 'tier': _sub_d.get('pipeline_tier', _sub_d.get('tier', 'unknown')), 'source': _source, 'triggers': _sub_d.get('trigger_subscriptions', []), 'last_ran_at': _ran_at, 'age_min': _age, 'freshness': _fresh, 'duration_sec': _dur}] -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endfor -%}
              {%- endif -%}
              {{ _ns.l }}
        - variables:
            _flags: >-
              {%- set _ns = namespace(f=[]) -%}
              {%- if _ninja_attr | int >= 2 -%}
                {%- set _ns.f = _ns.f + [{'flag': 'queue_backlog', 'severity': 'warn', 'detail': 'Ninja queue at capacity (' ~ _ninja_attr ~ '/2). New invocations are queuing.'}] -%}
              {%- endif -%}
              {{ _ns.f }}
            _known_issues: []
        - variables:
            response:
              tool: pipeline
              generated: "{{ _now }}"
              window_hours: "{{ _hours }}"
              queue:
                ninja_running: "{{ _ninja_attr }}"
                ninja_last_triggered: "{{ _ninja_last }}"
                super_running: "{{ _super_attr }}"
              scheduler:
                last_run_at: "{{ _sched_ts }}"
                age_min: "{{ _sched_age_min }}"
                recent_runs: "{{ _recent_runs }}"
              components: "{{ _subs_list }}"
              logbook:
                total_invocations: "{{ _lb_count }}"
                window_hours: "{{ _hours }}"
                page: "{{ _page }}"
                total_pages: "{{ _lb_total_pages }}"
                page_size: "{{ _page_size }}"
                entries: "{{ _lb_page }}"
              flags: "{{ _flags }}"
              known_issues: "{{ _known_issues }}"
              caller_token: "{{ caller_token }}"
      - conditions:
        - alias: Render Dojo
          condition: template
          value_template: "{{ tool == 'render_dojo' }}"
        sequence:
        - variables:
            _dojo_raw: >-
              {%- import 'zenos_ai/zen_os_1.jinja' as zen -%}
              {{ zen.dojo_loader() }}
        - variables:
            response:
              tool: render_dojo
              result: success
              chars: "{{ _dojo_raw | trim | length }}"
              dojo: "{{ _dojo_raw | trim | from_json if (_dojo_raw | trim).startswith('{') else {} }}"
              caller_token: "{{ caller_token }}"
      - conditions:
        - alias: Render System
          condition: template
          value_template: "{{ tool == 'render_system' }}"
        sequence:
        - variables:
            _idcard_raw: >-
              {%- import 'zenos_ai/zen_os_1.jinja' as zen -%}
              {{ zen.identity_resolve_source(states('sensor.zen_default_ai_user_cabinet_resolved')) }}
        - variables:
            _system_raw: >-
              {%- import 'zenos_ai/zen_os_1.jinja' as zen -%}
              {%- set _id = _idcard_raw | trim | from_json if (_idcard_raw | trim).startswith('{') else {} -%}
              {{ zen.prompt_system(_id) }}
        - variables:
            response:
              tool: render_system
              result: success
              chars: "{{ _system_raw | trim | length }}"
              system: "{{ _system_raw | trim | from_json if (_system_raw | trim).startswith('{') else {} }}"
              caller_token: "{{ caller_token }}"
      - conditions:
        - alias: Prompt Health
          condition: template
          value_template: "{{ tool == 'prompt_health' }}"
        sequence:
        - variables:
            _health_raw: >-
              {%- import 'zenos_ai/zen_os_1.jinja' as zen -%}
              {{ zen.prompt_health_check() }}
            _audit_raw: >-
              {%- import 'zenos_ai/zen_os_1.jinja' as zen -%}
              {{ zen.prompt_length_audit() }}
            _agent_raw: >-
              {%- set _active = states('input_text.zenos_conversation_agent') -%}
              {%- set _all = (states.conversation | list) + (states.ai_task | list) -%}
              {%- set ns = namespace(active={}, conv_count=0, ai_count=0) -%}
              {%- for s in _all -%}
                {%- if s.entity_id.startswith('conversation.') -%}{%- set ns.conv_count = ns.conv_count + 1 -%}{%- endif -%}
                {%- if s.entity_id.startswith('ai_task.') -%}{%- set ns.ai_count = ns.ai_count + 1 -%}{%- endif -%}
                {%- if s.entity_id == _active -%}
                  {%- set _entry = config_entry_id(s.entity_id) -%}
                  {%- set _model = device_attr(s.entity_id, 'model_id') or device_attr(s.entity_id, 'model') -%}
                  {%- set _state_str = config_entry_attr(_entry, 'state') | string if _entry else '' -%}
                  {%- set ns.active = {
                    'entity_id': s.entity_id,
                    'model': _model if _model else 'unspecified',
                    'provider': device_attr(s.entity_id, 'manufacturer') or 'unspecified',
                    'integration': config_entry_attr(_entry, 'domain') if _entry else 'unspecified',
                    'canon_ok': _active != '' and _active not in ['unknown', 'unavailable'] and 'LOADED' in _state_str
                  } -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.active | combine({'conversation_count': ns.conv_count, 'ai_task_count': ns.ai_count}) | tojson }}
        - variables:
            response:
              tool: prompt_health
              result: success
              health: "{{ _health_raw | trim | from_json if (_health_raw | trim).startswith('{') else {} }}"
              length_audit: "{{ _audit_raw | trim | from_json if (_audit_raw | trim).startswith('{') else {} }}"
              agent: "{{ _agent_raw | trim | from_json if (_agent_raw | trim).startswith('{') else {} }}"
              how_to_see_full_prompt: "Call Identity tool with mode=render_prompt to see the complete rendered prompt as the active agent receives it. Edit zen_os_1.jinja or component instructions → ha_reload_templates → render_prompt again."
              caller_token: "{{ caller_token }}"
      - conditions:
        - alias: pnotif_list
          condition: template
          value_template: "{{ tool == 'pnotif_list' }}"
        sequence:
        - variables:
            _notifs: >-
              {%- set ns = namespace(n=[]) -%}
              {%- for e in states.persistent_notification -%}
                {%- set _id = e.entity_id | replace('persistent_notification.', '') -%}
                {%- set ns.n = ns.n + [{'notification_id': _id, 'title': e.attributes.get('title', ''), 'message': e.attributes.get('message', e.state), 'created_at': e.attributes.get('created_at', '')}] -%}
              {%- endfor -%}
              {{ ns.n }}
        - variables:
            response:
              tool: "{{ tool }}"
              result: ok
              count: "{{ _notifs | count }}"
              notifications: "{{ _notifs }}"
              read_caveat: "Reads states.persistent_notification — HA 2025.x+ may store notifications outside the state machine. count=0 does not guarantee the HA panel is clear. Verify in UI if suspicious."
      - conditions:
        - alias: pnotif_raise
          condition: template
          value_template: "{{ tool == 'pnotif_raise' }}"
        sequence:
        - action: persistent_notification.create
          data:
            title: "{{ notif_title | default('') }}"
            message: "{{ notif_message | default('') }}"
            notification_id: "{{ notif_id | default('') }}"
        - variables:
            response:
              tool: "{{ tool }}"
              result: ok
              notification_id: "{{ notif_id | default('') }}"
              message: "Notification raised."
      - conditions:
        - alias: pnotif_edit
          condition: template
          value_template: "{{ tool == 'pnotif_edit' }}"
        sequence:
        - action: persistent_notification.create
          data:
            title: "{{ notif_title | default('') }}"
            message: "{{ notif_message | default('') }}"
            notification_id: "{{ notif_id | default('') }}"
        - variables:
            response:
              tool: "{{ tool }}"
              result: ok
              notification_id: "{{ notif_id | default('') }}"
              message: "Notification updated (re-raised with same id)."
      - conditions:
        - alias: pnotif_dismiss
          condition: template
          value_template: "{{ tool == 'pnotif_dismiss' }}"
        sequence:
        - action: persistent_notification.dismiss
          data:
            notification_id: "{{ notif_id | default('') }}"
        - variables:
            response:
              tool: "{{ tool }}"
              result: ok
              notification_id: "{{ notif_id | default('') }}"
              message: "Notification dismissed."
      - conditions:
        - alias: repairs_list
          condition: template
          value_template: "{{ tool == 'repairs_list' }}"
        sequence:
        - variables:
            _issues: >-
              {%- set ns = namespace(l=[]) -%}
              {%- for k, v in issues().items() -%}
                {%- set _domain = v.get('domain', k[0] if k is sequence and k | length > 0 else '') -%}
                {%- set _iid = v.get('issue_id', k[1] if k is sequence and k | length > 1 else '') -%}
                {%- set ns.l = ns.l + [{
                  'issue_id': _iid,
                  'domain': _domain,
                  'created': v.get('created', ''),
                  'dismissed_version': v.get('dismissed_version', none),
                  'is_persistent': v.get('is_persistent', false)
                }] -%}
              {%- endfor -%}
              {{ ns.l }}
        - variables:
            response:
              tool: "{{ tool }}"
              result: ok
              count: "{{ _issues | count }}"
              issues: "{{ _issues }}"
              hint: "Fields available from HA's issues() template global are limited to domain/issue_id/created/dismissed_version/is_persistent — no severity/is_fixable/title data is exposed here. Spook-created issues have domain=spook. Use ectoplasm action_type=repair_remove/repair_ignore_all with domain+issue_id from this list to act on one."
      - conditions:
        - alias: repair_fix
          condition: template
          value_template: "{{ tool == 'repair_fix' and confirm }}"
        sequence:
        - action: script.zen_dojotools_ectoplasm
          data:
            action_type: repair_remove
            issue_id: "{{ issue_id | default('') }}"
            domain: "{{ repair_domain | default('') }}"
            confirm_action: true
            caller_token: "{{ caller_token }}"
          response_variable: _ecto_fix
        - variables:
            response:
              tool: "{{ tool }}"
              result: "{{ _ecto_fix.status | default('unknown') }}"
              repair_domain: "{{ repair_domain | default('') }}"
              issue_id: "{{ issue_id | default('') }}"
              message: "{{ _ecto_fix.message | default('') }}"
      - conditions:
        - alias: notice_dashboard
          condition: template
          value_template: "{{ tool == 'notice_dashboard' }}"
        sequence:
        - variables:
            _household: "{{ states('sensor.zen_default_household_cabinet_resolved') }}"
        - variables:
            _hh_vars: >-
              {{ state_attr(_household, 'variables') | default({}, true)
                 if _household not in ['unknown','unavailable','none',''] else {} }}
        - variables:
            _alerts_drawer: >-
              {%- set r = (_hh_vars.get('_zen_active_alerts', {}) if _hh_vars is mapping else {}) -%}
              {%- set v = r.get('value', r) if r is mapping else (r | from_json if r is string else {}) -%}
              {{ v if v is mapping else (v | from_json if v is string else {}) }}
        - variables:
            _alert_list: >-
              {%- set ns = namespace(l=[]) -%}
              {%- set _d = _alerts_drawer if _alerts_drawer is mapping else {} -%}
              {%- for key, a in _d.items() if a is mapping -%}
                {%- set ns.l = ns.l + [{'alert_key': key, 'severity': a.get('severity', ''), 'title': a.get('title', ''), 'message': (a.get('message', '') | string)[:200], 'fired_at': a.get('fired_at', ''), 'clear_after_minutes': a.get('clear_after_minutes', '')}] -%}
              {%- endfor -%}
              {{ ns.l }}
        - variables:
            _pnotifs: >-
              {%- set ns = namespace(n=[]) -%}
              {%- for e in states.persistent_notification -%}
                {%- set _id = e.entity_id | replace('persistent_notification.', '') -%}
                {%- set ns.n = ns.n + [{'notification_id': _id, 'title': e.attributes.get('title', ''), 'message': e.attributes.get('message', e.state), 'created_at': e.attributes.get('created_at', '')}] -%}
              {%- endfor -%}
              {{ ns.n }}
        - variables:
            _rep_issues: >-
              {%- set ns = namespace(l=[]) -%}
              {%- for eid in integration_entities('repairs') | list -%}
                {%- set _d   = state_attr(eid, 'domain')      | default('', true) -%}
                {%- set _iid = state_attr(eid, 'issue_id')    | default('', true) -%}
                {%- set _ttl = state_attr(eid, 'title')       | default(state_attr(eid, 'translation_key') | default('', true), true) -%}
                {%- set _sev = state_attr(eid, 'severity')    | default('warning', true) -%}
                {%- set _fix = state_attr(eid, 'is_fixable')  | default(false, true) -%}
                {%- set _ign = state_attr(eid, 'ignored')     | default(false, true) -%}
                {%- set ns.l = ns.l + [{'entity_id': eid, 'issue_id': _iid, 'domain': _d, 'severity': _sev, 'is_fixable': _fix, 'ignored': _ign, 'title': _ttl}] -%}
              {%- endfor -%}
              {{ ns.l }}
        - variables:
            _nd_lb_start: "{{ (now() - timedelta(hours=1)).strftime('%Y-%m-%dT%H:%M:%S') }}"
        - action: rest_command.ha_api_get
          data:
            path: "logbook/{{ _nd_lb_start }}?entity_id=script.zen_dojotools_postman"
          response_variable: _nd_lb_raw
        - variables:
            _recent_dispatches: >-
              {%- set _c = _nd_lb_raw.content | default([]) -%}
              {%- set _entries = _c | from_json if _c is string else (_c if _c is iterable else []) -%}
              {%- set ns = namespace(postman=0, announce=0, last_at='') -%}
              {%- for e in _entries if e is mapping and e.get('state', '') == 'on' -%}
                {%- set _eid = e.get('entity_id', '') -%}
                {%- if 'postman' in _eid -%}{%- set ns.postman = ns.postman + 1 -%}{%- endif -%}
                {%- if 'announce' in _eid -%}{%- set ns.announce = ns.announce + 1 -%}{%- endif -%}
                {%- set _w = e.get('when', '') -%}
                {%- if _w and (ns.last_at == '' or _w > ns.last_at) -%}{%- set ns.last_at = _w -%}{%- endif -%}
              {%- endfor -%}
              {{ {'postman': ns.postman, 'announce': ns.announce, 'last_at': ns.last_at[:16] if ns.last_at else 'none', 'window_hours': 1} }}
        - variables:
            _pending_updates: >-
              {%- set ns = namespace(l=[]) -%}
              {%- for e in states.update if e.state == 'on' -%}
                {%- set _utitle = e.attributes.get('title') or e.name -%}
                {%- set _installable = (e.attributes.get('supported_features', 0) | int) | bitwise_and(1) == 1 -%}
                {%- set ns.l = ns.l + [{'entity_id': e.entity_id, 'title': _utitle, 'installed': e.attributes.get('installed_version', ''), 'latest': e.attributes.get('latest_version', ''), 'skipped': e.attributes.get('skipped_version', none) is not none, 'installable': _installable}] -%}
              {%- endfor -%}
              {{ ns.l }}
        - variables:
            # Detects home-mode anchor misconfiguration that bypassed the
            # scheduler_anchors setter's ascending-order guard (e.g. a raw HA
            # UI edit to the input_datetime helpers). zen_hm_evaluate_window
            # has no runtime guard of its own — a broken ordering here
            # silently misassigns home_mode with no error anywhere.
            _anchor_names: ['wake', 'morning', 'daytime', 'evening', 'night', 'late_night']
            _anchor_eids:
              - input_datetime.zen_am_start
              - input_datetime.zen_morning_start
              - input_datetime.zen_daytime_start
              - input_datetime.zen_evening_start
              - input_datetime.zen_night_start
              - input_datetime.zen_late_night_start
        - variables:
            _anchor_values: "{{ _anchor_eids | map('states') | list }}"
        - variables:
            _anchor_conflicts: >-
              {%- set ns = namespace(c=[]) -%}
              {%- for i in range(5) -%}
                {%- if _anchor_values[i] not in ['unknown','unavailable',''] and _anchor_values[i+1] not in ['unknown','unavailable',''] and _anchor_values[i] >= _anchor_values[i+1] -%}
                  {%- set ns.c = ns.c + [{'pair': _anchor_names[i] ~ '/' ~ _anchor_names[i+1], 'values': [_anchor_values[i], _anchor_values[i+1]]}] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.c }}
        - variables:
            _action_queue: >-
              {%- set ns = namespace(q=[]) -%}
              {%- for a in _alert_list if a is mapping -%}
                {%- set ns.q = ns.q + [{'priority': a.get('severity', 'warn'), 'item': a.get('title', a.get('alert_key', '')), 'tool': 'alertmanager', 'call': {'mode': 'clear', 'alert_key': a.get('alert_key', '')}}] -%}
              {%- endfor -%}
              {%- for p in _pnotifs if p is mapping -%}
                {%- set ns.q = ns.q + [{'priority': 'info', 'item': p.get('title', p.get('notification_id', '')), 'tool': 'systemtools', 'call': {'tool': 'pnotif_dismiss', 'notif_id': p.get('notification_id', '')}}] -%}
              {%- endfor -%}
              {%- for r in _rep_issues if r is mapping and not r.get('ignored', false) -%}
                {%- set ns.q = ns.q + [{'priority': r.get('severity', 'warning'), 'item': r.get('title', r.get('issue_id', '')), 'tool': 'systemtools', 'call': {'tool': 'repair_fix', 'repair_domain': r.get('domain', ''), 'issue_id': r.get('issue_id', '')}}] -%}
              {%- endfor -%}
              {%- for u in _pending_updates if u is mapping and not u.get('skipped', false) -%}
                {%- if u.get('installable', false) -%}
                  {%- set ns.q = ns.q + [{'priority': 'info', 'item': u.get('title', ''), 'installed': u.get('installed', ''), 'latest': u.get('latest', ''), 'tool': 'systemtools', 'call': {'tool': 'ha_update_install', 'entity_id': u.get('entity_id', '')}}] -%}
                {%- else -%}
                  {%- set ns.q = ns.q + [{'priority': 'fyi', 'item': u.get('title', ''), 'installed': u.get('installed', ''), 'latest': u.get('latest', ''), 'note': 'update managed externally — no HA action available'}] -%}
                {%- endif -%}
              {%- endfor -%}
              {%- for c in _anchor_conflicts -%}
                {%- set ns.q = ns.q + [{'priority': 'warning', 'item': 'home mode anchors out of order: ' ~ c.pair, 'tool': 'systemtools', 'call': {'tool': 'scheduler_anchors', 'note': 'set anchor=' ~ c.pair.split('/')[0] ~ ' or ' ~ c.pair.split('/')[1] ~ ' to a corrected time via mode=scheduler_anchors — do not edit input_datetime helpers directly in HA UI'}}] -%}
              {%- endfor -%}
              {{ ns.q }}
        # Default (verbose=false): counts + a short preview per section, and
        # anchor conflicts collapse into ONE summary instead of one entry per
        # pair. Previously every section AND the action_queue restated the
        # same items in full, roughly doubling response size on any system
        # with more than a couple of non-green items — a real contributor to
        # tool results too large for a smaller model to reliably consume.
        - variables:
            _verbose: "{{ verbose | default(false) | bool }}"
            _anchor_summary: >-
              {%- if _anchor_conflicts | length == 0 -%}
                {{ none }}
              {%- else -%}
                {{ {
                  'count': _anchor_conflicts | length,
                  'pairs': _anchor_conflicts | map(attribute='pair') | list,
                  'note': 'anchor(s) out of order — fix each via mode=scheduler_anchors; do not edit input_datetime helpers directly in HA UI'
                } }}
              {%- endif -%}
        - variables:
            response:
              tool: "{{ tool }}"
              result: ok
              generated: "{{ now().isoformat() }}"
              verbose: "{{ _verbose }}"
              alerts:
                count: "{{ _alert_list | count }}"
                active: "{{ _alert_list if _verbose else _alert_list[:3] }}"
              persistent_notifications:
                count: "{{ _pnotifs | count }}"
                items: "{{ _pnotifs if _verbose else _pnotifs[:3] }}"
                read_caveat: "{{ 'states.persistent_notification may be incomplete on HA 2025.x+ — verify panel if count seems wrong' if _pnotifs | count == 0 else '' }}"
              repairs:
                count: "{{ _rep_issues | count }}"
                issues: "{{ _rep_issues if _verbose else _rep_issues[:3] }}"
              pending_updates:
                count: "{{ _pending_updates | count }}"
                items: "{{ _pending_updates if _verbose else _pending_updates[:3] }}"
              home_mode_anchor_health:
                ok: "{{ _anchor_conflicts | length == 0 }}"
                conflicts: "{{ _anchor_conflicts if _verbose else _anchor_summary }}"
              recent_dispatches: "{{ _recent_dispatches }}"
              action_queue: >-
                {%- if _verbose -%}
                  {{ _action_queue }}
                {%- else -%}
                  {%- set ns2 = namespace(q=[]) -%}
                  {%- for item in _action_queue -%}
                    {%- set _call = item.get('call', {}) if item is mapping else {} -%}
                    {%- if _call.get('tool', '') != 'scheduler_anchors' -%}
                      {%- set ns2.q = ns2.q + [item] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {%- if _anchor_summary is not none -%}
                    {%- set ns2.q = ns2.q + [{'priority': 'warning', 'item': (_anchor_summary.count | string) ~ ' home mode anchor pair(s) out of order', 'tool': 'systemtools', 'call': {'tool': 'scheduler_anchors', 'note': _anchor_summary.note}}] -%}
                  {%- endif -%}
                  {{ ns2.q }}
                {%- endif -%}
      - conditions:
        - alias: home_status
          condition: template
          value_template: "{{ tool == 'home_status' }}"
        sequence:
        - variables:
            _ov: sensor.home_overview
            response:
              tool: "{{ tool }}"
              result: ok
              home_mode: "{{ state_attr(_ov, 'home_mode') | default(states(_ov), true) }}"
              quiet_hours:
                active: "{{ state_attr(_ov, 'quiet_hours') == 'on' }}"
                start: "{{ states('input_datetime.zen_quiet_hours_start') }}"
                end: "{{ states('input_datetime.zen_quiet_hours_end') }}"
              work_hours:
                active: "{{ is_state('binary_sensor.zen_work_hours', 'on') }}"
                start: "{{ states('input_datetime.zen_work_hours_start') }}"
                end: "{{ states('input_datetime.zen_work_hours_end') }}"
              scheduler_anchors:
                wake: "{{ states('input_datetime.zen_am_start') }}"
                morning: "{{ states('input_datetime.zen_morning_start') }}"
                daytime: "{{ states('input_datetime.zen_daytime_start') }}"
                evening: "{{ states('input_datetime.zen_evening_start') }}"
                night: "{{ states('input_datetime.zen_night_start') }}"
                late_night: "{{ states('input_datetime.zen_late_night_start') }}"
              anchor_order_valid: >-
                {%- set _t = [states('input_datetime.zen_am_start'), states('input_datetime.zen_morning_start'), states('input_datetime.zen_daytime_start'), states('input_datetime.zen_evening_start'), states('input_datetime.zen_night_start'), states('input_datetime.zen_late_night_start')] -%}
                {%- if _t | select('in', ['unknown', 'unavailable', '']) | list | length > 0 -%}
                  false
                {%- else -%}
                  {{ _t[0] < _t[1] and _t[1] < _t[2] and _t[2] < _t[3] and _t[3] < _t[4] and _t[4] < _t[5] }}
                {%- endif -%}
              anchor_conflicts: >-
                {%- set _names = ['wake','morning','daytime','evening','night','late_night'] -%}
                {%- set _eids = ['input_datetime.zen_am_start','input_datetime.zen_morning_start','input_datetime.zen_daytime_start','input_datetime.zen_evening_start','input_datetime.zen_night_start','input_datetime.zen_late_night_start'] -%}
                {%- set _t = _eids | map('states') | list -%}
                {%- set ns = namespace(c=[]) -%}
                {%- for i in range(5) -%}
                  {%- if _t[i] not in ['unknown', 'unavailable', ''] and _t[i+1] not in ['unknown', 'unavailable', ''] and _t[i] >= _t[i+1] -%}
                    {%- set ns.c = ns.c + [_names[i] ~ '/' ~ _names[i+1]] -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.c }}
              guest_mode: "{{ state_attr(_ov, 'guest_mode') | default(is_state('input_boolean.zen_guest_mode', 'on'), true) }}"
              entertaining: "{{ state_attr(_ov, 'entertainment_mode') | default(is_state('input_boolean.zen_entertaining', 'on'), true) }}"
              security_mode: "{{ state_attr(_ov, 'security_mode') | default('unavailable', true) }}"
              persons_home: "{{ state_attr(_ov, 'persons_home') | default([], true) }}"
              person_count_home: "{{ state_attr(_ov, 'person_count_home') | default(0, true) }}"
              lights_on: "{{ state_attr(_ov, 'lights_on') | default(0, true) }}"
              active_media: "{{ state_attr(_ov, 'active_media') | default(0, true) }}"
              battery_low_count: "{{ state_attr(_ov, 'battery_low_count') | default(0, true) }}"
              open_sensor_count: "{{ state_attr(_ov, 'open_sensor_count') | default(0, true) }}"
              weather: "{{ state_attr(_ov, 'weather_condition') | default('unavailable', true) }}"
              weather_temp_f: "{{ state_attr(_ov, 'weather_temp_f') | default(none, true) }}"
              priority_context:
                all_quiet: "{{ state_attr(_ov, 'all_quiet') | default(true, true) }}"
                count: "{{ state_attr(_ov, 'priority_count') | default(0, true) }}"
                highest_urgency: "{{ state_attr(_ov, 'highest_urgency') | default('', true) }}"
              detail_hint: "room_manager mode=home_overview for full floors/rooms/presence depth"

      - conditions:
        - alias: home_mode get/set
          condition: template
          value_template: "{{ tool == 'home_mode' }}"
        sequence:
        - if: "{{ value | default('') | trim != '' }}"
          then:
          - if: "{{ is_state('input_select.zen_home_mode', 'Paused') }}"
            then:
            - variables:
                response:
                  tool: "{{ tool }}"
                  result: error
                  blocked: true
                  message: "HARD BLOCK: system is Paused (ALL STOP). Agents cannot clear Pause under any circumstances. A human must change home mode directly in the HA UI or dashboard."
            - stop: home_mode blocked — system is Paused
              response_variable: response
          - variables:
              _persons_home: "{{ states('zone.home') | int(0) }}"
          - if: "{{ value | trim == 'Away' and not confirm }}"
            then:
            - variables:
                response:
                  tool: "{{ tool }}"
                  result: error
                  blocked: true
                  persons_home: "{{ _persons_home }}"
                  message: >-
                    {{ 'WARNING: ' ~ _persons_home ~ ' person(s) detected at home. ' if _persons_home > 0 else '' -}}
                    Setting Away arms the security system to Away mode.
                    {{ '🚨 If anyone is still inside YOU WILL SET OFF THE ALARM. 🚨 ' if _persons_home > 0 else '' -}}
                    Confirm with confirm_action=true only if the house is actually empty.
            - stop: home_mode Away requires confirmation
              response_variable: response
          - action: input_select.select_option
            target:
              entity_id: input_select.zen_home_mode
            data:
              option: "{{ value }}"
          - variables:
              response:
                tool: "{{ tool }}"
                result: ok
                action: set
                home_mode: "{{ value }}"
          else:
          - variables:
              response:
                tool: "{{ tool }}"
                result: ok
                action: get
                home_mode: "{{ states('input_select.zen_home_mode') }}"
                options:
                  - Home-Wake
                  - Home-Morning
                  - Home
                  - Home-Evening
                  - Night
                  - Night-Late
                  - Away
                  - Paused

      - conditions:
        - alias: quiet_hours get/set
          condition: template
          value_template: "{{ tool == 'quiet_hours' }}"
        sequence:
        - if: "{{ value | default('') | trim != '' }}"
          then:
          - if: "{{ '/' in (value | string) }}"
            then:
            - variables:
                _qh_start: "{{ (value | string).split('/')[0] | trim }}"
                _qh_end:   "{{ (value | string).split('/')[1] | trim }}"
            - action: input_datetime.set_datetime
              target:
                entity_id: input_datetime.zen_quiet_hours_start
              data:
                time: "{{ _qh_start }}"
            - action: input_datetime.set_datetime
              target:
                entity_id: input_datetime.zen_quiet_hours_end
              data:
                time: "{{ _qh_end }}"
            - variables:
                response:
                  tool: "{{ tool }}"
                  result: ok
                  action: set
                  start: "{{ _qh_start }}"
                  end: "{{ _qh_end }}"
            else:
            - variables:
                response:
                  tool: "{{ tool }}"
                  result: error
                  message: "Provide value as 'HH:MM/HH:MM' (start/end). Example: '23:00/06:00'"
          else:
          - variables:
              response:
                tool: "{{ tool }}"
                result: ok
                action: get
                active: "{{ is_state('binary_sensor.zen_quiet_hours', 'on') }}"
                start: "{{ states('input_datetime.zen_quiet_hours_start') }}"
                end: "{{ states('input_datetime.zen_quiet_hours_end') }}"
                note: "To set: pass value='HH:MM/HH:MM' (start/end). Midnight wrap supported (e.g. 23:00/06:00)."

      - conditions:
        - alias: work_hours get/set
          condition: template
          value_template: "{{ tool == 'work_hours' }}"
        sequence:
        - if: "{{ value | default('') | trim != '' }}"
          then:
          - if: "{{ '/' in (value | string) }}"
            then:
            - variables:
                _wh_start: "{{ (value | string).split('/')[0] | trim }}"
                _wh_end:   "{{ (value | string).split('/')[1] | trim }}"
            - action: input_datetime.set_datetime
              target:
                entity_id: input_datetime.zen_work_hours_start
              data:
                time: "{{ _wh_start }}"
            - action: input_datetime.set_datetime
              target:
                entity_id: input_datetime.zen_work_hours_end
              data:
                time: "{{ _wh_end }}"
            - variables:
                response:
                  tool: "{{ tool }}"
                  result: ok
                  action: set
                  start: "{{ _wh_start }}"
                  end: "{{ _wh_end }}"
            else:
            - variables:
                response:
                  tool: "{{ tool }}"
                  result: error
                  message: "Provide value as 'HH:MM/HH:MM' (start/end). Example: '09:00/17:00'"
          else:
          - variables:
              response:
                tool: "{{ tool }}"
                result: ok
                action: get
                active: "{{ is_state('binary_sensor.zen_work_hours', 'on') }}"
                start: "{{ states('input_datetime.zen_work_hours_start') }}"
                end: "{{ states('input_datetime.zen_work_hours_end') }}"
                note: "To set: pass value='HH:MM/HH:MM' (start/end). No midnight wrap."

      - conditions:
        - alias: scheduler_anchors get/set
          condition: template
          value_template: "{{ tool == 'scheduler_anchors' }}"
        sequence:
        - variables:
            _anchor_map:
              wake: input_datetime.zen_am_start
              morning: input_datetime.zen_morning_start
              daytime: input_datetime.zen_daytime_start
              evening: input_datetime.zen_evening_start
              night: input_datetime.zen_night_start
              late_night: input_datetime.zen_late_night_start
        - if: "{{ value | default('') | trim != '' and anchor | default('') | trim != '' }}"
          then:
          - variables:
              _target_eid: "{{ (_anchor_map if _anchor_map is mapping else {}).get(anchor | trim, '') }}"
          - if: "{{ _target_eid == '' }}"
            then:
            - variables:
                response:
                  tool: "{{ tool }}"
                  result: error
                  message: "Unknown anchor '{{ anchor }}'. Valid: wake, morning, daytime, evening, night, late_night"
            else:
            - variables:
                _anc_conflicts: >-
                  {%- set _names = ['wake','morning','daytime','evening','night','late_night'] -%}
                  {%- set _eids = ['input_datetime.zen_am_start','input_datetime.zen_morning_start','input_datetime.zen_daytime_start','input_datetime.zen_evening_start','input_datetime.zen_night_start','input_datetime.zen_late_night_start'] -%}
                  {%- set ns = namespace(t=[], c=[]) -%}
                  {%- for i in range(6) -%}
                    {%- if _names[i] == (anchor | trim) -%}
                      {%- set ns.t = ns.t + [value | trim] -%}
                    {%- else -%}
                      {%- set ns.t = ns.t + [states(_eids[i])] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {%- for i in range(5) -%}
                    {%- if ns.t[i] not in ['unknown', 'unavailable', ''] and ns.t[i+1] not in ['unknown', 'unavailable', ''] and ns.t[i] >= ns.t[i+1] -%}
                      {%- set ns.c = ns.c + [_names[i] ~ '/' ~ _names[i+1]] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ ns.c }}
            - if: "{{ _anc_conflicts | length > 0 }}"
              then:
              - variables:
                  response:
                    tool: "{{ tool }}"
                    result: error
                    blocked: true
                    message: >-
                      Overlapping invalid set for {{ _anc_conflicts | join(', ') }}: {{ value }} conflicts with adjacent anchor(s).
                      Agent should suggest corrected anchor times that maintain strict ascending order: wake < morning < daytime < evening < night < late_night.
                    proposed_anchor: "{{ anchor }}"
                    proposed_time: "{{ value }}"
                    current_anchors:
                      wake: "{{ states('input_datetime.zen_am_start') }}"
                      morning: "{{ states('input_datetime.zen_morning_start') }}"
                      daytime: "{{ states('input_datetime.zen_daytime_start') }}"
                      evening: "{{ states('input_datetime.zen_evening_start') }}"
                      night: "{{ states('input_datetime.zen_night_start') }}"
                      late_night: "{{ states('input_datetime.zen_late_night_start') }}"
              else:
              - action: input_datetime.set_datetime
                target:
                  entity_id: "{{ _target_eid }}"
                data:
                  time: "{{ value }}"
              - variables:
                  response:
                    tool: "{{ tool }}"
                    result: ok
                    action: set
                    anchor: "{{ anchor }}"
                    time: "{{ value }}"
          else:
          - variables:
              response:
                tool: "{{ tool }}"
                result: ok
                action: get
                anchors:
                  wake: "{{ states('input_datetime.zen_am_start') }}"
                  morning: "{{ states('input_datetime.zen_morning_start') }}"
                  daytime: "{{ states('input_datetime.zen_daytime_start') }}"
                  evening: "{{ states('input_datetime.zen_evening_start') }}"
                  night: "{{ states('input_datetime.zen_night_start') }}"
                  late_night: "{{ states('input_datetime.zen_late_night_start') }}"
                note: "To set: anchor=<name> value=HH:MM. Names: wake, morning, daytime, evening, night, late_night"

      - conditions:
        - alias: guest_mode toggle
          condition: template
          value_template: "{{ tool == 'guest_mode' }}"
        sequence:
        - if: "{{ value | default('') | trim | lower in ['on', 'true', '1'] }}"
          then:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.zen_guest_mode
          else:
          - if: "{{ value | default('') | trim | lower in ['off', 'false', '0'] }}"
            then:
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.zen_guest_mode
        - variables:
            response:
              tool: "{{ tool }}"
              result: ok
              guest_mode: "{{ is_state('input_boolean.zen_guest_mode', 'on') }}"
              action: "{{ 'set' if value | default('') | trim != '' else 'get' }}"

      - conditions:
        - alias: entertaining toggle
          condition: template
          value_template: "{{ tool == 'entertaining' }}"
        sequence:
        - if: "{{ value | default('') | trim | lower in ['on', 'true', '1'] }}"
          then:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.zen_entertaining
          else:
          - if: "{{ value | default('') | trim | lower in ['off', 'false', '0'] }}"
            then:
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.zen_entertaining
        - variables:
            response:
              tool: "{{ tool }}"
              result: ok
              entertaining: "{{ is_state('input_boolean.zen_entertaining', 'on') }}"
              action: "{{ 'set' if value | default('') | trim != '' else 'get' }}"

      default:
      - variables:
          response: "{{\n  {\n    \"tool\": tool | default('N/A'),\n    \"confirm\":
            confirm | default(false),\n    \"result\": \"error\",\n    \"message\":
            \"No tool selected.\"\n  }\n}}"
    - variables:
        response: "{{ response | combine({'caller_token': caller_token | default('')}) if response is mapping else response }}"
    - stop: return
      response_variable: response
    alias: Zen DojoTools SystemTools
    description: >-
      Zen DojoTools SystemTools (2.3.0) — ZenOS platform kernel: health, YAML
      reload, notifications, repairs, home-mode/settings control. CALL
      mode=help FIRST — it has the full mode list, the reload-tool decision
      guide (ha_reload_all vs surgical scripts/automations/templates/
      template_entities — a common mix-up), FG gotchas, and the
      home-mode-stripe contract; this description only sketches the surface.
      Quick map: zen_health_report (system health) | pipeline (summarizer
      monitor) | render_dojo/render_system/prompt_health (prompt inspection)
      | pnotif_list/raise/edit/dismiss (notifications) | repairs_list/
      repair_fix/notice_dashboard (repairs+triage, start here) | ha_reload_*
      + ha_restart + ha_config_check (YAML reload, config-checked;
      ha_reload_all/ha_restart require confirm_action=true, NEVER
      self-confirm) | home_status/home_mode/quiet_hours/work_hours/
      scheduler_anchors/guest_mode/entertaining (household settings;
      home_mode set REFUSED while Paused, no bypass).
    fields:
      mode:
        selector:
          select:
            options:
            - zen_resolver_refresh
            - zen_health_report
            - help
            - ha_reload_all
            - ha_reload_scripts
            - ha_reload_automations
            - ha_reload_templates
            - ha_reload_template_entities
            - ha_restart
            - ha_config_check
            - ha_update_install
            - ha_update_skip
            - ha_update_clear_skipped
            - cabinet_schema_upgrade
            - pipeline
            - render_dojo
            - render_system
            - prompt_health
            - pnotif_list
            - pnotif_raise
            - pnotif_edit
            - pnotif_dismiss
            - repairs_list
            - repair_fix
            - notice_dashboard
            - tool_manifest
            - kfc_manifest
            - home_status
            - home_mode
            - quiet_hours
            - work_hours
            - scheduler_anchors
            - guest_mode
            - entertaining
            - zen_ha_cli_probe
            - zen_supervisor_probe
            - zen_log_enable
      tool:
        selector:
          text:
        description: "Alias for mode — accepted for backward compatibility"
      confirm_action:
        selector:
          boolean:
        name: confirm_action
        description: User has confirmed action (for protected and confirmation required)
      verbose:
        selector:
          boolean:
        name: Verbose
        description: >-
          notice_dashboard only. Default false: each section (alerts,
          notifications, repairs, updates) returns a count plus a short
          preview (first 3), and anchor conflicts collapse into one summary
          instead of one entry per pair. Pass true for the full, untruncated
          dump of everything (large — most callers don't need this).
      entity_id:
        selector:
          text:
        description: Entity ID to target - REQUIRED for 'Update' actions
      do_backup:
        selector:
          text:
        name: Backup before Install
        description: Flag backup before install or change, Default off - ask the end
          user.
      period_hours:
        name: Period Hours
        description: Lookback window in hours (1–24). Default 3.
        selector:
          number:
            min: 1
            max: 24
        default: 3
      page:
        name: Page
        description: Logbook page number (page_size=20). Default 1.
        selector:
          number:
            min: 1
            max: 50
        default: 1
      notif_id:
        name: Notification ID
        description: ID for pnotif_raise/edit/dismiss. Slug-style, no spaces.
        selector:
          text:
      notif_title:
        name: Notification Title
        description: Title for pnotif_raise or pnotif_edit.
        selector:
          text:
      notif_message:
        name: Notification Message
        description: Body text for pnotif_raise or pnotif_edit.
        selector:
          text:
      repair_domain:
        name: Repair Domain
        description: Handler domain for repair_fix (e.g. homeassistant). From repairs_list.
        selector:
          text:
      issue_id:
        name: Repair Issue ID
        description: issue_id for repair_fix. From repairs_list response.
        selector:
          text:
      value:
        selector:
          text:
        description: "Set value for home settings modes. quiet_hours/work_hours: 'HH:MM/HH:MM'. scheduler_anchors: 'HH:MM'. home_mode: mode name. guest_mode/entertaining: on/off."
      anchor:
        selector:
          text:
        description: "Anchor name for scheduler_anchors set. One of: wake, morning, daytime, evening, night, late_night."
      caller_token:
        name: Caller Token
        description: Opaque token passed through by the caller for correlation. Not interpreted by this script.
        required: false
        selector:
          text:

  zen_dojotools_ha_log_viewer:
    alias: Zen DojoTools HA Log Viewer
    description: "Zen DojoTools HA Log Viewer PRO (1.1.0)\nLLM Instructions (general-purpose):\n\
      Retrieves Home Assistant core logs using safe, pre-approved shell commands.\n\
      Log file guard detects HA 2025.11+ journal mode automatically — missing log\n\
      file returns structured journal_mode guidance instead of an error.\n\nModes:\n\
      \  - tail:    last N lines (uses \"lines\")\n  - search:  grep-matching lines\
      \ (requires \"pattern\")\n  - full:    entire log (auto-truncated)\n  - summary:\
      \ first N lines (uses \"lines\")\n  - page:    return a specific window of the\
      \ log using \"start\" + \"count\"\n\nInputs:\n  - \"pattern\" (search mode only)\n\
      \  - \"lines\"   (tail + summary)\n  - \"start\"  (page mode)\n  - \"count\"\
      \   (page mode)\n\nOutput is a structured JSON object with:\n  status, mode,\
      \ pattern, lines_requested, truncated, line_count,\n  message, result (log text)\n\
      \nDo not request file writes, deletes, or privileged ops.\n"
    mode: parallel
    fields:
      mode:
        selector:
          select:
            options:
            - tail
            - search
            - full
            - summary
            - page
            - tool_manifest
        default: tail
      pattern:
        selector:
          text:
        default: ''
      lines:
        selector:
          number:
            min: 25
            max: 20000
        default: 5000
      start:
        selector:
          number:
            min: 1
            max: 500000
        default: 1
      count:
        selector:
          number:
            min: 10
            max: 20000
        default: 500
      caller_token:
        name: Caller Token
        description: Opaque token passed through by the caller for correlation. Not interpreted by this script.
        required: false
        selector:
          text:
    sequence:
    # --------------------------------------------------------------
    # Always normalize User/AI inputs so we don't have to react JIT
    # --------------------------------------------------------------
    - variables:
        caller_token: "{{- caller_token | default('') -}}"

    - variables:
        m: '{{ mode }}'
        n: '{{ lines | default(5000) | int(5000) }}'
        s: '{{ start | default(1) | int(1) }}'
        c: '{{ count | default(500) | int(500) }}'
        limit: 240000
    - variables:
        p: >-
          {%- set _raw = pattern | default('', true) | string | trim -%}
          {%- set _safe = _raw | replace("'", "") | replace('"', "") | replace(';', "") | replace('`', "") -%}
          {{ _safe }}
    # --- tool_manifest ---
    - choose:
      - conditions:
        - condition: template
          value_template: "{{- m == 'tool_manifest' -}}"
        sequence:
        - variables:
            result: >-
              {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
              {{- MF.tool_manifest(
                tool='zen_dojotools_ha_log_viewer',
                display_name='HA Log Viewer - Core Log Inspector',
                tier='dojotools',
                version='1.1.0',
                health={'configured': true, 'status': 'ok', 'notes': []},
                required_labels=['dojotools'],
                optional_labels=[],
                consumes=['mode', 'pattern', 'lines', 'start', 'count'],
                returns=['log_text', 'line_count'],
                failure_policy='soft',
                modes={'tail': 'tail', 'search': 'search', 'full': 'full', 'summary': 'summary', 'page': 'page', 'manifest': 'tool_manifest'},
                icon='mdi:text-box-search',
                color='blue-grey',
                stripe=3,
                impact='soft',
                mcp_exposed=true,

                caller_token=caller_token | default('')
              ) | from_json -}}
        - stop: ha_log_viewer tool manifest
          response_variable: result

    # ===== LOG GUARD (Veronica/ZenOS-AI spec, HA 2025.11+ journal behavior) =====
    - action: shell_command.zen_log_check
      response_variable: log_check
    - variables:
        log_file_exists: "{{ 'exists' in (log_check.stdout | default('')) }}"
    - choose:
      - conditions:
        - alias: Log file missing — evaluate version
          condition: template
          value_template: '{{ not log_file_exists }}'
        sequence:
        - variables:
            ha_ver_raw: "{{ state_attr('update.home_assistant_core_update',
              'installed_version') | default('0.0') }}"
        - variables:
            is_modern_ha: >-
              {% set parts = ha_ver_raw.split('.') %}
              {% set major = parts[0] | int %}
              {% set minor = parts[1] | int if parts | length > 1 else 0 %}
              {{ (major > 2025) or (major == 2025 and minor >= 11) }}
        - choose:
          - conditions:
            - alias: journal_mode — expected on HA 2025.11+
              condition: template
              value_template: '{{ is_modern_ha }}'
            sequence:
            - variables:
                final:
                  status: journal_mode
                  log_file_present: false
                  expected_behavior: true
                  root_cause: core_logging_changed_to_journal
                  ha_version: '{{ ha_ver_raw }}'
                  user_guidance:
                    explain:
                    - Persistent home-assistant.log removed in HA 2025.11
                    - Logs now stored in system journal
                    recommended_actions:
                    - Use Settings → System → Logs (live + raw log access)
                    - Use journalctl for system-level access
                    - "Install HACS file-logger to restore persistent log file:\
                      \ https://github.com/Petro31/a-file-logger"
                    do_not:
                    - Do not reinstall Home Assistant
                    - Do not assume corruption or startup failure
                    - Do not treat missing log file as an error
                  caller_token: '{{ caller_token }}'
            - stop: journal_mode
              response_variable: final
          default:
          - variables:
              final:
                status: unexpected_missing_log
                severity: warning
                log_file_present: false
                ha_version: '{{ ha_ver_raw }}'
                possible_causes:
                - startup_failure
                - filesystem_issue
                - logging_misconfiguration
                recommended_actions:
                - Use Settings → System → Logs for recent entries
                - Run ha_config_check via zen_dojotools_systemtools
                - Review supervisor logs via zen_sutra_ha_api
                - Verify /config mount integrity
                caller_token: '{{ caller_token }}'
          - stop: legacy_missing_error
            response_variable: final
    # ===== END GUARD — file exists, proceed with mode dispatch =====
    - variables:
        raw:
          stdout: ''
          stderr: ''
          returncode: -1
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ m == ''tail'' }}'
        sequence:
        - action: shell_command.zen_log_tail
          data:
            lines: '{{ n }}'
          response_variable: raw
      - conditions:
        - condition: template
          value_template: '{{ m == ''search'' }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ not p }}'
            sequence:
            - variables:
                final:
                  status: error
                  message: Search mode requires a non-empty pattern.
                  mode: '{{ m }}'
                  pattern: '{{ p }}'
                  truncated: false
                  line_count: 0
                  lines_requested: '{{ n }}'
                  result: ''
                  caller_token: '{{ caller_token }}'
            - stop: invalid_search
              response_variable: final
        - action: shell_command.zen_log_search
          data:
            pattern: '{{ p }}'
          response_variable: raw
      - conditions:
        - condition: template
          value_template: '{{ m == ''full'' }}'
        sequence:
        - action: shell_command.zen_log_full
          response_variable: raw
      - conditions:
        - condition: template
          value_template: '{{ m == ''summary'' }}'
        sequence:
        - action: shell_command.zen_log_summary
          data:
            count: '{{ n }}'
            start: 1
          response_variable: raw
      - conditions:
        - condition: template
          value_template: '{{ m == ''page'' }}'
        sequence:
        - action: shell_command.zen_log_page
          data:
            start: '{{ s }}'
            count: '{{ c }}'
          response_variable: raw
    - variables:
        stdout: '{{ raw.stdout | default('''') }}'
        stderr: '{{ raw.stderr | default('''') }}'
        combined: "{{ (stdout ~ '\n' ~ stderr) | trim }}"
    - variables:
        safe: "{% set txt = combined | string %}\n{% if txt | length > limit %}\n  {{
          txt[:limit] ~ '\\n... [truncated for safety]' }}\n{% else %}\n  {{ txt }}\n{%
          endif %}\n"
        truncated: '{{ (combined | length) > limit }}'
        count: "{{ safe.split('\n') | length }}"
        final:
          status: success
          mode: '{{ m }}'
          pattern: '{{ p }}'
          lines_requested: '{{ n }}'
          truncated: '{{ truncated }}'
          line_count: '{{ count }}'
          message: HA logs returned ({{ m }} mode)
          result: '{{ safe }}'
          caller_token: '{{ caller_token }}'
    - stop: done
      response_variable: final
    icon: mdi:file-find-outline

  zen_dojotools_event_emitter:
    alias: Zen DojoTools Event Emitter
    description: "Zen DojoTools Event Emitter (v4.5.1). Advanced mode for Zen!\nEmits
      structured ZenOS-AI events or returns a dictionary of canonical event shapes.
      Used for breadcrumbs, observability, and trace reconstruction by Zen Constructs
      and the Monastery.\nModes:\n  emit → send a zen_event to the HA EventBus\n  help
      → return well-known event templates (Zen Event Lexicon)\n\nFields:\n  timestamp,
      component, severity, kind, summary, metadata, kata, monk.\n\nFIRED EVENT SHAPE
      (trigger.event.data.event):\n  timestamp, component, severity, kind, summary,
      metadata — ALL six keys present on the bus. kata and monk are NOT included in
      the fired event (internal log only). Automation consumers: access via\n
      trigger.event.data['event']['metadata']['your_key'] | default('').\n\nPayloads
      must remain small; avoid logs or large arrays. This tool never alters system
      state—only emits events or returns definitions.\n"
    fields:
      mode:
        selector:
          select:
            options:
            - emit
            - help
            - tool_manifest
        default: emit
        description: 'Operation mode. emit = send event. help = return canonical event
          shapes.

          '
      component:
        selector:
          text:
        required: true
        description: 'REQUIRED. Subsystem generating the event. Example: "friday", "monastery",
          "filecabinet", "room_manager", "warden".

          '
      severity:
        selector:
          select:
            options:
            - debug
            - info
            - warn
            - error
        default: info
        description: 'Severity of this event.

          '
      kind:
        selector:
          text:
        required: true
        description: 'REQUIRED. Event classifier. Examples: "summary", "summary_force",
          "kata_emit", "heartbeat".

          '
      summary:
        selector:
          text:
        required: true
        description: 'REQUIRED. Human-readable summary (1–2 sentences).

          '
      metadata:
        selector:
          object:
        default: {}
        description: 'OPTIONAL. Small structured details (no logs or large arrays).

          '
      kata:
        selector:
          object:
        default: {}
        description: 'OPTIONAL. Tiny kata snapshot.

          '
      monk:
        selector:
          object:
        default: {}
        description: 'OPTIONAL. Miniature reasoning breadcrumb.

          '
      caller_token:
        name: Caller Token
        description: Opaque token passed through by the caller for correlation. Not interpreted by this script.
        required: false
        selector:
          text:
    mode: parallel
    sequence:
    # --------------------------------------------------------------
    # Always normalize User/AI inputs so we don't have to react JIT
    # --------------------------------------------------------------
    - variables:
        caller_token: "{{- caller_token | default('') -}}"

    # --- tool_manifest ---
    - choose:
      - conditions:
        - condition: template
          value_template: "{{- mode | default('') == 'tool_manifest' -}}"
        sequence:
        - variables:
            result: >-
              {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
              {{- MF.tool_manifest(
                tool='zen_dojotools_event_emitter',
                display_name='Event Emitter - ZenOS Event Bus',
                tier='dojotools',
                version='1.0.0',
                health={'configured': true, 'status': 'ok', 'notes': []},
                required_labels=['dojotools'],
                optional_labels=[],
                consumes=['component', 'severity', 'kind', 'summary', 'metadata'],
                returns=['event_id'],
                failure_policy='soft',
                modes={'emit': 'emit', 'help': 'help', 'manifest': 'tool_manifest'},
                icon='mdi:lightning-bolt',
                color='amber',
                stripe=3,
                impact='soft',
                mcp_exposed=true,

                caller_token=caller_token | default('')
              ) | from_json -}}
        - stop: event_emitter tool manifest
          response_variable: result

    - choose:
      - conditions:
        - condition: template
          value_template: '{{ mode == ''help'' }}'
        sequence:
        - variables:
            well_known_events:
              summary_force:
                component: any
                kind: summary_force
                severity: info
                summary: Forcing immediate Zen summary of (Kung fu component id)
                metadata:
                  force: summary
                kata: {}
                monk: {}
              caller_token: '{{ caller_token }}'
        - variables:
            _dom_inner: "{{ well_known_events | combine({'domain': 'comms', 'peers': {'postman': 'zen_dojotools_postman'}, 'see_also': 'zen_dojotools_manifest mode=domains name=comms'}) }}"
        - variables:
            well_known_events: "{{ {'status': 'help', 'help': _dom_inner} }}"
        - stop: done
          response_variable: well_known_events
    - variables:
        ts: '{{ now().isoformat() }}'
        evt:
          timestamp: '{{ ts }}'
          component: '{{ component }}'
          severity: '{{ severity }}'
          kind: '{{ kind }}'
          summary: '{{ summary }}'
          metadata: '{{ metadata | default({}) }}'
          kata: '{{ kata | default({}) }}'
          monk: '{{ monk | default({}) }}'
    - event: zen_event
      event_data:
        event:
          timestamp: '{{ ts }}'
          component: '{{ component }}'
          severity: '{{ severity }}'
          kind: '{{ kind }}'
          summary: '{{ summary }}'
          metadata: '{{ metadata | default({}) }}'
    - data:
        message: 'zen_event {{ evt.component }} | {{ evt.kind }} | {{ evt.severity }}
          | summary="{{ evt.summary }}" | meta={{ evt.metadata | tojson }}

          '
        level: "{{ 'warning' if severity == 'warn' else severity }}"
      action: system_log.write
    - variables:
        final:
          status: success
          message: Zen event emitted
          event: '{{ evt }}'
          caller_token: '{{ caller_token }}'
    - stop: done
      response_variable: final
