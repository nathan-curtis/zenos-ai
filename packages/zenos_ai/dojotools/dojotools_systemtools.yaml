###############################################################################
# ZenOS-AI DojoTools: SystemTools Package
# Version: 5.2.3
#
# 5.2.3 — check_response (config check_config path) parses a raw-string HA
#   response instead of silently collapsing to {} when Content-Type detection
#   misses JSON — that always read as invalid/nogo regardless of real config
#   validity. notice_dashboard gains a `verbose` field (default false): counts
#   + a short preview (first 3) per section, anchor conflicts collapse into
#   one summary — every section AND action_queue restating full detail was
#   roughly doubling response size on any system with more than a couple
#   non-green items. `verbose: true` restores the full untruncated dump.
#
# 5.2.2 — zen_health_report now checks for the Spook HACS integration
#   directly (via zen_sutra_ha_api's whitelisted GET /api/services, checking
#   for homeassistant.create_label) and surfaces dependencies.spook_installed
#   plus a top-priority diagnosis line when missing. Root-caused on a fresh
#   T:\ clean-room build: homeassistant.create_label/rename_label/remove_label
#   are Spook-provided, not core HA — without Spook, Flynn Gate 0 (auto-create
#   missing labels) fails with an opaque "unknown action" automation error
#   that gave zero indication it was a missing prerequisite rather than a
#   bug. Prerequisite was already documented in getting_started/install.md;
#   the gap was that nothing in the running system pointed back to it.
#
# 5.2.1 — zen_health_report now surfaces sensor.zen_label_health directly
#   (state + reason, as health_sensors.labels/reasons.labels) instead of only
#   borrowing its text second-hand through agent_health. Added
#   label_cabinet_consistency: label_health and cabinet_health both derive
#   missing-required-label state from the same source (labels() + the same
#   hardcoded label-name lists) and should always agree; when label_health
#   reports critical (real missing labels) but cabinet_health doesn't, that's
#   a stale-template-render disagreement, not two separate problems — flagged
#   distinctly in the diagnosis instead of requiring manual cross-referencing.
#
# Consolidated from: dojotools_ha_api.yaml + dojotools_system.yaml
# Contains: zen_log_* shell_commands, ha_api rest_commands,
#           zen_sutra_ha_api (internal), zen_dojotools_systemtools (MCP),
#           zen_dojotools_ha_log_viewer (MCP), zen_dojotools_event_emitter (MCP)
#
# CHANGELOG:
#   5.2.0 (Zen pull, 2026-07-04) — kfc_manifest mode for zen_dojotools_systemtools
#     (zen_system component, rollup-only). New home_status/home_mode, quiet_hours/
#     work_hours, scheduler_anchors (6 named anchors, overlap-blocked writes),
#     guest_mode/entertaining, proactive anchor-conflict detection. New
#     tool_manifest early-exit for zen_sutra_ha_api.
#     Zen-side fix (not on H): anchor_order_valid/anchor_conflicts in home_status,
#     AND the scheduler_anchors setter's own conflict check, now filter
#     unknown/unavailable anchor values before string comparison, matching the
#     guard already present in the health-report path — an unavailable
#     input_datetime helper no longer produces a false conflict or (in the
#     setter) a false block on a legitimate anchor change.
#     Zen-side fix (not on H, caught by Nyx 2026-07-04): tool_manifest and
#     kfc_manifest both still reported version='5.1.1' despite the header
#     bump to 5.2.0 — same stale-version class as the alertmanager fix above.
#     Both aligned to 5.2.0.
#   4.8.0 (2026-05-20) — zen_dojotools_systemtools: repairs + notice dashboard (v5.1.0).
#     repairs_list — GET /api/repairs/issues, structured issue list (issue_id, domain, severity, is_fixable).
#     repair_fix — POST /api/repairs/issues/fix, confirm required, repair_domain + issue_id fields.
#     notice_dashboard — aggregate: ZenOS active alerts + persistent notifications + HA repairs in one call.
#     allowed_paths += repairs/issues (ha_api internal whitelist).
#   4.7.0 (2026-05-19) — zen_dojotools_systemtools: persistent notification management (v5.1.0).
#     pnotif_list, pnotif_raise, pnotif_edit, pnotif_dismiss. Fields: notif_id, notif_title, notif_message.
#   4.6.0 (2026-05-19) — zen_dojotools_systemtools: prompt inspection suite (v5.1.0).
#     render_dojo: live render of dojo_loader() — KFC section as the active agent sees it.
#     render_system: live render of prompt_system() — purpose/directives/cortex.
#     prompt_health: prompt_health_check() + prompt_length_audit() + guidance pointer.
#     No target needed — all three auto-resolve active persona.
#   4.5.9 (2026-05-18) — zen_dojotools_systemtools: all reload modes now config-check
#     gated. ha_reload_scripts, ha_reload_automations, ha_reload_templates each call
#     check_config first — nogo blocks the reload and returns errors. Matches the
#     existing gate on ha_reload_all and ha_restart. All reload responses now include
#     config_check: passed on success.
#   4.5.8 (2026-05-18) — zen_dojotools_systemtools: ha_reload_scripts + ha_reload_all
#     now deferred via zen_event (kind: deferred_script_reload / deferred_reload_all).
#     Scheduler dispatches from automation context — no more self-destruct
#     InvalidStateError. Tool version bumped to 1.9.5. Scheduler 4.5.5 gets
#     two new triggers + dispatch branches for both deferred reload kinds.
#   4.5.7 (2026-05-18) — zen_dojotools_systemtools: added tool=pipeline (v5.1.0).
#     Ninja summarizer pipeline monitor — logbook ingestion, per-component
#     freshness, scheduler history, queue depth, dynamic flags, and static
#     KFC trigger pattern recommendations. Default 3h window, optional 24h,
#     paginated (page_size=20).
#   4.6.0 (2026-05-02) — zen_dojotools_systemtools: added cabinet_schema_upgrade (v5.1.0).
#     Passthrough to zen_admintools_cabinetadmin op: flip_schema_version (schema_version: 1).
#     Exposes pre-RC2 → current schema migration as an MCP-callable tool.
#   4.2.0 (2026-03-19) — zen_dojotools_systemtools: added zen_health_report (v5.1.0).
#     Reads all three health sensors, returns overall ok/issues_found + per-sensor
#     diagnosis string. Voice-ready. Migrated from admintools namespace.
#   4.1.0 (2026-03-15) — zen_dojotools_systemtools: added ha_reload_all,
#     ha_reload_scripts, ha_reload_automations, ha_reload_templates.
#     Full reload/restart decision guide in tool description.
#     No ha_api or whitelist changes required — reloads use HA service
#     calls directly (same path as ha_restart → homeassistant.restart).
#   4.5.x — initial consolidated release
#
# SETUP:
#   1. Add to secrets.yaml:
#        ha_bearer: "Bearer <your-long-lived-token>"
#      (generate at http://homeassistant.local:8123/profile/security)
#   2. Drop this file into packages/. No other configuration needed.
#   3. Expose zen_dojotools_systemtools, zen_dojotools_ha_log_viewer,
#      zen_dojotools_event_emitter to your conversation agent via
#      Settings → Voice Assistants → Expose.
#      DO NOT expose zen_sutra_ha_api — it is an internal primitive.
#
# SECURITY MODEL:
#   - All HA API calls use 127.0.0.1:8123 (localhost only, no IP config needed)
#   - Auth token is read-once from secrets.yaml; never passed at call time
#   - ha_api_get paths are whitelisted — arbitrary /api/... GET is blocked
#   - All write operations (restart, install, skip) require confirm=true
#   - Reload ops are unguarded — non-destructive, no confirm needed
#   - No access to /states, /templates, cabinet sensors, or room control
#
# JOURNAL MODE GUARD (HA 2025.11+):
#   home-assistant.log was removed in HA 2025.11. zen_dojotools_ha_log_viewer
#   detects this automatically via zen_log_check + HA version check. Missing log
#   file returns a structured journal_mode response (not an error) with guidance
#   including the Petro31 HACS file-logger restoration link.
#
# === UAT PASS — 2026-03-03 (4.5.x baseline) ===
# Auditor: Caitlin (Anthropic, Sonnet 4.6) + Veronica (OAI, editorial)
# HALMark: 0.9.10-draft — PASS Level 3 (Steward Safe) — 23/25 PASS, 2/25 N/A
# UAT Cases: 20/20 PASS
#
# zen_sutra_ha_api:
#   help, check_config, error_log, supervisor_logs, events, services,
#   config, health, supervisor, get (whitelisted), get (blocked), unknown → all PASS
# zen_dojotools_systemtools:
#   ha_restart (no confirm), ha_config_check, ha_restart (config pass),
#   ha_restart (config fail), ha_update_install (no entity_id),
#   ha_update_install, ha_update_skip, ha_update_clear_skipped, unknown → all PASS
# zen_dojotools_ha_log_viewer:
#   file exists, missing+modern HA (journal_mode), missing+legacy HA,
#   tail, search (pattern), search (no pattern), full, summary, page → all PASS
# zen_dojotools_event_emitter:
#   emit, help → PASS
#
# Live verified (session 2026-03-03):
#   ha_config_check → {result: go} ✓
#   ha_restart (clean config) → {config_check: passed, result: success} ✓
#   ha_restart (canary YAML injected) → {result: nogo, restart: blocked} ✓
#   log viewer tail → {status: success} ✓
#   log viewer journal_mode (log renamed) → {status: journal_mode, expected_behavior: true} ✓
#
# === UAT PENDING — 4.1.0 reload tools ===
# ha_reload_all, ha_reload_scripts, ha_reload_automations, ha_reload_templates
# ==============================
#
# KNOWN BEHAVIORS:
#   - Log output is truncated at 240KB in script logic (shell_commands cap at 200KB)
#   - ha_api_post responses: if HA returns non-JSON, check_response silently becomes {}
#     (safe fallback, but API error details may be lost — check HA logs if nogo fires)
#
# === SYSTEMTOOLS CHARTER ===
# This package is the ZenOS-AI system kernel. All additions must pass these gates:
#   1. PLATFORM-LEVEL only — system hygiene, safety, observability, or lifecycle.
#      Not household automation, domain work, or user workflows.
#   2. PRIMITIVE — small, deterministic, single-purpose. Not convenience wrappers.
#   3. GUARDED — every write op requires confirm=true or a whitelist. No raw passthrough.
#
# ALLOWED: config validation, restart gates, log/health reads, API broker, updates/backups
# NOT ALLOWED: /states access, cabinet sensors, room control, arbitrary service writes
# ===========================
###############################################################################

shell_command:

  # Log file existence check — supports log viewer journal_mode guard
  zen_log_check: >
    sh -c "[ -f /config/home-assistant.log ] && echo exists || echo missing"

  zen_log_tail: >
    sh -c "tail -n {{ lines }} /config/home-assistant.log | head -c 200000"

  # Full log (truncated at 200k chars by script)
  zen_log_full: >
    sh -c "cat /config/home-assistant.log | head -c 200000"

  zen_log_page: >
    sh -c "tail -n +{{ start }} /config/home-assistant.log | head -n {{ count }} | head -c 200000"

  zen_log_search: >
    sh -c "grep -En '{{ pattern }}' /config/home-assistant.log | head -c 200000 || true"

  zen_log_summary: >
    sh -c "head -n {{ count }} /config/home-assistant.log | tail -n +{{ start }} | head -c 200000"

  # PROBE ONLY (2026-08-08) — read-only feasibility check for whether the
  # Supervisor CLI ('ha' binary) is reachable from Core's own container.
  # CONFIRMED LIVE: not reachable ("not_found") — Core's container doesn't
  # carry the Supervisor-side 'ha' binary. Kept as a permanent diagnostic,
  # harmless either way.
  zen_ha_cli_probe: >
    sh -c "which ha 2>/dev/null || echo not_found"

  # SUPERVISOR TOKEN — reads $SUPERVISOR_TOKEN (a real container env var,
  # confirmed present even though the 'ha' CLI binary itself is not) and
  # formats it as a ready-to-use Authorization header value. Deliberately
  # NEVER persisted to any entity/sensor state (which would expose it in
  # history/logbook) — captured fresh into a script-local variable at
  # call time only, then discarded. This is what makes calling the
  # Supervisor REST API (http://supervisor/...) possible from a script —
  # !env_var in secrets.yaml can't be concatenated with a "Bearer "
  # prefix (confirmed via docs: the tag must be the entire scalar value),
  # so building the header this way is the actual working path.
  zen_supervisor_token: >
    sh -c "echo -n \"Bearer $SUPERVISOR_TOKEN\""

rest_command:

  # SUPERVISOR API (2026-08-08) — generic authenticated call to
  # http://supervisor/<path>, e.g. path=core/info (read-only, safe),
  # path=core/options (POST, sets duplicate_log_file — the fix for T's
  # journal-mode log-access gap), path=core/rebuild / core/restart
  # (POST, disruptive — same class as ha_restart, must be config-check-
  # gated + human-confirmed, never self-confirmed). token is supplied
  # per-call from shell_command.zen_supervisor_token's output, not stored.
  # SPLIT get/post (2026-08-08, matches ha_api_get/ha_api_post below) —
  # method: does not appear to support templating in rest_command
  # (every working entry in this file hardcodes a literal GET/POST); a
  # single templated-method entry silently failed to register at all.
  zen_supervisor_get:
    url: "http://supervisor/{{ path }}"
    method: GET
    headers:
      authorization: "{{ token }}"
      content-type: "application/json"
    timeout: 60

  zen_supervisor_post:
    url: "http://supervisor/{{ path }}"
    method: POST
    headers:
      authorization: "{{ token }}"
      content-type: "application/json"
    payload: "{{ payload | default('{}') }}"
    timeout: 60

  ha_api_get:
    url: "http://127.0.0.1:8123/api/{{ path }}"
    method: GET
    headers:
      authorization: !secret ha_bearer
      content-type: 'application/json'

  ha_api_post:
    url: "http://127.0.0.1:8123/api/{{ path }}"
    method: POST
    headers:
      authorization: !secret ha_bearer
      content-type: 'application/json'
    payload: "{{ payload | default('{}') }}"
    timeout: 90

input_datetime:
  zen_last_reload_all_at:
    name: "Zen: Last ha_reload_all Timestamp"
    icon: mdi:clock-alert
    has_date: true
    has_time: true

script:

  zen_sutra_ha_api:
    alias: Zen DojoTools HA API
    description: >-
      Home Assistant system-level API wrapper. Tokenless at call-time —
      auth handled inside rest_command. Provides config check (go/nogo),
      core logs, supervisor logs, events, services, system health, and
      whitelisted GET. No /states, no cabinet sensors, no templates.
      Use action_type=check_config for pre-restart YAML validation.
    mode: parallel
    icon: mdi:api
    fields:
      mode:
        description: "Alias for action_type — preferred dispatch field."
        selector:
          select:
            options:
            - help
            - check_config
            - error_log
            - supervisor_logs
            - events
            - services
            - config
            - health
            - supervisor
            - get
            - tool_manifest
      action_type:
        selector:
          select:
            options:
            - help
            - check_config
            - error_log
            - supervisor_logs
            - events
            - services
            - config
            - health
            - supervisor
            - get
            - tool_manifest
        default: help
      path:
        name: API Path (whitelisted only)
        description: Path for the 'get' action. Must be in allowed_paths list.
        selector:
          text:
      has_service:
        name: Service existence check (services action only)
        description: >-
          Optional 'domain.service' (e.g. homeassistant.create_label). When set on
          the 'services' action, checks the FULL (untruncated) services registry
          server-side and returns only a boolean — avoids the 220000-char
          truncation on the general services dump silently corrupting the check
          for services that sort late in a large registry.
        required: false
        selector:
          text:
      caller_token:
        name: Caller Token
        description: Opaque token passed through by the caller for correlation. Not interpreted by this script.
        required: false
        selector:
          text:
    sequence:

    # --------------------------------------------------------------
    # Always normalize User/AI inputs so we don't have to react JIT
    # --------------------------------------------------------------
    - variables:
        caller_token: "{{- caller_token | default('') -}}"

    - variables:
        op: "{{ mode | default(action_type | default(''), true) | string | trim | lower }}"
        requested_path: '{{ path | default('''') }}'
        allowed_paths:
        - error_log
        - events
        - services
        - config
        - system_health/info
        - hassio/info
        - hassio/logs

    # --- tool_manifest early exit ---
    - if: "{{ op == 'tool_manifest' or action_type | default('') == 'tool_manifest' }}"
      then:
      - variables:
          result: >-
            {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
            {{- MF.tool_manifest(
              tool='zen_sutra_ha_api',
              display_name='HA API Sutra (Internal)',
              tier='sutra',
              version='1.3.0',
              health={'configured': true, 'status': 'ok', 'notes': []},
              required_labels=['dojotools'],
              optional_labels=['system', 'api'],
              failure_policy='hard',
              mcp_exposed=false,
              stripe=0,
              impact='hard',
              caller_token=caller_token
            ) | from_json -}}
      - stop: zen_sutra_ha_api tool_manifest
        response_variable: result

    - choose:
      - conditions:
        - condition: template
          value_template: '{{ op == ''help'' }}'
        sequence:
        - variables:
            final:
              status: info
              message: Zen DojoTools HA API — System Endpoints
              actions:
                check_config: POST /api/config/core/check_config — go/nogo YAML validation
                core_logs: GET /api/error_log
                supervisor_logs: GET /api/hassio/logs
                events: GET /api/events
                services: GET /api/services
                config: GET /api/config
                health: GET /api/system_health/info
                supervisor: GET /api/hassio/info
                get: GET /api/<path> (whitelisted only)
              notes:
              - Token handled entirely in rest_command. Uses 127.0.0.1:8123.
              - No access to /states, /templates, or cabinet endpoints.
              caller_token: '{{ caller_token }}'
        - stop: help_shown
          response_variable: final

      - conditions:
        - alias: Config Check
          condition: template
          value_template: '{{ op == ''check_config'' }}'
        sequence:
        - action: rest_command.ha_api_post
          data:
            path: config/core/check_config
          response_variable: r
        - variables:
            # r.content is only a mapping when HA's response Content-Type is
            # detected as JSON; on some HA versions/proxies that detection
            # misses and content comes back as a raw string, which silently
            # collapsed to {} here — always reading as invalid/nogo regardless
            # of real config validity. Parse the string case instead of
            # discarding it, and surface an explicit error if truly unparseable
            # rather than a bare 'unknown error'.
            check_response: >-
              {%- set _raw = r.content -%}
              {%- if _raw is mapping -%}
                {{ _raw }}
              {%- else -%}
                {%- set _parsed = (_raw | string | from_json(none)) -%}
                {{ _parsed if _parsed is mapping else {'result': 'invalid', 'errors': 'unparseable_check_config_response: ' ~ (_raw | string | truncate(300))} }}
              {%- endif -%}
        - variables:
            check_valid: "{{ check_response.get('result', 'invalid') == 'valid' }}"
        - variables:
            final:
              result: "{{ 'go' if check_valid else 'nogo' }}"
              valid: "{{ check_valid }}"
              errors: "{{ check_response.get('errors', none) }}"
              message: "{{ 'Config check passed — safe to restart.' if check_valid
                else 'Config check FAILED — do not restart. Errors: '
                  ~ (check_response.get('errors', 'unknown error') | string) }}"
              caller_token: '{{ caller_token }}'
        - stop: check_config_done
          response_variable: final

      - conditions:
        - condition: template
          value_template: '{{ op == ''error_log'' }}'
        sequence:
        - data:
            path: error_log
          action: rest_command.ha_api_get
          response_variable: r
        - variables:
            _raw_len: '{{ 0 if r.content is none else (r.content | string | length) }}'
        - variables:
            safe: >-
              {% if r.content is none %}
                ""
              {% elif _raw_len > 220000 %}
                {{ (r.content | string)[:220000] }}... [truncated]
              {% else %}
                {{ r.content | string }}
              {% endif %}
        - variables:
            final:
              status: success
              message: Core Home Assistant log retrieved.
              truncated: '{{ _raw_len > 220000 }}'
              result: '{{ safe }}'
              caller_token: '{{ caller_token }}'
        - stop: error_log_done
          response_variable: final

      - conditions:
        - condition: template
          value_template: '{{ op == ''supervisor_logs'' }}'
        sequence:
        - data:
            path: hassio/logs
          action: rest_command.ha_api_get
          response_variable: r
        - variables:
            _raw_len: '{{ 0 if r.content is none else (r.content | string | length) }}'
        - variables:
            safe: >-
              {% if r.content is none %}
                ""
              {% elif _raw_len > 220000 %}
                {{ (r.content | string)[:220000] }}... [truncated]
              {% else %}
                {{ r.content | string }}
              {% endif %}
        - variables:
            final:
              status: success
              message: Supervisor logs retrieved.
              truncated: '{{ _raw_len > 220000 }}'
              result: '{{ safe }}'
              caller_token: '{{ caller_token }}'
        - stop: supervisor_logs_done
          response_variable: final

      - conditions:
        - condition: template
          value_template: '{{ op == ''events'' }}'
        sequence:
        - data:
            path: events
          action: rest_command.ha_api_get
          response_variable: r
        - variables:
            _raw_len: '{{ 0 if r.content is none else (r.content | string | length) }}'
        - variables:
            safe: >-
              {% if r.content is none %}
                ""
              {% elif _raw_len > 220000 %}
                {{ (r.content | string)[:220000] }}... [truncated]
              {% else %}
                {{ r.content | string }}
              {% endif %}
        - variables:
            final:
              status: success
              message: Event schema retrieved.
              truncated: '{{ _raw_len > 220000 }}'
              result: '{{ safe }}'
              caller_token: '{{ caller_token }}'
        - stop: events_done
          response_variable: final

      - conditions:
        - condition: template
          value_template: '{{ op == ''services'' }}'
        sequence:
        - data:
            path: services
          action: rest_command.ha_api_get
          response_variable: r
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ (has_service | default('', true) | trim) != '' }}"
            sequence:
            - variables:
                _hs_domain: "{{ (has_service | trim).split('.')[0] }}"
                _hs_service: "{{ (has_service | trim).split('.')[1:] | join('.') }}"
                _hs_http_ok: "{{ (r.status | default(0) | int) in range(200, 300) }}"
            - variables:
                _hs_found: >-
                  {%- if not _hs_http_ok or r.content is none -%}false
                  {%- else -%}
                    {%- set _svc_list = (r.content | from_json([])) if r.content is string else r.content -%}
                    {%- set ns = namespace(found=false) -%}
                    {%- for _d in _svc_list if _d is mapping and _d.get('domain') == _hs_domain -%}
                      {%- if _hs_service in (_d.get('services', {}) or {}) -%}{%- set ns.found = true -%}{%- endif -%}
                    {%- endfor -%}
                    {{ ns.found }}
                  {%- endif -%}
            - variables:
                # BUG FIX (2026-08-01): previously trusted r.content alone —
                # a 401/other non-2xx response (e.g. bad/missing ha_bearer
                # secret) returns a JSON error body like {"message": "..."},
                # which parsed fine as "no matching service" and reported
                # found=false / status=success, indistinguishable from the
                # service genuinely not existing. api_ok now surfaces the
                # real HTTP outcome so callers can tell "checked, not there"
                # apart from "couldn't check at all."
                final:
                  status: "{{ 'success' if _hs_http_ok else 'error' }}"
                  message: "Service existence check for {{ has_service }}."
                  has_service: "{{ has_service }}"
                  found: "{{ _hs_found }}"
                  api_ok: "{{ _hs_http_ok }}"
                  api_status: "{{ r.status | default(none) }}"
                  caller_token: "{{ caller_token }}"
            - stop: services_has_service_done
              response_variable: final
        - variables:
            _raw_len: '{{ 0 if r.content is none else (r.content | string | length) }}'
        - variables:
            safe: >-
              {% if r.content is none %}
                ""
              {% elif _raw_len > 220000 %}
                {{ (r.content | string)[:220000] }}... [truncated]
              {% else %}
                {{ r.content | string }}
              {% endif %}
        - variables:
            final:
              status: success
              message: Service registry retrieved.
              truncated: '{{ _raw_len > 220000 }}'
              result: '{{ safe }}'
              caller_token: '{{ caller_token }}'
        - stop: services_done
          response_variable: final

      - conditions:
        - condition: template
          value_template: '{{ op == ''config'' }}'
        sequence:
        - data:
            path: config
          action: rest_command.ha_api_get
          response_variable: r
        - variables:
            _raw_len: '{{ 0 if r.content is none else (r.content | string | length) }}'
        - variables:
            safe: >-
              {% if r.content is none %}
                ""
              {% elif _raw_len > 220000 %}
                {{ (r.content | string)[:220000] }}... [truncated]
              {% else %}
                {{ r.content | string }}
              {% endif %}
        - variables:
            final:
              status: success
              message: System config retrieved.
              truncated: '{{ _raw_len > 220000 }}'
              result: '{{ safe }}'
              caller_token: '{{ caller_token }}'
        - stop: config_done
          response_variable: final

      - conditions:
        - condition: template
          value_template: '{{ op == ''health'' }}'
        sequence:
        - data:
            path: system_health/info
          action: rest_command.ha_api_get
          response_variable: r
        - variables:
            _raw_len: '{{ 0 if r.content is none else (r.content | string | length) }}'
        - variables:
            safe: >-
              {% if r.content is none %}
                ""
              {% elif _raw_len > 220000 %}
                {{ (r.content | string)[:220000] }}... [truncated]
              {% else %}
                {{ r.content | string }}
              {% endif %}
        - variables:
            final:
              status: success
              message: System health retrieved.
              truncated: '{{ _raw_len > 220000 }}'
              result: '{{ safe }}'
              caller_token: '{{ caller_token }}'
        - stop: health_done
          response_variable: final

      - conditions:
        - condition: template
          value_template: '{{ op == ''supervisor'' }}'
        sequence:
        - data:
            path: hassio/info
          action: rest_command.ha_api_get
          response_variable: r
        - variables:
            _raw_len: '{{ 0 if r.content is none else (r.content | string | length) }}'
        - variables:
            safe: >-
              {% if r.content is none %}
                ""
              {% elif _raw_len > 220000 %}
                {{ (r.content | string)[:220000] }}... [truncated]
              {% else %}
                {{ r.content | string }}
              {% endif %}
        - variables:
            final:
              status: success
              message: Supervisor info retrieved.
              truncated: '{{ _raw_len > 220000 }}'
              result: '{{ safe }}'
              caller_token: '{{ caller_token }}'
        - stop: supervisor_done
          response_variable: final

      - conditions:
        - condition: template
          value_template: '{{ op == ''get'' }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ requested_path not in allowed_paths }}'
            sequence:
            - variables:
                final:
                  status: error
                  message: Path not allowed.
                  attempted: '{{ requested_path }}'
                  allowed: '{{ allowed_paths }}'
                  caller_token: '{{ caller_token }}'
            - stop: denied
              response_variable: final
        - data:
            path: '{{ requested_path }}'
          action: rest_command.ha_api_get
          response_variable: r
        - variables:
            _raw_len: '{{ 0 if r.content is none else (r.content | string | length) }}'
        - variables:
            safe: >-
              {% if r.content is none %}
                ""
              {% elif _raw_len > 220000 %}
                {{ (r.content | string)[:220000] }}... [truncated]
              {% else %}
                {{ r.content | string }}
              {% endif %}
        - variables:
            final:
              status: success
              message: GET /api/{{ requested_path }} retrieved.
              truncated: '{{ _raw_len > 220000 }}'
              result: '{{ safe }}'
              caller_token: '{{ caller_token }}'
        - stop: get_done
          response_variable: final

    - variables:
        final:
          status: error
          message: Unknown or invalid action.
          caller_token: '{{ caller_token }}'
    - stop: failure
      response_variable: final

  zen_dojotools_systemtools:
    sequence:
    # --------------------------------------------------------------
    # Always normalize User/AI inputs so we don't have to react JIT
    # --------------------------------------------------------------
    - variables:
        caller_token: "{{- caller_token | default('') -}}"
    - variables:
        tool: "{{ (mode | default('', true) | trim) or (tool | default('', true) | trim) }}"
        confirm: '{{ confirm_action | default(false) }}'
    # --- tool_manifest ---
    - choose:
      - conditions:
        - condition: template
          value_template: "{{- tool == 'tool_manifest' -}}"
        sequence:
        - variables:
            result: >-
              {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
              {{- MF.tool_manifest(
                tool='zen_dojotools_systemtools',
                display_name='SystemTools - ZenOS Platform Kernel',
                tier='dojotools',
                version='5.2.0',
                health={'configured': true, 'status': 'ok', 'notes': []},
                required_labels=['dojotools', 'zen_kfc_provider'],
                optional_labels=['system_monitor', 'system_status'],
                consumes=['tool', 'entity_id', 'confirm_action'],
                returns=['health_report', 'config_check', 'reload_result', 'log_result'],
                failure_policy='hard',
                modes={'health': 'zen_health_report', 'reload': 'ha_reload_all', 'restart': 'ha_restart', 'manifest': 'tool_manifest'},
                icon='mdi:wrench',
                color='grey',
                mcp_exposed=true,
                stripe=1,
                impact='hard',
                caller_token=caller_token | default('')
              ) | from_json | combine({'kfc_manifest': true, 'kfc_components': ['zen_system']}) -}}
        - stop: systemtools tool manifest
          response_variable: result
      - conditions:
        - condition: template
          value_template: "{{- tool == 'kfc_manifest' -}}"
        sequence:
        - variables:
            _kfc_filter: "{{ component | default('') | string | trim | lower if component is defined else '' }}"
            _kfc_defs:
            - kata_key: zen_system
              friendly_name: ZenOS System Health
              label: zen_system
              component_summary: ""
              component_instructions: >-
                Surface health state first. If any sensor is warn or critical, or any pipeline kill switch is off — lead with that. If all ok — single line nominal.

                Priority order for reporting:
                  1. Cabinets missing or unavailable — surface before anything else. No cabinets = no cognition.
                  2. Kill switches off — pipeline_master, supersummary_enabled, ninja_summarizer_enabled. Name the specific switch that is off.
                  3. Summarizer staleness — if zen_summary timestamp > 15 min, flag as stale. > 30 min = critical stale.
                  4. Monk errors — if supersummary_status is error/timeout/none, flag with status value.
                  5. Schema health — if schema_ok false, flag. No template = no monk output structure.

                NAVIGATION — do NOT enumerate entity IDs. Express discovery paths instead:
                  - To find system health sensors: query label 'zen_system'
                  - To find all ZenOS entities: query label 'zen'
                  - To find KFC specs: query label 'dojo'
                  - To find kill switches: query label 'zen_system', filter input_boolean domain
                In watchlist and attention fields, write "entities under label 'zen_system'" not a list of sensor.* IDs. Labels are stable; entity IDs are not. The label IS the scope.

                Do NOT expand individual component kata here — this component owns the rollup signal only. If you see warn/critical on a specific component, name it and stop. The per-component monk will have detail.

                Nominal report format: "ZenOS nominal. [N] components active. Last summary [X] min ago."
                Alert format: "ZenOS [warn|critical]: [specific issue]. [switch name|sensor name|cabinet name]."

                MASTER SWITCH RULE: ZenOS pipeline kill switches (zen_summarizers_enabled, zen_ninja_summarizer_enabled, zen_supersummary_enabled, etc.) being OFF IS a monitored deviation — flag it at priority 2 above. Integration/subsystem master switches (Airspace, Grocy, media zones, or any non-ZenOS feature enable) being off is an intentional user choice — treat as informational only, max urgency contribution 1. Distinguish by name: zen_* kill switches → flag. All others → informational.

                CONVERSATIONAL REFERENCE:
                  When the user says "what's the summary", "give me the summary", "what's the zen summary",
                  "what does the summary say", "summary status", or similar — he means the zen_summary
                  kata from sensor.zenos_kata_cabinet. Read it and present the synthesized view:
                    - active_components with signals → name them and what they're flagging
                    - zen_summary.attention items → mention if anything notable
                    - ambient_nav → sweep in one sentence if nothing urgent
                  Speak the conclusion, not the structure. Don't recite keys — interpret the output.
                  If zen_summary is stale (> 15 min old), note it before presenting.
              trigger_subscriptions:
              - ha_start
              - daily_midnight
              drift_threshold: 5
              emission_cooldown_minutes: 60
              delay_seconds: 0
              suggested_act_event: null
              seed: null
              master_switch: ""
              index_call:
                domain_inspect_domains: []
                domain_inspect_limit: 25
                expand_entities: false
                filter_json: {}
                label_1: zen_system
                label_2: ""
                operator: AND
                output_fields: ""
              meta:
                enabled: true
                requires:
                  cert: ""
                  level: 0
        - variables:
            _kfc_out: >-
              {%- if _kfc_filter == '' -%}
                {{ _kfc_defs }}
              {%- else -%}
                {{ _kfc_defs | selectattr('kata_key', 'equalto', _kfc_filter) | list }}
              {%- endif -%}
            result:
              status: ok
              tool: zen_dojotools_systemtools
              version: "5.2.0"
              mode: kfc_manifest
              kfc: "{{ _kfc_out }}"
              count: "{{ _kfc_out | length }}"
              caller_token: "{{ caller_token | default('') }}"
        - stop: kfc_manifest
          response_variable: result

    - choose:
      - conditions:
        - alias: 'Error: Action Not Confirmed'
          condition: template
          value_template: "{{ (tool in ['ha_restart', 'ha_reload_all', 'repair_fix', 'zen_log_enable']) and not confirm }}"
        sequence:
        - variables:
            response: "{{\n  {\n    \"tool\": tool | default('N/A'),\n    \"confirm\":
              confirm | default(false),\n    \"result\": \"error\",\n    \"message\":
              \"CONFIRM REQUIRED. This operation takes HA offline — restart or reload_all both interrupt all automations, scripts, and agent responses for 2-5 minutes. Flynn warmup must complete before the system is viable again. If you meant to do this, retry with confirm_action=true. Prefer ha_reload_scripts, ha_reload_automations, ha_reload_templates, or ha_reload_template_entities — they are surgical and do NOT interrupt service. zen_log_enable specifically also triggers a Supervisor core rebuild + restart — same disruption class, plus it requires ha_config_check to be clean first.\"\n  }\n}}"
      - conditions:
        - alias: 'Error: Entity ID required for Action'
          condition: template
          value_template: "{{ (tool in ['ha_update_install','ha_update_skip']) and (not entity_id or entity_id == '') }}"
        sequence:
        - variables:
            response: "{{\n  {\n    \"tool\": tool | default('N/A'),\n    \"confirm\":
              confirm | default(false),\n    \"result\": \"error\",\n    \"message\":
              \"entity_id is required for ha_update_install and ha_update_skip. Provide a valid entity_id and retry.\"\n  }\n}}"
      - conditions:
        - alias: Zen HA CLI Probe
          condition: template
          value_template: '{{ tool == ''zen_ha_cli_probe'' }}'
        sequence:
        - action: shell_command.zen_ha_cli_probe
          response_variable: cli_probe
        - variables:
            response: "{{
                {
                  'tool': tool,
                  'result': 'ok',
                  'ha_cli_reachable': ('not_found' not in (cli_probe.stdout | default('not_found')) and (cli_probe.stdout | default('') | trim) != ''),
                  'raw_stdout': (cli_probe.stdout | default('') | trim),
                  'raw_returncode': cli_probe.returncode | default(none)
                }
              }}"
      - conditions:
        - alias: Zen Supervisor Probe
          condition: template
          value_template: '{{ tool == ''zen_supervisor_probe'' }}'
        sequence:
        # READ-ONLY (2026-08-08) — confirms the SUPERVISOR_TOKEN + Supervisor
        # REST API auth path actually works, via GET core/info (a harmless
        # read). Deliberately does NOT touch core/options, core/rebuild, or
        # core/restart — this mode exists purely to validate the mechanism
        # before any mutating command gets built on top of it.
        - action: shell_command.zen_supervisor_token
          response_variable: sup_token_raw
        - variables:
            _sup_bearer: "{{ sup_token_raw.stdout | default('') | trim }}"
        - if: "{{ _sup_bearer == '' or _sup_bearer == 'Bearer' }}"
          then:
            - variables:
                response:
                  tool: "{{ tool }}"
                  result: error
                  message: "SUPERVISOR_TOKEN env var is empty or unset — Supervisor API not reachable this way."
          else:
            - action: rest_command.zen_supervisor_get
              data:
                path: core/info
                token: "{{ _sup_bearer }}"
              response_variable: sup_probe
              continue_on_error: true
            - variables:
                response:
                  tool: "{{ tool }}"
                  result: "{{ 'ok' if (sup_probe.status | default(0)) == 200 else 'error' }}"
                  status: "{{ sup_probe.status | default(none) }}"
                  content: "{{ sup_probe.content | default(none) }}"
      - conditions:
        - alias: Zen Log Enable
          condition: template
          value_template: '{{ tool == ''zen_log_enable'' }}'
        sequence:
        # DISRUPTIVE, CONFIRM-GATED (2026-08-08). Ships OFF by default —
        # this mode is the only way it ever turns on, never auto-fired by
        # anything else. Sequence matches Petro's a-file-logger deprecation
        # note exactly (ha core options --duplicate-log-file=true; ha core
        # rebuild; ha core restart), translated to the Supervisor REST API
        # since the 'ha' CLI binary itself isn't reachable from Core's
        # container (confirmed via zen_ha_cli_probe). Reaching this branch
        # already means confirm_action=true (gated above, same list as
        # ha_restart/ha_reload_all/repair_fix) — additionally requires a
        # CLEAN ha_config_check first: "must config check clean and if you
        # cant human must do" — a rebuild on top of broken config is not
        # something to risk, and unlike ha_restart/reload_all this has no
        # cooldown-based undo path.
        - action: script.zen_sutra_ha_api
          data:
            action_type: check_config
          response_variable: log_enable_check
        - if: "{{ not (log_enable_check.valid | default(false)) }}"
          then:
            - variables:
                response:
                  tool: "{{ tool }}"
                  result: error
                  message: "ha_config_check is NOT clean — refusing to rebuild core on top of broken config. Fix the config error first (see errors below), then retry."
                  config_check_errors: "{{ log_enable_check.errors | default(none) }}"
            - stop: zen_log_enable blocked — config not clean
              response_variable: response
        - action: shell_command.zen_supervisor_token
          response_variable: log_enable_token_raw
        - variables:
            _le_bearer: "{{ log_enable_token_raw.stdout | default('') | trim }}"
        - if: "{{ _le_bearer == '' or _le_bearer == 'Bearer' }}"
          then:
            - variables:
                response:
                  tool: "{{ tool }}"
                  result: error
                  message: "SUPERVISOR_TOKEN env var is empty or unset — cannot reach Supervisor API to enable logging."
            - stop: zen_log_enable blocked — no supervisor token
              response_variable: response
        # DISK GUARD (2026-08-08, Nathan: "the risk a persistent log may
        # exhaust disk on large install with many errors... low but real
        # risk") — refuses under 10% free, same threshold zen_health_report
        # flags as LOW DISK. Not a perfect guarantee (a runaway error loop
        # can still fill disk fast at any starting %), but stops the
        # obviously-bad case of turning this on when there's already
        # barely any room.
        - action: rest_command.zen_supervisor_get
          data:
            path: host/info
            token: "{{ _le_bearer }}"
          response_variable: log_enable_disk_check
          continue_on_error: true
        - variables:
            _le_disk_total: "{{ (log_enable_disk_check.content | default({})).get('data', {}).get('disk_total', none) if (log_enable_disk_check.status | default(0)) == 200 else none }}"
            _le_disk_free: "{{ (log_enable_disk_check.content | default({})).get('data', {}).get('disk_free', none) if (log_enable_disk_check.status | default(0)) == 200 else none }}"
            _le_disk_free_pct: >-
              {%- if _le_disk_total not in [none, 0] and _le_disk_free is not none -%}
                {{ ((_le_disk_free / _le_disk_total) * 100) | round(1) }}
              {%- else -%}
                {{ none }}
              {%- endif -%}
        - if: "{{ _le_disk_free_pct is not none and _le_disk_free_pct < 10 }}"
          then:
            - variables:
                response:
                  tool: "{{ tool }}"
                  result: error
                  message: "LOW DISK ({{ _le_disk_free_pct }}% free) — refusing to enable persistent logging. Free up space first, then retry."
                  disk_free_gb: "{{ _le_disk_free }}"
                  disk_total_gb: "{{ _le_disk_total }}"
            - stop: zen_log_enable blocked — low disk
              response_variable: response
        - action: rest_command.zen_supervisor_post
          data:
            path: core/options
            token: "{{ _le_bearer }}"
            payload: '{"duplicate_log_file": true}'
          response_variable: log_enable_options_result
          continue_on_error: true
        - if: "{{ (log_enable_options_result.status | default(0)) != 200 }}"
          then:
            - variables:
                response:
                  tool: "{{ tool }}"
                  result: error
                  message: "core/options call failed — duplicate_log_file was NOT set. Rebuild/restart not attempted."
                  status: "{{ log_enable_options_result.status | default(none) }}"
                  content: "{{ log_enable_options_result.content | default(none) }}"
            - stop: zen_log_enable blocked — options call failed
              response_variable: response
        - action: rest_command.zen_supervisor_post
          data:
            path: core/rebuild
            token: "{{ _le_bearer }}"
            payload: "{}"
          response_variable: log_enable_rebuild_result
          continue_on_error: true
        - variables:
            response:
              tool: "{{ tool }}"
              result: "{{ 'success' if (log_enable_rebuild_result.status | default(0)) == 200 else 'error' }}"
              message: >-
                {%- if (log_enable_rebuild_result.status | default(0)) == 200 -%}
                  duplicate_log_file set to true and core rebuild queued. HA is non-viable until this completes — same as ha_restart/ha_reload_all, POLL for recovery rather than calling other tools immediately. Once back up, home-assistant.log will exist and zen_log_check's journal_mode fallback will stop triggering.
                {%- else -%}
                  core/options succeeded but core/rebuild call failed — duplicate_log_file IS set, but the rebuild that makes it take effect did not fire. Retry mode=zen_log_enable, or trigger a rebuild manually.
                {%- endif -%}
              options_status: "{{ log_enable_options_result.status | default(none) }}"
              rebuild_status: "{{ log_enable_rebuild_result.status | default(none) }}"
      - conditions:
        - alias: Config Check
          condition: template
          value_template: '{{ tool == ''ha_config_check'' }}'
        sequence:
        - action: script.zen_sutra_ha_api
          data:
            action_type: check_config
          response_variable: check_result
        - variables:
            response: "{{
              {
                'tool': tool,
                'result': check_result.result,
                'valid': check_result.valid,
                'errors': check_result.errors,
                'message': check_result.message
              }
            }}"
      - conditions:
        - condition: template
          value_template: '{{tool == ''ha_restart'' and confirm}}'
          alias: HA Restart
        sequence:
        - action: script.zen_sutra_ha_api
          data:
            action_type: check_config
          response_variable: check_result
        - choose:
          - conditions:
            - alias: Config check failed — block restart
              condition: template
              value_template: '{{ check_result.result != ''go'' }}'
            sequence:
            - variables:
                response: "{{
                  {
                    'tool': tool,
                    'result': 'nogo',
                    'errors': check_result.errors,
                    'message': 'Restart BLOCKED — config check failed. Fix errors before restarting.'
                  }
                }}"
          default:
          - action: homeassistant.restart
            metadata: {}
            data: {}
          - variables:
              response: "{{
                {
                  'tool': tool,
                  'confirm': confirm,
                  'result': 'success',
                  'config_check': 'passed',
                  'message': 'Config check passed. HA Restart Initiated. See you on the other side, agent.'
                }
              }}"
      - conditions:
        - alias: Install Update
          condition: template
          value_template: '{{tool == ''ha_update_install'' and confirm}}'
        sequence:
        - action: update.install
          data:
            backup: '{{do_backup | default(false)}}'
          target:
            entity_id: '{{entity_id}}'
        - variables:
            response: "{{\n  {\n    \"tool\": tool | default(''),\n    \"entity_id\":
              entity_id | default(''),\n    \"do_backup\": do_backup | default(false),\n
              \   \"confirm\": confirm | default(false),\n    \"result\": \"success\",\n
              \   \"message\": \"Update install initiated.\"\n  }\n}}"
      - conditions:
        - alias: Skip Update
          condition: template
          value_template: '{{tool == ''ha_update_skip'' and confirm}}'
        sequence:
        - action: update.skip
          target:
            entity_id: '{{entity_id}}'
          data: {}
        - variables:
            response: "{{\n  {\n    \"tool\": tool | default(''),\n    \"entity_id\":
              entity_id | default(''),\n    \"confirm\": confirm | default(false),\n
              \   \"result\": \"success\",\n    \"message\": \"Update Skipped\"\n  }\n}}"
      - conditions:
        - alias: Clear Skipped Update
          condition: template
          value_template: '{{tool == ''ha_update_clear_skipped'' and confirm}}'
        sequence:
        - action: update.clear_skipped
          target:
            entity_id: '{{entity_id}}'
          data: {}
        - variables:
            response: "{{\n  {\n    \"tool\": tool | default(''),\n    \"entity_id\":
              entity_id | default(''),\n    \"confirm\": confirm | default(false),\n
              \   \"result\": \"success\",\n    \"message\": \"Update Un-Skipped\"\n
              \ }\n}}"
      - conditions:
        - alias: Reload All
          condition: template
          value_template: '{{ tool == ''ha_reload_all'' }}'
        sequence:
        - action: script.zen_sutra_ha_api
          data:
            action_type: check_config
          response_variable: check_result
        - variables:
            _last_reload_all_epoch: "{{ as_timestamp(states('input_datetime.zen_last_reload_all_at'), 0) }}"
            _since_last_reload_all: "{{ now().timestamp() - _last_reload_all_epoch }}"
            # COOLDOWN BLOCK (2026-08-04): two ha_reload_all calls fired back-to-back
            # on T wiped 3 trigger-based cabinet sensors clean — HA's restore-state
            # snapshot write is throttled/periodic, not synchronous per-reload, so a
            # second full reload before the first one flushes has nothing to restore
            # from. 180s is a conservative floor, not a measured exact interval.
            # HARD BLOCK, no override field — Nathan's explicit call: let the clock
            # expire for system stability rather than exposing a bypass. Blocked here
            # means the reload never fires at all, same as a failed config check.
            # See: known_bugs #28 (expansion cabinet slot-registry gap + this incident).
            _reload_cooldown_s: 180
            _reload_too_soon: "{{ _last_reload_all_epoch > 0 and _since_last_reload_all < _reload_cooldown_s }}"
        - choose:
          - conditions:
            - alias: Config check failed — block reload
              condition: template
              value_template: '{{ check_result.result != ''go'' }}'
            sequence:
            - variables:
                response: "{{
                  {
                    'tool': tool,
                    'result': 'nogo',
                    'errors': check_result.errors,
                    'message': 'Reload BLOCKED — config check failed. Fix errors before reloading. reload_all would have silently aborted anyway.'
                  }
                }}"
          - conditions:
            - alias: Cooldown active — block reload
              condition: template
              value_template: "{{ _reload_too_soon }}"
            sequence:
            - variables:
                response: "{{
                  {
                    'tool': tool,
                    'result': 'blocked',
                    'cooldown_remaining_s': ((_reload_cooldown_s - _since_last_reload_all) | round(0)),
                    'message': 'Reload BLOCKED — cooldown active. Last ha_reload_all was ' ~ (_since_last_reload_all | round(0)) ~ 's ago; must wait ' ~ _reload_cooldown_s ~ 's between calls. Firing again this soon risks wiping trigger-based cabinet sensors that have not finished flushing their restore-state snapshot from the last reload — expansion cabinets have already been lost this way tonight. No override — wait for the cooldown to expire, or use ha_reload_scripts / ha_reload_automations / ha_reload_templates / ha_reload_template_entities instead, which are not restart-equivalent and are not subject to this cooldown.'
                  }
                }}"
          default:
          - variables:
              response: "{{
                {
                  'tool': tool,
                  'result': 'success',
                  'config_check': 'passed',
                  'message': 'Config check passed. Reload all queued. MANDATORY WAIT: reload_all is restart-equivalent — HA is non-viable until Flynn warmup fires. POLL zen_dojotools_ha_log_viewer mode=search pattern=flynn_boot_warmup and do NOT call any other tools until that entry appears. If flynn_boot_warmup is absent after 5 minutes, something is broken — stop and diagnose. Prefer ha_reload_scripts / ha_reload_automations / ha_reload_templates / ha_reload_template_entities fired sequentially with a delay — they are always cheaper and do not interrupt service.'
                }
