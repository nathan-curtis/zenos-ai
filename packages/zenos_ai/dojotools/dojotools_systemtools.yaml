###############################################################################
# ZenOS-AI DojoTools: SystemTools Package
# Version: 5.1.1
#
# Consolidated from: dojotools_ha_api.yaml + dojotools_system.yaml
# Contains: zen_log_* shell_commands, ha_api rest_commands,
#           zen_dojotools_ha_api (internal), zen_dojotools_systemtools (MCP),
#           zen_dojotools_ha_log_viewer (MCP), zen_dojotools_event_emitter (MCP)
#
# CHANGELOG:
#   4.8.0 (2026-05-20) — zen_dojotools_systemtools: repairs + notice dashboard (v5.1.0).
#     repairs_list — GET /api/repairs/issues, structured issue list (issue_id, domain, severity, is_fixable).
#     repair_fix — POST /api/repairs/issues/fix, confirm required, repair_domain + issue_id fields.
#     notice_dashboard — aggregate: ZenOS active alerts + persistent notifications + HA repairs in one call.
#     allowed_paths += repairs/issues (ha_api internal whitelist).
#   4.7.0 (2026-05-19) — zen_dojotools_systemtools: persistent notification management (v5.1.0).
#     pnotif_list, pnotif_raise, pnotif_edit, pnotif_dismiss. Fields: notif_id, notif_title, notif_message.
#   4.6.0 (2026-05-19) — zen_dojotools_systemtools: prompt inspection suite (v5.1.0).
#     render_dojo: live render of dojo_loader() — KFC section as the active agent sees it.
#     render_system: live render of prompt_system() — purpose/directives/cortex.
#     prompt_health: prompt_health_check() + prompt_length_audit() + guidance pointer.
#     No target needed — all three auto-resolve active persona.
#   4.5.9 (2026-05-18) — zen_dojotools_systemtools: all reload modes now config-check
#     gated. ha_reload_scripts, ha_reload_automations, ha_reload_templates each call
#     check_config first — nogo blocks the reload and returns errors. Matches the
#     existing gate on ha_reload_all and ha_restart. All reload responses now include
#     config_check: passed on success.
#   4.5.8 (2026-05-18) — zen_dojotools_systemtools: ha_reload_scripts + ha_reload_all
#     now deferred via zen_event (kind: deferred_script_reload / deferred_reload_all).
#     Scheduler dispatches from automation context — no more self-destruct
#     InvalidStateError. Tool version bumped to 1.9.5. Scheduler 4.5.5 gets
#     two new triggers + dispatch branches for both deferred reload kinds.
#   4.5.7 (2026-05-18) — zen_dojotools_systemtools: added tool=pipeline (v5.1.0).
#     Ninja summarizer pipeline monitor — logbook ingestion, per-component
#     freshness, scheduler history, queue depth, dynamic flags, and static
#     KFC trigger pattern recommendations. Default 3h window, optional 24h,
#     paginated (page_size=20).
#   4.6.0 (2026-05-02) — zen_dojotools_systemtools: added cabinet_schema_upgrade (v5.1.0).
#     Passthrough to zen_admintools_cabinetadmin op: flip_schema_version (schema_version: 1).
#     Exposes pre-RC2 → current schema migration as an MCP-callable tool.
#   4.2.0 (2026-03-19) — zen_dojotools_systemtools: added zen_health_report (v5.1.0).
#     Reads all three health sensors, returns overall ok/issues_found + per-sensor
#     diagnosis string. Voice-ready. Migrated from admintools namespace.
#   4.1.0 (2026-03-15) — zen_dojotools_systemtools: added ha_reload_all,
#     ha_reload_scripts, ha_reload_automations, ha_reload_templates.
#     Full reload/restart decision guide in tool description.
#     No ha_api or whitelist changes required — reloads use HA service
#     calls directly (same path as ha_restart → homeassistant.restart).
#   4.5.x — initial consolidated release
#
# SETUP:
#   1. Add to secrets.yaml:
#        ha_bearer: "Bearer <your-long-lived-token>"
#      (generate at http://homeassistant.local:8123/profile/security)
#   2. Drop this file into packages/. No other configuration needed.
#   3. Expose zen_dojotools_systemtools, zen_dojotools_ha_log_viewer,
#      zen_dojotools_event_emitter to your conversation agent via
#      Settings → Voice Assistants → Expose.
#      DO NOT expose zen_dojotools_ha_api — it is an internal primitive.
#
# SECURITY MODEL:
#   - All HA API calls use 127.0.0.1:8123 (localhost only, no IP config needed)
#   - Auth token is read-once from secrets.yaml; never passed at call time
#   - ha_api_get paths are whitelisted — arbitrary /api/... GET is blocked
#   - All write operations (restart, install, skip) require confirm=true
#   - Reload ops are unguarded — non-destructive, no confirm needed
#   - No access to /states, /templates, cabinet sensors, or room control
#
# JOURNAL MODE GUARD (HA 2025.11+):
#   home-assistant.log was removed in HA 2025.11. zen_dojotools_ha_log_viewer
#   detects this automatically via zen_log_check + HA version check. Missing log
#   file returns a structured journal_mode response (not an error) with guidance
#   including the Petro31 HACS file-logger restoration link.
#
# === UAT PASS — 2026-03-03 (4.5.x baseline) ===
# Auditor: Caitlin (Anthropic, Sonnet 4.6) + Veronica (OAI, editorial)
# HALMark: 0.9.10-draft — PASS Level 3 (Steward Safe) — 23/25 PASS, 2/25 N/A
# UAT Cases: 20/20 PASS
#
# zen_dojotools_ha_api:
#   help, check_config, error_log, supervisor_logs, events, services,
#   config, health, supervisor, get (whitelisted), get (blocked), unknown → all PASS
# zen_dojotools_systemtools:
#   ha_restart (no confirm), ha_config_check, ha_restart (config pass),
#   ha_restart (config fail), ha_update_install (no entity_id),
#   ha_update_install, ha_update_skip, ha_update_clear_skipped, unknown → all PASS
# zen_dojotools_ha_log_viewer:
#   file exists, missing+modern HA (journal_mode), missing+legacy HA,
#   tail, search (pattern), search (no pattern), full, summary, page → all PASS
# zen_dojotools_event_emitter:
#   emit, help → PASS
#
# Live verified (session 2026-03-03):
#   ha_config_check → {result: go} ✓
#   ha_restart (clean config) → {config_check: passed, result: success} ✓
#   ha_restart (canary YAML injected) → {result: nogo, restart: blocked} ✓
#   log viewer tail → {status: success} ✓
#   log viewer journal_mode (log renamed) → {status: journal_mode, expected_behavior: true} ✓
#
# === UAT PENDING — 4.1.0 reload tools ===
# ha_reload_all, ha_reload_scripts, ha_reload_automations, ha_reload_templates
# ==============================
#
# KNOWN BEHAVIORS:
#   - Log output is truncated at 240KB in script logic (shell_commands cap at 200KB)
#   - ha_api_post responses: if HA returns non-JSON, check_response silently becomes {}
#     (safe fallback, but API error details may be lost — check HA logs if nogo fires)
#
# === SYSTEMTOOLS CHARTER ===
# This package is the ZenOS-AI system kernel. All additions must pass these gates:
#   1. PLATFORM-LEVEL only — system hygiene, safety, observability, or lifecycle.
#      Not household automation, domain work, or user workflows.
#   2. PRIMITIVE — small, deterministic, single-purpose. Not convenience wrappers.
#   3. GUARDED — every write op requires confirm=true or a whitelist. No raw passthrough.
#
# ALLOWED: config validation, restart gates, log/health reads, API broker, updates/backups
# NOT ALLOWED: /states access, cabinet sensors, room control, arbitrary service writes
# ===========================
###############################################################################

shell_command:

  # Log file existence check — supports log viewer journal_mode guard
  zen_log_check: >
    sh -c "[ -f /config/home-assistant.log ] && echo exists || echo missing"

  zen_log_tail: >
    sh -c "tail -n {{ lines }} /config/home-assistant.log | head -c 200000"

  # Full log (truncated at 200k chars by script)
  zen_log_full: >
    sh -c "cat /config/home-assistant.log | head -c 200000"

  zen_log_page: >
    sh -c "tail -n +{{ start }} /config/home-assistant.log | head -n {{ count }} | head -c 200000"

  zen_log_search: >
    sh -c "grep -En '{{ pattern }}' /config/home-assistant.log | head -c 200000 || true"

  zen_log_summary: >
    sh -c "head -n {{ count }} /config/home-assistant.log | tail -n +{{ start }} | head -c 200000"

rest_command:

  ha_api_get:
    url: "http://127.0.0.1:8123/api/{{ path }}"
    method: GET
    headers:
      authorization: !secret ha_bearer
      content-type: 'application/json'

  ha_api_post:
    url: "http://127.0.0.1:8123/api/{{ path }}"
    method: POST
    headers:
      authorization: !secret ha_bearer
      content-type: 'application/json'
    payload: "{{ payload | default('{}') }}"
    timeout: 90

script:

  zen_dojotools_ha_api:
    alias: Zen DojoTools HA API
    description: >-
      Home Assistant system-level API wrapper. Tokenless at call-time —
      auth handled inside rest_command. Provides config check (go/nogo),
      core logs, supervisor logs, events, services, system health, and
      whitelisted GET. No /states, no cabinet sensors, no templates.
      Use action_type=check_config for pre-restart YAML validation.
    mode: parallel
    icon: mdi:api
    fields:
      action_type:
        selector:
          select:
            options:
            - help
            - check_config
            - error_log
            - supervisor_logs
            - events
            - services
            - config
            - health
            - supervisor
            - get
        default: help
      path:
        name: API Path (whitelisted only)
        description: Path for the 'get' action. Must be in allowed_paths list.
        selector:
          text:
      caller_token:
        name: Caller Token
        description: Opaque token passed through by the caller for correlation. Not interpreted by this script.
        required: false
        selector:
          text:
    sequence:

    # --------------------------------------------------------------
    # Always normalize User/AI inputs so we don't have to react JIT
    # --------------------------------------------------------------
    - variables:
        caller_token: "{{- caller_token | default('') -}}"

    - variables:
        op: '{{ action_type }}'
        requested_path: '{{ path | default('''') }}'
        allowed_paths:
        - error_log
        - events
        - services
        - config
        - system_health/info
        - hassio/info
        - hassio/logs
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ op == ''help'' }}'
        sequence:
        - variables:
            final:
              status: info
              message: Zen DojoTools HA API — System Endpoints
              actions:
                check_config: POST /api/config/core/check_config — go/nogo YAML validation
                core_logs: GET /api/error_log
                supervisor_logs: GET /api/hassio/logs
                events: GET /api/events
                services: GET /api/services
                config: GET /api/config
                health: GET /api/system_health/info
                supervisor: GET /api/hassio/info
                get: GET /api/<path> (whitelisted only)
              notes:
              - Token handled entirely in rest_command. Uses 127.0.0.1:8123.
              - No access to /states, /templates, or cabinet endpoints.
              caller_token: '{{ caller_token }}'
        - stop: help_shown
          response_variable: final

      - conditions:
        - alias: Config Check
          condition: template
          value_template: '{{ op == ''check_config'' }}'
        sequence:
        - action: rest_command.ha_api_post
          data:
            path: config/core/check_config
          response_variable: r
        - variables:
            check_response: "{{ r.content if r.content is mapping else {} }}"
        - variables:
            check_valid: "{{ check_response.get('result', 'invalid') == 'valid' }}"
        - variables:
            final:
              result: "{{ 'go' if check_valid else 'nogo' }}"
              valid: "{{ check_valid }}"
              errors: "{{ check_response.get('errors', none) }}"
              message: "{{ 'Config check passed — safe to restart.' if check_valid
                else 'Config check FAILED — do not restart. Errors: '
                  ~ (check_response.get('errors', 'unknown error') | string) }}"
              caller_token: '{{ caller_token }}'
        - stop: check_config_done
          response_variable: final

      - conditions:
        - condition: template
          value_template: '{{ op == ''error_log'' }}'
        sequence:
        - data:
            path: error_log
          action: rest_command.ha_api_get
          response_variable: r
        - variables:
            raw: "{% if r.content is none %}\n  \"\"\n{% else %}\n  {{ r.content | string\
              \ }}\n{% endif %}\n"
            safe: "{% set txt = raw | string %} {% set limit = 220000 %} {% if txt |\
              \ length > limit %}\n  {{ txt[:limit] ~ '... [truncated]' }}\n{% else\
              \ %}\n  {{ txt }}\n{% endif %}\n"
        - variables:
            final:
              status: success
              message: Core Home Assistant log retrieved.
              truncated: '{{ (raw | length) > 220000 }}'
              result: '{{ safe }}'
              caller_token: '{{ caller_token }}'
        - stop: error_log_done
          response_variable: final

      - conditions:
        - condition: template
          value_template: '{{ op == ''supervisor_logs'' }}'
        sequence:
        - data:
            path: hassio/logs
          action: rest_command.ha_api_get
          response_variable: r
        - variables:
            raw: "{% if r.content is none %}\n  \"\"\n{% else %}\n  {{ r.content | string\
              \ }}\n{% endif %}\n"
            safe: "{% set txt = raw | string %} {% set limit = 220000 %} {% if txt |\
              \ length > limit %}\n  {{ txt[:limit] ~ '... [truncated]' }}\n{% else\
              \ %}\n  {{ txt }}\n{% endif %}\n"
        - variables:
            final:
              status: success
              message: Supervisor logs retrieved.
              truncated: '{{ (raw | length) > 220000 }}'
              result: '{{ safe }}'
              caller_token: '{{ caller_token }}'
        - stop: supervisor_logs_done
          response_variable: final

      - conditions:
        - condition: template
          value_template: '{{ op == ''events'' }}'
        sequence:
        - data:
            path: events
          action: rest_command.ha_api_get
          response_variable: r
        - variables:
            raw: "{% if r.content is none %}\n  \"\"\n{% else %}\n  {{ r.content | string\
              \ }}\n{% endif %}\n"
            safe: "{% set txt = raw | string %} {% set limit = 220000 %} {% if txt |\
              \ length > limit %}\n  {{ txt[:limit] ~ '... [truncated]' }}\n{% else\
              \ %}\n  {{ txt }}\n{% endif %}\n"
        - variables:
            final:
              status: success
              message: Event schema retrieved.
              truncated: '{{ (raw | length) > 220000 }}'
              result: '{{ safe }}'
              caller_token: '{{ caller_token }}'
        - stop: events_done
          response_variable: final

      - conditions:
        - condition: template
          value_template: '{{ op == ''services'' }}'
        sequence:
        - data:
            path: services
          action: rest_command.ha_api_get
          response_variable: r
        - variables:
            raw: "{% if r.content is none %}\n  \"\"\n{% else %}\n  {{ r.content | string\
              \ }}\n{% endif %}\n"
            safe: "{% set txt = raw | string %} {% set limit = 220000 %} {% if txt |\
              \ length > limit %}\n  {{ txt[:limit] ~ '... [truncated]' }}\n{% else\
              \ %}\n  {{ txt }}\n{% endif %}\n"
        - variables:
            final:
              status: success
              message: Service registry retrieved.
              truncated: '{{ (raw | length) > 220000 }}'
              result: '{{ safe }}'
              caller_token: '{{ caller_token }}'
        - stop: services_done
          response_variable: final

      - conditions:
        - condition: template
          value_template: '{{ op == ''config'' }}'
        sequence:
        - data:
            path: config
          action: rest_command.ha_api_get
          response_variable: r
        - variables:
            raw: "{% if r.content is none %}\n  \"\"\n{% else %}\n  {{ r.content | string\
              \ }}\n{% endif %}\n"
            safe: "{% set txt = raw | string %} {% set limit = 220000 %} {% if txt |\
              \ length > limit %}\n  {{ txt[:limit] ~ '... [truncated]' }}\n{% else\
              \ %}\n  {{ txt }}\n{% endif %}\n"
        - variables:
            final:
              status: success
              message: System config retrieved.
              truncated: '{{ (raw | length) > 220000 }}'
              result: '{{ safe }}'
              caller_token: '{{ caller_token }}'
        - stop: config_done
          response_variable: final

      - conditions:
        - condition: template
          value_template: '{{ op == ''health'' }}'
        sequence:
        - data:
            path: system_health/info
          action: rest_command.ha_api_get
          response_variable: r
        - variables:
            raw: "{% if r.content is none %}\n  \"\"\n{% else %}\n  {{ r.content | string\
              \ }}\n{% endif %}\n"
            safe: "{% set txt = raw | string %} {% set limit = 220000 %} {% if txt |\
              \ length > limit %}\n  {{ txt[:limit] ~ '... [truncated]' }}\n{% else\
              \ %}\n  {{ txt }}\n{% endif %}\n"
        - variables:
            final:
              status: success
              message: System health retrieved.
              truncated: '{{ (raw | length) > 220000 }}'
              result: '{{ safe }}'
              caller_token: '{{ caller_token }}'
        - stop: health_done
          response_variable: final

      - conditions:
        - condition: template
          value_template: '{{ op == ''supervisor'' }}'
        sequence:
        - data:
            path: hassio/info
          action: rest_command.ha_api_get
          response_variable: r
        - variables:
            raw: "{% if r.content is none %}\n  \"\"\n{% else %}\n  {{ r.content | string\
              \ }}\n{% endif %}\n"
            safe: "{% set txt = raw | string %} {% set limit = 220000 %} {% if txt |\
              \ length > limit %}\n  {{ txt[:limit] ~ '... [truncated]' }}\n{% else\
              \ %}\n  {{ txt }}\n{% endif %}\n"
        - variables:
            final:
              status: success
              message: Supervisor info retrieved.
              truncated: '{{ (raw | length) > 220000 }}'
              result: '{{ safe }}'
              caller_token: '{{ caller_token }}'
        - stop: supervisor_done
          response_variable: final

      - conditions:
        - condition: template
          value_template: '{{ op == ''get'' }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ requested_path not in allowed_paths }}'
            sequence:
            - variables:
                final:
                  status: error
                  message: Path not allowed.
                  attempted: '{{ requested_path }}'
                  allowed: '{{ allowed_paths }}'
                  caller_token: '{{ caller_token }}'
            - stop: denied
              response_variable: final
        - data:
            path: '{{ requested_path }}'
          action: rest_command.ha_api_get
          response_variable: r
        - variables:
            raw: "{% if r.content is none %}\n  \"\"\n{% else %}\n  {{ r.content | string\
              \ }}\n{% endif %}\n"
            safe: "{% set txt = raw | string %} {% set limit = 220000 %} {% if txt |\
              \ length > limit %}\n  {{ txt[:limit] ~ '... [truncated]' }}\n{% else\
              \ %}\n  {{ txt }}\n{% endif %}\n"
        - variables:
            final:
              status: success
              message: GET /api/{{ requested_path }} retrieved.
              truncated: '{{ (raw | length) > 220000 }}'
              result: '{{ safe }}'
              caller_token: '{{ caller_token }}'
        - stop: get_done
          response_variable: final

    - variables:
        final:
          status: error
          message: Unknown or invalid action.
          caller_token: '{{ caller_token }}'
    - stop: failure
      response_variable: final

  zen_dojotools_systemtools:
    sequence:
    # --------------------------------------------------------------
    # Always normalize User/AI inputs so we don't have to react JIT
    # --------------------------------------------------------------
    - variables:
        caller_token: "{{- caller_token | default('') -}}"
    - variables:
        tool: '{{ tool | default('''') }}'
        confirm: '{{ confirm_action | default(false) }}'
    # --- tool_manifest ---
    - choose:
      - conditions:
        - condition: template
          value_template: "{{- tool == 'tool_manifest' -}}"
        sequence:
        - variables:
            result: >-
              {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
              {{- MF.tool_manifest(
                tool='zen_dojotools_systemtools',
                display_name='SystemTools - ZenOS Platform Kernel',
                tier='dojotools',
                version='5.1.1',
                health={'configured': true, 'status': 'ok', 'notes': []},
                required_labels=['dojotools'],
                optional_labels=['system_monitor', 'system_status'],
                consumes=['tool', 'entity_id', 'confirm_action'],
                returns=['health_report', 'config_check', 'reload_result', 'log_result'],
                failure_policy='hard',
                modes={'health': 'zen_health_report', 'reload': 'ha_reload_all', 'restart': 'ha_restart', 'manifest': 'tool_manifest'},
                icon='mdi:wrench',
                color='grey',

                caller_token=caller_token | default('')
              ) | from_json -}}
        - stop: systemtools tool manifest
          response_variable: result

    - choose:
      - conditions:
        - alias: 'Error: Action Not Confirmed'
          condition: template
          value_template: "{{ (tool in ['ha_restart', 'repair_fix']) and not confirm }}"
        sequence:
        - variables:
            response: "{{\n  {\n    \"tool\": tool | default('N/A'),\n    \"confirm\":
              confirm | default(false),\n    \"result\": \"error\",\n    \"message\":
              \"This function REQUIRES user confirmation Ask for confirmation and if
              granted retry with confirm_action=true.\"\n  }\n}}"
      - conditions:
        - alias: 'Error: Entity ID required for Action'
          condition: template
          value_template: "{{ (tool in ['ha_update_install','ha_update_skip']) and (not entity_id or entity_id == '') }}"
        sequence:
        - variables:
            response: "{{\n  {\n    \"tool\": tool | default('N/A'),\n    \"confirm\":
              confirm | default(false),\n    \"result\": \"error\",\n    \"message\":
              \"entity_id is required for ha_update_install and ha_update_skip. Provide a valid entity_id and retry.\"\n  }\n}}"
      - conditions:
        - alias: Config Check
          condition: template
          value_template: '{{ tool == ''ha_config_check'' }}'
        sequence:
        - action: script.zen_dojotools_ha_api
          data:
            action_type: check_config
          response_variable: check_result
        - variables:
            response: "{{
              {
                'tool': tool,
                'result': check_result.result,
                'valid': check_result.valid,
                'errors': check_result.errors,
                'message': check_result.message
              }
            }}"
      - conditions:
        - condition: template
          value_template: '{{tool == ''ha_restart'' and confirm}}'
          alias: HA Restart
        sequence:
        - action: script.zen_dojotools_ha_api
          data:
            action_type: check_config
          response_variable: check_result
        - choose:
          - conditions:
            - alias: Config check failed — block restart
              condition: template
              value_template: '{{ check_result.result != ''go'' }}'
            sequence:
            - variables:
                response: "{{
                  {
                    'tool': tool,
                    'result': 'nogo',
                    'errors': check_result.errors,
                    'message': 'Restart BLOCKED — config check failed. Fix errors before restarting.'
                  }
                }}"
          default:
          - action: homeassistant.restart
            metadata: {}
            data: {}
          - variables:
              response: "{{
                {
                  'tool': tool,
                  'confirm': confirm,
                  'result': 'success',
                  'config_check': 'passed',
                  'message': 'Config check passed. HA Restart Initiated. See you on the other side, agent.'
                }
              }}"
      - conditions:
        - alias: Install Update
          condition: template
          value_template: '{{tool == ''ha_update_install'' and confirm}}'
        sequence:
        - action: update.install
          data:
            backup: '{{do_backup | default(false)}}'
          target:
            entity_id: '{{entity_id}}'
        - variables:
            response: "{{\n  {\n    \"tool\": tool | default(''),\n    \"entity_id\":
              entity_id | default(''),\n    \"do_backup\": do_backup | default(false),\n
              \   \"confirm\": confirm | default(false),\n    \"result\": \"success\",\n
              \   \"message\": \"Update install initiated.\"\n  }\n}}"
      - conditions:
        - alias: Skip Update
          condition: template
          value_template: '{{tool == ''ha_update_skip'' and confirm}}'
        sequence:
        - action: update.skip
          target:
            entity_id: '{{entity_id}}'
          data: {}
        - variables:
            response: "{{\n  {\n    \"tool\": tool | default(''),\n    \"entity_id\":
              entity_id | default(''),\n    \"confirm\": confirm | default(false),\n
              \   \"result\": \"success\",\n    \"message\": \"Update Skipped\"\n  }\n}}"
      - conditions:
        - alias: Clear Skipped Update
          condition: template
          value_template: '{{tool == ''ha_update_clear_skipped'' and confirm}}'
        sequence:
        - action: update.clear_skipped
          target:
            entity_id: '{{entity_id}}'
          data: {}
        - variables:
            response: "{{\n  {\n    \"tool\": tool | default(''),\n    \"entity_id\":
              entity_id | default(''),\n    \"confirm\": confirm | default(false),\n
              \   \"result\": \"success\",\n    \"message\": \"Update Un-Skipped\"\n
              \ }\n}}"
      - conditions:
        - alias: Reload All
          condition: template
          value_template: '{{ tool == ''ha_reload_all'' }}'
        sequence:
        - action: script.zen_dojotools_ha_api
          data:
            action_type: check_config
          response_variable: check_result
        - choose:
          - conditions:
            - alias: Config check failed — block reload
              condition: template
              value_template: '{{ check_result.result != ''go'' }}'
            sequence:
            - variables:
                response: "{{
                  {
                    'tool': tool,
                    'result': 'nogo',
                    'errors': check_result.errors,
                    'message': 'Reload BLOCKED — config check failed. Fix errors before reloading. reload_all would have silently aborted anyway.'
                  }
                }}"
          default:
          - variables:
              response: "{{
                {
                  'tool': tool,
                  'result': 'success',
                  'config_check': 'passed',
                  'message': 'Config check passed. Reload all queued — fires from scheduler immediately after this response. WARNING: reload_all takes ~2 minutes to fully stabilize. Do NOT call other tools until HA is back. To confirm: use zen_dojotools_ha_log_viewer mode=search pattern=flynn_boot_warmup — wait until Flynn boot warmup entries appear (they fire on homeassistant_started). Alternatively search for flynn_stepgate_sentinel. Timeout ~3 min. Only proceed after Flynn is confirmed alive.'
                }
              }}"
          - event: zen_event
            event_data:
              event:
                kind: deferred_reload_all
      - conditions:
        - alias: Reload Scripts
          condition: template
          value_template: '{{ tool == ''ha_reload_scripts'' }}'
        sequence:
        - action: script.zen_dojotools_ha_api
          data:
            action_type: check_config
          response_variable: check_result
        - choose:
          - conditions:
            - alias: Config check failed — block reload
              condition: template
              value_template: '{{ check_result.result != ''go'' }}'
            sequence:
            - variables:
                response: "{{
                  {
                    'tool': tool,
                    'result': 'nogo',
                    'errors': check_result.errors,
                    'message': 'Reload BLOCKED — config check failed. Fix errors before reloading.'
                  }
                }}"
          default:
          - variables:
              response: "{{
                {
                  'tool': tool,
                  'result': 'success',
                  'config_check': 'passed',
                  'message': 'Config check passed. Script reload queued — fires from scheduler immediately after this response.'
                }
              }}"
          - event: zen_event
            event_data:
              event:
                kind: deferred_script_reload
      - conditions:
        - alias: Reload Automations
          condition: template
          value_template: '{{ tool == ''ha_reload_automations'' }}'
        sequence:
        - action: script.zen_dojotools_ha_api
          data:
            action_type: check_config
          response_variable: check_result
        - choose:
          - conditions:
            - alias: Config check failed — block reload
              condition: template
              value_template: '{{ check_result.result != ''go'' }}'
            sequence:
            - variables:
                response: "{{
                  {
                    'tool': tool,
                    'result': 'nogo',
                    'errors': check_result.errors,
                    'message': 'Reload BLOCKED — config check failed. Fix errors before reloading.'
                  }
                }}"
          default:
          - action: automation.reload
            data: {}
          - variables:
              response: "{{
                {
                  'tool': tool,
                  'result': 'success',
                  'config_check': 'passed',
                  'message': 'Config check passed. Automations reloaded. Note: any in-flight automation actions were stopped.'
                }
              }}"
      - conditions:
        - alias: Reload Custom Templates
          condition: template
          value_template: '{{ tool == ''ha_reload_templates'' }}'
        sequence:
        - action: script.zen_dojotools_ha_api
          data:
            action_type: check_config
          response_variable: check_result
        - choose:
          - conditions:
            - alias: Config check failed — block reload
              condition: template
              value_template: '{{ check_result.result != ''go'' }}'
            sequence:
            - variables:
                response: "{{
                  {
                    'tool': tool,
                    'result': 'nogo',
                    'errors': check_result.errors,
                    'message': 'Reload BLOCKED — config check failed. Fix errors before reloading.'
                  }
                }}"
          default:
          - action: homeassistant.reload_custom_templates
            data: {}
          - variables:
              response: "{{
                {
                  'tool': tool,
                  'result': 'success',
                  'config_check': 'passed',
                  'message': 'Config check passed. Custom Jinja templates reloaded. Changes take effect on next template render.'
                }
              }}"
      - conditions:
        - alias: Help
          condition: template
          value_template: '{{ tool == ''help'' }}'
        sequence:
        - variables:
            response: "{{
              {
                'tool': 'help',
                'result': 'info',
                'version': '2.1.0',
                'reload_response_contract': 'ha_reload_all and ha_reload_scripts now return a response immediately — reload is deferred via zen_event to the scheduler, which fires it from automation context. No self-destruct. ha_reload_automations and ha_reload_templates also return responses (different domain). All reloads respond with result: success when queued/complete.',
                'reload_tools': {
                  'ha_reload_all': 'LAST RESORT ONLY — use ha_reload_scripts, ha_reload_automations, or ha_reload_templates first. ha_reload_all takes ~2 minutes and disrupts all in-flight actions. Only use it when the domain you need is NOT covered by one of the targeted reload tools. Covers: automations, scripts, scenes, groups, helpers, timers, counters, schedules, YAML template sensors, MQTT YAML entities, zones, rest/command_line, custom Jinja templates, themes, homeassistant: core block. Config check runs first — blocked on nogo. Deferred via scheduler.',
                  'ha_reload_scripts': 'Scripts only. Config check runs first — blocked on nogo. Deferred via scheduler. Use when automations are running and you do not want to stop them.',
                  'ha_reload_automations': 'Automations only. Config check runs first — blocked on nogo. WARNING: stops all currently in-flight automation action sequences.',
                  'ha_reload_templates': 'config/custom_templates/ Jinja files only. Config check runs first — blocked on nogo. Changes take effect on next render.'
                },
                'restart_required': 'auth_providers/auth_mfa_modules changes, http: block (port/SSL/CORS/trusted_proxies), recorder: block (db_url/include/exclude), adding net-new integrations never bootstrapped, logger: YAML block. Use logger.set_level service for runtime log level changes — no restart needed.',
                'other_tools': {
                  'zen_resolver_refresh': 'Fire zen_resolver_refresh. Kicks cabinet resolvers, monastery health, and all resolver-subscribed sensors. Use after ha_reload_all to recover sensors from cold-start unavailable. On real HA restart, the scheduler fires this automatically via ha_start trigger.',
                  'zen_health_report': 'Read all 5 health sensors + 7 resolver states. Returns overall ok/issues_found, resolver all_ok, timestamps, monk_status, schema_ok, kill switches, and plain-English diagnosis.',
                  'ha_config_check': 'YAML validation, go/nogo. No side effects. Safe to run anytime.',
                  'ha_restart': 'Full HA restart. Requires confirm=true. Config check runs automatically first — blocked if check fails.',
                  'ha_update_install': 'Install a pending update. Requires confirm=true + entity_id.',
                  'ha_update_skip': 'Skip a pending update. Requires confirm=true + entity_id.',
                  'ha_update_clear_skipped': 'Un-skip a skipped update. Requires confirm=true + entity_id.'
                },
                'when_in_doubt': 'Run zen_health_report first. If issues found, run ha_config_check then ha_reload_all. If reloads do not fix it, use ha_restart.',
                'halmark_fgs': ['FG-35: automation.reload kills in-flight automations', 'FG-36: reload_all silent abort on config check failure (mitigated here by explicit preflight)', 'FG-37: partial reload state from incorrect surgical reload sequencing']
              }
            }}"
      - conditions:
        - alias: Resolver Refresh
          condition: template
          value_template: '{{ tool == ''zen_resolver_refresh'' }}'
        sequence:
        - event: zen_resolver_refresh
        - variables:
            response:
              tool: "{{ tool }}"
              result: success
              message: "zen_resolver_refresh fired. Cabinet resolvers, monastery health, and all zen_resolver_refresh subscribers will re-evaluate."
      - conditions:
        - alias: Health Report
          condition: template
          value_template: '{{ tool == ''zen_health_report'' }}'
        sequence:
        - variables:
            _dojo: "{{ states('sensor.zen_dojo_cabinet_resolved') }}"
            _kata: "{{ states('sensor.zen_kata_cabinet_resolved') }}"
            _system: "{{ states('sensor.zen_system_cabinet_resolved') }}"
            _household: "{{ states('sensor.zen_default_household_cabinet_resolved') }}"
            _ai_user: "{{ states('sensor.zen_default_ai_user_cabinet_resolved') }}"
            _family: "{{ states('sensor.zen_default_family_cabinet_resolved') }}"
            _user: "{{ states('sensor.zen_default_user_cabinet_resolved') }}"
        - variables:
            _kata_vars: >-
              {{ state_attr(_kata, 'variables') or {}
                 if _kata not in ['unknown','unavailable','none',''] else {} }}
        - variables:
            _ts: "{{ _kata_vars.get('zen_summary', {}).get('timestamp', '') }}"
            _sched_ts: "{{ _kata_vars.get('zen_scheduler', {}).get('timestamp', '') }}"
            _monk_status: >-
              {%- set _ss_raw = _kata_vars.get('zen_supersummary_status', {}) -%}
              {%- set _ss_v1 = _ss_raw.get('value', _ss_raw) if _ss_raw is mapping else (_ss_raw | from_json if _ss_raw is string else {}) -%}
              {%- set _ss_d = _ss_v1 if _ss_v1 is mapping else (_ss_v1 | from_json if _ss_v1 is string else {}) -%}
              {{ _ss_d.get('status', 'unknown') if _ss_d is mapping else 'unknown' }}
            _schema_ok: >-
              {%- set _zt_raw = _kata_vars.get('zen_template', {}) -%}
              {%- set _zt_v1 = _zt_raw.get('value', _zt_raw) if _zt_raw is mapping else (_zt_raw | from_json if _zt_raw is string else {}) -%}
              {%- set _zt_d = _zt_v1 if _zt_v1 is mapping else (_zt_v1 | from_json if _zt_v1 is string else {}) -%}
              {{ (_zt_d.get('structure', none) is mapping) if _zt_d is mapping else false }}
            _resolver_all_ok: >-
              {{ [_dojo, _kata, _system, _household, _ai_user, _family, _user]
                 | select('in', ['unknown','unavailable','none',''])
                 | list | count == 0 }}
            _active_raw: "{{ state_attr('sensor.zen_monastery_health', 'active_components') | default('[]') }}"
        - variables:
            _ts_age_min: >-
              {%- if _ts and _ts != '' -%}
                {{ ((now() - as_datetime(_ts)).total_seconds() / 60) | round(1) }}
              {%- else -%}none{%- endif -%}
            _sched_age_min: >-
              {%- if _sched_ts and _sched_ts != '' -%}
                {{ ((now() - as_datetime(_sched_ts)).total_seconds() / 60) | round(1) }}
              {%- else -%}none{%- endif -%}
        - variables:
            _legacy_cabinets: >-
              {%- set r = state_attr('sensor.zen_cabinet_health', 'cabinet_states') | default({}, true) -%}
              {%- set cs = r if r is mapping else (r | from_json if r is string else {}) -%}
              {%- set ns = namespace(l=[]) -%}
              {%- for slot, st in cs.items() if st == 'Variables' -%}
                {%- set ns.l = ns.l + [slot] -%}
              {%- endfor -%}
              {{ ns.l | join(', ') if ns.l else '' }}
        - variables:
            _init_cabinets: >-
              {%- set _sde = state_attr('sensor.zen_cabinet_health', 'slot_to_default_entity') | default({}) -%}
              {%- set _sde = _sde if _sde is mapping else (_sde | from_json if _sde is string else {}) -%}
              {%- set ns = namespace(l=[]) -%}
              {%- for slot, eid in _sde.items() if states(eid) == 'init' -%}
                {%- set ns.l = ns.l + [slot] -%}
              {%- endfor -%}
              {{ ns.l | join(', ') if ns.l else '' }}
        - variables:
            _diagnosis: >-
              {%- set _ns = namespace(issues=[]) -%}
              {%- if _dojo in ['unknown','unavailable','none',''] -%}
                {%- set _ns.issues = _ns.issues + ['CRITICAL: dojo resolver unavailable — label zen_dojo_cabinet has no sensor entities'] -%}
              {%- endif -%}
              {%- if _kata in ['unknown','unavailable','none',''] -%}
                {%- set _ns.issues = _ns.issues + ['CRITICAL: kata resolver unavailable — label zen_kata_cabinet has no sensor entities'] -%}
              {%- endif -%}
              {%- if _system in ['unknown','unavailable','none',''] -%}
                {%- set _ns.issues = _ns.issues + ['CRITICAL: system resolver unavailable — label zen_system_cabinet has no sensor entities'] -%}
              {%- endif -%}
              {%- if _household in ['unknown','unavailable','none',''] -%}
                {%- set _ns.issues = _ns.issues + ['CRITICAL: household resolver unavailable — label zen_default_household_cabinet has no sensor entities'] -%}
              {%- endif -%}
              {%- if _ai_user in ['unknown','unavailable','none',''] -%}
                {%- set _ns.issues = _ns.issues + ['CRITICAL: ai_user resolver unavailable — label zen_default_ai_user_cabinet has no sensor entities'] -%}
              {%- endif -%}
              {%- if _family in ['unknown','unavailable','none',''] -%}
                {%- set _ns.issues = _ns.issues + ['warn: family resolver unavailable — label zen_default_family_cabinet has no sensor entities'] -%}
              {%- endif -%}
              {%- if _user in ['unknown','unavailable','none',''] -%}
                {%- set _ns.issues = _ns.issues + ['warn: user resolver unavailable — label zen_default_user_cabinet has no sensor entities'] -%}
              {%- endif -%}
              {%- set _mon_st = states('sensor.zen_monastery_health') -%}
              {%- if _mon_st == 'unknown' -%}
                {%- set _ns.issues = _ns.issues + ['Monastery health has not woken up yet. Run resolver refresh to kick it.'] -%}
              {%- elif _mon_st == 'unavailable' -%}
                {%- set _ns.issues = _ns.issues + ['Monastery health tried to evaluate but hit an error. Check HA logs for template errors.'] -%}
              {%- elif _mon_st == 'critical' -%}
                {%- set _r = state_attr('sensor.zen_monastery_health', 'reason') | default('Schema missing, resolver down, or summary very stale with monk errors.') -%}
                {%- set _ns.issues = _ns.issues + ['Monastery CRITICAL: ' ~ _r] -%}
              {%- elif _mon_st == 'warn' -%}
                {%- set _r = state_attr('sensor.zen_monastery_health', 'reason') | default('Summary stale, monk error, or no active components.') -%}
                {%- set _ns.issues = _ns.issues + ['Monastery warn: ' ~ _r] -%}
              {%- endif -%}
              {%- set _ninja_st = states('sensor.zen_summarizer_health') -%}
              {%- if _ninja_st == 'unknown' -%}
                {%- set _ns.issues = _ns.issues + ['Ninja summarizer health has not woken up yet. Run resolver refresh.'] -%}
              {%- elif _ninja_st == 'unavailable' -%}
                {%- set _ns.issues = _ns.issues + ['Ninja summarizer health hit an error. Check HA logs.'] -%}
              {%- elif _ninja_st not in ['ok', 'disabled'] -%}
                {%- set _r = state_attr('sensor.zen_summarizer_health', 'reason') | default('Scheduler stale or ai_task entity not set.') -%}
                {%- set _ns.issues = _ns.issues + ['Ninja summarizer ' ~ _ninja_st ~ ': ' ~ _r] -%}
              {%- endif -%}
              {%- set _ss_st = states('sensor.zen_supersummary_health') -%}
              {%- if _ss_st == 'unknown' -%}
                {%- set _ns.issues = _ns.issues + ['Supersummary health has not woken up yet. Run resolver refresh.'] -%}
              {%- elif _ss_st == 'unavailable' -%}
                {%- set _ns.issues = _ns.issues + ['Supersummary health hit an error. Check HA logs.'] -%}
              {%- elif _ss_st not in ['ok', 'disabled'] -%}
                {%- set _r = state_attr('sensor.zen_supersummary_health', 'reason') | default('Summary stale or monk returned an error.') -%}
                {%- set _ns.issues = _ns.issues + ['Supersummary ' ~ _ss_st ~ ': ' ~ _r] -%}
              {%- endif -%}
              {%- if not is_state('input_boolean.zen_summarizers_enabled', 'on') -%}
                {%- set _ns.issues = _ns.issues + ['pipeline master kill switch OFF'] -%}
              {%- endif -%}
              {%- if not is_state('input_boolean.zen_ninja_summarizer_enabled', 'on') -%}
                {%- set _ns.issues = _ns.issues + ['ninja summarizer kill switch OFF'] -%}
              {%- endif -%}
              {%- if not is_state('input_boolean.zen_supersummarizer_enabled', 'on') -%}
                {%- set _ns.issues = _ns.issues + ['supersummary kill switch OFF'] -%}
              {%- endif -%}
              {%- if _schema_ok == 'False' -%}
                {%- set _ns.issues = _ns.issues + ['CRITICAL: zen_template schema missing — run zen_admintools_reset_template'] -%}
              {%- endif -%}
              {%- if states('input_text.zenos_ai_task_entity') | trim in ['','unknown','unavailable'] -%}
                {%- set _ns.issues = _ns.issues + ['ai_task entity not set (input_text.zenos_ai_task_entity empty)'] -%}
              {%- endif -%}
              {%- if _ts == '' -%}
                {%- set _ns.issues = _ns.issues + ['no zen_summary timestamp — pipeline has never run or kata not bootstrapped'] -%}
              {%- elif _ts_age_min != 'none' and _ts_age_min | float > 30 -%}
                {%- set _ns.issues = _ns.issues + ['zen_summary critically stale (' ~ _ts_age_min ~ ' min, threshold 30 min)'] -%}
              {%- elif _ts_age_min != 'none' and _ts_age_min | float > 15 -%}
                {%- set _ns.issues = _ns.issues + ['zen_summary stale (' ~ _ts_age_min ~ ' min, threshold 15 min)'] -%}
              {%- endif -%}
              {%- if _sched_ts == '' -%}
                {%- set _ns.issues = _ns.issues + ['no scheduler timestamp — ninja has never run'] -%}
              {%- elif _sched_age_min != 'none' and _sched_age_min | float > 20 -%}
                {%- set _ns.issues = _ns.issues + ['ninja scheduler stale (' ~ _sched_age_min ~ ' min, threshold 20 min)'] -%}
              {%- endif -%}
              {%- if _monk_status in ['error','timeout','none','null','unknown'] -%}
                {%- set _ns.issues = _ns.issues + ['supersummary monk status: ' ~ _monk_status] -%}
              {%- endif -%}
              {%- set _agent_st = states('sensor.zen_agent_health') -%}
              {%- if _agent_st in ['warn','error','critical'] -%}
                {%- set _flynn_blocking = state_attr('sensor.zen_flynn_health', 'blocking') | default('none') -%}
                {%- set _roster_raw = state_attr('sensor.zen_agent_health', 'roster') | default('[]') -%}
                {%- set _roster = _roster_raw | from_json if _roster_raw is string else _roster_raw -%}
                {%- set _notes = _roster | map(attribute='note') | list | join(', ') if _roster is iterable else '' -%}
                {%- set _ns.issues = _ns.issues + ['Agent health ' ~ _agent_st ~ ' — Flynn blocking: ' ~ _flynn_blocking ~ (' | agents: ' ~ _notes if _notes else '')] -%}
              {%- endif -%}
              {%- if _init_cabinets != '' -%}
                {%- set _ns.issues = _ns.issues + ['Virgin cabinets in init state: ' ~ _init_cabinets ~ ' — Flynn Gate 2.1 will auto-init post-warmup. If stuck >5 min, run cabinetadmin mode: init manually.'] -%}
              {%- endif -%}
              {%- if _legacy_cabinets != '' -%}
                {%- set _ns.issues = _ns.issues + ['Cabinet schema upgrade available: ' ~ _legacy_cabinets ~ ' — say "upgrade my cabinets"'] -%}
              {%- endif -%}
              {%- if _ns.issues | count == 0 -%}
                All gates nominal.
              {%- else -%}
                {{ _ns.issues | join(' | ') }}
              {%- endif -%}
        - variables:
            response:
              generated: "{{ now().isoformat() }}"
              overall: "{{ 'ok' if 'All gates nominal.' in _diagnosis else 'issues_found' }}"
              resolvers:
                dojo: "{{ _dojo }}"
                kata: "{{ _kata }}"
                system: "{{ _system }}"
                household: "{{ _household }}"
                ai_user: "{{ _ai_user }}"
                family: "{{ _family }}"
                user: "{{ _user }}"
                all_ok: "{{ _resolver_all_ok }}"
              health_sensors:
                monastery: "{{ states('sensor.zen_monastery_health') }}"
                ninja_summarizer: "{{ states('sensor.zen_summarizer_health') }}"
                supersummary: "{{ states('sensor.zen_supersummary_health') }}"
                cabinet: "{{ states('sensor.zen_cabinet_health') }}"
                legacy_schema_cabinets: "{{ _legacy_cabinets }}"
                init_cabinets: "{{ _init_cabinets }}"
                agents: "{{ states('sensor.zen_agent_health') }}"
              reasons:
                monastery: "{{ state_attr('sensor.zen_monastery_health', 'reason') | default('') }}"
                ninja_summarizer: "{{ state_attr('sensor.zen_summarizer_health', 'reason') | default('') }}"
                supersummary: "{{ state_attr('sensor.zen_supersummary_health', 'reason') | default('') }}"
                cabinet: "{{ state_attr('sensor.zen_cabinet_health', 'reason') | default('') }}"
                agents: "{{ state_attr('sensor.zen_agent_health', 'reason') | default('') }}"
              kill_switches:
                pipeline_master: "{{ is_state('input_boolean.zen_summarizers_enabled', 'on') }}"
                ninja_enabled: "{{ is_state('input_boolean.zen_ninja_summarizer_enabled', 'on') }}"
                supersummary_enabled: "{{ is_state('input_boolean.zen_supersummarizer_enabled', 'on') }}"
              schema_ok: "{{ _schema_ok }}"
              ai_task_entity: "{{ states('input_text.zenos_ai_task_entity') | trim }}"
              ai_task_set: "{{ states('input_text.zenos_ai_task_entity') | trim not in ['','unknown','unavailable'] }}"
              timestamps:
                zen_summary: "{{ _ts | default('none') }}"
                zen_summary_age_min: "{{ _ts_age_min }}"
                zen_scheduler: "{{ _sched_ts | default('none') }}"
                zen_scheduler_age_min: "{{ _sched_age_min }}"
              monk_status: "{{ _monk_status }}"
              active_components: "{{ _active_raw }}"
              diagnosis: "{{ _diagnosis }}"
      - conditions:
        - alias: Cabinet Schema Upgrade
          condition: template
          value_template: "{{ tool == 'cabinet_schema_upgrade' }}"
        sequence:
        - alias: 'Upgrade cabinet schema to v1 (mount-aware)'
          action: script.zen_admintools_cabinetadmin
          data:
            op: flip_schema_version
            schema_version: 1
            caller_token: "{{ caller_token | default('') }}"
        - variables:
            response:
              tool: "{{ tool }}"
              result: success
              message: "Cabinet schema upgraded to v1 (mount-aware). Run zen_health_report to verify."
              caller_token: "{{ caller_token | default('') }}"
      - conditions:
        - alias: Pipeline Monitor
          condition: template
          value_template: "{{ tool == 'pipeline' }}"
        sequence:
        - variables:
            _hours: "{{ [[period_hours | default(3) | int, 1] | max, 24] | min }}"
            _page: "{{ [page | default(1) | int, 1] | max }}"
            _page_size: 20
            _now: "{{ now().isoformat() }}"
            _lb_start: "{{ (now() - timedelta(hours=_hours | int)).strftime('%Y-%m-%dT%H:%M:%S') }}"
        - variables:
            _kata: "{{ states('sensor.zen_kata_cabinet_resolved') }}"
            _dojo: "{{ states('sensor.zen_dojo_cabinet_resolved') }}"
        - variables:
            _kata_vars: >-
              {{ state_attr(_kata, 'variables') | default({}, true)
                 if _kata not in ['unknown','unavailable','none',''] else {} }}
            _dojo_vars: >-
              {{ state_attr(_dojo, 'variables') | default({}, true)
                 if _dojo not in ['unknown','unavailable','none',''] else {} }}
        - variables:
            _sched_raw: >-
              {%- set _r = _kata_vars.get('zen_scheduler', {}) -%}
              {%- set _v = _r.get('value', _r) if _r is mapping else (_r | from_json if _r is string else {}) -%}
              {{ (_v | from_json(none)) if _v is string and _v | trim not in ['', 'null'] else (_v if _v is mapping else none) }}
        - variables:
            _recent_runs: >-
              {{ _sched_raw.get('recent_runs', []) if _sched_raw is mapping else [] }}
            _sched_ts: "{{ _sched_raw.get('timestamp', '') if _sched_raw is mapping else '' }}"
            _sched_age_min: >-
              {%- if _sched_ts and _sched_ts != '' -%}
                {{ ((now() - as_datetime(_sched_ts)).total_seconds() / 60) | round(1) }}
              {%- else -%}none{%- endif -%}
        - action: rest_command.ha_api_get
          data:
            path: "logbook/{{ _lb_start }}?entity_id=script.zen_dojotools_ninja_summarizer"
          response_variable: _lb_raw
        - variables:
            _lb_count: >-
              {%- set _c = _lb_raw.content | default('[]') -%}
              {%- set _entries = _c | from_json if _c is string else (_c if _c is iterable else []) -%}
              {{ _entries | selectattr('state', 'eq', 'on') | selectattr('name', 'eq', 'Zen DojoTools Ninja Summarizer') | list | length }}
        - variables:
            _lb_page_start: "{{ ((_page | int) - 1) * (_page_size | int) }}"
            _lb_total_pages: >-
              {{ ((_lb_count | int) / (_page_size | int)) | round(0, 'ceil') | int }}
        - variables:
            _lb_page: >-
              {%- set _c = _lb_raw.content | default('[]') -%}
              {%- set _entries = _c | from_json if _c is string else (_c if _c is iterable else []) -%}
              {%- set _ninja_on = _entries | selectattr('state', 'eq', 'on') | selectattr('name', 'eq', 'Zen DojoTools Ninja Summarizer') | list -%}
              {%- set _start = _lb_page_start | int -%}
              {%- set _ns = namespace(out=[]) -%}
              {%- for e in _ninja_on[_start : _start + _page_size | int] -%}
                {%- set _ns.out = _ns.out + [{'when': e.get('when', e.get('last_changed', '')), 'state': 'on'}] -%}
              {%- endfor -%}
              {{ _ns.out }}
        - variables:
            _ninja_attr: "{{ state_attr('script.zen_dojotools_ninja_summarizer', 'current') | default(0) }}"
            _ninja_last: "{{ state_attr('script.zen_dojotools_ninja_summarizer', 'last_triggered') | default('') }}"
            _super_attr: "{{ state_attr('script.zen_dojotools_supersummary', 'current') | default(0) }}"
        - variables:
            _direct_kfc_components:
            - camera
            - trapper_keeper
            - laundry
            - dishwasher
            - autovac
            _dual_path_components:
            - laundry
            - camera_security
        - variables:
            _subs_list: >-
              {%- set _ns = namespace(l=[]) -%}
              {%- set _protected = ['AI_Cabinet_VolumeInfo', 'kfc_template', 'zen_library_manifest', 'zen_identity_manifest', '_context'] -%}
              {%- if _dojo_vars is mapping -%}
                {%- for slug, drawer in _dojo_vars.items() -%}
                  {%- if not slug.startswith('_') and slug not in _protected -%}
                    {%- set _sub_d = drawer.get('value', drawer) if drawer is mapping else (drawer | from_json if drawer is string else {}) -%}
                    {%- set _sub_d = _sub_d if _sub_d is mapping else {} -%}
                    {%- if _sub_d.get('trigger_subscriptions', []) | length > 0 -%}
                      {%- set _source = 'direct_kfc' if slug in _direct_kfc_components else ('dual_path' if slug in _dual_path_components else 'scheduler') -%}
                      {%- set _last_raw = _kata_vars.get('zen_ninja_last_run_' ~ slug, {}) -%}
                      {%- set _last_v = _last_raw.get('value', _last_raw) if _last_raw is mapping else (_last_raw | from_json if _last_raw is string else {}) -%}
                      {%- set _last_d = _last_v if _last_v is mapping else (_last_v | from_json if _last_v is string else {}) -%}
                      {%- set _last_d = _last_d if _last_d is mapping else {} -%}
                      {%- set _ran_at = _last_d.get('run_started_at', '') -%}
                      {%- set _dur = _last_d.get('duration_seconds', none) -%}
                      {%- set _age = ((now() - as_datetime(_ran_at)).total_seconds() / 60) | round(1) if _ran_at and _ran_at != '' else none -%}
                      {%- set _fresh = 'ok' if _age is not none and _age | float < 20 else ('stale' if _age is not none and _age | float < 60 else 'very_stale') -%}
                      {%- set _ns.l = _ns.l + [{'slug': slug, 'tier': _sub_d.get('pipeline_tier', _sub_d.get('tier', 'unknown')), 'source': _source, 'triggers': _sub_d.get('trigger_subscriptions', []), 'last_ran_at': _ran_at, 'age_min': _age, 'freshness': _fresh, 'duration_sec': _dur}] -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endfor -%}
              {%- endif -%}
              {{ _ns.l }}
        - variables:
            _flags: >-
              {%- set _ns = namespace(f=[]) -%}
              {%- if _ninja_attr | int >= 2 -%}
                {%- set _ns.f = _ns.f + [{'flag': 'queue_backlog', 'severity': 'warn', 'detail': 'Ninja queue at capacity (' ~ _ninja_attr ~ '/2). New invocations are queuing.'}] -%}
              {%- endif -%}
              {{ _ns.f }}
            _known_issues: []
        - variables:
            response:
              tool: pipeline
              generated: "{{ _now }}"
              window_hours: "{{ _hours }}"
              queue:
                ninja_running: "{{ _ninja_attr }}"
                ninja_last_triggered: "{{ _ninja_last }}"
                super_running: "{{ _super_attr }}"
              scheduler:
                last_run_at: "{{ _sched_ts }}"
                age_min: "{{ _sched_age_min }}"
                recent_runs: "{{ _recent_runs }}"
              components: "{{ _subs_list }}"
              logbook:
                total_invocations: "{{ _lb_count }}"
                window_hours: "{{ _hours }}"
                page: "{{ _page }}"
                total_pages: "{{ _lb_total_pages }}"
                page_size: "{{ _page_size }}"
                entries: "{{ _lb_page }}"
              flags: "{{ _flags }}"
              known_issues: "{{ _known_issues }}"
              caller_token: "{{ caller_token }}"
      - conditions:
        - alias: Render Dojo
          condition: template
          value_template: "{{ tool == 'render_dojo' }}"
        sequence:
        - variables:
            _dojo_raw: >-
              {%- import 'zenos_ai/zen_os_1.jinja' as zen -%}
              {{ zen.dojo_loader() }}
        - variables:
            response:
              tool: render_dojo
              result: success
              chars: "{{ _dojo_raw | trim | length }}"
              dojo: "{{ _dojo_raw | trim | from_json if (_dojo_raw | trim).startswith('{') else {} }}"
              caller_token: "{{ caller_token }}"
      - conditions:
        - alias: Render System
          condition: template
          value_template: "{{ tool == 'render_system' }}"
        sequence:
        - variables:
            _idcard_raw: >-
              {%- import 'zenos_ai/zen_os_1.jinja' as zen -%}
              {{ zen.identity_resolve_source(states('sensor.zen_default_ai_user_cabinet_resolved')) }}
        - variables:
            _system_raw: >-
              {%- import 'zenos_ai/zen_os_1.jinja' as zen -%}
              {%- set _id = _idcard_raw | trim | from_json if (_idcard_raw | trim).startswith('{') else {} -%}
              {{ zen.prompt_system(_id) }}
        - variables:
            response:
              tool: render_system
              result: success
              chars: "{{ _system_raw | trim | length }}"
              system: "{{ _system_raw | trim | from_json if (_system_raw | trim).startswith('{') else {} }}"
              caller_token: "{{ caller_token }}"
      - conditions:
        - alias: Prompt Health
          condition: template
          value_template: "{{ tool == 'prompt_health' }}"
        sequence:
        - variables:
            _health_raw: >-
              {%- import 'zenos_ai/zen_os_1.jinja' as zen -%}
              {{ zen.prompt_health_check() }}
            _audit_raw: >-
              {%- import 'zenos_ai/zen_os_1.jinja' as zen -%}
              {{ zen.prompt_length_audit() }}
            _agent_raw: >-
              {%- set _active = states('input_text.zenos_conversation_agent') -%}
              {%- set _all = (states.conversation | list) + (states.ai_task | list) -%}
              {%- set ns = namespace(active={}, conv_count=0, ai_count=0) -%}
              {%- for s in _all -%}
                {%- if s.entity_id.startswith('conversation.') -%}{%- set ns.conv_count = ns.conv_count + 1 -%}{%- endif -%}
                {%- if s.entity_id.startswith('ai_task.') -%}{%- set ns.ai_count = ns.ai_count + 1 -%}{%- endif -%}
                {%- if s.entity_id == _active -%}
                  {%- set _entry = config_entry_id(s.entity_id) -%}
                  {%- set _model = device_attr(s.entity_id, 'model_id') or device_attr(s.entity_id, 'model') -%}
                  {%- set _state_str = config_entry_attr(_entry, 'state') | string if _entry else '' -%}
                  {%- set ns.active = {
                    'entity_id': s.entity_id,
                    'model': _model if _model else 'unspecified',
                    'provider': device_attr(s.entity_id, 'manufacturer') or 'unspecified',
                    'integration': config_entry_attr(_entry, 'domain') if _entry else 'unspecified',
                    'canon_ok': _active != '' and _active not in ['unknown', 'unavailable'] and 'LOADED' in _state_str
                  } -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.active | combine({'conversation_count': ns.conv_count, 'ai_task_count': ns.ai_count}) | tojson }}
        - variables:
            response:
              tool: prompt_health
              result: success
              health: "{{ _health_raw | trim | from_json if (_health_raw | trim).startswith('{') else {} }}"
              length_audit: "{{ _audit_raw | trim | from_json if (_audit_raw | trim).startswith('{') else {} }}"
              agent: "{{ _agent_raw | trim | from_json if (_agent_raw | trim).startswith('{') else {} }}"
              how_to_see_full_prompt: "Call Identity tool with mode=render_prompt to see the complete rendered prompt as the active agent receives it. Edit zen_os_1.jinja or component instructions → ha_reload_templates → render_prompt again."
              caller_token: "{{ caller_token }}"
      - conditions:
        - alias: pnotif_list
          condition: template
          value_template: "{{ tool == 'pnotif_list' }}"
        sequence:
        - variables:
            _notifs: >-
              {%- set ns = namespace(n=[]) -%}
              {%- for e in states.persistent_notification -%}
                {%- set _id = e.entity_id | replace('persistent_notification.', '') -%}
                {%- set ns.n = ns.n + [{'notification_id': _id, 'title': e.attributes.get('title', ''), 'message': e.attributes.get('message', e.state), 'created_at': e.attributes.get('created_at', '')}] -%}
              {%- endfor -%}
              {{ ns.n }}
        - variables:
            response:
              tool: "{{ tool }}"
              result: ok
              count: "{{ _notifs | count }}"
              notifications: "{{ _notifs }}"
              read_caveat: "Reads states.persistent_notification — HA 2025.x+ may store notifications outside the state machine. count=0 does not guarantee the HA panel is clear. Verify in UI if suspicious."
      - conditions:
        - alias: pnotif_raise
          condition: template
          value_template: "{{ tool == 'pnotif_raise' }}"
        sequence:
        - action: persistent_notification.create
          data:
            title: "{{ notif_title | default('') }}"
            message: "{{ notif_message | default('') }}"
            notification_id: "{{ notif_id | default('') }}"
        - variables:
            response:
              tool: "{{ tool }}"
              result: ok
              notification_id: "{{ notif_id | default('') }}"
              message: "Notification raised."
      - conditions:
        - alias: pnotif_edit
          condition: template
          value_template: "{{ tool == 'pnotif_edit' }}"
        sequence:
        - action: persistent_notification.create
          data:
            title: "{{ notif_title | default('') }}"
            message: "{{ notif_message | default('') }}"
            notification_id: "{{ notif_id | default('') }}"
        - variables:
            response:
              tool: "{{ tool }}"
              result: ok
              notification_id: "{{ notif_id | default('') }}"
              message: "Notification updated (re-raised with same id)."
      - conditions:
        - alias: pnotif_dismiss
          condition: template
          value_template: "{{ tool == 'pnotif_dismiss' }}"
        sequence:
        - action: persistent_notification.dismiss
          data:
            notification_id: "{{ notif_id | default('') }}"
        - variables:
            response:
              tool: "{{ tool }}"
              result: ok
              notification_id: "{{ notif_id | default('') }}"
              message: "Notification dismissed."
      - conditions:
        - alias: repairs_list
          condition: template
          value_template: "{{ tool == 'repairs_list' }}"
        sequence:
        - variables:
            _issues: >-
              {%- set ns = namespace(l=[]) -%}
              {%- for eid in integration_entities('repairs') | list -%}
                {%- set _d   = state_attr(eid, 'domain')      | default('', true) -%}
                {%- set _iid = state_attr(eid, 'issue_id')    | default('', true) -%}
                {%- set _ttl = state_attr(eid, 'title')       | default(state_attr(eid, 'translation_key') | default('', true), true) -%}
                {%- set _sev = state_attr(eid, 'severity')    | default('warning', true) -%}
                {%- set _fix = state_attr(eid, 'is_fixable')  | default(false, true) -%}
                {%- set _ign = state_attr(eid, 'ignored')     | default(false, true) -%}
                {%- set ns.l = ns.l + [{'entity_id': eid, 'issue_id': _iid, 'domain': _d, 'severity': _sev, 'is_fixable': _fix, 'ignored': _ign, 'title': _ttl}] -%}
              {%- endfor -%}
              {{ ns.l }}
        - variables:
            response:
              tool: "{{ tool }}"
              result: ok
              count: "{{ _issues | count }}"
              issues: "{{ _issues }}"
              hint: "Fixable issues: use ectoplasm action_type=repair_remove or repair_ignore_all. Spook-created issues have domain=zenos."
      - conditions:
        - alias: repair_fix
          condition: template
          value_template: "{{ tool == 'repair_fix' and confirm }}"
        sequence:
        - action: script.zen_dojotools_ectoplasm
          data:
            action_type: repair_remove
            issue_id: "{{ issue_id | default('') }}"
            domain: "{{ repair_domain | default('') }}"
            confirm_action: true
            caller_token: "{{ caller_token }}"
          response_variable: _ecto_fix
        - variables:
            response:
              tool: "{{ tool }}"
              result: "{{ _ecto_fix.status | default('unknown') }}"
              repair_domain: "{{ repair_domain | default('') }}"
              issue_id: "{{ issue_id | default('') }}"
              message: "{{ _ecto_fix.message | default('') }}"
      - conditions:
        - alias: notice_dashboard
          condition: template
          value_template: "{{ tool == 'notice_dashboard' }}"
        sequence:
        - variables:
            _household: "{{ states('sensor.zen_default_household_cabinet_resolved') }}"
        - variables:
            _hh_vars: >-
              {{ state_attr(_household, 'variables') | default({}, true)
                 if _household not in ['unknown','unavailable','none',''] else {} }}
        - variables:
            _alerts_drawer: >-
              {%- set r = (_hh_vars.get('_zen_active_alerts', {}) if _hh_vars is mapping else {}) -%}
              {%- set v = r.get('value', r) if r is mapping else (r | from_json if r is string else {}) -%}
              {{ v if v is mapping else (v | from_json if v is string else {}) }}
        - variables:
            _alert_list: >-
              {%- set ns = namespace(l=[]) -%}
              {%- set _d = _alerts_drawer if _alerts_drawer is mapping else {} -%}
              {%- for key, a in _d.items() if a is mapping -%}
                {%- set ns.l = ns.l + [{'alert_key': key, 'severity': a.get('severity', ''), 'title': a.get('title', ''), 'message': (a.get('message', '') | string)[:200], 'fired_at': a.get('fired_at', ''), 'clear_after_minutes': a.get('clear_after_minutes', '')}] -%}
              {%- endfor -%}
              {{ ns.l }}
        - variables:
            _pnotifs: >-
              {%- set ns = namespace(n=[]) -%}
              {%- for e in states.persistent_notification -%}
                {%- set _id = e.entity_id | replace('persistent_notification.', '') -%}
                {%- set ns.n = ns.n + [{'notification_id': _id, 'title': e.attributes.get('title', ''), 'message': e.attributes.get('message', e.state), 'created_at': e.attributes.get('created_at', '')}] -%}
              {%- endfor -%}
              {{ ns.n }}
        - variables:
            _rep_issues: >-
              {%- set ns = namespace(l=[]) -%}
              {%- for eid in integration_entities('repairs') | list -%}
                {%- set _d   = state_attr(eid, 'domain')      | default('', true) -%}
                {%- set _iid = state_attr(eid, 'issue_id')    | default('', true) -%}
                {%- set _ttl = state_attr(eid, 'title')       | default(state_attr(eid, 'translation_key') | default('', true), true) -%}
                {%- set _sev = state_attr(eid, 'severity')    | default('warning', true) -%}
                {%- set _fix = state_attr(eid, 'is_fixable')  | default(false, true) -%}
                {%- set _ign = state_attr(eid, 'ignored')     | default(false, true) -%}
                {%- set ns.l = ns.l + [{'entity_id': eid, 'issue_id': _iid, 'domain': _d, 'severity': _sev, 'is_fixable': _fix, 'ignored': _ign, 'title': _ttl}] -%}
              {%- endfor -%}
              {{ ns.l }}
        - variables:
            _nd_lb_start: "{{ (now() - timedelta(hours=1)).strftime('%Y-%m-%dT%H:%M:%S') }}"
        - action: rest_command.ha_api_get
          data:
            path: "logbook/{{ _nd_lb_start }}?entity_id=script.zen_dojotools_postman"
          response_variable: _nd_lb_raw
        - variables:
            _recent_dispatches: >-
              {%- set _c = _nd_lb_raw.content | default([]) -%}
              {%- set _entries = _c | from_json if _c is string else (_c if _c is iterable else []) -%}
              {%- set ns = namespace(postman=0, announce=0, last_at='') -%}
              {%- for e in _entries if e is mapping and e.get('state', '') == 'on' -%}
                {%- set _eid = e.get('entity_id', '') -%}
                {%- if 'postman' in _eid -%}{%- set ns.postman = ns.postman + 1 -%}{%- endif -%}
                {%- if 'announce' in _eid -%}{%- set ns.announce = ns.announce + 1 -%}{%- endif -%}
                {%- set _w = e.get('when', '') -%}
                {%- if _w and (ns.last_at == '' or _w > ns.last_at) -%}{%- set ns.last_at = _w -%}{%- endif -%}
              {%- endfor -%}
              {{ {'postman': ns.postman, 'announce': ns.announce, 'last_at': ns.last_at[:16] if ns.last_at else 'none', 'window_hours': 1} }}
        - variables:
            _pending_updates: >-
              {%- set ns = namespace(l=[]) -%}
              {%- for e in states.update if e.state == 'on' -%}
                {%- set _utitle = e.attributes.get('title') or e.name -%}
                {%- set _installable = (e.attributes.get('supported_features', 0) | int) | bitwise_and(1) == 1 -%}
                {%- set ns.l = ns.l + [{'entity_id': e.entity_id, 'title': _utitle, 'installed': e.attributes.get('installed_version', ''), 'latest': e.attributes.get('latest_version', ''), 'skipped': e.attributes.get('skipped_version', none) is not none, 'installable': _installable}] -%}
              {%- endfor -%}
              {{ ns.l }}
        - variables:
            _action_queue: >-
              {%- set ns = namespace(q=[]) -%}
              {%- for a in _alert_list if a is mapping -%}
                {%- set ns.q = ns.q + [{'priority': a.get('severity', 'warn'), 'item': a.get('title', a.get('alert_key', '')), 'tool': 'alertmanager', 'call': {'mode': 'clear', 'alert_key': a.get('alert_key', '')}}] -%}
              {%- endfor -%}
              {%- for p in _pnotifs if p is mapping -%}
                {%- set ns.q = ns.q + [{'priority': 'info', 'item': p.get('title', p.get('notification_id', '')), 'tool': 'systemtools', 'call': {'tool': 'pnotif_dismiss', 'notif_id': p.get('notification_id', '')}}] -%}
              {%- endfor -%}
              {%- for r in _rep_issues if r is mapping and not r.get('ignored', false) -%}
                {%- set ns.q = ns.q + [{'priority': r.get('severity', 'warning'), 'item': r.get('title', r.get('issue_id', '')), 'tool': 'systemtools', 'call': {'tool': 'repair_fix', 'repair_domain': r.get('domain', ''), 'issue_id': r.get('issue_id', '')}}] -%}
              {%- endfor -%}
              {%- for u in _pending_updates if u is mapping and not u.get('skipped', false) -%}
                {%- if u.get('installable', false) -%}
                  {%- set ns.q = ns.q + [{'priority': 'info', 'item': u.get('title', ''), 'installed': u.get('installed', ''), 'latest': u.get('latest', ''), 'tool': 'systemtools', 'call': {'tool': 'ha_update_install', 'entity_id': u.get('entity_id', '')}}] -%}
                {%- else -%}
                  {%- set ns.q = ns.q + [{'priority': 'fyi', 'item': u.get('title', ''), 'installed': u.get('installed', ''), 'latest': u.get('latest', ''), 'note': 'update managed externally — no HA action available'}] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.q }}
        - variables:
            response:
              tool: "{{ tool }}"
              result: ok
              generated: "{{ now().isoformat() }}"
              alerts:
                count: "{{ _alert_list | count }}"
                active: "{{ _alert_list }}"
              persistent_notifications:
                count: "{{ _pnotifs | count }}"
                items: "{{ _pnotifs }}"
                read_caveat: "{{ 'states.persistent_notification may be incomplete on HA 2025.x+ — verify panel if count seems wrong' if _pnotifs | count == 0 else '' }}"
              repairs:
                count: "{{ _rep_issues | count }}"
                issues: "{{ _rep_issues }}"
              pending_updates:
                count: "{{ _pending_updates | count }}"
                items: "{{ _pending_updates }}"
              recent_dispatches: "{{ _recent_dispatches }}"
              action_queue: "{{ _action_queue }}"
      default:
      - variables:
          response: "{{\n  {\n    \"tool\": tool | default('N/A'),\n    \"confirm\":
            confirm | default(false),\n    \"result\": \"error\",\n    \"message\":
            \"No tool selected.\"\n  }\n}}"
    - variables:
        response: "{{ response | combine({'caller_token': caller_token | default('')}) if response is mapping else response }}"
    - stop: return
      response_variable: response
    alias: Zen DojoTools SystemTools
    description: "Zen DojoTools SystemTools (2.2.0)\n\
      \nHEALTH: zen_health_report — reads all 5 health sensors + 7 resolver states.\n\
      \nReturns overall ok/issues_found, resolver all_ok, timestamps, monk_status, schema_ok, kill switches, diagnosis.\n\
      \nPIPELINE: pipeline — ninja summarizer pipeline monitor. Queue depth, per-component\n\
      \nfreshness, scheduler history, logbook invocations (period_hours, paginated),\n\
      \ndynamic flags, and static KFC trigger pattern recommendations.\n\
      \nPROMPT INSPECTION (no target needed — uses active persona):\n\
      \  render_dojo — renders live dojo/KFC section as the active agent receives it. Qualitative review.\n\
      \  render_system — renders system cabinet section (purpose + directives + cortex).\n\
      \  prompt_health — health signals + per-section char counts. Points to Identity render_prompt for full view.\n\
      \nNOTIFICATIONS:\n\
      \  pnotif_list — list all active persistent notifications.\n\
      \  pnotif_raise — create a notification (notif_id, notif_title, notif_message).\n\
      \  pnotif_edit — update an existing notification by id (re-raises with same id).\n\
      \  pnotif_dismiss — dismiss a notification by id (notif_id required).\n\
      \nREPAIRS & NOTICE:\n\
      \  repairs_list — list all HA repair issues (issue_id, domain, severity, is_fixable, description).\n\
      \  repair_fix — remove a repair issue via ectoplasm (repair_domain, issue_id, confirm required).\n\
      \  notice_dashboard — ZenOS alerts + persistent notifications + repairs + pending updates + recent dispatches.\n\
      \    Returns pre-built action_queue[]{priority,item,tool,call} — iterate and fire. Start here for triage.\n\
      \nRELOAD RESPONSE: ha_reload_all/ha_reload_scripts return immediately —\n\
      \nreload fires deferred via scheduler. All reload modes are config-checked:\n\
      \nnogo blocks the reload and returns errors. Silence = reload fired.\n\
      \nRELOAD (no restart):\n\
      \  ha_reload_all — all YAML domains, config-checked. Deferred. DEFAULT.\n\
      \  ha_reload_scripts — scripts only. Config-checked. Deferred.\n\
      \  ha_reload_automations — automations only. Config-checked. STOPS in-flight actions.\n\
      \  ha_reload_templates — custom_templates/ Jinja only. Config-checked.\n\
      \nRESTART REQUIRED:\n\
      \  auth_providers, http:, recorder:, new unbootstrapped integrations,\n\
      \  logger: YAML block. (Use logger.set_level for runtime log changes.)\n\
      \nOTHER: ha_config_check, ha_restart, ha_update_install/skip/clear_skipped,\n\
      \  cabinet_schema_upgrade — run if Flynn notified you of a pre-RC2 schema migration.\n\
      \nUse tool=help for full reference and FG notes."
    fields:
      tool:
        selector:
          select:
            options:
            - zen_resolver_refresh
            - zen_health_report
            - help
            - ha_reload_all
            - ha_reload_scripts
            - ha_reload_automations
            - ha_reload_templates
            - ha_restart
            - ha_config_check
            - ha_update_install
            - ha_update_skip
            - ha_update_clear_skipped
            - cabinet_schema_upgrade
            - pipeline
            - render_dojo
            - render_system
            - prompt_health
            - pnotif_list
            - pnotif_raise
            - pnotif_edit
            - pnotif_dismiss
            - repairs_list
            - repair_fix
            - notice_dashboard
            - tool_manifest
      confirm_action:
        selector:
          boolean:
        name: confirm_action
        description: User has confirmed action (for protected and confirmation required)
      entity_id:
        selector:
          text:
        description: Entity ID to target - REQUIRED for 'Update' actions
      do_backup:
        selector:
          text:
        name: Backup before Install
        description: Flag backup before install or change, Default off - ask the end
          user.
      period_hours:
        name: Period Hours
        description: Lookback window in hours (1–24). Default 3.
        selector:
          number:
            min: 1
            max: 24
        default: 3
      page:
        name: Page
        description: Logbook page number (page_size=20). Default 1.
        selector:
          number:
            min: 1
            max: 50
        default: 1
      notif_id:
        name: Notification ID
        description: ID for pnotif_raise/edit/dismiss. Slug-style, no spaces.
        selector:
          text:
      notif_title:
        name: Notification Title
        description: Title for pnotif_raise or pnotif_edit.
        selector:
          text:
      notif_message:
        name: Notification Message
        description: Body text for pnotif_raise or pnotif_edit.
        selector:
          text:
      repair_domain:
        name: Repair Domain
        description: Handler domain for repair_fix (e.g. homeassistant). From repairs_list.
        selector:
          text:
      issue_id:
        name: Repair Issue ID
        description: issue_id for repair_fix. From repairs_list response.
        selector:
          text:
      caller_token:
        name: Caller Token
        description: Opaque token passed through by the caller for correlation. Not interpreted by this script.
        required: false
        selector:
          text:

  zen_dojotools_ha_log_viewer:
    alias: Zen DojoTools HA Log Viewer
    description: "Zen DojoTools HA Log Viewer PRO (1.1.0)\nLLM Instructions (general-purpose):\n\
      Retrieves Home Assistant core logs using safe, pre-approved shell commands.\n\
      Log file guard detects HA 2025.11+ journal mode automatically — missing log\n\
      file returns structured journal_mode guidance instead of an error.\n\nModes:\n\
      \  - tail:    last N lines (uses \"lines\")\n  - search:  grep-matching lines\
      \ (requires \"pattern\")\n  - full:    entire log (auto-truncated)\n  - summary:\
      \ first N lines (uses \"lines\")\n  - page:    return a specific window of the\
      \ log using \"start\" + \"count\"\n\nInputs:\n  - \"pattern\" (search mode only)\n\
      \  - \"lines\"   (tail + summary)\n  - \"start\"  (page mode)\n  - \"count\"\
      \   (page mode)\n\nOutput is a structured JSON object with:\n  status, mode,\
      \ pattern, lines_requested, truncated, line_count,\n  message, result (log text)\n\
      \nDo not request file writes, deletes, or privileged ops.\n"
    mode: parallel
    fields:
      mode:
        selector:
          select:
            options:
            - tail
            - search
            - full
            - summary
            - page
            - tool_manifest
        default: tail
      pattern:
        selector:
          text:
        default: ''
      lines:
        selector:
          number:
            min: 25
            max: 20000
        default: 5000
      start:
        selector:
          number:
            min: 1
            max: 500000
        default: 1
      count:
        selector:
          number:
            min: 10
            max: 20000
        default: 500
      caller_token:
        name: Caller Token
        description: Opaque token passed through by the caller for correlation. Not interpreted by this script.
        required: false
        selector:
          text:
    sequence:
    # --------------------------------------------------------------
    # Always normalize User/AI inputs so we don't have to react JIT
    # --------------------------------------------------------------
    - variables:
        caller_token: "{{- caller_token | default('') -}}"

    - variables:
        m: '{{ mode }}'
        n: '{{ lines }}'
        s: '{{ start | default(1) }}'
        c: '{{ count | default(500) }}'
        limit: 240000
    - variables:
        p: >-
          {%- set _raw = pattern | default('', true) | string | trim -%}
          {%- set _safe = _raw | replace("'", "") | replace('"', "") | replace(';', "") | replace('`', "") -%}
          {{ _safe }}
    # --- tool_manifest ---
    - choose:
      - conditions:
        - condition: template
          value_template: "{{- m == 'tool_manifest' -}}"
        sequence:
        - variables:
            result: >-
              {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
              {{- MF.tool_manifest(
                tool='zen_dojotools_ha_log_viewer',
                display_name='HA Log Viewer - Core Log Inspector',
                tier='dojotools',
                version='1.1.0',
                health={'configured': true, 'status': 'ok', 'notes': []},
                required_labels=['dojotools'],
                optional_labels=[],
                consumes=['mode', 'pattern', 'lines', 'start', 'count'],
                returns=['log_text', 'line_count'],
                failure_policy='soft',
                modes={'tail': 'tail', 'search': 'search', 'full': 'full', 'summary': 'summary', 'page': 'page', 'manifest': 'tool_manifest'},
                icon='mdi:text-box-search',
                color='blue-grey',

                caller_token=caller_token | default('')
              ) | from_json -}}
        - stop: ha_log_viewer tool manifest
          response_variable: result

    # ===== LOG GUARD (Veronica/ZenOS-AI spec, HA 2025.11+ journal behavior) =====
    - action: shell_command.zen_log_check
      response_variable: log_check
    - variables:
        log_file_exists: "{{ 'exists' in (log_check.stdout | default('')) }}"
    - choose:
      - conditions:
        - alias: Log file missing — evaluate version
          condition: template
          value_template: '{{ not log_file_exists }}'
        sequence:
        - variables:
            ha_ver_raw: "{{ state_attr('update.home_assistant_core_update',
              'installed_version') | default('0.0') }}"
        - variables:
            is_modern_ha: >-
              {% set parts = ha_ver_raw.split('.') %}
              {% set major = parts[0] | int %}
              {% set minor = parts[1] | int if parts | length > 1 else 0 %}
              {{ (major > 2025) or (major == 2025 and minor >= 11) }}
        - choose:
          - conditions:
            - alias: journal_mode — expected on HA 2025.11+
              condition: template
              value_template: '{{ is_modern_ha }}'
            sequence:
            - variables:
                final:
                  status: journal_mode
                  log_file_present: false
                  expected_behavior: true
                  root_cause: core_logging_changed_to_journal
                  ha_version: '{{ ha_ver_raw }}'
                  user_guidance:
                    explain:
                    - Persistent home-assistant.log removed in HA 2025.11
                    - Logs now stored in system journal
                    recommended_actions:
                    - Use Settings → System → Logs (live + raw log access)
                    - Use journalctl for system-level access
                    - "Install HACS file-logger to restore persistent log file:\
                      \ https://github.com/Petro31/a-file-logger"
                    do_not:
                    - Do not reinstall Home Assistant
                    - Do not assume corruption or startup failure
                    - Do not treat missing log file as an error
                  caller_token: '{{ caller_token }}'
            - stop: journal_mode
              response_variable: final
          default:
          - variables:
              final:
                status: unexpected_missing_log
                severity: warning
                log_file_present: false
                ha_version: '{{ ha_ver_raw }}'
                possible_causes:
                - startup_failure
                - filesystem_issue
                - logging_misconfiguration
                recommended_actions:
                - Use Settings → System → Logs for recent entries
                - Run ha_config_check via zen_dojotools_systemtools
                - Review supervisor logs via zen_dojotools_ha_api
                - Verify /config mount integrity
                caller_token: '{{ caller_token }}'
          - stop: legacy_missing_error
            response_variable: final
    # ===== END GUARD — file exists, proceed with mode dispatch =====
    - variables:
        raw:
          stdout: ''
          stderr: ''
          returncode: -1
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ m == ''tail'' }}'
        sequence:
        - action: shell_command.zen_log_tail
          data:
            lines: '{{ n }}'
          response_variable: raw
      - conditions:
        - condition: template
          value_template: '{{ m == ''search'' }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ not p }}'
            sequence:
            - variables:
                final:
                  status: error
                  message: Search mode requires a non-empty pattern.
                  mode: '{{ m }}'
                  pattern: '{{ p }}'
                  truncated: false
                  line_count: 0
                  lines_requested: '{{ n }}'
                  result: ''
                  caller_token: '{{ caller_token }}'
            - stop: invalid_search
              response_variable: final
        - action: shell_command.zen_log_search
          data:
            pattern: '{{ p }}'
          response_variable: raw
      - conditions:
        - condition: template
          value_template: '{{ m == ''full'' }}'
        sequence:
        - action: shell_command.zen_log_full
          response_variable: raw
      - conditions:
        - condition: template
          value_template: '{{ m == ''summary'' }}'
        sequence:
        - action: shell_command.zen_log_summary
          data:
            count: '{{ n }}'
            start: 1
          response_variable: raw
      - conditions:
        - condition: template
          value_template: '{{ m == ''page'' }}'
        sequence:
        - action: shell_command.zen_log_page
          data:
            start: '{{ s }}'
            count: '{{ c }}'
          response_variable: raw
    - variables:
        stdout: '{{ raw.stdout | default('''') }}'
        stderr: '{{ raw.stderr | default('''') }}'
        combined: "{{ (stdout ~ '\n' ~ stderr) | trim }}"
    - variables:
        safe: "{% set txt = combined | string %}\n{% if txt | length > limit %}\n  {{
          txt[:limit] ~ '\\n... [truncated for safety]' }}\n{% else %}\n  {{ txt }}\n{%
          endif %}\n"
        truncated: '{{ (combined | length) > limit }}'
        count: "{{ safe.split('\n') | length }}"
        final:
          status: success
          mode: '{{ m }}'
          pattern: '{{ p }}'
          lines_requested: '{{ n }}'
          truncated: '{{ truncated }}'
          line_count: '{{ count }}'
          message: HA logs returned ({{ m }} mode)
          result: '{{ safe }}'
          caller_token: '{{ caller_token }}'
    - stop: done
      response_variable: final
    icon: mdi:file-find-outline

  zen_dojotools_event_emitter:
    alias: Zen DojoTools Event Emitter
    description: "Zen DojoTools Event Emitter (v4.5.1). Advanced mode for Zen!\nEmits
      structured ZenOS-AI events or returns a dictionary of canonical event shapes.
      Used for breadcrumbs, observability, and trace reconstruction by Zen Constructs
      and the Monastery.\nModes:\n  emit → send a zen_event to the HA EventBus\n  help
      → return well-known event templates (Zen Event Lexicon)\n\nFields:\n  timestamp,
      component, severity, kind, summary, metadata, kata, monk.\n\nFIRED EVENT SHAPE
      (trigger.event.data.event):\n  timestamp, component, severity, kind, summary,
      metadata — ALL six keys present on the bus. kata and monk are NOT included in
      the fired event (internal log only). Automation consumers: access via\n
      trigger.event.data['event']['metadata']['your_key'] | default('').\n\nPayloads
      must remain small; avoid logs or large arrays. This tool never alters system
      state—only emits events or returns definitions.\n"
    fields:
      mode:
        selector:
          select:
            options:
            - emit
            - help
            - tool_manifest
        default: emit
        description: 'Operation mode. emit = send event. help = return canonical event
          shapes.

          '
      component:
        selector:
          text:
        required: true
        description: 'REQUIRED. Subsystem generating the event. Example: "friday", "monastery",
          "filecabinet", "room_manager", "warden".

          '
      severity:
        selector:
          select:
            options:
            - debug
            - info
            - warn
            - error
        default: info
        description: 'Severity of this event.

          '
      kind:
        selector:
          text:
        required: true
        description: 'REQUIRED. Event classifier. Examples: "summary", "summary_force",
          "kata_emit", "heartbeat".

          '
      summary:
        selector:
          text:
        required: true
        description: 'REQUIRED. Human-readable summary (1–2 sentences).

          '
      metadata:
        selector:
          object:
        default: {}
        description: 'OPTIONAL. Small structured details (no logs or large arrays).

          '
      kata:
        selector:
          object:
        default: {}
        description: 'OPTIONAL. Tiny kata snapshot.

          '
      monk:
        selector:
          object:
        default: {}
        description: 'OPTIONAL. Miniature reasoning breadcrumb.

          '
      caller_token:
        name: Caller Token
        description: Opaque token passed through by the caller for correlation. Not interpreted by this script.
        required: false
        selector:
          text:
    mode: parallel
    sequence:
    # --------------------------------------------------------------
    # Always normalize User/AI inputs so we don't have to react JIT
    # --------------------------------------------------------------
    - variables:
        caller_token: "{{- caller_token | default('') -}}"

    # --- tool_manifest ---
    - choose:
      - conditions:
        - condition: template
          value_template: "{{- mode | default('') == 'tool_manifest' -}}"
        sequence:
        - variables:
            result: >-
              {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
              {{- MF.tool_manifest(
                tool='zen_dojotools_event_emitter',
                display_name='Event Emitter - ZenOS Event Bus',
                tier='dojotools',
                version='1.0.0',
                health={'configured': true, 'status': 'ok', 'notes': []},
                required_labels=['dojotools'],
                optional_labels=[],
                consumes=['component', 'severity', 'kind', 'summary', 'metadata'],
                returns=['event_id'],
                failure_policy='soft',
                modes={'emit': 'emit', 'help': 'help', 'manifest': 'tool_manifest'},
                icon='mdi:lightning-bolt',
                color='amber',

                caller_token=caller_token | default('')
              ) | from_json -}}
        - stop: event_emitter tool manifest
          response_variable: result

    - choose:
      - conditions:
        - condition: template
          value_template: '{{ mode == ''help'' }}'
        sequence:
        - variables:
            well_known_events:
              summary_force:
                component: any
                kind: summary_force
                severity: info
                summary: Forcing immediate Zen summary of (Kung fu component id)
                metadata:
                  force: summary
                kata: {}
                monk: {}
              caller_token: '{{ caller_token }}'
        - stop: done
          response_variable: well_known_events
    - variables:
        ts: '{{ now().isoformat() }}'
        evt:
          timestamp: '{{ ts }}'
          component: '{{ component }}'
          severity: '{{ severity }}'
          kind: '{{ kind }}'
          summary: '{{ summary }}'
          metadata: '{{ metadata | default({}) }}'
          kata: '{{ kata | default({}) }}'
          monk: '{{ monk | default({}) }}'
    - event: zen_event
      event_data:
        event:
          timestamp: '{{ ts }}'
          component: '{{ component }}'
          severity: '{{ severity }}'
          kind: '{{ kind }}'
          summary: '{{ summary }}'
          metadata: '{{ metadata | default({}) }}'
    - data:
        message: 'zen_event {{ evt.component }} | {{ evt.kind }} | {{ evt.severity }}
          | summary="{{ evt.summary }}" | meta={{ evt.metadata | tojson }}

          '
        level: '{{ severity }}'
      action: system_log.write
    - variables:
        final:
          status: success
          message: Zen event emitted
          event: '{{ evt }}'
          caller_token: '{{ caller_token }}'
    - stop: done
      response_variable: final
