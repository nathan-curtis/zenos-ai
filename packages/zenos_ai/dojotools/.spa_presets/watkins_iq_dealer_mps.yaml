chem:
  system: saltwater_iq
  active_profile: mps_mode
  tds_sensor_note: >-
    FreshWater IQ measures conductivity approximated as salt ppm (TDS proxy).
    Readings elevated after MPS for up to 24h — not actual salt increase.
    Use mps_sensor_distrust_hours window before acting on salt or chlorine readings.

  watkins_recommended:
    nickname: vanilla
    salt_min: 1500
    salt_max: 2000
    salt_target: 1750
    chlorine_min: 1
    chlorine_max: 5
    chlorine_target: 3
    ph_min: 7.2
    ph_max: 7.8
    ph_target: 7.4
    ph_cooldown_hours: 24
    alk_min: 40
    alk_max: 120
    alk_target: 80
    hard_min: 25
    hard_max: 75
    hard_target: 50
    orp_min: 600
    phosphate_max_ppb: 300
    phosphate_target_ppb: 150
    phosphate_test_interval_days: 14
    iq_hours_warn: 200
    mps_allowed: false
    mps_note: "FreshWater IQ Smart Monitoring not calibrated for MPS — blocked under this profile."

  mps_mode:
    nickname: fairy_dust_protocol
    # Overrides only — inherits everything else from watkins_recommended
    salt_min: 2200
    salt_max: 2600
    salt_target: 2400
    salt_note: "Dealer/owner operating band. Above Watkins published table — no drain unless panel high/red or strip confirms."
    mps_allowed: true
    mps_nickname: fairy_dust
    mps_dose_tsp_per_bather_per_30min: 0.5
    mps_strength_pct_assumed: 40
    mps_strength_range_pct_min: 35
    mps_strength_range_pct_max: 45
    mps_sensor_distrust_hours: 24
    mps_circulate_minutes: 15
    chloramine_warn_combined_ppm: 0.4
