# Caldera Spas Utopia Florence 2024 — FreshWater IQ 2020
# Fully runnable preset. Pass model_preset=caldera_utopia_florence_2024 when provisioning.

model:
  manufacturer: "Watkins Wellness"
  brand: "Caldera Spas"
  series: "Utopia"
  trim: "Florence"
  capacity: 6
  volume_gal: 360
  total_jets: 46
  salt_system: "FreshWater IQ 2020"
  chem_protocol: "mps_mode"
  orientation: "front=toward house — left/right depend on install, adjust jets config if needed"

jets:
  left_pump: "Jet Pump 2 — dual-speed 2.5HP"
  left_seat: "EcstaSeat"
  left_waterfall: "Acquarella Waterfall"
  left_speed_low: 50
  left_speed_high: 100
  right_pump: "Jet Pump 1 — single-speed 2.5HP"
  right_seat: "LumbarSsage"
  right_single_speed: true

temp:
  min_f: 80
  max_f: 104
  default_hold: 98

location_config:
  has_filter: true
  has_salt_system: true
  has_chem_cabinet: true

parts:
  filter_rinse:
    name_suffix: "Spa Filter - Rinse"
    sku: "73722"
    category: filter
    min_stock: 1
    wear_sensor_key: null
    wear_threshold: null
    chore_period_days: 14
    chore_name_suffix: "Rinse Spa Filter"
    chore_note: "Spray off pleated filter with garden hose until water runs clear. Caldera 73722 (100 sq ft). Cross-refs: Unicel C-8399 / Pleatco PCD100W / Filbur FC-3965."

  filter_replace:
    name_suffix: "Spa Filter Cartridge (73722)"
    sku: "73722"
    category: filter
    min_stock: 1
    wear_sensor_key: null
    wear_threshold: null
    chore_period_days: 365
    chore_name_suffix: "Replace Spa Filter Cartridge"
    chore_note: "Replace pleated filter cartridge. Caldera 73722 (100 sq ft). Cross-refs: Unicel C-8399 / Pleatco PCD100W / Filbur FC-3965."

  salt_cartridge:
    name_suffix: "FreshWater IQ Salt Cartridge"
    sku: "76468"
    category: salt_system
    min_stock: 1
    wear_sensor_key: null
    wear_threshold: null
    chore_period_days: 120
    chore_name_suffix: "Replace Salt System Cartridge"
    chore_note: "Replace FreshWater IQ 2020 salt cartridge. Watkins Part# 76468."
    existing_chore_id: 11

chem_supplies:
  water_test:
    name_suffix: "Water Chemistry Test"
    sku: null
    category: chem
    unit: each
    doses_per_container: 50
    min_stock: 10
    chore_period_days: 7
    chore_name_suffix: "Test Spa Water Chemistry"
    chore_note: "Test salt, pH, alkalinity, hardness with 8-in-1 strips. Correction order: alkalinity first → pH → sanitizer. Log results."

  oxidizer_mps:
    name_suffix: "Hot Tub Oxidizer (MPS)"
    sku: null
    category: chem
    unit: dose
    doses_per_container: 450
    min_stock: 90
    chore_period_days: 14
    chore_name_suffix: "Add MPS Oxidizer Dose"
    chore_note: "AquaDoc Professional Chlorine-Free Shock (MPS). 5 lb / 450 doses (1 tsp each). Standard: 0.5 tsp per bather per 30 min soak (= 0.5 doses). Run jets 10 min after. Do not add within 24h of MPS — sensor distrust window."

  water_change:
    name_suffix: null
    sku: null
    category: maintenance
    min_stock: null
    chore_period_days: 90
    chore_name_suffix: "Drain & Refill Spa"
    chore_note: "Drain spa, clean shell with spa surface cleaner, refill with fresh water. Rebalance chemistry after refill: alkalinity → pH → salt → sanitizer. 360 gal volume."

  ph_down:
    name_suffix: "pH / Alkalinity Down"
    sku: null
    category: chem
    unit: dose
    doses_per_container: 75
    min_stock: 15
    chore_period_days: null
    chore_name_suffix: null
    chore_note: "Simple Spa Care pH Down (Sodium Bisulfate). 2.5 lb / 75 doses (1 tbsp each). Lowers pH and alkalinity. Add in small increments; retest after circulation."

  ph_up:
    name_suffix: "pH Increaser"
    sku: null
    category: chem
    unit: dose
    doses_per_container: 34
    min_stock: 7
    chore_period_days: null
    chore_name_suffix: null
    chore_note: "Spa Essentials pH Increaser (Sodium Carbonate). 18 oz / 34 doses (1 tbsp each). Raises pH. Can cloud water if overdosed — use gradually."

  calcium_remover:
    name_suffix: "Vanishing Act Calcium Remover"
    sku: null
    category: chem
    unit: each
    doses_per_container: null
    min_stock: 1
    chore_period_days: null
    chore_name_suffix: null
    chore_note: "Backup only — inline hose filter handles calcium on water fill. Use Vanishing Act only if hardness spikes mid-cycle."

  sanitizer:
    name_suffix: "Spa Sanitizer 56"
    sku: null
    category: chem
    unit: dose
    doses_per_container: 90
    min_stock: 18
    chore_period_days: null
    chore_name_suffix: null
    chore_note: "All Clear Spa Sanitizer 56 (Dichlor). 1 lb / 90 doses (1 tsp each). Primary chlorine sanitizer. Use conservatively once salt system stabilizes — adds CYA."

  defoamer:
    name_suffix: "Spa Defoamer"
    sku: null
    category: chem
    unit: dose
    doses_per_container: 32
    min_stock: 6
    chore_period_days: null
    chore_name_suffix: null
    chore_note: "HTH Spa Defoamer (silicone anti-foam). 16 fl oz / 32 doses (0.5 fl oz each). Symptom treatment only — persistent foam indicates oils, detergents, or dirty filters."
