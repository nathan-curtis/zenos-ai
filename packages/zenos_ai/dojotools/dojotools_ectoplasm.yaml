###############################################################################
# ZenOS-AI DojoTools: Ectoplasm
# Version: 6.3.0
#
# v6.3.0 -- Spook v5.7.0 surface: helper-lifecycle create/delete extended
#   from input_number to all remaining helper domains Spook now supports
#   (timer, input_boolean, counter, input_text, input_button, input_datetime,
#   input_select) -- confirmed against Spook's own services.yaml/services.py
#   source at v5.7.0, not assumed from release notes. Same SESE+envelope
#   shape as input_number_create/delete, same registry_lifecycle_control
#   cert (reversible helper lifecycle, same bucket). Added entity_set_icon/
#   entity_set_aliases (homeassistant.set_entity_icon/set_entity_aliases,
#   same cert). Added category_create/category_delete/category_assign/
#   category_unassign (homeassistant.*_category services) -- a wholly new
#   HA registry surface to ZenOS, same cert. repair_list/ghost_list now call
#   the real repairs.list service (response_variable) instead of a hand-
#   rolled integration_entities('repairs') scan -- adds created/is_fixable/
#   learn_more_url/breaks_in_ha_version fields and a real severity filter.
#   ghost_list's title-string split for the affected entity is UNCHANGED --
#   confirmed repairs.list's response has no structured affected-entity
#   field, so the old workaround is still necessary, not a leftover.
#   input_number.delete's new admin-requirement (Spook v5.7.0 breaking
#   change) does not affect script/automation callers per Spook's own
#   release notes -- verified, no code change needed here.
#
# Scripts:
#   zen_dojotools_ectoplasm — Spook/HA extended surface wrapper
#
# Requires: Spook integration (https://spook.boo) — listed ZenOS prerequisite.
#           Helper-domain create/delete and entity icon/alias/category
#           actions require Spook v5.7.0+.
#
# v6.2.0 -- cadillac pass: full SESE + envelope() conversion (all 34
#   action branches), cert-gate added gating by platform CAPABILITY not
#   mode/tool -- reuses room_topology_edit (same cert room_manager
#   already uses for the same HA area/floor registry) for area/floor
#   structural edits, adds registry_lifecycle_control for reversible
#   entity/device/integration/label/automation toggles, adds
#   registry_purge for orphan_cleanup's irreversible mass deletion.
#   Envelope status now derived from the real result instead of
#   hardcoded 'success' (#10405). Fixed a pre-existing bug where
#   repairs.remove's data.domain field was rejected by HA (#10404).
#
# v6.1.0: automation_snooze / automation_turn_on_for (Spook v5.1.0 #1494/
#         #1495) -- both self-gate on the real service existing via the
#         same has_service capability-probe zen_health_report already uses
#         for spook_installed, never a raw "unknown action" error on older
#         Spook. No reliable way to read a custom integration's version
#         from a template; probing the actual service is strictly better
#         anyway (works across hotfixes without a version-string to maintain).
#
# Covers (v6.3.0):
#   Repairs:      repair_list, ghost_list, repair_create, repair_remove,
#                 repair_ignore_all, repair_unignore_all
#   Areas:        area_create, area_delete, area_assign_device,
#                 area_unassign_device, area_assign_entity, area_unassign_entity
#   Floors:       floor_create, floor_delete, floor_assign_area, floor_unassign_area
#   Entities:     entity_hide, entity_unhide, entity_disable, entity_enable,
#                 entity_rename, entity_set_icon, entity_set_aliases
#   Devices:      device_disable, device_enable
#   Labels:       label_assign_area, label_unassign_area,
#                 label_assign_device, label_unassign_device
#   Categories:   category_create, category_delete, category_assign, category_unassign
#   Integrations: integration_disable, integration_enable
#   Helpers:      input_number_create/delete, timer_create/delete,
#                 input_boolean_create/delete, counter_create/delete,
#                 input_text_create/delete, input_button_create/delete,
#                 input_datetime_create/delete, input_select_create/delete
#                 (input_number since Spook v5.0.0, the rest since v5.7.0)
#   Housekeeping: orphan_cleanup
#   Automations:  automation_snooze, automation_turn_on_for (Spook v5.1.0+)
#
# v6.0.0: input_number_create + input_number_delete (Spook v5.0.0 #1222).
#         floor_assign_area / floor_unassign_area — replaced REST workaround
#         with direct homeassistant.add_area_to_floor /
#         homeassistant.remove_area_from_floor (Spook v5.0.0 schema fix #1293).
#
# NOTE: label_create/delete and label_assign_entity/unassign_entity are in
#       zen_dojotools_labels — Ectoplasm adds area and device surfaces only.
#
# Confirm-gated actions return status: start preview without executing.
# Set confirm_action: true to execute. Read actions never require confirm.
###############################################################################

script:
  zen_dojotools_ectoplasm:
    alias: Zen DojoTools Ectoplasm
    mode: single
    icon: mdi:ghost
    description: >-
      Spook/HA extended surface wrapper — repairs, areas/floors, entity/
      device lifecycle, label assignment, integrations, and orphan
      cleanup. Requires Spook. CALL mode=help FIRST — full action
      reference, confirm_action gating, and cert requirements all live
      there, not here.

    fields:
      mode:
        name: Mode
        description: >-
          Operation to perform.
          Reads: repair_list, ghost_list.
          Repairs: repair_create, repair_remove, repair_ignore_all, repair_unignore_all.
          Areas: area_create, area_delete, area_assign_device, area_unassign_device,
          area_assign_entity, area_unassign_entity.
          Floors: floor_create, floor_delete, floor_assign_area, floor_unassign_area.
          Entities: entity_hide, entity_unhide, entity_disable, entity_enable, entity_rename,
          entity_set_icon, entity_set_aliases.
          Devices: device_disable, device_enable.
          Labels: label_assign_area, label_unassign_area, label_assign_device, label_unassign_device.
          Categories (Spook v5.7.0+): category_create, category_delete, category_assign, category_unassign.
          Integrations: integration_disable, integration_enable.
          Helpers: input_number_create/delete (Spook v5.0.0+), timer_create/delete,
          input_boolean_create/delete, counter_create/delete, input_text_create/delete,
          input_button_create/delete, input_datetime_create/delete,
          input_select_create/delete (all Spook v5.7.0+).
          Housekeeping: orphan_cleanup.
          Automations (Spook v5.1.0+, self-gated — returns a clean
          spook_version_required error on older Spook, never a raw service
          error): automation_snooze (turn an automation off for `duration`,
          survives restart, always turns back on), automation_turn_on_for
          (same, inverted — turn on for `duration`).
        required: false
        selector:
          select:
            options:
              - repair_list
              - ghost_list
              - repair_create
              - repair_remove
              - repair_ignore_all
              - repair_unignore_all
              - area_create
              - area_delete
              - area_assign_device
              - area_unassign_device
              - area_assign_entity
              - area_unassign_entity
              - floor_create
              - floor_delete
              - floor_assign_area
              - floor_unassign_area
              - entity_hide
              - entity_unhide
              - entity_disable
              - entity_enable
              - entity_rename
              - entity_set_icon
              - entity_set_aliases
              - device_disable
              - device_enable
              - label_assign_area
              - label_unassign_area
              - label_assign_device
              - label_unassign_device
              - category_create
              - category_delete
              - category_assign
              - category_unassign
              - integration_disable
              - integration_enable
              - input_number_create
              - input_number_delete
              - timer_create
              - timer_delete
              - input_boolean_create
              - input_boolean_delete
              - counter_create
              - counter_delete
              - input_text_create
              - input_text_delete
              - input_button_create
              - input_button_delete
              - input_datetime_create
              - input_datetime_delete
              - input_select_create
              - input_select_delete
              - orphan_cleanup
              - automation_snooze
              - automation_turn_on_for
              - tool_manifest
              - help
            custom_value: false
      action_type:
        name: Action Type (deprecated)
        description: "Deprecated alias for mode. Use mode instead."
        required: false
        selector:
          text:
      issue_id:
        name: Issue ID
        description: >-
          Repair issue ID. Auto-prefixed with zenos_ unless already prefixed.
          Required for repair_create, repair_remove.
        required: false
        selector:
          text:
      title:
        name: Title
        description: Human-readable repair issue title. Required for repair_create.
        required: false
        selector:
          text:
      issue_description:
        name: Issue Description
        description: >-
          Repair issue body text. Required for repair_create.
          Named issue_description to avoid YAML key collision.
        required: false
        selector:
          text:
            multiline: true
      severity:
        name: Severity
        description: "Repair issue severity. Default: warning. (info maps to information for Spook)"
        required: false
        default: warning
        selector:
          select:
            options:
              - error
              - warning
              - info
            custom_value: false
      domain:
        name: Domain
        description: >-
          HA integration domain. Defaults to zenos for repair_create.
          Optional domain filter for repair_list.
        required: false
        selector:
          text:
      target_area:
        name: Target Area
        description: >-
          HA area ID (slug). Required for area_delete, area_assign_device,
          area_unassign_device, area_assign_entity, area_unassign_entity,
          floor_assign_area, floor_unassign_area, label_assign_area, label_unassign_area.
        required: false
        selector:
          text:
      area_name:
        name: Area Name
        description: Human-readable area name. Required for area_create.
        required: false
        selector:
          text:
      floor_id:
        name: Floor ID
        description: >-
          HA floor ID (slug). Required for floor_delete, floor_assign_area,
          floor_unassign_area. Use floor_assign_area after area_create to set floor.
        required: false
        selector:
          text:
      floor_name:
        name: Floor Name
        description: Human-readable floor name. Required for floor_create.
        required: false
        selector:
          text:
      floor_level:
        name: Floor Level
        description: >-
          Floor level integer. Optional for floor_create.
          Convention: 0 = ground, 1 = first, -1 = basement.
        required: false
        selector:
          number:
            min: -10
            max: 50
            step: 1
      entity_id:
        name: Entity ID
        description: >-
          Entity ID. Required for entity_hide, entity_unhide, entity_disable,
          entity_enable, entity_rename, area_assign_entity, area_unassign_entity,
          automation_snooze, automation_turn_on_for (target automation entity).
        required: false
        selector:
          entity:
      duration:
        name: Duration
        description: >-
          HH:MM:SS duration. Required for automation_snooze (how long the
          automation stays off) and automation_turn_on_for (how long it
          stays on). Spook v5.1.0+ only — see mode description.
        required: false
        selector:
          duration:
      device_id:
        name: Device ID
        description: >-
          Device ID. Required for device_disable, device_enable,
          area_assign_device, area_unassign_device, label_assign_device,
          label_unassign_device.
        required: false
        selector:
          device:
      label_id:
        name: Label ID
        description: HA label ID (slug). Required for label_assign_*/unassign_* actions.
        required: false
        selector:
          text:
      new_name:
        name: New Name
        description: Replacement friendly name. Required for entity_rename.
        required: false
        selector:
          text:
      config_entry_id:
        name: Config Entry ID
        description: Integration config entry ID. Required for integration_disable/enable.
        required: false
        selector:
          text:
      number_name:
        name: Number Name
        description: Human-readable name for the new input number. Required for input_number_create.
        required: false
        selector:
          text:
      number_entity_id:
        name: Number Entity ID
        description: >-
          Optional entity ID suffix for input_number_create. The input_number. prefix
          is added automatically. Derived from name if omitted.
        required: false
        selector:
          text:
      number_min:
        name: Number Min
        description: Minimum value. Default 0. (input_number_create)
        required: false
        selector:
          number:
            mode: box
            step: any
      number_max:
        name: Number Max
        description: Maximum value. Default 100. (input_number_create)
        required: false
        selector:
          number:
            mode: box
            step: any
      number_initial:
        name: Number Initial
        description: Initial value on HA start. (input_number_create)
        required: false
        selector:
          number:
            mode: box
            step: any
      number_step:
        name: Number Step
        description: Step size. Default 1. (input_number_create)
        required: false
        selector:
          number:
            mode: box
            step: any
      number_display_mode:
        name: Number Display Mode
        description: "Display as slider or box. Default: slider. (input_number_create)"
        required: false
        selector:
          select:
            options:
              - slider
              - box
            custom_value: false
      number_unit:
        name: Number Unit
        description: Unit of measurement label. (input_number_create)
        required: false
        selector:
          text:
      number_icon:
        name: Number Icon
        description: "Icon for the helper, e.g. mdi:counter. (input_number_create)"
        required: false
        selector:
          text:

      new_icon:
        name: New Icon
        description: Replacement icon, e.g. mdi:lightbulb. Required for entity_set_icon.
        required: false
        selector:
          text:
      entity_aliases:
        name: Entity Aliases
        description: >-
          Replacement list of voice-assistant aliases for the entity. Required
          for entity_set_aliases. Fully replaces existing aliases (not additive).
        required: false
        selector:
          text:
            multiple: true

      category_scope:
        name: Category Scope
        description: >-
          Where the category applies. Required for category_create, category_delete.
        required: false
        selector:
          select:
            options:
              - automation
              - helpers
              - scene
              - script
            custom_value: false
      category_name:
        name: Category Name
        description: Human-readable category name. Required for category_create.
        required: false
        selector:
          text:
      category_icon:
        name: Category Icon
        description: "Icon for the category, e.g. mdi:shape. (category_create)"
        required: false
        selector:
          text:
      category_id:
        name: Category ID
        description: >-
          Category ID or name. Required for category_delete, category_assign,
          category_unassign.
        required: false
        selector:
          text:

      timer_name:
        name: Timer Name
        description: Human-readable name for the new timer. Required for timer_create.
        required: false
        selector:
          text:
      timer_entity_id:
        name: Timer Entity ID
        description: >-
          Optional entity ID suffix for timer_create. The timer. prefix is
          added automatically. Derived from name if omitted.
        required: false
        selector:
          text:
      timer_duration:
        name: Timer Duration
        description: "How long the timer runs when started. Default 0. (timer_create)"
        required: false
        selector:
          duration:
      timer_restore:
        name: Timer Restore
        description: >-
          Restore a running timer's state across an HA restart. Default
          false. (timer_create)
        required: false
        selector:
          boolean:
      timer_icon:
        name: Timer Icon
        description: "Icon for the helper, e.g. mdi:timer-outline. (timer_create)"
        required: false
        selector:
          text:

      boolean_name:
        name: Boolean Name
        description: Human-readable name for the new input_boolean. Required for input_boolean_create.
        required: false
        selector:
          text:
      boolean_entity_id:
        name: Boolean Entity ID
        description: >-
          Optional entity ID suffix for input_boolean_create. The
          input_boolean. prefix is added automatically. Derived from name
          if omitted.
        required: false
        selector:
          text:
      boolean_initial:
        name: Boolean Initial
        description: Initial on/off value. Keeps pre-restart value if omitted. (input_boolean_create)
        required: false
        selector:
          boolean:
      boolean_icon:
        name: Boolean Icon
        description: "Icon for the helper, e.g. mdi:toggle-switch-outline. (input_boolean_create)"
        required: false
        selector:
          text:

      counter_name:
        name: Counter Name
        description: Human-readable name for the new counter. Required for counter_create.
        required: false
        selector:
          text:
      counter_entity_id:
        name: Counter Entity ID
        description: >-
          Optional entity ID suffix for counter_create. The counter. prefix
          is added automatically. Derived from name if omitted.
        required: false
        selector:
          text:
      counter_initial:
        name: Counter Initial
        description: "Value the counter starts at and resets to. Default 0. (counter_create)"
        required: false
        selector:
          number:
            mode: box
            step: any
      counter_min:
        name: Counter Min
        description: Lowest value the counter can reach. No limit if omitted. (counter_create)
        required: false
        selector:
          number:
            mode: box
            step: any
      counter_max:
        name: Counter Max
        description: Highest value the counter can reach. No limit if omitted. (counter_create)
        required: false
        selector:
          number:
            mode: box
            step: any
      counter_step:
        name: Counter Step
        description: "Amount the counter changes by each step. Default 1. (counter_create)"
        required: false
        selector:
          number:
            mode: box
            step: any
      counter_restore:
        name: Counter Restore
        description: "Restore the counter's value across an HA restart. Default true. (counter_create)"
        required: false
        selector:
          boolean:
      counter_icon:
        name: Counter Icon
        description: "Icon for the helper, e.g. mdi:counter. (counter_create)"
        required: false
        selector:
          text:

      text_name:
        name: Text Name
        description: Human-readable name for the new input_text. Required for input_text_create.
        required: false
        selector:
          text:
      text_entity_id:
        name: Text Entity ID
        description: >-
          Optional entity ID suffix for input_text_create. The input_text.
          prefix is added automatically. Derived from name if omitted.
        required: false
        selector:
          text:
      text_initial:
        name: Text Initial
        description: Initial text value. Keeps pre-restart value if omitted. (input_text_create)
        required: false
        selector:
          text:
      text_min:
        name: Text Min Length
        description: "Shortest the text can be. Default 0. (input_text_create)"
        required: false
        selector:
          number:
            min: 0
            max: 255
            mode: box
      text_max:
        name: Text Max Length
        description: "Longest the text can be. Default 100. (input_text_create)"
        required: false
        selector:
          number:
            min: 1
            max: 255
            mode: box
      text_pattern:
        name: Text Pattern
        description: Regular expression the text has to match. (input_text_create)
        required: false
        selector:
          text:
      text_mode:
        name: Text Mode
        description: "Show as plain text or masked like a password. Default text. (input_text_create)"
        required: false
        selector:
          select:
            options:
              - text
              - password
            custom_value: false
      text_unit:
        name: Text Unit
        description: Unit of measurement label shown next to the text. (input_text_create)
        required: false
        selector:
          text:
      text_icon:
        name: Text Icon
        description: "Icon for the helper, e.g. mdi:form-textbox. (input_text_create)"
        required: false
        selector:
          text:

      button_name:
        name: Button Name
        description: Human-readable name for the new input_button. Required for input_button_create.
        required: false
        selector:
          text:
      button_entity_id:
        name: Button Entity ID
        description: >-
          Optional entity ID suffix for input_button_create. The
          input_button. prefix is added automatically. Derived from name
          if omitted.
        required: false
        selector:
          text:
      button_icon:
        name: Button Icon
        description: "Icon for the helper, e.g. mdi:gesture-tap-button. (input_button_create)"
        required: false
        selector:
          text:

      datetime_name:
        name: Datetime Name
        description: Human-readable name for the new input_datetime. Required for input_datetime_create.
        required: false
        selector:
          text:
      datetime_entity_id:
        name: Datetime Entity ID
        description: >-
          Optional entity ID suffix for input_datetime_create. The
          input_datetime. prefix is added automatically. Derived from name
          if omitted.
        required: false
        selector:
          text:
      datetime_has_date:
        name: Datetime Has Date
        description: >-
          Whether the helper holds a date. At least one of has_date/has_time
          must be true. (input_datetime_create)
        required: false
        selector:
          boolean:
      datetime_has_time:
        name: Datetime Has Time
        description: >-
          Whether the helper holds a time. At least one of has_date/has_time
          must be true. (input_datetime_create)
        required: false
        selector:
          boolean:
      datetime_initial:
        name: Datetime Initial
        description: >-
          Initial date and/or time, e.g. 2026-12-31, 08:30:00, or
          2026-12-31 08:30:00. Keeps pre-restart value if omitted.
          (input_datetime_create)
        required: false
        selector:
          text:
      datetime_icon:
        name: Datetime Icon
        description: "Icon for the helper, e.g. mdi:calendar-clock. (input_datetime_create)"
        required: false
        selector:
          text:

      select_name:
        name: Select Name
        description: Human-readable name for the new input_select. Required for input_select_create.
        required: false
        selector:
          text:
      select_entity_id:
        name: Select Entity ID
        description: >-
          Optional entity ID suffix for input_select_create. The
          input_select. prefix is added automatically. Derived from name
          if omitted.
        required: false
        selector:
          text:
      select_options:
        name: Select Options
        description: >-
          The dropdown's options. Each value unique. Required for
          input_select_create.
        required: false
        selector:
          text:
            multiple: true
      select_initial:
        name: Select Initial
        description: >-
          Option it starts on -- must be one of select_options. Keeps
          pre-restart value if omitted. (input_select_create)
        required: false
        selector:
          text:
      select_icon:
        name: Select Icon
        description: "Icon for the helper, e.g. mdi:form-dropdown. (input_select_create)"
        required: false
        selector:
          text:

      confirm_action:
        name: Confirm Action
        description: >-
          Required for all writes. Omit or false returns status: start preview
          describing what would happen without executing. Set true to execute.
          Read actions (repair_list, ghost_list) do not require confirm.
        required: false
        default: false
        selector:
          boolean:

      caller_token:
        name: Caller Token
        description: Opaque token echoed in response for caller correlation. Not interpreted.
        required: false
        selector:
          text:

    sequence:
      - variables:
          _tm_check: "{{ mode | default('') | lower }}"
      - choose:
        - conditions: "{{ _final is not defined and _tm_check == 'tool_manifest' }}"
          sequence:
          - variables:
              _final: >-
                {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
                {%- set _tm = MF.tool_manifest(
                    tool='zen_dojotools_ectoplasm',
                    display_name='Ectoplasm',
                    tier='dojotools',
                    version='6.3.0',
                    health={'configured': true, 'status': 'ok', 'notes': []},
                    required_labels=['dojotools'],
                    optional_labels=[],
                    consumes=['entity_or_event'],
                    returns=['event_result'],
                    modes={
                      'repair_list': 'repair_list', 'ghost_list': 'ghost_list',
                      'repair_create': 'repair_create', 'repair_remove': 'repair_remove',
                      'repair_ignore_all': 'repair_ignore_all', 'repair_unignore_all': 'repair_unignore_all',
                      'area_create': 'area_create', 'area_delete': 'area_delete',
                      'area_assign_device': 'area_assign_device', 'area_unassign_device': 'area_unassign_device',
                      'area_assign_entity': 'area_assign_entity', 'area_unassign_entity': 'area_unassign_entity',
                      'floor_create': 'floor_create', 'floor_delete': 'floor_delete',
                      'floor_assign_area': 'floor_assign_area', 'floor_unassign_area': 'floor_unassign_area',
                      'entity_hide': 'entity_hide', 'entity_unhide': 'entity_unhide',
                      'entity_disable': 'entity_disable', 'entity_enable': 'entity_enable', 'entity_rename': 'entity_rename',
                      'entity_set_icon': 'entity_set_icon', 'entity_set_aliases': 'entity_set_aliases',
                      'device_disable': 'device_disable', 'device_enable': 'device_enable',
                      'label_assign_area': 'label_assign_area', 'label_unassign_area': 'label_unassign_area',
                      'label_assign_device': 'label_assign_device', 'label_unassign_device': 'label_unassign_device',
                      'category_create': 'category_create', 'category_delete': 'category_delete',
                      'category_assign': 'category_assign', 'category_unassign': 'category_unassign',
                      'integration_disable': 'integration_disable', 'integration_enable': 'integration_enable',
                      'input_number_create': 'input_number_create', 'input_number_delete': 'input_number_delete',
                      'timer_create': 'timer_create', 'timer_delete': 'timer_delete',
                      'input_boolean_create': 'input_boolean_create', 'input_boolean_delete': 'input_boolean_delete',
                      'counter_create': 'counter_create', 'counter_delete': 'counter_delete',
                      'input_text_create': 'input_text_create', 'input_text_delete': 'input_text_delete',
                      'input_button_create': 'input_button_create', 'input_button_delete': 'input_button_delete',
                      'input_datetime_create': 'input_datetime_create', 'input_datetime_delete': 'input_datetime_delete',
                      'input_select_create': 'input_select_create', 'input_select_delete': 'input_select_delete',
                      'orphan_cleanup': 'orphan_cleanup',
                      'automation_snooze': 'automation_snooze', 'automation_turn_on_for': 'automation_turn_on_for',
                      'tool_manifest': 'tool_manifest', 'help': 'help'
                    },
                    icon='mdi:ghost',
                    color='deep-purple',
                    stripe=3,
                    impact='soft',
                    mcp_exposed=true,

                    caller_token=caller_token | default('')
                ) | from_json -%}
                {{- _tm | combine({
                    'certs_required': [
                      {
                        'cert': 'room_topology_edit',
                        'display_name': 'Room Topology Editing',
                        'description': "Shared with zen_dojotools_room_manager (same HA area/floor registry either way, one grant covers both tools). Ectoplasm's area_create/area_assign_device/area_unassign_device/area_assign_entity/area_unassign_entity/floor_create/floor_assign_area/floor_unassign_area (level 1) and area_delete/floor_delete (level 2, irreversible) all gate on this.",
                        'max_level': 4,
                        'gates': ['mode=area_create/area_assign_device/area_unassign_device/area_assign_entity/area_unassign_entity/floor_create/floor_assign_area/floor_unassign_area (level 1)', 'mode=area_delete/floor_delete (level 2, irreversible)'],
                        'live_ack_required_for': [],
                        'grant_via': 'persona_editor mode=cert_req_grant cert_component=room_topology_edit (or zen_dojotools_identity mode=cert_list to see current status)'
                      },
                      {
                        'cert': 'registry_lifecycle_control',
                        'display_name': 'Registry Lifecycle Control',
                        'description': 'Reversible lifecycle toggles on HA registry objects (entity/device/integration/label/category/automation/helper) -- named for the platform capability, not this tool, so a future tool that hides/disables/relabels a registry object reuses this cert instead of minting its own.',
                        'max_level': 4,
                        'gates': ['mode=entity_hide/entity_unhide/entity_disable/entity_enable/entity_rename/entity_set_icon/entity_set_aliases/device_disable/device_enable/integration_disable/integration_enable/label_assign_area/label_unassign_area/label_assign_device/label_unassign_device/category_create/category_delete/category_assign/category_unassign/automation_snooze/automation_turn_on_for/input_number_create/input_number_delete/timer_create/timer_delete/input_boolean_create/input_boolean_delete/counter_create/counter_delete/input_text_create/input_text_delete/input_button_create/input_button_delete/input_datetime_create/input_datetime_delete/input_select_create/input_select_delete (level 1)'],
                        'live_ack_required_for': [],
                        'grant_via': 'persona_editor mode=cert_req_grant cert_component=registry_lifecycle_control (or zen_dojotools_identity mode=cert_list to see current status)'
                      },
                      {
                        'cert': 'registry_purge',
                        'display_name': 'Registry Purge',
                        'description': 'Irreversible mass deletion of orphaned/dead registry entries -- named for the capability so a future bulk-cleanup tool for any other registry class reuses this instead of a tool-specific "destructive" cert.',
                        'max_level': 4,
                        'gates': ['mode=orphan_cleanup (level 2)'],
                        'live_ack_required_for': [],
                        'grant_via': 'persona_editor mode=cert_req_grant cert_component=registry_purge (or zen_dojotools_identity mode=cert_list to see current status)'
                      }
                    ]
                  }) -}}
        - conditions: "{{ _final is not defined and _tm_check == 'help' }}"
          sequence:
          - variables:
              _final:
                status: ok
                tool: zen_dojotools_ectoplasm
                help:
                  summary: >-
                    Spook/HA extended surface wrapper — repairs, areas, floors,
                    entity/device lifecycle, label assignment to areas/devices,
                    integration config entries, input number helpers, and
                    orphan entity cleanup. Requires the Spook integration.
                  gating: >-
                    Destructive/functional writes are confirm-gated: omit
                    confirm_action or pass false to preview only
                    (status: start preview, nothing executed), pass
                    confirm_action=true to actually run. Read actions
                    (repair_list, ghost_list) execute immediately, no
                    confirm needed. Every write also fires a zen_event.
                  cert_gates:
                    room_topology_edit: "level 1: area_create/area_assign_device/area_unassign_device/area_assign_entity/area_unassign_entity/floor_create/floor_assign_area/floor_unassign_area. level 2 (irreversible): area_delete/floor_delete. Shared with zen_dojotools_room_manager — one grant covers both tools."
                    registry_lifecycle_control: "level 1: entity_hide/entity_unhide/entity_disable/entity_enable/entity_rename/entity_set_icon/entity_set_aliases/device_disable/device_enable/integration_disable/integration_enable/label_assign_area/label_unassign_area/label_assign_device/label_unassign_device/category_create/category_delete/category_assign/category_unassign/automation_snooze/automation_turn_on_for/input_number_create/input_number_delete/timer_create/timer_delete/input_boolean_create/input_boolean_delete/counter_create/counter_delete/input_text_create/input_text_delete/input_button_create/input_button_delete/input_datetime_create/input_datetime_delete/input_select_create/input_select_delete."
                    registry_purge: "level 2 (irreversible mass deletion): orphan_cleanup."
                  ungated: "repair_list, ghost_list, repair_create, repair_remove, repair_ignore_all, repair_unignore_all — HA's own diagnostic Repairs dashboard, not real house state, always open."
                  actions:
                    repair_list: "List active HA repair issues. Read, no confirm."
                    ghost_list: "List Spook-flagged ghost entities (repair issues for entities that no longer exist). Read, no confirm. #10463: this is a DIFFERENT, narrower population than orphan_cleanup's target -- a low/zero ghost_count here does NOT mean orphan_cleanup has nothing to delete."
                    repair_create: "Create a repair issue. Requires issue_id, title, issue_description."
                    repair_remove: "Remove a repair issue. Requires issue_id."
                    repair_ignore_all: "Ignore all current repair issues."
                    repair_unignore_all: "Un-ignore all repair issues."
                    area_create: "Create an HA area."
                    area_delete: "Delete an HA area. Level 2 — irreversible."
                    area_assign_device: "Assign a device to an area."
                    area_unassign_device: "Remove a device from its area."
                    area_assign_entity: "Assign an entity to an area (override)."
                    area_unassign_entity: "Clear an entity's area override."
                    floor_create: "Create an HA floor."
                    floor_delete: "Delete an HA floor. Level 2 — irreversible."
                    floor_assign_area: "Assign an area to a floor."
                    floor_unassign_area: "Remove an area from its floor."
                    entity_hide: "Hide an entity from the UI."
                    entity_unhide: "Un-hide an entity."
                    entity_disable: "Disable an entity (stops polling/updates)."
                    entity_enable: "Re-enable a disabled entity."
                    entity_rename: "Rename an entity's friendly name."
                    entity_set_icon: "Set an entity's icon (Spook v5.7.0+). new_icon=null restores the integration's own icon."
                    entity_set_aliases: "Replace an entity's voice-assistant aliases (Spook v5.7.0+). Not additive -- entity_aliases fully replaces the existing list."
                    device_disable: "Disable a device (all its entities)."
                    device_enable: "Re-enable a disabled device."
                    label_assign_area: "Apply a label to an area."
                    label_unassign_area: "Remove a label from an area."
                    label_assign_device: "Apply a label to a device."
                    label_unassign_device: "Remove a label from a device."
                    category_create: "Create a category (Spook v5.7.0+). category_scope one of automation/helpers/scene/script."
                    category_delete: "Delete a category. Members are left uncategorized, not deleted."
                    category_assign: "Put an entity in a category (replaces any existing category for it)."
                    category_unassign: "Take an entity out of its category."
                    integration_disable: "Disable a config entry/integration."
                    integration_enable: "Re-enable a disabled integration."
                    input_number_create: "Create an input_number helper (Spook v5.0.0+)."
                    input_number_delete: "Delete an input_number helper."
                    timer_create: "Create a timer helper (Spook v5.7.0+)."
                    timer_delete: "Delete a timer helper."
                    input_boolean_create: "Create an input_boolean (toggle) helper (Spook v5.7.0+)."
                    input_boolean_delete: "Delete an input_boolean helper."
                    counter_create: "Create a counter helper (Spook v5.7.0+)."
                    counter_delete: "Delete a counter helper."
                    input_text_create: "Create an input_text helper (Spook v5.7.0+)."
                    input_text_delete: "Delete an input_text helper."
                    input_button_create: "Create an input_button helper (Spook v5.7.0+)."
                    input_button_delete: "Delete an input_button helper."
                    input_datetime_create: "Create an input_datetime helper, date and/or time (Spook v5.7.0+)."
                    input_datetime_delete: "Delete an input_datetime helper."
                    input_select_create: "Create an input_select (dropdown) helper (Spook v5.7.0+)."
                    input_select_delete: "Delete an input_select helper."
                    orphan_cleanup: "Bulk-delete via HA core's own homeassistant.delete_all_orphaned_entities service (entities with no config-entry owner). Level 2 — irreversible mass deletion, registry_purge cert. #10463: HA core does not expose this population for preview/counting, so this tool cannot show what it will delete before confirm_action=true. NOT the same population as ghost_list -- do not use a low ghost_count as reassurance before running this."
                    automation_snooze: "Turn an automation off for `duration`, auto-resumes after (survives restart). Spook v5.1.0+ — self-gated, clean spook_version_required error on older Spook."
                    automation_turn_on_for: "Turn an automation on for `duration`, then auto-off. Same Spook version gate as automation_snooze."
                    tool_manifest: "Self-description — capabilities, cert requirements, dependencies."
                  footguns: >-
                    area_delete/floor_delete/orphan_cleanup are irreversible
                    (level 2 cert). label_create/delete and
                    label_assign_entity/unassign_entity live on
                    zen_dojotools_labels, not here — Ectoplasm only does
                    area/device label assignment. As of Spook v5.7.0, all
                    seven helper domains (input_number, timer, input_boolean,
                    counter, input_text, input_button, input_datetime,
                    input_select) have real create/delete services and are
                    covered here — a helper made or deleted this way is NOT
                    the same as one provisioned via plain YAML package files;
                    a YAML-defined helper of the same domain cannot be
                    deleted by Spook (confirmed per-domain in Spook's own
                    service descriptions). Pick one provisioning method per
                    helper and don't mix them for the same entity.
                    entity_set_aliases replaces the full alias list, it is
                    not additive -- use Spook's own
                    homeassistant.add_alias_to_entity/remove_alias_from_entity
                    services directly (not wrapped here) for incremental
                    alias changes.
                caller_token: "{{ caller_token | default('') }}"
          - variables:
              _ec_help_message: >-
                {%- set ns = namespace(out='Spook/HA extended surface wrapper -- repairs, areas, floors, entity/device lifecycle, label assignment, integration config, input_number helpers, orphan cleanup. ') -%}
                {%- for k, v in _final.help.actions.items() if v is string -%}
                  {%- set ns.out = ns.out ~ 'mode=' ~ k ~ ' -- ' ~ v ~ ' ' -%}
                {%- endfor -%}
                {{ ns.out | trim }}
          - variables:
              _final: "{{ _final | combine({'status': 'help', 'message': _ec_help_message}) }}"
      # ── Normalize ──────────────────────────────────────────────────────────
      - variables:
          caller_token: "{{- caller_token | default('') -}}"
      - if: "{{ _final is not defined }}"
        then:
          - variables:
              _action: "{{ (mode | default('', true) | trim or action_type | default('', true) | trim) | lower | trim }}"
              _confirm: "{{ confirm_action | default(false) | bool }}"
              _raw_issue_id: "{{ issue_id | default('') | trim }}"
              _title: "{{ title | default('') | trim }}"
              _desc: "{{ issue_description | default('') | trim }}"
              _raw_severity: "{{ severity | default('warning') | lower | trim }}"
              _domain: "{{ domain | default('') | trim }}"
              _cfg_entry: "{{ config_entry_id | default('') | trim }}"
              _area_id: "{{ target_area | default('') | trim }}"
              _area_name: "{{ area_name | default('') | trim }}"
              _floor_id: "{{ floor_id | default('') | trim }}"
              _floor_name: "{{ floor_name | default('') | trim }}"
              _floor_level: "{{ floor_level | default(none) }}"
              _entity_id: "{{ entity_id | default('') | trim }}"
              _duration: "{{ duration | default('') | trim }}"
              _device_id: "{{ device_id | default('') | trim }}"
              _label_id: "{{ label_id | default('') | trim }}"
              _new_name: "{{ new_name | default('') | trim }}"
              _number_name: "{{ number_name | default('') | trim }}"
              _number_entity_id: "{{ number_entity_id | default('') | trim }}"
              _number_min: "{{ number_min | default(none) }}"
              _number_max: "{{ number_max | default(none) }}"
              _number_initial: "{{ number_initial | default(none) }}"
              _number_step: "{{ number_step | default(none) }}"
              _number_display_mode: "{{ number_display_mode | default('') | lower | trim }}"
              _number_unit: "{{ number_unit | default('') | trim }}"
              _number_icon: "{{ number_icon | default('') | trim }}"
              _new_icon: "{{ new_icon | default('') }}"
              _entity_aliases: "{{ entity_aliases | default([]) }}"
              _category_scope: "{{ category_scope | default('') | lower | trim }}"
              _category_name: "{{ category_name | default('') | trim }}"
              _category_icon: "{{ category_icon | default('') | trim }}"
              _category_id: "{{ category_id | default('') | trim }}"
              _timer_name: "{{ timer_name | default('') | trim }}"
              _timer_entity_id: "{{ timer_entity_id | default('') | trim }}"
              _timer_duration: "{{ timer_duration | default('') | trim }}"
              _timer_restore: "{{ timer_restore | default(none) }}"
              _timer_icon: "{{ timer_icon | default('') | trim }}"
              _boolean_name: "{{ boolean_name | default('') | trim }}"
              _boolean_entity_id: "{{ boolean_entity_id | default('') | trim }}"
              _boolean_initial: "{{ boolean_initial | default(none) }}"
              _boolean_icon: "{{ boolean_icon | default('') | trim }}"
              _counter_name: "{{ counter_name | default('') | trim }}"
              _counter_entity_id: "{{ counter_entity_id | default('') | trim }}"
              _counter_initial: "{{ counter_initial | default(none) }}"
              _counter_min: "{{ counter_min | default(none) }}"
              _counter_max: "{{ counter_max | default(none) }}"
              _counter_step: "{{ counter_step | default(none) }}"
              _counter_restore: "{{ counter_restore | default(none) }}"
              _counter_icon: "{{ counter_icon | default('') | trim }}"
              _text_name: "{{ text_name | default('') | trim }}"
              _text_entity_id: "{{ text_entity_id | default('') | trim }}"
              _text_initial: "{{ text_initial | default('') }}"
              _text_min: "{{ text_min | default(none) }}"
              _text_max: "{{ text_max | default(none) }}"
              _text_pattern: "{{ text_pattern | default('') | trim }}"
              _text_mode: "{{ text_mode | default('') | lower | trim }}"
              _text_unit: "{{ text_unit | default('') | trim }}"
              _text_icon: "{{ text_icon | default('') | trim }}"
              _button_name: "{{ button_name | default('') | trim }}"
              _button_entity_id: "{{ button_entity_id | default('') | trim }}"
              _button_icon: "{{ button_icon | default('') | trim }}"
              _datetime_name: "{{ datetime_name | default('') | trim }}"
              _datetime_entity_id: "{{ datetime_entity_id | default('') | trim }}"
              _datetime_has_date: "{{ datetime_has_date | default(none) }}"
              _datetime_has_time: "{{ datetime_has_time | default(none) }}"
              _datetime_initial: "{{ datetime_initial | default('') | trim }}"
              _datetime_icon: "{{ datetime_icon | default('') | trim }}"
              _select_name: "{{ select_name | default('') | trim }}"
              _select_entity_id: "{{ select_entity_id | default('') | trim }}"
              _select_options: "{{ select_options | default([]) }}"
              _select_initial: "{{ select_initial | default('') | trim }}"
              _select_icon: "{{ select_icon | default('') | trim }}"
          - variables:
              # Auto-prefix issue_id with zenos_ unless already prefixed
              _issue_id: >-
                {%- set _s = _raw_issue_id | slugify(separator='_') | default('', true) -%}
                {{ _s if _s.startswith('zenos_') else ('zenos_' ~ _s) if _s != '' else '' }}
              # Spook requires 'information' not 'info'
              _severity: >-
                {%- if _raw_severity == 'info' -%}information
                {%- elif _raw_severity in ['error', 'warning', 'information'] -%}{{ _raw_severity }}
                {%- else -%}warning{%- endif -%}
              _issue_domain: "{{ _domain if _domain != '' else 'zenos' }}"
              _list_domain: "{{ _domain }}"

          # ── Validation: unknown action ─────────────────────────────────────────
          - if: >-
              {{ _action not in [
                'repair_list', 'ghost_list',
                'repair_create', 'repair_remove', 'repair_ignore_all', 'repair_unignore_all',
                'area_create', 'area_delete',
                'area_assign_device', 'area_unassign_device',
                'area_assign_entity', 'area_unassign_entity',
                'floor_create', 'floor_delete',
                'floor_assign_area', 'floor_unassign_area',
                'entity_hide', 'entity_unhide', 'entity_disable', 'entity_enable', 'entity_rename',
                'entity_set_icon', 'entity_set_aliases',
                'device_disable', 'device_enable',
                'label_assign_area', 'label_unassign_area',
                'label_assign_device', 'label_unassign_device',
                'category_create', 'category_delete', 'category_assign', 'category_unassign',
                'integration_disable', 'integration_enable',
                'input_number_create', 'input_number_delete',
                'timer_create', 'timer_delete',
                'input_boolean_create', 'input_boolean_delete',
                'counter_create', 'counter_delete',
                'input_text_create', 'input_text_delete',
                'input_button_create', 'input_button_delete',
                'input_datetime_create', 'input_datetime_delete',
                'input_select_create', 'input_select_delete',
                'orphan_cleanup',
                'automation_snooze', 'automation_turn_on_for'
              ] }}
            then:
              - variables:
                  _final:
                    status: error
                    action_type: "{{ _action }}"
                    message: >-
                      Unknown action_type '{{ _action }}'. See script description
                      for valid values.
                    caller_token: "{{ caller_token }}"

          # ═══════════════════════════════════════════════════════════════════════
          # Cert-gate chokepoint: gate the ACT by platform capability, not by
          # tool/mode. Named for the capability so a future tool touching the
          # same registry surface reuses these instead of minting its own:
          #   room_topology_edit        — area/floor structural edits (SAME cert
          #                               room_manager already uses for its own
          #                               topology writes -- one grant covers
          #                               both tools since it's the same HA
          #                               area/floor registry either way)
          #   registry_lifecycle_control — reversible entity/device/integration/
          #                               label/automation lifecycle toggles
          #   registry_purge            — irreversible mass deletion of orphaned
          #                               registry entries
          # Repairs group (HA's own diagnostic Repairs dashboard, not real house
          # behavior) and both list/read actions stay ungated -- _ecto_required_cert
          # is blank for those, so the check below is skipped entirely.
          # ═══════════════════════════════════════════════════════════════════════
          - variables:
              _ecto_required_cert: >-
                {%- if _action in ['area_create', 'area_assign_device', 'area_unassign_device', 'area_assign_entity', 'area_unassign_entity', 'floor_create', 'floor_assign_area', 'floor_unassign_area', 'area_delete', 'floor_delete'] -%}
                  room_topology_edit
                {%- elif _action in ['entity_hide', 'entity_unhide', 'entity_disable', 'entity_enable', 'entity_rename', 'entity_set_icon', 'entity_set_aliases', 'device_disable', 'device_enable', 'integration_disable', 'integration_enable', 'label_assign_area', 'label_unassign_area', 'label_assign_device', 'label_unassign_device', 'category_create', 'category_delete', 'category_assign', 'category_unassign', 'automation_snooze', 'automation_turn_on_for', 'input_number_create', 'input_number_delete', 'timer_create', 'timer_delete', 'input_boolean_create', 'input_boolean_delete', 'counter_create', 'counter_delete', 'input_text_create', 'input_text_delete', 'input_button_create', 'input_button_delete', 'input_datetime_create', 'input_datetime_delete', 'input_select_create', 'input_select_delete'] -%}
                  registry_lifecycle_control
                {%- elif _action == 'orphan_cleanup' -%}
                  registry_purge
                {%- else -%}
                {%- endif -%}
              _ecto_required_level: "{{ 2 if _action in ['area_delete', 'floor_delete', 'orphan_cleanup'] else 1 }}"
          - if:
              - condition: template
                value_template: "{{ _ecto_required_cert | trim != '' }}"
            then:
              - action: script.zen_dojotools_identity
                data:
                  mode: resolve_caller_identity
                  required_cert: "{{ _ecto_required_cert | trim }}"
                  required_cert_level: "{{ _ecto_required_level | int }}"
                  caller_token: "{{ caller_token }}"
                response_variable: _ecto_id_raw
              - variables:
                  _ecto_id_fields: >-
                    {%- import 'zenos_ai/zen_os_1.jinja' as OS -%}
                    {%- set _raw = OS.resolve_identity_fields(_ecto_id_raw) -%}
                    {{- (_raw | from_json) if _raw is string else _raw -}}
                  _ecto_cert_policy: "{{ _ecto_id_fields.policy_status }}"
                  _ecto_cert_authorized: "{{ _ecto_id_fields.authorized }}"
                  _ecto_cert_level: "{{ _ecto_id_fields.cert_level }}"
                  _ecto_cert_block_reason: "{{ _ecto_id_fields.block_reason }}"
            else:
              - variables:
                  _ecto_cert_policy: allowed
                  _ecto_cert_authorized: true
                  _ecto_cert_level: 0
                  _ecto_cert_block_reason: ''
          - variables:
              _ecto_cert_denied: "{{ (_ecto_required_cert | trim != '') and (_ecto_cert_policy != 'allowed' or not _ecto_cert_authorized) }}"
              _ecto_cert_error_detail: >-
                {%- if _ecto_cert_policy != 'allowed' -%}
                  {{ _ecto_cert_block_reason | trim if (_ecto_cert_block_reason | trim) != '' else 'resolve_caller_identity did not return an allowed identity -- action denied.' }}
                {%- else -%}
                  {{ _ecto_required_cert | trim }} cert level {{ _ecto_cert_level }} is below the required minimum ({{ _ecto_required_level }}) for {{ _action }}.
                {%- endif -%}

          # ── Dispatch ───────────────────────────────────────────────────────────
          - choose:

              # ── REPAIR_LIST (Spook v5.7.0+ repairs.list service) ─────────────────
              # Replaced the old integration_entities('repairs') + state_attr() scan
              # with the real repairs.list service -- adds created/is_fixable/
              # learn_more_url/breaks_in_ha_version fields the scan never had.
              # include_ignored is forced true to preserve old behavior (the old
              # scan always included ignored issues); there is no per-issue
              # repairs.* entity_id in this service's response (issue-registry
              # based, not entity based), so that field is gone -- issue_id+domain
              # together are still the stable identifier, as they were before.
              - conditions: "{{ _action == 'repair_list' }}"
                sequence:
                  - action: script.zen_sutra_ha_api
                    continue_on_error: true
                    data:
                      mode: services
                      has_service: repairs.list
                    response_variable: _svc_check
                  - variables:
                      _svc_found: "{{ _svc_check is mapping and _svc_check.get('found', false) == true }}"
                  - choose:
                      - conditions: "{{ not _svc_found }}"
                        sequence:
                          - variables:
                              _final:
                                status: error
                                error: spook_version_required
                                action_type: repair_list
                                message: "repairs.list service not found -- requires Spook v5.7.0 or later."
                                caller_token: "{{ caller_token }}"
                    default:
                      - action: repairs.list
                        data:
                          include_ignored: true
                          domain: "{{ [_list_domain] if _list_domain != '' else omit }}"
                        response_variable: _rl_resp
                      - variables:
                          _issues: "{{ (_rl_resp.issues | default([])) if _rl_resp is mapping else [] }}"
                      - variables:
                          _final:
                            status: success
                            action_type: repair_list
                            count: "{{ _issues | length }}"
                            domain_filter: "{{ _list_domain if _list_domain != '' else 'all' }}"
                            issues: "{{ _issues }}"
                            caller_token: "{{ caller_token }}"

              # ── GHOST_LIST (Spook v5.7.0+ repairs.list service) ──────────────────
              # Same repairs.list service, filtered to domain=spook. The affected
              # entity is still recovered by splitting the title on single quotes
              # ("Entity 'sensor.foo' does not exist") -- repairs.list's response
              # has no structured affected-entity field (confirmed against
              # Spook's own source at v5.7.0), so this is still necessary, not a
              # leftover from the old scan.
              - conditions: "{{ _action == 'ghost_list' }}"
                sequence:
                  - action: script.zen_sutra_ha_api
                    continue_on_error: true
                    data:
                      mode: services
                      has_service: repairs.list
                    response_variable: _svc_check
                  - variables:
                      _svc_found: "{{ _svc_check is mapping and _svc_check.get('found', false) == true }}"
                  - choose:
                      - conditions: "{{ not _svc_found }}"
                        sequence:
                          - variables:
                              _final:
                                status: error
                                error: spook_version_required
                                action_type: ghost_list
                                message: "repairs.list service not found -- requires Spook v5.7.0 or later."
                                caller_token: "{{ caller_token }}"
                    default:
                      - action: repairs.list
                        data:
                          include_ignored: true
                          domain: ['spook']
                        response_variable: _gl_resp
                      - variables:
                          # Explicit tojson/from_json round trip, not implicit
                          # stringification -- Spook's repairs.list response carries
                          # issue.severity as a raw Python enum, which str()'s as
                          # "<IssueSeverity.WARNING: 'warning'>" (NOT valid JSON), so
                          # relying on HA's implicit stringify-then-reparse silently
                          # failed and fell back to the raw string so the count was of characters, not items. severity is cast to a plain string in the combine
                          # below, and | tojson guarantees the intermediate text is
                          # actually valid JSON so from_json can't silently no-op.
                          _ghosts_json: >-
                            {%- set ns = namespace(issues=[]) -%}
                            {%- for issue in ((_gl_resp.issues | default([])) if _gl_resp is mapping else []) -%}
                              {%- set _ttl = issue.title | default('', true) -%}
                              {%- set _parts = _ttl.split("'") -%}
                              {%- set _aff = _parts[1] if _parts | length >= 2 else '' -%}
                              {%- set ns.issues = ns.issues + [issue | combine({
                                'severity': issue.severity | string,
                                'affected_entity': _aff if '.' in _aff else ''
                              })] -%}
                            {%- endfor -%}
                            {{ ns.issues | tojson }}
                      - variables:
                          _ghosts: "{{ _ghosts_json | from_json }}"
                      - variables:
                          _final:
                            status: success
                            action_type: ghost_list
                            ghost_count: "{{ _ghosts | length }}"
                            ghosts: "{{ _ghosts }}"
                            scope: >-
                              Spook-flagged repair issues only. #10463: orphan_cleanup deletes a
                              different, HA-core-defined population (entities with no config-entry
                              owner) that this count does NOT cover -- a low or zero ghost_count
                              here is not reassurance about what orphan_cleanup would delete.
                            caller_token: "{{ caller_token }}"

              # ── REPAIR_CREATE ──────────────────────────────────────────────────
              - conditions: "{{ _action == 'repair_create' }}"
                sequence:
                  - choose:
                      - conditions: "{{ _issue_id == '' or _title == '' or _desc == '' }}"
                        sequence:
                          - variables:
                              _final:
                                status: error
                                action_type: repair_create
                                message: "repair_create requires issue_id, title, and issue_description."
                                caller_token: "{{ caller_token }}"
                    default:
                      - choose:
                          - conditions: "{{ not _confirm }}"
                            sequence:
                              - variables:
                                  _final:
                                    status: start
                                    action_type: repair_create
                                    preview:
                                      issue_id: "{{ _issue_id }}"
                                      domain: "{{ _issue_domain }}"
                                      title: "{{ _title }}"
                                      severity: "{{ _severity }}"
                                    message: >-
                                      Would create repair issue '{{ _issue_id }}' (domain: {{ _issue_domain }},
                                      severity: {{ _severity }}). Set confirm_action: true to execute.
                                    caller_token: "{{ caller_token }}"
                        default:
                          - action: repairs.create
                            data:
                              domain: "{{ _issue_domain }}"
                              issue_id: "{{ _issue_id }}"
                              title: "{{ _title }}"
                              description: "{{ _desc }}"
                              severity: "{{ _severity }}"
                          - event: zen_event
                            event_data:
                              event:
                                kind: ectoplasm_repair_create
                                issue_id: "{{ _issue_id }}"
                                domain: "{{ _issue_domain }}"
                                severity: info
                                summary: "Repair issue created: {{ _title }}"
                          - variables:
                              _final:
                                status: success
                                action_type: repair_create
                                issue_id: "{{ _issue_id }}"
                                domain: "{{ _issue_domain }}"
                                title: "{{ _title }}"
                                severity: "{{ _severity }}"
                                message: "Repair issue '{{ _issue_id }}' created."
                                caller_token: "{{ caller_token }}"

              # ── REPAIR_REMOVE ──────────────────────────────────────────────────
              - conditions: "{{ _action == 'repair_remove' }}"
                sequence:
                  - choose:
                      - conditions: "{{ _issue_id == '' }}"
                        sequence:
                          - variables:
                              _final:
                                status: error
                                action_type: repair_remove
                                message: "repair_remove requires issue_id."
                                caller_token: "{{ caller_token }}"
                    default:
                      - choose:
                          - conditions: "{{ not _confirm }}"
                            sequence:
                              - variables:
                                  _final:
                                    status: start
                                    action_type: repair_remove
                                    preview:
                                      issue_id: "{{ _issue_id }}"
                                      domain: "{{ _issue_domain }}"
                                    message: >-
                                      Would remove repair issue '{{ _issue_id }}' (domain: {{ _issue_domain }}).
                                      Set confirm_action: true to execute.
                                    caller_token: "{{ caller_token }}"
                        default:
                          - action: repairs.remove
                            data:
                              issue_id: "{{ _issue_id }}"
                          - event: zen_event
                            event_data:
                              event:
                                kind: ectoplasm_repair_remove
                                issue_id: "{{ _issue_id }}"
                                domain: "{{ _issue_domain }}"
                                severity: info
                                summary: "Repair issue removed: {{ _issue_id }}"
                          - variables:
                              _final:
                                status: success
                                action_type: repair_remove
                                issue_id: "{{ _issue_id }}"
                                domain: "{{ _issue_domain }}"
                                message: "Repair issue '{{ _issue_id }}' removed."
                                caller_token: "{{ caller_token }}"

              # ── REPAIR_IGNORE_ALL ──────────────────────────────────────────────
              - conditions: "{{ _action == 'repair_ignore_all' }}"
                sequence:
                  - choose:
                      - conditions: "{{ not _confirm }}"
                        sequence:
                          - variables:
                              _final:
                                status: start
                                action_type: repair_ignore_all
                                message: >-
                                  Would ignore all current repair issues in the HA Repairs panel.
                                  Set confirm_action: true to execute.
                                caller_token: "{{ caller_token }}"
                    default:
                      - action: repairs.ignore_all
                      - event: zen_event
                        event_data:
                          event:
                            kind: ectoplasm_repair_ignore_all
                            severity: warning
                            summary: All repair issues ignored.
                      - variables:
                          _final:
                            status: success
                            action_type: repair_ignore_all
                            message: All repair issues ignored.
                            caller_token: "{{ caller_token }}"

              # ── REPAIR_UNIGNORE_ALL ────────────────────────────────────────────
              - conditions: "{{ _action == 'repair_unignore_all' }}"
                sequence:
                  - choose:
                      - conditions: "{{ not _confirm }}"
                        sequence:
                          - variables:
                              _final:
                                status: start
                                action_type: repair_unignore_all
                                message: >-
                                  Would unignore all repair issues.
