          # ── AREA_CREATE ────────────────────────────────────────────────────
          - conditions: "{{ _action == 'area_create' }}"
            sequence:
              - choose:
                  - conditions: "{{ _ecto_cert_denied }}"
                    sequence:
                      - variables:
                          _ecto_cd_raw: >-
