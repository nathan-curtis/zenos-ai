                                caller_token: "{{ caller_token }}"
                    default:
                      - action: repairs.unignore_all
                      - event: zen_event
                        event_data:
                          event:
                            kind: ectoplasm_repair_unignore_all
                            severity: info
                            summary: All repair issues unignored.
                      - variables:
                          _final:
                            status: success
                            action_type: repair_unignore_all
                            message: All repair issues unignored.
                            caller_token: "{{ caller_token }}"

              # ── AREA_CREATE ────────────────────────────────────────────────────
              - conditions: "{{ _action == 'area_create' }}"
                sequence:
                  - choose:
                      - conditions: "{{ _ecto_cert_denied }}"
                        sequence:
                          - variables:
                              _ecto_cd_raw: >-
                                {%- import 'zenos_ai/zen_os_1.jinja' as OS -%}
                                {{ OS.cert_denial(_ecto_cert_policy, _ecto_cert_authorized, _ecto_cert_level, _ecto_required_cert | trim, _ecto_required_level | int, _action, _ecto_cert_block_reason) -}}
                          - variables:
                              _final: "{{ ((_ecto_cd_raw | from_json) if _ecto_cd_raw is string else _ecto_cd_raw) | combine({'action_type': _action, 'caller_token': caller_token}) }}"
                      - conditions: "{{ _area_name == '' }}"
                        sequence:
                          - variables:
                              _final:
                                status: error
                                action_type: area_create
                                message: "area_create requires area_name."
                                caller_token: "{{ caller_token }}"
                    default:
                      - action: homeassistant.create_area
                        data:
                          name: "{{ _area_name }}"
                      - event: zen_event
                        event_data:
                          event:
                            kind: ectoplasm_area_create
                            area_name: "{{ _area_name }}"
                            floor_id: "{{ _floor_id }}"
                            severity: info
                            summary: "Area created: {{ _area_name }}"
                      - variables:
                          _final:
                            status: success
                            action_type: area_create
                            area_name: "{{ _area_name }}"
                            message: "Area '{{ _area_name }}' created."
                            floor_assign_advisory: >-
                              {{ 'Floor not set — Spook create_area does not support floor_id. Run action_type=floor_assign_area area_id=' ~ (_area_name | lower | replace(' ','_')) ~ ' floor_id=' ~ _floor_id ~ ' to assign.'
                                 if _floor_id != '' else none }}
                            caller_token: "{{ caller_token }}"

              # ── AREA_DELETE ────────────────────────────────────────────────────
              - conditions: "{{ _action == 'area_delete' }}"
                sequence:
                  - choose:
                      - conditions: "{{ _ecto_cert_denied }}"
                        sequence:
                          - variables:
                              _ecto_cd_raw: >-
                                {%- import 'zenos_ai/zen_os_1.jinja' as OS -%}
                                {{ OS.cert_denial(_ecto_cert_policy, _ecto_cert_authorized, _ecto_cert_level, _ecto_required_cert | trim, _ecto_required_level | int, _action, _ecto_cert_block_reason) -}}
                          - variables:
                              _final: "{{ ((_ecto_cd_raw | from_json) if _ecto_cd_raw is string else _ecto_cd_raw) | combine({'action_type': _action, 'caller_token': caller_token}) }}"
