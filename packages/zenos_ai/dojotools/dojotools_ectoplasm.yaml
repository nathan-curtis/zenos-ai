                            summary: "Integration config entry disabled: {{ _cfg_entry }}"
                      - variables:
                          _final:
                            status: success
                            action_type: integration_disable
                            config_entry_id: "{{ _cfg_entry }}"
                            message: "Integration '{{ _cfg_entry }}' disabled."
                            caller_token: "{{ caller_token }}"

          # ── INTEGRATION_ENABLE ─────────────────────────────────────────────
          - conditions: "{{ _action == 'integration_enable' }}"
            sequence:
              - choose:
                  - conditions: "{{ _ecto_cert_denied }}"
                    sequence:
                      - variables:
                          _ecto_cd_raw: >-
                            {%- import 'zenos_ai/zen_os_1.jinja' as OS -%}
                            {{ OS.cert_denial(_ecto_cert_policy, _ecto_cert_authorized, _ecto_cert_level, _ecto_required_cert | trim, _ecto_required_level | int, _action, _ecto_cert_block_reason) -}}
                      - variables:
                          _final: "{{ ((_ecto_cd_raw | from_json) if _ecto_cd_raw is string else _ecto_cd_raw) | combine({'action_type': _action, 'caller_token': caller_token}) }}"
                  - conditions: "{{ _cfg_entry == '' }}"
                    sequence:
                      - variables:
                          _final:
                            status: error
                            action_type: integration_enable
                            message: "integration_enable requires config_entry_id."
                            caller_token: "{{ caller_token }}"
                default:
                  - choose:
                      - conditions: "{{ not _confirm }}"
                        sequence:
                          - variables:
                              _final:
                                status: start
                                action_type: integration_enable
                                preview:
                                  config_entry_id: "{{ _cfg_entry }}"
                                message: >-
                                  Would enable integration config entry '{{ _cfg_entry }}'.
                                  Set confirm_action: true to execute.
                                caller_token: "{{ caller_token }}"
                    default:
                      - action: homeassistant.enable_config_entry
                        data:
                          config_entry_id: "{{ _cfg_entry }}"
                      - event: zen_event
                        event_data:
                          event:
                            kind: ectoplasm_integration_enable
                            config_entry_id: "{{ _cfg_entry }}"
                            severity: info
                            summary: "Integration config entry enabled: {{ _cfg_entry }}"
                      - variables:
                          _final:
                            status: success
                            action_type: integration_enable
                            config_entry_id: "{{ _cfg_entry }}"
                            message: "Integration '{{ _cfg_entry }}' enabled."
                            caller_token: "{{ caller_token }}"

          # ── INPUT_NUMBER_CREATE ────────────────────────────────────────────
          - conditions: "{{ _action == 'input_number_create' }}"
            sequence:
              - choose:
                  - conditions: "{{ _ecto_cert_denied }}"
                    sequence:
                      - variables:
                          _ecto_cd_raw: >-
                            {%- import 'zenos_ai/zen_os_1.jinja' as OS -%}
                            {{ OS.cert_denial(_ecto_cert_policy, _ecto_cert_authorized, _ecto_cert_level, _ecto_required_cert | trim, _ecto_required_level | int, _action, _ecto_cert_block_reason) -}}
                      - variables:
                          _final: "{{ ((_ecto_cd_raw | from_json) if _ecto_cd_raw is string else _ecto_cd_raw) | combine({'action_type': _action, 'caller_token': caller_token}) }}"
                  - conditions: "{{ _number_name == '' }}"
                    sequence:
                      - variables:
                          _final:
                            status: error
                            action_type: input_number_create
                            message: "input_number_create requires number_name."
                            caller_token: "{{ caller_token }}"
                default:
                  - choose:
                      - conditions: "{{ not _confirm }}"
                        sequence:
                          - variables:
                              _final:
                                status: start
                                action_type: input_number_create
                                number_name: "{{ _number_name }}"
                                number_entity_id: "{{ _number_entity_id if _number_entity_id != '' else none }}"
                                min: "{{ _number_min }}"
                                max: "{{ _number_max }}"
                                initial: "{{ _number_initial }}"
                                step: "{{ _number_step }}"
                                mode: "{{ _number_display_mode if _number_display_mode != '' else 'slider' }}"
                                unit_of_measurement: "{{ _number_unit if _number_unit != '' else none }}"
                                icon: "{{ _number_icon if _number_icon != '' else none }}"
                                message: >-
                                  Would create input_number '{{ _number_name }}'.
                                  Set confirm_action: true to execute.
                                caller_token: "{{ caller_token }}"
                    default:
                      - variables:
                          _inc_payload: >-
                            {%- set d = {
                              'name': _number_name,
                              'min': (_number_min if _number_min is not none else 0) | float,
                              'max': (_number_max if _number_max is not none else 100) | float,
                              'step': (_number_step if _number_step is not none else 1) | float,
                              'mode': (_number_display_mode if _number_display_mode != '' else 'slider')
                            } -%}
                            {%- if _number_entity_id != '' -%}
                              {%- set d = d | combine({'input_number_id': _number_entity_id}) -%}
                            {%- endif -%}
                            {%- if _number_initial is not none -%}
                              {%- set d = d | combine({'initial': _number_initial | float}) -%}
                            {%- endif -%}
                            {%- if _number_icon != '' -%}
                              {%- set d = d | combine({'icon': _number_icon}) -%}
                            {%- endif -%}
                            {%- if _number_unit != '' -%}
                              {%- set d = d | combine({'unit_of_measurement': _number_unit}) -%}
                            {%- endif -%}
                            {{ d }}
                      - action: input_number.create
                        data: "{{ _inc_payload }}"
                      - event: zen_event
                        event_data:
                          event:
                            kind: ectoplasm_input_number_create
                            number_name: "{{ _number_name }}"
                            severity: info
                            summary: "Input number created: {{ _number_name }}"
                      - variables:
                          _final:
                            status: success
                            action_type: input_number_create
                            number_name: "{{ _number_name }}"
                            message: "Input number '{{ _number_name }}' created."
                            caller_token: "{{ caller_token }}"

          # ── INPUT_NUMBER_DELETE ────────────────────────────────────────────
          - conditions: "{{ _action == 'input_number_delete' }}"
            sequence:
              - choose:
                  - conditions: "{{ _ecto_cert_denied }}"
                    sequence:
                      - variables:
                          _ecto_cd_raw: >-
                            {%- import 'zenos_ai/zen_os_1.jinja' as OS -%}
                            {{ OS.cert_denial(_ecto_cert_policy, _ecto_cert_authorized, _ecto_cert_level, _ecto_required_cert | trim, _ecto_required_level | int, _action, _ecto_cert_block_reason) -}}
                      - variables:
                          _final: "{{ ((_ecto_cd_raw | from_json) if _ecto_cd_raw is string else _ecto_cd_raw) | combine({'action_type': _action, 'caller_token': caller_token}) }}"
                  - conditions: "{{ _entity_id == '' }}"
                    sequence:
                      - variables:
                          _final:
                            status: error
                            action_type: input_number_delete
                            message: "input_number_delete requires entity_id (the input_number.* entity to delete)."
                            caller_token: "{{ caller_token }}"
                default:
                  - choose:
                      - conditions: "{{ not _confirm }}"
                        sequence:
                          - variables:
                              _final:
                                status: start
                                action_type: input_number_delete
                                entity_id: "{{ _entity_id }}"
                                message: >-
                                  Would delete input_number entity '{{ _entity_id }}'.
                                  This is irreversible. Set confirm_action: true to execute.
                                caller_token: "{{ caller_token }}"
                    default:
                      - action: input_number.delete
                        target:
                          entity_id: "{{ _entity_id }}"
                      - event: zen_event
                        event_data:
                          event:
                            kind: ectoplasm_input_number_delete
                            entity_id: "{{ _entity_id }}"
                            severity: warning
                            summary: "Input number deleted: {{ _entity_id }}"
                      - variables:
                          _final:
                            status: success
                            action_type: input_number_delete
                            entity_id: "{{ _entity_id }}"
                            message: "Input number '{{ _entity_id }}' deleted."
                            caller_token: "{{ caller_token }}"

          # ── AUTOMATION_SNOOZE (Spook v5.1.0+) ────────────────────────────────
          # HA templates have no reliable way to read an
          # installed custom integration's semantic version — but gating on
          # the actual SERVICE existing is strictly better anyway (works
          # across hotfixes/backports without a version-string maintenance
          # burden, and directly probes the capability we actually need
          # instead of trusting a number). Same has_service mechanism the
          # spook_installed health check already uses -- see
          # dojotools_systemtools.yaml zen_health_report for the sibling
          # pattern. Never lets a missing Spook 5.1 surface as a raw
          # "unknown action" error -- always a clean, actionable status.
          - conditions: "{{ _action == 'automation_snooze' }}"
            sequence:
              - choose:
                  - conditions: "{{ _ecto_cert_denied }}"
                    sequence:
                      - variables:
                          _ecto_cd_raw: >-
                            {%- import 'zenos_ai/zen_os_1.jinja' as OS -%}
                            {{ OS.cert_denial(_ecto_cert_policy, _ecto_cert_authorized, _ecto_cert_level, _ecto_required_cert | trim, _ecto_required_level | int, _action, _ecto_cert_block_reason) -}}
                      - variables:
                          _final: "{{ ((_ecto_cd_raw | from_json) if _ecto_cd_raw is string else _ecto_cd_raw) | combine({'action_type': _action, 'caller_token': caller_token}) }}"
                  - conditions: "{{ _entity_id == '' or _duration == '' }}"
                    sequence:
                      - variables:
                          _final:
                            status: error
                            action_type: automation_snooze
                            message: "automation_snooze requires entity_id and duration."
                            caller_token: "{{ caller_token }}"
                default:
                  - action: script.zen_sutra_ha_api
                    continue_on_error: true
                    data:
                      mode: services
                      has_service: automation.snooze
                    response_variable: _as_svc_check
                  - choose:
                      - conditions: "{{ not (_as_svc_check is mapping and _as_svc_check.get('found', false) == true) }}"
                        sequence:
                          - variables:
                              _final:
                                status: error
                                error: spook_version_required
                                action_type: automation_snooze
                                message: >-
                                  automation.snooze service not found -- requires
                                  Spook v5.1.0 or later. Nothing was changed.
                                caller_token: "{{ caller_token }}"
                    default:
                      - choose:
                          - conditions: "{{ not _confirm }}"
                            sequence:
                              - variables:
                                  _final:
                                    status: start
                                    action_type: automation_snooze
                                    preview:
                                      entity_id: "{{ _entity_id }}"
                                      duration: "{{ _duration }}"
                                    message: >-
                                      Would turn off '{{ _entity_id }}' for {{ _duration }},
                                      then turn it back on automatically (survives a
                                      restart). Set confirm_action: true to execute.
                                    caller_token: "{{ caller_token }}"
                        default:
                          - action: automation.snooze
                            target:
                              entity_id: "{{ _entity_id }}"
                            data:
                              duration: "{{ _duration }}"
                          - event: zen_event
                            event_data:
                              event:
                                kind: ectoplasm_automation_snooze
                                entity_id: "{{ _entity_id }}"
                                duration: "{{ _duration }}"
                                severity: info
                                summary: "Automation snoozed: {{ _entity_id }} for {{ _duration }}"
                          - variables:
                              _final:
                                status: success
                                action_type: automation_snooze
                                entity_id: "{{ _entity_id }}"
                                duration: "{{ _duration }}"
                                message: "'{{ _entity_id }}' snoozed for {{ _duration }}."
                                caller_token: "{{ caller_token }}"

          # ── AUTOMATION_TURN_ON_FOR (Spook v5.1.0+) ───────────────────────────
          - conditions: "{{ _action == 'automation_turn_on_for' }}"
            sequence:
              - choose:
                  - conditions: "{{ _ecto_cert_denied }}"
                    sequence:
                      - variables:
                          _ecto_cd_raw: >-
                            {%- import 'zenos_ai/zen_os_1.jinja' as OS -%}
                            {{ OS.cert_denial(_ecto_cert_policy, _ecto_cert_authorized, _ecto_cert_level, _ecto_required_cert | trim, _ecto_required_level | int, _action, _ecto_cert_block_reason) -}}
                      - variables:
                          _final: "{{ ((_ecto_cd_raw | from_json) if _ecto_cd_raw is string else _ecto_cd_raw) | combine({'action_type': _action, 'caller_token': caller_token}) }}"
                  - conditions: "{{ _entity_id == '' or _duration == '' }}"
                    sequence:
                      - variables:
                          _final:
                            status: error
                            action_type: automation_turn_on_for
                            message: "automation_turn_on_for requires entity_id and duration."
                            caller_token: "{{ caller_token }}"
                default:
                  - action: script.zen_sutra_ha_api
                    continue_on_error: true
                    data:
                      mode: services
                      has_service: automation.turn_on_for
                    response_variable: _atof_svc_check
                  - choose:
                      - conditions: "{{ not (_atof_svc_check is mapping and _atof_svc_check.get('found', false) == true) }}"
                        sequence:
                          - variables:
                              _final:
                                status: error
                                error: spook_version_required
                                action_type: automation_turn_on_for
                                message: >-
                                  automation.turn_on_for service not found -- requires
                                  Spook v5.1.0 or later. Nothing was changed.
                                caller_token: "{{ caller_token }}"
                    default:
                      - choose:
                          - conditions: "{{ not _confirm }}"
                            sequence:
                              - variables:
                                  _final:
                                    status: start
                                    action_type: automation_turn_on_for
                                    preview:
                                      entity_id: "{{ _entity_id }}"
                                      duration: "{{ _duration }}"
                                    message: >-
                                      Would turn on '{{ _entity_id }}' for {{ _duration }},
                                      then turn it back off automatically (survives a
                                      restart). Set confirm_action: true to execute.
                                    caller_token: "{{ caller_token }}"
                        default:
                          - action: automation.turn_on_for
                            target:
                              entity_id: "{{ _entity_id }}"
                            data:
                              duration: "{{ _duration }}"
                          - event: zen_event
                            event_data:
                              event:
                                kind: ectoplasm_automation_turn_on_for
                                entity_id: "{{ _entity_id }}"
                                duration: "{{ _duration }}"
                                severity: info
                                summary: "Automation turned on for {{ _duration }}: {{ _entity_id }}"
                          - variables:
                              _final:
                                status: success
                                action_type: automation_turn_on_for
                                entity_id: "{{ _entity_id }}"
                                duration: "{{ _duration }}"
                                message: "'{{ _entity_id }}' turned on for {{ _duration }}."
                                caller_token: "{{ caller_token }}"

          # ── ORPHAN_CLEANUP ─────────────────────────────────────────────────
          - conditions: "{{ _action == 'orphan_cleanup' }}"
            sequence:
              - choose:
                  - conditions: "{{ _ecto_cert_denied }}"
                    sequence:
                      - variables:
                          _ecto_cd_raw: >-
                            {%- import 'zenos_ai/zen_os_1.jinja' as OS -%}
                            {{ OS.cert_denial(_ecto_cert_policy, _ecto_cert_authorized, _ecto_cert_level, _ecto_required_cert | trim, _ecto_required_level | int, _action, _ecto_cert_block_reason) -}}
                      - variables:
                          _final: "{{ ((_ecto_cd_raw | from_json) if _ecto_cd_raw is string else _ecto_cd_raw) | combine({'action_type': _action, 'caller_token': caller_token}) }}"
                  - conditions: "{{ not _confirm }}"
                    sequence:
                      - variables:
                          _final:
                            status: start
                            action_type: orphan_cleanup
                            message: >-
                              Would delete all orphaned entities (entities with no integration
                              owner). This is irreversible.
                              Set confirm_action: true to execute.
                            caller_token: "{{ caller_token }}"
                default:
                  - action: homeassistant.delete_all_orphaned_entities
                  - event: zen_event
                    event_data:
                      event:
                        kind: ectoplasm_orphan_cleanup
                        severity: warning
                        summary: Orphaned entities deleted.
                  - variables:
                      _final:
                        status: success
                        action_type: orphan_cleanup
                        message: Orphaned entities deleted.
                        caller_token: "{{ caller_token }}"

        # ── Fallthrough — unreachable if validation gate is correct ──────────
        default:
          - variables:
              _final:
                status: error
                action_type: "{{ _action }}"
                message: >-
                  Unhandled dispatch fallthrough — this is a bug. Action passed
                  validation but reached the default branch.
                caller_token: "{{ caller_token }}"

      # ═══════════════════════════════════════════════════════════════════════
      # SINGLE EXIT — envelope() wrap. Cadillac-pattern piece 1/3 (SESE +
      # envelope) — all 34 action branches converge here via nested
      # choose:/default: guards instead of per-branch stop:s.
      # ═══════════════════════════════════════════════════════════════════════
      - variables:
          _envelope_raw: >-
            {%- import 'zenos_ai/zen_os_1.jinja' as OS -%}
            {{- OS.envelope(
              status='error' if (_final.get('status') == 'error' if _final is mapping else false) else 'success',
              mode=_action,
              result=_final,
              tool='zen_dojotools_ectoplasm',
              caller_token=caller_token | default('')
            ) -}}
      - variables:
          _envelope: "{{ (_envelope_raw | from_json) if _envelope_raw is string else _envelope_raw }}"
      - stop: Ectoplasm complete
        response_variable: _envelope

