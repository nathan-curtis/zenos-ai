                          - variables:
                              _final:
                                status: success
                                action_type: area_delete
                                area_id: "{{ _area_id }}"
                                message: "Area '{{ _area_id }}' deleted."
                                caller_token: "{{ caller_token }}"

              # ── AREA_ASSIGN_DEVICE ─────────────────────────────────────────────
              - conditions: "{{ _action == 'area_assign_device' }}"
                sequence:
                  - choose:
                      - conditions: "{{ _ecto_cert_denied }}"
                        sequence:
                          - variables:
                              _ecto_cd_raw: >-
                                {%- import 'zenos_ai/zen_os_1.jinja' as OS -%}
                                {{ OS.cert_denial(_ecto_cert_policy, _ecto_cert_authorized, _ecto_cert_level, _ecto_required_cert | trim, _ecto_required_level | int, _action, _ecto_cert_block_reason) -}}
                          - variables:
                              _final: "{{ ((_ecto_cd_raw | from_json) if _ecto_cd_raw is string else _ecto_cd_raw) | combine({'action_type': _action, 'caller_token': caller_token}) }}"
                      - conditions: "{{ _device_id == '' or _area_id == '' }}"
                        sequence:
                          - variables:
                              _final:
                                status: error
                                action_type: area_assign_device
                                message: "area_assign_device requires device_id and area_id."
                                caller_token: "{{ caller_token }}"
                    default:
                      - action: homeassistant.add_device_to_area
                        data:
                          device_id: "{{ _device_id }}"
                          area_id: "{{ _area_id }}"
                      - event: zen_event
                        event_data:
                          event:
                            kind: ectoplasm_area_assign_device
                            device_id: "{{ _device_id }}"
                            area_id: "{{ _area_id }}"
                            severity: info
                            summary: "Device {{ _device_id }} assigned to area {{ _area_id }}"
                      - variables:
                          _final:
                            status: success
                            action_type: area_assign_device
                            device_id: "{{ _device_id }}"
                            area_id: "{{ _area_id }}"
                            message: "Device assigned to area."
                            caller_token: "{{ caller_token }}"

              # ── AREA_UNASSIGN_DEVICE ───────────────────────────────────────────
              - conditions: "{{ _action == 'area_unassign_device' }}"
                sequence:
                  - choose:
                      - conditions: "{{ _ecto_cert_denied }}"
                        sequence:
                          - variables:
                              _ecto_cd_raw: >-
                                {%- import 'zenos_ai/zen_os_1.jinja' as OS -%}
                                {{ OS.cert_denial(_ecto_cert_policy, _ecto_cert_authorized, _ecto_cert_level, _ecto_required_cert | trim, _ecto_required_level | int, _action, _ecto_cert_block_reason) -}}
                          - variables:
                              _final: "{{ ((_ecto_cd_raw | from_json) if _ecto_cd_raw is string else _ecto_cd_raw) | combine({'action_type': _action, 'caller_token': caller_token}) }}"
                      - conditions: "{{ _device_id == '' }}"
                        sequence:
                          - variables:
                              _final:
                                status: error
                                action_type: area_unassign_device
                                message: "area_unassign_device requires device_id."
                                caller_token: "{{ caller_token }}"
                    default:
                      - action: homeassistant.remove_device_from_area
                        data:
                          device_id: "{{ _device_id }}"
                      - event: zen_event
                        event_data:
                          event:
                            kind: ectoplasm_area_unassign_device
                            device_id: "{{ _device_id }}"
                            severity: info
                            summary: "Device {{ _device_id }} unassigned from area"
                      - variables:
                          _final:
                            status: success
                            action_type: area_unassign_device
                            device_id: "{{ _device_id }}"
                            message: "Device unassigned from area."
                            caller_token: "{{ caller_token }}"

              # ── AREA_ASSIGN_ENTITY ─────────────────────────────────────────────
              - conditions: "{{ _action == 'area_assign_entity' }}"
                sequence:
                  - choose:
                      - conditions: "{{ _ecto_cert_denied }}"
                        sequence:
                          - variables:
                              _ecto_cd_raw: >-
                                {%- import 'zenos_ai/zen_os_1.jinja' as OS -%}
                                {{ OS.cert_denial(_ecto_cert_policy, _ecto_cert_authorized, _ecto_cert_level, _ecto_required_cert | trim, _ecto_required_level | int, _action, _ecto_cert_block_reason) -}}
                          - variables:
                              _final: "{{ ((_ecto_cd_raw | from_json) if _ecto_cd_raw is string else _ecto_cd_raw) | combine({'action_type': _action, 'caller_token': caller_token}) }}"
                      - conditions: "{{ _entity_id == '' or _area_id == '' }}"
                        sequence:
                          - variables:
                              _final:
                                status: error
                                action_type: area_assign_entity
                                message: "area_assign_entity requires entity_id and area_id."
                                caller_token: "{{ caller_token }}"
                    default:
                      - action: homeassistant.add_entity_to_area
                        data:
                          entity_id: "{{ _entity_id }}"
                          area_id: "{{ _area_id }}"
                      - event: zen_event
                        event_data:
                          event:
                            kind: ectoplasm_area_assign_entity
                            entity_id: "{{ _entity_id }}"
                            area_id: "{{ _area_id }}"
                            severity: info
                            summary: "Entity {{ _entity_id }} assigned to area {{ _area_id }}"
                      - variables:
                          _final:
                            status: success
                            action_type: area_assign_entity
                            entity_id: "{{ _entity_id }}"
                            area_id: "{{ _area_id }}"
                            message: "Entity assigned to area."
                            caller_token: "{{ caller_token }}"

              # ── AREA_UNASSIGN_ENTITY ───────────────────────────────────────────
              - conditions: "{{ _action == 'area_unassign_entity' }}"
                sequence:
                  - choose:
                      - conditions: "{{ _ecto_cert_denied }}"
                        sequence:
                          - variables:
                              _ecto_cd_raw: >-
                                {%- import 'zenos_ai/zen_os_1.jinja' as OS -%}
                                {{ OS.cert_denial(_ecto_cert_policy, _ecto_cert_authorized, _ecto_cert_level, _ecto_required_cert | trim, _ecto_required_level | int, _action, _ecto_cert_block_reason) -}}
                          - variables:
                              _final: "{{ ((_ecto_cd_raw | from_json) if _ecto_cd_raw is string else _ecto_cd_raw) | combine({'action_type': _action, 'caller_token': caller_token}) }}"
                      - conditions: "{{ _entity_id == '' }}"
                        sequence:
                          - variables:
                              _final:
                                status: error
                                action_type: area_unassign_entity
                                message: "area_unassign_entity requires entity_id."
                                caller_token: "{{ caller_token }}"
                    default:
                      - action: homeassistant.remove_entity_from_area
                        data:
                          entity_id: "{{ _entity_id }}"
                      - event: zen_event
                        event_data:
                          event:
                            kind: ectoplasm_area_unassign_entity
                            entity_id: "{{ _entity_id }}"
                            severity: info
                            summary: "Entity {{ _entity_id }} unassigned from area"
                      - variables:
                          _final:
                            status: success
                            action_type: area_unassign_entity
                            entity_id: "{{ _entity_id }}"
                            message: "Entity unassigned from area."
                            caller_token: "{{ caller_token }}"

              # ── FLOOR_CREATE ───────────────────────────────────────────────────
              - conditions: "{{ _action == 'floor_create' }}"
                sequence:
                  - choose:
                      - conditions: "{{ _ecto_cert_denied }}"
                        sequence:
                          - variables:
                              _ecto_cd_raw: >-
                                {%- import 'zenos_ai/zen_os_1.jinja' as OS -%}
                                {{ OS.cert_denial(_ecto_cert_policy, _ecto_cert_authorized, _ecto_cert_level, _ecto_required_cert | trim, _ecto_required_level | int, _action, _ecto_cert_block_reason) -}}
                          - variables:
                              _final: "{{ ((_ecto_cd_raw | from_json) if _ecto_cd_raw is string else _ecto_cd_raw) | combine({'action_type': _action, 'caller_token': caller_token}) }}"
                      - conditions: "{{ _floor_name == '' }}"
                        sequence:
                          - variables:
                              _final:
                                status: error
                                action_type: floor_create
                                message: "floor_create requires floor_name."
                                caller_token: "{{ caller_token }}"
                    default:
                      - choose:
                          - conditions: "{{ _floor_level is not none }}"
                            sequence:
                              - action: homeassistant.create_floor
                                data:
                                  name: "{{ _floor_name }}"
                                  level: "{{ _floor_level }}"
                        default:
                          - action: homeassistant.create_floor
                            data:
                              name: "{{ _floor_name }}"
                      - event: zen_event
                        event_data:
                          event:
                            kind: ectoplasm_floor_create
                            floor_name: "{{ _floor_name }}"
                            floor_level: "{{ _floor_level }}"
                            severity: info
                            summary: "Floor created: {{ _floor_name }}"
                      - variables:
                          _final:
                            status: success
                            action_type: floor_create
                            floor_name: "{{ _floor_name }}"
                            floor_level: "{{ _floor_level }}"
                            message: "Floor '{{ _floor_name }}' created."
                            caller_token: "{{ caller_token }}"

              # ── FLOOR_DELETE ───────────────────────────────────────────────────
              - conditions: "{{ _action == 'floor_delete' }}"
                sequence:
                  - choose:
                      - conditions: "{{ _ecto_cert_denied }}"
                        sequence:
                          - variables:
                              _ecto_cd_raw: >-
                                {%- import 'zenos_ai/zen_os_1.jinja' as OS -%}
                                {{ OS.cert_denial(_ecto_cert_policy, _ecto_cert_authorized, _ecto_cert_level, _ecto_required_cert | trim, _ecto_required_level | int, _action, _ecto_cert_block_reason) -}}
                          - variables:
                              _final: "{{ ((_ecto_cd_raw | from_json) if _ecto_cd_raw is string else _ecto_cd_raw) | combine({'action_type': _action, 'caller_token': caller_token}) }}"
                      - conditions: "{{ _floor_id == '' }}"
                        sequence:
                          - variables:
                              _final:
                                status: error
                                action_type: floor_delete
                                message: "floor_delete requires floor_id."
                                caller_token: "{{ caller_token }}"
                    default:
                      - choose:
                          - conditions: "{{ not _confirm }}"
                            sequence:
                              - variables:
                                  _final:
                                    status: start
                                    action_type: floor_delete
                                    preview:
                                      floor_id: "{{ _floor_id }}"
                                    message: >-
                                      Would delete floor '{{ _floor_id }}'.
                                      Set confirm_action: true to execute.
                                    caller_token: "{{ caller_token }}"
                        default:
                          - action: homeassistant.delete_floor
                            data:
                              floor_id: "{{ _floor_id }}"
                          - event: zen_event
                            event_data:
                              event:
                                kind: ectoplasm_floor_delete
                                floor_id: "{{ _floor_id }}"
                                severity: warning
                                summary: "Floor deleted: {{ _floor_id }}"
                          - variables:
                              _final:
                                status: success
                                action_type: floor_delete
                                floor_id: "{{ _floor_id }}"
                                message: "Floor '{{ _floor_id }}' deleted."
                                caller_token: "{{ caller_token }}"

              # ── FLOOR_ASSIGN_AREA ──────────────────────────────────────────────
              - conditions: "{{ _action == 'floor_assign_area' }}"
                sequence:
                  - choose:
                      - conditions: "{{ _ecto_cert_denied }}"
                        sequence:
                          - variables:
                              _ecto_cd_raw: >-
                                {%- import 'zenos_ai/zen_os_1.jinja' as OS -%}
                                {{ OS.cert_denial(_ecto_cert_policy, _ecto_cert_authorized, _ecto_cert_level, _ecto_required_cert | trim, _ecto_required_level | int, _action, _ecto_cert_block_reason) -}}
