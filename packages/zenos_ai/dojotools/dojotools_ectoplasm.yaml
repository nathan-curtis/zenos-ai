                        caller_token: "{{ caller_token }}"

          # ── REPAIR_UNIGNORE_ALL ────────────────────────────────────────────
          - conditions: "{{ _action == 'repair_unignore_all' }}"
            sequence:
              - choose:
                  - conditions: "{{ not _confirm }}"
                    sequence:
                      - variables:
                          _final:
