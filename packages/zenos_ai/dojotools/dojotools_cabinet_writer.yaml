###############################################################################
# ZENOS-AI ADMINTOOL: CABINET WRITER, the admin door (v1.8.0)
# v1.8.0: mode get reads one drawer. The vault refuses every read outside
#   this door, so its owner (identity) reads it here. Logged like a write.
# v1.7.0: zenos.system.cabinet_admin max_level 2. Level 1 is this door;
#   level 2 also lets a user session change cabinet labels (labels 5.10.0).
# v1.6.1: each cert this tool declares gets a short plain description for
#   the approval prompt (the old text moves to detail) and its real max_level.
#
# The one place admin-plane cabinet writes fire (#10637, epic #10626). The
# agent-facing door is zen_dojotools_filecabinet; this is the other door, for
# structural writes FileCabinet refuses by design (AI_Cabinet_VolumeInfo, meta,
# _label_index, _zen_relationships), the system cabinet, and the vault.
#
# Not MCP-exposed. Callers are admin-plane scripts and tools that own a
# structural write (identity membership, prompt_loader, cabinetadmin, Flynn,
# maint scripts). Every write names its caller and is logged (zen_event
# admin_cabinet_write + system_log), so admin writes can be audited now and
# gated later.
#
# Writes go out as the generic set/remove/clear_variables_legacy events with an
# explicit volume_entity; the Volume Redirector in zenos_cabinets.yaml routes
# them to the cabinet (with its manifest GUID check). Payloads are built by the
# caller; this script only validates, writes, and logs.
#
# v1.1.0: every write waits until the cabinet shows it (set: drawer timestamp,
#   remove: key gone, clear: drawers gone) and answers write_verified; an
#   unverified write is status error. Callers read-modify-write VolumeInfo, so
#   answering early let the next call overwrite this one. Adds force and
#   bootstrap passthroughs for cabinetadmin.
# v1.2.0: a bootstrap write may target a cabinet still in 'unknown' (virgin);
#   every other write needs an online cabinet.
# v1.3.0: a set also checks the stored value equals the value sent
#   (content_verified); a changed value is an error. Proven lossless for the
#   prompt_loader brain strings, which now come through here.
# v1.4.0: optional meta/acl pass through to the drawer envelope.
# v1.5.0: mode merge (#10626): the door reads the stored value when it writes,
#   lays the given keys over it and drops the keys named in unset. A caller
#   sends only what it changes, so a partial value can never replace the whole
#   drawer, and the queued door serializes concurrent merges.
# v1.6.0: door gate, audit only (#10626/#10632/#10633). A write chain with no
#   user session (boot, Flynn's bootstrap, automations) is exempt; an agent or
#   console write needs cert zenos.system.cabinet_admin and would ask a live
#   human. Logged (zen_event door_gate_audit, system_log) and answered as
#   gate_audit; nothing is refused yet.
#
# Modes:
#   help (default, also any unknown mode): this reference, never a write.
#   tool_manifest: self-description.
#   set     volume_entity key value caller [force] [bootstrap]
#   merge   volume_entity key value(mapping) caller [unset] [force] [bootstrap]
#   remove  volume_entity key caller
#   clear   volume_entity caller confirm=true (wipes every drawer)
#   get     volume_entity key caller (read one drawer: value, timestamp)
###############################################################################

script:
  zen_admintools_cabinet_writer:
    alias: Zen AdminTools Cabinet Writer
    description: >-
      Admin door: the single writer for admin-plane cabinet writes
      (structural drawers FileCabinet refuses, system cabinet, vault). Not for
      agents. Every write names its caller and is logged. mode=help for usage.
    mode: queued
    max: 20
    icon: mdi:door-closed-lock
    fields:
      mode:
        description: "help (default) | tool_manifest | set | merge | remove | clear | get"
        required: false
        selector:
          select:
            options: [help, tool_manifest, set, merge, remove, clear, get]
      volume_entity:
        description: Cabinet sensor entity_id to write.
        required: false
        selector:
          text:
      key:
        description: Drawer key (set/merge/remove/get).
        required: false
        selector:
          text:
      value:
        description: Drawer value (set). Mapping, list, or string; written as given.
        required: false
        selector:
          object:
      set_timestamp:
        description: Accepted for compatibility; set always stamps the drawer timestamp (verification reads it).
        required: false
        selector:
          boolean:
      caller:
        description: Owning admin tool or script, required for every write (logged).
        required: false
        selector:
          text:
      reason:
        description: Optional short reason, logged with the write.
        required: false
        selector:
          text:
      confirm:
        description: Required (true) for clear.
        required: false
        selector:
          boolean:
      unset:
        description: merge only. Top-level keys to drop from the stored value.
        required: false
        selector:
          object:
      meta:
        description: Drawer envelope meta (expiry etc.); merged over the stored meta.
        required: false
        selector:
          object:
      acl:
        description: Drawer envelope acl; replaces the stored acl when given.
        required: false
        selector:
          object:
      force:
        description: Passed to the Volume Redirector (overwrite guard bypass) for writes that own it.
        required: false
        selector:
          boolean:
      bootstrap:
        description: >-
          Cabinet bootstrap write (cabinetadmin init/restore): passed to the
          Volume Redirector as _cabinetadmin_init so a cabinet not yet in the
          manifest can be stamped.
        required: false
        selector:
          boolean:
      caller_token:
        description: Opaque correlation token, echoed.
        required: false
        selector:
          text:
    sequence:
      - variables:
          _mode: "{{ mode | default('help', true) | string | trim | lower }}"
          _vol: "{{ volume_entity | default('', true) | string | trim }}"
          _key: "{{ key | default('', true) | string | trim }}"
          _caller: "{{ caller | default('', true) | string | trim }}"
          _reason: "{{ reason | default('', true) | string | trim }}"
          _token: "{{ caller_token | default('', true) }}"
          # A bootstrap write (cabinetadmin init/restore/factory) may target a
          # cabinet still in 'unknown' (virgin, no recorder history); every
          # other write needs an online cabinet. unavailable is never writable.
          _is_cabinet: >-
            {{ _vol != '' and _vol in label_entities('zen_cabinet')
               and (states(_vol) not in ['unknown', 'unavailable', '']
                    or ((bootstrap | default(false) | bool) and states(_vol) == 'unknown')) }}

      # ── help (default, and any unknown mode) ─────────────────────────────
      - if: "{{ _mode not in ['tool_manifest', 'set', 'merge', 'remove', 'clear', 'get'] }}"
        then:
          - variables:
              result:
                status: help
                tool: zen_admintools_cabinet_writer
                about: >-
                  Admin door: the single writer for admin-plane cabinet writes.
                  Agents use zen_dojotools_filecabinet instead.
                modes:
                  set: "volume_entity key value caller [reason] [force] [bootstrap]"
                  merge: "volume_entity key value(mapping) caller [unset] [reason] [force] [bootstrap]: the given keys over the stored value"
                  remove: "volume_entity key caller [reason]"
                  clear: "volume_entity caller confirm=true [reason] (wipes every drawer)"
                  get: "volume_entity key caller: read one drawer (value, timestamp); the only read path into the vault"
                  tool_manifest: self-description
                rules:
                  - caller is required on every write and is logged
                  - volume_entity must be a zen_cabinet-labeled cabinet that is online
                  - nothing is written without an explicit mode
                  - every write is verified on the cabinet before the door answers (write_verified)
                caller_token: "{{ _token }}"

      # ── tool_manifest ─────────────────────────────────────────────────────
      - if: "{{ result is not defined and _mode == 'tool_manifest' }}"
        then:
          - variables:
              result: >-
                {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
                {{- MF.tool_manifest(
                  tool='zen_admintools_cabinet_writer',
                  display_name='Cabinet Writer (admin door)',
                  tier='admintools',
                  version='1.8.0',
                  health={'configured': true, 'status': 'ok', 'notes': []},
                  required_labels=['zen_cabinet'],
                  consumes=['volume_entity', 'key', 'value'],
                  returns=['write_ack'],
                  failure_policy='hard',
                  modes={'help': 'help', 'manifest': 'tool_manifest', 'set': 'set', 'merge': 'merge', 'remove': 'remove', 'clear': 'clear', 'get': 'get'},
                  icon='mdi:door-closed-lock',
                  color='deep-orange',
                  mcp_exposed=false,
                  caller_token=_token
                ) | from_json | combine({
                  'certs_required': [{
                    'cert': 'zenos.system.cabinet_admin',
                    'display_name': 'Cabinet admin (admin door)',
                    'description': "Make protected system changes (asks you each time); level 2 also changes cabinet labels", 'detail': 'Structural, system-cabinet and vault writes through the admin door when an agent or console session starts them. Each such write also asks a live human. Boot and automation writes (no user session) do not need it.',
                    'max_level': 2,
                    'gates': ['set', 'merge', 'remove', 'clear'],
                    'live_ack_required_for': ['set', 'merge', 'remove', 'clear'],
                    'grant_via': 'persona_editor mode=cert_req_grant cert_component=zenos.system.cabinet_admin'
                  }]
                }) -}}

      # ── validation for writes ─────────────────────────────────────────────
      - if: "{{ result is not defined }}"
        then:
          - variables:
              _err: >-
                {%- if _caller == '' -%}caller is required on every admin write
                {%- elif not _is_cabinet -%}volume_entity '{{ _vol }}' is not an online zen_cabinet
                {%- elif _mode in ['set', 'merge', 'remove', 'get'] and _key == '' -%}key is required for {{ _mode }}
                {%- elif _mode == 'set' and value is not defined -%}value is required for set
                {%- elif _mode == 'merge' and not (value is defined and value is mapping) -%}merge needs value as a mapping
                {%- elif _mode == 'clear' and not (confirm | default(false) | bool) -%}clear wipes every drawer; pass confirm=true
                {%- else -%}{%- endif -%}
          - if: "{{ _err != '' }}"
            then:
              - variables:
                  result:
                    status: error
                    tool: zen_admintools_cabinet_writer
                    mode: "{{ _mode }}"
                    message: "guarded: {{ _err }}"
                    caller_token: "{{ _token }}"

      # ── get: read one drawer ──────────────────────────────────────────────
      # The read path for drawers whose read rule is the door (the vault).
      # A read changes nothing, so the write gate below does not apply; it is
      # logged with its caller like every write.
      - if: "{{ result is not defined and _mode == 'get' }}"
        then:
          - variables:
              _gd: "{{ (state_attr(_vol, 'variables') or {}).get(_key) }}"
          - action: system_log.write
            data:
              level: debug
              logger: zen_admintools_cabinet_writer
              message: "admin_cabinet_read caller={{ _caller }} volume={{ _vol }} key={{ _key }} found={{ _gd is mapping }}"
          - variables:
              result:
                status: "{{ 'success' if _gd is mapping else 'not_found' }}"
                tool: zen_admintools_cabinet_writer
                mode: get
                volume_entity: "{{ _vol }}"
                key: "{{ _key }}"
                caller: "{{ _caller }}"
                value: "{{ _gd.get('value') if _gd is mapping else none }}"
                timestamp: "{{ _gd.get('timestamp', '') if _gd is mapping else '' }}"
                caller_token: "{{ _token }}"

      # ── door gate (#10626 / #10632), AUDIT ONLY (#10633) ─────────────────
      # A write chain no user started (boot, Flynn's bootstrap, automations:
      # context.user_id empty) is exempt. Anything else (an agent's MCP call,
      # a console session: HA cannot tell them apart) needs cert
      # zenos.system.cabinet_admin and would ask a live human. Audit only:
      # nothing is refused yet; the decision is logged and answered as
      # gate_audit.
      - variables:
          _dg: >-
            {%- if result is not defined -%}
              {%- import 'zenos_ai/zen_identity.jinja' as ID -%}
              {%- set _uid = (context.user_id | default('', true) | string | trim) if context is defined else '' -%}
              {%- if _uid == '' -%}
                {{- {'mode': 'audit', 'exempt': true, 'why': 'no user session (boot, automation)', 'would_deny': false, 'would_ack': false} -}}
              {%- else -%}
                {%- set _c = ID.caller('zenos.system.cabinet_admin', 1) | from_json -%}
                {{- {'mode': 'audit', 'exempt': false, 'caller_guid': _c.guid, 'cert': 'zenos.system.cabinet_admin:1',
                     'would_deny': not _c.cert_ok, 'reasons': ([] if _c.cert_ok else ['cert zenos.system.cabinet_admin:1 not held']),
                     'would_ack': true} -}}
              {%- endif -%}
            {%- else -%}
              {{- none -}}
            {%- endif -%}
      - if: "{{ _dg is mapping and not _dg.exempt }}"
        then:
          - event: zen_event
            event_data:
              event:
                timestamp: "{{ now().isoformat() }}"
                component: zen_admintools_cabinet_writer
                severity: "{{ 'warning' if _dg.would_deny else 'info' }}"
                kind: door_gate_audit
                summary: "{{ _caller }} {{ _mode }} {{ _vol }}{{ (' ' ~ _key) if _key else '' }}: {{ 'would deny (' ~ (_dg.reasons | join('; ')) ~ ')' if _dg.would_deny else 'would ask for a live ack' }}"
                metadata: "{{ _dg }}"
          - action: system_log.write
            data:
              level: "{{ 'warning' if _dg.would_deny else 'info' }}"
              logger: zen_admintools_cabinet_writer
              message: "door_gate_audit caller={{ _caller }} op={{ _mode }} volume={{ _vol }} key={{ _key }} would_deny={{ _dg.would_deny }} would_ack={{ _dg.would_ack }}"

      # ── write + log ───────────────────────────────────────────────────────
      - if: "{{ result is not defined }}"
        then:
          - variables:
              _now: "{{ now().isoformat() }}"
              _force: "{{ force | default(false) | bool }}"
              _boot: "{{ bootstrap | default(false) | bool }}"
              # merge: the stored value (a mapping, or a JSON string of one)
              # with the given keys laid over it and the unset keys dropped.
              _value: >-
                {%- if _mode == 'merge' -%}
                  {%- set d = (state_attr(_vol, 'variables') or {}).get(_key) -%}
                  {%- set cur = d.get('value') if d is mapping else none -%}
                  {%- set cur = (cur | from_json(none)) if cur is string else cur -%}
                  {%- set cur = cur if cur is mapping else {} -%}
                  {%- set drop = unset if (unset is defined and unset is iterable and unset is not string and unset is not mapping) else [] -%}
                  {%- set ns = namespace(o={}) -%}
                  {%- for k, v in cur.items() if k not in drop and k not in value -%}{%- set ns.o = dict(ns.o, **{k: v}) -%}{%- endfor -%}
                  {{ dict(ns.o, **value) }}
                {%- else -%}
                  {{ value if value is defined else none }}
                {%- endif -%}
          # Each write waits until the cabinet shows it before the door
          # answers: callers read-modify-write VolumeInfo, and an answer that
          # comes back before the drawer updates lets the next call read the
          # old value and overwrite this one.
          - choose:
              - conditions: "{{ _mode in ['set', 'merge'] }}"
                sequence:
                  - event: set_variable_legacy
                    event_data:
                      volume_entity: "{{ _vol }}"
                      key: "{{ _key }}"
                      value: "{{ _value }}"
                      meta: "{{ meta if meta is defined else none }}"
                      acl: "{{ acl if acl is defined else none }}"
                      set_timestamp: true
                      force: "{{ _force }}"
                      _cabinetadmin_init: "{{ _boot }}"
                  - wait_template: >-
                      {{ ((state_attr(_vol, 'variables') or {}).get(_key, {}) or {}).get('timestamp', '') | string >= _now }}
                    timeout: "00:00:10"
                    continue_on_timeout: true
              - conditions: "{{ _mode == 'remove' }}"
                sequence:
                  - event: remove_variable_legacy
                    event_data:
                      volume_entity: "{{ _vol }}"
                      key: "{{ _key }}"
                  - wait_template: >-
                      {{ state_attr(_vol, 'variables') is mapping and state_attr(_vol, 'variables').get(_key) is none }}
                    timeout: "00:00:10"
                    continue_on_timeout: true
              - conditions: "{{ _mode == 'clear' }}"
                sequence:
                  - event: clear_variables_legacy
                    event_data:
                      volume_entity: "{{ _vol }}"
                      confirm: true
                  - wait_template: >-
                      {{ (state_attr(_vol, 'variables') or {}) | count == 0 }}
                    timeout: "00:00:10"
                    continue_on_timeout: true
          - variables:
              _verified: "{{ wait.completed if wait is defined else false }}"
          # A set must land exactly as sent: compare the stored value with the
          # value given. Each hop re-renders the value and HA's native typing can
          # change it (a quoted string unwrapped, "45" turned into 45); a changed
          # value is a failed write, not a success.
          - variables:
              _content_ok: >-
                {%- if _mode not in ['set', 'merge'] -%}true
                {%- else -%}
                  {%- set d = (state_attr(_vol, 'variables') or {}).get(_key, {}) -%}
                  {%- set got = d.get('value') if d is mapping else none -%}
                  {{ (got | tojson) == (_value | tojson) }}
                {%- endif -%}
          - event: zen_event
            event_data:
              event:
                timestamp: "{{ now().isoformat() }}"
                component: zen_admintools_cabinet_writer
                severity: info
                kind: admin_cabinet_write
                summary: "{{ _caller }} {{ _mode }} {{ _vol }}{{ (' ' ~ _key) if _key else '' }}"
                metadata:
                  caller: "{{ _caller }}"
                  op: "{{ _mode }}"
                  volume_entity: "{{ _vol }}"
                  key: "{{ _key }}"
                  reason: "{{ _reason }}"
          - action: system_log.write
            data:
              level: info
              message: "admin_cabinet_write caller={{ _caller }} op={{ _mode }} volume={{ _vol }} key={{ _key }} reason={{ _reason }}"
          - variables:
              result:
                status: "{{ 'success' if (_verified and _content_ok) else 'error' }}"
                tool: zen_admintools_cabinet_writer
                mode: "{{ _mode }}"
                volume_entity: "{{ _vol }}"
                key: "{{ _key }}"
                caller: "{{ _caller }}"
                write_verified: "{{ _verified }}"
                content_verified: "{{ _content_ok }}"
                gate_audit: "{{ _dg if (_dg is mapping and not _dg.exempt) else none }}"
                message: >-
                  {{ 'write not visible on the cabinet within 10s' if not _verified
                     else ('stored value differs from the value sent' if not _content_ok else '') }}
                caller_token: "{{ _token }}"

      - stop: cabinet writer done
        response_variable: result
