    - choose:
      - conditions:
        - condition: template
          value_template: '{{ section_norm == "books" and mode_norm == "help" }}'
        sequence:
        - variables:
            result:
              status: info
              tool: zen_dojotools_library
              section: books
              mode: help
              description: Physical book collection card catalog. Backed by Grocy inventory (ha_labels=book).
              quick_start: >-
                STEP 1 — One-time setup (new Grocy instance only):
                  books_configure — deploys all book userfields + On Loan location. Safe to re-run.
                STEP 2 — Add books one at a time:
                  books_add — title required. Add author/isbn/series/genre/location_id as known.
                  ISBN dedup: if the book is already in Grocy, books_add finds it and returns existing.
                  Use books_search to check first if unsure.
                STEP 3 — Day-to-day:
                  books_browse — see all books with shelf locations and walking directions.
                  books_find   — filter by author/genre/series/location.
                  books_search — text search across title + author + series.
                  books_move   — move a book to a different shelf (title + to_location_id).
                  books_loan   — loan to someone (title + borrower + optional due_date).
                  books_return — return from loan back to home shelf (title only).
              modes:
                books_configure:
                  intent: One-time setup. Deploys 8 book userfields + On Loan virtual location. Idempotent — safe to re-run anytime.
                  when_to_use: First time setting up books on a new Grocy instance, or after a Grocy reinstall.
                  example: "section=books mode=books_configure"
                books_add:
                  intent: Add a book to the catalog with stock registration. ISBN dedup guard prevents duplicates.
                  schema: "{'title':'<required>','author':'Last, First','isbn':'<ISBN-13>','series':'Series #N','genre':'fantasy','location_id':109,'note':''}"
                  tip: location_id defaults to 109 (Left Twin Bookcase). Use books_browse to find other shelf IDs.
                  example: "section=books mode=books_add input_json={\"title\":\"Eragon\",\"author\":\"Paolini, Christopher\",\"isbn\":\"9780375826696\",\"series\":\"Inheritance Cycle #1\",\"genre\":\"fantasy\",\"location_id\":109}"
                books_browse:
                  intent: Full collection with shelf location names and walking directions. Use to discover location_ids for books_move.
                  example: "section=books mode=books_browse"
                books_find:
                  intent: Filter by author, genre, series, or shelf location. All filters optional — combine freely.
                  schema: "{'author':'<partial>','genre':'<genre>','series':'<series>','location_id':<int>,'location_name':'<partial>'}"
                  example: "section=books mode=books_find input_json={\"author\":\"Paolini\",\"genre\":\"fantasy\"}"
                books_search:
                  intent: Free-text search across title + author + series. Fastest way to check if a book exists.
                  example: "section=books mode=books_search query=eragon"
                books_move:
                  intent: Move a book to a different shelf. Use books_browse to find to_location_id values.
                  schema: "{'title':'<required>','to_location_id':<int>}"
                  example: "section=books mode=books_move input_json={\"title\":\"Eragon\",\"to_location_id\":214}"
                books_loan:
                  intent: Loan a book out. Moves stock to On Loan (loc 551), saves borrower + loan_date (auto) + due_date + home shelf.
                  schema: "{'title':'<required>','borrower':'<required>','due_date':'YYYY-MM-DD (optional)'}"
                  example: "section=books mode=books_loan input_json={\"title\":\"Eragon\",\"borrower\":\"Alex\",\"due_date\":\"2026-07-19\"}"
                books_return:
                  intent: Return a loaned book. Moves back to home shelf (recorded at loan time). Clears all loan fields.
                  schema: "{'title':'<required>'}"
                  example: "section=books mode=books_return input_json={\"title\":\"Eragon\"}"
              caller_token: "{{ caller_token_norm }}"
        - stop: books help
          response_variable: result

      - conditions:
        - condition: template
          value_template: '{{ section_norm == "books" and mode_norm in ["books_browse", "browse"] }}'
        sequence:
        - action: script.zen_dojotools_inventory
          response_variable: _bk_catalog_raw
          continue_on_error: true
          data:
            mode: catalog_find_by_tag
            ha_labels: book
        - variables:
            _bk_pre: >-
              {%- set r = _bk_catalog_raw if _bk_catalog_raw is mapping else {} -%}
              {%- set items = r.get('items', r.get('products', [])) -%}
              {%- set items = items if items is sequence and items is not string else [] -%}
              {%- set ns = namespace(out=[]) -%}
              {%- for b in items if b is mapping -%}
                {%- set uf = b.get('userfields', {}) if b.get('userfields') is mapping else {} -%}
                {%- set ns.out = ns.out + [{'id': b.get('id', ''), 'name': b.get('name', ''), 'location_id': b.get('location_id', none), 'homeassistant_area': b.get('homeassistant_area', ''), 'userfields': {'book_author': uf.get('book_author', ''), 'book_genre': uf.get('book_genre', ''), 'book_series': uf.get('book_series', ''), 'book_isbn': uf.get('book_isbn', ''), 'book_loan_borrower': uf.get('book_loan_borrower', ''), 'book_loan_date': uf.get('book_loan_date', ''), 'book_loan_due': uf.get('book_loan_due', ''), 'book_loan_home_location_id': uf.get('book_loan_home_location_id', none)}}] -%}
              {%- endfor -%}
              {{ ns.out }}
            _bk_mode: books_browse
            _bk_filters: {}

      - conditions:
        - condition: template
          value_template: '{{ section_norm == "books" and mode_norm in ["books_find", "find"] }}'
        sequence:
        - variables:
            _bk_find_input: >-
              {%- set raw = input_json | default('', true) -%}
              {%- if raw is mapping -%}{{ raw }}
              {%- elif raw is string and raw | trim != '' -%}{{ raw | trim | from_json(none) or {} }}
              {%- else -%}{{ {} }}{%- endif -%}
        - action: script.zen_dojotools_inventory
          response_variable: _bk_catalog_raw
          continue_on_error: true
          data:
            mode: catalog_find_by_tag
            ha_labels: book
        - variables:
            _bk_pre: >-
              {%- set r = _bk_catalog_raw if _bk_catalog_raw is mapping else {} -%}
              {%- set items = r.get('items', r.get('products', [])) -%}
              {%- set items = items if items is sequence and items is not string else [] -%}
              {%- set ns = namespace(out=[]) -%}
              {%- for b in items if b is mapping -%}
                {%- set uf = b.get('userfields', {}) if b.get('userfields') is mapping else {} -%}
                {%- set ns.out = ns.out + [{'id': b.get('id', ''), 'name': b.get('name', ''), 'location_id': b.get('location_id', none), 'homeassistant_area': b.get('homeassistant_area', ''), 'userfields': {'book_author': uf.get('book_author', ''), 'book_genre': uf.get('book_genre', ''), 'book_series': uf.get('book_series', ''), 'book_isbn': uf.get('book_isbn', ''), 'book_loan_borrower': uf.get('book_loan_borrower', ''), 'book_loan_date': uf.get('book_loan_date', ''), 'book_loan_due': uf.get('book_loan_due', ''), 'book_loan_home_location_id': uf.get('book_loan_home_location_id', none)}}] -%}
              {%- endfor -%}
              {{ ns.out }}
            _bk_mode: books_find
            _bk_filters: >-
              {%- set inp = _bk_find_input if _bk_find_input is mapping else {} -%}
              {%- set v = inp.get('location_id') -%}
              {%- set loc_id = v | int if v is not none and v | string | trim not in ['', 'none', 'null'] else none -%}
              {{ {
                'author': (inp.get('author', '') or '') | lower | trim,
                'genre':  (inp.get('genre',  '') or '') | lower | trim,
                'series': (inp.get('series', '') or '') | lower | trim,
                'location_id': loc_id,
                'location_name': (inp.get('location_name', '') or '') | lower | trim,
                'person': (inp.get('person', '') or '') | trim
              } }}

      - conditions:
        - condition: template
          value_template: '{{ section_norm == "books" and mode_norm in ["books_search", "search"] }}'
        sequence:
        - action: script.zen_dojotools_inventory
          response_variable: _bk_catalog_raw
          continue_on_error: true
          data:
            mode: catalog_find_by_tag
            ha_labels: book
        - variables:
            _bk_pre: >-
              {%- set r = _bk_catalog_raw if _bk_catalog_raw is mapping else {} -%}
              {%- set items = r.get('items', r.get('products', [])) -%}
              {%- set items = items if items is sequence and items is not string else [] -%}
              {%- set ns = namespace(out=[]) -%}
              {%- for b in items if b is mapping -%}
                {%- set uf = b.get('userfields', {}) if b.get('userfields') is mapping else {} -%}
                {%- set ns.out = ns.out + [{'id': b.get('id', ''), 'name': b.get('name', ''), 'location_id': b.get('location_id', none), 'homeassistant_area': b.get('homeassistant_area', ''), 'userfields': {'book_author': uf.get('book_author', ''), 'book_genre': uf.get('book_genre', ''), 'book_series': uf.get('book_series', ''), 'book_isbn': uf.get('book_isbn', ''), 'book_loan_borrower': uf.get('book_loan_borrower', ''), 'book_loan_date': uf.get('book_loan_date', ''), 'book_loan_due': uf.get('book_loan_due', ''), 'book_loan_home_location_id': uf.get('book_loan_home_location_id', none)}}] -%}
              {%- endfor -%}
              {{ ns.out }}
            _bk_mode: books_search
            _bk_filters: "{{ {'query': query_norm | lower} }}"

      - conditions:
        - condition: template
          value_template: '{{ section_norm == "books" and mode_norm in ["books_add", "add"] }}'
        sequence:
        - variables:
            _ba_title: "{{ (input_data.get('title', '') or '') | string | trim if input_data is mapping else '' }}"
            _ba_author: "{{ input_data.get('author', none) if input_data is mapping else none }}"
            _ba_isbn: >-
              {%- set v = input_data.get('isbn', none) if input_data is mapping else none -%}
              {{ v | string | trim if v is not none and v | string | trim not in ['', 'none', 'null', 'None'] else none }}
            _ba_series: "{{ input_data.get('series', none) if input_data is mapping else none }}"
            _ba_genre: "{{ input_data.get('genre', none) if input_data is mapping else none }}"
            _ba_loc_id: "{{ input_data.get('location_id', 109) | int(109) if input_data is mapping else 109 }}"
            _ba_note: "{{ (input_data.get('note', '') or '') | string | trim if input_data is mapping else '' }}"
        - if: "{{ _ba_title == '' }}"
          then:
          - variables:
              result:
                status: error
                section: books
                mode: books_add
                message: title is required.
                coaching:
                - "Pass input_json with at minimum: {\"title\": \"Book Title\"}"
          - stop: books_add title required
            response_variable: result
        - action: script.zen_dojotools_inventory
          response_variable: _ba_catalog_raw
          continue_on_error: true
          data:
            mode: catalog_find_by_tag
            ha_labels: book
        - variables:
            _ba_catalog_items: >-
              {%- set r = _ba_catalog_raw if _ba_catalog_raw is mapping else {} -%}
              {%- set items = r.get('items', r.get('products', [])) -%}
              {{ items if items is sequence and items is not string else [] }}
        - variables:
            _ba_existing: >-
              {%- set ns = namespace(found=none) -%}
              {%- set title_norm = _ba_title | lower | replace('’', "'") | replace('‘', "'") -%}
              {%- for b in _ba_catalog_items if b is mapping -%}
                {%- set ufs = b.get('userfields', {}) if b.get('userfields') is mapping else {} -%}
                {%- set isbn_hit = _ba_isbn is not none and (ufs.get('book_isbn') or '') | string | trim == _ba_isbn -%}
                {%- set bname = (b.get('name', '') or '') | lower | replace('’', "'") | replace('‘', "'") -%}
                {%- set name_hit = bname == title_norm -%}
                {%- if isbn_hit or name_hit -%}
                  {%- set ns.found = b -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.found | default(none, true) }}
        - if: "{{ _ba_existing is mapping }}"
          then:
          - action: script.zen_dojotools_inventory
            response_variable: _ba_loc_raw
            continue_on_error: true
            data:
              mode: locations_find
              location_id: "{{ _ba_loc_id }}"
          - variables:
              _ba_loc_name: >-
                {%- set r = _ba_loc_raw if _ba_loc_raw is mapping else {} -%}
                {%- set items = r.get('result', []) -%}
                {{ (items[0].get('name', '') if items | length > 0 and items[0] is mapping else '') }}
              _ba_existing_ufs: "{{ _ba_existing.get('userfields', {}) if _ba_existing.get('userfields') is mapping else {} }}"
          - variables:
              result:
                status: existing
                section: books
                mode: books_add
                product_id: "{{ _ba_existing.get('id') | int(0) }}"
                title: "{{ _ba_existing.get('name', _ba_title) }}"
                author: "{{ _ba_existing_ufs.get('book_author', _ba_author) }}"
                isbn: "{{ _ba_existing_ufs.get('book_isbn', _ba_isbn) }}"
                series: "{{ _ba_existing_ufs.get('book_series', _ba_series) }}"
                genre: "{{ _ba_existing_ufs.get('book_genre', _ba_genre) }}"
                location_id: "{{ _ba_existing.get('location_id', _ba_loc_id) }}"
                location_name: "{{ _ba_loc_name }}"
                stocked: 0
                caller_token: "{{ caller_token_norm }}"
          - stop: books_add existing
            response_variable: result
        - variables:
            _ba_bom_item: >-
              {%- set p = {'name': _ba_title, 'location_id': _ba_loc_id} -%}
              {%- if _ba_author is not none -%}{%- set p = p | combine({'book_author': _ba_author | string}) -%}{%- endif -%}
              {%- if _ba_isbn is not none -%}{%- set p = p | combine({'book_isbn': _ba_isbn | string}) -%}{%- endif -%}
              {%- if _ba_series is not none -%}{%- set p = p | combine({'book_series': _ba_series | string}) -%}{%- endif -%}
              {%- if _ba_genre is not none -%}{%- set p = p | combine({'book_genre': _ba_genre | string}) -%}{%- endif -%}
              {%- if _ba_note != '' -%}{%- set p = p | combine({'note': _ba_note}) -%}{%- endif -%}
              {{ p }}
            _ba_bom: >-
              {{
                {
                  'default_location_id': _ba_loc_id,
                  'default_ha_labels': 'book',
                  'default_asset_type': 'book',
                  'default_unit': 'each',
                  'items': [_ba_bom_item]
                } | tojson
              }}
        - action: script.zen_dojotools_inventory
          response_variable: _ba_import_raw
          continue_on_error: true
          data:
            mode: catalog_import_bom
            bom: "{{ _ba_bom }}"
            confirm_action: true
        - variables:
            _ba_import: "{{ _ba_import_raw if _ba_import_raw is mapping else {} }}"
            _ba_import_items: "{{ _ba_import.get('items', []) }}"
        - variables:
            _ba_product_id: >-
              {%- set itms = _ba_import_items if _ba_import_items is sequence and _ba_import_items is not string else [] -%}
              {%- set raw = (itms[0].get('product_id') if itms | length > 0 and itms[0] is mapping else none) -%}
              {{ raw | int(none) if raw is not none and raw | string | trim not in ['', 'none', 'null', 'None'] else none }}
            _ba_import_was_existing: >-
              {%- set itms = _ba_import_items if _ba_import_items is sequence and _ba_import_items is not string else [] -%}
              {{ (itms[0].get('status', '') == 'existing') if itms | length > 0 and itms[0] is mapping else false }}
        - if: "{{ _ba_product_id is none and _ba_import_was_existing }}"
          then:
          - action: script.zen_dojotools_inventory
            response_variable: _ba_cap_raw
            continue_on_error: true
            data:
              mode: catalog_add_product
              item: "{{ _ba_title }}"
              location_id: "{{ _ba_loc_id }}"
          - variables:
              _ba_cap: "{{ _ba_cap_raw if _ba_cap_raw is mapping else {} }}"
              _ba_product_id: >-
                {%- set r = _ba_cap_raw if _ba_cap_raw is mapping else {} -%}
                {%- set ids_raw = r.get('candidate_ids', none) -%}
                {%- set ids = ids_raw if ids_raw is sequence and ids_raw is not string
                              else (ids_raw | from_json([]) if ids_raw is string and ids_raw | trim not in ['', 'null', 'none', 'None'] else []) -%}
                {%- set ids = ids if ids is sequence and ids is not string else [] -%}
                {{ ids[0] | int(none) if ids | length > 0 else none }}
        - if: "{{ _ba_product_id is none }}"
          then:
          - variables:
              result:
                status: error
                section: books
                mode: books_add
                message: Failed to create book product in Grocy.
                detail: "{{ _ba_import }}"
          - stop: books_add create failed
            response_variable: result
        - if: "{{ _ba_import_was_existing }}"
          then:
          - action: script.zen_dojotools_inventory
            response_variable: _ba_tag_raw
            continue_on_error: true
            data:
              mode: products_tag
              product_id: "{{ _ba_product_id }}"
              ha_labels: book
          - action: script.zen_dojotools_inventory
            response_variable: _ba_uf_raw
            continue_on_error: true
            data:
              mode: update_product_meta
              product_id: "{{ _ba_product_id }}"
              note: "{{ _ba_note if _ba_note != '' else omit }}"
          - action: script.zen_dojotools_inventory
            response_variable: _ba_loc_raw
            continue_on_error: true
            data:
              mode: locations_find
              location_id: "{{ _ba_loc_id }}"
          - variables:
              _ba_loc_name: >-
                {%- set r = _ba_loc_raw if _ba_loc_raw is mapping else {} -%}
                {%- set items = r.get('result', []) -%}
                {{ (items[0].get('name', '') if items | length > 0 and items[0] is mapping else '') }}
          - variables:
              result:
                status: existing
                section: books
                mode: books_add
                product_id: "{{ _ba_product_id }}"
                title: "{{ _ba_title }}"
                author: "{{ _ba_author }}"
                isbn: "{{ _ba_isbn }}"
                series: "{{ _ba_series }}"
                genre: "{{ _ba_genre }}"
                location_id: "{{ _ba_loc_id }}"
                location_name: "{{ _ba_loc_name }}"
                stocked: 0
                tagged_book: true
                caller_token: "{{ caller_token_norm }}"
          - stop: books_add existing untagged
            response_variable: result
        - action: script.zen_dojotools_inventory
          response_variable: _ba_stock_raw
          continue_on_error: true
          data:
            mode: stock_buy_product
            product_id: "{{ _ba_product_id }}"
            location_id: "{{ _ba_loc_id }}"
            amount: 1
        - action: script.zen_dojotools_inventory
          response_variable: _ba_loc_raw
          continue_on_error: true
          data:
            mode: locations_find
            location_id: "{{ _ba_loc_id }}"
        - variables:
            _ba_loc_name: >-
              {%- set r = _ba_loc_raw if _ba_loc_raw is mapping else {} -%}
              {%- set items = r.get('result', []) -%}
              {{ (items[0].get('name', '') if items | length > 0 and items[0] is mapping else '') }}
        - variables:
            result:
              status: created
              section: books
              mode: books_add
              product_id: "{{ _ba_product_id }}"
              title: "{{ _ba_title }}"
              author: "{{ _ba_author }}"
              isbn: "{{ _ba_isbn }}"
              series: "{{ _ba_series }}"
              genre: "{{ _ba_genre }}"
              location_id: "{{ _ba_loc_id }}"
              location_name: "{{ _ba_loc_name }}"
              stocked: 1
              note: "{{ _ba_note }}"
              caller_token: "{{ caller_token_norm }}"
        - stop: books_add done
          response_variable: result

      - conditions:
        - condition: template
          value_template: '{{ section_norm == "books" and mode_norm in ["books_move", "move"] }}'
        sequence:
        - variables:
            _bm_input_data: >-
              {%- set raw = input_json | default('', true) -%}
              {%- if raw is mapping -%}{{ raw }}
              {%- elif raw is string and raw | trim != '' -%}{{ raw | trim | from_json(none) or {} }}
              {%- else -%}{{ {} }}{%- endif -%}
        - variables:
            _bm_title: "{{ (_bm_input_data.get('title', '') or '') | string | trim if _bm_input_data is mapping else '' }}"
            _bm_product_id_in: "{{ _bm_input_data.get('product_id', none) | int(none) if _bm_input_data is mapping else none }}"
            _bm_to_loc_id: "{{ _bm_input_data.get('to_location_id', none) | int(none) if _bm_input_data is mapping else none }}"
        - if: "{{ _bm_title == '' and _bm_product_id_in is none }}"
          then:
          - variables:
              result:
                status: error
                section: books
                mode: books_move
                message: title or product_id is required.
                coaching:
                - "Pass input_json: {\"title\": \"Book Title\", \"to_location_id\": 214}"
          - stop: books_move title required
            response_variable: result
        - if: "{{ _bm_to_loc_id is none }}"
          then:
          - variables:
              result:
                status: error
                section: books
                mode: books_move
                message: to_location_id is required.
                coaching:
                - "Use books_find or books_browse to look up location_ids."
          - stop: books_move to_location_id required
            response_variable: result
        # Resolve book — targeted lookup to avoid 256KB catalog limit
        - if: "{{ _bm_product_id_in is not none }}"
          then:
          - action: script.zen_dojotools_inventory
            response_variable: _bm_catalog_raw
            continue_on_error: true
            data:
              mode: catalog_find_product
              product_id: "{{ _bm_product_id_in }}"
          else:
          - action: script.zen_dojotools_inventory
            response_variable: _bm_catalog_raw
            continue_on_error: true
            data:
              mode: catalog_find_product
              item: "{{ _bm_title }}"
        - variables:
            _bm_book: >-
              {%- set r = _bm_catalog_raw if _bm_catalog_raw is mapping else {} -%}
              {%- set items = r.get('result', r.get('items', [])) -%}
              {%- set items = items if items is sequence and items is not string else [] -%}
              {%- if _bm_product_id_in is not none -%}
                {%- set ns = namespace(found=none) -%}
                {%- for b in items if b is mapping -%}
                  {%- if b.get('id') | int(0) == _bm_product_id_in -%}{%- set ns.found = b -%}{%- endif -%}
                {%- endfor -%}
                {{ ns.found | default(none, true) }}
              {%- else -%}
                {%- set ns = namespace(found=none) -%}
                {%- set title_norm = _bm_title | lower -%}
                {%- for b in items if b is mapping -%}
                  {%- if (b.get('name', '') or '') | lower == title_norm -%}{%- set ns.found = b -%}{%- endif -%}
                {%- endfor -%}
                {{ ns.found | default(none, true) }}
              {%- endif -%}
        - if: "{{ _bm_book is not mapping }}"
          then:
          - variables:
              result:
                status: not_found
                section: books
                mode: books_move
                message: "Book not found in catalog: {{ _bm_title }}"
                coaching:
                - Use books_search to verify the exact title, or pass product_id directly.
          - stop: books_move book not found
            response_variable: result
        - variables:
            _bm_product_id: "{{ _bm_book.get('id') | int(0) }}"
            _bm_from_loc_id: "{{ _bm_book.get('location_id') | int(0) }}"
        # Transfer stock
        - action: script.zen_dojotools_inventory
          response_variable: _bm_xfer_raw
          continue_on_error: true
          data:
            mode: stock_transfer_location
            product_id: "{{ _bm_product_id }}"
            to_location_id: "{{ _bm_to_loc_id }}"
            amount: 1
        # Resolve from/to location names
        - action: script.zen_dojotools_inventory
          response_variable: _bm_from_loc_raw
          continue_on_error: true
          data:
            mode: locations_find
            location_id: "{{ _bm_from_loc_id }}"
        - action: script.zen_dojotools_inventory
          response_variable: _bm_to_loc_raw
          continue_on_error: true
          data:
            mode: locations_find
            location_id: "{{ _bm_to_loc_id }}"
        - variables:
            _bm_from_loc_name: >-
              {%- set items = (_bm_from_loc_raw if _bm_from_loc_raw is mapping else {}).get('result', []) -%}
              {{ (items[0].get('name', '') if items | length > 0 and items[0] is mapping else '') }}
            _bm_to_loc_name: >-
              {%- set items = (_bm_to_loc_raw if _bm_to_loc_raw is mapping else {}).get('result', []) -%}
              {{ (items[0].get('name', '') if items | length > 0 and items[0] is mapping else '') }}
        - variables:
            result:
              status: moved
              section: books
              mode: books_move
              product_id: "{{ _bm_product_id }}"
              title: "{{ _bm_book.get('name', _bm_title) }}"
              from_location_id: "{{ _bm_from_loc_id }}"
              from_location_name: "{{ _bm_from_loc_name }}"
              to_location_id: "{{ _bm_to_loc_id }}"
              to_location_name: "{{ _bm_to_loc_name }}"
              caller_token: "{{ caller_token_norm }}"
        - stop: books_move done
          response_variable: result

      - conditions:
        - condition: template
          value_template: '{{ section_norm == "books" and mode_norm in ["books_loan", "loan"] }}'
        sequence:
        - variables:
            _bl_input_data: >-
              {%- set raw = input_json | default('', true) -%}
              {%- if raw is mapping -%}{{ raw }}
              {%- elif raw is string and raw | trim != '' -%}{{ raw | trim | from_json(none) or {} }}
              {%- else -%}{{ {} }}{%- endif -%}
        - variables:
            _bl_title: "{{ (_bl_input_data.get('title', '') or '') | string | trim if _bl_input_data is mapping else '' }}"
            _bl_borrower: "{{ (_bl_input_data.get('borrower', '') or '') | string | trim if _bl_input_data is mapping else '' }}"
            _bl_due_date: "{{ (_bl_input_data.get('due_date', '') or '') | string | trim if _bl_input_data is mapping else '' }}"
        - if: "{{ _bl_title == '' or _bl_borrower == '' }}"
          then:
          - variables:
              result:
                status: error
                section: books
                mode: books_loan
                message: title and borrower are required.
                coaching:
                - "Pass input_json: {\"title\": \"Eragon\", \"borrower\": \"Alex\", \"due_date\": \"2026-07-19\"}"
          - stop: books_loan missing required
            response_variable: result
        # Resolve book
        - action: script.zen_dojotools_inventory
          response_variable: _bl_catalog_raw
          continue_on_error: true
          data:
            mode: catalog_find_product
            item: "{{ _bl_title }}"
        - variables:
            _bl_book: >-
              {%- set r = _bl_catalog_raw if _bl_catalog_raw is mapping else {} -%}
              {%- set items = r.get('result', r.get('items', [])) -%}
              {%- set items = items if items is sequence and items is not string else [] -%}
              {%- set ns = namespace(found=none) -%}
              {%- set title_norm = _bl_title | lower -%}
              {%- for b in items if b is mapping -%}
                {%- if (b.get('name', '') or '') | lower == title_norm -%}{%- set ns.found = b -%}{%- endif -%}
              {%- endfor -%}
              {{ ns.found | default(none, true) }}
        - if: "{{ _bl_book is not mapping }}"
          then:
          - variables:
              result:
                status: not_found
                section: books
                mode: books_loan
                message: "Book not found: {{ _bl_title }}"
                coaching:
                - Use books_search to verify the exact title.
          - stop: books_loan book not found
            response_variable: result
        - variables:
            _bl_product_id: "{{ _bl_book.get('id') | int(0) }}"
            _bl_home_loc_id: "{{ _bl_book.get('location_id') | int(109) }}"
            _bl_loan_date: "{{ now().strftime('%Y-%m-%d') }}"
        # Set loan userfields via products_tag (book_loan_* fields added to products_tag)
        - action: script.zen_dojotools_inventory
          response_variable: _bl_uf_raw
          continue_on_error: true
          data:
            mode: products_tag
            product_id: "{{ _bl_product_id }}"
            book_loan_borrower: "{{ _bl_borrower }}"
            book_loan_date: "{{ _bl_loan_date }}"
            book_loan_due: "{{ _bl_due_date }}"
            book_loan_home_location_id: "{{ _bl_home_loc_id }}"
        # Move to On Loan (551)
        - action: script.zen_dojotools_inventory
          response_variable: _bl_xfer_raw
          continue_on_error: true
          data:
            mode: stock_transfer_location
            product_id: "{{ _bl_product_id }}"
            to_location_id: 551
            amount: 1
        - variables:
            result:
              status: loaned
              section: books
              mode: books_loan
              product_id: "{{ _bl_product_id }}"
              title: "{{ _bl_book.get('name', _bl_title) }}"
              borrower: "{{ _bl_borrower }}"
              loan_date: "{{ _bl_loan_date }}"
              due_date: "{{ _bl_due_date }}"
              home_location_id: "{{ _bl_home_loc_id }}"
              caller_token: "{{ caller_token_norm }}"
        - stop: books_loan done
          response_variable: result

      - conditions:
        - condition: template
          value_template: '{{ section_norm == "books" and mode_norm in ["books_return", "return"] }}'
        sequence:
        - variables:
            _br_input_data: >-
              {%- set raw = input_json | default('', true) -%}
              {%- if raw is mapping -%}{{ raw }}
              {%- elif raw is string and raw | trim != '' -%}{{ raw | trim | from_json(none) or {} }}
              {%- else -%}{{ {} }}{%- endif -%}
        - variables:
            _br_title: "{{ (_br_input_data.get('title', '') or '') | string | trim if _br_input_data is mapping else '' }}"
            _br_product_id_in: "{{ _br_input_data.get('product_id', none) | int(none) if _br_input_data is mapping else none }}"
        - if: "{{ _br_title == '' and _br_product_id_in is none }}"
          then:
          - variables:
              result:
                status: error
                section: books
                mode: books_return
                message: title or product_id is required.
          - stop: books_return missing required
            response_variable: result
        # Resolve book — use product_id direct path or title lookup
        - if: "{{ _br_product_id_in is not none }}"
          then:
          - action: script.zen_dojotools_inventory
            response_variable: _br_catalog_raw
            continue_on_error: true
            data:
              mode: catalog_find_product
              product_id: "{{ _br_product_id_in }}"
          else:
          - action: script.zen_dojotools_inventory
            response_variable: _br_catalog_raw
            continue_on_error: true
            data:
              mode: catalog_find_product
              item: "{{ _br_title }}"
        - variables:
            _br_book: >-
              {%- set r = _br_catalog_raw if _br_catalog_raw is mapping else {} -%}
              {%- set items = r.get('result', r.get('items', [])) -%}
              {%- set items = items if items is sequence and items is not string else [] -%}
              {%- set ns = namespace(found=none) -%}
              {%- if _br_product_id_in is not none -%}
                {%- for b in items if b is mapping -%}
                  {%- if b.get('id') | int(0) == _br_product_id_in -%}{%- set ns.found = b -%}{%- endif -%}
                {%- endfor -%}
              {%- else -%}
                {%- set title_norm = _br_title | lower -%}
                {%- for b in items if b is mapping -%}
                  {%- if (b.get('name', '') or '') | lower == title_norm -%}{%- set ns.found = b -%}{%- endif -%}
                {%- endfor -%}
              {%- endif -%}
              {{ ns.found | default(none, true) }}
        - if: "{{ _br_book is not mapping }}"
          then:
          - variables:
              result:
                status: not_found
                section: books
                mode: books_return
                message: "Book not found: {{ _br_title }}"
          - stop: books_return book not found
            response_variable: result
        - variables:
            _br_product_id: "{{ _br_book.get('id') | int(0) }}"
            _br_ufs: "{{ _br_book.get('userfields', {}) if _br_book.get('userfields') is mapping else {} }}"
        - variables:
            _br_home_loc_id: "{{ (_br_ufs.get('book_loan_home_location_id') or 109) | int(109) }}"
            _br_borrower: "{{ _br_ufs.get('book_loan_borrower', '') or '' }}"
        # Move back to home shelf
        - action: script.zen_dojotools_inventory
          response_variable: _br_xfer_raw
          continue_on_error: true
          data:
            mode: stock_transfer_location
            product_id: "{{ _br_product_id }}"
            to_location_id: "{{ _br_home_loc_id }}"
            amount: 1
        # Clear loan userfields via products_tag
        - action: script.zen_dojotools_inventory
          response_variable: _br_uf_raw
          continue_on_error: true
          data:
            mode: products_tag
            product_id: "{{ _br_product_id }}"
            book_loan_borrower: ""
            book_loan_date: ""
            book_loan_due: ""
        # Resolve home location name
        - action: script.zen_dojotools_inventory
          response_variable: _br_loc_raw
          continue_on_error: true
          data:
            mode: locations_find
            location_id: "{{ _br_home_loc_id }}"
        - variables:
            _br_loc_name: >-
              {%- set items = (_br_loc_raw if _br_loc_raw is mapping else {}).get('result', []) -%}
              {{ (items[0].get('name', '') if items | length > 0 and items[0] is mapping else '') }}
        - variables:
            result:
              status: returned
              section: books
              mode: books_return
              product_id: "{{ _br_product_id }}"
              title: "{{ _br_book.get('name', _br_title) }}"
              returned_by: "{{ _br_borrower }}"
              returned_to_location_id: "{{ _br_home_loc_id }}"
              returned_to_location_name: "{{ _br_loc_name }}"
              caller_token: "{{ caller_token_norm }}"
        - stop: books_return done
          response_variable: result

      - conditions:
        - condition: template
          value_template: '{{ section_norm == "books" and mode_norm in ["books_configure", "configure"] }}'
        sequence:
        # Deploy book userfields (idempotent)
        - action: script.zen_dojotools_inventory
          response_variable: _bc_uf_raw
          continue_on_error: true
          data:
            mode: userfields_deploy
            entity: products
            values_json: >-
              {{
                [
                  {'field_name': 'book_author', 'field_caption': 'Author (Last, First or full name)', 'field_type': 'text-single-line'},
                  {'field_name': 'book_isbn', 'field_caption': 'ISBN-13 (or ISBN-10)', 'field_type': 'text-single-line'},
                  {'field_name': 'book_series', 'field_caption': 'Series name and volume (e.g. Inheritance #1)', 'field_type': 'text-single-line'},
                  {'field_name': 'book_genre', 'field_caption': 'Genre (e.g. sci-fi, fantasy, non-fiction)', 'field_type': 'text-single-line'},
                  {'field_name': 'book_loan_borrower', 'field_caption': 'Borrower name', 'field_type': 'text-single-line'},
                  {'field_name': 'book_loan_date', 'field_caption': 'Loan date (ISO)', 'field_type': 'text-single-line'},
                  {'field_name': 'book_loan_due', 'field_caption': 'Loan due date (ISO)', 'field_type': 'text-single-line'},
                  {'field_name': 'book_loan_home_location_id', 'field_caption': 'Home shelf location_id before loan', 'field_type': 'number-integer'}
                ] | tojson
              }}
        # Ensure On Loan location exists
        - action: script.zen_dojotools_inventory
          response_variable: _bc_loc_check_raw
          continue_on_error: true
          data:
            mode: locations_find
            item: On Loan
        - variables:
            _bc_loan_loc_exists: >-
              {%- set r = _bc_loc_check_raw if _bc_loc_check_raw is mapping else {} -%}
              {%- set items = r.get('result', []) -%}
              {{ items | length > 0 }}
            _bc_loan_loc_id: >-
              {%- set r = _bc_loc_check_raw if _bc_loc_check_raw is mapping else {} -%}
              {%- set items = r.get('result', []) -%}
              {{ items[0].get('id') | int(0) if items | length > 0 and items[0] is mapping else 0 }}
        - if: "{{ not _bc_loan_loc_exists }}"
          then:
          - action: script.zen_dojotools_inventory
            response_variable: _bc_loc_create_raw
            continue_on_error: true
            data:
              mode: locations_add
              location: On Loan
              note: Virtual location for books currently loaned out.
              confirm_action: true
        - variables:
            result:
              status: ok
              section: books
              mode: books_configure
              schema_version: "1.4.0"
              userfields_deployed: 8
              loan_location_id: "{{ _bc_loan_loc_id if _bc_loan_loc_id > 0 else 551 }}"
              loan_location_existed: "{{ _bc_loan_loc_exists }}"
              caller_token: "{{ caller_token_norm }}"
        - stop: books_configure done
          response_variable: result

    - if: "{{ section_norm == 'books' and _bk_mode is defined }}"
      then:
      # Shared enrichment: loc_map (per unique loc_id) + pathfind dedup + filter
      - variables:
          _bk_filters_safe: "{{ _bk_filters if _bk_filters is mapping else {} }}"
          _bk_unique_loc_ids: >-
            {%- set ns = namespace(seen=[], ids=[]) -%}
            {%- for b in _bk_pre if b is mapping -%}
              {%- set lid = b.get('location_id') -%}
              {%- if lid is not none and lid | string not in ns.seen -%}
                {%- set ns.seen = ns.seen + [lid | string] -%}
                {%- set ns.ids = ns.ids + [lid | string] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.ids }}
          _bk_unique_areas: >-
            {%- set ns = namespace(seen=[], areas=[]) -%}
            {%- for b in _bk_pre if b is mapping -%}
              {%- set a = (b.get('homeassistant_area') or '') | trim -%}
              {%- if a != '' and a not in ns.seen -%}
                {%- set ns.seen = ns.seen + [a] -%}
                {%- set ns.areas = ns.areas + [a] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.areas }}
      - variables:
          _bk_source: >-
            {%- set p = _bk_filters_safe.get('person', '') | trim -%}
            {%- if p != '' -%}{{ p }}
            {%- else -%}
              {%- set hh_cab = label_entities('Zen Household Cabinet') | select('match', 'sensor\\.') | list | first | default('') -%}
              {%- set hp = (state_attr(hh_cab, 'variables') or {}).get('household_profile', {}) -%}
              {%- set hp = hp if hp is mapping else {} -%}
              {{ hp.get('default_room', 'front_hall') }}
            {%- endif -%}
      - repeat:
          for_each: "{{ _bk_unique_loc_ids }}"
          sequence:
          - action: script.zen_dojotools_inventory
            response_variable: _bk_loc_raw
            continue_on_error: true
            data:
              mode: locations_find
              location_id: "{{ repeat.item | int }}"
          - variables:
              _bk_loc_name: >-
                {%- set r = _bk_loc_raw if _bk_loc_raw is mapping else {} -%}
                {%- set items = r.get('result', []) -%}
                {{ (items[0].get('name', '') if items | length > 0 and items[0] is mapping else '') }}
              _bk_loc_map: >-
                {{ (_bk_loc_map if _bk_loc_map is mapping else {}) | combine({repeat.item: _bk_loc_name}) }}
      - repeat:
          for_each: "{{ _bk_unique_areas }}"
          sequence:
          - action: script.zen_dojotools_room_manager
            response_variable: _bk_pf_raw
            continue_on_error: true
            data:
              mode: pathfind
              pathfind: "{{ {'start': _bk_source, 'destination': repeat.item} | tojson }}"
          - variables:
              _bk_pf_entry: >-
                {%- set r = _bk_pf_raw if _bk_pf_raw is mapping else {} -%}
                {{ r.get('path', []) }}
              _bk_paths: >-
                {{ (_bk_paths if _bk_paths is mapping else {}) | combine({repeat.item: _bk_pf_entry}) }}
      - variables:
          _bk_enriched: >-
            {%- set ns = namespace(out=[]) -%}
            {%- for b in _bk_pre if b is mapping -%}
              {%- set loc_name = (_bk_loc_map if _bk_loc_map is mapping else {}).get(b.get('location_id') | string, '') -%}
              {%- set area = (b.get('homeassistant_area') or '') | trim -%}
              {%- set dirs = (_bk_paths if _bk_paths is mapping else {}).get(area, []) -%}
              {%- set ns.out = ns.out + [b | combine({'location_name': loc_name, 'directions': dirs})] -%}
            {%- endfor -%}
            {{ ns.out }}
      - variables:
          _bk_final: >-
            {%- set ns = namespace(out=[]) -%}
            {%- set f = _bk_filters_safe -%}
            {%- if _bk_mode == 'books_browse' -%}
              {{ _bk_enriched }}
            {%- elif _bk_mode == 'books_find' -%}
              {%- set f_author   = f.get('author', '') -%}
              {%- set f_genre    = f.get('genre', '') -%}
              {%- set f_series   = f.get('series', '') -%}
              {%- set f_loc_id   = f.get('location_id') -%}
              {%- set f_loc_name = f.get('location_name', '') -%}
              {%- for b in _bk_enriched if b is mapping -%}
                {%- set ufs = b.get('userfields', {}) if b is mapping else {} -%}
                {%- set pass_author   = f_author   == '' or f_author   in (ufs.get('book_author', '') or '') | lower -%}
                {%- set pass_genre    = f_genre    == '' or f_genre    in (ufs.get('book_genre',  '') or '') | lower -%}
                {%- set pass_series   = f_series   == '' or f_series   in (ufs.get('book_series', '') or '') | lower -%}
                {%- set pass_loc_id   = f_loc_id   is none or b.get('location_id') == f_loc_id -%}
                {%- set pass_loc_name = f_loc_name == '' or f_loc_name in (b.get('location_name', '') or '') | lower -%}
                {%- if pass_author and pass_genre and pass_series and pass_loc_id and pass_loc_name -%}
                  {%- set ns.out = ns.out + [b] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out }}
            {%- elif _bk_mode == 'books_search' -%}
              {%- set q = f.get('query', '') -%}
              {%- if q == '' -%}
                {{ _bk_enriched }}
              {%- else -%}
                {%- for b in _bk_enriched if b is mapping -%}
                  {%- set ufs = b.get('userfields', {}) if b is mapping else {} -%}
                  {%- set title  = (b.get('name', '') or '') | lower -%}
                  {%- set author = (ufs.get('book_author', '') or '') | lower -%}
                  {%- set series = (ufs.get('book_series', '') or '') | lower -%}
                  {%- if q in title or q in author or q in series -%}
                    {%- set ns.out = ns.out + [b] -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.out }}
              {%- endif -%}
            {%- endif -%}
          result:
            status: ok
            section: books
            mode: "{{ _bk_mode }}"
            source: "{{ _bk_source }}"
            filters: "{{ _bk_filters_safe }}"
            total: "{{ _bk_final | length }}"
            books: "{{ _bk_final }}"
            caller_token: "{{ caller_token_norm }}"
      - stop: books done
        response_variable: result

    - variables:
        result:
          status: error
          tool: Zen DojoTools Library
          section: "{{ section_norm }}"
          stack: "{{ stack_norm }}"
          mode: "{{ mode_norm }}"
          message: "Unknown stack/mode. Use mode=stacks_list to see registered stacks, or mode=help with stack=<name>."
          caller_token: "{{ caller_token_norm }}"
    - stop: library unknown
      response_variable: result

