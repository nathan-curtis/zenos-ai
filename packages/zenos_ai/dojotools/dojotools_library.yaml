###############################################################################
# ZenOS-AI DojoTools: Library
# Version: 5.5.0
#
# Knowledge broker and Lens owner for the Monastery.
#
# The Library owns and coordinates all Lens provider interfaces. It is NOT a
# utility drawer — it is the agent-facing surface that routes knowledge
# requests to registered Lens providers (Stacks section = Paperless-NGX),
# normalizes evidence output, and fails soft when a provider is absent.
#
# Lens contract:
#   Provider registration: zen_stack_paperless writes config to integrations_config.paperless_ngx
#   Failure policy: soft — missing or misconfigured provider returns status=error, never raises
#   Redaction default: document content is redacted unless include_content=true is passed
#   Consumer expectations: Inspect, Index, Query, Room Manager call stacks_by_anchor or
#     stacks_document_lens to receive article_evidence leaves. They do NOT call zen_stack_paperless
#     directly — Library is the single entry point.
#
# Sections:
#   section=stacks   -- Lens provider stack (paperless, radar, wiki) — use stack= to pick
#   section=radar    -- Zammad service desk / ticket evidence (calls zen_stack_radar)
#
# MCP-facing: zen_dojotools_library  <- expose this to MCP
#
# History:
#   5.1.0-retired  Bundled in paperless_ngx.yaml (Paperless was sole Lens provider)
#   5.2.0          Moved back to dojotools/ -- file boundary, not runtime, change
#   5.3.0          Utility section (hash_md5/slugify/library/library_2) fully retired
#   5.4.0          Docs refactor: Library is knowledge broker + Lens owner (#10042)
#   5.5.0          Radar section added — zen_stack_radar proxies to zen_dojotools_servicedesk
###############################################################################

script:
  zen_dojotools_library:
    alias: Zen DojoTools Library
    description: >
      The Library — knowledge broker and Lens owner for the Monastery. Owns and
      coordinates all Lens provider interfaces; routes requests to registered
      providers (section=stacks → Paperless-NGX), normalizes evidence output,
      and fails soft when a provider is absent or misconfigured. Consumers
      (Inspect, Index, Query, Room Manager) call Library — never providers
      directly. Content is redacted by default; pass include_content=true to
      opt in. Use mode=help for all sections and operations.
    mode: parallel
    icon: mdi:library
    fields:
      section:
        name: Section
        description: Library department — always stacks.
        selector:
          select:
            options:
            - stacks
        default: stacks
      stack:
        name: Stack
        description: "Which knowledge stack. paperless=documents, radar=tickets, wiki=wiki pages."
        selector:
          select:
            options:
            - paperless
            - radar
            - wiki
      mode:
        name: Mode
        description: "Generic: get, find, list, configure, by_anchor. Paperless legacy: stacks_search, stacks_document_get, etc."
        selector:
          select:
            options:
            - help
            - get
            - find
            - list
            - configure
            - by_anchor
            - stacks_configure
            - stacks_search
            - stacks_document_get
            - stacks_document_lens
            - stacks_similar
            - stacks_by_anchor
            - stacks_tags_list
            - stacks_tag_audit
            - stacks_correspondents_list
            - stacks_document_types_list
            - stacks_storage_paths_list
            - stacks_task_status
            - stacks_correspondent_create
            - stacks_tag_create
            - stacks_document_type_create
            - stacks_storage_path_create
            - stacks_document_update
            - stacks_document_tag
            - stacks_document_delete
            - stacks_document_notes
            - stacks_note_add
            - stacks_bulk_edit
            - stacks_correspondent_get
            - stacks_by_company
            - stacks_document_restore
            - stacks_list
            - tool_manifest
        default: help
      query:
        name: Library Query / Input
        description: Legacy text input or Stacks search query.
        selector:
          text:
            multiline: false
      input_json:
        name: Input JSON
        description: Structured JSON payload for section modes.
        selector:
          text:
            multiline: true
      caller_token:
        name: Caller Token
        description: Opaque token passed through for correlation.
        selector:
          text:

    sequence:
    - variables:
        caller_token_norm: "{{ caller_token | default('') }}"
        section_norm: "{{ section | default('stacks') | string | trim | lower }}"
        stack_norm: "{{ stack | default('', true) | string | trim | lower }}"
        mode_norm: "{{ mode | default('help') | string | trim | lower }}"
        query_norm: "{{ query | default('') | string | trim }}"
        input_json_norm: >-
          {%- set raw = input_json | default('', true) -%}
          {%- if raw is mapping -%}{{ raw | tojson }}
          {%- elif raw is string and raw | trim != '' -%}{{ raw | trim }}
          {%- else -%}{{ {} | tojson }}{%- endif -%}
        input_data: >-
          {%- set raw = input_json | default('', true) -%}
          {%- if raw is mapping -%}{{ raw }}
          {%- elif raw is string and raw | trim != '' -%}{{ raw | from_json | default({}) }}
          {%- else -%}{{ {} }}{%- endif -%}
        stacks_modes:
          help:
            intent: Return Library/Stacks help.
            reads: none
          stacks_configure:
            intent: Inspect Paperless config state. Gate 1 is read-only.
            reads: household cabinet integrations_config.paperless_ngx
          stacks_search:
            intent: Full-text search Paperless documents.
            needs: [query OR input_json.query]
            endpoint: /api/documents/?query=
          stacks_document_get:
            intent: Return one Paperless document metadata record.
            needs: [input_json.document_id]
            endpoint: /api/documents/{document_id}/
          stacks_document_lens:
            intent: Return normalized document/evidence leaf.
            needs: [input_json.document_id]
            endpoint: /api/documents/{document_id}/
          stacks_similar:
            intent: Find documents similar to one document ID.
            needs: [input_json.document_id]
            endpoint: /api/documents/?more_like_id={document_id}
          stacks_tags_list:
            intent: List Paperless tags.
            endpoint: /api/tags/
          stacks_tag_audit:
            intent: Compare Paperless tags to HA labels. Read-only Gate 1.5 taxonomy bridge.
            endpoint: /api/tags/
          stacks_correspondents_list:
            intent: List Paperless correspondents.
            endpoint: /api/correspondents/
          stacks_document_types_list:
            intent: List Paperless document types.
            endpoint: /api/document_types/
          stacks_storage_paths_list:
            intent: List Paperless storage paths.
            endpoint: /api/storage_paths/
          stacks_task_status:
            intent: Inspect async consume task status by task UUID.
            needs: [input_json.task_id]
            endpoint: /api/tasks/?task_id={task_id}
          stacks_list:
            intent: Directory of registered Lens stack providers with live status.
            reads: lens_registry cabinet drawer + provider tool_manifest pings
        radar_modes:
          help:
            intent: Return radar section help.
            reads: none
          configure:
            intent: Inspect Zammad config state. Read-only.
            reads: household cabinet integrations_config.fulfillment
          by_anchor:
            intent: Find service desk tickets linked to a typed anchor (label/person/area/ticket).
            needs: [input_json.anchor_type, input_json.anchor_value]
            proxies_to: zen_dojotools_servicedesk tickets_by_anchor
          get:
            intent: Return one ticket by ID with anchor_contexts evidence.
            needs: [input_json.ticket_id]
            proxies_to: zen_dojotools_servicedesk ticket_get
          find:
            intent: Search tickets by query string.
            needs: [input_json.query OR query field]
            proxies_to: zen_dojotools_servicedesk ticket_find
          list:
            intent: List open tickets. No anchor required.
            proxies_to: zen_dojotools_servicedesk ticket_list

    - choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm == "tool_manifest" }}'
        sequence:
        - action: script.zen_stack_paperless
          response_variable: _paperless_manifest
          continue_on_error: true
          data:
            mode: tool_manifest
            caller_token: "{{ caller_token_norm }}"
        - action: script.zen_stack_radar
          response_variable: _radar_manifest
          continue_on_error: true
          data:
            mode: tool_manifest
            caller_token: "{{ caller_token_norm }}"
        - variables:
            result: >-
              {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
              {{- MF.tool_manifest(
                tool='zen_dojotools_library',
                display_name='Library — Knowledge Broker and Lens Owner',
                tier='dojotools',
                version='5.5.0',
                health={'configured': true, 'status': 'ok', 'notes': []},
                required_labels=['dojotools'],
                optional_labels=['library', 'documents', 'paperless', 'radar'],
                consumes=['label', 'person', 'area_id', 'zone', 'concept', 'ticket'],
                returns=['document_evidence', 'ticket_evidence'],
                failure_policy='soft',
                content_policy='redacted_by_default',
                risk_class='read_redacted',
                modes={'lookup': 'stacks_by_anchor', 'radar_lookup': 'radar_tickets_by_anchor', 'manifest': 'tool_manifest'},
                children=[{
                  'tool': 'zen_stack_paperless',
                  'stack': 'stacks',
                  'manifest': _paperless_manifest if _paperless_manifest is mapping else {},
                  'manifest_via': {'tool': 'zen_dojotools_library', 'mode': 'tool_manifest'}
                }, {
                  'tool': 'zen_stack_radar',
                  'stack': 'radar',
                  'manifest': _radar_manifest if _radar_manifest is mapping else {},
                  'manifest_via': {'tool': 'zen_dojotools_library', 'mode': 'tool_manifest'}
                }],
                icon='mdi:bookshelf',
                color='brown',

                caller_token=caller_token_norm
              ) | from_json -}}
        - stop: library tool manifest
          response_variable: result

    - choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm == "help" }}'
        sequence:
        - variables:
            result:
              status: info
              tool: zen_dojotools_library
              version: "5.4.0"
              mode: help
              description: >-
                Knowledge broker and Lens owner for the Monastery. Routes knowledge requests to
                registered Lens providers and normalizes evidence output. Consumers (Inspect, Index,
                Query, Room Manager) call Library — never providers directly.
              lens_contract:
                provider_registration: >-
                  Providers write config to integrations_config.<provider> via zen_sutra_filecabinet.
                  Library reads that config on each call to resolve the provider endpoint.
                failure_policy: >-
                  soft — missing or misconfigured provider returns status=error, never raises.
                  Callers must check status and degrade gracefully.
                redaction_default: >-
                  Document content is redacted unless include_content=true is passed.
                  Consumers should not rely on content being present by default.
                consumers: >-
                  Inspect, Index, Query, and Room Manager consume article_evidence leaves via
                  stacks_by_anchor or stacks_document_lens. They call Library, not zen_stack_paperless.
              sections:
                stacks:
                  description: >-
                    Paperless-NGX document search, evidence, and tag operations.
                    Provider: zen_stack_paperless (calls zen_sutra_paperless internally).
                    Fails soft if Paperless is not configured.
                  modes: [stacks_search, stacks_document_get, stacks_document_lens, stacks_similar,
                    stacks_by_anchor, stacks_tags_list, stacks_tag_audit, stacks_correspondents_list,
                    stacks_document_types_list, stacks_storage_paths_list, stacks_task_status,
                    stacks_configure, stacks_document_update, stacks_document_tag,
                    stacks_document_delete, stacks_document_notes, stacks_note_add, stacks_bulk_edit,
                    stacks_correspondent_get, stacks_correspondent_create, stacks_tag_create,
                    stacks_document_type_create, stacks_storage_path_create, stacks_by_company,
                    stacks_document_restore, stacks_list]
                  example: "section=stacks mode=stacks_search query=invoice"
        - stop: library help
          response_variable: result

    - choose:
      - conditions:
        - condition: template
          value_template: '{{ section_norm == "stacks" and mode_norm == "help" }}'
        sequence:
        - variables:
            result:
              status: info
              tool: Zen DojoTools Library
              section: stacks
              mode: help
              message: Stacks is the Paperless-NGX document/evidence department. Gate 1 is read-only.
              cases: "{{ stacks_modes }}"
              caller_token: "{{ caller_token_norm }}"
        - stop: stacks help
          response_variable: result
      - conditions:
        - condition: template
          value_template: '{{ stack_norm in ["paperless", ""] and mode_norm in ["get", "find", "list", "configure", "by_anchor"] }}'
        sequence:
        - variables:
            _paperless_mode_map:
              get: stacks_document_get
              find: stacks_search
              list: stacks_search
              configure: stacks_configure
              by_anchor: stacks_by_anchor
            _paperless_mapped_mode: "{{ _paperless_mode_map.get(mode_norm, mode_norm) }}"
        - action: script.zen_dojotools_library
          response_variable: _paperless_generic_result
          continue_on_error: true
          data:
            section: stacks
            mode: "{{ _paperless_mapped_mode }}"
            input_json: "{{ input_json_norm }}"
            query: "{{ query_norm }}"
            caller_token: "{{ caller_token_norm }}"
        - variables:
            result: >-
              {%- set r = _paperless_generic_result if _paperless_generic_result is mapping else {} -%}
              {{ r | combine({'stack': 'paperless', 'library_mode': mode_norm}, recursive=true) }}
        - stop: paperless generic verb done
          response_variable: result
      - conditions:
        - condition: template
          value_template: '{{ mode_norm == "stacks_list" }}'
        sequence:
        - action: script.zen_stack_paperless
          response_variable: _sl_paperless_raw
          continue_on_error: true
          data:
            mode: tool_manifest
            caller_token: "{{ caller_token_norm }}"
        - action: script.zen_stack_radar
          response_variable: _sl_radar_raw
          continue_on_error: true
          data:
            mode: tool_manifest
            caller_token: "{{ caller_token_norm }}"
        - variables:
            _sl_pm: "{{ _sl_paperless_raw if _sl_paperless_raw is mapping else {} }}"
            _sl_rm: "{{ _sl_radar_raw if _sl_radar_raw is mapping else {} }}"
            _sl_paperless_ok: "{{ _sl_pm.get('status') in ['ok', 'success', 'info'] }}"
            _sl_radar_ok: "{{ _sl_rm.get('status') in ['ok', 'success', 'info'] }}"
            _sl_paperless_configured: "{{ _sl_pm.get('health', {}).get('configured', false) if _sl_pm is mapping else false }}"
            _sl_radar_configured: "{{ _sl_rm.get('health', {}).get('configured', false) if _sl_rm is mapping else false }}"
        - variables:
            result:
              status: success
              tool: zen_dojotools_library
              mode: stacks_list
              total: 3
              available: "{{ ([true, _sl_paperless_ok, _sl_radar_ok] | select('equalto', true) | list | count) }}"
              stacks:
                - stack: wiki
                  provider: zen_sutra_wikijs
                  backend: Wiki.js (GraphQL)
                  status: available
                  capabilities: [get, find, list, configure, by_anchor]
                  call_via: "zen_dojotools_library section=stacks stack=wiki mode=<verb>"
                  notes: Always available. No separate configuration required.
                - stack: paperless
                  provider: zen_stack_paperless
                  backend: Paperless-NGX
                  status: "{{ 'available' if _sl_paperless_ok else 'unavailable' }}"
                  configured: "{{ _sl_paperless_configured }}"
                  capabilities: [get, find, list, configure, by_anchor]
                  call_via: "zen_dojotools_library section=stacks stack=paperless mode=<verb>"
                  manifest: "{{ _sl_pm }}"
                - stack: radar
                  provider: zen_stack_radar
                  backend: Zammad (Service Desk)
                  status: "{{ 'available' if _sl_radar_ok else 'unavailable' }}"
                  configured: "{{ _sl_radar_configured }}"
                  capabilities: [get, find, list, configure, by_anchor]
                  call_via: "zen_dojotools_library section=stacks stack=radar mode=<verb>"
                  manifest: "{{ _sl_rm }}"
              caller_token: "{{ caller_token_norm }}"
        - stop: stacks list
          response_variable: result

      - conditions:
        - condition: template
          value_template: '{{ section_norm == "stacks" and mode_norm == "stacks_configure" }}'
        sequence:
        - variables:
            _hh: "{{ states('sensor.zen_default_household_cabinet_resolved') }}"
            _cfg_action: "{{ input_data.get('action', 'inspect') | string | trim | lower if input_data is mapping else 'inspect' }}"
            _cfg_url: "{{ input_data.get('url', '') | string | trim if input_data is mapping else '' }}"
            _cfg_api_version: "{{ input_data.get('api_version', 9) | int(9) if input_data is mapping else 9 }}"
        - variables:
            _cfg_valid_scheme: "{{ _cfg_url.startswith('https://') or _cfg_url.startswith('http://') }}"
            _cfg_insecure_scheme: "{{ _cfg_url.startswith('http://') }}"
        - action: script.zen_dojotools_filecabinet
          response_variable: _ic_fc_raw
          continue_on_error: true
          data:
            action_type: get
            volume_entity_id: "{{ _hh }}"
            path: integrations_config
        - variables:
            _integrations_config: >-
              {%- set _ic = _ic_fc_raw.get('value', {}) if _ic_fc_raw is mapping and _ic_fc_raw.get('status') == 'success' else {} -%}
              {{ _ic if _ic is mapping else {} }}
        - variables:
            _cfg: "{{ _integrations_config.get('paperless_ngx', {}) if _integrations_config is mapping else {} }}"

        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _cfg_action in ["inspect", "get", "read", ""] }}'
            sequence:
            - variables:
                result:
                  status: info
                  tool: Zen DojoTools Library
                  section: stacks
                  mode: stacks_configure
                  message: Pass input_json {"action":"set","url":"https://paperless.example","api_version":9} to write config, or {"action":"reset"} to remove Paperless config.
                  config:
                    url_configured: "{{ (_cfg.get('url', '') | string | trim) != '' if _cfg is mapping else false }}"
                    url: "{{ _cfg.get('url', '') if _cfg is mapping else '' }}"
                    api_version: "{{ _cfg.get('api_version', 9) | int(9) if _cfg is mapping else 9 }}"
                    token_configured: unknown_by_design
                  caller_token: "{{ caller_token_norm }}"
            - stop: stacks configure inspect
              response_variable: result
          - conditions:
            - condition: template
              value_template: '{{ _cfg_action not in ["set", "update", "reset"] }}'
            sequence:
            - variables:
                result:
                  status: error
                  tool: Zen DojoTools Library
                  section: stacks
                  mode: stacks_configure
                  message: "Unknown config action '{{ _cfg_action }}'. Use inspect, set, update, or reset."
                  caller_token: "{{ caller_token_norm }}"
            - stop: stacks configure bad action
              response_variable: result
          - conditions:
            - condition: template
              value_template: '{{ _cfg_action in ["set", "update"] and _cfg_url == "" }}'
            sequence:
            - variables:
                result:
                  status: error
                  tool: Zen DojoTools Library
                  section: stacks
                  mode: stacks_configure
                  message: url is required for config action set/update.
                  caller_token: "{{ caller_token_norm }}"
            - stop: stacks configure missing url
              response_variable: result
          - conditions:
            - condition: template
              value_template: '{{ _cfg_action in ["set", "update"] and not _cfg_valid_scheme }}'
            sequence:
            - variables:
                result:
                  status: error
                  tool: Zen DojoTools Library
                  section: stacks
                  mode: stacks_configure
                  message: URL must begin with https:// or http://.
                  url: "{{ _cfg_url }}"
                  caller_token: "{{ caller_token_norm }}"
            - stop: stacks configure invalid url
              response_variable: result

        - action: script.zen_dojotools_filecabinet
          response_variable: _ic_read
          continue_on_error: true
          data:
            action_type: read
            show_hidden_volumes: false
            volume_entity_id:
              - '{{ _hh }}'
            key: integrations_config

        - variables:
            _ic_raw: >-
              {%- set r = _ic_read.get('result', {}) if _ic_read is mapping else {} -%}
              {%- set r = r if r is mapping else (r | from_json if r is string else {}) -%}
              {%- set v = r.get('integrations_config', {}) -%}
              {%- set v = v.get('value', v) if v is mapping else {} -%}
              {{ v if v is mapping else (v | from_json if v is string else {}) }}
            _ic_exists: >-
              {%- set r = _ic_read.get('result', {}) if _ic_read is mapping else {} -%}
              {%- set r = r if r is mapping else (r | from_json if r is string else {}) -%}
              {{ 'integrations_config' in r }}

        - variables:
            _ic_next: >-
              {%- if _cfg_action == 'reset' -%}
                {%- set ns = namespace(out={}) -%}
                {%- for k, v in _ic_raw.items() if _ic_raw is mapping -%}
                  {%- if k != 'paperless_ngx' -%}{%- set ns.out = ns.out | combine({k: v}, recursive=true) -%}{%- endif -%}
                {%- endfor -%}
                {{ ns.out }}
              {%- else -%}
                {%- set existing_raw = _ic_raw.get('paperless_ngx', {}) if _ic_raw is mapping else {} -%}
                {%- set existing = namespace(out={}) -%}
                {%- for k, v in existing_raw.items() if existing_raw is mapping -%}
                  {%- if k != 'warning' -%}{%- set existing.out = existing.out | combine({k: v}, recursive=true) -%}{%- endif -%}
                {%- endfor -%}
                {%- set entry = existing.out | combine({'url': _cfg_url | regex_replace('/$',''), 'api_version': _cfg_api_version, 'status': 'configured', 'updated_at': now().isoformat()}, recursive=true) -%}
                {%- if _cfg_url.startswith('http://') -%}{%- set entry = entry | combine({'warning': 'insecure_http_scheme'}, recursive=true) -%}{%- endif -%}
                {{ _ic_raw | combine({'paperless_ngx': entry}) }}
              {%- endif -%}

        - action: script.zen_dojotools_filecabinet
          response_variable: _ic_write
          continue_on_error: true
          data:
            action_type: "{{ 'update' if _ic_exists else 'create' }}"
            force_action: true
            set_timestamp: true
            show_hidden_volumes: false
            volume_entity_id:
              - '{{ _hh }}'
            key: integrations_config
            value: "{{ _ic_next | tojson }}"

        - variables:
            _write_ok: "{{ _ic_write is mapping and _ic_write.get('status', '') in ['success', 'ok', 'warning'] }}"
            result:
              status: "{{ 'success' if _write_ok else 'error' }}"
              tool: Zen DojoTools Library
              section: stacks
              mode: stacks_configure
              message: "{{ 'Paperless config reset.' if _cfg_action == 'reset' else 'Paperless config stored.' }}"
              config:
                url_configured: "{{ _cfg_action != 'reset' }}"
                url: "{{ '' if _cfg_action == 'reset' else (_cfg_url | regex_replace('/$','')) }}"
                api_version: "{{ _cfg_api_version }}"
                token_configured: unknown_by_design
                warning: "{{ 'insecure_http_scheme' if _cfg_url.startswith('http://') else none }}"
              write_result: "{{ _ic_write }}"
              caller_token: "{{ caller_token_norm }}"
        - stop: stacks configure write
          response_variable: result

    - choose:
      - conditions:
        - condition: template
          value_template: '{{ section_norm == "stacks" and mode_norm in ["stacks_search","stacks_similar","stacks_by_anchor","stacks_tags_list","stacks_tag_audit","stacks_correspondents_list","stacks_document_types_list","stacks_storage_paths_list","stacks_task_status","stacks_document_get","stacks_document_lens"] }}'
        sequence:
        - variables:
            _document_id: "{{ input_data.get('document_id', '') | string | trim if input_data is mapping else '' }}"
            _task_id: "{{ input_data.get('task_id', '') | string | trim if input_data is mapping else '' }}"
            _search_query: "{{ input_data.get('query', query_norm) | string | trim if input_data is mapping else query_norm }}"
            _anchor_type: "{{ input_data.get('anchor_type', '') | string | trim | lower if input_data is mapping else '' }}"
            _anchor_ids: >-
              {%- set raw = input_data.get('anchor_ids', []) if input_data is mapping else [] -%}
              {%- if raw is string -%}
                {{ [raw | trim | lower] if raw | trim != '' else [] }}
              {%- elif raw is sequence -%}
                {%- set ns = namespace(v=[]) -%}
                {%- for x in raw -%}
                  {%- set sx = x | string | trim | lower -%}
                  {%- if sx != '' -%}{%- set ns.v = ns.v + [sx] -%}{%- endif -%}
                {%- endfor -%}
                {{ ns.v | unique | list }}
              {%- else -%}{{ [] }}{%- endif -%}
            _anchor_page_size: "{{ input_data.get('page_size', 50) | int(50) if input_data is mapping else 50 }}"
            _anchor_include_suggestions: "{{ input_data.get('include_suggestions', false) if input_data is mapping else false }}"
            _include_content: "{{ input_data.get('include_content', false) | bool if input_data is mapping else false }}"
            _endpoint: >-
              {%- if mode_norm == 'stacks_search' -%}
                /api/documents/?query={{ _search_query | urlencode }}
              {%- elif mode_norm == 'stacks_similar' -%}
                /api/documents/?more_like_id={{ _document_id | urlencode }}
              {%- elif mode_norm in ['stacks_document_get', 'stacks_document_lens'] -%}
                /api/documents/{{ _document_id | urlencode }}/
              {%- elif mode_norm == 'stacks_tags_list' -%}
                /api/tags/
              {%- elif mode_norm == 'stacks_tag_audit' -%}
                /api/tags/
              {%- elif mode_norm == 'stacks_correspondents_list' -%}
                /api/correspondents/
              {%- elif mode_norm == 'stacks_document_types_list' -%}
                /api/document_types/
              {%- elif mode_norm == 'stacks_storage_paths_list' -%}
                /api/storage_paths/
              {%- elif mode_norm == 'stacks_task_status' -%}
                /api/tasks/?task_id={{ _task_id | urlencode }}
              {%- else -%}{%- endif -%}
            _missing: >-
              {%- if mode_norm == 'stacks_search' and _search_query == '' -%}query
              {%- elif mode_norm in ['stacks_document_get', 'stacks_document_lens', 'stacks_similar'] and _document_id == '' -%}document_id
              {%- elif mode_norm == 'stacks_task_status' and _task_id == '' -%}task_id
              {%- elif mode_norm == 'stacks_by_anchor' and (_anchor_type == '' or _anchor_ids | length == 0) -%}anchor_type and anchor_ids
              {%- else -%}{%- endif -%}
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _missing | trim != "" }}'
            sequence:
            - variables:
                result:
                  status: error
                  tool: Zen DojoTools Library
                  section: stacks
                  mode: "{{ mode_norm }}"
                  message: "Missing required field: {{ _missing | trim }}"
                  caller_token: "{{ caller_token_norm }}"
            - stop: stacks missing input
              response_variable: result
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ mode_norm == "stacks_by_anchor" and _anchor_type != "label" }}'
            sequence:
            - variables:
                result:
                  status: success
                  tool: Zen DojoTools Library
                  section: stacks
                  mode: stacks_by_anchor
                  source:
                    system: paperless_ngx
                  anchor_query:
                    anchor_type: "{{ _anchor_type }}"
                    anchor_ids: "{{ _anchor_ids }}"
                    include_suggestions: "{{ _anchor_include_suggestions }}"
                  result:
                    count: 0
                    documents: []
                    content_redacted: true
                    source_count: 0
                    source_page_size: 0
                    reason: anchor_type_not_implemented_for_paperless
                  caller_token: "{{ caller_token_norm }}"
            - stop: stacks by anchor unsupported type
              response_variable: result
          - conditions:
            - condition: template
              value_template: '{{ mode_norm == "stacks_by_anchor" and _anchor_type == "label" }}'
            sequence:
            - action: script.zen_sutra_paperless
              response_variable: _anchor_tags_raw
              continue_on_error: true
              data:
                action_type: get
                endpoint: /api/tags/
            - variables:
                _anchor_tags_content: "{{ _anchor_tags_raw.get('result', {}).get('content', {}) if _anchor_tags_raw is mapping else {} }}"
                _anchor_tag_matches: >-
                  {%- set tags = _anchor_tags_content.get('results', []) if _anchor_tags_content is mapping and _anchor_tags_content.get('results', []) is sequence and _anchor_tags_content.get('results', []) is not string else [] -%}
                  {%- set ns = namespace(rows=[]) -%}
                  {%- for t in tags if t is mapping -%}
                    {%- set name = t.get('name', '') | string | trim -%}
                    {%- set slug = t.get('slug', name | slugify(separator='_')) | string | trim | lower -%}
                    {%- set tid = t.get('id', none) -%}
                    {%- if tid is not none and slug in _anchor_ids -%}
                      {%- set ns.rows = ns.rows + [{'id': tid, 'name': name, 'slug': slug}] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ ns.rows }}
                _anchor_tag_ids: >-
                  {%- set ns = namespace(ids=[]) -%}
                  {%- for t in _anchor_tag_matches if t is mapping and t.get('id', none) is not none -%}
                    {%- set ns.ids = ns.ids + [t.get('id')] -%}
                  {%- endfor -%}
                  {{ ns.ids | unique | list }}
            - choose:
              - conditions:
                - condition: template
                  value_template: '{{ _anchor_tag_ids | length == 0 }}'
                sequence:
                - variables:
                    result:
                      status: success
                      tool: Zen DojoTools Library
                      section: stacks
                      mode: stacks_by_anchor
                      source:
                        system: paperless_ngx
                      anchor_query:
                        anchor_type: label
                        anchor_ids: "{{ _anchor_ids }}"
                        include_suggestions: "{{ _anchor_include_suggestions }}"
                      result:
                        count: 0
                        documents: []
                        content_redacted: true
                        source_count: 0
                        source_page_size: 0
                        reason: no_matching_paperless_tags
                      trace:
                        endpoint: /api/tags/
                        method: GET
                      caller_token: "{{ caller_token_norm }}"
                - stop: stacks by anchor no tag matches
                  response_variable: result
            - variables:
                _anchor_docs_endpoint: "/api/documents/?tags__id__all={{ _anchor_tag_ids | join(',') | urlencode }}&page_size={{ _anchor_page_size | int(50) }}"
            - action: script.zen_sutra_paperless
              response_variable: _anchor_docs_raw
              continue_on_error: true
              data:
                action_type: get
                endpoint: "{{ _anchor_docs_endpoint }}"
            - variables:
                _anchor_docs_content: "{{ _anchor_docs_raw.get('result', {}).get('content', {}) if _anchor_docs_raw is mapping else {} }}"
                result: >-
                  {%- set docs = _anchor_docs_content.get('results', []) if _anchor_docs_content is mapping and _anchor_docs_content.get('results', []) is sequence and _anchor_docs_content.get('results', []) is not string else [] -%}
                  {%- set ns = namespace(out=[]) -%}
                  {%- for d in docs if d is mapping -%}
                    {%- set doc_tag_ids = d.get('tags', []) if d.get('tags', []) is sequence and d.get('tags', []) is not string else [] -%}
                    {%- set m = namespace(tags=[], anchors=[], labels=[], matched=[]) -%}
                    {%- for t in _anchor_tag_matches if t is mapping and t.get('id') in doc_tag_ids -%}
                      {%- set slug = t.get('slug', '') | string | lower -%}
                      {%- set m.tags = m.tags + [t] -%}
                      {%- set m.labels = m.labels + [{'label_id': slug, 'source': 'paperless_tag', 'mapped': true}] -%}
                      {%- set m.anchors = m.anchors + [{'type': 'label', 'id': slug, 'confidence': 'explicit', 'source': 'paperless_tag', 'provider': 'paperless_ngx', 'paperless_tag_id': t.get('id'), 'name': t.get('name', '')}] -%}
                      {%- set m.matched = m.matched + [slug] -%}
                    {%- endfor -%}
                    {%- if m.matched | length > 0 -%}
                      {%- set row = {
                        'id': d.get('id', none),
                        'correspondent': d.get('correspondent', none),
                        'document_type': d.get('document_type', none),
                        'storage_path': d.get('storage_path', none),
                        'title': '',
                        'title_redacted': true,
                        'tags': doc_tag_ids,
                        'paperless_tags': m.tags,
                        'paperless_tag_ids': doc_tag_ids,
                        'ha_labels': m.labels,
                        'anchor_contexts': m.anchors,
                        'matched_anchor_ids': m.matched | unique | list,
                        'created': d.get('created', none),
                        'created_date': d.get('created_date', none),
                        'modified': d.get('modified', none),
                        'added': d.get('added', none),
                        'deleted_at': d.get('deleted_at', none),
                        'page_count': d.get('page_count', none),
                        'mime_type': d.get('mime_type', none),
                        'notes_count': d.get('notes', []) | length if d.get('notes', []) is sequence and d.get('notes', []) is not string else 0,
                        'content_redacted': true,
                        'stack': {
                          'provider': 'paperless_ngx',
                          'source': 'paperless_ngx',
                          'object_type': 'document',
                          'source_id': d.get('id', none),
                          'evidence_id': 'paperless_ngx:document:' ~ (d.get('id', '') | string),
                          'lens_mode': 'stacks_by_anchor'
                        }
                      } -%}
                      {%- set ns.out = ns.out + [row] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{
                    {
                      'status': 'success' if _anchor_docs_raw is mapping and _anchor_docs_raw.get('status') == 'success' else (_anchor_docs_raw.get('status', 'error') if _anchor_docs_raw is mapping else 'error'),
                      'tool': 'Zen DojoTools Library',
                      'section': 'stacks',
                      'mode': 'stacks_by_anchor',
                      'source': _anchor_docs_raw.get('source', {'system': 'paperless_ngx'}) if _anchor_docs_raw is mapping else {'system': 'paperless_ngx'},
                      'anchor_query': {
                        'anchor_type': 'label',
                        'anchor_ids': _anchor_ids,
                        'include_suggestions': _anchor_include_suggestions
                      },
                      'result': {
                        'count': ns.out | length,
                        'documents': ns.out,
                        'content_redacted': true,
                        'source_count': _anchor_docs_content.get('count', 0) if _anchor_docs_content is mapping else 0,
                        'source_page_size': docs | length
                      },
                      'trace': {
                        'tag_endpoint': '/api/tags/',
                        'document_endpoint': _anchor_docs_endpoint,
                        'method': 'GET',
                        'http_status': _anchor_docs_raw.get('http_status', 0) if _anchor_docs_raw is mapping else 0
                      },
                      'caller_token': caller_token_norm
                    }
                  }}
            - stop: stacks by anchor label complete
              response_variable: result
        - action: script.zen_sutra_paperless
          response_variable: _stacks_raw
          continue_on_error: true
          data:
            action_type: get
            endpoint: "{{ _endpoint | trim }}"
        - variables:
            _content: "{{ _stacks_raw.get('result', {}).get('content', {}) if _stacks_raw is mapping else {} }}"
            _source: "{{ _stacks_raw.get('source', {'system': 'paperless_ngx'}) if _stacks_raw is mapping else {'system': 'paperless_ngx'} }}"
            _ha_label_index: "{{ labels() | list }}"
            _safe_content: >-
              {%- if mode_norm not in ['stacks_search', 'stacks_similar', 'stacks_document_get', 'stacks_document_lens'] -%}
                {{ _content }}
              {%- else -%}
              {%- macro safe_doc(d) -%}
                {%- if d is mapping -%}
                  {%- set tag_ns = namespace(paperless_tags=[], paperless_tag_ids=[], ha_labels=[], unmapped_tags=[]) -%}
                  {%- for t in d.get('tags', []) if d.get('tags', []) is sequence and d.get('tags', []) is not string -%}
                    {%- if t is mapping -%}
                      {%- set _tn = t.get('name', t.get('slug', t.get('id', ''))) | string | trim -%}
                      {%- set _ts = t.get('slug', _tn | slugify(separator='_')) | string | trim -%}
                      {%- set _tid = t.get('id', none) -%}
                    {%- elif t is string -%}
                      {%- set _tn = t | trim -%}
                      {%- set _ts = _tn | slugify(separator='_') -%}
                      {%- set _tid = none -%}
                    {%- else -%}
                      {%- set _tn = '' -%}
                      {%- set _ts = '' -%}
                      {%- set _tid = t -%}
                    {%- endif -%}
                    {%- if _tid is not none -%}{%- set tag_ns.paperless_tag_ids = tag_ns.paperless_tag_ids + [_tid] -%}{%- endif -%}
                    {%- if _tn != '' -%}{%- set tag_ns.paperless_tags = tag_ns.paperless_tags + [{'id': _tid, 'name': _tn, 'slug': _ts}] -%}{%- endif -%}
                    {%- if _ts != '' and _ts in _ha_label_index -%}
                      {%- set tag_ns.ha_labels = tag_ns.ha_labels + [{'label_id': _ts, 'source': 'paperless_tag', 'mapped': true}] -%}
                    {%- elif _tn != '' or _tid is not none -%}
                      {%- set tag_ns.unmapped_tags = tag_ns.unmapped_tags + [{'id': _tid, 'name': _tn, 'slug': _ts}] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ {
                    'id': d.get('id', none),
                    'correspondent': d.get('correspondent', none),
                    'document_type': d.get('document_type', none),
                    'storage_path': d.get('storage_path', none),
                    'title': d.get('title', ''),
                    'tags': d.get('tags', []),
                    'paperless_tags': tag_ns.paperless_tags,
                    'paperless_tag_ids': tag_ns.paperless_tag_ids,
                    'ha_labels': tag_ns.ha_labels,
                    'unmapped_tags': tag_ns.unmapped_tags,
                    'created': d.get('created', none),
                    'created_date': d.get('created_date', none),
                    'modified': d.get('modified', none),
                    'added': d.get('added', none),
                    'deleted_at': d.get('deleted_at', none),
                    'archive_serial_number': d.get('archive_serial_number', none),
                    'original_available': (d.get('original_file_name', '') | string | trim) != '',
                    'archive_available': (d.get('archived_file_name', '') | string | trim) != '',
                    'page_count': d.get('page_count', none),
                    'mime_type': d.get('mime_type', none),
                    'notes_count': d.get('notes', []) | length if d.get('notes', []) is sequence and d.get('notes', []) is not string else 0,
                    'custom_fields': d.get('custom_fields', []),
                    'user_can_change': d.get('user_can_change', false),
                    'search_hit': d.get('__search_hit__', none),
                    'content_redacted': not _include_content,
                    'content': d.get('content', '') if _include_content else none
                  } | tojson }}
                {%- else -%}{{ d }}{%- endif -%}
              {%- endmacro -%}
              {%- if _content is mapping and _content.get('results', none) is sequence and _content.get('results', none) is not string -%}
                {%- set ns = namespace(results=[]) -%}
                {%- for d in _content.get('results', []) -%}
                  {%- set rendered = safe_doc(d) -%}
                  {%- set ns.results = ns.results + [rendered | from_json | default({})] -%}
                {%- endfor -%}
                {{ {
                  'count': _content.get('count', 0),
                  'next': _content.get('next', none),
                  'previous': _content.get('previous', none),
                  'all': _content.get('all', []),
                  'results': ns.results,
                  'corrected_query': _content.get('corrected_query', none)
                } }}
              {%- elif _content is mapping and _content.get('id', none) is not none -%}
                {{ safe_doc(_content) | from_json | default({}) }}
              {%- else -%}
                {{ _content }}
              {%- endif -%}
              {%- endif -%}
            _base_response:
              status: "{{ _stacks_raw.get('status', 'error') if _stacks_raw is mapping else 'error' }}"
              tool: Zen DojoTools Library
              section: stacks
              mode: "{{ mode_norm }}"
              source: "{{ _source }}"
              result: "{{ _safe_content }}"
              trace:
                endpoint: "{{ _endpoint | trim }}"
                method: GET
                http_status: "{{ _stacks_raw.get('http_status', 0) if _stacks_raw is mapping else 0 }}"
                caller_token: "{{ caller_token_norm }}"
        - variables:
            result: >-
              {%- if mode_norm == 'stacks_tag_audit' and _content is mapping -%}
                {%- set tags = _content.get('results', []) if _content.get('results', []) is sequence and _content.get('results', []) is not string else [] -%}
                {%- set ns = namespace(paperless=[], paperless_slugs=[], mapped=[], unmapped=[], missing=[]) -%}
                {%- for t in tags -%}
                  {%- if t is mapping -%}
                    {%- set _name = t.get('name', '') | string | trim -%}
                    {%- set _slug = t.get('slug', _name | slugify(separator='_')) | string | trim -%}
                    {%- set _id = t.get('id', none) -%}
                    {%- set _row = {'id': _id, 'name': _name, 'slug': _slug, 'document_count': t.get('document_count', none)} -%}
                    {%- set ns.paperless = ns.paperless + [_row] -%}
                    {%- if _slug != '' -%}{%- set ns.paperless_slugs = ns.paperless_slugs + [_slug] -%}{%- endif -%}
                    {%- if _slug in _ha_label_index -%}
                      {%- set ns.mapped = ns.mapped + [_row | combine({'label_id': _slug})] -%}
                    {%- else -%}
                      {%- set ns.unmapped = ns.unmapped + [_row] -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endfor -%}
                {%- for lbl in _ha_label_index -%}
                  {%- if lbl not in ns.paperless_slugs -%}{%- set ns.missing = ns.missing + [lbl] -%}{%- endif -%}
                {%- endfor -%}
                {{
                  _base_response | combine({
                    'status': 'success' if _stacks_raw is mapping and _stacks_raw.get('status') == 'success' else _base_response.status,
                    'result': {
                      'paperless_tags': ns.paperless,
                      'paperless_count': ns.paperless | length,
                      'ha_label_count': _ha_label_index | length,
                      'mapped': ns.mapped,
                      'mapped_count': ns.mapped | length,
                      'unmapped_paperless_tags': ns.unmapped,
                      'unmapped_count': ns.unmapped | length,
                      'ha_labels_missing_paperless_tag': ns.missing,
                      'missing_count': ns.missing | length,
                      'doctrine': 'HA labels are canonical. Paperless tags are the document-side projection of HA label slugs.'
                    }
                  }, recursive=true)
                }}
              {%- elif mode_norm == 'stacks_by_anchor' -%}
                {%- set sc = (_safe_content | from_json) if _safe_content is string and (_safe_content | trim)[:1] == '{' else _safe_content -%}
                {%- set sc = sc if sc is mapping else {} -%}
                {%- set docs = sc.get('results', []) if sc.get('results', []) is sequence and sc.get('results', []) is not string else [] -%}
                {%- set ns = namespace(matches=[]) -%}
                {%- for doc in docs if doc is mapping -%}
                  {%- set ids = namespace(v=[]) -%}
                  {%- for anchor in doc.get('anchor_contexts', []) if anchor is mapping -%}
                    {%- if anchor.get('type', '') == _anchor_type and (anchor.get('id', '') | string | lower) in _anchor_ids -%}
                      {%- set ids.v = ids.v + [anchor.get('id', '') | string | lower] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {%- if _anchor_include_suggestions -%}
                    {%- for anchor in doc.get('anchor_suggestions', []) if anchor is mapping -%}
                      {%- if anchor.get('type', '') == _anchor_type and (anchor.get('id', '') | string | lower) in _anchor_ids -%}
                        {%- set ids.v = ids.v + [anchor.get('id', '') | string | lower] -%}
                      {%- endif -%}
                    {%- endfor -%}
                  {%- endif -%}
                  {%- if ids.v | length > 0 -%}
                    {%- set ns.matches = ns.matches + [doc | combine({'matched_anchor_ids': ids.v | unique | list})] -%}
                  {%- endif -%}
                {%- endfor -%}
                {{
                  _base_response | combine({
                    'status': 'success' if _stacks_raw is mapping and _stacks_raw.get('status') == 'success' else _base_response.status,
                    'anchor_query': {
                      'anchor_type': _anchor_type,
                      'anchor_ids': _anchor_ids,
                      'include_suggestions': _anchor_include_suggestions
                    },
                    'result': {
                      'count': ns.matches | length,
                      'documents': ns.matches,
                      'content_redacted': true,
                      'source_count': sc.get('count', 0),
                      'source_page_size': docs | length
                    }
                  })
                }}
              {%- elif mode_norm == 'stacks_document_lens' and _content is mapping -%}
                {%- set _tags = _content.get('tags', []) -%}
                {%- set _hit = _content.get('__search_hit__', none) -%}
                {{
                  _base_response | combine({
                    'status': 'ok' if _stacks_raw is mapping and _stacks_raw.get('status') == 'success' else _base_response.status,
                    'lens': {'type': 'document', 'focus': _content.get('title', _document_id)},
                    'stack': _safe_content.get('stack', {}) if _safe_content is mapping else {
                      'provider': 'paperless_ngx',
                      'source': 'paperless_ngx',
                      'object_type': 'document',
                      'source_id': _content.get('id', _document_id),
                      'evidence_id': 'paperless_ngx:document:' ~ (_content.get('id', _document_id) | string),
                      'lens_mode': 'stacks_document_lens'
                    },
                    'object': {
                      'object_type': 'document',
                      'object_id': _content.get('id', _document_id),
                      'name': _content.get('title', ''),
                      'status': 'indexed'
                    },
                    'identity': {
                      'paperless_id': _content.get('id', _document_id),
                      'title': _content.get('title', ''),
                      'correspondent': _content.get('correspondent', none),
                      'document_type': _content.get('document_type', none),
                      'created': _content.get('created', none)
                    },
                    'context': {
                      'tags': _tags,
                      'paperless_tags': _safe_content.get('paperless_tags', []) if _safe_content is mapping else [],
                      'paperless_tag_ids': _safe_content.get('paperless_tag_ids', []) if _safe_content is mapping else [],
                      'ha_labels': _safe_content.get('ha_labels', []) if _safe_content is mapping else [],
                      'unmapped_tags': _safe_content.get('unmapped_tags', []) if _safe_content is mapping else [],
                      'anchor_contexts': _safe_content.get('anchor_contexts', []) if _safe_content is mapping else [],
                      'anchor_suggestions': _safe_content.get('anchor_suggestions', []) if _safe_content is mapping else [],
                      'who': [],
                      'what': [],
                      'where': [],
                      'concepts': [],
                      'when': {
                        'created': _content.get('created', none),
                        'created_date': _content.get('created_date', none),
                        'added': _content.get('added', none),
                        'modified': _content.get('modified', none)
                      },
                      'linked_entities': [],
                      'project': none,
                      'contact_or_company': {
                        'paperless_correspondent_id': _content.get('correspondent'),
                        'resolve_name': {'section': 'stacks', 'mode': 'stacks_correspondent_get', 'input_json': {'correspondent_id': _content.get('correspondent')}},
                        'rolodex': {'case': 'company_find', 'note': 'Call resolve_name first, then use name as item'},
                        'all_docs': {'section': 'stacks', 'mode': 'stacks_by_company', 'input_json': {'correspondent_id': _content.get('correspondent')}}
                      } if _content.get('correspondent') is not none else none
                    },
                    'evidence': {
                      'evidence_id': 'paperless_ngx:document:' ~ (_content.get('id', _document_id) | string),
                      'provider': 'paperless_ngx',
                      'source_system': 'paperless_ngx',
                      'document_id': _content.get('id', _document_id),
                      'title': _content.get('title', ''),
                      'created': _content.get('created', none),
                      'content_redacted': true,
                      'archive_serial_number': _content.get('archive_serial_number', none),
                      'original_available': _content.get('original_file_name', '') != '',
                      'archive_available': _content.get('archived_file_name', '') != '',
                      'search_hit': _hit
                    },
                    'anchor_contexts': _safe_content.get('anchor_contexts', []) if _safe_content is mapping else [],
                    'anchor_suggestions': _safe_content.get('anchor_suggestions', []) if _safe_content is mapping else [],
                    'actions': [
                      {'action': 'inspect', 'payload': {'section': 'stacks', 'mode': 'stacks_document_get', 'input_json': {'document_id': _content.get('id', _document_id)}}},
                      {'action': 'correspondent_docs', 'payload': {'section': 'stacks', 'mode': 'stacks_by_company', 'input_json': {'correspondent_id': _content.get('correspondent')}}}
                    ] if _content.get('correspondent') is not none else [
                      {'action': 'inspect', 'payload': {'section': 'stacks', 'mode': 'stacks_document_get', 'input_json': {'document_id': _content.get('id', _document_id)}}}
                    ]
                  }, recursive=true)
                }}
              {%- else -%}
                {{ _base_response }}
              {%- endif -%}
        - stop: stacks read mode
          response_variable: result

    - choose:
      - conditions:
        - condition: template
          value_template: '{{ section_norm == "stacks" and mode_norm in ["stacks_correspondent_create","stacks_tag_create","stacks_document_type_create","stacks_storage_path_create"] }}'
        sequence:
        - variables:
            _create_name: "{{ input_data.get('name', '') | string | trim if input_data is mapping else '' }}"
            _create_colour: "{{ input_data.get('colour', none) if input_data is mapping else none }}"
            _create_path: "{{ input_data.get('path', '') | string | trim if input_data is mapping else '' }}"
            _create_slug: "{{ input_data.get('label_slug', _create_name) | string | trim | slugify(separator='_') if input_data is mapping else '' }}"
            _create_all_labels: "{{ labels() | list }}"
            _create_missing: >-
              {%- if _create_name == '' -%}name{%- else -%}{%- endif -%}
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _create_missing | trim != "" }}'
            sequence:
            - variables:
                result:
                  status: error
                  tool: Zen DojoTools Library
                  section: stacks
                  mode: "{{ mode_norm }}"
                  message: "Missing required field: {{ _create_missing | trim }}"
                  caller_token: "{{ caller_token_norm }}"
            - stop: stacks create missing name
              response_variable: result
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ mode_norm == "stacks_tag_create" and _create_slug not in _create_all_labels }}'
            sequence:
            - variables:
                result:
                  status: error
                  tool: Zen DojoTools Library
                  section: stacks
                  mode: stacks_tag_create
                  message: "Paperless tags are HA label projections. Create or choose HA label '{{ _create_slug }}' first."
                  label_slug: "{{ _create_slug }}"
                  available_sample: "{{ _create_all_labels[:20] }}"
                  caller_token: "{{ caller_token_norm }}"
            - stop: stacks tag create label missing
              response_variable: result
        - variables:
            _create_endpoint: >-
              {%- if mode_norm == 'stacks_correspondent_create' -%}/api/correspondents/
              {%- elif mode_norm == 'stacks_tag_create' -%}/api/tags/
              {%- elif mode_norm == 'stacks_document_type_create' -%}/api/document_types/
              {%- elif mode_norm == 'stacks_storage_path_create' -%}/api/storage_paths/
              {%- endif -%}
            _create_payload: >-
              {%- set _ns = namespace(p={'name': _create_name}) -%}
              {%- if mode_norm == 'stacks_tag_create' -%}
                {%- set _ns.p = _ns.p | combine({'slug': _create_slug}) -%}
              {%- endif -%}
              {%- if mode_norm == 'stacks_tag_create' and _create_colour is not none -%}
                {%- set _ns.p = _ns.p | combine({'colour': _create_colour | int}) -%}
              {%- endif -%}
              {%- if mode_norm == 'stacks_storage_path_create' and _create_path != '' -%}
                {%- set _ns.p = _ns.p | combine({'path': _create_path}) -%}
              {%- endif -%}
              {{ _ns.p | tojson }}
        - action: script.zen_sutra_paperless
          response_variable: _create_raw
          continue_on_error: true
          data:
            action_type: post
            endpoint: "{{ _create_endpoint | trim }}"
            payload: "{{ _create_payload }}"
        - variables:
            _create_content: "{{ _create_raw.get('result', {}).get('content', {}) if _create_raw is mapping else {} }}"
            result:
              status: "{{ _create_raw.get('status', 'error') if _create_raw is mapping else 'error' }}"
              tool: Zen DojoTools Library
              section: stacks
              mode: "{{ mode_norm }}"
              created: "{{ _create_content }}"
              trace:
                endpoint: "{{ _create_endpoint | trim }}"
                method: POST
                http_status: "{{ _create_raw.get('http_status', 0) if _create_raw is mapping else 0 }}"
                caller_token: "{{ caller_token_norm }}"
        - stop: stacks create
          response_variable: result

    - choose:
      - conditions:
        - condition: template
          value_template: '{{ section_norm == "stacks" and mode_norm in ["stacks_document_update","stacks_document_tag"] }}'
        sequence:
        - variables:
            _g3_document_id: "{{ input_data.get('document_id', '') | string | trim if input_data is mapping else '' }}"
            _g3_tag_ids_raw: >-
              {%- if input_data is mapping -%}
                {%- set _tid = input_data.get('tag_ids', none) -%}
                {%- set _add = input_data.get('add_tags', none) -%}
                {%- set _rem = input_data.get('remove_tags', none) -%}
                {{ _tid if _tid is not none else (_add if _add is not none else (_rem if _rem is not none else [])) }}
              {%- else -%}{{ [] }}{%- endif -%}
            _g3_tag_mode: >-
              {%- if input_data is mapping -%}
                {%- set _explicit = input_data.get('tag_mode', '') | string | trim | lower -%}
                {%- if _explicit in ['add','remove','replace'] -%}{{ _explicit }}
                {%- elif input_data.get('remove_tags', none) is not none -%}remove
                {%- elif input_data.get('add_tags', none) is not none -%}add
                {%- else -%}add{%- endif -%}
              {%- else -%}add{%- endif -%}
            _g3_product_name: "{{ input_data.get('product_name', '') | string | trim if input_data is mapping else '' }}"
        - variables:
            _g3_missing: >-
              {%- if _g3_document_id == '' -%}document_id
              {%- elif mode_norm == 'stacks_document_tag' and (_g3_tag_ids_raw is not sequence or (_g3_tag_ids_raw is sequence and _g3_tag_ids_raw is string) or (_g3_tag_ids_raw | list | count == 0)) -%}add_tags / remove_tags / tag_ids
              {%- else -%}{%- endif -%}
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _g3_missing | trim != "" }}'
            sequence:
            - variables:
                result:
                  status: error
                  tool: Zen DojoTools Library
                  section: stacks
                  mode: "{{ mode_norm }}"
                  message: "Missing required field: {{ _g3_missing | trim }}"
                  caller_token: "{{ caller_token_norm }}"
            - stop: stacks gate3 missing input
              response_variable: result
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ mode_norm == "stacks_document_tag" and _g3_tag_mode in ["add","remove"] }}'
            sequence:
            - action: script.zen_sutra_paperless
              response_variable: _g3_doc_raw
              continue_on_error: true
              data:
                action_type: get
                endpoint: "/api/documents/{{ _g3_document_id }}/"
            - variables:
                _g3_current_doc: "{{ _g3_doc_raw.get('result', {}).get('content', {}) if _g3_doc_raw is mapping else {} }}"
            - variables:
                _g3_current_tags: "{{ _g3_current_doc.get('tags', []) | list if _g3_current_doc is mapping else [] }}"
          default:
          - variables:
              _g3_current_tags: "{{ [] }}"
        - variables:
            _g3_patch_payload: >-
              {%- if mode_norm == 'stacks_document_update' -%}
                {%- set _ns = namespace(p={}) -%}
                {%- if input_data is mapping -%}
                  {%- set _t = input_data.get('title', '') | string | trim -%}
                  {%- if _t != '' -%}{%- set _ns.p = _ns.p | combine({'title': _t}) -%}{%- endif -%}
                  {%- set _cid = input_data.get('correspondent_id', none) -%}
                  {%- if _cid is not none -%}{%- set _ns.p = _ns.p | combine({'correspondent': _cid | int}) -%}{%- endif -%}
                  {%- set _did = input_data.get('document_type_id', none) -%}
                  {%- if _did is not none -%}{%- set _ns.p = _ns.p | combine({'document_type': _did | int}) -%}{%- endif -%}
                  {%- set _sid = input_data.get('storage_path_id', none) -%}
                  {%- if _sid is not none -%}{%- set _ns.p = _ns.p | combine({'storage_path': _sid | int}) -%}{%- endif -%}
                  {%- set _cr = input_data.get('created', '') | string | trim -%}
                  {%- if _cr != '' -%}{%- set _ns.p = _ns.p | combine({'created': _cr}) -%}{%- endif -%}
                {%- endif -%}
                {{ _ns.p | tojson }}
              {%- elif mode_norm == 'stacks_document_tag' -%}
                {%- set _in_ids = _g3_tag_ids_raw if _g3_tag_ids_raw is sequence and _g3_tag_ids_raw is not string else [] -%}
                {%- if _g3_tag_mode == 'replace' -%}
                  {{ {'tags': _in_ids | map('int') | list} | tojson }}
                {%- elif _g3_tag_mode == 'add' -%}
                  {%- set _ns = namespace(merged=[]) -%}
                  {%- for t in _g3_current_tags -%}{%- set _ns.merged = _ns.merged + [t | int] -%}{%- endfor -%}
                  {%- for t in _in_ids -%}
                    {%- if (t | int) not in _ns.merged -%}{%- set _ns.merged = _ns.merged + [t | int] -%}{%- endif -%}
                  {%- endfor -%}
                  {{ {'tags': _ns.merged} | tojson }}
                {%- elif _g3_tag_mode == 'remove' -%}
                  {%- set _remove_set = _in_ids | map('int') | list -%}
                  {%- set _ns = namespace(filtered=[]) -%}
                  {%- for t in _g3_current_tags -%}
                    {%- if (t | int) not in _remove_set -%}{%- set _ns.filtered = _ns.filtered + [t | int] -%}{%- endif -%}
                  {%- endfor -%}
                  {{ {'tags': _ns.filtered} | tojson }}
                {%- else -%}{{ {'tags': _in_ids | map('int') | list} | tojson }}{%- endif -%}
              {%- else -%}{{ {} | tojson }}{%- endif -%}
        - action: script.zen_sutra_paperless
          response_variable: _g3_raw
          continue_on_error: true
          data:
            action_type: patch
            endpoint: "/api/documents/{{ _g3_document_id }}/"
            payload: "{{ _g3_patch_payload }}"
        - variables:
            _g3_content: "{{ _g3_raw.get('result', {}).get('content', {}) if _g3_raw is mapping else {} }}"
            _g3_patched_ok: "{{ _g3_raw is mapping and _g3_raw.get('status', '') == 'success' }}"
            _g3_inv_notify_raw: none
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _g3_product_name != "" and _g3_patched_ok }}'
            sequence:
            - action: script.zen_dojotools_inventory
              continue_on_error: true
              response_variable: _g3_inv_notify_raw
              data:
                mode: product_ref_add
                item: "{{ _g3_product_name }}"
                ref_type: doc
                ref_id: "{{ _g3_document_id | int }}"
        - variables:
            _g3_inv_notified: "{{ _g3_inv_notify_raw is mapping and _g3_inv_notify_raw.get('status', '') == 'ok' }}"
        - variables:
            _g3_safe: >-
              {%- if _g3_content is mapping -%}
                {%- set _ns = namespace(safe={}) -%}
                {%- for k, v in _g3_content.items() if k != 'content' -%}
                  {%- set _ns.safe = _ns.safe | combine({k: v}) -%}
                {%- endfor -%}
                {{ _ns.safe | combine({'content_redacted': true}) }}
              {%- else -%}{{ _g3_content }}{%- endif -%}
            result:
              status: "{{ _g3_raw.get('status', 'error') if _g3_raw is mapping else 'error' }}"
              tool: Zen DojoTools Library
              section: stacks
              mode: "{{ mode_norm }}"
              updated: "{{ _g3_safe }}"
              inventory_notified: "{{ _g3_inv_notified }}"
              trace:
                endpoint: "/api/documents/{{ _g3_document_id }}/"
                method: PATCH
                payload_keys: >-
                  {%- if _g3_patch_payload is mapping -%}{{ _g3_patch_payload | list }}
                  {%- elif _g3_patch_payload is string and _g3_patch_payload | trim not in ['', '{}'] -%}{{ _g3_patch_payload | from_json | default({}) | list }}
                  {%- else -%}{{ [] }}{%- endif -%}
                http_status: "{{ _g3_raw.get('http_status', 0) if _g3_raw is mapping else 0 }}"
                caller_token: "{{ caller_token_norm }}"
        - stop: stacks gate3 patch
          response_variable: result

    - choose:
      - conditions:
        - condition: template
          value_template: '{{ section_norm == "stacks" and mode_norm == "stacks_document_delete" }}'
        sequence:
        - variables:
            _d4_document_id: "{{ input_data.get('document_id', '') | string | trim if input_data is mapping else '' }}"
            _d4_confirm: "{{ input_data.get('confirm', false) if input_data is mapping else false }}"
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _d4_document_id == "" }}'
            sequence:
            - variables:
                result:
                  status: error
                  tool: Zen DojoTools Library
                  section: stacks
                  mode: stacks_document_delete
                  message: "Missing required field: document_id"
                  caller_token: "{{ caller_token_norm }}"
            - stop: gate4 missing document_id
              response_variable: result
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _d4_confirm != true }}'
            sequence:
            - action: script.zen_sutra_paperless
              response_variable: _d4_preview_raw
              continue_on_error: true
              data:
                action_type: get
                endpoint: "/api/documents/{{ _d4_document_id }}/"
            - variables:
                _d4_preview: "{{ _d4_preview_raw.get('result', {}).get('content', {}) if _d4_preview_raw is mapping else {} }}"
            - variables:
                _d4_preview_safe: >-
                  {%- if _d4_preview is mapping -%}
                    {%- set _ns = namespace(safe={}) -%}
                    {%- for k, v in _d4_preview.items() if k != 'content' -%}
                      {%- set _ns.safe = _ns.safe | combine({k: v}) -%}
                    {%- endfor -%}
                    {{ _ns.safe | combine({'content_redacted': true}) }}
                  {%- else -%}{{ _d4_preview }}{%- endif -%}
                result:
                  status: confirmation_required
                  tool: Zen DojoTools Library
                  section: stacks
                  mode: stacks_document_delete
                  warning: "IRREVERSIBLE. This document will be permanently deleted. Re-call with confirm=true to proceed."
                  document: "{{ _d4_preview_safe }}"
                  caller_token: "{{ caller_token_norm }}"
            - stop: gate4 confirm required
              response_variable: result
          default:
          - action: script.zen_sutra_paperless
            response_variable: _d4_raw
            continue_on_error: true
            data:
              action_type: delete
              endpoint: "/api/documents/{{ _d4_document_id }}/"
          - variables:
              result:
                status: "{{ 'success' if _d4_raw is mapping and _d4_raw.get('status') == 'success' else 'error' }}"
                tool: Zen DojoTools Library
                section: stacks
                mode: stacks_document_delete
                deleted: "{{ _d4_document_id }}"
                trace:
                  endpoint: "/api/documents/{{ _d4_document_id }}/"
                  method: DELETE
                  http_status: "{{ _d4_raw.get('http_status', 0) if _d4_raw is mapping else 0 }}"
                  caller_token: "{{ caller_token_norm }}"
          - stop: gate4 delete done
            response_variable: result

    - choose:
      - conditions:
        - condition: template
          value_template: '{{ section_norm == "stacks" and mode_norm in ["stacks_document_notes","stacks_note_add"] }}'
        sequence:
        - variables:
            _notes_document_id: "{{ input_data.get('document_id', '') | string | trim if input_data is mapping else '' }}"
            _note_text: "{{ input_data.get('note', '') | string | trim if input_data is mapping else '' }}"
            _notes_product_name: "{{ input_data.get('product_name', '') | string | trim if input_data is mapping else '' }}"
        - variables:
            _notes_missing: >-
              {%- if _notes_document_id == '' -%}document_id
              {%- elif mode_norm == 'stacks_note_add' and _note_text == '' -%}note
              {%- else -%}{%- endif -%}
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _notes_missing | trim != "" }}'
            sequence:
            - variables:
                result:
                  status: error
                  tool: Zen DojoTools Library
                  section: stacks
                  mode: "{{ mode_norm }}"
                  message: "Missing required field: {{ _notes_missing | trim }}"
                  caller_token: "{{ caller_token_norm }}"
            - stop: stacks notes missing input
              response_variable: result
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ mode_norm == "stacks_note_add" }}'
            sequence:
            - action: script.zen_sutra_paperless
              response_variable: _notes_raw
              continue_on_error: true
              data:
                action_type: post
                endpoint: "/api/documents/{{ _notes_document_id }}/notes/"
                payload: '{{ {"note": _note_text} | tojson }}'
          default:
          - action: script.zen_sutra_paperless
            response_variable: _notes_raw
            continue_on_error: true
            data:
              action_type: get
              endpoint: "/api/documents/{{ _notes_document_id }}/notes/"
        - variables:
            _notes_content: "{{ _notes_raw.get('result', {}).get('content', {}) if _notes_raw is mapping else {} }}"
            _notes_posted_ok: "{{ _notes_raw is mapping and _notes_raw.get('status', '') == 'success' and mode_norm == 'stacks_note_add' }}"
            _notes_inv_notify_raw: none
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _notes_product_name != "" and _notes_posted_ok }}'
            sequence:
            - action: script.zen_dojotools_inventory
              continue_on_error: true
              response_variable: _notes_inv_notify_raw
              data:
                mode: product_ref_add
                item: "{{ _notes_product_name }}"
                ref_type: doc
                ref_id: "{{ _notes_document_id | int }}"
        - variables:
            _notes_inv_notified: "{{ _notes_inv_notify_raw is mapping and _notes_inv_notify_raw.get('status', '') == 'ok' }}"
            result:
              status: "{{ _notes_raw.get('status', 'error') if _notes_raw is mapping else 'error' }}"
              tool: Zen DojoTools Library
              section: stacks
              mode: "{{ mode_norm }}"
              document_id: "{{ _notes_document_id }}"
              notes: "{{ _notes_content }}"
              inventory_notified: "{{ _notes_inv_notified }}"
              trace:
                endpoint: "/api/documents/{{ _notes_document_id }}/notes/"
                method: "{{ 'POST' if mode_norm == 'stacks_note_add' else 'GET' }}"
                http_status: "{{ _notes_raw.get('http_status', 0) if _notes_raw is mapping else 0 }}"
                caller_token: "{{ caller_token_norm }}"
        - stop: stacks notes done
          response_variable: result

    - choose:
      - conditions:
        - condition: template
          value_template: '{{ section_norm == "stacks" and mode_norm == "stacks_bulk_edit" }}'
        sequence:
        - variables:
            _bulk_doc_ids: "{{ input_data.get('document_ids', []) if input_data is mapping else [] }}"
            _bulk_method: "{{ input_data.get('method', '') | string | trim | lower if input_data is mapping else '' }}"
            _bulk_params: "{{ input_data.get('parameters', {}) if input_data is mapping else {} }}"
            _bulk_label_slugs_raw: "{{ input_data.get('label_slugs', []) if input_data is mapping else [] }}"
            _bulk_confirm: "{{ input_data.get('confirm', false) if input_data is mapping else false }}"
            _bulk_all_labels: "{{ labels() | list }}"
        - variables:
            _bulk_label_slugs: >-
              {%- set raw = _bulk_label_slugs_raw -%}
              {%- if raw is string -%}
                {{ raw.split(',') | map('trim') | select | list }}
              {%- elif raw is sequence -%}
                {{ raw | map('string') | map('trim') | select | list }}
              {%- else -%}{{ [] }}{%- endif -%}
            _bulk_missing: >-
              {%- if not (_bulk_doc_ids is sequence and _bulk_doc_ids is not string and _bulk_doc_ids | length > 0) -%}document_ids
              {%- elif _bulk_method == '' -%}method
              {%- elif _bulk_method in ['add_tag','remove_tag'] and _bulk_label_slugs | length == 0 -%}label_slugs
              {%- elif _bulk_method in ['add_tag','remove_tag'] and _bulk_label_slugs | length > 1 -%}exactly_one_label_slug
              {%- else -%}{%- endif -%}
            _bulk_valid_methods: [set_correspondent, set_document_type, set_storage_path, add_tag, remove_tag, delete]
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _bulk_missing | trim != "" }}'
            sequence:
            - variables:
                result:
                  status: error
                  tool: Zen DojoTools Library
                  section: stacks
                  mode: stacks_bulk_edit
                  message: "Missing required field: {{ _bulk_missing | trim }}"
                  caller_token: "{{ caller_token_norm }}"
            - stop: stacks bulk missing input
              response_variable: result
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _bulk_method not in _bulk_valid_methods }}'
            sequence:
            - variables:
                result:
                  status: error
                  tool: Zen DojoTools Library
                  section: stacks
                  mode: stacks_bulk_edit
                  message: "Invalid method. Valid: set_correspondent, set_document_type, set_storage_path, add_tag, remove_tag, delete"
                  caller_token: "{{ caller_token_norm }}"
            - stop: stacks bulk invalid method
              response_variable: result
        - variables:
            _bulk_bad_labels: >-
              {%- set ns = namespace(bad=[]) -%}
              {%- if _bulk_method in ['add_tag','remove_tag'] -%}
                {%- for lbl in _bulk_label_slugs -%}
                  {%- if lbl not in _bulk_all_labels -%}{%- set ns.bad = ns.bad + [lbl] -%}{%- endif -%}
                {%- endfor -%}
              {%- endif -%}
              {{ ns.bad }}
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _bulk_bad_labels | length > 0 }}'
            sequence:
            - variables:
                result:
                  status: error
                  tool: Zen DojoTools Library
                  section: stacks
                  mode: stacks_bulk_edit
                  message: "Labels not in ZenOS label index: {{ _bulk_bad_labels | join(', ') }}. Create the HA label first or check spelling."
                  bad_labels: "{{ _bulk_bad_labels }}"
                  available_sample: "{{ _bulk_all_labels[:20] }}"
                  caller_token: "{{ caller_token_norm }}"
            - stop: stacks bulk tag labels invalid
              response_variable: result
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _bulk_method in ["add_tag","remove_tag"] }}'
            sequence:
            - action: script.zen_sutra_paperless
              response_variable: _bulk_tags_raw
              continue_on_error: true
              data:
                action_type: get
                endpoint: /api/tags/
            - variables:
                _bulk_tags_content: "{{ _bulk_tags_raw.get('result', {}).get('content', {}) if _bulk_tags_raw is mapping else {} }}"
                _bulk_tags_list: "{{ _bulk_tags_content.get('results', []) if _bulk_tags_content is mapping else [] }}"
                _bulk_tag_ids: >-
                  {%- set ns = namespace(ids=[]) -%}
                  {%- for t in _bulk_tags_list if t is mapping -%}
                    {%- set slug = t.get('slug', t.get('name', '') | slugify(separator='_')) | string | trim -%}
                    {%- if slug in _bulk_label_slugs -%}{%- set ns.ids = ns.ids + [t.get('id') | int] -%}{%- endif -%}
                  {%- endfor -%}
                  {{ ns.ids }}
                _bulk_missing_paperless_tags: >-
                  {%- set ns = namespace(missing=[]) -%}
                  {%- for lbl in _bulk_label_slugs -%}
                    {%- set found = namespace(ok=false) -%}
                    {%- for t in _bulk_tags_list if t is mapping -%}
                      {%- set slug = t.get('slug', t.get('name', '') | slugify(separator='_')) | string | trim -%}
                      {%- if slug == lbl -%}{%- set found.ok = true -%}{%- endif -%}
                    {%- endfor -%}
                    {%- if not found.ok -%}{%- set ns.missing = ns.missing + [lbl] -%}{%- endif -%}
                  {%- endfor -%}
                  {{ ns.missing }}
          default:
          - variables:
              _bulk_tag_ids: []
              _bulk_missing_paperless_tags: []
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _bulk_method in ["add_tag","remove_tag"] and _bulk_missing_paperless_tags | length > 0 }}'
            sequence:
            - variables:
                result:
                  status: error
                  tool: Zen DojoTools Library
                  section: stacks
                  mode: stacks_bulk_edit
                  message: "HA labels exist, but Paperless tag projections are missing. Run stacks_tag_create for each missing label first."
                  missing_paperless_tags: "{{ _bulk_missing_paperless_tags }}"
                  caller_token: "{{ caller_token_norm }}"
            - stop: stacks bulk tag projection missing
              response_variable: result
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _bulk_method == "delete" and _bulk_confirm != true }}'
            sequence:
            - variables:
                result:
                  status: confirmation_required
                  tool: Zen DojoTools Library
                  section: stacks
                  mode: stacks_bulk_edit
                  warning: "IRREVERSIBLE. This will permanently delete all specified documents. Re-call with confirm=true to proceed."
                  document_ids: "{{ _bulk_doc_ids }}"
                  document_count: "{{ _bulk_doc_ids | length }}"
                  caller_token: "{{ caller_token_norm }}"
            - stop: stacks bulk delete confirm required
              response_variable: result
        - variables:
            _bulk_payload: >-
              {%- set _ns = namespace(p={'documents': _bulk_doc_ids | map('int') | list, 'method': _bulk_method}) -%}
              {%- if _bulk_method in ['add_tag','remove_tag'] -%}
                {%- set _ns.p = _ns.p | combine({'parameters': {'tag': (_bulk_tag_ids | first)}}) -%}
              {%- elif _bulk_params is mapping and _bulk_params | length > 0 -%}
                {%- set _ns.p = _ns.p | combine({'parameters': _bulk_params}) -%}
              {%- endif -%}
              {{ _ns.p | tojson }}
        - action: script.zen_sutra_paperless
          response_variable: _bulk_raw
          continue_on_error: true
          data:
            action_type: post
            endpoint: "/api/documents/bulk_edit/"
            payload: "{{ _bulk_payload }}"
        - variables:
            _bulk_content: "{{ _bulk_raw.get('result', {}).get('content', {}) if _bulk_raw is mapping else {} }}"
            result:
              status: "{{ _bulk_raw.get('status', 'error') if _bulk_raw is mapping else 'error' }}"
              tool: Zen DojoTools Library
              section: stacks
              mode: stacks_bulk_edit
              method: "{{ _bulk_method }}"
              document_ids: "{{ _bulk_doc_ids }}"
              document_count: "{{ _bulk_doc_ids | length }}"
              result: "{{ _bulk_content }}"
              trace:
                endpoint: /api/documents/bulk_edit/
                method: POST
                http_status: "{{ _bulk_raw.get('http_status', 0) if _bulk_raw is mapping else 0 }}"
                caller_token: "{{ caller_token_norm }}"
        - stop: stacks bulk edit done
          response_variable: result

    - choose:
      - conditions:
        - condition: template
          value_template: '{{ section_norm == "stacks" and mode_norm == "stacks_by_company" }}'
        sequence:
        - variables:
            _bc_company_name: "{{ input_data.get('company_name', '') | string | trim if input_data is mapping else '' }}"
            _bc_corr_id_direct: "{{ input_data.get('correspondent_id', '') | string | trim if input_data is mapping else '' }}"
            _bc_ordering: "{{ input_data.get('ordering', '-created') | string | trim if input_data is mapping else '-created' }}"
            _bc_page: "{{ input_data.get('page', 1) | int(1) if input_data is mapping else 1 }}"
            _bc_page_size: "{{ input_data.get('page_size', 25) | int(25) if input_data is mapping else 25 }}"
        - variables:
            _bc_missing: >-
              {%- if _bc_company_name == '' and _bc_corr_id_direct == '' -%}company_name or correspondent_id{%- else -%}{%- endif -%}
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _bc_missing | trim != "" }}'
            sequence:
            - variables:
                result:
                  status: error
                  tool: Zen DojoTools Library
                  section: stacks
                  mode: stacks_by_company
                  message: "Missing required field: {{ _bc_missing | trim }}"
                  caller_token: "{{ caller_token_norm }}"
            - stop: stacks by_company missing input
              response_variable: result
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _bc_corr_id_direct == "" }}'
            sequence:
            - action: script.zen_sutra_paperless
              response_variable: _bc_corr_raw
              continue_on_error: true
              data:
                action_type: get
                endpoint: "/api/correspondents/?name__icontains={{ _bc_company_name | urlencode }}"
            - variables:
                _bc_corr_list: >-
                  {%- set _r = _bc_corr_raw.get('result', {}).get('content', {}) if _bc_corr_raw is mapping else {} -%}
                  {{ _r.get('results', []) if _r is mapping else [] }}
            - variables:
                _bc_resolved_id: >-
                  {%- if _bc_corr_list is sequence and _bc_corr_list | length > 0 -%}
                    {{ (_bc_corr_list | first).get('id', '') | string }}
                  {%- else -%}{%- endif -%}
                _bc_resolved_name: >-
                  {%- if _bc_corr_list is sequence and _bc_corr_list | length > 0 -%}
                    {{ (_bc_corr_list | first).get('name', _bc_company_name) }}
                  {%- else -%}{{ _bc_company_name }}{%- endif -%}
          default:
          - variables:
              _bc_resolved_id: "{{ _bc_corr_id_direct }}"
              _bc_resolved_name: "{{ _bc_company_name }}"
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _bc_resolved_id | trim == "" }}'
            sequence:
            - variables:
                result:
                  status: not_found
                  tool: Zen DojoTools Library
                  section: stacks
                  mode: stacks_by_company
                  message: "No Paperless correspondent found matching: {{ _bc_company_name }}"
                  rolodex_hint: "Use rolodex case=company_find to check if company exists in Twenty CRM"
                  caller_token: "{{ caller_token_norm }}"
            - stop: stacks by_company not found
              response_variable: result
        - action: script.zen_sutra_paperless
          response_variable: _bc_docs_raw
          continue_on_error: true
          data:
            action_type: get
            endpoint: "/api/documents/?correspondent__id={{ _bc_resolved_id }}&ordering={{ _bc_ordering | urlencode }}&page={{ _bc_page }}&page_size={{ _bc_page_size }}"
        - variables:
            _bc_content: "{{ _bc_docs_raw.get('result', {}).get('content', {}) if _bc_docs_raw is mapping else {} }}"
            _ha_label_index: "{{ labels() | list }}"
        - variables:
            _bc_safe: >-
              {%- if _bc_content is mapping and _bc_content.get('results', none) is sequence and _bc_content.get('results', none) is not string -%}
                {%- macro safe_doc(d) -%}
                  {%- if d is mapping -%}
                    {%- set _ns = namespace(safe={}) -%}
                    {%- for k, v in d.items() if k != 'content' -%}{%- set _ns.safe = _ns.safe | combine({k: v}) -%}{%- endfor -%}
                    {{ _ns.safe | combine({'content_redacted': not _include_content, 'content': d.get('content', '') if _include_content else none}) | tojson }}
                  {%- else -%}{{ d }}{%- endif -%}
                {%- endmacro -%}
                {%- set _ns = namespace(results=[]) -%}
                {%- for d in _bc_content.get('results', []) -%}
                  {%- set _ns.results = _ns.results + [safe_doc(d) | from_json | default({})] -%}
                {%- endfor -%}
                {{ {'count': _bc_content.get('count', 0), 'next': _bc_content.get('next', none), 'previous': _bc_content.get('previous', none), 'results': _ns.results} }}
              {%- else -%}{{ _bc_content }}{%- endif -%}
            result:
              status: "{{ _bc_docs_raw.get('status', 'error') if _bc_docs_raw is mapping else 'error' }}"
              tool: Zen DojoTools Library
              section: stacks
              mode: stacks_by_company
              correspondent:
                id: "{{ _bc_resolved_id }}"
                name: "{{ _bc_resolved_name }}"
              rolodex_link:
                case: company_find
                item: "{{ _bc_resolved_name }}"
              documents: "{{ _bc_safe }}"
              trace:
                endpoint: "/api/documents/?correspondent__id={{ _bc_resolved_id }}"
                method: GET
                http_status: "{{ _bc_docs_raw.get('http_status', 0) if _bc_docs_raw is mapping else 0 }}"
                caller_token: "{{ caller_token_norm }}"
        - stop: stacks by_company done
          response_variable: result

    - choose:
      - conditions:
        - condition: template
          value_template: '{{ section_norm == "stacks" and mode_norm == "stacks_document_restore" }}'
        sequence:
        - variables:
            _tr_document_id: "{{ input_data.get('document_id', '') | string | trim if input_data is mapping else '' }}"
        - variables:
            _tr_missing: >-
              {%- if _tr_document_id == '' -%}document_id{%- else -%}{%- endif -%}
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _tr_missing | trim != "" }}'
            sequence:
            - variables:
                result:
                  status: error
                  tool: Zen DojoTools Library
                  section: stacks
                  mode: stacks_document_restore
                  message: "Missing required field: {{ _tr_missing | trim }}"
                  caller_token: "{{ caller_token_norm }}"
            - stop: stacks restore missing input
              response_variable: result
        - action: script.zen_sutra_paperless
          response_variable: _tr_raw
          continue_on_error: true
          data:
            action_type: post
            endpoint: "/api/documents/bulk_edit/"
            payload: '{{ {"documents": [_tr_document_id | int], "method": "restore"} | tojson }}'
        - variables:
            _tr_content: "{{ _tr_raw.get('result', {}).get('content', {}) if _tr_raw is mapping else {} }}"
            result:
              status: "{{ _tr_raw.get('status', 'error') if _tr_raw is mapping else 'error' }}"
              tool: Zen DojoTools Library
              section: stacks
              mode: stacks_document_restore
              restored: "{{ _tr_document_id }}"
              result: "{{ _tr_content }}"
              trace:
                endpoint: /api/documents/bulk_edit/
                method: POST
                http_status: "{{ _tr_raw.get('http_status', 0) if _tr_raw is mapping else 0 }}"
                caller_token: "{{ caller_token_norm }}"
        - stop: stacks restore done
          response_variable: result

    - choose:
      - conditions:
        - condition: template
          value_template: '{{ stack_norm == "radar" and mode_norm == "help" }}'
        sequence:
        - variables:
            result:
              status: info
              tool: zen_dojotools_library
              section: stacks
              stack: radar
              mode: help
              message: Radar is the Zammad service desk stack. Proxies to zen_dojotools_servicedesk.
              cases: "{{ radar_modes }}"
              caller_token: "{{ caller_token_norm }}"
        - stop: radar help
          response_variable: result
      - conditions:
        - condition: template
          value_template: '{{ stack_norm == "radar" and mode_norm in ["get", "find", "list", "configure", "by_anchor"] }}'
        sequence:
        - variables:
            _radar_mode_map:
              get: ticket_get
              find: ticket_find
              list: ticket_list
              configure: configure
              by_anchor: tickets_by_anchor
            _radar_svc_mode: "{{ _radar_mode_map.get(mode_norm, mode_norm) }}"
        - action: script.zen_stack_radar
          response_variable: _radar_result
          continue_on_error: true
          data:
            mode: "{{ _radar_svc_mode }}"
            input_json: "{{ input_json_norm }}"
            caller_token: "{{ caller_token_norm }}"
        - variables:
            result: >-
              {%- set r = _radar_result if _radar_result is mapping else {} -%}
              {{ r | combine({'stack': 'radar', 'library_mode': mode_norm}, recursive=true) }}
        - stop: radar stack done
          response_variable: result

    - choose:
      - conditions:
        - condition: template
          value_template: '{{ stack_norm == "wiki" and mode_norm == "help" }}'
        sequence:
        - variables:
            result:
              status: info
              tool: zen_dojotools_library
              section: stacks
              stack: wiki
              mode: help
              message: Wiki stack. Calls zen_sutra_wikijs via zen_dojotools_filecabinet stack=wiki.
              modes: [get, find, list, configure, by_anchor]
              verb_map:
                get: action_type=get path=<path>
                find: action_type=search query=<query>
                list: action_type=list
                configure: "n/a — wiki is always available"
                by_anchor: action_type=stacks_by_anchor anchor_type=<type> anchor_ids=<ids>
              caller_token: "{{ caller_token_norm }}"
        - stop: wiki help
          response_variable: result
      - conditions:
        - condition: template
          value_template: '{{ stack_norm == "wiki" and mode_norm in ["get", "find", "list", "by_anchor"] }}'
        sequence:
        - variables:
            _wiki_action_map:
              get: get
              find: search
              list: list
              by_anchor: stacks_by_anchor
            _wiki_action: "{{ _wiki_action_map.get(mode_norm, mode_norm) }}"
        - action: script.zen_dojotools_filecabinet
          response_variable: _wiki_result
          continue_on_error: true
          data:
            action_type: "{{ _wiki_action }}"
            stack: wiki
            input_json: "{{ input_json_norm }}"
            caller_token: "{{ caller_token_norm }}"
        - variables:
            result: >-
              {%- set r = _wiki_result if _wiki_result is mapping else {} -%}
              {{ r | combine({'stack': 'wiki', 'library_mode': mode_norm}, recursive=true) }}
        - stop: wiki stack done
          response_variable: result

    - variables:
        result:
          status: error
          tool: Zen DojoTools Library
          section: "{{ section_norm }}"
          stack: "{{ stack_norm }}"
          mode: "{{ mode_norm }}"
          message: "Unknown stack/mode. Use mode=stacks_list to see registered stacks, or mode=help with stack=<name>."
          caller_token: "{{ caller_token_norm }}"
    - stop: library unknown
      response_variable: result

