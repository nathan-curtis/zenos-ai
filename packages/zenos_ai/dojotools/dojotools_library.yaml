        - action: script.zen_sutra_paperless
          response_variable: _bc_docs_raw
          continue_on_error: true
          data:
            action_type: get
            endpoint: "/api/documents/?correspondent__id={{ _bc_resolved_id }}&ordering={{ _bc_ordering | urlencode }}&page={{ _bc_page }}&page_size={{ _bc_page_size }}"
        - variables:
            _bc_content: "{{ _bc_docs_raw.get('result', {}).get('content', {}) if _bc_docs_raw is mapping else {} }}"
            _ha_label_index: "{{ labels() | list }}"
        - variables:
            _bc_safe: >-
              {%- if _bc_content is mapping and _bc_content.get('results', none) is sequence and _bc_content.get('results', none) is not string -%}
                {%- macro safe_doc(d) -%}
                  {%- if d is mapping -%}
                    {%- set _ns = namespace(safe={}) -%}
                    {%- for k, v in d.items() if k != 'content' -%}{%- set _ns.safe = _ns.safe | combine({k: v}) -%}{%- endfor -%}
                    {{ _ns.safe | combine({'content_redacted': not _include_content, 'content': d.get('content', '') if _include_content else none}) | tojson }}
                  {%- else -%}{{ d }}{%- endif -%}
                {%- endmacro -%}
                {%- set _ns = namespace(results=[]) -%}
                {%- for d in _bc_content.get('results', []) -%}
                  {%- set _ns.results = _ns.results + [safe_doc(d) | from_json | default({})] -%}
                {%- endfor -%}
                {{ {'count': _bc_content.get('count', 0), 'next': _bc_content.get('next', none), 'previous': _bc_content.get('previous', none), 'results': _ns.results} }}
              {%- else -%}{{ _bc_content }}{%- endif -%}
            result:
              status: "{{ _bc_docs_raw.get('status', 'error') if _bc_docs_raw is mapping else 'error' }}"
              tool: Zen DojoTools Library
              section: stacks
              mode: stacks_by_company
              correspondent:
                id: "{{ _bc_resolved_id }}"
                name: "{{ _bc_resolved_name }}"
              rolodex_link:
                case: company_find
                item: "{{ _bc_resolved_name }}"
              documents: "{{ _bc_safe }}"
              trace:
                endpoint: "/api/documents/?correspondent__id={{ _bc_resolved_id }}"
                method: GET
                http_status: "{{ _bc_docs_raw.get('http_status', 0) if _bc_docs_raw is mapping else 0 }}"
                caller_token: "{{ caller_token_norm }}"
        - stop: stacks by_company done
          response_variable: result

