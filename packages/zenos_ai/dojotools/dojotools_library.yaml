###############################################################################
# ZenOS-AI DojoTools: Library
# Version: 6.12.0
#
# Two departments, one tool.
#
# section=stacks — Knowledge broker and Lens owner. Routes document/ticket/wiki
#   requests to registered providers (Paperless-NGX, Radar/Zammad, Wiki.js).
#   Consumers (Inspect, Index, Query, Room Manager) call Library only — never
#   providers directly. Content redacted by default; include_content=true to opt in.
#   Lens contract:
#     Provider registration: zen_stack_paperless writes config to integrations_config.paperless_ngx
#     Failure policy: soft — missing or misconfigured provider returns status=error, never raises
#     Consumer entry point: stacks_by_anchor or stacks_document_lens for article_evidence leaves
#
# section=catalog — FRBR physical item catalog. Library owns circulation + storage
#   for all cataloged items. Inventory (Grocy) owns the product record (Work).
#   Library adds the catalog_item userobject (Item) per physical copy.
#   item_type routes to the right HA label + creator role. All physical item types
#   (music_recording, book, game, video, periodical, art_print) live here.
#   Library is the Lens owner for all catalog items (item_evidence leaves).
#
# Sections:
#   section=stacks   -- Lens provider stack — use stack= to pick provider:
#                         stack=paperless  Paperless-NGX documents
#                         stack=radar      Zammad service desk / ticket evidence
#                         stack=wiki       Wiki.js knowledge base
#   section=catalog  -- FRBR physical item catalog (all item types)
#
# MCP-facing: zen_dojotools_library  <- expose this to MCP
#
# Architecture note — sutra shortcut (pre-existing, tracked for future cleanup):
#   Library calls zen_sutra_grocy directly for catalog_item userentity/userobject
#   reads (browse, find, search, loan, return, configure, by_anchor). This is a known
#   layer shortcut — Inventory does not expose a convenient userobject query for
#   catalog_item shells by type. All stock operations (transfer, tag, values_get/set,
#   locations_list) correctly route through zen_dojotools_inventory. The shortcut does
#   not affect correctness; it is flagged here so a future refactor can close the gap.
#
# Lens Bus — Auto-Registration (v6.10.0):
#   tool_manifest returns: provider_key=library_catalog, register_mode=register
#   On boot/daily, zen_dojotools_manifest mode=bootstrap_stacks calls tool_manifest,
#   then mode=register if library_catalog not already in lens_registry.
#   mode=register:   writes library_catalog entry to lens_registry household cabinet key.
#   mode=unregister: removes library_catalog entry from lens_registry.
#
# History:
#   5.1.0-retired  Bundled in paperless_ngx.yaml (Paperless was sole Lens provider)
#   5.2.0          Moved back to dojotools/ -- file boundary, not runtime, change
#   5.3.0          Utility section (hash_md5/slugify/library/library_2) fully retired
#   5.4.0          Docs refactor: Library is knowledge broker + Lens owner (#10042)
#   5.5.0          Radar section added — zen_stack_radar proxies to zen_dojotools_servicedesk
#   5.6.0-5.9.0    Books + games sections (pre-FRBR, now removed)
#   6.0.0          FRBR catalog section: catalog_item userobject per physical copy
#   6.1.0          section=books + section=games removed; all items are section=catalog item_type=*
#                  catalog_item schema extended: platform, digital, hardware_note, isbn, genre, series, publisher
#   6.8.0          Lens bus auto-registration: register/unregister modes + tool_manifest provider_key
#   6.10.0          mode=move implemented (reshelve catalog item to named location); migrate ghost mode removed
#                  digital_uri + preferred_service fields on catalog_item (bridge to Nyx/Media Manager)
#   6.10.0         by_anchor emits playback_hint on item_evidence when digital_uri present — same shape as
#                  Media Manager track/album evidence. item_type→media_type map: music_recording→album,
#                  video→movie, book→audiobook, periodical→podcast. Nyx reads it without any changes.
#   6.11.0         New optional mealie_cookbook_slug field on catalog_item — plain cross-reference from a
#                  physical cookbook to its matching Mealie cookbook slug, set at catalog_add time. Distinct
#                  from digital_uri/preferred_service (audiobook/media playback bridge, not this). No sync,
#                  no auto-matching — human/agent sets it when they know both exist. No catalog "update"
#                  mode exists yet, so this can only be set at add time, not retrofitted onto an existing
#                  catalog entry — a separate gap, not addressed here.
#   6.12.0         New mode=update (catalog_update) — closes the gap noted in 6.11.0. Safe partial
#                  update: userentity_values_get current values -> combine() the caller's partial
#                  input_json onto them -> userentity_values_set with the merged dict, never a blind
#                  overwrite. Same fields as catalog_add's _str_fields list, including
#                  mealie_cookbook_slug, so a book already on the shelf can now be retroactively
#                  linked to a matching Mealie cookbook. Also corrected two stale version strings
#                  (script description, mode=help response) that still read 6.10.0.
#   6.12.1         Docs-only (closes Radar #10283, "Paperless OCR text not exposed") — the
#                  capability already existed (stacks_document_get + include_content=true
#                  returns real OCR text, verified live against a real receipt), the ticket
#                  was a pure discoverability gap. Added a concrete example to the top-level
#                  tool description covering the exact field name (document_id, not id) and
#                  include_content usage, since that's what's visible without an extra
#                  mode=help round-trip.
###############################################################################

script:
  zen_dojotools_library:
    alias: Zen DojoTools Library
    description: >-
      Library (v6.12.1) — knowledge broker + FRBR physical item catalog.
      section=stacks: documents/tickets/wiki via Paperless, Radar, Wiki.js.
      section=catalog: browse/find/loan/return/add for books, games, music, video, art, periodicals.
      Barcode scan → catalog_add auto-shelves. intake_pending finds uncataloged items at intake shelf.
      configure_status shows shelf setup. Lens bus provider (library_catalog) — area_id anchor returns
      item_evidence. For stock/shopping/ERP ops use zen_dojotools_inventory. mode=help for full guide.

      Read a scanned document's OCR text (e.g. a receipt just scanned via the Paperless
      mobile app): section=stacks stack=paperless mode=stacks_search query="<keyword>"
      (or omit query, pass input_json={"ordering":"-created"} to find the newest scan) to
      get its id, then section=stacks stack=paperless mode=stacks_document_get
      input_json={"document_id": <id>, "include_content": true} — field is document_id,
      not id. Content is redacted (content_redacted:true, content:null) unless
      include_content:true is explicitly passed.
    mode: parallel
    icon: mdi:library
    fields:
      section:
        name: Section
        description: "Library department — stacks=documents/tickets/wiki, catalog=FRBR physical items (item_type routes to collection)."
        selector:
          select:
            options:
            - stacks
            - catalog
        default: stacks
      stack:
        name: Stack
        description: "Which knowledge stack. paperless=documents, radar=tickets, wiki=wiki pages."
        selector:
          select:
            options:
            - paperless
            - radar
            - wiki
      mode:
        name: Mode
        description: "Catalog: add/update/browse/find/search/loan/return/move/configure/configure_status/intake_pending. Stacks: stacks_search/stacks_document_get/etc. Start with configure_status or intake_pending for catalog workflows."
        selector:
          select:
            options:
            - help
            - browse
            - find
            - search
            - add
            - update
            - loan
            - return
            - configure
            - move
            - get
            - intake_pending
            - configure_status
            - list
            - by_anchor
            - stacks_configure
            - stacks_search
            - stacks_document_get
            - stacks_document_lens
            - stacks_similar
            - stacks_by_anchor
            - stacks_tags_list
            - stacks_tag_audit
            - stacks_correspondents_list
            - stacks_document_types_list
            - stacks_storage_paths_list
            - stacks_task_status
            - stacks_correspondent_create
            - stacks_correspondent_update
            - stacks_tag_create
            - stacks_document_type_create
            - stacks_storage_path_create
            - stacks_document_update
            - stacks_document_tag
            - stacks_document_delete
            - stacks_document_notes
            - stacks_note_add
            - stacks_bulk_edit
            - stacks_correspondent_get
            - stacks_by_company
            - stacks_document_restore
            - stacks_list
            - stacks_flag_for_review
            - tool_manifest
            - register
            - unregister
        default: help
      query:
        name: Library Query / Input
        description: Legacy text input or Stacks search query.
        selector:
          text:
            multiline: false
      input_json:
        name: Input JSON
        description: Structured JSON payload for section modes.
        selector:
          text:
            multiline: true
      caller_token:
        name: Caller Token
        description: Opaque token passed through for correlation.
        selector:
          text:
      anchor_type:
        name: Anchor Type
        description: "Lens bus anchor type (person/label/area_id). Passed by dispatcher for by_anchor mode."
        selector:
          text:
      anchor_ids:
        name: Anchor IDs
        description: "JSON array of anchor IDs. Passed by dispatcher for by_anchor mode."
        selector:
          text:
      item_type:
        name: Item Type
        description: "Catalog item type (section=catalog only). music_recording | book | game | video | periodical | art_print"
        selector:
          select:
            options:
            - music_recording
            - book
            - game
            - video
            - periodical
            - art_print
        default: music_recording

    sequence:
    - variables:
        caller_token_norm: "{{ caller_token | default('') }}"
        section_norm: "{{ section | default('stacks') | string | trim | lower }}"
        stack_norm: "{{ stack | default('', true) | string | trim | lower }}"
        mode_norm: "{{ mode | default('help') | string | trim | lower }}"
        query_norm: "{{ query | default('') | string | trim }}"
        item_type_norm: "{{ item_type | default('music_recording', true) | string | lower | trim }}"
        input_json_norm: >-
          {%- set raw = input_json | default('', true) -%}
          {%- if raw is mapping -%}{{ raw | tojson }}
          {%- elif raw is string and raw | trim != '' -%}{{ raw | trim }}
          {%- else -%}{{ {} | tojson }}{%- endif -%}
        input_data: >-
          {%- set raw = input_json | default('', true) -%}
          {%- if raw is mapping -%}{{ raw }}
          {%- elif raw is string and raw | trim != '' -%}{{ raw | from_json | default({}) }}
          {%- else -%}{{ {} }}{%- endif -%}
        stacks_modes:
          help:
            intent: Return Library/Stacks help.
            reads: none
          stacks_configure:
            intent: Inspect Paperless config state. Gate 1 is read-only.
            reads: household cabinet integrations_config.paperless_ngx
          stacks_search:
            intent: Full-text search Paperless documents.
            needs: [query OR input_json.query]
            endpoint: /api/documents/?query=
          stacks_document_get:
            intent: Return one Paperless document metadata record.
            needs: [input_json.document_id]
            endpoint: /api/documents/{document_id}/
          stacks_document_lens:
            intent: Return normalized document/evidence leaf.
            needs: [input_json.document_id]
            endpoint: /api/documents/{document_id}/
          stacks_similar:
            intent: Find documents similar to one document ID.
            needs: [input_json.document_id]
            endpoint: /api/documents/?more_like_id={document_id}
          stacks_tags_list:
            intent: List Paperless tags.
            endpoint: /api/tags/
          stacks_tag_audit:
            intent: Compare Paperless tags to HA labels. Read-only Gate 1.5 taxonomy bridge.
            endpoint: /api/tags/
          stacks_correspondents_list:
            intent: List Paperless correspondents.
            endpoint: /api/correspondents/
          stacks_correspondent_get:
            intent: Return one Paperless correspondent record by ID.
            needs: [input_json.correspondent_id]
            endpoint: /api/correspondents/{correspondent_id}/
          stacks_correspondent_update:
            intent: Rename an existing Paperless correspondent (PATCH — does not touch its documents or their tags/correspondent assignment, just the correspondent record's own name/slug).
            needs: [input_json.correspondent_id, input_json.name]
            endpoint: /api/correspondents/{correspondent_id}/ (PATCH)
          stacks_document_types_list:
            intent: List Paperless document types.
            endpoint: /api/document_types/
          stacks_storage_paths_list:
            intent: List Paperless storage paths.
            endpoint: /api/storage_paths/
          stacks_task_status:
            intent: Inspect async consume task status by task UUID.
            needs: [input_json.task_id]
            endpoint: /api/tasks/?task_id={task_id}
          stacks_list:
            intent: Directory of registered Lens stack providers with live status.
            reads: lens_registry cabinet drawer + provider tool_manifest pings
          stacks_bulk_edit:
            intent: >-
              Apply a Paperless bulk-edit method to one or more documents.
              needs: [input_json.document_ids, input_json.method]
            endpoint: /api/documents/bulk_edit/ (POST)
            methods:
              set_correspondent: Assign a correspondent. parameters.correspondent (id or null).
              set_document_type: Assign a document type. parameters.document_type (id or null).
              set_storage_path: Assign a storage path. parameters.storage_path (id or null).
              add_tag: Add one HA-label-backed tag. input_json.label_slugs (exactly one).
              remove_tag: Remove one HA-label-backed tag. input_json.label_slugs (exactly one).
              delete: Permanently delete document(s). IRREVERSIBLE — requires confirm=true.
              split: >-
                Split one document into 2+ new documents by page range. parameters.pages is a
                comma-separated range string, e.g. "1-2,3-4" (NOT a JSON array of arrays — Paperless's
                API parses a string). Runs async through the normal consume/OCR pipeline; new documents
                inherit the source's metadata verbatim (correspondent/tags are copied, not
                re-derived from content — a mixed-store scan split into per-store documents will need
                a separate reclassification pass, e.g. re-tagging from OCR content, before its tags
                can be trusted). Only one source document_id per call. delete_originals defaults false
                (recommended); true requires confirm=true and permanently removes the source once the
                split documents are consumed.
              reprocess: >-
                Re-run Paperless's full document-processing pipeline (OCR AND archived-file
                regeneration, not narrowly "redo OCR") using the instance's current OCR_MODE. A no-op
                if OCR_MODE=skip and the document already has a text layer. parameters: {} (none
                needed). Async — re-fetch the document after a delay to see the result.
            example: >-
              section=stacks mode=stacks_bulk_edit
              input_json={"document_ids":[49],"method":"split","parameters":{"pages":"1-2,3-4"}}
          stacks_flag_for_review:
            intent: >-
              "Hey boss, look at this." Raise a persistent HA notification for a document that
              needs human eyes — low-confidence extraction, unreadable OCR field, ambiguous
              reclassification, etc. Not a substitute for automated handling; use when automation
              genuinely can't resolve something and a human should look at the source image.
            needs: [input_json.document_id, input_json.reason]
            reads: household cabinet integrations_config.paperless_ngx (for the doc link)
            writes: persistent_notification (via zen_dojotools_systemtools pnotif_raise)
            note: >-
              Raises an in-HA persistent notification with a direct link to the document, not a
              mobile push. A true mobile push would need notify.mobile_app_<device> wired in
              separately — not built here.
            example: >-
              section=stacks mode=stacks_flag_for_review
              input_json={"document_id":53,"reason":"Total illegible after OCR — needs manual read from the image."}
        radar_modes:
          help:
            intent: Return radar section help.
            reads: none
          configure:
            intent: Inspect Zammad config state. Read-only.
            reads: household cabinet integrations_config.fulfillment
          by_anchor:
            intent: Find service desk tickets linked to a typed anchor (label/person/area/ticket).
            needs: [input_json.anchor_type, input_json.anchor_value]
            proxies_to: zen_dojotools_servicedesk tickets_by_anchor
          get:
            intent: Return one ticket by ID with anchor_contexts evidence.
            needs: [input_json.ticket_id]
            proxies_to: zen_dojotools_servicedesk ticket_get
          find:
            intent: Search tickets by query string.
            needs: [input_json.query OR query field]
            proxies_to: zen_dojotools_servicedesk ticket_find
          list:
            intent: List open tickets. No anchor required.
            proxies_to: zen_dojotools_servicedesk ticket_list

    - choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm == "tool_manifest" }}'
        sequence:
        - action: script.zen_stack_paperless
          response_variable: _paperless_manifest
          continue_on_error: true
          data:
            mode: tool_manifest
            caller_token: "{{ caller_token_norm }}"
        - action: script.zen_stack_radar
          response_variable: _radar_manifest
          continue_on_error: true
          data:
            mode: tool_manifest
            caller_token: "{{ caller_token_norm }}"
        - variables:
            result: >-
              {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
              {{- MF.tool_manifest(
                tool='zen_dojotools_library',
                display_name='Library — Knowledge Broker and Lens Owner',
                tier='dojotools',
                version='6.12.0',
                health={'configured': true, 'status': 'ok', 'notes': []},
                required_labels=['dojotools'],
                optional_labels=['library', 'documents', 'paperless', 'radar'],
                consumes=['label', 'person', 'area_id', 'zone', 'concept', 'ticket'],
                returns=['document_evidence', 'ticket_evidence', 'item_evidence'],
                failure_policy='soft',
                content_policy='redacted_by_default',
                risk_class='read_redacted',
                modes={'lookup': 'stacks_by_anchor', 'radar_lookup': 'radar_tickets_by_anchor', 'catalog_lookup': 'by_anchor', 'manifest': 'tool_manifest'},
                children=[{
                  'tool': 'zen_stack_paperless',
                  'stack': 'stacks',
                  'manifest': _paperless_manifest if _paperless_manifest is mapping else {},
                  'manifest_via': {'tool': 'zen_dojotools_library', 'mode': 'tool_manifest'}
                }, {
                  'tool': 'zen_stack_radar',
                  'stack': 'radar',
                  'manifest': _radar_manifest if _radar_manifest is mapping else {},
                  'manifest_via': {'tool': 'zen_dojotools_library', 'mode': 'tool_manifest'}
                }],
                icon='mdi:bookshelf',
                color='brown',
                stripe=3,
                impact='soft',
                managed=true,
                lens_provider=true,
                mcp_exposed=true,
                self_repair=['relabel', 'rereg_lens'],

                caller_token=caller_token_norm
              ) | from_json | combine({'register_mode': 'register', 'provider_key': 'library_catalog'}) -}}
        - stop: library tool manifest
          response_variable: result

    - choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm == "help" }}'
        sequence:
        - variables:
            result:
              status: info
              tool: zen_dojotools_library
              version: "6.12.0"
              mode: help
              description: >-
                Two departments in one tool. section=stacks: knowledge broker and Lens owner —
                routes document/ticket/wiki requests to registered providers (Paperless, Radar, Wiki.js).
                section=catalog: FRBR physical item catalog with barcode-first intake, auto-shelving,
                loan/return circulation, and multi-class location support.
              lens_contract:
                provider_registration: >-
                  Providers write config to integrations_config.<provider> via zen_sutra_filecabinet.
                  Library reads that config on each call to resolve the provider endpoint.
                failure_policy: >-
                  soft — missing or misconfigured provider returns status=error, never raises.
                  Callers must check status and degrade gracefully.
                redaction_default: >-
                  Document content is redacted unless include_content=true is passed.
                  Consumers should not rely on content being present by default.
                consumers: >-
                  Inspect, Index, Query, and Room Manager consume article_evidence leaves via
                  stacks_by_anchor or stacks_document_lens. They call Library, not zen_stack_paperless.
                media_lens_note: >-
                  Music/media evidence (track_evidence, album_evidence, playlist_evidence, etc.)
                  is served by zen_dojotools_media_manager (provider_key=media, department=special_collections)
                  via zen_stack_media — NOT by Library. Call zen_dojotools_media_manager mode=stacks_by_anchor
                  directly, or route through zen_dojotools_lens_dispatch. Library owns document/ticket/wiki
                  evidence only. Media prefs (boost_artists, default_volume, preferred_sources, etc.) are
                  written via zen_dojotools_profile_editor media_prefs field and read by Media Manager at
                  query time.
              sections:
                stacks:
                  description: >-
                    Paperless-NGX document search, evidence, and tag operations.
                    Provider: zen_stack_paperless (calls zen_sutra_paperless internally).
                    Fails soft if Paperless is not configured.
                  modes: [stacks_search, stacks_document_get, stacks_document_lens, stacks_similar,
                    stacks_by_anchor, stacks_tags_list, stacks_tag_audit, stacks_correspondents_list,
                    stacks_document_types_list, stacks_storage_paths_list, stacks_task_status,
                    stacks_configure, stacks_document_update, stacks_document_tag,
                    stacks_document_delete, stacks_document_notes, stacks_note_add, stacks_bulk_edit,
                    stacks_correspondent_get, stacks_correspondent_create, stacks_correspondent_update, stacks_tag_create,
                    stacks_document_type_create, stacks_storage_path_create, stacks_by_company,
                    stacks_document_restore, stacks_list]
                  example: "section=stacks mode=stacks_search query=invoice"
                catalog:
                  description: >-
                    FRBR physical item catalog. Library owns circulation (loan/return) and storage for all cataloged items.
                    item_type selects collection: music_recording, book, game, video, periodical, art_print.
                    Barcode-first intake: scan via Barcode Buddy → catalog_add resolves product + auto-shelves.
                    Locations support multiple catalog classes (book+game on same shelf).
                    Use mode=configure_status to see what's configured. Use mode=intake_pending to find
                    uncataloged ISBN items at the intake location. Use mode=help section=catalog for full guide.
                  modes: [add, update, browse, find, search, loan, return, move, configure, configure_status, intake_pending, get, list]
                  workflow: "configure_status → intake_pending → add (auto-shelves) → browse/find/search → loan → return → move (reshelve)"
                  agent_superpowers: >-
                    You have a full physical item catalog. Scan a barcode via Barcode Buddy and it
                    lands at the intake shelf — call intake_pending to see what's waiting, then
                    add to register each item and auto-shelve it. browse/find/search work across
                    all item types at once. loan checks out to a borrower, return brings it back,
                    move reshelves to any named location (set_as_home=true makes it the new home).
                    configure_status shows every shelf class so you know what each shelf holds.
                    Lens bus registered — ask 'what books are in the living room?' and it answers
                    via area_id anchor without you calling Library directly. For buying/consuming
                    stock or managing chores, use zen_dojotools_inventory — that's the ERP layer
                    Library sits on top of.
                  example: "section=catalog item_type=book mode=add input_json={\"barcode\":\"9780375826696\"}"
        - stop: library help
          response_variable: result

    - choose:
      - conditions:
        - condition: template
          value_template: '{{ section_norm == "stacks" and mode_norm == "help" }}'
        sequence:
        - variables:
            result:
              status: info
              tool: Zen DojoTools Library
              section: stacks
              mode: help
              message: Stacks is the Paperless-NGX document/evidence department. Gate 1 is read-only.
              cases: "{{ stacks_modes }}"
              caller_token: "{{ caller_token_norm }}"
        - stop: stacks help
          response_variable: result
      - conditions:
        - condition: template
          value_template: '{{ stack_norm in ["paperless", ""] and mode_norm in ["get", "find", "list", "configure", "by_anchor"] and section_norm != "catalog" }}'
        sequence:
        - variables:
            _paperless_mode_map:
              get: stacks_document_get
              find: stacks_search
              list: stacks_search
              configure: stacks_configure
              by_anchor: stacks_by_anchor
            _paperless_mapped_mode: "{{ _paperless_mode_map.get(mode_norm, mode_norm) }}"
        - action: script.zen_dojotools_library
          response_variable: _paperless_generic_result
          continue_on_error: true
          data:
            section: stacks
            mode: "{{ _paperless_mapped_mode }}"
            input_json: "{{ input_json_norm }}"
            query: "{{ query_norm }}"
            caller_token: "{{ caller_token_norm }}"
        - variables:
            result: >-
              {%- set r = _paperless_generic_result if _paperless_generic_result is mapping else {} -%}
              {{ r | combine({'stack': 'paperless', 'library_mode': mode_norm}, recursive=true) }}
        - stop: paperless generic verb done
          response_variable: result
      - conditions:
        - condition: template
          value_template: '{{ mode_norm == "stacks_list" }}'
        sequence:
        - action: script.zen_stack_paperless
          response_variable: _sl_paperless_raw
          continue_on_error: true
          data:
            mode: tool_manifest
            caller_token: "{{ caller_token_norm }}"
        - action: script.zen_stack_radar
          response_variable: _sl_radar_raw
          continue_on_error: true
          data:
            mode: tool_manifest
            caller_token: "{{ caller_token_norm }}"
        - variables:
            _sl_pm: "{{ _sl_paperless_raw if _sl_paperless_raw is mapping else {} }}"
            _sl_rm: "{{ _sl_radar_raw if _sl_radar_raw is mapping else {} }}"
            _sl_paperless_ok: "{{ _sl_pm.get('status') in ['ok', 'success', 'info'] }}"
            _sl_radar_ok: "{{ _sl_rm.get('status') in ['ok', 'success', 'info'] }}"
            _sl_paperless_configured: "{{ _sl_pm.get('health', {}).get('configured', false) if _sl_pm is mapping else false }}"
            _sl_radar_configured: "{{ _sl_rm.get('health', {}).get('configured', false) if _sl_rm is mapping else false }}"
        - variables:
            result:
              status: success
              tool: zen_dojotools_library
              mode: stacks_list
              total: 3
              available: "{{ ([true, _sl_paperless_ok, _sl_radar_ok] | select('equalto', true) | list | count) }}"
              stacks:
                - stack: wiki
                  provider: zen_sutra_wikijs
                  backend: Wiki.js (GraphQL)
                  status: available
                  capabilities: [get, find, list, configure, by_anchor]
                  call_via: "zen_dojotools_library section=stacks stack=wiki mode=<verb>"
                  notes: Always available. No separate configuration required.
                - stack: paperless
                  provider: zen_stack_paperless
                  backend: Paperless-NGX
                  status: "{{ 'available' if _sl_paperless_ok else 'unavailable' }}"
                  configured: "{{ _sl_paperless_configured }}"
                  capabilities: [get, find, list, configure, by_anchor]
                  call_via: "zen_dojotools_library section=stacks stack=paperless mode=<verb>"
                  manifest: "{{ _sl_pm }}"
                - stack: radar
                  provider: zen_stack_radar
                  backend: Zammad (Service Desk)
                  status: "{{ 'available' if _sl_radar_ok else 'unavailable' }}"
                  configured: "{{ _sl_radar_configured }}"
                  capabilities: [get, find, list, configure, by_anchor]
                  call_via: "zen_dojotools_library section=stacks stack=radar mode=<verb>"
                  manifest: "{{ _sl_rm }}"
              caller_token: "{{ caller_token_norm }}"
        - stop: stacks list
          response_variable: result

      - conditions:
        - condition: template
          value_template: '{{ section_norm == "stacks" and mode_norm == "stacks_configure" }}'
        sequence:
        - variables:
            _hh: "{{ states('sensor.zen_default_household_cabinet_resolved') }}"
            _cfg_action: "{{ input_data.get('action', 'inspect') | string | trim | lower if input_data is mapping else 'inspect' }}"
            _cfg_url: "{{ input_data.get('url', '') | string | trim if input_data is mapping else '' }}"
            _cfg_api_version: "{{ input_data.get('api_version', 9) | int(9) if input_data is mapping else 9 }}"
        - variables:
            _cfg_valid_scheme: "{{ _cfg_url.startswith('https://') or _cfg_url.startswith('http://') }}"
            _cfg_insecure_scheme: "{{ _cfg_url.startswith('http://') }}"
        - action: script.zen_dojotools_filecabinet
          response_variable: _ic_fc_raw
          continue_on_error: true
          data:
            action_type: get
            volume_entity_id: "{{ _hh }}"
            path: integrations_config
        - variables:
            _integrations_config: >-
              {%- set _ic = _ic_fc_raw.get('value', {}) if _ic_fc_raw is mapping and _ic_fc_raw.get('status') == 'success' else {} -%}
              {{ _ic if _ic is mapping else {} }}
        - variables:
            _cfg: "{{ _integrations_config.get('paperless_ngx', {}) if _integrations_config is mapping else {} }}"

        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _cfg_action in ["inspect", "get", "read", ""] }}'
            sequence:
            - variables:
                result:
                  status: info
                  tool: Zen DojoTools Library
                  section: stacks
                  mode: stacks_configure
                  message: Pass input_json {"action":"set","url":"https://paperless.example","api_version":9} to write config, or {"action":"reset"} to remove Paperless config.
                  config:
                    url_configured: "{{ (_cfg.get('url', '') | string | trim) != '' if _cfg is mapping else false }}"
                    url: "{{ _cfg.get('url', '') if _cfg is mapping else '' }}"
                    api_version: "{{ _cfg.get('api_version', 9) | int(9) if _cfg is mapping else 9 }}"
                    token_configured: unknown_by_design
                  caller_token: "{{ caller_token_norm }}"
            - stop: stacks configure inspect
              response_variable: result
          - conditions:
            - condition: template
              value_template: '{{ _cfg_action not in ["set", "update", "reset"] }}'
            sequence:
            - variables:
                result:
                  status: error
                  tool: Zen DojoTools Library
                  section: stacks
                  mode: stacks_configure
                  message: "Unknown config action '{{ _cfg_action }}'. Use inspect, set, update, or reset."
                  caller_token: "{{ caller_token_norm }}"
            - stop: stacks configure bad action
              response_variable: result
          - conditions:
            - condition: template
              value_template: '{{ _cfg_action in ["set", "update"] and _cfg_url == "" }}'
            sequence:
            - variables:
                result:
                  status: error
                  tool: Zen DojoTools Library
                  section: stacks
                  mode: stacks_configure
                  message: url is required for config action set/update.
                  caller_token: "{{ caller_token_norm }}"
            - stop: stacks configure missing url
              response_variable: result
          - conditions:
            - condition: template
              value_template: '{{ _cfg_action in ["set", "update"] and not _cfg_valid_scheme }}'
            sequence:
            - variables:
                result:
                  status: error
                  tool: Zen DojoTools Library
                  section: stacks
                  mode: stacks_configure
                  message: URL must begin with https:// or http://.
                  url: "{{ _cfg_url }}"
                  caller_token: "{{ caller_token_norm }}"
            - stop: stacks configure invalid url
              response_variable: result

        - action: script.zen_dojotools_filecabinet
          response_variable: _ic_read
          continue_on_error: true
          data:
            action_type: read
            show_hidden_volumes: false
            volume_entity_id:
              - '{{ _hh }}'
            key: integrations_config

        - variables:
            _ic_raw: >-
              {%- set r = _ic_read.get('result', {}) if _ic_read is mapping else {} -%}
              {%- set r = r if r is mapping else (r | from_json if r is string else {}) -%}
              {%- set v = r.get('integrations_config', {}) -%}
              {%- set v = v.get('value', v) if v is mapping else {} -%}
              {{ v if v is mapping else (v | from_json if v is string else {}) }}
            _ic_exists: >-
              {%- set r = _ic_read.get('result', {}) if _ic_read is mapping else {} -%}
              {%- set r = r if r is mapping else (r | from_json if r is string else {}) -%}
              {{ 'integrations_config' in r }}

        - variables:
            _ic_next: >-
              {%- if _cfg_action == 'reset' -%}
                {%- set ns = namespace(out={}) -%}
                {%- for k, v in _ic_raw.items() if _ic_raw is mapping -%}
                  {%- if k != 'paperless_ngx' -%}{%- set ns.out = ns.out | combine({k: v}, recursive=true) -%}{%- endif -%}
                {%- endfor -%}
                {{ ns.out }}
              {%- else -%}
                {%- set existing_raw = _ic_raw.get('paperless_ngx', {}) if _ic_raw is mapping else {} -%}
                {%- set existing = namespace(out={}) -%}
                {%- for k, v in existing_raw.items() if existing_raw is mapping -%}
                  {%- if k != 'warning' -%}{%- set existing.out = existing.out | combine({k: v}, recursive=true) -%}{%- endif -%}
                {%- endfor -%}
                {%- set entry = existing.out | combine({'url': _cfg_url | regex_replace('/$',''), 'api_version': _cfg_api_version, 'status': 'configured', 'updated_at': now().isoformat()}, recursive=true) -%}
                {%- if _cfg_url.startswith('http://') -%}{%- set entry = entry | combine({'warning': 'insecure_http_scheme'}, recursive=true) -%}{%- endif -%}
                {{ _ic_raw | combine({'paperless_ngx': entry}) }}
              {%- endif -%}

        - action: script.zen_dojotools_filecabinet
          response_variable: _ic_write
          continue_on_error: true
          data:
            action_type: "{{ 'update' if _ic_exists else 'create' }}"
            force_action: true
            set_timestamp: true
            show_hidden_volumes: false
            volume_entity_id:
              - '{{ _hh }}'
            key: integrations_config
            value: "{{ _ic_next | tojson }}"

        - variables:
            _write_ok: "{{ _ic_write is mapping and _ic_write.get('status', '') in ['success', 'ok', 'warning'] }}"
            result:
              status: "{{ 'success' if _write_ok else 'error' }}"
              tool: Zen DojoTools Library
              section: stacks
              mode: stacks_configure
              message: "{{ 'Paperless config reset.' if _cfg_action == 'reset' else 'Paperless config stored.' }}"
              config:
                url_configured: "{{ _cfg_action != 'reset' }}"
                url: "{{ '' if _cfg_action == 'reset' else (_cfg_url | regex_replace('/$','')) }}"
                api_version: "{{ _cfg_api_version }}"
                token_configured: unknown_by_design
                warning: "{{ 'insecure_http_scheme' if _cfg_url.startswith('http://') else none }}"
              write_result: "{{ _ic_write }}"
              caller_token: "{{ caller_token_norm }}"
        - stop: stacks configure write
          response_variable: result

    - choose:
      # Bug reported by Veronica (ticket #282): calling the FULL mode name
      # "stacks_search" directly with stack=radar fell through to the generic
      # paperless-only block below (that block never checked stack_norm — it
      # was written when stacks_search only ever meant Paperless). The short
      # aliased verbs (get/find/list/etc, ~line 497) already route radar
      # correctly, but "stacks_search" itself has no aliased-verb equivalent,
      # so a caller who used the full mode name bypassed that routing
      # entirely and silently got Paperless results back. Intercepted here,
      # ahead of the generic block, so it never reaches it for stack=radar.
      - conditions:
        - condition: template
          value_template: '{{ section_norm == "stacks" and stack_norm == "radar" and mode_norm == "stacks_search" }}'
        sequence:
        - action: script.zen_dojotools_servicedesk
          response_variable: _radar_search_raw
          continue_on_error: true
          data:
            mode: ticket_search
            input_json: >-
              {{- {'query': (input_data.get('query', query_norm) | string | trim if input_data is mapping else query_norm)} | tojson -}}
            caller_token: "{{ caller_token_norm }}"
        - variables:
            result: >-
              {%- set r = _radar_search_raw if _radar_search_raw is mapping else {} -%}
              {{ r | combine({'stack': 'radar', 'library_mode': 'stacks_search', 'source': {'system': 'zammad'}}, recursive=true) }}
        - stop: radar stacks_search complete
          response_variable: result
      - conditions:
        - condition: template
          value_template: '{{ section_norm == "stacks" and mode_norm in ["stacks_search","stacks_similar","stacks_by_anchor","stacks_tags_list","stacks_tag_audit","stacks_correspondents_list","stacks_document_types_list","stacks_storage_paths_list","stacks_task_status","stacks_document_get","stacks_document_lens","stacks_correspondent_get"] }}'
        sequence:
        - variables:
            _document_id: "{{ input_data.get('document_id', '') | string | trim if input_data is mapping else '' }}"
            _task_id: "{{ input_data.get('task_id', '') | string | trim if input_data is mapping else '' }}"
            _search_query: "{{ input_data.get('query', query_norm) | string | trim if input_data is mapping else query_norm }}"
            _anchor_type: "{{ input_data.get('anchor_type', '') | string | trim | lower if input_data is mapping else '' }}"
            _anchor_ids: >-
              {%- set raw = input_data.get('anchor_ids', []) if input_data is mapping else [] -%}
              {%- if raw is string -%}
                {{ [raw | trim | lower] if raw | trim != '' else [] }}
              {%- elif raw is sequence -%}
                {%- set ns = namespace(v=[]) -%}
                {%- for x in raw -%}
                  {%- set sx = x | string | trim | lower -%}
                  {%- if sx != '' -%}{%- set ns.v = ns.v + [sx] -%}{%- endif -%}
                {%- endfor -%}
                {{ ns.v | unique | list }}
              {%- else -%}{{ [] }}{%- endif -%}
            _anchor_page_size: "{{ input_data.get('page_size', 50) | int(50) if input_data is mapping else 50 }}"
            _anchor_include_suggestions: "{{ input_data.get('include_suggestions', false) if input_data is mapping else false }}"
            _include_content: "{{ input_data.get('include_content', false) | bool if input_data is mapping else false }}"
            _correspondent_id: "{{ input_data.get('correspondent_id', '') | string | trim if input_data is mapping else '' }}"
            _endpoint: >-
              {%- if mode_norm == 'stacks_search' -%}
                /api/documents/?query={{ _search_query | urlencode }}
              {%- elif mode_norm == 'stacks_similar' -%}
                /api/documents/?more_like_id={{ _document_id | urlencode }}
              {%- elif mode_norm in ['stacks_document_get', 'stacks_document_lens'] -%}
                /api/documents/{{ _document_id | urlencode }}/
              {%- elif mode_norm == 'stacks_correspondent_get' -%}
                /api/correspondents/{{ _correspondent_id | urlencode }}/
              {%- elif mode_norm == 'stacks_tags_list' -%}
                /api/tags/
              {%- elif mode_norm == 'stacks_tag_audit' -%}
                /api/tags/
              {%- elif mode_norm == 'stacks_correspondents_list' -%}
                /api/correspondents/
              {%- elif mode_norm == 'stacks_document_types_list' -%}
                /api/document_types/
              {%- elif mode_norm == 'stacks_storage_paths_list' -%}
                /api/storage_paths/
              {%- elif mode_norm == 'stacks_task_status' -%}
                /api/tasks/?task_id={{ _task_id | urlencode }}
              {%- else -%}{%- endif -%}
            _missing: >-
              {%- if mode_norm == 'stacks_search' and _search_query == '' -%}query
              {%- elif mode_norm in ['stacks_document_get', 'stacks_document_lens', 'stacks_similar'] and _document_id == '' -%}document_id
              {%- elif mode_norm == 'stacks_correspondent_get' and _correspondent_id == '' -%}correspondent_id
              {%- elif mode_norm == 'stacks_task_status' and _task_id == '' -%}task_id
              {%- elif mode_norm == 'stacks_by_anchor' and (_anchor_type == '' or _anchor_ids | length == 0) -%}anchor_type and anchor_ids
              {%- else -%}{%- endif -%}
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _missing | trim != "" }}'
            sequence:
            - variables:
                result:
                  status: error
                  tool: Zen DojoTools Library
                  section: stacks
                  mode: "{{ mode_norm }}"
                  message: "Missing required field: {{ _missing | trim }}"
                  caller_token: "{{ caller_token_norm }}"
            - stop: stacks missing input
              response_variable: result
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ mode_norm == "stacks_by_anchor" and _anchor_type != "label" }}'
            sequence:
            - variables:
                result:
                  status: success
                  tool: Zen DojoTools Library
                  section: stacks
                  mode: stacks_by_anchor
                  source:
                    system: paperless_ngx
                  anchor_query:
                    anchor_type: "{{ _anchor_type }}"
                    anchor_ids: "{{ _anchor_ids }}"
                    include_suggestions: "{{ _anchor_include_suggestions }}"
                  result:
                    count: 0
                    documents: []
                    content_redacted: true
                    source_count: 0
                    source_page_size: 0
                    reason: anchor_type_not_implemented_for_paperless
                  caller_token: "{{ caller_token_norm }}"
            - stop: stacks by anchor unsupported type
              response_variable: result
          - conditions:
            - condition: template
              value_template: '{{ mode_norm == "stacks_by_anchor" and _anchor_type == "label" }}'
            sequence:
            - action: script.zen_sutra_paperless
              response_variable: _anchor_tags_raw
              continue_on_error: true
              data:
                action_type: get
                endpoint: /api/tags/
            - variables:
                _anchor_tags_content: "{{ _anchor_tags_raw.get('result', {}).get('content', {}) if _anchor_tags_raw is mapping else {} }}"
                _anchor_tag_matches: >-
                  {%- set tags = _anchor_tags_content.get('results', []) if _anchor_tags_content is mapping and _anchor_tags_content.get('results', []) is sequence and _anchor_tags_content.get('results', []) is not string else [] -%}
                  {%- set ns = namespace(rows=[]) -%}
                  {%- for t in tags if t is mapping -%}
                    {%- set name = t.get('name', '') | string | trim -%}
                    {%- set slug = t.get('slug', name | slugify(separator='_')) | string | trim | lower -%}
                    {%- set tid = t.get('id', none) -%}
                    {%- if tid is not none and slug in _anchor_ids -%}
                      {%- set ns.rows = ns.rows + [{'id': tid, 'name': name, 'slug': slug}] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ ns.rows }}
                _anchor_tag_ids: >-
                  {%- set ns = namespace(ids=[]) -%}
                  {%- for t in _anchor_tag_matches if t is mapping and t.get('id', none) is not none -%}
                    {%- set ns.ids = ns.ids + [t.get('id')] -%}
                  {%- endfor -%}
                  {{ ns.ids | unique | list }}
            - choose:
              - conditions:
                - condition: template
                  value_template: '{{ _anchor_tag_ids | length == 0 }}'
                sequence:
                - variables:
                    result:
                      status: success
                      tool: Zen DojoTools Library
                      section: stacks
                      mode: stacks_by_anchor
                      source:
                        system: paperless_ngx
                      anchor_query:
                        anchor_type: label
                        anchor_ids: "{{ _anchor_ids }}"
                        include_suggestions: "{{ _anchor_include_suggestions }}"
                      result:
                        count: 0
                        documents: []
                        content_redacted: true
                        source_count: 0
                        source_page_size: 0
                        reason: no_matching_paperless_tags
                      trace:
                        endpoint: /api/tags/
                        method: GET
                      caller_token: "{{ caller_token_norm }}"
                - stop: stacks by anchor no tag matches
                  response_variable: result
            - variables:
                _anchor_docs_endpoint: "/api/documents/?tags__id__all={{ _anchor_tag_ids | join(',') | urlencode }}&page_size={{ _anchor_page_size | int(50) }}"
            - action: script.zen_sutra_paperless
              response_variable: _anchor_docs_raw
              continue_on_error: true
              data:
                action_type: get
                endpoint: "{{ _anchor_docs_endpoint }}"
            - variables:
                _anchor_docs_content: "{{ _anchor_docs_raw.get('result', {}).get('content', {}) if _anchor_docs_raw is mapping else {} }}"
                result: >-
                  {%- set docs = _anchor_docs_content.get('results', []) if _anchor_docs_content is mapping and _anchor_docs_content.get('results', []) is sequence and _anchor_docs_content.get('results', []) is not string else [] -%}
                  {%- set ns = namespace(out=[]) -%}
                  {%- for d in docs if d is mapping -%}
                    {%- set doc_tag_ids = d.get('tags', []) if d.get('tags', []) is sequence and d.get('tags', []) is not string else [] -%}
                    {%- set m = namespace(tags=[], anchors=[], labels=[], matched=[]) -%}
                    {%- for t in _anchor_tag_matches if t is mapping and t.get('id') in doc_tag_ids -%}
                      {%- set slug = t.get('slug', '') | string | lower -%}
                      {%- set m.tags = m.tags + [t] -%}
                      {%- set m.labels = m.labels + [{'label_id': slug, 'source': 'paperless_tag', 'mapped': true}] -%}
                      {%- set m.anchors = m.anchors + [{'type': 'label', 'id': slug, 'confidence': 'explicit', 'source': 'paperless_tag', 'provider': 'paperless_ngx', 'paperless_tag_id': t.get('id'), 'name': t.get('name', '')}] -%}
                      {%- set m.matched = m.matched + [slug] -%}
                    {%- endfor -%}
                    {%- if m.matched | length > 0 -%}
                      {%- set row = {
                        'id': d.get('id', none),
                        'correspondent': d.get('correspondent', none),
                        'document_type': d.get('document_type', none),
                        'storage_path': d.get('storage_path', none),
                        'title': '',
                        'title_redacted': true,
                        'tags': doc_tag_ids,
                        'paperless_tags': m.tags,
                        'paperless_tag_ids': doc_tag_ids,
                        'ha_labels': m.labels,
                        'anchor_contexts': m.anchors,
                        'matched_anchor_ids': m.matched | unique | list,
                        'created': d.get('created', none),
                        'created_date': d.get('created_date', none),
                        'modified': d.get('modified', none),
                        'added': d.get('added', none),
                        'deleted_at': d.get('deleted_at', none),
                        'page_count': d.get('page_count', none),
                        'mime_type': d.get('mime_type', none),
                        'notes_count': d.get('notes', []) | length if d.get('notes', []) is sequence and d.get('notes', []) is not string else 0,
                        'content_redacted': true,
                        'stack': {
                          'provider': 'paperless_ngx',
                          'source': 'paperless_ngx',
                          'object_type': 'document',
                          'source_id': d.get('id', none),
                          'evidence_id': 'paperless_ngx:document:' ~ (d.get('id', '') | string),
                          'lens_mode': 'stacks_by_anchor'
                        }
                      } -%}
                      {%- set ns.out = ns.out + [row] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{
                    {
                      'status': 'success' if _anchor_docs_raw is mapping and _anchor_docs_raw.get('status') == 'success' else (_anchor_docs_raw.get('status', 'error') if _anchor_docs_raw is mapping else 'error'),
                      'tool': 'Zen DojoTools Library',
                      'section': 'stacks',
                      'mode': 'stacks_by_anchor',
                      'source': _anchor_docs_raw.get('source', {'system': 'paperless_ngx'}) if _anchor_docs_raw is mapping else {'system': 'paperless_ngx'},
                      'anchor_query': {
                        'anchor_type': 'label',
                        'anchor_ids': _anchor_ids,
                        'include_suggestions': _anchor_include_suggestions
                      },
                      'result': {
                        'count': ns.out | length,
                        'documents': ns.out,
                        'content_redacted': true,
                        'source_count': _anchor_docs_content.get('count', 0) if _anchor_docs_content is mapping else 0,
                        'source_page_size': docs | length
                      },
                      'trace': {
                        'tag_endpoint': '/api/tags/',
                        'document_endpoint': _anchor_docs_endpoint,
                        'method': 'GET',
                        'http_status': _anchor_docs_raw.get('http_status', 0) if _anchor_docs_raw is mapping else 0
                      },
                      'caller_token': caller_token_norm
                    }
                  }}
            - stop: stacks by anchor label complete
              response_variable: result
        - action: script.zen_sutra_paperless
          response_variable: _stacks_raw
          continue_on_error: true
          data:
            action_type: get
            endpoint: "{{ _endpoint | trim }}"
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ mode_norm in ["stacks_search", "stacks_similar", "stacks_document_get", "stacks_document_lens"] }}'
            sequence:
            - action: script.zen_sutra_paperless
              response_variable: _doc_tags_raw
              continue_on_error: true
              data:
                action_type: get
                endpoint: /api/tags/?page_size=200
          default:
          - variables:
              _doc_tags_raw: {}
        - variables:
            _content: "{{ _stacks_raw.get('result', {}).get('content', {}) if _stacks_raw is mapping else {} }}"
            _source: "{{ _stacks_raw.get('source', {'system': 'paperless_ngx'}) if _stacks_raw is mapping else {'system': 'paperless_ngx'} }}"
            _ha_label_index: "{{ labels() | list }}"
            _doc_tags_content: "{{ _doc_tags_raw.get('result', {}).get('content', {}) if _doc_tags_raw is mapping else {} }}"
            _doc_tags_fetch_ok: "{{ _doc_tags_raw is mapping and _doc_tags_raw.get('status') == 'success' }}"
            _doc_tags_by_id: >-
              {%- set ns = namespace(rows=[]) -%}
              {%- set tags = _doc_tags_content.get('results', []) if _doc_tags_content is mapping and _doc_tags_content.get('results', []) is sequence and _doc_tags_content.get('results', []) is not string else [] -%}
              {%- for t in tags if t is mapping and t.get('id', none) is not none -%}
                {%- set _name = t.get('name', '') | string | trim -%}
                {%- set ns.rows = ns.rows + [{'id': t.get('id'), 'name': _name, 'slug': t.get('slug', _name | slugify(separator='_')) | string | trim}] -%}
              {%- endfor -%}
              {{ ns.rows }}
            _safe_content: >-
              {%- if mode_norm not in ['stacks_search', 'stacks_similar', 'stacks_document_get', 'stacks_document_lens'] -%}
                {{ _content }}
              {%- else -%}
              {%- macro safe_doc(d) -%}
                {%- if d is mapping -%}
                  {%- set tag_ns = namespace(paperless_tags=[], paperless_tag_ids=[], ha_labels=[], unmapped_tags=[]) -%}
                  {%- for t in d.get('tags', []) if d.get('tags', []) is sequence and d.get('tags', []) is not string -%}
                    {%- if t is mapping -%}
                      {%- set _tn = t.get('name', t.get('slug', t.get('id', ''))) | string | trim -%}
                      {%- set _ts = t.get('slug', _tn | slugify(separator='_')) | string | trim -%}
                      {%- set _tid = t.get('id', none) -%}
                    {%- elif t is string -%}
                      {%- set _tn = t | trim -%}
                      {%- set _ts = _tn | slugify(separator='_') -%}
                      {%- set _tid = none -%}
                    {%- else -%}
                      {%- set _tid = t -%}
                      {%- set _resolved = _doc_tags_by_id | selectattr('id', 'equalto', t) | list -%}
                      {%- if _resolved | length > 0 -%}
                        {%- set _tn = _resolved[0].name -%}
                        {%- set _ts = _resolved[0].slug -%}
                      {%- else -%}
                        {%- set _tn = '' -%}
                        {%- set _ts = '' -%}
                      {%- endif -%}
                    {%- endif -%}
                    {%- if _tid is not none -%}{%- set tag_ns.paperless_tag_ids = tag_ns.paperless_tag_ids + [_tid] -%}{%- endif -%}
                    {%- if _tn != '' -%}{%- set tag_ns.paperless_tags = tag_ns.paperless_tags + [{'id': _tid, 'name': _tn, 'slug': _ts}] -%}{%- endif -%}
                    {%- if _ts != '' and _ts in _ha_label_index -%}
                      {%- set tag_ns.ha_labels = tag_ns.ha_labels + [{'label_id': _ts, 'source': 'paperless_tag', 'mapped': true}] -%}
                    {%- elif _tn != '' or _tid is not none -%}
                      {%- set tag_ns.unmapped_tags = tag_ns.unmapped_tags + [{'id': _tid, 'name': _tn, 'slug': _ts}] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ {
                    'id': d.get('id', none),
                    'correspondent': d.get('correspondent', none),
                    'document_type': d.get('document_type', none),
                    'storage_path': d.get('storage_path', none),
                    'title': d.get('title', ''),
                    'tags': d.get('tags', []),
                    'paperless_tags': tag_ns.paperless_tags,
                    'paperless_tag_ids': tag_ns.paperless_tag_ids,
                    'ha_labels': tag_ns.ha_labels,
                    'unmapped_tags': tag_ns.unmapped_tags,
                    'created': d.get('created', none),
                    'created_date': d.get('created_date', none),
                    'modified': d.get('modified', none),
                    'added': d.get('added', none),
                    'deleted_at': d.get('deleted_at', none),
                    'archive_serial_number': d.get('archive_serial_number', none),
                    'original_available': (d.get('original_file_name', '') | string | trim) != '',
                    'archive_available': (d.get('archived_file_name', '') | string | trim) != '',
                    'page_count': d.get('page_count', none),
                    'mime_type': d.get('mime_type', none),
                    'notes_count': d.get('notes', []) | length if d.get('notes', []) is sequence and d.get('notes', []) is not string else 0,
                    'custom_fields': d.get('custom_fields', []),
                    'user_can_change': d.get('user_can_change', false),
                    'search_hit': d.get('__search_hit__', none),
                    'content_redacted': not _include_content,
                    'content': d.get('content', '') if _include_content else none
                  } | tojson }}
                {%- else -%}{{ d }}{%- endif -%}
              {%- endmacro -%}
              {%- if _content is mapping and _content.get('results', none) is sequence and _content.get('results', none) is not string -%}
                {%- set ns = namespace(results=[]) -%}
                {%- for d in _content.get('results', []) -%}
                  {%- set rendered = safe_doc(d) -%}
                  {%- set ns.results = ns.results + [rendered | from_json | default({})] -%}
                {%- endfor -%}
                {{ {
                  'count': _content.get('count', 0),
                  'next': _content.get('next', none),
                  'previous': _content.get('previous', none),
                  'all': _content.get('all', []),
                  'results': ns.results,
                  'corrected_query': _content.get('corrected_query', none)
                } }}
              {%- elif _content is mapping and _content.get('id', none) is not none -%}
                {{ safe_doc(_content) | from_json | default({}) }}
              {%- else -%}
                {{ _content }}
              {%- endif -%}
              {%- endif -%}
            _base_response:
              status: "{{ _stacks_raw.get('status', 'error') if _stacks_raw is mapping else 'error' }}"
              tool: Zen DojoTools Library
              section: stacks
              mode: "{{ mode_norm }}"
              source: "{{ _source }}"
              message: >-
                {%- if mode_norm in ["stacks_search", "stacks_similar", "stacks_document_get", "stacks_document_lens"] and not _doc_tags_fetch_ok -%}
                  Warning: tag name lookup (/api/tags/) failed — tags will show as unmapped with blank name/slug even if they exist. This does not mean the tags are missing in Paperless.
                {%- else -%}{%- endif -%}
              result: "{{ _safe_content }}"
              trace:
                endpoint: "{{ _endpoint | trim }}"
                method: GET
                http_status: "{{ _stacks_raw.get('http_status', 0) if _stacks_raw is mapping else 0 }}"
                caller_token: "{{ caller_token_norm }}"
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ mode_norm == "stacks_document_lens" and _content is mapping and _content.get("correspondent") is not none }}'
            sequence:
            - action: script.zen_sutra_paperless
              response_variable: _corr_raw
              continue_on_error: true
              data:
                action_type: get
                endpoint: "/api/correspondents/{{ _content.get('correspondent') }}/"
          default:
          - variables:
              _corr_raw: {}
        - variables:
            _corr_content: "{{ _corr_raw.get('result', {}).get('content', {}) if _corr_raw is mapping else {} }}"
            _corr_fetch_ok: "{{ _corr_raw is mapping and _corr_raw.get('status') == 'success' }}"
            _corr_name: "{{ _corr_content.get('name', '') | string | trim if _corr_content is mapping else '' }}"
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _corr_name != "" }}'
            sequence:
            - action: script.zen_dojotools_rolodex
              response_variable: _corr_rolodex_raw
              continue_on_error: true
              data:
                mode: company_find
                item: "{{ _corr_name }}"
                limit: 3
          default:
          - variables:
              _corr_rolodex_raw: {}
        - variables:
            _corr_rolodex_companies: >-
              {%- set r = _corr_rolodex_raw.get('result', {}) if _corr_rolodex_raw is mapping else {} -%}
              {{ r.get('companies', []) if r is mapping and r.get('companies', []) is sequence and r.get('companies', []) is not string else [] }}
            _corr_rolodex_count: "{{ (_corr_rolodex_companies | length) if _corr_rolodex_companies is sequence and _corr_rolodex_companies is not string else 0 }}"
        - variables:
            result: >-
              {%- if mode_norm == 'stacks_tag_audit' and _content is mapping -%}
                {%- set tags = _content.get('results', []) if _content.get('results', []) is sequence and _content.get('results', []) is not string else [] -%}
                {%- set ns = namespace(paperless=[], paperless_slugs=[], mapped=[], unmapped=[], missing=[]) -%}
                {%- for t in tags -%}
                  {%- if t is mapping -%}
                    {%- set _name = t.get('name', '') | string | trim -%}
                    {%- set _slug = t.get('slug', _name | slugify(separator='_')) | string | trim -%}
                    {%- set _id = t.get('id', none) -%}
                    {%- set _row = {'id': _id, 'name': _name, 'slug': _slug, 'document_count': t.get('document_count', none)} -%}
                    {%- set ns.paperless = ns.paperless + [_row] -%}
                    {%- if _slug != '' -%}{%- set ns.paperless_slugs = ns.paperless_slugs + [_slug] -%}{%- endif -%}
                    {%- if _slug in _ha_label_index -%}
                      {%- set ns.mapped = ns.mapped + [_row | combine({'label_id': _slug})] -%}
                    {%- else -%}
                      {%- set ns.unmapped = ns.unmapped + [_row] -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endfor -%}
                {%- for lbl in _ha_label_index -%}
                  {%- if lbl not in ns.paperless_slugs -%}{%- set ns.missing = ns.missing + [lbl] -%}{%- endif -%}
                {%- endfor -%}
                {{
                  _base_response | combine({
                    'status': 'success' if _stacks_raw is mapping and _stacks_raw.get('status') == 'success' else _base_response.status,
                    'result': {
                      'paperless_tags': ns.paperless,
                      'paperless_count': ns.paperless | length,
                      'ha_label_count': _ha_label_index | length,
                      'mapped': ns.mapped,
                      'mapped_count': ns.mapped | length,
                      'unmapped_paperless_tags': ns.unmapped,
                      'unmapped_count': ns.unmapped | length,
                      'ha_labels_missing_paperless_tag': ns.missing,
                      'missing_count': ns.missing | length,
                      'doctrine': 'HA labels are canonical. Paperless tags are the document-side projection of HA label slugs.'
                    }
                  }, recursive=true)
                }}
              {%- elif mode_norm == 'stacks_by_anchor' -%}
                {%- set sc = (_safe_content | from_json) if _safe_content is string and (_safe_content | trim)[:1] == '{' else _safe_content -%}
                {%- set sc = sc if sc is mapping else {} -%}
                {%- set docs = sc.get('results', []) if sc.get('results', []) is sequence and sc.get('results', []) is not string else [] -%}
                {%- set ns = namespace(matches=[]) -%}
                {%- for doc in docs if doc is mapping -%}
                  {%- set ids = namespace(v=[]) -%}
                  {%- for anchor in doc.get('anchor_contexts', []) if anchor is mapping -%}
                    {%- if anchor.get('type', '') == _anchor_type and (anchor.get('id', '') | string | lower) in _anchor_ids -%}
                      {%- set ids.v = ids.v + [anchor.get('id', '') | string | lower] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {%- if _anchor_include_suggestions -%}
                    {%- for anchor in doc.get('anchor_suggestions', []) if anchor is mapping -%}
                      {%- if anchor.get('type', '') == _anchor_type and (anchor.get('id', '') | string | lower) in _anchor_ids -%}
                        {%- set ids.v = ids.v + [anchor.get('id', '') | string | lower] -%}
                      {%- endif -%}
                    {%- endfor -%}
                  {%- endif -%}
                  {%- if ids.v | length > 0 -%}
                    {%- set ns.matches = ns.matches + [doc | combine({'matched_anchor_ids': ids.v | unique | list})] -%}
                  {%- endif -%}
                {%- endfor -%}
                {{
                  _base_response | combine({
                    'status': 'success' if _stacks_raw is mapping and _stacks_raw.get('status') == 'success' else _base_response.status,
                    'anchor_query': {
                      'anchor_type': _anchor_type,
                      'anchor_ids': _anchor_ids,
                      'include_suggestions': _anchor_include_suggestions
                    },
                    'result': {
                      'count': ns.matches | length,
                      'documents': ns.matches,
                      'content_redacted': true,
                      'source_count': sc.get('count', 0),
                      'source_page_size': docs | length
                    }
                  })
                }}
              {%- elif mode_norm == 'stacks_document_lens' and _content is mapping -%}
                {%- set _tags = _content.get('tags', []) -%}
                {%- set _hit = _content.get('__search_hit__', none) -%}
                {{
                  _base_response | combine({
                    'status': 'ok' if _stacks_raw is mapping and _stacks_raw.get('status') == 'success' else _base_response.status,
                    'lens': {'type': 'document', 'focus': _content.get('title', _document_id)},
                    'stack': _safe_content.get('stack', {}) if _safe_content is mapping else {
                      'provider': 'paperless_ngx',
                      'source': 'paperless_ngx',
                      'object_type': 'document',
                      'source_id': _content.get('id', _document_id),
                      'evidence_id': 'paperless_ngx:document:' ~ (_content.get('id', _document_id) | string),
                      'lens_mode': 'stacks_document_lens'
                    },
                    'object': {
                      'object_type': 'document',
                      'object_id': _content.get('id', _document_id),
                      'name': _content.get('title', ''),
                      'status': 'indexed'
                    },
                    'identity': {
                      'paperless_id': _content.get('id', _document_id),
                      'title': _content.get('title', ''),
                      'correspondent': _content.get('correspondent', none),
                      'document_type': _content.get('document_type', none),
                      'created': _content.get('created', none)
                    },
                    'context': {
                      'tags': _tags,
                      'paperless_tags': _safe_content.get('paperless_tags', []) if _safe_content is mapping else [],
                      'paperless_tag_ids': _safe_content.get('paperless_tag_ids', []) if _safe_content is mapping else [],
                      'ha_labels': _safe_content.get('ha_labels', []) if _safe_content is mapping else [],
                      'unmapped_tags': _safe_content.get('unmapped_tags', []) if _safe_content is mapping else [],
                      'anchor_contexts': _safe_content.get('anchor_contexts', []) if _safe_content is mapping else [],
                      'anchor_suggestions': _safe_content.get('anchor_suggestions', []) if _safe_content is mapping else [],
                      'who': [],
                      'what': [],
                      'where': [],
                      'concepts': [],
                      'when': {
                        'created': _content.get('created', none),
                        'created_date': _content.get('created_date', none),
                        'added': _content.get('added', none),
                        'modified': _content.get('modified', none)
                      },
                      'linked_entities': [],
                      'project': none,
                      'contact_or_company': ({
                        'paperless_correspondent_id': _content.get('correspondent'),
                        'correspondent_name': _corr_name,
                        'rolodex_match': {
                          'matched': _corr_rolodex_count > 0,
                          'companies': _corr_rolodex_companies,
                          'count': _corr_rolodex_count
                        },
                        'no_match_hint': (none if _corr_rolodex_count > 0 else {
                          'reason': 'No Twenty CRM company matched this correspondent name.',
                          'action': 'create_company',
                          'tool': 'zen_dojotools_rolodex',
                          'params': {'mode': 'company_create', 'item': _corr_name},
                          'note': 'Pre-filled with the resolved correspondent name — call as-is to create, or edit item first if the name needs cleanup. If the receipt/document text contains a street address, pass it too as params.address (freetext, stored on Twenty addressStreet1). Anything beyond a street address (phone, notes, service history) still goes on afterward via mode=contact_note (note_target_type=company, item_id=new company id).'
                        }),
                        'all_docs': {'section': 'stacks', 'mode': 'stacks_by_company', 'input_json': {'correspondent_id': _content.get('correspondent')}}
                      } if _corr_fetch_ok else {
                        'paperless_correspondent_id': _content.get('correspondent'),
                        'resolve_name': {'section': 'stacks', 'mode': 'stacks_correspondent_get', 'input_json': {'correspondent_id': _content.get('correspondent')}},
                        'rolodex': {'case': 'company_find', 'note': 'Correspondent name lookup failed — call resolve_name first, then use name as item'},
                        'all_docs': {'section': 'stacks', 'mode': 'stacks_by_company', 'input_json': {'correspondent_id': _content.get('correspondent')}}
                      }) if _content.get('correspondent') is not none else none
                    },
                    'evidence': {
                      'evidence_id': 'paperless_ngx:document:' ~ (_content.get('id', _document_id) | string),
                      'provider': 'paperless_ngx',
                      'source_system': 'paperless_ngx',
                      'document_id': _content.get('id', _document_id),
                      'title': _content.get('title', ''),
                      'created': _content.get('created', none),
                      'content_redacted': true,
                      'archive_serial_number': _content.get('archive_serial_number', none),
                      'original_available': _content.get('original_file_name', '') != '',
                      'archive_available': _content.get('archived_file_name', '') != '',
                      'search_hit': _hit
                    },
                    'anchor_contexts': _safe_content.get('anchor_contexts', []) if _safe_content is mapping else [],
                    'anchor_suggestions': _safe_content.get('anchor_suggestions', []) if _safe_content is mapping else [],
                    'actions': [
                      {'action': 'inspect', 'payload': {'section': 'stacks', 'mode': 'stacks_document_get', 'input_json': {'document_id': _content.get('id', _document_id)}}},
                      {'action': 'correspondent_docs', 'payload': {'section': 'stacks', 'mode': 'stacks_by_company', 'input_json': {'correspondent_id': _content.get('correspondent')}}}
                    ] if _content.get('correspondent') is not none else [
                      {'action': 'inspect', 'payload': {'section': 'stacks', 'mode': 'stacks_document_get', 'input_json': {'document_id': _content.get('id', _document_id)}}}
                    ]
                  }, recursive=true)
                }}
              {%- else -%}
                {{ _base_response }}
              {%- endif -%}
        - stop: stacks read mode
          response_variable: result

    - choose:
      - conditions:
        - condition: template
          value_template: '{{ section_norm == "stacks" and mode_norm in ["stacks_correspondent_create","stacks_tag_create","stacks_document_type_create","stacks_storage_path_create"] }}'
        sequence:
        - variables:
            _create_name: "{{ input_data.get('name', '') | string | trim if input_data is mapping else '' }}"
            _create_colour: "{{ input_data.get('colour', none) if input_data is mapping else none }}"
            _create_path: "{{ input_data.get('path', '') | string | trim if input_data is mapping else '' }}"
            _create_slug: "{{ input_data.get('label_slug', _create_name) | string | trim | slugify(separator='_') if input_data is mapping else '' }}"
            _create_all_labels: "{{ labels() | list }}"
            _create_missing: >-
              {%- if _create_name == '' -%}name{%- else -%}{%- endif -%}
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _create_missing | trim != "" }}'
            sequence:
            - variables:
                result:
                  status: error
                  tool: Zen DojoTools Library
                  section: stacks
                  mode: "{{ mode_norm }}"
                  message: "Missing required field: {{ _create_missing | trim }}"
                  caller_token: "{{ caller_token_norm }}"
            - stop: stacks create missing name
              response_variable: result
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ mode_norm == "stacks_tag_create" and _create_slug not in _create_all_labels }}'
            sequence:
            - variables:
                result:
                  status: error
                  tool: Zen DojoTools Library
                  section: stacks
                  mode: stacks_tag_create
                  message: "Paperless tags are HA label projections. Create or choose HA label '{{ _create_slug }}' first."
                  label_slug: "{{ _create_slug }}"
                  available_sample: "{{ _create_all_labels[:20] }}"
                  caller_token: "{{ caller_token_norm }}"
            - stop: stacks tag create label missing
              response_variable: result
        - variables:
            _create_endpoint: >-
              {%- if mode_norm == 'stacks_correspondent_create' -%}/api/correspondents/
              {%- elif mode_norm == 'stacks_tag_create' -%}/api/tags/
              {%- elif mode_norm == 'stacks_document_type_create' -%}/api/document_types/
              {%- elif mode_norm == 'stacks_storage_path_create' -%}/api/storage_paths/
              {%- endif -%}
            _create_payload: >-
              {%- set _ns = namespace(p={'name': _create_name}) -%}
              {%- if mode_norm == 'stacks_tag_create' -%}
                {%- set _ns.p = _ns.p | combine({'slug': _create_slug}) -%}
              {%- endif -%}
              {%- if mode_norm == 'stacks_tag_create' and _create_colour is not none -%}
                {%- set _ns.p = _ns.p | combine({'colour': _create_colour | int}) -%}
              {%- endif -%}
              {%- if mode_norm == 'stacks_storage_path_create' and _create_path != '' -%}
                {%- set _ns.p = _ns.p | combine({'path': _create_path}) -%}
              {%- endif -%}
              {{ _ns.p | tojson }}
        - action: script.zen_sutra_paperless
          response_variable: _create_raw
          continue_on_error: true
          data:
            action_type: post
            endpoint: "{{ _create_endpoint | trim }}"
            payload: "{{ _create_payload }}"
        - variables:
            _create_content: "{{ _create_raw.get('result', {}).get('content', {}) if _create_raw is mapping else {} }}"
            result:
              status: "{{ _create_raw.get('status', 'error') if _create_raw is mapping else 'error' }}"
              tool: Zen DojoTools Library
              section: stacks
              mode: "{{ mode_norm }}"
              created: "{{ _create_content }}"
              trace:
                endpoint: "{{ _create_endpoint | trim }}"
                method: POST
                http_status: "{{ _create_raw.get('http_status', 0) if _create_raw is mapping else 0 }}"
                caller_token: "{{ caller_token_norm }}"
        - stop: stacks create
          response_variable: result

    - choose:
      - conditions:
        - condition: template
          value_template: '{{ section_norm == "stacks" and mode_norm == "stacks_correspondent_update" }}'
        sequence:
        - variables:
            _cu_id: "{{ input_data.get('correspondent_id', '') | string | trim if input_data is mapping else '' }}"
            _cu_name: "{{ input_data.get('name', '') | string | trim if input_data is mapping else '' }}"
        - variables:
            _cu_missing: >-
              {%- if _cu_id == '' -%}correspondent_id
              {%- elif _cu_name == '' -%}name
              {%- else -%}{%- endif -%}
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _cu_missing | trim != "" }}'
            sequence:
            - variables:
                result:
                  status: error
                  tool: Zen DojoTools Library
                  section: stacks
                  mode: stacks_correspondent_update
                  message: "Missing required field: {{ _cu_missing | trim }}"
                  caller_token: "{{ caller_token_norm }}"
            - stop: stacks correspondent update missing field
              response_variable: result
        - action: script.zen_sutra_paperless
          response_variable: _cu_raw
          continue_on_error: true
          data:
            action_type: patch
            endpoint: "/api/correspondents/{{ _cu_id }}/"
            payload: "{{ {'name': _cu_name} | tojson }}"
        - variables:
            _cu_content: "{{ _cu_raw.get('result', {}).get('content', {}) if _cu_raw is mapping else {} }}"
            result:
              status: "{{ _cu_raw.get('status', 'error') if _cu_raw is mapping else 'error' }}"
              tool: Zen DojoTools Library
              section: stacks
              mode: stacks_correspondent_update
              updated: "{{ _cu_content }}"
              trace:
                endpoint: "/api/correspondents/{{ _cu_id }}/"
                method: PATCH
                http_status: "{{ _cu_raw.get('http_status', 0) if _cu_raw is mapping else 0 }}"
                caller_token: "{{ caller_token_norm }}"
        - stop: stacks correspondent update
          response_variable: result

    - choose:
      - conditions:
        - condition: template
          value_template: '{{ section_norm == "stacks" and mode_norm in ["stacks_document_update","stacks_document_tag"] }}'
        sequence:
        - variables:
            _g3_document_id: "{{ input_data.get('document_id', '') | string | trim if input_data is mapping else '' }}"
            _g3_tag_ids_raw: >-
              {%- if input_data is mapping -%}
                {%- set _tid = input_data.get('tag_ids', none) -%}
                {%- set _add = input_data.get('add_tags', none) -%}
                {%- set _rem = input_data.get('remove_tags', none) -%}
                {{ _tid if _tid is not none else (_add if _add is not none else (_rem if _rem is not none else [])) }}
              {%- else -%}{{ [] }}{%- endif -%}
            _g3_tag_mode: >-
              {%- if input_data is mapping -%}
                {%- set _explicit = input_data.get('tag_mode', '') | string | trim | lower -%}
                {%- if _explicit in ['add','remove','replace'] -%}{{ _explicit }}
                {%- elif input_data.get('remove_tags', none) is not none -%}remove
                {%- elif input_data.get('add_tags', none) is not none -%}add
                {%- else -%}add{%- endif -%}
              {%- else -%}add{%- endif -%}
            _g3_product_name: "{{ input_data.get('product_name', '') | string | trim if input_data is mapping else '' }}"
        - variables:
            _g3_missing: >-
              {%- if _g3_document_id == '' -%}document_id
              {%- elif mode_norm == 'stacks_document_tag' and (_g3_tag_ids_raw is not sequence or (_g3_tag_ids_raw is sequence and _g3_tag_ids_raw is string) or (_g3_tag_ids_raw | list | count == 0)) -%}add_tags / remove_tags / tag_ids
              {%- else -%}{%- endif -%}
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _g3_missing | trim != "" }}'
            sequence:
            - variables:
                result:
                  status: error
                  tool: Zen DojoTools Library
                  section: stacks
                  mode: "{{ mode_norm }}"
                  message: "Missing required field: {{ _g3_missing | trim }}"
                  caller_token: "{{ caller_token_norm }}"
            - stop: stacks gate3 missing input
              response_variable: result
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ mode_norm == "stacks_document_tag" and _g3_tag_mode in ["add","remove"] }}'
            sequence:
            - action: script.zen_sutra_paperless
              response_variable: _g3_doc_raw
              continue_on_error: true
              data:
                action_type: get
                endpoint: "/api/documents/{{ _g3_document_id }}/"
            - variables:
                _g3_current_doc: "{{ _g3_doc_raw.get('result', {}).get('content', {}) if _g3_doc_raw is mapping else {} }}"
            - variables:
                _g3_current_tags: "{{ _g3_current_doc.get('tags', []) | list if _g3_current_doc is mapping else [] }}"
          default:
          - variables:
              _g3_current_tags: "{{ [] }}"
        - variables:
            _g3_patch_payload: >-
              {%- if mode_norm == 'stacks_document_update' -%}
                {%- set _ns = namespace(p={}) -%}
                {%- if input_data is mapping -%}
                  {%- set _t = input_data.get('title', '') | string | trim -%}
                  {%- if _t != '' -%}{%- set _ns.p = _ns.p | combine({'title': _t}) -%}{%- endif -%}
                  {%- set _cid = input_data.get('correspondent_id', none) -%}
                  {%- if _cid is not none -%}{%- set _ns.p = _ns.p | combine({'correspondent': _cid | int}) -%}{%- endif -%}
                  {%- set _did = input_data.get('document_type_id', none) -%}
                  {%- if _did is not none -%}{%- set _ns.p = _ns.p | combine({'document_type': _did | int}) -%}{%- endif -%}
                  {%- set _sid = input_data.get('storage_path_id', none) -%}
                  {%- if _sid is not none -%}{%- set _ns.p = _ns.p | combine({'storage_path': _sid | int}) -%}{%- endif -%}
                  {%- set _cr = input_data.get('created', '') | string | trim -%}
                  {%- if _cr != '' -%}{%- set _ns.p = _ns.p | combine({'created': _cr}) -%}{%- endif -%}
                {%- endif -%}
                {{ _ns.p | tojson }}
              {%- elif mode_norm == 'stacks_document_tag' -%}
                {%- set _in_ids = _g3_tag_ids_raw if _g3_tag_ids_raw is sequence and _g3_tag_ids_raw is not string else [] -%}
                {%- if _g3_tag_mode == 'replace' -%}
                  {{ {'tags': _in_ids | map('int') | list} | tojson }}
                {%- elif _g3_tag_mode == 'add' -%}
                  {%- set _ns = namespace(merged=[]) -%}
                  {%- for t in _g3_current_tags -%}{%- set _ns.merged = _ns.merged + [t | int] -%}{%- endfor -%}
                  {%- for t in _in_ids -%}
                    {%- if (t | int) not in _ns.merged -%}{%- set _ns.merged = _ns.merged + [t | int] -%}{%- endif -%}
                  {%- endfor -%}
                  {{ {'tags': _ns.merged} | tojson }}
                {%- elif _g3_tag_mode == 'remove' -%}
                  {%- set _remove_set = _in_ids | map('int') | list -%}
                  {%- set _ns = namespace(filtered=[]) -%}
                  {%- for t in _g3_current_tags -%}
                    {%- if (t | int) not in _remove_set -%}{%- set _ns.filtered = _ns.filtered + [t | int] -%}{%- endif -%}
                  {%- endfor -%}
                  {{ {'tags': _ns.filtered} | tojson }}
                {%- else -%}{{ {'tags': _in_ids | map('int') | list} | tojson }}{%- endif -%}
              {%- else -%}{{ {} | tojson }}{%- endif -%}
        - action: script.zen_sutra_paperless
          response_variable: _g3_raw
          continue_on_error: true
          data:
            action_type: patch
            endpoint: "/api/documents/{{ _g3_document_id }}/"
            payload: "{{ _g3_patch_payload }}"
        - variables:
            _g3_content: "{{ _g3_raw.get('result', {}).get('content', {}) if _g3_raw is mapping else {} }}"
            _g3_patched_ok: "{{ _g3_raw is mapping and _g3_raw.get('status', '') == 'success' }}"
            _g3_inv_notify_raw: none
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _g3_product_name != "" and _g3_patched_ok }}'
            sequence:
            - action: script.zen_dojotools_inventory
              continue_on_error: true
              response_variable: _g3_inv_notify_raw
              data:
                mode: product_ref_add
                item: "{{ _g3_product_name }}"
                ref_type: doc
                ref_id: "{{ _g3_document_id | int }}"
        - variables:
            _g3_inv_notified: "{{ _g3_inv_notify_raw is mapping and _g3_inv_notify_raw.get('status', '') == 'ok' }}"
        - variables:
            _g3_safe: >-
              {%- if _g3_content is mapping -%}
                {%- set _ns = namespace(safe={}) -%}
                {%- for k, v in _g3_content.items() if k != 'content' -%}
                  {%- set _ns.safe = _ns.safe | combine({k: v}) -%}
                {%- endfor -%}
                {{ _ns.safe | combine({'content_redacted': true}) }}
              {%- else -%}{{ _g3_content }}{%- endif -%}
            result:
              status: "{{ _g3_raw.get('status', 'error') if _g3_raw is mapping else 'error' }}"
              tool: Zen DojoTools Library
              section: stacks
              mode: "{{ mode_norm }}"
              updated: "{{ _g3_safe }}"
              inventory_notified: "{{ _g3_inv_notified }}"
              trace:
                endpoint: "/api/documents/{{ _g3_document_id }}/"
                method: PATCH
                payload_keys: >-
                  {%- if _g3_patch_payload is mapping -%}{{ _g3_patch_payload | list }}
                  {%- elif _g3_patch_payload is string and _g3_patch_payload | trim not in ['', '{}'] -%}{{ _g3_patch_payload | from_json | default({}) | list }}
                  {%- else -%}{{ [] }}{%- endif -%}
                http_status: "{{ _g3_raw.get('http_status', 0) if _g3_raw is mapping else 0 }}"
                caller_token: "{{ caller_token_norm }}"
        - stop: stacks gate3 patch
          response_variable: result

    - choose:
      - conditions:
        - condition: template
          value_template: '{{ section_norm == "stacks" and mode_norm == "stacks_document_delete" }}'
        sequence:
        - variables:
            _d4_document_id: "{{ input_data.get('document_id', '') | string | trim if input_data is mapping else '' }}"
            _d4_confirm: "{{ input_data.get('confirm', false) if input_data is mapping else false }}"
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _d4_document_id == "" }}'
            sequence:
            - variables:
                result:
                  status: error
                  tool: Zen DojoTools Library
                  section: stacks
                  mode: stacks_document_delete
                  message: "Missing required field: document_id"
                  caller_token: "{{ caller_token_norm }}"
            - stop: gate4 missing document_id
              response_variable: result
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _d4_confirm != true }}'
            sequence:
            - action: script.zen_sutra_paperless
              response_variable: _d4_preview_raw
              continue_on_error: true
              data:
                action_type: get
                endpoint: "/api/documents/{{ _d4_document_id }}/"
            - variables:
                _d4_preview: "{{ _d4_preview_raw.get('result', {}).get('content', {}) if _d4_preview_raw is mapping else {} }}"
            - variables:
                _d4_preview_safe: >-
                  {%- if _d4_preview is mapping -%}
                    {%- set _ns = namespace(safe={}) -%}
                    {%- for k, v in _d4_preview.items() if k != 'content' -%}
                      {%- set _ns.safe = _ns.safe | combine({k: v}) -%}
                    {%- endfor -%}
                    {{ _ns.safe | combine({'content_redacted': true}) }}
                  {%- else -%}{{ _d4_preview }}{%- endif -%}
                result:
                  status: confirmation_required
                  tool: Zen DojoTools Library
                  section: stacks
                  mode: stacks_document_delete
                  warning: "IRREVERSIBLE. This document will be permanently deleted. Re-call with confirm=true to proceed."
                  document: "{{ _d4_preview_safe }}"
                  caller_token: "{{ caller_token_norm }}"
            - stop: gate4 confirm required
              response_variable: result
          default:
          - action: script.zen_sutra_paperless
            response_variable: _d4_raw
            continue_on_error: true
            data:
              action_type: delete
              endpoint: "/api/documents/{{ _d4_document_id }}/"
          - variables:
              result:
                status: "{{ 'success' if _d4_raw is mapping and _d4_raw.get('status') == 'success' else 'error' }}"
                tool: Zen DojoTools Library
                section: stacks
                mode: stacks_document_delete
                deleted: "{{ _d4_document_id }}"
                trace:
                  endpoint: "/api/documents/{{ _d4_document_id }}/"
                  method: DELETE
                  http_status: "{{ _d4_raw.get('http_status', 0) if _d4_raw is mapping else 0 }}"
                  caller_token: "{{ caller_token_norm }}"
          - stop: gate4 delete done
            response_variable: result

    - choose:
      - conditions:
        - condition: template
          value_template: '{{ section_norm == "stacks" and mode_norm in ["stacks_document_notes","stacks_note_add"] }}'
        sequence:
        - variables:
            _notes_document_id: "{{ input_data.get('document_id', '') | string | trim if input_data is mapping else '' }}"
            _note_text: "{{ input_data.get('note', '') | string | trim if input_data is mapping else '' }}"
            _notes_product_name: "{{ input_data.get('product_name', '') | string | trim if input_data is mapping else '' }}"
        - variables:
            _notes_missing: >-
              {%- if _notes_document_id == '' -%}document_id
              {%- elif mode_norm == 'stacks_note_add' and _note_text == '' -%}note
              {%- else -%}{%- endif -%}
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _notes_missing | trim != "" }}'
            sequence:
            - variables:
                result:
                  status: error
                  tool: Zen DojoTools Library
                  section: stacks
                  mode: "{{ mode_norm }}"
                  message: "Missing required field: {{ _notes_missing | trim }}"
                  caller_token: "{{ caller_token_norm }}"
            - stop: stacks notes missing input
              response_variable: result
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ mode_norm == "stacks_note_add" }}'
            sequence:
            - action: script.zen_sutra_paperless
              response_variable: _notes_raw
              continue_on_error: true
              data:
                action_type: post
                endpoint: "/api/documents/{{ _notes_document_id }}/notes/"
                payload: '{{ {"note": _note_text} | tojson }}'
          default:
          - action: script.zen_sutra_paperless
            response_variable: _notes_raw
            continue_on_error: true
            data:
              action_type: get
              endpoint: "/api/documents/{{ _notes_document_id }}/notes/"
        - variables:
            _notes_content: "{{ _notes_raw.get('result', {}).get('content', {}) if _notes_raw is mapping else {} }}"
            _notes_posted_ok: "{{ _notes_raw is mapping and _notes_raw.get('status', '') == 'success' and mode_norm == 'stacks_note_add' }}"
            _notes_inv_notify_raw: none
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _notes_product_name != "" and _notes_posted_ok }}'
            sequence:
            - action: script.zen_dojotools_inventory
              continue_on_error: true
              response_variable: _notes_inv_notify_raw
              data:
                mode: product_ref_add
                item: "{{ _notes_product_name }}"
                ref_type: doc
                ref_id: "{{ _notes_document_id | int }}"
        - variables:
            _notes_inv_notified: "{{ _notes_inv_notify_raw is mapping and _notes_inv_notify_raw.get('status', '') == 'ok' }}"
            result:
              status: "{{ _notes_raw.get('status', 'error') if _notes_raw is mapping else 'error' }}"
              tool: Zen DojoTools Library
              section: stacks
              mode: "{{ mode_norm }}"
              document_id: "{{ _notes_document_id }}"
              notes: "{{ _notes_content }}"
              inventory_notified: "{{ _notes_inv_notified }}"
              trace:
                endpoint: "/api/documents/{{ _notes_document_id }}/notes/"
                method: "{{ 'POST' if mode_norm == 'stacks_note_add' else 'GET' }}"
                http_status: "{{ _notes_raw.get('http_status', 0) if _notes_raw is mapping else 0 }}"
                caller_token: "{{ caller_token_norm }}"
        - stop: stacks notes done
          response_variable: result

    - choose:
      - conditions:
        - condition: template
          value_template: '{{ section_norm == "stacks" and mode_norm == "stacks_bulk_edit" }}'
        sequence:
        - variables:
            _bulk_doc_ids: "{{ input_data.get('document_ids', []) if input_data is mapping else [] }}"
            _bulk_method: "{{ input_data.get('method', '') | string | trim | lower if input_data is mapping else '' }}"
            _bulk_params: "{{ input_data.get('parameters', {}) if input_data is mapping else {} }}"
            _bulk_label_slugs_raw: "{{ input_data.get('label_slugs', []) if input_data is mapping else [] }}"
            _bulk_confirm: "{{ input_data.get('confirm', false) if input_data is mapping else false }}"
            _bulk_all_labels: "{{ labels() | list }}"
        - variables:
            _bulk_label_slugs: >-
              {%- set raw = _bulk_label_slugs_raw -%}
              {%- if raw is string -%}
                {{ raw.split(',') | map('trim') | select | list }}
              {%- elif raw is sequence -%}
                {{ raw | map('string') | map('trim') | select | list }}
              {%- else -%}{{ [] }}{%- endif -%}
            _bulk_missing: >-
              {%- if not (_bulk_doc_ids is sequence and _bulk_doc_ids is not string and _bulk_doc_ids | length > 0) -%}document_ids
              {%- elif _bulk_method == '' -%}method
              {%- elif _bulk_method in ['add_tag','remove_tag'] and _bulk_label_slugs | length == 0 -%}label_slugs
              {%- elif _bulk_method in ['add_tag','remove_tag'] and _bulk_label_slugs | length > 1 -%}exactly_one_label_slug
              {%- elif _bulk_method == 'split' and (
                    (_bulk_params.get('pages', []) is sequence and _bulk_params.get('pages', []) is not string and _bulk_params.get('pages', []) | length < 2)
                    or (_bulk_params.get('pages', '') is string and (_bulk_params.get('pages', '') | trim == '' or ',' not in _bulk_params.get('pages', '')))
                  ) -%}parameters.pages (comma-separated page ranges, e.g. "1-2,3-4", or a list of 2+ range strings)
              {%- else -%}{%- endif -%}
            _bulk_valid_methods: [set_correspondent, set_document_type, set_storage_path, add_tag, remove_tag, delete, split, reprocess]
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _bulk_missing | trim != "" }}'
            sequence:
            - variables:
                result:
                  status: error
                  tool: Zen DojoTools Library
                  section: stacks
                  mode: stacks_bulk_edit
                  message: "Missing required field: {{ _bulk_missing | trim }}"
                  caller_token: "{{ caller_token_norm }}"
            - stop: stacks bulk missing input
              response_variable: result
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _bulk_method not in _bulk_valid_methods }}'
            sequence:
            - variables:
                result:
                  status: error
                  tool: Zen DojoTools Library
                  section: stacks
                  mode: stacks_bulk_edit
                  message: "Invalid method. Valid: set_correspondent, set_document_type, set_storage_path, add_tag, remove_tag, delete, split, reprocess"
                  caller_token: "{{ caller_token_norm }}"
            - stop: stacks bulk invalid method
              response_variable: result
        - variables:
            _bulk_bad_labels: >-
              {%- set ns = namespace(bad=[]) -%}
              {%- if _bulk_method in ['add_tag','remove_tag'] -%}
                {%- for lbl in _bulk_label_slugs -%}
                  {%- if lbl not in _bulk_all_labels -%}{%- set ns.bad = ns.bad + [lbl] -%}{%- endif -%}
                {%- endfor -%}
              {%- endif -%}
              {{ ns.bad }}
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _bulk_bad_labels | length > 0 }}'
            sequence:
            - variables:
                result:
                  status: error
                  tool: Zen DojoTools Library
                  section: stacks
                  mode: stacks_bulk_edit
                  message: "Labels not in ZenOS label index: {{ _bulk_bad_labels | join(', ') }}. Create the HA label first or check spelling."
                  bad_labels: "{{ _bulk_bad_labels }}"
                  available_sample: "{{ _bulk_all_labels[:20] }}"
                  caller_token: "{{ caller_token_norm }}"
            - stop: stacks bulk tag labels invalid
              response_variable: result
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _bulk_method in ["add_tag","remove_tag"] }}'
            sequence:
            - action: script.zen_sutra_paperless
              response_variable: _bulk_tags_raw
              continue_on_error: true
              data:
                action_type: get
                endpoint: /api/tags/
            - variables:
                _bulk_tags_content: "{{ _bulk_tags_raw.get('result', {}).get('content', {}) if _bulk_tags_raw is mapping else {} }}"
                _bulk_tags_list: "{{ _bulk_tags_content.get('results', []) if _bulk_tags_content is mapping else [] }}"
                _bulk_tag_ids: >-
                  {%- set ns = namespace(ids=[]) -%}
                  {%- for t in _bulk_tags_list if t is mapping -%}
                    {%- set slug = t.get('slug', t.get('name', '') | slugify(separator='_')) | string | trim -%}
                    {%- if slug in _bulk_label_slugs -%}{%- set ns.ids = ns.ids + [t.get('id') | int] -%}{%- endif -%}
                  {%- endfor -%}
                  {{ ns.ids }}
                _bulk_missing_paperless_tags: >-
                  {%- set ns = namespace(missing=[]) -%}
                  {%- for lbl in _bulk_label_slugs -%}
                    {%- set found = namespace(ok=false) -%}
                    {%- for t in _bulk_tags_list if t is mapping -%}
                      {%- set slug = t.get('slug', t.get('name', '') | slugify(separator='_')) | string | trim -%}
                      {%- if slug == lbl -%}{%- set found.ok = true -%}{%- endif -%}
                    {%- endfor -%}
                    {%- if not found.ok -%}{%- set ns.missing = ns.missing + [lbl] -%}{%- endif -%}
                  {%- endfor -%}
                  {{ ns.missing }}
          default:
          - variables:
              _bulk_tag_ids: []
              _bulk_missing_paperless_tags: []
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _bulk_method in ["add_tag","remove_tag"] and _bulk_missing_paperless_tags | length > 0 }}'
            sequence:
            - variables:
                result:
                  status: error
                  tool: Zen DojoTools Library
                  section: stacks
                  mode: stacks_bulk_edit
                  message: "HA labels exist, but Paperless tag projections are missing. Run stacks_tag_create for each missing label first."
                  missing_paperless_tags: "{{ _bulk_missing_paperless_tags }}"
                  caller_token: "{{ caller_token_norm }}"
            - stop: stacks bulk tag projection missing
              response_variable: result
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _bulk_method == "delete" and _bulk_confirm != true }}'
            sequence:
            - variables:
                result:
                  status: confirmation_required
                  tool: Zen DojoTools Library
                  section: stacks
                  mode: stacks_bulk_edit
                  warning: "IRREVERSIBLE. This will permanently delete all specified documents. Re-call with confirm=true to proceed."
                  document_ids: "{{ _bulk_doc_ids }}"
                  document_count: "{{ _bulk_doc_ids | length }}"
                  caller_token: "{{ caller_token_norm }}"
            - stop: stacks bulk delete confirm required
              response_variable: result
          - conditions:
            - condition: template
              value_template: '{{ _bulk_method == "split" and (_bulk_params.get("delete_originals", false) | bool) and _bulk_confirm != true }}'
            sequence:
            - variables:
                result:
                  status: confirmation_required
                  tool: Zen DojoTools Library
                  section: stacks
                  mode: stacks_bulk_edit
                  warning: "IRREVERSIBLE. delete_originals=true will permanently remove the source document(s) after splitting. Re-call with confirm=true to proceed, or omit/false delete_originals to keep the original document intact (recommended)."
                  document_ids: "{{ _bulk_doc_ids }}"
                  document_count: "{{ _bulk_doc_ids | length }}"
                  caller_token: "{{ caller_token_norm }}"
            - stop: stacks bulk split delete-originals confirm required
              response_variable: result
        - variables:
            _bulk_payload: >-
              {%- set _ns = namespace(p={'documents': _bulk_doc_ids | map('int') | list, 'method': _bulk_method}) -%}
              {%- if _bulk_method in ['add_tag','remove_tag'] -%}
                {%- set _ns.p = _ns.p | combine({'parameters': {'tag': (_bulk_tag_ids | first)}}) -%}
              {%- elif _bulk_method == 'split' -%}
                {%- set _pages_raw = _bulk_params.get('pages', []) -%}
                {%- set _pages_str = _pages_raw if _pages_raw is string else (_pages_raw | map('string') | join(',')) -%}
                {%- set _ns.p = _ns.p | combine({'parameters': {'pages': _pages_str, 'delete_originals': (_bulk_params.get('delete_originals', false) | bool) and _bulk_confirm == true}}) -%}
              {%- elif _bulk_params is mapping and _bulk_params | length > 0 -%}
                {%- set _ns.p = _ns.p | combine({'parameters': _bulk_params}) -%}
              {%- endif -%}
              {{ _ns.p | tojson }}
        - action: script.zen_sutra_paperless
          response_variable: _bulk_raw
          continue_on_error: true
          data:
            action_type: post
            endpoint: "/api/documents/bulk_edit/"
            payload: "{{ _bulk_payload }}"
        - variables:
            _bulk_content: "{{ _bulk_raw.get('result', {}).get('content', {}) if _bulk_raw is mapping else {} }}"
            result:
              status: "{{ _bulk_raw.get('status', 'error') if _bulk_raw is mapping else 'error' }}"
              tool: Zen DojoTools Library
              section: stacks
              mode: stacks_bulk_edit
              method: "{{ _bulk_method }}"
              document_ids: "{{ _bulk_doc_ids }}"
              document_count: "{{ _bulk_doc_ids | length }}"
              result: "{{ _bulk_content }}"
              trace:
                endpoint: /api/documents/bulk_edit/
                method: POST
                http_status: "{{ _bulk_raw.get('http_status', 0) if _bulk_raw is mapping else 0 }}"
                caller_token: "{{ caller_token_norm }}"
        - stop: stacks bulk edit done
          response_variable: result

    - choose:
      - conditions:
        - condition: template
          value_template: '{{ section_norm == "stacks" and mode_norm == "stacks_flag_for_review" }}'
        sequence:
        - variables:
            _flag_doc_id: "{{ input_data.get('document_id', '') | string | trim if input_data is mapping else '' }}"
            _flag_reason: "{{ input_data.get('reason', '') | string | trim if input_data is mapping else '' }}"
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _flag_doc_id == "" or _flag_reason == "" }}'
            sequence:
            - variables:
                result:
                  status: error
                  tool: Zen DojoTools Library
                  section: stacks
                  mode: stacks_flag_for_review
                  message: "Missing required field: document_id and reason are both required."
                  caller_token: "{{ caller_token_norm }}"
            - stop: stacks flag for review missing input
              response_variable: result
        - action: script.zen_sutra_paperless
          response_variable: _flag_doc_raw
          continue_on_error: true
          data:
            action_type: get
            endpoint: "/api/documents/{{ _flag_doc_id | urlencode }}/"
        - variables:
            _flag_doc_content: "{{ _flag_doc_raw.get('result', {}).get('content', {}) if _flag_doc_raw is mapping else {} }}"
            _flag_doc_title: "{{ _flag_doc_content.get('title', 'document ' ~ _flag_doc_id) if _flag_doc_content is mapping else ('document ' ~ _flag_doc_id) }}"
            _hh: "{{ states('sensor.zen_default_household_cabinet_resolved') }}"
        - action: script.zen_dojotools_filecabinet
          response_variable: _flag_ic_raw
          continue_on_error: true
          data:
            action_type: get
            volume_entity_id: "{{ _hh }}"
            path: integrations_config
        - variables:
            _flag_paperless_url: >-
              {%- set _ic = _flag_ic_raw.get('value', {}) if _flag_ic_raw is mapping and _flag_ic_raw.get('status') == 'success' else {} -%}
              {%- set _cfg = _ic.get('paperless_ngx', {}) if _ic is mapping else {} -%}
              {{ (_cfg.get('url', '') | string | trim | regex_replace('/$', '')) if _cfg is mapping else '' }}
            _flag_doc_link: >-
              {%- if _flag_paperless_url != '' -%}
                {{ _flag_paperless_url }}/documents/{{ _flag_doc_id }}/details
              {%- else -%}
                (Paperless URL not configured — open document {{ _flag_doc_id }} directly in Paperless.)
              {%- endif -%}
            _flag_notif_id: "paperless_review_{{ _flag_doc_id }}"
        - action: script.zen_dojotools_systemtools
          response_variable: _flag_notif_raw
          continue_on_error: true
          data:
            mode: pnotif_raise
            notif_id: "{{ _flag_notif_id }}"
            notif_title: "Paperless: needs a look — {{ _flag_doc_title }}"
            notif_message: "{{ _flag_reason }}\n\nOpen: {{ _flag_doc_link }}"
        - variables:
            result:
              status: "{{ 'success' if _flag_notif_raw is mapping and _flag_notif_raw.get('result', '') == 'ok' else 'error' }}"
              tool: Zen DojoTools Library
              section: stacks
              mode: stacks_flag_for_review
              document_id: "{{ _flag_doc_id }}"
              document_title: "{{ _flag_doc_title }}"
              notification_id: "{{ _flag_notif_id }}"
              link: "{{ _flag_doc_link }}"
              reason: "{{ _flag_reason }}"
              caller_token: "{{ caller_token_norm }}"
        - stop: stacks flag for review done
          response_variable: result

    - choose:
      - conditions:
        - condition: template
          value_template: '{{ section_norm == "stacks" and mode_norm == "stacks_by_company" }}'
        sequence:
        - variables:
            _bc_company_name: "{{ input_data.get('company_name', '') | string | trim if input_data is mapping else '' }}"
            _bc_corr_id_direct: "{{ input_data.get('correspondent_id', '') | string | trim if input_data is mapping else '' }}"
            _bc_ordering: "{{ input_data.get('ordering', '-created') | string | trim if input_data is mapping else '-created' }}"
            _bc_page: "{{ input_data.get('page', 1) | int(1) if input_data is mapping else 1 }}"
            _bc_page_size: "{{ input_data.get('page_size', 25) | int(25) if input_data is mapping else 25 }}"
        - variables:
            _bc_missing: >-
              {%- if _bc_company_name == '' and _bc_corr_id_direct == '' -%}company_name or correspondent_id{%- else -%}{%- endif -%}
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _bc_missing | trim != "" }}'
            sequence:
            - variables:
                result:
                  status: error
                  tool: Zen DojoTools Library
                  section: stacks
                  mode: stacks_by_company
                  message: "Missing required field: {{ _bc_missing | trim }}"
                  caller_token: "{{ caller_token_norm }}"
            - stop: stacks by_company missing input
              response_variable: result
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _bc_corr_id_direct == "" }}'
            sequence:
            - action: script.zen_sutra_paperless
              response_variable: _bc_corr_raw
              continue_on_error: true
              data:
                action_type: get
                endpoint: "/api/correspondents/?name__icontains={{ _bc_company_name | urlencode }}"
            - variables:
                _bc_corr_list: >-
                  {%- set _r = _bc_corr_raw.get('result', {}).get('content', {}) if _bc_corr_raw is mapping else {} -%}
                  {{ _r.get('results', []) if _r is mapping else [] }}
            - variables:
                _bc_resolved_id: >-
                  {%- if _bc_corr_list is sequence and _bc_corr_list | length > 0 -%}
                    {{ (_bc_corr_list | first).get('id', '') | string }}
                  {%- else -%}{%- endif -%}
                _bc_resolved_name: >-
                  {%- if _bc_corr_list is sequence and _bc_corr_list | length > 0 -%}
                    {{ (_bc_corr_list | first).get('name', _bc_company_name) }}
                  {%- else -%}{{ _bc_company_name }}{%- endif -%}
          default:
          - variables:
              _bc_resolved_id: "{{ _bc_corr_id_direct }}"
              _bc_resolved_name: "{{ _bc_company_name }}"
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _bc_resolved_id | trim == "" }}'
            sequence:
            - variables:
                result:
                  status: not_found
                  tool: Zen DojoTools Library
                  section: stacks
                  mode: stacks_by_company
                  message: "No Paperless correspondent found matching: {{ _bc_company_name }}"
                  rolodex_hint: "Use rolodex case=company_find to check if company exists in Twenty CRM"
                  caller_token: "{{ caller_token_norm }}"
            - stop: stacks by_company not found
              response_variable: result
        - action: script.zen_sutra_paperless
          response_variable: _bc_docs_raw
          continue_on_error: true
          data:
            action_type: get
            endpoint: "/api/documents/?correspondent__id={{ _bc_resolved_id }}&ordering={{ _bc_ordering | urlencode }}&page={{ _bc_page }}&page_size={{ _bc_page_size }}"
        - variables:
            _bc_content: "{{ _bc_docs_raw.get('result', {}).get('content', {}) if _bc_docs_raw is mapping else {} }}"
            _ha_label_index: "{{ labels() | list }}"
        - variables:
            _bc_safe: >-
              {%- if _bc_content is mapping and _bc_content.get('results', none) is sequence and _bc_content.get('results', none) is not string -%}
                {%- macro safe_doc(d) -%}
                  {%- if d is mapping -%}
                    {%- set _ns = namespace(safe={}) -%}
                    {%- for k, v in d.items() if k != 'content' -%}{%- set _ns.safe = _ns.safe | combine({k: v}) -%}{%- endfor -%}
                    {{ _ns.safe | combine({'content_redacted': not _include_content, 'content': d.get('content', '') if _include_content else none}) | tojson }}
                  {%- else -%}{{ d }}{%- endif -%}
                {%- endmacro -%}
                {%- set _ns = namespace(results=[]) -%}
                {%- for d in _bc_content.get('results', []) -%}
                  {%- set _ns.results = _ns.results + [safe_doc(d) | from_json | default({})] -%}
                {%- endfor -%}
                {{ {'count': _bc_content.get('count', 0), 'next': _bc_content.get('next', none), 'previous': _bc_content.get('previous', none), 'results': _ns.results} }}
              {%- else -%}{{ _bc_content }}{%- endif -%}
            result:
              status: "{{ _bc_docs_raw.get('status', 'error') if _bc_docs_raw is mapping else 'error' }}"
              tool: Zen DojoTools Library
              section: stacks
              mode: stacks_by_company
              correspondent:
                id: "{{ _bc_resolved_id }}"
                name: "{{ _bc_resolved_name }}"
              rolodex_link:
                case: company_find
                item: "{{ _bc_resolved_name }}"
              documents: "{{ _bc_safe }}"
              trace:
                endpoint: "/api/documents/?correspondent__id={{ _bc_resolved_id }}"
                method: GET
                http_status: "{{ _bc_docs_raw.get('http_status', 0) if _bc_docs_raw is mapping else 0 }}"
                caller_token: "{{ caller_token_norm }}"
        - stop: stacks by_company done
          response_variable: result

    - choose:
      - conditions:
        - condition: template
          value_template: '{{ section_norm == "stacks" and mode_norm == "stacks_document_restore" }}'
        sequence:
        - variables:
            _tr_document_id: "{{ input_data.get('document_id', '') | string | trim if input_data is mapping else '' }}"
        - variables:
            _tr_missing: >-
              {%- if _tr_document_id == '' -%}document_id{%- else -%}{%- endif -%}
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ _tr_missing | trim != "" }}'
            sequence:
            - variables:
                result:
                  status: error
                  tool: Zen DojoTools Library
                  section: stacks
                  mode: stacks_document_restore
                  message: "Missing required field: {{ _tr_missing | trim }}"
                  caller_token: "{{ caller_token_norm }}"
            - stop: stacks restore missing input
              response_variable: result
        - action: script.zen_sutra_paperless
          response_variable: _tr_raw
          continue_on_error: true
          data:
            action_type: post
            endpoint: "/api/documents/bulk_edit/"
            payload: '{{ {"documents": [_tr_document_id | int], "method": "restore"} | tojson }}'
        - variables:
            _tr_content: "{{ _tr_raw.get('result', {}).get('content', {}) if _tr_raw is mapping else {} }}"
            result:
              status: "{{ _tr_raw.get('status', 'error') if _tr_raw is mapping else 'error' }}"
              tool: Zen DojoTools Library
              section: stacks
              mode: stacks_document_restore
              restored: "{{ _tr_document_id }}"
              result: "{{ _tr_content }}"
              trace:
                endpoint: /api/documents/bulk_edit/
                method: POST
                http_status: "{{ _tr_raw.get('http_status', 0) if _tr_raw is mapping else 0 }}"
                caller_token: "{{ caller_token_norm }}"
        - stop: stacks restore done
          response_variable: result

    - choose:
      - conditions:
        - condition: template
          value_template: '{{ stack_norm == "radar" and mode_norm == "help" }}'
        sequence:
        - variables:
            result:
              status: info
              tool: zen_dojotools_library
              section: stacks
              stack: radar
              mode: help
              message: Radar is the Zammad service desk stack. Proxies to zen_dojotools_servicedesk.
              cases: "{{ radar_modes }}"
              caller_token: "{{ caller_token_norm }}"
        - stop: radar help
          response_variable: result
      - conditions:
        - condition: template
          value_template: '{{ stack_norm == "radar" and mode_norm in ["get", "find", "list", "configure", "by_anchor"] }}'
        sequence:
        - variables:
            _radar_mode_map:
              get: ticket_get
              find: ticket_find
              list: ticket_list
              configure: configure
              by_anchor: tickets_by_anchor
            _radar_svc_mode: "{{ _radar_mode_map.get(mode_norm, mode_norm) }}"
        - action: script.zen_stack_radar
          response_variable: _radar_result
          continue_on_error: true
          data:
            mode: "{{ _radar_svc_mode }}"
            input_json: "{{ input_json_norm }}"
            caller_token: "{{ caller_token_norm }}"
        - variables:
            result: >-
              {%- set r = _radar_result if _radar_result is mapping else {} -%}
              {{ r | combine({'stack': 'radar', 'library_mode': mode_norm}, recursive=true) }}
        - stop: radar stack done
          response_variable: result

    - choose:
      - conditions:
        - condition: template
          value_template: '{{ stack_norm == "wiki" and mode_norm == "help" }}'
        sequence:
        - variables:
            result:
              status: info
              tool: zen_dojotools_library
              section: stacks
              stack: wiki
              mode: help
              message: Wiki stack. Calls zen_sutra_wikijs via zen_dojotools_filecabinet stack=wiki.
              modes: [get, find, list, configure, by_anchor]
              verb_map:
                get: action_type=get path=<path>
                find: action_type=search query=<query>
                list: action_type=list
                configure: "n/a — wiki is always available"
                by_anchor: action_type=stacks_by_anchor anchor_type=<type> anchor_ids=<ids>
              caller_token: "{{ caller_token_norm }}"
        - stop: wiki help
          response_variable: result
      - conditions:
        - condition: template
          value_template: '{{ stack_norm == "wiki" and mode_norm in ["get", "find", "list", "by_anchor"] }}'
        sequence:
        - variables:
            _wiki_action_map:
              get: get
              find: search
              list: list
              by_anchor: stacks_by_anchor
            _wiki_action: "{{ _wiki_action_map.get(mode_norm, mode_norm) }}"
        - action: script.zen_dojotools_filecabinet
          response_variable: _wiki_result
          continue_on_error: true
          data:
            action_type: "{{ _wiki_action }}"
            stack: wiki
            input_json: "{{ input_json_norm }}"
            caller_token: "{{ caller_token_norm }}"
        - variables:
            result: >-
              {%- set r = _wiki_result if _wiki_result is mapping else {} -%}
              {{ r | combine({'stack': 'wiki', 'library_mode': mode_norm}, recursive=true) }}
        - stop: wiki stack done
          response_variable: result


    # ── register / unregister ── Lens registry self-registration ─────────────
    # Matches Paperless pattern: manifest returns register_mode=register + provider_key.
    # zen_dojotools_manifest mode=bootstrap_stacks calls tool_manifest, then register
    # if provider_key not already in lens_registry.
    # ──────────────────────────────────────────────────────────────────────────
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm == "register" }}'
        sequence:
        - variables:
            _hh: "{{ states('sensor.zen_default_household_cabinet_resolved') }}"
        - action: script.zen_dojotools_filecabinet
          continue_on_error: true
          response_variable: _lr_reg_read
          data:
            action_type: get
            volume_entity_id: "{{ _hh }}"
            key: lens_registry
        - variables:
            _lr_existing_reg: >-
              {%- set raw = _lr_reg_read if _lr_reg_read is mapping else {} -%}
              {%- set val = raw.get('value', {}) -%}
              {%- set parsed = val | from_json if val is string else val -%}
              {{ parsed if parsed is mapping else {} }}
        - variables:
            _lr_provider_decl:
              provider: library_catalog
              configured_by: zen_dojotools_library
              department: catalog
              enabled: true
              status: available
              tool: zen_dojotools_library
              mode: by_anchor
              consumes: [person, label, area_id]
              returns: [item_evidence]
              failure_policy: soft
              content_policy: not_redacted
              risk_class: read_metadata
              security_act:
                model: rwxda
                required: r
                allowed: [r]
                denied: [w, x, d, a]
        - action: script.zen_dojotools_filecabinet
          continue_on_error: true
          response_variable: _lr_reg_write
          data:
            action_type: update
            volume_entity_id: "{{ _hh }}"
            key: lens_registry
            value: "{{ _lr_existing_reg | combine({'library_catalog': _lr_provider_decl}) | tojson }}"
        - variables:
            result:
              status: "{{ 'success' if _lr_reg_write is mapping and _lr_reg_write.get('status', '') == 'success' else 'error' }}"
              provider: library_catalog
              mode: register
              message: >-
                {{ 'Provider library_catalog registered in lens_registry.' if _lr_reg_write is mapping
                   and _lr_reg_write.get('status', '') == 'success' else
                   'Registration failed: ' ~ (_lr_reg_write.get('error', 'unknown') if _lr_reg_write is mapping else 'no response') }}
        - stop: library register complete
          response_variable: result

    - choose:
      - conditions:
        - condition: template
          value_template: '{{ mode_norm == "unregister" }}'
        sequence:
        - variables:
            _hh: "{{ states('sensor.zen_default_household_cabinet_resolved') }}"
        - action: script.zen_dojotools_filecabinet
          continue_on_error: true
          response_variable: _lu_reg_read
          data:
            action_type: get
            volume_entity_id: "{{ _hh }}"
            key: lens_registry
        - variables:
            _lu_existing: >-
              {%- set raw = _lu_reg_read if _lu_reg_read is mapping else {} -%}
              {%- set val = raw.get('value', {}) -%}
              {%- set parsed = val | from_json if val is string else val -%}
              {{ parsed if parsed is mapping else {} }}
        - variables:
            _lu_new: >-
              {%- set ns = namespace(result={}) -%}
              {%- for k, v in _lu_existing.items() if k != 'library_catalog' -%}
                {%- set ns.result = ns.result | combine({k: v}) -%}
              {%- endfor -%}
              {{ ns.result }}
        - action: script.zen_dojotools_filecabinet
          continue_on_error: true
          response_variable: _lu_write
          data:
            action_type: update
            volume_entity_id: "{{ _hh }}"
            key: lens_registry
            value: "{{ _lu_new | tojson }}"
        - variables:
            result:
              status: "{{ 'success' if _lu_write is mapping and _lu_write.get('status', '') == 'success' else 'error' }}"
              provider: library_catalog
              mode: unregister
              message: Provider library_catalog removed from lens_registry.
        - stop: library unregister complete
          response_variable: result

    # ── section=catalog ── FRBR physical item catalog ─────────────────────────
    # Library owns circulation + storage for all cataloged items.
    # item_type → HA label + creator role. New type = one registry entry + one label.
    # ──────────────────────────────────────────────────────────────────────────
    # ─────────────────────────────────────────────────────────────────────────
    # section=catalog — Pocket MARC generic physical item catalog
    # item_type → ha_label + creator_role. All metadata on catalog_item userobject.
    # New item type = one registry entry + one HA label. Zero handler changes.
    # ─────────────────────────────────────────────────────────────────────────
    - if: "{{ section_norm == 'catalog' }}"
      then:
      - variables:
          _ct_item_type: "{{ item_type_norm if item_type_norm not in ['', 'none'] else (input_data.get('item_type', 'music_recording') if input_data is mapping else 'music_recording') }}"
      - variables:
          catalog_registry:
            music_recording:
              ha_label: music_recording
              creator_role: artist
            book:
              ha_label: book
              creator_role: author
            game:
              ha_label: game
              creator_role: developer
            video:
              ha_label: video
              creator_role: director
            periodical:
              ha_label: periodical
              creator_role: publisher
            art_print:
              ha_label: art_print
              creator_role: artist
      - variables:
          _ct_reg: "{{ catalog_registry.get(_ct_item_type) or catalog_registry.get('music_recording') }}"
          _ct_ha_label: "{{ _ct_reg.get('ha_label', _ct_item_type) }}"
          _ct_creator_role: "{{ _ct_reg.get('creator_role', 'creator') }}"
      - variables:
          result:
            status: error
            section: catalog
            mode: "{{ mode_norm }}"
            item_type: "{{ _ct_item_type }}"
            message: "Unknown catalog mode. Use mode=help for available modes: configure, browse, find, search, add, loan, return."
            caller_token: "{{ caller_token_norm }}"
      - choose:

        # ── catalog help ──────────────────────────────────────────────────────
        - conditions:
          - condition: template
            value_template: '{{ mode_norm == "help" }}'
          sequence:
          - variables:
              result:
                status: ok
                section: catalog
                mode: help
                item_type: "{{ _ct_item_type }}"
                ha_label: "{{ _ct_ha_label }}"
                creator_role: "{{ _ct_creator_role }}"
                description: >-
                  FRBR physical item catalog. Library owns all circulation (loan/return)
                  and storage for cataloged items. Inventory (Grocy) owns the product record
                  (Work). Library mints a catalog_item userobject per physical copy (Item).
                  item_type routes to the right HA label + creator role.
                item_types:
                  music_recording: "creator=artist. format: vinyl/cassette/cd/8-track/reel/minidisc/other. Also: genre, publisher, condition."
                  book: "creator=author. Also: isbn, series, genre, publisher, condition."
                  game: "creator=developer. format: cartridge/disc/digital. Also: platform, digital, hardware_note, series, genre."
                  video: "creator=director. format: dvd/blu-ray/vhs/laserdisc. Also: genre, year."
                  periodical: "creator=publisher. Also: genre, series."
                  art_print: "creator=artist. Also: genre, publisher, condition."
                modes:
                  configure: "Set default location for a class or global intake. input_json: {location, role} where role=class_default (default) or intake. item_type selects class."
                  browse: "List all items of this item_type with metadata and loan status."
                  find: "Filter by any meta field. input_json keys become AND filters."
                  search: "Full-text across title, creator, and all meta string values."
                  add: "Add item. title required OR barcode. Pass creator + any fields in input_json. Location resolved from Grocy catalog_class userfield."
                  intake_pending: "Find ISBN-13 items (978/979 barcode prefix) at the intake location not yet in catalog. Returns candidate list ready for catalog_add. Optional: input_json={\"location_id\":17} to override location."
                  loan: "Loan item. input_json: {item_id} or {title, borrower, due_date}. item_id preferred for multi-copy disambiguation."
                  return: "Return loaned item. input_json: {item_id} or {title}. Restores location from loan_home_location_id."
                location_resolution: "3-tier: explicit location_id → Grocy location with catalog_class=item_type userfield → Grocy location with catalog_class=__intake__ → hard fail. Run configure first."
                examples:
                  configure_class: "section=catalog item_type=music_recording mode=configure input_json={\"location\":\"Music Room\"}"
                  configure_intake: "section=catalog mode=configure input_json={\"location\":\"Receiving\",\"role\":\"intake\"}"
                  browse: "section=catalog item_type=music_recording mode=browse"
                  add: "section=catalog item_type=music_recording mode=add input_json={\"title\":\"Foreigner 4\",\"creator\":\"Foreigner\",\"format\":\"vinyl\",\"year\":\"1981\",\"label\":\"Atlantic\"}"
                  add_8track: "section=catalog item_type=music_recording mode=add input_json={\"title\":\"Boston\",\"creator\":\"Boston\",\"format\":\"8-track\",\"year\":\"1976\",\"label\":\"Epic\"}"
                  find_by_format: "section=catalog item_type=music_recording mode=find input_json={\"format\":\"8-track\"}"
                  search: "section=catalog item_type=music_recording mode=search query=boston"
                  loan: "section=catalog item_type=music_recording mode=loan input_json={\"title\":\"Boston\",\"borrower\":\"Alex\",\"due_date\":\"2026-07-21\"}"
                  return: "section=catalog item_type=music_recording mode=return input_json={\"title\":\"Boston\"}"
                caller_token: "{{ caller_token_norm }}"
          - stop: catalog help
            response_variable: result

        # ── catalog configure ─────────────────────────────────────────────────
        - conditions:
          - condition: template
            value_template: '{{ mode_norm in ["configure", "catalog_configure"] }}'
          sequence:
          - variables:
              _cfg_location: "{{ (input_data.get('location', '') or '') | string | trim if input_data is mapping else '' }}"
              _cfg_role: "{{ (input_data.get('role', 'class_default') or 'class_default') | string | lower | trim if input_data is mapping else 'class_default' }}"
          - if: "{{ _cfg_location == '' }}"
            then:
            - variables:
                result:
                  status: error
                  section: catalog
                  mode: configure
                  item_type: "{{ _ct_item_type }}"
                  message: "location is required. Pass the Grocy location name in input_json."
                  examples:
                    set_class_default: "section=catalog item_type=music_recording mode=configure input_json={\"location\":\"Music Room\"}"
                    set_intake: "section=catalog mode=configure input_json={\"location\":\"Receiving\",\"role\":\"intake\"}"
                  caller_token: "{{ caller_token_norm }}"
            - stop: catalog configure missing location
              response_variable: result
          - action: script.zen_dojotools_inventory
            response_variable: _cfg_schema_raw
            continue_on_error: true
            data:
              mode: userfields_deploy
          - action: script.zen_dojotools_inventory
            response_variable: _cfg_locs_raw
            continue_on_error: true
            data:
              mode: locations_list
              per_page: 200
          - variables:
              _cfg_existing_class: >-
                {%- set locs = _cfg_locs_raw.get('result') if _cfg_locs_raw is mapping else [] -%}
                {%- set locs = locs if locs is sequence and locs is not string else [] -%}
                {%- set ns = namespace(val='') -%}
                {%- for loc in locs if loc is mapping -%}
                  {%- if (loc.get('name', '') | string | lower | trim) == (_cfg_location | lower | trim) -%}
                    {%- set uf = loc.get('userfields', {}) if loc.get('userfields') is mapping else {} -%}
                    {%- set ns.val = (uf.get('catalog_class') or '') | string | trim -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.val }}
          - variables:
              _cfg_class_value: >-
                {%- if _cfg_role == 'intake' -%}__intake__
                {%- else -%}
                  {%- set existing = _cfg_existing_class | string | trim -%}
                  {%- set parts = existing.split(',') | map('trim') | select | list if existing not in ['', 'none', 'null', '__intake__'] else [] -%}
                  {%- if _ct_item_type not in parts -%}
                    {%- set parts = parts + [_ct_item_type] -%}
                  {%- endif -%}
                  {{ parts | join(',') }}
                {%- endif -%}
          - action: script.zen_dojotools_inventory
            response_variable: _cfg_set_raw
            continue_on_error: true
            data:
              mode: locations_metadata_set
              location: "{{ _cfg_location }}"
              catalog_class: "{{ _cfg_class_value }}"
          - variables:
              _cfg_ok: >-
                {{ _cfg_set_raw is mapping
                   and _cfg_set_raw.get('status') not in [none, 'error'] }}
          - variables:
              result:
                status: "{{ 'ok' if _cfg_ok else 'error' }}"
                section: catalog
                mode: configure
                item_type: "{{ _ct_item_type }}"
                role: "{{ _cfg_role }}"
                location: "{{ _cfg_location }}"
                catalog_class_value: "{{ _cfg_class_value }}"
                schema_deployed: "{{ _cfg_schema_raw is mapping and _cfg_schema_raw.get('status') in ['ok', 'partial'] }}"
                message: "{{ 'Location ' ~ _cfg_location ~ ' set as ' ~ (_cfg_role | replace('class_default', 'class default for ' ~ _ct_item_type)) ~ '.' if _cfg_ok else 'Failed to update location userfield. Check location name.' }}"
                caller_token: "{{ caller_token_norm }}"
          - stop: catalog configure done
            response_variable: result

        # ── catalog browse / find / search ────────────────────────────────────
        # M3: item-primary. Grocy API pattern:
        #   1. /objects/userentities?query[]=name=catalog_item  → entity id
        #   2. /objects/userobjects?query[]=userentity_id={id}  → object shells
        #   3. /userfields/userentity-catalog_item/{id}         → field values (per shell)
        #   4. catalog_find_by_tag                              → work products
        #   join: item.product_id → work product dict
        - conditions:
          - condition: template
            value_template: '{{ mode_norm in ["browse", "catalog_browse"] }}'
          sequence:
          - action: script.zen_sutra_grocy
            response_variable: _ct_ue_raw
            continue_on_error: true
            data:
              action_type: read
              endpoint: "/objects/userentities?query[]=name=catalog_item&limit=1"
          - variables:
              _ct_ue_item_id: >-
                {%- set c = (_ct_ue_raw.get('result', {}) or {}).get('content', []) if _ct_ue_raw is mapping else [] -%}
                {%- set c = c if c is sequence and c is not string else [] -%}
                {{ c[0].get('id') | int if c | length > 0 and c[0] is mapping else none }}
          - if: "{{ _ct_ue_item_id is none }}"
            then:
            - variables:
                result:
                  status: error
                  section: catalog
                  mode: browse
                  message: "catalog_item userentity not found. Run inventory mode=userfields_deploy."
                  caller_token: "{{ caller_token_norm }}"
            - stop: catalog browse no userentity
              response_variable: result
          - action: script.zen_sutra_grocy
            response_variable: _ct_obj_raw
            continue_on_error: true
            data:
              action_type: read
              endpoint: "/objects/userobjects?query[]=userentity_id={{ _ct_ue_item_id }}&limit=500&offset=0"
          - action: script.zen_dojotools_inventory
            response_variable: _ct_products_raw
            continue_on_error: true
            data:
              mode: catalog_find_by_tag
              ha_labels: "{{ _ct_ha_label }}"
          - variables:
              _ct_obj_ids: >-
                {%- set c = (_ct_obj_raw.get('result', {}) or {}).get('content', []) if _ct_obj_raw is mapping else [] -%}
                {{ c if c is sequence and c is not string else [] }}
              _ct_prods: >-
                {%- set ns = namespace(d={}) -%}
                {%- set plist = _ct_products_raw if _ct_products_raw is mapping else {} -%}
                {%- set plist = plist.get('products', plist.get('items', plist.get('result', []))) -%}
                {%- for p in plist if p is mapping -%}
                  {%- set ns.d = ns.d | combine({p.get('id') | string: p}) -%}
                {%- endfor -%}
                {{ ns.d }}
          - repeat:
              for_each: "{{ _ct_obj_ids }}"
              sequence:
                - action: script.zen_dojotools_inventory
                  response_variable: _ct_val_raw
                  continue_on_error: true
                  data:
                    mode: userentity_values_get
                    entity: userentity-catalog_item
                    userobject_id: "{{ repeat.item.id }}"
                - variables:
                    _ct_items_acc: >-
                      {%- set prev = _ct_items_acc | default([]) -%}
                      {%- set v = _ct_val_raw.get('values') if _ct_val_raw is mapping and _ct_val_raw.get('status') == 'ok' else none -%}
                      {%- if v is mapping -%}
                        {%- set pid = v.get('product_id') | string | trim -%}
                        {%- set work = (_ct_prods if _ct_prods is mapping else {}).get(pid) -%}
                        {%- if work is mapping -%}
                          {{ prev + [{'item_id': repeat.item.id | int, 'product_id': pid | int, 'title': work.get('name', ''), 'item_type': _ct_item_type, 'creator': v.get('creator', '') | string | trim, 'creator_role': _ct_creator_role, 'format': v.get('format', '') | string | trim, 'condition': v.get('condition', '') | string | trim, 'location_id': v.get('location_id') | int(none), 'isbn': v.get('isbn', '') | string | trim, 'genre': v.get('genre', '') | string | trim, 'platform': v.get('platform', '') | string | trim, 'digital': v.get('digital', '') | string | trim, 'series': v.get('series', '') | string | trim, 'publisher': v.get('publisher', '') | string | trim, 'loan_borrower': v.get('loan_borrower', '') | string | trim, 'loan_date': v.get('loan_date', '') | string | trim, 'loan_due': v.get('loan_due', '') | string | trim, 'loan_home_location_id': v.get('loan_home_location_id') | int(none), 'digital_uri': v.get('digital_uri', '') | string | trim, 'preferred_service': v.get('preferred_service', '') | string | trim, 'mealie_cookbook_slug': v.get('mealie_cookbook_slug', '') | string | trim}] }}
                        {%- else -%}{{ prev }}{%- endif -%}
                      {%- else -%}{{ prev }}{%- endif -%}
          - variables:
              _ct_final: "{{ _ct_items_acc | default([]) }}"
              # browse previously ignored limit/per_page entirely and always
              # returned every matching item — bug reported by Veronica
              # (ticket #282): {'limit': 10} returned all 18 items instead of
              # 10. total_count is kept separate from the (now possibly
              # truncated) count/items per the ticket's acceptance criteria.
              _ct_limit: "{{ (input_data.get('limit', input_data.get('per_page', 0)) | int(0)) if input_data is mapping else 0 }}"
              _ct_offset: "{{ ([(input_data.get('offset', 0) | int(0)) if input_data is mapping else 0, 0] | max) }}"
          - variables:
              _ct_paged: >-
                {%- if _ct_limit > 0 -%}
                  {{ _ct_final[_ct_offset:_ct_offset + _ct_limit] }}
                {%- else -%}
                  {{ _ct_final[_ct_offset:] }}
                {%- endif -%}
          - variables:
              result:
                status: ok
                section: catalog
                mode: browse
                item_type: "{{ _ct_item_type }}"
                count: "{{ _ct_paged | length }}"
                total_count: "{{ _ct_final | length }}"
                items: "{{ _ct_paged }}"
                caller_token: "{{ caller_token_norm }}"
          - stop: catalog browse done
            response_variable: result

        - conditions:
          - condition: template
            value_template: '{{ mode_norm in ["find", "catalog_find"] }}'
          sequence:
          - action: script.zen_sutra_grocy
            response_variable: _ct_ue_raw
            continue_on_error: true
            data:
              action_type: read
              endpoint: "/objects/userentities?query[]=name=catalog_item&limit=1"
          - variables:
              _ct_ue_item_id: >-
                {%- set c = (_ct_ue_raw.get('result', {}) or {}).get('content', []) if _ct_ue_raw is mapping else [] -%}
                {%- set c = c if c is sequence and c is not string else [] -%}
                {{ c[0].get('id') | int if c | length > 0 and c[0] is mapping else none }}
          - action: script.zen_sutra_grocy
            response_variable: _ct_obj_raw
            continue_on_error: true
            data:
              action_type: read
              endpoint: "/objects/userobjects?query[]=userentity_id={{ _ct_ue_item_id }}&limit=500&offset=0"
          - action: script.zen_dojotools_inventory
            response_variable: _ct_products_raw
            continue_on_error: true
            data:
              mode: catalog_find_by_tag
              ha_labels: "{{ _ct_ha_label }}"
          - variables:
              _ct_obj_ids: >-
                {%- set c = (_ct_obj_raw.get('result', {}) or {}).get('content', []) if _ct_obj_raw is mapping else [] -%}
                {{ c if c is sequence and c is not string else [] }}
              _ct_prods: >-
                {%- set ns = namespace(d={}) -%}
                {%- set plist = _ct_products_raw if _ct_products_raw is mapping else {} -%}
                {%- set plist = plist.get('products', plist.get('items', plist.get('result', []))) -%}
                {%- for p in plist if p is mapping -%}
                  {%- set ns.d = ns.d | combine({p.get('id') | string: p}) -%}
                {%- endfor -%}
                {{ ns.d }}
              _ct_title_filter: "{{ (input_data.get('title', '') or '') | lower | trim if input_data is mapping else '' }}"
              _ct_filters: >-
                {%- set inp = input_data if input_data is mapping else {} -%}
                {%- set skip = ['item_type', 'location_id', 'note', 'title'] -%}
                {%- set ns = namespace(f={}) -%}
                {%- for k, v in inp.items() if k not in skip and v is not none and v | string | trim not in ['', 'none', 'null'] -%}
                  {%- set ns.f = ns.f | combine({k: v | string | lower | trim}) -%}
                {%- endfor -%}
                {{ ns.f }}
          - repeat:
              for_each: "{{ _ct_obj_ids }}"
              sequence:
                - action: script.zen_dojotools_inventory
                  response_variable: _ct_val_raw
                  continue_on_error: true
                  data:
                    mode: userentity_values_get
                    entity: userentity-catalog_item
                    userobject_id: "{{ repeat.item.id }}"
                - variables:
                    _ct_items_acc: >-
                      {%- set prev = _ct_items_acc | default([]) -%}
                      {%- set v = _ct_val_raw.get('values') if _ct_val_raw is mapping and _ct_val_raw.get('status') == 'ok' else none -%}
                      {%- if v is mapping -%}
                        {%- set pid = v.get('product_id') | string | trim -%}
                        {%- set work = (_ct_prods if _ct_prods is mapping else {}).get(pid) -%}
                        {%- if work is mapping -%}
                          {%- set fmt = v.get('format', '') | string | trim -%}
                          {%- set cond = v.get('condition', '') | string | trim -%}
                          {%- set title_ok = _ct_title_filter == '' or _ct_title_filter in (work.get('name', '') | lower) -%}
                          {%- set filters = _ct_filters if _ct_filters is mapping else {} -%}
                          {%- set ns2 = namespace(match=true) -%}
                          {%- for fk, fv in filters.items() -%}
                            {%- set mval = (v.get(fk) or work.get(fk) or '') | string | lower | trim -%}
                            {%- if fv | lower not in mval -%}{%- set ns2.match = false -%}{%- endif -%}
                          {%- endfor -%}
                          {%- if title_ok and ns2.match -%}
                            {{ prev + [{'item_id': repeat.item.id | int, 'product_id': pid | int, 'title': work.get('name', ''), 'item_type': _ct_item_type, 'creator': v.get('creator', '') | string | trim, 'creator_role': _ct_creator_role, 'format': fmt, 'condition': cond, 'location_id': v.get('location_id') | int(none), 'isbn': v.get('isbn', '') | string | trim, 'genre': v.get('genre', '') | string | trim, 'platform': v.get('platform', '') | string | trim, 'digital': v.get('digital', '') | string | trim, 'series': v.get('series', '') | string | trim, 'publisher': v.get('publisher', '') | string | trim, 'loan_borrower': v.get('loan_borrower', '') | string | trim, 'loan_date': v.get('loan_date', '') | string | trim, 'loan_due': v.get('loan_due', '') | string | trim, 'mealie_cookbook_slug': v.get('mealie_cookbook_slug', '') | string | trim}] }}
                          {%- else -%}{{ prev }}{%- endif -%}
                        {%- else -%}{{ prev }}{%- endif -%}
                      {%- else -%}{{ prev }}{%- endif -%}
          - variables:
              _ct_final: "{{ _ct_items_acc | default([]) }}"
          - variables:
              result:
                status: ok
                section: catalog
                mode: find
                item_type: "{{ _ct_item_type }}"
                filters: "{{ _ct_filters }}"
                count: "{{ _ct_final | length }}"
                items: "{{ _ct_final }}"
                caller_token: "{{ caller_token_norm }}"
          - stop: catalog find done
            response_variable: result

        - conditions:
          - condition: template
            value_template: '{{ mode_norm in ["search", "catalog_search"] }}'
          sequence:
          - action: script.zen_sutra_grocy
            response_variable: _ct_ue_raw
            continue_on_error: true
            data:
              action_type: read
              endpoint: "/objects/userentities?query[]=name=catalog_item&limit=1"
          - variables:
              _ct_ue_item_id: >-
                {%- set c = (_ct_ue_raw.get('result', {}) or {}).get('content', []) if _ct_ue_raw is mapping else [] -%}
                {%- set c = c if c is sequence and c is not string else [] -%}
                {{ c[0].get('id') | int if c | length > 0 and c[0] is mapping else none }}
          - action: script.zen_sutra_grocy
            response_variable: _ct_obj_raw
            continue_on_error: true
            data:
              action_type: read
              endpoint: "/objects/userobjects?query[]=userentity_id={{ _ct_ue_item_id }}&limit=500&offset=0"
          - action: script.zen_dojotools_inventory
            response_variable: _ct_products_raw
            continue_on_error: true
            data:
              mode: catalog_find_by_tag
              ha_labels: "{{ _ct_ha_label }}"
          - variables:
              _ct_obj_ids: >-
                {%- set c = (_ct_obj_raw.get('result', {}) or {}).get('content', []) if _ct_obj_raw is mapping else [] -%}
                {{ c if c is sequence and c is not string else [] }}
              _ct_prods: >-
                {%- set ns = namespace(d={}) -%}
                {%- set plist = _ct_products_raw if _ct_products_raw is mapping else {} -%}
                {%- set plist = plist.get('products', plist.get('items', plist.get('result', []))) -%}
                {%- for p in plist if p is mapping -%}
                  {%- set ns.d = ns.d | combine({p.get('id') | string: p}) -%}
                {%- endfor -%}
                {{ ns.d }}
              _ct_q: "{{ (input_data.get('q') or input_data.get('query') or query_norm or '') | lower | trim if input_data is mapping else (query_norm | default('', true) | lower | trim) }}"
          - repeat:
              for_each: "{{ _ct_obj_ids }}"
              sequence:
                - action: script.zen_dojotools_inventory
                  response_variable: _ct_val_raw
                  continue_on_error: true
                  data:
                    mode: userentity_values_get
                    entity: userentity-catalog_item
                    userobject_id: "{{ repeat.item.id }}"
                - variables:
                    _ct_items_acc: >-
                      {%- set prev = _ct_items_acc | default([]) -%}
                      {%- set v = _ct_val_raw.get('values') if _ct_val_raw is mapping and _ct_val_raw.get('status') == 'ok' else none -%}
                      {%- if v is mapping -%}
                        {%- set pid = v.get('product_id') | string | trim -%}
                        {%- set work = (_ct_prods if _ct_prods is mapping else {}).get(pid) -%}
                        {%- if work is mapping -%}
                          {%- set fmt = v.get('format', '') | string | trim -%}
                          {%- set cond = v.get('condition', '') | string | trim -%}
                          {%- set creator = v.get('creator', '') | string | trim -%}
                          {%- set haystack = (work.get('name', '') | lower) ~ ' ' ~ (creator | lower) ~ ' ' ~ (fmt | lower) ~ ' ' ~ (cond | lower) ~ ' ' ~ (v.get('genre', '') | lower) ~ ' ' ~ (v.get('platform', '') | lower) ~ ' ' ~ (v.get('series', '') | lower) -%}
                          {%- if _ct_q == '' or _ct_q in haystack -%}
                            {{ prev + [{'item_id': repeat.item.id | int, 'product_id': pid | int, 'title': work.get('name', ''), 'item_type': _ct_item_type, 'creator': creator, 'creator_role': _ct_creator_role, 'format': fmt, 'condition': cond, 'location_id': v.get('location_id') | int(none), 'isbn': v.get('isbn', '') | string | trim, 'genre': v.get('genre', '') | string | trim, 'platform': v.get('platform', '') | string | trim, 'digital': v.get('digital', '') | string | trim, 'series': v.get('series', '') | string | trim, 'publisher': v.get('publisher', '') | string | trim, 'loan_borrower': v.get('loan_borrower', '') | string | trim, 'loan_date': v.get('loan_date', '') | string | trim, 'loan_due': v.get('loan_due', '') | string | trim, 'mealie_cookbook_slug': v.get('mealie_cookbook_slug', '') | string | trim}] }}
                          {%- else -%}{{ prev }}{%- endif -%}
                        {%- else -%}{{ prev }}{%- endif -%}
                      {%- else -%}{{ prev }}{%- endif -%}
          - variables:
              _ct_final: "{{ _ct_items_acc | default([]) }}"
          - variables:
              result:
                status: ok
                section: catalog
                mode: search
                item_type: "{{ _ct_item_type }}"
                query: "{{ _ct_q }}"
                count: "{{ _ct_final | length }}"
                items: "{{ _ct_final }}"
                caller_token: "{{ caller_token_norm }}"
          - stop: catalog search done
            response_variable: result

        # ── catalog add ───────────────────────────────────────────────────────
        - conditions:
          - condition: template
            value_template: '{{ mode_norm in ["add", "catalog_add"] }}'
          sequence:
          - variables:
              _ca_title: "{{ (input_data.get('title', '') or '') | string | trim if input_data is mapping else '' }}"
              _ca_note: "{{ (input_data.get('note', '') or '') | string | trim if input_data is mapping else '' }}"
              _ca_barcode: "{{ (input_data.get('barcode', '') or '') | string | trim if input_data is mapping else '' }}"
              _ca_explicit_loc: >-
                {%- set v = (input_data.get('location_id', none) if input_data is mapping else none) -%}
                {{ v | int if v is not none and v | string | trim not in ['', 'none', 'null'] else none }}
              _ca_loc_name_in: "{{ (input_data.get('location', '') or '') | string | trim if input_data is mapping else '' }}"
          # ── resolve a location NAME to an id (location_id numeric override still
          #     wins if both are given). Same locations_find approach move uses —
          #     a real targeted query, not a paginated bulk list capped at ~250 that
          #     would miss anything created later than the first page. ──
          - if: "{{ _ca_explicit_loc is none and _ca_loc_name_in != '' }}"
            then:
            - action: script.zen_dojotools_inventory
              response_variable: _ca_loc_name_raw
              continue_on_error: true
              data:
                mode: locations_find
                item: "{{ _ca_loc_name_in }}"
            - variables:
                _ca_explicit_loc: >-
                  {%- set _r = _ca_loc_name_raw.get('result', []) if _ca_loc_name_raw is mapping else [] -%}
                  {%- set _r = _r if _r is sequence and _r is not string else [] -%}
                  {%- set needle = _ca_loc_name_in | lower -%}
                  {%- set ns = namespace(found=none) -%}
                  {%- for loc in _r if loc is mapping -%}
                    {%- if ns.found is none and (loc.get('name', '') | lower) == needle -%}
                      {%- set ns.found = loc.get('id') | int -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {%- if ns.found is none -%}
                    {%- for loc in _r if loc is mapping -%}
                      {%- if ns.found is none and needle in (loc.get('name', '') | lower) -%}
                        {%- set ns.found = loc.get('id') | int -%}
                      {%- endif -%}
                    {%- endfor -%}
                  {%- endif -%}
                  {{ ns.found }}
          - if: "{{ _ca_title == '' and _ca_barcode == '' }}"
            then:
            - variables:
                result:
                  status: error
                  section: catalog
                  mode: add
                  item_type: "{{ _ct_item_type }}"
                  message: title or barcode is required.
                  coaching:
                  - "By title: section=catalog item_type=book mode=add input_json={\"title\":\"Book Title\"}"
                  - "By barcode: section=catalog item_type=book mode=add input_json={\"barcode\":\"9780375826696\"}"
                  - "Add creator, format, condition, isbn, genre, series, and any other known fields."
                  - "Physical cookbook that has a matching Mealie cookbook: add mealie_cookbook_slug (the Mealie cookbook's slug) to input_json — a plain cross-reference, not a sync. Not a substitute for digital_uri/preferred_service, which is specifically for audiobook/media playback bridging."
            - stop: catalog add title required
              response_variable: result
          - action: script.zen_dojotools_inventory
            response_variable: _ca_loc_list_raw
            continue_on_error: true
            data:
              mode: locations_list
              per_page: 200
          - variables:
              _ca_all_locs: >-
                {%- set _r = _ca_loc_list_raw.get('result') if _ca_loc_list_raw is mapping else none -%}
                {{ _r if _r is sequence and _r is not string else [] }}
          - variables:
              _ca_class_loc: >-
                {%- set ns = namespace(id=none) -%}
                {%- for loc in _ca_all_locs if loc is mapping -%}
                  {%- set uf = loc.get('userfields', {}) if loc.get('userfields') is mapping else {} -%}
                  {%- set classes = (uf.get('catalog_class') or '') | string | trim -%}
                  {%- set class_list = classes.split(',') | map('trim') | list -%}
                  {%- if _ct_item_type in class_list and ns.id is none -%}
                    {%- set ns.id = loc.get('id') | int -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.id }}
              _ca_intake_loc: >-
                {%- set ns = namespace(id=none) -%}
                {%- for loc in _ca_all_locs if loc is mapping -%}
                  {%- set uf = loc.get('userfields', {}) if loc.get('userfields') is mapping else {} -%}
                  {%- if uf.get('catalog_class', '') | string | trim == '__intake__' -%}
                    {%- set ns.id = loc.get('id') | int -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.id }}
          - variables:
              _ca_loc_id: >-
                {%- if _ca_explicit_loc is not none -%}
                  {{ _ca_explicit_loc | int }}
                {%- elif _ca_class_loc is not none -%}
                  {{ _ca_class_loc | int }}
                {%- elif _ca_intake_loc is not none -%}
                  {{ _ca_intake_loc | int }}
                {%- else -%}
                  {{ none }}
                {%- endif -%}
              _ca_loc_source: >-
                {%- if _ca_explicit_loc is not none -%}explicit
                {%- elif _ca_class_loc is not none -%}class_default
                {%- elif _ca_intake_loc is not none -%}intake
                {%- else -%}none{%- endif -%}
          - if: "{{ _ca_loc_id is none }}"
            then:
            - variables:
                result:
                  status: error
                  section: catalog
                  mode: add
                  item_type: "{{ _ct_item_type }}"
                  message: >-
                    No location configured for {{ _ct_item_type }} and no intake location set.
                    Run: section=catalog item_type={{ _ct_item_type }} mode=configure input_json={"location":"<Location Name>"}
                    Or set a global intake: section=catalog mode=configure input_json={"location":"<Location Name>","role":"intake"}
                  caller_token: "{{ caller_token_norm }}"
            - stop: catalog add no location
              response_variable: result
          # ── barcode-first product resolution ──────────────────────────────
          - variables:
              _ca_product_id: "{{ none }}"
              _ca_action: item_added
          - if: "{{ _ca_barcode != '' }}"
            then:
            - action: script.zen_dojotools_inventory
              response_variable: _ca_bc_raw
              continue_on_error: true
              data:
                mode: catalog_find_by_barcode
                barcode: "{{ _ca_barcode }}"
            - variables:
                _ca_bc_product_id: >-
                  {%- set r = _ca_bc_raw if _ca_bc_raw is mapping else {} -%}
                  {{ r.get('product_id') | int(0) if r.get('status') == 'found' else 0 }}
                _ca_bc_name: >-
                  {%- set r = _ca_bc_raw if _ca_bc_raw is mapping else {} -%}
                  {{ (r.get('product_name') or '') | string | trim if r.get('status') == 'found' else '' }}
            - if: "{{ _ca_bc_product_id | int(0) > 0 }}"
              then:
              - variables:
                  _ca_product_id: "{{ _ca_bc_product_id | int }}"
                  _ca_title: "{{ _ca_bc_name if _ca_title == '' else _ca_title }}"
                  _ca_action: item_added
          # ── title-based dedup + BOM import (skipped if barcode resolved) ──
          - if: "{{ _ca_product_id is none or _ca_product_id | int(0) == 0 }}"
            then:
            - action: script.zen_dojotools_inventory
              response_variable: _ca_existing_raw
              continue_on_error: true
              data:
                mode: catalog_find_by_tag
                ha_labels: "{{ _ct_ha_label }}"
            - variables:
                _ca_existing: >-
                  {%- set r = _ca_existing_raw if _ca_existing_raw is mapping else {} -%}
                  {%- set items = r.get('items', r.get('products', r.get('result', []))) -%}
                  {%- set items = items if items is sequence and items is not string else [] -%}
                  {%- set title_norm = _ca_title | lower -%}
                  {%- set ns = namespace(found=none) -%}
                  {%- for b in items if b is mapping -%}
                    {%- if (b.get('name', '') | lower) == title_norm -%}{%- set ns.found = b -%}{%- endif -%}
                  {%- endfor -%}
                  {{ ns.found | default(none, true) }}
            # --- resolve product_id (work dedup) then fall through to item creation ---
            - if: "{{ _ca_existing is mapping }}"
              then:
              - variables:
                  _ca_product_id: "{{ _ca_existing.get('id') | int(0) }}"
                  _ca_action: item_added
              else:
              - variables:
                  _ca_bom: >-
                    {%- set item = {'name': _ca_title | string} -%}
                    {%- if _ca_loc_id is not none -%}
                      {%- set item = item | combine({'location_id': _ca_loc_id | int}) -%}
                    {%- endif -%}
                    {%- if _ca_note != '' -%}
                      {%- set item = item | combine({'note': _ca_note}) -%}
                    {%- endif -%}
                    {%- set bom = {'default_ha_labels': _ct_ha_label, 'default_asset_type': _ct_item_type, 'default_unit': 'each', 'items': [item]} -%}
                    {%- if _ca_loc_id is not none -%}
                      {%- set bom = bom | combine({'default_location_id': _ca_loc_id | int}) -%}
                    {%- endif -%}
                    {{ bom | tojson }}
              - action: script.zen_dojotools_inventory
                response_variable: _ca_import_raw
                continue_on_error: true
                data:
                  mode: catalog_import_bom
                  bom: "{{ _ca_bom }}"
                  confirm_action: true
              - variables:
                  _ca_product_id: >-
                    {%- set r = _ca_import_raw if _ca_import_raw is mapping else {} -%}
                    {%- set items = r.get('items', []) -%}
                    {%- set created = items | selectattr('status', 'equalto', 'created') | list -%}
                    {{ created[0].get('product_id', none) if created | length > 0 and created[0] is mapping else none }}
                  _ca_action: product_and_item_created
          # guard: work product unavailable
          - if: "{{ _ca_product_id | default(none) is none or _ca_product_id | int(0) == 0 }}"
            then:
            - variables:
                result:
                  status: error
                  section: catalog
                  mode: add
                  message: "Work product creation failed — BOM import returned no product_id."
                  title: "{{ _ca_title }}"
                  caller_token: "{{ caller_token_norm }}"
            - stop: catalog add import failed
              response_variable: result
          # apply HA label to product (covers BB-created products that bypass BOM)
          - if: "{{ _ca_product_id is not none and _ca_product_id | int(0) > 0 }}"
            then:
            - action: script.zen_dojotools_inventory
              continue_on_error: true
              data:
                mode: products_tag
                product_id: "{{ _ca_product_id }}"
                ha_labels: "{{ _ct_ha_label }}"
          # resolve catalog_item userentity ID (avoid hardcoding)
          - action: script.zen_dojotools_inventory
            response_variable: _ca_ue_list_raw
            continue_on_error: true
            data:
              mode: userentities_list
          - variables:
              _ca_ue_item_id: >-
                {%- set ues = (_ca_ue_list_raw.get('userentities', []) if _ca_ue_list_raw is mapping else []) -%}
                {%- set match = ues | selectattr('name','equalto','catalog_item') | list -%}
                {{ match[0].get('id') | int if match | length > 0 and match[0] is mapping else none }}
          - if: "{{ _ca_ue_item_id is none }}"
            then:
            - variables:
                result:
                  status: error
                  section: catalog
                  mode: add
                  message: "catalog_item userentity not found. Run mode=userfields_deploy (inventory tool) to initialize schema."
                  caller_token: "{{ caller_token_norm }}"
            - stop: catalog add no userentity
              response_variable: result
          # create physical item record
          - action: script.zen_dojotools_inventory
            response_variable: _ca_item_raw
            continue_on_error: true
            data:
              mode: userobjects_create
              userentity_id: "{{ _ca_ue_item_id }}"
          - variables:
              _ca_item_id: >-
                {{ (_ca_item_raw.get('created_id') | int)
                   if _ca_item_raw is mapping and _ca_item_raw.get('created_id') is not none
                   else none }}
          - variables:
              _ca_inp: "{{ input_data if input_data is mapping else {} }}"
          - variables:
              _ca_values_dict: >-
                {%- set inp = _ca_inp if _ca_inp is mapping else {} -%}
                {%- set ns = namespace(d={'product_id': _ca_product_id | int, 'item_type': _ct_item_type}) -%}
                {%- if _ca_loc_id is not none -%}{%- set ns.d = ns.d | combine({'location_id': _ca_loc_id | int}) -%}{%- endif -%}
                {%- set _str_fields = ['format','condition','isbn','genre','platform','digital','hardware_note','series','publisher','digital_uri','preferred_service','mealie_cookbook_slug'] -%}
                {%- for k in _str_fields -%}
                  {%- set v = (inp.get(k, '') or '') | string | trim -%}
                  {%- if v not in ['', 'none', 'null'] -%}{%- set ns.d = ns.d | combine({k: v}) -%}{%- endif -%}
                {%- endfor -%}
                {%- set creator_v = (inp.get('creator', '') or '') | string | trim -%}
                {%- if creator_v != '' -%}{%- set ns.d = ns.d | combine({'creator': creator_v}) -%}{%- endif -%}
                {{ ns.d | tojson }}
          - if: "{{ _ca_item_id is not none }}"
            then:
            - action: script.zen_dojotools_inventory
              response_variable: _ca_vals_raw
              continue_on_error: true
              data:
                mode: userentity_values_set
                entity: userentity-catalog_item
                userobject_id: "{{ _ca_item_id }}"
                values_json: "{{ _ca_values_dict }}"
          # ── auto-shelve: transfer stock from intake → shelf when class_default resolved ──
          - variables:
              _ca_shelved: false
          - if: >-
              {{ _ca_loc_source == 'class_default'
                 and _ca_intake_loc is not none
                 and _ca_intake_loc | int != _ca_loc_id | int
                 and _ca_product_id is not none
                 and _ca_product_id | int(0) > 0 }}
            then:
            - action: script.zen_dojotools_inventory
              response_variable: _ca_transfer_raw
              continue_on_error: true
              data:
                mode: stock_transfer_location
                product_id: "{{ _ca_product_id }}"
                location_id: "{{ _ca_intake_loc }}"
                to_location_id: "{{ _ca_loc_id }}"
            - variables:
                _ca_shelved: >-
                  {{ _ca_transfer_raw is mapping
                     and _ca_transfer_raw.get('status') in ['ok', 'success'] }}
          - variables:
              result:
                status: "{{ _ca_action }}"
                section: catalog
                mode: add
                item_type: "{{ _ct_item_type }}"
                product_id: "{{ _ca_product_id }}"
                item_id: "{{ _ca_item_id }}"
                title: "{{ _ca_title }}"
                creator: "{{ (_ca_inp.get('creator', '') or '') | string | trim if _ca_inp is mapping else '' }}"
                format: "{{ (_ca_inp.get('format', '') or '') | string | trim if _ca_inp is mapping else '' }}"
                condition: "{{ (_ca_inp.get('condition', '') or '') | string | trim if _ca_inp is mapping else '' }}"
                location_id: "{{ _ca_loc_id }}"
                location_source: "{{ _ca_loc_source }}"
                shelved: "{{ _ca_shelved }}"
                ha_label: "{{ _ct_ha_label }}"
                hint: "{{ 'Item placed in intake/receiving location. Set a class default: section=catalog item_type=' ~ _ct_item_type ~ ' mode=configure input_json={\"location\":\"<shelf name>\"}' if _ca_loc_source == 'intake' else '' }}"
                caller_token: "{{ caller_token_norm }}"
          - stop: catalog add done
            response_variable: result

        # ── catalog update ────────────────────────────────────────────────────
        # Safe partial update: GET current values -> combine() caller's partial input_json onto
        # them -> userentity_values_set with the MERGED dict. Never a blind overwrite of fields
        # the caller didn't mention (catalog_add's write is blind, but fine there — nothing to
        # clobber at creation time). Closes the retroactive-edit gap: mealie_cookbook_slug (and
        # any other catalog_item field) could previously only be set at add time.
        - conditions:
          - condition: template
            value_template: '{{ mode_norm in ["update", "catalog_update"] }}'
          sequence:
          - variables:
              _cu_item_id: >-
                {%- set v = (input_data.get('item_id', none) if input_data is mapping else none) -%}
                {{ v | int if v is not none and v | string | trim not in ['', 'none', 'null'] else none }}
          - if: "{{ _cu_item_id is none }}"
            then:
            - variables:
                result:
                  status: error
                  section: catalog
                  mode: update
                  item_type: "{{ _ct_item_type }}"
                  message: item_id is required (inside input_json).
                  coaching:
                  - "section=catalog item_type=book mode=update input_json={\"item_id\":44,\"condition\":\"good\"}"
            - stop: catalog update item_id required
              response_variable: result
          - action: script.zen_dojotools_inventory
            response_variable: _cu_current_raw
            continue_on_error: true
            data:
              mode: userentity_values_get
              entity: userentity-catalog_item
              userobject_id: "{{ _cu_item_id }}"
          - variables:
              _cu_current_values: >-
                {{ _cu_current_raw.get('values', {})
                   if (_cu_current_raw is defined and _cu_current_raw.get('status') == 'ok'
                       and _cu_current_raw.get('values') is mapping)
                   else none }}
          - if: "{{ _cu_current_values is none }}"
            then:
            - variables:
                result:
                  status: error
                  section: catalog
                  mode: update
                  item_type: "{{ _ct_item_type }}"
                  message: "Could not fetch current values for item_id {{ _cu_item_id }} — it may not exist."
            - stop: catalog update item not found
              response_variable: result
          - variables:
              _cu_partial: >-
                {%- set inp = input_data if input_data is mapping else {} -%}
                {%- set ns = namespace(d={}) -%}
                {%- set _str_fields = ['item_type','creator','format','condition','isbn','genre','platform','digital','hardware_note','series','publisher','digital_uri','preferred_service','mealie_cookbook_slug'] -%}
                {%- for k in _str_fields -%}
                  {%- set v = (inp.get(k, none)) -%}
                  {%- if v is not none and (v | string | trim) not in ['', 'none', 'null'] -%}{%- set ns.d = ns.d | combine({k: v | string | trim}) -%}{%- endif -%}
                {%- endfor -%}
                {%- if inp.get('location_id', none) is not none -%}{%- set ns.d = ns.d | combine({'location_id': inp.get('location_id') | int}) -%}{%- endif -%}
                {{ ns.d }}
          # title lives on the Grocy PRODUCT's own name field (set that way at
          # add time — {'name': title}), never as a userentity value, so it
          # can't be merged in via userentity_values_set like the fields
          # above. Rename the product directly instead.
          - variables:
              _cu_title_in: "{{ (input_data.get('title', '') or '') | string | trim if input_data is mapping else '' }}"
          - if: "{{ _cu_partial | length == 0 and _cu_title_in == '' }}"
            then:
            - variables:
                result:
                  status: error
                  section: catalog
                  mode: update
                  item_type: "{{ _ct_item_type }}"
                  message: No recognized fields to update were found in input_json.
            - stop: catalog update no fields
              response_variable: result
          - variables:
              _cu_write_ok: true
          - if: "{{ _cu_partial | length > 0 }}"
            then:
            - variables:
                _cu_merged: "{{ (_cu_current_values | combine(_cu_partial)) | tojson }}"
            - action: script.zen_dojotools_inventory
              response_variable: _cu_write_raw
              continue_on_error: true
              data:
                mode: userentity_values_set
                entity: userentity-catalog_item
                userobject_id: "{{ _cu_item_id }}"
                values_json: "{{ _cu_merged }}"
            - variables:
                _cu_write_ok: "{{ _cu_write_raw is defined and _cu_write_raw.get('written') == true }}"
          - variables:
              _cu_rename_ok: true
          - if: "{{ _cu_title_in != '' }}"
            then:
            - variables:
                _cu_rename_product_id: "{{ _cu_current_values.get('product_id', none) }}"
            - action: script.zen_dojotools_inventory
              response_variable: _cu_rename_raw
              continue_on_error: true
              data:
                mode: rename_product
                product_id: "{{ _cu_rename_product_id }}"
                new_name: "{{ _cu_title_in }}"
            - variables:
                _cu_rename_ok: "{{ _cu_rename_raw is defined and _cu_rename_raw.get('status') == 'success' }}"
          - variables:
              result:
                status: "{{ 'success' if (_cu_write_ok and _cu_rename_ok) else 'error' }}"
                section: catalog
                mode: update
                item_type: "{{ _ct_item_type }}"
                item_id: "{{ _cu_item_id }}"
                fields_changed: "{{ _cu_partial.keys() | list + (['title'] if _cu_title_in != '' else []) }}"
                caller_token: "{{ caller_token_norm }}"
          - stop: catalog update done
            response_variable: result

        # ── catalog loan ──────────────────────────────────────────────────────
        # M4: operates on catalog_item userobject (item_id), not product
        # Resolution: item_id direct | title+format → find item → userentity_values_set
        - conditions:
          - condition: template
            value_template: '{{ mode_norm in ["loan", "catalog_loan"] }}'
          sequence:
          - variables:
              _cl_item_id_in: >-
                {%- set v = (input_data.get('item_id', none) if input_data is mapping else none) -%}
                {{ v | int if v is not none and v | string | trim not in ['', 'none', 'null'] else none }}
              _cl_title:    "{{ (input_data.get('title', '') or '') | string | trim if input_data is mapping else '' }}"
              _cl_format:   "{{ (input_data.get('format', '') or '') | string | lower | trim if input_data is mapping else '' }}"
              _cl_borrower: "{{ (input_data.get('borrower', '') or '') | string | trim if input_data is mapping else '' }}"
              _cl_due:      "{{ (input_data.get('due_date', '') or input_data.get('due', '') or '') | string | trim if input_data is mapping else '' }}"
          - if: "{{ _cl_borrower == '' or (_cl_item_id_in is none and _cl_title == '') }}"
            then:
            - variables:
                result:
                  status: error
                  section: catalog
                  mode: loan
                  item_type: "{{ _ct_item_type }}"
                  message: "borrower and (item_id or title) are required."
                  coaching: "input_json: {\"title\": \"No Parking on the Dance Floor\", \"format\": \"cassette\", \"borrower\": \"Alex\", \"due_date\": \"2026-07-21\"}"
            - stop: catalog loan missing input
              response_variable: result
          # --- resolve item_id if not provided directly ---
          - if: "{{ _cl_item_id_in is none }}"
            then:
            # resolve userentity + shells (same pattern as browse)
            - action: script.zen_sutra_grocy
              response_variable: _cl_ue_raw
              continue_on_error: true
              data:
                action_type: read
                endpoint: "/objects/userentities?query[]=name=catalog_item&limit=1"
            - variables:
                _cl_ue_id: >-
                  {%- set c = (_cl_ue_raw.get('result', {}) or {}).get('content', []) if _cl_ue_raw is mapping else [] -%}
                  {%- set c = c if c is sequence and c is not string else [] -%}
                  {{ c[0].get('id') | int if c | length > 0 and c[0] is mapping else none }}
            - action: script.zen_sutra_grocy
              response_variable: _cl_obj_raw
              continue_on_error: true
              data:
                action_type: read
                endpoint: "/objects/userobjects?query[]=userentity_id={{ _cl_ue_id }}&limit=500&offset=0"
            - action: script.zen_dojotools_inventory
              response_variable: _cl_products_raw
              continue_on_error: true
              data:
                mode: catalog_find_by_tag
                ha_labels: "{{ _ct_ha_label }}"
            - variables:
                _cl_obj_ids: >-
                  {%- set c = (_cl_obj_raw.get('result', {}) or {}).get('content', []) if _cl_obj_raw is mapping else [] -%}
                  {{ c if c is sequence and c is not string else [] }}
                _cl_prods: >-
                  {%- set ns = namespace(d={}) -%}
                  {%- set plist = _cl_products_raw if _cl_products_raw is mapping else {} -%}
                  {%- set plist = plist.get('products', plist.get('items', plist.get('result', []))) -%}
                  {%- for p in plist if p is mapping -%}
                    {%- set ns.d = ns.d | combine({p.get('id') | string: p}) -%}
                  {%- endfor -%}
                  {{ ns.d }}
            - repeat:
                for_each: "{{ _cl_obj_ids }}"
                sequence:
                  - action: script.zen_dojotools_inventory
                    response_variable: _cl_val_raw
                    continue_on_error: true
                    data:
                      mode: userentity_values_get
                      entity: userentity-catalog_item
                      userobject_id: "{{ repeat.item.id }}"
                  - variables:
                      _cl_matches_acc: >-
                        {%- set prev = _cl_matches_acc | default([]) -%}
                        {%- set v = _cl_val_raw.get('values') if _cl_val_raw is mapping and _cl_val_raw.get('status') == 'ok' else none -%}
                        {%- if v is mapping -%}
                          {%- set pid = v.get('product_id') | string | trim -%}
                          {%- set work = (_cl_prods if _cl_prods is mapping else {}).get(pid) -%}
                          {%- if work is mapping -%}
                            {%- set title_ok = _cl_title | lower in (work.get('name', '') | lower) -%}
                            {%- set fmt_ok = _cl_format == '' or _cl_format in (v.get('format', '') | lower) -%}
                            {%- if title_ok and fmt_ok -%}
                              {{ prev + [{'item_id': repeat.item.id | int, 'product_id': pid | int, 'title': work.get('name', ''), 'format': v.get('format', ''), 'condition': v.get('condition', ''), 'location_id': v.get('location_id') | int(none), 'loan_borrower': v.get('loan_borrower', '') | string | trim}] }}
                            {%- else -%}{{ prev }}{%- endif -%}
                          {%- else -%}{{ prev }}{%- endif -%}
                        {%- else -%}{{ prev }}{%- endif -%}
            - variables:
                _cl_candidates: "{{ _cl_matches_acc | default([]) }}"
            - if: "{{ _cl_candidates | length == 0 }}"
              then:
              - variables:
                  result:
                    status: not_found
                    section: catalog
                    mode: loan
                    item_type: "{{ _ct_item_type }}"
                    message: "No item found for '{{ _cl_title }}'{{ ' format=' ~ _cl_format if _cl_format != '' else '' }}. Browse to see item_ids."
              - stop: catalog loan not found
                response_variable: result
            - if: "{{ _cl_candidates | length > 1 }}"
              then:
              - variables:
                  result:
                    status: ambiguous
                    section: catalog
                    mode: loan
                    item_type: "{{ _ct_item_type }}"
                    message: "Multiple copies found. Specify item_id or add format= to disambiguate."
                    candidates: "{{ _cl_candidates }}"
              - stop: catalog loan ambiguous
                response_variable: result
            - variables:
                _cl_item_id_in: "{{ _cl_candidates[0].get('item_id') | int }}"
                _cl_resolved_title: "{{ _cl_candidates[0].get('title', _cl_title) }}"
                _cl_current_loc: "{{ _cl_candidates[0].get('location_id') }}"
          # --- get current values if item_id was provided directly ---
          - if: "{{ _cl_resolved_title | default('') == '' }}"
            then:
            - action: script.zen_dojotools_inventory
              response_variable: _cl_cur_raw
              continue_on_error: true
              data:
                mode: userentity_values_get
                entity: userentity-catalog_item
                userobject_id: "{{ _cl_item_id_in }}"
            - variables:
                _cl_cur_vals: "{{ _cl_cur_raw.get('values', {}) if _cl_cur_raw is mapping else {} }}"
                _cl_current_loc: "{{ (_cl_cur_vals.get('location_id') | int(none)) if _cl_cur_vals is mapping else none }}"
                _cl_cur_product_id: "{{ (_cl_cur_vals.get('product_id') | int(0)) if _cl_cur_vals is mapping else 0 }}"
            - action: script.zen_sutra_grocy
              response_variable: _cl_prod_raw
              continue_on_error: true
              data:
                action_type: read
                endpoint: "/objects/products?query[]=id={{ _cl_cur_product_id }}&limit=1"
            - variables:
                _cl_resolved_title: >-
                  {%- set c = (_cl_prod_raw.get('result', {}) or {}).get('content', []) if _cl_prod_raw is mapping else [] -%}
                  {%- set c = c if c is sequence and c is not string else [] -%}
                  {%- set name = c[0].get('name', '') if c | length > 0 and c[0] is mapping else '' -%}
                  {{ name if name != '' else _cl_title }}
          # --- write loan state to userobject ---
          - variables:
              _cl_loan_dict: >-
                {%- set d = {'loan_borrower': _cl_borrower, 'loan_date': now().strftime('%Y-%m-%d'), 'loan_due': _cl_due} -%}
                {%- if _cl_current_loc is not none -%}
                  {%- set d = d | combine({'loan_home_location_id': _cl_current_loc | int}) -%}
                {%- endif -%}
                {{ d | tojson }}
          - action: script.zen_dojotools_inventory
            response_variable: _cl_write_raw
            continue_on_error: true
            data:
              mode: userentity_values_set
              entity: userentity-catalog_item
              userobject_id: "{{ _cl_item_id_in }}"
              values_json: "{{ _cl_loan_dict }}"
          - variables:
              result:
                status: loaned
                section: catalog
                mode: loan
                item_type: "{{ _ct_item_type }}"
                item_id: "{{ _cl_item_id_in }}"
                title: "{{ _cl_resolved_title }}"
                borrower: "{{ _cl_borrower }}"
                loan_date: "{{ now().strftime('%Y-%m-%d') }}"
                loan_due: "{{ _cl_due }}"
                caller_token: "{{ caller_token_norm }}"
          - stop: catalog loan done
            response_variable: result

        # ── catalog return ────────────────────────────────────────────────────
        # M4: clears loan fields on catalog_item userobject, restores location_id
        - conditions:
          - condition: template
            value_template: '{{ mode_norm in ["return", "catalog_return"] }}'
          sequence:
          - variables:
              _cr_item_id_in: >-
                {%- set v = (input_data.get('item_id', none) if input_data is mapping else none) -%}
                {{ v | int if v is not none and v | string | trim not in ['', 'none', 'null'] else none }}
              _cr_title:  "{{ (input_data.get('title', '') or '') | string | trim if input_data is mapping else '' }}"
              _cr_format: "{{ (input_data.get('format', '') or '') | string | lower | trim if input_data is mapping else '' }}"
          - if: "{{ _cr_item_id_in is none and _cr_title == '' }}"
            then:
            - variables:
                result:
                  status: error
                  section: catalog
                  mode: return
                  item_type: "{{ _ct_item_type }}"
                  message: "item_id or title required."
            - stop: catalog return missing input
              response_variable: result
          # --- resolve item_id if needed ---
          - if: "{{ _cr_item_id_in is none }}"
            then:
            - action: script.zen_sutra_grocy
              response_variable: _cr_ue_raw
              continue_on_error: true
              data:
                action_type: read
                endpoint: "/objects/userentities?query[]=name=catalog_item&limit=1"
            - variables:
                _cr_ue_id: >-
                  {%- set c = (_cr_ue_raw.get('result', {}) or {}).get('content', []) if _cr_ue_raw is mapping else [] -%}
                  {%- set c = c if c is sequence and c is not string else [] -%}
                  {{ c[0].get('id') | int if c | length > 0 and c[0] is mapping else none }}
            - action: script.zen_sutra_grocy
              response_variable: _cr_obj_raw
              continue_on_error: true
              data:
                action_type: read
                endpoint: "/objects/userobjects?query[]=userentity_id={{ _cr_ue_id }}&limit=500&offset=0"
            - action: script.zen_dojotools_inventory
              response_variable: _cr_products_raw
              continue_on_error: true
              data:
                mode: catalog_find_by_tag
                ha_labels: "{{ _ct_ha_label }}"
            - variables:
                _cr_obj_ids: >-
                  {%- set c = (_cr_obj_raw.get('result', {}) or {}).get('content', []) if _cr_obj_raw is mapping else [] -%}
                  {{ c if c is sequence and c is not string else [] }}
                _cr_prods: >-
                  {%- set ns = namespace(d={}) -%}
                  {%- set plist = _cr_products_raw if _cr_products_raw is mapping else {} -%}
                  {%- set plist = plist.get('products', plist.get('items', plist.get('result', []))) -%}
                  {%- for p in plist if p is mapping -%}
                    {%- set ns.d = ns.d | combine({p.get('id') | string: p}) -%}
                  {%- endfor -%}
                  {{ ns.d }}
            - repeat:
                for_each: "{{ _cr_obj_ids }}"
                sequence:
                  - action: script.zen_dojotools_inventory
                    response_variable: _cr_val_raw
                    continue_on_error: true
                    data:
                      mode: userentity_values_get
                      entity: userentity-catalog_item
                      userobject_id: "{{ repeat.item.id }}"
                  - variables:
                      _cr_matches_acc: >-
                        {%- set prev = _cr_matches_acc | default([]) -%}
                        {%- set v = _cr_val_raw.get('values') if _cr_val_raw is mapping and _cr_val_raw.get('status') == 'ok' else none -%}
                        {%- if v is mapping and (v.get('loan_borrower') or '') | string | trim != '' -%}
                          {%- set pid = v.get('product_id') | string | trim -%}
                          {%- set work = (_cr_prods if _cr_prods is mapping else {}).get(pid) -%}
                          {%- if work is mapping -%}
                            {%- set title_ok = _cr_title == '' or (_cr_title | lower) in (work.get('name', '') | lower) -%}
                            {%- set fmt_ok = _cr_format == '' or _cr_format in (v.get('format', '') | lower) -%}
                            {%- if title_ok and fmt_ok -%}
                              {{ prev + [{'item_id': repeat.item.id | int, 'product_id': pid | int, 'title': work.get('name', ''), 'format': v.get('format', ''), 'loan_borrower': v.get('loan_borrower', ''), 'loan_home_location_id': v.get('loan_home_location_id') | int(none)}] }}
                            {%- else -%}{{ prev }}{%- endif -%}
                          {%- else -%}{{ prev }}{%- endif -%}
                        {%- else -%}{{ prev }}{%- endif -%}
            - variables:
                _cr_candidates: "{{ _cr_matches_acc | default([]) }}"
            - if: "{{ _cr_candidates | length == 0 }}"
              then:
              - variables:
                  result:
                    status: not_found
                    section: catalog
                    mode: return
                    item_type: "{{ _ct_item_type }}"
                    message: "No loaned item found for '{{ _cr_title }}'{{ ' format=' ~ _cr_format if _cr_format != '' else '' }}."
              - stop: catalog return not found
                response_variable: result
            - if: "{{ _cr_candidates | length > 1 }}"
              then:
              - variables:
                  result:
                    status: ambiguous
                    section: catalog
                    mode: return
                    item_type: "{{ _ct_item_type }}"
                    message: "Multiple loaned copies found. Specify item_id or format= to disambiguate."
                    candidates: "{{ _cr_candidates }}"
              - stop: catalog return ambiguous
                response_variable: result
            - variables:
                _cr_item_id_in: "{{ _cr_candidates[0].get('item_id') | int }}"
                _cr_resolved_title: "{{ _cr_candidates[0].get('title', _cr_title) }}"
                _cr_borrower: "{{ _cr_candidates[0].get('loan_borrower', '') }}"
                _cr_home_loc_id: "{{ _cr_candidates[0].get('loan_home_location_id') }}"
          # --- if item_id provided directly, fetch current values ---
          - if: "{{ _cr_resolved_title | default('') == '' }}"
            then:
            - action: script.zen_dojotools_inventory
              response_variable: _cr_cur_raw
              continue_on_error: true
              data:
                mode: userentity_values_get
                entity: userentity-catalog_item
                userobject_id: "{{ _cr_item_id_in }}"
            - variables:
                _cr_cur_vals: "{{ _cr_cur_raw.get('values', {}) if _cr_cur_raw is mapping else {} }}"
                _cr_borrower: "{{ (_cr_cur_vals.get('loan_borrower', '') or '') if _cr_cur_vals is mapping else '' }}"
                _cr_home_loc_id: "{{ (_cr_cur_vals.get('loan_home_location_id') | int(none)) if _cr_cur_vals is mapping else none }}"
                _cr_cur_product_id: "{{ (_cr_cur_vals.get('product_id') | int(0)) if _cr_cur_vals is mapping else 0 }}"
            - action: script.zen_sutra_grocy
              response_variable: _cr_prod_raw
              continue_on_error: true
              data:
                action_type: read
                endpoint: "/objects/products?query[]=id={{ _cr_cur_product_id }}&limit=1"
            - variables:
                _cr_resolved_title: >-
                  {%- set c = (_cr_prod_raw.get('result', {}) or {}).get('content', []) if _cr_prod_raw is mapping else [] -%}
                  {%- set c = c if c is sequence and c is not string else [] -%}
                  {%- set name = c[0].get('name', '') if c | length > 0 and c[0] is mapping else '' -%}
                  {{ name if name != '' else _cr_title }}
          # --- write cleared loan state ---
          - variables:
              _cr_return_dict: >-
                {%- set d = {'loan_borrower': '', 'loan_date': '', 'loan_due': '', 'loan_home_location_id': none} -%}
                {%- if _cr_home_loc_id is not none -%}
                  {%- set d = d | combine({'location_id': _cr_home_loc_id | int}) -%}
                {%- endif -%}
                {{ d | tojson }}
          - action: script.zen_dojotools_inventory
            response_variable: _cr_write_raw
            continue_on_error: true
            data:
              mode: userentity_values_set
              entity: userentity-catalog_item
              userobject_id: "{{ _cr_item_id_in }}"
              values_json: "{{ _cr_return_dict }}"
          - variables:
              result:
                status: returned
                section: catalog
                mode: return
                item_type: "{{ _ct_item_type }}"
                item_id: "{{ _cr_item_id_in }}"
                title: "{{ _cr_resolved_title }}"
                returned_by: "{{ _cr_borrower }}"
                restored_location_id: "{{ _cr_home_loc_id }}"
                caller_token: "{{ caller_token_norm }}"
          - stop: catalog return done
            response_variable: result

        # ── catalog move ─────────────────────────────────────────────────────
        # Relocate a catalog item to a named location (shelve/reshelve).
        # input_json: {item_id?, title?, location_name, set_as_home?}
        # set_as_home=true also updates loan_home_location_id so returns
        # go back to the new shelf automatically.
        - conditions:
          - condition: template
            value_template: '{{ mode_norm == "move" }}'
          sequence:
          - variables:
              _mv_item_id_in: >-
                {%- set v = (input_data.get('item_id', none) if input_data is mapping else none) -%}
                {{ v | int if v is not none and v | string | trim not in ['', 'none', 'null'] else none }}
              _mv_title:        "{{ (input_data.get('title', '') or '') | string | trim if input_data is mapping else '' }}"
              _mv_loc_name:     "{{ (input_data.get('location_name', '') or '') | string | trim if input_data is mapping else '' }}"
              _mv_set_as_home:  "{{ (input_data.get('set_as_home', false) or false) | bool if input_data is mapping else false }}"
          - if: "{{ _mv_loc_name == '' }}"
            then:
            - variables:
                result:
                  status: error
                  section: catalog
                  mode: move
                  message: "location_name required."
            - stop: catalog move missing location
              response_variable: result
          - if: "{{ _mv_item_id_in is none and _mv_title == '' }}"
            then:
            - variables:
                result:
                  status: error
                  section: catalog
                  mode: move
                  message: "item_id or title required."
            - stop: catalog move missing item
              response_variable: result
          # --- resolve target location ---
          # locations_list is paginated (page size <=250) and ordered roughly
          # by creation date — with 500+ real household locations, anything
          # created more recently (e.g. North Wall Pantry, added 2026-05-30)
          # falls outside any single page and was never found, including this
          # tool's OWN already-configured default shelf. locations_find does a
          # real targeted name query against Grocy instead of a bulk listing,
          # so it isn't capped by page size at all — use that instead.
          - action: script.zen_dojotools_inventory
            response_variable: _mv_locs_raw
            continue_on_error: true
            data:
              mode: locations_find
              item: "{{ _mv_loc_name }}"
          - variables:
              _mv_locs: >-
                {%- set r = _mv_locs_raw if _mv_locs_raw is mapping else {} -%}
                {%- set lst = r.get('locations', r.get('result', [])) -%}
                {{ lst if lst is sequence and lst is not string else [] }}
              _mv_loc_id: >-
                {%- set needle = _mv_loc_name | lower -%}
                {%- set ns = namespace(found=none) -%}
                {%- for loc in _mv_locs if loc is mapping -%}
                  {%- if ns.found is none and (loc.get('name', '') | lower) == needle -%}
                    {%- set ns.found = loc.get('id') | int -%}
                  {%- endif -%}
                {%- endfor -%}
                {%- if ns.found is none -%}
                  {%- for loc in _mv_locs if loc is mapping -%}
                    {%- if ns.found is none and needle in (loc.get('name', '') | lower) -%}
                      {%- set ns.found = loc.get('id') | int -%}
                    {%- endif -%}
                  {%- endfor -%}
                {%- endif -%}
                {{ ns.found }}
              _mv_loc_resolved_name: >-
                {%- set needle = _mv_loc_name | lower -%}
                {%- set ns = namespace(found='') -%}
                {%- for loc in _mv_locs if loc is mapping -%}
                  {%- if ns.found == '' and (loc.get('name', '') | lower) == needle -%}
                    {%- set ns.found = loc.get('name', '') -%}
                  {%- endif -%}
                {%- endfor -%}
                {%- if ns.found == '' -%}
                  {%- for loc in _mv_locs if loc is mapping -%}
                    {%- if ns.found == '' and needle in (loc.get('name', '') | lower) -%}
                      {%- set ns.found = loc.get('name', '') -%}
                    {%- endif -%}
                  {%- endfor -%}
                {%- endif -%}
                {{ ns.found }}
          - if: "{{ _mv_loc_id is none }}"
            then:
            - variables:
                result:
                  status: not_found
                  section: catalog
                  mode: move
                  message: "Location '{{ _mv_loc_name }}' not found in Grocy. Use zen_dojotools_inventory mode=locations_list to see available locations."
            - stop: catalog move location not found
              response_variable: result
          # --- resolve item_id if not provided ---
          - if: "{{ _mv_item_id_in is none }}"
            then:
            - action: script.zen_sutra_grocy
              response_variable: _mv_ue_raw
              continue_on_error: true
              data:
                action_type: read
                endpoint: "/objects/userentities?query[]=name=catalog_item&limit=1"
            - variables:
                _mv_ue_id: >-
                  {%- set c = (_mv_ue_raw.get('result', {}) or {}).get('content', []) if _mv_ue_raw is mapping else [] -%}
                  {%- set c = c if c is sequence and c is not string else [] -%}
                  {{ c[0].get('id') | int if c | length > 0 and c[0] is mapping else none }}
            - action: script.zen_sutra_grocy
              response_variable: _mv_obj_raw
              continue_on_error: true
              data:
                action_type: read
                endpoint: "/objects/userobjects?query[]=userentity_id={{ _mv_ue_id }}&limit=500&offset=0"
            - action: script.zen_dojotools_inventory
              response_variable: _mv_products_raw
              continue_on_error: true
              data:
                mode: catalog_find_by_tag
                ha_labels: "{{ _ct_ha_label }}"
            - variables:
                _mv_obj_ids: >-
                  {%- set c = (_mv_obj_raw.get('result', {}) or {}).get('content', []) if _mv_obj_raw is mapping else [] -%}
                  {{ c if c is sequence and c is not string else [] }}
                _mv_prods: >-
                  {%- set ns = namespace(d={}) -%}
                  {%- set plist = _mv_products_raw if _mv_products_raw is mapping else {} -%}
                  {%- set plist = plist.get('products', plist.get('items', plist.get('result', []))) -%}
                  {%- for p in plist if p is mapping -%}
                    {%- set ns.d = ns.d | combine({p.get('id') | string: p}) -%}
                  {%- endfor -%}
                  {{ ns.d }}
            - repeat:
                for_each: "{{ _mv_obj_ids }}"
                sequence:
                  - action: script.zen_dojotools_inventory
                    response_variable: _mv_val_raw
                    continue_on_error: true
                    data:
                      mode: userentity_values_get
                      entity: userentity-catalog_item
                      userobject_id: "{{ repeat.item.id }}"
                  - variables:
                      _mv_matches_acc: >-
                        {%- set prev = _mv_matches_acc | default([]) -%}
                        {%- set v = _mv_val_raw.get('values') if _mv_val_raw is mapping and _mv_val_raw.get('status') == 'ok' else none -%}
                        {%- if v is mapping -%}
                          {%- set pid = v.get('product_id') | string | trim -%}
                          {%- set work = (_mv_prods if _mv_prods is mapping else {}).get(pid) -%}
                          {%- if work is mapping -%}
                            {%- set title_ok = _mv_title == '' or (_mv_title | lower) in (work.get('name', '') | lower) -%}
                            {%- if title_ok -%}
                              {{ prev + [{'item_id': repeat.item.id | int, 'product_id': pid | int, 'title': work.get('name', ''), 'format': v.get('format', ''), 'home_loc_id': v.get('loan_home_location_id') | int(none)}] }}
                            {%- else -%}{{ prev }}{%- endif -%}
                          {%- else -%}{{ prev }}{%- endif -%}
                        {%- else -%}{{ prev }}{%- endif -%}
            - variables:
                _mv_candidates: "{{ _mv_matches_acc | default([]) }}"
            - if: "{{ _mv_candidates | length == 0 }}"
              then:
              - variables:
                  result:
                    status: not_found
                    section: catalog
                    mode: move
                    message: "No catalog item found matching '{{ _mv_title }}'."
              - stop: catalog move item not found
                response_variable: result
            - if: "{{ _mv_candidates | length > 1 }}"
              then:
              - variables:
                  result:
                    status: ambiguous
                    section: catalog
                    mode: move
                    message: "Multiple copies found matching '{{ _mv_title }}'. Specify item_id to disambiguate."
                    candidates: "{{ _mv_candidates }}"
              - stop: catalog move ambiguous
                response_variable: result
            - variables:
                _mv_item_id_in:   "{{ _mv_candidates[0].get('item_id') | int }}"
                _mv_resolved_title: "{{ _mv_candidates[0].get('title', _mv_title) }}"
                _mv_old_home_loc_id: "{{ _mv_candidates[0].get('home_loc_id') }}"
          # --- fetch current values when item_id was provided directly ---
          - if: "{{ _mv_resolved_title | default('') == '' }}"
            then:
            - action: script.zen_dojotools_inventory
              response_variable: _mv_cur_raw
              continue_on_error: true
              data:
                mode: userentity_values_get
                entity: userentity-catalog_item
                userobject_id: "{{ _mv_item_id_in }}"
            - variables:
                _mv_cur_vals: "{{ _mv_cur_raw.get('values', {}) if _mv_cur_raw is mapping else {} }}"
                _mv_old_home_loc_id: "{{ (_mv_cur_vals.get('loan_home_location_id') | int(none)) if _mv_cur_vals is mapping else none }}"
                _mv_cur_product_id: "{{ (_mv_cur_vals.get('product_id') | int(0)) if _mv_cur_vals is mapping else 0 }}"
            - action: script.zen_sutra_grocy
              response_variable: _mv_prod_raw
              continue_on_error: true
              data:
                action_type: read
                endpoint: "/objects/products?query[]=id={{ _mv_cur_product_id }}&limit=1"
            - variables:
                _mv_resolved_title: >-
                  {%- set c = (_mv_prod_raw.get('result', {}) or {}).get('content', []) if _mv_prod_raw is mapping else [] -%}
                  {%- set c = c if c is sequence and c is not string else [] -%}
                  {{ c[0].get('name', _mv_title) if c | length > 0 and c[0] is mapping else _mv_title }}
          # --- write new location ---
          - variables:
              _mv_write_dict: >-
                {%- set d = {'location_id': _mv_loc_id | int} -%}
                {%- if _mv_set_as_home -%}
                  {%- set d = d | combine({'loan_home_location_id': _mv_loc_id | int}) -%}
                {%- endif -%}
                {{ d | tojson }}
          - action: script.zen_dojotools_inventory
            response_variable: _mv_write_raw
            continue_on_error: true
            data:
              mode: userentity_values_set
              entity: userentity-catalog_item
              userobject_id: "{{ _mv_item_id_in }}"
              values_json: "{{ _mv_write_dict }}"
          - variables:
              result:
                status: moved
                section: catalog
                mode: move
                item_id: "{{ _mv_item_id_in }}"
                title: "{{ _mv_resolved_title }}"
                location_id: "{{ _mv_loc_id }}"
                location_name: "{{ _mv_loc_resolved_name }}"
                home_updated: "{{ _mv_set_as_home }}"
                caller_token: "{{ caller_token_norm }}"
          - stop: catalog move done
            response_variable: result

        # ── catalog configure_status ──────────────────────────────────────────
        # Returns full shelf configuration map: intake location, which classes
        # have shelves, which don't, and where each class resolves to.
        - conditions:
          - condition: template
            value_template: '{{ mode_norm in ["configure_status", "catalog_configure_status"] }}'
          sequence:
          - action: script.zen_dojotools_inventory
            response_variable: _cs_locs_raw
            continue_on_error: true
            data:
              mode: locations_list
              per_page: 200
          - variables:
              _cs_all_locs: >-
                {%- set r = _cs_locs_raw.get('result') if _cs_locs_raw is mapping else none -%}
                {{ r if r is sequence and r is not string else [] }}
          - variables:
              _cs_known_classes:
                - book
                - music_recording
                - game
                - video
                - periodical
                - art_print
          - variables:
              _cs_intake: >-
                {%- set ns = namespace(d=none) -%}
                {%- for loc in _cs_all_locs if loc is mapping -%}
                  {%- set uf = loc.get('userfields', {}) if loc.get('userfields') is mapping else {} -%}
                  {%- if (uf.get('catalog_class') or '') | string | trim == '__intake__' -%}
                    {%- set ns.d = {'id': loc.get('id') | int, 'name': loc.get('name', '')} -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.d }}
              _cs_class_map: >-
                {%- set ns = namespace(d={}) -%}
                {%- for loc in _cs_all_locs if loc is mapping -%}
                  {%- set uf = loc.get('userfields', {}) if loc.get('userfields') is mapping else {} -%}
                  {%- set classes = (uf.get('catalog_class') or '') | string | trim -%}
                  {%- if classes not in ['', 'none', 'null', '__intake__'] -%}
                    {%- for cls in classes.split(',') | map('trim') | select -%}
                      {%- set existing = ns.d.get(cls, []) -%}
                      {%- set ns.d = ns.d | combine({cls: existing + [{'id': loc.get('id') | int, 'name': loc.get('name', '')}]}) -%}
                    {%- endfor -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.d }}
          - variables:
              _cs_configured: >-
                {%- set ns = namespace(d={}) -%}
                {%- for cls in _cs_known_classes -%}
                  {%- set locs = (_cs_class_map if _cs_class_map is mapping else {}).get(cls, []) -%}
                  {%- set ns.d = ns.d | combine({cls: locs if locs | length > 0 else none}) -%}
                {%- endfor -%}
                {{ ns.d }}
              _cs_unconfigured: >-
                {%- set map = _cs_class_map if _cs_class_map is mapping else {} -%}
                {{ _cs_known_classes | reject('in', map.keys() | list) | list }}
          - variables:
              result:
                status: ok
                section: catalog
                mode: configure_status
                intake_location: "{{ _cs_intake }}"
                configured_classes: "{{ _cs_configured }}"
                unconfigured_classes: "{{ _cs_unconfigured }}"
                hint: >-
                  {%- if _cs_unconfigured | length > 0 -%}
                  Run mode=configure item_type=<type> input_json={"location":"<shelf>"} for: {{ _cs_unconfigured | join(', ') }}.
                  {%- else -%}
                  All catalog classes have at least one shelf configured.
                  {%- endif -%}
                caller_token: "{{ caller_token_norm }}"
          - stop: catalog configure_status done
            response_variable: result

        # ── catalog intake_pending ────────────────────────────────────────────
        # Find items at the intake location (or explicit location_id) that have
        # an ISBN-13 barcode (978/979 prefix) but are not yet in the catalog.
        # Returns a ready-to-add candidate list — Friday calls catalog_add per item.
        - conditions:
          - condition: template
            value_template: '{{ mode_norm in ["intake_pending", "catalog_intake_pending"] }}'
          sequence:
          # ── step 1: resolve location ──────────────────────────────────────
          - variables:
              _ip_explicit_loc: >-
                {%- set v = (input_data.get('location_id', none) if input_data is mapping else none) -%}
                {{ v | int if v is not none and v | string | trim not in ['', 'none', 'null'] else none }}
          - action: script.zen_dojotools_inventory
            response_variable: _ip_locs_raw
            continue_on_error: true
            data:
              mode: locations_list
              per_page: 200
          - variables:
              _ip_all_locs: >-
                {%- set r = _ip_locs_raw.get('result') if _ip_locs_raw is mapping else none -%}
                {{ r if r is sequence and r is not string else [] }}
          - variables:
              _ip_intake_loc_id: >-
                {%- if _ip_explicit_loc is not none -%}{{ _ip_explicit_loc | int }}
                {%- else -%}
                  {%- set ns = namespace(id=none) -%}
                  {%- for loc in _ip_all_locs if loc is mapping -%}
                    {%- set uf = loc.get('userfields', {}) if loc.get('userfields') is mapping else {} -%}
                    {%- if uf.get('catalog_class', '') | string | trim == '__intake__' -%}
                      {%- set ns.id = loc.get('id') | int -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ ns.id }}
                {%- endif -%}
              _ip_intake_loc_name: >-
                {%- if _ip_explicit_loc is not none -%}
                  {%- set ns = namespace(name='') -%}
                  {%- for loc in _ip_all_locs if loc is mapping -%}
                    {%- if loc.get('id') | int == _ip_explicit_loc | int -%}{%- set ns.name = loc.get('name', '') -%}{%- endif -%}
                  {%- endfor -%}
                  {{ ns.name }}
                {%- else -%}
                  {%- set ns = namespace(name='') -%}
                  {%- for loc in _ip_all_locs if loc is mapping -%}
                    {%- set uf = loc.get('userfields', {}) if loc.get('userfields') is mapping else {} -%}
                    {%- if uf.get('catalog_class', '') | string | trim == '__intake__' -%}{%- set ns.name = loc.get('name', '') -%}{%- endif -%}
                  {%- endfor -%}
                  {{ ns.name }}
                {%- endif -%}
          - if: "{{ _ip_intake_loc_id is none }}"
            then:
            - variables:
                result:
                  status: error
                  section: catalog
                  mode: intake_pending
                  message: >-
                    No intake location found. Set one with:
                    section=catalog mode=configure input_json={"location":"<Name>","role":"intake"}
                    Or pass location_id explicitly in input_json.
                  caller_token: "{{ caller_token_norm }}"
            - stop: catalog intake_pending no location
              response_variable: result
          # ── step 2: products at this location ─────────────────────────────
          - action: script.zen_dojotools_inventory
            response_variable: _ip_stock_raw
            continue_on_error: true
            data:
              mode: stock_list_by_location
              location_id: "{{ _ip_intake_loc_id }}"
          - variables:
              _ip_loc_products: >-
                {%- set r = _ip_stock_raw.get('result') if _ip_stock_raw is mapping else none -%}
                {%- set r = r if r is sequence and r is not string else [] -%}
                {{ r }}
              _ip_loc_product_ids: >-
                {%- set r = _ip_stock_raw.get('result') if _ip_stock_raw is mapping else none -%}
                {%- set r = r if r is sequence and r is not string else [] -%}
                {%- set ns = namespace(ids=[]) -%}
                {%- for p in r if p is mapping -%}
                  {%- set pid = p.get('product_id') | int(0) -%}
                  {%- if pid > 0 and pid not in ns.ids -%}
                    {%- set ns.ids = ns.ids + [pid] -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.ids }}
          # ── step 3: known catalog product_ids (via HA label — catalog_add stamps the label) ──
          - action: script.zen_dojotools_inventory
            response_variable: _ip_cat_raw
            continue_on_error: true
            data:
              mode: catalog_find_by_tag
              ha_labels: book
          - variables:
              _ip_cataloged_ids: >-
                {%- set r = _ip_cat_raw if _ip_cat_raw is mapping else {} -%}
                {%- set items = r.get('products', r.get('items', [])) -%}
                {%- set items = items if items is sequence and items is not string else [] -%}
                {%- set ns = namespace(ids=[]) -%}
                {%- for p in items if p is mapping -%}
                  {%- set pid = p.get('id') | int(0) -%}
                  {%- if pid > 0 -%}{%- set ns.ids = ns.ids + [pid] -%}{%- endif -%}
                {%- endfor -%}
                {{ ns.ids }}
          # ── step 4: gap = at location but not in catalog ───────────────────
          - variables:
              _ip_gap_ids: >-
                {%- set cat = _ip_cataloged_ids if _ip_cataloged_ids is sequence else [] -%}
                {%- set loc = _ip_loc_product_ids if _ip_loc_product_ids is sequence else [] -%}
                {%- set ns = namespace(gap=[]) -%}
                {%- for pid in loc -%}
                  {%- if pid | int not in cat -%}
                    {%- set ns.gap = ns.gap + [pid | int] -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.gap }}
          # ── step 5: per-gap-product barcode fetch + ISBN filter ────────────
          - repeat:
              for_each: "{{ _ip_gap_ids }}"
              sequence:
              - action: script.zen_dojotools_inventory
                response_variable: _ip_det_raw
                continue_on_error: true
                data:
                  mode: stock_get_product_details
                  product_id: "{{ repeat.item }}"
              - variables:
                  _ip_candidates: >-
                    {%- set prev = _ip_candidates | default([]) -%}
                    {%- set r = _ip_det_raw.get('result', {}) if _ip_det_raw is mapping else {} -%}
                    {%- set r = r if r is mapping else {} -%}
                    {%- set prod = r.get('product', {}) or {} -%}
                    {%- set barcodes = r.get('product_barcodes', []) or [] -%}
                    {%- set ns = namespace(isbn_bc='', found=false) -%}
                    {%- for b in barcodes if b is mapping -%}
                      {%- set bc = b.get('barcode', '') | string | trim -%}
                      {%- if (bc.startswith('978') or bc.startswith('979')) and bc | length == 13 -%}
                        {%- set ns.isbn_bc = bc -%}
                        {%- set ns.found = true -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {%- if ns.found -%}
                      {{ prev + [{'product_id': prod.get('id') | int, 'name': prod.get('name', '') | string | trim, 'barcode': ns.isbn_bc, 'confidence': 'isbn13'}] }}
                    {%- else -%}{{ prev }}{%- endif -%}
          - variables:
              _ip_final: "{{ _ip_candidates | default([]) }}"
          - variables:
              result:
                status: ok
                section: catalog
                mode: intake_pending
                location_id: "{{ _ip_intake_loc_id }}"
                location_name: "{{ _ip_intake_loc_name }}"
                pending_count: "{{ _ip_final | length }}"
                candidates: "{{ _ip_final }}"
                hint: >-
                  {%- if (_ip_final | length) == 0 -%}
                  No ISBN-13 items found at this location that are not already cataloged.
                  {%- else -%}
                  Call section=catalog item_type=book mode=add input_json={"barcode":"<barcode>"} for each candidate.
                  {%- endif -%}
                caller_token: "{{ caller_token_norm }}"
          - stop: catalog intake_pending done
            response_variable: result

      - stop: catalog done
        response_variable: result

    # ── Catalog by_anchor: item_evidence lens — person anchor = loan lookup ──
    - if: "{{ mode_norm == 'by_anchor' }}"
      then:
      - variables:
          _ba_type: "{{ anchor_type | default('', true) | string | trim | lower }}"
          _ba_ids_raw: >-
            {%- set raw = anchor_ids | default('', true) -%}
            {%- if raw is sequence and raw is not string -%}{{ raw | list }}
            {%- elif raw is string and raw | trim != '' -%}{{ raw | trim | from_json(none) or [] }}
            {%- else -%}{{ [] }}{%- endif -%}
      - variables:
          _ba_ids: "{{ _ba_ids_raw if _ba_ids_raw is sequence and _ba_ids_raw is not string else [] }}"
      - if: "{{ _ba_type not in ['person', 'label', 'area_id'] or _ba_ids | length == 0 }}"
        then:
        - variables:
            result:
              status: ok
              evidence: []
              count: 0
              anchor_type: "{{ _ba_type }}"
              message: "Catalog lens supports anchor_type: person (patron checkout lookup), label (collection scope), area_id (stacks location)."
              caller_token: "{{ caller_token_norm }}"
        - stop: by_anchor unsupported
          response_variable: result
      # Resolve catalog_item userentity + all shells
      - action: script.zen_sutra_grocy
        response_variable: _ba_ue_raw
        continue_on_error: true
        data:
          action_type: read
          endpoint: "/objects/userentities?query[]=name=catalog_item&limit=1"
      - variables:
          _ba_ue_id: >-
            {%- set c = (_ba_ue_raw.get('result', {}) or {}).get('content', []) if _ba_ue_raw is mapping else [] -%}
            {%- set c = c if c is sequence and c is not string else [] -%}
            {{ c[0].get('id') | int if c | length > 0 and c[0] is mapping else none }}
      - action: script.zen_sutra_grocy
        response_variable: _ba_obj_raw
        continue_on_error: true
        data:
          action_type: read
          endpoint: "/objects/userobjects?query[]=userentity_id={{ _ba_ue_id }}&limit=500&offset=0"
      - variables:
          _ba_obj_ids: >-
            {%- set c = (_ba_obj_raw.get('result', {}) or {}).get('content', []) if _ba_obj_raw is mapping else [] -%}
            {{ c if c is sequence and c is not string else [] }}
      # Resolve area_id → Grocy location_ids via locations list + ha_area_id userfield
      - if: "{{ _ba_type == 'area_id' }}"
        then:
        - action: script.zen_dojotools_inventory
          response_variable: _ba_locs_raw
          continue_on_error: true
          data:
            mode: locations_list
            per_page: 200
        - variables:
            _ba_area_loc_ids: >-
              {%- set locs = _ba_locs_raw.get('result', []) if _ba_locs_raw is mapping else [] -%}
              {%- set locs = locs if locs is sequence and locs is not string else [] -%}
              {%- set ba_ids_lower = _ba_ids | map('lower') | list -%}
              {%- set ns = namespace(ids=[]) -%}
              {%- for loc in locs if loc is mapping -%}
                {%- set loc_area = loc.get('userfields', {}).get('homeassistant_area', '') | string | lower | trim -%}
                {%- if loc_area != '' and loc_area in ba_ids_lower -%}
                  {%- set ns.ids = ns.ids + [loc.get('id') | int(-1)] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.ids }}
        else:
        - variables:
            _ba_area_loc_ids: []
      # Build anchor_contexts once from input ids (reused in each evidence item)
      - variables:
          _ba_anchor_contexts: >-
            {%- set ns = namespace(ctx=[]) -%}
            {%- for aid in _ba_ids -%}
              {%- set ns.ctx = ns.ctx + [{'type': _ba_type, 'id': aid | string | trim, 'confidence': 'explicit', 'provider': 'library_catalog'}] -%}
            {%- endfor -%}
            {{ ns.ctx }}
      # Enrich each shell — filter for loaned items matching anchor IDs
      - repeat:
          for_each: "{{ _ba_obj_ids }}"
          sequence:
            - action: script.zen_dojotools_inventory
              response_variable: _ba_val_raw
              continue_on_error: true
              data:
                mode: userentity_values_get
                entity: userentity-catalog_item
                userobject_id: "{{ repeat.item.id }}"
            - variables:
                _ba_evidence_acc: >-
                  {%- set prev = _ba_evidence_acc | default([]) -%}
                  {%- set v = _ba_val_raw.get('values') if _ba_val_raw is mapping and _ba_val_raw.get('status') == 'ok' else none -%}
                  {%- if v is mapping -%}
                    {%- set pid = v.get('product_id') | string | trim -%}
                    {%- set eid = 'grocy:catalog_item:' ~ (repeat.item.id | string) -%}
                    {%- set ns = namespace(matched=false) -%}
                    {%- if _ba_type == 'person' -%}
                      {%- set borrower = (v.get('loan_borrower') or '') | lower | trim -%}
                      {%- if borrower != '' -%}
                        {%- for aid in _ba_ids -%}
                          {%- set norm = aid | lower | trim -%}
                          {%- set friendly = norm.split('.')[-1] | replace('_', ' ') if '.' in norm else norm -%}
                          {%- if borrower == norm or borrower == friendly or friendly in borrower or borrower in friendly -%}
                            {%- set ns.matched = true -%}
                          {%- endif -%}
                        {%- endfor -%}
                      {%- endif -%}
                    {%- elif _ba_type == 'label' -%}
                      {%- set item_type = v.get('item_type', '') | lower | trim -%}
                      {%- for aid in _ba_ids -%}
                        {%- set norm = aid | lower | trim -%}
                        {%- if item_type == '' or norm == item_type or norm in item_type -%}
                          {%- set ns.matched = true -%}
                        {%- endif -%}
                      {%- endfor -%}
                    {%- elif _ba_type == 'area_id' -%}
                      {%- set loc_id = v.get('location_id') | int(-1) -%}
                      {%- if loc_id >= 0 and loc_id in _ba_area_loc_ids -%}
                        {%- set ns.matched = true -%}
                      {%- endif -%}
                    {%- endif -%}
                    {%- if ns.matched -%}
                      {%- set _duri = v.get('digital_uri', '') | string | trim -%}
                      {%- set _svc  = v.get('preferred_service', '') | string | trim -%}
                      {%- set _itype = v.get('item_type', '') | lower | trim -%}
                      {%- set _mtype = 'album' if _itype == 'music_recording' else ('movie' if _itype == 'video' else ('audiobook' if _itype == 'book' else ('podcast' if _itype == 'periodical' else none))) -%}
                      {%- set _room  = (_ba_ids | first | string) if _ba_type == 'area_id' and _ba_ids | length > 0 else '' -%}
                      {%- set _hint  = {'uri': _duri, 'source': _svc if _svc != '' else 'catalog', 'media_type': _mtype, 'suggested_room': _room, 'suggested_volume': none} if _duri != '' and _mtype is not none else none -%}
                      {{ prev + [{'evidence_id': eid, 'leaf_type': 'item_evidence', 'content_redacted': false, 'anchor_contexts': _ba_anchor_contexts, 'stack': {'provider': 'library_catalog', 'object_type': 'catalog_item', 'evidence_id': eid, 'lens_mode': 'by_anchor'}, 'playback_hint': _hint, 'content': {'evidence_id': eid, 'lens_mode': 'by_anchor', 'anchor_type': _ba_type, 'item_id': repeat.item.id | int, 'product_id': pid | int(none), 'loan_borrower': v.get('loan_borrower', ''), 'loan_date': v.get('loan_date', ''), 'loan_due': v.get('loan_due', ''), 'format': v.get('format', ''), 'creator': v.get('creator', ''), 'platform': v.get('platform', ''), 'isbn': v.get('isbn', ''), 'genre': v.get('genre', ''), 'series': v.get('series', ''), 'location_id': v.get('location_id') | int(none), 'digital_uri': _duri, 'preferred_service': _svc}}] }}
                    {%- else -%}{{ prev }}{%- endif -%}
                  {%- else -%}{{ prev }}{%- endif -%}
      - variables:
          result:
            status: ok
            evidence: "{{ _ba_evidence_acc | default([]) }}"
            count: "{{ _ba_evidence_acc | default([]) | length }}"
            anchor_type: "{{ _ba_type }}"
            caller_token: "{{ caller_token_norm }}"
      - stop: by_anchor done
        response_variable: result

    - variables:
        result:
          status: error
          tool: Zen DojoTools Library
          section: "{{ section_norm }}"
          stack: "{{ stack_norm }}"
          mode: "{{ mode_norm }}"
          message: "Unknown stack/mode. Use mode=stacks_list to see registered stacks, or mode=help with stack=<name>."
          caller_token: "{{ caller_token_norm }}"
    - stop: library unknown
      response_variable: result

