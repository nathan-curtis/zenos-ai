###############################################################################
# zen_dojotools_room_manager v5.7.0 (codename: RoomReg)
# Physical room definition registry — spatial topology, adjacency, portals
#
# v5.7.0 (2026-08-08): room housekeeping status (room_status_set/get), KFC
#   component_summary fill. Room Manager v3 (blueprints/room_manager_v3/)
#   is a separate system layered on top — see components/room_manager_v3_reflex.md.
#
# v5.6.0 (2026-07-22): room_occupant_prefs gains vendor_activity — an
#   independent field (not a fourth priority tier; a vendor being present
#   doesn't change whose meal/music prefs apply) checking
#   zen_dojotools_rolodex mode=active_appointment for a vendor/contact
#   mid-appointment in this room right now. Attached to every branch's
#   response (guest_stay/household_member/none) — a caution signal for
#   automations (e.g. don't fire a scene while a vendor's mid-repair).
#
# v5.5.0 (2026-07-22): New mode room_occupant_prefs — "who's the relevant
#   person for this room right now, guest or household member, and what are
#   their prefs." Checks zen_dojotools_rolodex mode=active_stay_prefs first
#   (event-shaped guest presence, Twenty guestPrefs); falls back to this
#   room's static room_topology.occupants[] assignment resolved against
#   zen_dojotools_profile_editor (household-member prefs already live there —
#   preferences.allergens, media_prefs — not duplicated into Twenty). No
#   name->cabinet index exists for profile_editor's fixed target_type slots
#   (user/family/expansion_1-5), so occupant name resolution is a bounded scan
#   (max 7 reads per occupant) matching first_name/preferred_name. Allergens
#   union across all matched occupants (a missed one is a safety issue);
#   media_prefs from the first occupant matched — stated simplification, not
#   a hidden guess. Kitchen's mealplan_suggest now calls this instead of
#   active_stay_prefs directly, so a family dinner gets the same allergen
#   flagging a guest stay does.
#
# ── TODO: VAC_SYNC v2 — RE-ENGINEER, DO NOT REMOVE ───────────────────────────
# vac_sync was removed in v1.5.0 because the v1 implementation was fragile:
#   - Hardcoded segment-ID→area_id dict that silently breaks when Rosie remaps
#   - Overwrote adjacent[] (stomped hand-tuned portal/sound_tx/light_tx data)
#   - autovac camera prereq never met; never UAT'd
#
# REQUIREMENTS for vac_sync v2:
#
# Data sources (pick the best available at runtime):
#   A) roborock.get_maps action → returns segment IDs + room names dynamically.
#      Use THIS to build the segment→area_id map at call time, not a hardcode.
#      Docs: https://www.home-assistant.io/integrations/roborock/
#   B) Xiaomi Cloud Map Extractor camera (autovac label) → camera entity attrs:
#      rooms{}, room_numbers, cleaned_rooms, vacuum_room, vacuum_room_name,
#      calibration_points. rooms{} may contain bbox coords {x0,x1,y0,y1} in
#      map pixels — convert to mm using calibration_points if present.
#      Repo: https://github.com/PiotrMachowski/Home-Assistant-custom-components-Xiaomi-Cloud-Map-Extractor
#
# What vac_sync v2 SHOULD write into room_topology (non-destructive merge only):
#   rosie_id    — Roborock segment int (the stable per-map segment number)
#   bbox_mm     — {x0,x1,y0,y1} bounding box in mm (from camera + calibration)
#   dimensions_mm — {xlen,ylen} derived from bbox
#   area_sqm    — float, derived from dimensions_mm (xlen/1000 * ylen/1000)
#   adjacent[]  — ONLY if no adjacent[] exists yet (never overwrite manual links)
#   description — ONLY if no description exists yet
#
# What it MUST NOT touch: portals[], windows[], walls, boundary_links[],
#   occupants[], sound_tx/light_tx values — those are manual-only.
#
# Segment ID stability: Roborock segment IDs reset when user redraws the map.
#   Store rosie_id but treat it as advisory. Build the mapping dynamically from
#   get_maps each sync call — never cache it.
#
# Coordinate system: Xiaomi Map Extractor uses pixel coords tied to map image.
#   calibration_points[] provides pixel→real-world (mm) transform.
#   If calibration_points unavailable, store raw pixel bbox in bbox_px instead
#   and skip area_sqm (don't guess the scale).
#
# Prototype path: build as a separate automation or script first (not inside
#   zen_dojotools_room_manager). Gate: dry_run=true must pass UAT showing
#   correct segment→area_id resolution and non-destructive merging before
#   merging back into mode=vac_sync here.
# ─────────────────────────────────────────────────────────────────────────────
#
# ── LABEL TAXONOMY ──────────────────────────────────────────────────────────
# room_layout  — applied to HA AREA when physical layout is registered here.
# room_manager — KFC: on entity=IS the RM. On area=area is RM-managed.
#                Not written by this tool.
#
# ── STORAGE ──────────────────────────────────────────────────────────────────
# Household cabinet, key: room_topology (JSON dict keyed by area_id)
#
# ── HA TEMPLATE RULES (learned the hard way) ─────────────────────────────────
# - variables: steps use NativeEnvironment — {{ dict }} returns native Python dict.
#   Do NOT use | tojson on variables: outputs — native env converts them back to
#   dicts, making | from_json fail on the result.
# - action: data fields use string rendering — | tojson stays as JSON string.
#   Compute new topology inline in FileCabinet value: field.
# - Inline cabinet read macro (FileCabinet stores payload directly in variables attr):
#     {%- set _r=(state_attr(_hh_cabinet,'variables')|default({},true)).get('room_topology',none) -%}
#     {%- set topo=_r if _r is mapping else (_r|from_json if _r is string and _r|trim not in ['None','none','','null'] else {}) -%}
###############################################################################

script:
  zen_dojotools_room_manager:
    alias: Zen DojoTools Room Manager
    description: >-
      Room intelligence hub + household crisis authority (v5.1.0).
      mode=get area=X: full room brief — topology, live state, inventory, chores,
      tasks, calendar, wiki, tickets, catalog. context_slices=+inventory,+chores,+tasks,+calendar,+wiki,+tickets,+catalog.
      mode=emergency scenario=fire|burglar|weather|medical area=X: crisis snapshot
      — guidance{action,advisory}, from_room{room_exits,adjacent_exits,nearest_shelter},
      shelter{floor-tagged primary/secondary/avoid}, hazards[], safety_equipment[],
      likely_occupied[], location{name,address,zip_code,gps}, rally_point.
      mode=home_overview: whole-house signal + alerts. include_presence=true + presence_mode=filtered (default): hps-labeled trackers only. presence_mode=discover: all BPS candidates with hint+suggest to guide labeling (phone/wearable/mobile_tag → add hps; appliance/tablet → skip). include_notices=true adds triage dashboard.
      mode=set: room topology + household profile (address=, rally_point=, zip_code=).
      Domain tools (ZenLux, climate, inventory) read topology from RM — call RM first.
      mode=help for full reference.
    fields:
      mode:
        description: "get/set/list: room data. zone_set/zone_remove/zones: sub-room zones. landmark_set/landmark_remove/landmarks: named anchors. link/unlink/boundary_*: adjacency. home_overview/emergency: whole-home. area_create/update/delete: manage HA areas. room_occupant_prefs: guest-or-household-member prefs for a room. label_discover: scan area= for v3 room-state label candidates (device_class → motion/occupied/engaged/window/etc), preview by default, confirm_action=true tags them all in one shot. roomstate_enable: master on/off for the v3 room-state engine (automation.zenos_room_manager_dispatch) — omit roomstate_enabled= to read the resolved value (optional label override > cabinet > published default false), pass true/false to write it. reflex_enable: master on/off for the Room Manager REFLEX system (room+state+zen_home_mode -> scene on transition) — separate switch from roomstate_enable, default off, same read/write pattern via reflex_enabled=. reflex_dry_run: lets the REFLEX pipeline resolve for real without firing scenes — logs a zen_event (kind=reflex_dry_run) instead; read/write via reflex_dry_run_enabled=; if reflex_enable is also true, the real fire wins. reflex_wire: assist mode for wiring REFLEX scene labels. area=<room>: full per-room SoC — candidate scenes (name/label/area_id matched), tier_coverage, wired_matrix (what fires for every state x home_mode daypart, engaged/cleaning/emergency auto-inherit occupied when unwired), wiring_warnings (genuinely ambiguous ties); add reflex_wire_detail=true for live scene_details (member entities, current state/brightness/color/labels, member_areas + outside_room leak check). Omit area= for a whole-home rollup — every room's wired/inherited/gap counts in one call, the fastest way to see what's left to wire. Write: reflex_assignments=['entity_id|state|mode',...] (mode optional = any-mode fallback) + confirm_action=true. setup/help."
        selector:
          select:
            options: [get, set, list, zone_set, zone_remove, zones, landmark_set, landmark_remove, landmarks, link, unlink, boundary_link, boundary_unlink, home_overview, emergency, utility, area_create, area_update, area_delete, room_occupant_prefs, room_status_set, room_status_get, label_discover, roomstate_enable, reflex_enable, reflex_dry_run, reflex_wire, setup, pathfind, tool_manifest, kfc_manifest, help]
      area:
        description: "Area to operate on. Required for get, set, link, unlink, area_update, area_delete."
        selector:
          text:
      area_b:
        description: "Second area for link/unlink/boundary_link (adjacency target)."
        selector:
          text:
      walls:
        description: "Wall count. Used by set."
        selector:
          number:
            min: 0
            max: 20
            mode: box
      tax_bucket:
        description: "IRS/appraisal space classification. conditioned|conditioned_storage|conditioned_circulation|conditioned_utility|under_roof_porch|under_roof_garage|under_roof_attic. Used by depreciation suggest_business_use denominator."
        selector:
          select:
            options: [conditioned, conditioned_storage, conditioned_circulation, conditioned_utility, under_roof_porch, under_roof_garage, under_roof_attic]
      windows:
        description: "One window to add/update. Pass as JSON: {name:string (upsert key — allows multiple per direction), direction:N|NE|E|SE|S|SW|W|NW, type:single|double|sliding|casement|fixed|skylight, exit:bool, emerg_exit:bool, drop_ft:num, exit_priority:primary|secondary|tertiary|bail_out, light_tx:0.0-1.0}. name beats direction as upsert key. Extra fields OK."
        selector:
          text:
      portals:
        description: "One portal to add/update. Pass as JSON: {name:string (upsert key — allows multiple portals to same area), type:door|archway|passage, normally:open|closed, exterior:bool, exit:bool, emerg_exit:bool, to:area_id|null, exit_priority:primary|secondary|tertiary|bail_out}. name beats to as upsert key. Extra fields OK."
        selector:
          text:
      clear_portals:
        description: "Clear all existing portals before writing. Default false."
        selector:
          boolean:
      room_status:
        description: "For room_status_set — housekeeping state: clean|dirty|in_service|occupied."
        selector:
          select:
            options: [clean, dirty, in_service, occupied]
      room_status_source:
        description: "For room_status_set — what triggered this status change: turnover|manual|autovac. Default manual."
        selector:
          text:
      room_status_note:
        description: "For room_status_set — optional free-text note (e.g. which chore triggered a 'dirty' mark)."
        selector:
          text:
      roomstate_enabled:
        description: "For mode=roomstate_enable. Omit to READ the current resolved value (label override > cabinet > published default false). Pass true/false to WRITE it — writes the household cabinet 'roomstate_config' drawer (source of truth) AND, if a 'zenos_roomstate_master_switch'-labeled entity exists, syncs it to match. This IS the 'setup flips it on' / 'a way to turn it off' action for the v3 room-state engine's master enable."
        selector:
          boolean:
      reflex_enabled:
        description: "For mode=reflex_enable. Omit to READ the current resolved value (label override > cabinet > published default false). Pass true/false to WRITE it — writes the household cabinet 'reflex_config' drawer (source of truth) AND, if a 'zenos_reflex_master_switch'-labeled entity exists, syncs it to match. Gates the room+state+zen_home_mode -> scene dispatcher (Reflex) independently of roomstate_enable — v3's state engine can run fully live while Reflex stays off, so the room correctly knows its state without acting on it via scenes yet."
        selector:
          boolean:
      reflex_dry_run_enabled:
        description: "For mode=reflex_dry_run. Omit to READ the current resolved value (label override > cabinet > published default false). Pass true/false to WRITE it. When true, the REFLEX pipeline resolves scenes for real (same logic as when live) but logs a zen_event (kind=reflex_dry_run, 'would fire: scene.x') instead of calling scene.turn_on — verify resolution before ever flipping reflex_enable for real. If reflex_enable is ALSO true, the real fire wins."
        selector:
          boolean:
      reflex_assignments:
        description: "For mode=reflex_wire SET. List of 'entity_id|state|mode' strings (mode optional — blank means this scene is the room's fallback for that state, no daypart). e.g. 'scene.office_occupied_day|occupied|home'. Requires confirm_action=true."
        default: []
        selector:
          text:
            multiple: true
      reflex_wire_detail:
        description: "For mode=reflex_wire GET. When true, adds scene_details — for every distinct scene entity_id appearing anywhere in wired_matrix: its member entity_id list, member_areas (distinct area_ids across all members), outside_room (member areas other than this room — flags a scene reaching outside its own labeled room), plus each member's CURRENT live state + brightness/color_temp_kelvin/rgb_color + labels + area_id (NOT what the scene will set them to — HA doesn't expose a scene's captured per-entity values anywhere reachable from a template; this is current live state only). Default false."
        selector:
          boolean:
      clear_windows:
        description: "Clear all existing windows before writing. Default false."
        selector:
          boolean:
      portal_type:
        description: "Portal type for link: door, archway, passage. Default: door."
        selector:
          select:
            options: [door, archway, passage]
      portal_normally:
        description: "Default state for link portal: open, closed. Default: closed."
        selector:
          select:
            options: [open, closed]
      description:
        description: "Room description, max 255 chars. Used by set."
        selector:
          text:
      occupant:
        description: "Person who OWNS/RESIDES in this room (static, e.g. 'alice'). NOT runtime presence — presence is RM occupancy state. Appends; no duplicates. clear_occupants=true to reset."
        selector:
          text:
      clear_occupants:
        description: "Clear all occupants before writing. Default false."
        selector:
          boolean:
      link_sound_tx:
        description: "Sound transmission 0.0-1.0 stamped on both portals by link mode. 0=silent, 1=fully open. Ref: archway=0.85, door-closed=0.30, solid-core=0.15."
        selector:
          number:
            min: 0
            max: 1
            step: 0.05
            mode: box
      link_light_tx:
        description: "Light transmission 0.0-1.0 stamped on both portals by link mode. 0=opaque, 1=fully open. Ref: archway=0.80, door-closed=0.02, glass-door-closed=0.55."
        selector:
          number:
            min: 0
            max: 1
            step: 0.05
            mode: box
      boundary_link_sound_tx:
        description: "Acoustic transmission 0.0-1.0 for boundary_link (non-passable boundary). 0=soundproofed, 1=open air."
        selector:
          number:
            min: 0
            max: 1
            step: 0.05
            mode: box
      boundary_link_light_tx:
        description: "Optical transmission 0.0-1.0 for boundary_link. 0=opaque wall, 1=open air. Ref: glass-partition=0.65, sheer-curtain=0.40, drywall=0.0."
        selector:
          number:
            min: 0
            max: 1
            step: 0.05
            mode: box
      boundary_link_note:
        description: "Optional description of boundary type, e.g. 'soundproofed partition', 'glass wall', 'shared drywall'."
        selector:
          text:
      clear_boundary_links:
        description: "Clear all boundary_links before writing. Default false."
        selector:
          boolean:
      safety:
        description: "One safety item to add/update. Pass as JSON: {name:string (upsert key), type:fire_extinguisher|first_aid|aed|eyewash|spill_kit|other, location_note:string, rating:string, grocy_location_id:string}. Upserts by name. Extra fields OK."
        selector:
          text:
      clear_safety:
        description: "Clear all safety items before writing. Default false."
        selector:
          boolean:
      room_zone:
        description: "One sub-room spatial zone to add/update. JSON: {name:str (upsert key), bearing:int 0-359, mark:int -90..+90, distance_ft:float, radius_ft:float, type:seating|storage|landmark|hazard|exit_zone|feature}. Extra fields OK."
        selector:
          text:
      clear_room_zones:
        description: "Clear all room_zones before writing. Default false."
        selector:
          boolean:
      landmark:
        description: "One named anchor to add/update. JSON: {name:str (upsert key), bearing:int 0-359, mark:int -90..+90 (0=floor,36=counter,72=eye), distance_ft:float, type:furniture|storage|fixture|hazard|feature|person_anchor, room_zone:str, entity_id:str, grocy_location_id:int (inventory storage loc), description:str}. Extra fields OK."
        selector:
          text:
      clear_landmarks:
        description: "Clear all landmarks before writing. Default false."
        selector:
          boolean:
      name:
        description: "Item name for zone_remove and landmark_remove — the name of the zone or landmark to delete."
        selector:
          text:
      length:
        description: "Room length in unit (ft default). Stored with width+unit; area_calc=length×width computed at write."
        selector:
          number:
            min: 0
            max: 10000
            step: 0.01
            mode: box
      width:
        description: "Room width in unit (ft default). Required when length is provided."
        selector:
          number:
            min: 0
            max: 10000
            step: 0.01
            mode: box
      unit:
        description: "Measurement unit for length/width/area_override. ft (default) or m get full sqft/sqm conversions; any other string stores area_calc only."
        selector:
          text:
      area_override:
        description: "Explicit area in unit — overrides length×width calc. Use for irregular/L-shaped rooms. Requires area_override_reason."
        selector:
          number:
            min: 0
            max: 100000
            step: 0.01
            mode: box
      area_override_reason:
        description: "Required when area_override is provided. Audit trail for why measured area differs from l×w (e.g. 'L-shaped room', 'measured to exterior walls per CPA')."
        selector:
          text:
      home_office_claimed:
        description: "Tag this room as part of a home office claim for business-use % calculation."
        selector:
          boolean:
      spatial_meta:
        description: "Room spatial metadata. JSON: {north_wall_bearing:int, bbox_ft:{x,y}, origin_offset:{x,y}, floor_height_ft:float, floor_number:int}. Merged into existing."
        selector:
          text:
      spatial_config:
        description: "Household north calibration (no area= required). JSON: {north_calibrated:bool, calibration_room:area_id, calibration_bearing:int, coordinate_system:str}. Written to household_profile."
        selector:
          text:
      rally_point:
        description: "Household rally point (no area= required). Written to household_profile drawer. E.g. 'front yard, end of driveway at street'."
        selector:
          text:
      zip_code:
        description: "Household postal ZIP code (no area= required). Written to household_profile drawer."
        selector:
          text:
      address:
        description: "Household street address (no area= required). Full human-readable address. Written to household_profile drawer."
        selector:
          text:
      default_room:
        description: "Default starting room for pathfinding when no person location is known. HA area_id or name. Written to household_profile drawer."
        selector:
          text:
      utility_action:
        description: "Utility CRUD: list (default), get, set, delete. mode=utility required."
        selector:
          select:
            options: [list, get, set, delete]
      utility_type:
        description: "Utility type key (upsert key): water, gas, electric, data, telecom, spa, other."
        selector:
          text:
      utility_name:
        description: "Display name. e.g. 'Main Water Supply'. Written to utility_index drawer."
        selector:
          text:
      service_entry_loc:
        description: "Where the utility enters the structure. NFPA preplan field."
        selector:
          text:
      emerg_cutoff_loc:
        description: "Emergency shutoff location for first responders. NFPA preplan field."
        selector:
          text:
      utility_notes:
        description: "Optional: valve type, special instructions, hazards."
        selector:
          text:
      utility_emerg_phone:
        description: "Emergency contact phone number for this utility provider."
        selector:
          text:
      utility_emerg_email:
        description: "Emergency contact email for this utility provider."
        selector:
          text:
      scenario:
        description: "Emergency scenario for mode=emergency. Shapes guidance.action + advisory. fire|burglar|weather|medical|general (default: general)."
        selector:
          select:
            options: [fire, burglar, weather, medical, general]
      grocy_location_id:
        description: "Grocy location ID for this room. Join key: RM area ↔ Grocy location ↔ containers ↔ products."
        selector:
          text:
      wiki_path:
        description: "WikiJS page path for this room's overview page (e.g. rooms/office). Back-link: area → wiki. Optional."
        selector:
          text:
      exterior:
        description: "Mark area as exterior/outdoor (back yard, deck, porch, etc). Automatically excluded from shelter classification."
        selector:
          boolean:
      parent_area_id:
        description: "Parent area this space belongs to (e.g. closet→bedroom, pantry→kitchen). HA area_id of the containing room."
        selector:
          text:
      shelter_eligible:
        description: "Set false to exclude this room from emergency shelter classification. Overrides structural detection (no exterior portals + no windows = primary)."
        selector:
          boolean:
      dry_run:
        description: "Preview without writing. Default false."
        selector:
          boolean:
      confirm_action:
        description: "Required for mode=setup and area_delete. Omit or false returns preview without executing."
        selector:
          boolean:
      target_expansion_cabinet:
        description: "mode=setup only. Explicit expansion cabinet to claim for the occupancy cabinet (e.g. 'sensor.zenos_expansion_cabinet_4' or bare '4'). Omit to auto-select the first online_unmounted slot. Refused with an error if the target is already mounted, or genuinely non-empty (contains real drawers) — never silently co-opted or overwritten."
        selector:
          text:
      area_name:
        description: "New area display name. Required for area_create (area does not exist yet)."
        selector:
          text:
      area_name_new:
        description: "Rename target for area_update. Updates HA area display name."
        selector:
          text:
      area_note:
        description: "Human description of this space (what it is, feel, use). Compiled into HA area description on area_create/area_update. Stored in RM topology."
        selector:
          text:
      floor_id_new:
        description: "Floor ID slug for area_create or area_update floor reassignment. Use zen_dojotools_ectoplasm mode=help for floor IDs."
        selector:
          text:
      icon:
        description: "MDI icon for area_update. e.g. mdi:home, mdi:bed-outline, mdi:sofa."
        selector:
          text:
      picture:
        description: "Image URL for area_update. /local/ path or full URL. Sets the area picture in HA UI."
        selector:
          text:
      caller_token:
        description: "Opaque audit token echoed in response."
        selector:
          text:
      context_slices:
        description: "Opt-in live context for mode=get. Comma-separated: +topo, +light, +climate, +covers, +media, +inventory (+grocy alias), +chores, +tasks, +conductor, +calendar, +security, +wiki, +tickets, +catalog, +timers, +alarms. +media calls zen_dojotools_media_manager mode=now_playing — returns full playback state, provider, MA search_metadata, and lyrics_hint. +timers lists this room's timer entities (room_timer/checking_timer/nightlight_timer/control_burnout/etc, label-matched) with state/remaining/duration. +alarms lists next-set alarms for Alexa/Echo/tablet/TV devices assigned to this room (via Lens Bus, area_id-matched). Omit for base topology only."
        example: "+topo,+light,+climate"
        selector:
          text:
      include_notices:
        description: "mode=home_overview only. Add notices block: active ZenOS alerts, persistent notifications, HA repairs, recent postman dispatches (1h), pre-built action_queue. Each action_queue entry has {priority, item, tool, call} — fire directly. Default false."
        selector:
          boolean:
      include_presence:
        description: "mode=home_overview only. presence_mode=filtered (default): hps-labeled trackers only. presence_mode=discover: all BPS candidates with hint+suggest to guide hps labeling. Default false."
        selector:
          boolean:
      presence_mode:
        description: "filtered (default): hps-labeled only, lean. discover: all BPS candidates — hint (phone/wearable/tablet/mobile_tag/appliance/unknown) + suggest tells you what to label hps."
        selector:
          select:
            options: [filtered, discover]
      pathfind:
        description: "JSON: {start: area_id|name|person.xxx, destination: area_id|name|person.xxx, max_hops: int (default 20)}. BFS shortest path. start/destination also accept area= and area_b= as fallback."
        selector:
          text:
    mode: queued
    max: 2

    sequence:

      # ── 0. Normalize ─────────────────────────────────────────────────────
      - variables:
          _mode:            "{{ mode | default('help') | lower | trim }}"
          _dry_run:         "{{ dry_run | default(false) | bool }}"
          _caller_token:    "{{ caller_token | default('') }}"
          _area_input:      "{{ area | default('') | trim }}"
          _area_b_input:    "{{ area_b | default('') | trim }}"
          _include_notices:  "{{ include_notices | default(false) | bool }}"
          _include_presence: "{{ include_presence | default(false) | bool }}"
          _pmode:            "{{ presence_mode | default('filtered') | lower | trim }}"

      # ── 0a. Coerce object fields — text: selector → native dict ─────────
      - variables:
          windows: "{{ windows | from_json if windows is defined and windows is string and windows | trim != '' else windows | default(none, true) }}"
          portals: "{{ portals | from_json if portals is defined and portals is string and portals | trim != '' else portals | default(none, true) }}"
          safety: "{{ safety | from_json if safety is defined and safety is string and safety | trim != '' else safety | default(none, true) }}"
          room_zone: "{{ room_zone | from_json if room_zone is defined and room_zone is string and room_zone | trim != '' else room_zone | default(none, true) }}"
          landmark: "{{ landmark | from_json if landmark is defined and landmark is string and landmark | trim != '' else landmark | default(none, true) }}"
          _item_name: "{{ name | default('') | trim }}"
          spatial_meta: "{{ spatial_meta | from_json if spatial_meta is defined and spatial_meta is string and spatial_meta | trim != '' else spatial_meta | default(none, true) }}"
          spatial_config: "{{ spatial_config | from_json if spatial_config is defined and spatial_config is string and spatial_config | trim != '' else spatial_config | default(none, true) }}"
          pathfind: "{{ pathfind | from_json if pathfind is defined and pathfind is string and pathfind | trim != '' else pathfind | default(none, true) }}"

      # ── tool_manifest early-exit ─────────────────────────────────────────
      - if: "{{ _mode == 'tool_manifest' }}"
        then:
        - variables:
            # CAPABILITY STATUS (2026-08-06, Design note: "advanced info return
            # for manifest - this tool has multiple modes in the setup-
            # it can detail setup yes, X enabled T/F?"). Live on/off
            # status for this tool's two independent master shunts,
            # resolved with the exact same chain their own read modes use
            # (label override > cabinet > published default false) — so a
            # manifest consumer gets "is REFLEX actually doing anything
            # right now" without a separate roomstate_enable/reflex_enable
            # call first.
            _tm_roomstate_sw: "{{ label_entities('zenos_roomstate_master_switch') }}"
            _tm_reflex_sw: "{{ label_entities('zenos_reflex_master_switch') }}"
        - variables:
            _tm_roomstate_enabled: >-
              {%- if _tm_roomstate_sw | count > 0 -%}
                {{ (_tm_roomstate_sw | map('states') | select('eq','on') | list | count) > 0 }}
              {%- else -%}
                {%- set _hh = label_entities('Zen Household Cabinet') | select('match', 'sensor\\.') | list | first | default('', true) -%}
                {%- if _hh != '' -%}
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _raw = CABS.cabinet_drawer_value_mounted(_hh, 'roomstate_config') -%}
                  {%- set _cfg = (_raw | from_json) if _raw not in [none, ''] else {} -%}
                  {{ (_cfg.enabled | default(false)) if _cfg is mapping else false }}
                {%- else -%}
                  {{ false }}
                {%- endif -%}
              {%- endif -%}
            _tm_reflex_enabled: >-
              {%- if _tm_reflex_sw | count > 0 -%}
                {{ (_tm_reflex_sw | map('states') | select('eq','on') | list | count) > 0 }}
              {%- else -%}
                {%- set _hh = label_entities('Zen Household Cabinet') | select('match', 'sensor\\.') | list | first | default('', true) -%}
                {%- if _hh != '' -%}
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _raw = CABS.cabinet_drawer_value_mounted(_hh, 'reflex_config') -%}
                  {%- set _cfg = (_raw | from_json) if _raw not in [none, ''] else {} -%}
                  {{ (_cfg.enabled | default(false)) if _cfg is mapping else false }}
                {%- else -%}
                  {{ false }}
                {%- endif -%}
              {%- endif -%}
            capability_status:
              roomstate_v3_enabled: "{{ _tm_roomstate_enabled | trim | lower == 'true' }}"
              roomstate_v3_source: "{{ 'label_switch' if _tm_roomstate_sw | count > 0 else 'cabinet_or_default' }}"
              reflex_enabled: "{{ _tm_reflex_enabled | trim | lower == 'true' }}"
              reflex_source: "{{ 'label_switch' if _tm_reflex_sw | count > 0 else 'cabinet_or_default' }}"
        - variables:
            result: >-
              {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
              {{- MF.tool_manifest(
                tool='zen_dojotools_room_manager',
                display_name='Room Manager',
                tier='dojotools',
                version='5.6.4',
                health={'configured': true, 'status': 'ok', 'notes': []},
                required_labels=['zen_household_cabinet', 'zen_kfc_provider', 'carbon_monoxide', 'moisture', 'privacy_door', 'siren', 'smoke'],
                optional_labels=['room_layout', 'hps', 'hold', 'engaged', 'occupied', 'asleep', 'motion', 'wasp_door', 'bed_occupancy', 'sleep_off_target', 'tv_sleep_target', 'vent_fan', 'window', 'garage_door', 'occupied_timer', 'asleep_timer', 'checking_timer', 'emergency_latch', 'nap_latch', 'asleep_minutes', 'nap_minutes', 'occupied_minutes', 'zenos_roomstate_master_switch', 'zenos_reflex_master_switch', 'scene_vacant', 'scene_occupied', 'scene_engaged', 'scene_asleep', 'scene_checking', 'scene_paused', 'scene_automation', 'scene_cleaning', 'scene_emergency'],
                consumes=['area', 'mode', 'context_slices'],
                returns=['topology', 'context_slices', 'home_overview', 'emergency'],
                failure_policy='hard',
                modes={
                  'get': 'Room snapshot with optional context slices',
                  'set': 'Write topology fields to a room',
                  'list': 'All RM-managed rooms',
                  'zone_set': 'Upsert a sub-room spatial zone',
                  'zone_remove': 'Delete a sub-room spatial zone by name',
                  'zones': 'List sub-room spatial zones',
                  'landmark_set': 'Upsert a named anchor point',
                  'landmark_remove': 'Delete a named anchor by name',
                  'landmarks': 'List named anchor points',
                  'link': 'Add adjacency between two areas',
                  'unlink': 'Remove adjacency',
                  'boundary_link': 'Add a non-passable boundary (shared wall, glass, etc) between two areas',
                  'boundary_unlink': 'Remove a boundary link',
                  'home_overview': 'Whole-house signal + alerts',
                  'emergency': 'Crisis snapshot with egress routing',
                  'utility': 'CRUD for household utility providers (water/gas/electric/etc)',
                  'area_create': 'Create HA area + init topology',
                  'area_update': 'Update HA area metadata',
                  'area_delete': 'Delete area + topology entry',
                  'room_occupant_prefs': 'Guest stay (Twenty) or household occupant (profile_editor) prefs for a room, whichever is active, plus an independent vendor_activity caution flag',
                  'room_status_set': 'Housekeeping state (clean/dirty/in_service/occupied)',
                  'room_status_get': 'Read current housekeeping state',
                  'label_discover': 'Scan area= for v3 room-state label candidates, preview or confirm_action=true to tag. ANTI-PATTERN GUARD: when a room has both a lock and a door candidate for the same opening, group_warnings flags it — tag the DOOR as wasp_door (occupancy signal), never the lock (privacy_door/ext_lock, security-exposure only). See garage/front_hall 2026-08-08 incident.',
                  'roomstate_enable': 'Master on/off for the v3 room-state engine (decay/cascade) — read or write via roomstate_enabled=',
                  'reflex_enable': 'Master on/off for REFLEX scene-firing — read or write via reflex_enabled=, independent of roomstate_enable',
                  'reflex_wire': 'Assist mode for wiring REFLEX scene labels — area=<room> for full per-room SoC (includes tier_status: wired/inherited/ok_by_design/gap — checking/paused/automation left unwired is ok_by_design, not a gap) + reflex_wire_detail=true, omit area= for whole-home rollup (rooms[].ok_by_design vs rooms[].gaps, same distinction), reflex_assignments=[...] + confirm_action=true to write',
                  'setup': 'Deploy RM KFC to dojo',
                  'pathfind': 'Shortest path between two areas or persons',
                  'tool_manifest': 'Return tool identity + live capability_status',
                  'kfc_manifest': 'Return KFC component definitions',
                  'help': 'Full field/concept/REFLEX reference'
                },
                icon='mdi:floor-plan',
                color='teal',
                stripe=3,
                impact='soft',
                mcp_exposed=true,

                caller_token=_caller_token
              ) | from_json | combine({'kfc_manifest': true, 'kfc_components': ['room_manager'], 'capability_status': capability_status}) -}}
        - stop: room_manager tool manifest
          response_variable: result
      - if: "{{ _mode == 'kfc_manifest' }}"
        then:
        - variables:
            _kfc_filter: "{{ component | default('') | string | trim | lower if component is defined else '' }}"
            _kfc_defs:
            - kata_key: room_manager
              friendly_name: Room Manager
              label: room_manager
              component_summary: >-
                Spatial topology and live room context for the household —
                per-room domain state (lights, climate, covers, media),
                floor-grouped whole-house overview, adjacency/pathfinding
                between rooms, and emergency egress routing. Consult for any
                spatial, room-status, or life-safety question.
              component_instructions: >-
                SCOPE: Spatial topology and live room context for the household.
                  Room data: zen_dojotools_room_manager (household cabinet, key: room_topology).
                  Registered rooms have label room_layout on their HA area.

                DATA ACCESS:
                  Primary: zen_dojotools_room_manager mode=home_overview — whole-house snapshot.
                    Returns: registered_room_count, floor_count, floors[]{floor_id, rooms[]{area_id,
                    display_name, context{topo,light,climate,covers,media}}}, domain_summaries,
                    domain_summaries.maintenance{battery_count,alert_count}.
                  Per-room: zen_dojotools_room_manager mode=get area={area_id} with context_slices=+topo,+light,+climate,+covers,+media.
                    Returns: spatial{portals[], windows[], walls, adjacent[], occupants[]}, features[], exits[].
                  Registered rooms: areas with label room_layout. Use inspect mode=area_list to enumerate.

                WHAT TO SURFACE:
                  1. Rooms with active domains — lights on, climate running, media playing, covers open.
                     Lead with what is running: "Kitchen: lights 72%, climate cooling 72°F. Office: lights on."
                  2. Floor-grouped summary when multiple floors are active.
                  3. Maintenance: if battery_count > 0 or alert_count > 0, surface the counts.
                  4. Exterior portals (exit=true) — note if open when mode is away or sleep.
                  5. Egress summary only if safety context (away mode, alarm active, force_summary).

                TRIGGER CONTEXT:
                  ha_start — ambient topology snapshot. Flag any rooms with unexpected active states.
                  home_occupancy_change — re-derive active rooms. Surface context for the arriving or
                    departing person's rooms (cross-reference occupants[] from mode=get).
                  home_mode_updates — re-evaluate room relevance for new mode.
                    away: flag lights or media still running in any room.
                    sleep: flag non-bedroom lights on or covers open.
                    home: ambient context only.
                  force_summary — full home_overview across all floors and all active rooms.

                NAVIGATION:
                  Registered rooms: label room_layout on HA area.
                  Room topology: zen_dojotools_room_manager mode=get area={slug}.
                  Domain routing per room: zen_dojotools_room_manager mode=help → domain_routing.
                  Adjacent rooms for bleed: spatial.adjacent[] in get response.
                  Whole-house snapshot: mode=home_overview (no area= needed).

                OUTPUT FORMAT:
                  Active rooms: lead with floor, then room — one line per room with domain signals.
                  Nominal: "House nominal. N rooms across F floors. Maintenance: X batteries low, Y alerts."
                  Active: "[Floor]: [Room] — [domain signals]. [Room] — ..."
                  Keep per-room lines to one. Reserve detail for on-demand mode=get calls.

                TONE: Spatial and ambient. This is the house map, not the alert surface.
                  Speak like a crew chief walking the building — concise, positional, factual.
              trigger_subscriptions:
              - ha_start
              - home_occupancy_change
              - home_mode_updates
              - force_summary
              drift_threshold: 5
              emission_cooldown_minutes: 30
              delay_seconds: 0
              suggested_act_event: null
              seed: null
              master_switch: ""
              index_call:
                domain_inspect_domains: []
                domain_inspect_limit: 25
                expand_entities: false
                filter_json: {}
                label_1: room_manager
                label_2: ""
                operator: AND
                output_fields: ""
              meta:
                enabled: true
                requires:
                  cert: ""
                  level: 0
        - variables:
            _kfc_out: >-
              {%- if _kfc_filter == '' -%}
                {{ _kfc_defs }}
              {%- else -%}
                {{ _kfc_defs | selectattr('kata_key', 'equalto', _kfc_filter) | list }}
              {%- endif -%}
            result:
              status: ok
              tool: zen_dojotools_room_manager
              version: "5.6.2"
              mode: kfc_manifest
              kfc: "{{ _kfc_out }}"
              count: "{{ _kfc_out | length }}"
              caller_token: "{{ _caller_token }}"
        - stop: kfc_manifest
          response_variable: result

      # ── 0b. Household cabinet entity ────────────────────────────────────────
      - variables:
          _hh_cabinet: >-
            {{ label_entities('Zen Household Cabinet')
               | select('match', 'sensor\\.') | list | first | default('') }}

      # ── 0b. Area A resolution ────────────────────────────────────────────
      - variables:
          _area_id: >-
            {%- if _area_input == '' -%}{{ '' }}{%- else -%}
              {%- set d = area_id(_area_input) | default('', true) -%}
              {%- set t = area_id(_area_input | title) | default('', true) -%}
              {{ d if d else (t if t else _area_input | lower | replace(' ', '_')) }}
            {%- endif -%}
          _area_name: >-
            {{ area_name(_area_id) | default('', true) if _area_input != '' else '' }}

      # ── 0d. Area B resolution (link / unlink only) ───────────────────────
      - variables:
          _area_b_id: >-
            {%- if _area_b_input == '' or _mode not in ['link','unlink','boundary_link','boundary_unlink'] -%}{{ '' }}{%- else -%}
              {%- set d = area_id(_area_b_input) | default('', true) -%}
              {%- set t = area_id(_area_b_input | title) | default('', true) -%}
              {{ d if d else (t if t else _area_b_input | lower | replace(' ', '_')) }}
            {%- endif -%}
          _area_b_name: >-
            {{ area_name(_area_b_id) | default('', true) if _area_b_input != '' else '' }}

      # ═══════════════════════════════════════════════════════════════════════
      # 1. LIST
      # ═══════════════════════════════════════════════════════════════════════
      - if: "{{ _mode == 'list' }}"
        then:
          - variables:
              _result:
                status: ok
                mode: list
                defined_count: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}{%- set topo = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'room_topology') | from_json -%}
                  {{ topo | length }}
                rooms: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}{%- set topo = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'room_topology') | from_json -%}
                  {%- set ns=namespace(rooms=[]) -%}
                  {%- for aid,data in topo.items() -%}
                    {%- set d=data if data is mapping else {} -%}
                    {%- set al=(labels(aid) or [])|list -%}
                    {%- set e={'area_id':aid,'display_name':area_name(aid)|default(d.get('display_name',aid),true),'floor_id':floor_id(area_name(aid))|default(none,true),'walls':d.get('walls',none),'adjacent_count':d.get('adjacent',[])|length,'portal_count':d.get('portals',[])|length,'window_count':d.get('windows',[])|length,'rm_managed':'room_manager' in al,'layout_labeled':'room_layout' in al} -%}
                    {%- set ns.rooms=ns.rooms+[e] -%}
                  {%- endfor -%}
                  {{ ns.rooms }}
                caller_token: "{{ _caller_token }}"
          - stop: list
            response_variable: _result

      # ═══════════════════════════════════════════════════════════════════════
      # 2. GET
      # ═══════════════════════════════════════════════════════════════════════
      - if: "{{ _mode == 'get' }}"
        then:
          - if: "{{ _area_id == '' }}"
            then:
              - variables:
                  _result: {status: error, mode: get, message: "area= required.", caller_token: "{{ _caller_token }}"}
              - stop: get error
                response_variable: _result
          - variables:
              _area_exists: >-
                {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}{%- set topo = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'room_topology') | from_json -%}
                {%- set in_topo = (topo is mapping) and (_area_id in topo) -%}
                {%- set in_ha = (area_entities(_area_id) | list | length) > 0 -%}
                {{ in_topo or in_ha }}
          - if: "{{ not _area_exists }}"
            then:
              - variables:
                  _result:
                    status: error
                    mode: get
                    area_id: "{{ _area_id }}"
                    message: "Area '{{ _area_id }}' not found in HA and has no room topology. Use mode=list to see registered rooms, or mode=set area={{ _area_id }} to register it."
                    caller_token: "{{ _caller_token }}"
              - stop: get area not found
                response_variable: _result
          - variables:
              _get_labels:    "{{ (labels(_area_id) or []) | list }}"
              _get_floor:     "{{ floor_id(area_name(_area_id)) | default(none, true) }}"
              _get_ent_count: "{{ area_entities(_area_id) | list | length }}"
              _get_dev_count: "{{ area_devices(_area_id) | list | length }}"
              _get_spatial: >-
                {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}{%- set topo = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'room_topology') | from_json -%}
                {{ topo.get(_area_id, none) }}
              _get_features: >-
                {%- set _area_ents=area_entities(_area_id)|list -%}
                {%- set _feat_ents=label_entities('room_feature')|select('in',_area_ents)|list -%}
                {%- set _strip=['room_feature','appliance','alerts','alert_manager','alert_when_on','alert_when_off','alert_when_not_off','critical','information','insight'] -%}
                {%- set ns=namespace(f=[]) -%}
                {%- for eid in _feat_ents -%}
                  {%- set _el=(labels(eid) or [])|list -%}
                  {%- set ns_n=namespace(n=[]) -%}
                  {%- for lbl in _el -%}
                    {%- if lbl not in _strip and lbl != _area_id -%}{%- set ns_n.n=ns_n.n+[lbl] -%}{%- endif -%}
                  {%- endfor -%}
                  {%- set ns.f=ns.f+[{'entity':eid,'state':states(eid),'domain':eid.split('.')[0],'feature_labels':ns_n.n}] -%}
                {%- endfor -%}
                {{ ns.f }}
          - variables:
              _get_exits: >-
                {%- set _sp=_get_spatial if _get_spatial is mapping else {} -%}
                {%- set _rk={'primary':0,'secondary':1,'tertiary':2,'bail_out':3} -%}
                {%- set ns=namespace(e=[]) -%}
                {%- for p in (_sp.get('portals',[])|list) -%}
                  {%- if p is mapping and (p.get('exit',false) or p.get('emerg_exit',false)) -%}
                    {%- set _pri=p.get('exit_priority','') -%}
                    {%- set _sk=_rk.get(_pri,9)*2+(0 if p.get('emerg_exit',false) else 1) -%}
                    {%- set ns.e=ns.e+[{'_k':_sk,'source':'portal','to':p.get('to',none),'type':p.get('type',''),'exit_priority':_pri,'exit':p.get('exit',false),'emerg_exit':p.get('emerg_exit',false),'normally':p.get('normally',''),'note':p.get('note','')}] -%}
                  {%- endif -%}
                {%- endfor -%}
                {%- for w in (_sp.get('windows',[])|list) -%}
                  {%- if w is mapping and (w.get('exit',false) or w.get('emerg_exit',false)) -%}
                    {%- set _pri=w.get('exit_priority','') -%}
                    {%- set _sk=_rk.get(_pri,9)*2+(0 if w.get('emerg_exit',false) else 1) -%}
                    {%- set ns.e=ns.e+[{'_k':_sk,'source':'window','direction':w.get('direction',''),'count':w.get('count',1),'exit_priority':_pri,'exit':w.get('exit',false),'emerg_exit':w.get('emerg_exit',false),'drop_ft':w.get('drop_ft',none),'note':w.get('note','')}] -%}
                  {%- endif -%}
                {%- endfor -%}
                {%- set _sorted=ns.e|sort(attribute='_k') -%}
                {%- set ns2=namespace(r=[]) -%}
                {%- for item in _sorted -%}
                  {%- set ns3=namespace(d={}) -%}
                  {%- for k,v in item.items() -%}
                    {%- if k != '_k' -%}{%- set ns3.d=ns3.d|combine({k:v}) -%}{%- endif -%}
                  {%- endfor -%}
                  {%- set ns2.r=ns2.r+[ns3.d] -%}
                {%- endfor -%}
                {{ ns2.r }}
          - variables:
              _get_spatial: >-
                {%- set _sp = _get_spatial if _get_spatial is mapping else {} -%}
                {%- set _raw_portals = _sp.get('portals', []) | list -%}
                {%- set ns = namespace(pp=[]) -%}
                {%- for p in _raw_portals -%}
                  {%- if p is mapping -%}
                    {%- set _to = p.get('to', none) -%}
                    {%- set ns.pp = ns.pp + [p | combine({
                      'from_room': _area_id,
                      'to_room': _to,
                      'view_from_room_position': 'standing in ' ~ _area_id ~ (' looking toward ' ~ _to if _to else ' — exterior')
                    })] -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ _sp | combine({'portals': ns.pp}) if _sp else none }}
          - variables:
              _spa_in_area: >-
                {{ label_entities('spa_climate')
                   | select('in', area_entities(_area_id) | list) | list | length > 0 }}

          # ── context_slices: flag parse ────────────────────────────────────
          - variables:
              _cs:          "{{ context_slices | default('') }}"
              _show_topo:   "{{ '+topo'    in (context_slices | default('')) }}"
              _show_light:  "{{ '+light'   in (context_slices | default('')) }}"
              _show_clim:   "{{ '+climate' in (context_slices | default('')) }}"
              _show_covers: "{{ '+covers'  in (context_slices | default('')) }}"
              _show_media:  "{{ '+media'   in (context_slices | default('')) }}"
              _show_timers: "{{ '+timers'  in (context_slices | default('')) }}"
              _show_alarms: "{{ '+alarms'  in (context_slices | default('')) }}"
              _alarms_ctx:      "{{ none }}"
              _show_grocy:  "{{ '+grocy' in (context_slices | default('')) or '+inventory' in (context_slices | default('')) }}"
              _grocy_ctx:   "{{ none }}"
              _show_chores:     "{{ '+chores'    in (context_slices | default('')) }}"
              _chores_ctx:      "{{ none }}"
              _show_tasks:      "{{ '+tasks'     in (context_slices | default('')) }}"
              _tasks_ctx:       "{{ none }}"
              _show_conductor:  "{{ '+conductor' in (context_slices | default('')) }}"
              _conductor_ctx:   "{{ none }}"
              _show_calendar:   "{{ '+calendar'  in (context_slices | default('')) }}"
              _calendar_ctx:    "{{ none }}"
              _show_security:   "{{ '+security'  in (context_slices | default('')) }}"
              _security_ctx:    "{{ none }}"
              _show_wiki:       "{{ '+wiki'      in (context_slices | default('')) }}"
              _wiki_ctx:        "{{ none }}"
              _show_tickets:    "{{ '+tickets'   in (context_slices | default('')) }}"
              _tickets_ctx:     "{{ none }}"
              _show_catalog:    "{{ '+catalog'   in (context_slices | default('')) }}"
              _catalog_ctx:     "{{ none }}"

          # ── context_slices: inline state reads ───────────────────────────
          - variables:
              _topo_ctx: >-
                {%- if _show_topo -%}
                  {%- set _bs = area_entities(_area_id) | select('match', 'binary_sensor\\.') | list -%}
                  {%- set ns = namespace(open=[]) -%}
                  {%- for eid in _bs -%}
                    {%- if states(eid) == 'on' -%}{%- set ns.open = ns.open + [eid] -%}{%- endif -%}
                  {%- endfor -%}
                  {{ {"open_count": ns.open | count, "total_count": _bs | count, "open": ns.open} }}
                {%- else -%}{{ none }}{%- endif -%}
              _light_ctx: >-
                {%- if _show_light -%}
                  {%- set _lights = area_entities(_area_id) | select('match', 'light\\.') | list -%}
                  {%- set ns = namespace(on=[], bvals=[]) -%}
                  {%- for eid in _lights -%}
                    {%- if states(eid) == 'on' -%}
                      {%- set ns.on = ns.on + [eid] -%}
                      {%- set _b = state_attr(eid, 'brightness') -%}
                      {%- if _b is number -%}{%- set ns.bvals = ns.bvals + [_b] -%}{%- endif -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {%- set _avg = (ns.bvals | sum / (ns.bvals | count) / 255 * 100) | round(0) if ns.bvals else 0 -%}
                  {{ {"lights_total": _lights | count, "lights_on": ns.on, "avg_brightness_pct": _avg} }}
                {%- else -%}{{ none }}{%- endif -%}
              _clim_ctx: >-
                {%- if _show_clim -%}
                  {%- set _climates = area_entities(_area_id) | select('match', 'climate\\.') | list -%}
                  {%- set _first = _climates | first | default('') -%}
                  {%- if _first -%}
                    {{ {"entity_id": _first, "hvac_mode": states(_first), "setpoint": state_attr(_first, 'temperature'), "current_temp": state_attr(_first, 'current_temperature')} }}
                  {%- else -%}{{ none }}{%- endif -%}
                {%- else -%}{{ none }}{%- endif -%}
              _covers_ctx: >-
                {%- if _show_covers -%}
                  {%- set _covers = area_entities(_area_id) | select('match', 'cover\\.') | list -%}
                  {%- set ns = namespace(open=[], pos=[]) -%}
                  {%- for eid in _covers -%}
                    {%- if states(eid) == 'open' and 'hvac_vent' not in labels(eid) -%}{%- set ns.open = ns.open + [eid] -%}{%- endif -%}
                    {%- set _p = state_attr(eid, 'current_position') -%}
                    {%- if _p is number -%}{%- set ns.pos = ns.pos + [_p] -%}{%- endif -%}
                  {%- endfor -%}
                  {%- set _avg = (ns.pos | sum / (ns.pos | count)) | round(0) if ns.pos else none -%}
                  {{ {"covers": _covers, "open": ns.open, "avg_position": _avg} }}
                {%- else -%}{{ none }}{%- endif -%}
              _media_ctx: "{{ none }}"
              _timers_ctx: >-
                {%- if _show_timers -%}
                  {%- set _purpose_labels = ['room_timer', 'checking_timer', 'nightlight_timer', 'occupied_timer', 'asleep_timer', 'sleep_timer', 'control_burnout'] -%}
                  {%- set ns = namespace(list=[]) -%}
                  {%- for e in states.timer -%}
                    {%- if _area_id in labels(e.entity_id) -%}
                      {%- set _purpose = (_purpose_labels | select('in', labels(e.entity_id)) | list | first) | default('', true) -%}
                      {%- set ns.list = ns.list + [{
                        'entity_id': e.entity_id,
                        'purpose': _purpose,
                        'state': e.state,
                        'remaining': e.attributes.get('remaining'),
                        'duration': e.attributes.get('duration')
                      }] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ {"timers": ns.list, "active_count": (ns.list | selectattr('state', 'equalto', 'active') | list | count)} }}
                {%- else -%}{{ none }}{%- endif -%}
              _security_ctx: >-
                {%- if not _show_security -%}{{ none }}{%- else -%}
                {%- set _cams=label_entities('security_camera')|select('in',area_entities(_area_id)|list)|list -%}
                {%- set pns=namespace(eid='') -%}
                {%- for e in label_entities('alarm_panel') -%}
                  {%- if pns.eid=='' and e.startswith('alarm_control_panel.') -%}
                    {%- set pns.eid=e -%}
                  {%- endif -%}
                {%- endfor -%}
                {%- if pns.eid=='' -%}
                  {{ {'available': false, 'cameras': _cams} }}
                {%- else -%}
                  {%- set _pdid=device_id(pns.eid) -%}
                  {%- set _zdc=['door','window','motion','opening','vibration','gas','heat','smoke','moisture','presence'] -%}
                  {%- set zns=namespace(zones=[]) -%}
                  {%- for eid in area_entities(_area_id) -%}
                    {%- if eid.startswith('binary_sensor.') and not eid.endswith('_fault') -%}
                      {%- if device_id(eid)==_pdid -%}
                        {%- set _dc=state_attr(eid,'device_class')|default('',true) -%}
                        {%- set _s=states(eid) -%}
                        {%- set _base=eid.split('.')[1] -%}
                        {%- set _fe='binary_sensor.'~_base~'_fault' -%}
                        {%- set _be='switch.'~_base~'_bypass' -%}
                        {%- set zns.zones=zns.zones+[{'entity_id':eid,'name':state_attr(eid,'friendly_name')|default(_base|replace('_',' ')|title,true),'type':_dc,'state':_s,'open':_s=='on','fault':states(_fe)=='on' if states(_fe) not in ['unknown','unavailable'] else false,'bypassed':states(_be)=='on' if states(_be) not in ['unknown','unavailable'] else false}] -%}
                      {%- endif -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ {'available': true, 'panel': pns.eid, 'zone_count': zns.zones|count, 'open_count': zns.zones|selectattr('open')|list|count, 'zones': zns.zones, 'cameras': _cams} }}
                {%- endif -%}
                {%- endif -%}

          # ── context_slices: grocy inventory (action call, non-blocking) ──────
          - choose:
            - conditions:
              - condition: template
                value_template: >-
                  {{ _show_grocy
                     and states('script.zen_dojotools_inventory') not in ['unavailable', 'unknown'] }}
              sequence:
              - action: script.zen_dojotools_inventory
                response_variable: _grocy_raw
                continue_on_error: true
                data:
                  mode: object_lens
                  homeassistant_area_id: "{{ _area_id }}"
                  expand: true
                  per_page: 5
              - variables:
                  _grocy_ctx: >-
                    {%- if _grocy_raw is defined and _grocy_raw is mapping
                           and _grocy_raw.get('lens') is mapping -%}
                      {{ _grocy_raw }}
                    {%- else -%}{{ none }}{%- endif -%}

          # ── context_slices: chores by area (action call, non-blocking) ─────
          - choose:
            - conditions:
              - condition: template
                value_template: >-
                  {{ _show_chores
                     and states('script.zen_dojotools_inventory') not in ['unavailable', 'unknown'] }}
              sequence:
              - action: script.zen_dojotools_inventory
                response_variable: _chores_raw
                continue_on_error: true
                data:
                  mode: chores_by_area
                  homeassistant_area_id: "{{ _area_id }}"
              - variables:
                  _chores_ctx: >-
                    {%- if _chores_raw is defined and _chores_raw is mapping
                           and _chores_raw.get('status') == 'success' -%}
                      {%- set ns = namespace(chores=[]) -%}
                      {%- for c in _chores_raw.get('chores', []) -%}
                        {%- set _c_pid = c.get('product_id') -%}
                        {%- set _c_locs = c.get('area_location_ids', []) -%}
                        {%- set _c_disc = c.get('discovery', '') -%}
                        {%- if _c_pid is none -%}
                          {%- set _c_prov = 'asset' -%}
                        {%- elif _c_locs | length > 0 -%}
                          {%- set _c_prov = 'asset' -%}
                        {%- elif _c_disc == 'tagged' -%}
                          {%- set _c_prov = 'destination' -%}
                        {%- else -%}
                          {%- set _c_prov = 'unrelated_bleed' -%}
                        {%- endif -%}
                        {%- if _c_pid is not none -%}
                          {%- set ns.chores = ns.chores + [c | combine({
                            'provenance': _c_prov,
                            'replace_action': {
                              'step_1': {'tool': 'zen_dojotools_inventory', 'mode': 'chores_execute', 'chore_id': c.chore_id},
                              'step_2': {'tool': 'zen_dojotools_inventory', 'mode': 'stock_open_item', 'product_id': c.product_id},
                              'note': 'step_1 burns installed unit from slot; step_2 moves next spare to slot and stamps due date'
                            }
                          })] -%}
                        {%- else -%}
                          {%- set ns.chores = ns.chores + [c | combine({'provenance': _c_prov})] -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {{ _chores_raw | combine({'chores': ns.chores, 'chore_actions': {
                        'execute': {'tool': 'zen_dojotools_inventory', 'mode': 'chores_execute', 'item': '<chore name>'},
                        'edit':    {'tool': 'zen_dojotools_inventory', 'mode': 'chores_edit',    'item': '<chore name>'},
                        'add':     {'tool': 'zen_dojotools_inventory', 'mode': 'chores_add',     'item': '<chore name>', 'period_days': 7}
                      }}) }}
                    {%- else -%}{{ none }}{%- endif -%}

          # ── context_slices: tasks by area (HA todo entities, label-tagged) ───
          - choose:
            - conditions:
              - condition: template
                value_template: "{{ _show_tasks }}"
              sequence:
              - variables:
                  _task_lists: >-
                    {%- set ns = namespace(lists=[]) -%}
                    {%- for lid in labels(_area_id) -%}
                      {%- set ns.lists = ns.lists + (label_entities(label_name(lid)) | select('match', '^todo\\.') | list) -%}
                    {%- endfor -%}
                    {{ ns.lists | unique | list }}
              - variables:
                  _tasks_agg: "{{ [] }}"
              - repeat:
                  for_each: "{{ _task_lists }}"
                  sequence:
                  - action: todo.get_items
                    target:
                      entity_id: "{{ repeat.item }}"
                    response_variable: _t_raw
                    continue_on_error: true
                  - variables:
                      _tasks_agg: >-
                        {%- set _lid = repeat.item -%}
                        {%- set _fname = state_attr(_lid, 'friendly_name') | default(_lid, true) -%}
                        {{ _tasks_agg + [{
                          'list': _lid,
                          'friendly_name': _fname,
                          'items': _t_raw.get(_lid, {}).get('items', []),
                          'task_actions': {
                            'complete': {'tool': 'zen_dojotools_todo', 'action_type': 'update', 'list_name': _fname, 'items': ['<task summary>'], 'status': 'completed'},
                            'edit':     {'tool': 'zen_dojotools_todo', 'action_type': 'update', 'list_name': _fname, 'items': ['<task summary>']},
                            'add':      {'tool': 'zen_dojotools_todo', 'action_type': 'create', 'list_name': _fname, 'items': ['<task summary>']}
                          }
                        }] }}
              - variables:
                  _tasks_ctx: >-
                    {%- if _tasks_agg | length > 0 -%}
                      {{ {'lists': _tasks_agg,
                           'total_lists': _tasks_agg | length,
                           'total_items': _tasks_agg | map(attribute='items') | sum(start=[]) | length} }}
                    {%- else -%}{{ none }}{%- endif -%}

          # ── context_slices: conductor list (label: schedule) ───────
          - choose:
            - conditions:
              - condition: template
                value_template: "{{ _show_conductor }}"
              sequence:
              - variables:
                  _cond_lists: >-
                    {{ label_entities('schedule')
                       | select('match', '^todo\\.')
                       | list }}
              - variables:
                  _cond_agg: "{{ [] }}"
              - repeat:
                  for_each: "{{ _cond_lists }}"
                  sequence:
                  - action: todo.get_items
                    target:
                      entity_id: "{{ repeat.item }}"
                    response_variable: _c_raw
                    continue_on_error: true
                  - variables:
                      _cond_agg: >-
                        {{ _cond_agg + [{
                          'list': repeat.item,
                          'friendly_name': state_attr(repeat.item, 'friendly_name') | default(repeat.item, true),
                          'items': _c_raw.get(repeat.item, {}).get('items', [])
                        }] }}
              - variables:
                  _conductor_ctx: >-
                    {%- if _cond_agg | length > 0 -%}
                      {{ {'lists': _cond_agg,
                           'total_lists': _cond_agg | length,
                           'total_items': _cond_agg | map(attribute='items') | sum(start=[]) | length} }}
                    {%- else -%}{{ none }}{%- endif -%}

          # ── context_slices: calendar by area (label-tagged calendar entities) ───
          - choose:
            - conditions:
              - condition: template
                value_template: "{{ _show_calendar }}"
              sequence:
              - variables:
                  _cal_entities: >-
                    {%- set ns = namespace(cals=[]) -%}
                    {%- for lid in labels(_area_id) -%}
                      {%- set ns.cals = ns.cals + (label_entities(label_name(lid)) | select('match', '^calendar\\.') | list) -%}
                    {%- endfor -%}
                    {{ ns.cals | unique | list }}
              - variables:
                  _cal_agg: "{{ [] }}"
              - repeat:
                  for_each: "{{ _cal_entities }}"
                  sequence:
                  - action: calendar.get_events
                    target:
                      entity_id: "{{ repeat.item }}"
                    data:
                      start_date_time: "{{ now().isoformat() }}"
                      end_date_time: "{{ (now() + timedelta(days=7)).isoformat() }}"
                    response_variable: _ev_raw
                    continue_on_error: true
                  - variables:
                      _cal_agg: >-
                        {{ _cal_agg + [{
                          'calendar': repeat.item,
                          'friendly_name': state_attr(repeat.item, 'friendly_name') | default(repeat.item, true),
                          'events': _ev_raw.get(repeat.item, {}).get('events', [])
                        }] }}
              - variables:
                  _calendar_ctx: >-
                    {%- if _cal_agg | length > 0 -%}
                      {{ {'calendars': _cal_agg,
                           'total_calendars': _cal_agg | length,
                           'total_events': _cal_agg | map(attribute='events') | sum(start=[]) | length,
                           'window_days': 7} }}
                    {%- else -%}{{ none }}{%- endif -%}

          # ── context_slices: now_playing via MM lens (non-blocking) ─────────────
          - choose:
            - conditions:
              - condition: template
                value_template: >-
                  {{ _show_media
                     and states('script.zen_dojotools_media_manager') not in ['unavailable', 'unknown'] }}
              sequence:
              - action: script.zen_dojotools_media_manager
                response_variable: _media_raw
                continue_on_error: true
                data:
                  mode: now_playing
                  room: "{{ _area_id }}"
                  caller_token: "{{ _caller_token }}"
              - variables:
                  _media_ctx: >-
                    {%- if _media_raw is defined and _media_raw is mapping
                           and _media_raw.get('status') == 'ok' -%}
                      {{ _media_raw }}
                    {%- else -%}{{ {'status': 'idle', 'room': _area_id} }}{%- endif -%}

          # ── context_slices: wiki pages by area (lens_dispatch, non-blocking) ──
          - choose:
            - conditions:
              - condition: template
                value_template: >-
                  {{ _show_wiki
                     and states('script.zen_dojotools_lens_dispatch') not in ['unavailable', 'unknown'] }}
              sequence:
              - action: script.zen_dojotools_lens_dispatch
                response_variable: _wiki_raw
                continue_on_error: true
                data:
                  anchors_json: "{{ [{'type': 'area_id', 'id': _area_id}] | tojson }}"
                  consumer: room_manager
                  caller_token: "{{ _caller_token }}"
              - variables:
                  _wiki_ctx: >-
                    {%- if _wiki_raw is defined and _wiki_raw is mapping
                           and _wiki_raw.get('status') == 'success' -%}
                      {#- FIX 2026-08-06: lens_dispatch's evidence field is a flat
                          merge across EVERY provider that consumes area_id for
                          this anchor, not scoped to wiki_js — was silently
                          returning battery/media/autovac evidence under 'pages'
                          too. wiki_js's own evidence items carry a top-level
                          'provider': 'wiki_js' key (no 'type' field), so filter
                          on that. -#}
                      {%- set _ev = _wiki_raw.get('evidence', []) | selectattr('provider', 'equalto', 'wiki_js') | list -%}
                      {{ {'pages': _ev, 'count': _ev | length, 'anchor': _area_id} }}
                    {%- else -%}{{ none }}{%- endif -%}

          # ── context_slices: open repair tickets by area (lens_dispatch, non-blocking) ──
          - choose:
            - conditions:
              - condition: template
                value_template: >-
                  {{ _show_tickets
                     and states('script.zen_dojotools_lens_dispatch') not in ['unavailable', 'unknown'] }}
              sequence:
              - action: script.zen_dojotools_lens_dispatch
                response_variable: _tickets_raw
                continue_on_error: true
                data:
                  anchors_json: "{{ [{'type': 'area_id', 'id': _area_id}] | tojson }}"
                  provider: zen_stack_radar
                  consumer: room_manager
                  caller_token: "{{ _caller_token }}"
              - variables:
                  _tickets_ctx: >-
                    {%- if _tickets_raw is defined and _tickets_raw is mapping
                           and _tickets_raw.get('status') == 'success' -%}
                      {#- FIX 2026-08-06: lens_dispatch's evidence field is a
                          flat merge across EVERY provider that consumes
                          area_id, not scoped to tickets — was silently
                          returning battery/media/autovac evidence under
                          'tickets' too. The 'provider: zen_stack_radar' key
                          passed into the lens_dispatch call above is NOT a
                          real field on that script (it has no per-provider
                          filter input) and was always silently ignored — so
                          this always came back unfiltered. Filtering here
                          instead. NOTE: zen_stack_radar is not currently a
                          registered Lens Bus provider at all (no
                          register_mode declared, confirmed via
                          bootstrap_stacks) — this will correctly return
                          count:0 until that's wired up, which is honest,
                          not a regression. -#}
                      {%- set _ev = _tickets_raw.get('evidence', []) | selectattr('provider', 'equalto', 'zen_stack_radar') | list -%}
                      {{ {'tickets': _ev, 'count': _ev | length, 'anchor': _area_id} }}
                    {%- else -%}{{ none }}{%- endif -%}

          # ── context_slices: catalog items shelved in this area (lens_dispatch, non-blocking) ──
          - choose:
            - conditions:
              - condition: template
                value_template: >-
                  {{ _show_catalog
                     and states('script.zen_dojotools_lens_dispatch') not in ['unavailable', 'unknown'] }}
              sequence:
              - action: script.zen_dojotools_lens_dispatch
                response_variable: _catalog_raw
                continue_on_error: true
                data:
                  anchors_json: "{{ [{'type': 'area_id', 'id': _area_id}] | tojson }}"
                  consumer: room_manager
                  caller_token: "{{ _caller_token }}"
              - variables:
                  _catalog_ctx: >-
                    {%- if _catalog_raw is defined and _catalog_raw is mapping
                           and _catalog_raw.get('status') == 'success' -%}
                      {#- FIX 2026-08-06: lens_dispatch's evidence field is a
                          flat merge across EVERY provider that consumes
                          area_id, not scoped to library_catalog — was
                          silently returning battery/media/autovac evidence
                          under 'items' too. library_catalog's own evidence
                          items carry a top-level 'leaf_type': 'item_evidence'
                          key (no top-level 'provider' — that's nested under
                          stack.provider instead), so filter on leaf_type. -#}
                      {%- set _ev = _catalog_raw.get('evidence', []) | selectattr('leaf_type', 'equalto', 'item_evidence') | list -%}
                      {{ {'items': _ev, 'count': _ev | length, 'anchor': _area_id,
                          'hint': 'Items shelved in this area. loan/return via zen_dojotools_library section=catalog.'} }}
                    {%- else -%}{{ none }}{%- endif -%}

          # ── context_slices: next-set alarms for devices in this area (lens_dispatch, non-blocking) ──
          - choose:
            - conditions:
              - condition: template
                value_template: >-
                  {{ _show_alarms
                     and states('script.zen_dojotools_lens_dispatch') not in ['unavailable', 'unknown'] }}
              sequence:
              - action: script.zen_dojotools_lens_dispatch
                response_variable: _alarms_raw
                continue_on_error: true
                data:
                  anchors_json: "{{ [{'type': 'area_id', 'id': _area_id}] | tojson }}"
                  consumer: room_manager
                  caller_token: "{{ _caller_token }}"
              - variables:
                  _alarms_ctx: >-
                    {%- if _alarms_raw is defined and _alarms_raw is mapping
                           and _alarms_raw.get('status') == 'success' -%}
                      {%- set _ev = _alarms_raw.get('evidence', []) | selectattr('type', 'equalto', 'alarm_evidence') | list -%}
                      {{ {'alarms': _ev, 'count': _ev | length, 'anchor': _area_id,
                          'hint': 'Next-set alarm for every Alexa/Echo/tablet/TV device assigned to this room. Personal phones/watches have no area and never appear here — see zen_dojotools_timekeeper mode=alarms for the full house-wide list.'} }}
                    {%- else -%}{{ none }}{%- endif -%}

          # ── context_slices: assemble non-null slices into context dict ────
          - variables:
              _context_block: >-
                {%- set b = {} -%}
                {%- if _topo_ctx   is not none -%}{%- set b = b | combine({'topo':    _topo_ctx})   -%}{%- endif -%}
                {%- if _light_ctx  is not none -%}{%- set b = b | combine({'light':   _light_ctx})  -%}{%- endif -%}
                {%- if _clim_ctx   is not none -%}{%- set b = b | combine({'climate': _clim_ctx})   -%}{%- endif -%}
                {%- if _covers_ctx is not none -%}{%- set b = b | combine({'covers':  _covers_ctx}) -%}{%- endif -%}
                {%- if _media_ctx  is not none -%}{%- set b = b | combine({'media':   _media_ctx})  -%}{%- endif -%}
                {%- if _timers_ctx is not none -%}{%- set b = b | combine({'timers':  _timers_ctx}) -%}{%- endif -%}
                {%- if _alarms_ctx is not none -%}{%- set b = b | combine({'alarms':  _alarms_ctx}) -%}{%- endif -%}
                {%- if _grocy_ctx     is not none -%}{%- set b = b | combine({'inventory':  _grocy_ctx})     -%}{%- endif -%}
                {%- if _chores_ctx   is not none -%}{%- set b = b | combine({'chores':     _chores_ctx})   -%}{%- endif -%}
                {%- if _tasks_ctx     is not none -%}{%- set b = b | combine({'tasks':      _tasks_ctx})     -%}{%- endif -%}
                {%- if _conductor_ctx is not none -%}{%- set b = b | combine({'conductor':  _conductor_ctx}) -%}{%- endif -%}
                {%- if _calendar_ctx  is not none -%}{%- set b = b | combine({'calendar':   _calendar_ctx})  -%}{%- endif -%}
                {%- if _security_ctx  is not none -%}{%- set b = b | combine({'security':   _security_ctx})  -%}{%- endif -%}
                {%- if _wiki_ctx      is not none -%}{%- set b = b | combine({'wiki':       _wiki_ctx})      -%}{%- endif -%}
                {%- if _tickets_ctx   is not none -%}{%- set b = b | combine({'tickets':    _tickets_ctx})   -%}{%- endif -%}
                {%- if _catalog_ctx   is not none -%}{%- set b = b | combine({'catalog':    _catalog_ctx})   -%}{%- endif -%}
                {{ b }}

          - variables:
              _dr_task_count: >-
                {%- set ns=namespace(lists=[]) -%}
                {%- for lid in labels(_area_id) -%}{%- set ns.lists=ns.lists+(label_entities(label_name(lid))|select('match','^todo\\.')|list) -%}{%- endfor -%}
                {{ ns.lists|unique|list|count }}
              _dr_cal_count: >-
                {%- set ns=namespace(cals=[]) -%}
                {%- for lid in labels(_area_id) -%}{%- set ns.cals=ns.cals+(label_entities(label_name(lid))|select('match','^calendar\\.')|list) -%}{%- endfor -%}
                {{ ns.cals|unique|list|count }}
          - variables:
              _get_autovac: >-
                {%- set _av_raw = (state_attr(_hh_cabinet, 'variables') | default({}, true)).get('autovac', none) -%}
                {%- if _av_raw is none -%}{{ none }}
                {%- else -%}
                  {%- set _av_raw = _av_raw if _av_raw is mapping else (_av_raw | from_json if _av_raw is string else {}) -%}
                  {%- set _avc = _av_raw.get('value', _av_raw) -%}
                  {%- set _avc = _avc if _avc is mapping else (_avc | from_json(none) if _avc is string else _avc) -%}
                  {%- set _avc = _avc if _avc is mapping else (_avc | from_json(none) if _avc is string else {}) -%}
                  {%- set _rooms = _avc.get('rooms', {}) if _avc is mapping else {} -%}
                  {%- set room = _rooms.get(_area_id, none) -%}
                  {%- if room is none -%}{{ none }}
                  {%- else -%}
                    {%- set enabled = room.get('enabled', false) -%}
                    {%- set last = room.get('last_cleaned', '') -%}
                    {%- set days_since = ((now().timestamp() - as_timestamp(last ~ 'T00:00:00', 0)) / 86400) | int(0) -%}
                    {%- set db = room.get('days_between', 7) -%}
                    {%- set due = days_since >= db -%}
                    {%- set queued = room.get('queued', false) -%}
                    {%- set skip_next = room.get('skip_next', false) -%}
                    {%- set require_confirmation = room.get('require_confirmation', false) -%}
                    {%- set ready = room.get('ready_to_clean', false) -%}
                    {%- set ready_pass = (not require_confirmation) or ready -%}
                    {%- set can_schedule = (not skip_next) and ready_pass -%}
                    {%- set elected = enabled and can_schedule and (due or queued) -%}
                    {%- set b0 = ['disabled'] if not enabled else [] -%}
                    {%- set b1 = b0 + ['not_due'] if (not due and not queued) else b0 -%}
                    {%- set b2 = b1 + ['skip_next'] if skip_next else b1 -%}
                    {%- set blockers = b2 + ['needs_confirmation'] if (require_confirmation and not ready) else b2 -%}
                    {%- set reason = (
                      'Elected for next run.' if elected else
                      'Disabled.' if not enabled else
                      'Skipped this run.' if skip_next else
                      'Waiting for confirmation (require_confirmation).' if (require_confirmation and not ready) else
                      ('Not due yet (' ~ days_since ~ '/' ~ db ~ ' days).' if (not due and not queued) else 'Not elected.')
                    ) -%}
                    {{ {'registered': true, 'enabled': enabled, 'elected': elected, 'due': due, 'queued': queued, 'skip_next': skip_next, 'ready_to_clean': ready, 'require_confirmation': require_confirmation, 'last_cleaned': last, 'days_since_cleaned': days_since, 'days_between': db, 'segment': room.get('segment', 0), 'requires_mop': room.get('requires_mop', false), 'blockers': blockers, 'reason': reason} }}
                  {%- endif -%}
                {%- endif -%}
          - variables:
              _result:
                status: ok
                mode: get
                area_id: "{{ _area_id }}"
                area_name: "{{ _area_name }}"
                floor_id: "{{ _get_floor }}"
                ha_labels: "{{ _get_labels }}"
                rm_managed: "{{ 'room_manager' in _get_labels }}"
                layout_defined: "{{ 'room_layout' in _get_labels }}"
                entity_count: "{{ _get_ent_count }}"
                device_count: "{{ _get_dev_count }}"
                spatial: "{{ _get_spatial }}"
                features: "{{ _get_features }}"
                exits: "{{ _get_exits }}"
                room_presence: >-
                  {%- set _hps_bps = label_entities('hps') | select('match', '.*_bps_zone$') | list -%}
                  {%- set _pns = namespace(present=[]) -%}
                  {%- for eid in _hps_bps -%}
                    {%- if states(eid) == _area_name -%}
                      {%- set _fn = state_attr(eid, 'friendly_name') | default(eid.split('.')[1] | replace('_bps_zone', '') | replace('_', ' ') | title, true) -%}
                      {%- set _pns.present = _pns.present + [{'entity_id': eid, 'name': _fn}] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ {'present': _pns.present, 'count': _pns.present | count} | tojson }}
                occupancy: >-
                  {#- ONE TOOL, NOT TWO (2026-08-05, design note): folds Room
                      Manager v3's occupancy-state sensor straight into
                      mode=get — the agent/user never needs to know
                      sensor.<x>_room_state exists as a separate thing.
                      Discovered by label, not naming convention (the
                      blueprint's unique_id is arbitrary per deployment):
                      tag the deployed sensor 'zen_room_state' + the room's
                      own label at setup time (see v3_room_deployment).
                      Passes through the ENTIRE live attribute set rather
                      than a curated subset — stays in sync automatically
                      as the blueprint's attributes evolve, no duplicated
                      logic to maintain here. null if this room has no v3
                      sensor deployed yet (not every room needs one). -#}
                  {%- set _v3_ent = (label_entities('zen_room_state') | intersect(label_entities(_area_id)) | list | first) | default('', true) -%}
                  {%- if _v3_ent != '' -%}
                    {#- Pulling the WHOLE .attributes mapping at once (via
                        states[e].attributes or combine()) leaks an
                        internal EntityStateAttribute enum key for
                        friendly_name on this HA core version — survives
                        even an explicit |string coercion per-key. Every
                        OTHER field in this file reads attributes one at a
                        time via state_attr(), which never has this
                        problem — matching that proven pattern here rather
                        than the whole-mapping shortcut. Tradeoff: this
                        list must be kept in sync with
                        room_state.yaml's actual attributes (not
                        auto-passthrough) — acceptable, the blueprint's
                        attribute set is stable and any future addition is
                        a one-line addition here too. -#}
                    {{ {
                      'entity_id': _v3_ent,
                      'state': states(_v3_ent),
                      'engaged_active': state_attr(_v3_ent, 'engaged_active'),
                      'occupied_active': state_attr(_v3_ent, 'occupied_active'),
                      'asleep_active': state_attr(_v3_ent, 'asleep_active'),
                      'checking_active': state_attr(_v3_ent, 'checking_active'),
                      'emergency_active': state_attr(_v3_ent, 'emergency_active'),
                      'hold_active': state_attr(_v3_ent, 'hold_active'),
                      'window_open_active': state_attr(_v3_ent, 'window_open_active'),
                      'garage_open_active': state_attr(_v3_ent, 'garage_open_active'),
                      'vent_open_active': state_attr(_v3_ent, 'vent_open_active'),
                      'vent_temperature': state_attr(_v3_ent, 'vent_temperature'),
                      'window_covering_open_active': state_attr(_v3_ent, 'window_covering_open_active'),
                      'zone_presence': state_attr(_v3_ent, 'zone_presence'),
                      'nap_active': state_attr(_v3_ent, 'nap_active'),
                      'effective_asleep_timeout_minutes': state_attr(_v3_ent, 'effective_asleep_timeout_minutes'),
                      'occupied_timer_entity': state_attr(_v3_ent, 'occupied_timer_entity'),
                      'occupied_timer_state': state_attr(_v3_ent, 'occupied_timer_state'),
                      'asleep_timer_entity': state_attr(_v3_ent, 'asleep_timer_entity'),
                      'asleep_timer_state': state_attr(_v3_ent, 'asleep_timer_state'),
                      'wasp_flag_active': state_attr(_v3_ent, 'wasp_flag_active'),
                      'entertaining_hold_active': state_attr(_v3_ent, 'entertaining_hold_active'),
                      'guest_hold_active': state_attr(_v3_ent, 'guest_hold_active'),
                      'child_rooms': state_attr(_v3_ent, 'child_rooms'),
                      'child_engaged': state_attr(_v3_ent, 'child_engaged'),
                      'child_occupied': state_attr(_v3_ent, 'child_occupied'),
                      'occupied_last_trigger': state_attr(_v3_ent, 'occupied_last_trigger'),
                      'engaged_last_trigger': state_attr(_v3_ent, 'engaged_last_trigger'),
                      'asleep_last_trigger': state_attr(_v3_ent, 'asleep_last_trigger'),
                      'last_trigger': state_attr(_v3_ent, 'last_trigger')
                    } }}
                  {%- else -%}
                    {{ none }}
                  {%- endif -%}
                advisory: >-
                  {%- if _get_spatial is none -%}
                  No spatial data for {{ _area_id }}.
                  Seed steps: (1) mode=set area={{ _area_id }} walls=N description='...' to register (auto-applies room_layout);
                  (2) mode=link area={{ _area_id }} area_b=NEIGHBOR per adjacent room.
                  Unlocks: ZenLux adjacency scenes, egress routing, vacuum zone targeting.
                  {%- else -%}{{ none }}{%- endif -%}
                domain_routing:
                  lighting: "zen_dojotools_lights — ZenLux. area={{ _area_id }}. Reads adjacent[] for bleed-aware scenes."
                  media: "zen_dojotools_media_manager — NyxMau5. context_slices=+media: now_playing snapshot (full fidelity — title, artist, provider, MA URI, lyrics_hint). mode=now_playing room=X: direct call. mode=stacks_by_anchor: area_id anchor injects room_context without polluting search. mode=search: raw MA library query."
                  voice: "zen_dojotools_postman — channel_hint=tts target_area={{ _area_id }}. room_presence.present[].name → target=person.<name> for per-person policy. Ducks active media in area before announcing."
                  climate: "zen_dojotools_climate — area={{ _area_id }}. spatial.area_sqm for load context."
                  spa: "{{ 'zen_dojotools_spamaster — SpaMaster. Canonical for all spa intents: chemistry, jets, cover, lights, audio, temperature. area=' ~ _area_id if _spa_in_area else none }}"
                  egress: "No extra call. Filter portals+windows where exit=true or emerg_exit=true. windows.drop_ft=0=ground safe. emerg_exit=true=designated evacuation route."
                  occupant_profile: "occupants[] names → zen_dojotools_profile_editor mode=get."
                  grocy: "{{ ('zen_dojotools_inventory — context_slices=+inventory: full denormalized room view (object_lens place lens — tagged products, chores, expanded operational objects). anchor=' ~ _get_spatial.grocy_location_id ~ '. Targeted ops: stock_list_by_location(location_id=' ~ _get_spatial.grocy_location_id ~ '), locations_find (containers), stock_where_is_item (find any item). object_lens is the primary read path for room inventory — use it first.') if (_get_spatial is mapping and (_get_spatial.grocy_location_id | default('',true)) | trim != '') else none }}"
                  chores: "{{ ('context_slices=+chores — maintenance chores (product-stocked or area-tagged). anchor=' ~ _get_spatial.grocy_location_id ~ '. Each entry has chore_id, name, is_due, next_execution. context.chores.chore_actions has execute, edit, add call shapes — pass item=<chore name>. add also takes period_days=N.') if (_get_spatial is mapping and (_get_spatial.grocy_location_id | default('',true)) | trim != '') else none }}"
                  tasks: "{{ ('context_slices=+tasks — ' ~ _dr_task_count ~ ' todo list(s) tagged to area labels. Each list has items[] + task_actions{complete, edit, add} — pass items=[<summary>]. Full capability: zen_dojotools_todo mode=help.') if (_dr_task_count | int) > 0 else none }}"
                  calendar: "{{ ('context_slices=+calendar — ' ~ _dr_cal_count ~ ' calendar(s) tagged to area labels. 7-day event window.') if (_dr_cal_count | int) > 0 else none }}"
                  conductor: "context_slices=+conductor — AI schedule/task queue. Todo entities labeled schedule. Always area-agnostic."
                  security: "context_slices=+security — alarm zones + cameras in this room. zen_dojotools_security_manager for arm/disarm/policy (security lens). zen_dojotools_camera for visual analysis per camera entity (camera lens)."
                  wiki: "context_slices=+wiki — wiki pages tagged with area_id={{ _area_id }} via Lens Bus (zen_dojotools_lens_dispatch anchor_type=area_id). Returns evidence[]{title, path, tags}. Tag room wiki pages with '{{ _area_id }}' to surface here."
                  tickets: "context_slices=+tickets — open Zammad tickets anchored to area_id={{ _area_id }} (tagged with HA slug). Direct: zen_dojotools_servicedesk mode=tickets_by_anchor anchor_type=area_id anchor_ids={{ _area_id }}. Tag tickets with '{{ _area_id }}' slug to link them to this room."
                  catalog: "context_slices=+catalog — cataloged physical items (books, games, media, etc.) shelved in area={{ _area_id }} via Lens Bus (library_catalog provider, anchor_type=area_id). Returns item_evidence[]{item_id, product_id, format, creator, isbn, location_id, loan_borrower, loan_due}. Loan/return via zen_dojotools_library section=catalog mode=loan/return."
                  vacuum: >-
                    {%- if _get_autovac is mapping and _get_autovac.get('registered', false) -%}
                      zen_dojotools_autovac. elected={{ _get_autovac.get('elected',false) }} queued={{ _get_autovac.get('queued',false) }} requires_mop={{ _get_autovac.get('requires_mop',false) }} last_cleaned={{ _get_autovac.get('last_cleaned','?') }} ({{ _get_autovac.get('days_since_cleaned',0) }}d ago).
                      {%- if _get_autovac.get('blockers', []) | length > 0 %} Blockers: {{ _get_autovac.get('blockers', []) | join(', ') }}.{% endif %}
                      Controls: mode=queue/dequeue/skip/unskip/ready/unready/mark_cleaned room={{ _area_id }}. mode=clean rooms={{ _area_id }}.
                    {%- else -%}{{ none }}{%- endif -%}
                vacuum: "{{ _get_autovac }}"
                housekeeping_status: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _rs = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'room_status') | from_json -%}
                  {%- set _rs = _rs if _rs is mapping else {} -%}
                  {{ _rs.get(_area_id, {'status': 'unknown', 'updated_at': none, 'source': none, 'note': ''}) }}
                context: "{{ _context_block }}"
                caller_token: "{{ _caller_token }}"
          - stop: get
            response_variable: _result

      # ═══════════════════════════════════════════════════════════════════════
      # 2b. ROOM_OCCUPANT_PREFS — "who's the relevant person for this room right
      #     now, guest or household member, and what are their prefs." Guest
      #     stays (Twenty CRM, event-shaped presence) take priority; falls back
      #     to this room's static occupants[] assignment resolved against
      #     zen_dojotools_profile_editor (household-member prefs already live
      #     there — preferences/media_prefs — not duplicated into Twenty).
      # ═══════════════════════════════════════════════════════════════════════
      - if: "{{ _mode == 'room_occupant_prefs' }}"
        then:
          - if: "{{ _area_id == '' }}"
            then:
              - variables:
                  _result: {status: error, mode: room_occupant_prefs, message: "area= required.", caller_token: "{{ _caller_token }}"}
              - stop: room_occupant_prefs error
                response_variable: _result

          # vendor_activity is independent of the guest/household priority chain below — a
          # vendor being present doesn't change whose meal/music prefs apply, it's an
          # orthogonal "use caution, work in progress" signal for automations. Computed once,
          # attached to every branch's response.
          - action: script.zen_dojotools_rolodex
            response_variable: _rop_aap
            continue_on_error: true
            data:
              mode: active_appointment
              area_id: '{{ _area_id }}'
          - variables:
              _rop_vendor_activity:
                active: >-
                  {{ _rop_aap is defined and _rop_aap is mapping
                     and _rop_aap.get('status') == 'success'
                     and _rop_aap.get('result', {}).get('active') == true }}
                vendor_name: "{{ _rop_aap.get('result', {}).get('vendor_name', '') if _rop_aap is mapping else '' }}"
                appointment_summary: "{{ _rop_aap.get('result', {}).get('appointment_summary', '') if _rop_aap is mapping else '' }}"

          - action: script.zen_dojotools_rolodex
            response_variable: _rop_asp
            continue_on_error: true
            data:
              mode: active_stay_prefs
              area_id: '{{ _area_id }}'

          - if: >-
              {{ _rop_asp is defined and _rop_asp is mapping
                 and _rop_asp.get('status') == 'success'
                 and _rop_asp.get('result', {}).get('active') == true }}
            then:
              - variables:
                  _result:
                    status: ok
                    mode: room_occupant_prefs
                    result:
                      active: true
                      source: guest_stay
                      guest_name: "{{ _rop_asp.get('result', {}).get('guest_name', '') }}"
                      area_id: "{{ _area_id }}"
                      guest_prefs: "{{ _rop_asp.get('result', {}).get('guest_prefs', {}) }}"
                      vendor_activity: "{{ _rop_vendor_activity }}"
                    caller_token: "{{ _caller_token }}"
              - stop: room_occupant_prefs (guest_stay)
                response_variable: _result

          # no active guest — fall back to this room's static occupants[] assignment
          - variables:
              _rop_spatial: >-
                {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}{%- set topo = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'room_topology') | from_json -%}
                {{ topo.get(_area_id, none) }}
              _rop_occupants: >-
                {%- set _sp = _rop_spatial if _rop_spatial is mapping else {} -%}
                {{ _sp.get('occupants', []) if _sp.get('occupants', []) is sequence else [] }}

          - if: "{{ _rop_occupants | length == 0 }}"
            then:
              - variables:
                  _result:
                    status: ok
                    mode: room_occupant_prefs
                    result:
                      active: false
                      source: none
                      area_id: "{{ _area_id }}"
                      vendor_activity: "{{ _rop_vendor_activity }}"
                    caller_token: "{{ _caller_token }}"
              - stop: room_occupant_prefs (none)
                response_variable: _result

          # scan the fixed profile_editor target slots for a first/preferred-name match per
          # occupant — no name->cabinet index exists (confirmed), so this is a bounded
          # (max 7 per occupant) resolve. Allergens union across all matched occupants
          # (missing one is a safety issue); media_prefs from the first occupant matched —
          # a stated simplification, not a hidden guess.
          - variables:
              _rop_targets: [user, family, expansion_1, expansion_2, expansion_3, expansion_4, expansion_5]
              _rop_matched_names: []
              _rop_all_allergens: []
              _rop_media: {}
          - repeat:
              for_each: "{{ _rop_occupants }}"
              sequence:
                - variables:
                    _ropo_name: "{{ repeat.item | string | lower | trim }}"
                    _ropo_found: false
                - repeat:
                    for_each: "{{ _rop_targets }}"
                    sequence:
                      - if: "{{ not _ropo_found }}"
                        then:
                          - action: script.zen_dojotools_profile_editor
                            response_variable: _ropi_read
                            continue_on_error: true
                            data:
                              mode: read
                              target_type: '{{ repeat.item }}'
                          - variables:
                              _ropi_profile: "{{ _ropi_read.get('profile', {}) if _ropi_read is mapping else {} }}"
                              _ropi_names: >-
                                {%- set _p = _ropi_read.get('profile', {}) if _ropi_read is mapping else {} -%}
                                {{ [_p.get('first_name','') | lower | trim, _p.get('preferred_name','') | lower | trim] }}
                          - if: "{{ _ropo_name in _ropi_names and _ropo_name != '' }}"
                            then:
                              - variables:
                                  _ropo_found: true
                                  _rop_matched_names: "{{ _rop_matched_names + [repeat.item] }}"
                                  _rop_all_allergens: >-
                                    {{ (_rop_all_allergens
                                        + (_ropi_profile.get('preferences', {}).get('allergens', [])
                                           if _ropi_profile.get('preferences', {}).get('allergens', []) is sequence else []))
                                       | unique | list }}
                                  _rop_media: "{{ _rop_media if _rop_media | length > 0 else _ropi_profile.get('media_prefs', {}) }}"

          - variables:
              _rop_match_found: "{{ _rop_matched_names | length > 0 }}"

          - variables:
              _result:
                status: ok
                mode: room_occupant_prefs
                result:
                  active: "{{ _rop_match_found }}"
                  source: "{{ 'household_member' if _rop_match_found else 'none' }}"
                  guest_name: "{{ _rop_occupants | join(', ') if _rop_match_found else none }}"
                  area_id: "{{ _area_id }}"
                  guest_prefs:
                    allergens: "{{ _rop_all_allergens }}"
                    media: "{{ _rop_media }}"
                  vendor_activity: "{{ _rop_vendor_activity }}"
                caller_token: "{{ _caller_token }}"
          - stop: room_occupant_prefs (household_member or none)
            response_variable: _result

      # ═══════════════════════════════════════════════════════════════════════
      # 2.5. ROOM HOUSEKEEPING STATUS — decoupled from stay lifecycle. Mirrors
      # room_topology's own storage shape exactly: a dict keyed by area_id on
      # the household cabinet, merge-only writes (matches this file's existing
      # non-destructive-merge convention). NOT a Twenty object — this is
      # HA-local operational state, independent of any guest stay/reservation.
      # An area never reported here reads back as "unknown", not "clean" —
      # explicit absence of data beats a silent assumption for a real PMS.
      # ═══════════════════════════════════════════════════════════════════════
      - if: "{{ _mode == 'room_status_set' }}"
        then:
          - if: "{{ _area_id == '' or _area_id not in (areas() | list) }}"
            then:
              - variables:
                  _result: {status: error, mode: room_status_set, message: "area= required and must be a real HA area.", caller_token: "{{ _caller_token }}"}
              - stop: room_status_set error — bad area
                response_variable: _result
          - if: "{{ room_status is not defined or room_status | default('', true) == '' }}"
            then:
              - variables:
                  _result: {status: error, mode: room_status_set, message: "room_status= required (clean|dirty|in_service|occupied).", caller_token: "{{ _caller_token }}"}
              - stop: room_status_set error — missing status
                response_variable: _result
          - variables:
              _rss_entry:
                status: "{{ room_status }}"
                updated_at: "{{ now().isoformat() }}"
                source: "{{ room_status_source | default('manual', true) | string | trim }}"
                note: "{{ room_status_note | default('', true) | string | trim }}"
          - action: script.zen_dojotools_filecabinet
            data:
              action_type: >-
                {%- set _cv=state_attr(_hh_cabinet,'variables')|default({},true) -%}
                {{ 'update' if _cv.get('room_status',none) is not none else 'create' }}
              key: room_status
              volume_entity_id: "{{ _hh_cabinet }}"
              value: >-
                {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                {%- set _rs = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'room_status') | from_json -%}
                {%- set _rs = _rs if _rs is mapping else {} -%}
                {{ (_rs | combine({_area_id: _rss_entry})) | tojson }}
            response_variable: _fc_rss_result
          - variables:
              _result:
                status: ok
                mode: room_status_set
                area_id: "{{ _area_id }}"
                written: "{{ _rss_entry }}"
                caller_token: "{{ _caller_token }}"
          - stop: room_status_set done
            response_variable: _result

      - if: "{{ _mode == 'room_status_get' }}"
        then:
          - variables:
              _rsg_all: >-
                {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                {%- set _rs = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'room_status') | from_json -%}
                {{ _rs if _rs is mapping else {} }}
          - if: "{{ _area_id != '' }}"
            then:
              - variables:
                  _result:
                    status: ok
                    mode: room_status_get
                    area_id: "{{ _area_id }}"
                    result: "{{ _rsg_all.get(_area_id, {'status': 'unknown', 'updated_at': none, 'source': none, 'note': ''}) }}"
                    caller_token: "{{ _caller_token }}"
              - stop: room_status_get single area
                response_variable: _result
          - variables:
              _result:
                status: ok
                mode: room_status_get
                result: "{{ _rsg_all }}"
                caller_token: "{{ _caller_token }}"
          - stop: room_status_get all
            response_variable: _result

      # ═══════════════════════════════════════════════════════════════════════
      # 2a2. ROOMSTATE_ENABLE (2026-08-06) — master on/off for the v3
      #     room-state engine (zen_signal_dispatch.yaml's signal
      #     processing). Design note: "a single enable disable structure at
      #     the RM level... if written do y as written and theres an
      #     optional input bool that can behave as if you wrote the
      #     struct. if no bool fallback to cabinet struc if no struct
      #     fallback to pub default... deploy no change and default off
      #     but setup flips it on and you have a way to turn it off...
      #     i prefer not to ship the helper if i can help it and ppl can
      #     add it if they prefer."
      #     No helper is shipped by this system. Resolution (READ, no
      #     roomstate_enabled param given): (1) any entity tagged
      #     'zenos_roomstate_master_switch' — optional, user- or
      #     integration-added, any domain, truthy 'on' wins; (2)
      #     household cabinet drawer 'roomstate_config'.enabled; (3)
      #     published default false. WRITE (roomstate_enabled param
      #     given): persists to the cabinet drawer (source of truth)
      #     and, if a master-switch-labeled entity happens to exist,
      #     syncs it too so the dispatcher's fast label-check and the
      #     cabinet never disagree.
      # ═══════════════════════════════════════════════════════════════════════
      - if: "{{ _mode == 'roomstate_enable' }}"
        then:
          - variables:
              _re_written: "{{ roomstate_enabled is defined and roomstate_enabled not in [none, ''] }}"
              _re_sw_ents: "{{ label_entities('zenos_roomstate_master_switch') }}"
          - if: "{{ _re_written }}"
            then:
              - action: script.zen_dojotools_filecabinet
                data:
                  action_type: >-
                    {%- set _cv=state_attr(_hh_cabinet,'variables')|default({},true) -%}
                    {{ 'update' if _cv.get('roomstate_config',none) is not none else 'create' }}
                  key: roomstate_config
                  volume_entity_id: "{{ _hh_cabinet }}"
                  value: >-
                    {{ {'enabled': roomstate_enabled | bool, 'updated_at': now().isoformat(), 'source': 'rm_mode_roomstate_enable'} | tojson }}
                response_variable: _fc_re_result
              - if: "{{ _re_sw_ents | count > 0 }}"
                then:
                  - action: "{{ 'homeassistant.turn_on' if roomstate_enabled | bool else 'homeassistant.turn_off' }}"
                    target:
                      entity_id: "{{ _re_sw_ents }}"
              - variables:
                  _result:
                    status: ok
                    mode: roomstate_enable
                    written: "{{ roomstate_enabled | bool }}"
                    synced_switch_entities: "{{ _re_sw_ents }}"
                    caller_token: "{{ _caller_token }}"
              - stop: roomstate_enable write done
                response_variable: _result
          - variables:
              _re_resolved: >-
                {%- if _re_sw_ents | count > 0 -%}
                  {{ (_re_sw_ents | map('states') | select('eq','on') | list | count) > 0 }}
                {%- else -%}
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _raw = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'roomstate_config') if _hh_cabinet != '' else none -%}
                  {%- set _cfg = (_raw | from_json) if _raw not in [none, ''] else {} -%}
                  {{ (_cfg.enabled | default(false)) if _cfg is mapping else false }}
                {%- endif -%}
              _re_source: >-
                {%- if _re_sw_ents | count > 0 -%}label_switch
                {%- else -%}
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _raw = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'roomstate_config') if _hh_cabinet != '' else none -%}
                  {{ 'cabinet' if _raw not in [none, ''] else 'published_default' }}
                {%- endif -%}
          - variables:
              _result:
                status: ok
                mode: roomstate_enable
                enabled: "{{ _re_resolved | trim | lower == 'true' }}"
                source: "{{ _re_source | trim }}"
                switch_entities: "{{ _re_sw_ents }}"
                caller_token: "{{ _caller_token }}"
          - stop: roomstate_enable read done
            response_variable: _result

      # ═══════════════════════════════════════════════════════════════════════
      # 2a3. REFLEX_ENABLE (2026-08-06) — master on/off for the Room Manager
      #     REFLEX system (room + state + zen_home_mode -> scene, on
      #     transition). Separate switch from roomstate_enable on purpose —
      #     Design note: "first i want a shunt to turn the Room Manager Reflex
      #     system on / off / default off" BEFORE the scene-dispatch layer
      #     itself gets built. You can have v3's state engine (roomstate_
      #     enable) running with decay/cascade fully live while Reflex stays
      #     off — the room correctly KNOWS it's occupied/engaged/vacant, it
      #     just doesn't act on it by firing scenes. Same resolution chain
      #     as roomstate_enable, same no-shipped-helper philosophy, distinct
      #     label/drawer so the two switches never collide or get confused:
      #     (1) any entity tagged 'zenos_reflex_master_switch' — optional,
      #     user- or integration-added, any domain, truthy 'on' wins; (2)
      #     household cabinet drawer 'reflex_config'.enabled; (3) published
      #     default false. WRITE (reflex_enabled param given): persists to
      #     the cabinet drawer (source of truth) and, if a master-switch-
      #     labeled entity happens to exist, syncs it too.
      # ═══════════════════════════════════════════════════════════════════════
      - if: "{{ _mode == 'reflex_enable' }}"
        then:
          - variables:
              _rx_written: "{{ reflex_enabled is defined and reflex_enabled not in [none, ''] }}"
              _rx_sw_ents: "{{ label_entities('zenos_reflex_master_switch') }}"
          - if: "{{ _rx_written }}"
            then:
              - action: script.zen_dojotools_filecabinet
                data:
                  action_type: >-
                    {%- set _cv=state_attr(_hh_cabinet,'variables')|default({},true) -%}
                    {{ 'update' if _cv.get('reflex_config',none) is not none else 'create' }}
                  key: reflex_config
                  volume_entity_id: "{{ _hh_cabinet }}"
                  # MERGE, not overwrite (2026-08-06 fix) — reflex_config
                  # now carries two independent keys (enabled, dry_run);
                  # a straight overwrite here would silently wipe
                  # whatever reflex_dry_run had written.
                  value: >-
                    {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                    {%- set _raw = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'reflex_config') if _hh_cabinet != '' else none -%}
                    {%- set _existing = (_raw | from_json) if _raw not in [none, ''] and (_raw is mapping or _raw is string) else {} -%}
                    {%- set _merged = (_existing if _existing is mapping else {}) | combine({'enabled': reflex_enabled | bool, 'updated_at': now().isoformat(), 'source': 'rm_mode_reflex_enable'}) -%}
                    {{ _merged | tojson }}
                response_variable: _fc_rx_result
              - if: "{{ _rx_sw_ents | count > 0 }}"
                then:
                  - action: "{{ 'homeassistant.turn_on' if reflex_enabled | bool else 'homeassistant.turn_off' }}"
                    target:
                      entity_id: "{{ _rx_sw_ents }}"
              - variables:
                  _result:
                    status: ok
                    mode: reflex_enable
                    written: "{{ reflex_enabled | bool }}"
                    synced_switch_entities: "{{ _rx_sw_ents }}"
                    caller_token: "{{ _caller_token }}"
              - stop: reflex_enable write done
                response_variable: _result
          - variables:
              _rx_resolved: >-
                {%- if _rx_sw_ents | count > 0 -%}
                  {{ (_rx_sw_ents | map('states') | select('eq','on') | list | count) > 0 }}
                {%- else -%}
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _raw = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'reflex_config') if _hh_cabinet != '' else none -%}
                  {%- set _cfg = (_raw | from_json) if _raw not in [none, ''] else {} -%}
                  {{ (_cfg.enabled | default(false)) if _cfg is mapping else false }}
                {%- endif -%}
              _rx_source: >-
                {%- if _rx_sw_ents | count > 0 -%}label_switch
                {%- else -%}
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _raw = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'reflex_config') if _hh_cabinet != '' else none -%}
                  {{ 'cabinet' if _raw not in [none, ''] else 'published_default' }}
                {%- endif -%}
          - variables:
              _result:
                status: ok
                mode: reflex_enable
                enabled: "{{ _rx_resolved | trim | lower == 'true' }}"
                source: "{{ _rx_source | trim }}"
                switch_entities: "{{ _rx_sw_ents }}"
                caller_token: "{{ _caller_token }}"
          - stop: reflex_enable read done
            response_variable: _result

      # ═══════════════════════════════════════════════════════════════════════
      # 2a3b. REFLEX_DRY_RUN (2026-08-06, Design note: "can we make a dry run
      #     setup flag that turns on the pipe and doesn't fire the scenes
      #     and maybe events for log inspection... dry run mode true would
      #     fire: foo?"). Third independent flag alongside roomstate_enable
      #     and reflex_enable — same label>cabinet>default chain, own
      #     label ('zenos_reflex_dry_run_switch') and own cabinet key
      #     ('reflex_config'.dry_run, same drawer as reflex_enable's
      #     .enabled, different key). Lets zen_reflex_dispatch.yaml Stage 2
      #     run its FULL real resolution pipeline (same label-intersect
      #     logic, same inheritance) while it's off, but swap the final
      #     scene.turn_on for a logged zen_event (kind=reflex_dry_run,
      #     summary "[DRY RUN] room (state) would fire scene.x") instead
      #     of touching a light — see it resolve correctly before ever
      #     flipping reflex_enable for real. If reflex_enable is ALSO
      #     true, the real fire wins; dry_run only matters while the real
      #     switch is off.
      # ═══════════════════════════════════════════════════════════════════════
      - if: "{{ _mode == 'reflex_dry_run' }}"
        then:
          - variables:
              _rd_written: "{{ reflex_dry_run_enabled is defined and reflex_dry_run_enabled not in [none, ''] }}"
              _rd_sw_ents: "{{ label_entities('zenos_reflex_dry_run_switch') }}"
          - if: "{{ _rd_written }}"
            then:
              - action: script.zen_dojotools_filecabinet
                data:
                  action_type: >-
                    {%- set _cv=state_attr(_hh_cabinet,'variables')|default({},true) -%}
                    {{ 'update' if _cv.get('reflex_config',none) is not none else 'create' }}
                  key: reflex_config
                  volume_entity_id: "{{ _hh_cabinet }}"
                  value: >-
                    {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                    {%- set _raw = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'reflex_config') if _hh_cabinet != '' else none -%}
                    {%- set _existing = (_raw | from_json) if _raw not in [none, ''] and (_raw is mapping or _raw is string) else {} -%}
                    {%- set _merged = (_existing if _existing is mapping else {}) | combine({'dry_run': reflex_dry_run_enabled | bool, 'updated_at': now().isoformat(), 'source': 'rm_mode_reflex_dry_run'}) -%}
                    {{ _merged | tojson }}
                response_variable: _fc_rd_result
              - if: "{{ _rd_sw_ents | count > 0 }}"
                then:
                  - action: "{{ 'homeassistant.turn_on' if reflex_dry_run_enabled | bool else 'homeassistant.turn_off' }}"
                    target:
                      entity_id: "{{ _rd_sw_ents }}"
              - variables:
                  _result:
                    status: ok
                    mode: reflex_dry_run
                    written: "{{ reflex_dry_run_enabled | bool }}"
                    synced_switch_entities: "{{ _rd_sw_ents }}"
                    caller_token: "{{ _caller_token }}"
              - stop: reflex_dry_run write done
                response_variable: _result
          - variables:
              _rd_resolved: >-
                {%- if _rd_sw_ents | count > 0 -%}
                  {{ (_rd_sw_ents | map('states') | select('eq','on') | list | count) > 0 }}
                {%- else -%}
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _raw = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'reflex_config') if _hh_cabinet != '' else none -%}
                  {%- set _cfg = (_raw | from_json) if _raw not in [none, ''] else {} -%}
                  {{ (_cfg.dry_run | default(false)) if _cfg is mapping else false }}
                {%- endif -%}
              _rd_source: >-
                {%- if _rd_sw_ents | count > 0 -%}label_switch
                {%- else -%}
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set _raw = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'reflex_config') if _hh_cabinet != '' else none -%}
                  {{ 'cabinet' if _raw not in [none, ''] else 'published_default' }}
                {%- endif -%}
          - variables:
              _result:
                status: ok
                mode: reflex_dry_run
                enabled: "{{ _rd_resolved | trim | lower == 'true' }}"
                source: "{{ _rd_source | trim }}"
                switch_entities: "{{ _rd_sw_ents }}"
                note: "Dry-run resolves and LOGS (zen_event kind=reflex_dry_run) instead of firing scenes. If reflex_enable is also true, the real fire wins."
                caller_token: "{{ _caller_token }}"
          - stop: reflex_dry_run read done
            response_variable: _result

      # ═══════════════════════════════════════════════════════════════════════
      # 2a4. REFLEX_WIRE (2026-08-06) — assist mode for wiring REFLEX scene
      #     labels (design note: "should we give agent a tool to help wire up
      #     reflex scenes - ok we have these rooms these modes these states
      #     - we have these scenes containing office or yomamma whatcha
      #     want to do boss?"). Same discover-then-confirm shape as
      #     label_discover, but for the scene_<state>/room/home_mode label
      #     triad zen_reflex_dispatch.yaml resolves against.
      #     GET (no reflex_assignments): fuzzy-matches every scene.* entity
      #     whose entity_id or friendly_name contains area=this room's slug
      #     (case-insensitive substring — scene naming isn't fully
      #     normalized so this deliberately over-includes rather than
      #     misses candidates), shows each candidate's CURRENT labels (so
      #     already-wired scenes are visible, not re-suggested blind), and
      #     lists which of the room's REAL cascade tiers already have ANY
      #     scene wired (label_entities('scene_'+tier) intersect room) so
      #     gaps are obvious. Also echoes the live home_mode daypart label
      #     set for reference (reused directly from zen_home_mode, no new
      #     labels needed for that axis).
      #     SET (reflex_assignments given, confirm_action=true required):
      #     each entry "entity_id|state|mode" (mode optional — blank means
      #     "no daypart, this scene is this room's fallback for that
      #     state"). Creates any 'scene_<state>' label not yet in the
      #     registry first (same silent-fail-if-undefined bug this system
      #     hit before, being proactive here), then tags
      #     [scene_<state>, room, mode?] onto each entity_id — additive,
      #     never removes existing labels.
      # ═══════════════════════════════════════════════════════════════════════
      - if: "{{ _mode == 'reflex_wire' }}"
        then:
          - variables:
              # NORMALIZE (2026-08-06 fix): the shared 'area' field has no
              # default — referencing it bare when omitted threw a raw
              # Python TypeError ('in <string> requires string, not
              # LoggingUndefined') instead of a friendly error. Shadowing
              # it here makes every downstream reference in this branch
              # safe, omitted-or-not.
              area: "{{ area | default('', true) }}"
          - if: "{{ area == '' }}"
            then:
              # WHOLE-HOME ROLLUP (2026-08-06, Design note: "if you call it w/o
              # room does it give you a useful overall summary for the
              # home?" -> yes, built here). Lean per-room pass — NOT the
              # full per-mode matrix (that's what area=<room> is for) —
              # just wiring completeness: which of the 9 cascade states
              # have a scene of their own, which are covered only via the
              # engaged/cleaning/emergency->occupied inheritance, and
              # which are genuine hard gaps, per room. Rooms discovered
              # the same way every other global dispatcher in this system
              # finds them — reverse-lookup off zen_room_state, no
              # hardcoded room list.
              - variables:
                  _rw_hh_states: [vacant, checking, occupied, engaged, asleep, paused, automation, cleaning, emergency]
                  # Two different inheritance targets (2026-08-06): engaged/
                  # cleaning/emergency borrow from occupied; asleep borrows
                  # from vacant (a room with no dedicated sleep scene should
                  # go dark/safe, not light up like someone's awake).
                  _rw_hh_inherit_map: {engaged: occupied, cleaning: occupied, emergency: occupied, asleep: vacant}
                  _rw_hh_rooms: >-
                    {%- set nsr = namespace(list=[]) -%}
                    {%- for ent in label_entities('zen_room_state') -%}
                      {%- set _r = namespace(found='') -%}
                      {%- for l in labels(ent) -%}
                        {%- if _r.found == '' and area_name(l) is not none -%}{%- set _r.found = l -%}{%- endif -%}
                      {%- endfor -%}
                      {%- if _r.found != '' and _r.found not in nsr.list -%}{%- set nsr.list = nsr.list + [_r.found] -%}{%- endif -%}
                    {%- endfor -%}
                    {{ nsr.list }}
              - variables:
                  # OK-BY-DESIGN STATES (2026-08-07, ticket #10287, Friday:
                  # "states without assigned scenes are not automatically
                  # shown as missing. Checking, paused, and automation may
                  # intentionally be safe no-ops"). These three tiers exist
                  # specifically so a room can sit there doing nothing
                  # scene-wise on purpose (Paused = human/agent all-stop,
                  # Automation = another process has the room, Checking =
                  # a brief ambiguous window awaiting confirmation) — an
                  # unwired scene for one of these is a legitimate design
                  # choice, not incomplete work, and must never count toward
                  # gap totals or flip a room out of "fully wired." Every
                  # OTHER state without coverage (including vacant — most
                  # households do want a vacant scene) stays a real gap.
                  _rw_hh_noop_states: [checking, paused, automation]
              - variables:
                  _rw_hh_summary: >-
                    {%- set nsh = namespace(d={}, fully_wired=0, with_gaps=0, total_gap_count=0) -%}
                    {%- for rm in _rw_hh_rooms -%}
                      {%- set _rents = label_entities(rm) -%}
                      {%- set _wired = namespace(list=[]) -%}
                      {%- for t in _rw_hh_states -%}
                        {%- if (label_entities('scene_' ~ t) | intersect(_rents) | list | count) > 0 -%}
                          {%- set _wired.list = _wired.list + [t] -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {%- set _inherited = namespace(list=[]) -%}
                      {%- for _state_key, _source in _rw_hh_inherit_map.items() -%}
                        {%- if _state_key not in _wired.list and _source in _wired.list -%}
                          {%- set _inherited.list = _inherited.list + [_state_key] -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {%- set _covered = _wired.list + _inherited.list -%}
                      {%- set _uncovered = _rw_hh_states | reject('in', _covered) | list -%}
                      {%- set _gaps = _uncovered | reject('in', _rw_hh_noop_states) | list -%}
                      {%- set _ok_by_design = _uncovered | select('in', _rw_hh_noop_states) | list -%}
                      {%- set nsh.d = nsh.d | combine({rm: {'wired_direct': _wired.list, 'inherited': _inherited.list, 'gaps': _gaps, 'ok_by_design': _ok_by_design}}) -%}
                      {%- if _gaps | count == 0 -%}
                        {%- set nsh.fully_wired = nsh.fully_wired + 1 -%}
                      {%- else -%}
                        {%- set nsh.with_gaps = nsh.with_gaps + 1 -%}
                        {%- set nsh.total_gap_count = nsh.total_gap_count + (_gaps | count) -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {{ {'rooms': nsh.d, 'room_count': (_rw_hh_rooms | count), 'fully_wired_count': nsh.fully_wired, 'rooms_with_gaps_count': nsh.with_gaps, 'total_gap_count': nsh.total_gap_count} }}
                  # UNCLAIMED STATE-LIKE SCENES (2026-08-06, Design note: "we'll
                  # document what it looks for... you could show ones
                  # containing any slug which is a known state substring?").
                  # area=<room>'s candidate matcher only catches a scene by
                  # room NAME substring / room LABEL / area_id — it has no way
                  # to guess an abbreviated room prefix (caught live:
                  # scene.mb_vacant for master_bedroom, no 'master_bedroom' in
                  # its name, no area_id assigned, invisible to every route).
                  # Rather than build fragile abbreviation-guessing, this
                  # scans ALL scenes house-wide for one of the state-taxonomy
                  # words in their entity_id, with NO scene_<state> label yet
                  # — i.e. "looks state-shaped but nobody's claimed it." Cheap
                  # insurance against exactly this kind of orphan, independent
                  # of room-naming convention. Manual triage by design — which
                  # room it belongs to still needs a human/agent glance.
                  _rw_hh_state_words: [vacant, checking, occupied, engaged, asleep, paused, automation, cleaning, emergency, nightlight]
              - variables:
                  _rw_hh_unclaimed: >-
                    {%- set nsu = namespace(list=[]) -%}
                    {%- for e in states.scene -%}
                      {%- set _has_state_word = (_rw_hh_state_words | select('in', (e.entity_id | lower)) | list | count) > 0 -%}
                      {%- set _already_claimed = (labels(e.entity_id) | select('match', '^scene_') | list | count) > 0 -%}
                      {%- if _has_state_word and not _already_claimed -%}
                        {%- set nsu.list = nsu.list + [{'entity_id': e.entity_id, 'friendly_name': e.name, 'current_labels': labels(e.entity_id)}] -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {{ nsu.list }}
              - variables:
                  _result:
                    status: ok
                    mode: reflex_wire
                    scope: whole_home
                    room_count: "{{ _rw_hh_summary.room_count }}"
                    fully_wired_count: "{{ _rw_hh_summary.fully_wired_count }}"
                    rooms_with_gaps_count: "{{ _rw_hh_summary.rooms_with_gaps_count }}"
                    total_gap_count: "{{ _rw_hh_summary.total_gap_count }}"
                    rooms: "{{ _rw_hh_summary.rooms }}"
                    unclaimed_state_like_scenes: "{{ _rw_hh_unclaimed }}"
                    usage: "This is the lean whole-home rollup (wiring completeness only — direct/inherited/gap per room). gaps[] are genuine incomplete/ambiguous wiring; ok_by_design[] (checking/paused/automation) are intentional safe no-ops and do NOT count toward gaps, rooms_with_gaps_count, or total_gap_count — a room with only ok_by_design uncovered still shows fully_wired. Pass area=<room> for the full per-mode matrix + candidate scenes + live scene_details. unclaimed_state_like_scenes lists scenes whose entity_id contains a state-taxonomy word (vacant/occupied/engaged/asleep/checking/paused/automation/cleaning/emergency/nightlight) but carry no scene_<state> label yet — the matcher can't guess abbreviated room prefixes (e.g. 'mb_' for master_bedroom), so these need a manual room assignment glance."
                    caller_token: "{{ _caller_token }}"
              - stop: reflex_wire whole-home rollup done
                response_variable: _result
          - variables:
              _rw_states: [vacant, checking, occupied, engaged, asleep, paused, automation, cleaning, emergency]
              _rw_room_ents: "{{ label_entities(area) }}"
              _rw_written: "{{ reflex_assignments is defined and (reflex_assignments | default([], true) | count) > 0 }}"
          - if: "{{ _rw_written }}"
            then:
              - if: "{{ not (confirm_action | default(false) | bool) }}"
                then:
                  - variables:
                      _rw_err2: {status: error, message: "confirm_action=true required to apply reflex_assignments"}
                  - stop: "reflex_wire write requires confirm_action=true."
                    response_variable: _rw_err2
              - repeat:
                  for_each: "{{ reflex_assignments }}"
                  sequence:
                    - variables:
                        _parts: "{{ repeat.item.split('|') }}"
                        _rw_ent: "{{ _parts[0] | trim }}"
                        _rw_state: "{{ _parts[1] | trim if _parts | count > 1 else '' }}"
                        _rw_mode: "{{ _parts[2] | trim if _parts | count > 2 else '' }}"
                    - if: "{{ _rw_ent != '' and _rw_state != '' }}"
                      then:
                        - action: script.zen_dojotools_labels
                          data:
                            mode: create
                            label_list: ["scene_{{ _rw_state }}"]
                            confirm: true
                        - action: homeassistant.add_label_to_entity
                          data:
                            label_id: >-
                              {{ ["scene_" ~ _rw_state, area] + ([_rw_mode] if _rw_mode != '' else []) }}
                            entity_id: "{{ _rw_ent }}"
              - variables:
                  _result: {status: ok, mode: reflex_wire, area: "{{ area }}", assigned: "{{ reflex_assignments }}", caller_token: "{{ _caller_token }}"}
              - stop: reflex_wire write done
                response_variable: _result
          - variables:
              # Candidate match (2026-08-06, Design note: "candidate scenes are
              # any with room name in scene name or scene id, carries
              # canon room label, or is assigned to area_id for room") —
              # three independent ways a scene can surface as a candidate
              # for this room, unioned:
              #   1. room slug substring in entity_id or friendly_name
              #      (naming-drift tolerant, over-includes on purpose)
              #   2. already carries this room's own canonical label
              #      (area_id-named label, e.g. 'office') even if the name
              #      doesn't mention the room at all
              #   3. assigned to this room's area_id directly (scene's own
              #      area assignment in the HA registry, independent of
              #      both naming and labeling)
              _rw_candidates: >-
                {%- set ns = namespace(list=[]) -%}
                {%- for e in states.scene -%}
                  {%- set _name_match = area in (e.entity_id | lower) or area in (e.name | lower | replace(' ', '_') | replace('-', '_')) -%}
                  {%- set _label_match = area in labels(e.entity_id) -%}
                  {%- set _area_match = area_id(e.entity_id) == area -%}
                  {%- if _name_match or _label_match or _area_match -%}
                    {%- set ns.list = ns.list + [{'entity_id': e.entity_id, 'friendly_name': e.name, 'current_labels': labels(e.entity_id), 'matched_via': ([('name' if _name_match else none), ('label' if _label_match else none), ('area_id' if _area_match else none)] | select('ne', none) | list)}] -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.list }}
              _rw_tier_coverage: >-
                {%- set ns = namespace(d={}) -%}
                {%- for t in _rw_states -%}
                  {%- set _covered = (label_entities('scene_' ~ t) | intersect(_rw_room_ents) | list) -%}
                  {%- set ns.d = ns.d | combine({t: _covered}) -%}
                {%- endfor -%}
                {{ ns.d }}
              _rw_home_mode_labels: [home_wake, home_morning, home, home_evening, night, night_late]
          - variables:
              # RESOLVED WIRING MATRIX — read a room's wired scenes BY
              # CONDITION (design note: "there should be a way for me to read a
              # room's wired up scenes by condition"). For every state ×
              # every home_mode daypart (plus a null/'any' column for the
              # no-mode fallback), shows EXACTLY what zen_reflex_dispatch.
              # yaml's Stage 2 would resolve right now for that condition —
              # same intersect-first-match logic, not a re-derivation, so
              # this can never drift out of sync with what actually fires.
              # null = genuinely nothing wired for that state+mode combo AND
              # no fallback either — a real gap, not a formatting artifact.
              _rw_wired_matrix: >-
                {%- set ns = namespace(d={}, warnings=[], status={}) -%}
                {%- set _rw_noop_states = ['checking', 'paused', 'automation'] -%}
                {%- for t in _rw_states -%}
                  {%- set _state_scene_ents = label_entities('scene_' ~ t) -%}
                  {%- set _no_mode_all = (_state_scene_ents | intersect(_rw_room_ents) | select('match', 'scene\\.') | list) -%}
                  {#- Only flag TRUE ambiguity: 2+ candidates that carry NO
                      home_mode label at all (genuinely indistinguishable,
                      "nobody disambiguated this"). A scene that already
                      has its own specific daypart tag isn't a duplicate —
                      it's just also visible in this unfiltered pool
                      because dropping the mode filter naturally re-
                      includes every mode-tagged scene too; that's not an
                      error, it's how the fallback pool is supposed to
                      work. -#}
                  {%- set nq = namespace(list=[]) -%}
                  {%- for ent in _no_mode_all -%}
                    {%- if (labels(ent) | select('in', _rw_home_mode_labels) | list | count) == 0 -%}
                      {%- set nq.list = nq.list + [ent] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {%- set _no_mode_unqualified = nq.list -%}
                  {#- 2026-08-06 fix (design note: "Garage also has an occupied"
                      — caught live: a mode-tagged scene was winning the
                      GENERIC fallback slots over a genuinely-unqualified
                      one, since |first over the unfiltered pool isn't
                      picky). Prefer the unqualified pool for the actual
                      fallback value; only cross over to a mode-tagged
                      scene (matches office's already-accepted behavior)
                      when no unqualified one exists at all. -#}
                  {%- set _no_mode = (_no_mode_unqualified | first) if (_no_mode_unqualified | count) > 0 else ((_no_mode_all | first) | default(none, true)) -%}
                  {%- if _no_mode_unqualified | count > 1 -%}
                    {%- set ns.warnings = ns.warnings + ["AMBIGUOUS: " ~ (_no_mode_unqualified | count | string) ~ " scenes tagged scene_" ~ t ~ " + " ~ area ~ " with NO mode qualifier on any of them (" ~ (_no_mode_unqualified | join(', ')) ~ ") — genuinely indistinguishable, picking '" ~ (_no_mode_unqualified | first) ~ "' by list order. Pick one, pull the label off the other."] -%}
                  {%- endif -%}
                  {%- set ns.row = {'_fallback_any_mode': _no_mode} -%}
                  {%- for m in _rw_home_mode_labels -%}
                    {%- set _mode_ents = label_entities(m) -%}
                    {%- set _with_mode_all = (_state_scene_ents | intersect(_rw_room_ents) | intersect(_mode_ents) | select('match', 'scene\\.') | list) -%}
                    {%- set _with_mode = (_with_mode_all | first) | default(none, true) -%}
                    {%- if _with_mode_all | count > 1 -%}
                      {%- set ns.warnings = ns.warnings + ["AMBIGUOUS: " ~ (_with_mode_all | count | string) ~ " scenes tagged scene_" ~ t ~ " + " ~ area ~ " + " ~ m ~ " (" ~ (_with_mode_all | join(', ')) ~ ") — picking '" ~ _with_mode ~ "' by list order, not intent. Pick one, pull the label off the other."] -%}
                    {%- endif -%}
                    {%- set ns.row = ns.row | combine({m: (_with_mode if _with_mode is not none else _no_mode)}) -%}
                  {%- endfor -%}
                  {%- set _direct_covered = (ns.row.values() | reject('eq', none) | list | count) > 0 -%}
                  {#- STATE INHERITANCE (2026-08-06, Design note: "engaged and
                      cleaning should inherit occupied if no specific scene
                      for timeslice", then emergency added: "default to the
                      occupied", then "asleep with no asleep scene fire
                      vacant") — mirrors zen_reflex_dispatch.yaml Stage 2
                      exactly, so this read stays truthful about what
                      actually fires. TWO different inheritance targets:
                      engaged/cleaning/emergency borrow from occupied
                      (occupied-flavored — someone's here, act like it);
                      asleep borrows from vacant (NOT occupied-flavored — a
                      room with no dedicated sleep scene should go dark/
                      safe, not light up like someone's awake). _rw_states
                      orders vacant before asleep and occupied before the
                      other three, so the row being borrowed from is
                      always already in ns.d by the time it's needed. Only
                      these four states inherit; checking/paused/
                      automation/vacant itself never borrow — no sensible
                      state to borrow from. A dedicated scene tag always
                      wins over this fallback. -#}
                  {%- set _inherit_map = {'engaged': 'occupied', 'cleaning': 'occupied', 'emergency': 'occupied', 'asleep': 'vacant'} -%}
                  {%- set _inherit_from = _inherit_map.get(t, '') -%}
                  {%- if _inherit_from != '' and _inherit_from in ns.d -%}
                    {%- set _src_row = ns.d[_inherit_from] -%}
                    {%- for k in (['_fallback_any_mode'] + _rw_home_mode_labels) -%}
                      {%- if ns.row.get(k) is none and _src_row.get(k) is not none -%}
                        {%- set ns.row = ns.row | combine({k: _src_row.get(k)}) -%}
                      {%- endif -%}
                    {%- endfor -%}
                  {%- endif -%}
                  {#- STATUS (2026-08-07, ticket #10287, Friday: "states
                      without assigned scenes are not automatically shown
                      as missing"). wired = at least one cell had a direct
                      scene_<t> tag before inheritance ran. inherited = no
                      direct tag, but inheritance filled at least one cell.
                      ok_by_design = still fully null AND t is one of
                      checking/paused/automation — an intentional safe
                      no-op, not incomplete work. gap = still fully null
                      and NOT one of those three (includes vacant — most
                      households do want a vacant scene). -#}
                  {%- set _any_covered = (ns.row.values() | reject('eq', none) | list | count) > 0 -%}
                  {%- set _status = 'wired' if _direct_covered else ('inherited' if _any_covered else ('ok_by_design' if t in _rw_noop_states else 'gap')) -%}
                  {%- set ns.status = ns.status | combine({t: _status}) -%}
                  {%- set ns.d = ns.d | combine({t: ns.row}) -%}
                {%- endfor -%}
                {{ {'matrix': ns.d, 'warnings': ns.warnings, 'tier_status': ns.status} }}
              # DETAIL (2026-08-06, Design note: "enough to give us an idea
              # about what the scenes gonna do if we do a /detail flag on
              # the matrix?" -> "does it return any relevant attr if req?"
              # -> "we can show current state and attr"). Opt-in via
              # reflex_wire_detail=true — for every DISTINCT scene
              # entity_id anywhere in the matrix (dedup'd), pull its
              # member entity_id list, PLUS each member's CURRENT live
              # state + a lean attribute subset (brightness/color_temp_
              # kelvin/rgb_color when present). NOT what the scene will
              # SET them to — HA doesn't expose a scene's captured
              # per-entity values through any state/attribute/template
              # function, that only lives in the scene's config entry,
              # unreachable from here. This is "what's each light doing
              # right now," useful context but not a scene-content preview.
              _rw_scene_details: >-
                {%- if (reflex_wire_detail | default(false) | bool) -%}
                  {%- set ns2 = namespace(seen=[], d={}) -%}
                  {%- for row in _rw_wired_matrix.matrix.values() -%}
                    {%- for v in row.values() -%}
                      {%- if v is not none and v not in ns2.seen -%}
                        {%- set ns2.seen = ns2.seen + [v] -%}
                        {%- set _members = (state_attr(v, 'entity_id') | default([], true)) -%}
                        {%- set _member_states = namespace(d={}) -%}
                        {%- set _member_areas = namespace(list=[]) -%}
                        {%- for me in _members -%}
                          {%- set _member_states.d = _member_states.d | combine({me: {'state': states(me), 'brightness': state_attr(me, 'brightness'), 'color_temp_kelvin': state_attr(me, 'color_temp_kelvin'), 'rgb_color': state_attr(me, 'rgb_color'), 'labels': labels(me), 'area_id': area_id(me)}}) -%}
                          {%- if area_id(me) is not none and area_id(me) not in _member_areas.list -%}
                            {%- set _member_areas.list = _member_areas.list + [area_id(me)] -%}
                          {%- endif -%}
                        {%- endfor -%}
                        {#- outside_room: any member area_id other than this
                            room itself — flags a scene reaching outside
                            its own labeled room, which may be intentional
                            (a linked/shared fixture) or a real mistagging
                            bug, worth a human glance either way. -#}
                        {%- set ns2.d = ns2.d | combine({v: {'friendly_name': (state_attr(v, 'friendly_name') | default(v, true)), 'member_entities': _members, 'member_areas': _member_areas.list, 'outside_room': (_member_areas.list | reject('eq', area) | list), 'member_current_state': _member_states.d}}) -%}
                      {%- endif -%}
                    {%- endfor -%}
                  {%- endfor -%}
                  {{ ns2.d }}
                {%- else -%}
                  {{ none }}
                {%- endif -%}
          - variables:
              _result:
                status: ok
                mode: reflex_wire
                area: "{{ area }}"
                candidate_scenes: "{{ _rw_candidates }}"
                tier_coverage: "{{ _rw_tier_coverage }}"
                wired_matrix: "{{ _rw_wired_matrix.matrix }}"
                tier_status: "{{ _rw_wired_matrix.tier_status }}"
                wiring_warnings: "{{ _rw_wired_matrix.warnings }}"
                scene_details: "{{ _rw_scene_details }}"
                home_mode_daypart_labels: "{{ _rw_home_mode_labels }}"
                usage: "Pass reflex_assignments=['scene.x|state|mode', ...] (mode optional) + confirm_action=true to apply. Format: entity_id|state|mode. wired_matrix[state][mode] shows exactly what would fire for that condition right now (same resolution as REFLEX Stage 2, inside automation.zenos_room_manager_dispatch); null alone doesn't tell you whether that's expected — check tier_status[state] instead: 'wired' or 'inherited' = covered, 'gap' = genuinely incomplete/worth wiring, 'ok_by_design' (checking/paused/automation only) = intentional safe no-op, not a gap. wiring_warnings flags any slot with 2+ scenes tagged for the same condition — the resolver picks one by list order, not intent; pick one and untag the other."
                caller_token: "{{ _caller_token }}"
          - stop: reflex_wire read done
            response_variable: _result

      # ═══════════════════════════════════════════════════════════════════════
      # 2b. LABEL_DISCOVER (2026-08-05) — "do we have a discover mode that
      #     exposes all the various classes and allows the agent to see what
      #     qualifies for triggers, and how to apply labels in one shot?"
      #     Same precedent as presence_mode=discover (BPS candidates), now
      #     for the full v3 room-state label taxonomy. Scans area_entities(),
      #     maps device_class/domain to a candidate class label per the
      #     purpose-trigger survey (motion/occupied/engaged/window/
      #     garage_door/moisture/smoke/carbon_monoxide/siren/privacy_door/
      #     wasp_door/window_covering/hvac_vent), skips anything already
      #     carrying its suggested label. Preview by default (dry_run — the
      #     hard rule everywhere in this codebase: never self-confirm).
      #     confirm_action=true applies ALL shown suggestions in one shot by
      #     looping script.zen_dojotools_labels — review the preview first,
      #     especially low-confidence entries (locks, generic doors/gas,
      #     which cover layer to tag).
      # ═══════════════════════════════════════════════════════════════════════
      - if: "{{ _mode == 'label_discover' }}"
        then:
          - if: "{{ _area_id == '' }}"
            then:
              - variables:
                  _result: {status: error, mode: label_discover, message: "area= required.", caller_token: "{{ _caller_token }}"}
              - stop: label_discover error
                response_variable: _result
          - variables:
              _ld_candidates: >-
                {%- set ns = namespace(items=[]) -%}
                {%- for e in area_entities(_area_id) -%}
                  {%- set _domain = e.split('.')[0] -%}
                  {%- set _dc = state_attr(e, 'device_class') | default('', true) -%}
                  {%- set _existing = labels(e) -%}
                  {%- set _fname = state_attr(e, 'friendly_name') | default(e, true) -%}
                  {%- set _sig = namespace(label='', conf='') -%}
                  {%- if _domain == 'binary_sensor' and _dc == 'motion' -%}{%- set _sig.label='motion' -%}{%- set _sig.conf='high' -%}
                  {%- elif _domain == 'binary_sensor' and _dc == 'occupancy' -%}{%- set _sig.label='occupied' -%}{%- set _sig.conf='high — or bed_occupancy instead if this is specifically a bed sensor' -%}
                  {%- elif _domain == 'binary_sensor' and _dc == 'presence' -%}{%- set _sig.label='occupied' -%}{%- set _sig.conf='medium' -%}
                  {%- elif _domain == 'binary_sensor' and _dc == 'door' -%}{%- set _sig.label='wasp_door' -%}{%- set _sig.conf='medium — verify this is a room entry/exit door, not an appliance/cabinet door' -%}
                  {%- elif _domain == 'binary_sensor' and _dc == 'window' -%}{%- set _sig.label='window' -%}{%- set _sig.conf='high' -%}
                  {%- elif _domain == 'binary_sensor' and _dc == 'garage_door' -%}{%- set _sig.label='garage_door' -%}{%- set _sig.conf='high' -%}
                  {%- elif _domain == 'binary_sensor' and _dc == 'moisture' -%}{%- set _sig.label='moisture' -%}{%- set _sig.conf='high' -%}
                  {%- elif _domain == 'binary_sensor' and _dc == 'smoke' -%}{%- set _sig.label='smoke' -%}{%- set _sig.conf='high' -%}
                  {%- elif _domain == 'binary_sensor' and _dc == 'carbon_monoxide' -%}{%- set _sig.label='carbon_monoxide' -%}{%- set _sig.conf='high' -%}
                  {%- elif _domain == 'binary_sensor' and _dc == 'gas' -%}{%- set _sig.label='carbon_monoxide' -%}{%- set _sig.conf='low — generic gas leak, confirm this is actually CO-relevant before tagging' -%}
                  {%- elif _domain == 'media_player' -%}{%- set _sig.label='engaged' -%}{%- set _sig.conf='high' -%}
                  {%- elif _domain == 'siren' -%}{%- set _sig.label='siren' -%}{%- set _sig.conf='high' -%}
                  {%- elif _domain == 'lock' -%}{%- set _sig.label='privacy_door' -%}{%- set _sig.conf="low — only if THIS lock is meant to throw Hold; not every lock is a privacy latch. ANTI-PATTERN: never tag a lock as the room's occupancy/wasp_door signal — lock state (locked/unlocked) doesn't track crossing a threshold the way a door contact does. If a paired binary_sensor.*door* exists for the same physical opening, that's the wasp_door candidate; the lock stays security-exposure-only (ext_lock/privacy_door). Real example: garage<->front_hall shared entry — lock.garage_entry_door got tagged ext_lock (informational, correct) while binary_sensor.garage_entry_door (the actual door, already carrying wasp_door) never got wired into garage's own trigger_entities, leaving garage structurally blind to anyone standing at that doorway until caught live 2026-08-08." -%}
                  {%- elif _domain == 'cover' and _dc == 'garage' -%}{%- set _sig.label='garage_door' -%}{%- set _sig.conf='high' -%}
                  {%- elif _domain == 'cover' and _dc in ['shade','blind','curtain','awning','shutter','window'] -%}{%- set _sig.label='window_covering' -%}{%- set _sig.conf='medium — tag ONLY the aggregate cover if this room has several layers (rods/blinds), not every individual one' -%}
                  {%- elif _domain == 'cover' and _dc == 'damper' -%}{%- set _sig.label='hvac_vent' -%}{%- set _sig.conf='medium — HA has no dedicated vent device_class, damper is the closest fit, verify' -%}
                  {%- endif -%}
                  {%- if _sig.label != '' and _sig.label not in _existing -%}
                    {%- set ns.items = ns.items + [{'entity_id': e, 'friendly_name': _fname, 'domain': _domain, 'device_class': _dc, 'suggested_label': _sig.label, 'confidence': _sig.conf, 'existing_labels': _existing}] -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.items }}
          # GROUP WARNINGS (2026-08-05, design note): "better to pull in an
          # aggregate group of doors/covers/motions et al so they can be
          # dealt with as a group as far as the system is concerned" —
          # when N>1 candidates share the same suggested_label in this
          # area, recommend an aggregate entity over tagging each one
          # individually. The system treats a class as ONE signal per
          # room either way (label_entities() intersection just needs
          # ANY truthy match) — an aggregate keeps that a clean 1:1
          # instead of N separate entities all meaning the same thing.
          - variables:
              _ld_group_counts: >-
                {%- set ns = namespace(counts={}) -%}
                {%- for c in _ld_candidates -%}
                  {%- set k = c.suggested_label -%}
                  {%- set ns.counts = ns.counts | combine({k: (ns.counts.get(k, 0) + 1)}) -%}
                {%- endfor -%}
                {{ ns.counts }}
              _ld_group_warnings: >-
                {%- set ns = namespace(items=[]) -%}
                {%- for k in _ld_group_counts.keys() -%}
                  {%- if _ld_group_counts[k] > 1 -%}
                    {%- set ns.items = ns.items + [k ~ ': ' ~ _ld_group_counts[k] ~ ' separate candidates found. Prefer creating/using ONE aggregate entity (e.g. a template cover/binary_sensor group spanning all of them) and tagging just that, instead of tagging each individually — the system only needs one truthy match per class per room either way.'] -%}
                  {%- endif -%}
                {%- endfor -%}
                {%- if _ld_group_counts.get('privacy_door', 0) > 0 and _ld_group_counts.get('wasp_door', 0) > 0 -%}
                  {%- set ns.items = ns.items + ["LOCK+DOOR PAIRED IN THIS ROOM (2026-08-08 anti-pattern guard): both a lock and a door candidate were found. Tag the DOOR (wasp_door) as the room's occupancy/threshold signal — never the lock (privacy_door). A lock's locked/unlocked state doesn't track someone crossing the threshold; a door's open/closed contact does. If they're the same physical opening, verify BOTH the door is in trigger_entities AND has a checking_timer wired — a lock-only tagging looks complete but leaves the room blind to that doorway (see garage/front_hall real incident in the privacy_door confidence note above)."] -%}
                {%- endif -%}
                {{ ns.items }}
          - if: "{{ not (confirm_action | default(false) | bool) }}"
            then:
              - variables:
                  _result:
                    status: preview
                    mode: label_discover
                    area_id: "{{ _area_id }}"
                    candidate_count: "{{ _ld_candidates | count }}"
                    candidates: "{{ _ld_candidates }}"
                    group_warnings: "{{ _ld_group_warnings if _ld_group_warnings | count > 0 else none }}"
                    see_also: "This mode ONLY classifies occupancy-relevant device_classes (motion/occupied/engaged/window/etc) — it deliberately skips managed-device internals (3D printers, docks, servers), diagnostics, and battery/connectivity entities. Calendar/tasks/schedules for this room are NOT shown here at all: call mode=get area={{ _area_id }} context_slices=+calendar,+tasks,+conductor for upcoming events, todo items, and the AI schedule queue. Also available: +inventory, +chores, +security, +catalog for the rest of the room picture."
                    message: "Preview only — review confidence notes (especially low/medium) AND group_warnings (multi-candidate classes — aggregate first, see project_room_manager_v3_design memory) before applying. Pass confirm_action: true to tag ALL of the above in one shot (room label '{{ _area_id }}' + each suggested_label) — this ALSO migrates any legacy zen_<label> to the new plain label on each tagged entity. Each candidate is only shown once — already-labeled entities (carrying their suggested label) are excluded."
                    caller_token: "{{ _caller_token }}"
              - stop: label_discover preview
                response_variable: _result
          # APPLY + LEGACY MIGRATION (2026-08-05, Design note: "change the
          # legacy labels to new style"): tag the new label, and if this
          # entity still carries the OLD zen_<label> equivalent (v2
          # taxonomy), untag it in the same pass — a real migration, not
          # just an addition alongside stale labels.
          - repeat:
              for_each: "{{ _ld_candidates }}"
              sequence:
                - action: script.zen_dojotools_labels
                  data:
                    mode: tag
                    label_list: ["{{ repeat.item.suggested_label }}", "{{ _area_id }}"]
                    target_entities: ["{{ repeat.item.entity_id }}"]
                    confirm: true
                - if: "{{ ('zen_' ~ repeat.item.suggested_label) in repeat.item.existing_labels }}"
                  then:
                    - action: script.zen_dojotools_labels
                      data:
                        mode: untag
                        label_list: ["zen_{{ repeat.item.suggested_label }}"]
                        target_entities: ["{{ repeat.item.entity_id }}"]
                        confirm: true
          - variables:
              _result:
                status: ok
                mode: label_discover
                area_id: "{{ _area_id }}"
                applied_count: "{{ _ld_candidates | count }}"
                applied: "{{ _ld_candidates }}"
                message: "Applied {{ _ld_candidates | count }} label(s) — each entity tagged with its suggested_label + the room label '{{ _area_id }}'."
                caller_token: "{{ _caller_token }}"
          - stop: label_discover applied
            response_variable: _result

      # ═══════════════════════════════════════════════════════════════════════
      # 3. SET
      # ═══════════════════════════════════════════════════════════════════════
      - if: "{{ _mode == 'set' }}"
        then:
          - variables:
              _hh_write: >-
                {{ (rally_point is defined and rally_point is not none and (rally_point|string)|trim != '')
                   or (zip_code is defined and zip_code is not none and (zip_code|string)|trim != '')
                   or (address is defined and address is not none and (address|string)|trim != '')
                   or (spatial_config is defined and spatial_config is not none and spatial_config is mapping)
                   or (default_room is defined and default_room is not none and (default_room|string)|trim != '') }}

          - if: "{{ _hh_cabinet == '' or (_area_id == '' and not _hh_write) }}"
            then:
              - variables:
                  _result: >-
                    {%- if _hh_cabinet == '' -%}
                    {{ {'status': 'error', 'mode': 'set', 'message': "Household cabinet not found. Ensure the 'Zen Household Cabinet' label is assigned to the household cabinet sensor entity before using RM topology writes.", 'action': "Check HA Labels UI — find your household cabinet sensor and assign label 'Zen Household Cabinet'.", 'caller_token': _caller_token} }}
                    {%- else -%}
                    {{ {'status': 'error', 'mode': 'set', 'message': "area= required (or rally_point=/zip_code= for household-level write).", 'caller_token': _caller_token} }}
                    {%- endif -%}
              - stop: set error
                response_variable: _result

          # Write household_profile fields if any provided (rally_point, zip_code — no area= needed)
          - if: "{{ _hh_write }}"
            then:
              - action: script.zen_dojotools_filecabinet
                data:
                  action_type: >-
                    {%- set _cv=state_attr(_hh_cabinet,'variables')|default({},true) -%}
                    {{ 'update' if _cv.get('household_profile',none) is not none else 'create' }}
                  key: household_profile
                  volume_entity_id: "{{ _hh_cabinet }}"
                  value: >-
                    {%- set _hp=(state_attr(_hh_cabinet,'variables')|default({},true)).get('household_profile',none) -%}
                    {%- set _hpd=_hp if _hp is mapping else (_hp|from_json if _hp is string and _hp|trim not in ['None','none','','null'] else {}) -%}
                    {%- set _hpd=_hpd.get('value', _hpd) if _hpd is mapping else {} -%}
                    {%- set _hpu=_hpd if _hpd is mapping else {} -%}
                    {%- if rally_point is defined and rally_point is not none and (rally_point|string)|trim != '' -%}
                      {%- set _hpu=_hpu|combine({'rally_point':(rally_point|string)|trim}) -%}
                    {%- endif -%}
                    {%- if zip_code is defined and zip_code is not none and (zip_code|string)|trim != '' -%}
                      {%- set _hpu=_hpu|combine({'zip_code':(zip_code|string)|trim}) -%}
                    {%- endif -%}
                    {%- if address is defined and address is not none and (address|string)|trim != '' -%}
                      {%- set _hpu=_hpu|combine({'address':(address|string)|trim}) -%}
                    {%- endif -%}
                    {%- if spatial_config is defined and spatial_config is not none and spatial_config is mapping -%}
                      {%- set _sc=_hpu.get('spatial_config',{})|default({},true) -%}
                      {%- set _sc=_sc if _sc is mapping else {} -%}
                      {%- set _hpu=_hpu|combine({'spatial_config':_sc|combine(spatial_config)}) -%}
                    {%- endif -%}
                    {%- if default_room is defined and default_room is not none and (default_room|string)|trim != '' -%}
                      {%- set _hpu=_hpu|combine({'default_room':(default_room|string)|trim}) -%}
                    {%- endif -%}
                    {{ _hpu | tojson }}
                response_variable: _rp_fc_result

          # Household-level-only call (no area=) — return now
          - if: "{{ _area_id == '' }}"
            then:
              - variables:
                  _result:
                    status: ok
                    mode: set
                    rally_point_written: "{{ (rally_point|string)|trim if (rally_point is defined and rally_point is not none and (rally_point|string)|trim != '') else none }}"
                    zip_code_written: "{{ (zip_code|string)|trim if (zip_code is defined and zip_code is not none and (zip_code|string)|trim != '') else none }}"
                    address_written: "{{ (address|string)|trim if (address is defined and address is not none and (address|string)|trim != '') else none }}"
                    default_room_written: "{{ (default_room|string)|trim if (default_room is defined and default_room is not none and (default_room|string)|trim != '') else none }}"
                    household_profile_status: "{{ _rp_fc_result.status | default('error') }}"
                    caller_token: "{{ _caller_token }}"
              - stop: set household profile
                response_variable: _result

          # Schema validation — one portal/window per call; required routing fields enforced
          - variables:
              _schema_errors: >-
                {%- set _vpt=['door','archway','passage'] -%}
                {%- set _vno=['open','closed'] -%}
                {%- set _vwd=['N','NE','E','SE','S','SW','W','NW'] -%}
                {%- set _vwt=['single','double','sliding','casement','fixed','skylight'] -%}
                {%- set ns=namespace(e=[]) -%}
                {%- if portals is defined and portals is not none -%}
                  {%- if portals is not mapping -%}{%- set ns.e=ns.e+['portals: must be a single dict (one portal per call)'] -%}{%- else -%}
                    {%- if portals.get('type','') not in _vpt -%}{%- set ns.e=ns.e+['portals: type required (door|archway|passage)'] -%}{%- endif -%}
                    {%- if portals.get('normally','') not in _vno -%}{%- set ns.e=ns.e+['portals: normally required (open|closed)'] -%}{%- endif -%}
                    {%- if 'exterior' not in portals -%}{%- set ns.e=ns.e+['portals: exterior (bool) required'] -%}{%- endif -%}
                    {%- if 'exit' not in portals -%}{%- set ns.e=ns.e+['portals: exit (bool) required'] -%}{%- endif -%}
                    {%- if 'emerg_exit' not in portals -%}{%- set ns.e=ns.e+['portals: emerg_exit (bool) required'] -%}{%- endif -%}
                  {%- endif -%}
                {%- endif -%}
                {%- if windows is defined and windows is not none -%}
                  {%- if windows is not mapping -%}{%- set ns.e=ns.e+['windows: must be a single dict (one window per call)'] -%}{%- else -%}
                    {%- if windows.get('direction','') not in _vwd -%}{%- set ns.e=ns.e+['windows: direction required (N|NE|E|SE|S|SW|W|NW)'] -%}{%- endif -%}
                    {%- if windows.get('type','') not in _vwt -%}{%- set ns.e=ns.e+['windows: type required (single|double|sliding|casement|fixed|skylight)'] -%}{%- endif -%}
                    {%- if 'exit' not in windows -%}{%- set ns.e=ns.e+['windows: exit (bool) required'] -%}{%- endif -%}
                    {%- if 'emerg_exit' not in windows -%}{%- set ns.e=ns.e+['windows: emerg_exit (bool) required'] -%}{%- endif -%}
                    {%- if 'drop_ft' not in windows -%}{%- set ns.e=ns.e+['windows: drop_ft (number, 0=ground) required'] -%}{%- endif -%}
                  {%- endif -%}
                {%- endif -%}
                {%- if area_override is defined and area_override is not none -%}
                  {%- if area_override_reason is not defined or area_override_reason|default('',true)|trim == '' -%}
                    {%- set ns.e=ns.e+['area_override requires area_override_reason — explain why measured area differs from length×width'] -%}
                  {%- endif -%}
                {%- endif -%}
                {%- if length is defined and length is not none and (width is not defined or width is none) -%}
                  {%- set ns.e=ns.e+['width required when length is provided'] -%}
                {%- endif -%}
                {{ ns.e }}

          - if: "{{ _schema_errors | length > 0 }}"
            then:
              - variables:
                  _result: {status: error, mode: set, message: "Schema validation failed.", errors: "{{ _schema_errors }}", area_id: "{{ _area_id }}", caller_token: "{{ _caller_token }}"}
              - stop: set schema_error
                response_variable: _result

          # Build merged room entry as native dict; check is_new
          # Both keys read cabinet independently (sibling keys can't cross-reference)
          - variables:
              _set_merged: >-
                {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}{%- set topo = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'room_topology') | from_json -%}
                {%- set _existing=topo.get(_area_id,{}) -%}
                {%- set _ex0=_existing if _existing is mapping else {} -%}
                {%- set _skip=['display_name','floor_level'] -%}
                {%- set ns=namespace(p={}) -%}
                {%- for _k,_v in _ex0.items() -%}{%- if _k not in _skip -%}{%- set ns.p=ns.p|combine({_k:_v}) -%}{%- endif -%}{%- endfor -%}

                {%- if walls is defined and walls is not none -%}{%- set ns.p=ns.p|combine({'walls':walls|int}) -%}{%- endif -%}
                {%- if tax_bucket is defined and tax_bucket is not none and tax_bucket|trim != '' -%}{%- set ns.p=ns.p|combine({'tax_bucket':tax_bucket|trim}) -%}{%- endif -%}

                {%- if clear_portals is defined and clear_portals -%}{%- set ns.p=ns.p|combine({'portals':[]}) -%}{%- endif -%}
                {%- if portals is defined and portals is not none and portals is mapping -%}
                  {%- set _ep=ns.p.get('portals',[])|list -%}
                  {%- set _pname=portals.get('name',none) -%}
                  {%- set _pto=portals.get('to',none) -%}
                  {%- if _pname is not none -%}
                    {%- set _named=_ep|rejectattr('name','eq',_pname)|selectattr('name','defined')|list -%}{%- set _unnamed=_ep|rejectattr('name','defined')|rejectattr('to','eq',_pto)|list -%}{%- set ns.p=ns.p|combine({'portals':_named+_unnamed+[portals]}) -%}
                  {%- elif _pto is not none -%}
                    {%- set ns.p=ns.p|combine({'portals':(_ep|rejectattr('to','eq',_pto)|list)+[portals]}) -%}
                  {%- else -%}
                    {%- set ns.p=ns.p|combine({'portals':_ep+[portals]}) -%}
                  {%- endif -%}
                {%- endif -%}
                {%- set _padj=ns.p.get('portals',[])|selectattr('to','defined')|map(attribute='to')|select('string')|list -%}{%- set ns.p=ns.p|combine({'adjacent':(ns.p.get('adjacent',[])|select('string')|list+_padj)|unique|list}) -%}
                {%- if clear_windows is defined and clear_windows -%}{%- set ns.p=ns.p|combine({'windows':[]}) -%}{%- endif -%}
                {%- if windows is defined and windows is not none and windows is mapping -%}
                  {%- set _ew=ns.p.get('windows',[])|list -%}
                  {%- set _wname=windows.get('name',none) -%}
                  {%- set _wdir=windows.get('direction',none) -%}
                  {%- if _wname is not none -%}
                    {%- set ns.p=ns.p|combine({'windows':(_ew|rejectattr('name','eq',_wname)|list)+[windows]}) -%}
                  {%- elif _wdir is not none -%}
                    {%- set ns.p=ns.p|combine({'windows':(_ew|rejectattr('direction','eq',_wdir)|list)+[windows]}) -%}
                  {%- else -%}
                    {%- set ns.p=ns.p|combine({'windows':_ew+[windows]}) -%}
                  {%- endif -%}
                {%- endif -%}
                {%- if clear_occupants is defined and clear_occupants -%}{%- set ns.p=ns.p|combine({'occupants':[]}) -%}{%- endif -%}
                {%- if occupant is defined and occupant is not none and occupant|trim != '' -%}
                  {%- set _eo=ns.p.get('occupants',[])|list -%}
                  {%- if occupant|trim not in _eo -%}{%- set ns.p=ns.p|combine({'occupants':_eo+[occupant|trim]}) -%}{%- endif -%}
                {%- endif -%}
                {%- if clear_safety is defined and clear_safety -%}{%- set ns.p=ns.p|combine({'safety':[]}) -%}{%- endif -%}
                {%- if safety is defined and safety is not none and safety is mapping -%}
                  {%- set _es=ns.p.get('safety',[])|list -%}
                  {%- set _sname=safety.get('name',none) -%}
                  {%- if _sname is not none -%}
                    {%- set ns.p=ns.p|combine({'safety':(_es|rejectattr('name','eq',_sname)|list)+[safety]}) -%}
                  {%- else -%}
                    {%- set ns.p=ns.p|combine({'safety':_es+[safety]}) -%}
                  {%- endif -%}
                {%- endif -%}
                {%- if description is defined and description is not none -%}{%- set ns.p=ns.p|combine({'description':description|string}) -%}{%- endif -%}
                {%- if grocy_location_id is defined and grocy_location_id is not none and grocy_location_id|trim != '' -%}{%- set ns.p=ns.p|combine({'grocy_location_id':grocy_location_id|trim}) -%}{%- endif -%}
                {%- if wiki_path is defined and wiki_path is not none and wiki_path|trim != '' -%}{%- set ns.p=ns.p|combine({'wiki_path':wiki_path|trim}) -%}{%- endif -%}
                {%- if exterior is defined and exterior is not none -%}{%- set ns.p=ns.p|combine({'exterior':exterior}) -%}{%- endif -%}
                {%- if parent_area_id is defined and parent_area_id is not none and parent_area_id|trim != '' -%}{%- set ns.p=ns.p|combine({'parent_area_id':parent_area_id|trim}) -%}{%- endif -%}
                {%- if shelter_eligible is defined and shelter_eligible is not none -%}{%- set ns.p=ns.p|combine({'shelter_eligible':shelter_eligible}) -%}{%- endif -%}
                {%- if area_note is defined and area_note is not none -%}{%- set ns.p=ns.p|combine({'area_note':area_note|string}) -%}{%- endif -%}
                {%- if clear_room_zones is defined and clear_room_zones -%}{%- set ns.p=ns.p|combine({'room_zones':[]}) -%}{%- endif -%}
                {%- if room_zone is defined and room_zone is not none and room_zone is mapping -%}
                  {%- set _ez=ns.p.get('room_zones',[])|list -%}
                  {%- set _zname=room_zone.get('name',none) -%}
                  {%- if _zname is not none -%}
                    {%- set ns.p=ns.p|combine({'room_zones':(_ez|rejectattr('name','eq',_zname)|list)+[room_zone]}) -%}
                  {%- else -%}
                    {%- set ns.p=ns.p|combine({'room_zones':_ez+[room_zone]}) -%}
                  {%- endif -%}
                {%- endif -%}
                {%- if clear_landmarks is defined and clear_landmarks -%}{%- set ns.p=ns.p|combine({'landmarks':[]}) -%}{%- endif -%}
                {%- if landmark is defined and landmark is not none and landmark is mapping -%}
                  {%- set _el=ns.p.get('landmarks',[])|list -%}
                  {%- set _lname=landmark.get('name',none) -%}
                  {%- if _lname is not none -%}
                    {%- set ns.p=ns.p|combine({'landmarks':(_el|rejectattr('name','eq',_lname)|list)+[landmark]}) -%}
                  {%- else -%}
                    {%- set ns.p=ns.p|combine({'landmarks':_el+[landmark]}) -%}
                  {%- endif -%}
                {%- endif -%}
                {%- if spatial_meta is defined and spatial_meta is not none and spatial_meta is mapping -%}
                  {%- set _sm=ns.p.get('spatial_meta',{})|default({},true) -%}
                  {%- set _sm=_sm if _sm is mapping else {} -%}
                  {%- set ns.p=ns.p|combine({'spatial_meta':_sm|combine(spatial_meta)}) -%}
                {%- endif -%}
                {%- if length is defined and length is not none and width is defined and width is not none -%}
                  {%- set _len=length|float -%}
                  {%- set _wid=width|float -%}
                  {%- set _u=(unit|default('ft','true')|lower|trim) -%}
                  {%- set _ac=_len*_wid -%}
                  {%- set _sqft=_ac if _u=='ft' else (_ac*10.764 if _u=='m' else none) -%}
                  {%- set _sqm=(_sqft*0.0929) if _sqft is not none else none -%}
                  {%- if area_override is defined and area_override is not none -%}
                    {%- set _aov=area_override|float -%}
                    {%- set _sqft=_aov if _u=='ft' else (_aov*10.764 if _u=='m' else none) -%}
                    {%- set _sqm=(_sqft*0.0929) if _sqft is not none else none -%}
                    {%- set ns.p=ns.p|combine({'length':_len,'width':_wid,'unit':_u,'area_calc':_ac,'area_sqft':_sqft,'area_sqm':_sqm,'area_override':_aov,'area_override_reason':area_override_reason|default('',true)|trim}) -%}
                  {%- else -%}
                    {%- set ns.p=ns.p|combine({'length':_len,'width':_wid,'unit':_u,'area_calc':_ac,'area_sqft':_sqft,'area_sqm':_sqm}) -%}
                  {%- endif -%}
                {%- endif -%}
                {%- if home_office_claimed is defined and home_office_claimed is not none -%}
                  {%- set ns.p=ns.p|combine({'home_office_claimed':home_office_claimed|bool}) -%}
                {%- endif -%}
                {{ ns.p }}
              _set_is_new: >-
                {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}{%- set topo = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'room_topology') | from_json -%}
                {{ _area_id not in topo }}

          - if: "{{ _dry_run }}"
            then:
              - variables:
                  _result:
                    status: dry_run
                    mode: set
                    area_id: "{{ _area_id }}"
                    would_write: "{{ _set_merged }}"
                    is_new_room: "{{ _set_is_new }}"
                    rally_point_would_write: "{{ (rally_point|string)|trim if (rally_point is defined and rally_point is not none and (rally_point|string)|trim != '') else none }}"
                    zip_code_would_write: "{{ (zip_code|string)|trim if (zip_code is defined and zip_code is not none and (zip_code|string)|trim != '') else none }}"
                    address_would_write: "{{ (address|string)|trim if (address is defined and address is not none and (address|string)|trim != '') else none }}"
                    caller_token: "{{ _caller_token }}"
              - stop: set dry_run
                response_variable: _result

          - action: script.zen_dojotools_filecabinet
            data:
              action_type: >-
                {%- set _cv=state_attr(_hh_cabinet,'variables')|default({},true) -%}
                {{ 'update' if _cv.get('room_topology',none) is not none else 'create' }}
              key: room_topology
              volume_entity_id: "{{ _hh_cabinet }}"
              value: >-
                {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                {%- set topo = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'room_topology') | from_json -%}
                {{ (topo | combine({_area_id: _set_merged})) | tojson }}
            response_variable: _fc_result

          - action: script.zen_dojotools_labels
            data:
              action_type: tag
              label_list:
                - room_layout
              target_areas:
                - "{{ _area_id }}"
              confirm: true
            response_variable: _label_result

          - variables:
              _result:
                status: ok
                mode: set
                area_id: "{{ _area_id }}"
                written: "{{ _set_merged }}"
                is_new_room: "{{ _set_is_new }}"
                room_layout_tagged: "{{ (_label_result.status | default('error')) == 'ok' }}"
                rally_point_written: "{{ (rally_point|string)|trim if (rally_point is defined and rally_point is not none and (rally_point|string)|trim != '') else none }}"
                zip_code_written: "{{ (zip_code|string)|trim if (zip_code is defined and zip_code is not none and (zip_code|string)|trim != '') else none }}"
                address_written: "{{ (address|string)|trim if (address is defined and address is not none and (address|string)|trim != '') else none }}"
                caller_token: "{{ _caller_token }}"
          - stop: set
            response_variable: _result

      # ═══════════════════════════════════════════════════════════════════════
      # 4. LINK
      # ═══════════════════════════════════════════════════════════════════════
      - if: "{{ _mode == 'link' }}"
        then:
          - if: "{{ _area_id == '' or _area_b_id == '' or _hh_cabinet == '' }}"
            then:
              - variables:
                  _result: {status: error, mode: link, message: "area= and area_b= both required.", caller_token: "{{ _caller_token }}"}
              - stop: link error
                response_variable: _result

          - variables:
              _pt: "{{ portal_type | default('door') }}"
              _pn: "{{ portal_normally | default('closed') }}"

          - if: "{{ _dry_run }}"
            then:
              - variables:
                  _result:
                    status: dry_run
                    mode: link
                    area_a: "{{ _area_id }}"
                    area_b: "{{ _area_b_id }}"
                    portal_type: "{{ _pt }}"
                    portal_normally: "{{ _pn }}"
                    caller_token: "{{ _caller_token }}"
              - stop: link dry_run
                response_variable: _result

          - action: script.zen_dojotools_filecabinet
            data:
              action_type: >-
                {%- set _cv=state_attr(_hh_cabinet,'variables')|default({},true) -%}
                {{ 'update' if _cv.get('room_topology',none) is not none else 'create' }}
              key: room_topology
              volume_entity_id: "{{ _hh_cabinet }}"
              value: >-
                {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}{%- set topo = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'room_topology') | from_json -%}
                {%- set _ba_raw=topo.get(_area_id,  {}) -%}
                {%- set ba=_ba_raw if _ba_raw is mapping else {'adjacent':[],'portals':[]} -%}
                {%- set _bb_raw=topo.get(_area_b_id,{}) -%}
                {%- set bb=_bb_raw if _bb_raw is mapping else {'adjacent':[],'portals':[]} -%}
                {%- set aa=ba.get('adjacent',[])|list -%}
                {%- set pa=ba.get('portals', [])|list -%}
                {%- set aa2=(aa+[_area_b_id])|unique|list if _area_b_id not in aa else aa -%}
                {%- set _pa_base={'type':_pt,'to':_area_b_id,'normally':_pn,'exterior':false,'exit':false,'emerg_exit':false} -%}
                {%- if link_sound_tx is defined and link_sound_tx is not none -%}{%- set _pa_base=_pa_base|combine({'sound_tx':link_sound_tx|float}) -%}{%- endif -%}
                {%- if link_light_tx is defined and link_light_tx is not none -%}{%- set _pa_base=_pa_base|combine({'light_tx':link_light_tx|float}) -%}{%- endif -%}
                {%- set pa2=pa if pa|selectattr('to','eq',_area_b_id)|list else pa+[_pa_base] -%}
                {%- set ab=bb.get('adjacent',[])|list -%}
                {%- set pb=bb.get('portals', [])|list -%}
                {%- set ab2=(ab+[_area_id])|unique|list if _area_id not in ab else ab -%}
                {%- set _pb_base={'type':_pt,'to':_area_id,'normally':_pn,'exterior':false,'exit':false,'emerg_exit':false} -%}
                {%- if link_sound_tx is defined and link_sound_tx is not none -%}{%- set _pb_base=_pb_base|combine({'sound_tx':link_sound_tx|float}) -%}{%- endif -%}
                {%- if link_light_tx is defined and link_light_tx is not none -%}{%- set _pb_base=_pb_base|combine({'light_tx':link_light_tx|float}) -%}{%- endif -%}
                {%- set pb2=pb if pb|selectattr('to','eq',_area_id)|list else pb+[_pb_base] -%}
                {%- set ma=ba|combine({'adjacent':aa2,'portals':pa2}) -%}
                {%- set mb=bb|combine({'adjacent':ab2,'portals':pb2}) -%}
                {{ (topo|combine({_area_id:ma,_area_b_id:mb}))|tojson }}
            response_variable: _fc_result

          - variables:
              _result:
                status: ok
                mode: link
                area_a: "{{ _area_id }}"
                area_b: "{{ _area_b_id }}"
                portal_type: "{{ _pt }}"
                portal_normally: "{{ _pn }}"
                caller_token: "{{ _caller_token }}"
          - stop: link
            response_variable: _result

      # ═══════════════════════════════════════════════════════════════════════
      # 5. UNLINK
      # ═══════════════════════════════════════════════════════════════════════
      - if: "{{ _mode == 'unlink' }}"
        then:
          - if: "{{ _area_id == '' or _area_b_id == '' or _hh_cabinet == '' }}"
            then:
              - variables:
                  _result: {status: error, mode: unlink, message: "area= and area_b= both required.", caller_token: "{{ _caller_token }}"}
              - stop: unlink error
                response_variable: _result

          - variables:
              _unlink_a_found: >-
                {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}{%- set topo = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'room_topology') | from_json -%}
                {{ _area_id in topo }}
              _unlink_b_found: >-
                {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}{%- set topo = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'room_topology') | from_json -%}
                {{ _area_b_id in topo }}

          - if: "{{ _dry_run }}"
            then:
              - variables:
                  _result:
                    status: dry_run
                    mode: unlink
                    area_a: "{{ _area_id }}"
                    area_b: "{{ _area_b_id }}"
                    a_found: "{{ _unlink_a_found }}"
                    b_found: "{{ _unlink_b_found }}"
                    caller_token: "{{ _caller_token }}"
              - stop: unlink dry_run
                response_variable: _result

          - action: script.zen_dojotools_filecabinet
            data:
              action_type: update
              key: room_topology
              volume_entity_id: "{{ _hh_cabinet }}"
              value: >-
                {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}{%- set t = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'room_topology') | from_json -%}
                {%- if _area_id in t -%}
                  {%- set _ba=t[_area_id] -%}
                  {%- set ba=_ba if _ba is mapping else {} -%}
                  {%- set t=t|combine({_area_id:ba|combine({'adjacent':ba.get('adjacent',[])|reject('eq',_area_b_id)|list,'portals':ba.get('portals',[])|rejectattr('to','eq',_area_b_id)|list})}) -%}
                {%- endif -%}
                {%- if _area_b_id in t -%}
                  {%- set _bb=t[_area_b_id] -%}
                  {%- set bb=_bb if _bb is mapping else {} -%}
                  {%- set t=t|combine({_area_b_id:bb|combine({'adjacent':bb.get('adjacent',[])|reject('eq',_area_id)|list,'portals':bb.get('portals',[])|rejectattr('to','eq',_area_id)|list})}) -%}
                {%- endif -%}
                {{ t | tojson }}
            response_variable: _fc_result

          - variables:
              _result:
                status: ok
                mode: unlink
                area_a: "{{ _area_id }}"
                area_b: "{{ _area_b_id }}"
                a_not_found: "{{ not _unlink_a_found }}"
                b_not_found: "{{ not _unlink_b_found }}"
                caller_token: "{{ _caller_token }}"
          - stop: unlink
            response_variable: _result

      # ═══════════════════════════════════════════════════════════════════════
      # 6. BOUNDARY_LINK — bidirectional acoustic + optical boundary (no portal)
      # ═══════════════════════════════════════════════════════════════════════
      - if: "{{ _mode == 'boundary_link' }}"
        then:
          - if: "{{ _area_id == '' or _area_b_id == '' or _hh_cabinet == '' }}"
            then:
              - variables:
                  _result: {status: error, mode: boundary_link, message: "area= and area_b= both required.", caller_token: "{{ _caller_token }}"}
              - stop: boundary_link error
                response_variable: _result

          - if: "{{ _dry_run }}"
            then:
              - variables:
                  _result:
                    status: dry_run
                    mode: boundary_link
                    area_a: "{{ _area_id }}"
                    area_b: "{{ _area_b_id }}"
                    sound_tx: "{{ boundary_link_sound_tx | default(none) }}"
                    light_tx: "{{ boundary_link_light_tx | default(none) }}"
                    note: "{{ boundary_link_note | default('') }}"
                    caller_token: "{{ _caller_token }}"
              - stop: boundary_link dry_run
                response_variable: _result

          - action: script.zen_dojotools_filecabinet
            data:
              action_type: >-
                {%- set _cv=state_attr(_hh_cabinet,'variables')|default({},true) -%}
                {{ 'update' if _cv.get('room_topology',none) is not none else 'create' }}
              key: room_topology
              volume_entity_id: "{{ _hh_cabinet }}"
              value: >-
                {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}{%- set topo = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'room_topology') | from_json -%}
                {%- set _ra_raw=topo.get(_area_id,{}) -%}{%- set ra=_ra_raw if _ra_raw is mapping else {} -%}
                {%- set _rb_raw=topo.get(_area_b_id,{}) -%}{%- set rb=_rb_raw if _rb_raw is mapping else {} -%}
                {%- set _bla=ra.get('boundary_links',[])|list -%}
                {%- set _blb=rb.get('boundary_links',[])|list -%}
                {%- set ns_a=namespace(ex={}) -%}
                {%- for e in _bla -%}{%- if e is mapping and e.get('to','') == _area_b_id -%}{%- set ns_a.ex=e -%}{%- endif -%}{%- endfor -%}
                {%- set ns_b=namespace(ex={}) -%}
                {%- for e in _blb -%}{%- if e is mapping and e.get('to','') == _area_id -%}{%- set ns_b.ex=e -%}{%- endif -%}{%- endfor -%}
                {%- set _la=ns_a.ex if (ns_a.ex is mapping and ns_a.ex|length > 0) else {'to':_area_b_id} -%}
                {%- set _lb=ns_b.ex if (ns_b.ex is mapping and ns_b.ex|length > 0) else {'to':_area_id} -%}
                {%- if boundary_link_sound_tx is defined and boundary_link_sound_tx is not none -%}{%- set _la=_la|combine({'sound_tx':boundary_link_sound_tx|float}) -%}{%- set _lb=_lb|combine({'sound_tx':boundary_link_sound_tx|float}) -%}{%- endif -%}
                {%- if boundary_link_light_tx is defined and boundary_link_light_tx is not none -%}{%- set _la=_la|combine({'light_tx':boundary_link_light_tx|float}) -%}{%- set _lb=_lb|combine({'light_tx':boundary_link_light_tx|float}) -%}{%- endif -%}
                {%- if boundary_link_note is defined and boundary_link_note|trim != '' -%}{%- set _la=_la|combine({'note':boundary_link_note|trim}) -%}{%- set _lb=_lb|combine({'note':boundary_link_note|trim}) -%}{%- endif -%}
                {%- set _bla2=(_bla|rejectattr('to','eq',_area_b_id)|list)+[_la] -%}
                {%- set _blb2=(_blb|rejectattr('to','eq',_area_id)|list)+[_lb] -%}
                {%- set ma=ra|combine({'boundary_links':_bla2}) -%}
                {%- set mb=rb|combine({'boundary_links':_blb2}) -%}
                {{ (topo|combine({_area_id:ma,_area_b_id:mb}))|tojson }}
            response_variable: _fc_result

          - variables:
              _result:
                status: ok
                mode: boundary_link
                area_a: "{{ _area_id }}"
                area_b: "{{ _area_b_id }}"
                sound_tx: "{{ boundary_link_sound_tx | default(none) }}"
                light_tx: "{{ boundary_link_light_tx | default(none) }}"
                note: "{{ boundary_link_note | default('') }}"
                caller_token: "{{ _caller_token }}"
          - stop: boundary_link
            response_variable: _result

      # ═══════════════════════════════════════════════════════════════════════
      # 7. BOUNDARY_UNLINK — remove bidirectional acoustic + optical boundary
      # ═══════════════════════════════════════════════════════════════════════
      - if: "{{ _mode == 'boundary_unlink' }}"
        then:
          - if: "{{ _area_id == '' or _area_b_id == '' or _hh_cabinet == '' }}"
            then:
              - variables:
                  _result: {status: error, mode: boundary_unlink, message: "area= and area_b= both required.", caller_token: "{{ _caller_token }}"}
              - stop: boundary_unlink error
                response_variable: _result

          - if: "{{ _dry_run }}"
            then:
              - variables:
                  _result:
                    status: dry_run
                    mode: boundary_unlink
                    area_a: "{{ _area_id }}"
                    area_b: "{{ _area_b_id }}"
                    caller_token: "{{ _caller_token }}"
              - stop: boundary_unlink dry_run
                response_variable: _result

          - action: script.zen_dojotools_filecabinet
            data:
              action_type: update
              key: room_topology
              volume_entity_id: "{{ _hh_cabinet }}"
              value: >-
                {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}{%- set t = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'room_topology') | from_json -%}
                {%- if _area_id in t -%}
                  {%- set _ra=t[_area_id] -%}{%- set ra=_ra if _ra is mapping else {} -%}
                  {%- set t=t|combine({_area_id:ra|combine({'boundary_links':ra.get('boundary_links',[])|rejectattr('to','eq',_area_b_id)|list})}) -%}
                {%- endif -%}
                {%- if _area_b_id in t -%}
                  {%- set _rb=t[_area_b_id] -%}{%- set rb=_rb if _rb is mapping else {} -%}
                  {%- set t=t|combine({_area_b_id:rb|combine({'boundary_links':rb.get('boundary_links',[])|rejectattr('to','eq',_area_id)|list})}) -%}
                {%- endif -%}
                {{ t | tojson }}
            response_variable: _fc_result

          - variables:
              _result:
                status: ok
                mode: boundary_unlink
                area_a: "{{ _area_id }}"
                area_b: "{{ _area_b_id }}"
                caller_token: "{{ _caller_token }}"
          - stop: boundary_unlink
            response_variable: _result


      # ═══════════════════════════════════════════════════════════════════════
      # 9. HOME_OVERVIEW — whole-house topology + live context snapshot
      # ═══════════════════════════════════════════════════════════════════════
      - if: "{{ _mode == 'home_overview' }}"
        then:

          # suppress entities tagged zen_rm_ignore from all home_overview entity discoveries
          - variables:
              _rm_ignored: "{{ label_entities('zen_rm_ignore') | list }}"

          # flat room list — iterate topo, run live slices inline + task/cal counts + grocy_anchor
          - variables:
              _ho_rooms: >-
                {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}{%- set topo = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'room_topology') | from_json -%}
                {%- set ns=namespace(rooms=[]) -%}
                {%- for aid in topo.keys() -%}
                  {%- set _fn=area_name(aid)|default(aid,true) -%}
                  {%- set _fid=floor_id(_fn)|default('unassigned',true)|string -%}
                  {%- set _lts=area_entities(aid)|select('match','light\\.')|list -%}
                  {%- set lns=namespace(on=[],bv=[]) -%}
                  {%- for e in _lts -%}{%- if states(e)=='on' -%}{%- set lns.on=lns.on+[e] -%}{%- set _b=state_attr(e,'brightness') -%}{%- if _b is number -%}{%- set lns.bv=lns.bv+[_b] -%}{%- endif -%}{%- endif -%}{%- endfor -%}
                  {%- set _lavg=(lns.bv|sum/(lns.bv|count)/255*100)|round(0) if lns.bv else 0 -%}
                  {%- set _c1=area_entities(aid)|select('match','climate\\.')|list|first|default('') -%}
                  {%- set _clim={'entity_id':_c1,'hvac_mode':states(_c1),'setpoint':state_attr(_c1,'temperature'),'current_temp':state_attr(_c1,'current_temperature')} if _c1 else none -%}
                  {%- set _cvs=area_entities(aid)|select('match','cover\\.')|list -%}
                  {%- set cvns=namespace(open=[],pos=[]) -%}
                  {%- for e in _cvs -%}{%- if states(e)=='open' and 'hvac_vent' not in labels(e) -%}{%- set cvns.open=cvns.open+[e] -%}{%- endif -%}{%- set _p=state_attr(e,'current_position') -%}{%- if _p is number -%}{%- set cvns.pos=cvns.pos+[_p] -%}{%- endif -%}{%- endfor -%}
                  {%- set _cavg=(cvns.pos|sum/(cvns.pos|count))|round(0) if cvns.pos else none -%}
                  {%- set mns=namespace(first='') -%}
                  {%- for e in area_entities(aid)|select('match','media_player\\.')|list -%}{%- if states(e) in ['playing','paused'] and mns.first=='' -%}{%- set mns.first=e -%}{%- endif -%}{%- endfor -%}
                  {%- set _bss=area_entities(aid)|select('match','binary_sensor\\.')|list -%}
                  {%- set tns=namespace(open=[]) -%}
                  {%- for e in _bss -%}{%- if states(e)=='on' -%}{%- set tns.open=tns.open+[e] -%}{%- endif -%}{%- endfor -%}
                  {%- set _ctx={'topo':{'open_count':tns.open|count,'total_count':_bss|count,'open':tns.open},'light':{'lights_total':_lts|count,'lights_on':lns.on,'avg_brightness_pct':_lavg},'covers':{'covers':_cvs,'open':cvns.open,'avg_position':_cavg},'media':{'entity_id':mns.first,'state':states(mns.first),'media_title':state_attr(mns.first,'media_title'),'volume':state_attr(mns.first,'volume_level')} if mns.first else {'active_count':0}} -%}
                  {%- if _clim is not none -%}{%- set _ctx=_ctx|combine({'climate':_clim}) -%}{%- endif -%}
                  {%- set tlns=namespace(lists=[]) -%}
                  {%- for lid in labels(aid) -%}{%- set tlns.lists=tlns.lists+(label_entities(label_name(lid))|select('match','^todo\\.')|list) -%}{%- endfor -%}
                  {%- set clns=namespace(cals=[]) -%}
                  {%- for lid in labels(aid) -%}{%- set clns.cals=clns.cals+(label_entities(label_name(lid))|select('match','^calendar\\.')|list) -%}{%- endfor -%}
                  {%- set _ctx=_ctx|combine({'task_lists':tlns.lists|unique|list|count,'calendar_entities':clns.cals|unique|list|count}) -%}
                  {%- set _glid=topo[aid].get('grocy_location_id','')|default('',true)|trim -%}
                  {%- if _glid!='' -%}{%- set _ctx=_ctx|combine({'grocy_anchor':_glid}) -%}{%- endif -%}
                  {%- set ns.rooms=ns.rooms+[{'area_id':aid,'display_name':_fn,'floor_id':_fid,'context':_ctx}] -%}
                {%- endfor -%}
                {{ ns.rooms }}

          # group rooms by floor_id
          - variables:
              _ho_floors: >-
                {%- set ns=namespace(floors={}) -%}
                {%- for room in _ho_rooms -%}
                  {%- set fid=room.get('floor_id','unassigned')|string -%}
                  {%- set ns.floors=ns.floors|combine({fid:ns.floors.get(fid,[])+[room]}) -%}
                {%- endfor -%}
                {%- set ns2=namespace(r=[]) -%}
                {%- for fid,rooms in ns.floors.items() -%}
                  {%- set ns2.r=ns2.r+[{'floor_id':fid,'room_count':rooms|count,'rooms':rooms}] -%}
                {%- endfor -%}
                {{ ns2.r }}

          # domain rollups from room context data
          - variables:
              _ho_summaries: >-
                {%- set ns=namespace(lon=0,ltot=0,cpos=[],mact=0,temps=[]) -%}
                {%- for room in _ho_rooms -%}
                  {%- set ctx=room.get('context',{}) -%}
                  {%- set lctx=ctx.get('light',{}) -%}
                  {%- set ns.lon=ns.lon+(lctx.get('lights_on',[])|count) -%}
                  {%- set ns.ltot=ns.ltot+lctx.get('lights_total',0) -%}
                  {%- set _cavg=ctx.get('covers',{}).get('avg_position',none) -%}
                  {%- if _cavg is number -%}{%- set ns.cpos=ns.cpos+[_cavg] -%}{%- endif -%}
                  {%- if ctx.get('media',{}).get('entity_id','')!='' -%}{%- set ns.mact=ns.mact+1 -%}{%- endif -%}
                  {%- set _clim=ctx.get('climate',none) -%}
                  {%- if _clim is mapping -%}{%- set _t=_clim.get('current_temp',none) -%}{%- if _t is number -%}{%- set ns.temps=ns.temps+[_t] -%}{%- endif -%}{%- endif -%}
                {%- endfor -%}
                {{ {'lights':{'on_total':ns.lon,'total':ns.ltot},'covers':{'avg_position':(ns.cpos|sum/(ns.cpos|count))|round(0) if ns.cpos else none},'media':{'active_count':ns.mact},'climate':{'temp_min':ns.temps|min if ns.temps else none,'temp_max':ns.temps|max if ns.temps else none}} }}

          # maintenance counts — batteries <20%, unavailable devices, active alerts
          - variables:
              _ho_maintenance: >-
                {%- set _bt=20 -%}
                {%- set ns=namespace(bat=0,unavail=0) -%}
                {%- set _batt = label_entities('battery_sensor') | select('match','sensor\\.') | reject('in', _rm_ignored) | list -%}
                {%- set _batt = _batt if _batt | length > 0 else (states.sensor | selectattr('attributes.device_class','eq','battery') | map(attribute='entity_id') | reject('in', _rm_ignored) | list) -%}
                {%- for eid in _batt -%}
                  {%- set _p=states(eid)|int(-1) -%}
                  {%- if 0<=_p<_bt -%}{%- set ns.bat=ns.bat+1 -%}{%- endif -%}
                {%- endfor -%}
                {%- set _ac=states.alert|selectattr('state','ne','idle')|list|count -%}
                {{ {'battery_count':ns.bat,'alert_count':_ac} }}

          # security summary — panel state + open zone count for home_overview
          - variables:
              _ho_security: >-
                {%- set ns=namespace(panel='') -%}
                {%- for eid in label_entities('alarm_panel') | reject('in', _rm_ignored) | list -%}
                  {%- if ns.panel=='' and eid.startswith('alarm_control_panel.') -%}
                    {%- set ns.panel=eid -%}
                  {%- endif -%}
                {%- endfor -%}
                {%- if ns.panel=='' -%}
                  {{ {'available': false} }}
                {%- elif states(ns.panel) in ['unknown','unavailable'] -%}
                  {{ {'available': false, 'panel': ns.panel, 'state': states(ns.panel)} }}
                {%- else -%}
                  {%- set _st=states(ns.panel) -%}
                  {%- set _did=device_id(ns.panel) -%}
                  {%- set _all=device_entities(_did)|list -%}
                  {%- set _zdc=['door','window','motion','opening','vibration','gas','heat','smoke','moisture','presence'] -%}
                  {%- set zns=namespace(open=[]) -%}
                  {%- for eid in _all -%}
                    {%- if eid.startswith('binary_sensor.') and not eid.endswith('_fault') -%}
                      {%- set _dc=state_attr(eid,'device_class')|default('',true) -%}
                      {%- if _dc in _zdc and states(eid)=='on' -%}
                        {%- set zns.open=zns.open+[state_attr(eid,'friendly_name')|default(eid,true)] -%}
                      {%- endif -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ {'available': true, 'panel': ns.panel, 'state': _st, 'open_zones': zns.open, 'open_zone_count': zns.open|count} }}
                {%- endif -%}

          - variables:
              _ho_alerts: >-
                {%- set _pcs=states('sensor.zen_priority_context') -%}
                {%- set _cv=state_attr(_hh_cabinet,'variables')|default({},true) -%}
                {%- set _cv=_cv if _cv is mapping else {} -%}
                {%- set _raw=_cv.get('_zen_active_alerts',{}) -%}
                {%- set _aa=_raw if _raw is mapping else (_raw|from_json if _raw is string else {}) -%}
                {%- set _aa=_aa.get('value', _aa) if _aa is mapping else {} -%}
                {%- set ns=namespace(alerts=[]) -%}
                {%- for k,v in _aa.items() if v is mapping -%}
                  {%- set ns.alerts=ns.alerts+[{'key':k,'message':v.get('message',''),'severity':v.get('severity',''),'fired_at':v.get('fired_at','')}] -%}
                {%- endfor -%}
                {{ {'priority_context':_pcs,'priority_count':state_attr('sensor.zen_priority_context','count')|default(0,true)|int,'highest_urgency':state_attr('sensor.zen_priority_context','highest_urgency')|default('',true),'priority_providers':state_attr('sensor.zen_priority_context','providers')|default([],true),'oldest_since':state_attr('sensor.zen_priority_context','oldest_since')|default('',true),'active_alerts':ns.alerts,'active_alert_count':ns.alerts|length} }}
          - variables:
              _ho_signal: >-
                {%- set _stale_s=14400 -%}
                {%- set _aa=_ho_alerts.get('active_alerts',[]) -%}
                {%- set ns=namespace(fresh=[],stale=[],active=[],open=[]) -%}
                {%- for a in _aa -%}
                  {%- set _fa=a.get('fired_at','') -%}
                  {%- if _fa -%}
                    {%- set _age=(now()-as_datetime(_fa)).total_seconds() -%}
                    {%- if _age<_stale_s -%}
                      {%- set ns.fresh=ns.fresh+[a|combine({'age_h':(_age/3600)|round(1)})] -%}
                    {%- else -%}
                      {%- set ns.stale=ns.stale+[a|combine({'age_h':(_age/3600)|round(1)})] -%}
                    {%- endif -%}
                  {%- else -%}
                    {%- set ns.fresh=ns.fresh+[a] -%}
                  {%- endif -%}
                {%- endfor -%}
                {%- for room in _ho_rooms -%}
                  {%- set aid=room.get('area_id','') -%}
                  {%- set ctx=room.get('context',{}) -%}
                  {%- set _lon=ctx.get('light',{}).get('lights_on',[])|count -%}
                  {%- set _med=ctx.get('media',{}).get('entity_id','') -%}
                  {#- ONE TOOL, NOT TWO (2026-08-05): fold Room Manager v3's
                      occupancy signal into active_rooms/attention, same
                      label-discovery pattern as the occupancy field on
                      mode=get — a room can be "active" via v3 (motion,
                      presence, engaged media) even with lights off and no
                      HA-native media_player playing. -#}
                  {%- set _v3_ent=(label_entities('zen_room_state')|intersect(label_entities(aid))|list|first)|default('',true) -%}
                  {#- wasp_flag_active included (2026-08-08, Design note: "in our
                      taxonomy wasp=true is == occupied from an occupancy
                      map") — a room mid wasp-hold has confirmed motion with
                      unresolved entry/exit corroboration; it's presence,
                      not absence, and must count as active here. -#}
                  {%- set _v3_occ=(_v3_ent!='' and (state_attr(_v3_ent,'occupied_active') or state_attr(_v3_ent,'engaged_active') or state_attr(_v3_ent,'wasp_flag_active') or state_attr(_v3_ent,'entertaining_hold_active') or state_attr(_v3_ent,'guest_hold_active'))) -%}
                  {%- if _lon>0 or _med!='' or _v3_occ -%}
                    {%- set ns.active=ns.active+[{'area_id':aid,'display_name':room.get('display_name',''),'lights_on':_lon,'media':_med,'v3_occupancy':(states(_v3_ent) if _v3_ent!='' else none)}] -%}
                  {%- endif -%}
                  {%- if _v3_ent!='' and state_attr(_v3_ent,'emergency_active') -%}
                    {%- set ns.fresh=ns.fresh+[{'key':'v3_emergency_'~aid,'message':'Room Manager v3 emergency latch active in '~room.get('display_name',aid),'severity':'critical','fired_at':'','age_h':0,'area_id':aid,'v3_entity':_v3_ent}] -%}
                  {%- endif -%}
                  {%- set pns=namespace(open=[]) -%}
                  {%- for e in area_entities(aid)|select('match','binary_sensor\\.')|list -%}
                    {%- set dc=state_attr(e,'device_class')|default('') -%}
                    {%- if dc in ['door','window','garage_door','opening','lock'] and states(e)=='on' -%}
                      {%- set pns.open=pns.open+[e] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {%- if pns.open|count>0 -%}
                    {%- set ns.open=ns.open+[{'area_id':aid,'display_name':room.get('display_name',''),'open_count':pns.open|count,'open':pns.open}] -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ {'attention':ns.fresh,'stale_alerts':ns.stale,'active_rooms':ns.active,'open_sensors':ns.open,'all_quiet':ns.fresh|count==0 and _ho_alerts.get('priority_context','clear')=='clear'} }}
          # weather snapshot — current conditions + next-hour slot; zen_weather label → any weather.*
          - variables:
              _ho_weather: >-
                {%- set _we = label_entities('zen_weather') | select('match','weather\\.') | list | first | default('') -%}
                {%- set _we = _we if _we != '' else (states.weather | map(attribute='entity_id') | list | first | default('')) -%}
                {%- if _we == '' -%}
                  {{ {'available': false} }}
                {%- else -%}
                  {%- set _st = states(_we) -%}
                  {%- if _st in ['unavailable','unknown',''] -%}
                    {{ {'available': false, 'entity_id': _we} }}
                  {%- else -%}
                    {%- set _fcst = state_attr(_we,'forecast') | default([], true) | list -%}
                    {%- set _next = _fcst | first | default(none) -%}
                    {{ {
                      'available': true,
                      'entity_id': _we,
                      'condition': _st,
                      'temperature': state_attr(_we,'temperature'),
                      'humidity': state_attr(_we,'humidity'),
                      'wind_speed': state_attr(_we,'wind_speed'),
                      'next_hour': _next,
                      'detail': 'weather_forecasts MCP — hourly | daily'
                    } }}
                  {%- endif -%}
                {%- endif -%}

          # plant snapshot — top-line live watts + water; pointer to plant tool for depth
          - variables:
              _ho_plant: >-
                {%- set _pw = label_entities('zen_plant_site_power') | select('match','sensor\\.') | reject('in', _rm_ignored) | list | first | default('') -%}
                {%- set _pw = _pw if _pw != '' else (label_entities('utility_main') | select('match','sensor\\.') | select('search','power|watt') | reject('search','produced|reactive|pv') | reject('in', _rm_ignored) | list | first | default('')) -%}
                {%- set _pw = _pw if _pw != '' else (label_entities('main_panel') | select('match','sensor\\.') | select('search','site_power') | reject('in', _rm_ignored) | list | first | default('')) -%}
                {%- set _ww = label_entities('zen_plant_water') | select('match','sensor\\.') | reject('in', _rm_ignored) | list | first | default('') -%}
                {%- set _ww = _ww if _ww != '' else (label_entities('water_usage') | select('match','sensor\\.') | reject('search','fee|rate|cost') | reject('in', _rm_ignored) | list | first | default('')) -%}
                {%- set _ww = _ww if _ww != '' else (label_entities('droplet') | select('match','sensor\\.') | reject('search','fee|rate|cost') | reject('in', _rm_ignored) | list | first | default('')) -%}
                {%- set _pv = states(_pw) | float(none) if _pw != '' else none -%}
                {%- set _wv = states(_ww) | float(none) if _ww != '' else none -%}
                {{ {'live_kw': (_pv / 1000) | round(2) if _pv is not none else none, 'water_gal': _wv | round(3) if _wv is not none else none, 'detail': 'zen_dojotools_plant — electric | water | hvac | gas | circuits | validate'} }}

          # household schedule — home mode anchors + quiet/work hours (live from input_datetime)
          - variables:
              _ho_schedule: >-
                {{
                  {
                    'quiet_hours_active': is_state('binary_sensor.zen_quiet_hours', 'on'),
                    'work_hours_active':  is_state('binary_sensor.zen_work_hours', 'on'),
                    'quiet_hours': {
                      'begin': states('input_datetime.zen_quiet_hours_start'),
                      'end':   states('input_datetime.zen_quiet_hours_end')
                    },
                    'work_hours': {
                      'begin': states('input_datetime.zen_work_hours_start'),
                      'end':   states('input_datetime.zen_work_hours_end')
                    },
                    'anchors': {
                      'wake':       states('input_datetime.zen_am_start'),
                      'morning':    states('input_datetime.zen_morning_start'),
                      'daytime':    states('input_datetime.zen_daytime_start'),
                      'evening':    states('input_datetime.zen_evening_start'),
                      'night':      states('input_datetime.zen_night_start'),
                      'late_night': states('input_datetime.zen_late_night_start')
                    }
                  }
                }}

          - if: "{{ _include_notices }}"
            then:
              - action: script.zen_dojotools_systemtools
                data:
                  tool: notice_dashboard
                  caller_token: "{{ _caller_token }}/home_overview"
                response_variable: _ho_notices_raw
              - variables:
                  _ho_notices: "{{ _ho_notices_raw if _ho_notices_raw is mapping else {} }}"
            else:
              - variables:
                  _ho_notices: {}

          - variables:
              _ho_presence: >-
                {%- if not _include_presence -%}{{ none }}
                {%- else -%}
                  {%- set _hps    = label_entities('hps') | list -%}
                  {%- set _phones = label_entities('phone') | list -%}
                  {%- set _tabs   = label_entities('tablet') | list -%}
                  {%- set _apkw   = ['core200s', 'flare rt', 'cameo', 'purifier', 'dyson', 'shark'] -%}
                  {%- set _all = states.sensor
                      | selectattr('entity_id', 'search', '_bps_zone$')
                      | rejectattr('entity_id', 'search', 'unfiltered')
                      | rejectattr('entity_id', 'equalto', 'sensor.none_bps_zone')
                      | list -%}
                  {%- set _pool = (_all | selectattr('entity_id', 'in', _hps) | list) if _pmode == 'filtered' else _all -%}
                  {%- set ns = namespace(out=[], by_room={}, unresolved=[]) -%}
                  {%- for e in _pool -%}
                    {%- set _base  = e.entity_id | replace('sensor.', '', 1) | replace('_bps_zone', '') -%}
                    {%- set _zone  = e.state | default('unknown', true) -%}
                    {%- set _floor = states('sensor.' + _base + '_bps_floor') | default('', true) -%}
                    {%- set _afn   = state_attr('sensor.' + _base + '_area', 'friendly_name') | default('', true) -%}
                    {%- set _name  = _afn | replace(' Area', '') if _afn else _base -%}
                    {%- set _nl    = _name | lower -%}
                    {%- set _seg0  = _base.split('_')[0] | lower -%}
                    {%- set _hint  =
                        'hps_tagged'  if e.entity_id in _hps else
                        ('phone'      if (e.entity_id in _phones or 'phone' in _nl or 'iphone' in _nl) else
                        ('wearable'   if ('watch' in _nl or 'band' in _nl) else
                        ('tablet'     if (e.entity_id in _tabs or 'tablet' in _nl) else
                        ('appliance'  if (_apkw | select('in', _nl) | list | count > 0) else
                        ('mobile_tag' if (_seg0 | length >= 6 and _seg0 is match('[0-9a-f]+')) else
                        'unknown'))))) -%}
                    {%- set _suggest =
                        'already tracking' if _hint == 'hps_tagged' else
                        ("add 'hps' label to track"        if _hint in ['phone', 'wearable'] else
                        ("fixed tablet — skip unless mobile" if _hint == 'tablet' else
                        ("appliance — skip"                   if _hint == 'appliance' else
                        ("mobile BLE tag (car/bag/bin) — add 'hps' if person-carried" if _hint == 'mobile_tag' else
                        "unknown — inspect entity")))) -%}
                    {%- if _pmode == 'filtered' -%}
                      {%- set _entry = {'name': _name, 'zone': _zone, 'floor': _floor, 'entity': e.entity_id} -%}
                    {%- else -%}
                      {%- set _entry = {'name': _name, 'hint': _hint, 'tagged': e.entity_id in _hps, 'zone': _zone, 'entity': e.entity_id, 'suggest': _suggest} -%}
                    {%- endif -%}
                    {%- set ns.out = ns.out + [_entry] -%}
                    {%- if _zone not in ['unknown', 'unavailable', 'none', ''] -%}
                      {%- set _cur = ns.by_room.get(_zone, []) -%}
                      {%- set ns.by_room = ns.by_room | combine({_zone: _cur + [_name]}) -%}
                    {%- else -%}
                      {%- set ns.unresolved = ns.unresolved + [_name] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {%- if _pmode == 'filtered' -%}
                    {{ {'count': ns.out | count, 'tracked': ns.out, 'by_room': ns.by_room, 'unresolved': ns.unresolved} }}
                  {%- else -%}
                    {{ {'mode': 'discover', 'count': ns.out | count, 'candidates': ns.out, 'by_room': ns.by_room, 'tag_action': "Add 'hps' label in HA UI to track. Hints: phone/wearable/mobile_tag → likely person-carried."} }}
                  {%- endif -%}
                {%- endif -%}

          - variables:
              _ho_autovac: >-
                {%- set _av_raw = (state_attr(_hh_cabinet, 'variables') | default({}, true)).get('autovac', none) -%}
                {%- if _av_raw is none -%}{{ none }}
                {%- else -%}
                  {%- set _av_raw = _av_raw if _av_raw is mapping else (_av_raw | from_json if _av_raw is string else {}) -%}
                  {%- set _avc = _av_raw.get('value', _av_raw) -%}
                  {%- set _avc = _avc if _avc is mapping else (_avc | from_json if _avc is string else {}) -%}
                  {%- set rooms = _avc.get('rooms', {}) -%}
                  {%- set system = _avc.get('system', {}) -%}
                  {%- set _vac_ent = label_entities('autovac') | select('match', 'vacuum\\.') | list | first | default('') -%}
                  {%- set _vac_state = states(_vac_ent) if _vac_ent != '' else 'unknown' -%}
                  {%- set _battery = state_attr(_vac_ent, 'battery_level') | int(none) if _vac_ent != '' else none -%}
                  {%- set ns = namespace(elected=[], queued=[], blockers=[], mop_elected=[]) -%}
                  {%- for rn, rv in rooms.items() -%}
                    {%- if rv.get('enabled', false) -%}
                      {%- set last = rv.get('last_cleaned', '') -%}
                      {%- set days_since = ((now().timestamp() - as_timestamp(last ~ 'T00:00:00', 0)) / 86400) | int(0) -%}
                      {%- set require_confirmation = rv.get('require_confirmation', false) -%}
                      {%- set ready_pass = (not require_confirmation) or rv.get('ready_to_clean', false) -%}
                      {%- set can_schedule = (not rv.get('skip_next', false)) and ready_pass -%}
                      {%- if can_schedule and (days_since >= rv.get('days_between', 7) or rv.get('queued', false)) -%}
                        {%- set ns.elected = ns.elected + [rn] -%}
                        {%- if rv.get('requires_mop', false) -%}
                          {%- set ns.mop_elected = ns.mop_elected + [rn] -%}
                        {%- endif -%}
                      {%- endif -%}
                    {%- endif -%}
                    {%- if rv.get('queued', false) -%}
                      {%- set ns.queued = ns.queued + [rn] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {%- if not system.get('enabled', true) -%}{%- set ns.blockers = ns.blockers + ['disabled'] -%}{%- endif -%}
                  {%- if not system.get('master_on', true) -%}{%- set ns.blockers = ns.blockers + ['master_off'] -%}{%- endif -%}
                  {%- if system.get('pause_today', false) -%}{%- set ns.blockers = ns.blockers + ['paused_today'] -%}{%- endif -%}
                  {%- if _battery is not none and _battery < (system.get('minimum_battery', 20) | int(20)) -%}{%- set ns.blockers = ns.blockers + ['low_battery'] -%}{%- endif -%}
                  {{ {'vacuum_state': _vac_state, 'battery_pct': _battery, 'enabled': system.get('enabled', true), 'pause_today': system.get('pause_today', false), 'water_low_action': system.get('water_low_action', 'warn'), 'elected_rooms': ns.elected, 'mop_elected_rooms': ns.mop_elected, 'force_queued': ns.queued, 'blockers': ns.blockers} }}
                {%- endif -%}

          # inventory slice — volatile items (overdue/expiring) whole-house, enriched with product names
          - if: "{{ states('script.zen_dojotools_inventory') not in ['unavailable', 'unknown'] }}"
            then:
              - action: script.zen_dojotools_inventory
                response_variable: _ho_inv_raw
                continue_on_error: true
                data:
                  mode: stock_list_volatile
              - variables:
                  _ho_inventory: >-
                    {%- if _ho_inv_raw is defined and _ho_inv_raw is mapping
                           and _ho_inv_raw.get('status') == 'success' -%}
                      {{ _ho_inv_raw.get('result', none) }}
                    {%- else -%}{{ none }}{%- endif -%}
            else:
              - variables:
                  _ho_inventory: "{{ none }}"

          # lens enrichment — person + area_id anchors; fail-soft on dead dispatcher
          - variables:
              _ho_lens_anchors: >-
                {%- set ns = namespace(anchors=[], area_keys=[]) -%}
                {%- for p in states.person | selectattr('state', 'eq', 'home') | list -%}
                  {%- set ns.anchors = ns.anchors + [{'type': 'person', 'id': p.entity_id}] -%}
                {%- endfor -%}
                {%- for room in _ho_signal.get('open_sensors', []) if room is mapping -%}
                  {%- set _aid = room.get('area_id', '') | string | trim -%}
                  {%- if _aid != '' and _aid not in ns.area_keys -%}
                    {%- set ns.area_keys = ns.area_keys + [_aid] -%}
                    {%- set ns.anchors = ns.anchors + [{'type': 'area_id', 'id': _aid}] -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.anchors }}

          - if: "{{ _ho_lens_anchors | length > 0 }}"
            then:
              - action: script.zen_dojotools_lens_dispatch
                continue_on_error: true
                response_variable: _ho_lenses_raw
                data:
                  anchors_json: "{{ _ho_lens_anchors | tojson }}"
                  consumer: room_manager
                  timeout_ms: 1200
                  caller_token: "{{ _caller_token }}"
            else:
              - variables:
                  _ho_lenses_raw: {}

          - variables:
              _ho_lenses: >-
                {%- set raw = _ho_lenses_raw if _ho_lenses_raw is defined and _ho_lenses_raw is mapping else {} -%}
                {%- set providers = raw.get('providers', {}) if raw is mapping and raw.get('providers', {}) is mapping else {} -%}
                {%- set evns = namespace(ev=[]) -%}
                {%- for _pname, _provider in providers.items() if providers is mapping and _provider is mapping -%}
                  {%- set _pdocs = _provider.get('documents', []) if _provider.get('documents', []) is sequence and _provider.get('documents', []) is not string else [] -%}
                  {%- set evns.ev = evns.ev + _pdocs -%}
                {%- endfor -%}
                {{ {
                  'status': raw.get('status', 'unavailable') if raw else 'unavailable',
                  'anchors': _ho_lens_anchors,
                  'provider_count': providers | length,
                  'evidence_count': evns.ev | length,
                  'evidence': evns.ev,
                  'content_redacted': true
                } }}

          - variables:
              _result:
                status: ok
                mode: home_overview
                generated: "{{ now().isoformat() }}"
                home_mode: "{{ states('sensor.zen_home_mode') | default(states('input_select.zen_home_mode'), true) }}"
                registered_room_count: "{{ _ho_rooms | count }}"
                floor_count: "{{ _ho_floors | count }}"
                signal: "{{ _ho_signal }}"
                alerts: "{{ _ho_alerts }}"
                domain_summaries: "{{ _ho_summaries | combine({'maintenance': _ho_maintenance, 'security': _ho_security}) }}"
                floors: "{{ _ho_floors }}"
                weather: "{{ _ho_weather }}"
                plant: "{{ _ho_plant }}"
                autovac: "{{ _ho_autovac }}"
                inventory: "{{ _ho_inventory }}"
                utility_index: >-
                  {%- set _ui=(state_attr(_hh_cabinet,'variables')|default({},true)).get('utility_index',none) -%}
                  {%- set _uid=_ui if _ui is mapping else (_ui|from_json if _ui is string and _ui|trim not in ['None','none','','null'] else {}) -%}
                  {{ _uid.get('value',_uid) if _uid is mapping and 'value' in _uid else _uid }}
                schedule: "{{ _ho_schedule }}"
                notices: "{{ _ho_notices if _include_notices else none }}"
                presence: "{{ _ho_presence }}"
                lenses: "{{ _ho_lenses }}"
                active_timers: >-
                  {%- set _purpose_labels = ['room_timer', 'checking_timer', 'nightlight_timer', 'occupied_timer', 'asleep_timer', 'sleep_timer', 'control_burnout'] -%}
                  {%- set ns = namespace(list=[]) -%}
                  {%- for e in states.timer if e.state == 'active' -%}
                    {%- set _labs = labels(e.entity_id) -%}
                    {%- set _purpose = (_purpose_labels | select('in', _labs) | list | first) | default('', true) -%}
                    {%- set _room = (_labs | reject('in', _purpose_labels) | list | first) | default('', true) -%}
                    {%- set ns.list = ns.list + [{'entity_id': e.entity_id, 'room': _room, 'purpose': _purpose, 'remaining': e.attributes.get('remaining') | string}] -%}
                  {%- endfor -%}
                  {{ {'count': ns.list | count, 'timers': ns.list} }}
                # 2026-08-06 (design note: "wherever we return those should we
                # note the Live RoomState Dispatcher is off"). Same
                # resolution as mode=roomstate_enable's read path (label
                # override > cabinet > published default false) — surfaced
                # inline so an agent/human sees the v3 engine's state
                # without a separate call. Note is null when enabled —
                # only worth flagging when it's OFF, since that's the
                # actionable case (v3_occupancy values above are live-
                # signal-only right now, no decay grace periods running).
                roomstate_dispatcher: >-
                  {%- set _sw = label_entities('zenos_roomstate_master_switch') -%}
                  {%- set ns = namespace(enabled=false) -%}
                  {%- if _sw | count > 0 -%}
                    {%- set ns.enabled = (_sw | map('states') | select('eq','on') | list | count) > 0 -%}
                  {%- else -%}
                    {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                    {%- set _raw = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'roomstate_config') if _hh_cabinet != '' else none -%}
                    {%- set _cfg = (_raw | from_json) if _raw not in [none, ''] else {} -%}
                    {%- set ns.enabled = (_cfg.enabled | default(false)) if _cfg is mapping else false -%}
                  {%- endif -%}
                  {{ {'enabled': ns.enabled, 'note': none if ns.enabled else "Live RoomState Dispatcher is OFF — v3_occupancy values above are live-signal-only, no decay/grace timers running. Turn on: zen_dojotools_room_manager mode=roomstate_enable roomstate_enabled=true."} }}
                caller_token: "{{ _caller_token }}"
          - stop: home_overview
            response_variable: _result

      # ═══════════════════════════════════════════════════════════════════════
      # 10. EMERGENCY — "keep your people safe" crisis snapshot
      #     RM is the sole authoritative source for egress, shelter, hazards
      # ═══════════════════════════════════════════════════════════════════════
      - if: "{{ _mode == 'emergency' }}"
        then:
          - if: "{{ _hh_cabinet == '' }}"
            then:
              - variables:
                  _result: {status: error, mode: emergency, message: "Household cabinet unreachable.", caller_token: "{{ _caller_token }}"}
              - stop: emergency error
                response_variable: _result

          # Read topology + sort-rank dict + scenario
          - variables:
              _em_topo: >-
                {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}{%- set topo = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'room_topology') | from_json -%}
                {{ topo }}
              _em_rk: "{{ {'primary':0,'secondary':1,'tertiary':2,'bail_out':3} }}"
              _em_scenario: "{{ scenario | default('general') | lower | trim }}"

          # Build exits[], shelter{} (with floor), safety/hazard lists, likely_occupied[]
          - variables:
              _em_exits: >-
                {%- set ns=namespace(e=[]) -%}
                {%- for aid, sp in _em_topo.items() -%}
                  {%- if sp is mapping -%}
                    {%- set _an=area_name(aid)|default(aid,true) -%}
                    {%- for p in (sp.get('portals',[])|list) -%}
                      {%- if p is mapping and p.get('emerg_exit',false) -%}
                        {%- set _pri=p.get('exit_priority','') -%}
                        {%- set _sk=_em_rk.get(_pri,9)*2 -%}
                        {%- set ns.e=ns.e+[{'priority_rank':_sk,'area_id':aid,'area_name':_an,'source':'portal','to':p.get('to',none),'type':p.get('type',''),'exit_priority':_pri,'normally':p.get('normally',''),'note':p.get('note',none)}] -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {%- for w in (sp.get('windows',[])|list) -%}
                      {%- if w is mapping and w.get('emerg_exit',false) -%}
                        {%- set _pri=w.get('exit_priority','') -%}
                        {%- set _sk=_em_rk.get(_pri,9)*2+1 -%}
                        {%- set ns.e=ns.e+[{'priority_rank':_sk,'area_id':aid,'area_name':_an,'source':'window','direction':w.get('direction',''),'type':w.get('type',''),'exit_priority':_pri,'drop_ft':w.get('drop_ft',none),'note':w.get('note',none)}] -%}
                      {%- endif -%}
                    {%- endfor -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.e | sort(attribute='priority_rank') }}
              _em_shelter: >-
                {%- set ns=namespace(primary=[],secondary=[],avoid=[]) -%}
                {%- for aid, sp in _em_topo.items() -%}
                  {%- if sp is mapping -%}
                    {%- set _an=area_name(aid)|default(aid,true) -%}
                    {%- set _fid=floor_id(_an)|default('unassigned',true)|string -%}
                    {%- set _fln=floor_name(_fid)|default(_fid,true)|string -%}
                    {%- set epns=namespace(c=0) -%}
                    {%- for p in (sp.get('portals',[])|list) -%}
                      {%- if p is mapping and p.get('exterior',false) -%}{%- set epns.c=epns.c+1 -%}{%- endif -%}
                    {%- endfor -%}
                    {%- set _wins=(sp.get('windows',[])|list)|count -%}
                    {%- if sp.get('exterior',false) == true -%}
                      {%- set ns.avoid=ns.avoid+[{'area_id':aid,'area_name':_an,'floor_id':_fid,'floor_name':_fln,'reason':'exterior_area'}] -%}
                    {%- elif sp.get('shelter_eligible',true) == false -%}
                      {%- set ns.avoid=ns.avoid+[{'area_id':aid,'area_name':_an,'floor_id':_fid,'floor_name':_fln,'reason':'shelter_ineligible'}] -%}
                    {%- elif epns.c > 0 -%}
                      {%- set ns.avoid=ns.avoid+[{'area_id':aid,'area_name':_an,'floor_id':_fid,'floor_name':_fln,'reason':'exterior_portal'}] -%}
                    {%- elif _wins == 0 -%}
                      {%- set ns.primary=ns.primary+[{'area_id':aid,'area_name':_an,'floor_id':_fid,'floor_name':_fln}] -%}
                    {%- else -%}
                      {%- set ns.secondary=ns.secondary+[{'area_id':aid,'area_name':_an,'floor_id':_fid,'floor_name':_fln,'window_count':_wins}] -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ {'primary':ns.primary,'secondary':ns.secondary,'avoid':ns.avoid} }}
              _em_safety: >-
                {%- set ns=namespace(equip=[],haz=[]) -%}
                {%- for aid, sp in _em_topo.items() -%}
                  {%- if sp is mapping -%}
                    {%- set _an=area_name(aid)|default(aid,true) -%}
                    {%- for s in (sp.get('safety',[])|list) -%}
                      {%- if s is mapping -%}
                        {%- set _s=s|combine({'area_id':aid,'area_name':_an}) -%}
                        {%- if s.get('type','') in ['fire_extinguisher','first_aid','aed','eyewash','spill_kit'] -%}
                          {%- set ns.equip=ns.equip+[_s] -%}
                        {%- elif s.get('hazmat_class',none) is not none or s.get('rating','') == 'hazmat' -%}
                          {%- set ns.haz=ns.haz+[_s] -%}
                        {%- else -%}
                          {%- set ns.equip=ns.equip+[_s] -%}
                        {%- endif -%}
                      {%- endif -%}
                    {%- endfor -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ {'safety_equipment':ns.equip,'hazards':ns.haz} }}
              _em_occupied: >-
                {%- set ns=namespace(rooms=[]) -%}
                {%- for aid, sp in _em_topo.items() -%}
                  {%- if sp is mapping -%}
                    {%- set _an=area_name(aid)|default(aid,true) -%}
                    {%- set lns=namespace(on=false,mot=false) -%}
                    {%- for e in area_entities(aid)|select('match','light\\.')|list -%}
                      {%- if states(e)=='on' -%}{%- set lns.on=true -%}{%- endif -%}
                    {%- endfor -%}
                    {%- for e in area_entities(aid)|select('match','binary_sensor\\.')|list -%}
                      {%- if state_attr(e,'device_class') in ['motion','occupancy','presence'] and states(e)=='on' -%}
                        {%- set lns.mot=true -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {%- if lns.on or lns.mot -%}
                      {%- set ns.rooms=ns.rooms+[{'area_id':aid,'area_name':_an,'lights_on':lns.on,'motion_active':lns.mot}] -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.rooms }}

          # Layer 2 — inventory enrichment: confirm stock status for registered safety items
          # Confirm path: safety[] entries with grocy_product_id → enrich with live stock status
          # Zero API calls when no entries have grocy_product_id (graceful degradation)
          # NOTE: stock_amount here is aggregated house-wide for the product (e.g. all ABC extinguishers = 7).
          # Per-location counts are available via GET /stock/products/{id}/locations — cross-ref grocy_location_id
          # if location-specific presence/absence ever matters. Presence/absence is the emergency-relevant bit.
          - variables:
              _em_stock_lookup: {}
              _em_safety_pids: >-
                {%- set ns = namespace(pids=[]) -%}
                {%- for aid, sp in _em_topo.items() -%}
                  {%- if sp is mapping -%}
                    {%- for s in (sp.get('safety', []) | list) -%}
                      {%- if s is mapping and s.get('grocy_product_id') is not none -%}
                        {%- set _k = s.grocy_product_id | string -%}
                        {%- if _k not in ns.pids -%}
                          {%- set ns.pids = ns.pids + [_k] -%}
                        {%- endif -%}
                      {%- endif -%}
                    {%- endfor -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.pids }}
          - if: >-
              {{ _em_safety_pids | length > 0
                 and states('script.zen_sutra_grocy') not in ['unavailable','unknown'] }}
            then:
              - repeat:
                  for_each: "{{ _em_safety_pids }}"
                  sequence:
                    - action: script.zen_sutra_grocy
                      continue_on_error: true
                      response_variable: _em_sploc_raw
                      data:
                        action_type: read
                        endpoint: "/stock/products/{{ repeat.item | int }}/locations"
                    - variables:
                        _em_stock_lookup: >-
                          {%- set _cur = _em_stock_lookup | default({}) -%}
                          {%- set _locs = _em_sploc_raw['result']['content']
                                          if _em_sploc_raw is mapping and 'result' in _em_sploc_raw
                                             and _em_sploc_raw['result']['content'] is sequence
                                          else [] -%}
                          {%- set _pid = repeat.item | string -%}
                          {%- set ns = namespace(m={}) -%}
                          {%- for loc in _locs -%}
                            {%- set _lid = loc.get('location_id', loc.get('id', none)) | string -%}
                            {%- set _amt = loc.get('amount', 0) | float(0) -%}
                            {%- if _lid != 'None' -%}
                              {%- set ns.m = ns.m | combine({_lid: _amt}) -%}
                            {%- endif -%}
                          {%- endfor -%}
                          {{ _cur | combine({_pid: ns.m}) }}
          # Discover path: find Grocy products with zen_safety_type set not already in safety[]
          - if: >-
              {{ states('script.zen_dojotools_inventory') not in ['unavailable','unknown'] }}
            then:
              - action: script.zen_dojotools_inventory
                continue_on_error: true
                response_variable: _em_disc_raw
                data:
                  mode: catalog_find_by_tag
                  safety_only: true
              - variables:
                  _em_disc_products: >-
                    {{ _em_disc_raw.get('products', [])
                       if _em_disc_raw is mapping and _em_disc_raw.get('status') == 'ok'
                       else [] }}
                  _em_confirmed_pids: >-
                    {%- set ns = namespace(pids=[]) -%}
                    {%- for aid, sp in _em_topo.items() -%}
                      {%- if sp is mapping -%}
                        {%- for s in (sp.get('safety', []) | list) -%}
                          {%- if s is mapping and s.get('grocy_product_id') is not none -%}
                            {%- set ns.pids = ns.pids + [s.grocy_product_id | string] -%}
                          {%- endif -%}
                        {%- endfor -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {{ ns.pids }}
                  _em_discovered: >-
                    {%- set ns = namespace(items=[]) -%}
                    {%- for p in _em_disc_products -%}
                      {%- set _stype = p.get('zen_safety_type', none) -%}
                      {%- set _haz   = p.get('hazmat_class', none) -%}
                      {%- if p.id | string not in _em_confirmed_pids and (_stype is not none or _haz is not none) -%}
                        {%- set _atype = p.get('zen_asset_type', none) -%}
                        {%- set _area  = p.get('homeassistant_area', none) -%}
                        {%- set _entry = {
                          'name': p.name, 'type': _stype if _stype is not none else 'other',
                          'location_note': 'Discovered from Grocy inventory',
                          'grocy_product_id': p.id,
                          'homeassistant_area': _area,
                          'discovered': true,
                          'zen_asset_type': _atype, 'hazmat_class': _haz
                        } -%}
                        {%- set ns.items = ns.items + [_entry] -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {{ ns.items }}

          - variables:
              _em_safety_enriched: >-
                {%- set ns = namespace(equip=[], haz=[]) -%}
                {%- set _lk = _em_stock_lookup | default({}) -%}
                {%- for s in (_em_safety.safety_equipment | list) -%}
                  {%- set _pid = s.get('grocy_product_id', none) | string
                                 if s.get('grocy_product_id') is not none else none -%}
                  {%- set _lid = s.get('grocy_location_id', none) | string
                                 if s.get('grocy_location_id') is not none else none -%}
                  {%- set _pid_locs = _lk.get(_pid, none) if _pid is not none else none -%}
                  {%- set _amt = (_pid_locs.get(_lid, none) if _lid is not none else none)
                                 if _pid_locs is mapping else none -%}
                  {%- if _pid_locs is not none -%}
                    {%- set ns.equip = ns.equip + [s | combine({
                      'stock_amount': _amt if _amt is not none else 0,
                      'stock_confirmed': true
                    })] -%}
                  {%- else -%}
                    {%- set ns.equip = ns.equip + [s] -%}
                  {%- endif -%}
                {%- endfor -%}
                {%- for s in (_em_safety.hazards | list) -%}
                  {%- set _pid = s.get('grocy_product_id', none) | string
                                 if s.get('grocy_product_id') is not none else none -%}
                  {%- set _lid = s.get('grocy_location_id', none) | string
                                 if s.get('grocy_location_id') is not none else none -%}
                  {%- set _pid_locs = _lk.get(_pid, none) if _pid is not none else none -%}
                  {%- set _amt = (_pid_locs.get(_lid, none) if _lid is not none else none)
                                 if _pid_locs is mapping else none -%}
                  {%- if _pid_locs is not none -%}
                    {%- set ns.haz = ns.haz + [s | combine({
                      'stock_amount': _amt if _amt is not none else 0,
                      'stock_confirmed': true
                    })] -%}
                  {%- else -%}
                    {%- set ns.haz = ns.haz + [s] -%}
                  {%- endif -%}
                {%- endfor -%}
                {%- for d in (_em_discovered | default([]) | list) -%}
                  {%- if d.get('hazmat_class') is not none -%}
                    {%- set ns.haz = ns.haz + [d] -%}
                  {%- else -%}
                    {%- set ns.equip = ns.equip + [d] -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ {'safety_equipment': ns.equip, 'hazards': ns.haz} }}

          # from_room — exits in this room + adjacent, nearest shelter (when area= provided)
          - variables:
              _em_from_room: >-
                {%- if _area_id != '' and _em_topo.get(_area_id,none) is not none -%}
                  {%- set _sp=_em_topo.get(_area_id,{}) -%}
                  {%- set _an=area_name(_area_id)|default(_area_id,true) -%}
                  {%- set ens=namespace(re=[],ae=[],ns=[]) -%}
                  {%- set _prim_ids=_em_shelter.get('primary',[])|map(attribute='area_id')|list -%}
                  {%- set _sec_ids=_em_shelter.get('secondary',[])|map(attribute='area_id')|list -%}
                  {%- for p in (_sp.get('portals',[])|list) -%}
                    {%- if p is mapping and p.get('emerg_exit',false) -%}
                      {%- set _pri=p.get('exit_priority','') -%}
                      {%- set ens.re=ens.re+[{'priority_rank':_em_rk.get(_pri,9)*2,'source':'portal','to':p.get('to',none),'type':p.get('type',''),'exit_priority':_pri,'normally':p.get('normally',''),'note':p.get('note',none)}] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {%- for w in (_sp.get('windows',[])|list) -%}
                    {%- if w is mapping and w.get('emerg_exit',false) -%}
                      {%- set _pri=w.get('exit_priority','') -%}
                      {%- set ens.re=ens.re+[{'priority_rank':_em_rk.get(_pri,9)*2+1,'source':'window','direction':w.get('direction',''),'type':w.get('type',''),'exit_priority':_pri,'drop_ft':w.get('drop_ft',none),'note':w.get('note',none)}] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {%- for adj_id in (_sp.get('adjacent',[])|list) -%}
                    {%- set _asp=_em_topo.get(adj_id,none) -%}
                    {%- if _asp is mapping -%}
                      {%- set _aajn=area_name(adj_id)|default(adj_id,true) -%}
                      {%- for p in (_asp.get('portals',[])|list) -%}
                        {%- if p is mapping and p.get('emerg_exit',false) -%}
                          {%- set _pri=p.get('exit_priority','') -%}
                          {%- set ens.ae=ens.ae+[{'priority_rank':_em_rk.get(_pri,9)*2,'via_area_id':adj_id,'via_area_name':_aajn,'source':'portal','to':p.get('to',none),'type':p.get('type',''),'exit_priority':_pri,'normally':p.get('normally',''),'note':p.get('note',none)}] -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {%- for w in (_asp.get('windows',[])|list) -%}
                        {%- if w is mapping and w.get('emerg_exit',false) -%}
                          {%- set _pri=w.get('exit_priority','') -%}
                          {%- set ens.ae=ens.ae+[{'priority_rank':_em_rk.get(_pri,9)*2+1,'via_area_id':adj_id,'via_area_name':_aajn,'source':'window','direction':w.get('direction',''),'type':w.get('type',''),'exit_priority':_pri,'drop_ft':w.get('drop_ft',none),'note':w.get('note',none)}] -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {%- if adj_id in _prim_ids -%}
                        {%- set ens.ns=ens.ns+[{'area_id':adj_id,'area_name':_aajn,'tier':'primary'}] -%}
                      {%- elif adj_id in _sec_ids -%}
                        {%- set ens.ns=ens.ns+[{'area_id':adj_id,'area_name':_aajn,'tier':'secondary'}] -%}
                      {%- endif -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ {'area_id':_area_id,'area_name':_an,'room_exits':ens.re|sort(attribute='priority_rank'),'adjacent_exits':ens.ae|sort(attribute='priority_rank'),'nearest_shelter':ens.ns} }}
                {%- else -%}{{ none }}{%- endif -%}

          # household_profile — rally_point, address, zip_code
          - variables:
              _em_rally_data: >-
                {%- set _hp=(state_attr(_hh_cabinet,'variables')|default({},true)).get('household_profile',none) -%}
                {%- set _hpd=_hp if _hp is mapping else (_hp|from_json if _hp is string and _hp|trim not in ['None','none','','null'] else {}) -%}
                {{ _hpd.get('value', _hpd) if _hpd is mapping else {} }}
              _em_rally: >-
                {%- set _hp=(state_attr(_hh_cabinet,'variables')|default({},true)).get('household_profile',none) -%}
                {%- set _hpd=_hp if _hp is mapping else (_hp|from_json if _hp is string and _hp|trim not in ['None','none','','null'] else {}) -%}
                {%- set _hpd=_hpd.get('value', _hpd) if _hpd is mapping else {} -%}
                {{ _hpd.get('rally_point',none) if _hpd is mapping else none }}

          # Scenario-specific action + advisory
          - variables:
              _em_guidance: >-
                {%- set _rp=_em_rally|default('designated rally point',true)|string -%}
                {%- if _em_scenario == 'fire' -%}
                  {{ {'action':'EVACUATE','priority':'exits','advisory':'Use exits in priority order. Avoid hazard locations. Call 911. Rally at: ' ~ _rp} }}
                {%- elif _em_scenario == 'burglar' -%}
                  {{ {'action':'SHELTER','priority':'shelter','advisory':'Move to nearest primary shelter room. Lock interior doors. Call 911. Do not confront.'} }}
                {%- elif _em_scenario == 'weather' -%}
                  {{ {'action':'SHELTER','priority':'shelter','advisory':'Lowest-floor interior room. Away from windows and exterior walls. Stay until official all-clear.'} }}
                {%- elif _em_scenario == 'medical' -%}
                  {%- set _addr=_em_rally_data.get('address','unknown') if _em_rally_data is mapping else 'unknown' -%}
                  {{ {'action':'CALL 911','priority':'location','advisory':'Address for dispatch: ' ~ _addr ~ '. Stay on line with 911. Send someone to front door to meet responders.'} }}
                {%- else -%}
                  {{ {'action':'ASSESS','priority':'general','advisory':'Review exits, shelter, and hazards for your situation. Call 911 if needed.'} }}
                {%- endif -%}

          # Topology coverage — identify rooms with no exit/window data registered
          - variables:
              _em_topology_coverage: >-
                {%- set ns = namespace(sparse=[], configured=0) -%}
                {%- for aid, sp in _em_topo.items() -%}
                  {%- set _spd = sp if sp is mapping else (sp | from_json if sp is string and sp | trim not in ['None','none','','null'] else none) -%}
                  {%- if _spd is mapping -%}
                    {%- if (_spd.get('portals', []) | list | length) > 0 or (_spd.get('windows', []) | list | length) > 0 -%}
                      {%- set ns.configured = ns.configured + 1 -%}
                    {%- else -%}
                      {%- set ns.sparse = ns.sparse + [area_name(aid) | default(aid, true)] -%}
                    {%- endif -%}
                  {%- else -%}
                    {%- set ns.sparse = ns.sparse + [area_name(aid) | default(aid, true)] -%}
                  {%- endif -%}
                {%- endfor -%}
                {%- set _advisory = none -%}
                {%- if ns.sparse | length > 0 -%}
                  {%- set _advisory = (ns.sparse | length | string) ~ ' of ' ~ (_em_topo | count | string) ~ ' room(s) have no exit/window data registered: ' ~ (ns.sparse | join(', ')) ~ '. Use mode=set area=X portals=[...]/windows=[...] to configure missing topology before advising evacuation routes.' -%}
                {%- endif -%}
                {{ {
                  'total_rooms': _em_topo | count,
                  'configured_rooms': ns.configured,
                  'sparse_rooms': ns.sparse,
                  'complete': ns.sparse | length == 0,
                  'advisory': _advisory
                } }}

          - variables:
              _result:
                status: ok
                mode: emergency
                scenario: "{{ _em_scenario }}"
                authority: "Room Manager is the sole authoritative source for all egress, shelter, hazard, and safety equipment data. Source: room_topology (household cabinet). Do not query secondary sources for spatial emergency data."
                guidance: "{{ _em_guidance }}"
                generated_at: "{{ now().isoformat() }}"
                location:
                  name: "{{ states('input_text.zenos_household_name') | default(none, true) }}"
                  address: "{{ _em_rally_data.address | default(none) }}"
                  zip_code: "{{ _em_rally_data.zip_code | default(none) }}"
                  gps:
                    lat: "{{ state_attr('zone.home', 'latitude') }}"
                    lon: "{{ state_attr('zone.home', 'longitude') }}"
                from_room: "{{ _em_from_room }}"
                exits: "{{ _em_exits }}"
                shelter: "{{ {'primary': _em_shelter.primary, 'secondary': _em_shelter.secondary} }}"
                safety_equipment: "{{ _em_safety_enriched.safety_equipment }}"
                hazards: "{{ _em_safety_enriched.hazards }}"
                likely_occupied: "{{ _em_occupied }}"
                rally_point: "{{ _em_rally }}"
                utility_cutoffs: >-
                  {%- set _ui=(state_attr(_hh_cabinet,'variables')|default({},true)).get('utility_index',none) -%}
                  {%- set _uid=_ui if _ui is mapping else (_ui|from_json if _ui is string and _ui|trim not in ['None','none','','null'] else {}) -%}
                  {%- set _uid=_uid.get('value',_uid) if _uid is mapping and 'value' in _uid else _uid -%}
                  {%- set ns=namespace(u=[]) -%}
                  {%- for k,v in _uid.items() if v is mapping and v.get('emerg_cutoff_loc','') != '' -%}
                    {%- set ns.u=ns.u+[{'type':k,'name':v.get('name',k),'emerg_cutoff_loc':v.get('emerg_cutoff_loc',''),'service_entry_loc':v.get('service_entry_loc',''),'emerg_phone':v.get('emerg_phone',''),'emerg_email':v.get('emerg_email',''),'notes':v.get('notes','')}] -%}
                  {%- endfor -%}
                  {{ ns.u }}
                exit_count: "{{ _em_exits | count }}"
                room_count: "{{ _em_topo | count }}"
                caller_token: "{{ _caller_token }}"
          - stop: emergency
            response_variable: _result

      # ═══════════════════════════════════════════════════════════════════════
      # 11. AREA_CREATE — create HA area, assign floor, apply room_layout, init topology
      # ═══════════════════════════════════════════════════════════════════════
      - if: "{{ _mode == 'area_create' }}"
        then:
          - variables:
              _ac_name: "{{ area_name | default('') | trim }}"
              _ac_floor: "{{ floor_id_new | default('') | trim }}"

          - if: "{{ _ac_name == '' }}"
            then:
              - variables:
                  _result: {status: error, mode: area_create, message: "area_name= required for area_create.", caller_token: "{{ _caller_token }}"}
              - stop: area_create error
                response_variable: _result

          - if: "{{ _dry_run }}"
            then:
              - variables:
                  _result:
                    status: dry_run
                    mode: area_create
                    area_name: "{{ _ac_name }}"
                    floor_id: "{{ _ac_floor if _ac_floor != '' else none }}"
                    topology_init: "{{ walls is defined or description is defined or area_note is defined }}"
                    caller_token: "{{ _caller_token }}"
              - stop: area_create dry_run
                response_variable: _result

          # Step 1: Guard — area already exists?
          - if: "{{ area_id(_ac_name) not in ['', none, 'None'] }}"
            then:
              - variables:
                  _result:
                    status: error
                    mode: area_create
                    message: >-
                      Area '{{ _ac_name }}' already exists (area_id={{ area_id(_ac_name) }}).
                      Use mode=area_update area={{ area_id(_ac_name) }} to modify it,
                      or mode=set area={{ area_id(_ac_name) }} to register topology.
                    area_id: "{{ area_id(_ac_name) }}"
                    caller_token: "{{ _caller_token }}"
              - stop: area_create — area already exists
                response_variable: _result

          # Step 1: Create HA area via ectoplasm (Spook)
          - action: script.zen_dojotools_ectoplasm
            data:
              action_type: area_create
              area_name: "{{ _ac_name }}"
            response_variable: _ac_ecto_create
            continue_on_error: true

          # Wait for HA area registry to settle
          - delay: "00:00:01.5"

          # Step 2: Resolve new area_id by display name lookup
          - variables:
              _ac_area_id: >-
                {{ area_id(_ac_name) | default(_ac_name | lower | replace(' ','_'), true) }}

          # Step 3: Assign floor if provided
          - choose:
            - conditions: "{{ _ac_floor != '' }}"
              sequence:
              # Guard — invalid floor slug kills chat (ServiceValidationError not caught by continue_on_error)
              - if: "{{ _ac_floor not in floors() }}"
                then:
                  - variables:
                      _result:
                        status: error
                        mode: area_create
                        message: >-
                          Floor '{{ _ac_floor }}' not found. Valid floor IDs: {{ floors() | join(', ') }}.
                          Area '{{ _ac_name }}' ({{ _ac_area_id }}) was created — use mode=area_update to assign a floor.
                        area_id: "{{ _ac_area_id }}"
                        caller_token: "{{ _caller_token }}"
                  - stop: area_create — invalid floor_id
                    response_variable: _result
              - action: script.zen_dojotools_ectoplasm
                data:
                  action_type: floor_assign_area
                  area_id: "{{ _ac_area_id }}"
                  floor_id: "{{ _ac_floor }}"
                response_variable: _ac_ecto_floor
                continue_on_error: true

          # Step 4: Apply room_layout label
          - action: script.zen_dojotools_labels
            data:
              action_type: tag
              label_list:
                - room_layout
              target_areas:
                - "{{ _ac_area_id }}"
              confirm: true
            response_variable: _ac_label_result
            continue_on_error: true

          # Step 5: Init topology if topology params provided
          - choose:
            - conditions: >-
                {{ (walls is defined and walls is not none)
                   or (description is defined and description is not none)
                   or (area_note is defined and area_note is not none)
                   or (grocy_location_id is defined and grocy_location_id is not none)
                   or (exterior is defined and exterior is not none)
                   or (shelter_eligible is defined and shelter_eligible is not none) }}
              sequence:
              - action: script.zen_dojotools_filecabinet
                data:
                  action_type: >-
                    {%- set _cv=state_attr(_hh_cabinet,'variables')|default({},true) -%}
                    {{ 'update' if _cv.get('room_topology',none) is not none else 'create' }}
                  key: room_topology
                  volume_entity_id: "{{ _hh_cabinet }}"
                  value: >-
                    {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}{%- set topo = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'room_topology') | from_json -%}
                    {%- set _ex0=topo.get(_ac_area_id,{}) -%}
                    {%- set ns=namespace(p=_ex0 if _ex0 is mapping else {}) -%}
                    {%- if walls is defined and walls is not none -%}{%- set ns.p=ns.p|combine({'walls':walls|int}) -%}{%- endif -%}
                    {%- if description is defined and description is not none -%}{%- set ns.p=ns.p|combine({'description':description|string}) -%}{%- endif -%}
                    {%- if area_note is defined and area_note is not none -%}{%- set ns.p=ns.p|combine({'area_note':area_note|string}) -%}{%- endif -%}
                    {%- if grocy_location_id is defined and grocy_location_id is not none and grocy_location_id|trim != '' -%}{%- set ns.p=ns.p|combine({'grocy_location_id':grocy_location_id|trim}) -%}{%- endif -%}
                    {%- if wiki_path is defined and wiki_path is not none and wiki_path|trim != '' -%}{%- set ns.p=ns.p|combine({'wiki_path':wiki_path|trim}) -%}{%- endif -%}
                    {%- if exterior is defined and exterior is not none -%}{%- set ns.p=ns.p|combine({'exterior':exterior}) -%}{%- endif -%}
                    {%- if shelter_eligible is defined and shelter_eligible is not none -%}{%- set ns.p=ns.p|combine({'shelter_eligible':shelter_eligible}) -%}{%- endif -%}
                    {{ (topo | combine({_ac_area_id: ns.p})) | tojson }}
                response_variable: _ac_fc_result
                continue_on_error: true

          - variables:
              _result:
                status: ok
                mode: area_create
                area_name: "{{ _ac_name }}"
                area_id: "{{ _ac_area_id }}"
                floor_assigned: "{{ _ac_floor if _ac_floor != '' else none }}"
                room_layout_tagged: "{{ (_ac_label_result.status | default('error')) == 'ok' }}"
                topology_initialized: "{{ (walls is defined and walls is not none) or (description is defined and description is not none) or (area_note is defined and area_note is not none) }}"
                ecto_status: "{{ _ac_ecto_create.status | default('unknown') }}"
                advisory: >-
                  Area '{{ _ac_name }}' created (area_id={{ _ac_area_id }}).
                  Verify: zen_dojotools_inspect mode=area_list.
                  Next: mode=link area={{ _ac_area_id }} area_b=NEIGHBOR per adjacent room.
                  To sync HA area description: mode=area_update area={{ _ac_area_id }} area_note='...'.
                caller_token: "{{ _caller_token }}"
          - stop: area_create
            response_variable: _result

      # ═══════════════════════════════════════════════════════════════════════
      # 12. AREA_UPDATE — update HA area metadata + compile spatial description
      # ═══════════════════════════════════════════════════════════════════════
      - if: "{{ _mode == 'area_update' }}"
        then:
          - if: "{{ _area_id == '' }}"
            then:
              - variables:
                  _result: {status: error, mode: area_update, message: "area= required for area_update.", caller_token: "{{ _caller_token }}"}
              - stop: area_update error
                response_variable: _result

          # Resolve area_note: param takes priority, then stored topology value
          - variables:
              _au_note: >-
                {%- set _n=area_note | default('', true) | string | trim -%}
                {%- if _n != '' -%}{{ _n }}{%- else -%}
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}{%- set topo = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'room_topology') | from_json -%}
                  {{ topo.get(_area_id,{}).get('area_note','') | default('',true) | trim }}
                {%- endif -%}
              _au_adj: >-
                {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}{%- set topo = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'room_topology') | from_json -%}
                {%- set sp=topo.get(_area_id,{}) if _area_id != '' else {} -%}
                {%- set ns=namespace(names=[]) -%}
                {%- for adj_id in (sp.get('adjacent',[])|list)[:4] -%}
                  {%- set ns.names=ns.names+[area_name(adj_id)|default(adj_id,true)] -%}
                {%- endfor -%}
                {{ ns.names }}

          # Compile HA area description: floor + adjacency + area_note
          - variables:
              _au_compiled_desc: >-
                {%- set _fid=floor_id(_area_name)|default('',true)|string -%}
                {%- set _fln=floor_name(_fid)|default('',true)|trim if _fid not in ['','none','None'] else '' -%}
                {%- set parts=namespace(p=[]) -%}
                {%- if _fln != '' -%}{%- set parts.p=parts.p+[_fln ~ ' floor'] -%}{%- endif -%}
                {%- if _au_adj|length > 0 -%}{%- set parts.p=parts.p+['Adj: ' ~ _au_adj|join(', ')] -%}{%- endif -%}
                {%- if _au_note != '' -%}{%- set parts.p=parts.p+[_au_note] -%}{%- endif -%}
                {{ (parts.p | join('. '))[:255] }}

          - if: "{{ _dry_run }}"
            then:
              - variables:
                  _result:
                    status: dry_run
                    mode: area_update
                    area_id: "{{ _area_id }}"
                    compiled_description: "{{ _au_compiled_desc }}"
                    area_name_new: "{{ area_name_new | default(none, true) }}"
                    floor_id_new: "{{ floor_id_new | default(none, true) }}"
                    icon: "{{ icon | default(none, true) }}"
                    picture: "{{ picture | default(none, true) }}"
                    caller_token: "{{ _caller_token }}"
              - stop: area_update dry_run
                response_variable: _result

          # Step 1: Update RM topology (area_note, description)
          - choose:
            - conditions: >-
                {{ (area_note is defined and area_note is not none)
                   or (description is defined and description is not none) }}
              sequence:
              - action: script.zen_dojotools_filecabinet
                data:
                  action_type: >-
                    {%- set _cv=state_attr(_hh_cabinet,'variables')|default({},true) -%}
                    {{ 'update' if _cv.get('room_topology',none) is not none else 'create' }}
                  key: room_topology
                  volume_entity_id: "{{ _hh_cabinet }}"
                  value: >-
                    {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}{%- set topo = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'room_topology') | from_json -%}
                    {%- set _ex0=topo.get(_area_id,{}) -%}
                    {%- set ns=namespace(p=_ex0 if _ex0 is mapping else {}) -%}
                    {%- if area_note is defined and area_note is not none -%}{%- set ns.p=ns.p|combine({'area_note':area_note|string}) -%}{%- endif -%}
                    {%- if description is defined and description is not none -%}{%- set ns.p=ns.p|combine({'description':description|string}) -%}{%- endif -%}
                    {{ (topo | combine({_area_id: ns.p})) | tojson }}
                response_variable: _au_fc_result
                continue_on_error: true

          # Step 2: Floor reassignment — Spook provides no update_area service.
          # Rename, icon, picture, and HA description must be set via HA Settings → Areas UI.
          # Step 4: Reassign floor if provided
          - choose:
            - conditions: "{{ floor_id_new is defined and floor_id_new is not none and (floor_id_new|string)|trim != '' }}"
              sequence:
              # Guard — invalid floor slug kills chat (ServiceValidationError not caught by continue_on_error)
              - if: "{{ (floor_id_new|string)|trim not in floors() }}"
                then:
                  - variables:
                      _result:
                        status: error
                        mode: area_update
                        message: >-
                          Floor '{{ (floor_id_new|string)|trim }}' not found. Valid floor IDs: {{ floors() | join(', ') }}.
                          Other area_update fields were applied — resubmit with a valid floor_id_new to assign the floor.
                        area_id: "{{ _area_id }}"
                        caller_token: "{{ _caller_token }}"
                  - stop: area_update — invalid floor_id_new
                    response_variable: _result
              - action: script.zen_dojotools_ectoplasm
                data:
                  action_type: floor_assign_area
                  area_id: "{{ _area_id }}"
                  floor_id: "{{ (floor_id_new|string)|trim }}"
                continue_on_error: true

          - variables:
              _result:
                status: ok
                mode: area_update
                area_id: "{{ _area_id }}"
                compiled_description: "{{ _au_compiled_desc }}"
                floor_id_new: "{{ floor_id_new | default(none, true) }}"
                ha_ui_advisory: >-
                  {%- set _req = [] -%}
                  {%- if area_name_new is defined and area_name_new is not none and (area_name_new|string)|trim != '' -%}{%- set _req = _req + ['rename'] -%}{%- endif -%}
                  {%- if icon is defined and icon is not none and (icon|string)|trim != '' -%}{%- set _req = _req + ['icon'] -%}{%- endif -%}
                  {%- if picture is defined and picture is not none and (picture|string)|trim != '' -%}{%- set _req = _req + ['picture'] -%}{%- endif -%}
                  {{ ('Spook has no update_area service — ' ~ (_req | join(', ')) ~ ' must be set via HA Settings → Areas UI.') if _req | length > 0 else none }}
                caller_token: "{{ _caller_token }}"
          - stop: area_update
            response_variable: _result

      # ═══════════════════════════════════════════════════════════════════════
      # 13. AREA_DELETE — remove HA area + topology entry (confirm required)
      # ═══════════════════════════════════════════════════════════════════════
      - if: "{{ _mode == 'area_delete' }}"
        then:
          - if: "{{ _area_id == '' }}"
            then:
              - variables:
                  _result: {status: error, mode: area_delete, message: "area= required for area_delete.", caller_token: "{{ _caller_token }}"}
              - stop: area_delete error
                response_variable: _result

          - if: "{{ not (confirm_action | default(false) | bool) }}"
            then:
              - variables:
                  _result:
                    status: preview
                    mode: area_delete
                    area_id: "{{ _area_id }}"
                    area_name: "{{ _area_name }}"
                    message: "Pass confirm_action: true to delete area '{{ _area_name }}' ({{ _area_id }}) and remove topology. IRREVERSIBLE."
                    in_topology: >-
                      {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}{%- set topo = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'room_topology') | from_json -%}
                      {{ _area_id in topo }}
                    caller_token: "{{ _caller_token }}"
              - stop: area_delete preview
                response_variable: _result

          # Step 1: Delete HA area via ectoplasm (Spook)
          - action: script.zen_dojotools_ectoplasm
            data:
              action_type: area_delete
              area_id: "{{ _area_id }}"
            response_variable: _ad_ecto_result
            continue_on_error: true

          # Step 2: Remove from RM topology
          - choose:
            - conditions: >-
                {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}{%- set topo = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'room_topology') | from_json -%}
                {{ _area_id in topo and _hh_cabinet != '' }}
              sequence:
              - action: script.zen_dojotools_filecabinet
                data:
                  action_type: update
                  key: room_topology
                  volume_entity_id: "{{ _hh_cabinet }}"
                  value: >-
                    {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}{%- set topo = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'room_topology') | from_json -%}
                    {%- set ns=namespace(t={}) -%}
                    {%- for k,v in topo.items() -%}
                      {%- if k != _area_id -%}{%- set ns.t=ns.t|combine({k:v}) -%}{%- endif -%}
                    {%- endfor -%}
                    {{ ns.t | tojson }}
                response_variable: _ad_fc_result
                continue_on_error: true

          - variables:
              _result:
                status: ok
                mode: area_delete
                area_id: "{{ _area_id }}"
                area_name: "{{ _area_name }}"
                ecto_status: "{{ _ad_ecto_result.status | default('unknown') }}"
                topology_removed: "{{ _ad_fc_result is defined }}"
                caller_token: "{{ _caller_token }}"
          - stop: area_delete
            response_variable: _result

      # ═══════════════════════════════════════════════════════════════════════
      # 14. UTILITY — NFPA preplan service entry + emergency cutoff registry
      #     Stores utility_index drawer in household cabinet.
      #     Surfaced in mode=emergency (utility_cutoffs) and mode=home_overview.
      # ═══════════════════════════════════════════════════════════════════════
      - if: "{{ _mode == 'utility' }}"
        then:
          - if: "{{ _hh_cabinet == '' }}"
            then:
              - variables:
                  _result: {status: error, mode: utility, message: "Household cabinet unreachable.", caller_token: "{{ _caller_token }}"}
              - stop: utility error
                response_variable: _result
          - variables:
              _ut_action: "{{ utility_action | default('list') | lower | trim }}"
              _ut_type: "{{ utility_type | default('') | lower | trim }}"
              _ut_raw: >-
                {%- set _r=(state_attr(_hh_cabinet,'variables')|default({},true)).get('utility_index',none) -%}
                {%- set _rd=_r if _r is mapping else (_r|from_json if _r is string and _r|trim not in ['None','none','','null'] else {}) -%}
                {{ _rd.get('value',_rd) if _rd is mapping and 'value' in _rd else _rd }}
          - choose:
            - conditions: "{{ _ut_action == 'list' }}"
              sequence:
                - variables:
                    _result:
                      status: ok
                      mode: utility
                      utility_action: list
                      utilities: "{{ _ut_raw }}"
                      count: "{{ _ut_raw | count }}"
                      caller_token: "{{ _caller_token }}"
                - stop: utility list
                  response_variable: _result
          - choose:
            - conditions: "{{ _ut_action == 'get' }}"
              sequence:
                - if: "{{ _ut_type == '' }}"
                  then:
                    - variables:
                        _result: {status: error, mode: utility, utility_action: get, message: "utility_type= required for get.", caller_token: "{{ _caller_token }}"}
                    - stop: utility get error
                      response_variable: _result
                - variables:
                    _result:
                      status: ok
                      mode: utility
                      utility_action: get
                      utility_type: "{{ _ut_type }}"
                      utility: "{{ _ut_raw.get(_ut_type, none) }}"
                      found: "{{ _ut_type in _ut_raw }}"
                      caller_token: "{{ _caller_token }}"
                - stop: utility get
                  response_variable: _result
          - choose:
            - conditions: "{{ _ut_action == 'set' }}"
              sequence:
                - if: "{{ _ut_type == '' }}"
                  then:
                    - variables:
                        _result: {status: error, mode: utility, utility_action: set, message: "utility_type= required for set.", caller_token: "{{ _caller_token }}"}
                    - stop: utility set error
                      response_variable: _result
                - variables:
                    _ut_entry: >-
                      {%- set _cur=_ut_raw.get(_ut_type,{}) -%}
                      {%- set _up=_cur|default({}) -%}
                      {%- if utility_name is defined and (utility_name|string)|trim != '' -%}{%- set _up=_up|combine({'name':(utility_name|string)|trim}) -%}{%- endif -%}
                      {%- if service_entry_loc is defined and (service_entry_loc|string)|trim != '' -%}{%- set _up=_up|combine({'service_entry_loc':(service_entry_loc|string)|trim}) -%}{%- endif -%}
                      {%- if emerg_cutoff_loc is defined and (emerg_cutoff_loc|string)|trim != '' -%}{%- set _up=_up|combine({'emerg_cutoff_loc':(emerg_cutoff_loc|string)|trim}) -%}{%- endif -%}
                      {%- if utility_notes is defined and (utility_notes|string)|trim != '' -%}{%- set _up=_up|combine({'notes':(utility_notes|string)|trim}) -%}{%- endif -%}
                      {%- if utility_emerg_phone is defined and (utility_emerg_phone|string)|trim != '' -%}{%- set _up=_up|combine({'emerg_phone':(utility_emerg_phone|string)|trim}) -%}{%- endif -%}
                      {%- if utility_emerg_email is defined and (utility_emerg_email|string)|trim != '' -%}{%- set _up=_up|combine({'emerg_email':(utility_emerg_email|string)|trim}) -%}{%- endif -%}
                      {{ _up | combine({'type': _ut_type}) }}
                    _ut_updated: "{{ _ut_raw | combine({_ut_type: _ut_entry}) }}"
                - action: script.zen_dojotools_filecabinet
                  data:
                    action_type: create
                    force_action: true
                    set_timestamp: true
                    show_hidden_volumes: false
                    volume_entity_id:
                      - "{{ _hh_cabinet }}"
                    key: utility_index
                    value: "{{ _ut_updated | tojson }}"
                - variables:
                    _result:
                      status: ok
                      mode: utility
                      utility_action: set
                      utility_type: "{{ _ut_type }}"
                      utility: "{{ _ut_entry }}"
                      caller_token: "{{ _caller_token }}"
                - stop: utility set
                  response_variable: _result
          - choose:
            - conditions: "{{ _ut_action == 'delete' }}"
              sequence:
                - if: "{{ _ut_type == '' }}"
                  then:
                    - variables:
                        _result: {status: error, mode: utility, utility_action: delete, message: "utility_type= required for delete.", caller_token: "{{ _caller_token }}"}
                    - stop: utility delete error
                      response_variable: _result
                - variables:
                    _ut_pruned: >-
                      {%- set ns=namespace(d={}) -%}
                      {%- for k,v in _ut_raw.items() if k != _ut_type -%}{%- set ns.d=ns.d|combine({k:v}) -%}{%- endfor -%}
                      {{ ns.d }}
                - action: script.zen_dojotools_filecabinet
                  data:
                    action_type: create
                    force_action: true
                    set_timestamp: true
                    show_hidden_volumes: false
                    volume_entity_id:
                      - "{{ _hh_cabinet }}"
                    key: utility_index
                    value: "{{ _ut_pruned | tojson }}"
                - variables:
                    _result:
                      status: ok
                      mode: utility
                      utility_action: delete
                      utility_type: "{{ _ut_type }}"
                      deleted: true
                      caller_token: "{{ _caller_token }}"
                - stop: utility delete
                  response_variable: _result
          - variables:
              _result: {status: error, mode: utility, utility_action: "{{ _ut_action }}", message: "Unknown utility_action. Use list, get, set, delete.", caller_token: "{{ _caller_token }}"}
          - stop: utility unknown action
            response_variable: _result

      # ═══════════════════════════════════════════════════════════════════════
      # 15. SETUP — deploy RM KFC to dojo via rm_loader
      # ═══════════════════════════════════════════════════════════════════════
      - if: "{{ _mode == 'setup' }}"
        then:
          # BUG FIX (2026-08-05): one setup mode handles ALL setup concerns —
          # KFC deploy (existing) AND occupancy cabinet provisioning (new) —
          # rather than a second, separately-named setup-flavored mode.
          - variables:
              _setup_dry_run: "{{ dry_run | default(false) | bool }}"
              _setup_confirmed: "{{ confirm_action | default(false) | bool }}"
          # ── Resolve + validate the occupancy expansion cabinet target ──────
          # Done BEFORE the preview gate so preview mode can show exactly which
          # cabinet would be claimed and whether it's actually safe to claim,
          # not just a generic "this will happen" message.
          - variables:
              _setup_target_raw: "{{ target_expansion_cabinet | default('') | trim }}"
          # BUG FIX (2026-08-05): the candidate list used to be built via a
          # map()/regex_replace() filter chain rendered through a scalar `>-`
          # block — that renders to a STRING representation of a list, not a
          # real list object, so the for-loop below it silently iterated over
          # characters instead of entity_ids and matched nothing (found live
          # on H: 3 genuinely online_unmounted cabinets, tool still reported
          # "none available"). Same class of bug as
          # feedback_ha_template_native_type_coercion — fixed with the
          # reliable namespace+for-loop idiom instead of a filter chain.
          - variables:
              _setup_target_cab: >-
                {%- set ns = namespace(found='') -%}
                {%- if _setup_target_raw != '' -%}
                  {%- set _digits = _setup_target_raw | regex_findall('\d+') -%}
                  {%- set ns.found = ('sensor.zenos_expansion_cabinet_' ~ _digits[0]) if _digits else _setup_target_raw -%}
                {%- else -%}
                  {%- for _n in range(1, 11) -%}
                    {%- set _cid = 'sensor.zenos_expansion_cabinet_' ~ _n -%}
                    {%- if ns.found == '' and states(_cid) == 'online_unmounted' -%}
                      {%- set ns.found = _cid -%}
                    {%- endif -%}
                  {%- endfor -%}
                {%- endif -%}
                {{ ns.found }}
          - variables:
              _setup_target_state: "{{ states(_setup_target_cab) if _setup_target_cab != '' else 'not_found' }}"
          - variables:
              _setup_sys_drawers: ['AI_Cabinet_VolumeInfo', 'meta', '_label_index', '_zen_relationships']
              _setup_target_vars: >-
                {{ (state_attr(_setup_target_cab, 'variables') | default({}, true))
                   if _setup_target_cab != '' else {} }}
              _setup_target_user_keys: >-
                {{ _setup_target_vars.keys() | reject('in', _setup_sys_drawers) | list }}
          - variables:
              _setup_target_err: >-
                {%- if _setup_target_cab == '' -%}
                  {{ 'No expansion cabinet available to claim — all slots are mounted. v9 may add on-demand expansion cabinet provisioning; for now, free one manually or specify target_expansion_cabinet explicitly.' if _setup_target_raw == '' else ('target_expansion_cabinet \"' ~ _setup_target_raw ~ '\" did not resolve to a real cabinet entity.') }}
                {%- elif _setup_target_state not in ['online_unmounted', 'init'] -%}
                  Expansion cabinet {{ _setup_target_cab }} is not available to claim (state: {{ _setup_target_state }} — likely already mounted/in use). Pick a different target_expansion_cabinet or omit it to auto-select.
                {%- elif _setup_target_user_keys | count > 0 -%}
                  Expansion cabinet {{ _setup_target_cab }} is not empty — contains real drawers ({{ _setup_target_user_keys | join(', ') }}). Refusing to claim it: this guard exists specifically so occupancy provisioning never silently co-opts or overwrites a cabinet something else is already using. Pick a different target_expansion_cabinet.
                {%- else -%}
                  {{ '' }}
                {%- endif -%}
          - if: "{{ _setup_target_err != '' and (_setup_dry_run or not _setup_confirmed or true) }}"
            then:
              # Always a hard stop, preview or not — an unsafe/unavailable
              # target is never something to silently skip past.
              - variables:
                  _setup_target_error_resp:
                    status: error
                    mode: setup
                    message: "{{ _setup_target_err }}"
                    candidate_expansion_cabinet: "{{ _setup_target_cab }}"
                    caller_token: "{{ _caller_token }}"
              - stop: setup occupancy target invalid
                response_variable: _setup_target_error_resp
          - if: "{{ _setup_dry_run or not _setup_confirmed }}"
            then:
              - variables:
                  _setup_preview:
                    status: preview
                    mode: setup
                    message: "Pass confirm_action: true (and omit dry_run, or leave it false) to execute. Will (1) deploy room_manager KFC to dojo — stamps component_instructions + trigger_subscriptions (ha_start, home_occupancy_change, home_mode_updates, force_summary) under key: room_manager, and (2) provision the occupancy cabinet — claims {{ _setup_target_cab }}, mounts it at the household cabinet's room_occupancy key, stamps _setup_complete after verified read-back. Idempotent: no-ops the occupancy step if room_occupancy is already mounted."
                    kfc_key: room_manager
                    version: "1.0.0"
                    trigger_subscriptions: [ha_start, home_occupancy_change, home_mode_updates, force_summary]
                    occupancy_cabinet_target: "{{ _setup_target_cab }}"
                    occupancy_cabinet_target_verified_empty: true
                    caller_token: "{{ _caller_token }}"
              - stop: setup_preview
                response_variable: _setup_preview
          - variables:
              _setup_dojo_cab: "{{ states('sensor.zen_dojo_cabinet_resolved') }}"
              _setup_hh_cab: "{{ _hh_cabinet }}"
          - if: "{{ _setup_dojo_cab in ['', 'unavailable', 'unknown'] or _setup_hh_cab == '' }}"
            then:
              - variables:
                  _setup_preflight_err:
                    status: error
                    mode: setup
                    message: >-
                      Setup preflight failed — required cabinets not accessible.
                      Ensure Flynn base install is complete before running RM setup.
                    missing: >-
                      {{ (['Zen Dojo Cabinet' ] if _setup_dojo_cab  == '' else [])
                       + (['Zen Household Cabinet'] if _setup_hh_cab == '' else []) }}
                    action: >-
                      Check HA Labels UI — verify both 'Zen Dojo Cabinet' and
                      'Zen Household Cabinet' labels are assigned to their cabinet
                      sensor entities. Then call mode=setup again.
                    caller_token: "{{ _caller_token }}"
              - stop: setup preflight failed
                response_variable: _setup_preflight_err
          # ── Occupancy cabinet provisioning — idempotent ─────────────────────
          - variables:
              _setup_occ_existing: >-
                {%- set _rv = (state_attr(_setup_hh_cab, 'variables') | default({}, true)).get('room_occupancy', {}) -%}
                {%- set _rv = _rv.get('value', _rv) if _rv is mapping else _rv -%}
                {%- set _rv = (_rv | from_json) if _rv is string else _rv -%}
                {{ _rv if _rv is mapping else {} }}
              _setup_occ_already_mounted: >-
                {{ _setup_occ_existing.get('mount_point', false) == true
                   and _setup_occ_existing.get('target_entity_id', '') != '' }}
          - if: "{{ not _setup_occ_already_mounted }}"
            then:
              - action: script.zen_dojotools_filecabinet
                data:
                  action_type: create
                  force_action: true
                  set_timestamp: true
                  show_hidden_volumes: false
                  volume_entity_id:
                    - "{{ _setup_target_cab }}"
                  key: _setup_complete
                  value:
                    completed: true
                    completed_at: "{{ now().isoformat() }}"
                    claimed_by: zen_dojotools_room_manager
              - action: script.zen_dojotools_filecabinet
                data:
                  action_type: >-
                    {{ 'update' if _setup_occ_existing else 'create' }}
                  force_action: true
                  set_timestamp: true
                  show_hidden_volumes: false
                  volume_entity_id:
                    - "{{ _setup_hh_cab }}"
                  key: room_occupancy
                  value:
                    mount_point: true
                    target_entity_id: "{{ _setup_target_cab }}"
              # Verified read-back — never stamp success optimistically.
              - action: script.zen_dojotools_filecabinet
                data:
                  action_type: get
                  volume_entity_id: "{{ _setup_hh_cab }}"
                  key: room_occupancy
                response_variable: _setup_occ_verify_raw
          - variables:
              _setup_occ_verified: >-
                {%- if _setup_occ_already_mounted -%}
                  true
                {%- else -%}
                  {%- set _v = _setup_occ_verify_raw.get('value', {}) if _setup_occ_verify_raw is mapping else {} -%}
                  {{ _v.get('mount_point', false) == true and _v.get('target_entity_id', '') == _setup_target_cab }}
                {%- endif -%}
              _setup_occ_result:
                already_mounted: "{{ _setup_occ_already_mounted }}"
                target_cabinet: >-
                  {{ _setup_occ_existing.get('target_entity_id', '') if _setup_occ_already_mounted else _setup_target_cab }}
                verified: "{{ _setup_occ_verified }}"
          - alias: 'Ship KFC: room_manager (Scribe — new_thought)'
            action: script.zen_dojotools_scribe
            data:
              mode: new_thought
              key: room_manager
              friendly_name: Room Manager
              label: room_manager
              version_semantic: "5.2.0"
              component_summary: >-
                Household spatial map — rooms, portals, occupants, live context slices.
                Consult for any room-centric task.
              component_instructions: >-
                SCOPE: Spatial topology and live room context for the household.
                  Room data: zen_dojotools_room_manager (household cabinet, key: room_topology).
                  Registered rooms have label room_layout on their HA area.

                DATA ACCESS:
                  Primary: zen_dojotools_room_manager mode=home_overview — whole-house snapshot.
                    Returns: registered_room_count, floor_count, floors[]{floor_id, rooms[]{area_id,
                    display_name, context{topo,light,climate,covers,media}}}, domain_summaries,
                    domain_summaries.maintenance{battery_count,alert_count}.
                  Per-room: zen_dojotools_room_manager mode=get area={area_id} with context_slices=+topo,+light,+climate,+covers,+media.
                    Returns: spatial{portals[], windows[], walls, adjacent[], occupants[]}, features[], exits[].
                  Registered rooms: areas with label room_layout. Use inspect mode=area_list to enumerate.

                WHAT TO SURFACE:
                  1. Rooms with active domains — lights on, climate running, media playing, covers open.
                     Lead with what is running: "Kitchen: lights 72%, climate cooling 72°F. Office: lights on."
                  2. Floor-grouped summary when multiple floors are active.
                  3. Maintenance: if battery_count > 0 or alert_count > 0, surface the counts.
                  4. Exterior portals (exit=true) — note if open when mode is away or sleep.
                  5. Egress summary only if safety context (away mode, alarm active, force_summary).

                TRIGGER CONTEXT:
                  ha_start — ambient topology snapshot. Flag any rooms with unexpected active states.
                  home_occupancy_change — re-derive active rooms. Surface context for the arriving or
                    departing person's rooms (cross-reference occupants[] from mode=get).
                  home_mode_updates — re-evaluate room relevance for new mode.
                    away: flag lights or media still running in any room.
                    sleep: flag non-bedroom lights on or covers open.
                    home: ambient context only.
                  force_summary — full home_overview across all floors and all active rooms.

                NAVIGATION:
                  Registered rooms: label room_layout on HA area.
                  Room topology: zen_dojotools_room_manager mode=get area={slug}.
                  Domain routing per room: zen_dojotools_room_manager mode=help → domain_routing.
                  Adjacent rooms for bleed: spatial.adjacent[] in get response.
                  Whole-house snapshot: mode=home_overview (no area= needed).

                OUTPUT FORMAT:
                  Active rooms: lead with floor, then room — one line per room with domain signals.
                  Nominal: "House nominal. N rooms across F floors. Maintenance: X batteries low, Y alerts."
                  Active: "[Floor]: [Room] — [domain signals]. [Room] — ..."
                  Keep per-room lines to one. Reserve detail for on-demand mode=get calls.

                TONE: Spatial and ambient. This is the house map, not the alert surface.
                  Speak like a crew chief walking the building — concise, positional, factual.
              trigger_subscriptions: "ha_start,home_occupancy_change,home_mode_updates,force_summary"
              drift_threshold: 5
              emission_cooldown_minutes: 30
              delay_seconds: 0
              caller_id: zen_dojotools_room_manager
          - alias: 'Ship KFC: room_manager (Scribe — formalize_scroll)'
            action: script.zen_dojotools_scribe
            data:
              mode: formalize_scroll
              key: room_manager
              caller_id: zen_dojotools_room_manager
          - alias: 'Ship KFC: room_manager (Scribe — publish_kfc)'
            action: script.zen_dojotools_scribe
            data:
              mode: publish_kfc
              key: room_manager
              publish_confirm: true
              caller_id: zen_dojotools_room_manager
            response_variable: _kfc_result
          - variables:
              _setup_result:
                status: success
                mode: setup
                kfc_key: room_manager
                version: "1.0.0"
                deployed: "{{ _kfc_result }}"
                occupancy_cabinet: "{{ _setup_occ_result }}"
                caller_token: "{{ _caller_token }}"
          - stop: setup
            response_variable: _setup_result

      # ═══════════════════════════════════════════════════════════════════════
      # 14b. ZONES (list sub-room zones for an area)
      # ═══════════════════════════════════════════════════════════════════════
      - if: "{{ _mode == 'zones' }}"
        then:
          - if: "{{ _hh_cabinet == '' or _area_id == '' }}"
            then:
              - variables:
                  _result:
                    status: error
                    mode: zones
                    message: "zones requires area=."
                    caller_token: "{{ _caller_token }}"
              - stop: zones error
                response_variable: _result
          - variables:
              _result:
                status: ok
                mode: zones
                area_id: "{{ _area_id }}"
                room_zones: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}{%- set topo = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'room_topology') | from_json -%}
                  {{ (topo.get(_area_id, {}) or {}).get('room_zones', []) }}
                caller_token: "{{ _caller_token }}"
          - stop: zones
            response_variable: _result

      # ═══════════════════════════════════════════════════════════════════════
      # 14c. ZONE_SET (upsert one zone into a room)
      # ═══════════════════════════════════════════════════════════════════════
      - if: "{{ _mode == 'zone_set' }}"
        then:
          - if: "{{ _hh_cabinet == '' or _area_id == '' or room_zone is none or not (room_zone is mapping) }}"
            then:
              - variables:
                  _result:
                    status: error
                    mode: zone_set
                    message: "zone_set requires area= and room_zone= (JSON: {name, bearing, mark, distance_ft, radius_ft, type, ...})."
                    caller_token: "{{ _caller_token }}"
              - stop: zone_set error
                response_variable: _result
          - action: script.zen_dojotools_filecabinet
            data:
              action_type: >-
                {%- set _cv=state_attr(_hh_cabinet,'variables')|default({},true) -%}
                {{ 'update' if _cv.get('room_topology',none) is not none else 'create' }}
              key: room_topology
              volume_entity_id: "{{ _hh_cabinet }}"
              value: >-
                {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}{%- set topo = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'room_topology') | from_json -%}
                {%- set _ex=topo.get(_area_id, {}) -%}{%- set _ex=_ex if _ex is mapping else {} -%}
                {%- set _ez=_ex.get('room_zones', []) | list -%}
                {%- set _zname=room_zone.get('name', none) -%}
                {%- if _zname is not none -%}
                  {%- set _ez=(_ez | rejectattr('name','eq',_zname) | list) + [room_zone] -%}
                {%- else -%}
                  {%- set _ez=_ez + [room_zone] -%}
                {%- endif -%}
                {{ (topo | combine({_area_id: _ex | combine({'room_zones': _ez})})) | tojson }}
            response_variable: _zs_fc
          - variables:
              _result:
                status: ok
                mode: zone_set
                area_id: "{{ _area_id }}"
                zone_name: "{{ room_zone.get('name', '') }}"
                caller_token: "{{ _caller_token }}"
          - stop: zone_set
            response_variable: _result

      # ═══════════════════════════════════════════════════════════════════════
      # 14d. ZONE_REMOVE (remove a zone by name)
      # ═══════════════════════════════════════════════════════════════════════
      - if: "{{ _mode == 'zone_remove' }}"
        then:
          - if: "{{ _hh_cabinet == '' or _area_id == '' or _item_name == '' }}"
            then:
              - variables:
                  _result:
                    status: error
                    mode: zone_remove
                    message: "zone_remove requires area= and name= (zone name to delete)."
                    caller_token: "{{ _caller_token }}"
              - stop: zone_remove error
                response_variable: _result
          - action: script.zen_dojotools_filecabinet
            data:
              action_type: >-
                {%- set _cv=state_attr(_hh_cabinet,'variables')|default({},true) -%}
                {{ 'update' if _cv.get('room_topology',none) is not none else 'create' }}
              key: room_topology
              volume_entity_id: "{{ _hh_cabinet }}"
              value: >-
                {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}{%- set topo = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'room_topology') | from_json -%}
                {%- set _ex=topo.get(_area_id, {}) -%}{%- set _ex=_ex if _ex is mapping else {} -%}
                {%- set _ez=(_ex.get('room_zones', []) | list | rejectattr('name','eq',_item_name) | list) -%}
                {{ (topo | combine({_area_id: _ex | combine({'room_zones': _ez})})) | tojson }}
            response_variable: _zr_fc
          - variables:
              _result:
                status: ok
                mode: zone_remove
                area_id: "{{ _area_id }}"
                removed_name: "{{ _item_name }}"
                caller_token: "{{ _caller_token }}"
          - stop: zone_remove
            response_variable: _result

      # ═══════════════════════════════════════════════════════════════════════
      # 14e. LANDMARKS (list landmarks for an area)
      # ═══════════════════════════════════════════════════════════════════════
      - if: "{{ _mode == 'landmarks' }}"
        then:
          - if: "{{ _hh_cabinet == '' or _area_id == '' }}"
            then:
              - variables:
                  _result:
                    status: error
                    mode: landmarks
                    message: "landmarks requires area=."
                    caller_token: "{{ _caller_token }}"
              - stop: landmarks error
                response_variable: _result
          - variables:
              _result:
                status: ok
                mode: landmarks
                area_id: "{{ _area_id }}"
                landmarks: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}{%- set topo = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'room_topology') | from_json -%}
                  {{ (topo.get(_area_id, {}) or {}).get('landmarks', []) }}
                caller_token: "{{ _caller_token }}"
          - stop: landmarks
            response_variable: _result

      # ═══════════════════════════════════════════════════════════════════════
      # 14f. LANDMARK_SET (upsert one landmark into a room)
      # ═══════════════════════════════════════════════════════════════════════
      - if: "{{ _mode == 'landmark_set' }}"
        then:
          - if: "{{ _hh_cabinet == '' or _area_id == '' or landmark is none or not (landmark is mapping) }}"
            then:
              - variables:
                  _result:
                    status: error
                    mode: landmark_set
                    message: "landmark_set requires area= and landmark= (JSON: {name, bearing, mark, distance_ft, type, room_zone, entity_id, grocy_location_id, description, ...})."
                    caller_token: "{{ _caller_token }}"
              - stop: landmark_set error
                response_variable: _result
          - action: script.zen_dojotools_filecabinet
            data:
              action_type: >-
                {%- set _cv=state_attr(_hh_cabinet,'variables')|default({},true) -%}
                {{ 'update' if _cv.get('room_topology',none) is not none else 'create' }}
              key: room_topology
              volume_entity_id: "{{ _hh_cabinet }}"
              value: >-
                {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}{%- set topo = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'room_topology') | from_json -%}
                {%- set _ex=topo.get(_area_id, {}) -%}{%- set _ex=_ex if _ex is mapping else {} -%}
                {%- set _el=_ex.get('landmarks', []) | list -%}
                {%- set _lname=landmark.get('name', none) -%}
                {%- if _lname is not none -%}
                  {%- set _el=(_el | rejectattr('name','eq',_lname) | list) + [landmark] -%}
                {%- else -%}
                  {%- set _el=_el + [landmark] -%}
                {%- endif -%}
                {{ (topo | combine({_area_id: _ex | combine({'landmarks': _el})})) | tojson }}
            response_variable: _ls_fc
          - variables:
              _result:
                status: ok
                mode: landmark_set
                area_id: "{{ _area_id }}"
                landmark_name: "{{ landmark.get('name', '') }}"
                grocy_location_id: "{{ landmark.get('grocy_location_id', none) }}"
                caller_token: "{{ _caller_token }}"
          - stop: landmark_set
            response_variable: _result

      # ═══════════════════════════════════════════════════════════════════════
      # 14g. LANDMARK_REMOVE (remove a landmark by name)
      # ═══════════════════════════════════════════════════════════════════════
      - if: "{{ _mode == 'landmark_remove' }}"
        then:
          - if: "{{ _hh_cabinet == '' or _area_id == '' or _item_name == '' }}"
            then:
              - variables:
                  _result:
                    status: error
                    mode: landmark_remove
                    message: "landmark_remove requires area= and name= (landmark name to delete)."
                    caller_token: "{{ _caller_token }}"
              - stop: landmark_remove error
                response_variable: _result
          - action: script.zen_dojotools_filecabinet
            data:
              action_type: >-
                {%- set _cv=state_attr(_hh_cabinet,'variables')|default({},true) -%}
                {{ 'update' if _cv.get('room_topology',none) is not none else 'create' }}
              key: room_topology
              volume_entity_id: "{{ _hh_cabinet }}"
              value: >-
                {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}{%- set topo = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'room_topology') | from_json -%}
                {%- set _ex=topo.get(_area_id, {}) -%}{%- set _ex=_ex if _ex is mapping else {} -%}
                {%- set _el=(_ex.get('landmarks', []) | list | rejectattr('name','eq',_item_name) | list) -%}
                {{ (topo | combine({_area_id: _ex | combine({'landmarks': _el})})) | tojson }}
            response_variable: _lr_fc
          - variables:
              _result:
                status: ok
                mode: landmark_remove
                area_id: "{{ _area_id }}"
                removed_name: "{{ _item_name }}"
                caller_token: "{{ _caller_token }}"
          - stop: landmark_remove
            response_variable: _result

      # ═══════════════════════════════════════════════════════════════════════
      # 15. PATHFIND — BFS shortest path between two areas or live persons
      # ═══════════════════════════════════════════════════════════════════════
      - if: "{{ _mode == 'pathfind' }}"
        then:
          # ── resolve inputs ─────────────────────────────────────────────────
          - variables:
              _pf:           "{{ pathfind if pathfind is mapping else {} }}"
              _pf_start_raw: "{{ (_pf.get('start', _area_input) if pathfind is mapping else _area_input) | string | trim }}"
              _pf_dest_raw:  "{{ (_pf.get('destination', _area_b_input) if pathfind is mapping else _area_b_input) | string | trim }}"
              _pf_max:       "{{ (_pf.get('max_hops', 20) if pathfind is mapping else 20) | int(20) }}"

          # ── person → area resolution (HPS BPS zone sensors) ────────────────
          - variables:
              _pf_start_id: >-
                {%- set _raw = _pf_start_raw -%}
                {%- if _raw.startswith('person.') -%}
                  {%- set _hps = label_entities('hps') | select('match', '.*_bps_zone$') | list -%}
                  {%- set ns = namespace(found='') -%}
                  {%- for eid in _hps if ns.found == '' -%}
                    {%- set _fn = state_attr(eid, 'friendly_name') | default('', true) | lower -%}
                    {%- if _raw.split('.')[1] | replace('_',' ') in _fn or _raw in _fn -%}
                      {%- set _an = states(eid) | string | trim -%}
                      {%- set _aid = area_id(_an) | default('', true) -%}
                      {%- set ns.found = _aid if _aid else (area_id(_an | title) | default('', true)) -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ ns.found }}
                {%- else -%}
                  {%- set _d = area_id(_raw) | default('', true) -%}
                  {%- set _t = area_id(_raw | title) | default('', true) -%}
                  {%- set _slug = _d if _d else (_t if _t else _raw | lower | replace(' ', '_')) -%}
                  {{ _slug if area_name(_slug) | default('', true) != '' else '' }}
                {%- endif -%}
              _pf_dest_id: >-
                {%- set _raw = _pf_dest_raw -%}
                {%- if _raw.startswith('person.') -%}
                  {%- set _hps = label_entities('hps') | select('match', '.*_bps_zone$') | list -%}
                  {%- set ns = namespace(found='') -%}
                  {%- for eid in _hps if ns.found == '' -%}
                    {%- set _fn = state_attr(eid, 'friendly_name') | default('', true) | lower -%}
                    {%- if _raw.split('.')[1] | replace('_',' ') in _fn or _raw in _fn -%}
                      {%- set _an = states(eid) | string | trim -%}
                      {%- set _aid = area_id(_an) | default('', true) -%}
                      {%- set ns.found = _aid if _aid else (area_id(_an | title) | default('', true)) -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ ns.found }}
                {%- else -%}
                  {%- set _d = area_id(_raw) | default('', true) -%}
                  {%- set _t = area_id(_raw | title) | default('', true) -%}
                  {%- set _slug = _d if _d else (_t if _t else _raw | lower | replace(' ', '_')) -%}
                  {{ _slug if area_name(_slug) | default('', true) != '' else '' }}
                {%- endif -%}

          # ── guard: both endpoints must resolve ─────────────────────────────
          - if: "{{ _pf_start_id == '' or _pf_dest_id == '' }}"
            then:
              - variables:
                  _result:
                    status: resolution_error
                    mode: pathfind
                    message: >-
                      {%- set _failed_raw = _pf_start_raw if _pf_start_id == '' else _pf_dest_raw -%}
                      {%- set _which = 'start' if _pf_start_id == '' else 'destination' -%}
                      {%- if _failed_raw.startswith('person.') -%}
                        Person entity '{{ _failed_raw }}' not found in HA, or found but not resolvable to a room (no HPS presence sensor active for this person). Check the entity ID exists and that an hps-labeled BPS zone sensor is tracking them.
                      {%- else -%}
                        Could not resolve {{ _which }} ('{{ _failed_raw }}') to a known area. Pass an area_id slug (e.g. 'kitchen'), area display name (e.g. 'Kitchen'), or person.xxx entity.
                      {%- endif -%}
                    caller_token: "{{ _caller_token }}"
              - stop: pathfind resolution_error
                response_variable: _result

          - variables:
              _pf_start_name: "{{ area_name(_pf_start_id) | default(_pf_start_id, true) }}"
              _pf_dest_name:  "{{ area_name(_pf_dest_id)  | default(_pf_dest_id,  true) }}"

          # ── same-room short-circuit ─────────────────────────────────────────
          - if: "{{ _pf_start_id == _pf_dest_id }}"
            then:
              - variables:
                  _result:
                    status: same_room
                    mode: pathfind
                    start_area_id:         "{{ _pf_start_id }}"
                    start_area_name:       "{{ _pf_start_name }}"
                    destination_area_id:   "{{ _pf_dest_id }}"
                    destination_area_name: "{{ _pf_dest_name }}"
                    distance: 0
                    path: "{{ [_pf_start_id] }}"
                    steps: []
                    caller_token: "{{ _caller_token }}"
              - stop: pathfind same_room
                response_variable: _result

          # ── read topology ───────────────────────────────────────────────────
          - variables:
              _pf_topo: >-
                {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}{%- set t = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'room_topology') | from_json -%}
                {{ t if t is mapping else {} }}

          # ── BFS ─────────────────────────────────────────────────────────────
          - variables:
              _pf_result: >-
                {%- set ns = namespace(queue=[[_pf_start_id]], visited=[_pf_start_id], found=none, idx=0) -%}
                {%- for _ in range(_pf_max | int * 5) -%}
                  {%- if ns.idx < ns.queue | length and ns.found is none -%}
                    {%- set path = ns.queue[ns.idx] -%}
                    {%- set ns.idx = ns.idx + 1 -%}
                    {%- set cur = path[-1] -%}
                    {%- if cur == _pf_dest_id -%}
                      {%- set ns.found = path -%}
                    {%- else -%}
                      {%- for n in (_pf_topo.get(cur, {}) if _pf_topo is mapping else {}).get('adjacent', []) | select('string') | list -%}
                        {%- if n not in ns.visited -%}
                          {%- set ns.queue = ns.queue + [path + [n]] -%}
                          {%- set ns.visited = ns.visited + [n] -%}
                        {%- endif -%}
                      {%- endfor -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.found | default(none, true) }}

          # ── no path found ───────────────────────────────────────────────────
          - if: "{{ _pf_result is none or _pf_result | string | trim in ['None','none',''] }}"
            then:
              - variables:
                  _result:
                    status: no_path
                    mode: pathfind
                    start_area_id:         "{{ _pf_start_id }}"
                    start_area_name:       "{{ _pf_start_name }}"
                    destination_area_id:   "{{ _pf_dest_id }}"
                    destination_area_name: "{{ _pf_dest_name }}"
                    message: "No connected path found within {{ _pf_max }} hops. Check that portals are commissioned between these areas (mode=set portals={to,bearing,type})."
                    caller_token: "{{ _caller_token }}"
              - stop: pathfind no_path
                response_variable: _result

          # ── steps enrichment (portal type + bearing per hop) ────────────────
          - variables:
              _pf_steps: >-
                {%- set _cpts = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'] -%}
                {%- set path = _pf_result | list -%}
                {%- set ns = namespace(steps=[]) -%}
                {%- for i in range(path | length - 1) -%}
                  {%- set a = path[i] -%}
                  {%- set b = path[i+1] -%}
                  {%- set _an = area_name(a) | default(a, true) -%}
                  {%- set _bn = area_name(b) | default(b, true) -%}
                  {%- set _portals = (_pf_topo.get(a, {}) if _pf_topo is mapping else {}).get('portals', []) | list -%}
                  {%- set ps = namespace(via_type='passage', bearing=-1) -%}
                  {%- for p in _portals if p is mapping -%}
                    {%- if p.get('to', '') == b -%}
                      {%- set ps.via_type = p.get('type', 'passage') -%}
                      {%- set ps.bearing = p.get('bearing', -1) | int(-1) -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {%- set _compass = _cpts[((ps.bearing + 11.25) % 360 // 22.5) | int] if ps.bearing >= 0 else '' -%}
                  {%- set _step = {'from_id': a, 'from_name': _an, 'to_id': b, 'to_name': _bn, 'via_type': ps.via_type, 'bearing': ps.bearing if ps.bearing >= 0 else none, 'compass': _compass} -%}
                  {%- set ns.steps = ns.steps + [_step] -%}
                {%- endfor -%}
                {{ ns.steps }}

          # ── result ──────────────────────────────────────────────────────────
          - variables:
              _result:
                status: ok
                mode: pathfind
                start_area_id:         "{{ _pf_start_id }}"
                start_area_name:       "{{ _pf_start_name }}"
                destination_area_id:   "{{ _pf_dest_id }}"
                destination_area_name: "{{ _pf_dest_name }}"
                distance:              "{{ (_pf_result | list | length) - 1 }}"
                path:                  "{{ _pf_result | list }}"
                steps:                 "{{ _pf_steps }}"
                caller_token:          "{{ _caller_token }}"
          - stop: pathfind ok
            response_variable: _result

      # ═══════════════════════════════════════════════════════════════════════
      # 16. HELP
      # ═══════════════════════════════════════════════════════════════════════
      - variables:
          _result:
            status: ok
            mode: help
            version: "5.6.2"
            purpose: >-
              Room intelligence hub. The FIRST call for any room-centric task.
              mode=get returns a full room brief: spatial topology (portals, adjacency,
              exits, transmission), live HA state, and up to 10 opt-in context slices.
              Slices are label-intersection aware — any HA entity (todo, calendar)
              tagged with any of the area's own labels is automatically surfaced.
              One call with context_slices=+inventory,+chores,+tasks,+conductor,+calendar
              returns: what's stocked here, what maintenance is due, what tasks are
              assigned here, the conductor queue, and 7-day calendar events.
              Domain tools (ZenLux, NyxMau5, climate, inventory) read topology from
              here — never re-derive it. You are the assembler.
              Whole-house snapshot: mode=home_overview.
            when_to_call:
              - "Full room brief (what's here, what's due, what's on the list) → mode=get area=X context_slices=+inventory,+chores,+tasks,+calendar"
              - "Any room-context query → mode=get, always the first call"
              - "Whole-house state ('how's the house?') → mode=home_overview"
              - "Emergency crisis snapshot → mode=emergency scenario=fire|burglar|weather|medical. Add area=X for room-local context (from_room: room_exits, adjacent_exits, nearest_shelter). Returns guidance{action,advisory}, shelter{floor-tagged}, hazards[], safety_equipment[], likely_occupied[], location{address,gps}, rally_point."
              - "Egress for a specific room only → mode=get area=X, check exits[], emerg_exit, drop_ft"
              - "Lighting or ambience → mode=get +light, then zen_dojotools_lights with area + adjacent[]"
              - "Media zone targeting → mode=get +media, then zen_dojotools_media_manager"
              - "Occupant personalization → occupants[] → zen_dojotools_profile_editor"
              - "Physical objects or inventory → mode=get +inventory (full product list) or domain_routing.grocy anchor for targeted ops"
              - "Maintenance due in room → mode=get +chores (chores linked to products stocked here)"
              - "Tasks assigned to room → mode=get +tasks (todo entities labeled with any area label)"
              - "Calendar events for room → mode=get +calendar (calendar entities labeled with any area label, 7-day window)"
              - "Conductor queue → mode=get +conductor (todo entities labeled 'schedule')"
              - "Shortest path between two rooms → mode=pathfind pathfind={start:area_id_or_name, destination:area_id_or_name}. Also accepts person.xxx to resolve live location via HPS. Returns path[], steps[{from,to,via_type,bearing,compass}], distance."
              - "New or unknown room → mode=set to register manually, or mode=area_create to create the HA area + register in one call"
              - "Create HA area (doesn't exist yet) → mode=area_create area_name='...' floor_id_new=floor_slug"
              - "Update HA area description/name/floor → mode=area_update area=X area_note='...' area_name_new='...' floor_id_new=floor_slug"
              - "Delete HA area + topology → mode=area_delete area=X confirm_action=true"
            seed_steps: >-
              Three steps to register a room:
              (0) zen_dojotools_inspect mode=area_list — enumerate all HA area IDs before any link
              calls. Never guess slugs; area display names ≠ area_id. area_list is ground truth.
              (1) mode=set area=X walls=N description='...' to register — auto-applies room_layout to the area.
              (2) mode=link area=X area_b=Y for each adjacent room — adds bidirectional adjacency
              and interior portals (type, normally). Use mode=set portals={...} for exterior doors.
              Seeding unlocks ZenLux bleed-aware scenes, egress routing, and vacuum zone targeting.
            domain_routing:
              lighting: "zen_dojotools_lights — ZenLux. Pass area_id. Reads adjacent[] for bleed-aware scenes and occupants[] for persona prefs."
              media: "zen_dojotools_media_manager — NyxMau5. Pass area name or area_id for zone targeting."
              climate: "zen_dojotools_climate — pass area_id. spatial.area_sqm in response gives load context."
              egress: "Single room: mode=get area=X exits[] (emerg_exit=true portals+windows, sorted). Whole-home crisis: mode=emergency scenario=fire|burglar|weather|medical — guidance{action,advisory}, exits[], shelter{primary/secondary/avoid with floor_id}, hazards[], safety_equipment[], likely_occupied[]. Add area=X for from_room{room_exits,adjacent_exits,nearest_shelter}."
              occupant_profile: "occupants[] names → zen_dojotools_profile_editor mode=get to load persona and prefs."
              inventory: "context_slices=+inventory — object_lens place lens: tagged products, chores, expanded operational objects per area. Primary read path for room inventory. Or use grocy_location_id anchor for targeted ops (stock_list_by_location, locations_find, stock_where_is_item)."
              chores: "context_slices=+chores — maintenance chores linked to products stocked in this area. Returns chore list + chore_actions{execute, edit, add} at context level — pass item=<chore name>. add also takes period_days=N."
              tasks: "context_slices=+tasks — todo entities labeled with any area label. Label-intersection: area hot_tub_deck (labels: hot_tub, back_yard, …) surfaces any todo entity bearing hot_tub. Tag todo entity with area label to opt in."
              conductor: "context_slices=+conductor — todo entities labeled 'schedule'. The AI conductor queue. Always unfiltered — full list regardless of area."
              calendar: "context_slices=+calendar — calendar entities labeled with any area label, 7-day lookahead. Same label-intersection as tasks. Tag calendar entity with area label to opt in."
              catalog: "context_slices=+catalog — physical items (books, games, media, art) shelved in this area via library_catalog lens provider. Returns item_evidence[]{item_id, product_id, format, creator, isbn, location_id, loan_borrower, loan_due}."
            description: >-
              Room intelligence hub. Spatial topology stored in household cabinet
              (key: room_topology). Context slices aggregate live data from domain
              tools on demand. Label-intersection discovery: entities (todo, calendar)
              tagged with any area label are automatically surfaced in +tasks/+calendar.
            modes:
              get: "Room brief. HA area data + spatial topology + optional context slices. area= required. context_slices= comma list: +topo, +light, +climate, +covers, +media, +inventory, +chores, +tasks, +conductor, +calendar, +wiki, +tickets, +catalog. Returns features[], exits[], spatial, domain_routing, context{}, occupancy (Room Manager v3 state — ALWAYS included, not opt-in, when the room has a v3 sensor deployed; null otherwise). See v3_room_deployment."
              set: "Write/patch spatial data. area= required. dry_run=true previews."
              list: "All registered rooms with rm_managed / layout_labeled flags."
              zones: "List all room_zones for area=. Read-only."
              zone_set: "Upsert one zone into area= topology. room_zone= JSON required. Upserts by name. Schema: {name, bearing, mark, distance_ft, radius_ft, type:seating|storage|landmark|hazard|exit_zone|feature, ...}."
              zone_remove: "Remove a zone by name. area= + name= required."
              landmarks: "List all landmarks for area=. Each entry includes grocy_location_id if set. Read-only."
              landmark_set: "Upsert one landmark into area= topology. landmark= JSON required. Upserts by name. Schema: {name, bearing, mark, distance_ft, type:furniture|storage|fixture|hazard|feature|person_anchor, room_zone, entity_id, grocy_location_id, description, ...}."
              landmark_remove: "Remove a landmark by name. area= + name= required."
              link: "Bidirectional adjacency + portal between area= and area_b=. Optional: link_sound_tx, link_light_tx."
              unlink: "Remove bidirectional adjacency between area= and area_b=."
              boundary_link: "Bidirectional acoustic+optical boundary (no passage). area= + area_b= + sound_tx + light_tx + note. Writes both sides."
              boundary_unlink: "Remove bidirectional boundary_link between area= and area_b=."
              home_overview: "Whole-house snapshot. Returns signal{} first: attention[] (fresh alerts <6h + age_h — now also includes a synthetic entry per room with an active v3 emergency latch), stale_alerts[] (>6h, informational), active_rooms[] (lights on, media playing, OR v3 occupied_active/engaged_active — each entry includes v3_occupancy: the room's v3 state if deployed, else null), open_sensors[] (active binary_sensors), all_quiet bool. Also: alerts{} (priority_context + full active_alerts), domain_summaries{}, floors[] (per-room context: topo/light/climate/covers/media + task_lists, calendar_entities, grocy_anchor), inventory{} (overdue/due_soon/expiring volatile stock with product names + counts). No area= required. Pass include_notices=true to add notices{}: active ZenOS alerts, persistent notifications, HA repairs, recent_dispatches (1h postman count + last_at), action_queue[] pre-built {priority, item, tool, call} — iterate and fire directly."
              emergency: "Crisis snapshot — RM is authoritative. scenario= (fire|burglar|weather|medical|general) shapes guidance{action,advisory,priority}. area= adds from_room{room_exits,adjacent_exits,nearest_shelter} context. Returns: location{name,address,zip_code,gps}, guidance{}, from_room (if area=), exits[] (whole-home emerg_exit portals+windows sorted by priority_rank), shelter{primary[]/secondary[]/avoid[]} (each entry has floor_id+floor_name; primary=no exterior portals+no windows; weather→prefer lowest floor primary), safety_equipment[], hazards[], likely_occupied[], rally_point. No area= required; area= adds room-local context."
              area_create: "Create HA area + assign floor + apply room_layout + init topology. area_name= required (text, area does not exist). floor_id_new= optional. Topology params (walls, description, area_note, grocy_location_id) initialized if provided. Returns area_id, room_layout_tagged, advisory."
              area_update: "Update HA area metadata + compile spatial description. area= required. Compiles description: floor+adjacency+area_note. Optional: area_name_new (rename), floor_id_new (reassign floor), icon (mdi string), picture (URL/local path). area_note + description stored in RM topology. Each field is patched independently — unset fields preserve existing HA values. dry_run=true previews compiled description."
              area_delete: "Delete HA area + remove topology entry. area= required. confirm_action=true required — omit returns preview with in_topology flag. Step 1: ectoplasm area_delete. Step 2: topology removal. IRREVERSIBLE."
              setup: "Deploy RM KFC to the dojo via Scribe. confirm_action: true required — omit returns preview. Stamps room_manager KFC artifact (component_instructions + trigger_subscriptions) into dojo cabinet. Safe to re-run; overwrites existing drawer."
              label_discover: "Scan area= for v3 room-state label candidates (device_class → motion/occupied/engaged/window/garage_door/moisture/smoke/carbon_monoxide/siren/wasp_door/window_covering/hvac_vent). Preview by default; confirm_action=true tags ALL shown candidates in one shot (also migrates any legacy zen_<label> off each tagged entity). Returns group_warnings when >1 candidate shares a label — prefer one aggregate entity over tagging each individually. See v3_room_deployment for the full room setup workflow this feeds into."
              help: "This output."
            v3_room_deployment: >-
              Room Manager v3 (2026-08-05, consolidated to rev 4 on 2026-08-07)
              is a SEPARATE occupancy-state layer from everything else in this
              help — ONE automation + ONE script, not RM script modes. It
              answers "is this room vacant/occupied/engaged/asleep/checking/
              emergency right now, and why."
              REV 4 ARCHITECTURE (2026-08-07, Design note: "I don't want 86000
              automations for rm. I want ONE" / "consolidate these to one
              reflex controller script"): everything that used to be 3
              separate dispatcher files (zen_signal_dispatch.yaml,
              zen_reflex_dispatch.yaml, zen_cleaning_dispatch.yaml) plus 4
              opt-in per-room blueprints (room_control_burnout.yaml,
              room_tv_sleep_timer.yaml, room_vent_fan.yaml — a 4th,
              room_timer_start_restart.yaml, was found dead, 0 rooms used it,
              deleted outright) plus the self-label bootstrap
              (room_state_self_label.yaml) now lives in exactly ONE file:
              packages/zenos_ai/room_manager_v3/zen_room_manager_dispatch.yaml
              — automation.zenos_room_manager_dispatch (mode: parallel,
              trigger.id-branched) + script.zen_reflex_controller
              (mode-dispatched: signal_dispatch / room_timer_reconcile /
              cleaning_control_resync / control_burnout_resync /
              self_label_resync). None of these old filenames exist anymore —
              do not reference them in guidance to a human.
              DO NOT IMPROVISE THIS FLOW. There are exactly THREE kinds of thing you
              might be asked to do here, and they use three completely different
              mechanisms — mixing them up is the single most common mistake. Before
              doing anything, work out which bucket the request is actually in, AND
              whether you can execute it yourself or have to hand it to the human —
              do not claim or attempt an action outside your own bucket's capability
              line below.
              BUCKET 1 — "tag this sensor as X for this room" (motion/occupied/
              engaged/asleep/bed_occupancy/hold/window/garage_door/wasp_door/
              moisture/smoke/carbon_monoxide/siren/hvac_vent/vent_temperature/
              window_covering/zone_presence, control_burnout, vent_fan, or any
              latch/duration class). checking_timer RETIRED (2026-08-08,
              Design note: "why does wasp need checking it's a do now... delete
              those checking ents") — do not create or tag one, wasp
              resolution reads wasp_door's live state directly, see BUCKET 4.
              PURE LABELING. No blueprint, no form,
              nothing to deploy. Tag the real entity with the class label + the
              room's own area-matching label, done. Fastest path:
              mode=label_discover area=X, review the preview (especially
              group_warnings — a multi-candidate class wants ONE aggregate
              entity, not every individual door/cover/sensor tagged
              separately, AND a lock+door pair for the same opening: tag the
              DOOR as wasp_door, never the lock — lock state doesn't track
              threshold-crossing the way a door contact does. Real incident:
              garage's entry door/lock pair had the lock correctly tagged
              ext_lock but the door itself never made it into garage's
              trigger_entities, leaving the room blind to anyone standing at
              that doorway until caught live 2026-08-08 — see the
              privacy_door confidence note in label_discover's own candidate
              scan for the full writeup), confirm_action=true to apply. Nothing is ever
              auto-created in this bucket — if no real entity exists yet for a
              class, there's nothing to tag and that tier just stays inactive, a
              safe no-op, never an error. control_burnout and vent_fan are
              PRE-EXISTING labels (not created by this session's rev 4 work) —
              reuse them, never create new ones for a room-scoped helper that
              already has a naming convention (see BUCKET 2/3 note below).
              AGENT CAPABILITY: full — label_discover and the labels tool are real
              tools with write access. Confirm ambiguous multi-candidate classes
              with the human before applying; everything else is yours to execute.
              BUCKET 2 — "this room needs something that HOLDS state" (a
              decay/latch timer, the room_control select). Not a blueprint either —
              create the plain HA helper, THEN either (a) tag it, same as bucket 1
              ('room_timer'+'room_timer_class'/'emergency_latch'/
              'nap_latch'/'room_control'/'control_burnout' + the room label —
              checking_timer removed from this list, see BUCKET 1 note), OR
              (b) for TV Sleep Timer and Vent Fan's duration knobs specifically,
              just NAME it correctly — timer.<room>_tv_sleep_timer,
              input_number.<room>_tv_sleep_minutes,
              input_number.<room>_fan_delay_minutes,
              input_number.<room>_fan_min_runtime_seconds — these are discovered
              by naming convention, not label, on purpose (rev 4: "why new
              labels, reuse what we had — it's a refac, shouldn't need new" —
              the original per-room blueprints already hardcoded this exact
              convention, generalizing it globally needed zero new taxonomy).
              Skip any of these and that specific feature just doesn't
              activate — never an error, never a missing dependency.
              AGENT CAPABILITY: NONE for the creation step — no tool creates HA
              helpers. Tell the human exactly what to create (Settings → Devices &
              Services → Helpers → Timer / Number / Select, with the right options
              AND, for naming-convention helpers, the EXACT entity_id required)
              and wait for it to exist. Once it exists, tagging (path a) is back
              to full agent capability (bucket 1's tools); naming-convention
              helpers (path b) need nothing further — they activate on next
              resync automatically.
              BUCKET 3 — deploying the room's state sensor itself. This is the
              ONLY thing that still uses a blueprint, and it is now the ONLY
              mandatory deploy per room: template
              blueprints/template/zenos/room_state.yaml (input: room=<area>,
              friendly_name, unique_id, trigger_entities=[...], optional
              child_rooms=[...] for ensuite cascade-up). Self-labeling the
              resulting sensor ('zen_room_state' + the room's own label — what
              makes mode=get's occupancy field and mode=home_overview's
              active_rooms/attention actually find it) is now AUTOMATIC and
              GLOBAL (script.zen_reflex_controller mode=self_label_resync,
              runs on every resync) — it discovers the sensor by
              existence-checking the two live-entity_id conventions actually
              observed across every deployed room (sensor.<room>_state or
              sensor.<room>_room_state, depending on whether that room's
              friendly_name happened to include the word "Room"). No separate
              blueprint call needed for this anymore — do not tell a human to
              deploy room_state_self_label.yaml, it no longer exists. Control
              Burnout, TV Sleep Timer, and Vent Fan Auto On/Off are NO LONGER
              separate blueprints either — they are global, always-on
              behaviors inside the same one dispatcher, activated purely by
              bucket 1/2 labeling+naming, exactly like every other opt-in tier.
              AFTER the room_state.yaml blueprint is deployed, RELOAD is
              required: zen_dojotools_systemtools mode=ha_reload_template_entities
              for the blueprint/template change (NOT ha_reload_templates, a
              common mix-up — that one is Jinja macro files only and silently
              does not cover this). The dispatcher file itself
              (zen_room_manager_dispatch.yaml) is edited only by a developer,
              not by per-room deployment — if it ever changes, both
              mode=ha_reload_scripts (for zen_reflex_controller) AND
              mode=ha_reload_automations (for
              automation.zenos_room_manager_dispatch) are required, or
              ha_reload_all as the last resort covering both plus everything else.
              AGENT CAPABILITY: split. Deploying the room_state.yaml blueprint
              itself = NONE — no known tool instantiates a blueprint-based
              template entity via the HA API. In normal production the human
              goes through Settings → Automations & Scenes → Blueprints → pick
              it → Create, and you narrate every field to fill in from this
              help text; you cannot submit that form for them.
              (Session-specific exception: if you are Claude Code with direct
              package-file write access in a dev session, you may instead
              write the use_blueprint: block directly into
              packages/zenos_ai/room_manager_v3/<room>.yaml — not the normal
              household-agent path.) Reload afterward = full — a real tool
              call you make yourself once the deploy step is done.
              The dispatcher (automation.zenos_room_manager_dispatch +
              script.zen_reflex_controller, in
              packages/zenos_ai/room_manager_v3/zen_room_manager_dispatch.yaml)
              needs NO per-room setup at all — it's room-agnostic, resolves
              which room and class an entity belongs to purely from the
              entity's own labels (area_name() checked against each label —
              whichever one resolves to a real HA area_id IS the room, no
              hardcoding).
              Read the resulting sensor's attributes as a genuine room debug
              surface: engaged_active/occupied_active/asleep_active are
              ALWAYS true or false (never null — resolvable from direct
              signals alone); wasp_flag_active is true/false/null (null =
              room has no wasp_door tagged at all, taxonomically equivalent
              to occupied for any occupancy-map consumer — see home_overview's
              active_rooms classifier); optional latch/class attributes (emergency_active,
              hold_active, window_open_active, vent_open_active, etc) are null
              when nothing in the room carries that label at all, distinct from
              false (tagged and currently off). Of this group, only
              emergency_active and hold_active actually feed the cascade
              (emergency wins outright; hold floors the room at Occupied while
              true — "fridge door mode", no timer, instant fall-through to
              vacant on release) — window/garage/vent/window_covering/nap stay
              purely informational. occupied_last_trigger/
              engaged_last_trigger/asleep_last_trigger/last_trigger explain WHICH
              entity most recently caused that tier true, or timer-decay if no
              live entity is currently truthy.
              BUCKET 4 — hold/opt-out mechanisms that need NO entity creation
              at all, not even bucket 1's "tag a real sensor" — either
              self-computed inside room_state.yaml itself, or a label applied
              to something that ALREADY exists (a shared global helper, or
              any entity already carrying the room's label). Added
              2026-08-08 during a live incident investigation (garage's wasp
              door / legacy Node-RED parity work); all four share one trait:
              default behavior requires zero setup, opt-in/opt-out is a pure
              label operation.
                wasp_flag — SELF-LATCHING, no entity, no label needed at
                  all. A room with wasp_door tagged automatically gets this;
                  motion firing while every wasp_door is closed sets state
                  to "hold" via a self-referencing template attribute
                  (this.attributes.get(...)), not an input_boolean. Clears
                  on a fresh wasp_door open or a manual room_control_manager
                  override — deliberately NOT time-based (design note: "clock is
                  stop - it clears only on user/agent forced OR any wasp
                  portal open").
                entertaining_hold / guest_hold — tag the EXISTING shared
                  input_boolean.zen_entertaining / input_boolean.zen_guest_mode
                  with the purpose label ('entertaining_hold' /
                  'guest_hold') PLUS the target room's own label. Nothing
                  new is created — these are single global entities opted
                  into per-room by label intersection, exactly like every
                  other bucket-1 class, just pointed at a shared entity
                  instead of a per-room one. Room state shows "hold" while
                  the underlying boolean is on AND the room is tagged in,
                  outranked by anything higher in the cascade (engaged,
                  asleep, manual override, emergency) — it only wins when
                  nothing more specific is happening.
                autosleep_disable / asleep_window_disable — pure per-room
                  opt-OUT labels, tag anything already carrying the room's
                  own label (the bed sensor itself is the natural target).
                  DEFAULTS (2026-08-08, Design note: "autosleep default yes when
                  adding a sleep timer... sleep window lockout default on"):
                  a room with an asleep/bed_occupancy entity tagged
                  autosleeps automatically, restricted to the night→wake
                  scheduler-anchor window (input_datetime.zen_night_start /
                  zen_am_start — NOT sensor.period_of_day, a different sun-
                  elevation-based legacy sensor with no relation to these
                  anchors). autosleep_disable kills automatic firing
                  entirely for that room (manual room_control_manager
                  "Asleep" — Kim's "until I say so" button — is a wholly
                  separate mechanism, never affected). asleep_window_disable
                  keeps autosleep active but removes the night-only
                  restriction. Real-world reason for the window existing at
                  all: a laundry hamper set on the master bedroom bed at
                  midday tripped the bed sensor and would otherwise have
                  auto-slept the room in broad daylight.
              AGENT CAPABILITY: full for all four — same tools as bucket 1
              (labels tool for entertaining_hold/guest_hold/autosleep_disable/
              asleep_window_disable; wasp_flag needs nothing at all, just a
              wasp_door tag which is already bucket 1).
              Full docs: architecture/22_Room_Manager_v3_REFLEX.md (design),
              components/room_manager_v3_reflex.md (practical/label reference),
              getting_started/room_manager_operators_manual.md (plain-language).
              Full design history: project_room_manager_v3_design memory
              (Claude-side, not queryable from HA).
            schema:
              description: "str — operational/preplan notes ≤255 chars. set/area_create/area_update write it."
              area_note: "str — human description of the space (what it is, feel, occupant). Compiled into HA area description by area_create and area_update. Stored in topology. set writes it."
              walls: "int — wall count"
              occupants: "list[str] — STATIC room assignment ('who owns/lives in this room'). e.g. ['alice']. Set via occupant= field. NOT runtime presence — presence is RM occupancy state (input_select.{room}_occupancy). Used for egress accountability, personalization, profile routing."
              adjacent: "list[area_id] — managed by link/unlink modes"
              portals: "One portal per set call. REQUIRED: type(door|archway|passage), normally(open|closed), exterior(bool), exit(bool), emerg_exit(bool). OPTIONAL: to(area_id|null), sound_tx(0.0-1.0), light_tx(0.0-1.0), exit_priority(primary|secondary|tertiary|bail_out). Extra fields OK. Upserts by to. clear_portals=true resets list. link mode auto-adds interior portals."
              windows: "One window per set call. REQUIRED: direction(N|NE|E|SE|S|SW|W|NW), type(single|double|sliding|casement|fixed|skylight), exit(bool), emerg_exit(bool), drop_ft(number, 0=ground). OPTIONAL: exit_priority(primary|secondary|tertiary|bail_out), count(int). Extra fields OK. Upserts by direction. clear_windows=true resets list. Used by egress router."
              exits: "COMPUTED — get response only. Sorted list of all egress-capable portals and windows (exit=true or emerg_exit=true). Sort key: exit_priority rank (primary=0, secondary=1, tertiary=2, bail_out=3, unranked=9) × 2 + (0 if emerg_exit else 1). Items include source, exit_priority, exit, emerg_exit. Portal items: to, type, normally. Window items: direction, count, drop_ft. Use exit_priority= field on set/link to rank. NFPA preplan: emerg_exit=true = designated evac route, drop_ft = jump height ft (0=ground safe)."
              boundary_links: "list — non-passable boundaries with transmission properties. Schema: {to:area_id, sound_tx:0.0-1.0, light_tx:0.0-1.0, note:str}. Bidirectional: boundary_link mode writes both sides. Upserts by to. clear_boundary_links=true resets list. Use for: shared wall, soundproofed partition, glass wall, floor/ceiling adjacency."
              sound_tx_ref: "Portal ref: archway=0.85, door(closed)=0.30, solid-core(closed)=0.15, soundproofed=0.05. Boundary ref: drywall=0.35, glass-partition=0.20, soundproofed=0.0."
              light_tx_ref: "Portal ref: archway=0.80, door(open)=0.70, door(closed)=0.02, glass-door(closed)=0.55. Boundary ref: glass-partition=0.65, sheer-curtain=0.40, frosted-glass=0.20, drywall=0.0."
              media_adjacent_calc: "Effective acoustic coupling A→B: max(portal A→B sound_tx, boundary_link A→B sound_tx, boundary_link B→A sound_tx). sound_tx=0.0 on all paths → exclude from bleed calc entirely."
              light_spillover_calc: "Effective optical coupling A→B: max(portal A→B light_tx, boundary_link A→B light_tx). ZenLux uses this for bleed-aware scene setting, sleep-mode isolation, and intentional fill from adjacent zones."
            context_slices: >-
              Opt-in live data aggregated on mode=get. Pass as comma string.
              +topo: open binary_sensors in area. +light: lights on + avg brightness.
              +climate: first climate entity setpoint + current temp.
              +covers: cover positions + open list. +media: active media_player.
              +inventory (+grocy alias): full denormalized room view — all containers
              with products and amounts (one API call, names resolved locally).
              +chores: maintenance chores for products stocked in area. Each entry has chore_id, name, is_due, next_execution. context.chores.chore_actions{execute, edit, add} — pass item=<chore name>. add also takes period_days=N. Full capability: zen_dojotools_inventory mode=help.
              +tasks: todo entities whose labels intersect the area's own HA labels. Each list entry has items[] + task_actions{complete, edit, add} — pass items=[<summary>]. Tag a todo entity with area label to opt it in.
              +conductor: todo entities labeled 'schedule' — the AI conductor queue.
              +calendar: calendar entities whose labels intersect the area's labels,
              7-day lookahead window. Same label-intersection as +tasks.
              All slices are independent — request any combination.
            concepts:
              area: "HA grouping unit — any zone, space, or concept. Includes outdoor areas, virtual zones, AI suites, etc. Most areas are NOT rooms. zen_dojotools_inspect mode=area_list enumerates all."
              room: "An area elevated to room status by room_manager. Has: a topology entry in the household cabinet (key=room_topology), physical data (portals, walls, windows), and ideally the room_layout label. The room_layout label is the registration marker — it is what distinguishes a room from a bare area."
              elevation: "The act of registering an area as a room. mode=set performs the elevation, auto-applies the room_layout label to the HA area, and wires adjacency via mode=link."
            safety: "list — safety equipment. Schema: {name:str (upsert key), type:fire_extinguisher|first_aid|aed|eyewash|spill_kit|other, location_note:str, rating:str (e.g. ABC), grocy_location_id:str}. mode=set writes one item per call. clear_safety=true resets list."
            room_zones: "list — sub-room spatial zones. Schema: {name:str (upsert key), bearing:int 0-359, mark:int -90..+90, distance_ft:float, radius_ft:float, type:seating|storage|landmark|hazard|exit_zone|feature}. mode=zone_set upserts one; mode=zone_remove deletes by name; mode=zones lists all. mode=set with room_zone= also works. clear_room_zones=true resets list."
            landmarks: "list — named anchor points within a room. Schema: {name:str (upsert key), bearing:int, mark:int (0=floor,36=counter,72=eye), distance_ft:float, type:furniture|storage|fixture|hazard|feature|person_anchor, room_zone:str (parent zone), entity_id:str (HA entity binding), grocy_location_id:int (Grocy inventory storage location — links landmark to physical stock), description:str}. mode=landmark_set upserts one; mode=landmark_remove deletes by name; mode=landmarks lists all. mode=set with landmark= also works. clear_landmarks=true resets list."
            grocy_location_id: "string — Grocy location ID for this room. First-class join key: RM area ↔ Grocy location ↔ containers ↔ products. Surfaced in domain_routing.grocy on mode=get."
            physical_object_model: >-
              Every RM room has grocy_location_id pointing to its Grocy anchor.
              Tree: Home → Suites → Rooms (anchors) → Containers → Products.
              Bidirectional: RM→Grocy via grocy_location_id; Grocy→RM via homeassistant_area userfield on each location.
              Place object: (1) mode=get → domain_routing.grocy for anchor. (2) locations_find for containers.
              (3) locations_add if container missing. (4) stock_buy_product or stock_inventory_adjust at container.
              Find object: stock_where_is_item(item=name) across all locations.
              safety[].grocy_location_id pins safety equipment to specific Grocy containers within a room.
            presence_vs_occupants: "OCCUPANTS (stored here) = static assignment — who this room belongs to. PRESENCE (not stored here) = runtime RM state — who is detected in the room right now, read from input_select.{room_slug}_occupancy or via zen_dojotools_room_manager mode=get (ha_labels / rm_managed fields)."
            label_notes:
              room_layout: "Auto-applied to HA area by mode=set. room_layout_tagged in set response confirms success."
              room_manager: "KFC: on entity=IS the RM. On area=area is RM-managed. Not managed by this tool."
            reflex: >-
              REFLEX (2026-08-06, consolidated to rev 4 on 2026-08-07) — room +
              state + zen_home_mode >> scene, on transition. TWO INDEPENDENT
              LAYERS, gated separately, on purpose: roomstate_enable gates
              v3's state engine (decay/cascade/timer logic, part of
              automation.zenos_room_manager_dispatch's 'resync' and 'sig_*'
              trigger.id branches). reflex_enable gates REFLEX's scene-firing
              (the same automation's 'reflex_event' branch). A room can KNOW
              its state fully live with reflex_enable still off — it just
              won't act on it via scenes yet. Both default false, both resolve
              via the same chain: optional label override
              (zenos_roomstate_master_switch / zenos_reflex_master_switch, any
              domain, truthy 'on' wins) > household cabinet drawer
              (roomstate_config / reflex_config .enabled) > published default
              false. No helper is ever shipped — add one yourself if you want
              an override switch.
              PIPELINE: Stage 1 (always live, ungated) is folded directly into the
              room_state.yaml blueprint itself — every room deployed via that
              blueprint fires event zen_event kind=room_state_changed automatically
              on a real state transition, zero per-room wiring, nothing to add to
              any room's package file ever. Stage 2 (the 'reflex_event'
              trigger.id branch inside automation.zenos_room_manager_dispatch,
              gated by reflex_enable) listens for that event and resolves a
              scene via label_entities(scene_<state>) intersect label_entities(room)
              intersect label_entities(<home_mode daypart>) — first match wins,
              falls back to dropping the mode filter (room+state only) if nothing
              matches with mode applied.
              SCENE LABEL TAXONOMY — output-side labels, distinct from the v2
              INPUT-side labels (zen_occupied/zen_engaged/zen_asleep tag SOURCE
              entities that DRIVE occupancy; these tag OUTPUT scenes instead):
              scene_vacant / scene_checking / scene_occupied / scene_engaged /
              scene_asleep / scene_paused / scene_automation / scene_cleaning /
              scene_emergency. Only tag the tiers that actually have a scene —
              untagged tier = safe no-op for that state. HOME MODE DAYPART labels
              are reused directly from zen_home_mode's own label set (home_wake /
              home_morning / home / home_evening / night / night_late) — no new
              labels needed for that axis, and they must match the slug of
              zen_home_mode's actual state values exactly (e.g. 'home', not
              'home_day' or 'daytime').
              STATE INHERITANCE: engaged/cleaning/emergency automatically fall
              through to occupied's resolution (mode-specific first, then any-mode)
              whenever they have no scene of their own — tagging a dedicated scene
              for any of them always wins over this fallback, inheritance only
              fills genuine gaps. vacant/checking/asleep/paused/automation never
              inherit — those are not occupied-flavored states.
              GAP CLASSIFICATION (2026-08-07, ticket #10287): a null cell in
              wired_matrix does not by itself mean something's missing —
              read tier_status[state] instead. 'wired' / 'inherited' = truly
              covered. 'gap' = genuinely incomplete or ambiguous, worth
              wiring. 'ok_by_design' = state is checking/paused/automation
              AND has no scene at all — these three tiers legitimately exist
              to do nothing scene-wise on purpose (Paused = human/agent
              all-stop, Automation = another process already owns the room,
              Checking = a brief ambiguous window), so leaving them unwired
              is a valid design choice, not a task left undone. Applies
              identically to the whole-home rollup (rooms[].gaps vs
              rooms[].ok_by_design) and total_gap_count/rooms_with_gaps_count
              only ever reflect real gaps, never ok_by_design states.
              WORKFLOW (per room): reflex_wire area=<room> to see candidate scenes
              (fuzzy-matched by name substring / room label / area_id — 3
              independent match routes, unioned) + tier_coverage + the full
              wired_matrix (every state x every home_mode daypart, computed with
              the EXACT same resolution Stage 2 uses, so it never drifts out of
              sync with what actually fires) + tier_status (see GAP
              CLASSIFICATION above) + wiring_warnings (flags genuinely
              ambiguous ties — 2+ scenes tagged for the identical state+room+mode
              slot with no way to distinguish them; NOT a false-positive when
              multiple mode-specific scenes simply coexist for their own distinct
              dayparts). Add reflex_wire_detail=true for scene_details — every
              distinct scene in the matrix, its member entity_id list,
              member_areas + outside_room (flags a scene reaching outside its own
              labeled room — may be intentional, may be a mistagging bug, worth a
              glance either way), and each member's CURRENT live state +
              brightness/color_temp_kelvin/rgb_color/labels/area_id (NOT what the
              scene will SET them to on activation — HA doesn't expose a scene's
              captured per-entity values through any state/attribute/template
              function reachable from here, only current live state).
              Write: reflex_assignments=['entity_id|state|mode', ...] (mode
              optional — blank means this scene is the room's any-mode fallback
              for that state) + confirm_action=true. Auto-creates any missing
              scene_<state> label first (avoids the same silent-tag-fail bug
              hit elsewhere in this system when a label doesn't pre-exist in the
              registry), then tags [scene_<state>, room, mode?] onto each entity —
              additive, never removes existing labels.
              WHOLE-HOME ROLLUP: omit area= entirely for a lean house-wide pass —
              every room's wired_direct / inherited_via_occupied / gaps states,
              plus room_count / fully_wired_count / rooms_with_gaps_count /
              total_gap_count. The fastest way to see what's left to wire across
              the whole house; use area=<room> for the full per-room detail once
              you know which room to work on.
            drawer_hint: >-
              Layout defined. Get: zen_dojotools_room_manager mode=get area={area_id}.
              Fields: adjacent[], portals[], windows[], walls, occupants[].
              Set: mode=set. Link rooms: mode=link area={a} area_b={b}.
            caller_token: "{{ _caller_token }}"
      - stop: help
        response_variable: _result
