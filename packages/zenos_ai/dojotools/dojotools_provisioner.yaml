#####################################################################
# zen_dojotools_provisioner — ZenOS-AI cabinet provisioner
# Version: 5.3.2
# v5.3.2: deprovision removes every type label the cabinet carries, as a
#   list. A slot carrying two (a stale one from an earlier provision) had them
#   written out back to back into one name that does not exist, and
#   deprovision failed ("Label zen_user_cabinetzen_family_cabinet not found").
#   Deprovision also keeps the zen_cabinet parent label: a free slot carries
#   it, and stripping it left the slot looking unlike every other free slot.
# v5.3.1: each cert this tool declares gets a short plain description for
#   the approval prompt (the old text moves to detail) and its real max_level.
# v5.3.0: cert names moved to the zenos.* namespace (2026.11). An old flat
#   grant still satisfies the new name for one release (reissue pending).
# v5.2.0: onboarding gate (zen_os_1 entry_gate), tool 1.2.0. An agent without
#   zenos.agent.basic gets help and tool_manifest; provision, deprovision and
#   replace answer onboarding_required with next_step zen_flynn_oobe.
# v5.1.4: every FileCabinet call names caller_tool zen_dojotools_provisioner,
#   a lifecycle principal in the cabinet ACL defaults (#10626).
# v5.1.3: deprovision reports error (with the dismount answer) when the cabinet
#   is not online_unmounted afterwards -- it said success regardless; the mount
#   check reads FileCabinet's flat answer (the old result-envelope unwrap is gone).
# v5.1.2 (#10636): mount/dismount go through FileCabinet mount_cabinet /
#   dismount_cabinet instead of raw set_variable_legacy meta writes. FC's own
#   wait + verification replaces provisioner's duplicate waits; the mount
#   rollback keys off FC's verified result.
# v5.1.1: bare call (no mode, no cabinet/person input) returns help instead of provisioning.
#
# v1.1.0 (ZenOS-AI 4.5.5)
#
# Ops: provision, deprovision, replace
#
# provision: validates GUID, applies type label, mounts a stacks cab,
#   directory-preloads profile data. ai_user: also seeds blank zenai_essence.
#   Fires identity manifest rebuild.
#   Rollback on health gate timeout: strips label, cab returns to stacks.
#
# deprovision: dismounts cab, strips type label, fires manifest rebuild.
#   Blocked if cab holds a zen_default_* label — transfer default first.
#
# replace: deprovision replace_cabinet, then provision target_cabinet.
#   Same cab_type for both. Stacks make replace cheap.
#
# GUID gate (provision): GUID must be present, valid UUID format, and
#   unique across ALL currently online_mounted zen_cabinet entities.
#   Gate runs BEFORE label application — no rollback needed on failure.
#
# FG-38 SAFE: all VolumeInfo reads use two-round normalization.
#####################################################################

script:

  zen_dojotools_provisioner:
    alias: Zen DojoTools Provisioner
    description: >-
      Ready Player 2 — provision, deprovision, or replace a cabinet-backed
      identity (ai_user/user/family/household), activating or retiring a
      stacks-backed identity slot. mode=help for the full gate/field/example
      reference, mode=tool_manifest for self-description.
    mode: queued
    max: 5

    fields:
      mode:
        name: Operation Mode
        description: >-
          REQUIRED. One of these three string values, passed as mode: "<value>":
          "provision" (pull an online_unmounted cabinet into service), "deprovision"
          (return a cabinet to stacks), "replace" (deprovision one cabinet then
          provision another with the same cab_type). These are not separate
          boolean fields of their own.
        default: provision
        selector:
          select:
            options:
              - provision
              - deprovision
              - replace
              - help
              - tool_manifest

      cab_type:
        name: Cabinet Type
        description: >-
          Type of identity being provisioned. Determines which label is applied
          to the cabinet. Required for provision and replace. Passed as
          cab_type: "<value>", one of the options below.
        selector:
          select:
            options:
              - ai_user
              - user
              - family
              - household
              - tool_manifest

      target_cabinet:
        name: Target Cabinet
        description: >-
          Cabinet entity to provision (online_unmounted) or deprovision
          (online_mounted). Required for all modes.
        selector:
          entity:
            filter:
              - domain: sensor

      replace_cabinet:
        name: Replace Cabinet (replace mode only)
        description: >-
          Existing cabinet to deprovision before provisioning target_cabinet.
          Required for replace mode only.
        required: false
        selector:
          entity:
            filter:
              - domain: sensor

      person_entity:
        name: Person Entity (optional)
        description: >-
          HA person entity_id. If provided, friendly_name and user_id are
          preloaded into the profile drawer during provisioning.
        required: false
        selector:
          entity:
            filter:
              - domain: person

      profile_payload:
        name: Profile Payload (optional)
        description: >-
          JSON string of additional key/value pairs to press into the profile
          drawer during provisioning. Merged with person_entity data if both
          provided.
        required: false
        selector:
          text:
            multiline: true

      caller_token:
        name: Caller Token
        required: false
        default: ''
        selector:
          text:

    sequence:

    - if: "{{ result is not defined and (mode | default('') | lower) == 'tool_manifest' }}"
      then:
      - variables:
          result: >-
            {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
            {{ MF.tool_manifest(
                tool='zen_dojotools_provisioner',
                display_name='Provisioner',
                tier='dojotools',
                version='1.3.2',
                health={'configured': true, 'status': 'ok', 'notes': []},
                required_labels=['dojotools'],
                optional_labels=[],
                consumes=['provision_target'],
                returns=['provision_result'],
                icon='mdi:package-variant',
                color='blue-grey',
                stripe=3,
                impact='soft',
                mcp_exposed=true,
                caller_token=caller_token | default('')
            ) | from_json | combine({'certs_required': [
                {'cert': 'zenos.system.cabinet_lifecycle_control', 'max_level': 1, 'description': "Set up and repair the assistant's storage", 'level': 1, 'modes': ['provision', 'deprovision', 'replace']}
            ]}) }}

    # Bare call (no mode, no cabinet/person input) = help, never a provision.
    - if: >-
        {{ result is not defined and ((mode | default('') | lower) == 'help'
           or ((mode | default('', true) | string | trim) == '' and (cab_type | default('', true) | string | trim) == ''
               and (target_cabinet | default('', true) | string | trim) == '' and (person_entity | default('', true) | string | trim) == '')) }}
      then:
      - variables:
          _pv_modes:
            provision: "Pulls target_cabinet (init/online_unmounted) into service, applies cab_type label, mounts, preloads profile, seeds essence for ai_user/user."
            deprovision: "Requires online_mounted, blocked on zen_default_* label. Strips labels, dismounts."
            replace: "Deprovisions replace_cabinet, then provisions target_cabinet with the same cab_type."
            help: "This reference."
            tool_manifest: "UMP self-description, no side effects."
      - variables:
          _pv_help_message: >-
            {%- set ns = namespace(out='Provision, deprovision, or replace a cabinet-backed identity (ai_user/user/family/household). All write modes require zenos.system.cabinet_lifecycle_control cert level 1. ') -%}
            {%- for k, v in _pv_modes.items() -%}
              {%- set ns.out = ns.out ~ 'mode=' ~ k ~ ' -- ' ~ v ~ ' ' -%}
            {%- endfor -%}
            {{ ns.out | trim }}
      - variables:
          result:
            status: help
            message: "{{ _pv_help_message }}"
            mode: help
            tool: zen_dojotools_provisioner
            summary: >-
              Ready Player 2 -- provision, deprovision, or replace a
              cabinet-backed identity (ai_user/user/family/household). All
              write modes require the zenos.system.cabinet_lifecycle_control cert (level 1).
            modes: "{{ _pv_modes }}"
            modes_full:
              provision: >-
                Pulls target_cabinet (must be in init or online_unmounted state)
                into service. Auto-stamps via cabinetadmin_factory if the
                cabinet is still 'init' with no VolumeInfo yet. Runs the GUID
                gate (must exist, be a valid UUID, and be unique across every
                online_mounted zen_cabinet) BEFORE applying any label -- a
                failed gate leaves the cabinet untouched, no rollback needed.
                Once gates pass: applies the cab_type label + the universal
                zen_cabinet parent label, mounts (waits up to 10s for
                online_mounted), directory-preloads person_entity/
                profile_payload into a profile drawer, seeds a blank
                zenai_essence for ai_user/user types, fires
                cabinet_provisioned + identity_manifest_rebuild events.
                Rolls back (strips the type label, cabinet returns to stacks)
                if the mount health gate times out.
              deprovision: >-
                Requires target_cabinet in online_mounted state. Blocked if
                the cabinet holds any zen_default_* label -- transfer the
                default label to another cabinet first. Strips the cab_type
                label (the zen_cabinet parent label stays, as on every free
                slot), dismounts (waits up to 10s
                for online_unmounted), fires cabinet_deprovisioned +
                identity_manifest_rebuild events.
              replace: >-
                Deprovisions replace_cabinet, then provisions target_cabinet
                with the same cab_type -- same gates and side effects as
                calling deprovision then provision separately, in one call.
              help: This reference.
              tool_manifest: UMP self-description, no side effects.
            fields:
              mode: "REQUIRED. provision (default) / deprovision / replace / help / tool_manifest."
              cab_type: "REQUIRED for provision/replace. One of ai_user, user, family, household. Determines which type label is applied."
              target_cabinet: "REQUIRED for all write modes. Cabinet entity to provision (must be init/online_unmounted) or deprovision (must be online_mounted)."
              replace_cabinet: "REQUIRED for replace mode only. Existing cabinet to deprovision before provisioning target_cabinet."
              person_entity: "Optional. HA person entity_id -- preloads friendly_name + user_id into the profile drawer during provisioning."
              profile_payload: "Optional. JSON string of extra key/value pairs merged into the profile drawer, on top of person_entity data if both given."
              caller_token: "Opaque token echoed in response."
            gates_order: >-
              For provision: target state check -> auto-stamp if init ->
              GUID exists -> GUID is valid UUID -> GUID uniqueness across all
              online_mounted cabinets -> cert check -> label+mount -> health
              gate (rollback on timeout) -> profile preload -> essence seed.
              For deprovision: target state check -> default-label check ->
              cert check -> label strip+dismount -> health gate (no
              rollback path -- dismount failure just reports unverified).
            examples:
              provision_ai_user: {mode: provision, cab_type: ai_user, target_cabinet: sensor.zenos_expansion_cabinet_1}
              provision_with_profile: {mode: provision, cab_type: user, target_cabinet: sensor.zenos_expansion_cabinet_2, person_entity: person.member_name}
              deprovision: {mode: deprovision, target_cabinet: sensor.zenos_secondary_user_cabinet}
              replace: {mode: replace, cab_type: user, replace_cabinet: sensor.zenos_secondary_user_cabinet, target_cabinet: sensor.zenos_expansion_cabinet_1}
            notes:
              - "Cabinets provisioned/deprovisioned here are stacks-backed (online_unmounted <-> online_mounted) -- this is identity-slot activation, not raw cabinet hardware management (that's zen_admintools_cabinetadmin)."
              - "GUID uniqueness check only looks at currently online_mounted cabinets -- a GUID reused after full deprovision + cabinet deletion elsewhere would not be caught here."
              - "deprovision cannot be used to remove a zen_default_* cabinet -- transfer the default label first via the appropriate admin tool."
            caller_token: "{{ caller_token | default('') }}"

    # Onboarding gate (zen_os_1 entry_gate): an agent without
    # zenos.agent.basic gets help and tool_manifest only (both answered
    # above). Calls no user started pass.
    - if: "{{ result is not defined }}"
      then:
        - variables:
            _pv_gate: >-
              {%- import 'zenos_ai/zen_os_1.jinja' as OS -%}
              {{ OS.entry_gate((context.user_id if context is defined else '') or '', 'zen_dojotools_provisioner', mode | default('provision', true) | string | lower | trim) | from_json({'pass': false, 'reason': 'guarded: the onboarding gate could not be read'}) }}
        - if: "{{ not _pv_gate.get('pass', false) }}"
          then:
            - variables:
                result:
                  status: error
                  mode: "{{ mode | default('provision', true) }}"
                  reason: "{{ _pv_gate.reason }}"
                  next_step: "{{ _pv_gate.next_step }}"
                  caller_token: "{{ caller_token | default('') }}"
            - action: system_log.write
              data:
                level: warning
                logger: zen_entry_gate
                message: "{{ _pv_gate.get('log') or 'onboarding gate refused a call (gate result unreadable)' }}"

    # ── Normalize inputs ───────────────────────────────────────────────────
    - variables:
        caller_token: "{{- caller_token | default('') -}}"
    - variables:
        _op: "{{ mode | default('provision') | lower | trim }}"
        _cab_type: "{{ cab_type | default('') | lower | trim }}"
        _target: "{{ target_cabinet | default('') | trim }}"
        _replace: "{{ replace_cabinet | default('') | trim }}"
        _person: "{{ person_entity | default('') | trim }}"
        _payload_raw: "{{ profile_payload | default('') | trim }}"
    - variables:
        _valid_types:
          - ai_user
          - user
          - family
          - household
        _type_label_map:
          ai_user: zen_ai_user_cabinet
          user: zen_user_cabinet
          family: zen_family_cabinet
          household: zen_household_cabinet
        _default_label_slugs:
          - zen_default_household_cabinet
          - zen_default_family_cabinet
          - zen_default_user_cabinet
          - zen_default_ai_user_cabinet
    - variables:
        _type_label_id: "{{ _type_label_map.get(_cab_type, '') }}"
        _cab_type_friendly_map:
          ai_user: AI User Cabinet
          user: User Cabinet
          family: Family Cabinet
          household: Household Cabinet

    # ── Gate: require target_cabinet ──────────────────────────────────────
    - if:
      - condition: template
        value_template: "{{ result is not defined and _target == '' }}"
      then:
      - variables:
          result:
            status: error
            message: target_cabinet is required.
            caller_token: "{{ caller_token }}"

    # ── Gate: require cab_type for provision / replace ─────────────────────
    - if:
      - condition: template
        value_template: "{{ result is not defined and _op in ['provision', 'replace'] and _cab_type not in _valid_types }}"
      then:
      - variables:
          result:
            status: error
            message: "Invalid cab_type '{{ _cab_type }}'. Must be one of: ai_user, user, family, household."
            caller_token: "{{ caller_token }}"

    # ── Gate: require replace_cabinet for replace mode ────────────────────
    - if:
      - condition: template
        value_template: "{{ result is not defined and _op == 'replace' and _replace == '' }}"
      then:
      - variables:
          result:
            status: error
            message: replace mode requires replace_cabinet.
            caller_token: "{{ caller_token }}"

    # ── Cert-gate — cabinet_lifecycle_control. Reuses the same cert admintools.yaml's
    # cabinetadmin already gates its own hardware-layer cabinet ops with --
    # provisioner is the identity-slot-activation layer of the same cabinet
    # lifecycle capability (spinning up/tearing down a household member or
    # AI identity), not a distinct concern deserving its own cert. Every
    # remaining mode past this point (provision/deprovision/replace) is a
    # write -- there is no read-only mode in this script besides
    # tool_manifest, already returned above. ──
    - if: "{{ result is not defined }}"
      then:
      - action: script.zen_dojotools_identity
        response_variable: _prov_id_raw
        continue_on_error: true
        data:
          mode: resolve_caller_identity
          required_cert: zenos.system.cabinet_lifecycle_control
          required_cert_level: 1
          target_entity: "{{ _target }}"
          caller_token: "{{ caller_token }}"
      - variables:
          _prov_id_fields: >-
            {%- import 'zenos_ai/zen_os_1.jinja' as OS -%}
            {%- set _raw = OS.resolve_identity_fields(_prov_id_raw) -%}
            {{- (_raw | from_json) if _raw is string else _raw -}}
          _prov_cert_policy: "{{ _prov_id_fields.policy_status }}"
          _prov_cert_authorized: "{{ _prov_id_fields.authorized }}"
          _prov_cert_level: "{{ _prov_id_fields.cert_level }}"
          _prov_cert_block_reason: "{{ _prov_id_fields.block_reason }}"
      - if: "{{ _prov_cert_policy != 'allowed' or not _prov_cert_authorized }}"
        then:
          - variables:
              _prov_cd_raw: >-
                {%- import 'zenos_ai/zen_os_1.jinja' as OS -%}
                {{ OS.cert_denial(_prov_cert_policy, _prov_cert_authorized, _prov_cert_level, 'zenos.system.cabinet_lifecycle_control', 1, _op, _prov_cert_block_reason) -}}
          - variables:
              result: >-
                {{ ((_prov_cd_raw | from_json) if _prov_cd_raw is string else _prov_cd_raw) | combine({'tool': 'zen_dojotools_provisioner', 'caller_token': caller_token}) }}

    ###########################################################################
    # PROVISION
    ###########################################################################
    - if:
      - condition: template
        value_template: "{{ result is not defined and _op in ['provision', 'replace'] }}"
      then:

      # ── Gate: target must be init or online_unmounted ───────────────────
      - if:
        - condition: template
          value_template: "{{ states(_target) not in ['init', 'online_unmounted'] }}"
        then:
        - variables:
            result:
              status: error
              message: >-
                provision requires target_cabinet in init or online_unmounted
                state (in the stacks). Current state: '{{ states(_target) }}'.
              caller_token: "{{ caller_token }}"

      # ── Auto-stamp if init (no VolumeInfo yet) ───────────────────────────
      - variables:
          _needs_stamp: "{{ states(_target) == 'init' }}"
          _cab_type_friendly: "{{ _cab_type_friendly_map.get(_cab_type, _cab_type | title | replace('_', ' ') + ' Cabinet') }}"

      - if:
        - condition: template
          value_template: "{{ result is not defined and _needs_stamp }}"
        then:
        - action: script.zen_admintools_cabinetadmin_factory
          data:
            cabinet_entity: "{{ _target }}"
            cabinet_type: "{{ _cab_type_friendly }}"
            confirm_action: true
            caller_token: "{{ caller_token }}"
          response_variable: _stamp_result
        - wait_template: "{{ states(_target) == 'online_unmounted' }}"
          timeout: '00:00:15'
          continue_on_timeout: true
        - if:
          - condition: template
            value_template: "{{ states(_target) != 'online_unmounted' }}"
          then:
          - variables:
              result:
                status: error
                message: "provision failed: auto-stamp did not land online_unmounted within 15s. Current state: '{{ states(_target) }}'."
                caller_token: "{{ caller_token }}"

      # ── GUID gate (before label application) ────────────────────────────
      # FG-38 safe — two-round normalization on VolumeInfo
      - variables:
          _vi_vars: >-
            {%- set _v = state_attr(_target, 'variables') | default({}, true) -%}
            {{ _v if _v is mapping else {} }}
      - variables:
          _vi_entry: >-
            {%- set _e = _vi_vars.get('AI_Cabinet_VolumeInfo', {}) -%}
            {%- set _e = _e if _e is mapping else (_e | from_json if _e is string else {}) -%}
            {%- set _vi = _e.get('value', _e) -%}
            {%- set _vi = _vi if _vi is mapping else (_vi | from_json if _vi is string else {}) -%}
            {{ _vi }}
      - variables:
          _guid: "{{ _vi_entry.get('id', '') | trim }}"
          _guid_pattern: "(?i)^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"

      # Gate: GUID must exist
      - if:
        - condition: template
          value_template: "{{ result is not defined and _guid == '' }}"
        then:
        - variables:
            result:
              status: error
              message: >-
                GUID gate failed: AI_Cabinet_VolumeInfo.id is missing or empty
                on '{{ _target }}'. Cabinet needs stamping before provisioning.
              caller_token: "{{ caller_token }}"

      # Gate: GUID must be valid UUID format
      - if:
        - condition: template
          value_template: "{{ result is not defined and not (_guid is match(_guid_pattern)) }}"
        then:
        - variables:
            result:
              status: error
              message: "GUID gate failed: '{{ _guid }}' is not a valid UUID format."
              caller_token: "{{ caller_token }}"

      # Gate: GUID must be unique across all online_mounted cabs
      - variables:
          _guid_collision: >-
            {%- set ns = namespace(collision='') -%}
            {%- set all_cabs = label_entities('Zen Cabinet' | slugify) | list -%}
            {%- for eid in all_cabs if eid != _target -%}
              {%- if states(eid) == 'online_mounted' -%}
                {%- set _v = state_attr(eid, 'variables') | default({}, true) -%}
                {%- set _v = _v if _v is mapping else {} -%}
                {%- set _e = _v.get('AI_Cabinet_VolumeInfo', {}) -%}
                {%- set _e = _e if _e is mapping else (_e | from_json if _e is string else {}) -%}
                {%- set _vi = _e.get('value', _e) -%}
                {%- set _vi = _vi if _vi is mapping else (_vi | from_json if _vi is string else {}) -%}
                {%- set _other_guid = _vi.get('id', '') | trim -%}
                {%- if _other_guid != '' and _other_guid | lower == _guid | lower -%}
                  {%- set ns.collision = eid -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.collision }}

      - if:
        - condition: template
          value_template: "{{ result is not defined and _guid_collision != '' }}"
        then:
        - variables:
            result:
              status: error
              message: "GUID gate failed: '{{ _guid }}' is already in use by '{{ _guid_collision }}'. Cannot provision duplicate identity."
              colliding_cabinet: "{{ _guid_collision }}"
              caller_token: "{{ caller_token }}"

      # ── Apply type label + Zen Cabinet parent — only once all gates pass ──
      - if:
        - condition: template
          value_template: "{{ result is not defined }}"
        then:
      # zen_cabinet is the universal parent label required by all cabinet
      # health sensors, scroll_count, slot_entities, and label_entities()
      # enumerations. Without it, provisioned expansion cabs are invisible
      # to intersect(all_cabs, label_entities(type_slug)) queries.
        - action: homeassistant.add_label_to_entity
          data:
            label_id: "{{ _type_label_id }}"
            entity_id: "{{ _target }}"
        - action: homeassistant.add_label_to_entity
          data:
            label_id: zen_cabinet
            entity_id: "{{ _target }}"

        # ── Mount (one door, #10636): FileCabinet mount_cabinet writes
        # meta.mounted with its init/health/idempotent guards, waits for
        # online_mounted and verifies it. Its verified result is the health gate.
        - action: script.zen_sutra_filecabinet
          continue_on_error: true
          response_variable: _mount_fc
          data:
            caller_tool: zen_dojotools_provisioner
            action_type: mount_cabinet
            volume_entity_id: "{{ _target }}"
        - variables:
            _mount_ok: >-
              {%- set r = _mount_fc if _mount_fc is mapping else {} -%}
              {{ r.get('status') == 'success' and r.get('state') == 'online_mounted' }}

        # ── Rollback when FileCabinet could not verify the mount ─────────────
        - if:
          - condition: template
            value_template: "{{ not _mount_ok }}"
          then:
          - action: homeassistant.remove_label_from_entity
            data:
              label_id: "{{ _type_label_id }}"
              entity_id: "{{ _target }}"
          - variables:
              result:
                status: error
                message: >-
                  provision failed: FileCabinet mount_cabinet did not verify
                  '{{ _target }}' online_mounted. Type label stripped. Cabinet returned to stacks.
                rollback: label_stripped
                caller_token: "{{ caller_token }}"

        - if: "{{ result is not defined }}"
          then:
          # ── Directory preload (optional) ───────────────────────────────────
          - variables:
              _person_data: >-
                {%- if _person != '' -%}
                  {{- {
                    'name': state_attr(_person, 'friendly_name') | default('', true),
                    'person_entity': _person
                  } -}}
                {%- else -%}
                  {{- {} -}}
                {%- endif -%}
              _payload_data: >-
                {%- if _payload_raw != '' -%}
                  {%- set _p = _payload_raw | from_json if _payload_raw is string else _payload_raw -%}
                  {{- _p if _p is mapping else {} -}}
                {%- else -%}
                  {{- {} -}}
                {%- endif -%}
          - variables:
              _profile: "{{ _person_data | combine(_payload_data) }}"

          - if:
            - condition: template
              value_template: "{{ _profile | length > 0 }}"
            then:
            - action: script.zen_sutra_filecabinet
              data:
                caller_tool: zen_dojotools_provisioner
                action_type: create
                force_action: true
                set_timestamp: true
                volume_entity_id:
                  - "{{ _target }}"
                key: >-
                  {%- if _cab_type == 'user' -%}_user_profile
                  {%- elif _cab_type == 'family' -%}_family_profile
                  {%- elif _cab_type == 'household' -%}_household_profile
                  {%- else -%}profile{%- endif -%}
                value: "{{ _profile | tojson }}"

          # ── ai_user: seed blank zenai_essence ────────────────────────────────
          # Ensures profile editor read/write is live immediately after provision.
          # mode: write with no fields will self-heal if this is ever deleted.
          - if:
            - condition: template
              value_template: "{{ _cab_type == 'ai_user' }}"
            then:
            - action: script.zen_sutra_filecabinet
              data:
                caller_tool: zen_dojotools_provisioner
                action_type: create
                force_action: true
                set_timestamp: true
                volume_entity_id:
                  - "{{ _target }}"
                key: zenai_essence
                value: >-
                  {{ {
                    'core': {
                      'id': _guid,
                      'person_id': '',
                      'minted_for': '',
                      'minted_at': now().isoformat(),
                      'household_guid': '',
                      'signature': 'pending_x509'
                    },
                    'jacket': {
                      'name': '',
                      'presentation': '',
                      'pronouns': '',
                      'persona': {
                        'appearance': {'visual': ''},
                        'voice': {'register': '', 'identity': ''},
                        'household': {'position': ''}
                      },
                      'traits': {'warm': ''}
                    },
                    'companion': {'name': '', 'species': '', 'visual': ''}
                  } | tojson }}

          # ── user: seed blank zenai_essence ───────────────────────────────────────
          # Ensures zen_cabinets() validity for user-type cabs (GUID + name required).
          # GUID from VolumeInfo (_guid, already validated by GUID gate above).
          # Name from _profile if person_entity was provided at provision time;
          # empty string otherwise — operator can set jacket.name in essence later.
          - if:
            - condition: template
              value_template: "{{ _cab_type == 'user' }}"
            then:
            - action: script.zen_sutra_filecabinet
              data:
                caller_tool: zen_dojotools_provisioner
                action_type: create
                force_action: true
                set_timestamp: true
                volume_entity_id:
                  - "{{ _target }}"
                key: zenai_essence
                value: >-
                  {{ {
                    'core': {
                      'id': _guid,
                      'person_id': _person,
                      'minted_at': now().isoformat()
                    },
                    'jacket': {
                      'name': _profile.get('name', '')
                    }
                  } | tojson }}

          # ── Fire completion events ────────────────────────────────────────────
          - event: zen_event
            event_data:
              event:
                kind: cabinet_provisioned
                component: "{{ _target }}"
                cab_type: "{{ _cab_type }}"
                guid: "{{ _guid }}"
                severity: info
                summary: "Cabinet '{{ _target }}' provisioned as {{ _cab_type }} (GUID: {{ _guid }})."
          - event: zen_event
            event_data:
              event:
                kind: identity_manifest_rebuild
                component: zen_dojotools_provisioner
                severity: info
                summary: Identity manifest rebuild triggered by cabinet provision.

          # ── Return success ────────────────────────────────────────────────────
          - variables:
              provision_result:
                status: success
                message: "Cabinet '{{ _target }}' provisioned as {{ _cab_type }}. GUID: {{ _guid }}."
                cabinet: "{{ _target }}"
                cab_type: "{{ _cab_type }}"
                guid: "{{ _guid }}"
                profile_loaded: "{{ _profile | length > 0 }}"
                caller_token: "{{ caller_token }}"

    ###########################################################################
    # DEPROVISION (standalone or as part of replace)
    ###########################################################################
    - variables:
        _deprov_target: >-
          {%- if _op == 'replace' -%}{{ _replace }}{%- else -%}{{ _target }}{%- endif -%}

    - if:
      - condition: template
        value_template: "{{ result is not defined and _op in ['deprovision', 'replace'] }}"
      then:

      # ── Gate: must be online_mounted ─────────────────────────────────────
      - if:
        - condition: template
          value_template: "{{ states(_deprov_target) != 'online_mounted' }}"
        then:
        - variables:
            result:
              status: error
              message: >-
                deprovision requires target in online_mounted state. Current: '{{ states(_deprov_target) }}'.
              caller_token: "{{ caller_token }}"

      # ── Gate: cannot deprovision a default cabinet ────────────────────────
      - variables:
          _holds_default: >-
            {%- set ent_labels = labels(_deprov_target) -%}
            {{- ent_labels | select('in', _default_label_slugs) | list | count > 0 -}}

      - if:
        - condition: template
          value_template: "{{ result is not defined and _holds_default }}"
        then:
        - variables:
            result:
              status: error
              message: >-
                deprovision blocked: '{{ _deprov_target }}' holds a zen_default_* label.
                Transfer the default label to another cabinet before deprovisioning.
              caller_token: "{{ caller_token }}"

      # ── Strip the type label(s) — only once gates pass; zen_cabinet stays ─
      - if:
        - condition: template
          value_template: "{{ result is not defined }}"
        then:
        # Every type label the cabinet carries, as a list: a slot can carry
        # more than one (a stale label from an earlier provision), and
        # writing them out back to back made one name that does not exist.
        - variables:
            _deprov_type_labels: >-
              {%- set ent_labels = labels(_deprov_target) -%}
              {{ _type_label_map.values() | select('in', ent_labels) | unique | list }}

        - if:
          - condition: template
            value_template: "{{ _deprov_type_labels | count > 0 }}"
          then:
          - action: homeassistant.remove_label_from_entity
            data:
              label_id: "{{ _deprov_type_labels }}"
              entity_id: "{{ _deprov_target }}"

        # ── Dismount (one door, #10636): FileCabinet dismount_cabinet ─────────
        - action: script.zen_sutra_filecabinet
          continue_on_error: true
          response_variable: _dismount_fc
          data:
            caller_tool: zen_dojotools_provisioner
            action_type: dismount_cabinet
            volume_entity_id: "{{ _deprov_target }}"

        # ── Fire completion events ────────────────────────────────────────────
        - event: zen_event
          event_data:
            event:
              kind: cabinet_deprovisioned
              component: "{{ _deprov_target }}"
              severity: info
              summary: "Cabinet '{{ _deprov_target }}' deprovisioned and returned to stacks (verified: {{ states(_deprov_target) == 'online_unmounted' }})."
        - event: zen_event
          event_data:
            event:
              kind: identity_manifest_rebuild
              component: zen_dojotools_provisioner
              severity: info
              summary: Identity manifest rebuild triggered by cabinet deprovision.

        - variables:
            deprov_result:
              status: "{{ 'success' if states(_deprov_target) == 'online_unmounted' else 'error' }}"
              message: >-
                {{ "Cabinet '" ~ _deprov_target ~ "' deprovisioned (" ~ states(_deprov_target) ~ ")." if states(_deprov_target) == 'online_unmounted'
                   else "Cabinet '" ~ _deprov_target ~ "' labels removed, but it is " ~ states(_deprov_target) ~ ", not online_unmounted (dismount: " ~ ((_dismount_fc.get('message') or _dismount_fc.get('status')) if _dismount_fc is mapping else 'no answer') ~ ")." }}
              cabinet: "{{ _deprov_target }}"
              verified: "{{ states(_deprov_target) == 'online_unmounted' }}"
              dismount_status: "{{ _dismount_fc.get('status', '') if _dismount_fc is mapping else '' }}"
              caller_token: "{{ caller_token }}"

    ###########################################################################
    # Final result — consolidate provision / deprovision / replace
    ###########################################################################
    - if:
      - condition: template
        value_template: "{{ result is not defined and _op == 'provision' }}"
      then:
      - variables:
          result: "{{ provision_result }}"

    - if:
      - condition: template
        value_template: "{{ result is not defined and _op == 'deprovision' }}"
      then:
      - variables:
          result: "{{ deprov_result }}"

    - if:
      - condition: template
        value_template: "{{ result is not defined and _op == 'replace' }}"
      then:
      - variables:
          result:
            status: success
            message: >-
              replace complete. Deprovisioned '{{ _replace }}',
              provisioned '{{ _target }}' as {{ _cab_type }}.
            deprovisioned: "{{ deprov_result }}"
            provisioned: "{{ provision_result }}"
            caller_token: "{{ caller_token }}"

    - if: "{{ result is not defined }}"
      then:
      - variables:
          result:
            status: error
            message: "Unknown mode '{{ _op }}'."
            caller_token: "{{ caller_token }}"

    - variables:
        result: >-
          {%- import 'zenos_ai/zen_os_1.jinja' as OS -%}
          {{- OS.envelope(
            status='error' if (result is mapping and result.get('status') == 'error') else 'success',
            mode=_op | default(''),
            result=result,
            tool='zen_dojotools_provisioner',
            caller_token=caller_token | default('')
          ) | from_json -}}
    - stop: provisioner response
      response_variable: result
