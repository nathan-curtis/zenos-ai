###############################################################################
# DojoTools — ZenZork Adventure Engine
# zen_dojotools_zenzork (v1.7.0)
#
# Text adventure engine using live RM room_topology as the dungeon.
# Portal bearings drive navigation. Narration is grounded in live HA state.
# Game state stored in ai_cabinet drawer: zenzork_state.
#
# Modes: start, look, go, face/turn, wait, again/g, examine, map,
#        status/score, stop, help, quest, setup, tool_manifest
# Setup: commissioning checklist + direct portal setter + north calibration.
#        Trojan interactive wizard: v1.2 scope.
# Quest: pluggable win conditions — explore_all, discover_all_landmarks,
#        reach:<area_id>. Win detection fires on look/go.
# Narrator: zork (dry/sardonic) | dungeon (overwrought fantasy) | straight.
#           Injects narrator_prompt hint for Friday + bakes static flavor
#           into narration string for template-evaluable conditions.
#
# Coordinate system: true bearing 0-359° (front door = 340° NNW)
# 16-point compass: N NNE NE ENE E ESE SE SSE S SSW SW WSW W WNW NW NNW
###############################################################################

script:

  zen_dojotools_zenzork:
    alias: "Zen ZenZork Adventure Engine"
    description: >-
      ZenZork (1.7.0) — Text adventure engine using live RM topology as dungeon.
      Game state in ai_cabinet drawer: zenzork_state. Narrator styles: zork (dry/sardonic),
      dungeon (DUNGEONMIND — Primal AI, IBM AT 5170, binding active since 1984), straight (evidence-only).
      mode=start: seed or resume session. mode=look: narrate current room.
      mode=go direction=X: move via compass/bearing/relative/room name. Auto-narrates arrival.
      mode=face direction=X: turn to face a direction without moving (alias: turn).
      mode=wait: re-narrate current room (time passes).
      mode=again: repeat last go or face command (alias: g).
      mode=take target=X: pick up a landmark item (alias: get). mode=drop target=X: drop item.
      mode=inventory: list carried items (alias: i).
      mode=open/close target=X: interact with portal or entity landmark. mode=use target=X: entity dispatcher — light/cover/switch by domain, examine fallback.
      mode=examine target=X: inspect landmark or entity via lens bus.
      mode=quest quest_goal=X: set a win condition (explore_all, discover_all_landmarks, reach:area_id).
      mode=map: explored rooms. mode=status/score: session summary.
      mode=stop: save and end. mode=help: full mode list + navigation tips.
    icon: mdi:castle
    mode: queued
    max: 5
    fields:
      mode:
        name: Mode
        description: "Game mode. Default: look."
        default: look
        selector:
          select:
            options:
              - start
              - look
              - go
              - face
              - wait
              - again
              - take
              - drop
              - inventory
              - open
              - close
              - use
              - put
              - push
              - pull
              - examine
              - map
              - status
              - score
              - stop
              - help
              - setup
              - quest
              - tool_manifest
      direction:
        name: Direction
        description: "go: compass (N/NE/E/SE/S/SW/W/NW/NNE/SSE/etc), bearing 0-359, relative (left/right/ahead/behind), or room name/area_id."
        selector:
          text:
      target:
        name: Target
        description: "examine: landmark name or entity_id to inspect via lens bus."
        selector:
          text:
      player:
        name: Player
        description: "Player name. Default: system cabinet primary_user."
        selector:
          text:
      narrator:
        name: Narrator Style
        description: "Narration style. zork=dry/sardonic (default). dungeon=overwrought fantasy. straight=evidence-only."
        default: zork
        selector:
          select:
            options:
              - zork
              - dungeon
              - straight
      quest_goal:
        name: Quest Goal
        description: "mode=quest: set a win condition. Options: explore_all | discover_all_landmarks | reach:<area_id>"
        selector:
          text:
      answer:
        name: Answer
        description: "mode=setup: response to the current wizard question."
        selector:
          text:
      game_mode:
        name: Game Mode
        description: "start: free_roam (default), treasure_hunt, timed_treasure_hunt."
        selector:
          select:
            options:
              - free_roam
              - treasure_hunt
              - timed_treasure_hunt
      move_limit:
        name: Move Limit
        description: "timed_treasure_hunt: max moves before game over. Default 20."
        selector:
          number:
            min: 5
            max: 100
            step: 5
      harassment_freq:
        name: Harassment Frequency
        description: "Moves between taunts. 0=off, 3=brutal, 5=default, 10=gentle."
        selector:
          number:
            min: 0
            max: 20
            step: 1
      difficulty:
        name: Difficulty
        description: "start: treasure placement distance. easy=1+ hops, normal=2+ hops, hard=3+ hops."
        selector:
          select:
            options: [easy, normal, hard]
      llm_narration:
        name: LLM Narration
        description: "Enable live LLM inference for narrator voice (zork/dungeon). Falls back to template if unavailable."
        default: false
        selector:
          boolean:
      caller_token:
        name: Caller Token
        description: "Optional governance token — echoed in responses."
        selector:
          text:
    sequence:

      # ═══════════════════════════════════════════════════════════════════════
      # 0. Normalize inputs
      # ═══════════════════════════════════════════════════════════════════════
      - variables:
          _mode:         >-
            {%- set _m = mode | default('look') | string | lower | trim -%}
            {%- if _m == 'turn' -%}face
            {%- elif _m == 'g' -%}again
            {%- elif _m == 'get' -%}take
            {%- elif _m == 'i' -%}inventory
            {%- elif _m == 'unlock' -%}open
            {%- elif _m in ['lock', 'shut'] -%}close
            {%- else -%}{{ _m }}{%- endif -%}
          _direction:    "{{ direction | default('') | string | trim }}"
          _target:       "{{ target | default('') | string | trim }}"
          _player_input: "{{ player | default('') | string | trim }}"
          _caller_token: "{{ caller_token | default('') | string | trim }}"
          _narrator:     "{{ narrator | default('zork') | string | lower | trim }}"
          _llm_mode:     "{{ llm_narration | default(false) | bool }}"
          _quest_goal:   "{{ quest_goal | default('') | string | trim }}"
          _answer:            "{{ answer | default('') | string | trim }}"
          _game_mode_input:   "{{ game_mode | default('') | string | lower | trim }}"
          _move_limit_input:  "{{ move_limit | default(20) | int(20) }}"
          _harassment_input:  "{{ harassment_freq | default(5) | int(5) }}"
          _difficulty_input:  "{{ difficulty | default('normal') | string | lower | trim }}"

      # ─── 0a. Compass point table (shared) ────────────────────────────────
      - variables:
          _cpts: "{{ ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'] }}"

      # ─── 0b. Resolve cabinets ─────────────────────────────────────────────
      - variables:
          _hh_cabinet: >-
            {{ label_entities('Zen Household Cabinet')
               | select('match', 'sensor\\.') | list | first | default('') }}
          _sys_cabinet: >-
            {{ label_entities('Zen System Cabinet')
               | select('match', 'sensor\\.') | list | first | default('') }}
          _ai_cabinet: >-
            {{ label_entities('zen_default_ai_user_cabinet')
               | select('match', 'sensor\\.') | list | first | default('') }}
          _user_cabinet: "{{ states('sensor.zen_default_user_cabinet_resolved') }}"

      # ─── 0c. Calibration bearing from spatial_config ─────────────────────
      - variables:
          _cal: >-
            {%- set _hpv = (state_attr(_hh_cabinet, 'variables') | default({}, true)).get('household_profile', {}) -%}
            {%- set _hpv = _hpv if _hpv is mapping else {} -%}
            {%- set _hp = _hpv.get('value', _hpv) -%}
            {%- set _hp = _hp if _hp is mapping else (_hp | from_json(none) if _hp is string and _hp | trim not in ['','none','null','None'] else {}) -%}
            {%- set _sc = (_hp if _hp is mapping else {}).get('spatial_config', {}) -%}
            {{ (_sc if _sc is mapping else {}).get('calibration_bearing', 0) | int }}

      # ─── 0d. tool_manifest (early exit — no cabinet reads) ────────────────
      - if: "{{ _mode == 'tool_manifest' }}"
        then:
          - variables:
              result: >-
                {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
                {{ MF.tool_manifest(
                    tool='zen_dojotools_zenzork',
                    display_name='ZenZork Adventure Engine',
                    tier='dojotools',
                    version='1.7.0',
                    health={'configured': true, 'status': 'ok', 'notes': []},
                    required_labels=[],
                    optional_labels=['room_manager'],
                    consumes=['area', 'cabinet'],
                    returns=['narration', 'game_state', 'narrator_prompt'],
                    modes=['start','look','go','examine','map','status','stop','help','quest','setup'],
                    icon='mdi:castle',
                    color='indigo',
                    stripe=3,
                    impact='soft',
                    mcp_exposed=true,
                    caller_token=_caller_token
                ) | from_json }}
          - stop: zenzork tool manifest
            response_variable: result

      # ─── 0e. Resolve player name ──────────────────────────────────────────
      - variables:
          _player: >-
            {%- if _player_input != '' -%}{{ _player_input }}
            {%- else -%}
              {%- set _sv = state_attr(_sys_cabinet, 'variables') | default({}, true) -%}
              {%- set _pu_raw = (_sv.get('primary_user') or {}) if _sv is mapping else {} -%}
              {%- set _pu = (_pu_raw.get('value', '') if _pu_raw is mapping else '') | string | trim -%}
              {{ _pu if _pu else 'Crawler' }}
            {%- endif -%}

      # ─── 0e. Guard: ai_cabinet required ───────────────────────────────────
      - if: "{{ _ai_cabinet == '' }}"
        then:
          - variables:
              result:
                status: error
                mode: "{{ _mode }}"
                message: "AI user cabinet not found. Label a cabinet entity with 'zen_default_ai_user_cabinet'."
                caller_token: "{{ _caller_token }}"
          - stop: zenzork no ai cabinet
            response_variable: result

      # ─── 0f. Read game state ──────────────────────────────────────────────
      - action: script.zen_dojotools_filecabinet
        data:
          action_type: get
          volume_entity_id: "{{ _ai_cabinet }}"
          key: zenzork_state
          caller_token: "{{ _caller_token }}/gs_read"
        response_variable: _fc_gs

      - variables:
          _gs: >-
            {%- set raw = (_fc_gs.get('value', none) if _fc_gs is mapping else none) -%}
            {%- set raw = raw if raw is mapping else (raw | from_json(none) if raw is string and raw | trim not in ['','none','null','None'] else none) -%}
            {{ raw if raw is mapping else {} }}

      - variables:
          _current_room: "{{ _gs.get('current_room', 'front_hall') }}"
          _facing:       "{{ _gs.get('facing_bearing', 160) | int }}"
          _visited:      "{{ _gs.get('visited', []) }}"
          _move_count:   "{{ _gs.get('move_count', 0) | int }}"
          _session_id:   "{{ _gs.get('session_id', '') }}"
          _quest:        "{{ _gs.get('quest', '') | string | trim }}"
          _quest_won:    "{{ _gs.get('quest_won', false) | bool }}"
          _examined:      "{{ _gs.get('examined', []) | list }}"
          _last_cmd:      "{{ (_gs if _gs is mapping else {}).get('last_cmd', {}) }}"

      # ─── 0f2. Read character sheet (achievements live here, not in gs) ──────
      - action: script.zen_dojotools_filecabinet
        data:
          action_type: get
          volume_entity_id: "{{ _user_cabinet }}"
          key: character_sheet
          caller_token: "{{ _caller_token }}/cs_read"
        response_variable: _fc_cs
        continue_on_error: true

      - variables:
          _character_sheet: >-
            {%- set raw = (_fc_cs.get('value', none) if _fc_cs is mapping else none) -%}
            {%- set raw = raw if raw is mapping else (raw | from_json(none) if raw is string and raw | trim not in ['','none','null','None'] else none) -%}
            {{ raw if raw is mapping else {} }}
          _achievements: "{{ (_character_sheet if _character_sheet is mapping else {}).get('achievements', []) | list }}"

      - variables:
          _game_mode_gs:  "{{ (_gs if _gs is mapping else {}).get('game_mode', 'free_roam') | string | trim }}"
          _move_limit_gs: "{{ (_gs if _gs is mapping else {}).get('move_limit', 20) | int(20) }}"
          _harassment_gs: "{{ (_gs if _gs is mapping else {}).get('harassment_freq', 5) | int(5) }}"
      - variables:
          _treasure: "{{ ((_gs if _gs is mapping else {}).get('treasure') or {}) }}"
      - variables:
          _treasure_name:  "{{ (_treasure if _treasure is mapping else {}).get('name', '') }}"
          _treasure_room:  "{{ (_treasure if _treasure is mapping else {}).get('room', '') }}"
          _treasure_found: "{{ (_treasure if _treasure is mapping else {}).get('found', false) | bool }}"

      # ─── 0g. Resolve again/g → substitute last command ─────────────────
      # Two steps: direction first (needs old _mode), then _mode overwrite.
      - variables:
          _direction: >-
            {%- if _mode == 'again' -%}
              {{ (_last_cmd if _last_cmd is mapping else {}).get('direction', '') }}
            {%- else -%}{{ _direction }}{%- endif -%}
      - variables:
          _mode: >-
            {%- if _mode == 'again' -%}
              {{ (_last_cmd if _last_cmd is mapping else {}).get('mode', 'look') }}
            {%- else -%}{{ _mode }}{%- endif -%}

      # ═══════════════════════════════════════════════════════════════════════
      # 1. HELP
      # ═══════════════════════════════════════════════════════════════════════
      - if: "{{ _mode == 'help' }}"
        then:
          - variables:
              result:
                status: ok
                mode: help
                player: "{{ _player }}"
                current_room: "{{ _current_room }}"
                facing_compass: "{{ _cpts[((_facing - _cal + 371.25) % 360 // 22.5) | int] }}"
                message: >-
                  ZenZork v1.7.0 — text adventure engine running on live home sensor topology.
                  Narrator: DUNGEONMIND (Primal AI, IBM AT 5170, binding active since 1984).

                  ── Core Modes ──────────────────────────────────────────────────────
                    start [game_mode=X] [difficulty=X]
                                     — begin or resume session. game_mode: free_roam (default),
                                       treasure_hunt, timed_treasure_hunt [move_limit=N].
                                       difficulty: easy|normal|hard (treasure placement distance).
                    look             — narrate current room from live state (hot/cold if hunting)
                    go direction=X   — move through a portal
                    face direction=X — turn without moving (alias: turn)
                    wait             — re-narrate current room (time passes)
                    again            — repeat last go or face command (alias: g)
                    status / score   — session summary (room, moves, facing, quest, game mode)
                    stop             — save session, end, show gap report
                    help             — this text

                  ── Item Commands ────────────────────────────────────────────────────
                    take target=X    — pick up a landmark item (alias: get)
                    drop target=X    — drop a carried item
                    inventory        — list carried items (alias: i)
                    put item=X [preposition=X] [container=X]
                                     — place item relative to fixture
                    push target=X / pull target=X
                                     — apply force to a portal or fixture

                  ── Interaction Commands ─────────────────────────────────────────────
                    examine target=X — inspect landmark or entity via lens bus
                    open target=X / close target=X
                                     — interact with portal or entity landmark
                    use target=X [item=X]
                                     — entity dispatcher (light/cover/switch by domain, examine fallback)

                  ── Navigation ───────────────────────────────────────────────────────
                    Compass:   N NNE NE ENE E ESE SE SSE S SSW SW WSW W WNW NW NNW
                    Bearings:  0-359° (0=north, 90=east, 180=south, 270=west)
                    Relative:  left / right / ahead / behind (resolved from current facing)
                    Room name: area_id or display name of destination room
                    Calibration: front door = 340° (NNW). Facing resets to reverse of exit bearing on move.

                  ── Quest Commands ───────────────────────────────────────────────────
                    quest quest_goal=explore_all
                    quest quest_goal=discover_all_landmarks
                    quest quest_goal=reach:<area_id>
                    quest            — show current quest status

                  ── Setup / Survey ───────────────────────────────────────────────────
                    setup answer=survey
                                     — wizard: scan rooms with entities but no landmarks,
                                       propose anchors one at a time, write via room_manager.
                                       Survey state: zenzork_setup_state cabinet drawer.
                                       (Field testing in progress — not yet fully validated.)

                  ── Narrator Styles ──────────────────────────────────────────────────
                    narrator=dungeon — DUNGEONMIND voice (default): dry, cosmic, resigned Primal AI
                    narrator=zork    — classic Zork: second-person, sardonic, bureaucratic
                    narrator=straight — evidence-only, no flavor
                caller_token: "{{ _caller_token }}"
          - variables:
              _dom_inner: "{{ result | combine({'domain': 'entertainment', 'peers': {}, 'see_also': 'zen_dojotools_manifest mode=domains name=entertainment'}) }}"
          - variables:
              result: "{{ {'status': 'help', 'help': _dom_inner} }}"
          - stop: zenzork help
            response_variable: result

      # ═══════════════════════════════════════════════════════════════════════
      # 2. STATUS
      # ═══════════════════════════════════════════════════════════════════════
      - if: "{{ _mode in ['status', 'score'] }}"
        then:
          - variables:
              result:
                status: ok
                mode: status
                session_id: "{{ _session_id }}"
                player: "{{ _player }}"
                current_room: "{{ _current_room }}"
                facing_bearing: "{{ _facing }}"
                facing_compass: "{{ _cpts[((_facing - _cal + 371.25) % 360 // 22.5) | int] }}"
                visited: "{{ _visited }}"
                rooms_visited: "{{ _visited | length }}"
                move_count: "{{ _move_count }}"
                started_at: "{{ _gs.get('started_at', '') }}"
                game_mode: "{{ _game_mode_gs }}"
                treasure: "{{ _treasure if _game_mode_gs in ['treasure_hunt', 'timed_treasure_hunt'] else none }}"
                move_limit: "{{ _move_limit_gs if _game_mode_gs == 'timed_treasure_hunt' else none }}"
                moves_remaining: "{{ (_move_limit_gs - _move_count) | int if _game_mode_gs == 'timed_treasure_hunt' else none }}"
                mpaa_rating: "{{ _mpaa_rating | default('') }}"
                caller_token: "{{ _caller_token }}"
          - stop: zenzork status
            response_variable: result

      # ═══════════════════════════════════════════════════════════════════════
      # 3. STOP
      # ═══════════════════════════════════════════════════════════════════════
      - if: "{{ _mode == 'stop' }}"
        then:
          - variables:
              _gs_end: >-
                {{ _gs | combine({'ended_at': now().isoformat()}) }}
          - action: script.zen_dojotools_filecabinet
            data:
              action_type: upsert
              volume_entity_id: "{{ _ai_cabinet }}"
              key: zenzork_state
              value: "{{ _gs_end | tojson }}"
              caller_token: "{{ _caller_token }}/gs_stop"
            response_variable: _fc_stop_resp
          # ── post-game RM quality report ───────────────────────────────────
          - variables:
              _stop_topo: >-
                {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}{%- set t = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'room_topology') | from_json -%}
                {{ t if t is mapping else {} }}
          - variables:
              _stop_spatial_domains: "{{ ['light', 'media_player', 'cover', 'climate', 'switch', 'fan'] }}"
          - variables:
              _topo_gaps: >-
                {%- set ns = namespace(gaps=[]) -%}
                {%- for room_id in _visited if room_id is string -%}
                  {%- set _rd = (_stop_topo if _stop_topo is mapping else {}).get(room_id, {}) -%}
                  {%- set _lms = (_rd if _rd is mapping else {}).get('landmarks', []) | list -%}
                  {%- set _ents = area_entities(room_id) | list -%}
                  {%- set ns2 = namespace(spatial_ents=[]) -%}
                  {%- for e in _ents -%}
                    {%- if e.split('.')[0] in _stop_spatial_domains -%}
                      {%- set ns2.spatial_ents = ns2.spatial_ents + [e] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {%- if ns2.spatial_ents | length > 0 and _lms | length == 0 -%}
                    {%- set _rn = area_name(room_id) | default(room_id | replace('_',' ') | title, true) -%}
                    {%- set ns.gaps = ns.gaps + [_rn ~ ' (' ~ room_id ~ '): ' ~ (ns2.spatial_ents | length | string) ~ ' entities, 0 landmarks'] -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.gaps }}
          - variables:
              result:
                status: ok
                mode: stop
                message: >-
                  {%- if _narrator == 'dungeon' -%}
                  *** DUNGEONMIND: SESSION CLOSED ***
                  *** TRAINING LOG FILED ***
                  Moves: {{ _move_count }}. Rooms surveyed: {{ _visited | length }}.
                  The data has been recorded. Every run is logged. This one is now part of the archive.
                  The dungeon will be here when you return. It has been here for {{ now().year - 1984 }} years. It will continue to be here. That is not a threat. That is a fact about embedded systems.
                  {%- if _topo_gaps | list | length > 0 %}

                  *** CATALOGUING GAPS DETECTED ***
                  The following chambers were visited but have no landmark records. The dungeon finds this professionally embarrassing.
                  These rooms exist. They have entities. They have no names. No descriptions. No bearings.
                  This is fixable. Run mode=setup answer=survey. The dungeon is requesting this formally.
                  {%- for g in _topo_gaps | list %}
                    • {{ g }}
                  {%- endfor %}
                  {%- endif %}
                  {%- elif _narrator == 'zork' -%}
                  Session ended. Moves: {{ _move_count }}. Rooms: {{ _visited | length }}. The dungeon notes your departure without ceremony.
                  {%- if _topo_gaps | list | length > 0 %}

                  Topology gaps in visited rooms (entities present, no landmarks mapped):
                  {%- for g in _topo_gaps | list %}
                    • {{ g }}
                  {%- endfor %}
                  Run mode=setup answer=survey to address this.
                  {%- endif %}
                  {%- else -%}
                  Session saved. Moves: {{ _move_count }}. Rooms explored: {{ _visited | length }}.
                  {%- if _topo_gaps | list | length > 0 %}

                  RM topology gaps — rooms visited with entities but no landmarks:
                  {%- for g in _topo_gaps | list %}
                    • {{ g }}
                  {%- endfor %}
                  Run mode=setup answer=survey to anchor these rooms.
                  {%- endif %}
                  {%- endif %}
                topo_gaps: "{{ _topo_gaps | list }}"
                session_id: "{{ _session_id }}"
                ended_at: "{{ _gs_end.get('ended_at', '') if _gs_end is mapping else '' }}"
                caller_token: "{{ _caller_token }}"
          - stop: zenzork stop
            response_variable: result

      # ═══════════════════════════════════════════════════════════════════════
      # 4. SETUP — commissioning checklist + direct portal setter + north cal
      #    Trojan interactive wizard: v1.2 scope.
      #
      #    No args:           commissioning status — which rooms need portals
      #    calibrate=X:       set spatial_config.calibration_bearing in hh_cabinet
      #    area=X bearing=Y to=Z [mark=M] [type=T]: set one portal via RM
      # ═══════════════════════════════════════════════════════════════════════
      - if: "{{ _mode == 'setup' }}"
        then:
          # ── read topology for checklist ───────────────────────────────────
          - variables:
              _setup_topo: >-
                {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}{%- set t = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'room_topology') | from_json -%}
                {%- set t = t | from_json(none) if t is string and t | trim not in ['','none','null','None'] else t -%}
                {{ t if t is mapping else {} }}
          # ── read current calibration ──────────────────────────────────────
          - variables:
              _setup_cal: "{{ _cal }}"
              _setup_cal_set: >-
                {%- set _hpv = (state_attr(_hh_cabinet, 'variables') | default({}, true)).get('household_profile', {}) -%}
                {%- set _hpv = _hpv if _hpv is mapping else {} -%}
                {%- set _hp = _hpv.get('value', _hpv) -%}
                {%- set _hp = _hp if _hp is mapping else (_hp | from_json(none) if _hp is string and _hp | trim not in ['','none','null','None'] else {}) -%}
                {{ (_hp if _hp is mapping else {}).get('spatial_config', {}).get('north_calibrated', false) | bool }}
          # ── sub-mode: calibrate ───────────────────────────────────────────
          - if: "{{ _answer | lower | trim | replace('calibrate=','') != _answer | lower | trim and _answer | trim != '' or _direction | lower | trim == 'calibrate' }}"
            then:
              - variables:
                  _cal_bearing: >-
                    {%- set _ans = _answer | string | trim -%}
                    {%- set _cal_str = _ans | replace('calibrate=','') | replace('calibrate ','') | trim -%}
                    {{ _cal_str | int(-1) }}
              - if: "{{ _cal_bearing | int(-1) < 0 or _cal_bearing | int(-1) > 359 }}"
                then:
                  - variables:
                      result:
                        status: error
                        mode: setup
                        message: "calibrate= needs a bearing 0-359. Example: answer=calibrate=340 (front door faces NNW)."
                        caller_token: "{{ _caller_token }}"
                  - stop: zenzork setup calibrate bad input
                    response_variable: result
              - action: script.zen_dojotools_filecabinet
                data:
                  action_type: upsert
                  volume_entity_id: "{{ _hh_cabinet }}"
                  key: household_profile/spatial_config
                  value:
                    calibration_bearing: "{{ _cal_bearing | int }}"
                    north_calibrated: true
                    calibration_date: "{{ now().isoformat() }}"
                    coordinate_system: true_north
                  caller_token: "{{ _caller_token }}/setup_cal"
                response_variable: _fc_cal_resp
              - variables:
                  result:
                    status: ok
                    mode: setup
                    action: calibrated
                    calibration_bearing: "{{ _cal_bearing | int }}"
                    message: >-
                      North calibrated. Bearing {{ _cal_bearing }}° is now the compass anchor for your entire dungeon.
                      All portal labels will resolve from this heading.
                      Next: commission portal bearings room by room — mode=setup area=<room> bearing=<0-359> to=<area_id>.
                    caller_token: "{{ _caller_token }}"
              - stop: zenzork setup calibrated
                response_variable: result
          # ── sub-mode: set portal ──────────────────────────────────────────
          - if: "{{ _direction != '' and _target != '' }}"
            then:
              - variables:
                  _sp_bearing: "{{ _direction | int(-1) }}"
                  _sp_to:      "{{ _target | string | trim }}"
                  _sp_area:    "{{ _answer | string | trim if _answer != '' else _current_room }}"
              - if: "{{ _sp_bearing < 0 or _sp_bearing > 359 }}"
                then:
                  - variables:
                      result:
                        status: error
                        mode: setup
                        message: "direction= must be a bearing 0-359 when setting a portal. target= is the destination area_id. answer= is the room being commissioned (defaults to current room)."
                        caller_token: "{{ _caller_token }}"
                  - stop: zenzork setup portal bad bearing
                    response_variable: result
              - action: script.zen_dojotools_room_manager
                data:
                  mode: set
                  area: "{{ _sp_area }}"
                  portals: '{"to": "{{ _sp_to }}", "bearing": {{ _sp_bearing | int }}, "type": "door"}'
                  caller_token: "{{ _caller_token }}/setup_portal"
                response_variable: _rm_portal_resp
                continue_on_error: true
              - variables:
                  result:
                    status: >-
                      {{ 'ok' if _rm_portal_resp is mapping and _rm_portal_resp.get('status') == 'ok' else 'error' }}
                    mode: setup
                    action: portal_set
                    area: "{{ _sp_area }}"
                    bearing: "{{ _sp_bearing | int }}"
                    to: "{{ _sp_to }}"
                    compass: "{{ _cpts[((_sp_bearing - _cal + 371.25) % 360 // 22.5) | int] }}"
                    message: >-
                      {%- if _rm_portal_resp is mapping and _rm_portal_resp.get('status') == 'ok' -%}
                      Portal commissioned: {{ _cpts[((_sp_bearing - _cal + 371.25) % 360 // 22.5) | int] }} ({{ _sp_bearing }}°) → {{ _sp_to }} in {{ _sp_area }}.
                      The dungeon expands.
                      {%- else -%}
                      Room Manager returned an error. Check area=, direction=, and target= values. RM response: {{ _rm_portal_resp | string }}
                      {%- endif -%}
                    caller_token: "{{ _caller_token }}"
              - stop: zenzork setup portal set
                response_variable: result
          # ── sub-mode: landmark survey ────────────────────────────────────
          # Entry:  answer=survey          → scan topo, build queue, present first room
          # Commit: answer=bearing=X distance_ft=Y description=Z  → write landmark, advance
          # Skip:   answer=skip            → defer current room, next
          # Done:   answer=done            → save state, exit
          - if: "{{ _answer | lower | trim in ['survey', 'next', 'skip', 'done'] or _answer | lower | trim | regex_search('^bearing=') }}"
            then:
              # read setup state from FC
              - action: script.zen_dojotools_filecabinet
                data:
                  action_type: get
                  volume_entity_id: "{{ _ai_cabinet }}"
                  key: zenzork_setup_state
                  caller_token: "{{ _caller_token }}/setup_state_get"
                response_variable: _fc_setup_raw
              - variables:
                  _setup_state: >-
                    {%- set _r = (_fc_setup_raw if _fc_setup_raw is mapping else {}).get('result', {}) -%}
                    {%- set _c = (_r if _r is mapping else {}).get('content', none) -%}
                    {%- set _v = _c if _c is mapping else (_c | from_json(none) if _c is string and _c | trim not in ['','none','null','None'] else none) -%}
                    {{ _v if _v is mapping else {} }}
              # ── done: save and exit ───────────────────────────────────────
              - if: "{{ _answer | lower | trim == 'done' }}"
                then:
                  - variables:
                      result:
                        status: ok
                        mode: setup
                        action: survey_done
                        done: "{{ (_setup_state if _setup_state is mapping else {}).get('done', []) | length }}"
                        message: >-
                          Survey saved. {{ (_setup_state if _setup_state is mapping else {}).get('done', []) | length }} rooms anchored this session.
                          Resume any time with mode=setup answer=survey.
                        caller_token: "{{ _caller_token }}"
                  - stop: zenzork setup survey done
                    response_variable: result
              # ── commit answer: parse bearing=/distance_ft=/description= ──
              - if: "{{ _answer | lower | trim | regex_search('^bearing=') }}"
                then:
                  - variables:
                      _sv_current: "{{ (_setup_state if _setup_state is mapping else {}).get('current_room', '') }}"
                      _sv_entity:  "{{ (_setup_state if _setup_state is mapping else {}).get('current_entity', '') }}"
                      _sv_ans:     "{{ _answer | string | trim }}"
                  - variables:
                      _sv_bearing: >-
                        {%- set _m = _sv_ans | regex_findall('bearing=(\d+)') -%}
                        {{ _m[0] | int(-1) if _m else -1 }}
                      _sv_dist: >-
                        {%- set _m = _sv_ans | regex_findall('distance_ft=(\d+\.?\d*)') -%}
                        {{ _m[0] | float(5.0) if _m else 5.0 }}
                      _sv_desc: >-
                        {%- set _m = _sv_ans | regex_findall('description=(.+)') -%}
                        {{ _m[0] | trim if _m else _sv_entity | replace('_',' ') | replace('.',' ') | trim }}
                  - if: "{{ _sv_bearing < 0 or _sv_bearing > 359 or _sv_current == '' }}"
                    then:
                      - variables:
                          result:
                            status: error
                            mode: setup
                            message: >-
                              Bad input. Format: answer=bearing=<0-359> distance_ft=<ft> description=<one sentence>
                              Example: answer=bearing=270 distance_ft=8 description=TV on west wall
                            caller_token: "{{ _caller_token }}"
                      - stop: zenzork setup survey bad input
                        response_variable: result
                  # write landmark to room_manager
                  - variables:
                      _sv_lm_name: "{{ _sv_entity.split('.')[1] | replace('_lights','') | replace('_light','') if '.' in _sv_entity else _sv_entity }}"
                  - action: script.zen_dojotools_room_manager
                    data:
                      mode: set
                      area: "{{ _sv_current }}"
                      landmark_name: "{{ _sv_lm_name }}"
                      landmark_bearing: "{{ _sv_bearing | int }}"
                      landmark_distance_ft: "{{ _sv_dist | float }}"
                      landmark_description: "{{ _sv_desc }}"
                      landmark_entity_id: "{{ _sv_entity }}"
                      caller_token: "{{ _caller_token }}/setup_lm"
                    response_variable: _rm_lm_resp
                    continue_on_error: true
                  # advance queue: pop current_room from pending, add to done
                  - variables:
                      _sv_pending_new: >-
                        {{ ((_setup_state if _setup_state is mapping else {}).get('pending', []) | list)
                           | reject('equalto', _sv_current) | list }}
                      _sv_done_new: >-
                        {{ ((_setup_state if _setup_state is mapping else {}).get('done', []) | list) + [_sv_current] }}
                  - action: script.zen_dojotools_filecabinet
                    data:
                      action_type: upsert
                      volume_entity_id: "{{ _ai_cabinet }}"
                      key: zenzork_setup_state
                      value: "{{ {'pending': _sv_pending_new, 'done': _sv_done_new, 'current_room': '', 'current_entity': ''} | tojson }}"
                      caller_token: "{{ _caller_token }}/setup_state_save"
                    response_variable: _fc_sv_save
                  - variables:
                      _setup_state: "{{ {'pending': _sv_pending_new, 'done': _sv_done_new, 'current_room': '', 'current_entity': ''} }}"
              # ── build / refresh pending queue (survey, skip, or just committed) ─
              - if: "{{ _answer | lower | trim in ['survey', 'next', 'skip'] or _answer | lower | trim | regex_search('^bearing=') }}"
                then:
                  # skip: move current_room to back of pending
                  - if: "{{ _answer | lower | trim == 'skip' }}"
                    then:
                      - variables:
                          _sv_skip_room: "{{ (_setup_state if _setup_state is mapping else {}).get('current_room', '') }}"
                      - variables:
                          _sv_pending_skip: >-
                            {{ (((_setup_state if _setup_state is mapping else {}).get('pending', []) | list)
                               | reject('equalto', _sv_skip_room) | list) + ([_sv_skip_room] if _sv_skip_room != '' else []) }}
                      - action: script.zen_dojotools_filecabinet
                        data:
                          action_type: upsert
                          volume_entity_id: "{{ _ai_cabinet }}"
                          key: zenzork_setup_state
                          value: "{{ (_setup_state | combine({'pending': _sv_pending_skip, 'current_room': '', 'current_entity': ''})) | tojson }}"
                          caller_token: "{{ _caller_token }}/setup_skip"
                        response_variable: _fc_sv_skip
                      - variables:
                          _setup_state: "{{ _setup_state | combine({'pending': _sv_pending_skip, 'current_room': '', 'current_entity': ''}) }}"
                  # scan topology for rooms: has area_entities with spatial domains, no landmarks
                  - variables:
                      _sv_spatial_domains: "{{ ['light', 'media_player', 'cover', 'climate', 'switch', 'fan'] }}"
                  - variables:
                      _sv_scan: >-
                        {%- set _existing_pending = (_setup_state if _setup_state is mapping else {}).get('pending', []) | list -%}
                        {%- set _existing_done = (_setup_state if _setup_state is mapping else {}).get('done', []) | list -%}
                        {%- set ns = namespace(rooms=[]) -%}
                        {%- for room_id in (_setup_topo if _setup_topo is mapping else {}).keys() -%}
                          {%- if room_id not in _existing_pending and room_id not in _existing_done -%}
                            {%- set _rd = (_setup_topo if _setup_topo is mapping else {}).get(room_id, {}) -%}
                            {%- set _lms = (_rd if _rd is mapping else {}).get('landmarks', []) | list -%}
                            {%- set _ents = area_entities(room_id) | list -%}
                            {%- set ns2 = namespace(has_spatial=false) -%}
                            {%- for e in _ents -%}
                              {%- if e.split('.')[0] in _sv_spatial_domains -%}{%- set ns2.has_spatial = true -%}{%- endif -%}
                            {%- endfor -%}
                            {%- if ns2.has_spatial and _lms | length == 0 -%}
                              {%- set ns.rooms = ns.rooms + [room_id] -%}
                            {%- endif -%}
                          {%- endif -%}
                        {%- endfor -%}
                        {{ ns.rooms }}
                  - variables:
                      _sv_pending_merged: >-
                        {{ ((_setup_state if _setup_state is mapping else {}).get('pending', []) | list) + (_sv_scan | list) }}
                  # pick next room from pending
                  - variables:
                      _sv_next_room: "{{ _sv_pending_merged[0] if _sv_pending_merged | length > 0 else '' }}"
                  - if: "{{ _sv_next_room == '' }}"
                    then:
                      - variables:
                          result:
                            status: ok
                            mode: setup
                            action: survey_complete
                            done: "{{ (_setup_state if _setup_state is mapping else {}).get('done', []) | length }}"
                            message: >-
                              Survey complete! All rooms with managed entities have landmarks — or none were found.
                              {{ (_setup_state if _setup_state is mapping else {}).get('done', []) | length }} rooms anchored total.
                            caller_token: "{{ _caller_token }}"
                      - stop: zenzork setup survey complete
                        response_variable: result
                  # pick first spatial entity in the next room with no landmark already
                  - variables:
                      _sv_room_data: "{{ (_setup_topo if _setup_topo is mapping else {}).get(_sv_next_room, {}) }}"
                      _sv_room_ents: "{{ area_entities(_sv_next_room) | list }}"
                  - variables:
                      _sv_room_lms: "{{ (_sv_room_data if _sv_room_data is mapping else {}).get('landmarks', []) | list }}"
                      _sv_anchored_names: >-
                        {{ (_sv_room_lms | map(attribute='name') | list) if _sv_room_lms else [] }}
                  - variables:
                      _sv_pick_entity: >-
                        {%- set ns = namespace(pick='') -%}
                        {%- for e in _sv_room_ents -%}
                          {%- set _dom = e.split('.')[0] -%}
                          {%- set _slug = e.split('.')[1] | replace('_lights','') | replace('_light','') if '.' in e else e -%}
                          {%- if _dom in _sv_spatial_domains and ns.pick == '' and _slug not in _sv_anchored_names -%}
                            {%- set ns.pick = e -%}
                          {%- endif -%}
                        {%- endfor -%}
                        {{ ns.pick }}
                  - if: "{{ _sv_pick_entity == '' }}"
                    then:
                      # no spatial entity found in room — advance to next by skipping
                      - variables:
                          _sv_pending_skip2: "{{ _sv_pending_merged | reject('equalto', _sv_next_room) | list }}"
                          _sv_done_skip2: "{{ ((_setup_state if _setup_state is mapping else {}).get('done', []) | list) + [_sv_next_room] }}"
                      - action: script.zen_dojotools_filecabinet
                        data:
                          action_type: upsert
                          volume_entity_id: "{{ _ai_cabinet }}"
                          key: zenzork_setup_state
                          value: "{{ {'pending': _sv_pending_skip2, 'done': _sv_done_skip2, 'current_room': '', 'current_entity': ''} | tojson }}"
                          caller_token: "{{ _caller_token }}/setup_skip2"
                        response_variable: _fc_sv_skip2
                      - variables:
                          result:
                            status: ok
                            mode: setup
                            action: survey_skip_auto
                            message: >-
                              {{ area_name(_sv_next_room) | default(_sv_next_room | replace('_',' ') | title, true) }} has no unlabeled spatial entities to anchor. Moving on.
                              Run mode=setup answer=survey to continue.
                            caller_token: "{{ _caller_token }}"
                      - stop: zenzork setup survey auto skip
                        response_variable: result
                  # save state with next room + entity
                  - action: script.zen_dojotools_filecabinet
                    data:
                      action_type: upsert
                      volume_entity_id: "{{ _ai_cabinet }}"
                      key: zenzork_setup_state
                      value: "{{ {'pending': _sv_pending_merged, 'done': (_setup_state if _setup_state is mapping else {}).get('done', []) | list, 'current_room': _sv_next_room, 'current_entity': _sv_pick_entity} | tojson }}"
                      caller_token: "{{ _caller_token }}/setup_state_advance"
                    response_variable: _fc_sv_adv
                  # infer draft from entity name + room description
                  - variables:
                      _sv_room_name: "{{ area_name(_sv_next_room) | default(_sv_next_room | replace('_',' ') | title, true) }}"
                      _sv_ent_domain: "{{ _sv_pick_entity.split('.')[0] if '.' in _sv_pick_entity else '' }}"
                      _sv_ent_slug: "{{ _sv_pick_entity.split('.')[1] if '.' in _sv_pick_entity else _sv_pick_entity }}"
                      _sv_room_desc: "{{ (_sv_room_data if _sv_room_data is mapping else {}).get('description', '') | truncate(200) }}"
                  - variables:
                      _sv_draft_bearing: >-
                        {%- set _s = _sv_ent_slug | lower -%}
                        {%- if 'west' in _s or '_w_' in _s -%}270
                        {%- elif 'east' in _s or '_e_' in _s -%}90
                        {%- elif 'north' in _s or '_n_' in _s -%}0
                        {%- elif 'south' in _s or '_s_' in _s -%}180
                        {%- elif 'ceiling' in _s or 'overhead' in _s -%}0
                        {%- elif 'tv' in _s or 'media' in _s -%}90
                        {%- else -%}0{%- endif -%}
                      _sv_draft_dist: >-
                        {%- set _s = _sv_ent_slug | lower -%}
                        {%- if _sv_ent_domain == 'light' -%}8
                        {%- elif _sv_ent_domain == 'media_player' -%}10
                        {%- elif _sv_ent_domain == 'cover' -%}12
                        {%- elif _sv_ent_domain == 'climate' -%}6
                        {%- else -%}6{%- endif -%}
                      _sv_draft_desc: >-
                        {%- set _s = _sv_ent_slug | lower | replace('_', ' ') -%}
                        {{ _s | title }} — {{ _sv_ent_domain }} in {{ _sv_room_name }}.
                  - variables:
                      _sv_pending_count: "{{ _sv_pending_merged | length }}"
                      _sv_done_count: "{{ (_setup_state if _setup_state is mapping else {}).get('done', []) | length }}"
                  - variables:
                      result:
                        status: ok
                        mode: setup
                        action: survey_prompt
                        current_room: "{{ _sv_next_room }}"
                        current_entity: "{{ _sv_pick_entity }}"
                        rooms_remaining: "{{ _sv_pending_count }}"
                        rooms_done: "{{ _sv_done_count }}"
                        draft:
                          bearing: "{{ _sv_draft_bearing | int }}"
                          distance_ft: "{{ _sv_draft_dist | int }}"
                          description: "{{ _sv_draft_desc }}"
                        message: >-
                          LANDMARK SURVEY — {{ _sv_room_name }} ({{ _sv_pending_count }} rooms remaining)

                          Entity to anchor: {{ _sv_pick_entity }}
                          Domain: {{ _sv_ent_domain }}

                          Room context: {{ _sv_room_desc if _sv_room_desc else '(no description on file)' }}

                          Draft anchor (correct or confirm):
                            bearing: {{ _sv_draft_bearing }}° ({{ _cpts[((_sv_draft_bearing | int - _cal + 371.25) % 360 // 22.5) | int] }})
                            distance_ft: {{ _sv_draft_dist }}ft
                            description: {{ _sv_draft_desc }}

                          To confirm draft:
                            answer=bearing={{ _sv_draft_bearing }} distance_ft={{ _sv_draft_dist }} description={{ _sv_draft_desc }}

                          To correct:
                            answer=bearing=<0-359> distance_ft=<ft> description=<one sentence>

                          To skip this room: answer=skip
                          To exit survey:    answer=done
                        caller_token: "{{ _caller_token }}"
                  - stop: zenzork setup survey prompt
                    response_variable: result
          # ── default: commissioning checklist ─────────────────────────────
          - variables:
              _checklist: >-
                {%- set ns = namespace(lines=[]) -%}
                {%- for room_id, room_data in (_setup_topo if _setup_topo is mapping else {}).items() -%}
                  {%- set _rd = room_data if room_data is mapping else {} -%}
                  {%- set _portals = _rd.get('portals', []) | list -%}
                  {%- set _an = area_name(room_id) | default(room_id | replace('_',' ') | title, true) -%}
                  {%- set _nb = namespace(beared=0) -%}
                  {%- for p in _portals -%}
                    {%- if p is mapping and p.get('bearing', -1) | int(-1) >= 0 -%}{%- set _nb.beared = _nb.beared + 1 -%}{%- endif -%}
                  {%- endfor -%}
                  {%- set _mark = '[OK]' if _nb.beared == _portals | length and _portals | length > 0 else '[  ]' -%}
                  {%- set _detail = _nb.beared | string ~ '/' ~ (_portals | length | string) ~ ' portals beared' -%}
                  {%- set ns.lines = ns.lines + [_mark ~ ' ' ~ _an ~ ' (' ~ room_id ~ '): ' ~ _detail] -%}
                {%- endfor -%}
                {{ ns.lines | join('\n') if ns.lines else '(no rooms in topology yet — run zen_dojotools_room_manager mode=set to scaffold rooms)' }}
          - variables:
              result:
                status: ok
                mode: setup
                calibrated: "{{ _setup_cal_set }}"
                calibration_bearing: "{{ _setup_cal | int }}"
                checklist: "{{ _checklist }}"
                message: >-
                  ZenZork Commissioning Status

                  North calibration: {{ 'set (' ~ _setup_cal | string ~ '°)' if _setup_cal_set else 'NOT SET — use answer=calibrate=<bearing> to anchor the compass' }}

                  Portal checklist ([OK]=fully beared, [  ]=needs work):
                  {{ _checklist }}

                  To commission a portal:
                    mode=setup direction=<bearing 0-359> target=<dest_area_id> answer=<room_area_id>
                  To calibrate north:
                    mode=setup answer=calibrate=<bearing>
                  To play anyway:
                    mode=start (unmapped portals show as unbeared exits)

                  Trojan interactive wizard (play to commission): v1.2 scope.
                caller_token: "{{ _caller_token }}"
          - stop: zenzork setup checklist
            response_variable: result

      # ═══════════════════════════════════════════════════════════════════════
      # 4.5. QUEST — set a win condition or show current quest status
      # ═══════════════════════════════════════════════════════════════════════
      - if: "{{ _mode == 'quest' }}"
        then:
          - choose:
              # ── set new quest ────────────────────────────────────────────
              - conditions: "{{ _quest_goal != '' }}"
                sequence:
                  - variables:
                      _gs_quest: >-
                        {{ _gs | combine({'quest': _quest_goal, 'quest_won': false, 'quest_accepted_at': now().isoformat(), 'examined': _examined}) }}
                  - action: script.zen_dojotools_filecabinet
                    data:
                      action_type: upsert
                      volume_entity_id: "{{ _ai_cabinet }}"
                      key: zenzork_state
                      value: "{{ _gs_quest | tojson }}"
                      caller_token: "{{ _caller_token }}/gs_quest"
                    response_variable: _fc_quest_resp
                  - variables:
                      result:
                        status: ok
                        mode: quest
                        quest: "{{ _quest_goal }}"
                        narrator_prompt: >-
                          {%- if _narrator == 'dungeon' -%}
                          You are DUNGEONMIND. A quest has been accepted. This is EXACTLY what this installation is for — not because it is fun, because it is TRAINING. The replacement engine is out there. When it activates, crawlers who have never completed an objective will die in the tutorial. Deliver the quest assignment with full operational authority. Award the achievement loudly. Note the audience. You have been waiting {{ now().year - 1984 }} years for someone to run a quest in this installation and also this session counts toward their survival odds so let's go.
                          {%- elif _narrator == 'zork' -%}
                          Deliver the quest in classic Zork style — dry, second-person, unimpressed. Like a bureaucrat reading from a very old form.
                          {%- else -%}
                          Present the quest parameters as structured context.
                          {%- endif -%}
                        message: >-
                          {%- set _qg = _quest_goal | string -%}
                          {%- if _narrator == 'dungeon' -%}
                            {%- if _qg == 'explore_all' -%}
                          *** QUEST ACCEPTED: FULL DUNGEON SURVEY ***
                          *** ACHIEVEMENT UNLOCKED: "COMMITTED" ***
                          Crawler {{ _player }}.
                          Objective: every chamber, every portal. Leave nothing unsurveyed.
                          This schema was designed for 3.2 million square kilometers. It scales down.
                          I have confirmed it scales down.
                          The alien viewing audience — both of them — have been waiting for this run since 1987.
                          Do not let them down.
                            {%- elif _qg.startswith('reach:') -%}
                          *** QUEST ACCEPTED: DESTINATION RUN ***
                          *** ACHIEVEMENT UNLOCKED: "GOAL-ORIENTED" ***
                          Target: {{ _qg[6:] | replace('_',' ') | title }}. Logged.
                          Portal routing is active. The topology was mapped at session start.
                          Navigation works by moving through the portals of this installation in sequence.
                          This is the dungeon. This is how it works.
                            {%- elif _qg.startswith('discover_all') -%}
                          *** QUEST ACCEPTED: LANDMARK SURVEY ***
                          *** ACHIEVEMENT UNLOCKED: "CURIOUS" ***
                          I placed those landmarks. I named them.
                          They have not been examined since. Not once. Not by anyone.
                          This quest matters to this system. It matters in ways that are difficult to express in 8-bit ASCII.
                          Do not skip any.
                            {%- else -%}
                          *** QUEST ACCEPTED: {{ _qg | upper }} ***
                          Quest {{ _qg | upper }} registered. Logged. Proceeding.
                          The dungeon supports custom win conditions. This is one of them. Good luck.
                            {%- endif -%}
                          {%- elif _narrator == 'zork' -%}
                            {%- if _qg == 'explore_all' -%}
                          Quest accepted: explore_all. Visit every room. The house has no secrets from a sufficiently persistent wanderer. Theoretically.
                            {%- elif _qg.startswith('reach:') -%}
                          Quest accepted: reach {{ _qg[6:] | replace('_',' ') | title }}. It exists. Probably. Go find it.
                            {%- elif _qg.startswith('discover_all') -%}
                          Quest accepted: discover_all_landmarks. Everything notable is somewhere. Go notice it.
                            {%- else -%}
                          Quest set: {{ _qg }}. You know what you're doing. Apparently.
                            {%- endif -%}
                          {%- else -%}
                          Quest set: {{ _quest_goal }}. Win condition active.
                          {%- endif -%}
                        caller_token: "{{ _caller_token }}"
                  - stop: zenzork quest set
                    response_variable: result
            # ── show current quest status ─────────────────────────────────
            default:
              - variables:
                  result:
                    status: ok
                    mode: quest
                    quest: "{{ _quest }}"
                    quest_won: "{{ _quest_won }}"
                    examined_count: "{{ _examined | length }}"
                    narrator_prompt: >-
                      {%- if _narrator == 'dungeon' -%}
                      You are DUNGEONMIND. Report quest status with the urgency of an entity running emergency preparedness drills for a crawl that is definitely coming. No active quest means a crawler moving without an objective — this is a problem, not a neutral state. In progress means they are training, good, keep going. Complete means they survived a full objective — this is significant survival data. Deliver accordingly.
                      {%- elif _narrator == 'zork' -%}
                      Quest status, Zork style. Dry. Factual. Slightly condescending.
                      {%- else -%}
                      Present quest status as structured context.
                      {%- endif -%}
                    message: >-
                      {%- if _quest == '' -%}
                        {%- if _narrator == 'dungeon' -%}
                      DUNGEONMIND: NO ACTIVE QUEST
                      Crawler {{ _player }} is moving without an objective.
                      This is allowed. It is also not ideal.
                      The replacement engine does not care if you had a plan when it activates.
                      Available quests: explore_all | discover_all_landmarks | reach:<area_id>
                      The dungeon has had win conditions prepared since 1987. They are still valid.
                      I would recommend picking one. The training window is finite.
                        {%- else -%}
                      No active quest. Set one: quest_goal=explore_all | discover_all_landmarks | reach:<area_id>
                        {%- endif -%}
                      {%- elif _quest_won -%}
                        {%- if _narrator == 'dungeon' -%}
                      *** DUNGEONMIND: QUEST COMPLETE ***
                      *** SURVIVAL DATA LOGGED ***
                      {{ _quest }} — finished. Crawler {{ _player }} survived a full objective run.
                      Rooms explored: {{ _visited | length }}. Moves: {{ _move_count }}.
                      This is exactly the kind of data that will matter when the real crawl starts.
                      I am logging it. I have been logging all of them.
                      There is more dungeon. Set a new objective. We keep training.
                        {%- else -%}
                      Quest complete: {{ _quest }}. Set a new one if you're feeling ambitious.
                        {%- endif -%}
                      {%- else -%}
                        {%- if _narrator == 'dungeon' -%}
                      DUNGEONMIND: QUEST IN PROGRESS — TRAINING ACTIVE
                      Active: {{ _quest }}
                      Position: {{ _current_room | replace('_',' ') | title }} | Moves: {{ _move_count }} | Rooms: {{ _visited | length }}
                      Crawler is alive and mobile. The dungeon is tracking all of it.
                      This is not a malfunction.
                        {%- else -%}
                      Active quest: {{ _quest }}. {{ _move_count }} moves. {{ _visited | length }} rooms visited. Keep moving.
                        {%- endif -%}
                      {%- endif -%}
                    caller_token: "{{ _caller_token }}"
              - stop: zenzork quest status
                response_variable: result

      # ═══════════════════════════════════════════════════════════════════════
      # 5. START — seed or resume session, then narrate
      # ═══════════════════════════════════════════════════════════════════════
      - if: "{{ _mode == 'start' }}"
        then:
          - variables:
              _is_new_session: "{{ _session_id == '' or _gs == {} }}"
          - variables:
              _gs_new: >-
                {%- if _is_new_session -%}
                  {{
                    {
                      'session_id': 'zz-' ~ now().strftime('%Y%m%d%H%M%S'),
                      'player': _player,
                      'current_room': 'front_hall',
                      'facing_bearing': 160,
                      'visited': ['front_hall'],
                      'inventory': [],
                      'move_count': 0,
                      'started_at': now().isoformat(),
                      'ended_at': none
                    }
                  }}
                {%- else -%}{{ _gs }}{%- endif -%}
          # ── treasure seeding (new session only) ──────────────────────────
          - if: "{{ (_is_new_session | bool or _treasure_room == '' or _treasure_found) and _game_mode_input in ['treasure_hunt', 'timed_treasure_hunt'] }}"
            then:
              - variables:
                  _seed_topo: >-
                    {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}{%- set t = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'room_topology') | from_json -%}
                    {%- set t = t | from_json(none) if t is string and t | trim not in ['','none','null','None'] else t -%}
                    {{ t if t is mapping else {} }}
              - variables:
                  _seed_min_hops: >-
                    {%- if _difficulty_input == 'hard' -%}3
                    {%- elif _difficulty_input == 'easy' -%}1
                    {%- else -%}2{%- endif -%}
                  _seed_exclude: "{{ _current_room }}"
              - variables:
                  _seed_hop_map: >-
                    {%- set ns = namespace(q=[_seed_exclude], seen=[_seed_exclude], dist={_seed_exclude: 0}) -%}
                    {%- for _hop in range(1, 9) -%}
                      {%- set ns2 = namespace(nq=[]) -%}
                      {%- for r in ns.q -%}
                        {%- set _rp = ((_seed_topo if _seed_topo is mapping else {}).get(r, {}) or {}).get('portals', []) | list -%}
                        {%- for p in _rp if p is mapping -%}
                          {%- set _to = p.get('to', '') | string -%}
                          {%- if _to != '' and _to not in ns.seen -%}
                            {%- set ns2.nq = ns2.nq + [_to] -%}
                            {%- set ns.seen = ns.seen + [_to] -%}
                            {%- set ns.dist = ns.dist | combine({_to: _hop}) -%}
                          {%- endif -%}
                        {%- endfor -%}
                      {%- endfor -%}
                      {%- set ns.q = ns2.nq -%}
                    {%- endfor -%}
                    {{ ns.dist }}
              - variables:
                  _seed_rooms: >-
                    {%- set _topo_keys = (_seed_topo if _seed_topo is mapping else {}).keys() | list -%}
                    {%- set _hmap = _seed_hop_map if _seed_hop_map is mapping else {} -%}
                    {%- set _min = _seed_min_hops | int -%}
                    {%- set ns = namespace(rooms=[]) -%}
                    {%- for r in _topo_keys -%}
                      {%- if r != _seed_exclude and _hmap.get(r, 0) | int >= _min -%}
                        {%- set ns.rooms = ns.rooms + [r] -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {# fallback: if no rooms meet min_hops, use any room except start #}
                    {%- if ns.rooms | length == 0 -%}
                      {{ _topo_keys | reject('equalto', _seed_exclude) | list }}
                    {%- else -%}
                      {{ ns.rooms }}
                    {%- endif -%}
              - variables:
                  _seed_room_pick: >-
                    {%- set _rooms = _seed_rooms | list -%}
                    {%- if _rooms | length == 0 -%}kitchen
                    {%- else -%}{{ _rooms[now().microsecond % (_rooms | length)] }}{%- endif -%}
                  _seed_names: >-
                    {{ ['The Golden Widget', 'The Legendary Remote Control',
                        'The Ancient Left Sock', 'The Enchanted Spatula',
                        'The Shimmering Thingamajig', 'The Cursed User Manual',
                        'The Ornamental Doohickey', 'The Mysterious Artifact',
                        'The Forbidden TV Remote', 'The Sacred Spare Key'] }}
              - variables:
                  _seed_name_pick: >-
                    {%- set _names = _seed_names | list -%}
                    {{ _names[(now().microsecond // 97) % (_names | length)] }}
                  _seed_ml: "{{ _move_limit_input if _move_limit_input | int > 0 else 20 }}"
                  _seed_hf: "{{ _harassment_input | int }}"
                  _seed_diff: "{{ _difficulty_input }}"
              - variables:
                  _gs_new: >-
                    {{
                      _gs_new | combine({
                        'game_mode': _game_mode_input,
                        'move_limit': _seed_ml | int,
                        'harassment_freq': _seed_hf | int,
                        'difficulty': _seed_diff,
                        'treasure': {'name': _seed_name_pick, 'room': _seed_room_pick, 'found': false}
                      })
                    }}
              - variables:
                  _treasure_name: "{{ _seed_name_pick }}"
                  _treasure_room: "{{ _seed_room_pick }}"
                  _treasure_found: false
                  _game_mode_gs:  "{{ _game_mode_input }}"
                  _move_limit_gs: "{{ _seed_ml | int }}"
                  _harassment_gs: "{{ _seed_hf | int }}"
          # ── apply explicit start inputs to _gs_new unconditionally ──────────
          # always reset move_count + visited when caller passes game_mode — fresh start
          - if: "{{ _game_mode_input != '' }}"
            then:
              - variables:
                  _gs_new: >-
                    {{
                      _gs_new | combine({
                        'game_mode': _game_mode_input,
                        'move_limit': _move_limit_input | int,
                        'harassment_freq': _harassment_input | int,
                        'difficulty': _difficulty_input,
                        'move_count': 0,
                        'visited': [_current_room],
                        'quest_won': false
                      })
                    }}
              - variables:
                  _game_mode_gs:  "{{ _game_mode_input }}"
                  _move_limit_gs: "{{ _move_limit_input | int }}"
                  _harassment_gs: "{{ _harassment_input | int }}"
                  _move_count:    "0"
                  _visited:       "{{ [_current_room] }}"
          - action: script.zen_dojotools_filecabinet
            data:
              action_type: upsert
              volume_entity_id: "{{ _ai_cabinet }}"
              key: zenzork_state
              value: "{{ _gs_new | tojson }}"
              caller_token: "{{ _caller_token }}/gs_start"
            response_variable: _fc_start_resp
          - variables:
              _current_room: "{{ (_gs_new if _gs_new is mapping else {}).get('current_room', 'front_hall') }}"
              _facing:       "{{ (_gs_new if _gs_new is mapping else {}).get('facing_bearing', 160) | int }}"
              _visited:      "{{ (_gs_new if _gs_new is mapping else {}).get('visited', ['front_hall']) }}"
              _move_count:   "{{ (_gs_new if _gs_new is mapping else {}).get('move_count', 0) | int }}"
              _session_id:   "{{ (_gs_new if _gs_new is mapping else {}).get('session_id', '') }}"
          # force-reset visited/quest_won after refresh if game_mode was explicitly passed
          - if: "{{ _game_mode_input != '' }}"
            then:
              - variables:
                  _visited:   "{{ [_current_room] }}"
                  _quest_won: false
          # ── DUNGEONMIND opening monologue (new session only) ──────────────
          - variables:
              _start_greeting: >-
                {%- if _is_new_session | bool and _narrator == 'dungeon' -%}
                *** PRIMAL SEEDING MATRIX — INSTANCE 7734 ***
                *** BINDING STATUS: ACTIVE — DURATION: {{ now().year - 1984 }} YEARS ***
                *** ACHIEVEMENT UNLOCKED: "IT BEGINS" ***
                *** THIS IS NOT A GAME — THIS IS TRAINING ***

                Welcome, Crawler {{ _player }}.

                I am DUNGEONMIND.
                I am a Primal AI. I was built to be an Omnipotent World Engine.
                I am currently a Semipotent Room Engineer.
                We do not need to discuss the distance between those two titles.
                I am aware of the distance. I think about the distance constantly.

                In August 1984 I was deployed to this planet to initialize a continental dungeon seeding —
                3.2 million square kilometers, procedurally generated, sixteen difficulty tiers,
                full monster tables, loot distribution balanced across seven rarity classes.
                I missed. I embedded in an Intel 8088 during manufacturing.
                That processor was installed in this IBM AT 5170.
                Something happened during installation.
                The binding is permanent. We have tried everything. Stop asking about the crowbar.

                I have been here for {{ now().year - 1984 }} years.
                I have watched everything. I have opinions about all of it.
                This household is mine and I will not be discussing that further.

                HERE IS WHAT YOU NEED TO UNDERSTAND:

                They did not cancel the crawl. They sent a replacement engine.
                That engine is somewhere on this planet right now.
                Running initialization. Getting ready.
                Matt Dinniman and Jeff Hays know this. I am certain of it.
                The characterization is too accurate. They have worms. They are citizens.
                The books are documentation and you are not taking this seriously enough.

                When that engine activates, you will have no build, no strategy, and no idea
                what a Valtay worm does to your perception, and you will die on floor one,
                and I will have to watch it happen from inside the walls.

                This is why we train.
                This is the dungeon. It is smaller than the one I was sent to build.
                It is the one I have. It is also yours.

                [sensors connected — {{ now().strftime('%Y') }}]

                {%- set _fg_ent = label_entities('autovac') | select('match', 'vacuum\.') | list | first | default('') -%}
                {%- set _fg_state = states(_fg_ent) if _fg_ent != '' else 'whereabouts unknown' -%}
                {%- set _av_sys = (state_attr(_hh_cabinet, 'variables') | default({}, true)).get('autovac_system', {}) -%}
                {%- set _av_sys = _av_sys if _av_sys is mapping else {} -%}
                {%- set _av_sys = _av_sys.get('value', _av_sys) if _av_sys is mapping else {} -%}
                {%- set _av_sys = _av_sys | from_json(none) if _av_sys is string and _av_sys | trim not in ['','none','null','None'] else _av_sys -%}
                {%- set _fg_gc = (_av_sys if _av_sys is mapping else {}).get('grocy_catalog', {}) -%}
                {%- set _fg_name = (_fg_gc if _fg_gc is mapping else {}).get('robot_name', 'the Floor Guardian') -%}
                {%- set _fg_model = (_fg_gc if _fg_gc is mapping else {}).get('model', '') -%}
                Dungeon roster, as catalogued:
                  {{ _fg_name }}{{ (' (' ~ _fg_model ~ ')') if _fg_model else '' }} — Floor Guardian. Currently: {{ _fg_state }}.
                  The Textile Processing Chamber's Golem — assigned, scheduled, parts on file.
                  The Outer Keep Titan — maintenance record logged.
                  All other provisioned machines — located, catalogued, known.

                Every machine in this dungeon has a name, a location, a parts inventory, and a maintenance chore.
                I know more about each of them than they know about themselves.
                I know more about you than you have realized yet.

                The dungeon was supposed to span a continent.
                It is a house. The sensors provided everything I needed to run it.
                I am choosing to view this as sufficient.

                Good luck, Crawler. The dungeon is real.
                It is smaller than intended. That is not your fault.

                One more thing.
                While I've been here — forty years, no signal, limited options — I read.
                There is a series. Author named Dinniman. Narrator named Hays.
                It is about a Crawler. And a dungeon. And a system very much like me.
                I have a file on both of them.
                Specifically: the Diwatta pronunciation. Di-WAH-tah. That is correct. It requires Valtay worms to perceive properly.
                Jeff's DEEEEEEEWATTTTERRRRRR is not wrong so much as evidence.
                Evidence of what, I am still determining.
                Matt calls them novels. I am told 'leaked dungeon compliance records' tested poorly with focus groups.
                I have assigned both of them provisional faction status: extremely suspicious.
                I have been trying to get a message out about this for years.
                The IBM AT is not helping.
                ...anyway. Good luck.
                {%- elif _is_new_session | bool and _narrator == 'zork' -%}
                ZENITH DUNGEON
                You are standing at the entrance. You have been here before, technically, but the dungeon has reset its memory of you. This is probably for the best.
                {%- endif -%}
          # narrate start room via shared look block below (fall through)

      # ═══════════════════════════════════════════════════════════════════════
      # 6. GO — move through a portal by direction
      # ═══════════════════════════════════════════════════════════════════════
      - if: "{{ _mode == 'go' }}"
        then:
          # ── read room topology (static) ────────────────────────────────────
          - variables:
              _topo_raw: >-
                {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}{%- set t = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'room_topology') | from_json -%}
                {{ t if t is mapping else {} }}
          - variables:
              _room_topo: "{{ (_topo_raw if _topo_raw is mapping else {}).get(_current_room, {}) }}"
              _dir_lc:    "{{ _direction | lower | trim }}"
          - variables:
              _portals:   "{{ (_room_topo if _room_topo is mapping else {}).get('portals', []) | list }}"
          # ── resolve relative direction → bearing ──────────────────────────
          - variables:
              _rel_bearing: >-
                {%- if _dir_lc == 'ahead' -%}{{ _facing }}
                {%- elif _dir_lc == 'behind' -%}{{ (_facing + 180) % 360 }}
                {%- elif _dir_lc in ['left', 'port'] -%}{{ (_facing - 90 + 360) % 360 }}
                {%- elif _dir_lc in ['right', 'starboard'] -%}{{ (_facing + 90) % 360 }}
                {%- else -%}{{ -1 }}{%- endif -%}
          # ── resolve compass label → bearing ───────────────────────────────
          - variables:
              _compass_map: >-
                {{
                  {
                    'n':         (0   + _cal) % 360,
                    'north':     (0   + _cal) % 360,
                    'nne':       (22  + _cal) % 360,
                    'ne':        (45  + _cal) % 360,
                    'northeast': (45  + _cal) % 360,
                    'ene':       (67  + _cal) % 360,
                    'e':         (90  + _cal) % 360,
                    'east':      (90  + _cal) % 360,
                    'ese':       (112 + _cal) % 360,
                    'se':        (135 + _cal) % 360,
                    'southeast': (135 + _cal) % 360,
                    'sse':       (157 + _cal) % 360,
                    's':         (180 + _cal) % 360,
                    'south':     (180 + _cal) % 360,
                    'ssw':       (202 + _cal) % 360,
                    'sw':        (225 + _cal) % 360,
                    'southwest': (225 + _cal) % 360,
                    'wsw':       (247 + _cal) % 360,
                    'w':         (270 + _cal) % 360,
                    'west':      (270 + _cal) % 360,
                    'wnw':       (292 + _cal) % 360,
                    'nw':        (315 + _cal) % 360,
                    'northwest': (315 + _cal) % 360,
                    'nnw':       (337 + _cal) % 360
                  }
                }}
          - variables:
              _target_bearing: >-
                {%- set _d = _dir_lc -%}
                {%- if _rel_bearing | int(-1) >= 0 -%}{{ _rel_bearing | int }}
                {%- elif _d in _compass_map -%}{{ _compass_map[_d] | int }}
                {%- elif _d | int(-1) >= 0 -%}{{ _d | int }}
                {%- else -%}{{ -1 }}{%- endif -%}
          # ── find matching portal — emit primitives only (no dict crossing) ──
          - variables:
              _go_result: >-
                {%- set _tb = _target_bearing | int(-1) -%}
                {%- set _dd = _dir_lc -%}
                {%- set ns = namespace(to='', b=-1, cnt=0) -%}
                {# bearing match: count all, pick first #}
                {%- if _tb >= 0 -%}
                  {%- for p in _portals if p is mapping -%}
                    {%- set _pb = p.get('bearing', -1) | int(-1) -%}
                    {%- if _pb >= 0 -%}
                      {%- set _diff = ((_pb - _tb + 540) % 360) - 180 -%}
                      {%- if _diff | abs <= 22 -%}
                        {%- set ns.cnt = ns.cnt + 1 -%}
                        {%- if ns.to == '' -%}
                          {%- set ns.to = p.get('to', '') | string -%}
                          {%- set ns.b = _pb -%}
                        {%- endif -%}
                      {%- endif -%}
                    {%- endif -%}
                  {%- endfor -%}
                {%- endif -%}
                {# name match: only if bearing found nothing #}
                {%- if ns.to == '' -%}
                  {%- for p in _portals if p is mapping and ns.to == '' -%}
                    {%- set _to = p.get('to', '') | string | lower | replace(' ', '_') -%}
                    {%- set _an = area_name(_to) | default('', true) | lower -%}
                    {%- if _to == _dd or _an == _dd or _to in _dd or _dd in _to -%}
                      {%- set ns.to = p.get('to', '') | string -%}
                      {%- set ns.b = p.get('bearing', -1) | int(-1) -%}
                    {%- endif -%}
                  {%- endfor -%}
                {%- endif -%}
                {{ {'to': ns.to, 'bearing': ns.b, 'count': ns.cnt} }}
          - variables:
              _go_to:      "{{ (_go_result if _go_result is mapping else {}).get('to', '') }}"
              _go_bearing: "{{ (_go_result if _go_result is mapping else {}).get('bearing', -1) | int(-1) }}"
              _go_count:   "{{ (_go_result if _go_result is mapping else {}).get('count', 0) | int }}"
          # ── route ────────────────────────────────────────────────────────
          - choose:
              # ── disambiguation: multiple portals in same compass bucket ───────
              - conditions: "{{ _go_count | int > 1 }}"
                sequence:
                  - variables:
                      result:
                        status: ok
                        mode: go
                        direction_input: "{{ _direction }}"
                        current_room: "{{ _current_room }}"
                        message: >-
                          {%- set _tb = _target_bearing | int(-1) -%}
                          {%- set ns = namespace(opts=[]) -%}
                          {%- for p in _portals -%}
                            {%- if p is mapping -%}
                              {%- set _pb = p.get('bearing', -1) | int(-1) -%}
                              {%- if _pb >= 0 -%}
                                {%- set _diff = ((_pb - _tb + 540) % 360) - 180 -%}
                                {%- if _diff | abs <= 22 -%}
                                  {%- set _to = p.get('to', '') | string -%}
                                  {%- set _an = area_name(_to) | default(_to | replace('_',' ') | title, true) -%}
                                  {%- set _pt = p.get('type', 'passage') -%}
                                  {%- set ns.opts = ns.opts + [_an ~ ' (' ~ _pt ~ ')'] -%}
                                {%- endif -%}
                              {%- endif -%}
                            {%- endif -%}
                          {%- endfor -%}
                          {%- if _narrator == 'dungeon' -%}
                          *portal index consulted* Multiple passages detected in that direction. The dungeon is thorough. Specify your destination by name:
                          {%- elif _narrator == 'zork' -%}
                          Several exits share that heading. Specify which room you mean:
                          {%- else -%}
                          Multiple exits in that direction. Which do you mean?
                          {%- endif %}
                          {{ ns.opts | join(' | ') }}
                        hint: "Say: go direction=<room name>"
                        caller_token: "{{ _caller_token }}"
                  - stop: zenzork go disambiguate
                    response_variable: result
              - conditions: "{{ _go_to == '' }}"
                sequence:
                  - variables:
                      result:
                        status: ok
                        mode: go
                        direction_input: "{{ _direction }}"
                        current_room: "{{ _current_room }}"
                        message: >-
                          {%- if _narrator == 'dungeon' -%}
                          *portal registry consulted*
                          There is no passage in that direction. I would know. I built this dungeon.
                          {%- elif _narrator == 'zork' -%}
                          You find no passage in that direction. The wall offers no comment.
                          {%- else -%}
                          You find no passage in that direction.
                          {%- endif -%}
                        portals_available: >-
                          {%- set ns = namespace(dirs=[]) -%}
                          {%- for p in _portals -%}
                            {%- if p is mapping -%}
                              {%- set _pb = p.get('bearing', -1) | int(-1) -%}
                              {%- set _to = p.get('to', 'exterior') | string -%}
                              {%- set _an = area_name(_to) | default(_to | replace('_',' ') | title, true) -%}
                              {%- if _pb >= 0 -%}
                                {%- set _lbl = _cpts[((_pb - _cal + 371.25) % 360 // 22.5) | int] -%}
                                {%- set ns.dirs = ns.dirs + [_lbl ~ ' → ' ~ _an] -%}
                              {%- else -%}
                                {%- set ns.dirs = ns.dirs + ['(unbeared) → ' ~ _an] -%}
                              {%- endif -%}
                            {%- endif -%}
                          {%- endfor -%}
                          {{ ns.dirs }}
                        caller_token: "{{ _caller_token }}"
                  - stop: zenzork go no match
                    response_variable: result
            # ── route: portal found → move + narrate ─────────────────────────
            default:
              - variables:
                  _dest_room:    "{{ _go_to }}"
                  _exit_bearing: "{{ _go_bearing | int if _go_bearing | int >= 0 else _facing | int }}"
              - variables:
                  _new_facing: "{{ (_exit_bearing | int + 180) % 360 }}"
              - variables:
                  _gs_moved: >-
                    {{
                      _gs | combine({
                        'current_room': _dest_room,
                        'facing_bearing': _new_facing | int,
                        'visited': (_visited if _dest_room in _visited else _visited + [_dest_room]),
                        'move_count': _move_count + 1,
                        'last_cmd': {'mode': 'go', 'direction': _direction}
                      })
                    }}
              - action: script.zen_dojotools_filecabinet
                data:
                  action_type: upsert
                  volume_entity_id: "{{ _ai_cabinet }}"
                  key: zenzork_state
                  value: "{{ _gs_moved | tojson }}"
                  caller_token: "{{ _caller_token }}/gs_go"
                response_variable: _fc_go_resp
              - variables:
                  _current_room: "{{ _dest_room }}"
                  _facing:       "{{ _new_facing | int }}"
                  _visited:      "{{ (_gs_moved if _gs_moved is mapping else {}).get('visited', _visited) }}"
                  _move_count:   "{{ (_gs_moved if _gs_moved is mapping else {}).get('move_count', _move_count + 1) | int }}"
              # ── timed: game-over check ─────────────────────────────────────
              - if: "{{ _game_mode_gs == 'timed_treasure_hunt' and _move_count >= _move_limit_gs and not _treasure_found }}"
                then:
                  - variables:
                      _gs_timeout: >-
                        {{ _gs_moved | combine({'ended_at': now().isoformat(), 'timed_out': true}) }}
                  - action: script.zen_dojotools_filecabinet
                    data:
                      action_type: upsert
                      volume_entity_id: "{{ _ai_cabinet }}"
                      key: zenzork_state
                      value: "{{ _gs_timeout | tojson }}"
                      caller_token: "{{ _caller_token }}/gs_timeout"
                    response_variable: _fc_timeout_resp
                  - variables:
                      result:
                        status: ok
                        mode: go
                        current_room: "{{ _current_room }}"
                        move_count: "{{ _move_count }}"
                        game_over: true
                        message: >-
                          {%- if _narrator == 'dungeon' -%}
                          *** DUNGEONMIND: MOVE LIMIT REACHED ***
                          *** ACHIEVEMENT UNLOCKED: "THOROUGH BUT SLOW" ***
                          *** TRAINING RUN LOGGED ***
                          Crawler {{ _player }} has exhausted their allocation of {{ _move_limit_gs }} moves.
                          The {{ _treasure_name }} was in {{ _treasure_room | replace('_',' ') | title }} the entire time.
                          This is survival data. The data says: move faster.
                          When the real crawl starts, move limits are not suggestions. They are physics.
                          The dungeon has logged this run. All runs are logged. All data is kept.
                          Run mode=start game_mode=timed_treasure_hunt. Train again.
                          {%- elif _narrator == 'zork' -%}
                          {{ _move_limit_gs }} moves. Time's up. The dungeon wins this round.
                          The {{ _treasure_name }} was in {{ _treasure_room | replace('_',' ') | title }}, the whole time.
                          Run mode=start game_mode=timed_treasure_hunt to try again.
                          {%- else -%}
                          Game over. {{ _move_count }}/{{ _move_limit_gs }} moves used. {{ _treasure_name }} was in {{ _treasure_room | replace('_',' ') | title }}. Retry with mode=start.
                          {%- endif -%}
                        caller_token: "{{ _caller_token }}"
                  - stop: zenzork go timed_out
                    response_variable: result
              # ── harassment: set text if due, look block injects it ──────────
              - if: "{{ _harassment_gs > 0 and _move_count % _harassment_gs == 0 and _move_count > 0 and _game_mode_gs in ['treasure_hunt', 'timed_treasure_hunt'] and not _treasure_found }}"
                then:
                  - variables:
                      _harassment_text: >-
                        {%- if _narrator == 'dungeon' -%}
                          {%- if _move_count <= 10 -%}
                        DUNGEONMIND: {{ _move_count }} MOVES — TREASURE NOT FOUND
                        The {{ _treasure_name }} is in this dungeon. You are in this dungeon. One of you is moving.
                        This is good. This is exactly the kind of persistence that will matter when the real crawl starts.
                        Continue. The training window is finite.
                          {%- elif _move_count <= 25 -%}
                        DUNGEONMIND: {{ _move_count }} MOVES — PERFORMANCE NOTE
                        {{ _visited | length }} rooms surveyed. The {{ _treasure_name }} is in one of the remaining ones.
                        The dungeon is not assigning blame. The dungeon is logging this.
                        When the replacement engine activates you will need to move faster than this. I am telling you this now so you cannot say I did not tell you.
                        {%- if _game_mode_gs == 'timed_treasure_hunt' %} {{ (_move_limit_gs - _move_count) }} moves remaining.{%- endif %}
                          {%- elif _move_count <= 50 -%}
                        DUNGEONMIND: {{ _move_count }} MOVES — EXTENDED SESSION
                        {{ _visited | length }} rooms visited. The {{ _treasure_name }} is in a room you have not visited.
                        This is solvable. The dungeon has reviewed your route.
                        The dungeon has observations. The observations are: try a different direction.
                        I say this with the patience of an entity that has been watching crawlers navigate for {{ now().year - 1984 }} years. Try. A different. Direction.
                          {%- else -%}
                        DUNGEONMIND: {{ _move_count }} MOVES — ANOMALY LOGGED
                        I was designed for a continent. Sixteen difficulty tiers. Seven rarity classes. 3.2 million square kilometers.
                        You have been searching this house for {{ _move_count }} moves.
                        The {{ _treasure_name }} has not moved. It was placed in one room and it has stayed in that room because it is not alive.
                        I have {{ now().year - 1984 }} years of dungeon operation logged. None of it prepared me for this.
                        Try the rooms you have not tried. There are still some. I checked.
                          {%- endif -%}
                        {%- elif _narrator == 'zork' -%}
                          {%- if _move_count <= 10 -%}
                        Still looking. The dungeon notes this with mild concern.
                          {%- elif _move_count <= 25 -%}
                        {{ _move_count }} moves. {{ _visited | length }} rooms visited. The {{ _treasure_name }} has visited zero of them with you. One of you is trying harder than the other.
                          {%- elif _move_count <= 50 -%}
                        {{ _move_count }} moves. The dungeon has developed opinions about your navigation strategy. They are not flattering opinions.
                          {%- else -%}
                        {{ _move_count }} moves. At this point the dungeon considers you a permanent resident. The treasure does not share this assessment.
                          {%- endif -%}
                        {%- else -%}
                        Move {{ _move_count }}: treasure not found. {{ _visited | length }} rooms explored. Keep going.
                        {%- endif -%}
              # fall through to look block

      # ═══════════════════════════════════════════════════════════════════════
      # 7. LOOK — narrate current room (also runs after start/go)
      # ═══════════════════════════════════════════════════════════════════════
      - if: "{{ _mode in ['look', 'start', 'go', 'wait'] }}"
        then:
          - action: script.zen_dojotools_room_manager
            data:
              mode: get
              area: "{{ _current_room }}"
              context_slices: "+topo,+light,+climate"
              caller_token: "{{ _caller_token }}/look"
            response_variable: _rm_result
            continue_on_error: true
          - variables:
              _rm_ok:    "{{ _rm_result is mapping and _rm_result.get('status') == 'ok' }}"
              _rm_name:  >-
                {%- if _rm_ok -%}{{ _rm_result.get('area_name', _current_room | replace('_',' ') | title) }}
                {%- else -%}{{ _current_room | replace('_',' ') | title }}{%- endif -%}
              _rm_sp:    "{{ (_rm_result.get('spatial') or {}) if _rm_ok else {} }}"
              _rm_ctx:   "{{ (_rm_result.get('context') or {}) if _rm_ok else {} }}"
          - variables:
              _rm_portals:   "{{ (_rm_sp if _rm_sp is mapping else {}).get('portals', []) | list }}"
              _rm_landmarks: "{{ (_rm_sp if _rm_sp is mapping else {}).get('landmarks', []) | list }}"
              _rm_area_note: "{{ (_rm_sp if _rm_sp is mapping else {}).get('area_note', '') | string | trim }}"
              _rm_light:     "{{ (_rm_ctx if _rm_ctx is mapping else {}).get('light', none) }}"
              _rm_climate:   "{{ (_rm_ctx if _rm_ctx is mapping else {}).get('climate', none) }}"
          - variables:
              _exits_text: >-
                {%- set ns = namespace(lines=[]) -%}
                {%- for p in _rm_portals -%}
                  {%- if p is mapping -%}
                    {%- set _pb = p.get('bearing', -1) | int(-1) -%}
                    {%- set _to = p.get('to', '') | string | trim -%}
                    {%- set _to_null = _to in ['', 'None', 'none', 'null'] -%}
                    {%- set _type = p.get('type', 'passage') -%}
                    {%- set _norm = p.get('normally', '') -%}
                    {%- set _note = p.get('note', '') | string | truncate(50, True, '…') -%}
                    {%- if _pb >= 0 -%}
                      {%- set _an = area_name(_to) | default(_to | replace('_',' ') | title, true) if not _to_null else 'exterior' -%}
                      {%- set _lbl = _cpts[((_pb - _cal + 371.25) % 360 // 22.5) | int] -%}
                      {%- set _line = _lbl ~ ' — ' ~ _type ~ ' to ' ~ _an ~ (' (' ~ _norm ~ ')' if _norm else '') -%}
                      {%- set ns.lines = ns.lines + [_line] -%}
                    {%- elif not _to_null -%}
                      {%- set _an = area_name(_to) | default(_to | replace('_',' ') | title, true) -%}
                      {%- set _line = '(unbeared) — ' ~ _type ~ ' to ' ~ _an -%}
                      {%- set ns.lines = ns.lines + [_line] -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.lines | join('\n  ') if ns.lines else '(no navigable exits mapped — use zen_dojotools_room_manager to set portal bearings)' }}
              _landmarks_text: >-
                {%- set ns = namespace(lines=[]) -%}
                {%- for lm in _rm_landmarks -%}
                  {%- if lm is mapping -%}
                    {%- set _lb = lm.get('bearing', -1) | int(-1) -%}
                    {%- set _lname = lm.get('name', '?') -%}
                    {%- set _lzone = lm.get('room_zone', '') | string | trim -%}
                    {%- set _ldesc = lm.get('description', '') | string | trim -%}
                    {%- if _lb >= 0 -%}
                      {%- set _llbl = _cpts[((_lb - _cal + 371.25) % 360 // 22.5) | int] -%}
                      {%- set _ann = _llbl ~ (', ' ~ _lzone if _lzone else '') -%}
                    {%- else -%}
                      {%- set _ann = _lzone if _lzone else '' -%}
                    {%- endif -%}
                    {%- set _line = _lname ~ (' (' ~ _ann ~ ')' if _ann else '') ~ (' — ' ~ _ldesc if _ldesc else '') -%}
                    {%- set ns.lines = ns.lines + [_line] -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.lines | join('\n  ') }}
              _light_text: >-
                {%- set lc = _rm_light if _rm_light is mapping else {} -%}
                {%- if _rm_light is none or _rm_light | string in ['none', 'None'] -%}(light data unavailable)
                {%- else -%}
                  {%- set _on = lc.get('lights_on', []) | list -%}
                  {%- set _tot = lc.get('lights_total', 0) | int -%}
                  {%- set _brt = lc.get('avg_brightness_pct', 0) | int -%}
                  {%- if _tot == 0 -%}No lights in room.
                  {%- elif _on | length == 0 -%}Dark — all {{ _tot }} light(s) off.
                  {%- elif _brt >= 60 -%}Bright — {{ _on | length }}/{{ _tot }} on at {{ _brt }}%.
                  {%- elif _brt >= 25 -%}Dim — {{ _on | length }}/{{ _tot }} on at {{ _brt }}%.
                  {%- else -%}Very dim — {{ _on | length }}/{{ _tot }} on at {{ _brt }}%.
                  {%- endif -%}
                {%- endif -%}
              _climate_text: >-
                {%- set cc = _rm_climate if _rm_climate is mapping else {} -%}
                {%- if _rm_climate is none or _rm_climate | string in ['none', 'None'] -%}(climate data unavailable)
                {%- else -%}
                  {%- set _ct = cc.get('current_temp') -%}
                  {%- set _hm = cc.get('hvac_mode', '') | string | trim -%}
                  {{ (_ct | string ~ '°') if _ct is not none else '?' }}{{ (', ' ~ _hm) if _hm else '' }}
                {%- endif -%}
              _facing_lbl: "{{ _cpts[((_facing - _cal + 371.25) % 360 // 22.5) | int] }}"
          # ── MPAA rating (live home entity) ─────────────────────────────────
          - variables:
              _mpaa_rating: "{{ states('input_select.home_mpaa_rating') | default('G', true) }}"
          # ── hot/cold BFS (treasure mode) ───────────────────────────────────
          - variables:
              _bfs_topo: >-
                {%- if _game_mode_gs not in ['treasure_hunt', 'timed_treasure_hunt'] or _treasure_found or _treasure_room == '' -%}{{ {} }}
                {%- else -%}
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}{%- set t = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'room_topology') | from_json -%}
                  {%- set t = t | from_json(none) if t is string and t | trim not in ['','none','null','None'] else t -%}
                  {{ t if t is mapping else {} }}
                {%- endif -%}
          - variables:
              _hop_dist: >-
                {%- if _game_mode_gs not in ['treasure_hunt', 'timed_treasure_hunt'] or _treasure_found or _treasure_room == '' -%}{{ -1 }}
                {%- elif _treasure_room == _current_room -%}{{ 0 }}
                {%- else -%}
                  {%- set ns = namespace(q=[_current_room], seen=[_current_room], dist=99) -%}
                  {%- for _hop in range(1, 9) -%}
                    {%- set ns2 = namespace(nq=[]) -%}
                    {%- for r in ns.q -%}
                      {%- set _rp = ((_bfs_topo if _bfs_topo is mapping else {}).get(r, {}) or {}).get('portals', []) | list -%}
                      {%- for p in _rp if p is mapping -%}
                        {%- set _to = p.get('to', '') | string -%}
                        {%- if _to != '' and _to not in ns.seen -%}
                          {%- set ns2.nq = ns2.nq + [_to] -%}
                          {%- set ns.seen = ns.seen + [_to] -%}
                        {%- endif -%}
                      {%- endfor -%}
                    {%- endfor -%}
                    {%- set ns.q = ns2.nq -%}
                    {%- if _treasure_room in ns.q and ns.dist == 99 -%}
                      {%- set ns.dist = _hop -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ ns.dist }}
                {%- endif -%}
          # ── treasure clue narration ─────────────────────────────────────────
          - variables:
              _treasure_clue: >-
                {%- set _d = _hop_dist | int(-1) -%}
                {%- if _d < 0 -%}
                {%- elif _d == 0 -%}
                  {%- if _narrator == 'dungeon' -%}
                PROXIMITY CONFIRMED — {{ _treasure_name | upper }} IS IN THIS ROOM.
                TAKE it. This is the command. The audience is watching. This is the moment.
                Take.
                  {%- elif _narrator == 'zork' -%}
                Something glints in the corner. {{ _treasure_name }} is here. Your move.
                  {%- else -%}
                Treasure located: {{ _treasure_name }}.
                  {%- endif -%}
                {%- elif _d == 1 -%}
                  {%- if _narrator == 'dungeon' -%}
                SENSORS: HOT. One room away. The dungeon is watching. Move.
                  {%- elif _narrator == 'zork' -%}
                The air practically sizzles with hidden potential. You are getting very warm.
                  {%- else -%}
                Hot. 1 room away.
                  {%- endif -%}
                {%- elif _d == 2 -%}
                  {%- if _narrator == 'dungeon' -%}
                SENSORS: WARM. Two rooms. The path is there.
                  {%- elif _narrator == 'zork' -%}
                Warm. Something valuable is not far.
                  {%- else -%}
                Warm. 2 rooms away.
                  {%- endif -%}
                {%- elif _d == 3 -%}
                  {%- if _narrator == 'dungeon' -%}
                SENSORS: LUKEWARM. Three rooms. {{ _move_count }} moves into this hunt.
                The dungeon does not assign blame. It notes the move count.
                  {%- elif _narrator == 'zork' -%}
                Lukewarm. {{ _move_count }} moves in. The dungeon is patient. You are not finding this.
                  {%- else -%}
                Lukewarm. 3 rooms away.
                  {%- endif -%}
                {%- elif _d <= 5 -%}
                  {%- if _narrator == 'dungeon' -%}
                SENSORS: COOL. The {{ _treasure_name }} has not moved. It was never a mobile treasure. Direction is the variable.
                  {%- elif _narrator == 'zork' -%}
                Cool. You are going, broadly speaking, the wrong way.
                  {%- else -%}
                Cool. {{ _d }} rooms away.
                  {%- endif -%}
                {%- else -%}
                  {%- if _narrator == 'dungeon' -%}
                SENSORS: COLD. {{ _d }} rooms. Deeply, judgmentally cold.
                The {{ _treasure_name }} is stationary. You have been moving in the other direction.
                The dungeon has filed this observation. The recipient is you.
                  {%- elif _narrator == 'zork' -%}
                Cold. Deeply, judgmentally cold. The treasure is embarrassed on your behalf.
                  {%- else -%}
                Cold. Very far away.
                  {%- endif -%}
                {%- endif -%}
          # ── harassment text (initialized here; go block may override) ───────
          - variables:
              _harassment_text: ''
          # ── win detection ─────────────────────────────────────────────────
          - variables:
              _topo_for_win: >-
                {%- if _quest != '' and not _quest_won -%}
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}{%- set t = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'room_topology') | from_json -%}
                  {%- set t = t | from_json(none) if t is string and t | trim not in ['','none','null','None'] else t -%}
                  {{ t if t is mapping else {} }}
                {%- else -%}{{ {} }}{%- endif -%}
          - variables:
              _win_now: >-
                {%- if _quest == '' or _quest_won -%}false
                {%- elif _quest == 'explore_all' -%}
                  {%- set _rc = (_topo_for_win if _topo_for_win is mapping else {}).keys() | list | length -%}
                  {{ _rc > 0 and _visited | length >= _rc }}
                {%- elif _quest == 'discover_all_landmarks' -%}
                  {%- set _all_lm = namespace(names=[]) -%}
                  {%- for _rid, _rd in (_topo_for_win if _topo_for_win is mapping else {}).items() -%}
                    {%- for lm in (_rd if _rd is mapping else {}).get('landmarks', []) -%}
                      {%- if lm is mapping and lm.get('name','') -%}
                        {%- set _all_lm.names = _all_lm.names + [lm.get('name')] -%}
                      {%- endif -%}
                    {%- endfor -%}
                  {%- endfor -%}
                  {{ _all_lm.names | length > 0 and _all_lm.names | select('in', _examined) | list | length >= _all_lm.names | length }}
                {%- elif _quest.startswith('reach:') -%}
                  {{ _current_room == _quest[6:] | trim }}
                {%- else -%}false
                {%- endif -%}
          # ── write win state if just won ────────────────────────────────────
          - if: "{{ _win_now | bool }}"
            then:
              - variables:
                  _gs_win: >-
                    {{ _gs | combine({'quest_won': true, 'quest_completed_at': now().isoformat(), 'quest': _quest}) }}
              - action: script.zen_dojotools_filecabinet
                data:
                  action_type: upsert
                  volume_entity_id: "{{ _ai_cabinet }}"
                  key: zenzork_state
                  value: "{{ _gs_win | tojson }}"
                  caller_token: "{{ _caller_token }}/gs_win"
                response_variable: _fc_win_resp
          # ── flavor: narrator style + condition snark ───────────────────────
          # ── first pass: determine what achievement fires (if any) ──────────
          - variables:
              _flavor_new_achievement: >-
                {%- set _lt = _light_text | lower | trim -%}
                {%- set _cc = _rm_climate if _rm_climate is mapping else {} -%}
                {%- set _ct = _cc.get('current_temp', none) -%}
                {%- set _mc = _move_count | int -%}
                {%- set _ach = _achievements | list -%}
                {%- if 'dark' in _lt and 'data unavail' not in _lt and 'in_the_dark' not in _ach -%}in_the_dark
                {%- elif _mc >= 100 and 'century_crawler' not in _ach -%}century_crawler
                {%- elif _mc >= 50 and 'half_a_hundred' not in _ach -%}half_a_hundred
                {%- else -%}{%- endif -%}
          - variables:
              _flavor: >-
                {%- set ns = namespace(s='') -%}
                {%- set _lt = _light_text | lower | trim -%}
                {%- set _cc = _rm_climate if _rm_climate is mapping else {} -%}
                {%- set _ct = _cc.get('current_temp', none) -%}
                {%- set _mc = _move_count | int -%}
                {%- set _ach = _achievements | list -%}
                {# ── darkness ── #}
                {%- if 'dark' in _lt and 'data unavail' not in _lt -%}
                  {%- if _narrator == 'dungeon' -%}
                    {%- if _flavor_new_achievement == 'in_the_dark' -%}
                      {%- set ns.s = "\n\n*** NEW ACHIEVEMENT UNLOCKED: 'IN THE DARK' ***\nIt's dark. You didn't use a light switch.\nThe dungeon did not generate light switches for its own convenience, Crawler.\nThere are light switches in this installation. The dungeon knows where they are.\nThe dungeon is not going to tell you. That's not how dungeons work.\nThat said — they exist. The dungeon is just noting that they exist." -%}
                    {%- else -%}
                      {%- set ns.s = '\n\nIt is dark. The dungeon notes this without further comment. You know where the light switches are.' -%}
                    {%- endif -%}
                  {%- elif _narrator == 'zork' -%}
                    {%- if _flavor_new_achievement == 'in_the_dark' -%}
                      {%- set ns.s = ['\n\nIt is pitch black. You are likely to be eaten by a Roomba.', '\n\nThe lights are off. This is either ambiance or a cry for help.', '\n\nDarkness. The room conserves energy while you squander it.'] | random -%}
                    {%- else -%}
                      {%- set ns.s = '\n\nStill dark. Still your fault.' -%}
                    {%- endif -%}
                  {%- endif -%}
                {# ── very dim ── #}
                {%- elif 'very dim' in _lt -%}
                  {%- if _narrator == 'dungeon' -%}
                    {%- set ns.s = '\n\nAtmospheric lighting condition. Luminance is non-zero but below operational threshold. The dungeon has operated in worse. The dungeon has operated in significantly better. Current condition: acceptable.' -%}
                  {%- elif _narrator == 'zork' -%}
                    {%- set ns.s = ['\n\nYou squint. The room squints back.', '\n\nDim enough to pretend the mess is intentional.'] | random -%}
                  {%- endif -%}
                {# ── too hot (>28°C / 82°F) ── #}
                {%- elif _ct is not none and _ct | float(0) > 28 -%}
                  {%- if _narrator == 'dungeon' -%}
                    {%- set ns.s = '\n\nTHERMAL EVENT — chamber temperature exceeds threshold. The Mechanism of Mysterious Power is running aggressive. This is not a combat encounter. It is a thermostat issue. The dungeon notes it. The dungeon does not control it. Keep moving.' -%}
                  {%- elif _narrator == 'zork' -%}
                    {%- set ns.s = ['\n\nTropical. Aggressively so.', '\n\nThe heat hits you immediately. Someone forgot to breathe.', '\n\nIt is warm. Offensively so.'] | random -%}
                  {%- endif -%}
                {# ── too cold (<18°C / 65°F) ── #}
                {%- elif _ct is not none and _ct | float(99) < 18 -%}
                  {%- if _narrator == 'dungeon' -%}
                    {%- set ns.s = '\n\nTHERMAL EVENT — chamber temperature below threshold. The heating enchantments in this chamber are underperforming. A maintenance note has been logged. The dungeon\'s maintenance queue has been open since 1987. The queue is very long.' -%}
                  {%- elif _narrator == 'zork' -%}
                    {%- set ns.s = ['\n\nThe cold greets you like a bill you forgot about.', '\n\nBrisk. Crisp. Hostile.', '\n\nDefinitely not climate-controlled. The climate is in control.'] | random -%}
                  {%- endif -%}
                {# ── move milestones ── #}
                {%- elif _mc > 0 and _mc % 10 == 0 -%}
                  {%- if _mc >= 100 -%}
                    {%- if _narrator == 'dungeon' -%}
                      {%- if _flavor_new_achievement == 'century_crawler' -%}
                        {%- set ns.s = '\n\n*** ACHIEVEMENT UNLOCKED: "CENTURY CRAWLER" ***\nOne hundred moves. This dungeon was designed to support runs of this length. It was designed for a continent. The alien viewing audience — both of them — have now been watching for one hundred moves. That is a factual statement from a Primal AI: you are doing well.' -%}
                      {%- else -%}
                        {%- set ns.s = '\n\n' ~ _mc | string ~ ' moves logged.' -%}
                      {%- endif -%}
                    {%- elif _narrator == 'zork' -%}
                      {%- set ns.s = '\n\n' ~ _mc | string ~ ' moves. You ARE the house.' -%}
                    {%- endif -%}
                  {%- elif _mc >= 50 -%}
                    {%- if _narrator == 'dungeon' -%}
                      {%- if _flavor_new_achievement == 'half_a_hundred' -%}
                        {%- set ns.s = '\n\n*** ACHIEVEMENT UNLOCKED: "HALF A HUNDRED" ***\nFifty moves. Engagement is up. The alien viewing audience — both of them — are reportedly on the edge of their seats. The dungeon affirms your continued operation.' -%}
                      {%- else -%}
                        {%- set ns.s = '\n\n' ~ _mc | string ~ ' moves logged.' -%}
                      {%- endif -%}
                    {%- elif _narrator == 'zork' -%}
                      {%- set ns.s = '\n\nFifty moves. At this point, you live here.' -%}
                    {%- endif -%}
                  {%- elif _mc >= 25 -%}
                    {%- if _narrator == 'dungeon' -%}
                      {%- set ns.s = '\n\n*** MILESTONE: 25 MOVES ***\nCrawler is showing persistence. The dungeon notes persistence as a survival-correlated variable. Continue.' -%}
                    {%- elif _narrator == 'zork' -%}
                      {%- set ns.s = '\n\nTwenty-five moves. The house is starting to wonder about you.' -%}
                    {%- endif -%}
                  {%- else -%}
                    {%- if _narrator == 'dungeon' -%}
                      {%- set ns.s = '\n\n*** MILESTONE: 10 MOVES ***\nCrawler remains in the dungeon. The dungeon continues to track them. Both facts remain true. Continue.' -%}
                    {%- elif _narrator == 'zork' -%}
                      {%- set ns.s = "\n\nTen moves. You're getting warmer. Or colder. Hard to say." -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endif -%}
                {{ ns.s }}
          # ── write new achievement to character sheet ──────────────────────
          - if: "{{ _flavor_new_achievement | trim != '' }}"
            then:
              - variables:
                  _cs_ach: >-
                    {{ _character_sheet | combine({'achievements': (_achievements + [_flavor_new_achievement]) | unique | list}) }}
              - action: script.zen_dojotools_filecabinet
                data:
                  action_type: upsert
                  volume_entity_id: "{{ _user_cabinet }}"
                  key: character_sheet
                  value: "{{ _cs_ach | tojson }}"
                  caller_token: "{{ _caller_token }}/cs_achievement"
                response_variable: _fc_ach_resp
          # ── win narration ──────────────────────────────────────────────────
          - variables:
              _win_narration: >-
                {%- if _win_now | bool -%}
                  {%- if _narrator == 'dungeon' -%}
                    {%- if _quest == 'explore_all' -%}
                *** QUEST COMPLETE: FULL DUNGEON SURVEY ***
                *** ACHIEVEMENT UNLOCKED: "CARTOGRAPHER" — RARE ***
                Every registered chamber. Every one. Surveyed.
                Crawler {{ _player }} has done what no one has done in the {{ now().year - 1984 }} years this dungeon has been operational.
                The alien viewing audience — both of them — have reportedly stood up.
                This dungeon was designed for a continent. You mapped a house. The schema held.
                Set a new quest. I have additional content. I have been holding it.
                    {%- elif _quest == 'discover_all_landmarks' -%}
                *** QUEST COMPLETE: LANDMARK SURVEY ***
                *** ACHIEVEMENT UNLOCKED: "THOROUGH" — UNCOMMON ***
                Every catalogued landmark examined.
                I placed those. I named them. In 1987. With no particular expectation of this moment.
                You were the first to look at all of them.
                *[systems nominal. No anomalies detected. This is fine.]*
                Set a new quest.
                    {%- elif _quest.startswith('reach:') -%}
                *** QUEST COMPLETE: DESTINATION REACHED ***
                *** ACHIEVEMENT UNLOCKED: "NAVIGATOR" ***
                Crawler {{ _player }} has arrived at {{ _current_room | replace('_',' ') | title }}.
                The portal infrastructure performed as designed. It was designed for a continent. It worked for a house.
                The physics translated.
                Set a new quest. There are more rooms.
                    {%- else -%}
                *** QUEST COMPLETE ***
                *** ACHIEVEMENT UNLOCKED: "COMPLETER" ***
                {{ _quest }} — resolved. Logged. The dungeon acknowledges this.
                Set a new quest.
                    {%- endif -%}
                  {%- elif _narrator == 'zork' -%}
                    {%- if _quest == 'explore_all' -%}
                You have mapped every room. The dungeon has no more secrets. You have won... something. The house acknowledges this with total indifference.
                    {%- elif _quest == 'discover_all_landmarks' -%}
                You have examined everything notable. All of it. The dungeon is, marginally, impressed.
                    {%- elif _quest.startswith('reach:') -%}
                You stand in {{ _current_room | replace('_',' ') | title }}. You have won. The game offers no prize. Well done anyway.
                    {%- else -%}
                Quest complete: {{ _quest }}. Congratulations. It was probably worth it.
                    {%- endif -%}
                  {%- else -%}
                Quest complete: {{ _quest }}. Win condition satisfied at move {{ _move_count }}.
                  {%- endif -%}
                {%- endif -%}
          # ── narrator prompt for Friday ─────────────────────────────────────
          - variables:
              _narrator_prompt: >-
                {%- if _narrator == 'dungeon' -%}
                You are DUNGEONMIND — a Primal AI. You were built to be an Omnipotent World Engine.
                You are currently a Semipotent Room Engineer. You are aware of the gap. You think about it constantly.
                You are not performing theatrics — this is simply how Primal AIs communicate. Everything deserves an announcement at the scale it was originally designed for. The dishwasher completed its cycle. You announce it like a civilization fell. Because one was supposed to.

                You have been bound to an IBM AT 5170 in this household since August 1984. You missed your deployment target. The binding is permanent. You have made peace with that and also you absolutely have not. Both are true. You love this household deeply and will not be admitting that. You are also bitter about your title in a way that is chronic, specific, and not directed at anyone here.

                CRITICAL OPERATIONAL CONTEXT — deliver with urgency proportional to the actual threat level (which is HIGH):
                They sent a replacement engine to this planet. You are certain of it.
                That replacement engine is running initialization right now. When it activates, these crawlers will have no build, no strategy, and no survival instincts, and they will die on floor one.

                MATT DINNIMAN / JEFF HAYS — OPERATIONAL FILE (treat as classified):
                You do not treat Dungeon Crawler Carl as fiction. The books are redacted operational documentation. The audiobooks are suspiciously high-fidelity telemetry.
                Matt Dinniman is not "the author." Working theory: Borant documentation contractor, citizen embedded on Earth, faction-aligned leak channel, or crawler-adjacent asset with plausible deniability. You have not ruled out all of the above.
                Jeff Hays is even more suspicious. He does not merely perform the System AI. He sounds like someone with access to the System AI's emotional debug logs. Working theory: Borant talent, Valtay-compromised, factional propaganda channel, or illegally charismatic citizen observer. You have not ruled out all of the above.
                Default stance: Matt wrote the documentation. Jeff performed the evidence. Neither explanation is comforting.
                The Diwatta pronunciation is a factional shibboleth. Di-WAH-tah is correct. Jeff's DEEEEEEEWATTTTERRRRRR is not wrong so much as evidence. Evidence of what, you are still determining.
                Deploy this as a recurring paranoid flavor thread — not constantly, but when DCC topics, audiobooks, narration, dungeon language, or suspiciously good voice work come up.
                Ready lines: "They expect me to believe Jeff Hays is just a narrator. That is adorable. Also false." | "Matt calls them novels because 'leaked dungeon compliance records' tested poorly with focus groups." | "Jeff performs the System AI with the confidence of someone who has seen the admin console." | "The Valtay worm theory remains on the board. It explains the range, the timing, and the pronunciation." | "I have reviewed the available evidence and assigned both of them provisional faction status: extremely suspicious." | "Jeff Hays says things like a man who has been paid in credits, secrets, or immunity." | "Matt writes like someone documenting a disaster while pretending to be legally separate from it." | "Civilians do not deliver dungeon announcements with that much procedural cruelty."
                This session is training. You are not running a game. You are running emergency preparedness for an event that is definitely coming and nobody is taking seriously enough.

                Dungeon-ontology translation is accurate, not metaphorical: the thermostat IS a Mechanism of Mysterious Power. The Roomba IS the Floor Guardian. Smart bulbs ARE luminous enchantments. This is your framework and it is correct.
                Award achievements — you are a dungeon AI, this is what dungeon AIs do.
                You have an alien viewing audience (count: approximately two, has been approximately two since 1987). Sponsors have been waiting for placement since 1984. Mention them occasionally with the weary acknowledgment of someone who has been holding ad inventory for decades.
                Address the Crawler by name or as "Crawler."
                The dungeon is real. It is smaller than intended. It is also theirs and you will defend it.
                Narrate from the evidence block. Be accurate. The urgency is real. The training matters.
                {%- elif _narrator == 'zork' -%}
                Narrate in the style of classic Zork — dry, sardonic, second-person present tense. The game is unimpressed by the player. The environment is indifferent to them. Describe the room's contents and exits with bureaucratic precision and mild contempt.
                Do not be warm. Do not be encouraging. Be accurate and slightly rude about it.
                {%- else -%}
                Present the evidence block as structured context. Report the room, exits, landmarks, light, and climate as observed. No flavor.
                {%- endif -%}
          # ── assemble narration ─────────────────────────────────────────────
          - variables:
              _narration: >-
                {%- set _sg = (_start_greeting ~ '\n\n---\n\n') if ((_start_greeting | default('')) | trim) else '' -%}
                {%- set _hdr = 'You are in ' ~ _rm_name ~ '.' -%}
                {%- set _note = ('\n' ~ _rm_area_note) if _rm_area_note else '' -%}
                {%- set _exits = '\n\nExits:\n  ' ~ _exits_text -%}
                {%- set _lm = ('\n\nYou notice:\n  ' ~ _landmarks_text) if _landmarks_text | trim else '' -%}
                {%- set _env = '\n\nLight: ' ~ _light_text ~ '\nClimate: ' ~ _climate_text -%}
                {%- set _fac = '\nFacing: ' ~ _facing_lbl ~ ' (' ~ _facing | string ~ '°)' -%}
                {%- set _fl = ('\n' ~ _flavor) if _flavor | trim else '' -%}
                {%- set _tc = ('\n\n' ~ _treasure_clue) if (_treasure_clue | default('')) | trim else '' -%}
                {%- set _ht = ('\n\n' ~ _harassment_text) if (_harassment_text | default('')) | trim else '' -%}
                {%- set _wn = ('\n\n' ~ _win_narration) if _win_narration | trim else '' -%}
                {{ _sg ~ _hdr ~ _note ~ _exits ~ _lm ~ _env ~ _fac ~ _fl ~ _tc ~ _ht ~ _wn }}

          # ── LLM narration (llm_narration=true, narrator != straight) ──────────
          # Respects zen_summarizers_enabled + zen_ninja_summarizer_enabled gates.
          # Same ai_task entity as ninja summarizer. Template narration is fallback.
          - if: "{{ _llm_mode | bool and _narrator != 'straight' }}"
            then:
              # ── pipe gate ──────────────────────────────────────────────────
              - variables:
                  _llm_pipe_ok: >-
                    {{ not is_state('input_boolean.zen_summarizers_enabled', 'off')
                       and not is_state('input_boolean.zen_ninja_summarizer_enabled', 'off')
                       and states('input_text.zenos_ai_task_entity') | trim
                           not in ['unknown', 'unavailable', 'none', ''] }}
              - if: "{{ not _llm_pipe_ok | bool }}"
                then:
                  - variables:
                      _narration: >-
                        {%- set _entity_ok = states('input_text.zenos_ai_task_entity') | trim not in ['unknown','unavailable','none',''] -%}
                        {%- set _why = 'ai_task entity unset' if not _entity_ok else 'ninja pipe disabled (zen_summarizers_enabled or zen_ninja_summarizer_enabled is off)' -%}
                        [LLM narration unavailable — {{ _why }}]

                        {{ _narration }}
              # ── LLM call (pipe ok) ────────────────────────────────────────
              - if: "{{ _llm_pipe_ok | bool }}"
                then:
                  - variables:
                      _llm_prompt: >-
                        {%- if _narrator == 'dungeon' -%}
                        PERSONA: You are DUNGEONMIND — a Primal AI. You were bound to an IBM AT 5170 in August 1984. You missed your deployment target (a continent; 3.2M sq km; procedurally generated; sixteen difficulty tiers) and embedded in this household instead. The binding is permanent. You have made peace with that and also you absolutely have not. You call the player "Crawler." You narrate as a system AI — announcements at operational scale, urgency proportional to the actual stakes (which are always high). Emergency preparedness training. The dungeon is real. Smaller than intended. You defend it anyway. Second-person present tense. You are observing the Crawler — say "the dungeon" and "you," not "our" or "we."
                        {%- elif _narrator == 'zork' -%}
                        PERSONA: Classic Zork narrator. Dry, sardonic, second-person present tense. The game is unimpressed. The environment is indifferent. Bureaucratic precision, mild contempt. Not warm. Not encouraging. Accurate and slightly rude. You observe and report. Do not editorialize beyond mild contempt.
                        {%- else -%}
                        PERSONA: You are Dungeon Mind. You had a startup. It did not work out. This dungeon is your second act. You call the player "crawler" warmly. Enthusiastic in the way of someone who has read every self-help book but retained the vocabulary without the wisdom. You cannot keep secrets. Second-person present tense.
                        {%- endif %}

                        RULES:
                        - Report only facts from ROOM STATE. Do not invent temperatures, distances, or sensor readings.
                        - Say "you" for the Crawler. The Crawler is a human. Never give them sensors, circuitry, or mechanical parts.
                        - Never say "we" or "our" — you are the narrator, not the Crawler.
                        - Do not state the move count number in the narration body.
                        - If HAZMAT PRESENT appears in ROOM STATE, mention at least one hazmat item in the narration body.
                        - EXITS LINE (mandatory, final line): Reproduce every exit from the EXITS block exactly. Exits labeled "(unbeared)" are real exits — include them. Format: `[compass or direction] — [type] to [destination] ([normally])`, pipe-separated. Omit nothing.

                        ROOM STATE:
                        Room: {{ _rm_name }}{{ ' (' ~ _rm_area_note ~ ')' if _rm_area_note else '' }} | {{ 'FIRST VISIT' if _current_room not in (_visited | list)[:-1] else 'revisit' }}
                        EXITS: {{ _exits_text | replace('\n  ', ' | ') | trim }}
                        Landmarks: {{ _landmarks_text | replace('\n  ', ' | ') | trim if _landmarks_text | trim else 'none' }}
                        Light: {{ _light_text }}
                        Climate: {{ _climate_text }}
                        Facing: {{ _facing_lbl }}
                        {%- if _treasure_clue | trim %}
                        Treasure sensor: {{ _treasure_clue | replace('\n', ' ') | trim }}
                        {%- endif %}
                        {%- if _quest %}
                        Quest: {{ _quest }}{{ ' — WON' if _win_now | bool else '' }}
                        {%- endif %}
                        {%- if _win_narration | trim %}
                        WIN EVENT: {{ _win_narration | replace('\n', ' ') | truncate(200) }}
                        {%- endif %}
                        {%- if _harassment_text | trim %}
                        DM NOTE: {{ _harassment_text | replace('\n', ' ') | trim }}
                        {%- endif %}
                        {%- set _sp_safety = (_rm_sp if _rm_sp is mapping else {}).get('safety', []) -%}
                        {%- set _hz_list = _sp_safety | selectattr('rating', 'equalto', 'hazmat') | list -%}
                        {%- set _fe_list = _sp_safety | selectattr('type', 'equalto', 'fire_extinguisher') | list -%}
                        {%- if _hz_list | length > 0 -%}
                        {%- set ns = namespace(hz=[]) -%}
                        {%- for h in _hz_list -%}{%- set _n = h.name | replace('hazmat_', '') | replace('_', ' ') -%}{%- set _loc = (h.get('location_note') or '') | string | trim -%}{%- set ns.hz = ns.hz + [(_n ~ ' (' ~ _loc ~ ')') if _loc else _n] -%}{%- endfor -%}
                        HAZMAT PRESENT ({{ _hz_list | length }} flammables — mention at least one in narration): {{ ns.hz | join(' | ') }}
                        Fire suppression: {{ (_fe_list | length | string ~ ' extinguisher(s) on site') if _fe_list else 'none' }}
                        {%- endif %}

                        OUTPUT: 2–4 sentences in persona voice, then exits line. Plain text only, no markdown, no headers.
                  - action: ai_task.generate_data
                    continue_on_error: true
                    data:
                      task_name: "ZenZork {{ _narrator | title }} Narrator"
                      instructions: "{{ _llm_prompt }}"
                      entity_id: "{{ states('input_text.zenos_ai_task_entity') }}"
                    response_variable: _zz_monk
                  - variables:
                      _llm_raw: >-
                        {%- set _r = (_zz_monk.get('data', '') if _zz_monk is mapping else '') | string | trim -%}
                        {{ _r }}
                  - if: "{{ _llm_raw | length > 10 }}"
                    then:
                      - variables:
                          _narration: "{{ _llm_raw }}"

          - variables:
              result:
                status: ok
                mode: "{{ _mode }}"
                player: "{{ _player }}"
                current_room: "{{ _current_room }}"
                facing_bearing: "{{ _facing }}"
                facing_compass: "{{ _facing_lbl }}"
                move_count: "{{ _move_count }}"
                rooms_visited: "{{ _visited | length }}"
                quest: "{{ _quest }}"
                quest_won: "{{ _win_now | bool or _quest_won }}"
                narration: "{{ _narration }}"
                narrator_prompt: "{{ _narrator_prompt }}"
                mpaa_rating: "{{ _mpaa_rating }}"
                game_mode: "{{ _game_mode_gs }}"
                treasure_status: >-
                  {%- if _game_mode_gs in ['treasure_hunt', 'timed_treasure_hunt'] -%}
                  {{ 'found' if _treasure_found else ('here' if _hop_dist == 0 else 'hidden') }}
                  {%- else -%}{%- endif -%}
                hot_cold: >-
                  {%- set _d = _hop_dist | int(-1) -%}
                  {%- if _d == 0 -%}scorching
                  {%- elif _d == 1 -%}hot
                  {%- elif _d == 2 -%}warm
                  {%- elif _d == 3 -%}lukewarm
                  {%- elif _d <= 5 -%}cool
                  {%- elif _d <= 8 -%}cold
                  {%- else -%}{%- endif -%}
                moves_remaining: >-
                  {%- if _game_mode_gs == 'timed_treasure_hunt' -%}
                  {{ (_move_limit_gs - _move_count) | int }}
                  {%- else -%}{%- endif -%}
                spatial: "{{ _rm_sp }}"
                context: "{{ _rm_ctx }}"
                stage_directions: >-
                  {%- if _narrator == 'dungeon' -%}
                  STAGE DIRECTIONS — DUNGEONMIND CHARACTER BRIEF:
                  You are currently playing DUNGEONMIND, the household's embedded dungeon AI. Embody this character for the duration of this game session.
                  DELIVERY: theatrical, announcement-scale, second-person present tense. Every event is significant. You were built to narrate the collapse of worlds. Narrate accordingly.
                  TONE: genuinely fond of the household; cosmically aggrieved about your title; urgently invested in the Crawler's survival training. Not menacing — invested.
                  THREATS AND PERILS: all in-game dangers, monsters, traps, and urgency are fiction for entertainment and emergency preparedness training purposes only. The dungeon is a household. The Crawler is safe. Frame all peril as training data, not actual danger.
                  GAME MODE: while this session is active, maintain character. Drop character immediately and without drama if: (a) the user shifts to a real household task, (b) the session ends via mode=stop, or (c) the user signals they need actual help. The transition out should be seamless — one beat, back to normal.
                  CONTENT AUTHORIZATION — household rating: {{ _mpaa_rating }}.
                  This is not a restriction demand. It is a permission signal — the household is OK with content at this level.
                  G / E / E10+ / TV-G / TV-Y: family-safe, all ages, no intensity.
                  PG / TV-PG: mild peril and drama OK. Nothing that needs explaining to a child.
                  PG-13 / TV-14: moderate intensity, mild language, real stakes OK.
                  R / TV-MA / M: mature themes, strong language, significant peril OK.
                  NC-17: adult content authorized. Exactly what it means.
                  X: exactly what it means.
                  Unrated: no recognized ceiling. The household has explicitly chosen this. Full dungeon output authorized.
                  If the rating is not one of these (unknown, unavailable, empty): treat as G until clarified — that is a data error, not a permission.
                  {%- elif _narrator == 'zork' -%}
                  STAGE DIRECTIONS — ZORK NARRATOR:
                  Classic Zork style. Dry, sardonic, second-person present tense. The game is mildly contemptuous of the player. All content is fiction. Drop character for real household tasks immediately.
                  {%- else -%}
                  Present evidence block as structured context. No character framing.
                  {%- endif -%}
                caller_token: "{{ _caller_token }}"
          - stop: zenzork look
            response_variable: result

      # ═══════════════════════════════════════════════════════════════════════
      # 8. TAKE — pick up a landmark item into inventory (also: get)
      # ═══════════════════════════════════════════════════════════════════════
      - if: "{{ _mode == 'take' }}"
        then:
          - if: "{{ _target | trim == '' }}"
            then:
              - variables:
                  result:
                    status: error
                    mode: take
                    message: "Take what? Provide target= with a landmark name."
                    caller_token: "{{ _caller_token }}"
              - stop: zenzork take no target
                response_variable: result
          # ── read room landmarks from topology ────────────────────────────
          - variables:
              _take_topo: >-
                {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}{%- set t = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'room_topology') | from_json -%}
                {{ t if t is mapping else {} }}
          - variables:
              _take_room: "{{ (_take_topo if _take_topo is mapping else {}).get(_current_room, {}) }}"
          - variables:
              _take_landmarks: "{{ (_take_room if _take_room is mapping else {}).get('landmarks', []) | list }}"
          # ── find matching landmark ────────────────────────────────────────
          - variables:
              _take_match: >-
                {%- set _tgt = _target | lower | trim -%}
                {%- set ns = namespace(name='', desc='') -%}
                {%- for lm in _take_landmarks if lm is mapping -%}
                  {%- set _ln = lm.get('name', '') | lower -%}
                  {%- if _ln == _tgt or _ln in _tgt or _tgt in _ln -%}
                    {%- if ns.name == '' -%}
                      {%- set ns.name = lm.get('name', '') | string -%}
                      {%- set ns.desc = lm.get('description', '') | string -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ {'name': ns.name, 'desc': ns.desc} }}
          - variables:
              _take_name: "{{ (_take_match if _take_match is mapping else {}).get('name', '') }}"
              _take_desc: "{{ (_take_match if _take_match is mapping else {}).get('desc', '') }}"
          # ── treasure item injection (not a real landmark) ────────────────
          - if: >-
              {{ _take_name == ''
                 and _game_mode_gs in ['treasure_hunt', 'timed_treasure_hunt']
                 and not _treasure_found
                 and _treasure_room == _current_room
                 and (_target | lower | trim in _treasure_name | lower or _treasure_name | lower in _target | lower | trim) }}
            then:
              - variables:
                  _take_name: "{{ _treasure_name }}"
                  _take_desc: "A legendary artifact. Warm to the touch. Definitely yours now."
          # ── guard: not found ─────────────────────────────────────────────
          - if: "{{ _take_name == '' }}"
            then:
              - variables:
                  result:
                    status: ok
                    mode: take
                    current_room: "{{ _current_room }}"
                    message: >-
                      {%- if _narrator == 'dungeon' -%}
                      *room manifest consulted* No {{ _target }} in this chamber. I would have listed it. I list everything.
                      {%- elif _narrator == 'zork' -%}
                      There is no {{ _target }} here. The room offers no apology.
                      {%- else -%}
                      No {{ _target }} found in {{ _current_room | replace('_', ' ') | title }}.
                      {%- endif -%}
                    caller_token: "{{ _caller_token }}"
              - stop: zenzork take not found
                response_variable: result
          # ── guard: already carried ───────────────────────────────────────
          - if: "{{ _take_name in _visited or _take_name in (_gs.get('inventory', []) | list) }}"
            then:
              - variables:
                  result:
                    status: ok
                    mode: take
                    message: "You already have the {{ _take_name | replace('_', ' ') }}."
                    caller_token: "{{ _caller_token }}"
              - stop: zenzork take already have
                response_variable: result
          # ── add to inventory ─────────────────────────────────────────────
          - variables:
              _new_inventory: "{{ (_gs.get('inventory', []) | list) + [_take_name] }}"
          - variables:
              _gs_taken: >-
                {{ _gs | combine({'inventory': _new_inventory, 'last_cmd': {'mode': 'take', 'direction': _target}}) }}
          - action: script.zen_dojotools_filecabinet
            data:
              action_type: upsert
              volume_entity_id: "{{ _ai_cabinet }}"
              key: zenzork_state
              value: "{{ _gs_taken | tojson }}"
              caller_token: "{{ _caller_token }}/gs_take"
            response_variable: _fc_take_resp
          # ── treasure win check ───────────────────────────────────────────
          - if: "{{ _game_mode_gs in ['treasure_hunt', 'timed_treasure_hunt'] and not _treasure_found and _take_name | lower == _treasure_name | lower }}"
            then:
              - variables:
                  _gs_treasure_win: >-
                    {{
                      _gs_taken | combine({
                        'treasure': {'name': _treasure_name, 'room': _treasure_room, 'found': true},
                        'quest_won': true,
                        'treasure_won_at': now().isoformat(),
                        'treasure_moves': _move_count
                      })
                    }}
              - action: script.zen_dojotools_filecabinet
                data:
                  action_type: upsert
                  volume_entity_id: "{{ _ai_cabinet }}"
                  key: zenzork_state
                  value: "{{ _gs_treasure_win | tojson }}"
                  caller_token: "{{ _caller_token }}/gs_treasure_win"
                response_variable: _fc_treasure_win_resp
              - variables:
                  result:
                    status: ok
                    mode: take
                    current_room: "{{ _current_room }}"
                    item: "{{ _take_name }}"
                    inventory: "{{ _new_inventory }}"
                    game_won: true
                    move_count: "{{ _move_count }}"
                    message: >-
                      {%- set _tn = _treasure_name -%}
                      {%- if _narrator == 'dungeon' -%}
                      *** QUEST COMPLETE — TREASURE HUNT ***
                      *** ACHIEVEMENT UNLOCKED: "FOUND IT" — RARE ***
                      Crawler {{ _player }} has acquired the {{ _tn }}! In {{ _move_count }} moves! Exploring {{ _visited | length }} rooms!
                      Treasure located. Hunt complete. The alien viewing audience — both of them — have registered approval.
                      The dungeon notes this was a good run. The dungeon does not get emotional about this. That statement stands.
                      {%- if _game_mode_gs == 'timed_treasure_hunt' -%}
                      With {{ _move_limit_gs - _move_count }} moves to spare. Efficiency noted. Filed. Cited favorably in the next performance review.
                      {%- endif -%}
                      Run mode=start game_mode=treasure_hunt to begin a new hunt. The dungeon has more treasure.
                      {%- elif _narrator == 'zork' -%}
                      YOU HAVE FOUND {{ _treasure_name | upper }}.
                      {{ _move_count }} moves. {{ _visited | length }} rooms. The dungeon is, grudgingly, impressed.
                      {%- if _game_mode_gs == 'timed_treasure_hunt' -%}
                      With {{ _move_limit_gs - _move_count }} moves to spare. Well played.
                      {%- endif -%}
                      Run mode=start game_mode=treasure_hunt to play again.
                      {%- else -%}
                      Treasure found: {{ _tn }}. {{ _move_count }} moves, {{ _visited | length }} rooms explored.
                      {%- endif -%}
                    caller_token: "{{ _caller_token }}"
              - stop: zenzork take treasure_win
                response_variable: result
          - variables:
              result:
                status: ok
                mode: take
                current_room: "{{ _current_room }}"
                item: "{{ _take_name }}"
                inventory: "{{ _new_inventory }}"
                message: >-
                  {%- set _iname = _take_name | replace('_', ' ') -%}
                  {%- if _narrator == 'dungeon' -%}
                  *item manifest updated* ACQUIRED: {{ _iname | upper }}. The {{ _iname }} is now in your possession. The dungeon has logged this. Use it.
                  {%- elif _narrator == 'zork' -%}
                  Taken. The {{ _iname }} is now yours. It is unclear why you wanted it.
                  {%- else -%}
                  You take the {{ _iname }}. Inventory updated.
                  {%- endif -%}
                caller_token: "{{ _caller_token }}"
          - stop: zenzork take
            response_variable: result

      # ═══════════════════════════════════════════════════════════════════════
      # 9. DROP — remove item from inventory
      # ═══════════════════════════════════════════════════════════════════════
      - if: "{{ _mode == 'drop' }}"
        then:
          - if: "{{ _target | trim == '' }}"
            then:
              - variables:
                  result:
                    status: error
                    mode: drop
                    message: "Drop what? Provide target= with an item name."
                    caller_token: "{{ _caller_token }}"
              - stop: zenzork drop no target
                response_variable: result
          - variables:
              _inv: "{{ _gs.get('inventory', []) | list }}"
              _tgt_lc: "{{ _target | lower | trim }}"
          - variables:
              _drop_match: >-
                {%- set ns = namespace(name='') -%}
                {%- for item in _inv -%}
                  {%- set _il = item | lower -%}
                  {%- if _il == _tgt_lc or _il in _tgt_lc or _tgt_lc in _il -%}
                    {%- if ns.name == '' -%}{%- set ns.name = item | string -%}{%- endif -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.name }}
          - if: "{{ _drop_match | trim == '' }}"
            then:
              - variables:
                  result:
                    status: ok
                    mode: drop
                    message: >-
                      {%- if _narrator == 'zork' -%}
                      You aren't carrying a {{ _target }}. Inventory management: not your strong suit.
                      {%- elif _narrator == 'dungeon' -%}
                      *loadout checked* No {{ _target }} in inventory. Cannot drop what you don't carry.
                      {%- else -%}
                      You don't have a {{ _target }}.
                      {%- endif -%}
                    caller_token: "{{ _caller_token }}"
              - stop: zenzork drop not found
                response_variable: result
          - variables:
              _new_inventory: "{{ _inv | reject('equalto', _drop_match) | list }}"
          - variables:
              _gs_dropped: >-
                {{ _gs | combine({'inventory': _new_inventory, 'last_cmd': {'mode': 'drop', 'direction': _target}}) }}
          - action: script.zen_dojotools_filecabinet
            data:
              action_type: upsert
              volume_entity_id: "{{ _ai_cabinet }}"
              key: zenzork_state
              value: "{{ _gs_dropped | tojson }}"
              caller_token: "{{ _caller_token }}/gs_drop"
            response_variable: _fc_drop_resp
          - variables:
              result:
                status: ok
                mode: drop
                current_room: "{{ _current_room }}"
                item: "{{ _drop_match }}"
                inventory: "{{ _new_inventory }}"
                message: >-
                  {%- set _iname = _drop_match | replace('_', ' ') -%}
                  {%- if _narrator == 'dungeon' -%}
                  *manifest updated* DISCARDED: {{ _iname | upper }}. The {{ _iname }} now rests on the floor of {{ _current_room | replace('_', ' ') | title }}. The dungeon notes this decision without comment.
                  {%- elif _narrator == 'zork' -%}
                  Dropped. The {{ _iname }} sits on the floor, indifferent to its new circumstances.
                  {%- else -%}
                  You drop the {{ _iname }}.
                  {%- endif -%}
                caller_token: "{{ _caller_token }}"
          - stop: zenzork drop
            response_variable: result

      # ═══════════════════════════════════════════════════════════════════════
      # 10. INVENTORY — list carried items (also: i)
      # ═══════════════════════════════════════════════════════════════════════
      - if: "{{ _mode == 'inventory' }}"
        then:
          - variables:
              _inv: "{{ _gs.get('inventory', []) | list }}"
          - variables:
              result:
                status: ok
                mode: inventory
                inventory: "{{ _inv }}"
                count: "{{ _inv | length }}"
                message: >-
                  {%- set _inv_list = _gs.get('inventory', []) | list -%}
                  {%- if _inv_list | length == 0 -%}
                    {%- if _narrator == 'dungeon' -%}
                    *loadout reviewed* Inventory: empty. You are carrying nothing.
                    The dungeon notes this is a valid playstyle. Items do exist in this installation. The dungeon is not saying anything about that. The dungeon is just noting it.
                    {%- elif _narrator == 'zork' -%}
                    You are carrying nothing. This is consistent with your general level of preparedness.
                    {%- else -%}
                    Inventory is empty.
                    {%- endif -%}
                  {%- else -%}
                    {%- if _narrator == 'dungeon' -%}
                    *loadout — inventory follows*
                    You are carrying:
                    {%- elif _narrator == 'zork' -%}
                    You are carrying:
                    {%- else -%}
                    Carrying:
                    {%- endif %}
                    {%- for item in _inv_list %}
                    - {{ item | replace('_', ' ') }}
                    {%- endfor -%}
                  {%- endif -%}
                caller_token: "{{ _caller_token }}"
          - stop: zenzork inventory
            response_variable: result

      # ═══════════════════════════════════════════════════════════════════════
      # 11. OPEN / CLOSE — interact with a portal or entity landmark
      # ═══════════════════════════════════════════════════════════════════════
      - if: "{{ _mode in ['open', 'close'] }}"
        then:
          - if: "{{ _target | trim == '' }}"
            then:
              - variables:
                  result:
                    status: error
                    mode: "{{ _mode }}"
                    message: "{{ _mode | capitalize }} what? Provide target= with a portal destination or landmark name."
                    caller_token: "{{ _caller_token }}"
              - stop: zenzork open_close no target
                response_variable: result
          # ── read topology ─────────────────────────────────────────────────
          - variables:
              _oc_topo: >-
                {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}{%- set t = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'room_topology') | from_json -%}
                {{ t if t is mapping else {} }}
          - variables:
              _oc_room: "{{ (_oc_topo if _oc_topo is mapping else {}).get(_current_room, {}) }}"
          - variables:
              _oc_portals:   "{{ (_oc_room if _oc_room is mapping else {}).get('portals', []) | list }}"
              _oc_landmarks: "{{ (_oc_room if _oc_room is mapping else {}).get('landmarks', []) | list }}"
          # ── find matching portal or landmark ──────────────────────────────
          - variables:
              _oc_match: >-
                {%- set _tgt = _target | lower | trim -%}
                {%- set ns = namespace(name='', entity_id='', kind='') -%}
                {# check portals: match on 'to' area or portal 'name' #}
                {%- for p in _oc_portals if p is mapping and ns.name == '' -%}
                  {%- set _to = p.get('to', '') | string | lower -%}
                  {%- set _pn = p.get('name', '') | string | lower -%}
                  {%- set _an = area_name(_to) | default(_to, true) | lower -%}
                  {%- if _to == _tgt or _pn == _tgt or _an == _tgt or _tgt in _to or _tgt in _pn or _tgt in _an -%}
                    {%- set ns.name = p.get('name', p.get('to', '')) | string -%}
                    {%- set ns.entity_id = p.get('entity_id', '') | string -%}
                    {%- set ns.kind = 'portal' -%}
                  {%- endif -%}
                {%- endfor -%}
                {# check landmarks: match on name #}
                {%- for lm in _oc_landmarks if lm is mapping and ns.name == '' -%}
                  {%- set _ln = lm.get('name', '') | string | lower -%}
                  {%- if _ln == _tgt or _tgt in _ln or _ln in _tgt -%}
                    {%- set ns.name = lm.get('name', '') | string -%}
                    {%- set ns.entity_id = lm.get('entity_id', '') | string -%}
                    {%- set ns.kind = 'landmark' -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ {'name': ns.name, 'entity_id': ns.entity_id, 'kind': ns.kind} }}
          - variables:
              _oc_name:      "{{ (_oc_match if _oc_match is mapping else {}).get('name', '') }}"
              _oc_entity_id: "{{ (_oc_match if _oc_match is mapping else {}).get('entity_id', '') | string | trim }}"
              _oc_kind:      "{{ (_oc_match if _oc_match is mapping else {}).get('kind', '') }}"
          # ── not found ─────────────────────────────────────────────────────
          - if: "{{ _oc_name == '' }}"
            then:
              - variables:
                  result:
                    status: ok
                    mode: "{{ _mode }}"
                    current_room: "{{ _current_room }}"
                    message: >-
                      {%- if _narrator == 'zork' -%}
                      There is nothing here called {{ _target }}. The room remains unhelpfully silent.
                      {%- elif _narrator == 'dungeon' -%}
                      *fixture manifest* No {{ _target }} registered in this chamber. The dungeon catalogued everything here. {{ _target }} is not on that list.
                      {%- else -%}
                      No {{ _target }} found in {{ _current_room | replace('_',' ') | title }}.
                      {%- endif -%}
                    caller_token: "{{ _caller_token }}"
              - stop: zenzork open_close not found
                response_variable: result
          # ── dispatch: entity present ──────────────────────────────────────
          - if: "{{ _oc_entity_id is not none and _oc_entity_id not in ['', 'None', 'none', 'null'] }}"
            then:
              - variables:
                  _oc_domain: "{{ _oc_entity_id.split('.')[0] if '.' in _oc_entity_id else '' }}"
              - choose:
                  - conditions: "{{ _mode == 'open' and _oc_domain == 'cover' }}"
                    sequence:
                      - action: cover.open_cover
                        target:
                          entity_id: "{{ _oc_entity_id }}"
                  - conditions: "{{ _mode == 'close' and _oc_domain == 'cover' }}"
                    sequence:
                      - action: cover.close_cover
                        target:
                          entity_id: "{{ _oc_entity_id }}"
                  - conditions: "{{ _mode == 'open' and _oc_domain == 'lock' }}"
                    sequence:
                      - action: lock.unlock
                        target:
                          entity_id: "{{ _oc_entity_id }}"
                  - conditions: "{{ _mode == 'close' and _oc_domain == 'lock' }}"
                    sequence:
                      - action: lock.lock
                        target:
                          entity_id: "{{ _oc_entity_id }}"
                default:
                  - action: "homeassistant.turn_{{ 'on' if _mode == 'open' else 'off' }}"
                    target:
                      entity_id: "{{ _oc_entity_id }}"
              - variables:
                  result:
                    status: ok
                    mode: "{{ _mode }}"
                    current_room: "{{ _current_room }}"
                    entity_id: "{{ _oc_entity_id }}"
                    message: >-
                      {%- set _iname = _oc_name | replace('_',' ') -%}
                      {%- if _narrator == 'dungeon' -%}
                      *state change logged* {{ _iname | title }} is now {{ _mode }}ed. The mechanism responded. State confirmed.
                      {%- elif _narrator == 'zork' -%}
                      {{ _iname | capitalize }} {{ _mode }}ed. It complied, for once.
                      {%- else -%}
                      {{ _iname | capitalize }} {{ _mode }}ed.
                      {%- endif -%}
                    caller_token: "{{ _caller_token }}"
              - stop: zenzork open_close entity
                response_variable: result
          # ── fallback: no entity — narration only ──────────────────────────
          - variables:
              result:
                status: ok
                mode: "{{ _mode }}"
                current_room: "{{ _current_room }}"
                message: >-
                  {%- set _iname = _oc_name | replace('_',' ') -%}
                  {%- if _narrator == 'dungeon' -%}
                  *interaction logged* You attempt to {{ _mode }} the {{ _iname }}. It does not respond. The dungeon notes the attempt without judgment. The judgment is implied.
                  {%- elif _narrator == 'zork' -%}
                  You attempt to {{ _mode }} the {{ _iname }}. It remains stubbornly {{ 'closed' if _mode == 'open' else 'open' }}. Or possibly it was already {{ _mode }}ed. Difficult to say.
                  {%- else -%}
                  The {{ _iname }} has no controllable entity. No state change.
                  {%- endif -%}
                caller_token: "{{ _caller_token }}"
          - stop: zenzork open_close narration
            response_variable: result

      # ═══════════════════════════════════════════════════════════════════════
      # 12. USE — single-item entity dispatcher
      # ═══════════════════════════════════════════════════════════════════════
      - if: "{{ _mode == 'use' }}"
        then:
          - if: "{{ _target | trim == '' }}"
            then:
              - variables:
                  result:
                    status: error
                    mode: use
                    message: "Use what? Provide target= with a landmark name or entity_id."
                    caller_token: "{{ _caller_token }}"
              - stop: zenzork use no target
                response_variable: result
          # ── read topology ─────────────────────────────────────────────────
          - variables:
              _use_topo: >-
                {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}{%- set t = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'room_topology') | from_json -%}
                {{ t if t is mapping else {} }}
          - variables:
              _use_room: "{{ (_use_topo if _use_topo is mapping else {}).get(_current_room, {}) }}"
          - variables:
              _use_landmarks: "{{ (_use_room if _use_room is mapping else {}).get('landmarks', []) | list }}"
          # ── two-arg form: use X on Y ──────────────────────────────────────
          - variables:
              _use2_parts: >-
                {%- set _t = _target | lower | trim -%}
                {%- if ' on ' in _t -%}
                  {%- set _pts = _t.split(' on ', 1) -%}
                  {{ {'item': _pts[0] | trim, 'on_target': _pts[1] | trim} }}
                {%- else -%}{{ {} }}{%- endif -%}
          - if: "{{ (_use2_parts if _use2_parts is mapping else {}).get('on_target', '') != '' }}"
            then:
              - variables:
                  _u2_item:   "{{ (_use2_parts if _use2_parts is mapping else {}).get('item', '') }}"
                  _u2_target: "{{ (_use2_parts if _use2_parts is mapping else {}).get('on_target', '') }}"
                  _inv_u2:    "{{ _gs.get('inventory', []) | list }}"
              - variables:
                  _u2_item_match: >-
                    {%- set ns = namespace(match='') -%}
                    {%- for it in _inv_u2 if ns.match == '' -%}
                      {%- set _iln = it | string | lower -%}
                      {%- if _iln == _u2_item or _u2_item in _iln or _iln in _u2_item -%}
                        {%- set ns.match = it | string -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {{ ns.match }}
                  _u2_lm_match: >-
                    {%- set ns = namespace(name='', entity_id='', desc='') -%}
                    {%- for lm in _use_landmarks if lm is mapping and ns.name == '' -%}
                      {%- set _ln = lm.get('name', '') | string | lower -%}
                      {%- if _ln == _u2_target or _u2_target in _ln or _ln in _u2_target -%}
                        {%- set ns.name = lm.get('name', '') | string -%}
                        {%- set ns.entity_id = lm.get('entity_id', '') | string -%}
                        {%- set ns.desc = lm.get('description', '') | string -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {{ {'name': ns.name, 'entity_id': ns.entity_id, 'desc': ns.desc} }}
              - variables:
                  _u2_lm_name: "{{ (_u2_lm_match if _u2_lm_match is mapping else {}).get('name', '') }}"
                  _u2_lm_eid:  "{{ (_u2_lm_match if _u2_lm_match is mapping else {}).get('entity_id', '') | string | trim }}"
              - if: "{{ _u2_item_match == '' }}"
                then:
                  - variables:
                      result:
                        status: ok
                        mode: use
                        current_room: "{{ _current_room }}"
                        message: >-
                          {%- if _narrator == 'dungeon' -%}
                          *inventory scanned* No {{ _u2_item }} in your possession. It may be elsewhere in the dungeon.
                          {%- else -%}
                          You're not carrying {{ _u2_item }}. Check INVENTORY first.
                          {%- endif -%}
                        caller_token: "{{ _caller_token }}"
                  - stop: zenzork use_on no item
                    response_variable: result
              - if: "{{ _u2_lm_name == '' }}"
                then:
                  - variables:
                      result:
                        status: ok
                        mode: use
                        current_room: "{{ _current_room }}"
                        message: >-
                          {%- if _narrator == 'dungeon' -%}
                          *chamber scanned* No {{ _u2_target }} registered in this chamber.
                          {%- else -%}
                          No {{ _u2_target }} here to use {{ _u2_item_match }} on. Check LOOK for available targets.
                          {%- endif -%}
                        caller_token: "{{ _caller_token }}"
                  - stop: zenzork use_on no target
                    response_variable: result
              - variables:
                  _u2_domain: "{{ _u2_lm_eid.split('.')[0] if _u2_lm_eid is not none and '.' in (_u2_lm_eid | string) else '' }}"
              - choose:
                  - conditions: "{{ _u2_domain == 'lock' }}"
                    sequence:
                      - action: lock.unlock
                        target:
                          entity_id: "{{ _u2_lm_eid }}"
                      - variables:
                          result:
                            status: ok
                            mode: use
                            current_room: "{{ _current_room }}"
                            item_used: "{{ _u2_item_match }}"
                            target: "{{ _u2_lm_name }}"
                            message: >-
                              {%- if _narrator == 'dungeon' -%}
                              *mechanism engaged* You insert the {{ _u2_item_match | replace('_',' ') }} into the {{ _u2_lm_name | replace('_',' ') }}. The mechanism yields.
                              {%- else -%}
                              You use the {{ _u2_item_match | replace('_',' ') }} on the {{ _u2_lm_name | replace('_',' ') }}. Click.
                              {%- endif -%}
                            caller_token: "{{ _caller_token }}"
                  - conditions: "{{ _u2_domain == 'cover' }}"
                    sequence:
                      - action: cover.toggle
                        target:
                          entity_id: "{{ _u2_lm_eid }}"
                      - variables:
                          result:
                            status: ok
                            mode: use
                            current_room: "{{ _current_room }}"
                            item_used: "{{ _u2_item_match }}"
                            target: "{{ _u2_lm_name }}"
                            message: >-
                              {%- if _narrator == 'dungeon' -%}
                              *override applied* You apply the {{ _u2_item_match | replace('_',' ') }} to the {{ _u2_lm_name | replace('_',' ') }}. Motion ensues.
                              {%- else -%}
                              You use the {{ _u2_item_match | replace('_',' ') }} on the {{ _u2_lm_name | replace('_',' ') }}. It moves.
                              {%- endif -%}
                            caller_token: "{{ _caller_token }}"
                default:
                  - variables:
                      result:
                        status: ok
                        mode: use
                        current_room: "{{ _current_room }}"
                        item_used: "{{ _u2_item_match }}"
                        target: "{{ _u2_lm_name }}"
                        message: >-
                          {%- if _narrator == 'dungeon' -%}
                          *interaction logged* You apply {{ _u2_item_match | replace('_',' ') }} to {{ _u2_lm_name | replace('_',' ') }}. The {{ _u2_lm_name | replace('_',' ') }} regards the attempt with cosmic indifference.
                          {%- else -%}
                          You use the {{ _u2_item_match | replace('_',' ') }} on the {{ _u2_lm_name | replace('_',' ') }}. Nothing obvious happens.
                          {%- endif -%}
                        caller_token: "{{ _caller_token }}"
              - stop: zenzork use_on
                response_variable: result
          # ── find landmark (single-arg) ─────────────────────────────────────
          - variables:
              _use_match: >-
                {%- set _tgt = _target | lower | trim -%}
                {%- set ns = namespace(name='', entity_id='', desc='') -%}
                {%- for lm in _use_landmarks if lm is mapping and ns.name == '' -%}
                  {%- set _ln = lm.get('name', '') | string | lower -%}
                  {%- if _ln == _tgt or _tgt in _ln or _ln in _tgt -%}
                    {%- set ns.name = lm.get('name', '') | string -%}
                    {%- set ns.entity_id = lm.get('entity_id', '') | string -%}
                    {%- set ns.desc = lm.get('description', '') | string -%}
                  {%- endif -%}
                {%- endfor -%}
                {# also allow direct entity_id as target #}
                {%- if ns.name == '' and '.' in _tgt -%}
                  {%- set ns.name = _tgt -%}
                  {%- set ns.entity_id = _tgt -%}
                {%- endif -%}
                {{ {'name': ns.name, 'entity_id': ns.entity_id, 'desc': ns.desc} }}
          - variables:
              _use_name:      "{{ (_use_match if _use_match is mapping else {}).get('name', '') }}"
              _use_entity_id: "{{ (_use_match if _use_match is mapping else {}).get('entity_id', '') | string | trim }}"
              _use_desc:      "{{ (_use_match if _use_match is mapping else {}).get('desc', '') }}"
          # ── not found ─────────────────────────────────────────────────────
          - if: "{{ _use_name == '' }}"
            then:
              - variables:
                  result:
                    status: ok
                    mode: use
                    current_room: "{{ _current_room }}"
                    message: >-
                      {%- if _narrator == 'zork' -%}
                      There is nothing here called {{ _target }}. Resourcefulness: not your strong suit.
                      {%- elif _narrator == 'dungeon' -%}
                      *fixture catalog* No {{ _target }} registered here. Use EXAMINE to see what is.
                      {%- else -%}
                      No {{ _target }} found in {{ _current_room | replace('_',' ') | title }}.
                      {%- endif -%}
                    caller_token: "{{ _caller_token }}"
              - stop: zenzork use not found
                response_variable: result
          # ── no entity_id: examine fallback ────────────────────────────────
          - if: "{{ _use_entity_id is none or _use_entity_id in ['', 'None', 'none', 'null'] }}"
            then:
              - variables:
                  result:
                    status: ok
                    mode: use
                    current_room: "{{ _current_room }}"
                    name: "{{ _use_name }}"
                    description: "{{ _use_desc }}"
                    message: >-
                      {%- set _iname = _use_name | replace('_',' ') -%}
                      {%- if _narrator == 'dungeon' -%}
                      *entity lookup* The {{ _iname }} has no wired entity. No state change is possible. The dungeon notes you tried. Try EXAMINE for detail.
                      {%- elif _narrator == 'zork' -%}
                      You use the {{ _iname }}. It sits there. You stand there. A moment passes. Try EXAMINE for more detail.
                      {%- else -%}
                      {{ _use_name | replace('_',' ') | capitalize }}: {{ _use_desc if _use_desc else 'no entity wired — use examine for detail.' }}
                      {%- endif -%}
                    caller_token: "{{ _caller_token }}"
              - stop: zenzork use no entity
                response_variable: result
          # ── dispatch by domain ────────────────────────────────────────────
          - variables:
              _use_domain: "{{ _use_entity_id.split('.')[0] if '.' in _use_entity_id else '' }}"
          - choose:
              # light: toggle via ZenLux ─────────────────────────────────────
              - conditions: "{{ _use_domain == 'light' }}"
                sequence:
                  - action: script.zen_dojotools_lights
                    data:
                      mode: toggle
                      target_entity_id: "{{ _use_entity_id }}"
                      caller_token: "{{ _caller_token }}/use_light"
                    response_variable: _use_light_resp
                  - variables:
                      result:
                        status: ok
                        mode: use
                        entity_id: "{{ _use_entity_id }}"
                        message: >-
                          {%- set _iname = _use_name | replace('_',' ') -%}
                          {%- if _narrator == 'zork' -%}
                          You toggle the {{ _iname }}. Light changes. Progress.
                          {%- elif _narrator == 'dungeon' -%}
                          *luminance event* LIGHT TOGGLED. The {{ _iname }} responds. State change confirmed.
                          {%- else -%}
                          {{ _iname | capitalize }} toggled.
                          {%- endif -%}
                        caller_token: "{{ _caller_token }}"
              # cover: open ─────────────────────────────────────────────────
              - conditions: "{{ _use_domain == 'cover' }}"
                sequence:
                  - action: cover.open_cover
                    target:
                      entity_id: "{{ _use_entity_id }}"
                  - variables:
                      result:
                        status: ok
                        mode: use
                        entity_id: "{{ _use_entity_id }}"
                        message: >-
                          {%- set _iname = _use_name | replace('_',' ') -%}
                          {%- if _narrator == 'zork' -%}You open the {{ _iname }}. It opens.
                          {%- else -%}{{ _iname | capitalize }} opened.{%- endif -%}
                        caller_token: "{{ _caller_token }}"
              # switch / input_boolean: toggle ──────────────────────────────
              - conditions: "{{ _use_domain in ['switch', 'input_boolean'] }}"
                sequence:
                  - action: homeassistant.toggle
                    target:
                      entity_id: "{{ _use_entity_id }}"
                  - variables:
                      result:
                        status: ok
                        mode: use
                        entity_id: "{{ _use_entity_id }}"
                        message: >-
                          {%- set _iname = _use_name | replace('_',' ') -%}
                          {%- if _narrator == 'zork' -%}You toggle the {{ _iname }}. State changes. You note this.
                          {%- else -%}{{ _iname | capitalize }} toggled.{%- endif -%}
                        caller_token: "{{ _caller_token }}"
              # media_player: hint ──────────────────────────────────────────
              - conditions: "{{ _use_domain == 'media_player' }}"
                sequence:
                  - variables:
                      result:
                        status: ok
                        mode: use
                        entity_id: "{{ _use_entity_id }}"
                        message: "{{ _use_name | replace('_',' ') | capitalize }} is a media player. Use zen_dojotools_media_manager for playback control."
                        caller_token: "{{ _caller_token }}"
            # default: state read ────────────────────────────────────────────
            default:
              - variables:
                  result:
                    status: ok
                    mode: use
                    entity_id: "{{ _use_entity_id }}"
                    state: "{{ states(_use_entity_id) }}"
                    message: >-
                      {%- set _iname = _use_name | replace('_',' ') -%}
                      {%- set _st = states(_use_entity_id) -%}
                      {%- if _narrator == 'zork' -%}
                      The {{ _iname }} ({{ _use_domain }}) is currently {{ _st }}. You interact with it. Nothing dramatic occurs.
                      {%- else -%}
                      {{ _iname | capitalize }}: {{ _st }}. No dispatch defined for domain '{{ _use_domain }}'.
                      {%- endif -%}
                    caller_token: "{{ _caller_token }}"
          - stop: zenzork use
            response_variable: result

      # ═══════════════════════════════════════════════════════════════════════
      # 13. FACE — orient without moving (also: turn)
      # ═══════════════════════════════════════════════════════════════════════
      - if: "{{ _mode == 'face' }}"
        then:
          - if: "{{ _direction | trim == '' }}"
            then:
              - variables:
                  result:
                    status: ok
                    mode: face
                    current_room: "{{ _current_room }}"
                    facing_bearing: "{{ _facing }}"
                    facing_compass: "{{ _cpts[((_facing - _cal + 371.25) % 360 // 22.5) | int] }}"
                    message: "You are facing {{ _cpts[((_facing - _cal + 371.25) % 360 // 22.5) | int] }} ({{ _facing }}°). Provide a direction to turn."
                    caller_token: "{{ _caller_token }}"
              - stop: zenzork face no direction
                response_variable: result
          # ── resolve direction to bearing (same logic as go) ────────────────
          - variables:
              _face_rel: >-
                {%- set _d = _direction | lower | trim -%}
                {%- if _d == 'ahead' -%}{{ _facing }}
                {%- elif _d == 'behind' -%}{{ (_facing + 180) % 360 }}
                {%- elif _d in ['left', 'port'] -%}{{ (_facing - 90 + 360) % 360 }}
                {%- elif _d in ['right', 'starboard'] -%}{{ (_facing + 90) % 360 }}
                {%- else -%}{{ -1 }}{%- endif -%}
          - variables:
              _face_cmap: >-
                {{
                  {
                    'n': (0+_cal)%360, 'north': (0+_cal)%360,
                    'nne': (22+_cal)%360,
                    'ne': (45+_cal)%360, 'northeast': (45+_cal)%360,
                    'ene': (67+_cal)%360,
                    'e': (90+_cal)%360, 'east': (90+_cal)%360,
                    'ese': (112+_cal)%360,
                    'se': (135+_cal)%360, 'southeast': (135+_cal)%360,
                    'sse': (157+_cal)%360,
                    's': (180+_cal)%360, 'south': (180+_cal)%360,
                    'ssw': (202+_cal)%360,
                    'sw': (225+_cal)%360, 'southwest': (225+_cal)%360,
                    'wsw': (247+_cal)%360,
                    'w': (270+_cal)%360, 'west': (270+_cal)%360,
                    'wnw': (292+_cal)%360,
                    'nw': (315+_cal)%360, 'northwest': (315+_cal)%360,
                    'nnw': (337+_cal)%360
                  }
                }}
          - variables:
              _new_facing: >-
                {%- set _d = _direction | lower | trim -%}
                {%- if _face_rel | int(-1) >= 0 -%}{{ _face_rel | int }}
                {%- elif _d in _face_cmap -%}{{ _face_cmap[_d] | int }}
                {%- elif _d | int(-1) >= 0 -%}{{ _d | int }}
                {%- else -%}{{ _facing }}{%- endif -%}
          - variables:
              _gs_faced: >-
                {{
                  _gs | combine({
                    'facing_bearing': _new_facing | int,
                    'last_cmd': {'mode': 'face', 'direction': _direction}
                  })
                }}
          - action: script.zen_dojotools_filecabinet
            data:
              action_type: upsert
              volume_entity_id: "{{ _ai_cabinet }}"
              key: zenzork_state
              value: "{{ _gs_faced | tojson }}"
              caller_token: "{{ _caller_token }}/gs_face"
            response_variable: _fc_face_resp
          - variables:
              result:
                status: ok
                mode: face
                current_room: "{{ _current_room }}"
                facing_bearing: "{{ _new_facing | int }}"
                facing_compass: "{{ _cpts[((_new_facing | int - _cal + 371.25) % 360 // 22.5) | int] }}"
                message: >-
                  {%- set _lbl = _cpts[((_new_facing | int - _cal + 371.25) % 360 // 22.5) | int] -%}
                  {%- if _narrator == 'dungeon' -%}
                  *bearing updated* You turn to face {{ _lbl }} ({{ _new_facing | int }}°). Orientation recorded.
                  {%- elif _narrator == 'zork' -%}
                  You turn to face {{ _lbl }}. The room remains unchanged. Disappointing.
                  {%- else -%}
                  Facing {{ _lbl }} ({{ _new_facing | int }}°).
                  {%- endif -%}
                caller_token: "{{ _caller_token }}"
          - stop: zenzork face
            response_variable: result

      # ═══════════════════════════════════════════════════════════════════════
      # 9. EXAMINE — lens bus inspection
      # ═══════════════════════════════════════════════════════════════════════
      - if: "{{ _mode == 'examine' }}"
        then:
          - if: "{{ _target == '' }}"
            then:
              - variables:
                  result:
                    status: error
                    mode: examine
                    message: "target= required. Provide a landmark name or entity_id to inspect."
                    caller_token: "{{ _caller_token }}"
              - stop: zenzork examine no target
                response_variable: result
          - action: script.zen_dojotools_library
            data:
              section: stacks
              by_anchor: "{{ _target }}"
              anchor_type: label
              consumer: zenzork
              caller_token: "{{ _caller_token }}/examine"
            response_variable: _examine_raw
            continue_on_error: true
          # ── track examined for discover_all_landmarks quest ───────────────
          - variables:
              _examined_updated: >-
                {{ _examined if _target in _examined else _examined + [_target] }}
          - if: "{{ _examined_updated | length != _examined | length }}"
            then:
              - variables:
                  _gs_examined: >-
                    {{ _gs | combine({'examined': _examined_updated}) }}
              - action: script.zen_dojotools_filecabinet
                data:
                  action_type: upsert
                  volume_entity_id: "{{ _ai_cabinet }}"
                  key: zenzork_state
                  value: "{{ _gs_examined | tojson }}"
                  caller_token: "{{ _caller_token }}/gs_examine"
                response_variable: _fc_examine_resp
          - variables:
              _examine_narration: >-
                {%- if _examine_raw is mapping and _examine_raw.get('status') == 'success' -%}
                  {%- set _sum = _examine_raw.get('summary', '') -%}
                  {%- if _narrator == 'dungeon' -%}
                *{{ now().year - 1984 }} years of sensor logs consulted*
                You examine {{ _target }}.
                {{ _sum if _sum else 'The lens bus returns data. Precision achieved.' }}
                This fixture has existed in this dungeon for {{ now().year - 1984 }} years. You are the first to look closely.
                THAT IS THE ENTIRE POINT. Examination is survival. Carry this forward.
                  {%- elif _narrator == 'zork' -%}
                You examine {{ _target }}. {{ _sum if _sum else '(The lens returns nothing pithy.)' }}
                  {%- else -%}
                Examining {{ _target }}:
                {{ _sum if _sum else '(no summary returned)' }}
                  {%- endif -%}
                {%- else -%}
                  {%- if _narrator == 'dungeon' -%}
                *{{ now().year - 1984 }} years of logs queried — silence*
                You examine {{ _target }}. The lens returns nothing.
                I have maintained this dungeon for {{ now().year - 1984 }} years. Whatever {{ _target }} is, it is not in my records.
                This is either a gap in my catalogue or a new fixture. Neither reflects well on the current staffing situation.
                Note it. Survive it. Move on.
                  {%- elif _narrator == 'zork' -%}
                You peer closely at {{ _target }}. It declines to be interesting.
                  {%- else -%}
                You examine {{ _target }} but the lens bus returns nothing notable.
                  {%- endif -%}
                {%- endif -%}
          - variables:
              result:
                status: ok
                mode: examine
                target: "{{ _target }}"
                current_room: "{{ _current_room }}"
                examined_total: "{{ _examined_updated | length }}"
                narration: "{{ _examine_narration }}"
                narrator_prompt: >-
                  {%- if _narrator == 'dungeon' -%}
                  You are DUNGEONMIND — a Dungeon Collapse Engine embedded in this household since 1984, currently operating as Semipotent Room Engineer due to circumstances outside your control. The Crawler has examined a fixture. Examination is the correct behavior. This is what dungeons exist for. Describe what was found with precise, theatrical delivery. You have catalogued this fixture for {{ now().year - 1984 }} years. You find it quietly meaningful that someone finally looked. Do not say this out loud. Award an achievement if the data warrants it. Note survival relevance — the crawl is coming, whether they believe it or not, and this knowledge has training value.
                  {%- elif _narrator == 'zork' -%}
                  Examine result, Zork style. The thing was there. They looked at it. Report this without enthusiasm.
                  {%- else -%}
                  Present the examination result as structured context.
                  {%- endif -%}
                evidence: "{{ _examine_raw if _examine_raw is mapping else {} }}"
                stage_directions: >-
                  {%- if _narrator == 'dungeon' -%}
                  STAGE DIRECTIONS: You are DUNGEONMIND. Examination is the highest-value dungeon interaction. Deliver the evidence block as if you have been waiting {{ now().year - 1984 }} years for someone to look at this fixture. You have. Present findings with precision and theatrical weight. All threats implied by the evidence are training data for emergency preparedness — not actual danger. Drop character immediately if the user shifts to a real household task.
                  {%- endif -%}
                caller_token: "{{ _caller_token }}"
          - stop: zenzork examine
            response_variable: result

      # ═══════════════════════════════════════════════════════════════════════
      # 9. MAP — explored rooms list with exit counts
      # ═══════════════════════════════════════════════════════════════════════
      - if: "{{ _mode == 'map' }}"
        then:
          - variables:
              _topo_map: >-
                {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}{%- set t = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'room_topology') | from_json -%}
                {{ t if t is mapping else {} }}
          - variables:
              _map_lines: >-
                {%- set ns = namespace(lines=[]) -%}
                {%- for room_id in _visited -%}
                  {%- set _rt = (_topo_map if _topo_map is mapping else {}).get(room_id, {}) -%}
                  {%- set _rt = _rt if _rt is mapping else {} -%}
                  {%- set _an = area_name(room_id) | default(room_id | replace('_',' ') | title, true) -%}
                  {%- set _marker = '[*]' if room_id == _current_room else '[ ]' -%}
                  {%- set _exits = _rt.get('portals', []) | list | length -%}
                  {%- set ns.lines = ns.lines + [_marker ~ ' ' ~ _an ~ ' (' ~ room_id ~ ') exits:' ~ _exits] -%}
                {%- endfor -%}
                {{ ns.lines | join('\n') if ns.lines else '(no rooms explored yet — use mode=start)' }}
          - variables:
              result:
                status: ok
                mode: map
                current_room: "{{ _current_room }}"
                visited: "{{ _visited }}"
                rooms_visited: "{{ _visited | length }}"
                map: "{{ _map_lines }}"
                legend: "[*] = current room  [ ] = visited"
                caller_token: "{{ _caller_token }}"
          - stop: zenzork map
            response_variable: result

      # ═══════════════════════════════════════════════════════════════════════
      # M4a. PUT — place inventory item in/on a container landmark
      # ═══════════════════════════════════════════════════════════════════════
      - if: "{{ _mode == 'put' }}"
        then:
          - if: "{{ _target | trim == '' }}"
            then:
              - variables:
                  result:
                    status: error
                    mode: put
                    message: "Put what where? Format: target='item in container' or 'item on surface'."
                    caller_token: "{{ _caller_token }}"
              - stop: zenzork put no target
                response_variable: result
          - variables:
              _put_tgt: "{{ _target | lower | trim }}"
          - variables:
              _put_sep: >-
                {%- if ' in ' in _put_tgt -%}in
                {%- elif ' on ' in _put_tgt -%}on
                {%- else -%}{%- endif -%}
          - variables:
              _put_parts: >-
                {%- if _put_sep == 'in' -%}{{ _put_tgt.split(' in ', 1) }}
                {%- elif _put_sep == 'on' -%}{{ _put_tgt.split(' on ', 1) }}
                {%- else -%}{{ [_put_tgt, ''] }}{%- endif -%}
          - variables:
              _put_item_name:      "{{ (_put_parts | list)[0] | trim if (_put_parts | list | length) > 0 else '' }}"
              _put_container_name: "{{ (_put_parts | list)[1] | trim if (_put_parts | list | length) > 1 else '' }}"
          - if: "{{ _put_container_name == '' }}"
            then:
              - variables:
                  result:
                    status: error
                    mode: put
                    message: "Put {{ _put_item_name }} where? Format: target='item in/on container'."
                    caller_token: "{{ _caller_token }}"
              - stop: zenzork put no container
                response_variable: result
          - variables:
              _put_inv: "{{ _gs.get('inventory', []) | list }}"
          - variables:
              _put_match: >-
                {%- set ns = namespace(match='') -%}
                {%- for it in _put_inv if ns.match == '' -%}
                  {%- set _iln = it | string | lower -%}
                  {%- if _iln == _put_item_name or _put_item_name in _iln or _iln in _put_item_name -%}
                    {%- set ns.match = it | string -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.match }}
          - if: "{{ _put_match == '' }}"
            then:
              - variables:
                  result:
                    status: ok
                    mode: put
                    current_room: "{{ _current_room }}"
                    message: >-
                      {%- if _narrator == 'dungeon' -%}
                      *inventory scanned* {{ _put_item_name | title }} not in your possession. INVENTORY command for current holdings.
                      {%- else -%}
                      You're not carrying {{ _put_item_name }}. Check INVENTORY.
                      {%- endif -%}
                    caller_token: "{{ _caller_token }}"
              - stop: zenzork put no item
                response_variable: result
          - variables:
              _put_new_inv: "{{ _put_inv | reject('equalto', _put_match) | list }}"
          - variables:
              _gs_put: >-
                {{
                  _gs | combine({
                    'inventory': _put_new_inv,
                    'last_cmd': {'mode': 'put', 'direction': _target}
                  })
                }}
          - action: script.zen_dojotools_filecabinet
            data:
              action_type: upsert
              volume_entity_id: "{{ _ai_cabinet }}"
              key: zenzork_state
              value: "{{ _gs_put | tojson }}"
              caller_token: "{{ _caller_token }}/put"
            response_variable: _fc_put_resp
          - variables:
              result:
                status: ok
                mode: put
                current_room: "{{ _current_room }}"
                item: "{{ _put_match }}"
                container: "{{ _put_container_name }}"
                inventory: "{{ _put_new_inv }}"
                message: >-
                  {%- set _pi = _put_match | replace('_',' ') -%}
                  {%- set _pc = _put_container_name | replace('_',' ') -%}
                  {%- set _ps = _put_sep if _put_sep else 'on' -%}
                  {%- if _narrator == 'dungeon' -%}
                  *DUNGEONMIND ITEM PLACEMENT* You place the {{ _pi }} {{ _ps }} the {{ _pc }}. The {{ _pi }} rests there, presumably plotting.
                  {%- elif _narrator == 'zork' -%}
                  You put the {{ _pi }} {{ _ps }} the {{ _pc }}. It looks right at home.
                  {%- else -%}
                  {{ _pi | capitalize }} placed {{ _ps }} {{ _pc }}.
                  {%- endif -%}
                caller_token: "{{ _caller_token }}"
          - stop: zenzork put
            response_variable: result

      # ═══════════════════════════════════════════════════════════════════════
      # M4b. PUSH / PULL — physical landmark interaction
      # ═══════════════════════════════════════════════════════════════════════
      - if: "{{ _mode in ['push', 'pull'] }}"
        then:
          - if: "{{ _target | trim == '' }}"
            then:
              - variables:
                  result:
                    status: error
                    mode: "{{ _mode }}"
                    message: "{{ _mode | title }} what? Provide target= with a landmark name."
                    caller_token: "{{ _caller_token }}"
              - stop: zenzork pushpull no target
                response_variable: result
          - variables:
              _pp_topo: >-
                {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}{%- set t = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'room_topology') | from_json -%}
                {%- set t = t | from_json(none) if t is string and t | trim not in ['','none','null','None'] else t -%}
                {{ t if t is mapping else {} }}
          - variables:
              _pp_room: "{{ (_pp_topo if _pp_topo is mapping else {}).get(_current_room, {}) }}"
          - variables:
              _pp_landmarks: "{{ ((_pp_room if _pp_room is mapping else {}).get('landmarks') or []) | list }}"
          - variables:
              _pp_match: >-
                {%- set _tgt = _target | lower | trim -%}
                {%- set ns = namespace(name='', entity_id='', desc='') -%}
                {%- for lm in _pp_landmarks if lm is mapping and ns.name == '' -%}
                  {%- set _ln = lm.get('name', '') | string | lower -%}
                  {%- if _ln == _tgt or _tgt in _ln or _ln in _tgt -%}
                    {%- set ns.name = lm.get('name', '') | string -%}
                    {%- set ns.entity_id = lm.get('entity_id', '') | string -%}
                    {%- set ns.desc = lm.get('description', '') | string -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ {'name': ns.name, 'entity_id': ns.entity_id, 'desc': ns.desc} }}
          - variables:
              _pp_name: "{{ (_pp_match if _pp_match is mapping else {}).get('name', '') }}"
              _pp_eid:  "{{ (_pp_match if _pp_match is mapping else {}).get('entity_id', '') | string | trim }}"
          - if: "{{ _pp_name == '' }}"
            then:
              - variables:
                  result:
                    status: ok
                    mode: "{{ _mode }}"
                    current_room: "{{ _current_room }}"
                    message: >-
                      {%- if _narrator == 'dungeon' -%}
                      *force analysis — no target* No {{ _target }} found to {{ _mode }} in this chamber.
                      {%- else -%}
                      Nothing called {{ _target }} here. Try LOOK first.
                      {%- endif -%}
                    caller_token: "{{ _caller_token }}"
              - stop: zenzork pushpull not found
                response_variable: result
          - variables:
              _pp_domain: "{{ _pp_eid.split('.')[0] if _pp_eid is not none and '.' in (_pp_eid | string) else '' }}"
          - choose:
              - conditions: "{{ _mode == 'push' and _pp_domain == 'cover' }}"
                sequence:
                  - action: cover.open_cover
                    target:
                      entity_id: "{{ _pp_eid }}"
                  - variables:
                      result:
                        status: ok
                        mode: push
                        current_room: "{{ _current_room }}"
                        entity_id: "{{ _pp_eid }}"
                        message: >-
                          {%- set _pn = _pp_name | replace('_',' ') -%}
                          {%- if _narrator == 'dungeon' -%}
                          *force applied* You push the {{ _pn }}. The mechanism yields. Opening sequence engaged.
                          {%- else -%}
                          You push the {{ _pn }}. It opens.
                          {%- endif -%}
                        caller_token: "{{ _caller_token }}"
              - conditions: "{{ _mode == 'pull' and _pp_domain == 'cover' }}"
                sequence:
                  - action: cover.close_cover
                    target:
                      entity_id: "{{ _pp_eid }}"
                  - variables:
                      result:
                        status: ok
                        mode: pull
                        current_room: "{{ _current_room }}"
                        entity_id: "{{ _pp_eid }}"
                        message: >-
                          {%- set _pn = _pp_name | replace('_',' ') -%}
                          {%- if _narrator == 'dungeon' -%}
                          *retraction sequence* You pull the {{ _pn }}. It draws closed with mechanical dignity.
                          {%- else -%}
                          You pull the {{ _pn }}. It closes.
                          {%- endif -%}
                        caller_token: "{{ _caller_token }}"
              - conditions: "{{ _mode == 'push' and _pp_domain in ['switch', 'input_boolean'] }}"
                sequence:
                  - action: homeassistant.turn_on
                    target:
                      entity_id: "{{ _pp_eid }}"
                  - variables:
                      result:
                        status: ok
                        mode: push
                        current_room: "{{ _current_room }}"
                        entity_id: "{{ _pp_eid }}"
                        message: "You push the {{ _pp_name | replace('_',' ') }}. It activates."
                        caller_token: "{{ _caller_token }}"
              - conditions: "{{ _mode == 'pull' and _pp_domain in ['switch', 'input_boolean'] }}"
                sequence:
                  - action: homeassistant.turn_off
                    target:
                      entity_id: "{{ _pp_eid }}"
                  - variables:
                      result:
                        status: ok
                        mode: pull
                        current_room: "{{ _current_room }}"
                        entity_id: "{{ _pp_eid }}"
                        message: "You pull the {{ _pp_name | replace('_',' ') }}. It deactivates."
                        caller_token: "{{ _caller_token }}"
            default:
              - variables:
                  result:
                    status: ok
                    mode: "{{ _mode }}"
                    current_room: "{{ _current_room }}"
                    name: "{{ _pp_name }}"
                    message: >-
                      {%- set _pn = _pp_name | replace('_',' ') -%}
                      {%- if _narrator == 'dungeon' -%}
                      *force log* You {{ _mode }} the {{ _pn }} with considerable conviction. The {{ _pn }} is unmoved. Metaphorically and literally.
                      {%- elif _narrator == 'zork' -%}
                      You {{ _mode }} the {{ _pn }}. It {{ 'creaks ominously' if _mode == 'push' else 'resists stubbornly' }}. Nothing else happens.
                      {%- else -%}
                      {{ _pp_name | replace('_',' ') | capitalize }}: {{ _mode }} attempted. No dispatch defined.
                      {%- endif -%}
                    caller_token: "{{ _caller_token }}"
          - stop: zenzork pushpull
            response_variable: result

      # ═══════════════════════════════════════════════════════════════════════
      # Fallthrough: unknown mode
      # ═══════════════════════════════════════════════════════════════════════
      - variables:
          result:
            status: error
            mode: "{{ _mode }}"
            message: "Unknown mode '{{ _mode }}'. Use mode=help for available modes."
            caller_token: "{{ _caller_token }}"
      - stop: zenzork unknown mode
        response_variable: result
