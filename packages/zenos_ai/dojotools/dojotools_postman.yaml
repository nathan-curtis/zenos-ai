                    "sp1_not_yet_implemented": [
                      "Per-target user cabinet resolution (all targets use default user cabinet)",
                      "Family escalation loop",
                      "Work gate activation condition",
                      "content_policy per channel"
                    ],
                    "sp2_label_routing": "When zen_postman + zen_channel_push + person labels applied to device_tracker.* entities, set push_device_labels: true in user postman_profile to enable label intersection routing. Until then push_targets list (notify group names) is the override mechanism."
                  } | tojson
