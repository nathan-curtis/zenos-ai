                      "response_timeout_s": 60,
                      "caller_token": "door_lock_prompt",
                      "_response_shape": {
                        "status": "dispatched",
                        "pm_tag": "pm_1744000000",
                        "ack_action": "YES",
                        "ack_timed_out": false,
                        "tier": "medium",
                        "channels": ["push"]
                      }
                    },

                    "example_author_policy": {
                      "_comment": "Seed postman_profile in all three cabinets. Run these three calls once during setup. scope_id must be the RESOLVED cabinet entity (the sensor that holds the active cabinet state, not the cabinet selector). Use update_existing for all three — safe to re-run to update.",
                      "_step_1_household": {
                        "_comment": "House ceiling: sleep gate + life safety bypass. Controls audio suppression during sleep and absolute override threshold.",
                        "mode": "author_policy",
                        "scope_id": "sensor.zen_default_household_cabinet_resolved",
