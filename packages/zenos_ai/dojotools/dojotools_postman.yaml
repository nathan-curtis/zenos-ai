                        "response_type": "yes_no",
                        "response_timeout_s": 60,
                        "notification_data": {"channel": "Security", "color": "#f44336"},
                        "caller_token": "front_door_motion"
                      },
                      "_response_shape": {
                        "status": "dispatched",
                        "pm_tag": "pm_1744000000",
                        "ack_action": "YES",
                        "ack_timed_out": false
                      }
                    },
                    "example_generated_image_question": {
                      "_comment": "Generate an image first, then send it with a question. Two fast calls — no timeout risk.",
                      "step_1_generate": {
