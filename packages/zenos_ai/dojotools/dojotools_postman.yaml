###############################################################################
# ZenOS-AI DojoTools: Postman
# Version: 5.1.0
#
# Purpose:
#   Unified household communications layer. Resolves notification intent
#   against the authority stack (house ceiling → family floor → user
#   preference) and dispatches to appropriate channels.
#
# Modes:
#   resolve              — read side: resolve authority stack, return what
#                          would happen. No dispatch. No log. Browse/debug.
#   resolve_and_dispatch — resolve + dispatch + log. Full send.
#   author_policy        — write/update a postman_profile in a cabinet
#   help                 — return drawer schemas, seeds, example calls
#
# Authority stack (resolve / resolve_and_dispatch):
#   house  = ceiling: sleep gate, work gate, life_safety_bypass (9)
#   family = floor:   escalation requirements (SP1)
#   user   = preference: urgency_tiers, away_policy, tts_policy
#
# Cabinet drawers:
#   household cabinet  → postman_profile
#   family cabinet     → postman_profile
#   user cabinet       → postman_profile
#   kata cabinet       → zen_postman_log (delivery record)
#
# SP1 queue:
#   - Per-target user cabinet resolution (multi-user routing)
#   - Ack watch / response_required escalation
#   - Family escalation loop
#   - zen_postman_log per-entry TTL + list log, ack/timeout/dispatched (v1.2.3+)
#   - mode=clear_tag — remove log entry by pm_tag (v5.1.0)
#   - Work gate activation condition (currently checks postman_profile only)
#   - content_policy per channel
###############################################################################

script:
  zen_dojotools_postman:
    alias: Zen DojoTools Postman
    mode: parallel
    max: 5
    icon: mdi:envelope-outline
    description: >-
      Unified household communications layer. Resolves intent against the
      authority stack (house ceiling → family floor → user preference) and
      dispatches to the appropriate channel(s).

    fields:
      mode:
        name: Operation Mode
        description: >-
          resolve — read side: resolve authority stack, return what would
          happen. No dispatch, no log write. Use for browse and debug.
          resolve_and_dispatch — resolve + dispatch + log. Full send.
          direct_dispatch — backwards-compat NR replacement. Bypasses authority
          stack; dispatches straight to notify.* like the old notification_router.
          Requires override=true — the "I know what I'm doing" switch. Both
          successful dispatches and blocked attempts are logged.
          author_policy — write/update a postman_profile in a cabinet drawer.
          clear_tag — remove a log entry from zen_postman_log by pm_tag (pass as tag=<pm_tag>).
          help — return drawer schemas and example calls for setup.
        required: true
        selector:
          select:
            options:
              - resolve
              - resolve_and_dispatch
              - direct_dispatch
              - author_policy
              - clear_tag
              - help
              - tool_manifest

      target:
        name: Target Identity
        description: >-
          person.* entity for the notification target.
          SP1: resolves to that person's user cabinet. For now: default user cabinet.
        required: false
        selector:
          text:

      urgency:
        name: Urgency Level
        description: "1–10. Maps to tier: 1-3=low, 4-6=medium, 7-8=high, 9-10=critical."
        required: false
        default: 1
        selector:
          number:
            min: 1
            max: 10
            step: 1

      message:
        name: Message Content
        description: The text to deliver.
        required: false
        selector:
          text:
            multiline: true

      title:
        name: Title
        description: Optional notification title.
        required: false
        selector:
          text:

      channel_hint:
        name: Channel Hint
        description: >-
          Preferred channel (push, tts, teams). Postman may override per policy.
          Prepended to the tier's channel list if provided — still subject to
          house gates and away policy.
        required: false
        selector:
          text:

      response_required:
        name: Response Required
        description: "If true, delivery record is flagged for ack. SP1: ack watch not yet implemented."
        required: false
        default: false
        selector:
          boolean:

      image_entity:
        name: Image / Camera Entity
        description: >-
          Any HA image or camera entity to attach to the push notification.
          image.zen_image_* slots  → /local/zen_<slot>.jpg
          Other image.*            → entity_picture attribute URL
          camera.*                 → /api/camera_proxy/<entity_id> (current frame)
          Takes precedence over image_url. Ignored if image_prompt is set.
        required: false
        selector:
          entity:
            domain:
              - image
              - camera

      image_url:
        name: Image URL
        description: >-
          URL or local path for an image to attach to the push notification.
          Local HA media: /media/local/snapshots/camera/last_motion.jpg
          Local www (unsecured): /local/snapshots/camera/last_motion.jpg
          Use image_entity instead for zen_dojotools_generate_image slots.
        required: false
        selector:
          text:

      audio_url:
        name: Audio URL
        description: >-
          URL or local path for an audio file to attach to the push notification.
          Supported: AIFF, WAV, MP3, MPEG4 Audio (max 5 MB).
          Local HA media: /media/local/audio/briefing.mp3
          Companion app only — ignored on non-mobile targets.
        required: false
        selector:
          text:

      tag:
        name: Notification Tag
        description: >-
          Tag for replace/update/clear behavior. Notifications with the same
          tag replace each other. Required for alert_once, persistent, sticky
          update patterns. Passed as data.tag.
        required: false
        selector:
          text:

      response_type:
        name: Response Type
        description: >-
          Action button set appended to the notification. Postman waits for
          the response up to response_timeout_s. All ack_action values are
          normalized to canonical: yes/no/ok/cancel/ignore/ack/approve/deny/flag.
          none        — no buttons, no wait (default)
          yes_no      — Yes / No
          yes_no_ignore — Yes / No / Ignore
          ok_cancel   — Ok / Cancel
          acknowledge — Got it (single dismiss button)
          agent_auth  — Approve / Deny / Flag. Push-only (TTS stripped — voice
                        endpoints cannot verify identity). Timeout = deny.
                        FLAG fires zen_event(kind: agent_auth_flagged) for
                        incident handlers. Use when an agent requests a
                        privileged action requiring verified human consent.
          custom      — no buttons injected; supply your own via
                        notification_data.actions using canonical action names
                        or known aliases (proceed→ok, stop→cancel, later→ignore,
                        confirm→ok, abort→cancel, snooze→ignore, done→ack).
                        Postman still waits and normalizes the response.
        required: false
        default: none
        selector:
          select:
            options:
              - none
              - yes_no
              - yes_no_ignore
              - ok_cancel
              - acknowledge
              - agent_auth
              - custom

      response_timeout_s:
        name: Response Timeout (seconds)
        description: >-
          How long to wait for a button tap before timing out.
          Only active when response_type is set. Default 60s.
          Extended range (up to 3600s/1hr) for pre-run / long-window notifications.
        required: false
        default: 60
        selector:
          number:
            min: 10
            max: 3600
            step: 10

      force_audio:
        name: Force Audio on Push
        description: >-
          Bypasses the urgency >= 7 gate for TTS audio attachment. Use for
          testing or when a low-urgency notification genuinely needs the
          handset to speak regardless of tier.
        required: false
        default: false
        selector:
          boolean:

      open_dashboard:
        name: Open Dashboard on Tap
        description: >-
          If true, tapping the push notification navigates to the dashboard
          path defined in the user's postman_profile assist_path field
          (clickAction + url). No-op if assist_path is not set in the profile.
        required: false
        default: false
        selector:
          boolean:

      notification_data:
        name: Notification Data
        description: >-
          Raw data dict passed through to the notify action data field.
          Supports all Android notification options: channel, importance,
          color, notification_icon, sticky, persistent, vibrationPattern,
          alert_once, visibility, timeout, chronometer, progress, car_ui,
          clickAction, ledColor, media_stream, car_ui.
          Merged with image_url, tag, and response_type actions — those
          fields take precedence over keys in this dict.
        required: false
        selector:
          object:

      kata_input:
        name: Kata Input
        description: >-
          Optional kata payload from the ninja summarizer emission pipeline.
          When provided and explicit title/message are not set, derives them
          from component, period, attention, and suggested_act_desc fields.
        required: false
        selector:
          object:

      breakthrough:
        name: Breakthrough Gates
        description: >-
          If true, bypasses the house sleep gate regardless of urgency level.
          Equivalent to urgency >= life_safety_bypass for gate evaluation only.
          Use for urgent situations that must reach the user immediately.
        required: false
        default: false
        selector:
          boolean:

      on_ack:
        name: On-Ack Branch Payloads
        description: >-
          JSON string: dict mapping response action → partial postman call fired
          after this notification's ack resolves.
          Keys: yes / no / ignore / ok / cancel / ack / timeout.
          Each value is a partial postman call dict — any field valid on
          resolve_and_dispatch (message, title, urgency, open_dashboard,
          response_type, on_ack for nesting, etc.).
          Chain max depth: 3 levels.
          Example: {"yes": {"message": "Opening dashboard.", "open_dashboard": true, "urgency": 3}}
          Timeout branch fires when response_timeout_s elapses with no tap.
        required: false
        selector:
          text:

      ack_depth:
        name: Ack Chain Depth
        description: "INTERNAL — auto-managed recursion counter for on_ack chaining. Never set manually."
        required: false
        default: 0
        selector:
          text:

      ack_owner:
        name: Ack Owner
        description: >-
          Who owns this response — the subsystem or script that should receive
          the postman_ack event. Carried verbatim in zen_event(kind: postman_ack).
          Subscribers filter on this field. e.g. autovac, alert_manager, taskmaster.
        required: false
        selector:
          text:

      ack_context:
        name: Ack Context
        description: >-
          Which specific question this is. Disambiguates multiple concurrent
          notifications from the same owner. Carried in postman_ack event.
          e.g. 4pm_run, clean_kitchen, confirm_lock.
        required: false
        selector:
          text:

      # --- Author Policy Fields ---
      scope_id:
        name: Scope Cabinet Entity
        description: >-
          Resolved cabinet entity to write policy into.
          e.g. sensor.zen_default_user_cabinet_resolved
        required: false
        selector:
          text:

      policy_key:
        name: Policy Drawer Key
        description: >-
          Drawer key to write. Always postman_profile — same key in all cabinets.
        required: false
        default: postman_profile
        selector:
          text:

      policy_type:
        name: Policy Type
        description: >-
          new_channel — add a named channel entry (channel_definition must include 'name').
          update_existing — deep-merge channel_definition into existing policy.
        required: false
        selector:
          select:
            options:
              - new_channel
              - update_existing

      channel_definition:
        name: Channel Definition
        description: Structured dict defining the new or updated channel/policy fields.
        required: false
        selector:
          object:

      notification_targets:
        name: Notification Targets
        description: >-
          direct_dispatch only. Named target group(s) to send to — same targets
          as the old notification_router. Admin Devices always fires; all others
          check quiet/work hours unless breakthrough=true.
        required: false
        selector:
          select:
            multiple: true
            options:
              - Admin Devices
              - Family Devices
              - Family Devices (Verbose)
              - Default User Phone
              - Secondary User Phone

      override:
        name: Direct Dispatch Override
        description: >-
          direct_dispatch only. Must be true to proceed — the "I know what I'm
          doing" switch. Confirms you asked the operator before bypassing the
          authority stack. Blocked attempts are logged regardless.
        required: false
        default: false
        selector:
          boolean:

      caller_token:
        name: Caller Token
        description: Opaque correlation token.
        required: false
        selector:
          text:

    sequence:

      # ── 0. Normalize inputs ────────────────────────────────────────────────
      - variables:
          _mode:          "{{ mode | string | trim }}"
          _target:        "{{ target | default('', true) | string | trim }}"
          _urgency:       "{{ urgency | default(1) | int }}"
          _message:       "{{ message | default('', true) | string | trim }}"
          _title:         "{{ title | default('', true) | string | trim }}"
          _channel_hint:  "{{ channel_hint | default('', true) | string | trim }}"
          _response_req:  "{{ response_required | default(false) | bool }}"
          _scope_id:      "{{ scope_id | default('', true) | string | trim }}"
          _policy_key:    "{{ policy_key | default('postman_profile', true) | string | trim }}"
          _policy_type:   "{{ policy_type | default('new_channel', true) }}"
          _channel_def:   "{{ channel_definition | default({}, true) }}"
          _caller_token:  "{{ caller_token | default('', true) | string | trim }}"
          _image_entity:    "{{ image_entity | default('', true) | string | trim }}"
          _image_url:       "{{ image_url | default('', true) | string | trim }}"
          _audio_url:       "{{ audio_url | default('', true) | string | trim }}"
          _tag:           "{{ tag | default('', true) | string | trim }}"
          _response_type:    "{{ response_type | default('none', true) | string | trim }}"
          _response_timeout: "{{ response_timeout_s | default(60) | int }}"
          _notif_extra:      "{{ notification_data | default({}, true) }}"
          _open_dashboard:      "{{ open_dashboard | default(false) | bool(false) }}"
          _force_audio:         "{{ force_audio | default(false) | bool(false) }}"
          _kata_raw:            "{{ kata_input | default({}, true) }}"
          _breakthrough:        "{{ breakthrough | default(false) | bool(false) }}"
          _override:            "{{ override | default(false, true) | bool(false) }}"
          _notif_targets_raw:   "{{ notification_targets | default('Admin Devices', true) }}"
          _ack_depth:           "{{ ack_depth | default(0) | int(0) }}"
          _ack_owner:           "{{ ack_owner | default('', true) | string | trim }}"
          _ack_context:         "{{ ack_context | default('', true) | string | trim }}"
          # Cabinet entity IDs resolved at runtime via label resolver sensors
          _hh_cab:        "{{ states('sensor.zen_default_household_cabinet_resolved') }}"
          _user_cab:      "{{ states('sensor.zen_default_user_cabinet_resolved') }}"
          _family_cab:    "{{ states('sensor.zen_default_family_cabinet_resolved') }}"
          _kata_cab:      "{{ states('sensor.zen_kata_cabinet_resolved') }}"

      # ── 0b. Kata-input fallback + SP1 user cabinet resolution ────────────
      - variables:
          _message: >-
            {%- if _message != '' -%}{{ _message }}
            {%- elif _kata_raw is mapping and _kata_raw | length > 0 -%}
              {{ _kata_raw.get('attention', _kata_raw.get('suggested_act_desc', 'Action required.')) }}
            {%- else -%}{{ _message }}{%- endif -%}
          _title: >-
            {%- if _title != '' -%}{{ _title }}
            {%- elif _kata_raw is mapping and _kata_raw | length > 0 -%}
              {{ (_kata_raw.get('component', '') | replace('_', ' ') | title) ~ ' — ' ~ (_kata_raw.get('period', 'Update') | title) }}
            {%- else -%}{{ _title }}{%- endif -%}
          _resolved_user_cab: >-
            {%- if _target.startswith('person.') -%}
              {%- set _slug = _target.split('.')[1] -%}
              {%- set _cabs = label_entities(_slug) | select('match', 'sensor\\..*cabinet.*resolved') | list -%}
              {{ _cabs | first if _cabs | length > 0 else _user_cab }}
            {%- else -%}
              {{ _user_cab }}
            {%- endif -%}

      # ── 0c. Parse on_ack + depth gate ─────────────────────────────────────
      # Nulled when _ack_depth >= 3 (hard recursion limit).
      - variables:
          _on_ack: >-
            {%- if _ack_depth < 3 and on_ack is mapping and on_ack | length > 0 -%}{{ on_ack }}
            {%- elif _ack_depth < 3 and on_ack is string and on_ack | trim | length > 2 -%}{{ on_ack | trim | from_json }}
            {%- endif -%}

      # ══════════════════════════════════════════════════════════════════════
      # MODE: resolve — read side, no dispatch, no log, no audit event
      # Stop is directly inside this block (level 2) — no nested ifs.
      # Sleep_blocked handled via conditional template, not nested if/stop.
      # ══════════════════════════════════════════════════════════════════════
      - if: "{{ _mode == 'resolve' }}"
        then:

          # ── 1. Read postman_profile from household cabinet ─────────────
          - action: script.zen_dojotools_filecabinet
            data:
              action_type: read
              show_hidden_volumes: false
              volume_entity_id:
                - "{{ _hh_cab }}"
              key: postman_profile
              caller_token: "{{ _caller_token }}"
            response_variable: _house_fc_res

          # ── 2. Read postman_profile from user cabinet ──────────────────
          - action: script.zen_dojotools_filecabinet
            data:
              action_type: read
              show_hidden_volumes: false
              volume_entity_id:
                - "{{ _resolved_user_cab }}"
              key: postman_profile
              caller_token: "{{ _caller_token }}"
            response_variable: _user_fc_res

          # ── 3. Read postman_profile from family cabinet ────────────────
          - action: script.zen_dojotools_filecabinet
            data:
              action_type: read
              show_hidden_volumes: false
              volume_entity_id:
                - "{{ _family_cab }}"
              key: postman_profile
              caller_token: "{{ _caller_token }}"
            response_variable: _family_fc_res

          # ── 4. Normalize reads (FG-38) ─────────────────────────────────
          - variables:
              _house_policy: >-
                {%- set r = _house_fc_res.get('result', {}) if _house_fc_res is mapping else {} -%}
                {%- set r = r if r is mapping else (r | from_json if r is string else {}) -%}
                {%- set v = r.get('postman_profile', {}) -%}
                {%- set v = v.get('value', v) if v is mapping else {} -%}
                {{ v if v is mapping else (v | from_json if v is string else {}) }}
              _user_profile: >-
                {%- set r = _user_fc_res.get('result', {}) if _user_fc_res is mapping else {} -%}
                {%- set r = r if r is mapping else (r | from_json if r is string else {}) -%}
                {%- set v = r.get('postman_profile', {}) -%}
                {%- set v = v.get('value', v) if v is mapping else {} -%}
                {{ v if v is mapping else (v | from_json if v is string else {}) }}
              _family_policy: >-
                {%- set r = _family_fc_res.get('result', {}) if _family_fc_res is mapping else {} -%}
                {%- set r = r if r is mapping else (r | from_json if r is string else {}) -%}
                {%- set v = r.get('postman_profile', {}) -%}
                {%- set v = v.get('value', v) if v is mapping else {} -%}
                {{ v if v is mapping else (v | from_json if v is string else {}) }}

          # ── 5. Gate eval ───────────────────────────────────────────────
          - variables:
              _life_safety_bypass: "{{ (_house_policy.get('life_safety_bypass', 9)) | int(9) }}"
              _bypass_all_gates:   "{{ _urgency >= _life_safety_bypass or _breakthrough }}"
              _sleep_gate:         "{{ _house_policy.get('sleep_gate', {}) if _house_policy is mapping else {} }}"
              _sleep_block_below:  "{{ (_sleep_gate.get('block_below_urgency', 9)) | int(9) }}"
              _is_sleep:           "{{ is_state('binary_sensor.zen_quiet_hours', 'on') or is_state('input_select.zen_home_mode', 'Night') or is_state('input_select.zen_home_mode', 'Night-Late') }}"
              _sleep_blocked:      "{{ not _bypass_all_gates and _is_sleep and _urgency < _sleep_block_below }}"
              _work_gate:          "{{ _house_policy.get('work_gate', {}) if _house_policy is mapping else {} }}"
              _work_block_tts:     "{{ (_work_gate.get('block_tts', false) | bool) if not _bypass_all_gates else false }}"

          # ── 6. Tier + channels (always — sleep_blocked handled in response) ─
          - variables:
              _urgency_tier: >-
                {%- if _urgency >= 9 -%}critical
                {%- elif _urgency >= 7 -%}high
                {%- elif _urgency >= 4 -%}medium
                {%- else -%}low{%- endif -%}
              _tier_cfg: >-
                {%- set tiers = _user_profile.get('urgency_tiers', {}) if _user_profile is mapping else {} -%}
                {%- set t = tiers.get(_urgency_tier, {}) -%}
                {{ t if t is mapping else {} }}
              _base_channels: >-
                {%- set tier_chans = _tier_cfg.get('channels', ['push']) -%}
                {%- if _channel_hint != '' and _channel_hint not in tier_chans -%}
                  {{ ([_channel_hint] + tier_chans) | tojson }}
                {%- else -%}
                  {{ tier_chans | tojson }}
                {%- endif -%}
              _person_state: >-
                {%- if _target.startswith('person.') -%}
                  {{ states(_target) | default('home', true) }}
                {%- else -%}home{%- endif -%}
              _is_away:     "{{ _person_state not in ['home', 'unknown', 'unavailable'] }}"
              _away_policy: >-
                {%- set ap = _user_profile.get('away_policy', {}) if _user_profile is mapping else {} -%}
                {{ ap if ap is mapping else {} }}
              _final_channels: >-
                {%- set chans = _base_channels if _base_channels is iterable and _base_channels is not string
                    else (_base_channels | from_json if _base_channels is string else ['push']) -%}
                {%- set ns = namespace(chans=[]) -%}
                {%- for ch in chans -%}
                  {%- if _bypass_all_gates -%}
                    {%- set ns.chans = ns.chans + [ch] -%}
                  {%- elif _work_block_tts and ch == 'tts' -%}
                    {# blocked by house work_gate.block_tts #}
                  {%- elif _is_away and (_away_policy.get(ch, 'allow') == 'block') -%}
                    {# blocked by user away_policy #}
                  {%- else -%}
                    {%- set ns.chans = ns.chans + [ch] -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ (ns.chans if ns.chans | length > 0 else ['push']) | tojson }}
              _pm_tag: >-
                {%- if _response_type == 'agent_auth' and _tag == '' -%}
                  pm_auth_{{ context.id | replace('-', '') }}
                {%- elif _response_type not in ['', 'none'] and _tag == '' -%}
                  pm_{{ as_timestamp(now()) | int }}
                {%- elif _response_type not in ['', 'none'] and not _tag.startswith('pm_') -%}
                  pm_{{ _tag }}
                {%- else -%}
                  {{ _tag }}
                {%- endif -%}
              _notif_data: >-
                {%- set d = _notif_extra if _notif_extra is mapping else {} -%}
                {%- set _img = '' -%}
                {%- if _image_entity.startswith('camera.') -%}
                  {%- set _img = '/api/camera_proxy/' + _image_entity -%}
                {%- elif _image_entity.startswith('image.zen_image_') -%}
                  {%- set _img = '/local/zen_' + (_image_entity | replace('image.zen_image_', '')) + '.jpg' -%}
                {%- elif _image_entity.startswith('image.') -%}
                  {%- set _ep = state_attr(_image_entity, 'entity_picture') | default('', true) | string -%}
                  {%- if _ep not in ['', 'None', 'none'] -%}{%- set _img = _ep -%}{%- endif -%}
                {%- endif -%}
                {%- if _img == '' and _image_url != '' -%}{%- set _img = _image_url -%}{%- endif -%}
                {%- if _img != '' -%}{%- set d = d | combine({'image': _img}) -%}{%- endif -%}
                {%- if _audio_url != '' -%}{%- set d = d | combine({'audio': _audio_url}) -%}{%- endif -%}
                {%- set _ap = (_user_profile.get('assist_path', '') if _user_profile is mapping else '') | string | trim -%}
                {%- if _open_dashboard and _ap != '' and _response_type in ['', 'none'] -%}{%- set d = d | combine({'clickAction': _ap, 'url': _ap}) -%}{%- endif -%}
                {%- if _pm_tag != '' -%}{%- set d = d | combine({'tag': _pm_tag}) -%}{%- endif -%}
                {%- if _response_type not in ['', 'none'] -%}
                  {%- set _sets = {
                    'yes_no':         [{'action': 'YES',    'title': 'Yes'}, {'action': 'NO',     'title': 'No'}],
                    'yes_no_ignore':  [{'action': 'YES',    'title': 'Yes'}, {'action': 'NO',     'title': 'No'}, {'action': 'IGNORE', 'title': 'Ignore'}],
                    'ok_cancel':      [{'action': 'OK',     'title': 'Ok'},  {'action': 'CANCEL', 'title': 'Cancel'}],
                    'acknowledge':    [{'action': 'ACK',    'title': 'Got it'}],
                    'agent_auth':     [{'action': 'APPROVE', 'title': 'Approve'}, {'action': 'DENY', 'title': 'Deny'}, {'action': 'FLAG', 'title': 'Flag'}]
                  } -%}
                  {%- set _acts = _sets.get(_response_type, []) -%}
                  {%- if _open_dashboard and _ap != '' -%}
                    {%- set _ns = namespace(u=[]) -%}
                    {%- for a in _acts -%}{%- set _ns.u = _ns.u + [a | combine({'uri': _ap})] -%}{%- endfor -%}
                    {%- set _acts = _ns.u -%}
                  {%- endif -%}
                  {%- if _acts | length > 0 -%}{%- set d = d | combine({'actions': _acts}) -%}{%- endif -%}
                {%- endif -%}
                {{ d if d is mapping else {} }}

          # ── 7. Build response — conditional on sleep_blocked ───────────
          # No nested if/stop — sleep_blocked handled inline via template.
          # NOTE: no | tojson — HA variables: stores native Python objects.
          # MCP requires a dict, not a JSON string, at response_variable.
          - variables:
              _final_response: >-
                {%- if _sleep_blocked -%}
                {{
                  {
                    "status":         "resolved",
                    "would_dispatch": false,
                    "blocked_by":     "house_sleep_gate",
                    "urgency":        _urgency | int,
                    "tier":           _urgency_tier,
                    "target":         _target,
                    "person_state":   _person_state,
                    "is_away":        _is_away,
                    "channels":       [],
                    "notification_data": _notif_data if _notif_data is mapping else {},
                    "gates": {
                      "bypass_all_gates":   _bypass_all_gates,
                      "sleep_blocked":      true,
                      "sleep_block_below":  _sleep_block_below | int,
                      "is_sleep":           _is_sleep,
                      "work_block_tts":     _work_block_tts,
                      "life_safety_bypass": _life_safety_bypass | int
                    },
                    "policy_sources": {
                      "house_profile_present": _house_policy | length > 0,
                      "user_profile_present":  _user_profile | length > 0,
                      "family_policy_present": _family_policy | length > 0
                    },
                    "caller_token":   _caller_token
                  }
                }}
                {%- else -%}
                {{
                  {
                    "status":         "resolved",
                    "would_dispatch": true,
                    "urgency":        _urgency | int,
                    "tier":           _urgency_tier,
                    "target":         _target,
                    "person_state":   _person_state,
                    "is_away":        _is_away,
                    "channel_hint":   _channel_hint,
                    "channels":       (_final_channels | from_json if _final_channels is string else _final_channels) | select('equalto', 'push') | list if _response_type == 'agent_auth' else (_final_channels | from_json if _final_channels is string else _final_channels),
                    "notification_data": _notif_data if _notif_data is mapping else {},
                    "gates": {
                      "bypass_all_gates":   _bypass_all_gates,
                      "sleep_blocked":      false,
                      "is_sleep":           _is_sleep,
                      "work_block_tts":     _work_block_tts,
                      "life_safety_bypass": _life_safety_bypass | int,
                      "sleep_block_below":  _sleep_block_below | int
                    },
                    "policy_sources": {
                      "house_profile_present": _house_policy | length > 0,
                      "user_profile_present":  _user_profile | length > 0,
                      "family_policy_present": _family_policy | length > 0
                    },
                    "caller_token":   _caller_token
                  }
                }}
                {%- endif -%}

          - stop: "Resolved"
            response_variable: _final_response


      # ══════════════════════════════════════════════════════════════════════
      # MODE: resolve_and_dispatch
      # ══════════════════════════════════════════════════════════════════════
      - if: "{{ _mode == 'resolve_and_dispatch' }}"
        then:

          # ── 1. Read postman_profile from household cabinet ─────────────
          - action: script.zen_dojotools_filecabinet
            data:
              action_type: read
              show_hidden_volumes: false
              volume_entity_id:
                - "{{ _hh_cab }}"
              key: postman_profile
              caller_token: "{{ _caller_token }}"
            response_variable: _house_fc_res

          # ── 2. Read postman_profile from user cabinet (SP1: per-person) ─
          - action: script.zen_dojotools_filecabinet
            data:
              action_type: read
              show_hidden_volumes: false
              volume_entity_id:
                - "{{ _resolved_user_cab }}"
              key: postman_profile
              caller_token: "{{ _caller_token }}"
            response_variable: _user_fc_res

          # ── 3. Read postman_profile from family cabinet ────────────────
          - action: script.zen_dojotools_filecabinet
            data:
              action_type: read
              show_hidden_volumes: false
              volume_entity_id:
                - "{{ _family_cab }}"
              key: postman_profile
              caller_token: "{{ _caller_token }}"
            response_variable: _family_fc_res

          # ── 4. Normalize reads (FG-38) ─────────────────────────────────
          - variables:
              _house_policy: >-
                {%- set r = _house_fc_res.get('result', {}) if _house_fc_res is mapping else {} -%}
                {%- set r = r if r is mapping else (r | from_json if r is string else {}) -%}
                {%- set v = r.get('postman_profile', {}) -%}
                {%- set v = v.get('value', v) if v is mapping else {} -%}
                {{ v if v is mapping else (v | from_json if v is string else {}) }}
              _user_profile: >-
                {%- set r = _user_fc_res.get('result', {}) if _user_fc_res is mapping else {} -%}
                {%- set r = r if r is mapping else (r | from_json if r is string else {}) -%}
                {%- set v = r.get('postman_profile', {}) -%}
                {%- set v = v.get('value', v) if v is mapping else {} -%}
                {{ v if v is mapping else (v | from_json if v is string else {}) }}
              _family_policy: >-
                {%- set r = _family_fc_res.get('result', {}) if _family_fc_res is mapping else {} -%}
                {%- set r = r if r is mapping else (r | from_json if r is string else {}) -%}
                {%- set v = r.get('postman_profile', {}) -%}
                {%- set v = v.get('value', v) if v is mapping else {} -%}
                {{ v if v is mapping else (v | from_json if v is string else {}) }}

          # ── 5. House ceiling: life_safety_bypass + sleep gate ──────────
          - variables:
              _life_safety_bypass: "{{ (_house_policy.get('life_safety_bypass', 9)) | int(9) }}"
              _bypass_all_gates:   "{{ _urgency >= _life_safety_bypass or _breakthrough }}"
              _sleep_gate:         "{{ _house_policy.get('sleep_gate', {}) if _house_policy is mapping else {} }}"
              _sleep_block_below:  "{{ (_sleep_gate.get('block_below_urgency', 9)) | int(9) }}"
              _is_sleep:           "{{ is_state('binary_sensor.zen_quiet_hours', 'on') or is_state('input_select.zen_home_mode', 'Night') or is_state('input_select.zen_home_mode', 'Night-Late') }}"
              _sleep_blocked:      "{{ not _bypass_all_gates and _is_sleep and _urgency < _sleep_block_below }}"
              _work_gate:          "{{ _house_policy.get('work_gate', {}) if _house_policy is mapping else {} }}"
              _work_block_tts:     "{{ (_work_gate.get('block_tts', false) | bool) if not _bypass_all_gates else false }}"

          - if: "{{ _sleep_blocked }}"
            then:
              - variables:
                  _final_response: >-
                    {{
                      {
                        "status":       "blocked_sleep",
                        "urgency":       _urgency | int,
                        "block_below":   _sleep_block_below | int,
                        "caller_token":  _caller_token
                      }
                    }}
              - stop: "Blocked by house sleep gate"
                response_variable: _final_response

          # ── 6. Map urgency → tier ──────────────────────────────────────
          - variables:
              _urgency_tier: >-
                {%- if _urgency >= 9 -%}critical
                {%- elif _urgency >= 7 -%}high
                {%- elif _urgency >= 4 -%}medium
                {%- else -%}low{%- endif -%}
              _gen_image_path: ''

          # ── 7. Build channel list: user preference → house + away gates ─
          - variables:
              _tier_cfg: >-
                {%- set tiers = _user_profile.get('urgency_tiers', {}) if _user_profile is mapping else {} -%}
                {%- set t = tiers.get(_urgency_tier, {}) -%}
                {{ t if t is mapping else {} }}
              _base_channels: >-
                {%- set tier_chans = _tier_cfg.get('channels', ['push']) -%}
                {%- if _channel_hint != '' and _channel_hint not in tier_chans -%}
                  {{ ([_channel_hint] + tier_chans) | tojson }}
                {%- else -%}
                  {{ tier_chans | tojson }}
                {%- endif -%}
              _person_state: >-
                {%- if _target.startswith('person.') -%}
                  {{ states(_target) | default('home', true) }}
                {%- else -%}home{%- endif -%}
              _is_away:      "{{ _person_state not in ['home', 'unknown', 'unavailable'] }}"
              _away_policy:  >-
                {%- set ap = _user_profile.get('away_policy', {}) if _user_profile is mapping else {} -%}
                {{ ap if ap is mapping else {} }}
              _final_channels: >-
                {%- set chans = _base_channels if _base_channels is iterable and _base_channels is not string
                    else (_base_channels | from_json if _base_channels is string else ['push']) -%}
                {%- set ns = namespace(chans=[]) -%}
                {%- for ch in chans -%}
                  {%- if _bypass_all_gates -%}
                    {%- set ns.chans = ns.chans + [ch] -%}
                  {%- elif _work_block_tts and ch == 'tts' -%}
                    {# blocked by house work_gate.block_tts #}
                  {%- elif _is_away and (_away_policy.get(ch, 'allow') == 'block') -%}
                    {# blocked by user away_policy #}
                  {%- else -%}
                    {%- set ns.chans = ns.chans + [ch] -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ (ns.chans if ns.chans | length > 0 else ['push']) | tojson }}
              # Push targets: read from postman_profile.push_targets.
              # Default: Admin Devices (notify.admin_devices).
              # Override: set push_targets in user postman_profile drawer — list of
              # direct_dispatch target names ("Default User Phone", "Family Devices", etc).
              # SP2: when zen_postman + zen_channel_push + person labels are applied to
              # device_tracker.* entities, set push_device_labels: true to use label
              # intersection instead of target names.
              _push_targets: >-
                {%- set pt = _user_profile.get('push_targets', []) if _user_profile is mapping else [] -%}
                {%- set pt = pt if pt is iterable and pt is not string else [] -%}
                {{ (pt if pt | length > 0 else ['Admin Devices']) | tojson }}
              _pm_tag: >-
                {%- if _response_type == 'agent_auth' and _tag == '' -%}
                  pm_auth_{{ context.id | replace('-', '') }}
                {%- elif _response_type not in ['', 'none'] and _tag == '' -%}
                  pm_{{ as_timestamp(now()) | int }}
                {%- elif _response_type not in ['', 'none'] and not _tag.startswith('pm_') -%}
                  pm_{{ _tag }}
                {%- else -%}
                  {{ _tag }}
                {%- endif -%}
              _notif_data: >-
                {%- set d = _notif_extra if _notif_extra is mapping else {} -%}
                {%- set _img = '' -%}
                {%- if _image_entity.startswith('camera.') -%}
                  {%- set _img = '/api/camera_proxy/' + _image_entity -%}
                {%- elif _image_entity.startswith('image.zen_image_') -%}
                  {%- set _img = '/local/zen_' + (_image_entity | replace('image.zen_image_', '')) + '.jpg' -%}
                {%- elif _image_entity.startswith('image.') -%}
                  {%- set _ep = state_attr(_image_entity, 'entity_picture') | default('', true) | string -%}
                  {%- if _ep not in ['', 'None', 'none'] -%}{%- set _img = _ep -%}{%- endif -%}
                {%- endif -%}
                {%- if _img == '' and _image_url != '' -%}{%- set _img = _image_url -%}{%- endif -%}
                {%- if _img != '' -%}{%- set d = d | combine({'image': _img}) -%}{%- endif -%}
                {%- if _audio_url != '' -%}{%- set d = d | combine({'audio': _audio_url}) -%}{%- endif -%}
                {%- set _ap = (_user_profile.get('assist_path', '') if _user_profile is mapping else '') | string | trim -%}
                {%- if _open_dashboard and _ap != '' and _response_type in ['', 'none'] -%}{%- set d = d | combine({'clickAction': _ap, 'url': _ap}) -%}{%- endif -%}
                {%- if _pm_tag != '' -%}{%- set d = d | combine({'tag': _pm_tag}) -%}{%- endif -%}
                {%- if _response_type not in ['', 'none'] -%}
                  {%- set _sets = {
                    'yes_no':         [{'action': 'YES',    'title': 'Yes'}, {'action': 'NO',     'title': 'No'}],
                    'yes_no_ignore':  [{'action': 'YES',    'title': 'Yes'}, {'action': 'NO',     'title': 'No'}, {'action': 'IGNORE', 'title': 'Ignore'}],
                    'ok_cancel':      [{'action': 'OK',     'title': 'Ok'},  {'action': 'CANCEL', 'title': 'Cancel'}],
                    'acknowledge':    [{'action': 'ACK',    'title': 'Got it'}],
                    'agent_auth':     [{'action': 'APPROVE', 'title': 'Approve'}, {'action': 'DENY', 'title': 'Deny'}, {'action': 'FLAG', 'title': 'Flag'}]
                  } -%}
                  {%- set _acts = _sets.get(_response_type, []) -%}
                  {%- if _open_dashboard and _ap != '' -%}
                    {%- set _ns = namespace(u=[]) -%}
                    {%- for a in _acts -%}{%- set _ns.u = _ns.u + [a | combine({'uri': _ap})] -%}{%- endfor -%}
                    {%- set _acts = _ns.u -%}
                  {%- endif -%}
                  {%- if _acts | length > 0 -%}{%- set d = d | combine({'actions': _acts}) -%}{%- endif -%}
                {%- endif -%}
                {{ d if d is mapping else {} }}
              _tts_satellite: >-
                {%- set ts = _user_profile.get('tts_satellite', {}) if _user_profile is mapping else {} -%}
                {{ ts.get('preferred', '') if ts is mapping else '' }}
              _tts_engine: >-
                {%- set p = _user_profile if _user_profile is mapping else {} -%}
                {%- set lbl = p.get('tts_engine_label', '') | string | trim -%}
                {%- if lbl != '' -%}
                  {%- set candidates = label_entities(lbl) | select('match', 'tts\\.') | list -%}
                  {%- if candidates | length > 0 -%}
                    {{ candidates | first }}
                  {%- else -%}
                    {{ p.get('tts_engine', 'tts.home_assistant_cloud') }}
                  {%- endif -%}
                {%- else -%}
                  {{ p.get('tts_engine', 'tts.home_assistant_cloud') }}
                {%- endif -%}
              _final_channels_list: >-
                {%- set _chans = _final_channels if _final_channels is iterable and _final_channels is not string
                    else (_final_channels | from_json if _final_channels is string else ['push']) -%}
                {{ _chans | select('equalto', 'push') | list if _response_type == 'agent_auth' else _chans }}
              _voice_answer_sets: >-
                {{
                  {
                    'yes_no':        [{'id': 'YES', 'sentences': ['yes', 'yeah', 'sure', 'do it', 'go ahead']},
                                      {'id': 'NO',  'sentences': ['no', 'nope', 'cancel', 'stop']}],
                    'yes_no_ignore': [{'id': 'YES',    'sentences': ['yes', 'yeah', 'sure']},
                                      {'id': 'NO',     'sentences': ['no', 'nope', 'cancel']},
                                      {'id': 'IGNORE', 'sentences': ['ignore', 'skip', 'later']}],
                    'ok_cancel':     [{'id': 'OK',     'sentences': ['ok', 'okay', 'confirm', 'do it']},
                                      {'id': 'CANCEL', 'sentences': ['cancel', 'stop', 'nevermind']}],
                    'acknowledge':   [{'id': 'ACK',    'sentences': ['got it', 'okay', 'ok', 'understood', 'acknowledge']}]
                  }
                }}

          # ── 7.5. agent_auth — authorization eligibility check ───────────────
          # 2026-08-19: no caller in the codebase invokes response_type=
          # agent_auth yet, so this had zero live exposure -- but the stub
          # unconditionally passed (authorized=true), which would have been
          # a real fail-open gate the moment something DID start calling it.
          # Flipped to fail-closed pending real design (Nathan still needs
          # to decide the actual eligibility policy -- likely a cabinet
          # lookup against an auth_policy drawer keyed by ack_context or
          # ack_owner, e.g. user cabinet -> auth_policy -> allowed_contexts:
          # [...], family cabinet -> auth_policy -> escalation_roles: [...]).
          # Note this is a SEPARATE concern from the actual approve/deny --
          # the push+wait+timeout=deny mechanism below already requires a
          # real human tap regardless; this only gates WHO gets asked.
          - if: "{{ _response_type == 'agent_auth' }}"
            then:
              - variables:
                  # TODO: replace with real eligibility check against target's
                  # auth_policy. Fails closed until that exists -- do not flip
                  # to true without a real lookup backing it.
                  _auth_eligible: false

              - if: "{{ not _auth_eligible }}"
                then:
                  - variables:
                      _final_response: >-
                        {{
                          {
                            "status":    "error",
                            "error":     "unauthorized",
                            "message":   "Target is not authorized to approve this request.",
                            "target":    _target,
                            "ack_owner": _ack_owner,
                            "pm_tag":    _pm_tag
                          }
                        }}
                  - stop: unauthorized
                    response_variable: _final_response

          # ── 8.1. Phone TTS — speak notification on handset ──────────────
          # High-priority channel — only fires at urgency >= 7 or force_audio.
          # Preferred path: generate audio from _tts_engine via tts_get_url and
          # attach as audio notification (plays as alert sound = Wyoming/OAI voice).
          # Fallback: message: TTS (Android system voice) if REST call fails.
          - if: >-
              {{ 'push' in _final_channels_list and (_force_audio or _urgency >= 9) }}
            then:
              - variables:
                  _tts_push_targets: >-
                    {%- set p = _user_profile if _user_profile is mapping else {} -%}
                    {%- set t = p.get('tts_push_targets', none) -%}
                    {%- if t is iterable and t is not string and t | length > 0 -%}
                      {{ t }}
                    {%- else -%}
                      {{ _push_targets if _push_targets is iterable and _push_targets is not string
                         else (_push_targets | from_json if _push_targets is string else []) }}
                    {%- endif -%}
              - action: rest_command.ha_api_post
                data:
                  path: "tts_get_url"
                  payload: >-
                    {{ {"engine_id": _tts_engine, "message": _message, "language": "en-US"} | tojson }}
                response_variable: _tts_url_resp
              - variables:
                  _phone_audio_url: >-
                    {%- if _tts_url_resp is mapping
                           and (_tts_url_resp.get('status', 0) | int) in [200, 201] -%}
                      {%- set c = _tts_url_resp.get('content', {}) -%}
                      {{ c.get('url', '') if c is mapping else '' }}
                    {%- else -%}
                      {{ '' }}
                    {%- endif -%}
              - repeat:
                  for_each: "{{ _tts_push_targets }}"
                  sequence:
                    - if: "{{ _phone_audio_url != '' }}"
                      then:
                        - action: "notify.{{ repeat.item }}"
                          data:
                            message: "{{ _message }}"
                            data:
                              audio: "{{ _phone_audio_url }}"
                      else:
                        - action: "notify.{{ repeat.item }}"
                          data:
                            message: TTS
                            data:
                              tts_text: "{{ _message }}"

          # ── 8. Dispatch per channel (push + teams) ──────────────────────
          # TTS handled separately in step 8.3 — pulled out of loop so voice
          # ack result is accessible to the step 8.5 push-ack wait.
          - repeat:
              for_each: "{{ _final_channels_list | reject('equalto', 'tts') | list }}"
              sequence:
                - choose:
                    - conditions: "{{ repeat.item == 'push' }}"
                      sequence:
                        - repeat:
                            for_each: >-
                              {{ _push_targets if _push_targets is iterable and _push_targets is not string
                                 else (_push_targets | from_json if _push_targets is string else ['Admin Devices']) }}
                            sequence:
                              - variables:
                                  _notify_slug: >-
                                    {%- set m = {
                                      'Admin Devices':              'admin_devices',
                                      'Family Devices':             'family_devices',
                                      'Family Devices (Verbose)':   'family_devices_verbose',
                                      'Default User Phone':         'default_user',
                                      'Secondary User Phone':       'secondary_user'
                                    } -%}
                                    {{- m.get(repeat.item, repeat.item | lower | replace(' ', '_')) -}}
                              - action: "notify.{{ _notify_slug }}"
                                data: >-
                                  {%- set nd = _notif_data if _notif_data is mapping and _notif_data | length > 0 else {} -%}
                                  {%- set base = {'message': _message} -%}
                                  {%- if _title != '' -%}{%- set base = base | combine({'title': _title}) -%}{%- endif -%}
                                  {%- if nd | length > 0 -%}{%- set base = base | combine({'data': nd}) -%}{%- endif -%}
                                  {{ base }}
                    - conditions: "{{ repeat.item == 'teams' }}"
                      sequence:
                        - action: script.zen_dojotools_teams
                          data:
                            action:       send
                            message:      "{{ _message }}"
                            caller_token: "{{ _caller_token }}"
                  default:
                    - event: zen_event
                      event_data:
                        event:
                          kind:         postman_unknown_channel
                          channel:      "{{ repeat.item }}"
                          urgency:      "{{ _urgency }}"
                          caller_token: "{{ _caller_token }}"

          # ── 8.3. TTS channel — dispatch via event bus ────────────────────
          # Fire dojotool_call for zen_dojotools_announce and return instantly.
          # Dispatcher runs announce in its own coroutine; step 8.5 waits for
          # dojotool_return (voice ack) or postman_response (push tap).
          # When push is also present, response_type is passed as 'none' so
          # announce speaks without blocking on ask_question — push owns ack.
          - variables:
              _ack_action:    ''
              _ack_device_id: ''
              _ack_timed_out: false
              _tts_cid:       ''

          - if: "{{ 'tts' in _final_channels_list }}"
            then:
              - variables:
                  _tts_cid: "{{ context.id ~ '_tts' }}"
              - event: zen_event
                event_data:
                  event:
                    kind:           dojotool_call
                    tool:           zen_dojotools_announce
                    version:        "1"
                    correlation_id: "{{ _tts_cid }}"
                    payload:
                      message:          "{{ _message }}"
                      urgency:          "{{ _urgency }}"
                      satellite_entity: "{{ _tts_satellite }}"
                      response_type:    "{{ _response_type if 'push' not in _final_channels_list else 'none' }}"
                      voice_answers:    "{{ _voice_answer_sets.get(_response_type, []) | tojson }}"
                      caller_token:     "{{ _caller_token }}"

          # ── 8.5. Wait for ack — dual-trigger, first wins ─────────────────
          # Push tap (postman_response) OR voice answer (dojotool_return from
          # announce dispatcher) — whichever fires first wins.
          # If TTS fires first with empty ack (announced, no voice answer)
          # and push is also active, re-arm for push.
          - if: "{{ _response_type not in ['', 'none'] and (_pm_tag != '' or _tts_cid != '') }}"
            then:
              - wait_for_trigger:
                  - trigger: event
                    event_type: zen_event
                    event_data:
                      event:
                        kind: postman_response
                        tag:  "{{ _pm_tag }}"
                  - trigger: event
                    event_type: zen_event
                    event_data:
                      event:
                        kind:           dojotool_return
                        correlation_id: "{{ _tts_cid }}"
                timeout: "{{ timedelta(seconds=_response_timeout) }}"
                continue_on_timeout: true
              - variables:
                  _waited_kind: >-
                    {{ wait.trigger.event.data.event.kind if wait.trigger is not none else '' }}
                  _ack_action: >-
                    {%- if wait.trigger is none -%}
                    {%- elif _waited_kind == 'postman_response' -%}
                      {{ wait.trigger.event.data.event.action | default('') }}
                    {%- elif _waited_kind == 'dojotool_return' -%}
                      {{ wait.trigger.event.data.event.result.ack_action | default('') }}
                    {%- endif -%}
                  _ack_device_id: >-
                    {{ wait.trigger.event.data.event.device_id
                       if wait.trigger is not none and _waited_kind == 'postman_response'
                       else '' }}
                  _ack_timed_out: "{{ wait.trigger is none }}"

              # TTS returned without voice ack (announced only) — re-arm for push
              - if: "{{ _waited_kind == 'dojotool_return' and _ack_action == '' and _pm_tag != '' }}"
                then:
                  - wait_for_trigger:
                      - trigger: event
                        event_type: zen_event
                        event_data:
                          event:
                            kind: postman_response
                            tag:  "{{ _pm_tag }}"
                    timeout: "{{ timedelta(seconds=_response_timeout) }}"
                    continue_on_timeout: true
                  - variables:
                      _ack_action:    "{{ wait.trigger.event.data.event.action    if wait.trigger is not none else '' }}"
                      _ack_device_id: "{{ wait.trigger.event.data.event.device_id if wait.trigger is not none else '' }}"
                      _ack_timed_out: "{{ wait.trigger is none }}"

          # ── 8.55. agent_auth timeout → explicit deny ─────────────────────
          # No response on a privileged request = denied. Keep _ack_timed_out
          # true so the log shows HOW deny was set (timeout vs explicit tap).
          - if: "{{ _response_type == 'agent_auth' and _ack_timed_out }}"
            then:
              - variables:
                  _ack_action: 'deny'

          # ── 8.6. Normalize ack_action to canonical set ──────────────────
          # Maps caller-supplied action names to canonical vocabulary.
          # approve/deny/flag are first-class canonicals for agent_auth —
          # not aliased to yes/no/ok so downstream consumers can distinguish.
          - variables:
              _ack_action: >-
                {%- set aliases = {
                  'proceed': 'ok',     'confirm': 'ok',   'release': 'ok',
                  'stop':    'cancel', 'abort':   'cancel',
                  'nope':    'no',
                  'later':   'ignore', 'snooze':  'ignore', 'dismiss': 'ignore', 'delay': 'ignore',
                  'got_it':  'ack',    'done':    'ack',    'received': 'ack'
                } -%}
                {%- set a = _ack_action | lower | trim -%}
                {{ aliases.get(a, a) }}

          # ── 8.7. agent_auth_flagged event ───────────────────────────────────
          # Fires when user taps Flag — signals an unexpected / suspicious
          # authorization request. Independent subscribers handle incident flow.
          - if: "{{ _response_type == 'agent_auth' and _ack_action == 'flag' }}"
            then:
              - event: zen_event
                event_data:
                  event:
                    kind:          agent_auth_flagged
                    pm_tag:        "{{ _pm_tag }}"
                    message:       "{{ _message }}"
                    title:         "{{ _title }}"
                    ack_device_id: "{{ _ack_device_id }}"
                    ack_owner:     "{{ _ack_owner }}"
                    ack_context:   "{{ _ack_context }}"
                    caller_token:  "{{ _caller_token }}"
                    timestamp:     "{{ now().isoformat() }}"

          # ── 9. Write delivery record ────────────────────────────────────
          # Inline read-modify-write: skips intermediate variables to avoid
          # NativeEnvironment list re-parsing. Dedup on pm_tag, cap at 10.
          - action: script.zen_dojotools_filecabinet
            data:
              action_type: read
              volume_entity_id: "{{ _kata_cab }}"
              key: zen_postman_log
              force_action: true
            response_variable: _log_read
          - action: script.zen_dojotools_filecabinet
            data:
              action_type: create
              show_hidden_volumes: false
              force_action: true
              volume_entity_id:
                - "{{ _kata_cab }}"
              key: zen_postman_log
              value: >-
                {%- set r = _log_read.get('result', {}) -%}
                {%- set r = r if r is mapping else (r | from_json if r is string else {}) -%}
                {%- set raw = r.get('zen_postman_log', none) -%}
                {%- set raw = raw if raw is mapping else (raw | from_json if raw is string else none) -%}
                {%- set log_val = raw.get('value', none) if raw is mapping else none -%}
                {%- set cur = log_val if log_val is sequence and log_val is not string else (log_val | from_json if log_val is string else []) -%}
                {%- set cur = cur if cur is sequence else [] -%}
                {%- set cur = cur | rejectattr('pm_tag', 'equalto', _pm_tag) | list if _pm_tag != '' else cur | list -%}
                {%- set s = 'ack' if _ack_action != '' else ('timeout' if _ack_timed_out else 'dispatched') -%}
                {%- set entry = {
                  'pm_tag': _pm_tag, 'status': s,
                  'timestamp': now().isoformat(), 'ttl_s': 86400,
                  'target': _target, 'urgency': _urgency | int,
                  'tier': _urgency_tier, 'channels': _final_channels_list,
                  'bypass_all_gates': _bypass_all_gates,
                  'response_required': _response_req,
                  'ack_action': _ack_action, 'ack_timed_out': _ack_timed_out,
                  'ack_device_id': _ack_device_id,
                  'caller_token': _caller_token
                } -%}
                {{ (cur + [entry])[-10:] | tojson }}
            response_variable: _log_result

          # ── 9b. Post-ack zen_event ─────────────────────────────────────────
          # Fires after any response_type wait resolves (ack, timeout, or
          # dispatched-with-no-wait). Enables async KFC/automation chaining.
          - if: "{{ _response_type not in ['', 'none'] and _pm_tag != '' }}"
            then:
              - event: zen_event
                event_data:
                  event:
                    kind:          postman_ack
                    pm_tag:        "{{ _pm_tag }}"
                    ack_action:    "{{ _ack_action }}"
                    ack_timed_out: "{{ _ack_timed_out }}"
                    ack_owner:     "{{ _ack_owner }}"
                    ack_context:   "{{ _ack_context }}"
                    ack_depth:     "{{ _ack_depth }}"

          # ── 9c. on_ack chain ────────────────────────────────────────────
          # Resolves matching branch key and fires a recursive postman call.
          # Depth gate (_ack_depth < 3) enforced at normalize step 0c.
          - if: "{{ _on_ack is mapping and _on_ack | length > 0 }}"
            then:
              - variables:
                  _ack_key: >-
                    {%- if _ack_timed_out and 'timeout' in _on_ack -%}timeout
                    {%- elif _ack_action != '' and _ack_action | lower in _on_ack -%}{{ _ack_action | lower }}
                    {%- endif -%}
              - variables:
                  _ack_branch: >-
                    {{ _on_ack.get(_ack_key, {}) if _ack_key is string and _ack_key != '' and _on_ack is mapping else {} }}
              - if: "{{ _ack_branch is mapping and _ack_branch | length > 0 }}"
                then:
                  - variables:
                      _chain_urgency:  "{{ _ack_branch.get('urgency', _urgency) | int }}"
                      _chain_msg:      "{{ _ack_branch.get('message', '') | string }}"
                      _chain_title:    "{{ _ack_branch.get('title', '') | string }}"
                      _chain_ch_hint:  "{{ _ack_branch.get('channel_hint', '') | string }}"
                      _chain_resp_t:   "{{ _ack_branch.get('response_type', 'none') | string }}"
                      _chain_resp_to:  "{{ _ack_branch.get('response_timeout_s', 60) | int }}"
                      _chain_open_d:   "{{ _ack_branch.get('open_dashboard', false) | bool }}"
                      _chain_tag:      "{{ _ack_branch.get('tag', _pm_tag) | string }}"
                      _chain_nested:   "{{ _ack_branch.get('on_ack', {}) | tojson }}"
                      _chain_bt:       "{{ _ack_branch.get('breakthrough', false) | bool }}"
                      _chain_owner:    "{{ _ack_branch.get('ack_owner', _ack_owner) | string }}"
                      _chain_ctx:      "{{ _ack_branch.get('ack_context', _ack_context) | string }}"
                  - action: script.zen_dojotools_postman
                    data:
                      mode:               resolve_and_dispatch
                      target:             "{{ _target }}"
                      message:            "{{ _chain_msg }}"
                      title:              "{{ _chain_title }}"
                      urgency:            "{{ _chain_urgency }}"
                      channel_hint:       "{{ _chain_ch_hint }}"
                      response_type:      "{{ _chain_resp_t }}"
                      response_timeout_s: "{{ _chain_resp_to }}"
                      open_dashboard:     "{{ _chain_open_d }}"
                      tag:                "{{ _chain_tag }}"
                      on_ack:             "{{ _chain_nested }}"
                      ack_depth:          "{{ _ack_depth + 1 }}"
                      ack_owner:          "{{ _chain_owner }}"
                      ack_context:        "{{ _chain_ctx }}"
                      breakthrough:       "{{ _chain_bt }}"

          # ── 10. Audit event ─────────────────────────────────────────────
          - event: zen_event
            event_data:
              event:
                kind:         postman_dispatched
                target:       "{{ _target }}"
                urgency:      "{{ _urgency }}"
                tier:         "{{ _urgency_tier }}"
                channels:     "{{ _final_channels_list }}"
                caller_token: "{{ _caller_token }}"

          - variables:
              _final_response: >-
                {{
                  {
                    "status":       "dispatched",
                    "tier":         _urgency_tier,
                    "channels":     _final_channels_list,
                    "pm_tag":       _pm_tag,
                    "ack_action":   _ack_action,
                    "ack_timed_out": _ack_timed_out,
                    "audio_url":    _audio_url,
                    "caller_token": _caller_token
                  }
                }}
          - stop: "Dispatched"
            response_variable: _final_response


      # ══════════════════════════════════════════════════════════════════════
      # MODE: direct_dispatch
      # Backwards-compat replacement for zen_dojotools_notification_router.
      # Bypasses authority stack — no cabinet reads, no tier mapping, no gate.
      # Requires override=true. Both dispatches and blocked attempts are logged.
      # ══════════════════════════════════════════════════════════════════════
      - if: "{{ _mode == 'direct_dispatch' }}"
        then:

          # ── Gate: override=true required ────────────────────────────────
          - if: "{{ not _override }}"
            then:
              - action: script.zen_dojotools_filecabinet
                data:
                  action_type: read
                  volume_entity_id: "{{ _kata_cab }}"
                  key: zen_postman_log
                  force_action: true
                response_variable: _dd_block_log_read
              - action: script.zen_dojotools_filecabinet
                data:
                  action_type: create
                  force_action: true
                  volume_entity_id:
                    - "{{ _kata_cab }}"
                  key: zen_postman_log
                  value: >-
                    {%- set r = (_dd_block_log_read.get('result', {}) if _dd_block_log_read is mapping else {}) -%}
                    {%- set r = r if r is mapping else (r | from_json if r is string else {}) -%}
                    {%- set raw = r.get('zen_postman_log', none) -%}
                    {%- set raw = raw if raw is mapping else (raw | from_json if raw is string else none) -%}
                    {%- set log_val = (raw.get('value', none) if raw is mapping else none) -%}
                    {%- set cur = log_val if log_val is sequence and log_val is not string else (log_val | from_json if log_val is string else []) -%}
                    {%- set cur = cur if cur is sequence else [] -%}
                    {%- set entry = {
                      'pm_tag': (_tag if _tag != '' else 'dd_blocked_' ~ now().timestamp() | int | string),
                      'status': 'direct_dispatch_blocked',
                      'timestamp': now().isoformat(),
                      'ttl_s': 86400,
                      'mode': 'direct_dispatch',
                      'override': false,
                      'caller_token': _caller_token,
                      'note': 'direct_dispatch attempted without override=true. Operator approval was not obtained.'
                    } -%}
                    {{ (cur + [entry])[-10:] | tojson }}
              - variables:
                  _final_response:
                    status: error
                    mode: direct_dispatch
                    message: >-
                      direct_dispatch requires override=true. You must ask the
                      operator for explicit approval before bypassing the authority
                      stack. This attempt has been logged.
                    coaching:
                      - "direct_dispatch skips all authority stack resolution — no quiet/work hours gate, no cabinet reads, no tier mapping."
                      - "You are required to ask the operator before using this mode. Do not assume permission."
                      - "This blocked attempt has been written to zen_postman_log. Misuse will be reviewed with the operator."
                    caller_token: "{{ _caller_token }}"
              - stop: "direct_dispatch blocked — override=true not set"
                response_variable: _final_response

          # ── Normalize targets ──────────────────────────────────────────
          - variables:
              _dd_targets: >-
                {%- set raw = _notif_targets_raw -%}
                {%- if raw is sequence and raw is not string -%}{{ raw }}
                {%- else -%}
                  {%- set s = raw | string | trim -%}
                  {%- if s.startswith('[') -%}
                    {%- set parsed = s | from_json(none) -%}
                    {{ parsed if parsed is sequence else ['Admin Devices'] }}
                  {%- else -%}{{ [s] }}{%- endif -%}
                {%- endif -%}
              _dd_gate_ok: >-
                {{ _breakthrough or (
                   not is_state('binary_sensor.zen_quiet_hours', 'on')
                   and not is_state('binary_sensor.zen_work_hours', 'on')
                ) }}

          # ── Build payload ──────────────────────────────────────────────
          - variables:
              _dd_data: >-
                {%- set ns = namespace(d=(_notif_extra if _notif_extra is mapping else {})) -%}
                {%- if _tag != '' -%}{%- set ns.d = ns.d | combine({'tag': _tag}) -%}{%- endif -%}
                {{ ns.d }}

          # ── Dispatch loop ──────────────────────────────────────────────
          - repeat:
              for_each: "{{ _dd_targets }}"
              sequence:
                - choose:
                  - conditions: "{{ repeat.item == 'Admin Devices' }}"
                    sequence:
                      - action: notify.admin_devices
                        data:
                          title: "{{ _title }}"
                          message: "{{ _message }}"
                          data: "{{ _dd_data }}"
                  - conditions:
                    - condition: template
                      value_template: "{{ repeat.item == 'Family Devices' and _dd_gate_ok }}"
                    sequence:
                      - action: notify.family_devices
                        data:
                          title: "{{ _title }}"
                          message: "{{ _message }}"
                          data: "{{ _dd_data }}"
                  - conditions:
                    - condition: template
                      value_template: "{{ repeat.item == 'Family Devices (Verbose)' and _dd_gate_ok }}"
                    sequence:
                      - action: notify.family_devices_verbose
                        data:
                          title: "{{ _title }}"
                          message: "{{ _message }}"
                          data: "{{ _dd_data }}"
                  - conditions:
                    - condition: template
                      value_template: "{{ repeat.item == 'Default User Phone' and _dd_gate_ok }}"
                    sequence:
                      - action: notify.default_user
                        data:
                          title: "{{ _title }}"
                          message: "{{ _message }}"
                          data: "{{ _dd_data }}"
                  - conditions:
                    - condition: template
                      value_template: "{{ repeat.item == 'Secondary User Phone' and _dd_gate_ok }}"
                    sequence:
                      - action: notify.secondary_user
                        data:
                          title: "{{ _title }}"
                          message: "{{ _message }}"
                          data: "{{ _dd_data }}"

          # ── Log the dispatch ───────────────────────────────────────────
          - action: script.zen_dojotools_filecabinet
            data:
              action_type: read
              volume_entity_id: "{{ _kata_cab }}"
              key: zen_postman_log
              force_action: true
            response_variable: _dd_log_read
          - action: script.zen_dojotools_filecabinet
            data:
              action_type: create
              force_action: true
              volume_entity_id:
                - "{{ _kata_cab }}"
              key: zen_postman_log
              value: >-
                {%- set r = (_dd_log_read.get('result', {}) if _dd_log_read is mapping else {}) -%}
                {%- set r = r if r is mapping else (r | from_json if r is string else {}) -%}
                {%- set raw = r.get('zen_postman_log', none) -%}
                {%- set raw = raw if raw is mapping else (raw | from_json if raw is string else none) -%}
                {%- set log_val = (raw.get('value', none) if raw is mapping else none) -%}
                {%- set cur = log_val if log_val is sequence and log_val is not string else (log_val | from_json if log_val is string else []) -%}
                {%- set cur = cur if cur is sequence else [] -%}
                {%- set entry = {
                  'pm_tag': (_tag if _tag != '' else 'dd_' ~ now().timestamp() | int | string),
                  'status': 'direct_dispatch',
                  'timestamp': now().isoformat(),
                  'ttl_s': 86400,
                  'mode': 'direct_dispatch',
                  'targets': _dd_targets,
                  'override': true,
                  'caller_token': _caller_token,
                  'note': 'Authority stack bypassed via direct_dispatch with operator override.'
                } -%}
                {{ (cur + [entry])[-10:] | tojson }}

          # ── Return ─────────────────────────────────────────────────────
          - variables:
              _final_response:
                status: dispatched
                mode: direct_dispatch
                targets: "{{ _dd_targets }}"
                gate_ok: "{{ _dd_gate_ok }}"
                caller_token: "{{ _caller_token }}"
          - stop: direct_dispatch complete
            response_variable: _final_response


      # ══════════════════════════════════════════════════════════════════════
      # MODE: author_policy
      # ══════════════════════════════════════════════════════════════════════
      - if: "{{ _mode == 'author_policy' }}"
        then:

          # Validate required fields
          - if: "{{ _scope_id == '' or not (_channel_def is mapping and _channel_def | length > 0) }}"
            then:
              - variables:
                  _final_response: >-
                    {{
                      {
                        "status":       "error",
                        "reason":       "missing_required_fields",
                        "detail":       "scope_id and channel_definition (non-empty mapping) are required",
                        "caller_token": _caller_token
                      }
                    }}
              - stop: "Error: scope_id and channel_definition required"
                response_variable: _final_response

          # ── 1. Resolve scope_id — if it's a resolver sensor, read its state
          #        to get the actual cabinet entity. Resolver sensors have state
          #        = the entity_id of the active cabinet (e.g. sensor.zenos_*).
          - variables:
              _resolved_scope: >-
                {%- set s = states(_scope_id) | default('', true) | string | trim -%}
                {%- if s.startswith('sensor.') and s not in ['unavailable', 'unknown', ''] -%}
                  {{ s }}
                {%- else -%}
                  {{ _scope_id }}
                {%- endif -%}

          # ── 2. Read existing policy ─────────────────────────────────────
          - action: script.zen_dojotools_filecabinet
            data:
              action_type: read
              show_hidden_volumes: false
              volume_entity_id:
                - "{{ _resolved_scope }}"
              key: "{{ _policy_key }}"
              caller_token: "{{ _caller_token }}"
            response_variable: _policy_read_res

          # ── 3. Normalize (FG-38) ────────────────────────────────────────
          - variables:
              _existing_policy: >-
                {%- set r = _policy_read_res.get('result', {}) if _policy_read_res is mapping else {} -%}
                {%- set r = r if r is mapping else (r | from_json if r is string else {}) -%}
                {%- set v = r.get(_policy_key, {}) -%}
                {%- set v = v.get('value', v) if v is mapping else {} -%}
                {{ v if v is mapping else (v | from_json if v is string else {}) }}
              _drawer_exists: >-
                {%- set r = _policy_read_res.get('result', {}) if _policy_read_res is mapping else {} -%}
                {%- set r = r if r is mapping else (r | from_json if r is string else {}) -%}
                {{ _policy_key in r }}

          # ── 4. Validate channel name for new_channel ────────────────────
          - variables:
              _ch_name: "{{ _channel_def.get('name', '') if _channel_def is mapping else '' }}"

          - if: "{{ _policy_type == 'new_channel' and _ch_name == '' }}"
            then:
              - variables:
                  _final_response: >-
                    {{
                      {
                        "status":       "error",
                        "reason":       "missing_channel_name",
                        "detail":       "channel_definition must include a 'name' field for new_channel",
                        "caller_token": _caller_token
                      }
                    }}
              - stop: "Error: channel_definition missing 'name'"
                response_variable: _final_response

          # ── 5. Build new payload ────────────────────────────────────────
          - variables:
              _new_payload: >-
                {%- if _policy_type == 'new_channel' -%}
                  {%- set existing_channels = _existing_policy.get('channels', {}) if _existing_policy is mapping else {} -%}
                  {%- set existing_channels = existing_channels if existing_channels is mapping else {} -%}
                  {{ _existing_policy | combine({'channels': existing_channels | combine({_ch_name: _channel_def})}, recursive=true) }}
                {%- else -%}
                  {{ _existing_policy | combine(_channel_def, recursive=true) }}
                {%- endif -%}

          # ── 6. Write back — create if new, update if exists ────────────
          - action: script.zen_dojotools_filecabinet
            data:
              action_type: "{{ 'update' if _drawer_exists else 'create' }}"
              show_hidden_volumes: false
              force_action: true
              set_timestamp: true
              volume_entity_id:
                - "{{ _resolved_scope }}"
              key: "{{ _policy_key }}"
              value: "{{ _new_payload | tojson }}"
              caller_token: "{{ _caller_token }}"
            response_variable: _write_res

          - variables:
              _final_response: >-
                {{
                  {
                    "status":       "authored",
                    "policy_key":   _policy_key,
                    "policy_type":  _policy_type,
                    "scope":        _resolved_scope,
                    "drawer_was":   "updated" if _drawer_exists else "created",
                    "confirmed":    (_write_res.get('confirmed', false) if _write_res is mapping else false),
                    "caller_token": _caller_token
                  }
                }}
          - stop: "Policy authored"
            response_variable: _final_response


      # ══════════════════════════════════════════════════════════════════════
      # MODE: clear_tag
      # ══════════════════════════════════════════════════════════════════════
      - if: "{{ _mode == 'clear_tag' }}"
        then:
          - if: "{{ _tag == '' }}"
            then:
              - variables:
                  _final_response:
                    mode: clear_tag
                    result: error
                    note: "tag= is required for mode=clear_tag"
                    caller_token: "{{ _caller_token }}"
              - stop: "clear_tag error — no tag"
                response_variable: _final_response
          - action: script.zen_dojotools_filecabinet
            data:
              action_type: read
              volume_entity_id: "{{ _kata_cab }}"
              key: zen_postman_log
              force_action: true
            response_variable: _log_read
          - variables:
              _ct_log: >-
                {%- set r = _log_read.get('result', {}) -%}
                {%- set r = r if r is mapping else (r | from_json if r is string else {}) -%}
                {%- set raw = r.get('zen_postman_log', none) -%}
                {%- set raw = raw if raw is mapping else (raw | from_json if raw is string else none) -%}
                {%- set log_val = raw.get('value', none) if raw is mapping else none -%}
                {%- set cur = log_val if log_val is sequence and log_val is not string else (log_val | from_json if log_val is string else []) -%}
                {{ cur if cur is sequence else [] }}
          - variables:
              _ct_removed: "{{ (_ct_log | selectattr('pm_tag', 'equalto', _tag) | list | length) > 0 }}"
          - action: script.zen_dojotools_filecabinet
            data:
              action_type: create
              force_action: true
              volume_entity_id:
                - "{{ _kata_cab }}"
              key: zen_postman_log
              value: "{{ (_ct_log | rejectattr('pm_tag', 'equalto', _tag) | list) | tojson }}"
            response_variable: _log_result
          - variables:
              _final_response:
                mode: clear_tag
                result: ok
                pm_tag: "{{ _tag }}"
                removed: "{{ _ct_removed }}"
                caller_token: "{{ _caller_token }}"
          - stop: "clear_tag complete"
            response_variable: _final_response


      # ══════════════════════════════════════════════════════════════════════
      # MODE: help
      # ══════════════════════════════════════════════════════════════════════
      - if: "{{ _mode == 'help' }}"
        then:
          - variables:
              _final_response: >-
                {{
                  {
                    "tool": "zen_dojotools_postman",
                    "version": "1.4.3",
                    "about": "Household comms layer. Resolves urgency + target against authority stack (house ceiling → family floor → user preference) and dispatches to push/tts/teams. Supports image attachments, actionable response buttons, and full Android notification data passthrough.",

                    "setup_required": {
                      "step_1": "Seed postman_profile in household cabinet",
                      "step_2": "Seed postman_profile in user cabinet",
                      "step_3": "Seed postman_profile in family cabinet (can be empty for alpha)"
                    },

                    "drawer_key": "postman_profile — same key in all three cabinets",

                    "drawer_schemas": {
                      "household_cabinet": {
                        "cabinet": "sensor.zen_default_household_cabinet_resolved",
                        "key": "postman_profile",
                        "fields": {
                          "life_safety_bypass": "int — urgency >= this bypasses all gates (default 9)",
                          "sleep_gate": {
                            "block_below_urgency": "int — block audio below this urgency during sleep (default 9)"
                          },
                          "work_gate": {
                            "block_tts": "bool — suppress TTS during work mode (default false)",
                            "allowed_channels": "list — channels allowed during work mode"
                          }
                        },
                        "minimal_seed": {
                          "life_safety_bypass": 9,
                          "sleep_gate": {"block_below_urgency": 9}
                        }
                      },
                      "user_cabinet": {
                        "cabinet": "sensor.zen_default_user_cabinet_resolved",
                        "key": "postman_profile",
                        "fields": {
                          "push_targets": "list — notification_router target names to use for push channel. Default: ['Admin Devices']. Options: 'Admin Devices', 'Family Devices', 'Default User Phone', 'Secondary User Phone'. Set this to control which devices receive push for this person.",
                          "push_device_labels": "bool — SP2: when true, ignores push_targets and uses label intersection (zen_postman + zen_channel_push + person label on device_tracker entities) instead of notify groups. Requires device labeling. Default false.",
                          "urgency_tiers": {
                            "low":      {"channels": "list — urgency 1-3"},
                            "medium":   {"channels": "list — urgency 4-6"},
                            "high":     {"channels": "list — urgency 7-8"},
                            "critical": {"channels": "list — urgency 9-10"}
                          },
                          "away_policy": {
                            "<channel>": "allow or block — e.g. push: allow, tts: block"
                          }
                        },
                        "minimal_seed": {
                          "push_targets": ["Default User Phone"],
                          "urgency_tiers": {
                            "low":      {"channels": ["push"]},
                            "medium":   {"channels": ["push"]},
                            "high":     {"channels": ["push", "tts"]},
                            "critical": {"channels": ["push", "tts"]}
                          },
                          "away_policy": {"push": "allow", "tts": "block"}
                        }
                      },
                      "family_cabinet": {
                        "cabinet": "sensor.zen_default_family_cabinet_resolved",
                        "key": "postman_profile",
                        "fields": {
                          "urgency_floor": {
                            "response_required_at": "int — urgency >= this requires ack (SP1)",
                            "escalation_window_minutes": "int — no ack in window → escalate (SP1)",
                            "escalation_targets": "all or list of person.* (SP1)"
                          }
                        },
                        "minimal_seed": {}
                      }
                    },

                    "channels": {
                      "push":  "Dispatches directly to notify.<slug> — slug derived from postman_profile.push_targets name. Bypasses notification_router to preserve native dict types (required for action buttons and image data).",
                      "tts":   "Dispatches to zen_dojotools_announce",
                      "teams": "Dispatches to zen_dojotools_teams action=send"
                    },

                    "urgency_tiers": {
                      "low":      "1-3",
                      "medium":   "4-6",
                      "high":     "7-8",
                      "critical": "9-10 — bypasses all gates if >= life_safety_bypass"
                    },

                    "image_notifications": {
                      "image_entity_field": "image_entity — preferred. Accepts any image.* or camera.* entity.",
                      "image_url_field": "image_url — raw path fallback. image_entity takes precedence if both set.",
                      "resolution": {
                        "image.zen_image_<slot>": "/local/zen_<slot>.jpg — generate_image slots (canvas, portrait, wallpaper, id_pic, dashboard_snap, home_state)",
                        "image.<other>":          "state_attr(entity, entity_picture) — any other HA image entity",
                        "camera.<entity>":        "/api/camera_proxy/<entity_id> — live camera frame at dispatch time"
                      },
                      "two_step_pattern": "Call zen_dojotools_generate_image first → get slot back → pass image.zen_image_<slot> as image_entity to Postman. Both calls return fast with no timeout risk.",
                      "note": "companion app fetches data.image lazily (on notification open) so camera/generated images do not need to be pre-fetched before dispatch"
                    },

                    "actionable_notifications": {
                      "field": "response_type",
                      "presets": {
                        "yes_no":        "Yes / No buttons",
                        "yes_no_ignore": "Yes / No / Ignore buttons",
                        "ok_cancel":     "Ok / Cancel buttons",
                        "acknowledge":   "Got it (single dismiss)",
                        "none":          "No buttons (default)"
                      },
                      "timeout_field":  "response_timeout_s — seconds to wait for tap. Default 60. Range 10-300.",
                      "how_it_works": [
                        "1. Postman auto-generates pm_tag (pm_<epoch_s>) and injects it into the notification",
                        "2. After push dispatch, Postman waits for zen_event(kind: postman_response, tag: pm_tag)",
                        "3. zen_postman_response_router converts mobile_app_notification_action → zen_event",
                        "4. Postman resumes with ack_action set to the tapped button (YES/NO/etc)",
                        "5. On timeout: ack_timed_out=true, ack_action=''",
                        "6. zen_event(kind: postman_ack) always fires after ack resolves — carries pm_tag, ack_action, ack_timed_out, caller_token, ack_depth",
                        "7. If on_ack field was provided, the matching branch fires as a new postman call"
                      ],
                      "caller_response_fields": {
                        "pm_tag":       "Correlation tag stamped on the notification and postman log",
                        "ack_action":   "Button tapped: YES | NO | IGNORE | OK | CANCEL | ACK | '' (timeout)",
                        "ack_timed_out": "true if no tap received within response_timeout_s"
                      },
                      "on_ack_chaining": {
                        "field": "on_ack",
                        "description": "JSON dict mapping ack outcome → partial postman call. Fired inline after parent ack resolves.",
                        "keys": "yes | no | ignore | ok | cancel | ack | timeout",
                        "branch_fields": "Any resolve_and_dispatch field: message, title, urgency, open_dashboard, response_type, on_ack (nested), tag, breakthrough, channel_hint",
                        "depth_limit": "Max 3 chain levels. Depth counter auto-managed — never pass ack_depth manually.",
                        "example": "{\"yes\": {\"message\": \"Opening Friday's dashboard.\", \"open_dashboard\": true, \"urgency\": 3}, \"timeout\": {\"message\": \"No response — ignoring.\"}}",
                        "postman_ack_event": "zen_event(kind: postman_ack) fires after EVERY response_type wait — subscribe independently without blocking caller. Carries: pm_tag, ack_action, ack_timed_out, caller_token, ack_depth."
                      },
                      "subscribe_independently": "Other automations can also listen for zen_event(kind: postman_response) and filter by tag without blocking the caller."
                    },

                    "notification_data_passthrough": {
                      "field": "notification_data",
                      "android_fields": {
                        "channel":            "Android notification channel name — configure sound/vibration in app settings",
                        "importance":         "min | low | default | high | max",
                        "color":              "Hex color e.g. #2DF56D",
                        "notification_icon":  "MDI icon e.g. mdi:cctv",
                        "sticky":             "bool — stays after tap",
                        "persistent":         "bool — non-dismissible (requires tag)",
                        "alert_once":         "bool — only alert on first delivery (requires tag)",
                        "vibrationPattern":   "e.g. 100, 1000, 100, 1000",
                        "visibility":         "public | private | secret",
                        "timeout":            "int seconds — auto-dismiss",
                        "chronometer":        "bool — show timer",
                        "progress":           "int — progress bar value",
                        "progress_max":       "int — progress bar max (default 1)",
                        "progress_indeterminate": "bool — animated progress bar",
                        "car_ui":             "bool — Android Auto visibility",
                        "clickAction":        "URL to open on tap",
                        "ttl":                "0 for high priority delivery"
                      },
                      "audio_url_field": "audio_url — AIFF/WAV/MP3/MPEG4 Audio up to 5 MB. Companion app only.",
                      "merge_order": "notification_data < image_url < audio_url < tag < response_type actions (later wins)"
                    },

                    "example_resolve": {
                      "mode": "resolve",
                      "target": "person.user",
                      "urgency": 5
                    },
                    "example_dispatch": {
                      "mode": "resolve_and_dispatch",
                      "target": "person.user",
                      "urgency": 5,
                      "message": "Test notification from Postman.",
                      "title": "Postman Test"
                    },
                    "example_camera_question": {
