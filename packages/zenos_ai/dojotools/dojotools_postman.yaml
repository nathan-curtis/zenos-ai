                failure_policy='return error shape',
                modes=['resolve','resolve_and_dispatch','direct_dispatch','author_policy','clear_tag','help','tool_manifest'],
                icon='mdi:send',
                color='cyan',
                stripe=3,
                impact='soft',
                mcp_exposed=true,

                caller_token=''
              ) | from_json -}}
        - stop: postman tool manifest
          response_variable: result


# ============================================================================
# zen_dojotools_announce
# TTS broadcast layer — called by zen_dojotools_postman when TTS channel is
# active but no tts_satellite is configured in the user postman_profile.
# Finds available assist_satellite entities and announces to them.
# Optional target_area scopes to that room's satellites.
# Fallback: persistent_notification when no satellites available.
# ============================================================================

  zen_dojotools_announce:
    alias: Zen DojoTools Announce
    mode: parallel
    max: 5
    icon: mdi:bullhorn-outline
    description: >-
      TTS broadcast v1.1.0. Finds available assist_satellite entities and announces.
      target_area scopes to that room's satellites (falls back to all).
      Fallback: persistent_notification when no satellites available.
      When satellite_entity + response_type are set, uses ask_question instead
      and returns ack_action in result.

    fields:
      message:
        name: Message
        description: Text to announce.
        required: true
        selector:
          text:
            multiline: true
      urgency:
        name: Urgency
        description: "1–10. Informational only."
        required: false
        default: 1
        selector:
          number:
            min: 1
            max: 10
            step: 1
      target_area:
        name: Target Area
        description: >-
          Scope to satellites in this area. Falls back to all if none found.
        required: false
        selector:
          text:
      duck_media:
        name: Duck Media
        description: >-
          If true (default), ducks active media players in target_area before
          announcing and restores after. Set false to announce without touching
          media. No-op when target_area is not set.
        required: false
        default: true
        selector:
          boolean:
      caller_token:
        name: Caller Token
        description: Opaque correlation token.
        required: false
        selector:
          text:
      satellite_entity:
        name: Satellite Entity
        description: Specific satellite entity_id. When set, targets this satellite only.
        required: false
        selector:
          text:
      response_type:
        name: Response Type
        description: When set with satellite_entity, uses ask_question instead of announce.
        required: false
        default: none
        selector:
          select:
            options:
            - none
            - yes_no
            - yes_no_ignore
            - ok_cancel
            - acknowledge
      voice_answers:
        name: Voice Answers
        description: JSON list of answer dicts for ask_question.
        required: false
        default: "[]"
        selector:
          text:
      mode:
        name: Mode
        description: >-
          Optional. Default 'announce' (existing TTS-broadcast behavior,
          unchanged). Pass 'tool_manifest' for self-description only — no
          announcement fires.
        required: false
        default: announce
        selector:
          select:
            options:
            - announce
            - tool_manifest

    sequence:

      # ── tool_manifest ────────────────────────────────────────────────────
      # Added because this script previously had no mode field at all, so a
      # generic tool_manifest scan (label_audit/repair/audit) fell through to
      # the normal announce flow, hit the empty-message guard below, and
      # returned status:error — silently invisible to every label/manifest
      # sweep in the system (no crash, no TTS side effect, just never scanned).
      - if: "{{ mode | default('announce', true) | string | trim | lower == 'tool_manifest' }}"
        then:
        - variables:
            result: >-
              {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
              {{- MF.tool_manifest(
                tool='zen_dojotools_announce',
                display_name='Announce',
                tier='dojotools',
                version='1.1.0',
                health='',
                required_labels=['dojotools'],
                optional_labels=[],
                consumes=[],
                returns='announce/ask_question result, or ack_action when response_type is set',
                failure_policy='return error shape',
                modes=['announce','tool_manifest'],
                icon='mdi:bullhorn-outline',
                color='amber'
              ) | from_json -}}
        - stop: zen_dojotools_announce tool_manifest
          response_variable: result

      # ── 0. Normalize ───────────────────────────────────────────────────────
      - variables:
          _msg:              "{{ message | default('', true) | string | trim }}"
          _area:             "{{ target_area | default('', true) | string | trim }}"
          _duck:             "{{ duck_media | default(true) | bool }}"
          _caller_token:     "{{ caller_token | default('', true) | string | trim }}"
          _satellite_entity: "{{ satellite_entity | default('', true) | string | trim }}"
          _response_type:    "{{ response_type | default('none', true) | string | trim | lower }}"
          _voice_answers: >-
            {%- set _v = voice_answers | default('[]', true) -%}
            {{ _v | from_json if _v is string else (_v if _v is iterable and _v is not string else []) }}
          _ack_action:       ''

      # ── 0.5. Guard: abort if message is empty (prevents blank TTS dings) ───
      - if: "{{ _msg == '' }}"
        then:
        - variables:
            result:
              status: error
              tool: zen_dojotools_announce
              message: "message is required"
        - stop: announce aborted — no message
          response_variable: result

      # ── 1. Resolve target satellites ──────────────────────────────────────
      - variables:
          _target_sats: >-
            {%- if _satellite_entity != '' -%}
              {{ [_satellite_entity] }}
            {%- else -%}
              {%- set _all = states.assist_satellite | map(attribute='entity_id') | list -%}
              {%- if _area != '' -%}
                {%- set _area_sats = area_entities(_area) | select('match', 'assist_satellite\\.') | list -%}
                {{ _area_sats if _area_sats | length > 0 else _all }}
              {%- else -%}
                {{ _all }}
              {%- endif -%}
            {%- endif -%}

      # ── 1.5. ask_question — voice response path (early return) ──────────────
      # Used when response_type is set and satellite_entity is configured.
      # ask_question blocks within dispatcher's coroutine — caller never waits.
      - if: "{{ _response_type not in ['', 'none'] and _satellite_entity != '' }}"
        then:
          - action: assist_satellite.ask_question
            data:
              entity_id: "{{ _satellite_entity }}"
              question:  "{{ _msg }}"
              answers:   "{{ _voice_answers }}"
            response_variable: _ask_result
            continue_on_error: true
          - variables:
              _ack_action: "{{ _ask_result.id | upper if _ask_result is mapping and _ask_result.id is not none else '' }}"
          - variables:
              _result: >-
                {{ {"status": "ok", "ack_action": _ack_action, "dispatched_to": [_satellite_entity], "fallback_used": false, "ducked": [], "caller_token": _caller_token} }}
          - stop: ask_question
            response_variable: _result

      # ── 1b. Find active media players to duck (area-scoped + duck=true) ────
      # Broadcast (no target_area) or duck_media=false skips ducking.
      - variables:
          _duck_players: >-
            {%- if _area != '' and _duck -%}
              {%- set _players = area_entities(_area) | select('match', 'media_player\\.') | list -%}
              {%- set ns = namespace(active=[]) -%}
              {%- for p in _players -%}
                {%- if states(p) == 'playing' -%}
                  {%- set _vol = state_attr(p, 'volume_level') | default(0.5, true) | float -%}
                  {%- set ns.active = ns.active + [{'entity_id': p, 'volume': _vol}] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.active }}
            {%- else -%}
              {{ [] }}
            {%- endif -%}

      # ── 2. Dispatch — satellite or persistent notification fallback ────────
      - choose:
        - conditions: "{{ _target_sats | length > 0 }}"
          sequence:

            # Duck active media in area
            - repeat:
                for_each: "{{ _duck_players }}"
                sequence:
                  - action: media_player.volume_set
                    data:
                      entity_id: "{{ repeat.item.entity_id }}"
                      volume_level: "{{ [repeat.item.volume * 0.25, 0.05] | max | round(2) }}"
                    continue_on_error: true

            # Brief pause for volume change to settle
            - if: "{{ _duck_players | length > 0 }}"
              then:
                - delay: "00:00:01"

            # Announce to each satellite
            - repeat:
                for_each: "{{ _target_sats }}"
                sequence:
                  - action: assist_satellite.announce
                    data:
                      entity_id: "{{ repeat.item }}"
                      message:   "{{ _msg }}"
                    continue_on_error: true

            # Restore media volumes
            - repeat:
                for_each: "{{ _duck_players }}"
                sequence:
                  - action: media_player.volume_set
                    data:
                      entity_id: "{{ repeat.item.entity_id }}"
                      volume_level: "{{ repeat.item.volume | round(2) }}"
                    continue_on_error: true

        default:
          - action: persistent_notification.create
            data:
              message:         "{{ _msg }}"
              title:           Announcement
              notification_id: "zen_announce_{{ as_timestamp(now()) | int }}"

      - variables:
          _result: >-
            {{
              {
                "status":        "ok",
                "ack_action":    _ack_action,
                "dispatched_to": _target_sats,
                "fallback_used": _target_sats | length == 0,
                "ducked":        _duck_players | map(attribute="entity_id") | list,
                "caller_token":  _caller_token
              }
            }}
      - stop: announce
        response_variable: _result


# ============================================================================
# zen_postman_response_router
# Converts mobile_app_notification_action → zen_event(kind: postman_response)
# so postman's step 8.5 push-ack wait and any other subscriber can read it.
# ============================================================================
automation:

  - id: 'zen_postman_response_router'
    alias: Zen Postman Response Router
    description: >-
      Listens for mobile_app_notification_action events (button taps on
      actionable push notifications) and re-emits them as
      zen_event(kind: postman_response) so zen_dojotools_postman and
      any independent subscriber can correlate by tag.
    mode: parallel
    max: 10
    triggers:
      - trigger: event
        event_type: mobile_app_notification_action
    actions:
      - variables:
          _tag:       "{{ trigger.event.data.get('tag', '') | string | trim }}"
          _action:    "{{ trigger.event.data.get('action', '') | string | upper | trim }}"
          _device_id: "{{ trigger.event.data.get('device_id', '') | string | trim }}"

      - condition: template
        value_template: "{{ _tag.startswith('pm_') }}"

      - event: zen_event
        event_data:
          event:
            kind:      postman_response
            tag:       "{{ _tag }}"
            action:    "{{ _action }}"
            device_id: "{{ _device_id }}"
            severity:  info
            timestamp: "{{ now().isoformat() }}"
