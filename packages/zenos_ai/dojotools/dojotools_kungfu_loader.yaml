###############################################################################
# ZenOS-AI Admin Tools — KungFu Loader
# zen_admintools_kungfu_loader
# Version: 5.1.0
#
# Deploys KFC (Kung Fu Component) dojo drawers via Scribe.
# Extracted from zen_admintools_prompt_loader — keeps KFC management
# separate from prompt/cortex operations.
#
# MODES:
#   status  (default, no-op) — returns deployment status for all managed KFCs.
#   factory — deploys zen_system, alert_manager, taskmaster, trapper_keeper.
#             Intended to be chained from prompt_loader on factory run.
#   deploy  — deploys KFCs controlled by boolean fields (all default false).
#             Use in HA Developer Tools for selective re-ship.
#
# FACTORY KFCs (auto-deploy in factory mode, manual opt-in in deploy mode):
#   zen_system        v1.1.0        — pipeline health watchdog
#   alert_manager     v1.5.0        — alert surface aggregator
#   taskmaster        v1.3.2        — task/calendar conductor
#   trapper_keeper    v2.5.0        — ambient index aggregator
#
# DEPLOY-ONLY KFCs (manual opt-in, never factory):
#   camera_manager    v1.0.0        — visual security scene analysis
#   security_manager  v1.1.1        — unified security picture
#   camera_heartbeat  v1.0.0        — scheduled camera cache refresh
#
# FOLLOWS: admintools conventions (caller_token, mode selector, boolean fields)
# CALLED BY: zen_admintools_prompt_loader (mode: factory chain)
###############################################################################

script:

  zen_admintools_kungfu_loader:
    alias: "KungFu Loader — Deploy KFC Dojo Drawers"
    description: >-
      Deploys KFC dojo drawers via Scribe. mode: status (default) = no-op + status report.
      mode: factory = all factory-flagged KFCs (zen_system, alert_manager, taskmaster,
      trapper_keeper). mode: deploy = boolean-selected KFCs. All booleans default false —
      running with no data is always safe.
    fields:
      mode:
        name: Deployment Mode
        description: >-
          status (default): no-op — returns deployment status for all managed KFCs.
          factory: deploys zen_system, alert_manager, taskmaster, trapper_keeper.
          deploy: deploys KFCs selected by individual boolean fields below.
        required: false
        default: status
        selector:
          select:
            options:
              - label: status — deployment status report (no-op)
                value: status
              - label: factory — deploy all factory-flagged KFCs
                value: factory
              - label: deploy — selective deploy by boolean fields
                value: deploy

      ship_zen_system:
        name: "Ship KFC: ZenOS System Health  [factory]"
        description: >-
          Deploy zen_system KFC. Pipeline health watchdog — cabinet resolvers, kill
          switches, summarizer staleness. factory: true (auto-ships in factory mode).
        default: false
        selector:
          boolean:

      ship_alert_manager:
        name: "Ship KFC: Alert Manager  [factory]"
        description: >-
          Deploy alert_manager KFC. Aggregates alert_when_* entities across all
          subsystems. Severity tiers: critical / urgent / warning / information.
          factory: true (auto-ships in factory mode).
        default: false
        selector:
          boolean:

      ship_taskmaster:
        name: "Ship KFC: Taskmaster  [factory]"
        description: >-
          Deploy taskmaster KFC. Monitors task load, calendar, and occupancy via
          Friday's Personal Task List conductor. factory: true (auto-ships in factory mode).
        default: false
        selector:
          boolean:

      ship_trapper_keeper:
        name: "Ship KFC: Trapper Keeper — Ambient Index  [factory]"
        description: >-
          Deploy trapper_keeper KFC. Ambient index aggregator — runs before SuperSummary,
          compresses ambient katas to breadcrumb+pointer format. factory: true.
        default: false
        selector:
          boolean:

      ship_camera_manager:
        name: "Ship KFC: Camera Manager  [deploy]"
        description: >-
          Deploy camera_manager KFC. Visual security layer — LLM scene analysis
          per camera, subject detection, cache freshness, perimeter state.
          Triggered by camera_scan_complete zen_event. deploy only.
        default: false
        selector:
          boolean:

      ship_security_manager:
        name: "Ship KFC: Security Manager  [deploy]"
        description: >-
          Deploy security_manager KFC. Synthesizes alarm panel, perimeter, camera,
          and RM spatial context into unified security picture. RM seed (seed whitelist
          required). deploy only — not factory.
        default: false
        selector:
          boolean:

      ship_camera_heartbeat:
        name: "Ship KFC: Camera Heartbeat  [deploy]"
        description: >-
          Deploy camera_heartbeat KFC. Scheduled cache refresh — label:exterior cameras
          on every heartbeat (wake/noon/evening/midnight), label:interior cameras only
          when Away or armed. Keeps camera_manager data within the 8h TTL. deploy only.
        default: false
        selector:
          boolean:

      caller_token:
        name: Caller Token
        description: Opaque token for caller correlation. Not interpreted by this script.
        required: false
        selector:
          text:

    sequence:

      # ── Normalize inputs ──────────────────────────────────────────────────
      - variables:
          caller_token: "{{- caller_token | default('') -}}"
      - variables:
          _mode: >-
            {%- set raw = mode | default('status') | string | lower | trim -%}
            {%- if raw in ['factory', 'deploy'] -%}{{ raw }}{%- else -%}status{%- endif -%}
          _factory_run: "{{- _mode == 'factory' -}}"
      - variables:
          _ship_zen_system:        "{{- _factory_run or (ship_zen_system | default(false) | bool) -}}"
          _ship_alert_manager:     "{{- _factory_run or (ship_alert_manager | default(false) | bool) -}}"
          _ship_taskmaster:        "{{- _factory_run or (ship_taskmaster | default(false) | bool) -}}"
          _ship_trapper_keeper:    "{{- _factory_run or (ship_trapper_keeper | default(false) | bool) -}}"
          _ship_camera_manager:    "{{- (ship_camera_manager | default(false) | bool) -}}"
          _ship_security_manager:  "{{- (ship_security_manager | default(false) | bool) -}}"
          _ship_camera_heartbeat:  "{{- (ship_camera_heartbeat | default(false) | bool) -}}"

      # ── Status mode: read drawers, build report, stop (no-op) ────────────
      - if: "{{- _mode == 'status' -}}"
        then:
          - variables:
              _dojo_cab: "{{ states('sensor.zen_dojo_cabinet_resolved') }}"
              _kata_cab: "{{ states('sensor.zen_kata_cabinet_resolved') }}"
          - action: script.zen_dojotools_filecabinet
            metadata: {}
            data:
              action_type: read
              volume_entity_id:
                - "{{ _dojo_cab }}"
              key: zen_system
            response_variable: _st_zen_system
          - action: script.zen_dojotools_filecabinet
            metadata: {}
            data:
              action_type: read
              volume_entity_id:
                - "{{ _dojo_cab }}"
              key: alert_manager
            response_variable: _st_alert_manager
          - action: script.zen_dojotools_filecabinet
            metadata: {}
            data:
              action_type: read
              volume_entity_id:
                - "{{ _dojo_cab }}"
              key: taskmaster
            response_variable: _st_taskmaster
          - action: script.zen_dojotools_filecabinet
            metadata: {}
            data:
              action_type: read
              volume_entity_id:
                - "{{ _dojo_cab }}"
              key: trapper_keeper
            response_variable: _st_trapper_keeper
          # ── Read kata timestamps ─────────────────────────────────────────────
          - action: script.zen_dojotools_filecabinet
            metadata: {}
            data:
              action_type: read
              volume_entity_id:
                - "{{ _kata_cab }}"
              key: zen_system
            response_variable: _kt_zen_system
          - action: script.zen_dojotools_filecabinet
            metadata: {}
            data:
              action_type: read
              volume_entity_id:
                - "{{ _kata_cab }}"
              key: alert_manager
            response_variable: _kt_alert_manager
          - action: script.zen_dojotools_filecabinet
            metadata: {}
            data:
              action_type: read
              volume_entity_id:
                - "{{ _kata_cab }}"
              key: taskmaster
            response_variable: _kt_taskmaster
          - action: script.zen_dojotools_filecabinet
            metadata: {}
            data:
              action_type: read
              volume_entity_id:
                - "{{ _kata_cab }}"
              key: trapper_keeper
            response_variable: _kt_trapper_keeper
          - action: script.zen_dojotools_filecabinet
            metadata: {}
            data:
              action_type: read
              volume_entity_id:
                - "{{ _dojo_cab }}"
              key: camera_manager
            response_variable: _st_camera_manager
          - action: script.zen_dojotools_filecabinet
            metadata: {}
            data:
              action_type: read
              volume_entity_id:
                - "{{ _kata_cab }}"
              key: camera_manager
            response_variable: _kt_camera_manager
          - action: script.zen_dojotools_filecabinet
            metadata: {}
            data:
              action_type: read
              volume_entity_id:
                - "{{ _dojo_cab }}"
              key: security_manager
            response_variable: _st_security_manager
          - action: script.zen_dojotools_filecabinet
            metadata: {}
            data:
              action_type: read
              volume_entity_id:
                - "{{ _kata_cab }}"
              key: security_manager
            response_variable: _kt_security_manager
          - action: script.zen_dojotools_filecabinet
            metadata: {}
            data:
              action_type: read
              volume_entity_id:
                - "{{ _dojo_cab }}"
              key: camera_heartbeat
            response_variable: _st_camera_heartbeat
          - action: script.zen_dojotools_filecabinet
            metadata: {}
            data:
              action_type: read
              volume_entity_id:
                - "{{ _kata_cab }}"
              key: camera_heartbeat
            response_variable: _kt_camera_heartbeat
          # ── Compute KFC versions, enabled, and last kata timestamp ───────────
          - variables:
              _zs_ver: >-
                {%- set r = _st_zen_system.get('result', '{}') | default('{}', true) -%}
                {%- set d = (r | from_json) if (r is string and r | length > 2) else {} -%}
                {%- set outer = d.get('zen_system', {}) if d is mapping else {} -%}
                {%- set val = outer.get('value', outer) if outer is mapping else {} -%}
                {%- set val = val.get('value', val) if val is mapping and 'value' in val else val -%}
                {{ val.get('version', val.get('version_semantic', 'not_deployed')) if val is mapping and val | length > 0 else 'not_deployed' }}
              _zs_ena: >-
                {%- set r = _st_zen_system.get('result', '{}') | default('{}', true) -%}
                {%- set d = (r | from_json) if (r is string and r | length > 2) else {} -%}
                {%- set outer = d.get('zen_system', {}) if d is mapping else {} -%}
                {%- set val = outer.get('value', outer) if outer is mapping else {} -%}
                {%- set val = val.get('value', val) if val is mapping and 'value' in val else val -%}
                {{ val.get('meta', {}).get('enabled', false) if val is mapping else false }}
              _am_ver: >-
                {%- set r = _st_alert_manager.get('result', '{}') | default('{}', true) -%}
                {%- set d = (r | from_json) if (r is string and r | length > 2) else {} -%}
                {%- set outer = d.get('alert_manager', {}) if d is mapping else {} -%}
                {%- set val = outer.get('value', outer) if outer is mapping else {} -%}
                {%- set val = val.get('value', val) if val is mapping and 'value' in val else val -%}
                {{ val.get('version', val.get('version_semantic', 'not_deployed')) if val is mapping and val | length > 0 else 'not_deployed' }}
              _am_ena: >-
                {%- set r = _st_alert_manager.get('result', '{}') | default('{}', true) -%}
                {%- set d = (r | from_json) if (r is string and r | length > 2) else {} -%}
                {%- set outer = d.get('alert_manager', {}) if d is mapping else {} -%}
                {%- set val = outer.get('value', outer) if outer is mapping else {} -%}
                {%- set val = val.get('value', val) if val is mapping and 'value' in val else val -%}
                {{ val.get('meta', {}).get('enabled', false) if val is mapping else false }}
              _tm_ver: >-
                {%- set r = _st_taskmaster.get('result', '{}') | default('{}', true) -%}
                {%- set d = (r | from_json) if (r is string and r | length > 2) else {} -%}
                {%- set outer = d.get('taskmaster', {}) if d is mapping else {} -%}
                {%- set val = outer.get('value', outer) if outer is mapping else {} -%}
                {%- set val = val.get('value', val) if val is mapping and 'value' in val else val -%}
                {{ val.get('version', val.get('version_semantic', 'not_deployed')) if val is mapping and val | length > 0 else 'not_deployed' }}
              _tm_ena: >-
                {%- set r = _st_taskmaster.get('result', '{}') | default('{}', true) -%}
                {%- set d = (r | from_json) if (r is string and r | length > 2) else {} -%}
                {%- set outer = d.get('taskmaster', {}) if d is mapping else {} -%}
                {%- set val = outer.get('value', outer) if outer is mapping else {} -%}
                {%- set val = val.get('value', val) if val is mapping and 'value' in val else val -%}
                {{ val.get('meta', {}).get('enabled', false) if val is mapping else false }}
              _tk_ver: >-
                {%- set r = _st_trapper_keeper.get('result', '{}') | default('{}', true) -%}
                {%- set d = (r | from_json) if (r is string and r | length > 2) else {} -%}
                {%- set outer = d.get('trapper_keeper', {}) if d is mapping else {} -%}
                {%- set val = outer.get('value', outer) if outer is mapping else {} -%}
                {%- set val = val.get('value', val) if val is mapping and 'value' in val else val -%}
                {{ val.get('version', val.get('version_semantic', 'not_deployed')) if val is mapping and val | length > 0 else 'not_deployed' }}
              _tk_ena: >-
                {%- set r = _st_trapper_keeper.get('result', '{}') | default('{}', true) -%}
                {%- set d = (r | from_json) if (r is string and r | length > 2) else {} -%}
                {%- set outer = d.get('trapper_keeper', {}) if d is mapping else {} -%}
                {%- set val = outer.get('value', outer) if outer is mapping else {} -%}
                {%- set val = val.get('value', val) if val is mapping and 'value' in val else val -%}
                {{ val.get('meta', {}).get('enabled', false) if val is mapping else false }}
              _cm_ver: >-
                {%- set r = _st_camera_manager.get('result', '{}') | default('{}', true) -%}
                {%- set d = (r | from_json) if (r is string and r | length > 2) else {} -%}
                {%- set outer = d.get('camera_manager', {}) if d is mapping else {} -%}
                {%- set val = outer.get('value', outer) if outer is mapping else {} -%}
                {%- set val = val.get('value', val) if val is mapping and 'value' in val else val -%}
                {{ val.get('version', val.get('version_semantic', 'not_deployed')) if val is mapping and val | length > 0 else 'not_deployed' }}
              _cm_ena: >-
                {%- set r = _st_camera_manager.get('result', '{}') | default('{}', true) -%}
                {%- set d = (r | from_json) if (r is string and r | length > 2) else {} -%}
                {%- set outer = d.get('camera_manager', {}) if d is mapping else {} -%}
                {%- set val = outer.get('value', outer) if outer is mapping else {} -%}
                {%- set val = val.get('value', val) if val is mapping and 'value' in val else val -%}
                {{ val.get('meta', {}).get('enabled', false) if val is mapping else false }}
              _sm_ver: >-
                {%- set r = _st_security_manager.get('result', '{}') | default('{}', true) -%}
                {%- set d = (r | from_json) if (r is string and r | length > 2) else {} -%}
                {%- set outer = d.get('security_manager', {}) if d is mapping else {} -%}
                {%- set val = outer.get('value', outer) if outer is mapping else {} -%}
                {%- set val = val.get('value', val) if val is mapping and 'value' in val else val -%}
                {{ val.get('version', val.get('version_semantic', 'not_deployed')) if val is mapping and val | length > 0 else 'not_deployed' }}
              _sm_ena: >-
                {%- set r = _st_security_manager.get('result', '{}') | default('{}', true) -%}
                {%- set d = (r | from_json) if (r is string and r | length > 2) else {} -%}
                {%- set outer = d.get('security_manager', {}) if d is mapping else {} -%}
                {%- set val = outer.get('value', outer) if outer is mapping else {} -%}
                {%- set val = val.get('value', val) if val is mapping and 'value' in val else val -%}
                {{ val.get('meta', {}).get('enabled', false) if val is mapping else false }}
              _ch_ver: >-
                {%- set r = _st_camera_heartbeat.get('result', '{}') | default('{}', true) -%}
                {%- set d = (r | from_json) if (r is string and r | length > 2) else {} -%}
                {%- set outer = d.get('camera_heartbeat', {}) if d is mapping else {} -%}
                {%- set val = outer.get('value', outer) if outer is mapping else {} -%}
                {%- set val = val.get('value', val) if val is mapping and 'value' in val else val -%}
                {{ val.get('version', val.get('version_semantic', 'not_deployed')) if val is mapping and val | length > 0 else 'not_deployed' }}
              _ch_ena: >-
                {%- set r = _st_camera_heartbeat.get('result', '{}') | default('{}', true) -%}
                {%- set d = (r | from_json) if (r is string and r | length > 2) else {} -%}
                {%- set outer = d.get('camera_heartbeat', {}) if d is mapping else {} -%}
                {%- set val = outer.get('value', outer) if outer is mapping else {} -%}
                {%- set val = val.get('value', val) if val is mapping and 'value' in val else val -%}
                {{ val.get('meta', {}).get('enabled', false) if val is mapping else false }}
          # ── Extract kata timestamps ──────────────────────────────────────────
          - variables:
              _zs_last: >-
                {%- set r = _kt_zen_system.get('result', '{}') | default('{}', true) -%}
                {%- set d = (r | from_json) if (r is string and r | length > 2) else {} -%}
                {{ d.get('zen_system', {}).get('timestamp', 'never') | trim if d is mapping else 'never' }}
              _am_last: >-
                {%- set r = _kt_alert_manager.get('result', '{}') | default('{}', true) -%}
                {%- set d = (r | from_json) if (r is string and r | length > 2) else {} -%}
                {{ d.get('alert_manager', {}).get('timestamp', 'never') | trim if d is mapping else 'never' }}
              _tm_last: >-
                {%- set r = _kt_taskmaster.get('result', '{}') | default('{}', true) -%}
                {%- set d = (r | from_json) if (r is string and r | length > 2) else {} -%}
                {{ d.get('taskmaster', {}).get('timestamp', 'never') | trim if d is mapping else 'never' }}
              _tk_last: >-
                {%- set r = _kt_trapper_keeper.get('result', '{}') | default('{}', true) -%}
                {%- set d = (r | from_json) if (r is string and r | length > 2) else {} -%}
                {{ d.get('trapper_keeper', {}).get('timestamp', 'never') | trim if d is mapping else 'never' }}
              _cm_last: >-
                {%- set r = _kt_camera_manager.get('result', '{}') | default('{}', true) -%}
                {%- set d = (r | from_json) if (r is string and r | length > 2) else {} -%}
                {{ d.get('camera_manager', {}).get('timestamp', 'never') | trim if d is mapping else 'never' }}
              _sm_last: >-
                {%- set r = _kt_security_manager.get('result', '{}') | default('{}', true) -%}
                {%- set d = (r | from_json) if (r is string and r | length > 2) else {} -%}
                {{ d.get('security_manager', {}).get('timestamp', 'never') | trim if d is mapping else 'never' }}
              _ch_last: >-
                {%- set r = _kt_camera_heartbeat.get('result', '{}') | default('{}', true) -%}
                {%- set d = (r | from_json) if (r is string and r | length > 2) else {} -%}
                {{ d.get('camera_heartbeat', {}).get('timestamp', 'never') | trim if d is mapping else 'never' }}
          # ── Compute deployed flags ───────────────────────────────────────────
          - variables:
              _zs_dep: "{{ (_zs_ver | trim) != 'not_deployed' }}"
              _am_dep: "{{ (_am_ver | trim) != 'not_deployed' }}"
              _tm_dep: "{{ (_tm_ver | trim) != 'not_deployed' }}"
              _tk_dep: "{{ (_tk_ver | trim) != 'not_deployed' }}"
              _cm_dep: "{{ (_cm_ver | trim) != 'not_deployed' }}"
              _sm_dep: "{{ (_sm_ver | trim) != 'not_deployed' }}"
              _ch_dep: "{{ (_ch_ver | trim) != 'not_deployed' }}"
          - variables:
              _kfc_status:
                status: success
                mode: status
                caller_token: "{{ caller_token }}"
                dojo_capacity: "75.8%"
                kfcs:
                  zen_system:
                    deployed: "{{ _zs_dep }}"
                    enabled: "{{ _zs_ena }}"
                    version: "{{ _zs_ver | trim }}"
                    target: "1.1.0"
                    version_match: "{{ (_zs_ver | trim) == '1.1.0' }}"
                    last_summary_at: "{{ _zs_last | trim }}"
                    factory: true
                  alert_manager:
                    deployed: "{{ _am_dep }}"
                    enabled: "{{ _am_ena }}"
                    version: "{{ _am_ver | trim }}"
                    target: "1.5.0"
                    version_match: "{{ (_am_ver | trim) == '1.5.0' }}"
                    last_summary_at: "{{ _am_last | trim }}"
                    factory: true
                  taskmaster:
                    deployed: "{{ _tm_dep }}"
                    enabled: "{{ _tm_ena }}"
                    version: "{{ _tm_ver | trim }}"
                    target: "1.3.2"
                    version_match: "{{ (_tm_ver | trim) == '1.3.2' }}"
                    last_summary_at: "{{ _tm_last | trim }}"
                    factory: true
                  trapper_keeper:
                    deployed: "{{ _tk_dep }}"
                    enabled: "{{ _tk_ena }}"
                    version: "{{ _tk_ver | trim }}"
                    target: "2.5.0"
                    version_match: "{{ (_tk_ver | trim) == '2.5.0' }}"
                    last_summary_at: "{{ _tk_last | trim }}"
                    factory: true
                  camera_manager:
                    deployed: "{{ _cm_dep }}"
                    enabled: "{{ _cm_ena }}"
                    version: "{{ _cm_ver | trim }}"
                    target: "1.0.0"
                    version_match: "{{ (_cm_ver | trim) == '1.0.0' }}"
                    last_summary_at: "{{ _cm_last | trim }}"
                    factory: false
                  security_manager:
                    deployed: "{{ _sm_dep }}"
                    enabled: "{{ _sm_ena }}"
                    version: "{{ _sm_ver | trim }}"
                    target: "1.1.1"
                    version_match: "{{ (_sm_ver | trim) == '1.1.1' }}"
                    last_summary_at: "{{ _sm_last | trim }}"
                    factory: false
                  camera_heartbeat:
                    deployed: "{{ _ch_dep }}"
                    enabled: "{{ _ch_ena }}"
                    version: "{{ _ch_ver | trim }}"
                    target: "1.0.0"
                    version_match: "{{ (_ch_ver | trim) == '1.0.0' }}"
                    last_summary_at: "{{ _ch_last | trim }}"
                    factory: false
          - stop: "KungFu Loader — status (no-op)"
            response_variable: _kfc_status

      # ── Deploy: zen_system ───────────────────────────────────────────────
      - if: "{{- _ship_zen_system -}}"
        then:
          - alias: 'Ship KFC: zen_system (Scribe — new_thought)'
            action: script.zen_dojotools_scribe
            data:
              mode: new_thought
              key: zen_system
              friendly_name: ZenOS System Health
              version_semantic: "5.1.0"
              component_summary: >-
                ZenOS pipeline health — cabinet resolvers, kill switches, summarizer staleness,
                and monk status. The meta-KFC that watches the watchers.
              component_instructions: >-
                Surface health state first. If any sensor is warn or critical, or any
                pipeline kill switch is off — lead with that. If all ok — single line nominal.

                Priority order for reporting:
                1. Cabinets missing or unavailable — surface before anything else. No cabinets = no cognition.
                2. Kill switches off — pipeline_master, supersummary_enabled, ninja_summarizer_enabled. Name the specific switch that is off.
                3. Summarizer staleness — if zen_summary timestamp > 15 min, flag as stale. > 30 min = critical stale.
                4. Monk errors — if supersummary_status is error/timeout/none, flag with status value.
                5. Schema health — if schema_ok false, flag. No template = no monk output structure.

                NAVIGATION — do NOT enumerate entity IDs. Express discovery paths instead:
                - To find system health sensors: query label 'zen_system'
                - To find all ZenOS entities: query label 'zen'
                - To find KFC specs: query label 'dojo'
                - To find kill switches: query label 'zen_system', filter input_boolean domain

                In watchlist and attention fields, write "entities under label 'zen_system'" not a list of sensor.* IDs. Labels are stable; entity IDs are not. The label IS the scope.

                Do NOT expand individual component kata here — this component owns the rollup signal only. If you see warn/critical on a specific component, name it and stop. The per-component monk will have detail.

                Nominal report format: "ZenOS nominal. [N] components active. Last summary [X] min ago."
                Alert format: "ZenOS [warn|critical]: [specific issue]. [switch name|sensor name|cabinet name]."

                MASTER SWITCH RULE:
                ZenOS pipeline kill switches (zen_summarizers_enabled,
                zen_ninja_summarizer_enabled, zen_supersummary_enabled, etc.) being OFF
                IS a monitored deviation — flag it at priority 2 above.
                Integration/subsystem master switches (Airspace, Grocy, media zones,
                or any non-ZenOS feature enable) being off is an intentional user choice
                — treat as informational only, max urgency contribution 1.
                Distinguish by name: zen_* kill switches → flag. All others → informational.

                CONVERSATIONAL REFERENCE:
                  When the user says "what's the summary", "give me the summary", "what's the zen summary",
                  "what does the summary say", "summary status", or similar — he means the zen_summary
                  kata from sensor.zenos_kata_cabinet. Read it and present the synthesized view:
                    - active_components with signals → name them and what they're flagging
                    - zen_summary.attention items → mention if anything notable
                    - ambient_nav → sweep in one sentence if nothing urgent
                  Speak the conclusion, not the structure. Don't recite keys — interpret the output.
                  If zen_summary is stale (> 15 min old), note it before presenting.
              label: zen_system
              trigger_subscriptions: ha_start,daily_midnight
              caller_id: zen_admintools_kungfu_loader
          - alias: 'Ship KFC: zen_system (Scribe — formalize_scroll)'
