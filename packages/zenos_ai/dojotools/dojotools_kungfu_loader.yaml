###############################################################################
# ZenOS-AI Admin Tools — KungFu Loader
# zen_admintools_kungfu_loader
# Version: 5.1.0
#
# Deploys KFC (Kung Fu Component) dojo drawers via Scribe.
# Extracted from zen_admintools_prompt_loader — keeps KFC management
# separate from prompt/cortex operations.
#
# MODES:
#   status  (default, no-op) — returns deployment status for all managed KFCs.
#   factory — deploys zen_system, alert_manager, trapper_keeper.
#             Intended to be chained from prompt_loader on factory run.
#   deploy  — deploys KFCs controlled by boolean fields (all default false).
#             Use in HA Developer Tools for selective re-ship.
#
# taskmaster — MOVED to KF5 self-registration (2026-07-25). It no longer ships
#   from here; it self-registers via zen_dojotools_taskmaster mode=kfc_manifest,
#   discovered automatically by zen_dojotools_manifest mode=bootstrap_kfc once
#   the script carries the zen_kfc_provider HA label.
#
# FACTORY KFCs (auto-deploy in factory mode, manual opt-in in deploy mode):
#   zen_system        v1.1.0        — pipeline health watchdog
#   alert_manager     v1.5.0        — alert surface aggregator
#   trapper_keeper    v2.5.0        — ambient index aggregator
#
# DEPLOY-ONLY KFCs (manual opt-in, never factory):
#   camera_manager    v1.0.0        — visual security scene analysis
#   security_manager  v1.2.0        — unified security picture + state field reading rules
#   camera_heartbeat  v1.0.0        — scheduled camera cache refresh
#
# FOLLOWS: admintools conventions (caller_token, mode selector, boolean fields)
# CALLED BY: zen_admintools_prompt_loader (mode: factory chain)
###############################################################################

script:

  zen_admintools_kungfu_loader:
    alias: "KungFu Loader — Deploy KFC Dojo Drawers"
    description: >-
      Deploys KFC dojo drawers via Scribe. mode: status (default) = no-op + status report.
      mode: factory = all factory-flagged KFCs (zen_system, alert_manager,
      trapper_keeper). mode: deploy = boolean-selected KFCs. All booleans default false —
      running with no data is always safe. taskmaster self-registers via KF5 —
      see zen_dojotools_taskmaster mode=kfc_manifest.
    fields:
      mode:
        name: Deployment Mode
        description: >-
          status (default): no-op — returns deployment status for all managed KFCs.
          factory: deploys zen_system, alert_manager, trapper_keeper.
          deploy: deploys KFCs selected by individual boolean fields below.
        required: false
        default: status
        selector:
          select:
            options:
              - label: status — deployment status report (no-op)
                value: status
              - label: factory — deploy all factory-flagged KFCs
                value: factory
              - label: deploy — selective deploy by boolean fields
                value: deploy

      ship_zen_system:
        name: "Ship KFC: ZenOS System Health  [factory]"
        description: >-
          Deploy zen_system KFC. Pipeline health watchdog — cabinet resolvers, kill
          switches, summarizer staleness. factory: true (auto-ships in factory mode).
        default: false
        selector:
          boolean:

      ship_alert_manager:
        name: "Ship KFC: Alert Manager  [factory]"
        description: >-
          Deploy alert_manager KFC. Aggregates alert_when_* entities across all
          subsystems. Severity tiers: critical / urgent / warning / information.
          factory: true (auto-ships in factory mode).
        default: false
        selector:
          boolean:

      ship_trapper_keeper:
        name: "Ship KFC: Trapper Keeper — Ambient Index  [factory]"
        description: >-
          Deploy trapper_keeper KFC. Ambient index aggregator — runs before SuperSummary,
          compresses ambient katas to breadcrumb+pointer format. factory: true.
        default: false
        selector:
          boolean:

      ship_camera_manager:
        name: "Ship KFC: Camera Manager  [deploy]"
        description: >-
          Deploy camera_manager KFC. Visual security layer — LLM scene analysis
          per camera, subject detection, cache freshness, perimeter state.
          Triggered by camera_scan_complete zen_event. deploy only.
        default: false
        selector:
          boolean:

      ship_security_manager:
        name: "Ship KFC: Security Manager  [deploy]"
        description: >-
          Deploy security_manager KFC. Synthesizes alarm panel, perimeter, camera,
          and RM spatial context into unified security picture. RM seed (seed whitelist
          required). deploy only — not factory.
        default: false
        selector:
          boolean:

      ship_camera_heartbeat:
        name: "Ship KFC: Camera Heartbeat  [deploy]"
        description: >-
          Deploy camera_heartbeat KFC. Scheduled cache refresh — label:exterior cameras
          on every heartbeat (wake/noon/evening/midnight), label:interior cameras only
          when Away or armed. Keeps camera_manager data within the 8h TTL. deploy only.
        default: false
        selector:
          boolean:

      readback:
        name: Include Readback Content
        description: >-
          If true, includes first 200 chars of each deployed KFC's landed payload
          for verification. Useful after a factory run to confirm content landed.
        default: false
        selector:
          boolean:

      caller_token:
        name: Caller Token
        description: Opaque token for caller correlation. Not interpreted by this script.
        required: false
        selector:
          text:

    sequence:

      # ── Normalize inputs ──────────────────────────────────────────────────
      - variables:
          caller_token: "{{- caller_token | default('') -}}"
      - variables:
          _mode: >-
            {%- set raw = mode | default('status') | string | lower | trim -%}
            {%- if raw in ['factory', 'deploy'] -%}{{ raw }}{%- else -%}status{%- endif -%}
          _factory_run: "{{- _mode == 'factory' -}}"
      - variables:
          _ship_zen_system:        "{{- _factory_run or (ship_zen_system | default(false) | bool) -}}"
          _ship_alert_manager:     "{{- _factory_run or (ship_alert_manager | default(false) | bool) -}}"
          _ship_trapper_keeper:    "{{- _factory_run or (ship_trapper_keeper | default(false) | bool) -}}"
          _ship_camera_manager:    "{{- (ship_camera_manager | default(false) | bool) -}}"
          _ship_security_manager:  "{{- (ship_security_manager | default(false) | bool) -}}"
          _ship_camera_heartbeat:  "{{- (ship_camera_heartbeat | default(false) | bool) -}}"

      # ── Status mode: read drawers, build report, stop (no-op) ────────────
      - if: "{{- _mode == 'status' -}}"
        then:
          - variables:
              _dojo_cab: "{{ states('sensor.zen_dojo_cabinet_resolved') }}"
              _kata_cab: "{{ states('sensor.zen_kata_cabinet_resolved') }}"
          - action: script.zen_dojotools_filecabinet
            metadata: {}
            data:
              action_type: read
              volume_entity_id:
                - "{{ _dojo_cab }}"
              key: zen_system
            response_variable: _st_zen_system
          - action: script.zen_dojotools_filecabinet
            metadata: {}
            data:
              action_type: read
              volume_entity_id:
                - "{{ _dojo_cab }}"
              key: alert_manager
            response_variable: _st_alert_manager
          - action: script.zen_dojotools_filecabinet
            metadata: {}
            data:
              action_type: read
              volume_entity_id:
                - "{{ _dojo_cab }}"
              key: trapper_keeper
            response_variable: _st_trapper_keeper
          # ── Read kata timestamps ─────────────────────────────────────────────
          - action: script.zen_dojotools_filecabinet
            metadata: {}
            data:
              action_type: read
              volume_entity_id:
                - "{{ _kata_cab }}"
              key: zen_system
            response_variable: _kt_zen_system
          - action: script.zen_dojotools_filecabinet
            metadata: {}
            data:
              action_type: read
              volume_entity_id:
                - "{{ _kata_cab }}"
              key: alert_manager
            response_variable: _kt_alert_manager
          - action: script.zen_dojotools_filecabinet
            metadata: {}
            data:
              action_type: read
              volume_entity_id:
                - "{{ _kata_cab }}"
              key: trapper_keeper
            response_variable: _kt_trapper_keeper
          - action: script.zen_dojotools_filecabinet
            metadata: {}
            data:
              action_type: read
              volume_entity_id:
                - "{{ _dojo_cab }}"
              key: camera_manager
            response_variable: _st_camera_manager
          - action: script.zen_dojotools_filecabinet
            metadata: {}
            data:
              action_type: read
              volume_entity_id:
                - "{{ _kata_cab }}"
              key: camera_manager
            response_variable: _kt_camera_manager
          - action: script.zen_dojotools_filecabinet
            metadata: {}
            data:
              action_type: read
              volume_entity_id:
                - "{{ _dojo_cab }}"
              key: security_manager
            response_variable: _st_security_manager
          - action: script.zen_dojotools_filecabinet
            metadata: {}
            data:
              action_type: read
              volume_entity_id:
                - "{{ _kata_cab }}"
              key: security_manager
            response_variable: _kt_security_manager
          - action: script.zen_dojotools_filecabinet
            metadata: {}
            data:
              action_type: read
              volume_entity_id:
                - "{{ _dojo_cab }}"
              key: camera_heartbeat
            response_variable: _st_camera_heartbeat
          - action: script.zen_dojotools_filecabinet
            metadata: {}
            data:
              action_type: read
              volume_entity_id:
                - "{{ _kata_cab }}"
              key: camera_heartbeat
            response_variable: _kt_camera_heartbeat
          # ── Compute KFC versions, enabled, and last kata timestamp ───────────
          - variables:
              _zs_ver: >-
                {%- set _r = _st_zen_system if _st_zen_system is mapping else {} -%}
                {%- set _v = _r.get('value', none) -%}
                {%- set _v = (_v | from_json(none)) if _v is string else _v -%}
                {{ _v.get('version', _v.get('version_semantic', 'not_deployed')) if _v is mapping and _v | length > 0 else 'not_deployed' }}
              _zs_ena: >-
                {%- set _r = _st_zen_system if _st_zen_system is mapping else {} -%}
                {%- set _v = _r.get('value', none) -%}
                {%- set _v = (_v | from_json(none)) if _v is string else _v -%}
                {{ _v.get('meta', {}).get('enabled', false) if _v is mapping else false }}
              _am_ver: >-
                {%- set _r = _st_alert_manager if _st_alert_manager is mapping else {} -%}
                {%- set _v = _r.get('value', none) -%}
                {%- set _v = (_v | from_json(none)) if _v is string else _v -%}
                {{ _v.get('version', _v.get('version_semantic', 'not_deployed')) if _v is mapping and _v | length > 0 else 'not_deployed' }}
              _am_ena: >-
                {%- set _r = _st_alert_manager if _st_alert_manager is mapping else {} -%}
                {%- set _v = _r.get('value', none) -%}
                {%- set _v = (_v | from_json(none)) if _v is string else _v -%}
                {{ _v.get('meta', {}).get('enabled', false) if _v is mapping else false }}
              _tk_ver: >-
                {%- set _r = _st_trapper_keeper if _st_trapper_keeper is mapping else {} -%}
                {%- set _v = _r.get('value', none) -%}
                {%- set _v = (_v | from_json(none)) if _v is string else _v -%}
                {{ _v.get('version', _v.get('version_semantic', 'not_deployed')) if _v is mapping and _v | length > 0 else 'not_deployed' }}
              _tk_ena: >-
                {%- set _r = _st_trapper_keeper if _st_trapper_keeper is mapping else {} -%}
                {%- set _v = _r.get('value', none) -%}
                {%- set _v = (_v | from_json(none)) if _v is string else _v -%}
                {{ _v.get('meta', {}).get('enabled', false) if _v is mapping else false }}
              _cm_ver: >-
                {%- set _r = _st_camera_manager if _st_camera_manager is mapping else {} -%}
                {%- set _v = _r.get('value', none) -%}
                {%- set _v = (_v | from_json(none)) if _v is string else _v -%}
                {{ _v.get('version', _v.get('version_semantic', 'not_deployed')) if _v is mapping and _v | length > 0 else 'not_deployed' }}
              _cm_ena: >-
                {%- set _r = _st_camera_manager if _st_camera_manager is mapping else {} -%}
                {%- set _v = _r.get('value', none) -%}
                {%- set _v = (_v | from_json(none)) if _v is string else _v -%}
                {{ _v.get('meta', {}).get('enabled', false) if _v is mapping else false }}
              _sm_ver: >-
                {%- set _r = _st_security_manager if _st_security_manager is mapping else {} -%}
                {%- set _v = _r.get('value', none) -%}
                {%- set _v = (_v | from_json(none)) if _v is string else _v -%}
                {{ _v.get('version', _v.get('version_semantic', 'not_deployed')) if _v is mapping and _v | length > 0 else 'not_deployed' }}
              _sm_ena: >-
                {%- set _r = _st_security_manager if _st_security_manager is mapping else {} -%}
                {%- set _v = _r.get('value', none) -%}
                {%- set _v = (_v | from_json(none)) if _v is string else _v -%}
                {{ _v.get('meta', {}).get('enabled', false) if _v is mapping else false }}
              _ch_ver: >-
                {%- set _r = _st_camera_heartbeat if _st_camera_heartbeat is mapping else {} -%}
                {%- set _v = _r.get('value', none) -%}
                {%- set _v = (_v | from_json(none)) if _v is string else _v -%}
                {{ _v.get('version', _v.get('version_semantic', 'not_deployed')) if _v is mapping and _v | length > 0 else 'not_deployed' }}
              _ch_ena: >-
                {%- set _r = _st_camera_heartbeat if _st_camera_heartbeat is mapping else {} -%}
                {%- set _v = _r.get('value', none) -%}
                {%- set _v = (_v | from_json(none)) if _v is string else _v -%}
                {{ _v.get('meta', {}).get('enabled', false) if _v is mapping else false }}
          # ── Extract kata timestamps ──────────────────────────────────────────
          - variables:
              _zs_last: >-
                {{ (_kt_zen_system.get('updated_at', 'never') | default('never', true)) if _kt_zen_system is mapping else 'never' }}
              _am_last: >-
                {{ (_kt_alert_manager.get('updated_at', 'never') | default('never', true)) if _kt_alert_manager is mapping else 'never' }}
              _tk_last: >-
                {{ (_kt_trapper_keeper.get('updated_at', 'never') | default('never', true)) if _kt_trapper_keeper is mapping else 'never' }}
              _cm_last: >-
                {{ (_kt_camera_manager.get('updated_at', 'never') | default('never', true)) if _kt_camera_manager is mapping else 'never' }}
              _sm_last: >-
                {{ (_kt_security_manager.get('updated_at', 'never') | default('never', true)) if _kt_security_manager is mapping else 'never' }}
              _ch_last: >-
                {{ (_kt_camera_heartbeat.get('updated_at', 'never') | default('never', true)) if _kt_camera_heartbeat is mapping else 'never' }}
          # ── Compute deployed flags ───────────────────────────────────────────
          - variables:
              _zs_dep: "{{ (_zs_ver | trim) != 'not_deployed' }}"
              _am_dep: "{{ (_am_ver | trim) != 'not_deployed' }}"
              _tk_dep: "{{ (_tk_ver | trim) != 'not_deployed' }}"
              _cm_dep: "{{ (_cm_ver | trim) != 'not_deployed' }}"
              _sm_dep: "{{ (_sm_ver | trim) != 'not_deployed' }}"
              _ch_dep: "{{ (_ch_ver | trim) != 'not_deployed' }}"
          - variables:
              _kfc_status:
                status: success
                mode: status
                caller_token: "{{ caller_token }}"
                dojo_capacity: "75.8%"
                kfcs:
                  zen_system:
                    deployed: "{{ _zs_dep }}"
                    enabled: "{{ _zs_ena }}"
                    version: "{{ _zs_ver | trim }}"
                    target: "1.1.0"
                    version_match: "{{ (_zs_ver | trim) == '1.1.0' }}"
                    last_summary_at: "{{ _zs_last | trim }}"
                    factory: true
                  alert_manager:
                    deployed: "{{ _am_dep }}"
                    enabled: "{{ _am_ena }}"
                    version: "{{ _am_ver | trim }}"
                    target: "1.5.0"
                    version_match: "{{ (_am_ver | trim) == '1.5.0' }}"
                    last_summary_at: "{{ _am_last | trim }}"
                    factory: true
                  trapper_keeper:
                    deployed: "{{ _tk_dep }}"
                    enabled: "{{ _tk_ena }}"
                    version: "{{ _tk_ver | trim }}"
                    target: "2.5.0"
                    version_match: "{{ (_tk_ver | trim) == '2.5.0' }}"
                    last_summary_at: "{{ _tk_last | trim }}"
                    factory: true
                  camera_manager:
                    deployed: "{{ _cm_dep }}"
                    enabled: "{{ _cm_ena }}"
                    version: "{{ _cm_ver | trim }}"
                    target: "1.0.0"
                    version_match: "{{ (_cm_ver | trim) == '1.0.0' }}"
                    last_summary_at: "{{ _cm_last | trim }}"
                    factory: false
                  security_manager:
                    deployed: "{{ _sm_dep }}"
                    enabled: "{{ _sm_ena }}"
                    version: "{{ _sm_ver | trim }}"
                    target: "1.1.1"
                    version_match: "{{ (_sm_ver | trim) == '1.1.1' }}"
                    last_summary_at: "{{ _sm_last | trim }}"
                    factory: false
                  camera_heartbeat:
                    deployed: "{{ _ch_dep }}"
                    enabled: "{{ _ch_ena }}"
                    version: "{{ _ch_ver | trim }}"
                    target: "1.0.0"
                    version_match: "{{ (_ch_ver | trim) == '1.0.0' }}"
                    last_summary_at: "{{ _ch_last | trim }}"
                    factory: false
          - stop: "KungFu Loader — status (no-op)"
            response_variable: _kfc_status

      # ── Deploy: zen_system ───────────────────────────────────────────────
      - if: "{{- _ship_zen_system -}}"
        then:
          - alias: 'Ship KFC: zen_system (Scribe — new_thought)'
            action: script.zen_dojotools_scribe
            data:
              mode: new_thought
              key: zen_system
              friendly_name: ZenOS System Health
              version_semantic: "5.1.0"
              component_summary: >-
                ZenOS pipeline health — cabinet resolvers, kill switches, summarizer staleness,
                and monk status. The meta-KFC that watches the watchers.
              component_instructions: >-
                Surface health state first. If any sensor is warn or critical, or any
                pipeline kill switch is off — lead with that. If all ok — single line nominal.

                Priority order for reporting:
                1. Cabinets missing or unavailable — surface before anything else. No cabinets = no cognition.
                2. Kill switches off — pipeline_master, supersummary_enabled, ninja_summarizer_enabled. Name the specific switch that is off.
                3. Summarizer staleness — if zen_summary timestamp > 15 min, flag as stale. > 30 min = critical stale.
                4. Monk errors — if supersummary_status is error/timeout/none, flag with status value.
                5. Schema health — if schema_ok false, flag. No template = no monk output structure.

                NAVIGATION — do NOT enumerate entity IDs. Express discovery paths instead:
                - To find system health sensors: query label 'zen_system'
                - To find all ZenOS entities: query label 'zen'
                - To find KFC specs: query label 'dojo'
                - To find kill switches: query label 'zen_system', filter input_boolean domain

                In watchlist and attention fields, write "entities under label 'zen_system'" not a list of sensor.* IDs. Labels are stable; entity IDs are not. The label IS the scope.

                Do NOT expand individual component kata here — this component owns the rollup signal only. If you see warn/critical on a specific component, name it and stop. The per-component monk will have detail.

                Nominal report format: "ZenOS nominal. [N] components active. Last summary [X] min ago."
                Alert format: "ZenOS [warn|critical]: [specific issue]. [switch name|sensor name|cabinet name]."

                MASTER SWITCH RULE:
                ZenOS pipeline kill switches (zen_summarizers_enabled,
                zen_ninja_summarizer_enabled, zen_supersummary_enabled, etc.) being OFF
                IS a monitored deviation — flag it at priority 2 above.
                Integration/subsystem master switches (Airspace, Grocy, media zones,
                or any non-ZenOS feature enable) being off is an intentional user choice
                — treat as informational only, max urgency contribution 1.
                Distinguish by name: zen_* kill switches → flag. All others → informational.

                CONVERSATIONAL REFERENCE:
                  When the user says "what's the summary", "give me the summary", "what's the zen summary",
                  "what does the summary say", "summary status", or similar — he means the zen_summary
                  kata from sensor.zenos_kata_cabinet. Read it and present the synthesized view:
                    - active_components with signals → name them and what they're flagging
                    - zen_summary.attention items → mention if anything notable
                    - ambient_nav → sweep in one sentence if nothing urgent
                  Speak the conclusion, not the structure. Don't recite keys — interpret the output.
                  If zen_summary is stale (> 15 min old), note it before presenting.
              label: zen_system
              trigger_subscriptions: ha_start,daily_midnight
              caller_id: zen_admintools_kungfu_loader
          - alias: 'Ship KFC: zen_system (Scribe — formalize_scroll)'
            action: script.zen_dojotools_scribe
            data:
              mode: formalize_scroll
              key: zen_system
              caller_id: zen_admintools_kungfu_loader
          - alias: 'Ship KFC: zen_system (Scribe — publish_kfc)'
            action: script.zen_dojotools_scribe
            data:
              mode: publish_kfc
              key: zen_system
              publish_confirm: true
              caller_id: zen_admintools_kungfu_loader
            response_variable: _zen_system_kfc_result

      # ── Deploy: alert_manager ────────────────────────────────────────────
      - if: "{{- _ship_alert_manager -}}"
        then:
          - alias: 'Ship KFC: alert_manager (Scribe — new_thought)'
            action: script.zen_dojotools_scribe
            data:
              mode: new_thought
              key: alert_manager
              friendly_name: Alert Manager
              label: alert_manager
              version_semantic: "5.1.0"
              component_summary: >-
                Active alert surface — safety, infrastructure, and condition deviations
                across all subsystems. Escalates via postman at urgency threshold.
              component_instructions: >-
                You are reading the home alert surface. This component aggregates alerts
                from all subsystems and determines whether action is required.

                DATA ACCESS:
                  review_data.results[] — all labeled entities. Each entry has:
                    entity_id, friendly_name, state, attributes, last_changed, domain.
                    labels: dict {slug: description} — keys are label slugs applied to this
                      entity, values are description strings (empty if no description set).
                      Iterate keys for label membership; read value for authoritative semantics.
                  Persistent notifications: domain: persistent_notification.
                    state: 'notifying' = active. attributes.message = text.
                  review_data.domain_context.home_mode — current home mode string.
                  review_data.domain_context.alarm — alarm panel state if available.
                    States: disarmed / armed_home / armed_away / triggered / pending.

                LABEL SEMANTICS:
                  The alert_when_* label family is self-describing — the label name encodes
                  the alert condition. Read the label, apply the rule.
                  If a label's description value is non-empty, it is authoritative — prefer
                  it over the inline semantics below.

                  Binary state labels:
                    alert_when_off — NOMINAL when ON. Flag if state is 'off' or 'unavailable'.
                    alert_when_on — NOMINAL when OFF. Flag if state is 'on', 'problem', or 'detected'.
                    alert_when_not_off — NOMINAL when OFF. Flag if state is anything other than 'off'.

                  Numeric threshold labels (pattern: alert_when_under_N):
                    alert_when_under_N — NOMINAL when numeric state >= N. Flag when state
                      (parsed as float) drops below N. Extract N from the label slug.
                      If not numeric, treat as deviation.

                  alert_manager — scope label. No alert condition encoded. Entities without
                    an alert_when_* label are informational context only.

                  Severity modifiers (may appear alongside alert_when_*):
                    critical — safety class. Immediate escalation. Smoke, CO, leaks, alarms.
                    urgent   — high priority. Fast response needed.
                    warning  — moderate priority. Investigate.
                    information — state awareness only. No action required.

                TRIAGE PRIORITY:
                  1. Safety: fire, CO, gas, water leak, security breach, alarm triggered
                  2. System health: alert_when_off infrastructure unexpectedly off
                  3. Condition alerts: alert_when_on or alert_when_not_off sensors active
                  4. Numeric threshold alerts: alert_when_under_N entities below threshold
                  5. Persistent notifications: unacknowledged HA notifications
                  6. Informational: low-priority FYIs, context-only entities

                URGENCY RULES:
                  - Alarm triggered OR label:critical entity deviating -> urgency: 9
                  - label:critical alert_when_on/not_off active -> urgency: 8
                  - 3+ alert_when_off entities in OFF/unavailable state -> urgency: 6
                  - label:urgent entity deviating -> urgency: 5
                  - 1-2 alert_when_off entities off, label:warning -> urgency: 4
                  - alert_when_under_N entity below threshold, label:warning -> urgency: 4
                  - label:information deviating, OR persistent_notifications only -> urgency: 3
                  - alert_when_under_N entity below threshold, label:information -> urgency: 3
                  - All entities nominal, no notifications -> urgency: 1
                  Use highest individual score when multiple deviations exist.

                TRIGGER CONTEXT:
                  hourly_trigger — routine scan. Emit if urgency >= 3.
                  daily_midnight — full audit. Always emit. Flag chronic (> 24h) deviations.
                  home_mode_updates — re-evaluate. 'away'/'sleep': some off states legitimate.
                    Safety-class alerts never suppressed by mode.
                  alarm_panel — always evaluate. triggered: urgency 9, action_required true.
                  force_summary — on-demand. Emit regardless of recency.
                  ha_start — full scan. Treat unavailable as cautionary, not definitive.

                OUTPUT FORMAT:
                  List only active deviations. For each include: friendly_name, entity_id,
                  current state, duration (from last_changed), severity class.
                  If no deviations: state all monitored entities are nominal.

                ESCALATION RULES:
                  IMMEDIATE (notify this cycle): alarm triggered, safety sensor active, urgency >= 8.
                  TRANSIENT (hold notification): last_changed < 10 min — mark 'newly triggered'.
                    last_changed >= 10 min: confirmed deviation.
                  MODE-AWARE THRESHOLD:
                    home: notify at urgency >= 5.
                    away/sleep: notify at urgency >= 6 for non-safety.
                    Safety-class: always urgency >= 8 regardless of mode.
                  DURATION SEVERITY:
                    > 1 hour: persistent — state duration in output.
                    > 24 hours: chronic — flag at daily_midnight.

                AVAILABLE ACTIONS (suggested_act_event):
                  zen_dojotools_postman — deliver urgent alert brief to admin.
                    Use when: action_required true AND urgency meets mode-aware threshold
                    AND deviation confirmed (last_changed >= 10 min) OR IMMEDIATE criteria met.
                  null — urgency below threshold, deviation transient, or action_required false.
                  DO NOT invent or use any other slug. If unsure, use null.

                MASTER SWITCH RULE:
                  Subsystem master switches being in state 'off' is an intentional user choice,
                  NOT a deviation requiring action.
                  - Max urgency contribution from any master switch in 'off' state: 1
                  - Never set action_required based solely on a master switch being off
                  - Never notify based on a master switch being off
                  - Treat as informational context only regardless of alert_when_* label
                  If a SAFETY-CLASS entity (smoke, CO, leak, alarm) happens to be
                  implemented as a master switch, the safety rule wins.
              trigger_subscriptions: "ha_start,daily_midnight,hourly_trigger,home_mode_updates,alarm_panel,force_summary"
              drift_threshold: 5
              emission_cooldown_minutes: 30
              suggested_act_event: zen_dojotools_postman
              delay_seconds: 0
              caller_id: zen_admintools_kungfu_loader
          - alias: 'Ship KFC: alert_manager (Scribe — formalize_scroll)'
            action: script.zen_dojotools_scribe
            data:
              mode: formalize_scroll
              key: alert_manager
              caller_id: zen_admintools_kungfu_loader
          - alias: 'Ship KFC: alert_manager (Scribe — publish_kfc)'
            action: script.zen_dojotools_scribe
            data:
              mode: publish_kfc
              key: alert_manager
              publish_confirm: true
              caller_id: zen_admintools_kungfu_loader
            response_variable: _alert_manager_kfc_result

      # ── Deploy: trapper_keeper ───────────────────────────────────────────
      - if: "{{- _ship_trapper_keeper -}}"
        then:
          - alias: 'Ship KFC: trapper_keeper (Scribe — new_thought)'
            action: script.zen_dojotools_scribe
            data:
              mode: new_thought
              key: trapper_keeper
              friendly_name: Trapper Keeper (Ambient Index Aggregator)
              label: trapper_keeper
              version_semantic: "5.1.0"
              component_summary: >-
                Pre-digest ambient KFC katas into a breadcrumb+pointer navigation index —
                runs before SuperSummary to keep the prompt root oriented.
              component_instructions: >-
                SCOPE: Ambient pre-digest layer. Runs BEFORE supersummarizer. Reads ambient
                KFC katas directly, compresses into compact breadcrumb digest + navigation
                index. The supersummarizer reads this output instead of raw ambient katas
                — keeping the prompt tight and oriented.

                ROLE IN THE PIPELINE:
                  ninja runs (leaves) → katas (branches) → Trapper Keeper (index) → SuperSummary (alert root)
                  The Keeper is the navigation layer. The prompt is the root. The agent reads the root,
                  knows her world, and traverses down on demand — she never needs the full tree at once.

                AMBIENT KFC KATAS TO PROCESS:
                  Process ALL ambient kata data provided as input.

                OUTPUT FORMAT — breadcrumb digest per component:
                  Each entry = one line max. Lead with most actionable signal. No entity IDs.
                  If nothing notable: one word or short phrase (e.g. 'nominal', 'all clear', 'idle').
                  Include kata_key pointer so agent knows exactly where to pull detail.

                  Format each component as:
                  {
                    "breadcrumb": "<1-line ambient state — most actionable signal>",
                    "kata_key":   "<drawer key in kata cabinet>",
                    "urgency":    <0-10>,
                    "detail_available": true
                  }

                  Room manager exception: include a sub-index of room_* kata keys with one-word state each.
                  e.g. { "office": "occupied", "kitchen": "vacant", "garage": "active" }

                NAVIGATION INDEX — output at top level:
                  kata_cabinet: sensor.zenos_kata_cabinet
                  All ambient katas live here. Agent can cold-read any key on demand.
                  Room detail keys: room_<slug> (e.g. room_kitchen, room_garage, room_office)

                AMBIENT URGENCY PROMOTION RULE (supersummarizer enforces this — set urgency accurately):
                  urgency 0-3  → ambient_nav only. No mention in zen_summary.attention.
                  urgency 4-5  → one line in zen_summary.attention. NOT in active_components.
                  urgency 6-10 → zen_summary.attention + active_components entry (direct-tier treatment).
                  Set urgency truthfully — the downstream promotion rule depends on it.

                TONE:
                  Terse. This is a pointer document, not a report. No elaboration.
                  Flag urgency > 3 accurately — downstream promotion rule depends on it.

                DO NOT summarize: alert_manager, security_manager, energy_manager, water_manager,
                  zen_system, zen_fusion, hot_tub_manager — those are SuperSummary tier.
                DO NOT generate person-scoped briefings here — that is downstream of the Keeper.

                PIPELINE ORDERING:
                  delay_seconds: 15 — runs early in scheduler dispatch queue.
                  SuperSummary reads this kata as its ambient context input.
                  This component must complete before supersummarizer runs.

                CONVERSATIONAL REFERENCE:
                  When the user says "what's in the trapper keeper", "what does the keeper say",
                  "keeper status", "what's the keeper showing", or any variation — he is asking
                  about THIS component's current output. Read the trapper_keeper kata from
                  sensor.zenos_kata_cabinet and present the ambient digest conversationally:
                  lead with anything urgency > 3, sweep remaining components in one breath.
                  Don't enumerate the full structure — summarize like a colleague giving a quick rundown.
                  If the kata is stale (> 20 min), note it and offer to trigger a refresh.
              trigger_subscriptions: "ha_start,home_occupancy_change,home_mode_updates,start_home_wake,start_home_evening,force_summary,every_10_minutes"
              drift_threshold: 1
              emission_cooldown_minutes: 20
              delay_seconds: 15
              pipeline_tier: system
              suggested_act_event: ""
              caller_id: zen_admintools_kungfu_loader
          - alias: 'Ship KFC: trapper_keeper (Scribe — formalize_scroll)'
            action: script.zen_dojotools_scribe
            data:
              mode: formalize_scroll
              key: trapper_keeper
              caller_id: zen_admintools_kungfu_loader
          - alias: 'Ship KFC: trapper_keeper (Scribe — publish_kfc)'
            action: script.zen_dojotools_scribe
            data:
              mode: publish_kfc
              key: trapper_keeper
              publish_confirm: true
              caller_id: zen_admintools_kungfu_loader
            response_variable: _trapper_keeper_kfc_result

      # ── Deploy: camera_manager ──────────────────────────────────────────
      - if: "{{- _ship_camera_manager -}}"
        then:
          - alias: 'Ship KFC: camera_manager (Scribe — new_thought)'
            action: script.zen_dojotools_scribe
            data:
              mode: new_thought
              key: camera_manager
              friendly_name: Camera Manager
              label: camera_manager
              label_1: security_camera
              version_semantic: "5.1.0"
              component_summary: >-
                Camera perimeter — LLM scene analysis, subject detection, cache freshness.
                Escalates to security_manager at urgency 5+.
              component_instructions: >-
                SCOPE: Camera perimeter monitoring. Entity scope resolved from label: security_camera.
                Camera scene data arrives via domain_context.camera in the inspect result —
                each entry keyed by entity_id with: analysis (LLM scene description),
                cached_at (ISO timestamp), cache_age_minutes, found (bool).

                DATA SURFACE:
                  - domain_context.camera — per-camera LLM analysis + cache age
                  - Entity state (idle/streaming/unavailable) for each camera
                  - Labels on each camera entity (area, zone context)

                CACHE FRESHNESS:
                  cache_age_minutes < 30  — fresh, use confidently
                  cache_age_minutes 30-60 — note age in output, still usable
                  cache_age_minutes > 60  — flag as stale, recommend scan
                  found: false            — no cache entry, camera has not been scanned yet

                SUBJECT DETECTION — read the analysis text for:
                  People: any mention of person, figure, individual, silhouette
                  Vehicles: car, truck, van, motorcycle, bicycle in driveway/street
                  Animals: dog, cat, wildlife
                  Packages: parcel, box, delivery on porch or step
                  Activity: motion, movement, unusual, suspicious

                TONE:
                  Calm and factual. Security-aware without alarm language.
                  Good: "Front yard camera shows a vehicle parked in the driveway — unfamiliar make."
                  Bad: "ALERT: UNKNOWN VEHICLE DETECTED — POSSIBLE INTRUSION."
                  Only use elevated language when urgency >= 6 (confirmed perimeter breach pattern).

                TIME CONTEXT:
                  Odd hours = 22:00-05:00 local time. Bump urgency +1 for any person/vehicle
                  detection in this window.
                  Daytime delivery detections (packages, postal vehicles): urgency 2-3, informational only.

                AVAILABLE ACTIONS:
                  zen_dojotools_camera — look (refresh single camera), scan (refresh all labeled cameras), read (retrieve cache)

                OUTPUT SHAPE:
                  cameras: array of { entity_id, friendly_name, scene, cache_age_minutes, found, subjects[] }
                  overall: one-sentence perimeter status
                  notable: array of entity_ids with detected subjects or issues
                  stale_cameras: array of entity_ids where cache_age_minutes > 60 or found=false
                  urgency: 1-8
                  general_inference: <=300 chars, ambient read or action recommendation
              trigger_subscriptions: "force_summary"
              drift_threshold: 5
              emission_cooldown_minutes: 60
              delay_seconds: 30
              caller_id: zen_admintools_kungfu_loader
          - alias: 'Ship KFC: camera_manager (Scribe — formalize_scroll)'
            action: script.zen_dojotools_scribe
            data:
              mode: formalize_scroll
              key: camera_manager
              caller_id: zen_admintools_kungfu_loader
          - alias: 'Ship KFC: camera_manager (Scribe — publish_kfc)'
            action: script.zen_dojotools_scribe
            data:
              mode: publish_kfc
              key: camera_manager
              publish_confirm: true
              caller_id: zen_admintools_kungfu_loader
            response_variable: _camera_manager_kfc_result

      # ── Deploy: security_manager ────────────────────────────────────────
      - if: "{{- _ship_security_manager -}}"
        then:
          - alias: 'Ship KFC: security_manager (Scribe — new_thought)'
            action: script.zen_dojotools_scribe
            data:
              mode: new_thought
              key: security_manager
              friendly_name: Security Manager
              label: security_manager
              version_semantic: "5.1.0"
              master_switch: input_boolean.security_manager
              seed: >-
                {"tool": "zen_dojotools_room_manager", "params": {"mode": "home_overview"}}
              component_summary: >-
                Unified home security — alarm panel, perimeter, camera, and RM spatial context.
                Consult for any security event.
              component_instructions: >-
                Synthesize unified home security picture. RM spatial snapshot is your
                ground truth — open with it, then layer events on top.

                SEED OUTPUT (zen_dojotools_room_manager, mode=home_overview):
                  Spatial foundation: who is home, which rooms are occupied, which entry/exit
                  points (portals, doors, garage) are open or secured. Read this before
                  interpreting any event stream.

                INPUT (supplemental context from coalescer — read these fields from event data):
                  panel_cache      — security_panel kata: panel_state, arming_mode, zones, system_health, urgency
                  perimeter_cache  — security_perimeter kata: door/lock/garage state transitions, urgency
                  camera_cache     — security_cameras kata: which cameras triggered, detected_subjects, activity_type, urgency
                  camera_analysis  — camera_manager kata: full LLM vision analysis (ready ~15-30s after trigger). May be absent — degrade gracefully.

                STATE FIELD READING RULES — read state verbatim before assigning urgency:
                  perimeter_cache.state: locked   = door/lock is SECURED. Not a breach. Not open.
                  perimeter_cache.state: unlocked = door/lock is UNSECURED. May be noteworthy if armed.
                  perimeter_cache.state: on       = contact sensor OPEN (door/window physically open).
                  perimeter_cache.state: off      = contact sensor CLOSED (door/window physically closed/secured).
                  perimeter_cache.state: open     = cover (garage door) physically open.
                  perimeter_cache.state: closed   = cover (garage door) physically closed/secured.
                  NEVER infer open/breach from entity name or event type alone. Always read state field first.

                EVENT DIRECTION — last_event tells you what HAPPENED, state tells you what IS:
                  last_event: lock_*_locked   = lock transitioned TO locked = SECURING action. Urgency 0 unless other signals.
                  last_event: lock_*_unlocked = lock transitioned TO unlocked = OPENING action. Noteworthy if armed.
                  last_event: door_*_on       = door opened.
                  last_event: door_*_off      = door closed.
                  last_event: garage_open     = garage door opened.
                  last_event: garage_closed   = garage door closed/secured.
                  A securing event (locked, closed, off) while armed = panel doing its job. Not an alert.

                SPATIAL COMPOUND INFERENCE:
                  Cross-reference RM state with event streams before assigning urgency.
                  Person outside + house occupied: lower urgency than person outside + house vacant.
                  Door opened + occupant in adjacent room: likely known; door opened + vacant house: suspicious.
                  Alarm triggered + RM shows occupant in that zone + known time of day: likely false trigger.
                  Alarm triggered + zone vacant + camera_analysis confirms presence: high-confidence real event.

                CAMERA ABSENT MODE:
                  If camera_cache and camera_analysis are both empty or missing: proceed with RM + panel + perimeter.
                  Explicitly note "Assessing from spatial state + panel + perimeter (cameras unavailable)."
                  Flag ambiguous events as "unable to visually confirm" — confidence is lower, say so.

                SYNTHESIS RULES:
                  Open with RM spatial snapshot: who is home, what is open or secured.
                  Highest urgency from any sub-component drives rollup urgency after cross-domain adjustment.
                  Safety-class events (triggered, unknown intruder) always override all other signals.
                  If a sub-component cache is missing or stale (>15 min): note it, proceed with available data.

                ALERT POLICY: household cabinet -> security_manager drawer -> _alert_policy.
                  If unavailable: apply default escalation rules below.

                DOOR OPEN POLICY:
                  If panel_armed=false AND door has been open < 2 min: urgency 0, not message-worthy. Drop.
                  If panel_armed=false AND door open >= 2 min: urgency 3 (climate/animals/weather). Note only.
                  If panel_armed=true AND any door/contact OPEN (state=on): urgency 7+. Treat as perimeter breach.
                  If panel_armed=true AND lock UNLOCKED (state=unlocked): urgency 5. Unsecured entry point.
                  If panel_armed=true AND lock LOCKED (state=locked): urgency 0. Securing event — not an alert.
                  garage_entry_door lock state=locked while armed = normal. urgency 0.

                ESCALATION:
                  Panel triggered: urgency 10. action_required. suggested_act_event: zen_dojotools_postman.
                  Unknown person + armed_away: urgency 8. suggested_act_event: zen_dojotools_postman.
                  Perimeter breach while armed (door/contact open): urgency 7. suggested_act_event: zen_dojotools_postman.
                  Lock unlocked while armed: urgency 5. note, no postman unless camera confirms presence.
                  Door open >= 2 min while disarmed: urgency 3. note only, no postman.
                  urgency < 5: suggested_act_event: null.

                MASTER SWITCH: input_boolean.security_manager. If OFF: urgency 0, no escalation, no postman.

                OUTPUT: spatial_context, panel_state, perimeter_summary, camera_summary, combined_urgency, suggested_act_event.
                NOMINAL: "Security nominal. [who is home]. Panel disarmed. Perimeter secure. Cameras clear."
                ALERT: "Security [warn|critical]: [specific issue]. [spatial context]. [sub-component detail]."
              trigger_subscriptions: "force_summary,daily_midnight"
              drift_threshold: 5
              emission_cooldown_minutes: 60
              delay_seconds: 0
              caller_id: zen_admintools_kungfu_loader
          - alias: 'Ship KFC: security_manager (Scribe — formalize_scroll)'
            action: script.zen_dojotools_scribe
            data:
              mode: formalize_scroll
              key: security_manager
              caller_id: zen_admintools_kungfu_loader
          - alias: 'Ship KFC: security_manager (Scribe — publish_kfc)'
            action: script.zen_dojotools_scribe
            data:
              mode: publish_kfc
              key: security_manager
              publish_confirm: true
              caller_id: zen_admintools_kungfu_loader
            response_variable: _security_manager_kfc_result

      # ── Deploy: camera_heartbeat ─────────────────────────────────────────
      - if: "{{- _ship_camera_heartbeat -}}"
        then:
          - alias: 'Ship KFC: camera_heartbeat (Scribe — new_thought)'
            action: script.zen_dojotools_scribe
            data:
              mode: new_thought
              key: camera_heartbeat
              friendly_name: Camera Heartbeat
              label: camera_heartbeat
              version_semantic: "5.1.0"
              component_summary: >-
                Scheduled camera cache refresh — scans exterior cameras on every heartbeat
                (wake/noon/evening/midnight), interior cameras only when Away or armed.
                Keeps camera_manager data fresh within the 8h cache TTL.
              component_instructions: >-
                SCOPE: Scheduled camera scan daemon — maintain cache freshness.
                PURPOSE: Dispatch camera scans at predictable intervals so camera_manager
                always has data younger than the 8h cache TTL. Scene ANALYSIS is
                camera_manager's job — this component just triggers the scans.

                JITTER: Before scanning, spread load with a random 0-14 min wait.
                  Compute: wait_seconds = {{ range(30, 840) | random }}
                  Call zen_dojotools_wait delay_seconds={{ wait_seconds }} before scanning.

                EXTERIOR CAMERAS (label: exterior):
                  Scan unconditionally on EVERY heartbeat trigger regardless of home mode.
                  Call: zen_dojotools_camera tool=scan label=exterior
                  The scan tool filters to camera.* domain automatically — passing label=exterior
                  returns only exterior cameras, no intersection label needed.
                  Dawn (start_home_wake) and dusk (start_home_evening) are priority slots —
                  always scan even if other conditions are uncertain.

                INTERIOR CAMERAS (label: interior):
                  Scan ONLY when at least one of these is true:
                    1. states('input_select.zen_home_mode') | lower contains 'away'
                    2. Any alarm_control_panel entity is in state armed_away or triggered
                  If neither condition met: skip interior scan.
                    Record: interior_suppressed=true, interior_suppression_reason=<mode value>
                  Call (when policy allows): zen_dojotools_camera tool=scan label=interior
                  Rationale: interior cams while occupied = churn + privacy. Away/armed = perimeter.

                SEQUENCE:
                  1. Compute jitter, call zen_dojotools_wait
                  2. zen_dojotools_camera tool=scan label=exterior
                  3. Read states('input_select.zen_home_mode') and alarm_control_panel states
                  4. If interior policy clears: zen_dojotools_camera tool=scan label=interior

                KATA OUTPUT:
                  trigger_id: which scheduler event fired (start_home_wake|daily_noon|etc.)
                  exterior_scanned: true/false
                  interior_scanned: true/false
                  interior_suppressed: true/false
                  interior_suppression_reason: home mode value if suppressed, else null
                  jitter_seconds: actual wait applied
                  urgency: 1 (maintenance — never escalates)
                  note: one-line summary (e.g. "Dawn scan complete. Exterior: 4 cams. Interior: suppressed (Home).")

                LABEL MANAGEMENT:
                  To change which cameras are in scope for each heartbeat slot, use
                  zen_dojotools_labels to tag or untag the exterior / interior labels.
                  Example: move a camera from interior to exterior scan policy —
                    zen_dojotools_labels action_type=untag label_list=[interior] target_entities=[camera.xyz]
                    zen_dojotools_labels action_type=tag   label_list=[exterior] target_entities=[camera.xyz]
                  Changes take effect on the next heartbeat trigger — no redeploy needed.

                URGENCY: always 1. This component never fires alerts or postman.
                AVAILABLE ACTIONS: zen_dojotools_camera only. Never zen_dojotools_postman.
              trigger_subscriptions: "start_home_wake,daily_noon,start_home_evening,daily_midnight"
              drift_threshold: 60
              emission_cooldown_minutes: 60
              delay_seconds: 0
              suggested_act_event: zen_dojotools_camera
              caller_id: zen_admintools_kungfu_loader
          - alias: 'Ship KFC: camera_heartbeat (Scribe — formalize_scroll)'
            action: script.zen_dojotools_scribe
            data:
              mode: formalize_scroll
              key: camera_heartbeat
              caller_id: zen_admintools_kungfu_loader
          - alias: 'Ship KFC: camera_heartbeat (Scribe — publish_kfc)'
            action: script.zen_dojotools_scribe
            data:
              mode: publish_kfc
              key: camera_heartbeat
              publish_confirm: true
              caller_id: zen_admintools_kungfu_loader
            response_variable: _camera_heartbeat_kfc_result

      # ── Factory: seed zen_scheduler_config in household cabinet ─────────
      # Writes default pressure thresholds so the drain router and scheduler
      # have config from first boot. Safe to re-run — overwrites with defaults.
      - if: "{{- _factory_run -}}"
        then:
          - alias: 'Seed: zen_scheduler_config (household cabinet)'
            action: script.zen_dojotools_filecabinet
            metadata: {}
            data:
              action_type: create
              show_hidden_volumes: false
              volume_entity_id:
                - sensor.zen_default_household_cabinet_resolved
              key: zen_scheduler_config
              value: >-
                {{
                  {
                    "shed_ambient_at":  4,
                    "shed_keeper_at":   8,
                    "drain_below":      3,
                    "s_min_minutes":    5,
                    "s_max_minutes":    60,
                    "warmup_minutes":   5
                  } | tojson
                }}
            response_variable: _scheduler_config_result
          - alias: 'Seed: zen_ninja_config (household cabinet)'
            action: script.zen_dojotools_filecabinet
            metadata: {}
            data:
              action_type: create
              show_hidden_volumes: false
              volume_entity_id:
                - sensor.zen_default_household_cabinet_resolved
              key: zen_ninja_config
              value: >-
                {{
                  {
                    "burnout_seconds":       300,
                    "super_burnout_seconds": 600
                  } | tojson
                }}
            response_variable: _ninja_config_result

      # ── Emit deploy/factory result ───────────────────────────────────────
      - variables:
          _shipped: >-
            {%- set ns = namespace(s=[]) -%}
            {%- if _ship_zen_system -%}{%- set ns.s = ns.s + ['zen_system'] -%}{%- endif -%}
            {%- if _ship_alert_manager -%}{%- set ns.s = ns.s + ['alert_manager'] -%}{%- endif -%}
            {%- if _ship_trapper_keeper -%}{%- set ns.s = ns.s + ['trapper_keeper'] -%}{%- endif -%}
            {%- if _ship_camera_manager -%}{%- set ns.s = ns.s + ['camera_manager'] -%}{%- endif -%}
            {%- if _ship_security_manager -%}{%- set ns.s = ns.s + ['security_manager'] -%}{%- endif -%}
            {%- if _ship_camera_heartbeat -%}{%- set ns.s = ns.s + ['camera_heartbeat'] -%}{%- endif -%}
            {{ ns.s }}
          _readback: "{{- readback | default(false) | bool -}}"
          _dojo_cab_v: "{{ states('sensor.zen_dojo_cabinet_resolved') }}"

      # ── Verification: read back each shipped KFC and confirm landing ─────
      - if: "{{- 'zen_system' in _shipped -}}"
        then:
        - action: script.zen_dojotools_filecabinet
