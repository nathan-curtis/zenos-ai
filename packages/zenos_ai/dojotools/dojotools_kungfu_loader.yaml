          response_variable: _vr_zen_system
      - if: "{{- 'alert_manager' in _shipped -}}"
        then:
        - action: script.zen_dojotools_filecabinet
          continue_on_error: true
          data:
            action_type: read
            volume_entity_id: ["{{ _dojo_cab_v }}"]
            key: alert_manager
          response_variable: _vr_alert_manager
      - if: "{{- 'trapper_keeper' in _shipped -}}"
        then:
        - action: script.zen_dojotools_filecabinet
          continue_on_error: true
          data:
            action_type: read
            volume_entity_id: ["{{ _dojo_cab_v }}"]
            key: trapper_keeper
          response_variable: _vr_trapper_keeper
      - if: "{{- 'camera_manager' in _shipped -}}"
        then:
        - action: script.zen_dojotools_filecabinet
          continue_on_error: true
          data:
            action_type: read
            volume_entity_id: ["{{ _dojo_cab_v }}"]
            key: camera_manager
          response_variable: _vr_camera_manager
      - if: "{{- 'security_manager' in _shipped -}}"
        then:
        - action: script.zen_dojotools_filecabinet
          continue_on_error: true
          data:
            action_type: read
            volume_entity_id: ["{{ _dojo_cab_v }}"]
            key: security_manager
          response_variable: _vr_security_manager
      - if: "{{- 'camera_heartbeat' in _shipped -}}"
        then:
        - action: script.zen_dojotools_filecabinet
          continue_on_error: true
          data:
            action_type: read
            volume_entity_id: ["{{ _dojo_cab_v }}"]
            key: camera_heartbeat
          response_variable: _vr_camera_heartbeat

      # ── Build per-KFC status from readback ────────────────────────────
      - variables:
          _kfc_detail: >-
            {%- set ns = namespace(d={}) -%}
            {%- set kfc_list = [
              ('zen_system',       _vr_zen_system       | default({})),
              ('alert_manager',    _vr_alert_manager    | default({})),
              ('trapper_keeper',   _vr_trapper_keeper   | default({})),
              ('camera_manager',   _vr_camera_manager   | default({})),
              ('security_manager', _vr_security_manager | default({})),
              ('camera_heartbeat', _vr_camera_heartbeat | default({}))
            ] -%}
            {%- for kname, vr in kfc_list if kname in _shipped -%}
              {%- set ok = vr is mapping and vr.get('status') == 'success' -%}
              {%- set val = vr.get('value', none) if vr is mapping else none -%}
              {%- set val = (val | from_json(none)) if val is string and val | trim not in ['', 'null'] else val -%}
              {%- set has_kfc = val is mapping and (val.get('component_key') is not none or val.get('index_call') is not none) -%}
              {%- set kstatus = 'deployed' if has_kfc else ('stub_only' if (ok and val is not none) else 'failed') -%}
              {%- set updated = vr.get('updated_at', '') | default('', true) if vr is mapping else '' -%}
              {%- set entry = {'status': kstatus, 'drawer_key': kname, 'updated_at': updated} -%}
              {%- if _readback and val is mapping -%}
                {%- set entry = entry | combine({'readback': (val | tojson)[:200]}) -%}
              {%- endif -%}
              {%- set ns.d = ns.d | combine({kname: entry}) -%}
            {%- endfor -%}
            {{ ns.d }}
      - variables:
          _deployed_count: >-
            {%- set cnt = namespace(n=0) -%}
            {%- if _kfc_detail is mapping -%}
              {%- for v in _kfc_detail.values() if v is mapping and v.get('status') == 'deployed' -%}
                {%- set cnt.n = cnt.n + 1 -%}
              {%- endfor -%}
            {%- endif -%}
            {{ cnt.n }}
          _shipped_count: "{{ _shipped | length }}"
      - variables:
          _rollup_status: >-
            {%- set sc = _shipped_count | int -%}
            {%- set dc = _deployed_count | int -%}
            {%- if sc == 0 -%}success
            {%- elif dc == sc -%}success
            {%- elif dc == 0 -%}error
            {%- else -%}partial{%- endif -%}

      - variables:
          _deploy_result:
            status: "{{ _rollup_status }}"
            mode: "{{ _mode }}"
            caller_token: "{{ caller_token }}"
            shipped: "{{ _shipped }}"
            count: "{{ _shipped_count }}"
            deployed_count: "{{ _deployed_count }}"
            factory_seeds: "{{ _mode == 'factory' }}"
            kfc_detail: "{{ _kfc_detail }}"
      - stop: "KungFu Loader — complete"
        response_variable: _deploy_result

    mode: single
