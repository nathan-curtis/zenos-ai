###############################################################################
# ZenOS-AI DojoTools: Manifest
# Version: 6.3.1
#
# Scripts:
#   zen_dojotools_manifest — ZenOS System Manifest Broker (v6.3.1)
#   system_tools_stamp_default_family_cabinet — Cabinet stamping utility
#   dojotools_zen_inspect — Entity inspection tool
#
# REBUILT: 2026-06-11 (was 5.1.0 — cabinet scanner only)
#
# v6.3.1 changes (2026-07-30):
#   - mode=label_audit: include_optional=true now also sweeps
#     missing_optional_labels (new field on tool_manifest(), alongside
#     missing_required_labels) and, with auto_create=true confirm=true,
#     creates missing optional labels too — same confirm gate, one pass.
#
# v6.3.0 changes (Steel Magnolias Phase 7b, 2026-07-29):
#   - mode=label_audit: fans out tool_manifest across all zen_* tools, aggregates
#     each tool's missing_required_labels (now computed read-only inside the
#     shared tool_manifest() macro itself, against labels()). Detection only
#     unless auto_create=true confirm=true, which loops zen_dojotools_labels
#     mode=create for the distinct missing labels found — never bypasses that
#     tool's own confirm gate. admintools tier excluded from scan targets (same
#     as mode=audit) — confirmed via bisection that sequentially scanning the
#     full zen_admintools_* group triggers a pre-existing 'limit' is undefined
#     error, reproducible only across the full group, root cause out of scope.
#
# v6.2.0 changes (Zen pull, 2026-07-04 — header bump, content already live on H):
#   - mode=bootstrap_kfc: scans zen_kfc_provider-labeled scripts, calls kfc_manifest,
#     writes live drawer mounts into dojo cabinet + registers tool:mode callout
#     whitelist entries. Fires on homeassistant_start + daily 00:01.
#   - Zen-side fix (not on H): bootstrap_kfc no longer writes component_summary
#     into the live drawer (dropped from both the write payload and the
#     idempotency comparison) — space-saving, matches Scribe's KF4
#     trim_description convention. The ninja summarizer already resolves an
#     empty component_summary from the HA label's description at read time
#     (dojotools_summarizers.yaml step 3d), so persisting it in the drawer
#     was pure duplication. Still READ from each tool's kfc_manifest response
#     and RETURNED in bootstrap_kfc's own result (_bkfc_registered entries) —
#     only the cabinet write is skipped, not the read/return.
#   - mode=health_refresh: full per-tool compliance scan, cached to _health_report
#     drawer; mode=health now reads this cache first, falls back to live check.
#   - mode=domains: live tool/domain/peers graph.
#   - mode=audit_help: scans mode=help across every zen_* tool.
#   - mode=publish: domain routing table now built from label_entities('zen_domain_*')
#     instead of a hardcoded domain:entity_id dict.
#
# v6.1.0 changes (2026-06-18):
#   - mode=bootstrap_stacks: auto-registration for Lens Bus providers
#     Scans all zen_* scripts, calls tool_manifest on each,
#     registers any that declare register_mode and are not already in lens_registry.
#     Skip list: household cabinet key lens_bootstrap_skip (list of provider_key values).
#     Fires automatically on homeassistant_started and daily at 00:00:30.
#     See: zen_manifest_bootstrap_stacks automation (bottom of this file).
#   - Dispatcher arm for zen_dojotools_manifest fixed: added missing mode field
#     (previously could only route mode=cabinets through dispatch)
#   - Dispatcher arm added for zen_stack_firefly v1
#
# v6.0.0 changes:
#   - zen_dojotools_manifest rebuilt as full system manifest broker
#   - mode field expanded: cabinets (existing) + identity, labels, tools,
#     automations, structure, audit, health, autotag, publish, all
#   - Existing cabinet scanner lifted verbatim into mode=cabinets branch
#   - mode=tool_manifest self-description updated (returns: system_manifest)
#   - Discovery model: entity namespace scan (zen_dojotools_*/zen_admintools_*/
#     zen_stack_*/zen_sutra_*) — domain+prefix is canonical, no label registry
#
# === UAT PASS — 2026-03-06 (v5.1.0 cabinet scanner) ===
# Auditor: Claude (Anthropic, Sonnet 4.6)
# HALMark: 0.9.11-draft — PASS Level 3 (Steward Safe)
# UAT Cases: 1/1 PASS
#   zen_dojotools_manifest:
#     read action → 10 volumes returned, all healthy, full metadata clean ✓
#
# config check → go; script reload → clean ✓
###############################################################################

script:
  zen_dojotools_manifest:
    alias: Zen DojoTools Manifest
    mode: queued
    max: 20
    description: >-
      Zen DojoTools Manifest (6.1.0) — ZenOS system introspection broker.
      Single lens for the entire system: cabinets, tools, identity, labels,
      automations, and topology. Pure broker — calls authoritative subsystems
      and aggregates. mode=cabinets: existing cabinet scanner (default).
      mode=tools: discover + cross-check all zen_* scripts by namespace.
      mode=identity: household/agent/persona roster. mode=labels: full label
      index. mode=automations: zen_* automation roster. mode=structure: lens
      registry topology. mode=audit: gap analysis (unlabeled/broken/ghost).
      mode=health: aggregate roll-up. mode=autotag: tag discovered tools.
      mode=publish: write mini-manifests to cabinet. mode=mcp_sync: reconcile
      MCP-visible tools against known roster. mode=bootstrap_stacks: discover
      all zen_stack_* providers, call tool_manifest, register any unregistered
      that declare register_mode (skip list: lens_bootstrap_skip cabinet key).
      mode=all: full system manifest. mode=tool_manifest: self-description.
      mode=bootstrap_kfc: discover tools with kfc_manifest, upsert live drawer
      mounts into dojo cabinet — summarizer resolves them at runtime.
      mode=health_refresh: run full per-tool compliance scan, write to _health_report cabinet cache.
      mode=label_audit: fan out tool_manifest across all tools, aggregate each
      tool's missing_required_labels (vs live label registry). Detection only
      unless auto_create=true confirm=true, which creates the distinct missing
      labels via zen_dojotools_labels mode=create. Pass include_optional=true
      to also sweep/create missing_optional_labels, not just required.
    icon: mdi:home-map-marker
    fields:
      show_hidden:
        selector:
          boolean:
        name: show hidden
        description: Include hidden/system volumes in results? (cabinets mode only)
      show_stacks:
        selector:
          boolean:
        name: Show Stacks
        description: Include online_unmounted (stacks) cabinets. Default false. (cabinets mode only)
        default: false
      extended:
        selector:
          boolean:
        name: Extended
        description: Return full metadata (cabinets mode) or extended manifests (all mode).
        default: false
      mode:
        description: >-
          Broker operation. Default: cabinets (existing behavior preserved).
          cabinets|identity|labels|tools|automations|structure|audit|label_audit|health|autotag|publish|all|tool_manifest
        required: false
        default: cabinets
        selector:
          select:
            options:
              - cabinets
              - identity
              - labels
              - tools
              - automations
              - structure
              - audit
              - label_audit
              - repair
              - audit_help
              - health
              - autotag
              - publish
              - all
              - mcp_sync
              - bootstrap_stacks
              - bootstrap_kfc
              - tool_manifest
              - health_refresh
              - domains
      name:
        description: Tool entity_id for single-tool lookup (tools mode with name filter).
        required: false
        selector:
          text:
      tier:
        description: Filter tools by tier (tools/audit/autotag modes).
        required: false
        selector:
          select:
            options:
              - dojotools
              - admintools
              - stacks
              - sutra
      force_refresh:
        description: Bypass cached drawer reads, force live calls.
        required: false
        selector:
          boolean:
      auto_create:
        description: 'label_audit mode: create discovered missing labels via zen_dojotools_labels. Requires confirm=true.'
        required: false
        default: false
        selector:
          boolean:
      confirm:
        description: 'label_audit mode: required alongside auto_create=true to actually create labels (mirrors zen_dojotools_labels'' own confirm gate). repair mode: required by itself to actually create labels (repair implies auto_create+include_optional) — without it, repair only reports what it would fix.'
        required: false
        default: false
        selector:
          boolean:
      include_optional:
        description: 'label_audit mode: also sweep missing_optional_labels (not just required). With auto_create=true confirm=true, creates missing optional labels too. repair mode: same toggle, default true (pass false for required-labels-only repair).'
        required: false
        default: false
        selector:
          boolean:
      force:
        name: Force (repair mode — shotgun)
        description: >-
          repair mode only. By default, KFC-bound labels that already exist
          are SKIPPED for description/icon/color sync — HA has no native
          update_label service, so "update" is delete+recreate+re-tag, and
          that's not worth the risk when nothing changed. force=true rewrites
          every existing KFC label this run, regardless. Requires force_ack
          set to the exact phrase 'yes I meant to do that' or the request is
          silently downgraded to the safe default.
        required: false
        default: false
        selector:
          boolean:
      force_labels:
        name: Force Labels (repair mode — scalpel)
        description: >-
          repair mode only. JSON array of specific label names to force-
          rewrite even though they already exist (e.g. ["autovac"]) — every
          other existing KFC label is still skipped. Same force_ack
          requirement as force=true.
        required: false
        selector:
          text:
      force_ack:
        name: Force Acknowledgment
        description: >-
          repair mode only. Required verbatim alongside force=true or a
          non-empty force_labels: 'yes I meant to do that'. Acknowledges that
          rewriting an existing KFC label deletes and recreates it — entities
          that carried the label are auto-restored from a pre-capture, but
          AREAS and DEVICES are NOT — that association is gone permanently
          unless you retag it yourself afterward.
        required: false
        selector:
          text:
      mcp_tool_list:
        description: 'JSON array of entity_ids the agent can see in MCP. Required for mcp_sync mode.'
        required: false
        selector:
          text:
      tool:
        description: 'domains mode: filter to all clusters a specific tool participates in (e.g. zen_dojotools_inventory).'
        required: false
        selector:
          text:
      page:
        description: 'audit_help: page number (1-based). Default 1.'
        required: false
        default: '1'
        selector:
          text:
      page_size:
        description: 'audit_help: tools per page. Default 20.'
        required: false
        default: '20'
        selector:
          text:
      caller_token:
        name: Caller Token
        required: false
        default: ''
        selector:
          text:
        description: 'Reserved. Governance stub — echoed in response.'
    sequence:
    # ── tool_manifest early exit (UMP contract) ─────────────────────────────
    - if: "{{ (mode | default('') | lower) == 'tool_manifest' }}"
      then:
      - variables:
          result: >-
            {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
            {{ MF.tool_manifest(
                tool='zen_dojotools_manifest',
                display_name='System Manifest Broker',
                tier='dojotools',
                version='6.3.1',
                health={'configured': true, 'status': 'ok', 'notes': []},
                required_labels=['dojotools'],
                optional_labels=['manifest', 'audit'],
                consumes=[],
                returns=['system_manifest'],
                icon='mdi:sitemap',
                color='blue',

                caller_token=caller_token | default('')
            ) | from_json }}
      - stop: tool_manifest
        response_variable: result
    # ── Normalize inputs ─────────────────────────────────────────────────────
    - variables:
        caller_token: "{{- caller_token | default('') -}}"
    - variables:
        mode_norm: "{{ mode | default('cabinets') | lower | trim }}"
        _hh_cab: "{{- states('sensor.zen_default_household_cabinet_resolved') -}}"
    # ── Route to broker case ─────────────────────────────────────────────────
    - choose:
      # ── mode: cabinets (existing cabinet scanner, lifted verbatim) ──────────
      - conditions: "{{ mode_norm == 'cabinets' }}"
        sequence:
        - variables:
            manifest_key: zen_library_manifest
            read_hidden: "{{- show_hidden | default(false) -}}"
            read_extended: "{{- extended | default(false) -}}"
            read_stacks: "{{- show_stacks | default(false) -}}"
            hide_labels:
            - hidden_volume
            - read_only_volume
            - system_volume
            - hidden_cabinet
            - read_only_cabinet
            - system_cabinet
            exempt_labels:
            - internal
            - hidden
            - system
            ignore_label_prefixes:
            - _
            - .
            always_hide_drawers:
            - AI_Cabinet_VolumeInfo
            max_chars: 131072
            warn_threshold: 0.8
            controller_schema: 1
            manifest: >
              {%- macro compute_health(info, pct_chars, writeable, readable) -%}
                {%- set expected_guid = info.get('id') -%}
                {%- set actual_guid   = info.get('id') -%}
                {%- set guid_mismatch = (expected_guid != actual_guid) -%}
                {%- set storage_warning = (pct_chars >= (warn_threshold * 100)) -%}

                {%- set status = 'ready' -%}
                {%- if guid_mismatch -%}
                  {%- set status = 'error' -%}
                {%- elif storage_warning -%}
                  {%- set status = 'warning' -%}
                {%- endif -%}

                {
                  "status": "{{- status -}}",
                  "guid_mismatch": {{- guid_mismatch | tojson -}},
                  "storage_warning": {{- storage_warning | tojson -}},
                  "writeable": {{- writeable | tojson -}},
                  "readable": {{- readable | tojson -}}
                }
              {%- endmacro -%}

              {%- macro build_drawer_index(vars) -%}
                {%- if vars is mapping
                    and vars.get('_label_index') is mapping
                    and vars['_label_index'].get('value') is defined
                -%}
                  {{- vars['_label_index']['value'] | tojson -}}
                {%- else -%}
                  {{- {} | tojson -}}
                {%- endif -%}
              {%- endmacro -%}

              {%- macro acls_by_category(info) -%}
                {%- set raw_acls = info.get('acls', {}) -%}
                {%- set ns = namespace(by_cat={}, nested=[]) -%}

                {%- for category, entries in raw_acls.items() if entries is sequence -%}

                  {%- set ns.nested = [] -%}

                  {%- set direct = entries | selectattr('entity_guid','defined') | map(attribute='entity_guid') | list -%}
                  {%- set family = entries | selectattr('family_guid','defined') | map(attribute='family_guid') | list -%}

                  {%- for entry in entries if entry is mapping -%}
                    {%- for k,v in entry.items() if v is mapping -%}
                      {%- if 'entity_guid' in v -%}
                        {%- set ns.nested = ns.nested + [v.entity_guid] -%}
                      {%- endif -%}
                      {%- if 'family_guid' in v -%}
                        {%- set ns.nested = ns.nested + [v.family_guid] -%}
                      {%- endif -%}
                      {%- if 'household_guid' in v -%}
                        {%- set ns.nested = ns.nested + [v.household_guid] -%}
                      {%- endif -%}
                    {%- endfor -%}
                  {%- endfor -%}

                  {%- set merged = (direct + family + ns.nested) | reject('none') | unique | list -%}

                  {%- if merged | length > 0 -%}
                    {%- set ns.by_cat = ns.by_cat | combine({ category: merged }) -%}
                  {%- endif -%}
                {%- endfor -%}
                {{- ns.by_cat | tojson -}}

              {%- endmacro -%}

              {%- set result = namespace(data={}) -%}
              {%- set _cab_pool = label_entities('zenos_cabinet') | select('match','sensor\\.') | list -%}
              {%- set _cab_pool = _cab_pool if _cab_pool | length > 0 else (states.sensor | map(attribute='entity_id') | list) -%}
              {%- for ent in _cab_pool -%}
                {%- set vars = state_attr(ent, 'variables') -%}

                {%- if vars is mapping
                      and (vars.get('AI_Cabinet_VolumeInfo') is not none)
                      and (
                        states(ent) in ['online_mounted', 'Variables']
                        or (read_stacks and states(ent) == 'online_unmounted')
                      )
              -%}
                  {%- set _vi_raw = vars.AI_Cabinet_VolumeInfo -%}
                  {%- set _vi_norm = (_vi_raw | from_json({})) if _vi_raw is string else _vi_raw -%}
                  {%- set _vi_val = _vi_norm.get('value', {}) if _vi_norm is mapping else {} -%}
                  {%- set info = _vi_val if _vi_val is mapping else (_vi_val | from_json({}) if _vi_val is string else {}) -%}
                  {%- set st = states[ent] -%}
                  {%- set friendly = st.attributes.friendly_name | default(ent) -%}
                  {%- set lc = st.last_changed.isoformat() -%}
                  {%- set lu = st.last_updated.isoformat() -%}
                  {%- set volume_labels = labels(ent) | default([]) -%}

                  {%- set skip_hidden =
                    (not read_hidden)
                    and (hide_labels | select('in', volume_labels) | list | count > 0)
                    and (volume_labels | select('in', exempt_labels) | list | count == 0)
                  -%}
                  {%- if skip_hidden -%}
                    {%- continue -%}
                  {%- endif -%}

                  {%- set raw_drawers = vars.keys() | list -%}
                  {%- set ns = namespace(drawers=[]) -%}

                  {%- for d in raw_drawers -%}
                    {%- if d not in always_hide_drawers
                          and not d.startswith('_')
                          and not d.startswith('.')
                    -%}
                      {%- set val = vars.get(d, {}) -%}
                      {%- set val_value = val.get('value') if val is mapping else {} -%}

                      {%- if val is mapping and val_value is mapping and val_value.get('mount_point', false) -%}
                        {%- set ns.drawers = ns.drawers + [
                          d ~ ' [mount:' ~ (
                            val_value.get('target_entity_id')
                              if val_value.get('target_entity_id')
                            else val_value.get('target_volume_id')
                              if val_value.get('target_volume_id')
                            else '?'
                            ) ~ ']'
                          ]
                        -%}
                      {%- else -%}
                        {%- set ns.drawers = ns.drawers + [d] -%}
                      {%- endif -%}
                    {%- endif -%}
                  {%- endfor -%}

                  {%- set drawers = ns.drawers | sort -%}

                  {%- set raw_json = vars | tojson -%}
                  {%- set char_count = raw_json | length -%}
                  {%- set pct_chars = (char_count / max_chars * 100) | round(1) -%}
                  {%- set storage_warning = pct_chars >= (warn_threshold * 100) -%}

                  {%- set flags = info.get('flags', {}) -%}
                  {%- set writeable = (not flags.get('read_only', false))
                                      and (info.get('schema_version', 0) | float <= controller_schema)
                                      and not storage_warning -%}
                  {%- set readable = (not storage_warning) -%}

                  {%- set drawer_index = build_drawer_index(vars) | trim | from_json -%}
                  {%- set acls_obj = acls_by_category(info) | from_json -%}
                  {%- set health_obj =
                    compute_health(info, pct_chars, writeable, readable) | from_json
                  -%}

                  {%- set _cab_class = info.get('cabinet_class', none) -%}
                  {%- set _hosted_by = info.get('hosted_by', none) -%}
                  {%- if read_extended -%}
                    {%- set rec =
                      {
                        'entity_id': ent,
                        'friendly_name': friendly,
                        'context': vars.get('_context', {}),
                        'metadata': {
                          'id': info.get('id'),
                          'schema_version': info.get('schema_version'),
                          'labels': volume_labels | sort,
                          'timestamps': { 'last_changed': lc, 'last_updated': lu }
                        },
                        'cabinet_class': _cab_class,
                        'hosted_by': _hosted_by,
                        'stats': { 'drawer_count': drawers | count },
                        'capacity': {
                          'chars_used': char_count,
                          'chars_max': max_chars,
                          'percent_used': pct_chars,
                          'warning': storage_warning
                        },
                        'access': { 'writeable': writeable, 'readable': readable },
                        'drawer_index': drawer_index,
                        'acls_by_category': acls_obj,
                        'health': health_obj
                      } -%}
                  {%- else -%}
                    {%- set rec =
                      {
                        'entity_id': ent,
                        'friendly_name': friendly,
                        'id': info.get('id'),
                        'drawers': drawers | count,
                        'capacity': pct_chars | string + '%',
                        'status': 'needs_touch' if states(ent) == 'Variables' else health_obj.get('status', 'unknown'),
                        'cabinet_class': _cab_class,
                        'hosted_by': _hosted_by,
                        'writeable': writeable,
                        'legacy_schema': states(ent) == 'Variables',
                        'legacy_message': 'Pre-RC2 cab — data intact. Needs a schema touch to migrate to RP2 state machine (one-way). Fire any set_variable or use force_action to provision.' if states(ent) == 'Variables' else none
                      }
                    -%}
                  {%- endif -%}
                  {%- set result.data = result.data | combine({ ent: rec }) -%}
                {%- endif -%}
              {%- endfor -%}

              {{- result.data -}}
        - action: script.zen_dojotools_filecabinet
          data:
            action_type: upsert
            stack: cabinet
            volume_entity_id: "{{- _hh_cab -}}"
            path: "{{- manifest_key -}}"
            value: "{{- manifest | tojson -}}"
            mode: replace
            caller_token: "{{- caller_token | default('') -}}"
          response_variable: _manifest_write
        - variables:
            manifest: "{{- manifest | combine({'caller_token': caller_token | default('')}) if manifest is mapping else manifest -}}"
        - stop: cabinets manifest complete
          response_variable: manifest

      # ── mode: identity ───────────────────────────────────────────────────────
      - conditions: "{{ mode_norm == 'identity' }}"
        sequence:
        - action: script.zen_dojotools_identity
          response_variable: _id_raw
          data:
            mode: build_identity_manifest
            caller_token: "{{ caller_token }}"
        - variables:
            result:
              status: "{{ 'success' if _id_raw is mapping and (_id_raw.get('status') in ['ok', 'success']) else 'error' }}"
              mode: identity
              manifest: "{{ _id_raw.get('manifest', {}) if _id_raw is mapping else {} }}"
              household_cabinet: "{{ _id_raw.get('household_cabinet', '') if _id_raw is mapping else '' }}"
              caller_token: "{{ caller_token }}"
        - stop: identity manifest complete
          response_variable: result

      # ── mode: labels ─────────────────────────────────────────────────────────
      - conditions: "{{ mode_norm == 'labels' }}"
        sequence:
        - action: script.zen_dojotools_labels
          response_variable: _lbl_raw
          data:
            action_type: read
            caller_token: "{{ caller_token }}"
        - variables:
            result:
              status: "{{ 'success' if _lbl_raw is mapping and (_lbl_raw.get('status') in ['ok', 'success']) else 'error' }}"
              mode: labels
              index: "{{ _lbl_raw.get('index', []) if _lbl_raw is mapping else [] }}"
              count: "{{ (_lbl_raw.get('index', []) if _lbl_raw is mapping else []) | length }}"
              caller_token: "{{ caller_token }}"
        - stop: labels manifest complete
          response_variable: result

      # ── mode: tools ──────────────────────────────────────────────────────────
      # Fast scan: entity state check + label cross-reference. No serial calls.
      # Multi-step to keep each >- block small enough for reliable HA parsing.
      - conditions: "{{ mode_norm == 'tools' }}"
        sequence:
        - variables:
            _t_callable: >-
              {%- set ns = namespace(out=[]) -%}
              {%- set name_filter = name | default('') | lower -%}
              {%- set tier_filter = tier | default('') | lower -%}
              {%- for e in states.script -%}
                {%- set eid = e.entity_id -%}
                {%- if eid.startswith('script.zen_dojotools_') or eid.startswith('script.zen_admintools_')
                    or eid.startswith('script.zen_stack_') or eid.startswith('script.zen_sutra_') -%}
                  {%- if eid.startswith('script.zen_dojotools_') -%}{%- set t = 'dojotools' -%}
                  {%- elif eid.startswith('script.zen_admintools_') -%}{%- set t = 'admintools' -%}
                  {%- elif eid.startswith('script.zen_stack_') -%}{%- set t = 'stacks' -%}
                  {%- else -%}{%- set t = 'sutra' -%}{%- endif -%}
                  {%- if e.state in ('off', 'on')
                      and (tier_filter == '' or tier_filter == t)
                      and (name_filter == '' or name_filter in eid) -%}
                    {%- set ns.out = ns.out + [eid] -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out | list }}
            _t_unavailable: >-
              {%- set ns = namespace(out=[]) -%}
              {%- set tier_filter = tier | default('') | lower -%}
              {%- for e in states.script -%}
                {%- set eid = e.entity_id -%}
                {%- if eid.startswith('script.zen_dojotools_') or eid.startswith('script.zen_admintools_')
                    or eid.startswith('script.zen_stack_') or eid.startswith('script.zen_sutra_') -%}
                  {%- if eid.startswith('script.zen_dojotools_') -%}{%- set t = 'dojotools' -%}
                  {%- elif eid.startswith('script.zen_admintools_') -%}{%- set t = 'admintools' -%}
                  {%- elif eid.startswith('script.zen_stack_') -%}{%- set t = 'stacks' -%}
                  {%- else -%}{%- set t = 'sutra' -%}{%- endif -%}
                  {%- if e.state not in ('off', 'on')
                      and (tier_filter == '' or tier_filter == t) -%}
                    {%- set ns.out = ns.out + [eid] -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out | list }}
        - variables:
            result:
              status: ok
              mode: tools
              total_scanned: "{{ (_t_callable | length) + (_t_unavailable | length) }}"
              callable: "{{ _t_callable }}"
              unavailable: "{{ _t_unavailable }}"
              caller_token: "{{ caller_token }}"
        - stop: tools manifest complete
          response_variable: result

      # ── mode: bootstrap_stacks ───────────────────────────────────────────────
      # Discovers all zen_stack_* scripts, calls tool_manifest on each, and
      # self-registers any that declare register_mode and are not yet in
      # lens_registry. Skip list: household cabinet key lens_bootstrap_skip
      # (list of provider_key values — non-obvious, default absent = register all).
      - conditions: "{{ mode_norm == 'bootstrap_stacks' }}"
        sequence:
        - variables:
            _bs_stack_scripts: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for e in states.script -%}
                {%- if e.entity_id != this.entity_id
                    and e.state in ('off', 'on')
                    and (e.entity_id.startswith('script.zen_stack_')
                      or e.entity_id.startswith('script.zen_sutra_')
                      or e.entity_id.startswith('script.zen_dojotools_')) -%}
                  {%- set ns.out = ns.out + [e.entity_id] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out | list }}
        - action: script.zen_dojotools_filecabinet
          continue_on_error: true
          response_variable: _bs_reg_raw
          data:
            action_type: get
            volume_entity_id:
              - "{{ _hh_cab }}"
            key: lens_registry
        - action: script.zen_dojotools_filecabinet
          continue_on_error: true
          response_variable: _bs_skip_raw
          data:
            action_type: get
            volume_entity_id:
              - "{{ _hh_cab }}"
            key: lens_bootstrap_skip
        - variables:
            _bs_registry: >-
              {%- set raw = _bs_reg_raw if _bs_reg_raw is mapping else {} -%}
              {%- set val = raw.get('value', {}) -%}
              {%- set parsed = val | from_json if val is string else val -%}
              {{ parsed if parsed is mapping else {} }}
            _bs_skip_list: >-
              {%- set raw = _bs_skip_raw if _bs_skip_raw is mapping else {} -%}
              {%- set val = raw.get('value', []) -%}
              {%- set parsed = val | from_json if val is string else val -%}
              {{ parsed if parsed is sequence and parsed is not string else [] }}
            _bs_registered: []
            _bs_skipped: []
            _bs_already_registered: []
            _bs_no_register_mode: []
            _bs_errors: []
        - repeat:
            for_each: "{{ _bs_stack_scripts }}"
            sequence:
            - variables:
                _bs_script_eid: "{{ repeat.item | string | trim }}"
                _bs_script_name: "{{ repeat.item | string | trim | replace('script.', '') }}"
            - action: "{{ _bs_script_eid }}"
              continue_on_error: true
              response_variable: _bs_tm_raw
              data:
                mode: tool_manifest
            - variables:
                _bs_tm: "{{ _bs_tm_raw if _bs_tm_raw is mapping else {} }}"
                _bs_register_mode: >-
                  {{ _bs_tm.get('register_mode', '') | string | trim if _bs_tm is mapping else '' }}
                _bs_provider_key: >-
                  {{ _bs_tm.get('provider_key', '') | string | trim if _bs_tm is mapping else '' }}
            - choose:
              - conditions: "{{ _bs_register_mode == '' }}"
                sequence:
                - variables:
                    _bs_no_register_mode: "{{ _bs_no_register_mode + [_bs_script_name] }}"
              - conditions: "{{ _bs_provider_key != '' and _bs_provider_key in _bs_skip_list }}"
                sequence:
                - variables:
                    _bs_skipped: "{{ _bs_skipped + [_bs_provider_key] }}"
              - conditions: "{{ _bs_provider_key != '' and _bs_provider_key in _bs_registry }}"
                sequence:
                - action: "{{ _bs_script_eid }}"
                  continue_on_error: true
                  response_variable: _bs_reg_result
                  data:
                    mode: "{{ _bs_register_mode }}"
                - variables:
                    _bs_already_registered: "{{ _bs_already_registered + [_bs_provider_key] }}"
              default:
              - action: "{{ _bs_script_eid }}"
                continue_on_error: true
                response_variable: _bs_reg_result
                data:
                  mode: "{{ _bs_register_mode }}"
              - choose:
                - conditions: "{{ _bs_reg_result is mapping and _bs_reg_result.get('status', '') == 'success' }}"
                  sequence:
                  - variables:
                      _bs_registered: >-
                        {{ _bs_registered + [_bs_provider_key if _bs_provider_key != '' else _bs_script_name] }}
                default:
                - variables:
                    _bs_errors: >-
                      {{ _bs_errors + [{'script': _bs_script_name,
                         'error': (_bs_reg_result.get('error', 'unknown') if _bs_reg_result is mapping else 'no response')}] }}
        # ── Codex bootstrap — label_entities('zen_codex_host') drives discovery ──
        - variables:
            _bs_codex_hosts: "{{ label_entities('zen_codex_host') | select('match', 'script\\.') | list }}"
            _bs_codex_results: []
        - repeat:
            for_each: "{{ _bs_codex_hosts }}"
            sequence:
            - action: "{{ repeat.item }}"
              continue_on_error: true
              response_variable: _bs_codex_raw
              data:
                mode: run
                case: bootstrap_codices
            - variables:
                _bs_codex_results: >-
                  {{ _bs_codex_results + [_bs_codex_raw if _bs_codex_raw is mapping else {'status': 'error', 'script': repeat.item}] }}
        - variables:
            _bs_codex_result: "{{ _bs_codex_results | first | default({'status': 'skipped', 'reason': 'no zen_codex_host scripts found'}) }}"
        # ── Health refresh (background — populates _health_report cache) ──────
        # Was calling "{{ this.entity_id }}" directly — a blocking self-call
        # while still inside this same execution, which HA's recursion guard
        # correctly refuses ("Disallowed recursion detected"). script.turn_on
        # spawns an independent run instead of nesting inside this call stack.
        - action: script.turn_on
          continue_on_error: true
          target:
            entity_id: "{{ this.entity_id }}"
          data:
            variables:
              mode: health_refresh
        - variables:
            result:
              status: "{{ 'success' if _bs_errors | length == 0 else 'partial' }}"
              mode: bootstrap_stacks
              registered: "{{ _bs_registered }}"
              already_registered: "{{ _bs_already_registered }}"
              skipped: "{{ _bs_skipped }}"
              no_register_mode: "{{ _bs_no_register_mode }}"
              errors: "{{ _bs_errors }}"
              total_scanned: "{{ _bs_stack_scripts | length }}"
              codex_bootstrap: "{{ _bs_codex_result }}"
              caller_token: "{{ caller_token }}"
        - stop: bootstrap_stacks complete
          response_variable: result

      # ── mode: bootstrap_kfc ──────────────────────────────────────────────────
      # Scans all zen_dojotools_* + zen_stack_* + zen_sutra_* scripts, calls
      # tool_manifest on each, and collects those that declare kfc_manifest=true.
      # Then calls kfc_manifest on each discovered tool and upserts a LIVE DRAWER
      # MOUNT per component into the dojo cabinet. Summarizer resolves mounts at
      # runtime — always-current KFC config, zero drift. Idempotent upsert.
      - conditions: "{{ mode_norm == 'bootstrap_kfc' }}"
        sequence:
        - variables:
            _dojo_cab: "{{ states('sensor.zen_dojo_cabinet_resolved') }}"
            _bkfc_known: "{{ label_entities('zen_kfc_provider') | select('match', 'script\\.') | list }}"
            _bkfc_registered: []
            _bkfc_errors: []
            _bkfc_wl_entries: []
        - action: script.zen_dojotools_filecabinet
          continue_on_error: true
          response_variable: _bkfc_dojo_read
          data:
            action_type: read
            volume_entity_id:
              - "{{ _dojo_cab }}"
            key: '*'
        - variables:
            _bkfc_existing_keys: >-
              {%- set raw = _bkfc_dojo_read if _bkfc_dojo_read is mapping else {} -%}
              {%- set val = raw.get('value', {}) -%}
              {%- set parsed = val | from_json if val is string else val -%}
              {{ (parsed if parsed is mapping else {}).keys() | list }}
            _bkfc_dojo_vars: "{{ state_attr(_dojo_cab, 'variables') | default({}, true) }}"
            _bkfc_registered: []
            _bkfc_errors: []
        - repeat:
            for_each: "{{ _bkfc_known }}"
            sequence:
            - action: "{{ repeat.item }}"
              continue_on_error: true
              response_variable: _bkfc_mfst_raw
              data:
                mode: kfc_manifest
            # Capture tool name before inner repeat shadows repeat.item.
            - variables:
                _bkfc_tool_name: "{{ repeat.item | replace('script.', '') }}"
                _bkfc_tool_script: "{{ repeat.item }}"
                _bkfc_kfc_raw: >-
                  {%- set _r = _bkfc_mfst_raw.get('kfc', none) if _bkfc_mfst_raw is mapping else none -%}
                  {%- if _r is string and _r | trim not in ['', 'None', 'none', 'null'] -%}
                    {{ _r | from_json(none) }}
                  {%- else -%}
                    {{ _r }}
                  {%- endif -%}
                _bkfc_ok: >-
                  {{ _bkfc_mfst_raw is mapping
                     and _bkfc_mfst_raw.get('status', '') in ['ok', 'success']
                     and _bkfc_kfc_raw is not none }}
            - variables:
                # Normalize kfc to list — handles both single-component (mapping)
                # and multi-component (list) responses. Backcompat: single mapping
                # → wrapped in list, processed identically.
                _bkfc_kfc_list: >-
                  {%- if _bkfc_kfc_raw is sequence and _bkfc_kfc_raw is not string and _bkfc_kfc_raw is not mapping -%}
                    {{ _bkfc_kfc_raw }}
                  {%- elif _bkfc_kfc_raw is mapping -%}
                    {{ [_bkfc_kfc_raw] }}
                  {%- else -%}
                    {{ [] }}
                  {%- endif -%}
            - if: "{{ _bkfc_ok and _bkfc_kfc_list | length > 0 }}"
              then:
              # Write one live drawer per component into the dojo cabinet.
              # Each drawer contains BOTH:
              #   - breadcrumb fields dojo_loader reads directly from state
              #     (friendly_name, label, kata_key, meta)
              #   - mount_point + fc_args so FC resolves live when scripts call get
              # fc_args.params includes component= so FC gets the single-component dict.
              # No cache (ttl_seconds omitted) = always-live resolution.
              # component_summary is intentionally NOT persisted here (space-saving —
              # same convention as Scribe's KF4 trim_description path). The ninja
              # summarizer resolves an empty component_summary from the HA label's
              # description at read time (dojotools_summarizers.yaml step 3d). A
              # kfc_manifest response may still return component_summary for callers
              # that want it directly (e.g. index/report listings) — it just never
              # gets written into the cabinet drawer.
              - repeat:
                  for_each: "{{ _bkfc_kfc_list }}"
                  sequence:
                  - variables:
                      _bkfc_comp: "{{ repeat.item if repeat.item is mapping else {} }}"
                      _bkfc_kata_key: >-
                        {{ repeat.item.get('kata_key', '') if repeat.item is mapping else '' }}
                  - variables:
                      # Skip write if drawer is already a live mount pointing to the same
                      # tool+component with matching breadcrumbs. Saves cab writes on boot.
                      # state_attr structure: {drawer_key: {timestamp, value: {actual_data}}}
                      _bkfc_needs_write: >-
                        {%- set ex_raw = _bkfc_dojo_vars.get(_bkfc_kata_key, {}) -%}
                        {%- set ex_val = ex_raw.get('value', {}) if ex_raw is mapping else {} -%}
                        {%- set ex = ex_val if ex_val is mapping else {} -%}
                        {%- set ex_args = ex.get('fc_args', {}) if ex is mapping else {} -%}
                        {{ (force_refresh | default(false) | bool(false)) or not (
                          ex.get('mount_point') == true
                          and ex_args.get('tool', '') == _bkfc_tool_name
                          and ex_args.get('params', {}).get('component', '') == _bkfc_kata_key
                          and ex.get('trigger_subscriptions') == _bkfc_comp.get('trigger_subscriptions', '')
                          and ex.get('component_instructions', '') == ''
                        ) }}
                  - if: "{{ _bkfc_kata_key != '' and _bkfc_needs_write }}"
                    then:
                    - action: script.zen_dojotools_filecabinet
                      continue_on_error: true
                      response_variable: _bkfc_write_raw
                      data:
                        action_type: update
                        force_action: true
                        volume_entity_id:
                          - "{{ _dojo_cab }}"
                        key: '{{ _bkfc_kata_key }}'
                        no_autoexpire: true
                        no_autorecycle: true
                        value: >-
                          {{
                            {
                              'mount_point': true,
                              'fc_args': {
                                'tool': _bkfc_tool_name,
                                'params': {'mode': 'kfc_manifest', 'component': _bkfc_kata_key}
                              },
                              'friendly_name': _bkfc_comp.get('friendly_name', ''),
                              'label': _bkfc_comp.get('label', ''),
                              'seed': _bkfc_comp.get('seed', {}),
                              'trigger_subscriptions': _bkfc_comp.get('trigger_subscriptions', ''),
                              'drift_threshold': _bkfc_comp.get('drift_threshold', 6),
                              'emission_cooldown_minutes': _bkfc_comp.get('emission_cooldown_minutes', 1440),
                              'delay_seconds': _bkfc_comp.get('delay_seconds', 0),
                              'kata_key': _bkfc_kata_key,
                              'meta': _bkfc_comp.get('meta', {'enabled': true})
                            } | tojson
                          }}
                    - variables:
                        _bkfc_registered: >-
                          {{ _bkfc_registered + [{'kata_key': _bkfc_kata_key,
                             'tool': _bkfc_tool_script,
                             'component_summary': _bkfc_comp.get('component_summary', ''),
                             'written': _bkfc_write_raw is mapping and _bkfc_write_raw.get('status', '') == 'success'}] }}
                  - if: "{{ _bkfc_kata_key != '' and not _bkfc_needs_write }}"
                    then:
                    - variables:
                        _bkfc_registered: >-
                          {{ _bkfc_registered + [{'kata_key': _bkfc_kata_key,
                             'tool': _bkfc_tool_script,
                             'component_summary': _bkfc_comp.get('component_summary', ''),
                             'written': false, 'skipped': true}] }}
              # Accumulate this tool's whitelist entry — mode sourced from its own response
              - variables:
                  _bkfc_wl_mode: "{{ (_bkfc_mfst_raw.get('mode', '') if _bkfc_mfst_raw is mapping else '') | string | trim }}"
              - variables:
                  _bkfc_wl_entries: >-
                    {%- set _entry = _bkfc_tool_name ~ ':' ~ _bkfc_wl_mode -%}
                    {{ _bkfc_wl_entries + [_entry] if _bkfc_wl_mode != '' and _entry not in _bkfc_wl_entries else _bkfc_wl_entries }}
            - if: "{{ not _bkfc_ok }}"
              then:
              - variables:
                  _bkfc_errors: >-
                    {{ _bkfc_errors + [{'tool': _bkfc_tool_script,
                       'error': 'kfc_manifest call failed or returned no kfc block'}] }}
        # Register accumulated tool:mode entries into the FC mount callout whitelist via admintools
        - if: "{{ _bkfc_wl_entries | length > 0 }}"
          then:
            - action: script.zen_admintools_prompt_loader
              continue_on_error: true
              data:
                mode: whitelist
                whitelist_type: fc
                action_type: add
                item: "{{ _bkfc_wl_entries | tojson }}"
        - variables:
            result:
              status: "{{ 'success' if _bkfc_errors | length == 0 else 'partial' }}"
              mode: bootstrap_kfc
              registered: "{{ _bkfc_registered }}"
              errors: "{{ _bkfc_errors }}"
              total_scanned: "{{ _bkfc_known | length }}"
              caller_token: "{{ caller_token }}"
        - stop: bootstrap_kfc complete
          response_variable: result

      # ── mode: automations ────────────────────────────────────────────────────
      - conditions: "{{ mode_norm == 'automations' }}"
        sequence:
        - variables:
            result: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for a in states.automation -%}
                {%- if a.entity_id.startswith('automation.zen_') -%}
                  {%- set lt = state_attr(a.entity_id, 'last_triggered') -%}
                  {%- set ns.out = ns.out + [{
                    'entity_id': a.entity_id,
                    'alias': state_attr(a.entity_id, 'friendly_name') | default(a.entity_id),
                    'state': a.state,
                    'last_triggered': lt.isoformat() if lt is not none else none
                  }] -%}
                {%- endif -%}
              {%- endfor -%}
              {{
                {
                  'status': 'ok',
                  'mode': 'automations',
                  'automations': ns.out,
                  'count': ns.out | length,
                  'caller_token': caller_token
                }
              }}
        - stop: automations manifest complete
          response_variable: result

      # ── mode: structure ──────────────────────────────────────────────────────
      - conditions: "{{ mode_norm == 'structure' }}"
        sequence:
        - action: script.zen_dojotools_filecabinet
          response_variable: _lr_raw
          data:
            action_type: read
            show_hidden_volumes: false
            volume_entity_id:
              - "{{ _hh_cab }}"
            key: lens_registry
            caller_token: "{{ caller_token }}"
        - variables:
            _lr: >-
              {%- set r = _lr_raw.get('result', {}) if _lr_raw is mapping else {} -%}
              {%- set rm = r | from_json({}) if r is string else r -%}
              {%- set d = rm.get('result', rm) if rm is mapping else {} -%}
              {%- set e = d.get('lens_registry', {}) if d is mapping else {} -%}
              {%- set val = (e.get('value', e) if e is mapping else {}) -%}
              {{ (val | from_json if val is string else val) if val else {} }}
        - variables:
            result:
              status: ok
              mode: structure
              lens_registry: "{{ _lr }}"
              provider_count: "{{ (_lr.get('providers', {}) if _lr is mapping else {}) | length }}"
              caller_token: "{{ caller_token }}"
        - stop: structure manifest complete
          response_variable: result

      # ── mode: audit ──────────────────────────────────────────────────────────
      # Full drift scan — calls tool_manifest on every zen_* script and reports:
      #   level_0_gap      — tools that don't respond to tool_manifest (#10247)
      #   lens_provider    — declared vs registered in lens_registry (#10247)
      #   managed          — tools declaring managed: true, informational (#10247)
      #   mcp_exposed      — declared count only; drift check pending #10176
      #   help_shape       — tools declaring preferred_state.help_shape; gap = undeclared (#10117)
      # Slow (30-60s). Operator diagnostic only.
      - conditions: "{{ mode_norm == 'audit' }}"
        sequence:
        - action: script.zen_dojotools_filecabinet
          continue_on_error: true
          response_variable: _a_lr_raw
          data:
            action_type: read
            volume_entity_id:
              - "{{ _hh_cab }}"
            key: lens_registry
        - variables:
            _a_lens_registry: >-
              {%- set raw = _a_lr_raw if _a_lr_raw is mapping else {} -%}
              {%- set val = raw.get('value', {}) -%}
              {%- set parsed = val | from_json if val is string else val -%}
              {%- set reg = parsed if parsed is mapping else {} -%}
              {%- set nested = reg.get('providers', {}) -%}
              {{ (reg | combine(nested if nested is mapping else {})) if reg is mapping else {} }}
            _a_callable: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for e in states.script -%}
                {%- set eid = e.entity_id -%}
                {%- if (eid.startswith('script.zen_dojotools_') or eid.startswith('script.zen_admintools_')
                    or eid.startswith('script.zen_stack_') or eid.startswith('script.zen_sutra_'))
                    and e.state in ('off', 'on') -%}
                  {%- set ns.out = ns.out + [eid] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out | list }}
            _a_unavailable: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for e in states.script -%}
                {%- set eid = e.entity_id -%}
                {%- if (eid.startswith('script.zen_dojotools_') or eid.startswith('script.zen_admintools_')
                    or eid.startswith('script.zen_stack_') or eid.startswith('script.zen_sutra_'))
                    and e.state not in ('off', 'on') -%}
                  {%- set ns.out = ns.out + [eid] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out | list }}
        - variables:
            _a_scan_targets: >-
              {%- set _self = this.entity_id -%}
              {%- set _no_mode = label_entities('zen_no_mode') | list -%}
              {%- set ns = namespace(out=[]) -%}
              {%- for eid in _a_callable -%}
                {%- if not eid.startswith('script.zen_admintools_') and eid != _self and eid not in _no_mode -%}
                  {%- set ns.out = ns.out + [eid] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out | list }}
            _a_results: []

        - repeat:
            for_each: "{{ _a_scan_targets }}"
            sequence:
            - action: "{{ repeat.item }}"
              continue_on_error: true
              response_variable: _a_tm_raw
              data:
                mode: tool_manifest
            - variables:
                _a_tm: >-
                  {{ _a_tm_raw if _a_tm_raw is mapping else {} }}
            - variables:
                _a_tm_ok: >-
                  {%- set _tm = _a_tm if _a_tm is mapping else {} -%}
                  {{ _tm.get('status', '') in ['ok', 'success'] }}
                _a_lp: >-
                  {%- set _tm = _a_tm if _a_tm is mapping else {} -%}
                  {{ _tm.get('lens_provider', false) | bool }}
                _a_pkey: >-
                  {%- set _tm = _a_tm if _a_tm is mapping else {} -%}
                  {{ _tm.get('provider_key', '') | string }}
                _a_mgd: >-
                  {%- set _tm = _a_tm if _a_tm is mapping else {} -%}
                  {{ _tm.get('managed', false) | bool }}
                _a_mcp: >-
                  {%- set _tm = _a_tm if _a_tm is mapping else {} -%}
                  {{ _tm.get('mcp_exposed', false) | bool }}
            - variables:
                _a_results: >-
                  {{ _a_results + [{
                    'tool': repeat.item | replace('script.', ''),
                    'manifest_ok': _a_tm_ok,
                    'lens_provider': _a_lp,
                    'provider_key': _a_pkey,
                    'managed': _a_mgd,
                    'mcp_exposed': _a_mcp
                  }] }}

        - variables:
            _a_level0_scan: >-
              {{ _a_results | rejectattr('manifest_ok') | map(attribute='tool') | list }}
            _a_level0_unavail: >-
              {{ _a_unavailable | map('replace', 'script.', '') | list }}
            _a_lp_declared: >-
              {{ _a_results | selectattr('lens_provider') | list }}
            _a_managed_list: >-
              {{ _a_results | selectattr('managed') | map(attribute='tool') | list }}
            _a_mcp_declared: >-
              {{ _a_results | selectattr('mcp_exposed') | map(attribute='tool') | list }}

        # Lens provider drift: declared lens_provider=true but provider_key absent from lens_registry
        - variables:
            _a_lp_gap: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for entry in _a_lp_declared -%}
                {%- set pkey = entry.get('provider_key', '') -%}
                {%- if pkey == '' -%}
                  {%- set ns.out = ns.out + [{'tool': entry.get('tool'), 'issue': 'lens_declared_no_key'}] -%}
                {%- elif pkey not in _a_lens_registry -%}
                  {%- set ns.out = ns.out + [{'tool': entry.get('tool'), 'issue': 'lens_declared_not_registered', 'provider_key': pkey}] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out }}

        - variables:
            _a_has_issues: >-
              {{ (_a_level0_scan | length > 0)
                 or (_a_level0_unavail | length > 0)
                 or (_a_lp_gap | length > 0) }}
            result:
              status: "{{ 'issues_found' if _a_has_issues else 'clean' }}"
              mode: audit
              generated_at: "{{ now().isoformat() }}"
              scanned: "{{ _a_results | length }}"
              drift:
                level_0_gap:
                  count: "{{ (_a_level0_scan | length) + (_a_level0_unavail | length) }}"
                  no_manifest: "{{ _a_level0_scan }}"
                  unavailable: "{{ _a_level0_unavail }}"
                lens_provider:
                  declared: "{{ _a_lp_declared | length }}"
                  registered: "{{ _a_lens_registry | length }}"
                  gap: "{{ _a_lp_gap }}"
                managed:
                  count: "{{ _a_managed_list | length }}"
                  tools: "{{ _a_managed_list }}"
                mcp_exposed:
                  declared: "{{ _a_mcp_declared | length }}"
                  note: "drift check on hold — MCP allowlist not yet implemented"
                help_surface:
                  note: "run mode=audit_help for live help compliance scan"
              caller_token: "{{ caller_token }}"
        - stop: audit complete
          response_variable: result

      # ── mode: label_audit ────────────────────────────────────────────────────
      # admintools tier excluded from scan targets, same as mode=audit above —
      # confirmed via bisection (2026-07-29) that sequentially scanning the full
      # zen_admintools_* group triggers a pre-existing 'limit' is undefined error
      # (reproducible only across the full group, not any single admintools tool
      # in isolation — root cause not in Phase 7 scope, mirrors audit's existing
      # exclusion rather than chasing it here).
      # Fans out mode=tool_manifest across every known zen_* tool, collects each
      # tool's missing_required_labels (computed read-only inside tool_manifest()
      # itself, per-tool, against the live label registry), and aggregates a
      # system-wide report. Detection only unless auto_create=true confirm=true,
      # in which case distinct missing labels are created via zen_dojotools_labels
      # mode=create — same confirm-gate that tool already enforces, never bypassed.
      # include_optional=true additionally sweeps missing_optional_labels (also
      # always computed read-only inside tool_manifest()) and, with auto_create,
      # creates those too — same confirm gate, no separate override needed.
      - conditions: "{{ mode_norm == 'label_audit' }}"
        sequence:
        - variables:
            _la_self: "{{ this.entity_id }}"
            _la_no_mode: "{{ label_entities('zen_no_mode') | list }}"
            _la_name_filter: "{{ name | default('') | lower }}"
            _la_include_optional: "{{ include_optional | default(false) | bool(false) }}"
            _la_scan_targets: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for e in states.script -%}
                {%- set eid = e.entity_id -%}
                {%- if (eid.startswith('script.zen_dojotools_')
                    or eid.startswith('script.zen_stack_') or eid.startswith('script.zen_sutra_'))
                    and e.state in ('off', 'on')
                    and eid != _la_self
                    and eid not in _la_no_mode
                    and (_la_name_filter == '' or _la_name_filter in eid) -%}
                  {%- set ns.out = ns.out + [eid] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out | list }}
            _la_results: []
            _la_opt_results: []
            _la_errors: []
        - repeat:
            for_each: "{{ _la_scan_targets }}"
            sequence:
            - variables:
                _la_tool_name: "{{ repeat.item | replace('script.', '') }}"
            - action: "{{ repeat.item }}"
              continue_on_error: true
              response_variable: _la_tm_raw
              data:
                mode: tool_manifest
            - variables:
                _la_tm: "{{ _la_tm_raw if _la_tm_raw is mapping else {} }}"
            - choose:
              - conditions: "{{ _la_tm.get('status', '') not in ['ok', 'success'] }}"
                sequence:
                - variables:
                    _la_errors: >-
                      {{ _la_errors + [{'tool': _la_tool_name, 'error': 'tool_manifest call failed or non-compliant'}] }}
              - conditions: "{{ (_la_tm.get('missing_required_labels', []) | length) > 0 }}"
                sequence:
                - variables:
                    _la_results: >-
                      {{ _la_results + [{'tool': _la_tool_name, 'missing': _la_tm.get('missing_required_labels', [])}] }}
            - if: "{{ _la_include_optional and (_la_tm.get('missing_optional_labels', []) | length) > 0 }}"
              then:
              - variables:
                  _la_opt_results: >-
                    {{ _la_opt_results + [{'tool': _la_tool_name, 'missing': _la_tm.get('missing_optional_labels', [])}] }}
        - variables:
            _la_all_missing: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for entry in _la_results -%}
                {%- for lbl in entry.get('missing', []) -%}
                  {%- if lbl not in ns.out -%}{%- set ns.out = ns.out + [lbl] -%}{%- endif -%}
                {%- endfor -%}
              {%- endfor -%}
              {{ ns.out | list }}
            _la_all_missing_optional: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for entry in _la_opt_results -%}
                {%- for lbl in entry.get('missing', []) -%}
                  {%- if lbl not in ns.out -%}{%- set ns.out = ns.out + [lbl] -%}{%- endif -%}
                {%- endfor -%}
              {%- endfor -%}
              {{ ns.out | list }}
            _la_auto_create: "{{ auto_create | default(false) | bool(false) }}"
            _la_confirm: "{{ confirm | default(false) | bool(false) }}"
        - variables:
            _la_create_pool: >-
              {%- set ns = namespace(out=_la_all_missing) -%}
              {%- if _la_include_optional -%}
                {%- for lbl in _la_all_missing_optional -%}
                  {%- if lbl not in ns.out -%}{%- set ns.out = ns.out + [lbl] -%}{%- endif -%}
                {%- endfor -%}
              {%- endif -%}
              {{ ns.out | list }}
        - choose:
          - conditions: "{{ _la_auto_create and _la_confirm and _la_create_pool | length > 0 }}"
            sequence:
            - action: script.zen_dojotools_labels
              continue_on_error: true
              response_variable: _la_create_raw
              data:
                mode: create
                label_list: "{{ _la_create_pool }}"
                confirm: true
            - variables:
                _la_created: "{{ _la_create_raw.get('created_labels', []) if _la_create_raw is mapping else [] }}"
                result:
                  status: "{{ 'remediated' if _la_created | length > 0 else 'issues_found' }}"
                  mode: label_audit
                  generated_at: "{{ now().isoformat() }}"
                  scanned: "{{ _la_scan_targets | length }}"
                  include_optional: "{{ _la_include_optional }}"
                  tools_with_gaps: "{{ _la_results }}"
                  tools_with_optional_gaps: "{{ _la_opt_results }}"
                  all_missing_labels: "{{ _la_all_missing }}"
                  all_missing_optional_labels: "{{ _la_all_missing_optional }}"
                  auto_create: true
                  created_labels: "{{ _la_created }}"
                  errors: "{{ _la_errors }}"
                  caller_token: "{{ caller_token }}"
          default:
          - variables:
              result:
                status: "{{ 'clean' if (_la_results | length == 0 and (not _la_include_optional or _la_opt_results | length == 0)) else 'issues_found' }}"
                mode: label_audit
                generated_at: "{{ now().isoformat() }}"
                scanned: "{{ _la_scan_targets | length }}"
                include_optional: "{{ _la_include_optional }}"
                tools_with_gaps: "{{ _la_results }}"
                tools_with_optional_gaps: "{{ _la_opt_results }}"
                all_missing_labels: "{{ _la_all_missing }}"
                all_missing_optional_labels: "{{ _la_all_missing_optional }}"
                auto_create: false
                note: "{{ 'Pass auto_create=true confirm=true to create these labels via zen_dojotools_labels.' if _la_create_pool | length > 0 else '' }}"
                errors: "{{ _la_errors }}"
                caller_token: "{{ caller_token }}"
        - stop: label_audit complete
          response_variable: result

      # ── mode: repair ─────────────────────────────────────────────────────────
      # General-purpose remediation entry point — deliberately named 'repair'
      # rather than 'repair_labels' because labels are the only fixable
      # known_issues category TODAY, not the only one planned. As more
      # zen_health_report known_issues categories become genuinely automatable
      # (e.g. dismissing a stale HACS restart_required ghost via ectoplasm, or
      # gating an ha_restart), they get dispatched from this same mode by
      # category — callers and Spook's install_hint text keep pointing at
      # `mode=repair` without ever needing to change.
      # Today: confirm-gated wrapper around label_audit's scan+create logic.
      # include_optional (default true) is a real toggle, not forced — pass
      # include_optional=false for required-labels-only repair. This is the
      # entry point Spook's "unknown_label" ghost repairs point callers at (see
      # zen_health_report's known_issues category=label_gap) — Spook self-heals
      # those specific repair entries on its own next scan once the underlying
      # label exists, so this mode does not (and cannot, without Spook's own
      # actions) touch the Issue Registry directly. Other known_issues
      # categories (missing_dependency, informational) are NOT fixable by this
      # tool yet — they require installing an integration or a manual restart.
      - conditions: "{{ mode_norm == 'repair' }}"
        sequence:
        - variables:
            _rp_self: "{{ this.entity_id }}"
            _rp_no_mode: "{{ label_entities('zen_no_mode') | list }}"
            _rp_confirm: "{{ confirm | default(false) | bool(false) }}"
            _rp_include_optional: "{{ include_optional | default(true) | bool(true) }}"
            _rp_force_raw: "{{ force | default(false) | bool(false) }}"
            _rp_force_labels_raw: >-
              {%- set _fl = force_labels | default([]) -%}
              {{ (_fl | from_json) if _fl is string and _fl | trim not in ['', '[]'] else (_fl if _fl is iterable and _fl is not string else []) }}
            # force/force_labels rewrite an EXISTING KFC label via delete+
            # recreate. Entities that carried the label are auto-retagged from
            # a pre-capture — but AREAS and DEVICES are NOT (label_entities()
            # only sees entities) — that association is gone permanently
            # unless the caller retags it themselves. force_ack must be the
            # exact literal phrase below or the force request is silently
            # downgraded to the safe skip-existing default, surfaced in the
            # response so the caller knows why nothing got rewritten.
            _rp_force_ack_ok: "{{ (force_ack | default('', true) | trim) == 'yes I meant to do that' }}"
        - variables:
            _rp_force_requested: "{{ _rp_force_raw or _rp_force_labels_raw | length > 0 }}"
            _rp_force: "{{ _rp_force_raw and _rp_force_ack_ok }}"
            _rp_force_labels: "{{ _rp_force_labels_raw if _rp_force_ack_ok else [] }}"
            _rp_force_blocked: "{{ (_rp_force_raw or _rp_force_labels_raw | length > 0) and not _rp_force_ack_ok }}"
            _rp_scan_targets: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for e in states.script -%}
                {%- set eid = e.entity_id -%}
                {%- if (eid.startswith('script.zen_dojotools_')
                    or eid.startswith('script.zen_stack_') or eid.startswith('script.zen_sutra_'))
                    and e.state in ('off', 'on')
                    and eid != _rp_self
                    and eid not in _rp_no_mode -%}
                  {%- set ns.out = ns.out + [eid] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out | list }}
            _rp_results: []
            _rp_opt_results: []
            _rp_errors: []
            _rp_kfc_label_map: []
        - repeat:
            for_each: "{{ _rp_scan_targets }}"
            sequence:
            - variables:
                _rp_tool_name: "{{ repeat.item | replace('script.', '') }}"
            - action: "{{ repeat.item }}"
              continue_on_error: true
              response_variable: _rp_tm_raw
              data:
                mode: tool_manifest
            - variables:
                _rp_tm: "{{ _rp_tm_raw if _rp_tm_raw is mapping else {} }}"
            - choose:
              - conditions: "{{ _rp_tm.get('status', '') not in ['ok', 'success'] }}"
                sequence:
                - variables:
                    _rp_errors: >-
                      {{ _rp_errors + [{'tool': _rp_tool_name, 'error': 'tool_manifest call failed or non-compliant'}] }}
              - conditions: "{{ (_rp_tm.get('missing_required_labels', []) | length) > 0 }}"
                sequence:
                - variables:
                    _rp_results: >-
                      {{ _rp_results + [{'tool': _rp_tool_name, 'missing': _rp_tm.get('missing_required_labels', [])}] }}
            - if: "{{ _rp_include_optional and (_rp_tm.get('missing_optional_labels', []) | length) > 0 }}"
              then:
              - variables:
                  _rp_opt_results: >-
                    {{ _rp_opt_results + [{'tool': _rp_tool_name, 'missing': _rp_tm.get('missing_optional_labels', [])}] }}
            # KFC-label description sync: a label is "load-bearing" for a KFC
            # component when that component's own kfc_manifest entry declares
            # label=<name>. component_summary is the authoritative description
            # for that label — if it drifts from what's on the label, the label
            # is stale, not the KFC definition. Per household direction: KFC
            # labels get their description clobbered unconditionally on every
            # repair run (no "only on creation" caution) — a stale hand-edited
            # description on a machine-owned label IS the bug.
            - if: "{{ 'kfc_manifest' in (_rp_tm.get('modes', []) or []) }}"
              then:
              - action: "{{ repeat.item }}"
                continue_on_error: true
                response_variable: _rp_kfc_raw
                data:
                  mode: kfc_manifest
              - variables:
                  _rp_kfc_list: "{{ _rp_kfc_raw.get('kfc', []) if _rp_kfc_raw is mapping else [] }}"
              - variables:
                  # icon/color: prefer a per-component override if the tool's
                  # kfc_manifest entry ever declares its own icon/color; else
                  # fall back to the tool-level icon/color already declared in
                  # tool_manifest() — zero new authoring needed for that path,
                  # every tool already sets these.
                  _rp_kfc_label_map: >-
                    {%- set ns = namespace(l=_rp_kfc_label_map) -%}
                    {%- set _tool_icon = (_rp_tm.get('icon', '') | trim) -%}
                    {%- set _tool_color = (_rp_tm.get('color', '') | trim) -%}
                    {%- for _kd in _rp_kfc_list if _kd is mapping and (_kd.get('label') | trim if _kd.get('label') else '') != '' and (_kd.get('component_summary') | trim if _kd.get('component_summary') else '') != '' -%}
                      {%- set _icon = (_kd.get('icon') | trim) if (_kd.get('icon') and _kd.get('icon') | trim != '') else _tool_icon -%}
                      {%- set _color = (_kd.get('color') | trim) if (_kd.get('color') and _kd.get('color') | trim != '') else _tool_color -%}
                      {%- set ns.l = ns.l + [{'label': _kd.get('label') | trim, 'component_summary': _kd.get('component_summary') | trim, 'tool': _rp_tool_name, 'icon': _icon, 'color': _color}] -%}
                    {%- endfor -%}
                    {{ ns.l }}
        - variables:
            _rp_create_pool: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for entry in _rp_results + _rp_opt_results -%}
                {%- for lbl in entry.get('missing', []) -%}
                  {%- if lbl not in ns.out -%}{%- set ns.out = ns.out + [lbl] -%}{%- endif -%}
                {%- endfor -%}
              {%- endfor -%}
              {{ ns.out | list }}
            _rp_kfc_label_map_deduped: >-
              {%- set ns = namespace(seen=[], out=[]) -%}
              {%- for e in _rp_kfc_label_map -%}
                {%- if e.label not in ns.seen -%}
                  {%- set ns.seen = ns.seen + [e.label] -%}
                  {%- set ns.out = ns.out + [e] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out }}
        # Split the create pool: KFC-bound labels that need creating get their
        # description baked into the SAME create call (one call per label,
        # since a batch create's new_description would apply one string to
        # every label in the batch). Never create-then-patch for these — a
        # blank KFC label between those two calls (e.g. if the second call
        # never ran) is itself a broken state, not an acceptable transient one.
        - variables:
            _rp_kfc_labels_set: "{{ _rp_kfc_label_map_deduped | map(attribute='label') | list }}"
            _rp_kfc_create_pool: "{{ _rp_kfc_label_map_deduped | selectattr('label', 'in', _rp_create_pool) | list }}"
            _rp_plain_create_pool: "{{ _rp_create_pool | reject('in', _rp_kfc_labels_set) | list }}"
        - choose:
          - conditions: "{{ _rp_confirm and _rp_plain_create_pool | length > 0 }}"
            sequence:
            - action: script.zen_dojotools_labels
              continue_on_error: true
              response_variable: _rp_create_raw
              data:
                mode: create
                label_list: "{{ _rp_plain_create_pool }}"
                confirm: true
            - variables:
                _rp_created: "{{ _rp_create_raw.get('created_labels', []) if _rp_create_raw is mapping else [] }}"
          default:
          - variables:
              _rp_created: []
        - variables:
            _rp_kfc_created: []
        - if: "{{ _rp_confirm and _rp_kfc_create_pool | length > 0 }}"
          then:
          - repeat:
              for_each: "{{ _rp_kfc_create_pool }}"
              sequence:
              - action: script.zen_dojotools_labels
                continue_on_error: true
                response_variable: _rp_kfc_create_resp
                data: >-
                  {{ {'mode': 'create', 'label_list': [repeat.item.label], 'new_description': repeat.item.component_summary, 'confirm': true}
                     | combine({'new_icon': repeat.item.icon} if repeat.item.icon != '' else {})
                     | combine({'new_color': repeat.item.color} if repeat.item.color != '' else {}) }}
              - if: "{{ repeat.item.label in (_rp_kfc_create_resp.get('created_labels', []) if _rp_kfc_create_resp is mapping else []) }}"
                then:
                - variables:
                    _rp_kfc_created: "{{ _rp_kfc_created + [{'label': repeat.item.label, 'tool': repeat.item.tool}] }}"
        # zen_dojotools_labels' mode=update has no native HA update_label
        # service to call — HA only exposes create_label/rename_label/
        # remove_label — so "update" is implemented as delete_label +
        # create_label + re-tag every entity that carried the label. It does
        # restore ENTITY associations from a pre-capture, but NOT area/device
        # associations (label_entities() only sees entities), and there's a
        # real (if brief) window where the label doesn't exist at all. That's
        # too much risk to pay on every single repair run (boot + midnight +
        # manual) for a label that already exists — so by default we skip the
        # update call entirely for any KFC label that already exists, no
        # content diff needed. Two ways to override the skip: force=true
        # (shotgun — rewrite every existing KFC label this run) or
        # force_labels=[...] (scalpel — rewrite only the named label(s),
        # everything else still skipped).
        - variables:
            _rp_kfc_synced: []
            _rp_kfc_existing_only: "{{ _rp_kfc_label_map_deduped | rejectattr('label', 'in', _rp_create_pool) | list }}"
        - variables:
            _rp_kfc_needs_update: "{{ _rp_kfc_existing_only | selectattr('label', 'in', _rp_force_labels) | list if not _rp_force else _rp_kfc_existing_only }}"
            _rp_kfc_unchanged: "{{ _rp_kfc_existing_only | rejectattr('label', 'in', _rp_force_labels) | list if not _rp_force else [] }}"
        - if: "{{ _rp_confirm and _rp_kfc_needs_update | length > 0 }}"
          then:
          - repeat:
              for_each: "{{ _rp_kfc_needs_update }}"
              sequence:
              - action: script.zen_dojotools_labels
                continue_on_error: true
                response_variable: _rp_desc_resp
                data: >-
                  {{ {'mode': 'update', 'label_list': [repeat.item.label], 'new_description': repeat.item.component_summary, 'confirm': true}
                     | combine({'new_icon': repeat.item.icon} if repeat.item.icon != '' else {})
                     | combine({'new_color': repeat.item.color} if repeat.item.color != '' else {}) }}
              - variables:
                  _rp_kfc_synced: "{{ _rp_kfc_synced + [{'label': repeat.item.label, 'tool': repeat.item.tool}] }}"
        - choose:
          - conditions: "{{ _rp_confirm and (_rp_plain_create_pool | length > 0 or _rp_kfc_create_pool | length > 0 or _rp_kfc_existing_only | length > 0) }}"
            sequence:
            - variables:
                result:
                  status: "{{ 'repaired' if (_rp_created | length > 0 or _rp_kfc_created | length > 0 or _rp_kfc_synced | length > 0) else 'issues_found' }}"
                  success: true
                  mode: repair
                  generated_at: "{{ now().isoformat() }}"
                  scanned: "{{ _rp_scan_targets | length }}"
                  include_optional: "{{ _rp_include_optional }}"
                  force: "{{ _rp_force }}"
                  force_labels: "{{ _rp_force_labels }}"
                  force_blocked: "{{ _rp_force_blocked }}"
                  tools_with_gaps: "{{ _rp_results }}"
                  tools_with_optional_gaps: "{{ _rp_opt_results }}"
                  created_labels: "{{ _rp_created + (_rp_kfc_created | map(attribute='label') | list) }}"
                  kfc_labels_created_with_description: "{{ _rp_kfc_created }}"
                  kfc_label_descriptions_synced: "{{ _rp_kfc_synced }}"
                  kfc_labels_skipped_existing: "{{ _rp_kfc_unchanged }}"
                  warning: >-
                    {%- if _rp_force_blocked -%}
                      force/force_labels requested but force_ack did not match 'yes I meant to do that' verbatim — request downgraded to safe skip-existing behavior, nothing was rewritten.
                    {%- elif _rp_kfc_synced | length > 0 -%}
                      ACTION REQUIRED — {{ _rp_kfc_synced | map(attribute='label') | join(', ') }} {{ 'was' if _rp_kfc_synced | length == 1 else 'were' }} deleted and recreated. Entities were auto-restored from a pre-capture, but AREAS and DEVICES were NOT — if any area or device carried this label, that association is gone and you need to reapply it by hand.
                    {%- else -%}
                    {%- endif -%}
                  note: "Spook's corresponding 'unknown_label' repair issues (if any) will self-clear on Spook's next scan now that the label(s) exist — this tool does not touch the Issue Registry directly. Existing KFC labels are skipped by default (delete+recreate risk not worth paying when nothing changed) — pass force=true (all) or force_labels=[...] (scalpel) plus force_ack='yes I meant to do that' to rewrite them anyway. Non-label known_issues (missing_dependency, informational) are not fixable by this tool — see zen_health_report's known_issues for install_hint/degrades detail."
                  errors: "{{ _rp_errors }}"
                  caller_token: "{{ caller_token }}"
          default:
          - variables:
              result:
                status: "{{ 'clean' if (_rp_create_pool | length == 0 and _rp_kfc_needs_update | length == 0) else 'issues_found' }}"
                mode: repair
                generated_at: "{{ now().isoformat() }}"
                scanned: "{{ _rp_scan_targets | length }}"
                include_optional: "{{ _rp_include_optional }}"
                force: "{{ _rp_force }}"
                force_labels: "{{ _rp_force_labels }}"
                force_blocked: "{{ _rp_force_blocked }}"
                tools_with_gaps: "{{ _rp_results }}"
                tools_with_optional_gaps: "{{ _rp_opt_results }}"
                would_create: "{{ _rp_create_pool }}"
                would_sync_kfc_label_descriptions: "{{ _rp_kfc_needs_update }}"
                would_skip_existing_kfc_labels: "{{ _rp_kfc_unchanged }}"
                note: "{{ 'Pass confirm=true to create/sync labels now.' if (_rp_create_pool | length > 0 or _rp_kfc_needs_update | length > 0) else '' }}{{ ' Existing KFC labels shown in would_skip_existing_kfc_labels will not be touched unless force=true or force_labels includes them, plus force_ack=\"yes I meant to do that\".' if _rp_kfc_unchanged | length > 0 else '' }}{{ ' force/force_labels requested but force_ack did not match verbatim — ignored this call.' if _rp_force_blocked else '' }}"
                errors: "{{ _rp_errors }}"
                caller_token: "{{ caller_token }}"
        - stop: repair complete
          response_variable: result

      # ── mode: audit_help ─────────────────────────────────────────────────────
      # Calls mode=help on every zen_* tool, checks if response.cases is a mapping.
      # Separate from mode=audit to avoid timeout (~71 additional calls).
      # compliant = tool returns {cases: {…}} mapping. gap = anything else.
      - conditions: "{{ mode_norm == 'audit_help' }}"
        sequence:
        - variables:
            _ah_page: "{{ [page | default(1) | int, 1] | max }}"
            _ah_page_size: "{{ [page_size | default(20) | int, 1] | max }}"
            _ah_all: >-
              {%- set _self = this.entity_id -%}
              {%- set _skip = label_entities('zen_no_mode') | list -%}
              {%- set _pfx = ['script.zen_dojotools_', 'script.zen_stack_', 'script.zen_sutra_', 'script.zen_codex_'] -%}
              {%- set ns = namespace(out=[]) -%}
              {%- for e in states.script -%}
                {%- set ok = namespace(v=false) -%}
                {%- for p in _pfx -%}{%- if e.entity_id.startswith(p) -%}{%- set ok.v = true -%}{%- endif -%}{%- endfor -%}
                {%- if ok.v and e.state in ('off', 'on') and e.entity_id != _self and e.entity_id not in _skip -%}
                  {%- set ns.out = ns.out + [e.entity_id] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out | list }}
        - variables:
            _ah_start: "{{ (_ah_page - 1) * _ah_page_size }}"
            _ah_end: "{{ _ah_page * _ah_page_size }}"
            _ah_callable: "{{ _ah_all[_ah_start:_ah_end] }}"
            _ah_total: "{{ _ah_all | length }}"
            _ah_results: []
        - repeat:
            for_each: "{{ _ah_callable }}"
            sequence:
            - variables:
                _ah_help_raw: {}
            - action: "{{ repeat.item }}"
              continue_on_error: true
              response_variable: _ah_help_raw
              data:
                mode: help
            - variables:
                _ah_ok: >-
                  {%- set r = _ah_help_raw if _ah_help_raw is mapping else {} -%}
                  {{ r.get('cases') is mapping }}
            - variables:
                _ah_results: >-
                  {{ _ah_results + [{
                    'tool': repeat.item | replace('script.', ''),
                    'compliant': _ah_ok
                  }] }}
        - variables:
            _ah_compliant: "{{ _ah_results | selectattr('compliant') | map(attribute='tool') | list }}"
            _ah_gap: "{{ _ah_results | rejectattr('compliant') | map(attribute='tool') | list }}"
            result:
              status: "{{ 'clean' if _ah_gap | length == 0 else 'issues_found' }}"
              mode: audit_help
              generated_at: "{{ now().isoformat() }}"
              page: "{{ _ah_page }}"
              page_size: "{{ _ah_page_size }}"
              total_tools: "{{ _ah_total }}"
              total_pages: "{{ ((_ah_total / _ah_page_size) | float | round(0, 'ceil')) | int }}"
              scanned: "{{ _ah_results | length }}"
              compliant: "{{ _ah_compliant | length }}"
              gap: "{{ _ah_gap | length }}"
              compliant_tools: "{{ _ah_compliant }}"
              gap_tools: "{{ _ah_gap }}"
              note: "compliant = mode=help returns {cases: mapping}; gap = missing handler or non-cases shape"
              caller_token: "{{ caller_token }}"
        - stop: audit_help complete
          response_variable: result

      # ── mode: health ─────────────────────────────────────────────────────────
      # Reads pre-computed _health_report cabinet drawer (written by health_refresh).
      # Falls back to lightweight binary check if cache absent.
      # Run mode=health_refresh (or wait for bootstrap_stacks) to populate cache.
      - conditions: "{{ mode_norm == 'health' }}"
        sequence:
        - action: script.zen_dojotools_filecabinet
          continue_on_error: true
          response_variable: _h_cache_raw
          data:
            action_type: read
            volume_entity_id:
              - "{{ _hh_cab }}"
            key: _health_report
        - variables:
            _h_cache: >-
              {%- set raw = _h_cache_raw if _h_cache_raw is mapping else {} -%}
              {%- set val = raw.get('value', none) -%}
              {%- set parsed = val | from_json if val is string else val -%}
              {{ parsed if parsed is mapping else none }}
        - choose:
          - conditions: "{{ _h_cache is mapping }}"
            sequence:
            - variables:
                _h_tools: "{{ (_h_cache.get('facets', {}) or {}).get('tools', {}) or {} }}"
                _h_devs: "{{ _h_tools.get('deviating', []) or [] }}"
                result:
                  status: "{{ _h_cache.get('status', 'unknown') }}"
                  mode: health
                  cache_hit: true
                  last_refresh: "{{ _h_cache.get('generated_at', 'unknown') }}"
                  summary:
                    identity: "{{ (_h_cache.get('facets', {}) or {}).get('identity', 'unknown') }}"
                    labels: "{{ (_h_cache.get('facets', {}) or {}).get('labels', 'unknown') }}"
                    cabinets: "{{ (_h_cache.get('facets', {}) or {}).get('cabinets', 'unknown') }}"
                    tools_scanned: "{{ _h_tools.get('total_scanned', 0) }}"
                    compliant: "{{ _h_tools.get('compliant', 0) }}"
                    warnings: "{{ _h_tools.get('warnings', 0) }}"
                    errors: "{{ _h_tools.get('errors', 0) }}"
                    deviating: "{{ _h_devs }}"
                  detail_hint: "Call mode=health_refresh for a fresh per-tool compliance scan."
                  caller_token: "{{ caller_token }}"
            - stop: health cache hit
              response_variable: result
          default:
          # Cache absent — lightweight fallback (no per-tool manifest calls)
          - action: script.zen_dojotools_identity
            response_variable: _h_identity
            continue_on_error: true
            data:
              mode: build_identity_manifest
          - action: script.zen_dojotools_labels
            response_variable: _h_labels
            continue_on_error: true
            data:
              action_type: read
          - variables:
              _h_cab_sensor: "{{ states('sensor.zen_cabinet_health') | default('unknown') }}"
              _id_ok: "{{ _h_identity is mapping and (_h_identity.get('status') in ['ok', 'success']) }}"
              _lbl_ok: "{{ _h_labels is mapping and _h_labels.get('status') == 'ok' }}"
              _h_callable_ct: >-
                {%- set ns = namespace(n=0) -%}
                {%- for e in states.script -%}
                  {%- if (e.entity_id.startswith('script.zen_dojotools_') or e.entity_id.startswith('script.zen_admintools_')
                      or e.entity_id.startswith('script.zen_stack_') or e.entity_id.startswith('script.zen_sutra_'))
                      and e.state in ('off', 'on') -%}{%- set ns.n = ns.n + 1 -%}{%- endif -%}
                {%- endfor -%}{{ ns.n }}
              _h_unavail_ct: >-
                {%- set ns = namespace(n=0) -%}
                {%- for e in states.script -%}
                  {%- if (e.entity_id.startswith('script.zen_dojotools_') or e.entity_id.startswith('script.zen_admintools_')
                      or e.entity_id.startswith('script.zen_stack_') or e.entity_id.startswith('script.zen_sutra_'))
                      and e.state not in ('off', 'on') -%}{%- set ns.n = ns.n + 1 -%}{%- endif -%}
                {%- endfor -%}{{ ns.n }}
          - variables:
              result:
                status: >-
                  {{ 'issues_found' if (not _id_ok or not _lbl_ok
                     or _h_unavail_ct | int > 0
                     or _h_cab_sensor not in ('ok', 'warn'))
                     else 'ok' }}
                mode: health
                cache_hit: false
                refresh_hint: "Cache absent — run mode=health_refresh to populate per-tool compliance data."
                facets:
                  identity: "{{ 'ok' if _id_ok else 'error' }}"
                  labels: "{{ 'ok' if _lbl_ok else 'error' }}"
                  cabinets: "{{ _h_cab_sensor }}"
                  tools:
                    healthy: "{{ _h_callable_ct }}"
                    broken: "{{ _h_unavail_ct }}"
                    deviating: []
                caller_token: "{{ caller_token }}"
          - stop: health fallback
            response_variable: result

      # ── mode: health_refresh ─────────────────────────────────────────────────
      # Runs full per-tool compliance scan (slow — 10-30s). Writes result to
      # _health_report cabinet drawer. Called by bootstrap_stacks on startup/daily.
      # Also callable manually: zen_dojotools_manifest mode=health_refresh
      - conditions: "{{ mode_norm == 'health_refresh' }}"
        sequence:
        - action: script.zen_dojotools_identity
          response_variable: _hr_identity
          continue_on_error: true
          data:
            mode: build_identity_manifest
        - action: script.zen_dojotools_labels
          response_variable: _hr_labels
          continue_on_error: true
          data:
            action_type: read
        - action: script.zen_dojotools_filecabinet
          continue_on_error: true
          response_variable: _hr_lr_raw
          data:
            action_type: read
            volume_entity_id:
              - "{{ _hh_cab }}"
            key: lens_registry
        - action: script.zen_dojotools_filecabinet
          continue_on_error: true
          response_variable: _hr_cr_raw
          data:
            action_type: read
            volume_entity_id:
              - "{{ _hh_cab }}"
            key: codex_registry
        # Setup step A: registries + facet flags + script lists (no cross-dependencies)
        - variables:
            _hr_lens_registry: >-
              {%- set raw = _hr_lr_raw if _hr_lr_raw is mapping else {} -%}
              {%- set val = raw.get('value', {}) -%}
              {%- set parsed = val | from_json if val is string else val -%}
              {%- set reg = parsed if parsed is mapping else {} -%}
              {%- set nested = reg.get('providers', {}) -%}
              {{ (reg | combine(nested if nested is mapping else {})) if reg is mapping else {} }}
            _hr_codex_registry: >-
              {%- set raw = _hr_cr_raw if _hr_cr_raw is mapping else {} -%}
              {%- set val = raw.get('value', {}) -%}
              {%- set parsed = val | from_json if val is string else val -%}
              {{ parsed if parsed is mapping else {} }}
            _hr_cab_sensor: "{{ states('sensor.zen_cabinet_health') | default('unknown') }}"
            _hr_id_ok: "{{ _hr_identity is mapping and (_hr_identity.get('status') in ['ok', 'success']) }}"
            _hr_lbl_ok: "{{ _hr_labels is mapping and _hr_labels.get('status') == 'ok' }}"
            _hr_callable: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for e in states.script -%}
                {%- set eid = e.entity_id -%}
                {%- if (eid.startswith('script.zen_dojotools_') or eid.startswith('script.zen_admintools_')
                    or eid.startswith('script.zen_stack_') or eid.startswith('script.zen_sutra_'))
                    and e.state in ('off', 'on') -%}
                  {%- set ns.out = ns.out + [eid] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out | list }}
            _hr_unavailable: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for e in states.script -%}
                {%- set eid = e.entity_id -%}
                {%- if (eid.startswith('script.zen_dojotools_') or eid.startswith('script.zen_admintools_')
                    or eid.startswith('script.zen_stack_') or eid.startswith('script.zen_sutra_'))
                    and e.state not in ('off', 'on') -%}
                  {%- set ns.out = ns.out + [eid] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out | list }}
        # Setup step B: scan_targets filters _hr_callable (now available from step A)
        - variables:
            # Exclude: admintools (security perimeter), self (queued deadlock),
            # announce (no mode dispatch — runs TTS immediately on call)
            _hr_scan_targets: >-
              {%- set _self = this.entity_id -%}
              {%- set _no_mode = label_entities('zen_no_mode') | list -%}
              {%- set ns = namespace(out=[]) -%}
              {%- for eid in _hr_callable -%}
                {%- if not eid.startswith('script.zen_admintools_') and eid != _self and eid not in _no_mode -%}
                  {%- set ns.out = ns.out + [eid] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out | list }}
            _hr_tool_results: []
            _hr_sweep_delay_s: 3

        # Stripe split: partition scan_targets by naming convention approximation.
        # stripe=0: zen_sutra_filecabinet (core infra primitive)
        # stripe=1: systemtools, kata_gc (system services)
        # stripe=2: zen_sutra_*/zen_stack_* minus filecabinet (plugin/adapter layer)
        # stripe=3: zen_dojotools_* minus stripe=1 (user-facing, default)
        - variables:
            _hr_fc_kernel: "{{ label_entities('zen_fc_kernel') | select('match', 'script\\.') | list }}"
            _hr_kernel: "{{ label_entities('zen_kernel') | select('match', 'script\\.') | list }}"
            _hr_sweep0: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for eid in _hr_scan_targets -%}
                {%- if eid in _hr_fc_kernel -%}
                  {%- set ns.out = ns.out + [eid] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out }}
            _hr_sweep1: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for eid in _hr_scan_targets -%}
                {%- if eid in _hr_kernel -%}{%- set ns.out = ns.out + [eid] -%}{%- endif -%}
              {%- endfor -%}
              {{ ns.out }}
            _hr_sweep2: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for eid in _hr_scan_targets -%}
                {%- if (eid.startswith('script.zen_sutra_') or eid.startswith('script.zen_stack_'))
                    and eid not in _hr_fc_kernel -%}
                  {%- set ns.out = ns.out + [eid] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out }}
            _hr_sweep3: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for eid in _hr_scan_targets -%}
                {%- if eid.startswith('script.zen_dojotools_') and eid not in _hr_kernel -%}
                  {%- set ns.out = ns.out + [eid] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out }}

        # ── Sweep 0: core infra ──────────────────────────────────────────────────
        - repeat:
            for_each: "{{ _hr_sweep0 }}"
            sequence:
            - action: "{{ repeat.item }}"
              continue_on_error: true
              response_variable: _hr_tm_raw
              data:
                mode: tool_manifest
            - variables:
                _hr_tm: >-
                  {{ _hr_tm_raw if _hr_tm_raw is mapping else {} }}
            - variables:
                _hr_tm_ok: >-
                  {%- set _tm = _hr_tm if _hr_tm is mapping else {} -%}
                  {{ _tm.get('status', '') in ['ok', 'success'] }}
                _hr_ps: >-
                  {%- set _tm = _hr_tm if _hr_tm is mapping else {} -%}
                  {%- set _ps = _tm.get('preferred_state', none) -%}
                  {{ _ps if _ps is mapping else none }}
            - variables:
                _hr_devs: >-
                  {%- set ns = namespace(devs=[]) -%}
                  {%- if not _hr_tm_ok -%}
                    {%- set ns.devs = ns.devs + ['manifest_unavailable'] -%}
                  {%- elif not (_hr_ps is mapping) -%}
                    {%- set ns.devs = ns.devs + ['no_preferred_state'] -%}
                  {%- else -%}
                    {%- for lbl in (_hr_ps.get('required_labels') or []) -%}
                      {%- if label_entities(lbl) | list | length == 0 -%}
                        {%- set ns.devs = ns.devs + ['label_missing:' ~ lbl] -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {%- for lkey in (_hr_ps.get('lens_registry_keys') or []) -%}
                      {%- if lkey not in _hr_lens_registry -%}
                        {%- set ns.devs = ns.devs + ['lens_not_registered:' ~ lkey] -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {%- for cmod in (_hr_ps.get('codex_modules') or []) -%}
                      {%- set _ckey = cmod | replace('zen_codex_finance_', '') | replace('zen_codex_', '') -%}
                      {%- if _ckey not in _hr_codex_registry -%}
                        {%- set ns.devs = ns.devs + ['codex_not_registered:' ~ cmod] -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {%- set _prereqs = _hr_ps.get('prerequisites') -%}
                    {%- if _prereqs is mapping -%}
                      {%- for eid in (_prereqs.get('tools') or []) -%}
                        {%- if states(eid) not in ('off', 'on') -%}
                          {%- set ns.devs = ns.devs + ['prereq_tool_down:' ~ eid] -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {%- for sig in (_prereqs.get('health_signals') or []) -%}
                        {%- set _sig_ent = sig.get('entity', '') if sig is mapping else '' -%}
                        {%- set _sig_eq  = sig.get('eq', 'ok') if sig is mapping else 'ok' -%}
                        {%- if _sig_ent != '' and states(_sig_ent) != _sig_eq -%}
                          {%- set ns.devs = ns.devs + ['prereq_signal_fail:' ~ _sig_ent] -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {%- for ckey in (_prereqs.get('config_keys') or []) -%}
                        {%- if states(ckey) | trim == '' -%}
                          {%- set ns.devs = ns.devs + ['prereq_config_missing:' ~ ckey] -%}
                        {%- endif -%}
                      {%- endfor -%}
                    {%- endif -%}
                  {%- endif -%}
                  {{ ns.devs }}
            - variables:
                _hr_status: >-
                  {%- set _warn_codes = ['label_missing', 'lens_not_registered', 'codex_not_registered', 'prereq_config_missing', 'no_preferred_state'] -%}
                  {%- set _err_codes = ['manifest_unavailable', 'prereq_tool_down', 'prereq_signal_fail'] -%}
                  {%- set ns = namespace(s='ok') -%}
                  {%- for d in _hr_devs -%}
                    {%- set _pfx = d | regex_findall('[^:]+') | first | default('') -%}
                    {%- if _pfx in _err_codes -%}{%- set ns.s = 'error' -%}
                    {%- elif _pfx in _warn_codes and ns.s != 'error' -%}{%- set ns.s = 'warn' -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {%- set _impact = (_hr_ps.get('impact', '') if _hr_ps is mapping else '') -%}
                  {%- if _impact == 'hard' and _hr_devs | length > 0 -%}{%- set ns.s = 'error' -%}{%- endif -%}
                  {{ ns.s }}
            - variables:
                _hr_tool_results: >-
                  {{ _hr_tool_results + [{
                    'tool': repeat.item | replace('script.', ''),
                    'status': _hr_status,
                    'deviations': _hr_devs
                  }] }}

        - action: script.zen_dojotools_filecabinet
          continue_on_error: true
          data:
            action_type: upsert
            force_action: true
            volume_entity_id:
              - "{{ _hh_cab }}"
            key: _health_report
            value: >-
              {{ {'status': 'scanning', 'sweep_complete': 0, 'sweep_total': 4,
                  'generated_at': now().isoformat(),
                  'facets': {'tools': {
                    'total_scanned': _hr_tool_results | length,
                    'deviating': _hr_tool_results | rejectattr('status', 'equalto', 'ok') | list
                  }}} | tojson }}
        - delay:
            seconds: "{{ _hr_sweep_delay_s }}"

        # ── Sweep 1: system services ─────────────────────────────────────────────
        - repeat:
            for_each: "{{ _hr_sweep1 }}"
            sequence:
            - action: "{{ repeat.item }}"
              continue_on_error: true
              response_variable: _hr_tm_raw
              data:
                mode: tool_manifest
            - variables:
                _hr_tm: >-
                  {{ _hr_tm_raw if _hr_tm_raw is mapping else {} }}
            - variables:
                _hr_tm_ok: >-
                  {%- set _tm = _hr_tm if _hr_tm is mapping else {} -%}
                  {{ _tm.get('status', '') in ['ok', 'success'] }}
                _hr_ps: >-
                  {%- set _tm = _hr_tm if _hr_tm is mapping else {} -%}
                  {%- set _ps = _tm.get('preferred_state', none) -%}
                  {{ _ps if _ps is mapping else none }}
            - variables:
                _hr_devs: >-
                  {%- set ns = namespace(devs=[]) -%}
                  {%- if not _hr_tm_ok -%}
                    {%- set ns.devs = ns.devs + ['manifest_unavailable'] -%}
                  {%- elif not (_hr_ps is mapping) -%}
                    {%- set ns.devs = ns.devs + ['no_preferred_state'] -%}
                  {%- else -%}
                    {%- for lbl in (_hr_ps.get('required_labels') or []) -%}
                      {%- if label_entities(lbl) | list | length == 0 -%}
                        {%- set ns.devs = ns.devs + ['label_missing:' ~ lbl] -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {%- for lkey in (_hr_ps.get('lens_registry_keys') or []) -%}
                      {%- if lkey not in _hr_lens_registry -%}
                        {%- set ns.devs = ns.devs + ['lens_not_registered:' ~ lkey] -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {%- for cmod in (_hr_ps.get('codex_modules') or []) -%}
                      {%- set _ckey = cmod | replace('zen_codex_finance_', '') | replace('zen_codex_', '') -%}
                      {%- if _ckey not in _hr_codex_registry -%}
                        {%- set ns.devs = ns.devs + ['codex_not_registered:' ~ cmod] -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {%- set _prereqs = _hr_ps.get('prerequisites') -%}
                    {%- if _prereqs is mapping -%}
                      {%- for eid in (_prereqs.get('tools') or []) -%}
                        {%- if states(eid) not in ('off', 'on') -%}
                          {%- set ns.devs = ns.devs + ['prereq_tool_down:' ~ eid] -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {%- for sig in (_prereqs.get('health_signals') or []) -%}
                        {%- set _sig_ent = sig.get('entity', '') if sig is mapping else '' -%}
                        {%- set _sig_eq  = sig.get('eq', 'ok') if sig is mapping else 'ok' -%}
                        {%- if _sig_ent != '' and states(_sig_ent) != _sig_eq -%}
                          {%- set ns.devs = ns.devs + ['prereq_signal_fail:' ~ _sig_ent] -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {%- for ckey in (_prereqs.get('config_keys') or []) -%}
                        {%- if states(ckey) | trim == '' -%}
                          {%- set ns.devs = ns.devs + ['prereq_config_missing:' ~ ckey] -%}
                        {%- endif -%}
                      {%- endfor -%}
                    {%- endif -%}
                  {%- endif -%}
                  {{ ns.devs }}
            - variables:
                _hr_status: >-
                  {%- set _warn_codes = ['label_missing', 'lens_not_registered', 'codex_not_registered', 'prereq_config_missing', 'no_preferred_state'] -%}
                  {%- set _err_codes = ['manifest_unavailable', 'prereq_tool_down', 'prereq_signal_fail'] -%}
                  {%- set ns = namespace(s='ok') -%}
                  {%- for d in _hr_devs -%}
                    {%- set _pfx = d | regex_findall('[^:]+') | first | default('') -%}
                    {%- if _pfx in _err_codes -%}{%- set ns.s = 'error' -%}
                    {%- elif _pfx in _warn_codes and ns.s != 'error' -%}{%- set ns.s = 'warn' -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {%- set _impact = (_hr_ps.get('impact', '') if _hr_ps is mapping else '') -%}
                  {%- if _impact == 'hard' and _hr_devs | length > 0 -%}{%- set ns.s = 'error' -%}{%- endif -%}
                  {{ ns.s }}
            - variables:
                _hr_tool_results: >-
                  {{ _hr_tool_results + [{
                    'tool': repeat.item | replace('script.', ''),
                    'status': _hr_status,
                    'deviations': _hr_devs
                  }] }}

        - action: script.zen_dojotools_filecabinet
          continue_on_error: true
          data:
            action_type: upsert
            force_action: true
            volume_entity_id:
              - "{{ _hh_cab }}"
            key: _health_report
            value: >-
              {{ {'status': 'scanning', 'sweep_complete': 1, 'sweep_total': 4,
                  'generated_at': now().isoformat(),
                  'facets': {'tools': {
                    'total_scanned': _hr_tool_results | length,
                    'deviating': _hr_tool_results | rejectattr('status', 'equalto', 'ok') | list
                  }}} | tojson }}
        - delay:
            seconds: "{{ _hr_sweep_delay_s }}"

        # ── Sweep 2: plugin sutras + stacks ──────────────────────────────────────
        - repeat:
            for_each: "{{ _hr_sweep2 }}"
            sequence:
            - action: "{{ repeat.item }}"
              continue_on_error: true
              response_variable: _hr_tm_raw
              data:
                mode: tool_manifest
            - variables:
                _hr_tm: >-
                  {{ _hr_tm_raw if _hr_tm_raw is mapping else {} }}
            - variables:
                _hr_tm_ok: >-
                  {%- set _tm = _hr_tm if _hr_tm is mapping else {} -%}
                  {{ _tm.get('status', '') in ['ok', 'success'] }}
                _hr_ps: >-
                  {%- set _tm = _hr_tm if _hr_tm is mapping else {} -%}
                  {%- set _ps = _tm.get('preferred_state', none) -%}
                  {{ _ps if _ps is mapping else none }}
            - variables:
                _hr_devs: >-
                  {%- set ns = namespace(devs=[]) -%}
                  {%- if not _hr_tm_ok -%}
                    {%- set ns.devs = ns.devs + ['manifest_unavailable'] -%}
                  {%- elif not (_hr_ps is mapping) -%}
                    {%- set ns.devs = ns.devs + ['no_preferred_state'] -%}
                  {%- else -%}
                    {%- for lbl in (_hr_ps.get('required_labels') or []) -%}
                      {%- if label_entities(lbl) | list | length == 0 -%}
                        {%- set ns.devs = ns.devs + ['label_missing:' ~ lbl] -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {%- for lkey in (_hr_ps.get('lens_registry_keys') or []) -%}
                      {%- if lkey not in _hr_lens_registry -%}
                        {%- set ns.devs = ns.devs + ['lens_not_registered:' ~ lkey] -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {%- for cmod in (_hr_ps.get('codex_modules') or []) -%}
                      {%- set _ckey = cmod | replace('zen_codex_finance_', '') | replace('zen_codex_', '') -%}
                      {%- if _ckey not in _hr_codex_registry -%}
                        {%- set ns.devs = ns.devs + ['codex_not_registered:' ~ cmod] -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {%- set _prereqs = _hr_ps.get('prerequisites') -%}
                    {%- if _prereqs is mapping -%}
                      {%- for eid in (_prereqs.get('tools') or []) -%}
                        {%- if states(eid) not in ('off', 'on') -%}
                          {%- set ns.devs = ns.devs + ['prereq_tool_down:' ~ eid] -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {%- for sig in (_prereqs.get('health_signals') or []) -%}
                        {%- set _sig_ent = sig.get('entity', '') if sig is mapping else '' -%}
                        {%- set _sig_eq  = sig.get('eq', 'ok') if sig is mapping else 'ok' -%}
                        {%- if _sig_ent != '' and states(_sig_ent) != _sig_eq -%}
                          {%- set ns.devs = ns.devs + ['prereq_signal_fail:' ~ _sig_ent] -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {%- for ckey in (_prereqs.get('config_keys') or []) -%}
                        {%- if states(ckey) | trim == '' -%}
                          {%- set ns.devs = ns.devs + ['prereq_config_missing:' ~ ckey] -%}
                        {%- endif -%}
                      {%- endfor -%}
                    {%- endif -%}
                  {%- endif -%}
                  {{ ns.devs }}
            - variables:
                _hr_status: >-
                  {%- set _warn_codes = ['label_missing', 'lens_not_registered', 'codex_not_registered', 'prereq_config_missing', 'no_preferred_state'] -%}
                  {%- set _err_codes = ['manifest_unavailable', 'prereq_tool_down', 'prereq_signal_fail'] -%}
                  {%- set ns = namespace(s='ok') -%}
                  {%- for d in _hr_devs -%}
                    {%- set _pfx = d | regex_findall('[^:]+') | first | default('') -%}
                    {%- if _pfx in _err_codes -%}{%- set ns.s = 'error' -%}
                    {%- elif _pfx in _warn_codes and ns.s != 'error' -%}{%- set ns.s = 'warn' -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {%- set _impact = (_hr_ps.get('impact', '') if _hr_ps is mapping else '') -%}
                  {%- if _impact == 'hard' and _hr_devs | length > 0 -%}{%- set ns.s = 'error' -%}{%- endif -%}
                  {{ ns.s }}
            - variables:
                _hr_tool_results: >-
                  {{ _hr_tool_results + [{
                    'tool': repeat.item | replace('script.', ''),
                    'status': _hr_status,
                    'deviations': _hr_devs
                  }] }}

        - action: script.zen_dojotools_filecabinet
          continue_on_error: true
          data:
            action_type: upsert
            force_action: true
            volume_entity_id:
              - "{{ _hh_cab }}"
            key: _health_report
            value: >-
              {{ {'status': 'scanning', 'sweep_complete': 2, 'sweep_total': 4,
                  'generated_at': now().isoformat(),
                  'facets': {'tools': {
                    'total_scanned': _hr_tool_results | length,
                    'deviating': _hr_tool_results | rejectattr('status', 'equalto', 'ok') | list
                  }}} | tojson }}
        - delay:
            seconds: "{{ _hr_sweep_delay_s }}"

        # ── Sweep 3: user-facing dojotools ───────────────────────────────────────
        - repeat:
            for_each: "{{ _hr_sweep3 }}"
            sequence:
            - action: "{{ repeat.item }}"
              continue_on_error: true
              response_variable: _hr_tm_raw
              data:
                mode: tool_manifest
            - variables:
                _hr_tm: >-
                  {{ _hr_tm_raw if _hr_tm_raw is mapping else {} }}
            - variables:
                _hr_tm_ok: >-
                  {%- set _tm = _hr_tm if _hr_tm is mapping else {} -%}
                  {{ _tm.get('status', '') in ['ok', 'success'] }}
                _hr_ps: >-
                  {%- set _tm = _hr_tm if _hr_tm is mapping else {} -%}
                  {%- set _ps = _tm.get('preferred_state', none) -%}
                  {{ _ps if _ps is mapping else none }}
            - variables:
                _hr_devs: >-
                  {%- set ns = namespace(devs=[]) -%}
                  {%- if not _hr_tm_ok -%}
                    {%- set ns.devs = ns.devs + ['manifest_unavailable'] -%}
                  {%- elif not (_hr_ps is mapping) -%}
                    {%- set ns.devs = ns.devs + ['no_preferred_state'] -%}
                  {%- else -%}
                    {%- for lbl in (_hr_ps.get('required_labels') or []) -%}
                      {%- if label_entities(lbl) | list | length == 0 -%}
                        {%- set ns.devs = ns.devs + ['label_missing:' ~ lbl] -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {%- for lkey in (_hr_ps.get('lens_registry_keys') or []) -%}
                      {%- if lkey not in _hr_lens_registry -%}
                        {%- set ns.devs = ns.devs + ['lens_not_registered:' ~ lkey] -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {%- for cmod in (_hr_ps.get('codex_modules') or []) -%}
                      {%- set _ckey = cmod | replace('zen_codex_finance_', '') | replace('zen_codex_', '') -%}
                      {%- if _ckey not in _hr_codex_registry -%}
                        {%- set ns.devs = ns.devs + ['codex_not_registered:' ~ cmod] -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {%- set _prereqs = _hr_ps.get('prerequisites') -%}
                    {%- if _prereqs is mapping -%}
                      {%- for eid in (_prereqs.get('tools') or []) -%}
                        {%- if states(eid) not in ('off', 'on') -%}
                          {%- set ns.devs = ns.devs + ['prereq_tool_down:' ~ eid] -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {%- for sig in (_prereqs.get('health_signals') or []) -%}
                        {%- set _sig_ent = sig.get('entity', '') if sig is mapping else '' -%}
                        {%- set _sig_eq  = sig.get('eq', 'ok') if sig is mapping else 'ok' -%}
                        {%- if _sig_ent != '' and states(_sig_ent) != _sig_eq -%}
                          {%- set ns.devs = ns.devs + ['prereq_signal_fail:' ~ _sig_ent] -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {%- for ckey in (_prereqs.get('config_keys') or []) -%}
                        {%- if states(ckey) | trim == '' -%}
                          {%- set ns.devs = ns.devs + ['prereq_config_missing:' ~ ckey] -%}
                        {%- endif -%}
                      {%- endfor -%}
                    {%- endif -%}
                  {%- endif -%}
                  {{ ns.devs }}
            - variables:
                _hr_status: >-
                  {%- set _warn_codes = ['label_missing', 'lens_not_registered', 'codex_not_registered', 'prereq_config_missing', 'no_preferred_state'] -%}
                  {%- set _err_codes = ['manifest_unavailable', 'prereq_tool_down', 'prereq_signal_fail'] -%}
                  {%- set ns = namespace(s='ok') -%}
                  {%- for d in _hr_devs -%}
                    {%- set _pfx = d | regex_findall('[^:]+') | first | default('') -%}
                    {%- if _pfx in _err_codes -%}{%- set ns.s = 'error' -%}
                    {%- elif _pfx in _warn_codes and ns.s != 'error' -%}{%- set ns.s = 'warn' -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {%- set _impact = (_hr_ps.get('impact', '') if _hr_ps is mapping else '') -%}
                  {%- if _impact == 'hard' and _hr_devs | length > 0 -%}{%- set ns.s = 'error' -%}{%- endif -%}
                  {{ ns.s }}
            - variables:
                _hr_tool_results: >-
                  {{ _hr_tool_results + [{
                    'tool': repeat.item | replace('script.', ''),
                    'status': _hr_status,
                    'deviations': _hr_devs
                  }] }}

        # ── Unavailable tools (no stripe — always append last) ───────────────────
        - repeat:
            for_each: "{{ _hr_unavailable }}"
            sequence:
            - variables:
                _hr_tool_results: >-
                  {{ _hr_tool_results + [{
                    'tool': repeat.item | replace('script.', ''),
                    'status': 'error',
                    'deviations': ['tool_unavailable']
                  }] }}

        - variables:
            _hr_warn_count: "{{ _hr_tool_results | selectattr('status', 'equalto', 'warn') | list | length }}"
            _hr_err_count:  "{{ _hr_tool_results | selectattr('status', 'equalto', 'error') | list | length }}"
            # Lean cache: store only deviating tools (status != ok)
            _hr_deviating: >-
              {{ _hr_tool_results | rejectattr('status', 'equalto', 'ok') | list }}
        # _hr_report must be in a separate step — sibling keys can't reference each other
        - variables:
            _hr_report: >-
              {{ {
                'status': 'issues_found' if (_hr_err_count > 0 or not _hr_id_ok or not _hr_lbl_ok
                           or _hr_cab_sensor not in ('ok', 'warn'))
                           else 'warn' if _hr_warn_count > 0
                           else 'ok',
                'generated_at': now().isoformat(),
                'sweep_complete': 4,
                'sweep_total': 4,
                'facets': {
                  'identity': 'ok' if _hr_id_ok else 'error',
                  'labels': 'ok' if _hr_lbl_ok else 'error',
                  'cabinets': _hr_cab_sensor,
                  'tools': {
                    'total_scanned': _hr_tool_results | length,
                    'compliant': _hr_tool_results | selectattr('status','equalto','ok') | list | length,
                    'warnings': _hr_warn_count,
                    'errors': _hr_err_count,
                    'deviating': _hr_deviating
                  }
                }
              } }}

        - action: script.zen_dojotools_filecabinet
          continue_on_error: true
          response_variable: _hr_write_raw
          data:
            action_type: upsert
            force_action: true
            volume_entity_id:
              - "{{ _hh_cab }}"
            key: _health_report
            value: "{{ _hr_report | tojson }}"

        - variables:
            result: >-
              {{ _hr_report | combine({
                'mode': 'health_refresh',
                'cache_written': (_hr_write_raw is mapping and _hr_write_raw.get('status') == 'success'),
                'caller_token': caller_token
              }) }}
        - stop: health_refresh complete
          response_variable: result

      # ── mode: autotag ────────────────────────────────────────────────────────
      # Tags tier label (dojotools/admintools/stacks/sutras).
      # Idempotent: reads current labels per entity, applies only the delta.
      - conditions: "{{ mode_norm == 'autotag' }}"
        sequence:
        - variables:
            _at_callable: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for e in states.script -%}
                {%- set eid = e.entity_id -%}
                {%- if (eid.startswith('script.zen_dojotools_') or eid.startswith('script.zen_admintools_')
                    or eid.startswith('script.zen_stack_') or eid.startswith('script.zen_sutra_'))
                    and e.state in ('off', 'on') -%}
                  {%- set ns.out = ns.out + [eid] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out | list }}
            _at_unavailable: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for e in states.script -%}
                {%- set eid = e.entity_id -%}
                {%- if (eid.startswith('script.zen_dojotools_') or eid.startswith('script.zen_admintools_')
                    or eid.startswith('script.zen_stack_') or eid.startswith('script.zen_sutra_'))
                    and e.state not in ('off', 'on') -%}
                  {%- set ns.out = ns.out + [eid] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out | list }}
        - variables:
            _at_tagged: []
            _at_correct: []
        - repeat:
            for_each: "{{ _at_callable }}"
            sequence:
            - variables:
                _at_eid: "{{ repeat.item }}"
                _at_tier: >-
                  {%- set eid = repeat.item -%}
                  {%- if eid.startswith('script.zen_dojotools_') -%}dojotools
                  {%- elif eid.startswith('script.zen_admintools_') -%}admintools
                  {%- elif eid.startswith('script.zen_stack_') -%}stacks
                  {%- else -%}sutras{%- endif -%}
            - variables:
                _at_current: "{{ labels(repeat.item) | list }}"
            - variables:
                _at_delta: "{{ [_at_tier] | reject('in', _at_current) | list }}"
            - if: "{{ _at_delta | length > 0 }}"
              then:
              - action: script.zen_dojotools_labels
                data:
                  action_type: tag
                  label_list: "{{ _at_delta }}"
                  target_entities:
                    - "{{ _at_eid }}"
                  confirm: true
                  caller_token: "{{ caller_token }}"
              - variables:
                  _at_tagged: "{{ _at_tagged + [{'entity_id': _at_eid, 'labels_applied': _at_delta}] }}"
              else:
              - variables:
                  _at_correct: "{{ _at_correct + [_at_eid] }}"
        - variables:
            result:
              status: ok
              mode: autotag
              tagged: "{{ _at_tagged }}"
              already_correct: "{{ _at_correct }}"
              skipped: "{{ _at_unavailable }}"
              caller_token: "{{ caller_token }}"
        - stop: autotag complete
          response_variable: result

      # ── mode: publish ─────────────────────────────────────────────────────────
      # Inlines tools + automations scans to avoid self-call variable scoping.
      # Labels and identity delegate to their authoritative scripts.
      - conditions: "{{ mode_norm == 'publish' }}"
        sequence:
        # ── inline tools scan — MCP-facing dojotools only (sutra label is the gate) ──
        - variables:
            _pub_sutra_set: "{{ label_entities('sutra') | list }}"
        - variables:
            _pub_callable: >-
              {%- set _sutra = _pub_sutra_set -%}
              {%- set ns = namespace(out=[]) -%}
              {%- for e in states.script -%}
                {%- set eid = e.entity_id -%}
                {%- if eid.startswith('script.zen_dojotools_')
                    and e.state in ('off', 'on')
                    and eid not in _sutra -%}
                  {%- set ns.out = ns.out + [eid] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out | list }}
            _pub_unavailable: >-
              {%- set _sutra = _pub_sutra_set -%}
              {%- set ns = namespace(out=[]) -%}
              {%- for e in states.script -%}
                {%- set eid = e.entity_id -%}
                {%- if eid.startswith('script.zen_dojotools_')
                    and e.state not in ('off', 'on')
                    and eid not in _sutra -%}
                  {%- set ns.out = ns.out + [eid] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out | list }}
        # ── label-driven domain routing map — GO HERE FIRST ──
        # What the MCP manifest can't tell Friday: which tool owns which domain.
        # Assign label zen_domain_<name> to a script to register it for that domain.
        # Room-oriented: prefer room_manager over raw entity state queries.
        - variables:
            _pub_domain_map: >-
              {%- set _domains = ['rooms','food','knowledge','calendar','identity','lights',
                  'climate','covers','todos','announce','security','media','contacts',
                  'tickets','inventory','wiki','finance','system','maintenance','logistics'] -%}
              {%- set ns = namespace(dm={}) -%}
              {%- for d in _domains -%}
                {%- set _ents = label_entities('zen_domain_' ~ d) | select('match', 'script\\.') | list -%}
                {%- if _ents | length > 0 -%}
                  {%- set ns.dm = ns.dm | combine({d: _ents | first}) -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.dm }}
        # ── inline automations scan ──
        - variables:
            _pub_autos: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for a in states.automation -%}
                {%- if a.entity_id.startswith('automation.zen_') -%}
                  {%- set lt = state_attr(a.entity_id, 'last_triggered') -%}
                  {%- set ns.out = ns.out + [{'entity_id': a.entity_id,
                    'alias': state_attr(a.entity_id, 'friendly_name') | default(a.entity_id),
                    'state': a.state,
                    'last_triggered': lt.isoformat() if lt is not none else none}] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out | list }}
        # ── labels + identity via authoritative scripts ──
        - action: script.zen_dojotools_labels
          response_variable: _pub_labels_raw
          data:
            action_type: read
            caller_token: "{{ caller_token }}"
        - action: script.zen_dojotools_identity
          response_variable: _pub_identity
          continue_on_error: true
          data:
            mode: build_identity_manifest
            caller_token: "{{ caller_token }}"
        # ── write drawers ──
        - action: script.zen_dojotools_filecabinet
          data:
            action_type: upsert
            stack: cabinet
            volume_entity_id: "{{ _hh_cab }}"
            path: zen_tool_manifest
            title: zen_tool_manifest
            value: >-
              {{
                {
                  'status': 'ok',
                  'generated': now().isoformat(),
                  'domain_map': _pub_domain_map,
                  'callable_count': _pub_callable | length,
                  'unavailable_count': _pub_unavailable | length
                } | tojson
              }}
            mode: replace
            caller_token: "{{ caller_token }}"
        - action: script.zen_dojotools_filecabinet
          data:
            action_type: upsert
            stack: cabinet
            volume_entity_id: "{{ _hh_cab }}"
            path: zen_label_manifest
            title: zen_label_manifest
            value: >-
              {%- set _all = (_pub_labels_raw.get('index', []) if _pub_labels_raw is mapping else []) -%}
              {%- set ns = namespace(mini=[]) -%}
              {%- for lbl in _all -%}
                {%- set _desc = label_description(lbl) | default('', true) | string | trim -%}
                {%- set _name_equiv = lbl | replace('_', ' ') | lower -%}
                {%- set _is_noise = _desc | lower in ['none', 'tbd', '']
                    or _desc | lower == _name_equiv
                    or _desc | length < 20 -%}
                {%- if not _is_noise -%}
                  {%- set ns.mini = ns.mini + [lbl] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ {
                'status': (_pub_labels_raw.get('status') if _pub_labels_raw is mapping else 'error'),
                'index': ns.mini,
                'count': ns.mini | length,
                'full_count': _all | length
              } | tojson }}
            mode: replace
            caller_token: "{{ caller_token }}"
        - action: script.zen_dojotools_filecabinet
          data:
            action_type: upsert
            stack: cabinet
            volume_entity_id: "{{ _hh_cab }}"
            path: zen_automation_manifest
            title: zen_automation_manifest
            value: >-
              {{
                {
                  'status': 'ok',
                  'automations': _pub_autos,
                  'count': _pub_autos | length
                } | tojson
              }}
            mode: replace
            caller_token: "{{ caller_token }}"
        - variables:
            result:
              status: ok
              mode: publish
              published:
                - zen_tool_manifest
                - zen_label_manifest
                - zen_automation_manifest
              callable_count: "{{ _pub_callable | length }}"
              unavailable_count: "{{ _pub_unavailable | length }}"
              domain_map_count: "{{ _pub_domain_map | length }}"
              caller_token: "{{ caller_token }}"
        - stop: publish complete
          response_variable: result

      # ── mode: all ─────────────────────────────────────────────────────────────
      # Calls subsystems directly — no self-calls (see HA queued script reentrancy
      # limitation). Cabinets reads published zen_library_manifest drawer.
      - conditions: "{{ mode_norm == 'all' }}"
        sequence:
        - choose:
          - conditions: "{{ force_refresh | default(false) }}"
            sequence:
            - action: "{{ this.entity_id }}"
              continue_on_error: true
              data:
                mode: publish
                caller_token: "{{ caller_token }}"
        - action: script.zen_dojotools_identity
          response_variable: _all_identity_raw
          continue_on_error: true
          data:
            mode: build_identity_manifest
            caller_token: "{{ caller_token }}"
        - action: script.zen_dojotools_labels
          response_variable: _all_labels_raw
          continue_on_error: true
          data:
            action_type: read
            caller_token: "{{ caller_token }}"
        - action: script.zen_dojotools_filecabinet
          response_variable: _all_cabs_raw
          continue_on_error: true
          data:
            action_type: read
            stack: cabinet
            volume_entity_id: "{{ _hh_cab }}"
            path: zen_library_manifest
            caller_token: "{{ caller_token }}"
        - action: script.zen_dojotools_filecabinet
          response_variable: _all_struct_raw
          continue_on_error: true
          data:
            action_type: read
            stack: cabinet
            volume_entity_id: "{{ _hh_cab }}"
            path: lens_registry
            caller_token: "{{ caller_token }}"
        - variables:
            _all_callable: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for e in states.script -%}
                {%- set eid = e.entity_id -%}
                {%- if (eid.startswith('script.zen_dojotools_') or eid.startswith('script.zen_admintools_')
                    or eid.startswith('script.zen_stack_') or eid.startswith('script.zen_sutra_'))
                    and e.state in ('off', 'on') -%}
                  {%- set ns.out = ns.out + [eid] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out | list }}
            _all_autos: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for a in states.automation -%}
                {%- if a.entity_id.startswith('automation.zen_') -%}
                  {%- set lt = state_attr(a.entity_id, 'last_triggered') -%}
                  {%- set ns.out = ns.out + [{'entity_id': a.entity_id,
                    'alias': state_attr(a.entity_id, 'friendly_name') | default(a.entity_id),
                    'state': a.state,
                    'last_triggered': lt.isoformat() if lt is not none else none}] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out | list }}
        - variables:
            result:
              status: ok
              mode: all
              identity: "{{ _all_identity_raw if _all_identity_raw is mapping else {} }}"
              labels:
                index: "{{ (_all_labels_raw.get('index', []) if _all_labels_raw is mapping else []) }}"
                count: "{{ (_all_labels_raw.get('index', []) if _all_labels_raw is mapping else []) | length }}"
              tools:
                callable: "{{ _all_callable }}"
                count: "{{ _all_callable | length }}"
              automations:
                automations: "{{ _all_autos }}"
                count: "{{ _all_autos | length }}"
              cabinets: "{{ _all_cabs_raw if _all_cabs_raw is mapping else {} }}"
              structure: "{{ _all_struct_raw if _all_struct_raw is mapping else {} }}"
              caller_token: "{{ caller_token }}"
        - stop: full system manifest complete
          response_variable: result

      # ── mode: mcp_sync ───────────────────────────────────────────────────────
      # Agent-driven MCP surface check. The agent passes its known MCP tool list
      # (entity_ids it can see); manifest diffs against namespace scan.
      # HA entity registry REST API is WebSocket-only — not queryable from here.
      # Reports:
      #   dojotools_not_in_list — zen_dojotools_* scripts callable in HA but absent
      #                           from the passed mcp_tool_list. Sutra-labeled tools
      #                           excluded (internal only). Whether absent tools are
      #                           unexposed or just missing from the input list is
      #                           indistinguishable without entity registry access.
      # NOTE: MCP exposure detection (admintools_exposed, true not_exposed) requires
      #   entity registry access (WebSocket-only in HA). Planned for future version.
      #   dojotools_misconfigured — tools in agent view missing their required_labels
      #                            (integration-gated tools not yet connected)
      - conditions: "{{ mode_norm == 'mcp_sync' }}"
        sequence:
        - variables:
            _ms_tool_list: >-
              {%- set raw = mcp_tool_list | default('') -%}
              {%- if raw is sequence and raw is not string -%}
                {{ raw | list }}
              {%- elif raw is string and raw | trim != '' -%}
                {{ raw | from_json(default=[]) }}
              {%- else -%}
                []
              {%- endif -%}
        - variables:
            _ms_callable_dt: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for e in states.script -%}
                {%- set eid = e.entity_id -%}
                {%- if eid.startswith('script.zen_dojotools_') and e.state in ('off', 'on') -%}
                  {%- set ns.out = ns.out + [eid] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out | list }}
        - variables:
            _ms_sutra_labeled: "{{ label_entities('sutra') | list }}"
        - variables:
            _ms_dt_not_in_list: "{{ _ms_callable_dt | reject('in', _ms_tool_list) | reject('in', _ms_sutra_labeled) | list }}"
        - variables:
            result:
              status: "{{ 'no_tool_list' if _ms_tool_list | length == 0 else ('issues_found' if _ms_dt_not_in_list | length > 0 else 'in_sync') }}"
              mode: mcp_sync
              note: "{{ 'Pass mcp_tool_list=[entity_ids] for delta analysis' if _ms_tool_list | length == 0 else 'MCP exposure detection planned — not yet available' }}"
              summary:
                dojotools_callable: "{{ _ms_callable_dt | length }}"
                dojotools_not_in_list: "{{ _ms_dt_not_in_list | length }}"
              detail:
                dojotools_not_in_list: "{{ _ms_dt_not_in_list }}"
              caller_token: "{{ caller_token }}"
        - stop: mcp_sync complete
          response_variable: result

    # ── mode: domains ────────────────────────────────────────────────────────
    # Scans all zen_ tool_manifests for domain + peers declarations.
    # Returns live graph — zero storage, zero hardcoding.
    # Filters: name=<domain> (single cluster), tool=<script> (all clusters for a tool).
    - choose:
      - conditions: "{{ mode_norm == 'domains' }}"
        sequence:
        - variables:
            _dom_scripts: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for e in states.script -%}
                {%- set eid = e.entity_id -%}
                {%- if (eid.startswith('script.zen_dojotools_') or eid.startswith('script.zen_stack_')
                       or eid.startswith('script.zen_sutra_') or eid.startswith('script.zen_codex_'))
                    and e.state in ('off', 'on') -%}
                  {%- set ns.out = ns.out + [eid] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out | list }}
            _dom_graph: []
            _dom_name_filter: "{{ name | default('') | string | trim | lower }}"
            _dom_tool_filter: "{{ tool | default('') | string | trim | lower }}"
        - repeat:
            for_each: "{{ _dom_scripts }}"
            sequence:
            - variables:
                _dom_script: "{{ repeat.item | string | trim }}"
            - action: "{{ _dom_script }}"
              continue_on_error: true
              response_variable: _dom_tm_raw
              data:
                mode: tool_manifest
            - variables:
                _dom_tm: "{{ _dom_tm_raw if _dom_tm_raw is mapping else {} }}"
            - variables:
                _dom_modes: "{{ _dom_tm.get('modes', {}) if _dom_tm is mapping else {} }}"
            - variables:
                _dom_has_help: "{{ 'help' in _dom_modes }}"
            - if: "{{ _dom_has_help }}"
              then:
              - action: "{{ _dom_script }}"
                continue_on_error: true
                response_variable: _dom_help_raw
                data:
                  mode: help
              - variables:
                  _dom_help: "{{ ((_dom_help_raw if _dom_help_raw is mapping else {}).get('help') or {}) }}"
              - variables:
                  _dom_domain: "{{ _dom_help.get('domain', '') | string | trim if _dom_help is mapping else '' }}"
                  _dom_peers: "{{ _dom_help.get('peers', {}) if _dom_help is mapping else {} }}"
              - if: "{{ _dom_domain != '' }}"
                then:
                - variables:
                    _dom_graph: "{{ _dom_graph + [{'tool': _dom_script | replace('script.', ''), 'display_name': _dom_tm.get('display_name', ''), 'domain': _dom_domain, 'peers': _dom_peers}] }}"
        - variables:
            _dom_tgt_bare: "{{ (_dom_tool_filter if _dom_tool_filter.startswith('script.') else 'script.' ~ _dom_tool_filter) | replace('script.', '') }}"
        - variables:
            _dom_filtered: "{{ _dom_graph | selectattr('tool', 'eq', _dom_tgt_bare) | list if _dom_tool_filter != '' else (_dom_graph | selectattr('domain', 'eq', _dom_name_filter) | list if _dom_name_filter != '' else _dom_graph) }}"
        - variables:
            result:
              status: ok
              mode: domains
              filter: "{{ 'tool=' ~ _dom_tool_filter if _dom_tool_filter != '' else ('name=' ~ _dom_name_filter if _dom_name_filter != '' else 'none') }}"
              count: "{{ (_dom_filtered | default([])) | length }}"
              graph: "{{ _dom_filtered | default([]) }}"
              caller_token: "{{ caller_token | default('') }}"
        - stop: domains complete
          response_variable: result

    # ── default: unknown mode ────────────────────────────────────────────────
    - variables:
        result:
          status: error
          mode: "{{ mode_norm }}"
          message: >-
            Unknown mode '{{ mode_norm }}'. Valid: cabinets, identity, labels,
            tools, bootstrap_stacks, bootstrap_kfc, automations, structure,
            audit, health, autotag, publish, all, tool_manifest, domains
          caller_token: "{{ caller_token }}"
    - stop: unknown mode
      response_variable: result
  system_tools_stamp_default_family_cabinet:
    sequence:
    - variables:
        new_guid: >
          {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
          {{- CABS.cabinet_guid_new() -}}
    - alias: Stamp AI_Cabinet_VolumeInfo
      event: set_variable_zenos_default_family_cabinet
      event_data:
        key: AI_Cabinet_VolumeInfo
        value:
          id: "{{- new_guid -}}"
          friendly_name: ZenOS Default Family Cabinet
          name: ZenOS Default Family Cabinet
          description: Primary storage for household family data, lore, and member
            links.
          validation: ALLYOURBASEAREBELONGTOUS
          flags:
            system: false
            hidden: false
            read_only: false
            dojo: false
            kata: false
            history: false
            user: false
            family: true
            secure_mode: false
          owner: {}
          acls:
            owner: []
            partner: []
            family: []
            public: []
          entity_labels:
          - ai
          - zen
          - cabinet
          - volumeinfo
          - family
        set_timestamp: true
    - alias: Stamp _context
      event: set_variable_zenos_default_family_cabinet
      event_data:
        key: _context
        value:
          what_is_this: The Family Cabinet — primary storage for household family
            data, lore, and links to family members.
          why_is_it_here: Root for family-scoped data. Owner is Head of Household.
          usage_policy:
          - Prefer modifying in place unless scale or security requires a new drawer
            or volume.
          - Cross-link by label and purpose. Leave breadcrumbs if data is authoritative
            elsewhere.
          - Store static data in deep nested JSON; store dynamic data in wide drawers
            for fast seeks and less risky writes.
          - Summarize or prune as needed.
          - Family members are linked from here — store member-specific data in their
            own cabinet if accessible.
          growth_logic:
            on_split: Request a new subcabinet only if a drawer outgrows space or
              requires special access.
            split_triggers:
            - Exceeds index or storage limits.
            - New security domain.
            - Needs its own schedule or routine.
        set_timestamp: true
    alias: 'System - Tools: Stamp Default Family Cabinet'
    description: Stamp AI_Cabinet_VolumeInfo for the default family cabinet with
      a fresh UUID. No PII — configure owner/ACLs after stamping.
    icon: mdi:dresser-outline
    fields: {}
  dojotools_zen_inspect:
    alias: Zen DojoTools Inspect
    mode: parallel
    description: Inspect (4.5.x). Deep dive on one or more entities. Attributes
      are key-scanned for safety. Cabinet sensors expose header metadata only; use cabinet
      tools for full volume access.
    fields:
      entity_id:
        required: true
        selector:
          entity:
            multiple: true
      extended:
        required: false
        default: false
        selector:
          boolean:
        description: Light device/integration forensics.
      infer:
        required: false
        selector:
          boolean:
        description: Reserved for future local inference.
      timeout:
        selector:
          number:
            min: 30
            max: 300
            step: 0.25
        name: Timeout
        default: 60
        required: false
    sequence:
    - variables:
        entity_list: >
          {%- if entity_id is iterable and (entity_id is not string) -%}
            {{- entity_id -}}
          {%- else -%}
            [{{- entity_id -}}]
          {%- endif -%}
        extended_mode: "{{- extended | default(false) -}}"
        infer_mode: "{{- infer | default(false) -}}"
        timeout_s: "{{- timeout | default(60) -}}"
        results: []
    - repeat:
        for_each: "{{- entity_list -}}"
        sequence:
        - variables:
            current_entity: "{{- repeat.item | string -}}"
            state_obj: >
              {%- set s = states[current_entity] -%} 
              {{- s if s is not none else none -}}
            has_state_obj: "{{- state_obj is not none -}}"
            domain: >
              {%- set dot = current_entity.find('.') -%}
              {%- if dot > 0 -%}
                {{- current_entity[:dot] -}}
              {%- else -%}
                unknown
              {%- endif -%}
            friendly_name: "{{- state_attr(current_entity, 'friendly_name') | default(current_entity) -}}"
            state_str: "{{- states(current_entity) if has_state_obj else 'unknown' -}}"
            last_changed: >
              {%- if has_state_obj -%}
                {{- as_timestamp(state_obj.last_changed, default=0) | timestamp_local -}}
              {%- else -%}
                {{- '' -}} 
              {%- endif -%}
            last_updated: >
              {%- if has_state_obj -%}
                {{- as_timestamp(state_obj.last_updated, default=0) | timestamp_local -}}
              {%- else -%} 
                {{- '' -}} 
              {%- endif -%}
            labels_raw: "{{- labels(current_entity) | default([]) -}}"
            safe_labels: >
              {%- if labels_raw is iterable and (labels_raw is not string) -%}
                {{- labels_raw | list -}}
              {%- else -%} 
                [] 
              {%- endif -%}
            attrs_raw: >
              {%- set s = states[current_entity] -%} 
              {%- if s is not none and s.attributes is mapping -%}
                {{- s.attributes -}}
              {%- else -%}
                {}
              {% endif -%}
            has_attrs: >
              {%- set s = states[current_entity] -%}
              {{- s is not none and s.attributes is mapping -}}
            attrs_is_stringified: "{{- attrs_raw is string -}}"
            cabinet_header: >
              {%- set raw = attrs_raw -%}
              {%- if raw is mapping -%}
                {% set vars = raw.get('variables') -%}
                {%- if vars is mapping -%}
                  {% set cab = vars.get('AI_Cabinet_VolumeInfo') -%}
                  {%- if cab is mapping and cab.get('value') is mapping -%}
                    {{- cab.get('value') -}}
                  {% else -%}
                    {}
                  {%- endif -%}
                {%- else -%} 
                  {} 
                {%- endif -%}
              {%- else -%}
                {}
              {% endif -%}
            # @todo - there's that "''" return again
            cabinet_signature: >
              {%- if cabinet_header is mapping -%}
                {{- cabinet_header.get('validation','') | string -}}
              {%- else -%}
                ''
              {%- endif -%}
            is_cabinet_sensor: >
              {{-
                domain == 'sensor' and cabinet_header is mapping
                  and cabinet_signature == 'ALLYOURBASEAREBELONGTOUS'
              -}}
            # @todo - there's that "''" return again
            cabinet_guid: >
              {%- if is_cabinet_sensor and cabinet_header.get('id') -%}
                {{- cabinet_header.get('id') -}}
              {%- else -%} 
              '' 
              {%- endif -%}
            cabinet_uninitialized: "{{- is_cabinet_sensor and not cabinet_header.get('id') -}}"
            volume_result: >
              {%- if is_cabinet_sensor -%}
                {{- {
                  "is_cabinet": true,
                  "id": cabinet_header.get("id"),
                  "version": cabinet_header.get("version"),
                  "friendly_name": cabinet_header.get("friendly_name"),
                  "name": cabinet_header.get("name"),
                  "description": cabinet_header.get("description"),
                  "validation": cabinet_signature,
                  "flags": (
                    cabinet_header.get("flags")
                    if cabinet_header.get("flags") is mapping
                    else {}
                  ),
                  "uninitialized": cabinet_uninitialized
                } -}}
              {%- else -%}
                {{- { "is_cabinet": false} -}}
              {%- endif -%}
            stat_class: "{{- state_attr(current_entity,'state_class') | default('', true) | string -}}"
            stat_uom: "{{- state_attr(current_entity,'unit_of_measurement') | default('', true) | string -}}"
            stats_eligible: "{{- stat_class in ['measurement','total','total_increasing'] and stat_uom != '' -}}"
            stats_reason: >
              {%- if not has_state_obj -%}
                Entity not found.
              {%- elif stats_eligible -%}
                Eligible based on state_class and unit_of_measurement.
              {% elif stat_class == '' and stat_uom == '' -%}
                Missing state_class and unit_of_measurement.
              {%- elif stat_class == '' -%}
                Missing state_class.
              {% elif stat_uom == '' -%}
                Missing unit_of_measurement.
              {%- else -%}
                Unsupported state_class for statistics.
              {%- endif -%}
            statistics_result: >
              {{- { "eligible": stats_eligible, "reason": stats_reason } -}}"
            extended_block: >
              {%- if extended_mode -%}
                {%- set dev_id = state_attr(current_entity, 'device_id') -%}
                {%- set dev = dev_id if dev_id is not none else none -%}
                {%- set area = dev and device_attr(dev, 'area_id') or none -%}
                {%  set identifiers = dev and device_attr(dev, 'identifiers') or none -%}
              
                {{- {
                  "device_id": dev,
                  "area_id": area,
                  "identifiers": identifiers
                } -}}
              {%- else -%}
                {}
              {%- endif -%}
            safe_attributes: >
              {%- if is_cabinet_sensor -%}
                { "notice": "Attributes suppressed for cabinet sensor. Use FileCabinet tools for full volume access." }
              {%- else -%}
                {# --- ORIGINAL SANITIZER BLOCK (UNCHANGED) --- #}
              
                {%- if attrs_is_stringified -%}
                  {# --- FALLBACK MODE: Home Assistant stringified the dict --- #}
                  {%- set s = states[current_entity] -%}
                  {%- set ns = namespace(out={}) -%}
              
                  {%- if s is not none -%}
                    {% for k in s.attributes.keys() -%}
                      {%- set v = state_attr(current_entity, k) -%}
                      {%- if v is string or v is number or v is boolean -%}
                        {% set ns.out = ns.out | combine({k: v}, recursive=true) -%}
                        {%- elif v is mapping -%}
                        {%- set ns.out = ns.out | combine({k: v}, recursive=true) -%}
                        {%- elif v is sequence and (v is not string) -%}
                        {%- set ns.out = ns.out | combine({k: v}, recursive=true) -%}
                      {%- else -%}
                        {%- set ns.out = ns.out | combine({k: v|string}, recursive=true) -%}
                      {%- endif -%}
                    {%- endfor -%}
                  {%- endif -%}
              
                  {{- ns.out -}}
                {%- else -%}
                  {# --- NORMAL MODE --- #}
                  {%- set raw = attrs_raw -%}
                  {%- set ns = namespace(out={}) -%}
              
                  {%- if raw is mapping -%}
                    {%- for k, v in raw.items() -%}
                      {%- if v is string or v is number or v is boolean -%}
                        {%- set ns.out = ns.out | combine({k: v}, recursive=true) -%}
                      {%- elif v is mapping -%}
                        {%- set ns.out = ns.out | combine({k: v}, recursive=true) -%}
                      {%- elif v is sequence and (v is not string) -%}
                        {%- set ns.out = ns.out | combine({k: v}, recursive=true) -%}
                      {%- else -%}
                        {%- set ns.out = ns.out | combine({k: v|string}, recursive=true) -%}
                      {%- endif -%}
                    {%- endfor -%}
                  {%- endif -%}
              
                  {{- ns.out -}}
                {%- endif -%}
              {%- endif -%}
            entity_result: >
              {{- {
                "entity_id": current_entity,
                "friendly_name": friendly_name,
                "domain": domain,
                "state": state_str,
                "last_changed": last_changed,
                "last_updated": last_updated,
                "labels": safe_labels,
                "attributes": safe_attributes,
                "volume": volume_result,
                "statistics": statistics_result,
                "extended": extended_block,
              } -}}"
            results: "{{- (results + [entity_result]) | list -}}"
    - variables:
        inspect_result:
          results: "{{- results -}}"
          inputs:
            entity_id: "{{- entity_list -}}"
            extended: "{{- extended_mode -}}"
            infer: "{{- infer_mode -}}"
            timeout: "{{- timeout_s -}}"
          error:
    - stop: Inspect complete
      response_variable: inspect_result

automation:
  - id: zen_manifest_repair_labels
    alias: "ZenOS: Critical Label Repair"
    description: >-
      Runs zen_dojotools_manifest mode=repair confirm=true on HA startup and
      daily at midnight — same cadence as bootstrap_stacks/bootstrap_kfc below,
      staged to fire first since those two depend on tools already carrying
      their declared labels. Sweeps every zen_* tool's required_labels (and
      optional_labels, include_optional defaults true) against the live label
      registry and creates whatever is missing via zen_dojotools_labels.
      Idempotent — a clean system is a fast no-op (single tool_manifest scan
      per tool, no writes). confirm=true is safe here specifically because
      label creation is scoped, additive-only, and non-destructive (unlike
      reload_all/restart, which still require live operator approval) — see
      mode=repair's own docs for what it will and will not touch.
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: time
        at: "00:00:15"
    actions:
      - action: script.zen_dojotools_manifest
        data:
          mode: repair
          confirm: true
          caller_token: zen_manifest_repair_labels

  - id: zen_manifest_bootstrap_stacks
    alias: "ZenOS: Bootstrap Lens Registry"
    description: >-
      Runs zen_dojotools_manifest bootstrap_stacks on HA startup and daily at
      midnight. Ensures all zen_stack_* and zen_sutra_* providers with
      register_mode declared are registered in lens_registry. Idempotent.
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: time
        at: "00:00:30"
    actions:
      - action: script.zen_dojotools_manifest
        data:
          mode: bootstrap_stacks
          caller_token: zen_manifest_bootstrap_stacks

  - id: zen_manifest_bootstrap_kfc
    alias: "ZenOS: Bootstrap KFC Dojo Drawers"
    description: >-
      Runs zen_dojotools_manifest bootstrap_kfc on HA startup and daily at
      midnight. Writes live drawer mounts into the dojo cabinet for each tool
      that declares mode=kfc_manifest. Summarizer resolves mounts at runtime.
      Idempotent — safe to run repeatedly.
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: time
        at: "00:01:00"
    actions:
      - action: script.zen_dojotools_manifest
        data:
          mode: bootstrap_kfc
          caller_token: zen_manifest_bootstrap_kfc
