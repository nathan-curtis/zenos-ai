###############################################################################
# ZEN DOJOTOOLS PLANT — Physical Plant + Energy Manager (v5.9.1)
#
# v5.9.1 (2026-08-26): mode=mechanical now self-explains a live leak --
#   if any leak_sensors entry reads wet, the response's own warnings/
#   next_actions carry the breadcrumb (auto-shutoff already enabled vs.
#   how to enable it / confirm-first phrasing if off), instead of a
#   caller needing prior knowledge that leak_auto_shutoff_enable exists.
#
# v5.9.0 (2026-08-25): new mode=circuit_draw — draw vs. rated capacity per
#   circuit, voltage/pole-count read from the provider's own attributes,
#   plus human-confirmed protection_type/special_purpose via new labels
#   (breaker_gfci, breaker_afci, surge_suppression). New panel_features
#   block in mode=electric (surge_suppressor/generator/battery/solar
#   present, human-confirmed via zen_plant_generator/battery/solar
#   labels — SPAN's own PV/battery sensors are always-on stubs regardless
#   of real hardware, not a reliable presence signal). circuit_draw's math
#   is also independently mirrored inside room_state.yaml itself to feed
#   Room Manager's generic per-room trouble_active attribute (>80%
#   sustained circuit load, NFPA/NEC continuous-load threshold) — no
#   tagging required for that specific signal.
#
# v5.8.0 (2026-08-24): new mode=leak_auto_shutoff_enable — house-wide gate
#   (cabinet drawer plant_auto_shutoff_config, default OFF) for the new
#   zen_plant_leak_watch automation, same file: on real moisture.detected
#   from any zen_plant_leak_sensor-labeled entity, closes every
#   zen_plant_auto_shutoff-labeled switch/valve if the gate is on, or asks
#   live (two independent yes/no questions: close now? auto-close future
#   leaks?) if it's off. label_suggest gained real water/leak/shutoff
#   classification (moisture device_class, valve domain, switch name
#   patterns) — was electrical-only before, the gap that let a flow-rate
#   sensor get manually mislabeled as the shutoff valve undetected for
#   hours. _shutoff_eid also hardened to switch./valve. domains only.
#
# v5.7.0 (2026-08-09): solar/battery folded into mode=electric as a nested
#   'solar' key (zen_plant_pv_power/battery_power/battery_soc/grid_power/
#   off_grid labels) — present only when at least one resolves, zero size
#   cost for households without a solar/battery panel. Site-level rollup
#   only (sum power, average SOC across banks); multi-inverter per-device
#   detail is future scope. label_suggest gained matching device_class +
#   name-pattern branches. Read-only — charge-limit/EPS-mode/quick-charge
#   style controls stay on the generic domain tools, out of Plant's scope.
#
# v5.6.0 (2026-08-07): new mode=label_suggest — scans a named integration's
#   entities (span_panel, emporia_vue) and suggests zen_plant_*/main_panel/
#   sub_panel/consumed_energy labels by device_class + name pattern,
#   preview-by-default (confirm_action=true to apply). Fills the gap between
#   Room Manager's label_discover (area-scoped) and Media Manager's
#   label_suggest (room-scoped) — Plant's domain is house-wide, so a blind
#   device_class scan across every smart plug/appliance would flood with
#   noise; scoping to a named integration keeps it targeted.
#
# Script: zen_dojotools_plant
#
# mode: overview | electric | water | gas | mechanical | thermal | circuits | circuit_draw | managed | leak_auto_shutoff_enable | help
#
# Discovery: label-based with graceful fallbacks.
# All sections surface available: false if no entities found or unavailable.
#
# Electric: whole-home live power (label:utility_main or main_panel) +
#           utility billing (label:utility_meter or integration labels) +
#           grid carbon (label:energy_management).
# Water:    flow sensor (label:water_usage or droplet) + billing rate.
# Gas:      live sensor if zen_plant_gas labeled, else graceful N/A.
# Circuits: label:consumed_energy (Wh, sort=energy default) or
#           label:main_panel/sub_panel *_current sensors (sort=current).
# Utilities: RM household cabinet utility_index injected into every response.
# Discovery: zen_plant_* label overrides take first priority in all waterfalls.
###############################################################################

script:

  zen_dojotools_plant:
    alias: "Zen DojoTools Plant"
    description: >
      Physical plant + energy manager (v5.9.1). Electric: whole-home live watts, utility billing, grid carbon,
      circuit breakdown, and — if a solar/battery panel is tagged — a nested solar block (PV production, battery
      power/SOC, grid import/export, grid-connected status; absent entirely for households with no panel tagged).
      Water: usage + billing. Gas: live sensor or graceful N/A. Utility registry from RM cabinet.
      mode=overview: top-line all utilities. mode=electric: full electrical. mode=water/gas/mechanical/thermal/circuits: subsystem detail. mode=hvac: HVAC-specific detail. mode=circuit_draw: per-circuit live draw vs. rated breaker capacity.
      mode=managed [managed_labels=csv]: universal managed-machine display — all machines provisioned via provision_bom, grouped by ha_labels root label. Returns products[], chores[], stock summary, schema_warnings[]{type,message,next_call}, and top-level advisory[] with exact fix commands. Resolves area via product location → Grocy location homeassistant_area userfield (not product userfield). Chores globally deduped alphabetically — each chore claimed by first machine. Plant is READ-ONLY: never sets labels or locations. Fix schema issues via zen_dojotools_inventory. Call mode=help for quickstart, howto, and managed_guidance.
      mode=validate: slot resolution report. mode=label_suggest integration=<slug>: scan a specific integration's entities (e.g. span_panel, emporia_vue, zwave_js) and suggest zen_plant_*/main_panel/sub_panel/consumed_energy/leak_sensor/auto_shutoff labels by device_class + name-pattern, preview by default, confirm_action=true to apply. mode=ignore/unignore: suppress/restore entities from discovery.
      mode=leak_auto_shutoff_enable [leak_auto_shutoff_enabled=bool]: house-wide gate for automatic leak response. Omit the field to READ the current on/off state. When ON, a real leak (any zen_plant_leak_sensor-labeled entity going wet) closes every zen_plant_auto_shutoff-labeled valve immediately, no asking. When OFF (default), a real leak instead asks live — two separate questions: close the valve now?, and separately, turn this auto-response on for future leaks? Use this mode to check whether it's currently on, or to flip it directly instead of waiting for a real leak to trigger the live offer.
    mode: queued
    max: 3

    fields:

      mode:
        name: Mode
        description: "overview, electric, hvac, water, gas, mechanical, thermal, circuits, circuit_draw, managed, validate, label_suggest, ignore, unignore, leak_auto_shutoff_enable, tool_manifest, help"
        default: overview
        selector:
          select:
            options: [overview, electric, hvac, water, gas, mechanical, thermal, circuits, circuit_draw, managed, validate, label_suggest, ignore, unignore, leak_auto_shutoff_enable, tool_manifest, help]

      leak_auto_shutoff_enabled:
        name: Leak auto-shutoff enabled
        description: "For mode=leak_auto_shutoff_enable. Omit to READ the current resolved value (cabinet > published default false). Pass true/false to WRITE it — writes the household cabinet 'plant_auto_shutoff_config' drawer. When true, the zen_plant_leak_watch automation closes every zen_plant_auto_shutoff-labeled valve immediately on a real moisture.detected event, no asking. When false (default), it asks live instead: close now? and separately, enable this for the future?"
        selector:
          boolean:

      integration:
        name: Integration
        description: "mode=label_suggest: integration slug to scan (e.g. span_panel, emporia_vue). Required for that mode."
        selector:
          text:

      circuit_limit:
        name: Circuit Limit
        description: "Max circuits to return in circuits mode (default 10) or circuit_draw mode (default 25)."
        default: 10
        selector:
          number:
            min: 1
            max: 50
            mode: box

      sort_by:
        name: Sort By
        description: "circuits: energy (lifetime Wh, default) or current (live amps)"
        default: energy
        selector:
          select:
            options: [energy, current]

      target_entity:
        name: Target Entity
        description: "Entity ID for mode=ignore / mode=unignore"
        selector:
          text:

      caller_token:
        name: Caller Token
        description: "Opaque token echoed in response for correlation."
        selector:
          text:

      managed_labels:
        name: Managed Labels
        description: "mode=managed: CSV of root HA label slugs to scope query (e.g. autovac,spa). Omit for all provisioned machines."
        selector:
          text:

      include_inventory:
        name: Include Inventory
        description: "Fetch Grocy room_brief for each named load's HA area (opt-in — adds sub-calls)."
        default: false
        selector:
          boolean:

    sequence:

      - variables:
          _tm_check: "{{ mode | default('') | lower }}"
      - choose:
        - conditions: "{{ _tm_check == 'tool_manifest' }}"
          sequence:
          - variables:
              result: >-
                {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
                {{ MF.tool_manifest(
                    tool='zen_dojotools_plant',
                    display_name='Physical Plant',
                    tier='dojotools',
                    version='5.9.1',
                    health={'configured': true, 'status': 'ok', 'notes': []},
                    required_labels=['dojotools'],
                    optional_labels=['zen_plant_leak_sensor', 'zen_plant_auto_shutoff', 'main_panel', 'sub_panel', 'consumed_energy', 'water_usage', 'utility_main', 'breaker_gfci', 'breaker_afci', 'surge_suppression', 'zen_plant_generator', 'zen_plant_battery', 'zen_plant_solar'],
                    consumes=['area', 'mode', 'integration'],
                    returns=['overview', 'electric', 'water', 'gas', 'mechanical', 'thermal', 'circuits', 'circuit_draw', 'managed'],
                    icon='mdi:home-city-outline',
                    color='amber',
                    stripe=3,
                    impact='soft',
                    mcp_exposed=true,

                    caller_token=caller_token | default('')
                ) | from_json }}
          - stop: tool_manifest
            response_variable: result
      # ── SETUP ─────────────────────────────────────────────────────────────
      - variables:
          _mode: "{{ mode | default('overview') | lower | trim }}"
          _caller_token: "{{ caller_token | default('') }}"
          _hh_cabinet: "{{ states('sensor.zen_default_household_cabinet_resolved') }}"

      # ── LEAK AUTO-SHUTOFF ENABLE (2026-08-24) ────────────────────────────
      # House-wide gate for zen_plant_leak_watch (automation, below). Same
      # read-omit/write-bool + cabinet-drawer shape as room_manager's
      # roomstate_enable/reflex_enable. Default false (opt-in, not opt-out) --
      # while off, a real leak asks live instead of acting silently.
      - if: "{{ _mode == 'leak_auto_shutoff_enable' }}"
        then:
          - variables:
              _lae_written: "{{ leak_auto_shutoff_enabled is defined and leak_auto_shutoff_enabled not in [none, ''] }}"
          - if: "{{ _lae_written }}"
            then:
              - action: script.zen_dojotools_filecabinet
                data:
                  action_type: >-
                    {%- set _cv=state_attr(_hh_cabinet,'variables')|default({},true) -%}
                    {{ 'update' if _cv.get('plant_auto_shutoff_config',none) is not none else 'create' }}
                  key: plant_auto_shutoff_config
                  volume_entity_id: "{{ _hh_cabinet }}"
                  value: >-
                    {{ {'enabled': leak_auto_shutoff_enabled | bool, 'updated_at': now().isoformat(), 'source': 'plant_mode_leak_auto_shutoff_enable'} | tojson }}
                response_variable: _fc_lae_result
              - variables:
                  _result:
                    status: ok
                    mode: leak_auto_shutoff_enable
                    written: "{{ leak_auto_shutoff_enabled | bool }}"
                    caller_token: "{{ _caller_token }}"
              - stop: leak_auto_shutoff_enable write done
                response_variable: _result
          - variables:
              _lae_resolved: >-
                {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                {%- set _raw = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'plant_auto_shutoff_config') if _hh_cabinet != '' else none -%}
                {%- set _cfg = (_raw | from_json) if _raw not in [none, ''] else {} -%}
                {{ (_cfg.enabled | default(false)) if _cfg is mapping else false }}
          - variables:
              _result:
                status: ok
                mode: leak_auto_shutoff_enable
                enabled: "{{ _lae_resolved | trim | lower == 'true' }}"
                shutoff_entities: "{{ label_entities('zen_plant_auto_shutoff') }}"
                leak_sensor_entities: "{{ label_entities('zen_plant_leak_sensor') }}"
                caller_token: "{{ _caller_token }}"
          - stop: leak_auto_shutoff_enable read done
            response_variable: _result

      # ── HELP ──────────────────────────────────────────────────────────────
      - if: "{{ _mode == 'help' }}"
        then:
          - variables:
              _result:
                status: ok
                mode: help
                tool: zen_dojotools_plant
                version: "5.9.1"
                modes:
                  overview: "Top-line snapshot: electric, hvac, thermal, water, gas, mechanical, utility registry"
                  electric: "Live whole-home power + billing + grid carbon + panel status + panel_features (surge_suppressor/generator/battery/solar present t/f, human-confirmed via zen_plant_generator/zen_plant_battery/zen_plant_solar/surge_suppression labels — not SPAN-derived, its PV/battery sensors are always-on stubs regardless of real hardware)"
                  hvac: "Climate units (room air) — HA climate.* entities labeled 'hvac' or 'main_thermostat'. Live mode, setpoint, current temp. Gas utility contact surfaced. Operational view only — for physical equipment (compressor, air handler, parts, chores) use mode=managed (see hvac_guidance)."
                  water: "Water usage sensor + billing rate"
                  gas: "zen_plant_gas sensor if tagged, else graceful N/A + utility contact surfaced"
                  mechanical: "Water heater + sump pump + motors bucket (zen_plant_motor) + water_management subnodes (water softener, auto shutoff, leak sensors). include_inventory=true fetches Grocy room_brief per load area inline."
                  thermal: "Thermal-managed loads — distinct from HVAC (not room air). Water heater, hot tub, freezers. Labels: zen_plant_hot_tub, zen_plant_freezer, zen_plant_thermal."
                  circuits: "Circuit breakdown. Params: circuit_limit (default 10), sort_by (energy|current)"
                  circuit_draw: "Draw vs capacity per circuit — real amps against real breaker rating (Wh not required), plus voltage/pole-count straight from SPAN's own attributes (120V=1-pole, 240V=2-pole, cross-checked against 'tabs'). Also reports protection_type (gfci/afci/none) and special_purpose (surge_suppression/none) per circuit — human-confirmed via breaker_gfci/breaker_afci/surge_suppression labels on the breaker switch entity (SPAN doesn't expose protection type natively; tag with zen_dojotools_labels). Param: circuit_limit (default 25). Fails soft to an empty list + warning if no SPAN/current-exposing codex is installed or labeled — never errors."
                  managed: "All provisioned machines from Grocy — chores due, stock summary, products grouped by label. Any machine bootstrapped via provision_bom appears here automatically. Param: managed_labels (CSV root label slugs, omit=all). Plant is a CONSUMER — it never sets labels. The component that owns the machine (autovac, spa_manager, etc.) is the label authority."
                  validate: "Resolution report — every slot: entity_id, pinned, raw_state, ok. Run to see what needs labeling."
                  label_suggest: "Integration-scoped label discovery. Param: integration= (required, e.g. span_panel, emporia_vue). Scans that integration's entities via zen_dojotools_inspect mode=integration_entities, classifies by device_class + name pattern (voltage/breaker_rating/upstream/downstream current → main_panel; per-circuit current → sub_panel; consumed energy → consumed_energy; site/current power → main_panel + site_power candidate). Preview by default, confirm_action=true to apply. Deliberately integration-scoped, not a house-wide device_class scan — see electric_panel_setup for why."
                  ignore: "Tag entity with zen_plant_ignore — suppresses from all plant discovery waterfalls. Param: target_entity."
                  unignore: "Remove zen_plant_ignore tag from entity — restores to plant discovery. Param: target_entity."
                  leak_auto_shutoff_enable: "House-wide gate for the companion zen_plant_leak_watch automation (same file). Omit leak_auto_shutoff_enabled= to read current on/off + which entities are tagged. Pass true/false to write. ON: a real leak (zen_plant_leak_sensor entity going wet) closes every zen_plant_auto_shutoff-labeled switch/valve immediately. OFF (default): asks live instead — close now?, and separately, turn auto-response on for future leaks? Two independent yes/no answers, both real. See label_suggest for tagging real leak sensors (moisture device_class) and the actual shutoff valve (switch/valve domain, name-pattern matched — verify medium-confidence matches by hand, a monitoring-only entity with a plausible name is NOT the same as a controllable valve)."
                  tool_manifest: "Return tool identity + live capability_status"
                  help: "This reference"
                discovery:
                  override_labels: "zen_plant_* labels take priority — tag any sensor to pin it"
                  electric_live: "zen_plant_site_power → label:utility_main → label:main_panel *site_power"
                  electric_billing: "zen_plant_billing_daily/weekly/monthly → label:utility_billing → label:utility_meter"
                  electric_tariff: "zen_plant_tariff (unit: USD/Wh) → label:utility_billing *tariff|rate|price"
                  electric_grid_carbon: "zen_plant_grid_carbon → label:energy_management *fossil*"
                  electric_solar: "zen_plant_pv_power/battery_power/battery_soc/grid_power (sensor) + zen_plant_off_grid (binary_sensor) → nested 'solar' key in mode=electric, present only if at least one resolves. Multiple entities per label SUM for power slots, AVERAGE for battery_soc (multi-inverter/multi-bank site-level rollup, no per-device detail in v1). See label_suggest for auto-detection against a named integration (e.g. eg4_web_monitor)."
                  water: "zen_plant_water → label:water_usage → label:droplet (non-fee sensors)"
                  water_rate: "zen_plant_water_rate → label:water_usage *fee|rate|cost → none if unlabeled"
                  gas: "zen_plant_gas (therms) → graceful N/A if unset"
                  water_heater: "label:water_heater → water_heater.* + sensor.*available* + binary_sensor.*running* + sensor.*power*"
                  sump_pump: "label:sump_pump → binary_sensor.* running status"
                  hot_tub: "zen_plant_hot_tub → climate.* (setpoint+temp) or sensor.*temp* (read-only)"
                  freezer: "zen_plant_freezer → sensor.* (temp reading per unit). Multiple entities = multiple nodes."
                  thermal_generic: "zen_plant_thermal → any additional thermal-managed entity not covered above"
                  water_softener: "zen_plant_water_softener → sensors/binary_sensors for softener/conditioner systems (e.g. Kinetico). Chores via Grocy chores_by_area."
                  leak_sensor: "zen_plant_leak_sensor → binary_sensor.* moisture device_class, wet/dry. Feeds mode=mechanical AND the zen_plant_leak_watch automation (real actuation, see mode=leak_auto_shutoff_enable). label_suggest auto-detects real leak pucks and aux leak-detect features on other devices, excluding diagnostic facets of the same sensor cluster (no_data/threshold/sump_pump_active are NOT leak signals)."
                  auto_shutoff: "zen_plant_auto_shutoff → switch.*/valve.* for an actual controllable water shutoff valve (e.g. Leak Gopher). MUST be actuatable — a monitoring-only sensor with a plausible name (flow rate, valve-position readout) does not belong here even if it seems related; this exact mistake happened live 2026-08-24 and silently made the auto-shutoff feature non-functional for hours. label_suggest flags switch-domain name matches as medium-confidence for exactly this reason — verify by hand."
                  motors: "zen_plant_motor → any entity representing a mechanical motor/drive (cover.* garage door, fan.* air handler/range hood, binary_sensor.* washer/dryer/dishwasher running). Multi-entity, returns node list."
                  grocy_link: "Grocy location.userfields.ha_entity_id links location to controlling HA entity (future: auto-wiring)"
                  ignore: "zen_plant_ignore → entity suppressed from all waterfalls"
                  circuits_energy: "label:consumed_energy → sensor.* sorted desc by lifetime Wh"
                  circuits_current: "label:main_panel+sub_panel → sensor.*_current* (excludes panel-level bus sensors)"
                fallback: "All sections return available=false when entities are missing or unavailable"
                utility_registry: "Injected from RM household cabinet utility_index on every response"
                managed_guidance:
                  how_it_works: "Products fetched via catalog_find_by_tag. Grouped by ha_labels root (first label in CSV = machine identifier). Area resolved via product location_id → Grocy location → parent chain → homeassistant_area userfield. Chores fetched via room_brief per resolved area. Chores are globally deduped across machines in alphabetical label order — each chore_id assigned to the first machine that claims it."
                  schema_warnings:
                    root_label_is_area: "The machine group label resolves to a real HA area_id. Fix: retag the products using a machine-type label (e.g. garage_door, dishwasher) not a room label as the root. Use zen_dojotools_inventory mode=products_tag ha_labels=<machine>,<machine>_part."
                    no_area_resolved: "All products in this machine group have a Grocy location with no homeassistant_area userfield set. Chores and stock will be empty. Fix: use zen_dojotools_inventory mode=locations_metadata_set location=X area_id=Y to tag the storage location. The area propagates to all child locations automatically."
                  chore_bleed: "If a machine shows chores clearly belonging to a different appliance (e.g. dishwasher chores appearing under trash_trakker), those chores have no machine group of their own yet. Fix: provision_bom that appliance so it gets its own label group — it will claim its chores before the affected machine processes them. Chore ownership = first alphabetical machine whose product shares the same area."
                  duplicate_machine_groups: "If the same physical machine appears as two groups, old products were manually tagged with a different root label before provision_bom existed. Fix: retag old products to match the canonical label using products_tag, then delete provision_bom duplicates with catalog_delete_product (check stock first with stock_check_item)."
                  label_authority: "Plant NEVER sets labels. The owning component (autovac, spa_manager, etc.) defines the canonical label via provision_bom or products_tag. If plant shows a machine you don't recognize, check the ha_labels field in its products[] — that reveals the owning component."
                  adding_a_machine: "To make a new machine appear in mode=managed: (1) use zen_dojotools_inventory mode=provision_bom with a BOM defining parts[], ha_labels, chore_ha_labels; (2) ensure product storage locations have homeassistant_area set; (3) that's it — plant picks it up on next call."
                electric_panel_setup:
                  overview: "Wiring a whole-panel/circuit-level energy monitor (SPAN Panel, Emporia Vue, or similar) into Plant Manager's existing electric slots and circuits mode. No new tool code needed for either — pure label wiring. Full worked examples with exact SPAN entity names from this household's real install: docs/plugins/span_panel_codex.md. Emporia Vue (clamp-style add-on, kWh unit): docs/plugins/emporia_vue_codex.md."
                  panel_level: "Tag the panel's whole-home power sensor with 'main_panel' (or override with zen_plant_site_power if you want to pin a specific sensor over the generic waterfall). Same label for L1/L2 voltage, main breaker rating, DSM/relay state sensors if the integration exposes them — these feed l1_voltage/l2_voltage/breaker_rating/panel_status slots automatically, no override needed once tagged."
                  circuit_level_energy: "Tag each circuit's cumulative/lifetime energy sensor with 'consumed_energy' — feeds mode=circuits sort_by=energy. Verify units: SPAN reports Wh (exact fit). Emporia Vue reports kWh (Plant's sort order is unaffected by a consistent unit scale, but don't assume the displayed magnitude in circuits output is literally watt-hours if the source is kWh — see the Emporia Codex's unit caveat)."
                  circuit_level_current: "Tag each circuit's live amp-draw sensor with 'sub_panel' — feeds mode=circuits sort_by=current. Only wire this if the integration reports raw amps per circuit (SPAN does; Emporia Vue does not — Emporia gives Power/Energy, not amps, so sort_by=current has no fit there, use sort_by=energy exclusively for Emporia-fed installs)."
                  bus_level_exclusion: "Upstream/downstream L1/L2 current, main breaker rating, and voltage sensors are BUS-level, not circuit-level — tag these 'main_panel', never 'sub_panel', or they'll pollute the circuits sort_by=current list. mode=circuits already excludes known bus-level sensor name patterns, but a mislabeled bus sensor tagged 'sub_panel' directly will still leak through."
                  two_panel_installs: "A household may have more than one physical panel (e.g. a SPAN main panel + a SPAN sub panel feeding a garage or addition). Both panels' circuit sensors get the SAME 'consumed_energy'/'sub_panel' labels regardless of which physical device they're on — Plant Manager's circuits mode aggregates across all labeled entities, it doesn't care which panel. Only pin ONE entity to zen_plant_site_power (the true whole-home total) — if the panels are wired main-feeds-sub (SPAN's 'feed through' metering), the sub panel's total is already counted inside the main panel's own site_power reading; don't sum both or you'll double-count."
                  verify: "mode=validate confirms panel-level slots (site_power, l1_voltage, l2_voltage, breaker_rating). mode=circuits sort_by=energy and mode=circuits sort_by=current confirm circuit-level coverage — every labeled circuit should appear, and sort_by=current should show real per-circuit amps, never bus-level entries."
                hvac_guidance:
                  two_planes: "HVAC has two independent planes in Plant. Operational (mode=hvac): HA climate.* entities labeled 'hvac' or 'main_thermostat' — live mode, setpoint, current temp. No Grocy involved. Physical (mode=managed): Grocy-provisioned units — compressor, air handler, filters, chores. These are independent; you can have either or both."
                  register_physical: "Provision each physical unit separately — compressor gets its own machine group, air handler gets its own. Use distinct root labels per unit (hvac_compressor, hvac_air_handler) rather than bare 'hvac' — bare 'hvac' shadows the HA entity label used by mode=hvac climate discovery. Physical units in different HA areas (attic, yard, hall) each need their Grocy storage location tagged with the correct homeassistant_area so chores resolve to the right room."
                  bom_compressor: "zen_dojotools_inventory mode=provision_bom bom='{\"ha_labels\":\"hvac_compressor,hvac_compressor_part\",\"chore_ha_labels\":\"hvac_compressor,hvac_compressor_chore\",\"parts\":[{\"name\":\"<Unit Model Name>\",\"asset_type\":\"equipment\"},{\"name\":\"<Filter or Refrigerant>\",\"asset_type\":\"consumable\"}]}' confirm_action=true"
                  bom_air_handler: "zen_dojotools_inventory mode=provision_bom bom='{\"ha_labels\":\"hvac_air_handler,hvac_air_handler_part\",\"chore_ha_labels\":\"hvac_air_handler,hvac_air_handler_chore\",\"parts\":[{\"name\":\"<Unit Model Name>\",\"asset_type\":\"equipment\"},{\"name\":\"<Air Filter>\",\"asset_type\":\"consumable\"}]}' confirm_action=true"
                  wire_operational: "To show HVAC operation in mode=hvac: apply HA label 'hvac' or 'main_thermostat' to the climate.* thermostat entity in HA. Independent of Grocy — mode=hvac reads live HA entity state only."
                  area_note: "HVAC equipment commonly spans multiple areas (compressor=yard, air_handler=attic, thermostat=hallway). Each Grocy storage location must have its homeassistant_area set to the correct HA area. Use zen_dojotools_inventory mode=locations_metadata_set location='<name>' area_id='<ha_area>' for each."
                  verify: "After provision_bom: mode=managed managed_labels=hvac_compressor then managed_labels=hvac_air_handler — confirm products[] populated and schema_warnings[] empty."
                  tie_to_electrical_circuit: "THIRD plane, worth wiring when a whole-panel/circuit-level energy monitor (SPAN, Emporia) exists — see electric_panel_setup above. If the unit's Grocy machine (bom_compressor/bom_air_handler) already exists, tag that SAME root label (hvac_compressor, hvac_air_handler) directly onto the unit's HA electrical sensors (power, consumed_energy, current — found via mode=circuits or mode=label_suggest). This does NOT change mode=managed output (Plant only reads Grocy products for that mode) — the payoff is a single label_1=hvac_compressor Index query that returns BOTH the Grocy equipment record and the live electrical sensors together, letting an agent correlate real amp draw with maintenance history (e.g. 'is the compressor pulling more current than usual for its runtime' as an early-failure signal). The HA label usually needs creating first — Grocy's ha_labels field on the product is just a text string, provision_bom never creates the matching real HA label object."
                quickstart:
                  goal: "Get a new machine showing correctly in mode=managed"
                  step_1: "Tag its Grocy storage location with the HA area: zen_dojotools_inventory mode=locations_metadata_set location='Storage Location Name' area_id='ha_area_id'"
                  step_2: "Tag its products with a machine-type root label: zen_dojotools_inventory mode=products_tag item='Product Name' ha_labels='machine_type,machine_type_part'"
                  step_3: "OR do both at once for new machines: zen_dojotools_inventory mode=provision_bom bom='{\"ha_labels\":\"machine_type,machine_type_part\",\"chore_ha_labels\":\"machine_type,machine_type_chore\",\"parts\":[...]}' confirm_action=true"
                  step_4: "Verify: mode=managed managed_labels=machine_type — check schema_warnings[] is empty and chores/stock look right"
                  rule: "Plant is read-only. Never ask plant to set labels or locations — use zen_dojotools_inventory for all writes."
                howto:
                  fix_no_area_resolved: "zen_dojotools_inventory mode=locations_metadata_set location_id=<id> area_id=<ha_area_id> — child locations inherit the area automatically, no need to set each one."
                  fix_root_label_is_area: "zen_dojotools_inventory mode=products_tag product_id=<id> ha_labels=<machine_type>,<subtype> — retag each product. Root label must not match an HA area_id (e.g. use 'garage_door' not 'garage')."
                  fix_duplicate_machines: "Identify canonical product (the one with real stock — use stock_check_item). Run products_merge(keep=canonical, remove=duplicate) to move stock, then catalog_delete_product on the empty shell. Retag canonical with correct labels."
                  fix_chore_bleed: "Chores from other appliances appear because those appliances have no machine group yet. Run provision_bom for each unmapped appliance (dishwasher, refrigerator, range, etc.) — machines are processed alphabetically, so each claims its own chores before shared-area machines see them."
                  investigate_machine: "mode=managed managed_labels=<label> — scope to one machine. Check products[].location_id to find storage locations. Check schema_warnings[].next_call for exact fix commands."
                  provision_bom_no_products: "If provision_bom ran but the machine does not appear in mode=managed: (1) confirm_action=true is REQUIRED — without it provision_bom is a dry run that shows a plan but creates nothing. (2) verify ha_labels is set in the BOM — it is the ONLY mechanism that makes a product visible to mode=managed. A product without ha_labels is invisible to Plant regardless of location or chores. (3) the root label (first value in ha_labels CSV) is the machine group identifier in mode=managed — verify it matches what you expect to see."
          - stop: help
            response_variable: _result

      # ── IGNORE ────────────────────────────────────────────────────────────
      - if: "{{ _mode == 'ignore' }}"
        then:
          - if: "{{ target_entity | default('') | trim == '' }}"
            then:
              - variables:
                  _result:
                    status: error
                    message: "target_entity is required for mode=ignore"
                    caller_token: "{{ _caller_token }}"
              - stop: missing target_entity
                response_variable: _result
          - action: script.zen_dojotools_labels
            data:
              action_type: create
              label_list: ["zen_plant_ignore"]
              new_description: "Suppress entity from all zen_dojotools_plant discovery waterfalls"
              new_icon: "mdi:eye-off"
              confirm: true
            response_variable: _create_resp
          - action: script.zen_dojotools_labels
            data:
              action_type: tag
              label_list: ["zen_plant_ignore"]
              target_entities: "{{ [target_entity | trim] }}"
              confirm: true
            response_variable: _tag_resp
          - variables:
              _result:
                status: ok
                mode: ignore
                summary:
                  entity_id: "{{ target_entity | trim }}"
                  label: zen_plant_ignore
                entities:
                  message: "Entity suppressed from all plant discovery waterfalls"
                warnings: []
                next_actions: []
                caller_token: "{{ _caller_token }}"
          - stop: ignore
            response_variable: _result

      # ── UNIGNORE ──────────────────────────────────────────────────────────
      - if: "{{ _mode == 'unignore' }}"
        then:
          - if: "{{ target_entity | default('') | trim == '' }}"
            then:
              - variables:
                  _result:
                    status: error
                    message: "target_entity is required for mode=unignore"
                    caller_token: "{{ _caller_token }}"
              - stop: missing target_entity
                response_variable: _result
          - action: script.zen_dojotools_labels
            data:
              action_type: untag
              label_list: ["zen_plant_ignore"]
              target_entities: "{{ [target_entity | trim] }}"
              confirm: true
            response_variable: _untag_resp
          - variables:
              _result:
                status: ok
                mode: unignore
                summary:
                  entity_id: "{{ target_entity | trim }}"
                  label: zen_plant_ignore
                entities:
                  message: "Entity restored to plant discovery waterfalls"
                warnings: []
                next_actions: []
                caller_token: "{{ _caller_token }}"
          - stop: unignore
            response_variable: _result

      # ── UTILITY REGISTRY ──────────────────────────────────────────────────
      - variables:
          _util_raw: >-
            {%- if _hh_cabinet == '' -%}{{ {} }}
            {%- else -%}
              {%- set _r=(state_attr(_hh_cabinet,'variables')|default({},true)).get('utility_index',none) -%}
              {%- if _r is none -%}{{ {} }}
              {%- elif _r is mapping -%}{{ _r.get('value',_r) if 'value' in _r else _r }}
              {%- elif _r is string and _r|trim not in ['None','none','','null'] -%}
                {%- set _rd=_r|from_json -%}
                {{ _rd.get('value',_rd) if _rd is mapping and 'value' in _rd else _rd }}
              {%- else -%}{{ {} }}
              {%- endif -%}
            {%- endif -%}

      # ── IGNORE LIST ───────────────────────────────────────────────────────
      # Tag any entity with zen_plant_ignore to suppress from all waterfalls.
      - variables:
          _zp_ignored: "{{ label_entities('zen_plant_ignore') | list }}"

      # ── ENTITY DISCOVERY ─────────────────────────────────────────────────
      # Waterfall: standard semantic labels first, integration-specific fallback.
      # Standard labels any install should apply:
      #   utility_main  — whole-home power/consumption meter
      #   utility_meter — HA utility meter virtual sensors (daily/monthly)
      #   consumed_energy — circuit/load level cumulative energy
      #   water_usage   — whole-home water consumption sensor
      # Integration-specific labels (SPAN, CPS Energy, Droplet, etc.) used
      # as secondary when standard labels return nothing.
      - variables:
          _utility_main_sensors: "{{ label_entities('utility_main') | select('match', 'sensor\\.') | reject('in', _zp_ignored) | list }}"
          _utility_meter_sensors: "{{ label_entities('utility_meter') | select('match', 'sensor\\.') | reject('in', _zp_ignored) | list }}"
          _main_panel_sensors: "{{ label_entities('main_panel') | select('match', 'sensor\\.') | reject('in', _zp_ignored) | list }}"
          _utility_billing_sensors: "{{ label_entities('utility_billing') | select('match', 'sensor\\.') | reject('in', _zp_ignored) | list }}"
          _utility_billing_binary: "{{ label_entities('utility_billing') | select('match', 'binary_sensor\\.') | reject('in', _zp_ignored) | list }}"
          _energy_mgmt_sensors: "{{ label_entities('energy_management') | select('match', 'sensor\\.') | reject('in', _zp_ignored) | list }}"
          _water_usage_sensors: "{{ label_entities('water_usage') | select('match', 'sensor\\.') | reject('in', _zp_ignored) | list }}"
          _droplet_sensors: "{{ label_entities('droplet') | select('match', 'sensor\\.') | reject('in', _zp_ignored) | list }}"
          _consumed_energy_sensors: "{{ label_entities('consumed_energy') | select('match', 'sensor\\.') | reject('in', _zp_ignored) | list }}"
          _sub_panel_sensors: "{{ label_entities('sub_panel') | select('match', 'sensor\\.') | reject('in', _zp_ignored) | list }}"

      # ── ZEN_PLANT LABEL OVERRIDES ─────────────────────────────────────────
      # Tag any sensor with a zen_plant_* label to pin it directly.
      # Overrides take first priority in every waterfall below.
      # zen_plant_tariff unit convention: USD/Wh (same as CPS integration sensors).
      # zen_plant_ignore — suppress any entity from all discovery waterfalls.
      - variables:
          _zp_site_power: "{{ label_entities('zen_plant_site_power') | select('match', 'sensor\\.') | list | first | default('') }}"
          _zp_tariff: "{{ label_entities('zen_plant_tariff') | select('match', 'sensor\\.') | list | first | default('') }}"
          _zp_billing_daily: "{{ label_entities('zen_plant_billing_daily') | select('match', 'sensor\\.') | list | first | default('') }}"
          _zp_billing_weekly: "{{ label_entities('zen_plant_billing_weekly') | select('match', 'sensor\\.') | list | first | default('') }}"
          _zp_billing_monthly: "{{ label_entities('zen_plant_billing_monthly') | select('match', 'sensor\\.') | list | first | default('') }}"
          _zp_grid_carbon: "{{ label_entities('zen_plant_grid_carbon') | select('match', 'sensor\\.') | list | first | default('') }}"
          _zp_water: "{{ label_entities('zen_plant_water') | select('match', 'sensor\\.') | list | first | default('') }}"
          _zp_water_rate: "{{ label_entities('zen_plant_water_rate') | select('match', 'sensor\\.') | list | first | default('') }}"
          _zp_gas: "{{ label_entities('zen_plant_gas') | select('match', 'sensor\\.') | list | first | default('') }}"
          _zp_hot_tub: "{{ label_entities('zen_plant_hot_tub') | reject('in', _zp_ignored) | list }}"
          _zp_freezer: "{{ label_entities('zen_plant_freezer') | reject('in', _zp_ignored) | list }}"
          _zp_thermal: "{{ label_entities('zen_plant_thermal') | reject('in', _zp_ignored) | list }}"
          _zp_water_softener: "{{ label_entities('zen_plant_water_softener') | reject('in', _zp_ignored) | list }}"
          _zp_auto_shutoff: "{{ label_entities('zen_plant_auto_shutoff') | reject('in', _zp_ignored) | list }}"
          _zp_leak_sensor: "{{ label_entities('zen_plant_leak_sensor') | reject('in', _zp_ignored) | list }}"
          _zp_motor: "{{ label_entities('zen_plant_motor') | reject('in', _zp_ignored) | list }}"
          # SOLAR/BATTERY (2026-08-09) — site-level rollup only, v1. Multiple
          # inverters/battery banks are SUMMED for power slots, AVERAGED for
          # SOC (a simple average, not capacity-weighted — fine for "how full
          # is the bank overall," not a precision BMS readout). No dedicated
          # mode: folds into mode=electric's response as a nested 'solar' key,
          # present only when at least one of these labels resolves to a real
          # entity — a household with no panel gets no size cost for this at
          # all, same 'available' gate every other Plant block already uses.
          _zp_pv_power: "{{ label_entities('zen_plant_pv_power') | select('match', 'sensor\\.') | reject('in', _zp_ignored) | list }}"
          _zp_battery_power: "{{ label_entities('zen_plant_battery_power') | select('match', 'sensor\\.') | reject('in', _zp_ignored) | list }}"
          _zp_battery_soc: "{{ label_entities('zen_plant_battery_soc') | select('match', 'sensor\\.') | reject('in', _zp_ignored) | list }}"
          _zp_grid_power: "{{ label_entities('zen_plant_grid_power') | select('match', 'sensor\\.') | reject('in', _zp_ignored) | list }}"
          _zp_off_grid: "{{ label_entities('zen_plant_off_grid') | select('match', 'binary_sensor\\.') | reject('in', _zp_ignored) | list | first | default('') }}"

      # ── RESOLVE SPECIFIC ENTITY IDS (zen_plant_* → generic → integration) ─
      - variables:
          _site_power_eid: >-
            {%- if _zp_site_power != '' -%}{{ _zp_site_power }}
            {%- else -%}
              {%- set _um = _utility_main_sensors | select('search', 'power|watt') | reject('search', 'produced|reactive|pv') | list | first | default('') -%}
              {%- set _mp = _main_panel_sensors | select('search', 'site_power') | list | first | default('') -%}
              {{ _um if _um != '' else _mp }}
            {%- endif -%}
          _l1_voltage_eid: "{{ _main_panel_sensors | select('search', 'l1_voltage') | list | first | default('') }}"
          _l2_voltage_eid: "{{ _main_panel_sensors | select('search', 'l2_voltage') | list | first | default('') }}"
          _breaker_rating_eid: "{{ _main_panel_sensors | select('search', 'main_breaker_rating') | list | first | default('') }}"
          _billing_daily_eid: >-
            {%- if _zp_billing_daily != '' -%}{{ _zp_billing_daily }}
            {%- else -%}
              {%- set _c = _utility_billing_sensors | select('search', 'daily') | list | first | default('') -%}
              {%- set _u = _utility_meter_sensors | select('search', 'daily') | list | first | default('') -%}
              {{ _c if _c != '' else _u }}
            {%- endif -%}
          _billing_monthly_eid: >-
            {%- if _zp_billing_monthly != '' -%}{{ _zp_billing_monthly }}
            {%- else -%}
              {%- set _c = _utility_billing_sensors | select('search', 'monthly') | list | first | default('') -%}
              {%- set _u = _utility_meter_sensors | select('search', 'monthly') | list | first | default('') -%}
              {{ _c if _c != '' else _u }}
            {%- endif -%}
          _billing_weekly_eid: >-
            {%- if _zp_billing_weekly != '' -%}{{ _zp_billing_weekly }}
            {%- else -%}
              {%- set _c = _utility_billing_sensors | select('search', 'weekly') | list | first | default('') -%}
              {%- set _u = _utility_meter_sensors | select('search', 'weekly') | list | first | default('') -%}
              {{ _c if _c != '' else _u }}
            {%- endif -%}
          _billing_tariff_eid: >-
            {%- if _zp_tariff != '' -%}{{ _zp_tariff }}
            {%- else -%}
              {%- set _c = _utility_billing_sensors | select('search', 'tariff|rate|price') | list | first | default('') -%}
              {%- set _u = _utility_meter_sensors | select('search', 'tariff|rate|price') | list | first | default('') -%}
              {{ _c if _c != '' else _u }}
            {%- endif -%}
          _billing_peak_eid: "{{ _utility_billing_binary | list | first | default('') }}"
          _grid_fossil_eid: >-
            {%- if _zp_grid_carbon != '' -%}{{ _zp_grid_carbon }}
            {%- else -%}
              {{ _energy_mgmt_sensors | select('search', 'fossil') | list | first | default('') }}
            {%- endif -%}
          _water_eid: >-
            {%- if _zp_water != '' -%}{{ _zp_water }}
            {%- else -%}
              {%- set _wu = _water_usage_sensors | reject('search', 'fee|rate|cost') | list | first | default('') -%}
              {%- set _dr = _droplet_sensors | reject('search', 'fee|rate|cost') | list | first | default('') -%}
              {{ _wu if _wu != '' else _dr }}
            {%- endif -%}
          _water_rate_eid: >-
            {%- if _zp_water_rate != '' -%}{{ _zp_water_rate }}
            {%- else -%}
              {{ _water_usage_sensors | select('search', 'fee|rate|cost') | list | first | default('') }}
            {%- endif -%}
          _circuit_current_eids: >-
            {{ (_main_panel_sensors + _sub_panel_sensors)
               | unique | list
               | select('search', '_current$')
               | reject('search', 'upstream|downstream|l1_current|l2_current|breaker_rating')
               | list }}

      # ── HVAC DISCOVERY ────────────────────────────────────────────────────
      - variables:
          _thermostat_sensors: "{{ label_entities('main_thermostat') | select('match', 'climate\\.') | reject('in', _zp_ignored) | list }}"
          _hvac_sensors: "{{ label_entities('hvac') | select('match', 'climate\\.') | reject('in', _zp_ignored) | list }}"

      - variables:
          _thermostat_eids: >-
            {%- set _mt = _thermostat_sensors -%}
            {%- set _hv = _hvac_sensors -%}
            {{ (_mt if _mt | count > 0 else _hv) | list }}

      # ── MECHANICAL DISCOVERY ──────────────────────────────────────────────
      - variables:
          _wh_entities: "{{ label_entities('water_heater') | reject('in', _zp_ignored) | list }}"
          _sump_entities: "{{ label_entities('sump_pump') | reject('in', _zp_ignored) | list }}"

      - variables:
          _wh_eid: "{{ _wh_entities | select('match', 'water_heater\\.') | list | first | default('') }}"
          _wh_avail_eid: "{{ _wh_entities | select('match', 'sensor\\.') | select('search', 'available') | list | first | default('') }}"
          _wh_running_eid: "{{ _wh_entities | select('match', 'binary_sensor\\.') | select('search', 'running') | list | first | default('') }}"
          _wh_power_eid: "{{ _wh_entities | select('match', 'sensor\\.') | select('search', 'power') | reject('search', 'today|daily') | list | first | default('') }}"
          _wh_daily_eid: "{{ _wh_entities | select('match', 'sensor\\.') | select('search', 'power_usage_today|daily') | list | first | default('') }}"
          _sump_eid: "{{ _sump_entities | select('match', 'binary_sensor\\.') | list | first | default('') }}"
          # Thermal loads
          _ht_climate_eid: "{{ _zp_hot_tub | select('match', 'climate\\.') | list | first | default('') }}"
          _ht_temp_eid: "{{ _zp_hot_tub | select('match', 'sensor\\.') | select('search', 'temp') | list | first | default('') }}"
          _freezer_eids: "{{ _zp_freezer | list }}"
          # Garage water subnodes
          _softener_eids: "{{ _zp_water_softener | list }}"
          # 2026-08-24: domain-filtered, not just "first tagged" -- a
          # mislabeled flow-rate sensor (domain sensor, not actuatable)
          # was silently picked as THE shutoff entity here for hours
          # before being found live, with nothing surfacing the mistake.
          # switch/valve only -- the two real actuatable domains for a
          # water shutoff -- so a future mislabel at least fails safe
          # (resolves empty, mode=leak_auto_shutoff_enable's own
          # shutoff_entities list still shows everything tagged for a
          # human to actually see the mismatch) instead of silently
          # reporting an uncontrollable entity as if it were real.
          _shutoff_eid: "{{ (_zp_auto_shutoff | select('match', '^(switch|valve)\\.') | list | first) | default('') }}"
          _leak_sensor_eids: "{{ _zp_leak_sensor | select('match', 'binary_sensor\\.') | list }}"

      # ── READ SENSOR STATES ────────────────────────────────────────────────
      - variables:
          _site_power_w: >-
            {%- set _s = states(_site_power_eid) if _site_power_eid != '' else 'unavailable' -%}
            {{ _s | float(none) if _s not in ['unavailable','unknown',''] else none }}
          _l1_v: >-
            {%- set _s = states(_l1_voltage_eid) if _l1_voltage_eid != '' else 'unavailable' -%}
            {{ _s | float(none) if _s not in ['unavailable','unknown',''] else none }}
          _l2_v: >-
            {%- set _s = states(_l2_voltage_eid) if _l2_voltage_eid != '' else 'unavailable' -%}
            {{ _s | float(none) if _s not in ['unavailable','unknown',''] else none }}
          _breaker_a: >-
            {%- set _s = states(_breaker_rating_eid) if _breaker_rating_eid != '' else 'unavailable' -%}
            {{ _s | float(none) if _s not in ['unavailable','unknown',''] else none }}
          _billing_daily_wh: >-
            {%- set _s = states(_billing_daily_eid) if _billing_daily_eid != '' else 'unavailable' -%}
            {{ _s | float(none) if _s not in ['unavailable','unknown',''] else none }}
          _billing_monthly_wh: >-
            {%- set _s = states(_billing_monthly_eid) if _billing_monthly_eid != '' else 'unavailable' -%}
            {{ _s | float(none) if _s not in ['unavailable','unknown',''] else none }}
          _billing_weekly_wh: >-
            {%- set _s = states(_billing_weekly_eid) if _billing_weekly_eid != '' else 'unavailable' -%}
            {{ _s | float(none) if _s not in ['unavailable','unknown',''] else none }}
          _solar_available: "{{ (_zp_pv_power | count) > 0 or (_zp_battery_power | count) > 0 or (_zp_battery_soc | count) > 0 or (_zp_grid_power | count) > 0 or _zp_off_grid != '' }}"
          _pv_power_w: >-
            {%- if (_zp_pv_power | count) > 0 -%}
              {{ (_zp_pv_power | map('states') | map('float', 0) | list | sum) | round(0) }}
            {%- else -%}{{ none }}{%- endif -%}
          _battery_power_w: >-
            {%- if (_zp_battery_power | count) > 0 -%}
              {{ (_zp_battery_power | map('states') | map('float', 0) | list | sum) | round(0) }}
            {%- else -%}{{ none }}{%- endif -%}
          _battery_soc_pct: >-
            {%- if (_zp_battery_soc | count) > 0 -%}
              {{ ((_zp_battery_soc | map('states') | map('float', 0) | list | sum) / (_zp_battery_soc | count)) | round(1) }}
            {%- else -%}{{ none }}{%- endif -%}
          _grid_power_w: >-
            {%- if (_zp_grid_power | count) > 0 -%}
              {{ (_zp_grid_power | map('states') | map('float', 0) | list | sum) | round(0) }}
            {%- else -%}{{ none }}{%- endif -%}
          _grid_connected: "{{ (not is_state(_zp_off_grid, 'on')) if _zp_off_grid != '' else none }}"
          _billing_tariff_usd_wh: >-
            {%- set _s = states(_billing_tariff_eid) if _billing_tariff_eid != '' else 'unavailable' -%}
            {{ _s | float(none) if _s not in ['unavailable','unknown',''] else none }}
          _billing_peak: >-
            {%- set _s = states(_billing_peak_eid) if _billing_peak_eid != '' else 'unavailable' -%}
            {{ (_s == 'on') if _s not in ['unavailable','unknown',''] else none }}
          _grid_fossil_pct: >-
            {%- set _s = states(_grid_fossil_eid) if _grid_fossil_eid != '' else 'unavailable' -%}
            {{ _s | float(none) if _s not in ['unavailable','unknown',''] else none }}
          _water_usage_gal: >-
            {%- set _s = states(_water_eid) if _water_eid != '' else 'unavailable' -%}
            {%- set _f = _s | float(none) if _s not in ['unavailable','unknown',''] else none -%}
            {{ [_f | round(3), 0] | max if _f is not none else none }}
          _water_rate_usd: >-
            {%- if _water_rate_eid != '' -%}
              {%- set _s = states(_water_rate_eid) -%}
              {{ _s | float(none) if _s not in ['unavailable','unknown',''] else none }}
            {%- else -%}
              {{ none }}
            {%- endif -%}
          _gas_therms: >-
            {%- if _zp_gas != '' -%}
              {%- set _s = states(_zp_gas) -%}
              {{ _s | float(none) if _s not in ['unavailable','unknown',''] else none }}
            {%- else -%}{{ none }}{%- endif -%}
          _wh_mode: >-
            {%- set _s = states(_wh_eid) if _wh_eid != '' else 'unavailable' -%}
            {{ _s if _s not in ['unavailable','unknown',''] else none }}
          _wh_current_temp: >-
            {%- set _v = state_attr(_wh_eid, 'current_temperature') if _wh_eid != '' else none -%}
            {{ _v | float(none) if _v is not none else none }}
          _wh_setpoint: >-
            {%- set _v = state_attr(_wh_eid, 'temperature') if _wh_eid != '' else none -%}
            {{ _v | float(none) if _v is not none else none }}
          _wh_avail_pct: >-
            {%- set _s = states(_wh_avail_eid) if _wh_avail_eid != '' else 'unavailable' -%}
            {{ _s | float(none) if _s not in ['unavailable','unknown',''] else none }}
          _wh_running: >-
            {%- set _s = states(_wh_running_eid) if _wh_running_eid != '' else 'unavailable' -%}
            {{ (_s == 'on') if _s not in ['unavailable','unknown',''] else none }}
          _wh_power_w: >-
            {%- set _s = states(_wh_power_eid) if _wh_power_eid != '' else 'unavailable' -%}
            {{ _s | float(none) if _s not in ['unavailable','unknown',''] else none }}
          _wh_daily_kwh: >-
            {%- set _s = states(_wh_daily_eid) if _wh_daily_eid != '' else 'unavailable' -%}
            {{ _s | float(none) if _s not in ['unavailable','unknown',''] else none }}
          _sump_active: >-
            {%- set _s = states(_sump_eid) if _sump_eid != '' else 'unavailable' -%}
            {{ (_s == 'on') if _s not in ['unavailable','unknown',''] else none }}
          _ht_setpoint: >-
            {%- if _ht_climate_eid != '' -%}
              {%- set _v = state_attr(_ht_climate_eid, 'temperature') -%}
              {{ _v | float(none) if _v is not none else none }}
            {%- else -%}{{ none }}{%- endif -%}
          _ht_temp: >-
            {%- set _eid = _ht_climate_eid if _ht_climate_eid != '' else _ht_temp_eid -%}
            {%- if _eid != '' -%}
              {%- set _s = state_attr(_eid, 'current_temperature') if _ht_climate_eid != '' else states(_eid) -%}
              {{ _s | float(none) if _s is not none and _s not in ['unavailable','unknown',''] else none }}
            {%- else -%}{{ none }}{%- endif -%}
          _ht_mode: >-
            {%- set _s = states(_ht_climate_eid) if _ht_climate_eid != '' else 'unavailable' -%}
            {{ _s if _s not in ['unavailable','unknown',''] else none }}
          _freezer_nodes: >-
            {%- set ns = namespace(rows=[]) -%}
            {%- for eid in _freezer_eids -%}
              {%- set _s = states(eid) -%}
              {%- set _name = state_attr(eid, 'friendly_name') | default(eid, true) -%}
              {%- set ns.rows = ns.rows + [{'entity_id': eid, 'name': _name, 'temp': _s | float(none) if _s not in ['unavailable','unknown',''] else none, 'unit': state_attr(eid, 'unit_of_measurement') | default('°F', true)}] -%}
            {%- endfor -%}
            {{ ns.rows }}
          _softener_nodes: >-
            {%- set ns = namespace(rows=[]) -%}
            {%- for eid in _softener_eids -%}
              {%- set _s = states(eid) -%}
              {%- set _name = state_attr(eid, 'friendly_name') | default(eid, true) -%}
              {%- set ns.rows = ns.rows + [{'entity_id': eid, 'name': _name, 'state': _s, 'unit': state_attr(eid, 'unit_of_measurement') | default(none, true)}] -%}
            {%- endfor -%}
            {{ ns.rows }}
          _shutoff_state: >-
            {%- set _s = states(_shutoff_eid) if _shutoff_eid != '' else 'unavailable' -%}
            {{ _s if _s not in ['unavailable','unknown',''] else none }}
          _leak_nodes: >-
            {%- set ns = namespace(rows=[]) -%}
            {%- for eid in _leak_sensor_eids -%}
              {%- set _s = states(eid) -%}
              {%- set _name = state_attr(eid, 'friendly_name') | default(eid, true) -%}
              {%- set ns.rows = ns.rows + [{'entity_id': eid, 'name': _name, 'wet': (_s == 'on') if _s not in ['unavailable','unknown',''] else none}] -%}
            {%- endfor -%}
            {{ ns.rows }}

      # ── LOAD AREA RESOLUTION ─────────────────────────────────────────────
      - variables:
          _inc_inv: "{{ include_inventory | default(false) | bool }}"
          _wh_area: "{{ area_id(_wh_eid) | default('') if _wh_eid != '' else '' }}"
          _ht_area: >-
            {%- set _eid = _ht_climate_eid if _ht_climate_eid != '' else _ht_temp_eid -%}
            {{ area_id(_eid) | default('') if _eid != '' else '' }}
          _sump_area: "{{ area_id(_sump_eid) | default('') if _sump_eid != '' else '' }}"

      # ── INVENTORY FETCH (opt-in via include_inventory=true) ───────────────
      - if: "{{ _inc_inv and _wh_area != '' }}"
        then:
          - action: script.zen_dojotools_inventory
            data:
              mode: room_brief
              homeassistant_area_id: "{{ _wh_area }}"
            response_variable: _wh_inv_resp
            continue_on_error: true

      - variables:
          _wh_inv: >-
            {%- if not _inc_inv or _wh_area == '' -%}{{ none }}
            {%- else -%}
              {%- set _r = _wh_inv_resp | default({}) -%}
              {{ _r if _r is mapping and _r.get('status') in ['success','ok'] else none }}
            {%- endif -%}

      - if: "{{ _inc_inv and _ht_area != '' and _ht_area != _wh_area }}"
        then:
          - action: script.zen_dojotools_inventory
            data:
              mode: room_brief
              homeassistant_area_id: "{{ _ht_area }}"
            response_variable: _ht_inv_resp
            continue_on_error: true

      - variables:
          _ht_inv: >-
            {%- if not _inc_inv -%}{{ none }}
            {%- elif _ht_area == _wh_area -%}{{ _wh_inv }}
            {%- elif _ht_area == '' -%}{{ none }}
            {%- else -%}
              {%- set _r = _ht_inv_resp | default({}) -%}
              {{ _r if _r is mapping and _r.get('status') in ['success','ok'] else none }}
            {%- endif -%}

      # ═══════════════════════════════════════════════════════════════════════
      # LABEL_SUGGEST (2026-08-07) — design note: "does plant have a way to
      # detect these and suggest how to tag if it sees some certain kind
      # of ent?" It didn't; Room Manager has label_discover (area-scoped)
      # and Media Manager has label_suggest (room-scoped) but Plant had no
      # equivalent. Plant's domain is house-wide, not room-scoped, so a
      # blind device_class scan (every device_class=power entity in the
      # house — every smart plug, every appliance) would flood with noise.
      # Instead this is INTEGRATION-scoped: point it at a specific
      # integration slug (span_panel, emporia_vue, or any other panel/
      # energy-monitor integration) via integration=, same param shape as
      # zen_dojotools_inspect mode=integration_entities (called internally
      # here rather than re-implementing integration filtering). Same
      # preview/confirm_action=true/apply shape as RM's label_discover.
      # ═══════════════════════════════════════════════════════════════════════
      - if: "{{ _mode == 'label_suggest' }}"
        then:
          - if: "{{ (integration | default('') | trim) == '' }}"
            then:
              - variables:
                  _result:
                    status: error
                    mode: label_suggest
                    message: "integration= required (e.g. integration=span_panel or integration=emporia_vue). Use zen_dojotools_inspect mode=integration_entities to browse available integrations first if unsure of the slug."
                    caller_token: "{{ _caller_token }}"
              - stop: label_suggest error
                response_variable: _result
          - action: script.zen_dojotools_inspect
            data:
              mode: integration_entities
              integration: "{{ integration | trim }}"
              caller_token: "{{ _caller_token }}"
            response_variable: _ls_resp
          - variables:
              _ls_entities: "{{ (_ls_resp.entity_ids | default([])) if _ls_resp is mapping else [] }}"
          - if: "{{ _ls_entities | count == 0 }}"
            then:
              - variables:
                  _result:
                    status: error
                    mode: label_suggest
                    message: "No entities found for integration '{{ integration }}'. Check the slug via zen_dojotools_inspect mode=integration_entities."
                    caller_token: "{{ _caller_token }}"
              - stop: label_suggest no entities
                response_variable: _result
          # CLASSIFICATION — device_class + entity_id name-pattern heuristics.
          # Deliberately conservative: voltage/breaker_rating/upstream/
          # downstream current are unambiguous bus-level signals (high
          # confidence). Per-circuit current and the whole-home power
          # candidate need a human glance (medium confidence, noted why).
          # produced/net energy and per-circuit instantaneous power have NO
          # Plant slot today — surfaced separately as no_slot[], not
          # silently dropped, so the response stays honest about coverage.
          - variables:
              _ls_scan: >-
                {%- set ns = namespace(candidates=[], no_slot=[]) -%}
                {%- for e in _ls_entities -%}
                  {%- set _domain = e.split('.')[0] -%}
                  {%- set _dc = state_attr(e, 'device_class') | default('', true) -%}
                  {%- set _existing = labels(e) -%}
                  {%- set _fname = state_attr(e, 'friendly_name') | default(e, true) -%}
                  {%- set _eid_l = e | lower -%}
                  {%- set _sig = namespace(label='', conf='', note='') -%}
                  {%- if _dc == 'voltage' -%}
                    {%- set _sig.label = 'main_panel' -%}{%- set _sig.conf = 'high' -%}{%- set _sig.note = 'panel bus voltage' -%}
                  {%- elif _dc == 'current' and ('breaker_rating' in _eid_l or 'main_breaker' in _eid_l) -%}
                    {%- set _sig.label = 'main_panel' -%}{%- set _sig.conf = 'high' -%}{%- set _sig.note = 'breaker rating diagnostic, bus-level not per-circuit' -%}
                  {%- elif _dc == 'current' and ('upstream' in _eid_l or 'downstream' in _eid_l) -%}
                    {%- set _sig.label = 'main_panel' -%}{%- set _sig.conf = 'high' -%}{%- set _sig.note = 'bus-level upstream/downstream lug current, not a circuit — never tag sub_panel' -%}
                  {%- elif _dc == 'current' -%}
                    {%- set _sig.label = 'sub_panel' -%}{%- set _sig.conf = 'medium' -%}{%- set _sig.note = 'verify this is a per-circuit current reading before tagging — bus-level current sensors must get main_panel instead' -%}
                  {%- elif _dc == 'energy' and 'consumed' in _eid_l -%}
                    {%- set _sig.label = 'consumed_energy' -%}{%- set _sig.conf = 'high' -%}{%- set _sig.note = 'feeds mode=circuits sort_by=energy — verify unit (Wh exact fit, kWh sorts fine but do not read the number as literal Wh)' -%}
                  {%- elif _dc == 'energy' and ('produced' in _eid_l or 'net' in _eid_l) -%}
                    {%- set ns.no_slot = ns.no_slot + [{'entity_id': e, 'friendly_name': _fname, 'reason': 'produced/net energy has no dedicated Plant slot today — only consumed_energy is tracked'}] -%}
                  {%- elif _dc == 'power' and ('pv' in _eid_l or 'solar' in _eid_l) -%}
                    {%- set _sig.label = 'zen_plant_pv_power' -%}{%- set _sig.conf = 'high' -%}{%- set _sig.note = 'solar production — summed across all matching entities into mode=electric.solar.pv_power_w, no per-inverter breakdown in v1' -%}
                  {%- elif _dc == 'power' and 'battery' in _eid_l -%}
                    {%- set _sig.label = 'zen_plant_battery_power' -%}{%- set _sig.conf = 'high' -%}{%- set _sig.note = 'battery charge/discharge power — summed across all matching entities (multi-bank systems) into mode=electric.solar.battery_power_w' -%}
                  {%- elif _dc == 'power' and 'grid' in _eid_l -%}
                    {%- set _sig.label = 'zen_plant_grid_power' -%}{%- set _sig.conf = 'high' -%}{%- set _sig.note = 'grid import/export power (inverter/solar context) — distinct from zen_plant_site_power, feeds mode=electric.solar.grid_power_w' -%}
                  {%- elif _dc == 'battery' -%}
                    {%- set _sig.label = 'zen_plant_battery_soc' -%}{%- set _sig.conf = 'high' -%}{%- set _sig.note = 'battery state of charge % — averaged across all matching entities (multi-bank systems) into mode=electric.solar.battery_soc_pct, not capacity-weighted' -%}
                  {%- elif _domain == 'binary_sensor' and ('off_grid' in _eid_l or 'offgrid' in _eid_l) -%}
                    {%- set _sig.label = 'zen_plant_off_grid' -%}{%- set _sig.conf = 'high' -%}{%- set _sig.note = 'on = inverter running disconnected from grid — feeds mode=electric.solar.grid_connected (inverted)' -%}
                  {%- elif _dc == 'power' and ('site_power' in _eid_l or 'current_power' in _eid_l) -%}
                    {%- set _sig.label = 'main_panel' -%}{%- set _sig.conf = 'medium' -%}{%- set _sig.note = 'candidate for zen_plant_site_power override IF this is the true whole-home total — if more than one panel/integration reports a site-power-shaped sensor, pin only ONE (see two_panel_installs in mode=help electric_panel_setup), do not sum them' -%}
                  {%- elif _dc == 'power' -%}
                    {%- set ns.no_slot = ns.no_slot + [{'entity_id': e, 'friendly_name': _fname, 'reason': 'per-circuit instantaneous power has no dedicated Plant slot today — only consumed_energy (accumulator) and current (amps) feed mode=circuits'}] -%}
                  {%- elif 'dsm_state' in _eid_l or 'dsm_grid_state' in _eid_l -%}
                    {%- set _sig.label = 'main_panel' -%}{%- set _sig.conf = 'high' -%}{%- set _sig.note = 'feeds panel_status.dsm_state in mode=electric' -%}
                  {%- elif 'relay_state' in _eid_l and 'main' in _eid_l -%}
                    {%- set _sig.label = 'main_panel' -%}{%- set _sig.conf = 'high' -%}{%- set _sig.note = 'feeds panel_status.relay_state in mode=electric' -%}
                  {#- 2026-08-24 (household, real gap found live: a flow-rate
                     monitoring sensor got manually mislabeled
                     zen_plant_auto_shutoff -- this waterfall had NO water
                     branch at all to catch it, electrical-only until now).
                     moisture device_class is unambiguous -- real leak
                     puck or aux leak-detect feature, always high
                     confidence. Actuatable shutoff has no device_class to
                     key on (it's a plain switch/valve), so domain=valve is
                     high confidence (HA's own dedicated domain for exactly
                     this) and a switch name-pattern match is medium --
                     needs a human glance, same tier as site_power below,
                     specifically BECAUSE a name match alone can't tell a
                     real controllable valve from another mislabeled
                     monitoring entity. Flow/volume sensors are explicitly
                     routed to no_slot with a warning note instead of
                     silently ignored, so a human scanning candidates sees
                     the exact class of thing that caused this bug, not
                     just an absence. -#}
                  {%- elif _domain == 'binary_sensor' and _dc == 'moisture' and not ('no_data' in _eid_l or 'below_low_threshold' in _eid_l or 'above_high_threshold' in _eid_l or 'sump_pump_active' in _eid_l) -%}
                    {%- set _sig.label = 'zen_plant_leak_sensor' -%}{%- set _sig.conf = 'high' -%}{%- set _sig.note = 'moisture device_class -- real leak puck or an aux leak-detect feature on another device (e.g. a hardwired light switch)' -%}
                  {#- excludes no_data/below_low_threshold/above_high_threshold/
                     sump_pump_active -- diagnostic/operational facets of the SAME
                     moisture sensor cluster, not a clean leak signal. Same
                     exclusion already hand-documented in the garage room
                     package file; missed it on the first pass of this branch,
                     caught live testing against zwave_js before it ever got
                     applied to anything. -#}
                  {%- elif _domain == 'valve' -%}
                    {%- set _sig.label = 'zen_plant_auto_shutoff' -%}{%- set _sig.conf = 'high' -%}{%- set _sig.note = 'HA valve domain -- real actuatable water valve' -%}
                  {%- elif _domain == 'switch' and ('water_valve' in _eid_l or 'main_water' in _eid_l or 'shutoff' in _eid_l or 'leak_gopher' in _eid_l) -%}
                    {%- set _sig.label = 'zen_plant_auto_shutoff' -%}{%- set _sig.conf = 'medium' -%}{%- set _sig.note = 'name-pattern match only -- VERIFY this is a real controllable valve switch before tagging, not a monitoring-only entity with a similar name (exact bug found live 2026-08-24: a flow-rate sensor and a valve-position binary_sensor both had plausible names but neither was actuatable)' -%}
                  {%- elif _dc in ['volume_flow_rate', 'water'] -%}
                    {%- set ns.no_slot = ns.no_slot + [{'entity_id': e, 'friendly_name': _fname, 'reason': 'flow/volume monitoring sensor, NOT a controllable shutoff -- do not tag zen_plant_auto_shutoff even if the name suggests it'}] -%}
                  {%- endif -%}
                  {%- if _sig.label != '' and _sig.label not in _existing -%}
                    {%- set ns.candidates = ns.candidates + [{'entity_id': e, 'friendly_name': _fname, 'domain': _domain, 'device_class': _dc, 'suggested_label': _sig.label, 'confidence': _sig.conf, 'note': _sig.note, 'existing_labels': _existing}] -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ {'candidates': ns.candidates, 'no_slot': ns.no_slot} }}
          - if: "{{ not (confirm_action | default(false) | bool) }}"
            then:
              - variables:
                  _result:
                    status: preview
                    mode: label_suggest
                    integration: "{{ integration }}"
                    entity_count: "{{ _ls_entities | count }}"
                    candidate_count: "{{ _ls_scan.candidates | count }}"
                    candidates: "{{ _ls_scan.candidates }}"
                    no_slot: "{{ _ls_scan.no_slot if _ls_scan.no_slot | count > 0 else none }}"
                    message: "Preview only — review confidence notes (medium ones need a glance, especially the site_power candidate if this integration exposes more than one panel/meter). Pass confirm_action: true to tag ALL candidates in one shot. no_slot[] lists recognized-but-unmapped entities (produced/net energy, per-circuit instantaneous power) — informational, never auto-tagged."
                    caller_token: "{{ _caller_token }}"
              - stop: label_suggest preview
                response_variable: _result
          - repeat:
              for_each: "{{ _ls_scan.candidates }}"
              sequence:
                - action: script.zen_dojotools_labels
                  data:
                    mode: tag
                    label_list: ["{{ repeat.item.suggested_label }}"]
                    target_entities: ["{{ repeat.item.entity_id }}"]
                    confirm: true
          - variables:
              _result:
                status: ok
                mode: label_suggest
                integration: "{{ integration }}"
                applied_count: "{{ _ls_scan.candidates | count }}"
                applied: "{{ _ls_scan.candidates }}"
                no_slot: "{{ _ls_scan.no_slot if _ls_scan.no_slot | count > 0 else none }}"
                message: "Applied {{ _ls_scan.candidates | count }} label(s). Run mode=validate and mode=circuits to confirm resolution."
                caller_token: "{{ _caller_token }}"
          - stop: label_suggest applied
            response_variable: _result

      # ── VALIDATE ──────────────────────────────────────────────────────────
      - if: "{{ _mode == 'validate' }}"
        then:
          - variables:
              _val_hvac_eid: "{{ _thermostat_eids | first | default('') }}"
          - variables:
              _val_slots: >-
                {{
                  {
                    'site_power':     {'entity_id': _site_power_eid,     'pinned': _zp_site_power != '',     'raw_state': states(_site_power_eid) if _site_power_eid != '' else none,          'ok': _site_power_w is not none},
                    'tariff':         {'entity_id': _billing_tariff_eid,  'pinned': _zp_tariff != '',          'raw_state': states(_billing_tariff_eid) if _billing_tariff_eid != '' else none,   'ok': _billing_tariff_usd_wh is not none},
                    'billing_daily':  {'entity_id': _billing_daily_eid,   'pinned': _zp_billing_daily != '',   'raw_state': states(_billing_daily_eid) if _billing_daily_eid != '' else none,     'ok': _billing_daily_wh is not none},
                    'billing_weekly': {'entity_id': _billing_weekly_eid,  'pinned': _zp_billing_weekly != '',  'raw_state': states(_billing_weekly_eid) if _billing_weekly_eid != '' else none,    'ok': _billing_weekly_wh is not none},
                    'billing_monthly':{'entity_id': _billing_monthly_eid, 'pinned': _zp_billing_monthly != '', 'raw_state': states(_billing_monthly_eid) if _billing_monthly_eid != '' else none,  'ok': _billing_monthly_wh is not none},
                    'grid_carbon':    {'entity_id': _grid_fossil_eid,     'pinned': _zp_grid_carbon != '',     'raw_state': states(_grid_fossil_eid) if _grid_fossil_eid != '' else none,          'ok': _grid_fossil_pct is not none},
                    'water':          {'entity_id': _water_eid,           'pinned': _zp_water != '',           'raw_state': states(_water_eid) if _water_eid != '' else none,                      'ok': _water_usage_gal is not none},
                    'water_rate':     {'entity_id': _water_rate_eid,      'pinned': _zp_water_rate != '',      'raw_state': states(_water_rate_eid) if _water_rate_eid != '' else none,            'ok': _water_rate_usd is not none},
                    'gas':            {'entity_id': _zp_gas,              'pinned': _zp_gas != '',             'raw_state': states(_zp_gas) if _zp_gas != '' else none,                            'ok': _gas_therms is not none},
                    'l1_voltage':     {'entity_id': _l1_voltage_eid,      'pinned': false,                     'raw_state': states(_l1_voltage_eid) if _l1_voltage_eid != '' else none,            'ok': _l1_v is not none},
                    'l2_voltage':     {'entity_id': _l2_voltage_eid,      'pinned': false,                     'raw_state': states(_l2_voltage_eid) if _l2_voltage_eid != '' else none,            'ok': _l2_v is not none},
                    'breaker_rating': {'entity_id': _breaker_rating_eid,  'pinned': false,                     'raw_state': states(_breaker_rating_eid) if _breaker_rating_eid != '' else none,    'ok': _breaker_a is not none},
                    'hvac':           {'entity_id': _val_hvac_eid,        'pinned': false,                     'raw_state': states(_val_hvac_eid) if _val_hvac_eid != '' else none,                'ok': _val_hvac_eid != ''},
                    'water_heater':   {'entity_id': _wh_eid,              'pinned': false,                     'raw_state': states(_wh_eid) if _wh_eid != '' else none,                             'ok': _wh_eid != ''},
                    'sump_pump':      {'entity_id': _sump_eid,            'pinned': false,                     'raw_state': states(_sump_eid) if _sump_eid != '' else none,                          'ok': _sump_eid != ''},
                    'pv_power':       {'entity_id': none, 'pinned': false, 'raw_state': _pv_power_w,      'ok': _pv_power_w is not none,      'entity_count': _zp_pv_power | count},
                    'battery_power':  {'entity_id': none, 'pinned': false, 'raw_state': _battery_power_w, 'ok': _battery_power_w is not none, 'entity_count': _zp_battery_power | count},
                    'battery_soc':    {'entity_id': none, 'pinned': false, 'raw_state': _battery_soc_pct, 'ok': _battery_soc_pct is not none, 'entity_count': _zp_battery_soc | count},
                    'grid_power':     {'entity_id': none, 'pinned': false, 'raw_state': _grid_power_w,    'ok': _grid_power_w is not none,    'entity_count': _zp_grid_power | count},
                  }
                }}
          - variables:
              _val_unresolved: >-
                {%- set ns = namespace(m=[]) -%}
                {%- for k, v in _val_slots.items() -%}
                  {%- if not v.ok -%}{%- set ns.m = ns.m + [k] -%}{%- endif -%}
                {%- endfor -%}
                {{ ns.m }}
              _val_ok_count: "{{ _val_slots.values() | selectattr('ok') | list | count }}"
          - variables:
              _result:
                status: ok
                mode: validate
                summary:
                  resolved: "{{ _val_ok_count }}"
                  unresolved: "{{ _val_unresolved | count }}"
                  total: "{{ _val_slots | count }}"
                entities: "{{ _val_slots }}"
                warnings: >-
                  {%- set ns = namespace(w=[]) -%}
                  {%- for slot in _val_unresolved -%}
                    {%- set ns.w = ns.w + [{'slot': slot, 'issue': 'Entity not resolved — slot is empty or unavailable'}] -%}
                  {%- endfor -%}
                  {{ ns.w }}
                next_actions: >-
                  {%- set ns = namespace(a=[]) -%}
                  {%- for slot in _val_unresolved -%}
                    {%- set ns.a = ns.a + [{'call': 'label entity with zen_plant_' ~ slot, 'reason': slot ~ ' unresolved'}] -%}
                  {%- endfor -%}
                  {{ ns.a }}
                caller_token: "{{ _caller_token }}"
          - stop: validate
            response_variable: _result

      # ── HVAC BLOCK ────────────────────────────────────────────────────────
      - variables:
          _hvac_block: >-
            {%- set ns = namespace(units=[]) -%}
            {%- for eid in _thermostat_eids -%}
              {%- set _st = states(eid) -%}
              {%- if _st not in ['unavailable','unknown',''] -%}
                {%- set _sp = state_attr(eid,'temperature') -%}
                {%- set _ct = state_attr(eid,'current_temperature') -%}
                {%- set _name = state_attr(eid,'friendly_name') | default(eid,true) -%}
                {%- set ns.units = ns.units + [{'entity_id':eid,'name':_name,'hvac_mode':_st,'setpoint':_sp,'current_temp':_ct}] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ {'available': ns.units | count > 0, 'units': ns.units, 'count': ns.units | count} | tojson }}

      # ── SHARED BLOCKS ─────────────────────────────────────────────────────
      - variables:
          _solar_block: >-
            {%- if _solar_available -%}
              {{
                {
                  'pv_power_w': _pv_power_w,
                  'battery_power_w': _battery_power_w,
                  'battery_soc_pct': _battery_soc_pct,
                  'grid_power_w': _grid_power_w,
                  'grid_connected': _grid_connected,
                  'inverter_count': _zp_pv_power | count,
                  'battery_bank_count': _zp_battery_soc | count
                }
              }}
            {%- else -%}{{ none }}{%- endif -%}
          _elec_block: >-
            {%- set _avail = _site_power_w is not none or _billing_daily_wh is not none or _solar_available -%}
            {{
              {
                'available': _avail,
                'live_power_w': _site_power_w,
                'live_power_kw': (_site_power_w / 1000) | round(2) if _site_power_w is not none else none,
                'daily_kwh': (_billing_daily_wh / 1000) | round(2) if _billing_daily_wh is not none else none,
                'weekly_kwh': (_billing_weekly_wh / 1000) | round(3) if _billing_weekly_wh is not none else none,
                'monthly_kwh': (_billing_monthly_wh / 1000) | round(2) if _billing_monthly_wh is not none else none,
                'tariff_usd_kwh': (_billing_tariff_usd_wh | float(0) * 1000) | round(5) if _billing_tariff_usd_wh is not none else none,
                'peak_billing_month': _billing_peak,
                'grid_fossil_pct': _grid_fossil_pct,
                'l1_voltage': _l1_v,
                'l2_voltage': _l2_v,
                'main_breaker_amps': _breaker_a,
                'source': _site_power_eid,
                'solar': _solar_block
              } | tojson
            }}
          _water_block: >-
            {{
              {
                'available': _water_eid != '',
                'usage_gal': _water_usage_gal,
                'rate_per_1000gal_usd': _water_rate_usd,
                'source': _water_eid if _water_eid != '' else 'none'
              } | tojson
            }}
          _gas_block: >-
            {%- if _zp_gas != '' -%}
              {{ {'available': _gas_therms is not none, 'live_consumption_therms': _gas_therms, 'note': none, 'source': _zp_gas} | tojson }}
            {%- else -%}
              {{ {'available': false, 'live_consumption_therms': none, 'note': 'No live HA gas sensor — normal for utility-metered installations. Gas IS present at this property (see utility registry). Not an error.', 'source': 'none'} | tojson }}
            {%- endif -%}
          _thermal_block: >-
            {%- set ns = namespace(loads=[]) -%}
            {%- if _wh_eid != '' -%}
              {%- set _wh_name = state_attr(_wh_eid, 'friendly_name') | default(_wh_eid, true) -%}
              {%- set ns.loads = ns.loads + [{'type': 'water_heater', 'name': _wh_name, 'entity_id': _wh_eid, 'area': area_name(_wh_area) | default('', true) if _wh_area != '' else '', 'mode': _wh_mode, 'current_temp_f': _wh_current_temp, 'setpoint_f': _wh_setpoint, 'running': _wh_running, 'live_power_w': _wh_power_w, 'available_hot_water_pct': _wh_avail_pct, 'inventory': _wh_inv}] -%}
            {%- endif -%}
            {%- if _ht_climate_eid != '' or _ht_temp_eid != '' -%}
              {%- set _ht_eid = _ht_climate_eid if _ht_climate_eid != '' else _ht_temp_eid -%}
              {%- set _ht_name = state_attr(_ht_eid, 'friendly_name') | default('hot_tub', true) -%}
              {%- set ns.loads = ns.loads + [{'type': 'hot_tub', 'name': _ht_name, 'entity_id': _ht_eid, 'area': area_name(_ht_area) | default('', true) if _ht_area != '' else '', 'current_temp': _ht_temp, 'setpoint': _ht_setpoint, 'mode': _ht_mode, 'inventory': _ht_inv}] -%}
            {%- endif -%}
            {%- for eid in _freezer_eids -%}
              {%- set _s = states(eid) -%}
              {%- set _name = state_attr(eid, 'friendly_name') | default(eid, true) -%}
              {%- set _a = area_id(eid) | default('', true) -%}
              {%- set ns.loads = ns.loads + [{'type': 'freezer', 'entity_id': eid, 'name': _name, 'area': area_name(_a) | default('', true) if _a != '' else '', 'temp': _s | float(none) if _s not in ['unavailable','unknown',''] else none, 'unit': state_attr(eid, 'unit_of_measurement') | default('°F', true) | string}] -%}
            {%- endfor -%}
            {%- set _known = ([_wh_eid, _ht_climate_eid, _ht_temp_eid] + _freezer_eids) | select('string') | reject('eq', '') | list -%}
            {%- for eid in _zp_thermal if eid not in _known -%}
              {%- set _s = states(eid) -%}
              {%- set _a = area_id(eid) | default('', true) -%}
              {%- set ns.loads = ns.loads + [{'type': 'thermal_load', 'entity_id': eid, 'name': state_attr(eid, 'friendly_name') | default(eid, true), 'area': area_name(_a) | default('', true) if _a != '' else '', 'state': _s}] -%}
            {%- endfor -%}
            {{ {'available': ns.loads | count > 0, 'note': 'Thermal-managed loads — not room air. Use mode=hvac for climate controls.', 'count': ns.loads | count, 'loads': ns.loads} | tojson }}
          _mechanical_block: >-
            {%- set _gw_avail = _softener_eids | count > 0 or _shutoff_eid != '' or _leak_sensor_eids | count > 0 -%}
            {%- set ns_sw = namespace(rows=[]) -%}
            {%- for eid in _softener_eids -%}
              {%- set _s = states(eid) -%}
              {%- set _name = state_attr(eid, 'friendly_name') | default(eid, true) -%}
              {%- set ns_sw.rows = ns_sw.rows + [{'entity_id': eid, 'name': _name, 'state': _s, 'unit': state_attr(eid, 'unit_of_measurement') | default(none, true)}] -%}
            {%- endfor -%}
            {%- set ns_lk = namespace(rows=[]) -%}
            {%- for eid in _leak_sensor_eids -%}
              {%- set _s = states(eid) -%}
              {%- set _name = state_attr(eid, 'friendly_name') | default(eid, true) -%}
              {%- set ns_lk.rows = ns_lk.rows + [{'entity_id': eid, 'name': _name, 'wet': (_s == 'on') if _s not in ['unavailable','unknown',''] else none}] -%}
            {%- endfor -%}
            {%- set ns_mo = namespace(rows=[]) -%}
            {%- for eid in _zp_motor -%}
              {%- set _s = states(eid) -%}
              {%- set _name = state_attr(eid, 'friendly_name') | default(eid, true) -%}
              {%- set _dom = eid.split('.')[0] -%}
              {%- set _a = area_id(eid) | default('', true) -%}
              {%- set ns_mo.rows = ns_mo.rows + [{'entity_id': eid, 'name': _name, 'domain': _dom, 'area': area_name(_a) | default('', true) if _a != '' else '', 'state': _s}] -%}
            {%- endfor -%}
            {{
              {
                'available': _wh_eid != '' or _sump_eid != '' or _gw_avail or _zp_motor | count > 0,
                'water_heater': {
                  'entity_id': _wh_eid,
                  'name': state_attr(_wh_eid, 'friendly_name') | default(_wh_eid, true),
                  'area': area_name(_wh_area) | default('', true) if _wh_area != '' else '',
                  'mode': _wh_mode,
                  'current_temp_f': _wh_current_temp,
                  'setpoint_f': _wh_setpoint,
                  'available_hot_water_pct': _wh_avail_pct,
                  'running': _wh_running,
                  'live_power_w': _wh_power_w,
                  'daily_kwh': _wh_daily_kwh,
                  'inventory': _wh_inv
                } if _wh_eid != '' else none,
                'sump_pump': {
                  'entity_id': _sump_eid,
                  'area': area_name(_sump_area) | default('', true) if _sump_area != '' else '',
                  'active': _sump_active
                } if _sump_eid != '' else {'available': false, 'note': 'No sump_pump labeled entity — normal for slab/single-story construction. Not an error. If a sump pump exists, label its binary_sensor with sump_pump.'},
                'water_management': {
                  'water_softener': ns_sw.rows if ns_sw.rows | count > 0 else none,
                  'auto_shutoff': {'entity_id': _shutoff_eid, 'state': _shutoff_state} if _shutoff_eid != '' else none,
                  'leak_sensors': ns_lk.rows if ns_lk.rows | count > 0 else none,
                  'grocy_brief': ('zen_dojotools_inventory mode=room_brief homeassistant_area_id=' ~ _wh_area) if _wh_area != '' else none,
                  'inventory': _wh_inv
                } if _gw_avail else none,
                'motors': ns_mo.rows if ns_mo.rows | count > 0 else {'available': false, 'note': 'No zen_plant_motor labeled entities found. Label motor entities (garage doors, fans, appliances) with zen_plant_motor to populate.'}
              } | tojson
            }}

      # ── OVERVIEW ──────────────────────────────────────────────────────────
      - if: "{{ _mode == 'overview' }}"
        then:
          - variables:
              _result:
                status: ok
                mode: overview
                summary: >-
                  {%- set ns = namespace(avail=[]) -%}
                  {%- if (_elec_block | from_json).get('available') -%}{%- set ns.avail = ns.avail + ['electric'] -%}{%- endif -%}
                  {%- if (_hvac_block | from_json).get('available') -%}{%- set ns.avail = ns.avail + ['hvac'] -%}{%- endif -%}
                  {%- if (_thermal_block | from_json).get('available') -%}{%- set ns.avail = ns.avail + ['thermal'] -%}{%- endif -%}
                  {%- if (_water_block | from_json).get('available') -%}{%- set ns.avail = ns.avail + ['water'] -%}{%- endif -%}
                  {%- if (_gas_block | from_json).get('available') -%}{%- set ns.avail = ns.avail + ['gas'] -%}{%- endif -%}
                  {%- if (_mechanical_block | from_json).get('available') -%}{%- set ns.avail = ns.avail + ['mechanical'] -%}{%- endif -%}
                  {{ {'available_subsystems': ns.avail} }}
                entities:
                  electric: "{{ _elec_block | from_json }}"
                  hvac: "{{ _hvac_block | from_json }}"
                  thermal: "{{ _thermal_block | from_json }}"
                  water: "{{ _water_block | from_json }}"
                  gas: "{{ _gas_block | from_json }}"
                  mechanical: "{{ _mechanical_block | from_json }}"
                  utilities: "{{ _util_raw }}"
                warnings: []
                next_actions: []
                caller_token: "{{ _caller_token }}"
          - stop: overview
            response_variable: _result

      # ── ELECTRIC ──────────────────────────────────────────────────────────
      - if: "{{ _mode == 'electric' }}"
        then:
          - variables:
              _panel_status: >-
                {%- set _dsm = _main_panel_sensors | select('search', 'dsm_state$') | list | first | default('') -%}
                {%- set _relay = _main_panel_sensors | select('search', 'main_relay_state') | list | first | default('') -%}
                {{
                  {
                    'dsm_state': states(_dsm) if _dsm != '' else none,
                    'relay_state': states(_relay) if _relay != '' else none
                  }
                }}
          # 2026-08-25 (household: "suppressor present t/f, generator t/f,
          # battery t/f, solar t/f") -- all human-confirmed (see label
          # creation note on _panel_status above the fold: SPAN's own
          # pv_power/battery sensors exist as always-on stubs regardless
          # of real hardware, so entity-existence would lie here). Fails
          # soft to false + empty entity list, never errors, if nothing's
          # tagged yet.
          - variables:
              _panel_features:
                surge_suppressor_present: "{{ label_entities('surge_suppression') | count > 0 }}"
                surge_suppressor_entities: "{{ label_entities('surge_suppression') | list }}"
                generator_present: "{{ label_entities('zen_plant_generator') | count > 0 }}"
                generator_entities: "{{ label_entities('zen_plant_generator') | list }}"
                battery_present: "{{ label_entities('zen_plant_battery') | count > 0 }}"
                battery_entities: "{{ label_entities('zen_plant_battery') | list }}"
                solar_present: "{{ label_entities('zen_plant_solar') | count > 0 }}"
                solar_entities: "{{ label_entities('zen_plant_solar') | list }}"
          - variables:
              _result:
                status: ok
                mode: electric
                summary: >-
                  {%- set _b = _elec_block | from_json -%}
                  {{ {'available': _b.get('available', false), 'live_kw': _b.get('live_power_kw'), 'daily_kwh': _b.get('daily_kwh'), 'tariff_usd_kwh': _b.get('tariff_usd_kwh')} }}
                entities: >-
                  {%- set _b = _elec_block | from_json -%}
                  {{ _b | combine({'panel_status': _panel_status, 'panel_features': _panel_features, 'utility': _util_raw.get('electric', {})}) }}
                warnings: []
                next_actions: []
                caller_token: "{{ _caller_token }}"
          - stop: electric
            response_variable: _result

      # ── HVAC ──────────────────────────────────────────────────────────────
      - if: "{{ _mode == 'hvac' }}"
        then:
          - variables:
              _result:
                status: ok
                mode: hvac
                summary: >-
                  {%- set _b = _hvac_block | from_json -%}
                  {{ {'available': _b.get('available', false), 'unit_count': _b.get('count', 0)} }}
                entities: >-
                  {%- set _b = _hvac_block | from_json -%}
                  {{ _b | combine({'utility': _util_raw.get('gas', {})}) }}
                warnings: []
                next_actions: []
                caller_token: "{{ _caller_token }}"
          - stop: hvac
            response_variable: _result

      # ── WATER ─────────────────────────────────────────────────────────────
      - if: "{{ _mode == 'water' }}"
        then:
          - variables:
              _droplet_reset: >-
                {%- if _water_eid != '' -%}
                  {{ state_attr(_water_eid, 'last_reset') | default(none, true) }}
                {%- else -%}{{ none }}{%- endif -%}
          - variables:
              _result:
                status: ok
                mode: water
                summary: >-
                  {%- set _b = _water_block | from_json -%}
                  {{ {'available': _b.get('available', false), 'usage_gal': _b.get('usage_gal'), 'rate_per_1000gal_usd': _b.get('rate_per_1000gal_usd')} }}
                entities: >-
                  {%- set _b = _water_block | from_json -%}
                  {{ _b | combine({'usage_since': _droplet_reset, 'utility': _util_raw.get('water', {})}) }}
                warnings: []
                next_actions: []
                caller_token: "{{ _caller_token }}"
          - stop: water
            response_variable: _result

      # ── GAS ───────────────────────────────────────────────────────────────
      - if: "{{ _mode == 'gas' }}"
        then:
          - variables:
              _result:
                status: ok
                mode: gas
                summary: >-
                  {%- set _b = _gas_block | from_json -%}
                  {{ {'available': _b.get('available', false), 'live_therms': _b.get('live_therms')} }}
                entities: >-
                  {%- set _b = _gas_block | from_json -%}
                  {{ _b | combine({'utility': _util_raw.get('gas', {})}) }}
                warnings: []
                next_actions: []
                caller_token: "{{ _caller_token }}"
          - stop: gas
            response_variable: _result

      # ── MECHANICAL ────────────────────────────────────────────────────────
      - if: "{{ _mode == 'mechanical' }}"
        then:
          # 2026-08-26 (household: "tools explain themselves and reveal JIT
          # instructions and breadcrumbs... water is in plant, pops a
          # light on leak, oh hai you can autoclose, wanna, prob good
          # idea"). A caller shouldn't need prior knowledge that
          # leak_auto_shutoff_enable exists to be told about it -- if
          # this mode's own leak_sensors data shows anything wet, the
          # response itself carries the breadcrumb. Phrasing depends on
          # whether auto-shutoff is already on (informational) or still
          # off (an actual suggested next action).
          - variables:
              _mech_leak_wet_names: >-
                {%- set _b = _mechanical_block | from_json -%}
                {%- set _lk = _b.get('water_management', {}) or {} -%}
                {%- set _rows = _lk.get('leak_sensors', []) or [] -%}
                {{ _rows | selectattr('wet', 'eq', true) | map(attribute='name') | list }}
              _mech_shutoff_enabled: >-
                {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                {%- set _raw = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'plant_auto_shutoff_config') if _hh_cabinet != '' else none -%}
                {%- set _cfg = (_raw | from_json) if _raw not in [none, ''] else {} -%}
                {{ ((_cfg.enabled | default(false)) if _cfg is mapping else false) | trim | lower == 'true' }}
          - variables:
              _result:
                status: ok
                mode: mechanical
                summary: >-
                  {%- set _b = _mechanical_block | from_json -%}
                  {{ {'available': _b.get('available', false), 'water_heater_ok': _b.get('water_heater') is mapping, 'sump_ok': _b.get('sump_pump', {}).get('active') is not none} }}
                entities: >-
                  {%- set _b = _mechanical_block | from_json -%}
                  {{ _b | combine({'utility': _util_raw.get('water', {})}) }}
                warnings: >-
                  {{ (['Leak detected: ' ~ (_mech_leak_wet_names | join(', ')) ~ '.'] if (_mech_leak_wet_names | count > 0) else []) }}
                next_actions: >-
                  {{ ([('Auto-shutoff is already enabled — zen_plant_leak_watch will close ' ~ (label_entities('zen_plant_auto_shutoff') | join(', ')) ~ ' automatically.' if _mech_shutoff_enabled else 'Auto-shutoff is OFF. Call zen_dojotools_plant mode=leak_auto_shutoff_enable leak_auto_shutoff_enabled=true to close valves automatically on future leaks, or confirm with the household before closing ' ~ (label_entities('zen_plant_auto_shutoff') | join(', ')) ~ ' now.')] if (_mech_leak_wet_names | count > 0) else []) }}
                caller_token: "{{ _caller_token }}"
          - stop: mechanical
            response_variable: _result

      # ── THERMAL ───────────────────────────────────────────────────────────
      - if: "{{ _mode == 'thermal' }}"
        then:
          - variables:
              _result:
                status: ok
                mode: thermal
                summary: >-
                  {%- set _b = _thermal_block | from_json -%}
                  {{ {'available': _b.get('available', false), 'load_count': _b.get('count', 0)} }}
                entities: "{{ _thermal_block | from_json }}"
                warnings: []
                next_actions: []
                caller_token: "{{ _caller_token }}"
          - stop: thermal
            response_variable: _result

      # ── CIRCUITS ──────────────────────────────────────────────────────────
      - if: "{{ _mode == 'circuits' }}"
        then:
          - variables:
              _circ_limit: "{{ circuit_limit | default(10) | int(10) }}"
              _circ_sort: "{{ sort_by | default('energy') | lower }}"
          - variables:
              _circuits: >-
                {%- if _circ_sort == 'current' -%}
                  {%- set ns = namespace(rows=[]) -%}
                  {%- for eid in _circuit_current_eids -%}
                    {%- set _a = states(eid) | float(-1) -%}
                    {%- if _a >= 0 -%}
                      {%- set _v = state_attr(eid, 'voltage') | default(120, true) | int(120) -%}
                      {%- set _name = state_attr(eid, 'friendly_name') | default(eid, true) -%}
                      {%- set ns.rows = ns.rows + [{'entity_id': eid, 'name': _name, 'current_a': _a, 'voltage': _v, 'est_power_w': (_a * _v) | round(0)}] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ ns.rows | sort(attribute='current_a', reverse=true) | list }}
                {%- else -%}
                  {%- set ns = namespace(rows=[]) -%}
                  {%- for eid in _consumed_energy_sensors -%}
                    {%- set _wh = states(eid) | float(-1) -%}
                    {%- if _wh >= 0 -%}
                      {%- set _name = state_attr(eid, 'friendly_name') | default(eid, true) -%}
                      {%- set ns.rows = ns.rows + [{'entity_id': eid, 'name': _name, 'lifetime_wh': _wh, 'lifetime_kwh': (_wh / 1000) | round(2)}] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ ns.rows | sort(attribute='lifetime_wh', reverse=true) | list }}
                {%- endif -%}
          - variables:
              _result:
                status: ok
                mode: circuits
                summary:
                  total_circuits: "{{ _circuit_current_eids | count if _circ_sort == 'current' else _consumed_energy_sensors | count }}"
                  whole_home_w: "{{ _site_power_w }}"
                  sort_by: "{{ _circ_sort }}"
                  limit: "{{ _circ_limit }}"
                entities:
                  circuits: "{{ _circuits[:_circ_limit] }}"
                warnings: []
                next_actions: []
                caller_token: "{{ _caller_token }}"
          - stop: circuits
            response_variable: _result

      # ── CIRCUIT DRAW ─────────────────────────────────────────────────────
      # 2026-08-25 (household: "we know ohm... 110/220 and how many amps...
      # current and power rating, do a readout of draw and capacity").
      # SPAN already hands over everything needed, no Ohm's-law derivation
      # required: each circuit's current/power sensor carries a real
      # 'voltage' attribute (120 or 240, confirmed live) and a 'tabs'
      # attribute ('tabs [14]' = one tab = single-pole, 'tabs [1:3]' = two
      # tabs = double-pole) -- pole count reads straight off tabs, doesn't
      # need to be inferred from voltage. Breaker rating is a SEPARATE
      # sensor per circuit (not an attribute), paired here by naming
      # convention (<circuit>_current -> <circuit>_breaker_rating), same
      # pattern SPAN uses throughout. FAILS SOFT: no span/no codex-labeled
      # circuits -> empty circuits list + a warning, never an error --
      # this mirrors mode=circuits' own empty-safe shape.
      - if: "{{ _mode == 'circuit_draw' }}"
        then:
          - variables:
              _cd_limit: "{{ circuit_limit | default(25) | int(25) }}"
          - variables:
              _cd_circuits: >-
                {%- set ns = namespace(rows=[]) -%}
                {%- for eid in _circuit_current_eids -%}
                  {%- set _a = states(eid) | float(-1) -%}
                  {%- if _a >= 0 -%}
                    {%- set _rating_eid = eid | replace('_current', '_breaker_rating') -%}
                    {%- set _rating_a = states(_rating_eid) | float(-1) -%}
                    {%- set _v = state_attr(eid, 'voltage') | default(120, true) | int(120) -%}
                    {%- set _tabs = state_attr(eid, 'tabs') | default('', true) -%}
                    {%- set _poles = 2 if ':' in _tabs else (2 if _v >= 240 else 1) -%}
                    {%- set _name = state_attr(eid, 'friendly_name') | default(eid, true) -%}
                    {#- 2026-08-25 (household: "support tagging GFCI/AFCI as
                       confirm... tag the breaker that's the whole-premise
                       surge suppression"). SPAN exposes neither -- these
                       are human-confirmed labels (breaker_gfci/
                       breaker_afci/surge_suppression) read off the
                       circuit's own breaker switch entity, derived by
                       stripping the current sensor's panel-prefix. Fails
                       soft to none/none if the switch can't be matched
                       or carries neither label -- never errors. #}
                    {%- set _core = eid.split('.')[1] | replace('main_panel_nt_2235_c1hxl_', '') | replace('span_sub_panel_', '') | replace('_current', '') -%}
                    {%- set _switch_eid = 'switch.' ~ _core ~ '_breaker' -%}
                    {%- set _switch_exists = states(_switch_eid) not in ['unknown', 'unavailable'] -%}
                    {%- set _sw_labels = labels(_switch_eid) | default([], true) if _switch_exists else [] -%}
                    {%- set _protection = 'gfci' if 'breaker_gfci' in _sw_labels else ('afci' if 'breaker_afci' in _sw_labels else none) -%}
                    {%- set _special = 'surge_suppression' if 'surge_suppression' in _sw_labels else none -%}
                    {%- set _row = {
                        'entity_id': eid,
                        'name': _name,
                        'voltage': _v,
                        'poles': _poles,
                        'draw_a': _a,
                        'draw_w_est': (_a * _v) | round(0),
                        'breaker_switch': _switch_eid if _switch_exists else none,
                        'protection_type': _protection,
                        'special_purpose': _special,
                    } -%}
                    {%- if _rating_a > 0 -%}
                      {%- set _row = dict(_row, **{
                          'breaker_rating_a': _rating_a,
                          'capacity_w_est': (_rating_a * _v) | round(0),
                          'pct_of_capacity': ((_a / _rating_a) * 100) | round(1),
                      }) -%}
                    {%- else -%}
                      {%- set _row = dict(_row, **{
                          'breaker_rating_a': none,
                          'capacity_w_est': none,
                          'pct_of_capacity': none,
                      }) -%}
                    {%- endif -%}
                    {%- set ns.rows = ns.rows + [_row] -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.rows | sort(attribute='pct_of_capacity', reverse=true) | list }}
          - variables:
              _cd_warnings: >-
                {%- set ns = namespace(w=[]) -%}
                {%- if _circuit_current_eids | count == 0 -%}
                  {%- set ns.w = ns.w + ['No sub_panel-labeled circuit current sensors found -- SPAN (or another current-exposing codex) may not be installed, or circuits are not yet labeled. See docs/plugins/span_panel_codex.md setup steps.'] -%}
                {%- endif -%}
                {%- set _missing_rating = _cd_circuits | selectattr('breaker_rating_a', 'none') | list -%}
                {%- if _missing_rating | count > 0 -%}
                  {%- set ns.w = ns.w + [(_missing_rating | count | string) ~ ' circuit(s) have a current reading but no matching breaker_rating sensor found by name -- capacity/pct_of_capacity omitted for those, draw-only.'] -%}
                {%- endif -%}
                {{ ns.w }}
          - variables:
              _result:
                status: ok
                mode: circuit_draw
                summary:
                  total_circuits: "{{ _cd_circuits | count }}"
                  limit: "{{ _cd_limit }}"
                  note: "Voltage/poles come straight from SPAN's own attributes, not derived. GFCI/AFCI protection_type and special_purpose are NOT SPAN-native -- human-confirmed via breaker_gfci/breaker_afci/surge_suppression labels on the breaker switch entity; none until tagged. Tag with zen_dojotools_labels."
                entities:
                  circuits: "{{ _cd_circuits[:_cd_limit] }}"
                warnings: "{{ _cd_warnings }}"
                next_actions: []
                caller_token: "{{ _caller_token }}"
          - stop: circuit_draw
            response_variable: _result

      # ── MANAGED ───────────────────────────────────────────────────────────
      # Label-driven managed-machine view. Any machine bootstrapped via
      # provision_bom is self-describing: products tagged ha_labels, chores
      # tagged homeassistant_area. No machine-specific knowledge needed here.
      - if: "{{ _mode == 'managed' }}"
        then:
          - variables:
              _mgd_labels: "{{ managed_labels | default('', true) | string | trim }}"
              _mgd_cat_raw: {}

          - if: "{{ states('script.zen_dojotools_inventory') not in ['unavailable', 'unknown'] }}"
            then:
              - action: script.zen_dojotools_inventory
                continue_on_error: true
                response_variable: _mgd_cat_raw
                data:
                  mode: catalog_find_by_tag
                  ha_labels: "{{ _mgd_labels }}"

          - variables:
              _mgd_products: >-
                {{ _mgd_cat_raw.get('products', [])
                   if _mgd_cat_raw is mapping and _mgd_cat_raw.get('status') in ['ok', 'success']
                   else [] }}

          # Paginated Grocy location fetch — resolve location_id → HA area
          # (walk parent chain — any stock in a location parented under an HA area belongs to that area)
          - variables:
              _mgd_loc_page_size: 200
              _mgd_loc_offset: 0
              _mgd_all_locs: []
              _mgd_loc_page_done: false
          - if: "{{ states('script.zen_sutra_grocy') not in ['unavailable', 'unknown'] }}"
            then:
              - repeat:
                  until: "{{ _mgd_loc_page_done or _mgd_loc_offset >= 10000 }}"
                  sequence:
                    - action: script.zen_sutra_grocy
                      continue_on_error: true
                      response_variable: _mgd_locs_page_raw
                      data:
                        action_type: read
                        endpoint: "/objects/locations?limit={{ _mgd_loc_page_size }}&offset={{ _mgd_loc_offset }}"
                    - variables:
                        _mgd_locs_page: >-
                          {%- set _r = (_mgd_locs_page_raw.get('result', {}) if _mgd_locs_page_raw is mapping else {}) -%}
                          {%- set _c = _r.get('content', []) if _r is mapping else [] -%}
                          {{ _c if _c is sequence else [] }}
                    - variables:
                        _mgd_all_locs: "{{ _mgd_all_locs + _mgd_locs_page }}"
                        _mgd_loc_page_done: "{{ _mgd_locs_page | length < _mgd_loc_page_size }}"
                        _mgd_loc_offset: "{{ _mgd_loc_offset + _mgd_loc_page_size }}"

          - variables:
              _mgd_loc_map: >-
                {%- set ns = namespace(m={}) -%}
                {%- for loc in _mgd_all_locs -%}
                  {%- set uf = loc.get('userfields', {}) if loc.get('userfields') is mapping else {} -%}
                  {%- set ns.m = ns.m | combine({loc.id | string: {
                    'parent_id': loc.get('parent_id') | string if loc.get('parent_id') is not none else none,
                    'ha_area': uf.get('homeassistant_area', none)
                  }}) -%}
                {%- endfor -%}
                {{ ns.m }}

          - variables:
              _mgd_loc_area: >-
                {%- set ns = namespace(m={}) -%}
                {%- for lid, ld in _mgd_loc_map.items() -%}
                  {%- set rns = namespace(area=ld.get('ha_area'), cur=lid) -%}
                  {%- for _ in range(6) -%}
                    {%- if rns.area is none -%}
                      {%- set _pid = _mgd_loc_map.get(rns.cur, {}).get('parent_id') -%}
                      {%- if _pid is not none and _pid not in ['', 'None', 'none'] -%}
                        {%- set rns.cur = _pid -%}
                        {%- set rns.area = _mgd_loc_map.get(rns.cur, {}).get('ha_area') -%}
                      {%- endif -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {%- set ns.m = ns.m | combine({lid: rns.area}) -%}
                {%- endfor -%}
                {{ ns.m }}

          - variables:
              _mgd_groups: >-
                {%- set ns = namespace(groups={}) -%}
                {%- for p in _mgd_products -%}
                  {%- set _lbls = p.get('ha_labels', '') | string | trim -%}
                  {%- set _root = (_lbls.split(',') | first | trim) if _lbls != '' else 'unknown' -%}
                  {%- set _cur = ns.groups.get(_root, []) -%}
                  {%- set ns.groups = ns.groups | combine({_root: _cur + [p]}) -%}
                {%- endfor -%}
                {{ ns.groups }}
              _mgd_areas: >-
                {%- set ns = namespace(areas=[]) -%}
                {%- for p in _mgd_products -%}
                  {%- set _lid = p.get('location_id') | string | trim -%}
                  {%- set _a = _mgd_loc_area.get(_lid) if _lid not in ['', 'None', 'none'] else none -%}
                  {%- if _a is not none and _a not in ns.areas -%}
                    {%- set ns.areas = ns.areas + [_a] -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.areas }}

          - variables:
              _mgd_area_briefs: {}

          - if: "{{ _mgd_areas | length > 0 and states('script.zen_dojotools_inventory') not in ['unavailable', 'unknown'] }}"
            then:
              - repeat:
                  for_each: "{{ _mgd_areas }}"
                  sequence:
                    - action: script.zen_dojotools_inventory
                      continue_on_error: true
                      response_variable: _mgd_rb_raw
                      data:
                        mode: room_brief
                        homeassistant_area_id: "{{ repeat.item }}"
                    - variables:
                        _mgd_area_briefs: >-
                          {%- if _mgd_rb_raw is mapping and _mgd_rb_raw.get('status') == 'success' -%}
                            {{ _mgd_area_briefs | combine({repeat.item: _mgd_rb_raw}) }}
                          {%- else -%}{{ _mgd_area_briefs }}{%- endif -%}

          - variables:
              _mgd_machines: >-
                {%- set ns = namespace(machines=[], total_due=0, global_chore_ids=[]) -%}
                {%- for label, prods in _mgd_groups.items() | sort -%}
                  {%- set pa = namespace(areas=[]) -%}
                  {%- for p in prods -%}
                    {%- set _lid = p.get('location_id') | string | trim -%}
                    {%- set _a = _mgd_loc_area.get(_lid) if _lid not in ['', 'None', 'none'] else none -%}
                    {%- if _a is not none and _a not in pa.areas -%}
                      {%- set pa.areas = pa.areas + [_a] -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {%- set cn = namespace(chores=[], seen_ids=[], due=0, items=0, unique=0) -%}
                  {%- for area in pa.areas -%}
                    {%- set _br = _mgd_area_briefs.get(area, none) -%}
                    {%- if _br is mapping -%}
                      {%- for c in (_br.get('chores', []) | list) -%}
                        {%- set _cid = c.chore_id | string -%}
                        {%- if _cid not in cn.seen_ids and _cid not in ns.global_chore_ids -%}
                          {%- set cn.chores = cn.chores + [c] -%}
                          {%- set cn.seen_ids = cn.seen_ids + [_cid] -%}
                          {%- if c.get('is_due', false) -%}{%- set cn.due = cn.due + 1 -%}{%- endif -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {%- set cn.items = cn.items + (_br.get('stock_total_items', 0) | int(0)) -%}
                      {%- set cn.unique = cn.unique + (_br.get('stock_unique_products', 0) | int(0)) -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {%- set ns.global_chore_ids = ns.global_chore_ids + cn.seen_ids -%}
                  {%- set ns.total_due = ns.total_due + cn.due -%}
                  {%- set warn = namespace(w=[]) -%}
                  {%- if area_name(label) | default('', true) | trim != '' -%}
                    {%- set warn.w = warn.w + [{'type': 'root_label_is_area', 'message': 'Label \'' ~ label ~ '\' resolves to an HA area_id — root label must be a machine type, not a room.', 'next_call': 'zen_dojotools_inventory mode=products_tag product_id=<id> ha_labels=<machine_type>,<machine_type>_part — retag all ' ~ (prods | length | string) ~ ' product(s) with a machine-type root label, then re-run managed.'}] -%}
                  {%- endif -%}
                  {%- if pa.areas | length == 0 and prods | length > 0 -%}
                    {%- set _loc_ids = prods | map(attribute='location_id') | unique | reject('none') | list -%}
                    {%- set _loc_str = _loc_ids | join(', ') -%}
                    {%- set _fix_calls = _loc_ids | map('string') | map('regex_replace', '^(.+)$', 'zen_dojotools_inventory mode=locations_metadata_set location_id=\\1 area_id=<ha_area_id>') | list | join(' ; ') -%}
                    {%- set warn.w = warn.w + [{'type': 'no_area_resolved', 'message': 'All ' ~ (prods | length | string) ~ ' product(s) at Grocy location(s) [' ~ _loc_str ~ '] have no homeassistant_area set — chores and stock are invisible.', 'next_call': _fix_calls ~ ' — replace <ha_area_id> with the HA area slug (e.g. front_hall). Child locations inherit automatically. Re-run managed to verify.'}] -%}
                  {%- endif -%}
                  {%- set ns.machines = ns.machines + [{'label': label, 'product_count': prods | length, 'products': prods, 'chores_due': cn.due, 'chores': cn.chores, 'stock_total_items': cn.items, 'stock_unique_products': cn.unique, 'schema_warnings': warn.w}] -%}
                {%- endfor -%}
                {{ {'machines': ns.machines, 'total_due': ns.total_due} }}

          - variables:
              _result:
                status: ok
                mode: managed
                labels_filter: "{{ _mgd_labels if _mgd_labels != '' else none }}"
                summary:
                  machine_count: "{{ _mgd_machines.machines | length }}"
                  total_chores_due: "{{ _mgd_machines.total_due }}"
                  chores_due_count: "{{ _mgd_machines.machines | selectattr('chores_due', 'gt', 0) | list | count }}"
                entities:
                  machines: >-
                    {{ _mgd_machines.machines | map('combine', {'schema_warnings': []}) | list }}
                warnings: >-
                  {%- set ns = namespace(items=[]) -%}
                  {%- for m in _mgd_machines.machines -%}
                    {%- for w in m.get('schema_warnings', []) -%}
                      {%- set ns.items = ns.items + [{'machine': m.label, 'type': w.get('type'), 'message': w.get('message', '')}] -%}
                    {%- endfor -%}
                    {%- if m.get('chores') | length > 0 and m.get('product_count', 0) > 0 -%}
                      {%- set _ratio = (m.get('chores') | length) / m.get('product_count', 1) -%}
                      {%- if _ratio > 5 -%}
                        {%- set _root = m.label -%}
                        {%- set _own_ns = namespace(own=[], foreign=[]) -%}
                        {%- for c in m.get('chores', []) -%}
                          {%- if (_root | lower | replace('_', ' ')) in (c.name | lower) -%}
                            {%- set _own_ns.own = _own_ns.own + [c.name] -%}
                          {%- else -%}
                            {%- set _own_ns.foreign = _own_ns.foreign + [c.name] -%}
                          {%- endif -%}
                        {%- endfor -%}
                        {%- set _foreign_preview = _own_ns.foreign[:5] | join('; ') ~ ('...' if _own_ns.foreign | length > 5 else '') -%}
                        {%- set ns.items = ns.items + [{'machine': m.label, 'type': 'chore_bleed_likely', 'message': (m.get('chores') | length | string) ~ ' chores claimed, but ~' ~ (_own_ns.foreign | length | string) ~ ' appear unrelated to ' ~ _root ~ ' (sample: ' ~ _foreign_preview ~ '). Fix: provision_bom each unmapped machine with its own ha_labels root.'}] -%}
                      {%- endif -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ ns.items }}
                next_actions: >-
                  {%- set ns = namespace(items=[]) -%}
                  {%- for m in _mgd_machines.machines -%}
                    {%- for w in m.get('schema_warnings', []) -%}
                      {%- if w.get('next_call') -%}
                        {%- set ns.items = ns.items + [{'machine': m.label, 'call': w.get('next_call'), 'reason': w.get('type', '')}] -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {%- if m.get('chores') | length > 0 and m.get('product_count', 0) > 0 -%}
                      {%- set _ratio = (m.get('chores') | length) / m.get('product_count', 1) -%}
                      {%- if _ratio > 5 -%}
                        {%- set ns.items = ns.items + [{'machine': m.label, 'call': 'zen_dojotools_inventory mode=provision_bom — provision each unmapped machine in this area with its own ha_labels root', 'reason': 'chore_bleed_likely'}] -%}
                      {%- endif -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ ns.items }}
                caller_token: "{{ _caller_token }}"
          - stop: managed
            response_variable: _result

      # ── FALLTHROUGH ───────────────────────────────────────────────────────
      - variables:
          _result:
            status: error
            message: "Unknown mode '{{ _mode }}'. Use overview, electric, hvac, water, gas, mechanical, thermal, circuits, circuit_draw, managed, validate, label_suggest, ignore, unignore, leak_auto_shutoff_enable, tool_manifest, help."
            caller_token: "{{ _caller_token }}"
      - stop: unknown mode
        response_variable: _result

###############################################################################
# zen_plant_leak_watch (2026-08-24, household: "generic close tagged valves on
# leak detection default off bit big glaring offer on detect")
#
# House-wide, one automation, no per-room wiring -- the label already
# resolves both sides. Confirmed against HA's own trigger reference (not
# guessed): `moisture.detected` is a real device-class purpose trigger,
# same proven pattern as door.opened/window.opened/garage_door.opened
# already live elsewhere in this codebase.
#
# GATE (leak_auto_shutoff_enable, plant.yaml mode above), default OFF:
#   - enabled=true:  close every zen_plant_auto_shutoff-labeled switch
#     immediately, no asking. Fires an FYI alert (no ack needed) after.
#   - enabled=false: asks live, via the SAME chokepoint every other
#     mandatory-ack flow in this codebase uses tonight
#     (zen_dojotools_identity mode=request_live_ack, breakthrough=true --
#     this is exactly the "security or life related" bypass class that
#     must never be suppressed by the sleep gate). TWO independent
#     questions, asked as two separate sequential ack calls in the same
#     automation run (household: "invite two answers"):
#       1. Close the valve(s) now? -- acted on immediately if yes.
#       2. Auto-close on any future leak, no asking? -- if yes, flips the
#          gate on for next time via the same cabinet write mode=
#          leak_auto_shutoff_enable uses.
#     These are genuinely independent: yes/no, no/yes, yes/yes, no/no are
#     all valid, real combinations -- e.g. "handle this one myself, but
#     yes, automate it from here on."
###############################################################################
automation:
  - alias: "ZenOS -- Plant Leak Watch"
    id: zen_plant_leak_watch
    mode: queued
    max: 5
    triggers:
      - trigger: moisture.detected
        target:
          label_id: zen_plant_leak_sensor
    conditions: []
    actions:
      - variables:
          _hh_cabinet: "{{ states('sensor.zen_default_household_cabinet_resolved') }}"
          _plw_leak_ents: "{{ label_entities('zen_plant_leak_sensor') }}"
          _plw_shutoff_all: "{{ label_entities('zen_plant_auto_shutoff') }}"
          _plw_shutoff_switches: "{{ _plw_shutoff_all | select('match', '^switch\\.') | list }}"
          _plw_source: "{{ trigger.entity_id | default('unknown', true) }}"
      - if: "{{ _plw_shutoff_switches | count == 0 }}"
        then:
          - stop: no actuatable shutoff switch labeled -- nothing this automation can do
      - variables:
          _plw_gate_enabled: >-
            {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
            {%- set _raw = CABS.cabinet_drawer_value_mounted(_hh_cabinet, 'plant_auto_shutoff_config') if _hh_cabinet != '' else none -%}
            {%- set _cfg = (_raw | from_json) if _raw not in [none, ''] else {} -%}
            {{ (_cfg.enabled | default(false)) if _cfg is mapping else false }}
      - if: "{{ _plw_gate_enabled | trim | lower == 'true' }}"
        then:
          - action: homeassistant.turn_off
            target:
              entity_id: "{{ _plw_shutoff_switches }}"
          - action: script.zen_dojotools_alertmanager
            continue_on_error: true
            data:
              mode: fire
              alert_key: "leak_auto_shutoff_{{ now().timestamp() | int }}"
              severity: critical
              breakthrough: true
              message: "Leak detected ({{ _plw_source }}) -- auto-shutoff closed the water valve(s) automatically: {{ _plw_shutoff_switches | join(', ') }}."
              notify_target: postman
        else:
          - action: script.zen_dojotools_identity
            response_variable: _plw_ack1
            continue_on_error: true
            data:
              mode: request_live_ack
              ack_message: >-
                Leak detected ({{ _plw_source }}). Close the water valve(s)
                now? ({{ _plw_shutoff_switches | join(', ') }})
              ack_max_wait_seconds: 90
              ack_poll_interval_seconds: 15
          - if: "{{ _plw_ack1 is mapping and _plw_ack1.get('approved', false) }}"
            then:
              - action: homeassistant.turn_off
                target:
                  entity_id: "{{ _plw_shutoff_switches }}"
          - action: script.zen_dojotools_identity
            response_variable: _plw_ack2
            continue_on_error: true
            data:
              mode: request_live_ack
              ack_message: "Want future leaks auto-closed like this without asking each time?"
              ack_max_wait_seconds: 90
              ack_poll_interval_seconds: 15
          - if: "{{ _plw_ack2 is mapping and _plw_ack2.get('approved', false) }}"
            then:
              - action: script.zen_dojotools_filecabinet
                data:
                  action_type: >-
                    {%- set _cv=state_attr(_hh_cabinet,'variables')|default({},true) -%}
                    {{ 'update' if _cv.get('plant_auto_shutoff_config',none) is not none else 'create' }}
                  key: plant_auto_shutoff_config
                  volume_entity_id: "{{ _hh_cabinet }}"
                  value: >-
                    {{ {'enabled': true, 'updated_at': now().isoformat(), 'source': 'zen_plant_leak_watch_live_offer'} | tojson }}
