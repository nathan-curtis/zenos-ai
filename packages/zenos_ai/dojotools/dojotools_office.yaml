###############################################################################
# ZenOS-AI DojoTools: Office (M365)
# Version: 5.1.0
#
# Scripts:
#   zen_dojotools_teams  — M365 Teams CRUD (v4.5.x)
#   zen_dojotools_mail   — M365 Mail CRUD (v4.5.x)
#
# zen_dojotools_todo     — MOVED to dojotools_todo.yaml (2026-05-15)
# zen_dojotools_calendar — MOVED to dojotools_calendar.yaml (2026-05-15)
#
# CONSOLIDATED FROM: dojotools_comms.yaml + dojotools_todo_calendar.yaml (2026-03-06)
# notification_router — retired 2026-07-04, replaced by zen_dojotools_postman
#
# === UAT PASS — 2026-03-06 ===
# zen_dojotools_teams: read action — live Teams chat data + status returned ✓
# zen_dojotools_mail:  help action — full help payload returned clean ✓
# config check — go; restart — clean ✓
###############################################################################

script:
  zen_dojotools_teams:
    sequence:
    - if: "{{ (mode | default('') | lower) == 'tool_manifest' }}"
      then:
      - variables:
          result: >-
            {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
            {{ MF.tool_manifest(
                tool='zen_dojotools_teams',
                display_name='Teams',
                tier='dojotools',
                version='1.0.0',
                health={'configured': true, 'status': 'ok', 'notes': []},
                required_labels=['dojotools'],
                optional_labels=['teams', 'm365'],
                consumes=['teams_channel'],
                returns=['teams_message'],
                icon='mdi:microsoft-teams',
                color='blue',
                stripe=3,
                impact='soft',
                mcp_exposed=true,

                caller_token=caller_token | default('')
            ) | from_json }}
      - stop: tool_manifest
        response_variable: result
    # --------------------------------------------------------------
    # Always normalize User/AI inputs so we don't have to react JIT
    # --------------------------------------------------------------
    - variables:
        caller_token: "{{- caller_token | default('') -}}"

    - variables:
        # ms365_teams integration prefixes these with the connected account's
        # display name (default "homeassistant"), so the entity_id is never
        # portable across installs — resolve via the 'teams' label + the
        # integration's fixed _chat/_status suffix instead of hardcoding.
        chat_sensor: >-
          {{ label_entities('teams') | select('match', 'sensor\\..*_chat$') | list | first | default('') }}
        teams_status_sensor: >-
          {{ label_entities('teams') | select('match', 'sensor\\..*_status$') | list | first | default('') }}
        # Self-diagnosis: scan ALL sensors (ignoring the label) for the
        # integration's fixed suffix, so an unconfigured/mislabeled setup can
        # name the exact fix instead of pointing at a generic instruction.
        _chat_candidates: >-
          {{ states.sensor | map(attribute='entity_id') | select('match', '.*_chat$') | list }}
        _status_candidates: >-
          {{ states.sensor | map(attribute='entity_id') | select('match', '.*_status$') | list }}
        _chat_fix_hint: >-
          {%- if _chat_candidates | length > 0 -%}
            Found {{ _chat_candidates | join(', ') }} but none carry the 'teams' label — fix it yourself by calling
            zen_dojotools_labels with {"mode": "tag", "target_entities": ["{{ _chat_candidates[0] }}"], "label_list": ["teams"]}.
          {%- else -%}
            No sensor.*_chat entity exists at all — the ms365_teams integration is likely not installed/configured on this instance.
          {%- endif -%}
        _status_fix_hint: >-
          {%- if _status_candidates | length > 0 -%}
            Found {{ _status_candidates | join(', ') }} but none carry the 'teams' label — fix it yourself by calling
            zen_dojotools_labels with {"mode": "tag", "target_entities": ["{{ _status_candidates[0] }}"], "label_list": ["teams"]}.
          {%- else -%}
            No sensor.*_status entity exists at all — the ms365_teams integration is likely not installed/configured on this instance.
          {%- endif -%}
        teams_status: '{{ states(teams_status_sensor) | default('''') }}'
        chat_entity_exists: '{{ chat_sensor != '''' and states(chat_sensor) not in [''unavailable'', ''unknown'', ''none'', ''''] }}'
        action_type: '{{ action_type | default(''read'') }}'
        chat_data: '{{ state_attr(chat_sensor, ''data'') or {} }}'
        my_chat_id: '{{ states(''input_text.zen_teams_chat_id'') | default('''') | trim }}'
        my_chat_display_name: '{{ states(''input_text.zen_teams_display_name'') | default(''Home Assistant'') | trim }}'
        filtered_chat_data: "{{ chat_data | rejectattr('chat_id','eq', my_chat_id )
          \n             | list\n             | first\n             | default({}) }}"
        partner_chat_id: "{{ chat_data | map(attribute='chat_id')\n             | reject(
          'eq', my_chat_id ) \n             | list\n             | first\n             | default('') }}"
        chat_id: '{{ chat_id | default('''') }}'
        message: '{{ message | default('''') }}'
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ action_type == ''help'' or action_type not in [''send'',''read'',''set'']
            }}'
        sequence:
        - variables:
            help_response: "{{\n  {\n    \"status\": \"info\",\n    \"version\": \"4.5.x\",\n
              \   \"message\": \"Zen DojoTool for M365 Teams. Use to 'send' a message
              or 'read' for latest chat message. Update/delete not supported.\",\n    \"actions\":
              {\n      \"read\": \"Shows latest messages from a Teams chat, your online
              status and your current chat partner's ID.\",\n      \"send\": \"Send
              message(s). Needs chat_id and items or message.\",\n      \"help\": \"Returns
              this help text.\",\n      \"set\": {\n        \"description\": \"Sets
              Teams Chat Status. These combinations are allowed\",\n        \"expiration\":
              \"The expiration of the app presence session. The value is represented
              in ISO 8601 format for duration.\",\n        \"availability\": [ \"Available\",
              \"Busy\", \"Away\", \"DoNotDisturb\" ],\n        \"activity\": {\n          \"Available\":
              \"Available\",\n          \"InACall\": \"Busy\",\n          \"InAConferenceCall\":
              \"Busy\",\n          \"Away\": \"Away\",\n          \"Presenting\": \"DoNotDisturb\"\n
              \       }\n      },\n    },\n    \"fields\": {\n      \"chat_id\": \"Teams
              chat ID (from Graph API or sensor).\",\n      \"items\": \"List of messages
              to send (create).\",\n      \"message\": \"Message text (create only).\",\n
              \     \"availability\": \"Online Status.\",\n      \"activity\": \"Extended
              reason for status.\",\n      \"expiration\": \"Retain status until (default
              5 min.)\"\n    },\n    \"notes\": [\n      \"Use read to view the latest message.\",\n      \"Update and delete not supported by integration.\"\n    ],\n    \"setup\": {\n      \"input_text.zen_teams_chat_id\": \"Your Teams chat thread ID. To find it: run action_type: read — the response includes partner_chat_id pulled from sensor.homeassistant_chat. Copy that value into input_text.zen_teams_chat_id in HA Helpers. You can also find it in Developer Tools > States under sensor.homeassistant_chat attributes.\"\n    }\n  } | tojson\n}}"
        - variables:
            help_response: "{{ (help_response if help_response is mapping else (help_response | from_json)) | combine({'caller_token': caller_token | default('')}) | tojson }}"
        - stop: Pass response variables back to LLM
          response_variable: help_response
        - set_conversation_response: '{{ help_response }}'
        alias: help
      - conditions:
        - condition: template
          value_template: '{{ action_type == ''read'' and not chat_entity_exists }}'
        sequence:
        - variables:
            not_configured_response: "{{ {'status': 'error', 'error_message': 'No Teams chat sensor resolved. ' ~ _chat_fix_hint, 'caller_token': caller_token | default('')} }}"
        - stop: Pass response variables back to LLM
          response_variable: not_configured_response
        - set_conversation_response: '{{ not_configured_response }}'
        alias: read_not_configured
      - conditions:
        - condition: template
          value_template: '{{ action_type == ''read'' and chat_entity_exists }}'
        sequence:
        - variables:
            from_display_name: '{{state_attr(chat_sensor,''from_display_name'') | default('''')
              }}'
            content: '{{state_attr(chat_sensor,''content'') | default('''') }}'
            importance: '{{state_attr(chat_sensor,''importance'') | default('''') }}'
            last_updated: '{{ states[chat_sensor][''last_updated''] |as_datetime | as_local
              | string | default('''') }}'
            last_chat: "{{ {'last_updated': last_updated, 'from_display_name': from_display_name,
              'partner_chat_id': partner_chat_id | default(''), 'data': filtered_chat_data
              | default({}), 'content': content, 'importance': importance} }}"
            result: "{{ {'status': 'success', 'action_type': 'read', 'my_chat_display_name':
              my_chat_display_name, 'teams_status': teams_status | default(''), 'last_chat':
              last_chat, 'caller_token': caller_token | default('')} }}"
        - stop: Pass response variables back to LLM
          response_variable: result
        - set_conversation_response: '{{ result }}'
        alias: read
      - conditions:
        - condition: template
          value_template: '{{ action_type == ''send'' }}'
        sequence:
        - if:
          - condition: template
            value_template: '{{ chat_sensor == "" }}'
          then:
          - variables:
              error_not_configured: "{{ {'status': 'error', 'error_message': 'No Teams chat sensor resolved. ' ~ _chat_fix_hint, 'caller_token': caller_token | default('')} }}"
          - stop: Pass response variables back to LLM
            response_variable: error_not_configured
          - set_conversation_response: '{{ error_not_configured }}'
        - if:
          - condition: template
            value_template: '{{ ( chat_id and ( chat_id != "") and ( chat_id != my_chat_id
              ) ) and ( message and ( message !="" ) ) }}'
          then:
          - data:
              chat_id: '{{ chat_id }}'
              message: '{{ message }}'
              content_type: text
            action: ms365_teams.send_chat_message
            target:
              entity_id: "{{ chat_sensor }}"
          - variables:
              send_response: "{{ {'status': 'success', 'action_type': 'send', 'chat_id':
                chat_id, 'message': message, 'caller_token': caller_token | default('')}
                }}"
          - stop: Pass response variables back to LLM
            response_variable: send_response
          - set_conversation_response: '{{ send_response }}'
          else:
          - variables:
              error_no_chat_id: "{{ {'status': 'error', 'error_message': 'Create / Send
                requires valid Chat ID that is not your own and Message.', 'chat_id':
                chat_id | default(''), 'message': message | default(''), 'caller_token':
                caller_token | default('')} }}"
          - stop: Pass response variables back to LLM
            response_variable: error_no_chat_id
          - set_conversation_response: '{{ unsupported_response }}'
        alias: send
      - conditions:
        - condition: template
          value_template: '{{ action_type == ''set'' }}'
        sequence:
        - variables:
            availability: '{{ availability | default(''Available'') }}'
            activity: "{%- set test_activity = activity| default('Available') -%}\n{%-
              if availability == 'Available' -%}\n    {%- set test_activity = 'Available'
              -%}\n{%- elif availability == 'Busy' -%}\n  {%- if activity == 'InACall'
              -%}\n    {%- set test_activity = 'InACall' -%}\n  {%- else -%}\n    {%-
              set test_activity = 'InAConferenceCall' -%}\n  {%- endif -%}\n{%- elif
              availability == 'Away' -%}\n    {%- set test_activity = 'Away' -%}\n{%-
              elif availability == 'DoNotDisturb' -%}\n    {%- set test_activity = 'Presenting'
              -%}\n{%- else -%}\n  {%- set test_activity = 'Away' -%}\n{%- endif -%}\n{{test_activity}}"
            expiration: '{{ expiration | default(''PT5M'') }}'
            data: "{\n  \"availability\": \"{{ availability }}\",\n  \"activity\": \"{{
              activity }}\",\n  \"expiration_duration\": \"{{ expiration }}\"\n}"
        - if:
          - condition: template
            value_template: '{{ teams_status_sensor == "" }}'
          then:
          - variables:
              error_not_configured: "{{ {'status': 'error', 'error_message': 'No Teams status sensor resolved. ' ~ _status_fix_hint, 'caller_token': caller_token | default('')} }}"
          - stop: Pass response variables back to LLM
            response_variable: error_not_configured
          - set_conversation_response: '{{ error_not_configured }}'
        - action: ms365_teams.update_user_status
          target:
            entity_id: "{{ teams_status_sensor }}"
          data: '{{ data }}'
        - variables:
            result: "{{ {'status': 'success', 'action_type': 'set', 'availability': availability,
              'activity': activity, 'expiration': expiration, 'caller_token': caller_token
              | default('')} }}"
        - stop: Pass response variables back to LLM
          response_variable: result
        - set_conversation_response: '{{ result }}'
        alias: set
      - conditions:
        - condition: template
          value_template: '{{ action_type in [''update'',''delete''] }}'
        sequence:
        - variables:
            unsupported_response: "{{ {'status': 'error', 'message': 'Update/delete not
              supported by Teams integration. Use create (send) or read.', 'caller_token':
              caller_token | default('')} }}"
        - stop: Pass response variables back to LLM
          response_variable: unsupported_response
        - set_conversation_response: '{{ unsupported_response }}'
        alias: unsupported
    - stop: End of script
      response_variable: send_response
    - set_conversation_response: '{{ send_response }}'
    alias: Zen DojoTools Teams
    description: 'Zen DojoTools Teams (1.1.0)

      for MS365-Teams in Home Assistant.

      Send message to an existing chat thread, read latest message, and help. Use Read
      to get the last chat (in-or-outbound), your current Teams status, and your current
      chat partner''s ID

      Follows Zen DojoTools multitool pattern.  Returns all responses as JSON for LLM
      and automations.

      '
    fields:
      mode:
        description: "Pass tool_manifest to get self-description."
        required: false
        selector:
          select:
            options:
              - tool_manifest
      action_type:
        description: '''send'', ''read'', ''set'', ''help'' (Default: read)'
        required: true
        selector:
          select:
            options:
            - read
            - send
            - set
            - help
        default: read
      chat_id:
        description: Outbound Teams Chat ID (For chat_id, use your address book in the
          Dojo or 'partner_chat_id' from read function on this tool...)
        required: false
        selector:
          text:
      message:
        description: Required when Send - Text of the message to send.
        required: false
        selector:
          text:
            multiline: true
      availability:
        selector:
          select:
            options:
            - Available
            - Busy
            - Away
            - DoNotDisturb
        name: Availability
        description: Optional, Used with Set, Teams Availability Status, Defaults to
          'Available' if none provided.
      activity:
        selector:
          select:
            options:
            - Available
            - InACall
            - InAConferenceCall
            - Away
            - Presenting
        name: Activity
        description: Optional, Used with Set, no default, will auto-filter invalid pairings
          with Availability.
      expiration:
        selector:
          text:
        name: expiration
        description: Optional, Used with Set, Define expiration of the presence session.
          Accepts ISO 8601 format for durations. If not provided, a default expiration
          of 5 minutes is applied. Valid duration range is from 5 to 240 minutes (PT5M
          to PT4H).
      caller_token:
        name: Caller Token
        description: Opaque token passed through by the caller for correlation. Not interpreted by this script.
        required: false
        selector:
          text:
    icon: mdi:chat-outline

  zen_dojotools_mail:
    sequence:
    - if: "{{ (mode | default('') | lower) == 'tool_manifest' }}"
      then:
      - variables:
          result: >-
            {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
            {{ MF.tool_manifest(
                tool='zen_dojotools_mail',
                display_name='Mail',
                tier='dojotools',
                version='5.0.0',
                health={'configured': true, 'status': 'ok', 'notes': []},
                required_labels=['dojotools'],
                optional_labels=['e_mail'],
                consumes=['email_address'],
                returns=['mail_result'],
                icon='mdi:email',
                color='blue',
                stripe=3,
                impact='soft',
                mcp_exposed=true,

                caller_token=caller_token | default('')
            ) | from_json }}
      - stop: tool_manifest
        response_variable: result
    # --------------------------------------------------------------
    # Always normalize User/AI inputs so we don't have to react JIT
    # --------------------------------------------------------------
    - variables:
        caller_token: "{{- caller_token | default('') -}}"
    - variables:
        action_type: '{{ action_type | default(''help'') }}'
        folder: '{{ folder | default(''Inbox'') }}'
        valid_folders:
        - Inbox
        - Sent Items
        - Deleted Items
        - Junk Email
        - Outbox
        folder_lookup: '{{ folder if folder in valid_folders else ''Inbox'' }}'
        uid: '{{ uid | default('''') }}'
        to: '{{ to | default('''') }}'
        cc: '{{ cc | default('''') }}'
        bcc: '{{ bcc | default('''') }}'
        subject: '{{ subject | default('''') | trim }}'
        body: '{{ body | default('''') | trim }}'
        query: '{{ query | default('''') }}'
        from_filter: '{{ from | default('''') }}'
        importance: '{{ importance | default(''Normal'') }}'
        content_type: '{{ content_type | default(''Text'') }}'
        mail_domain: '{{ states(''input_text.zen_mail_domain'') | default('''') | trim }}'
        my_address: '{{ states(''input_text.zen_mail_sender'') | default('''') | trim }}'
        reply_to: '{{ reply_to | default( my_address ) }}'
        whitelist_ctrl: '{{ states(''input_text.zen_mail_whitelist'') }}'
        whitelist_missing: '{{ states(''input_text.zen_mail_whitelist'') in [''unavailable'', ''unknown'', ''none'', ''''] }}'
        whitelist_off: '{{ whitelist_ctrl == ''OFF'' }}'
        whitelist_is_wildcard: '{{ whitelist_ctrl.startswith(''*@'') }}'
        whitelist_domain: '{{ whitelist_ctrl[2:] if whitelist_is_wildcard else '''' }}'
        reply_to_valid: '{{ reply_to == '''' or whitelist_off or (whitelist_is_wildcard and reply_to.endswith(''@'' ~ whitelist_domain)) or reply_to == whitelist_ctrl }}'
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ action_type == ''help'' or action_type not in [''list'',''read'',''create'',''delete'',''move'']
            }}'
        sequence:
        - variables:
            help_data: "{{\n  {\n    \"status\": \"info\",\n    \"message\": \"Welcome
              to DojoTools: MS365 Mail (v5.0.0).\",\n    \"actions\": {\n      \"list\":
              \"List messages from sensor.ms365_inbox. Returns count + messages array.
              Optional filters: from (sender substring), query (subject or body substring).\",\n
              \     \"read\": \"Fetch a single message by UID from sensor.ms365_inbox.
              Requires uid. Returns not_found if uid not in current sensor window — run
              list first to obtain valid uids.\",\n      \"create\": \"Send new mail
              (requires: to, subject, body). Optional: cc, bcc, importance, contentType.\",\n
              \     \"delete\": \"[stub] Not yet implemented — MS365 Mail integration
              does not expose a delete service. Returns not_implemented.\",\n      \"move\":
              \"[stub] Not yet implemented — MS365 Mail integration does not expose a
              move service. Returns not_implemented. Will require: uid, folder (destination).\",\n
              \     \"help\": \"Returns this help block.\"\n    },\n    \"fields\": {\n
              \     \"folder\": \"Mail folder name (Inbox, Sent Items, Deleted Items,
              Junk Email, Outbox). Used as destination for move when implemented.\",\n
              \     \"uid\": \"Unique message ID. Required for read, delete, move.\",\n
              \     \"from\": \"Sender filter for list (substring match, case-insensitive).\",\n
              \     \"query\": \"Subject or body search term for list (substring match,
              case-insensitive).\",\n      \"to\": \"Primary recipient(s). Required for
              create.\",\n      \"cc\": \"Carbon copy recipient(s). Optional.\",\n      \"bcc\":
              \"Blind carbon copy recipient(s). Optional.\",\n      \"subject\": \"Message
              subject. Required for create.\",\n      \"body\": \"Message body. Required
              for create.\",\n      \"contentType\": \"Body format: Text or HTML. Default:
              Text.\",\n      \"importance\": \"Mail priority: Low, Normal, High. Default:
              Normal.\"\n    },\n    \"notes\": [\n      \"list and read operate against
              sensor.ms365_inbox attribute data — no live API call.\",\n      \"UIDs
              are only searchable within the current sensor window.\",\n      \"delete
              and move are stubbed — returns not_implemented until MS365 integration adds
              the services.\",\n      \"create is whitelist-gated. Set input_text.zen_mail_whitelist:
              OFF (unrestricted), *@domain.com, or exact address.\"\n    ],\n    \"setup\":
              {\n      \"input_text.zen_mail_sender\": \"Send-from address.\",\n      \"input_text.zen_mail_domain\":
              \"Your email domain for wildcard matching.\",\n      \"input_text.zen_mail_whitelist\":
              \"Whitelist mode: OFF / *@domain.com / exact address.\"\n    },\n    \"examples\":
              [\n      { \"action_type\": \"list\" },\n      { \"action_type\": \"list\",
              \"from\": \"boss@example.com\" },\n      { \"action_type\": \"list\", \"query\":
              \"invoice\" },\n      { \"action_type\": \"read\", \"uid\": \"AAMkAG...==\"
              },\n      { \"action_type\": \"create\", \"to\": \"someone@example.com\",
              \"subject\": \"Ping\", \"body\": \"Hello from the dojo.\" }\n    ]\n  }
              | tojson\n}}"
        - variables:
            help_data: "{{ (help_data if help_data is mapping else (help_data | from_json)) | combine({'caller_token': caller_token | default('')}) | tojson }}"
        - stop: Pass response variables back to LLM
          response_variable: help_data
          enabled: true
        - set_conversation_response: '{{ help_data }}'
        alias: return help for mail CRUD controller
      - conditions:
        - condition: template
          value_template: '{{ action_type == ''list'' }}'
        sequence:
        - variables:
            _from_filter_lc: '{{ from_filter | lower | trim }}'
            _query_lc: '{{ query | lower | trim }}'
        - variables:
            _messages: >-
              {%- set ns = namespace(items=[]) -%}
              {%- for mailbox in expand('sensor.ms365_inbox') -%}
                {%- for m in mailbox.attributes.data -%}
                  {%- set _sender = m.sender | default('') | lower -%}
                  {%- set _subj   = m.subject | default('') | lower -%}
                  {%- set _body   = m.body | default('') | lower -%}
                  {%- set _from_ok = _from_filter_lc == '' or _from_filter_lc in _sender -%}
                  {%- set _query_ok = _query_lc == '' or _query_lc in _subj or _query_lc in _body -%}
                  {%- if _from_ok and _query_ok -%}
                    {%- set ns.items = ns.items + [{
                      'uid':             m.uid | default(''),
                      'subject':         m.subject | default(''),
                      'received':        m.received | as_datetime() | as_local | string,
                      'from':            m.sender | default(''),
                      'to':              m.to | default([]),
                      'cc':              m.cc | default([]),
                      'is_read':         m.is_read | default(false),
                      'has_attachments': m.has_attachments | default(false),
                      'flag':            m.flag | default({})
                    }] -%}
                  {%- endif -%}
                {%- endfor -%}
              {%- endfor -%}
              {{ ns.items }}
        - variables:
            final_response: >-
              {{ {
                'status': 'success',
                'count': _messages | length,
                'filters': {
                  'from': from_filter | default(''),
                  'query': query | default('')
                },
                'messages': _messages,
                'caller_token': caller_token | default('')
              } }}
        - stop: Pass response variables back to LLM
          response_variable: final_response
          enabled: true
        - set_conversation_response: '{{ final_response }}'
        alias: list messages in folder
      - conditions:
        - condition: template
          value_template: '{{ action_type == ''read'' and (uid != '''' or subject != '''') }}'
        sequence:
        - variables:
            _subj_lc: '{{ subject | default('''') | lower | trim }}'
            _uid_val: '{{ uid | default('''') | trim }}'
        - variables:
            _matched: >-
              {%- set ns = namespace(msg={}) -%}
              {%- for mailbox in expand('sensor.ms365_inbox') -%}
                {%- for m in mailbox.attributes.data -%}
                  {%- set _uid_match = _uid_val != '' and m.uid | default('') == _uid_val -%}
                  {%- set _subj_match = _subj_lc != '' and _subj_lc in (m.subject | default('') | lower) -%}
                  {%- if (_uid_match or _subj_match) and ns.msg == {} -%}
                    {%- set ns.msg = m -%}
                  {%- endif -%}
                {%- endfor -%}
              {%- endfor -%}
              {{ ns.msg }}
        - variables:
            final_response: >-
              {%- if _matched is mapping and _matched.keys() | list | length > 0 -%}
                {{ {
                  'status': 'success',
                  'mail': {
                    'uid': _matched.get('uid', ''),
                    'subject': _matched.get('subject', ''),
                    'from': _matched.get('sender', ''),
                    'to': _matched.get('to', []),
                    'cc': _matched.get('cc', []),
                    'is_read': _matched.get('is_read', false),
                    'has_attachments': _matched.get('has_attachments', false),
                    'flag': _matched.get('flag', {}),
                    'received': _matched.get('received', ''),
                    'body': _matched.get('body', '')
                  }
                } | tojson }}
              {%- else -%}
                {{ {'status': 'not_found', 'message': 'No message matched uid=\'' ~ _uid_val ~ '\' subject=\'' ~ _subj_lc ~ '\' in sensor.ms365_inbox. Run list first to find a valid subject.'} | tojson }}
              {%- endif -%}
        - variables:
            final_response: "{{ (final_response if final_response is mapping else (final_response | from_json)) | combine({'caller_token': caller_token | default('')}) | tojson }}"
        - stop: Pass response variables back to LLM
          response_variable: final_response
          enabled: true
        - set_conversation_response: '{{ final_response }}'
        alias: read single message by uid or subject
      - conditions:
        - condition: template
          value_template: '{{ action_type == ''create'' and to != '''' and subject !=
            '''' and body != '''' }}'
        sequence:
        - variables:
            to_list: '{{ to.split('','') | map(''trim'') | list }}'
            cc_list: '{{ cc.split('','') | map(''trim'') | list if cc else [] }}'
            bcc_list: '{{ bcc.split('','') | map(''trim'') | list if bcc else [] }}'
            subject: '{{ subject }}'
            body: '{{ body }}'
            importance_norm: '{{ importance | lower | default(''normal'') }}'
            message_is_html: '{{ content_type | lower == ''html'' }}'
            whitelist_ctrl: '{{ whitelist_ctrl | default(''unavailable'') }}'
            whitelist_missing: '{{ whitelist_missing | default(true) }}'
            whitelist_off: '{{ whitelist_off | default(false) }}'
            whitelist_is_wildcard: '{{ whitelist_is_wildcard | default(false) }}'
            whitelist_domain: '{{ whitelist_domain | default('''') }}'
            all_safe: '{{ whitelist_missing or whitelist_off or (whitelist_is_wildcard and (to_list | select(''search'', ''@'' ~ whitelist_domain ~ ''$'') | list | length == to_list | length)) or (not whitelist_is_wildcard and to_list | length == 1 and to_list[0] == whitelist_ctrl) }}'
            mail_data_json: "{{\n  {\n    \"target\": to_list[0] if to_list else \"\",\n
              \   \"sender\": my_address,\n    \"message_is_html\": message_is_html,\n
              \   \"attachments\": [],\n    \"photos\": [],\n    \"zip_attachments\":
              False,\n    \"zip_name\": \"\"\n  }\n  | combine(\n    {\"cc\": cc_list}
              if cc_list else {},\n    {\"bcc\": bcc_list} if bcc_list else {},\n    {\"importance\":
              importance_norm} if importance_norm != \"normal\" else {}\n  )\n  | tojson\n}}"
            mail_data: '{{ mail_data_json | from_json }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ all_safe }}'
            sequence:
            - action: notify.ms365_mail_inbox
              data:
                message: '{{ body }}'
                title: '{{ subject }}'
                data: '{{ mail_data }}'
            - variables:
                final_response: "{{\n  {\n    \"status\": \"success\",\n    \"action_type\": action_type | default(''),\n    \"title\": subject | default(''),\n    \"to\": to_list | default([])\n  } | tojson\n}}"
            - variables:
                final_response: "{{ (final_response if final_response is mapping else (final_response | from_json)) | combine({'caller_token': caller_token | default('')}) | tojson }}"
            - stop: Pass response variables back to LLM
              response_variable: final_response
              enabled: true
            - set_conversation_response: '{{ final_response }}'
          default:
          - variables:
              final_response: "{{\n  {\n    \"status\": \"error\",\n    \"message\": \"Mail send blocked: \" ~ (\"whitelist not configured. Set input_text.zen_mail_whitelist in HA Helpers to: OFF (unrestricted), *@yourdomain.com (domain wildcard), or an exact address.\" if whitelist_missing else \"recipient not permitted by whitelist.\")\n  } | tojson\n}}"
          - variables:
              final_response: "{{ (final_response if final_response is mapping else (final_response | from_json)) | combine({'caller_token': caller_token | default('')}) | tojson }}"
          - stop: Pass response variables back to LLM
            response_variable: final_response
            enabled: true
          - set_conversation_response: '{{ final_response }}'
        alias: send mail
      - conditions:
        - condition: template
          value_template: '{{ action_type == ''delete'' and uid != '''' }}'
        sequence:
        - variables:
            final_response: >-
              {{ {
                'status': 'not_implemented',
                'action_type': 'delete',
                'uid': uid,
                'message': 'delete is not yet implemented — MS365 Mail integration does not currently expose a delete_message service. Stub ready: replace this branch with action: ms365_mail.delete_message when available.'
              } }}
        - variables:
            final_response: "{{ (final_response if final_response is mapping else (final_response | from_json)) | combine({'caller_token': caller_token | default('')}) | tojson }}"
        - stop: Pass response variables back to LLM
          response_variable: final_response
          enabled: true
        - set_conversation_response: '{{ final_response }}'
        alias: delete message stub
      - conditions:
        - condition: template
          value_template: '{{ action_type == ''move'' and uid != '''' }}'
        sequence:
        - variables:
            final_response: >-
              {{ {
                'status': 'not_implemented',
                'action_type': 'move',
                'uid': uid,
                'folder': folder_lookup,
                'message': 'move is not yet implemented — MS365 Mail integration does not currently expose a move_message service. Stub ready: replace this branch with action: ms365_mail.move_message when available.'
              } }}
        - variables:
            final_response: "{{ (final_response if final_response is mapping else (final_response | from_json)) | combine({'caller_token': caller_token | default('')}) | tojson }}"
        - stop: Pass response variables back to LLM
          response_variable: final_response
          enabled: true
        - set_conversation_response: '{{ final_response }}'
        alias: move message stub
      - conditions:
        - condition: template
          value_template: '{{ (action_type == ''read'' and uid == '''' and subject == '''')
            or (action_type in [''delete'',''move''] and uid == '''')
            or (action_type == ''create'' and (to == '''' or subject == '''' or body == '''')) }}'
        sequence:
        - variables:
            final_response: "{{\n  {\n    \"status\": \"error\",\n    \"message\": \"Missing
              required field(s) for \" ~ action_type ~ \". See help for usage.\",\n
              \   \"help_hint\": \"Use action_type: help for details.\"\n  } | tojson\n}}"
        - variables:
            final_response: "{{ (final_response if final_response is mapping else (final_response | from_json)) | combine({'caller_token': caller_token | default('')}) | tojson }}"
        - stop: Pass response variables back to LLM
          response_variable: final_response
          enabled: true
        - set_conversation_response: '{{ final_response }}'
        alias: missing required field error
    alias: Zen DojoTools Mail
    description: 'Zen DojoTools Mail (5.0.0) MS365 Mail: list, read, create, delete
      (stub), move (stub). list/read operate against sensor.ms365_inbox attributes
      — no live API call. create is whitelist-gated. delete and move return not_implemented
      until MS365 integration exposes those services. Use action_type: help for full
      reference.'
    fields:
      mode:
        description: "Pass tool_manifest to get self-description."
        required: false
        selector:
          select:
            options:
              - tool_manifest
      action_type:
        description: '''list'', ''read'', ''create'', ''delete'' (stub), ''move'' (stub), ''help'' (default: help)'
        required: true
        selector:
          select:
            options:
            - list
            - read
            - create
            - delete
            - move
            - help
        default: help
      folder:
        description: Target mail folder (e.g. 'Inbox', 'Deleted Items', 'Junk Email',
          'Sent Items', 'Outbox'). Defaults to 'Inbox'.
        required: false
        selector:
          text:
      uid:
        description: Message UID (required for read, delete, restore, update).
        required: false
        selector:
          text:
      subject:
        description: Subject (required for create).
        required: false
        selector:
          text:
            multiline: false
      body:
        description: Email body (required for create).
        required: false
        selector:
          text:
            multiline: true
      to:
        description: Recipient(s) (comma separated, required for create).
        required: false
        selector:
          text:
      cc:
        description: CC recipient(s), comma separated.
        required: false
        selector:
          text:
      bcc:
        description: BCC recipient(s), comma separated.
        required: false
        selector:
          text:
      from:
        description: 'Filter: sender address (for list/read).'
        required: false
        selector:
          text:
      query:
        description: 'Filter: search string for subject/body/sender.'
        required: false
        selector:
          text:
      importance:
        description: 'Optional: Low, Normal, High. Defaults to Normal.'
        required: false
        selector:
          select:
            options:
            - Low
            - Normal
            - High
      content_type:
        description: 'Optional: ''Text'' or ''HTML''. Default is Text.'
        required: false
        selector:
          select:
            options:
            - Text
            - HTML
      reply_to:
        description: Optional reply-to address.
        required: false
        selector:
          text:
      caller_token:
        name: Caller Token
        description: Opaque token passed through by the caller for correlation. Not interpreted by this script.
        required: false
        selector:
          text:
    icon: mdi:email


###############################################################################
# SETUP HELPERS
#
# Configure these in HA after install (Settings > Helpers, or Developer Tools)
#
# zen_teams_chat_id      — Your MS Teams chat thread ID
#                          (from Graph API or sensor.homeassistant_chat)
#
# zen_teams_display_name — Your display name as seen in Teams (e.g. "Home Assistant")
#
# zen_mail_sender     — Your HA send-from address (e.g. homeassistant@yourdomain.com)
#
# zen_mail_domain     — Your email domain (e.g. yourdomain.com)
#                       Used for wildcard whitelist matching (*@yourdomain.com)
#
# zen_mail_whitelist  — Whitelist mode (input_text). Set value in HA Helpers:
#                         OFF               → no whitelist check, all recipients allowed
#                         *@yourdomain.com  → allow any address in your domain
#                         user@domain.com   → exact address match only
#                       Blank on restart: mail is blocked, AI surfaces config instructions.
###############################################################################

input_text:
  zen_teams_chat_id:
    name: "Zen Teams Chat ID"
    max: 255
    mode: text
    icon: mdi:microsoft-teams

  zen_teams_display_name:
    name: "Zen Teams Display Name"
    max: 100
    mode: text
    icon: mdi:microsoft-teams

  zen_mail_sender:
    name: "Zen Mail Sender Address"
    max: 255
    mode: text
    icon: mdi:email-outline

  zen_mail_domain:
    name: "Zen Mail Domain"
    max: 100
    mode: text
    icon: mdi:at

  zen_mail_whitelist:
    name: "Zen Mail Whitelist"
    max: 255
    mode: text
    icon: mdi:email-lock
