###############################################################################
# ZenOS-AI DojoTools: Weather
# zen_dojotools_weather (v1.2.0)
# v1.2.0: two more decision templates (#10770). forecast_recheck: is the forecast uncertain
#   enough to check again later (recheck/settled; a severe hazard = recheck, no hazard and a
#   rain chance of 10% or less = settled, both without a model). outdoor_window: the best of
#   the next morning, afternoon and evening for time outside (a choice question, the option
#   chosen is the outcome; optional subject= names the activity). Its evidence is the forecast
#   for each part (mode=forecast part=..., parallel self-calls). No source = insufficient_evidence.
# v1.1.0: KF6.5 host (Oracle, #10770). Additive: no existing mode changes. mode=decision lists
#   Weather's decision templates (zero inference); mode=decision_bind (called by Oracle) checks
#   the template, the scope (whole house only; an area is unsupported_scope) and
#   zenos.weather.read, runs mode=summary, and returns the evidence with a revision.
#   forecast_changed: does the forecast differ enough from the last weather summary to warrant
#   a fresh one (noul, refresh/keep; no prior kata = refresh without a model).
#   hazard_relevance: do the forecast's hazards matter to the household now (noul,
#   attention/nominal; no hazard = nominal and a hazard at urgency 4 or more = attention,
#   both without a model, so a severe hazard is never judged away). The declaration rides on
#   kfc_manifest (component.decision); new cert zenos.decision.component.weather.
# v1.0.4: zenos.weather.read is in the zenos_agent_basic bundle (a harmless forecast read
#   that Climate and Taskmaster lean on).
# v1.0.3: the source is the entity labeled main_weather, else one labeled zen_weather
#   (the label Room Manager and the home sensors used), else the first weather.* entity.
#   The snow flag's peak is the precipitation amount only when the provider gives one
#   (it read 0 before, as if no snow would fall).
# v1.0.2: a forecast window that starts after the provider's last item is refused
#   (beyond_forecast, with forecast_ends) instead of answering ok with nothing in it;
#   a window that runs past the last item says so (period.truncated, covered_until).
#   An hourly window that starts now begins at the provider's first item (this hour or
#   the next), so length N reads N items. A start_date that is not a real date is
#   invalid_start; missing_start is a start_time without a start_date. Fields added only.
# v1.0.1: zenos.weather.read also allows stage l (st_ok isl) and names its mode
#   (modes: ['summary'], level 1), so a live drawer mounted on mode=summary can read it,
#   like Print Shop. Grant with cert_stages=isl. The schema is unchanged (1.0).
# v1.0.0: a product weather tool with a locked schema (schema_version 1.0: fields are
#   added, never renamed, retyped or removed, so other tools can feed from it). It is
#   the ZenOS taxonomy applied across weather entities: the source is found by label
#   (main_weather, else the first weather.* entity), never by an entity id; what the
#   provider can forecast (daily, hourly, twice_daily) is read from its own
#   supported_features; units are reported, never converted.
#   Modes: current, forecast, summary, help (the default), tool_manifest, kfc_manifest.
#   forecast keeps what the house forecast script (TheFes, script.weather_forecasts)
#   did: the time_period_type, time_period_length, start_date and start_time fields
#   still work, a daily request falls back to twice_daily when the provider has no
#   daily forecast, a request that is already over is refused, and the window is the
#   forecast items with start <= datetime < end, averaged into one object with
#   start_of_period and end_of_period (numbers averaged, text by mode). It adds
#   current conditions, highs and lows, in-code answers (flags for rain, snow, freeze,
#   heat, wind, storm) and named day parts (morning, afternoon, evening, night,
#   tonight, today, tomorrow, weekend, now) resolved from the household's anchors.
#   summary is the scored, read-only seed of the weather KFC (ambient tier): urgency
#   0-5 in code, 4-5 is promoted by Trapper Keeper. Cert zenos.weather.read (level 1,
#   stage s) gates the background seed only; interactive reads stay open.
#   Read only: nothing here changes a device, so there is no actuation cert.
###############################################################################

script:
  zen_dojotools_weather:
    alias: Zen DojoTools Weather
    mode: parallel
    max: 10
    description: >-
      Weather now and the forecast, from the house's weather entity (label main_weather,
      else the first weather.* entity). mode=current: conditions now. mode=forecast:
      period=auto|daily|hourly|twice_daily, length, start_date + start_time, or a day
      part (part=now|today|tomorrow|weekend|morning|afternoon|evening|night|tonight);
      returns an averaged summary with high and low, and flags for rain, snow, freeze,
      heat, wind and storm. mode=summary: scored hazards. Read only. Start with
      mode=help. Examples:
        Now:       { "mode": "current" }
        Tomorrow:  { "mode": "forecast", "part": "tomorrow" }
        This evening: { "mode": "forecast", "part": "evening" }
        Next 8 hours: { "mode": "forecast", "period": "hourly", "length": 8 }
        Weekend:   { "mode": "forecast", "part": "weekend" }

    fields:
      mode:
        name: Mode
        description: >-
          help (default) | current | forecast | summary | tool_manifest | kfc_manifest |
          decision (decision templates) | decision_bind (called by Oracle).
        default: help
        selector:
          select:
            options:
              - help
              - current
              - forecast
              - summary
              - tool_manifest
              - kfc_manifest
              - decision
              - decision_bind

      period:
        name: Period
        description: >-
          forecast only. auto (default: hourly for a part of a day, else daily), daily,
          hourly or twice_daily. Refused with the provider's supported list when the
          provider does not forecast it; a daily request falls back to twice_daily when
          the provider has no daily forecast.
        required: false
        selector:
          select:
            options:
              - auto
              - daily
              - hourly
              - twice_daily

      length:
        name: Length
        description: >-
          forecast only. The number of days (daily, twice_daily) or hours (hourly) from
          the start, 1 to 48. Default 1 day, or 6 hours for hourly.
        required: false
        selector:
          number:
            min: 1
            max: 48

      start_date:
        name: Start Date
        description: forecast only. YYYY-MM-DD. With start_time, an exact start. Omit to use part, or now.
        required: false
        selector:
          text:

      start_time:
        name: Start Time
        description: forecast only. HH:MM:SS in 24 hour time, with start_date. Default 00:00:00.
        required: false
        selector:
          text:

      time_period_type:
        name: Time Period Type
        description: Same as period (daily or hourly). Kept so a caller of the house forecast script works unchanged.
        required: false
        selector:
          text:

      time_period_length:
        name: Time Period Length
        description: Same as length. Kept so a caller of the house forecast script works unchanged.
        required: false
        selector:
          number:
            min: 1
            max: 48

      part:
        name: Part
        description: >-
          forecast only. A named part of the day, resolved from the household's anchors
          (morning, evening and night; afternoon starts at 12:00): now, today, tomorrow,
          weekend, morning, afternoon, evening, night, tonight. A part that is already
          over today means the same part tomorrow.
        required: false
        selector:
          select:
            options:
              - now
              - today
              - tomorrow
              - weekend
              - morning
              - afternoon
              - evening
              - night
              - tonight

      aggregate:
        name: Aggregate
        description: forecast only. true (default) returns the averaged summary; false also returns every item in the window.
        required: false
        selector:
          boolean:

      include_items:
        name: Include Items
        description: forecast only. true adds the items in the window to the answer.
        required: false
        selector:
          boolean:

      component:
        name: Component
        description: kfc_manifest only. A kata_key filter; omit for the list.
        required: false
        selector:
          text:

      decision_template:
        name: Decision Template
        description: "decision_bind only: the decision template id (Oracle binds it; mode=decision lists them)."
        required: false
        selector:
          text:

      caller_token:
        name: Caller Token
        description: Opaque audit token echoed in response.
        required: false
        selector:
          text:

    sequence:
      # ── Input normalization ────────────────────────────────────────────────
      # SESE: every step sets `result` and falls through; each later step is guarded
      # by `result is not defined`; one envelope, one exit.
      - variables:
          _mode: "{{ mode | default('help', true) | string | lower | trim }}"
          _token: "{{ caller_token | default('', true) | string | trim }}"

      # ── KF6.5 decision declaration (the host owns its templates) ───────────
      # Read by kfc_manifest (Oracle finds it there), by mode=decision and by
      # mode=decision_bind. A caller only picks a template.
      - variables:
          _wx_decision:
            requires: {cert: zenos.decision.component.weather, level: 1}
            templates:
              - id: forecast_changed
                version: 1
                purpose: Has the forecast changed enough since the last weather summary that a fresh one is warranted?
                scope: [house]
                fields: {required: [], optional: []}
                summary_target: weather
                outcomes: [keep, refresh, insufficient_evidence]
                questions:
                  material_change:
                    type: noul
                    instructions: >-
                      The state holds the last weather summary (prior) and the weather now with
                      the next day of forecast (current). Would a household member need a fresh
                      weather summary because the forecast changed materially since the prior
                      one? Material: a hazard that is new or has cleared, a hazard starting much
                      sooner or later, a high or low several degrees different, rain or snow
                      newly expected or no longer expected, or the prior summary now being
                      wrong. Not material: small temperature drift, the same hazards restated,
                      or a change in cloud cover.
                policy: {question: material_change, yes_outcome: refresh, no_outcome: keep, yes_at: 0.6, no_below: 0.35}
              - id: hazard_relevance
                version: 1
                purpose: >-
                  Do the hazards in the forecast matter to the household right now? No hazard is
                  nominal and a hazard at urgency 4 or more is always attention, both settled
                  without a model; only lesser hazards are judged.
                scope: [house]
                fields: {required: [], optional: []}
                summary_target: ""
                outcomes: [attention, nominal, insufficient_evidence]
                questions:
                  matters_now:
                    type: noul
                    instructions: >-
                      The state holds the hazards in the forecast (each with when it starts and
                      its size), the weather now and the household's situation (home mode, how
                      many people are home, the local time). Would a household member want to
                      know about these hazards now? Matters: a hazard that starts soon or
                      affects people at home or going out, or something worth preparing for.
                      Does not matter: light rain overnight while the house sleeps, or a hazard
                      far off with nothing to prepare.
                policy: {question: matters_now, yes_outcome: attention, no_outcome: nominal, yes_at: 0.6, no_below: 0.35}
              - id: forecast_recheck
                version: 1
                purpose: >-
                  Is the forecast uncertain enough that it should be checked again later? A severe
                  hazard is recheck and a clear forecast (no hazard, rain chance 10% or less) is
                  settled, both without a model.
                scope: [house]
                fields: {required: [], optional: []}
                summary_target: ""
                outcomes: [recheck, settled, insufficient_evidence]
                questions:
                  uncertain:
                    type: noul
                    instructions: >-
                      The state holds the weather now, the next day of forecast and its hazards.
                      Is the forecast uncertain enough that a household member would want it
                      checked again later today? Uncertain: a rain or storm chance near even, a
                      temperature near freezing or near a heat limit, wind near a damaging level,
                      or conditions that could change the day's plans. Settled: a clear or a
                      plainly wet day with nothing near a limit.
                policy: {question: uncertain, yes_outcome: recheck, no_outcome: settled, yes_at: 0.6, no_below: 0.35}
              - id: outdoor_window
                version: 1
                purpose: >-
                  Which of the next morning, afternoon and evening is best for time outside, or
                  none? subject= may name the activity (for example mow the lawn). A part of the
                  day already over means the same part tomorrow.
                scope: [house]
                fields: {required: [], optional: [subject]}
                summary_target: ""
                outcomes: [next_morning, next_afternoon, next_evening, none, insufficient_evidence]
                questions:
                  best_window:
                    type: choice
                    instructions: >-
                      The state holds the forecast for the next morning, afternoon and evening
                      (each with its start and end, condition, temperatures, rain chance and wind)
                      and, when given, the activity. Which is the best time to be outside for it?
                      Prefer dry, mild and calm; avoid rain, storms, freezing, heat and high wind.
                      Choose none when every part is poor.
                    criteria:
                      next_morning: the next morning is the best time
                      next_afternoon: the next afternoon is the best time
                      next_evening: the next evening is the best time
                      none: none of them is a good time
                policy: {question: best_window, min_probability: 0.5}

      - choose:
          # ---- help (the default; a bare call never acts) --------------------
          - conditions: "{{ _mode == 'help' }}"
            sequence:
              - variables:
                  result:
                    status: help
                    schema_version: "1.0"
                    summary: >-
                      Weather now and the forecast. Read only. The source is the entity
                      labeled main_weather, else the first weather.* entity.
                    modes:
                      current: "Conditions now: {source, units, now{condition, temperature, apparent_temperature, dew_point, humidity, pressure, wind_speed, wind_gust_speed, wind_bearing, cloud_coverage, uv_index, visibility, ozone}, station, as_of}."
                      forecast: "A window of forecast: {source, units, period{type, start_of_period, end_of_period, items_used, truncated, covered_until}, summary{condition, temperature, templow, temp_high, temp_low, precipitation, precipitation_total, precipitation_probability, precipitation_probability_max, wind_speed, wind_speed_max, humidity}, flags{rain, snow, freeze, heat, wind, storm each {expected, first_at, peak}}, items when asked}. Fields: period, length, start_date + start_time, part, aggregate, include_items (time_period_type and time_period_length still work)."
                      summary: "Scored hazards for the background summary: urgency 0-5, action_required, reasons[], hazards[], watch_entities[]. Ambient tier: 0-3 stays in the ambient index, 4-5 is promoted."
                      tool_manifest: "This tool's identity, labels and cert."
                      kfc_manifest: "The weather KFC definition (consumed by bootstrap_kfc)."
                      decision: "KF6.5: Weather's decision templates (forecast_changed, hazard_relevance, forecast_recheck, outdoor_window). Zero inference. Decide through zen_dojotools_oracle mode=decide host=weather decision_template=<id>."
                      decision_bind: "KF6.5, called by Oracle: binds the evidence for a template (read only; needs zenos.weather.read). Whole house only."
                    parts: "now, today, tomorrow, weekend, morning, afternoon, evening, night, tonight. Anchors come from input_datetime zen_morning_start, zen_evening_start and zen_night_start when set (defaults 06:00, 17:00, 21:00); afternoon starts at 12:00."
                    labels: "main_weather (the weather entity; the older zen_weather label is still read). Optional local station sensors that override the provider's value for that field: outdoor_temperature, outdoor_humidity, outdoor_wind_speed, rain_rate, uv_index."
                    schema_rule: "schema_version 1.0 is locked: fields are added, never renamed, retyped or removed. Units are the entity's own and are reported in units{}."
                    errors: "no_weather_source, source_unavailable, period_unsupported (with supported[]), start_in_past, forecast_unavailable, beyond_forecast (with forecast_ends), invalid_start (start_date is not a real date), missing_start (start_time without start_date)."
                    cert: "zenos.weather.read (level 1, stage s) gates only the background seed (summary). Asking in conversation needs nothing."
                    caller_token: "{{ _token }}"

          # ---- tool_manifest -------------------------------------------------
          - conditions: "{{ _mode == 'tool_manifest' }}"
            sequence:
              - variables:
                  result: >-
                    {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
                    {%- set _tm = MF.tool_manifest(
                        tool='zen_dojotools_weather',
                        summary='Weather now and the forecast',
                        display_name='Weather',
                        tier='dojotools',
                        version='1.2.0',
                        health={'configured': true, 'status': 'ok', 'notes': []},
                        required_labels=['dojotools'],
                        optional_labels=['main_weather', 'outdoor_temperature', 'outdoor_humidity', 'outdoor_wind_speed', 'rain_rate', 'uv_index'],
                        consumes=['mode', 'period', 'length', 'part', 'start_date', 'start_time'],
                        returns=['weather_current', 'weather_forecast', 'weather_summary'],
                        modes={
                          'current': 'Conditions now from the main weather entity, with local station overrides',
                          'forecast': 'A window of forecast: averaged summary, high and low, and flags for rain, snow, freeze, heat, wind and storm',
                          'summary': 'Scored hazards for the background summary (ambient tier)',
                          'tool_manifest': 'Return tool identity and capabilities',
                          'kfc_manifest': 'The weather KFC definition',
                          'decision': "KF6.5: list this host's decision templates (zero inference). Decide through zen_dojotools_oracle mode=decide host=weather",
                          'decision_bind': 'KF6.5, called by Oracle: bind the evidence for a decision template (read-only; needs zenos.weather.read)',
                          'help': 'The reference; the bare call'
                        },
                        icon='mdi:weather-partly-cloudy',
                        color='blue',
                        stripe=3,
                        impact='soft',
                        mcp_exposed=true,
                        seed_modes=['summary@zenos.weather.read:1'],
                        caller_token=_token
                    ) | from_json -%}
                    {{- _tm | combine({
                        'kfc_manifest': true, 'kfc_components': ['weather'],
                        'schema_version': '1.0',
                        'decision': true,
                        'certs_required': [{
                          'cert': 'zenos.decision.component.weather',
                          'display_name': 'Weather Decisions',
                          'description': "Use Weather's decision templates through Oracle",
                          'detail': "Lets the agent ask Oracle Weather's decision templates (forecast_changed: does the forecast differ enough from the last weather summary to warrant a fresh one; hazard_relevance: do the forecast's hazards matter to the household now; forecast_recheck: is the forecast uncertain enough to check again later; outdoor_window: the best of the next morning, afternoon and evening for time outside). Needs zenos.decision.use as well, and the operator's decision switch. Binding the evidence also needs zenos.weather.read. Grants no inference and no summary.",
                          'max_level': 1,
                          'st_ok': 'i',
                          'gates': ['zen_dojotools_oracle mode=decide host=weather (interactive, stage i)'],
                          'grant_via': 'persona_editor mode=cert_req_grant cert_component=zenos.decision.component.weather'
                        }, {
                          'cert': 'zenos.weather.read',
                          'bundle': ['zenos_agent_basic'],
                          'display_name': 'Weather Read',
                          'description': "Read the weather and forecast for the background summary",
                          'detail': 'The weather summary seeds through mode=summary (current conditions and the next day or two of forecast, scored for freeze, heat, storm and wind). Granted with the Ninja seed stage (s), the background summary may read it; without it the summary stops and its last kata leaves the prompt. Asking in conversation does not need it.',
                          'max_level': 1,
                          'level': 1,
                          'modes': ['summary'],
                          'st_ok': 'isl',
                          'gates': ['mode=summary (interactive, stage i)', 'the Ninja seed of the weather component (stage s)', 'a live drawer mounted on mode=summary (stage l)'],
                          'live_ack_required_for': [],
                          'grant_via': "persona_editor mode=cert_req_grant cert_component=zenos.weather.read cert_stages=isl"
                        }]
                      }) -}}

          # ---- decision (KF6.5 discovery, zero inference) --------------------
          # Deciding goes through Oracle (mode=decide host=weather).
          - conditions: "{{ _mode == 'decision' }}"
            sequence:
              - variables:
                  result:
                    status: ok
                    tool: zen_dojotools_weather
                    mode: decision
                    host: weather
                    decision_mode: "{{ 'on' if is_state('input_boolean.zen_decision_enabled', 'on') else 'off' }}"
                    requires: "{{ _wx_decision.requires }}"
                    templates: "{{ _wx_decision.templates }}"
                    decide_via: "zen_dojotools_oracle mode=decide host=weather decision_template=<id>"
                    caller_token: "{{ _token }}"

          # ---- kfc_manifest --------------------------------------------------
          - conditions: "{{ _mode == 'kfc_manifest' }}"
            sequence:
              - variables:
                  _kfc_filter: "{{ component | default('', true) | string | trim | lower }}"
                  _kfc_defs:
                    - kata_key: weather
                      friendly_name: Weather
                      label: main_weather
                      component_summary: >-
                        Weather now and the next day or two: freeze, heat, storm and wind
                        hazards scored in code, with the conditions behind them. Consult
                        for any question about the weather outside or whether to prepare
                        the house for it.
                      component_instructions: >-
                        SCOPE: The weather outside and what it means for the house.
                          Tool: zen_dojotools_weather. Ambient tier: you are read through
                          the ambient index; keep it to one line unless something is wrong.

                        DATA ACCESS:
                          The seed is zen_dojotools_weather mode=summary (scored, read-only).
                          Use its fields; do not invent conditions or numbers. Fields:
                          urgency (0-5), action_required (urgency 3 or more), reasons[],
                          hazards[]{reason, first_at, peak, unit}, now{condition, temperature,
                          humidity, wind_speed}, next_24h{temp_high, temp_low,
                          precipitation_probability_max, condition}, units{}, watch_entities[].
                          A reason of no_weather_source or weather_unavailable means there is
                          no weather data: say so, do not guess.
                          Detail on demand: mode=current, mode=forecast part=tomorrow|weekend|evening.

                        WHAT TO SURFACE:
                          1. Hazards first (urgency 4 or more): freeze, extreme heat, storm,
                             damaging wind, with when it starts and the number.
                          2. Otherwise one line: conditions now and the day's high and low.
                          3. Rain or snow expected today, if any.

                        OUTPUT FORMAT:
                          Nominal: "Clear, 58F now, high 66, low 44." One line.
                          Hazard: "Freeze tonight from 02:00, low 27F. Protect pipes and plants."

                        TONE: Plain and brief, like a weather note on the fridge.
                      trigger_subscriptions:
                        - hourly_trigger
                        - ha_start
                        - force_summary
                      pipeline_tier: ambient
                      drift_threshold: 5
                      emission_cooldown_minutes: 60
                      delay_seconds: 0
                      suggested_act_event: null
                      seed:
                        tool: zen_dojotools_weather
                        params:
                          mode: summary
                      master_switch: ""
                      index_call:
                        domain_inspect_domains: []
                        domain_inspect_limit: 25
                        expand_entities: false
                        filter_json: {}
                        label_1: main_weather
                        label_2: ""
                        operator: AND
                        output_fields: ""
                      meta:
                        enabled: true
                        requires:
                          cert: zenos.weather.read
                          level: 1
                      decision: "{{ _wx_decision }}"
              - variables:
                  _kfc_out: >-
                    {%- if _kfc_filter == '' -%}
                      {{ _kfc_defs }}
                    {%- else -%}
                      {{ _kfc_defs | selectattr('kata_key', 'equalto', _kfc_filter) | list }}
                    {%- endif -%}
                  result:
                    status: ok
                    tool: zen_dojotools_weather
                    version: "1.2.0"
                    mode: kfc_manifest
                    kfc: "{{ _kfc_out }}"
                    count: "{{ _kfc_out | length }}"
                    caller_token: "{{ _token }}"

      # ── Mode check ─────────────────────────────────────────────────────────
      - if: "{{ result is not defined and _mode not in ['current', 'forecast', 'summary', 'decision_bind'] }}"
        then:
          - variables:
              result:
                status: error
                error: unknown_mode
                detail: "mode must be help, current, forecast, summary, tool_manifest, kfc_manifest, decision or decision_bind."
                caller_token: "{{ _token }}"

      # ── Onboarding gate (an agent without zenos.agent.basic gets help and
      # tool_manifest only; automations and the Ninja seed, with no user, pass) ──
      - variables:
          _wx_gate: >-
            {%- import 'zenos_ai/zen_os_1.jinja' as OS -%}
            {{ OS.entry_gate((context.user_id if context is defined else '') or '', 'zen_dojotools_weather', _mode) | from_json({'pass': false, 'reason': 'guarded: the onboarding gate could not be read'}) }}
      - if: "{{ result is not defined and not _wx_gate.get('pass', false) }}"
        then:
          - variables:
              result:
                status: error
                mode: "{{ _mode }}"
                reason: "{{ _wx_gate.reason }}"
                next_step: "{{ _wx_gate.next_step }}"
          - action: system_log.write
            data:
              level: warning
              logger: zen_entry_gate
              message: "{{ _wx_gate.get('log') or 'onboarding gate refused a call (gate result unreadable)' }}"

      # ── KF6.5 decision_bind (called by Oracle) ─────────────────────────────
      # Template, scope and the seed cert first; then the seed (mode=summary, a
      # parallel self-call), the evidence and its revision. Read only, no model.
      - if: "{{ result is not defined and _mode == 'decision_bind' }}"
        then:
          - variables:
              _db_tpl: "{{ decision_template | default('', true) | string | lower | trim }}"
              _db_area: "{{ area | default('', true) | string | trim if area is defined else '' }}"
          - variables:
              _db_t: "{{ (_wx_decision.templates | selectattr('id', 'eq', _db_tpl) | list | first) | default({}) }}"
          - if: "{{ _db_t | length == 0 }}"
            then:
              - variables:
                  result: {status: error, mode: decision_bind, outcome: unknown_template, message: "Weather declares no template '{{ _db_tpl }}'. mode=decision lists them.", caller_token: "{{ _token }}"}
          - if: "{{ result is not defined and _db_area != '' }}"
            then:
              - variables:
                  result: {status: error, mode: decision_bind, outcome: unsupported_scope, message: "Weather decisions are for the whole house; it does not bind '{{ _db_area }}'. The decision was not narrowed.", caller_token: "{{ _token }}"}
          - if: "{{ result is not defined }}"
            then:
              - action: script.zen_dojotools_identity
                response_variable: _db_id_raw
                continue_on_error: true
                data:
                  mode: resolve_caller_identity
                  required_cert: zenos.weather.read
                  required_cert_level: 1
                  caller_token: "{{ _token }}"
              - variables:
                  _db_id: >-
                    {%- import 'zenos_ai/zen_os_1.jinja' as OS -%}
                    {%- set _r = OS.resolve_identity_fields(_db_id_raw | default({})) -%}
                    {{- (_r | from_json) if _r is string else _r -}}
              - if: "{{ not _db_id.authorized }}"
                then:
                  - variables:
                      result: >-
                        {%- import 'zenos_ai/zen_os_1.jinja' as OS -%}
                        {%- set d = OS.cert_denial(_db_id.policy_status, _db_id.authorized, _db_id.cert_level, 'zenos.weather.read', 1, 'mode=decision_bind', _db_id.block_reason) | from_json -%}
                        {{ d | combine({'status': 'error', 'mode': 'decision_bind', 'outcome': 'denied', 'gate': 'zenos.weather.read', 'caller_token': _token}) }}
          # outdoor_window: one forecast slice per part of the day.
          - if: "{{ result is not defined and _db_tpl == 'outdoor_window' }}"
            then:
              - variables:
                  _db_parts: {}
              - repeat:
                  for_each: [morning, afternoon, evening]
                  sequence:
                    - action: script.zen_dojotools_weather
                      response_variable: _db_part_raw
                      continue_on_error: true
                      data:
                        mode: forecast
                        part: "{{ repeat.item }}"
                        caller_token: "{{ _token }}"
                    - variables:
                        _db_parts: >-
                          {%- set r = _db_part_raw if _db_part_raw is defined and _db_part_raw is mapping else {} -%}
                          {%- set r = r.get('result') if r.get('result') is mapping else r -%}
                          {%- set s = r.get('summary') if r.get('summary') is mapping else {} -%}
                          {%- set pd = r.get('period') if r.get('period') is mapping else {} -%}
                          {%- set slice = {'start': pd.get('start_of_period'), 'end': pd.get('end_of_period'), 'condition': s.get('condition'),
                                           'temp_high': s.get('temp_high'), 'temp_low': s.get('temp_low'),
                                           'rain_chance_max': s.get('precipitation_probability_max'), 'wind_max': s.get('wind_speed_max')}
                                           if (r.get('status') == 'ok' and s | length > 0) else none -%}
                          {{ dict(_db_parts, **{('next_' ~ repeat.item): slice}) }}
              - variables:
                  _db_have: "{{ _db_parts.values() | reject('none') | list | count }}"
                  _db_activity: "{{ subject | default('', true) | string | trim if subject is defined else '' }}"
              - variables:
                  result:
                    status: ok
                    mode: decision_bind
                    host: weather
                    template: outdoor_window
                    scope: house
                    deterministic: "{{ 'insufficient_evidence' if _db_have | int(0) == 0 else '' }}"
                    reason: "{{ 'There is no forecast for the coming parts of the day.' if _db_have | int(0) == 0 else '' }}"
                    evidence_revision: >-
                      {%- set ns = namespace(s=[]) -%}
                      {%- for k, v in _db_parts | dictsort -%}{%- set ns.s = ns.s + [k ~ '=' ~ ((v.condition ~ ',' ~ v.rain_chance_max ~ ',' ~ v.start) if v is mapping else 'none')] -%}{%- endfor -%}
                      {{ 'w:' ~ ((ns.s | join('|')) | md5) ~ '|s:' ~ _db_activity }}
                    as_of: "{{ now().isoformat() }}"
                    evidence:
                      activity: "{{ _db_activity if _db_activity != '' else 'time outside' }}"
                      parts: "{{ _db_parts }}"
                      local_time: "{{ now().strftime('%a %H:%M') }}"
                    caller_token: "{{ _token }}"
          - if: "{{ result is not defined }}"
            then:
              - action: script.zen_dojotools_weather
                response_variable: _db_seed_raw
                continue_on_error: true
                data:
                  mode: summary
                  caller_token: "{{ _token }}"
              - variables:
                  _db_cur: >-
                    {%- set r = _db_seed_raw if _db_seed_raw is defined and _db_seed_raw is mapping else {} -%}
                    {%- set r = r.get('result') if r.get('result') is mapping else r -%}
                    {{ r if (r is mapping and r.get('mode') == 'summary') else {} }}
                  _db_prior: >-
                    {%- set kv = state_attr(states('sensor.zen_kata_cabinet_resolved'), 'variables') or {} -%}
                    {%- set d = kv.get('weather') -%}
                    {%- set v = d.get('value', d) if d is mapping else {} -%}
                    {%- set v = (v | from_json({})) if v is string else v -%}
                    {{ v if v is mapping else {} }}
              - if: "{{ _db_cur | length == 0 }}"
                then:
                  - variables:
                      result: {status: error, mode: decision_bind, outcome: bind_failed, message: "Weather's summary seed did not answer. Nothing was decided.", caller_token: "{{ _token }}"}
          - if: "{{ result is not defined }}"
            then:
              - variables:
                  _db_hz: "{{ _db_cur.get('hazards', []) or [] }}"
                  _db_reasons: "{{ _db_cur.get('reasons', []) or [] }}"
                  _db_n24: "{{ _db_cur.get('next_24h') if _db_cur.get('next_24h') is mapping else {} }}"
                  _db_now: "{{ _db_cur.get('now') if _db_cur.get('now') is mapping else {} }}"
                  _db_home_mode: >-
                    {{ states(label_entities('zen_home_mode') | select('match', '(sensor|input_select)\\.') | list | first | default('', true)) }}
                  _db_people: "{{ states.person | selectattr('state', 'eq', 'home') | list | count }}"
                  _db_prior_age_min: >-
                    {%- set lr = _db_prior.get('last_run_at', '') | string -%}
                    {{ (((now().timestamp() - (lr | float(0))) / 60) | round(0) | int) if (lr | float(0)) > 0 else -1 }}
              - variables:
                  _db_no_src: "{{ ('no_weather_source' in _db_reasons) or ('weather_unavailable' in _db_reasons) }}"
                  _db_hz_max: "{{ (_db_hz | map(attribute='score') | map('int', 0) | max) if _db_hz | count > 0 else 0 }}"
                  _db_now_short: "{{ {'condition': _db_now.get('condition'), 'temperature': _db_now.get('temperature'), 'humidity': _db_now.get('humidity'), 'wind_speed': _db_now.get('wind_speed'), 'units': _db_cur.get('units', {})} }}"
              - variables:
                  _db_det: >-
                    {%- if _db_no_src -%}insufficient_evidence
                    {%- elif _db_tpl == 'forecast_changed' -%}{{ 'refresh' if _db_prior | length == 0 else '' }}
                    {%- elif _db_tpl == 'forecast_recheck' -%}{{ 'recheck' if _db_hz_max >= 4 else ('settled' if (_db_hz | count == 0 and (_db_n24.get('precipitation_probability_max') | float(0)) <= 10) else '') }}
                    {%- elif _db_hz | count == 0 -%}nominal
                    {%- elif _db_hz_max >= 4 -%}attention
                    {%- endif -%}
                  _db_reason: >-
                    {%- if _db_no_src -%}There is no weather data to judge ({{ _db_reasons | join(', ') }}).
                    {%- elif _db_tpl == 'forecast_changed' -%}{{ 'There is no prior weather summary to compare with.' if _db_prior | length == 0 else '' }}
                    {%- elif _db_tpl == 'forecast_recheck' -%}{{ ('A hazard at urgency ' ~ _db_hz_max ~ ' is always worth rechecking.') if _db_hz_max >= 4 else ('The forecast is clear: no hazard and a rain chance of 10% or less.' if (_db_hz | count == 0 and (_db_n24.get('precipitation_probability_max') | float(0)) <= 10) else '') }}
                    {%- elif _db_hz | count == 0 -%}The forecast holds no hazard.
                    {%- elif _db_hz_max >= 4 -%}A hazard at urgency {{ _db_hz_max }} always matters; it is never judged away.
                    {%- endif -%}
                  _db_revision: >-
                    {%- set _fa = _db_hz | map(attribute='reason') | map('string') | list -%}
                    {%- set _ft = _db_hz | map(attribute='first_at') | map('string') | list -%}
                    {{ 'u' ~ _db_cur.get('urgency', 0)
                       ~ '|h:' ~ (zip(_fa, _ft) | map('join', '@') | sort | join(','))
                       ~ (('|t:' ~ (_db_n24.get('temp_high') | float(0) | round(0) | int) ~ '/' ~ (_db_n24.get('temp_low') | float(0) | round(0) | int)
                           ~ '|c:' ~ (_db_n24.get('condition') or '') ~ '|p:' ~ (_db_prior.get('last_run_at', '') | string))
                          if _db_tpl == 'forecast_changed'
                          else ('|m:' ~ _db_home_mode ~ '|n:' ~ _db_people)) }}
              - variables:
                  result:
                    status: ok
                    mode: decision_bind
                    host: weather
                    template: "{{ _db_tpl }}"
                    scope: house
                    deterministic: "{{ _db_det | trim }}"
                    reason: "{{ _db_reason | trim }}"
                    evidence_revision: "{{ _db_revision }}"
                    as_of: "{{ now().isoformat() }}"
                    evidence: >-
                      {%- if _db_tpl == 'forecast_changed' -%}
                        {{ {'prior': {'urgency': _db_prior.get('urgency', none), 'attention': _db_prior.get('attention', []), 'general_inference': _db_prior.get('general_inference', ''), 'age_minutes': _db_prior_age_min},
                            'current': {'urgency': _db_cur.get('urgency', 0), 'reasons': _db_reasons, 'hazards': _db_hz, 'now': _db_now_short, 'next_24h': _db_n24}} }}
                      {%- else -%}
                        {{ {'hazards': _db_hz, 'now': _db_now_short, 'next_24h': _db_n24,
                            'household': {'home_mode': _db_home_mode, 'people_home': _db_people, 'local_time': now().strftime('%a %H:%M')}} }}
                      {%- endif -%}
                    caller_token: "{{ _token }}"

      # ── Source discovery (label, never an entity id) ───────────────────────
      - variables:
          _w_labeled: "{{ (label_entities('main_weather') + label_entities('zen_weather')) | select('match', '^weather\\.') | list | first | default('', true) }}"
          _w_first: "{{ states.weather | map(attribute='entity_id') | sort | list | first | default('', true) }}"
      - variables:
          _w_ent: "{{ _w_labeled if _w_labeled != '' else _w_first }}"
      - variables:
          _w_state: "{{ states(_w_ent) if _w_ent != '' else '' }}"
          _w_sf: "{{ state_attr(_w_ent, 'supported_features') | int(0) if _w_ent != '' else 0 }}"
          _w_tu: "{{ state_attr(_w_ent, 'temperature_unit') or '°C' if _w_ent != '' else '°C' }}"
          _w_wu: "{{ state_attr(_w_ent, 'wind_speed_unit') or 'km/h' if _w_ent != '' else 'km/h' }}"
          _w_unavail: "{{ _w_ent != '' and states(_w_ent) in ['unavailable', 'unknown'] }}"
      - variables:
          _w_types: >-
            {%- set sf = _w_sf | int(0) -%}
            {{ (['daily'] if sf in [1, 3, 5, 7] else []) + (['hourly'] if sf in [2, 3, 6, 7] else []) + (['twice_daily'] if sf in [4, 5, 6, 7] else []) }}
          _w_station: >-
            {%- set ns = namespace(m={}) -%}
            {%- for pair in [('temperature', 'outdoor_temperature'), ('humidity', 'outdoor_humidity'), ('wind_speed', 'outdoor_wind_speed'), ('precipitation_rate', 'rain_rate'), ('uv_index', 'uv_index')] -%}
              {%- set e = label_entities(pair[1]) | select('match', '^sensor\\.') | list | first | default('', true) -%}
              {%- if e != '' and states(e) not in ['unknown', 'unavailable', ''] -%}
                {%- set ns.m = dict(ns.m, **{pair[0]: e}) -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.m }}
          _w_units: >-
            {{ {
              'temperature': (state_attr(_w_ent, 'temperature_unit') if _w_ent != '' else none),
              'wind_speed': (state_attr(_w_ent, 'wind_speed_unit') if _w_ent != '' else none),
              'pressure': (state_attr(_w_ent, 'pressure_unit') if _w_ent != '' else none),
              'precipitation': (state_attr(_w_ent, 'precipitation_unit') if _w_ent != '' else none),
              'visibility': (state_attr(_w_ent, 'visibility_unit') if _w_ent != '' else none)
            } }}
      - variables:
          _w_source: >-
            {{ {'entity_id': (_w_ent if _w_ent != '' else none), 'labeled': (_w_labeled != ''), 'forecast_types': _w_types, 'station': _w_station} }}

      # ── No source / unavailable source ─────────────────────────────────────
      # summary still answers (scored), the other modes refuse.
      - if: "{{ result is not defined and _w_ent == '' and _mode != 'summary' }}"
        then:
          - variables:
              result:
                status: error
                error: no_weather_source
                detail: "No weather.* entity exists. Add a weather integration, or label the entity main_weather."
                caller_token: "{{ _token }}"
      - if: "{{ result is not defined and _w_unavail and _mode != 'summary' }}"
        then:
          - variables:
              result:
                status: error
                error: source_unavailable
                detail: "{{ _w_ent }} is {{ _w_state }} right now."
                source: "{{ _w_source }}"
                caller_token: "{{ _token }}"

      # ── Current conditions (every mode reads them; current returns them) ───
      - variables:
          _w_now: >-
            {%- set ns = namespace(n={}) -%}
            {%- for k in ['temperature', 'apparent_temperature', 'dew_point', 'humidity', 'pressure', 'wind_speed', 'wind_gust_speed', 'wind_bearing', 'cloud_coverage', 'uv_index', 'visibility', 'ozone'] -%}
              {%- set v = state_attr(_w_ent, k) if _w_ent != '' else none -%}
              {%- if k in _w_station -%}{%- set v = states(_w_station[k]) | float(0) -%}{%- endif -%}
              {%- set ns.n = dict(ns.n, **{k: v}) -%}
            {%- endfor -%}
            {{ dict({'condition': (_w_state if _w_ent != '' and not _w_unavail else none)}, **ns.n) }}

      - if: "{{ result is not defined and _mode == 'current' }}"
        then:
          - variables:
              result:
                status: ok
                schema_version: "1.0"
                mode: current
                source: "{{ _w_source }}"
                units: "{{ _w_units }}"
                now: "{{ _w_now }}"
                as_of: "{{ now().isoformat() }}"
                caller_token: "{{ _token }}"

      # ── Forecast window (forecast and summary share it) ────────────────────
      # summary reads the next 24 hours (hourly, else the next two days).
      - variables:
          _f_on: "{{ result is not defined and _mode in ['forecast', 'summary'] and _w_ent != '' and not _w_unavail }}"
          _f_part: "{{ part | default('', true) | string | lower | trim }}"
          _f_period_in: "{{ (period | default('', true) | string | lower | trim) or (time_period_type | default('', true) | string | lower | trim) or 'auto' }}"
          _f_len_in: "{{ length | default(time_period_length | default(0, true), true) | int(0) }}"
          _f_sd: "{{ start_date | default('', true) | string | trim }}"
          _f_st: "{{ start_time | default('', true) | string | trim }}"
          _a_morning: >-
            {{ states('input_datetime.zen_morning_start') if states('input_datetime.zen_morning_start') not in ['unknown', 'unavailable', '', '00:00:00'] else '06:00:00' }}
          _a_evening: >-
            {{ states('input_datetime.zen_evening_start') if states('input_datetime.zen_evening_start') not in ['unknown', 'unavailable', '', '00:00:00'] else '17:00:00' }}
          _a_night: >-
            {{ states('input_datetime.zen_night_start') if states('input_datetime.zen_night_start') not in ['unknown', 'unavailable', '', '00:00:00'] else '21:00:00' }}
      - variables:
          _f_hourly_part: "{{ _f_part in ['now', 'morning', 'afternoon', 'evening', 'night', 'tonight'] }}"
      - variables:
          # The type: summary is hourly when the provider has it, else daily.
          _f_type_asked: >-
            {%- if _mode == 'summary' -%}{{ 'hourly' if 'hourly' in _w_types else 'daily' }}
            {%- elif _f_period_in == 'auto' -%}
              {{ 'hourly' if (_f_hourly_part and 'hourly' in _w_types) else ('daily' if 'daily' in _w_types else ('twice_daily' if 'twice_daily' in _w_types else 'hourly')) }}
            {%- else -%}{{ _f_period_in }}
            {%- endif -%}
      - variables:
          # A daily request falls back to twice_daily when the provider has no daily forecast.
          _f_type: >-
            {{ 'twice_daily' if (_f_type_asked == 'daily' and 'daily' not in _w_types and 'twice_daily' in _w_types) else _f_type_asked }}
      - variables:
          _f_unit_hours: "{{ _f_type == 'hourly' }}"
          _f_len: >-
            {%- if _mode == 'summary' -%}{{ 24 if _f_type == 'hourly' else 2 }}
            {%- elif _f_len_in > 0 -%}{{ [[_f_len_in, 1] | max, 48] | min }}
            {%- elif _f_part == 'weekend' -%}{{ 2 if now().weekday() <= 5 else 1 }}
            {%- elif _f_hourly_part -%}6
            {%- elif _f_type == 'hourly' -%}6
            {%- else -%}1
            {%- endif -%}
      - variables:
          _f_start: >-
            {%- set tn = now() -%}
            {%- set top = tn.replace(minute=0, second=0, microsecond=0) -%}
            {%- if _mode == 'summary' -%}
              {{ (top if _f_type == 'hourly' else today_at('00:00')).isoformat() }}
            {%- elif _f_sd != '' -%}
              {%- set d = (_f_sd ~ ' ' ~ (_f_st if _f_st != '' else '00:00:00')) | as_datetime('') -%}
              {{ (d | as_local).isoformat() if d != '' else '' }}
            {%- elif _f_part == 'now' -%}{{ top.isoformat() }}
            {%- elif _f_part == 'today' -%}{{ today_at('00:00').isoformat() }}
            {%- elif _f_part == 'tomorrow' -%}{{ (today_at('00:00') + timedelta(days=1)).isoformat() }}
            {%- elif _f_part == 'weekend' -%}
              {{ (today_at('00:00') if tn.weekday() >= 5 else today_at('00:00') + timedelta(days=(5 - tn.weekday()))).isoformat() }}
            {%- elif _f_part in ['morning', 'afternoon', 'evening', 'night', 'tonight'] -%}
              {%- set anchor = _a_morning if _f_part == 'morning' else ('12:00:00' if _f_part == 'afternoon' else (_a_evening if _f_part == 'evening' else _a_night)) -%}
              {%- set s = today_at(anchor[:5]) -%}
              {{ (s + timedelta(days=1) if (s + timedelta(hours=6)) <= tn else s).isoformat() }}
            {%- elif _f_type == 'hourly' -%}{{ top.isoformat() }}
            {%- else -%}{{ today_at('00:00').isoformat() }}
            {%- endif -%}
      - variables:
          _f_end: >-
            {%- if _f_start == '' -%}
            {%- else -%}
              {{ (_f_start | as_datetime + (timedelta(hours=_f_len | int(1)) if _f_unit_hours else timedelta(days=_f_len | int(1)))).isoformat() }}
            {%- endif -%}

      - if: "{{ _f_on and _w_types | count == 0 }}"
        then:
          - variables:
              result:
                status: error
                error: period_unsupported
                detail: "{{ _w_ent }} does not provide a forecast."
                supported: []
                source: "{{ _w_source }}"
                caller_token: "{{ _token }}"
      - if: "{{ result is not defined and _f_on and _f_type not in _w_types }}"
        then:
          - variables:
              result:
                status: error
                error: period_unsupported
                detail: "{{ _w_ent }} does not provide the {{ _f_type }} forecast."
                supported: "{{ _w_types }}"
                source: "{{ _w_source }}"
                caller_token: "{{ _token }}"
      - if: "{{ result is not defined and _f_on and _mode == 'forecast' and _f_sd == '' and _f_st != '' }}"
        then:
          - variables:
              result:
                status: error
                error: missing_start
                detail: "start_time needs start_date (YYYY-MM-DD), or use part."
                caller_token: "{{ _token }}"
      - if: "{{ result is not defined and _f_on and _f_start == '' }}"
        then:
          - variables:
              result:
                status: error
                error: invalid_start
                detail: "start_date must be a real date as YYYY-MM-DD (and start_time HH:MM:SS), or use part."
                caller_token: "{{ _token }}"
      - if: "{{ result is not defined and _f_on and (_f_end | as_datetime) < now() }}"
        then:
          - variables:
              result:
                status: error
                error: start_in_past
                detail: "That period is already over."
                period: "{{ {'start_of_period': _f_start, 'end_of_period': _f_end} }}"
                caller_token: "{{ _token }}"

      - if: "{{ result is not defined and _f_on }}"
        then:
          - action: weather.get_forecasts
            continue_on_error: true
            data:
              type: "{{ _f_type }}"
            target:
              entity_id: "{{ _w_ent }}"
            response_variable: _w_fc
          - variables:
              _f_items_all: >-
                {%- set r = _w_fc.get(_w_ent, {}) if (_w_fc is defined and _w_fc is mapping) else {} -%}
                {{ r.get('forecast', []) if r is mapping else [] }}
          - variables:
              # An hourly window anchored to now starts at the provider's first item (this
              # hour or the next), so length N reads N items when the provider has them.
              _f_now_anchored: "{{ _f_type == 'hourly' and _f_sd == '' and (_mode == 'summary' or _f_part in ['', 'now']) }}"
              _f_s: >-
                {%- set s = _f_start | as_datetime -%}
                {%- set ns = namespace(f=none) -%}
                {%- if _f_now_anchored -%}
                  {%- for it in _f_items_all if it is mapping and it.get('datetime') -%}
                    {%- set d = it.datetime | as_datetime | as_local -%}
                    {%- if ns.f is none and s <= d and d <= s + timedelta(hours=1) -%}{%- set ns.f = d -%}{%- endif -%}
                  {%- endfor -%}
                {%- endif -%}
                {{ (ns.f if ns.f is not none else s).isoformat() }}
          - variables:
              _f_e: >-
                {{ (_f_s | as_datetime + (timedelta(hours=_f_len | int(1)) if _f_unit_hours else timedelta(days=_f_len | int(1)))).isoformat() }}
              # Where the provider's forecast ends: the last item's start plus one step.
              _f_last_end: >-
                {%- set ds = _f_items_all | selectattr('datetime', 'defined') | map(attribute='datetime') | map('as_datetime') | map('as_local') | list -%}
                {%- if ds | count > 0 -%}
                  {{ ((ds | max) + (timedelta(hours=1) if _f_type == 'hourly' else (timedelta(hours=12) if _f_type == 'twice_daily' else timedelta(days=1)))).isoformat() }}
                {%- endif -%}
          - variables:
              _f_items: >-
                {%- set ns = namespace(o=[]) -%}
                {%- for it in _f_items_all if it is mapping and it.get('datetime') -%}
                  {%- set d = it.datetime | as_datetime | as_local -%}
                  {%- if (_f_s | as_datetime) <= d and d < (_f_e | as_datetime) -%}
                    {%- set ns.o = ns.o + [it] -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.o }}
          - if: "{{ _f_items_all | count == 0 }}"
            then:
              - variables:
                  result:
                    status: error
                    error: forecast_unavailable
                    detail: "{{ _w_ent }} returned no {{ _f_type }} forecast."
                    source: "{{ _w_source }}"
                    caller_token: "{{ _token }}"
          - if: "{{ result is not defined and _mode == 'forecast' and _f_items | count == 0 and _f_last_end != '' and (_f_last_end | as_datetime) <= (_f_s | as_datetime) }}"
            then:
              - variables:
                  result:
                    status: error
                    error: beyond_forecast
                    detail: "{{ _w_ent }} forecasts {{ _f_type }} only until {{ _f_last_end }}; that period starts after it."
                    forecast_ends: "{{ _f_last_end }}"
                    period: "{{ {'start_of_period': _f_s, 'end_of_period': _f_e} }}"
                    source: "{{ _w_source }}"
                    caller_token: "{{ _token }}"
          - if: "{{ result is not defined }}"
            then:
              - variables:
                  # The averaged object the house script returned: numbers averaged,
                  # text by mode. start_of_period and end_of_period keep their names.
                  _f_avg: >-
                    {%- set ns = namespace(o={}) -%}
                    {%- if _f_items | count > 0 -%}
                      {%- for k in _f_items[0].keys() | reject('in', ['datetime', 'is_daytime']) | list -%}
                        {%- set vals = _f_items | selectattr(k, 'defined') | map(attribute=k) | reject('none') | list -%}
                        {%- if vals | count > 0 -%}
                          {%- if vals[0] is number -%}
                            {%- set ns.o = dict(ns.o, **{k: (vals | average | round(1))}) -%}
                          {%- else -%}
                            {%- set ns.o = dict(ns.o, **{k: (vals | statistical_mode)}) -%}
                          {%- endif -%}
                        {%- endif -%}
                      {%- endfor -%}
                    {%- endif -%}
                    {{ ns.o }}
                  _f_temps: "{{ _f_items | selectattr('temperature', 'defined') | map(attribute='temperature') | reject('none') | list }}"
                  _f_lows: "{{ _f_items | selectattr('templow', 'defined') | map(attribute='templow') | reject('none') | list }}"
                  _f_precip: "{{ _f_items | selectattr('precipitation', 'defined') | map(attribute='precipitation') | reject('none') | list }}"
                  _f_prob: "{{ _f_items | selectattr('precipitation_probability', 'defined') | map(attribute='precipitation_probability') | reject('none') | list }}"
                  _f_winds: >-
                    {{ (_f_items | selectattr('wind_speed', 'defined') | map(attribute='wind_speed') | reject('none') | list) + (_f_items | selectattr('wind_gust_speed', 'defined') | map(attribute='wind_gust_speed') | reject('none') | list) }}
                  # Thresholds by the entity's own units.
                  _t_freeze: "{{ 32 if _w_tu == '°F' else 0 }}"
                  _t_heat: "{{ 95 if _w_tu == '°F' else 35 }}"
                  _t_hard_freeze: "{{ 20 if _w_tu == '°F' else -7 }}"
                  _t_extreme_heat: "{{ 105 if _w_tu == '°F' else 41 }}"
                  _t_wind: "{{ {'mph': 30, 'km/h': 48, 'm/s': 13, 'kn': 26, 'ft/s': 44}.get(_w_wu, 48) }}"
                  _t_wind_hard: "{{ {'mph': 50, 'km/h': 80, 'm/s': 22, 'kn': 43, 'ft/s': 73}.get(_w_wu, 80) }}"
              - variables:
                  # A flag is {expected, first_at, peak}: when the window first meets it, and
                  # the worst value in it.
                  _f_flags: >-
                    {%- set fr = namespace(at=none, peak=none) -%}
                    {%- set ht = namespace(at=none, peak=none) -%}
                    {%- set wd = namespace(at=none, peak=none) -%}
                    {%- set rn = namespace(at=none, peak=none) -%}
                    {%- set sn = namespace(at=none, peak=none) -%}
                    {%- set st = namespace(at=none, peak=none) -%}
                    {%- for it in _f_items -%}
                      {%- set lo = it.get('templow') if it.get('templow') is not none else it.get('temperature') -%}
                      {%- set hi = it.get('temperature') if it.get('temperature') is not none else it.get('templow') -%}
                      {%- set wv = [it.get('wind_speed'), it.get('wind_gust_speed')] | reject('none') | list -%}
                      {%- set cond = it.get('condition', '') -%}
                      {%- if lo is not none and lo <= _t_freeze -%}
                        {%- set fr.at = fr.at or it.datetime -%}{%- set fr.peak = lo if fr.peak is none else ([fr.peak, lo] | min) -%}
                      {%- endif -%}
                      {%- if hi is not none and hi >= _t_heat -%}
                        {%- set ht.at = ht.at or it.datetime -%}{%- set ht.peak = hi if ht.peak is none else ([ht.peak, hi] | max) -%}
                      {%- endif -%}
                      {%- if wv | count > 0 and (wv | max) >= _t_wind -%}
                        {%- set wd.at = wd.at or it.datetime -%}{%- set wd.peak = (wv | max) if wd.peak is none else ([wd.peak, (wv | max)] | max) -%}
                      {%- endif -%}
                      {%- if cond in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy'] or (it.get('precipitation_probability') or 0) >= 50 or (it.get('precipitation') or 0) > 0 -%}
                        {%- set rn.at = rn.at or it.datetime -%}{%- set rn.peak = (it.get('precipitation_probability') or 0) if rn.peak is none else ([rn.peak, (it.get('precipitation_probability') or 0)] | max) -%}
                      {%- endif -%}
                      {%- if cond in ['snowy', 'snowy-rainy'] -%}
                        {%- set sn.at = sn.at or it.datetime -%}
                        {#- peak is the largest amount the provider gives; none when it gives no amount. -#}
                        {%- set pv = it.get('precipitation') -%}
                        {%- if pv is number -%}{%- set sn.peak = pv if sn.peak is none else ([sn.peak, pv] | max) -%}{%- endif -%}
                      {%- endif -%}
                      {%- if cond in ['lightning', 'lightning-rainy', 'hail'] -%}
                        {%- set st.at = st.at or it.datetime -%}{%- set st.peak = cond if st.peak is none else st.peak -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {{ {
                      'rain': {'expected': rn.at is not none, 'first_at': rn.at, 'peak': rn.peak},
                      'snow': {'expected': sn.at is not none, 'first_at': sn.at, 'peak': sn.peak},
                      'freeze': {'expected': fr.at is not none, 'first_at': fr.at, 'peak': fr.peak},
                      'heat': {'expected': ht.at is not none, 'first_at': ht.at, 'peak': ht.peak},
                      'wind': {'expected': wd.at is not none, 'first_at': wd.at, 'peak': wd.peak},
                      'storm': {'expected': st.at is not none, 'first_at': st.at, 'peak': st.peak}
                    } }}
                  _f_summary: >-
                    {{ dict(_f_avg, **{
                      'temp_high': ((_f_temps | max) if _f_temps | count > 0 else none),
                      'temp_low': (((_f_lows if _f_lows | count > 0 else _f_temps) | min) if (_f_lows | count > 0 or _f_temps | count > 0) else none),
                      'precipitation_total': ((_f_precip | sum | round(1)) if _f_precip | count > 0 else none),
                      'precipitation_probability_max': ((_f_prob | max) if _f_prob | count > 0 else none),
                      'wind_speed_max': ((_f_winds | max) if _f_winds | count > 0 else none)
                    }) }}
                  _f_period: >-
                    {%- set tr = _f_last_end != '' and (_f_last_end | as_datetime) < (_f_e | as_datetime) -%}
                    {{ {'type': _f_type, 'start_of_period': _f_s, 'end_of_period': _f_e, 'items_used': (_f_items | count), 'truncated': tr, 'covered_until': (_f_last_end if tr else _f_e)} }}

      - if: "{{ result is not defined and _mode == 'forecast' }}"
        then:
          - variables:
              _f_want_items: "{{ (aggregate is defined and not (aggregate | bool(true))) or (include_items | default(false, true) | bool(false)) }}"
              result:
                status: ok
                schema_version: "1.0"
                mode: forecast
                source: "{{ _w_source }}"
                units: "{{ _w_units }}"
                period: "{{ _f_period }}"
                summary: "{{ _f_summary }}"
                flags: "{{ _f_flags }}"
                items: "{{ _f_items if (aggregate is defined and not (aggregate | bool(true))) or (include_items | default(false, true) | bool(false)) else none }}"
                caller_token: "{{ _token }}"

      # ── summary: scored, read-only, in code (the seed of the weather KFC) ──
      # Ambient tier: 0-3 stays in the ambient index, 4-5 is promoted to an attention
      # line. So only the things that need action score 4 or more: a hard freeze or
      # extreme heat, a storm, damaging wind. A plain freeze, heat or wind watch is 3,
      # rain or snow is 1 or 2, an unavailable source 2.
      - variables:
          _s_hz: >-
            {%- set ns = namespace(h=[]) -%}
            {%- if _mode == 'summary' and result is not defined and _f_flags is defined -%}
              {%- set f = _f_flags -%}
              {%- set cur = _w_now.get('temperature') -%}
              {%- set lo = _f_summary.get('temp_low') -%}
              {%- set hi = _f_summary.get('temp_high') -%}
              {%- set low_now = [cur, lo] | reject('none') | list -%}
              {%- set hi_now = [cur, hi] | reject('none') | list -%}
              {%- if f.storm.expected -%}{%- set ns.h = ns.h + [{'reason': 'storm', 'first_at': f.storm.first_at, 'peak': f.storm.peak, 'score': 4}] -%}{%- endif -%}
              {%- if f.wind.expected -%}
                {%- set ns.h = ns.h + [{'reason': ('damaging_wind' if (f.wind.peak or 0) >= _t_wind_hard else 'high_wind'), 'first_at': f.wind.first_at, 'peak': f.wind.peak, 'unit': _w_wu, 'score': (4 if (f.wind.peak or 0) >= _t_wind_hard else 3)}] -%}
              {%- endif -%}
              {%- if f.freeze.expected -%}
                {%- set ns.h = ns.h + [{'reason': ('hard_freeze' if (low_now | count > 0 and (low_now | min) <= _t_hard_freeze) else 'freeze'), 'first_at': f.freeze.first_at, 'peak': f.freeze.peak, 'unit': _w_tu, 'score': (4 if (low_now | count > 0 and (low_now | min) <= _t_hard_freeze) else 3)}] -%}
              {%- endif -%}
              {%- if f.heat.expected -%}
                {%- set ns.h = ns.h + [{'reason': ('extreme_heat' if (hi_now | count > 0 and (hi_now | max) >= _t_extreme_heat) else 'heat'), 'first_at': f.heat.first_at, 'peak': f.heat.peak, 'unit': _w_tu, 'score': (4 if (hi_now | count > 0 and (hi_now | max) >= _t_extreme_heat) else 3)}] -%}
              {%- endif -%}
              {%- if f.snow.expected -%}{%- set ns.h = ns.h + [{'reason': 'snow_expected', 'first_at': f.snow.first_at, 'peak': f.snow.peak, 'score': 2}] -%}{%- endif -%}
              {%- if f.rain.expected -%}{%- set ns.h = ns.h + [{'reason': 'rain_expected', 'first_at': f.rain.first_at, 'peak': f.rain.peak, 'score': 1}] -%}{%- endif -%}
            {%- endif -%}
            {{ ns.h }}
      - variables:
          _s_reasons: >-
            {%- set r = _s_hz | map(attribute='reason') | list -%}
            {%- if _mode == 'summary' and result is not defined and _f_flags is defined -%}{{ r }}
            {%- else -%}{{ [] }}{%- endif -%}
      - if: "{{ result is not defined and _mode == 'summary' and _f_flags is defined }}"
        then:
          - variables:
              result:
                status: ok
                schema_version: "1.0"
                mode: summary
                urgency: "{{ (_s_hz | map(attribute='score') | list | max) if _s_hz | count > 0 else 0 }}"
                action_required: "{{ ((_s_hz | map(attribute='score') | list | max) if _s_hz | count > 0 else 0) >= 3 }}"
                reasons: "{{ _s_reasons }}"
                hazards: "{{ _s_hz }}"
                source: "{{ _w_source }}"
                units: "{{ _w_units }}"
                now: "{{ _w_now }}"
                next_24h: "{{ {'temp_high': _f_summary.get('temp_high'), 'temp_low': _f_summary.get('temp_low'), 'precipitation_probability_max': _f_summary.get('precipitation_probability_max'), 'condition': _f_summary.get('condition')} }}"
                watch_entities: "{{ [_w_ent] if _w_ent != '' else [] }}"
                suggested_act_event: null
                caller_token: "{{ _token }}"
      # summary with no source, or a source that is unavailable: scored, not an error.
      - if: "{{ result is not defined and _mode == 'summary' }}"
        then:
          - variables:
              result:
                status: ok
                schema_version: "1.0"
                mode: summary
                urgency: "{{ 2 if _w_unavail else 1 }}"
                action_required: false
                reasons: "{{ ['weather_unavailable'] if _w_unavail else ['no_weather_source'] }}"
                hazards: []
                source: "{{ _w_source }}"
                units: "{{ _w_units }}"
                now: "{{ _w_now }}"
                next_24h: null
                watch_entities: "{{ [_w_ent] if _w_ent != '' else [] }}"
                suggested_act_event: null
                caller_token: "{{ _token }}"

      # ── One envelope, one exit ─────────────────────────────────────────────
      - variables:
          result: >-
            {%- import 'zenos_ai/zen_os_1.jinja' as OS -%}
            {{- OS.envelope(
              status='error' if (result is mapping and result.get('status') == 'error') else 'success',
              mode=_mode,
              result=result,
              tool='zen_dojotools_weather',
              caller_token=_token
            ) | from_json -}}
      - stop: set
        response_variable: result
