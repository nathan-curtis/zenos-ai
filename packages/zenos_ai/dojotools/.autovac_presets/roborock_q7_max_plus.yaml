# Roborock Q7 Max+ — Auto-Empty Dock Plus
# Fully runnable preset. Pass model_preset=roborock_q7_max_plus when provisioning.
# VERIFY: hepa_filter and mop_cloth SKUs — Q series uses different parts from S7/S8 family.

brand: Roborock
series: Q7 Max
trim: Plus
dock_type: Auto-Empty Dock Plus

location_config:
  has_bot: true
  has_dock_bins: true

parts:
  dust_bags:
    name_suffix: "Dust Bags (5-pack)"
    sku: "9.01.2028"
    location_category: dock_bins
    category: dock
    min_stock: 1
    wear_sensor_key: null
    wear_threshold: null
    chore_period_days: 60
    chore_name_suffix: "Replace Dust Bag"
    chore_note: "Replace auto-empty dock dust bag. OEM Part# 9.01.2028."
  hepa_filter:
    name_suffix: "HEPA Filter"
    sku: VERIFY_SKU  # Q7/Q8 series uses different filter from S7/S8 (8.02.0104) — verify before ordering
    location_category: dock_bins
    category: dock
    min_stock: 1
    wear_sensor_key: filter_remaining
    wear_threshold: 20
    chore_period_days: 180
    chore_name_suffix: "Replace HEPA Filter"
    chore_note: "Replace HEPA filter. Q series SKU differs from S7/S8 — verify OEM part number."
  main_brush:
    name_suffix: "Main Brush"
    sku: "8.02.0097"
    location_category: bot
    category: bot
    min_stock: 1
    wear_sensor_key: main_brush_left
    wear_threshold: 20
    chore_period_days: 180
    chore_name_suffix: "Replace Main Brush"
    chore_note: "Replace rubber main roller brush. OEM Part# 8.02.0097."
  side_brushes:
    name_suffix: "Side Brush Set"
    sku: "8.02.0098"
    location_category: bot
    category: bot
    min_stock: 1
    wear_sensor_key: side_brush_left
    wear_threshold: 20
    chore_period_days: 90
    chore_name_suffix: "Replace Side Brushes"
    chore_note: "Replace side brush set (2 brushes). OEM Part# 8.02.0098."
  mop_cloth:
    name_suffix: "Mop Cloth"
    sku: VERIFY_SKU  # Q7 Max basic drag mop cloth — different from S7/S8 VibraRise pads
    location_category: bot
    category: bot
    min_stock: 1
    wear_sensor_key: null
    wear_threshold: null
    chore_period_days: 7
    chore_name_suffix: "Wash Mop Cloth"
    chore_note: "Wash the mop cloth after use. Q7 Max basic mop — verify OEM part number."
