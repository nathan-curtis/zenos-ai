# Roborock Generic — Auto-Empty Dock, VibraRise Mop
# Documentation template for S7/S8 family with standard auto-empty dock and VibraRise mopping.
# OEM part numbers are confirmed fleet-wide Roborock standards for this family.
# NOT runnable for a specific model — use a model-specific preset (e.g. roborock_s7_plus).
# Copy this and fill in brand/series/trim/dock_type for an unlisted model in this family.

brand: Roborock
dock_type: Auto-Empty Dock

location_config:
  has_bot: true         # Create "— Bot" child location for installed bot parts
  has_dock_bins: true   # Create "— Dock Bins" child location for installed dock parts

parts:
  dust_bags:
    name_suffix: "Dust Bags (5-pack)"
    sku: "9.01.2028"
    location_category: dock_bins
    category: dock
    min_stock: 1
    wear_sensor_key: null
    wear_threshold: null
    chore_period_days: 60
    chore_name_suffix: "Replace Dust Bag"
    chore_note: "Replace auto-empty dock dust bag."
  hepa_filter:
    name_suffix: "HEPA Filter"
    sku: "8.02.0104"
    location_category: dock_bins
    category: dock
    min_stock: 1
    wear_sensor_key: filter_remaining
    wear_threshold: 20
    chore_period_days: 180
    chore_name_suffix: "Replace HEPA Filter"
    chore_note: "Replace HEPA filter."
  main_brush:
    name_suffix: "Main Brush"
    sku: "8.02.0097"
    location_category: bot
    category: bot
    min_stock: 1
    wear_sensor_key: main_brush_left
    wear_threshold: 20
    chore_period_days: 180
    chore_name_suffix: "Replace Main Brush"
    chore_note: "Replace rubber main roller brush."
  side_brushes:
    name_suffix: "Side Brush Set"
    sku: "8.02.0098"
    location_category: bot
    category: bot
    min_stock: 1
    wear_sensor_key: side_brush_left
    wear_threshold: 20
    chore_period_days: 90
    chore_name_suffix: "Replace Side Brushes"
    chore_note: "Replace side brush set (2 brushes)."
  washable_pad:
    name_suffix: "Washable Mop Pad"
    sku: "8.02.0103"
    location_category: bot
    category: bot
    min_stock: 1
    wear_sensor_key: null
    wear_threshold: null
    chore_period_days: 7
    chore_name_suffix: "Wash Mop Pad"
    chore_note: "Wash the VibraRise mop pad after use."
  disposable_pads:
    name_suffix: "Disposable Mop Pads"
    sku: "8.05.0003"
    location_category: bot
    category: bot
    min_stock: 2
    wear_sensor_key: null
    wear_threshold: null
    chore_period_days: 14
    chore_name_suffix: "Replace Disposable Mop Pads"
    chore_note: "Replace disposable mop pad pack (30-pack, single-use per session)."
