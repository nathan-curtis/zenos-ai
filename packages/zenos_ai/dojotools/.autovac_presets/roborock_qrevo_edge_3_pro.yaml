# Roborock Qrevo Edge 3 Pro (US). Schema v2: every part carries its compatibility
# evidence. Pass model_preset=roborock_qrevo_edge_3_pro when provisioning.
#
# Roborock's store names these accessories for the "Qrevo Edge Series" (or Curv/Edge),
# not for the Edge 3 Pro by name, and publishes no manufacturer part numbers for them.
# So every part is family_claim_only: provision creates the product and its chore,
# with min_stock 0 and reorder_enabled false, so nothing is added to a shopping list
# until an exact fit is confirmed. To confirm one, set compatibility_state:
# exact_confirmed, add the confirming source to evidence, and re-provision.
# The S7-series dust bags are a different compatibility group (excluded below):
# they never carry over to this robot.

