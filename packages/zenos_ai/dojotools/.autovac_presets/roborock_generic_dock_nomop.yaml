# Roborock Generic — Auto-Empty Dock, No Mop
# Documentation template for Roborock models with auto-empty dock and no mopping capability.
# Shared SKUs (dust bags, main brush, side brushes) are confirmed fleet-wide OEM part numbers.
# HEPA filter varies by series — Q7/Q8 series uses a different SKU from S7/S8 (8.02.0104).
# NOT fully runnable — verify hepa_filter SKU and fill in brand/series/trim/dock_type for your model.

brand: Roborock
dock_type: Auto-Empty Dock

location_config:
  has_bot: true
  has_dock_bins: true

parts:
  dust_bags:
    name_suffix: "Dust Bags (5-pack)"
    sku: "9.01.2028"
    location_category: dock_bins
    category: dock
    min_stock: 1
    wear_sensor_key: null
    wear_threshold: null
    chore_period_days: 60
    chore_name_suffix: "Replace Dust Bag"
    chore_note: "Replace auto-empty dock dust bag."
  hepa_filter:
    name_suffix: "HEPA Filter"
    sku: REPLACE_SKU  # Q series uses different filter from S7/S8 (8.02.0104) — verify your model
    location_category: dock_bins
    category: dock
    min_stock: 1
    wear_sensor_key: filter_remaining
    wear_threshold: 20
    chore_period_days: 180
    chore_name_suffix: "Replace HEPA Filter"
    chore_note: "Replace HEPA filter. Verify OEM part number for your model series."
  main_brush:
    name_suffix: "Main Brush"
    sku: "8.02.0097"
    location_category: bot
    category: bot
    min_stock: 1
    wear_sensor_key: main_brush_left
    wear_threshold: 20
    chore_period_days: 180
    chore_name_suffix: "Replace Main Brush"
    chore_note: "Replace rubber main roller brush."
  side_brushes:
    name_suffix: "Side Brush Set"
    sku: "8.02.0098"
    location_category: bot
    category: bot
    min_stock: 1
    wear_sensor_key: side_brush_left
    wear_threshold: 20
    chore_period_days: 90
    chore_name_suffix: "Replace Side Brushes"
    chore_note: "Replace side brush set (2 brushes)."
