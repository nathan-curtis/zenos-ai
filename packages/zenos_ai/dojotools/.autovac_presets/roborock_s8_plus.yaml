# Roborock S8+ — Auto-Empty Dock
# Fully runnable preset. Pass model_preset=roborock_s8_plus when provisioning.
# VERIFY: main_brush SKU — S8 uses DuoRoller (dual brush, sold as 2-pack), different from S7's rubber brush.

brand: Roborock
series: S8
trim: Plus
dock_type: Auto-Empty Dock

location_config:
  has_bot: true
  has_dock_bins: true

parts:
  dust_bags:
    name_suffix: "Dust Bags (5-pack)"
    sku: "9.01.2028"
    location_category: dock_bins
    category: dock
    min_stock: 1
    wear_sensor_key: null
    wear_threshold: null
    chore_period_days: 60
    chore_name_suffix: "Replace Dust Bag"
    chore_note: "Replace auto-empty dock dust bag. OEM Part# 9.01.2028."
  hepa_filter:
    name_suffix: "HEPA Filter"
    sku: "8.02.0104"
    location_category: dock_bins
    category: dock
    min_stock: 1
    wear_sensor_key: filter_remaining
    wear_threshold: 20
    chore_period_days: 180
    chore_name_suffix: "Replace HEPA Filter"
    chore_note: "Replace HEPA filter. OEM Part# 8.02.0104."
  main_brush:
    name_suffix: "DuoRoller Main Brush Set (2-pack)"
    sku: VERIFY_SKU  # S8 DuoRoller dual brush — different from S7 rubber brush (8.02.0097)
    location_category: bot
    category: bot
    min_stock: 1
    wear_sensor_key: main_brush_left
    wear_threshold: 20
    chore_period_days: 180
    chore_name_suffix: "Replace DuoRoller Main Brushes"
    chore_note: "Replace DuoRoller main brush set (2-pack). Verify OEM part number before ordering."
  side_brushes:
    name_suffix: "Side Brush Set"
    sku: "8.02.0098"
    location_category: bot
    category: bot
    min_stock: 1
    wear_sensor_key: side_brush_left
    wear_threshold: 20
    chore_period_days: 90
    chore_name_suffix: "Replace Side Brushes"
    chore_note: "Replace side brush set (2 brushes). OEM Part# 8.02.0098."
  washable_pad:
    name_suffix: "Washable Mop Pad"
    sku: "8.02.0103"
    location_category: bot
    category: bot
    min_stock: 1
    wear_sensor_key: null
    wear_threshold: null
    chore_period_days: 7
    chore_name_suffix: "Wash Mop Pad"
    chore_note: "Wash the VibraRise mop pad after use. OEM Part# 8.02.0103."
  disposable_pads:
    name_suffix: "Disposable Mop Pads"
    sku: "8.05.0003"
    location_category: bot
    category: bot
    min_stock: 2
    wear_sensor_key: null
    wear_threshold: null
    chore_period_days: 14
    chore_name_suffix: "Replace Disposable Mop Pads"
    chore_note: "Replace disposable mop pad pack (30-pack, single-use per session). OEM Part# 8.05.0003."
