###############################################################################
# ZenOS-AI Alert Manager
# Version: 5.1.0
#
# v5.1.0 (Zen pull, 2026-07-04): kfc_manifest mode added (alert_manager
#   component, KF5 self-registration). alert_clear restructured — wraps
#   removal/write in an `if: _key in _alerts` guard, always falls through to
#   inject/notification cleanup (write-verification fix). 5 duplicated
#   cabinet-read blocks collapsed to CABS.cabinet_drawer_value_mounted.
#   Zen-side fix (not on H): tool_manifest reported version='1.0.0' while
#   kfc_manifest reported '5.1.0' for the same tool — aligned to 5.1.0.
#
# Additions in 1.5.0:
#   fire: image_entity + response_type fields — passed through to postman.
#   fire: response_type triggers wait_for_trigger in postman; ack cached to
#     kata cabinet under alert_response_{key} and re-emitted as
#     zen_event(kind=alert_response) for any downstream subscriber.
#   get_response: new mode — reads cached ack for a given alert_key from
#     kata cabinet. Returns {ack_action, ack_timed_out, ack_device_id,
#     responded_at} or status: pending if not yet captured.
#
# Fixes in 1.4.0:
#   Tool: all FileCabinet write value: fields now guard with tojson when value
#     is a native dict (HA ast.literal_eval stores tojson output as Python dict,
#     which FileCabinet's from_json parser rejects as invalid JSON).
#   Tool: all stop: actions converted to variables:result + stop: label +
#     response_variable: result pattern (stop: tojson string was ignored by HA).
#   Tool: from_json guards on all list/inject/policy variables ([] input guard).
#   Tool: description rewritten to agent-actionable, PII scrubbed.
#
# Additions in 1.3.0:
#   alert_fire: optional clear_after_minutes → stores expires_at in entry.
#   TTL sweep: FileCabinet GC (dojotools_core.yaml step 4c) fires alert_clear
#     for entries whose expires_at is in the past, handling orphaned keys left
#     by HA restarts that abort the caller's post-fire delay. Permanent alerts
#     (no expires_at) are never touched by GC.
#
# Additions in 1.2.0:
#   zen_priority_inject_handler — write/clear event handler for _zen_priority_inject
#   sensor.zen_priority_context — live status sensor (active|clear) for priority slot
###############################################################################

template:

  - sensor:
      - name: "Zen Priority Context"
        unique_id: zen_priority_context
        icon: mdi:alert-circle
        state: >-
          {%- set hh = states('sensor.zen_default_household_cabinet_resolved') -%}
          {%- if hh in ['', 'unknown', 'unavailable'] -%}clear
          {%- else -%}
            {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}{%- set slot = CABS.cabinet_drawer_value_mounted(hh, '_zen_priority_inject') | from_json -%}
            {%- set now_ts = now() -%}
            {%- set ns = namespace(active=0) -%}
            {%- for pid, entry in slot.items() if entry is mapping -%}
              {%- set exp_s = entry.get('expires', '') | string | trim -%}
              {%- if exp_s != '' -%}
                {%- set exp_dt = exp_s | as_datetime -%}
                {%- if exp_dt is not none and now_ts < exp_dt -%}
                  {%- set ns.active = ns.active + 1 -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {{ 'active' if ns.active > 0 else 'clear' }}
          {%- endif -%}
        attributes:
          count: >-
            {%- set hh = states('sensor.zen_default_household_cabinet_resolved') -%}
            {%- if hh in ['', 'unknown', 'unavailable'] -%}{{ 0 }}
            {%- else -%}
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}{%- set slot = CABS.cabinet_drawer_value_mounted(hh, '_zen_priority_inject') | from_json -%}
              {%- set now_ts = now() -%}
              {%- set ns = namespace(n=0) -%}
              {%- for pid, entry in slot.items() if entry is mapping -%}
                {%- set exp_dt = entry.get('expires', '') | string | as_datetime -%}
                {%- if exp_dt is not none and now_ts < exp_dt -%}{%- set ns.n = ns.n + 1 -%}{%- endif -%}
              {%- endfor -%}
              {{ ns.n }}
            {%- endif -%}
          providers: >-
            {%- set hh = states('sensor.zen_default_household_cabinet_resolved') -%}
            {%- if hh in ['', 'unknown', 'unavailable'] -%}{{ [] }}
            {%- else -%}
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}{%- set slot = CABS.cabinet_drawer_value_mounted(hh, '_zen_priority_inject') | from_json -%}
              {%- set now_ts = now() -%}
              {%- set ns = namespace(pids=[]) -%}
              {%- for pid, entry in slot.items() if entry is mapping -%}
                {%- set exp_dt = entry.get('expires', '') | string | as_datetime -%}
                {%- if exp_dt is not none and now_ts < exp_dt -%}{%- set ns.pids = ns.pids + [pid] -%}{%- endif -%}
              {%- endfor -%}
              {{ ns.pids }}
            {%- endif -%}
          highest_urgency: >-
            {%- set hh = states('sensor.zen_default_household_cabinet_resolved') -%}
            {%- if hh in ['', 'unknown', 'unavailable'] -%}{{ '' }}
            {%- else -%}
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}{%- set slot = CABS.cabinet_drawer_value_mounted(hh, '_zen_priority_inject') | from_json -%}
              {%- set now_ts = now() -%}
              {%- set ns = namespace(has_critical=false, has_urgent=false) -%}
              {%- for pid, entry in slot.items() if entry is mapping -%}
                {%- set exp_dt = entry.get('expires', '') | string | as_datetime -%}
                {%- if exp_dt is not none and now_ts < exp_dt -%}
                  {%- if entry.get('urgency') == 'critical' -%}{%- set ns.has_critical = true -%}
                  {%- elif entry.get('urgency') == 'urgent' -%}{%- set ns.has_urgent = true -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
              {{ 'critical' if ns.has_critical else ('urgent' if ns.has_urgent else '') }}
            {%- endif -%}
          oldest_since: >-
            {%- set hh = states('sensor.zen_default_household_cabinet_resolved') -%}
            {%- if hh in ['', 'unknown', 'unavailable'] -%}{{ '' }}
            {%- else -%}
              {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}{%- set slot = CABS.cabinet_drawer_value_mounted(hh, '_zen_priority_inject') | from_json -%}
              {%- set now_ts = now() -%}
              {%- set ns = namespace(oldest='') -%}
              {%- for pid, entry in slot.items() if entry is mapping -%}
                {%- set exp_dt = entry.get('expires', '') | string | as_datetime -%}
                {%- if exp_dt is not none and now_ts < exp_dt -%}
                  {%- set since = entry.get('since', '') | string -%}
                  {%- if ns.oldest == '' or since < ns.oldest -%}{%- set ns.oldest = since -%}{%- endif -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.oldest }}
            {%- endif -%}

###############################################################################
#
# Fire-once alert deduplication. Suppresses repeat notifications for the same
# condition. Clears when the condition resolves so the alert can fire again
# if it recurs.
#
# STORAGE:
#   household_cabinet._zen_active_alerts — hidden dict drawer
#   { alert_key: { fired_at, message, severity } }
#
# CALLER PATTERN — fire:
#   event: zen_event
#   event_data:
#     event:
#       kind: alert_fire
#       alert_key: cab_schema_upgrade_needed   # unique slug
#       message: "3 cabinets need schema migration"
#       severity: warn                          # info | warn | error
#       notify_target: persistent               # persistent (default) | mobile | postman
#       channel_hint: push                      # postman only — push | tts | teams
#       title: "Optional override title"        # postman only — defaults to severity label
#       image_entity: camera.front_doorbell_camera  # postman only — attaches snapshot to push
#
# CALLER PATTERN — clear:
#   event: zen_event
#   event_data:
#     event:
#       kind: alert_clear
#       alert_key: cab_schema_upgrade_needed
#
# alert_fire with an already-active key → silent no-op (no duplicate).
# alert_clear with an inactive key → silent no-op.
# Persistent notifications auto-dismiss on clear.
#
# clear_after_minutes behavior:
#   Omitted or null → defaults to 1440 (24h). GC sweeps it the next daily run.
#   N > 0           → expires_at = now() + N minutes. Caller fires alert_clear
#                     after delay; GC is the restart-safety backstop.
#   0               → no expiry. Alert persists until explicit alert_clear.
#                     Use for conditions that require manual acknowledgement.
#
# notify_target: postman — routes through zen_dojotools_postman authority stack.
#   severity → urgency: info=3, warn=5, error=8
#   Postman applies household/family postman_profile routing policy.
###############################################################################

automation:

  - id: zen_alert_manager
    alias: Zen Alert Manager
    description: >-
      Zen Alert Manager 1.0.0. Fire-once alert deduplication backed by
      household_cabinet._zen_active_alerts. Suppresses repeated notifications
      for the same alert_key until the condition clears.
    mode: queued
    max: 10

    triggers:
      - trigger: event
        event_type: zen_event
        event_data:
          event:
            kind: alert_fire
        id: alert_fire

      - trigger: event
        event_type: zen_event
        event_data:
          event:
            kind: alert_clear
        id: alert_clear

    actions:
      - variables:
          _ev:        "{{ trigger.event.data.event }}"
          _kind:      "{{ trigger.id }}"
          _key:       "{{ _ev.alert_key | default('') | trim }}"
          _household: "{{ states('sensor.zen_default_household_cabinet_resolved') }}"

      # ── Gate: alert_key required ────────────────────────────────────────────
      - if:
        - condition: template
          value_template: "{{ _key == '' }}"
        then:
        - event: zen_event
          event_data:
            event:
              kind: alert_manager_error
              error: missing_alert_key
              message: "zen_alert_manager: alert_fire/clear received with no alert_key — ignored."
        - stop: missing alert_key

      # ── Gate: household cabinet required ────────────────────────────────────
      - if:
        - condition: template
          value_template: "{{ _household == '' or _household == 'unavailable' or _household == 'unknown' }}"
        then:
        - stop: household cabinet unavailable

      # ── Read _zen_active_alerts ─────────────────────────────────────────────
      - action: script.zen_dojotools_filecabinet
        data:
          action_type: read
          volume_entity_id: "{{ _household }}"
          key: _zen_active_alerts
          force_action: true
          caller_token: zen_alert_manager
        response_variable: _fc_read

      - variables:
          _alerts: >-
            {%- set r = _fc_read.get('result', {}) -%}
            {%- set r = r | from_json if r is string else (r if r is mapping else {}) -%}
            {%- set raw = r.get('_zen_active_alerts', {}) -%}
            {%- set raw = raw if raw is mapping else (raw | from_json if raw is string else {}) -%}
            {%- set v = raw.get('value', raw) if raw is mapping else {} -%}
            {{ v if v is mapping else (v | from_json if v is string else {}) }}

      # ── Route ───────────────────────────────────────────────────────────────
      - choose:

          # ── alert_fire ──────────────────────────────────────────────────────
          - conditions: "{{ _kind == 'alert_fire' }}"
            sequence:

              # Already active — silent no-op
              - if:
                - condition: template
                  value_template: "{{ _key in _alerts }}"
                then:
                - stop: already active

              - variables:
                  _message:       "{{ _ev.message | default(_key) }}"
                  _severity:      "{{ _ev.severity | default('warn') | trim }}"
                  _notify_target: "{{ _ev.notify_target | default('persistent') | trim }}"
                  _notify_targets: "{{ (_ev.notify_target | default('persistent') | trim).split(',') | map('trim') | reject('equalto', '') | list }}"
                  _channel_hint:  "{{ _ev.channel_hint | default('', true) | string | trim }}"
                  _display:       "{{ _ev.display | default('prompt', true) | string | trim | lower }}"
                  # Configurable, not hardcoded -- the dashboard/view a
                  # zen_display ask casts to is a household setting
                  # (integrations_config.display, same cabinet drawer/pattern
                  # zen_dojotools_display's own base_url already uses), not a
                  # literal baked into this file. Learned that lesson once
                  # already tonight moving off room-state -- not doing it
                  # again with a different hardcoded string.
                  _hh_ic_vars: "{{ state_attr('sensor.zenos_default_household_cabinet', 'variables') | default({}, true) }}"
                  _hh_ic_entry: "{{ _hh_ic_vars.get('integrations_config', {}) if _hh_ic_vars is mapping else {} }}"
                  _hh_ic_raw: "{{ _hh_ic_entry.get('value') if _hh_ic_entry is mapping else none }}"
                  _image_entity:  "{{ _ev.image_entity | default('', true) | string | trim }}"
                  _response_type: "{{ _ev.response_type | default('', true) | string | trim }}"
                  _display_room:  "{{ _ev.display_room | default('', true) | string | trim }}"
                  _also_btn:      "{{ _ev.also_notify_buttons | default(false, true) }}"
                  _ic_cfg: >-
                    {%- set v = (_hh_ic_raw | from_json) if (_hh_ic_raw is string and _hh_ic_raw not in ['', none]) else (_hh_ic_raw if _hh_ic_raw is mapping else {}) -%}
                    {{ v.get('display', {}) if v is mapping else {} }}
                  _zd_dashboard_path: "{{ _ic_cfg.get('dashboard_path', 'zenos-ai-monastery') if _ic_cfg is mapping else 'zenos-ai-monastery' }}"
                  _zd_view_path: "{{ _ic_cfg.get('view_path', 'display') if _ic_cfg is mapping else 'display' }}"
                  # A live-ack bypass can be security or life related --
                  # optional passthrough, defaults false so every other alert still respects
                  # quiet/sleep hours exactly as before. request_live_ack
                  # is the one caller that always sets this true, since
                  # it gates a human-requested security-relevant action
                  # (e.g. clearing Paused) rather than a passive FYI that
                  # should legitimately wait until morning.
                  _breakthrough: "{{ _ev.breakthrough | default(false, true) }}"
                  _kata_cab:      "{{ states('sensor.zen_kata_cabinet_resolved') }}"
                  _title:         >-
                    {{ _ev.title | default('ZenOS — ' ~
                      ('Error' if _severity == 'error' else
                       'Warning' if _severity == 'warn' else 'Notice'), true) }}
                  _urgency:       >-
                    {{ 8 if _severity == 'error' else
                       5 if _severity == 'warn' else 3 }}
                  _expires_at:    >-
                    {%- set cam = _ev.clear_after_minutes | default(1440, true) | int -%}
                    {%- if cam > 0 -%}
                      {{ (now() + timedelta(minutes=cam)).isoformat() }}
                    {%- else -%}{{ '' }}{%- endif -%}

              # Fire notification — one or more channels, comma-separated
              # (e.g. "postman,zen_display"). Display Surface is a rendering
              # channel, not an attention-getter on its own -- it has no
              # chime/badge, so composing it WITH postman (or another real
              # notify channel) is on the caller, not bundled automatically.
              # Each channel dispatches independently in the loop below.
              - repeat:
                  for_each: "{{ _notify_targets }}"
                  sequence:
                    - variables:
                        _nt: "{{ repeat.item }}"
                    - choose:
                        - conditions: "{{ _nt == 'persistent' }}"
                          sequence:
                            - action: persistent_notification.create
                              data:
                                notification_id: "zen_alert_{{ _key }}"
                                title: "{{ _title }}"
                                message: "{{ _message }}"

                        - conditions: "{{ _nt == 'postman' }}"
                          sequence:
                            # If this ask is ALSO going to a display, it's a dash
                            # pull, full stop -- no button-on-phone bypass. Postman's
                            # own dashboard-link override only applies when there's
                            # no response_type (dojotools_postman.yaml's own guard,
                            # existing behavior, not something to fight) -- so when
                            # composed with zen_display, response_type is dropped
                            # from the push entirely and it becomes a plain "go look"
                            # pointer. Buttons live ONLY on the display in that case.
                            # zen_display absent -> unchanged, full buttoned push.
                            - variables:
                                _pm_response_type: "{{ '' if 'zen_display' in _notify_targets else _response_type }}"
                            - action: script.zen_dojotools_postman
                              data:
                                mode: resolve_and_dispatch
                                message: "{{ _message }}"
                                title: "{{ _title }}"
                                urgency: "{{ _urgency }}"
                                channel_hint: "{{ _channel_hint }}"
                                image_entity: "{{ _image_entity }}"
                                response_type: "{{ _pm_response_type }}"
                                breakthrough: "{{ _breakthrough }}"
                                open_dashboard: "{{ 'zen_display' in _notify_targets }}"
                                dashboard_path_override: "{{ ('/' ~ _zd_dashboard_path ~ '/' ~ _zd_view_path) if 'zen_display' in _notify_targets else '' }}"
                                caller_token: "zen_alert_manager/{{ _key }}"
                              response_variable: _pm_res

                            # Cache response + re-emit for downstream subscribers
                            - if:
                                - condition: template
                                  value_template: >-
                                    {{ _pm_response_type not in ['', 'none']
                                       and _kata_cab not in ['', 'unavailable', 'unknown'] }}
                              then:
                                - action: script.zen_dojotools_filecabinet
                                  data:
                                    action_type: create
                                    volume_entity_id: "{{ _kata_cab }}"
                                    key: "alert_response_{{ _key }}"
                                    set_timestamp: true
                                    value: >-
                                      {{
                                        {
                                          'alert_key':     _key,
                                          'ack_action':    (_pm_res.get('ack_action', '') if _pm_res is mapping else ''),
                                          'ack_timed_out': (_pm_res.get('ack_timed_out', true) if _pm_res is mapping else true),
                                          'ack_device_id': (_pm_res.get('ack_device_id', '') if _pm_res is mapping else '')
                                        } | tojson
                                      }}
                                    caller_token: "zen_alert_manager/{{ _key }}"
                                - event: zen_event
                                  event_data:
                                    event:
                                      kind:          alert_response
                                      alert_key:     "{{ _key }}"
                                      ack_action:    "{{ _pm_res.get('ack_action', '') if _pm_res is mapping else '' }}"
                                      ack_timed_out: "{{ _pm_res.get('ack_timed_out', true) if _pm_res is mapping else true }}"
                                      ack_device_id: "{{ _pm_res.get('ack_device_id', '') if _pm_res is mapping else '' }}"

                            # also_notify_buttons=true fires a SECOND, independent push -- real response_type
                            # buttons, no dashboard link -- alongside the plain dash-pull
                            # pointer above. Not a workaround for postman's single-
                            # notification constraint: two real, separate notifications,
                            # each satisfying that constraint on its own terms. Same
                            # alert_response_<key> cache, same create-not-upsert
                            # first-answer-wins rule as every other channel -- whichever
                            # the person actually taps (display, or either push) wins.
                            - if: "{{ _also_btn and 'zen_display' in _notify_targets and _response_type not in ['', 'none'] }}"
                              then:
                                - action: script.zen_dojotools_postman
                                  data:
                                    mode: resolve_and_dispatch
                                    message: "{{ _message }}"
                                    title: "{{ _title }}"
                                    urgency: "{{ _urgency }}"
                                    channel_hint: "{{ _channel_hint }}"
                                    response_type: "{{ _response_type }}"
                                    breakthrough: "{{ _breakthrough }}"
                                    tag: "zen_alert_{{ _key }}_buttons"
                                    caller_token: "zen_alert_manager/{{ _key }}/buttons"
                                  response_variable: _pm_res2
                                - if:
                                    - condition: template
                                      value_template: "{{ _kata_cab not in ['', 'unavailable', 'unknown'] }}"
                                  then:
                                    - action: script.zen_dojotools_filecabinet
                                      data:
                                        action_type: create
                                        volume_entity_id: "{{ _kata_cab }}"
                                        key: "alert_response_{{ _key }}"
                                        set_timestamp: true
                                        value: >-
                                          {{
                                            {
                                              'alert_key':     _key,
                                              'ack_action':    (_pm_res2.get('ack_action', '') if _pm_res2 is mapping else ''),
                                              'ack_timed_out': (_pm_res2.get('ack_timed_out', true) if _pm_res2 is mapping else true),
                                              'ack_device_id': (_pm_res2.get('ack_device_id', '') if _pm_res2 is mapping else '')
                                            } | tojson
                                          }}
                                        caller_token: "zen_alert_manager/{{ _key }}/buttons"
                                    - event: zen_event
                                      event_data:
                                        event:
                                          kind:          alert_response
                                          alert_key:     "{{ _key }}"
                                          ack_action:    "{{ _pm_res2.get('ack_action', '') if _pm_res2 is mapping else '' }}"
                                          ack_timed_out: "{{ _pm_res2.get('ack_timed_out', true) if _pm_res2 is mapping else true }}"
                                          ack_device_id: "{{ _pm_res2.get('ack_device_id', '') if _pm_res2 is mapping else '' }}"

                        # notify_target=zen_display (namespaced, NOT bare "display" --
                        # a bare keyword here would silently hijack any real
                        # notify.display service the household creates, since this
                        # branch is checked before the generic notify.{{ _nt }}
                        # fallback below): same "fire and let get_response poll
                        # later" shape as postman above, but the response side never
                        # comes back synchronously here -- a Lovelace tap is
                        # asynchronous by nature. zenos_display_respond_internal (the
                        # ONLY thing that can write a tap's answer -- no AI tool
                        # wrapper, see its own header) writes directly into this same
                        # alert_response_<key> cache when tapped, using ack_context
                        # (set to _key below) to know which alert it's answering.
                        # request_live_ack's poll loop then sees it identically to a
                        # phone-push ack, zero extra code either place. Display Surface
                        # is a rendering channel, not an attention-getter on its own --
                        # compose with postman (notify_target=postman,zen_display) if
                        # you need the human to actually notice.
                        - conditions: "{{ _nt == 'zen_display' }}"
                          sequence:
                            - action: script.zen_dojotools_display
                              continue_on_error: true
                              data:
                                mode: show
                                room: "{{ _display_room }}"
                                dashboard_path: "{{ _zd_dashboard_path }}"
                                view_path: "{{ _zd_view_path }}"
                                title: "{{ _title }}"
                                body_markdown: "{{ _message }}"
                                response_type: "{{ _response_type }}"
                                ack_owner: "zen_dojotools_alertmanager"
                                ack_context: "{{ _key }}"
                              response_variable: _disp_res

                      default:
                        - action: "notify.{{ _nt }}"
                          data:
                            title: "{{ _title }}"
                            message: "{{ _message }}"

              # Write updated _zen_active_alerts
              - variables:
                  _entry:
                    fired_at:   "{{ now().isoformat() }}"
                    message:    "{{ _message }}"
                    severity:   "{{ _severity }}"
                    expires_at: "{{ _expires_at }}"
                  _updated: >-
                    {%- set ns = namespace(d={}) -%}
                    {%- for k, v in _alerts.items() -%}
                      {%- set ns.d = dict(ns.d, **{k: v}) -%}
                    {%- endfor -%}
                    {%- set ns.d = dict(ns.d, **{_key: _entry}) -%}
                    {{ ns.d | tojson }}

              - action: script.zen_dojotools_filecabinet
                data:
                  action_type: update
                  force_action: true
                  volume_entity_id: "{{ _household }}"
                  key: _zen_active_alerts
                  value: "{{ _updated if _updated is string else (_updated | tojson) }}"
                  no_autoexpire: true
                  caller_token: zen_alert_manager
                response_variable: _fc_fire_write

              - action: system_log.write
                data:
                  message: "zen_alert_manager alert_fire write result: key={{ _key }} household={{ _household }} response={{ _fc_fire_write | tojson }}"
                  level: warning

              - if:
                  - condition: template
                    value_template: "{{ (_fc_fire_write | default({})).get('status', 'MISSING') != 'success' }}"
                then:
                  - event: zen_event
                    event_data:
                      event:
                        kind: alert_manager_error
                        error: cabinet_write_failed
                        message: "zen_alert_manager: alert_fire cabinet write failed for key {{ _key }} on {{ _household }} — {{ _fc_fire_write | tojson }}"
                  - stop: cabinet write failed

              # Wire error-severity alerts to priority inject slot
              - if:
                  - condition: template
                    value_template: "{{ _severity == 'error' }}"
                then:
                  - event: zen_event
                    event_data:
                      event:
                        kind: priority_inject_write
                        provider_id: "alert_{{ _key }}"
                        summary: "{{ _message }}"
                        urgency: critical
                        expires_minutes: 60
                        display: "{{ _display }}"

          # ── alert_clear ─────────────────────────────────────────────────────
          - conditions: "{{ _kind == 'alert_clear' }}"
            sequence:

              # Remove from active alerts only if present — always fall through to inject + notification cleanup
              - if:
                  - condition: template
                    value_template: "{{ _key in _alerts }}"
                then:
                  - variables:
                      _updated: >-
                        {%- set ns = namespace(d={}) -%}
                        {%- for k, v in _alerts.items() if k != _key -%}
                          {%- set ns.d = dict(ns.d, **{k: v}) -%}
                        {%- endfor -%}
                        {{ ns.d | tojson }}

                  - action: script.zen_dojotools_filecabinet
                    data:
                      action_type: update
                      force_action: true
                      volume_entity_id: "{{ _household }}"
                      key: _zen_active_alerts
                      value: "{{ _updated if _updated is string else (_updated | tojson) }}"
                      no_autoexpire: true
                      caller_token: zen_alert_manager
                    response_variable: _fc_clear_write

                  - action: system_log.write
                    data:
                      message: "zen_alert_manager alert_clear write result: key={{ _key }} household={{ _household }} response={{ _fc_clear_write | tojson }}"
                      level: warning

                  - if:
                      - condition: template
                        value_template: "{{ (_fc_clear_write | default({})).get('status', 'MISSING') != 'success' }}"
                    then:
                      - event: zen_event
                        event_data:
                          event:
                            kind: alert_manager_error
                            error: cabinet_write_failed
                            message: "zen_alert_manager: alert_clear cabinet write failed for key {{ _key }} on {{ _household }} — {{ _fc_clear_write | tojson }}"
                      - stop: cabinet write failed

              # Clear priority inject entry (no-op if alert wasn't error-level)
              - event: zen_event
                event_data:
                  event:
                    kind: priority_inject_clear
                    provider_id: "alert_{{ _key }}"

              # Dismiss persistent notification (no-op if it wasn't one)
              - action: persistent_notification.dismiss
                data:
                  notification_id: "zen_alert_{{ _key }}"
                continue_on_error: true

  ###############################################################################
  # Zen Priority Inject Handler 1.1.0
  #
  # Processes priority_inject_write / priority_inject_clear events.
  # Writes to household_cabinet._zen_priority_inject — dict keyed by provider_id.
  #
  # WRITE contract enforced here:
  #   - urgency must be 'critical' or 'urgent' — silent reject otherwise
  #   - summary truncated to 255 chars (+ …)
  #   - expires_minutes converted to ISO, capped at 1440 (24hr)
  #   - entities truncated to 3
  #   - display (1.1.0, optional): prompt | tool_response | both | none —
  #     invalid/omitted value silently coerces to 'prompt' (unchanged legacy
  #     behavior — every existing provider omits this field). 'prompt' =
  #     rendered by priority_inject() in the system prompt only (as before).
  #     'tool_response' = surfaced via envelope()'s system_message field on
  #     the next tool call, any tool, instead. 'both' = both channels.
  #     'none' = written for some other consumer, hits neither agent-facing
  #     surface.
  #   - combine() semantics — providers never overwrite each other
  ###############################################################################

  - id: zen_priority_inject_handler
    alias: Zen Priority Inject Handler
    description: >-
      Zen Priority Inject Handler 1.0.0. Handles priority_inject_write and
      priority_inject_clear events. Writes to household_cabinet._zen_priority_inject.
      Validates urgency enum (critical|urgent), truncates summary to 255 chars,
      converts expires_minutes to ISO (capped 1440 min), trims entities to 3.
      All writes are combine() merges — providers never overwrite each other.
    mode: queued
    max: 10

    triggers:
      - trigger: event
        event_type: zen_event
        event_data:
          event:
            kind: priority_inject_write
        id: write

      - trigger: event
        event_type: zen_event
        event_data:
          event:
            kind: priority_inject_clear
        id: clear

    actions:
      - variables:
          _ev:        "{{ trigger.event.data.event }}"
          _kind:      "{{ trigger.id }}"
          _provider:  "{{ trigger.event.data.event.provider_id | default('') | trim }}"
          _household: "{{ states('sensor.zen_default_household_cabinet_resolved') }}"

      # Gate: provider_id required
      - if:
          - condition: template
            value_template: "{{ _provider == '' }}"
        then:
          - stop: missing provider_id

      # Gate: household cabinet required
      - if:
          - condition: template
            value_template: >-
              {{ _household in ['', 'unavailable', 'unknown'] }}
        then:
          - stop: household cabinet unavailable

      # Read current slot
      - action: script.zen_dojotools_filecabinet
        data:
          action_type: read
          volume_entity_id: "{{ _household }}"
          key: _zen_priority_inject
          caller_token: zen_priority_inject_handler
        response_variable: _fc_read

      - variables:
          _raw: "{{ _fc_read.get('value', {}) }}"
          _slot: >-
            {%- set r = _raw -%}
            {%- set r = r if r is mapping else (r | from_json if r is string else {}) -%}
            {{ r }}

      # Route
      - choose:

          # ── Write path ────────────────────────────────────────────────────────
          - conditions: "{{ _kind == 'write' }}"
            sequence:

              # Validate urgency — silent reject on bad value
              - if:
                  - condition: template
                    value_template: >-
                      {{ _ev.urgency | default('') not in ['critical', 'urgent'] }}
                then:
                  - stop: invalid urgency

              - variables:
                  _updated: >-
                    {%- set entries = _slot if _slot is mapping else {} -%}
                    {%- set summary_raw = _ev.summary | default('') | string | trim -%}
                    {%- set summary = summary_raw[:254] ~ '…' if summary_raw | length > 255 else summary_raw -%}
                    {%- set exp_min = [(_ev.expires_minutes | default(60) | int), 1440] | min -%}
                    {%- set expires = (now() + timedelta(minutes=exp_min)).isoformat() -%}
                    {%- set ents_raw = _ev.entities | default([]) -%}
                    {%- set ents = ents_raw[:3] if ents_raw is sequence else [] -%}
                    {%- set disp_raw = _ev.display | default('prompt') | string | trim | lower -%}
                    {%- set disp = disp_raw if disp_raw in ['prompt', 'tool_response', 'both', 'none'] else 'prompt' -%}
                    {%- set new_entry = {
                      'summary': summary,
                      'urgency': _ev.urgency,
                      'since': now().isoformat(),
                      'expires': expires,
                      'entities': ents,
                      'display': disp
                    } -%}
                    {%- set ns = namespace(d={}) -%}
                    {%- for k, v in entries.items() -%}
                      {%- set ns.d = dict(ns.d, **{k: v}) -%}
                    {%- endfor -%}
                    {%- set ns.d = dict(ns.d, **{_provider: new_entry}) -%}
                    {{ ns.d | tojson }}

              - action: script.zen_dojotools_filecabinet
                data:
                  action_type: update
                  force_action: true
                  volume_entity_id: "{{ _household }}"
                  key: _zen_priority_inject
                  value: "{{ _updated if _updated is string else (_updated | tojson) }}"
                  no_autoexpire: true
                  caller_token: zen_priority_inject_handler
                response_variable: _fc_pi_write

              - if:
                  - condition: template
                    value_template: "{{ _fc_pi_write.get('status', '') != 'success' }}"
                then:
                  - event: zen_event
                    event_data:
                      event:
                        kind: alert_manager_error
                        error: cabinet_write_failed
                        message: "zen_alert_manager: priority_inject_write failed for {{ _provider }} on {{ _household }} — {{ _fc_pi_write | tojson }}"

          # ── Clear path ────────────────────────────────────────────────────────
          - conditions: "{{ _kind == 'clear' }}"
            sequence:

              # Not active — silent no-op
              - if:
                  - condition: template
                    value_template: "{{ _provider not in _slot }}"
                then:
                  - stop: not active

              - variables:
                  _updated: >-
                    {%- set ns = namespace(d={}) -%}
                    {%- for k, v in _slot.items() if k != _provider -%}
                      {%- set ns.d = dict(ns.d, **{k: v}) -%}
                    {%- endfor -%}
                    {{ ns.d | tojson }}

              - action: script.zen_dojotools_filecabinet
                data:
                  action_type: update
                  force_action: true
                  volume_entity_id: "{{ _household }}"
                  key: _zen_priority_inject
                  value: "{{ _updated if _updated is string else (_updated | tojson) }}"
                  no_autoexpire: true
                  caller_token: zen_priority_inject_handler
                response_variable: _fc_pi_clear

              - if:
                  - condition: template
                    value_template: "{{ _fc_pi_clear.get('status', '') != 'success' }}"
                then:
                  - event: zen_event
                    event_data:
                      event:
                        kind: alert_manager_error
                        error: cabinet_write_failed
                        message: "zen_alert_manager: priority_inject_clear failed for {{ _provider }} on {{ _household }} — {{ _fc_pi_clear | tojson }}"

###############################################################################
# Zen Alert Manager Tool v1.0.0
#
# MCP-facing CRUD interface for _zen_active_alerts + priority inject slot.
# Modes: list | fire | clear | clear_all | get_policy | set_policy | help
#
# fire/clear are async — zen_alert_manager automation handles dedup and
# persistence. clear_all reads current _zen_active_alerts and emits
# alert_clear for each key at time of call.
# set_policy does a single batched FileCabinet write (all targets in one pass).
###############################################################################

script:

  zen_dojotools_alertmanager:
    alias: Zen DojoTools Alert Manager
    icon: mdi:bell-alert
    description: >-
      Use when the user asks about active alerts, wants to fire/dismiss one,
      manage alert routing, or asks why the agent is in priority/urgent mode
      (error-severity alerts drive sensor.zen_priority_context). For full
      triage across alerts + notifications + repairs + updates, call
      systemtools tool=notice_dashboard first instead. mode=help for the
      full field reference, severity pipeline, and notify_target guide.
    fields:
      mode:
        description: "list | fire | clear | clear_all | get_response | get_policy | set_policy | help"
        required: true
        selector:
          select:
            options: [list, fire, clear, clear_all, get_response, get_policy, set_policy, help, kfc_manifest]
      alert_key:
        description: "Unique dedup slug in _zen_active_alerts (fire / clear)"
        selector:
          text:
      message:
        description: "Alert body text delivered to notification target (fire)"
        selector:
          text:
      severity:
        description: "info | warn | error — error also writes priority context slot"
        selector:
          select:
            options: [info, warn, error]
      display:
        description: "prompt | tool_response | both | none (fire, error severity only — routes the priority-inject entry this alert writes). Default prompt (unchanged legacy behavior)."
        selector:
          select:
            options: [prompt, tool_response, both, none]
      notify_target:
        description: >-
          Notification channel(s) for fire — comma-separate to compose more than one, each
          dispatches independently. Pick your scenario, use it verbatim:
          Just tell a person, no screen involved -> "postman".
          Show something on a display, nobody needs alerting (status board) -> "zen_display"
          + display_room= (returns a warning field reminding you it's silent).
          Alert a person AND show them something richer than fits in a push (the common
          case) -> "postman,zen_display" + display_room= (push becomes tap-to-open only,
          answering happens on the display).
          Same as above but also let them answer straight from the push -> add
          also_notify_buttons=true (fires a second, independent push with real buttons).
          Plain persistent_notification card, no phone/display -> "persistent".
          Raw notify.<service> passthrough -> the literal service name suffix (e.g.
          "mobile_app_my_phone"), not "mobile" -- that string alone silently
          calls notify.mobile, which does not exist.
        selector:
          text:
      display_room:
        description: >-
          Required when notify_target=zen_display (fire). Room/area to cast the ask to — passed
          straight through to zen_dojotools_display's own room= resolution (must resolve to
          exactly one zen_display_target in that room). Not sure which rooms are
          display-equipped? Call zen_dojotools_display mode=discover (no room= for a
          whole-house list, or room=X to check one) -- target_count 0 means not equipped.
          fire validates this for you and blocks with guidance rather than silently
          dispatching nothing, but checking ahead of time avoids the round trip.
        selector:
          text:
      also_notify_buttons:
        description: >-
          Optional, default false (fire, only meaningful when postman AND zen_display are
          both composed in notify_target). Composing the two makes the push a plain
          tap-to-open pointer with no response buttons -- the display is the only place to
          answer. Set true to ALSO fire a second, independent push carrying the response_type
          buttons and no dashboard link, so the person gets two notifications: one to view
          full context on the display, one to answer without opening anything. Each
          notification satisfies Postman's own single-notification constraint on its own
          terms -- not a workaround, two real notifications. Both write to the SAME
          alert_response_<key> cache as the display tap -- same create-not-upsert,
          first-answer-wins rule already governing every other channel here.
        selector:
          boolean:
      channel_hint:
        description: "Postman dispatch channel — push | tts | teams (fire)"
        selector:
          text:
      image_entity:
        description: "Camera or image entity to attach snapshot (fire, postman only)"
        selector:
          text:
      response_type:
        description: >-
          Actionable buttons — none | yes_no | yes_no_ignore | ok_cancel | acknowledge (fire).
          Renders on postman's push AND/OR zen_display's on-screen button row, whichever
          channel(s) you composed in notify_target -- but when BOTH postman and zen_display
          are composed together, postman drops its own buttons (dash-pull-only default,
          see notify_target) unless also_notify_buttons=true.
        selector:
          select:
            options: [none, yes_no, yes_no_ignore, ok_cancel, acknowledge]
      breakthrough:
        description: "fire, postman only. Bypasses the house sleep/quiet-hours gate regardless of urgency. Default false — reserve for security/life-relevant human-requested actions (e.g. request_live_ack), not routine alerts."
        selector:
          boolean:
      clear_after_minutes:
        description: "TTL in minutes; 0=permanent, omit=24h auto-GC (fire)"
        selector:
          number:
            min: 0
            max: 10080
      label:
        description: "HA label slug — targets label_entities() (get/set_policy)"
        selector:
          text:
      target_entity:
        description: "Single entity ID for get/set_policy; overrides label"
        selector:
          text:
      policy_json:
        description: "JSON routing override — {notify_target, channel_hint, suppress_minutes}"
        selector:
          text:
      caller_token:
        description: "Opaque pass-through token — never modified by this script"
        selector:
          text:
    mode: queued
    max: 5
    sequence:

      - variables:
          _mode:         "{{ mode | default('help') | trim }}"
          _household:    "{{ states('sensor.zen_default_household_cabinet_resolved') }}"
          _caller_token: "{{ caller_token | default('') }}"
      - variables:
          _tm_check: "{{ mode | default('') | lower }}"
      - choose:
        - conditions: "{{ _tm_check == 'tool_manifest' }}"
          sequence:
          - variables:
              result: >-
                {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
                {{ MF.tool_manifest(
                    tool='zen_dojotools_alertmanager',
                    display_name='Alert Manager',
                    tier='dojotools',
                    version='5.2.0',
                    health={'configured': true, 'status': 'ok', 'notes': []},
                    required_labels=['dojotools', 'zen_kfc_provider'],
                    optional_labels=['alert_manager', 'alerts'],
                    consumes=['alert_config'],
                    returns=['alert_state'],
                    icon='mdi:bell-alert',
                    color='red',
                    stripe=3,
                    impact='soft',
                    mcp_exposed=true,

                    caller_token=caller_token | default('')
                ) | from_json | combine({'kfc_manifest': true, 'kfc_components': ['alert_manager'], 'certs_required': [
                    {'cert': 'alert_policy_edit', 'level': 1, 'modes': ['set_policy']}
                ]}) }}
          - stop: tool_manifest
            response_variable: result

      # ── kfc_manifest ────────────────────────────────────────────────────────
      - choose:
        - conditions: "{{ _tm_check == 'kfc_manifest' }}"
          sequence:
          - variables:
              _kfc_filter: "{{ component | default('') | string | trim | lower if component is defined else '' }}"
              _kfc_defs:
              - kata_key: alert_manager
                friendly_name: Alert Manager
                label: alert_manager
                component_summary: ""
                component_instructions: >-
                  You are reading the home alert surface. This component aggregates alerts from all subsystems and determines whether action is required.
                  DATA ACCESS:
                    review_data.results[] — all labeled entities. Each entry has:
                      entity_id, friendly_name, state, attributes, last_changed, domain.
                      labels: dict {slug: description} — keys are label slugs applied to this
                        entity, values are description strings (empty if no description set).
                        Iterate keys for label membership; read value for authoritative semantics.
                    Persistent notifications: domain: persistent_notification.
                      state: 'notifying' = active. attributes.message = text.
                    review_data.domain_context.home_mode — current home mode string.
                    review_data.domain_context.alarm — alarm panel state if available.
                      States: disarmed / armed_home / armed_away / triggered / pending.

                  LABEL SEMANTICS:
                    The alert_when_* label family is self-describing — the label name encodes
                    the alert condition. Read the label, apply the rule.
                    If a label's description value is non-empty, it is authoritative — prefer
                    it over the inline semantics below.

                    Binary state labels:
                      alert_when_off — NOMINAL when ON. Flag if state is 'off' or 'unavailable'.
                      alert_when_on — NOMINAL when OFF. Flag if state is 'on', 'problem', or 'detected'.
                      alert_when_not_off — NOMINAL when OFF. Flag if state is anything other than 'off'.

                    Numeric threshold labels (pattern: alert_when_under_N):
                      alert_when_under_N — NOMINAL when numeric state >= N. Flag when state
                        (parsed as float) drops below N. Extract N from the label slug.
                        If not numeric, treat as deviation.

                    alert_manager — scope label. No alert condition encoded. Entities without
                      an alert_when_* label are informational context only.

                    Severity modifiers (may appear alongside alert_when_*):
                      critical — safety class. Immediate escalation. Smoke, CO, leaks, alarms.
                      urgent   — high priority. Fast response needed.
                      warning  — moderate priority. Investigate.
                      information — state awareness only. No action required.

                  TRIAGE PRIORITY:
                    1. Safety: fire, CO, gas, water leak, security breach, alarm triggered
                    2. System health: alert_when_off infrastructure unexpectedly off
                    3. Condition alerts: alert_when_on or alert_when_not_off sensors active
                    4. Numeric threshold alerts: alert_when_under_N entities below threshold
                    5. Persistent notifications: unacknowledged HA notifications
                    6. Informational: low-priority FYIs, context-only entities

                  URGENCY RULES:
                    - Alarm triggered OR label:critical entity deviating -> urgency: 9
                    - label:critical alert_when_on/not_off active -> urgency: 8
                    - 3+ alert_when_off entities in OFF/unavailable state -> urgency: 6
                    - label:urgent entity deviating -> urgency: 5
                    - 1-2 alert_when_off entities off, label:warning -> urgency: 4
                    - alert_when_under_N entity below threshold, label:warning -> urgency: 4
                    - label:information deviating, OR persistent_notifications only -> urgency: 3
                    - alert_when_under_N entity below threshold, label:information -> urgency: 3
                    - All entities nominal, no notifications -> urgency: 1
                    Use highest individual score when multiple deviations exist.

                  TRIGGER CONTEXT:
                    hourly_trigger — routine scan. Emit if urgency >= 3.
                    daily_midnight — full audit. Always emit. Flag chronic (> 24h) deviations.
                    home_mode_updates — re-evaluate. 'away'/'sleep': some off states legitimate.
                      Safety-class alerts never suppressed by mode.
                    alarm_panel — always evaluate. triggered: urgency 9, action_required true.
                    force_summary — on-demand. Emit regardless of recency.
                    ha_start — full scan. Treat unavailable as cautionary, not definitive.

                  OUTPUT FORMAT:
                    List only active deviations. For each include: friendly_name, entity_id,
                    current state, duration (from last_changed), severity class.
                    If no deviations: state all monitored entities are nominal.

                  ESCALATION RULES:
                    IMMEDIATE (notify this cycle): alarm triggered, safety sensor active, urgency >= 8.
                    TRANSIENT (hold notification): last_changed < 10 min — mark 'newly triggered'.
                      last_changed >= 10 min: confirmed deviation.
                    MODE-AWARE THRESHOLD:
                      home: notify at urgency >= 5.
                      away/sleep: notify at urgency >= 6 for non-safety.
                      Safety-class: always urgency >= 8 regardless of mode.
                    DURATION SEVERITY:
                      > 1 hour: persistent — state duration in output.
                      > 24 hours: chronic — flag at daily_midnight.

                  AVAILABLE ACTIONS (suggested_act_event):
                    zen_dojotools_postman — deliver urgent alert brief to admin.
                      Use when: action_required true AND urgency meets mode-aware threshold
                      AND deviation confirmed (last_changed >= 10 min) OR IMMEDIATE criteria met.
                    null — urgency below threshold, deviation transient, or action_required false.
                    DO NOT invent or use any other slug. If unsure, use null.

                  MASTER SWITCH RULE:
                    Subsystem master switches being in state 'off' is an intentional user choice,
                    NOT a deviation requiring action.
                    - Max urgency contribution from any master switch in 'off' state: 1
                    - Never set action_required based solely on a master switch being off
                    - Never notify based on a master switch being off
                    - Treat as informational context only regardless of alert_when_* label
                    If a SAFETY-CLASS entity (smoke, CO, leak, alarm) happens to be
                    implemented as a master switch, the safety rule wins.
                trigger_subscriptions:
                - ha_start
                - daily_midnight
                - hourly_trigger
                - home_mode_updates
                - alarm_panel
                - force_summary
                drift_threshold: 5
                emission_cooldown_minutes: 30
                delay_seconds: 0
                suggested_act_event: zen_dojotools_postman
                index_call:
                  domain_inspect_domains: []
                  domain_inspect_limit: 25
                  expand_entities: false
                  filter_json: {}
                  label_1: alert_manager
                  label_2: ""
                  operator: AND
                  output_fields: ""
                meta:
                  enabled: true
                  requires:
                    cert: ""
                    level: 0
          - variables:
              _kfc_out: >-
                {%- if _kfc_filter == '' -%}
                  {{ _kfc_defs }}
                {%- else -%}
                  {{ _kfc_defs | selectattr('kata_key', 'equalto', _kfc_filter) | list }}
                {%- endif -%}
              result:
                status: ok
                tool: zen_dojotools_alertmanager
                version: "5.1.0"
                mode: kfc_manifest
                kfc: "{{ _kfc_out }}"
                count: "{{ _kfc_out | length }}"
                caller_token: "{{ _caller_token }}"
          - stop: kfc_manifest
            response_variable: result

      - if:
          - condition: template
            value_template: >-
              {{ _mode not in ['help'] and _household in ['', 'unavailable', 'unknown'] }}
        then:
          - variables:
              result:
                success: false
                error: household_cabinet_unavailable
                caller_token: "{{ _caller_token }}"
          - stop: early_exit
            response_variable: result

      - choose:

          # ── list ──────────────────────────────────────────────────────────────
          - conditions: "{{ _mode == 'list' }}"
            sequence:
              - action: script.zen_dojotools_filecabinet
                data:
                  action_type: read
                  volume_entity_id: "{{ _household }}"
                  key: _zen_active_alerts
                  force_action: true
                  caller_token: zen_dojotools_alertmanager
                response_variable: _fc_alerts

              - action: script.zen_dojotools_filecabinet
                data:
                  action_type: read
                  volume_entity_id: "{{ _household }}"
                  key: _zen_priority_inject
                  force_action: true
                  caller_token: zen_dojotools_alertmanager
                response_variable: _fc_inject

              - variables:
                  _alerts: >-
                    {%- set r = _fc_alerts.get('result', {}) -%}
                    {%- set r = r | from_json if r is string else (r if r is mapping else {}) -%}
                    {%- set raw = r.get('_zen_active_alerts', {}) -%}
                    {%- set raw = raw if raw is mapping else (raw | from_json if raw is string else {}) -%}
                    {%- set v = raw.get('value', raw) if raw is mapping else {} -%}
                    {{ v if v is mapping else (v | from_json if v is string else {}) }}
                  _inject: >-
                    {%- set r = _fc_inject.get('result', {}) -%}
                    {%- set r = r | from_json if r is string else (r if r is mapping else {}) -%}
                    {%- set raw = r.get('_zen_priority_inject', {}) -%}
                    {%- set raw = raw if raw is mapping else (raw | from_json if raw is string else {}) -%}
                    {%- set v = raw.get('value', raw) if raw is mapping else {} -%}
                    {{ v if v is mapping else (v | from_json if v is string else {}) }}

              - variables:
                  _enriched: >-
                    {%- set ns = namespace(out=[]) -%}
                    {%- for k, v in _alerts.items() if v is mapping -%}
                      {%- set fired_raw = v.get('fired_at', '') -%}
                      {%- set fired_dt = fired_raw | as_datetime | default(none, true) if fired_raw != '' else none -%}
                      {%- set age_min = ((now() - fired_dt).total_seconds() / 60) | round(1) if fired_dt is not none else none -%}
                      {%- set exp_raw = v.get('expires_at', '') -%}
                      {%- set exp_dt = exp_raw | as_datetime | default(none, true) if exp_raw != '' else none -%}
                      {%- set expired = now() > exp_dt if exp_dt is not none else false -%}
                      {%- set in_inject = ('alert_' ~ k) in _inject -%}
                      {%- set entry = v | combine({'alert_key': k, 'age_min': age_min, 'expired': expired, 'in_priority_inject': in_inject}) -%}
                      {%- set ns.out = ns.out + [entry] -%}
                    {%- endfor -%}
                    {{ ns.out | tojson }}
                  _inject_active: >-
                    {%- set ns = namespace(out=[]) -%}
                    {%- for pid, v in _inject.items() if v is mapping -%}
                      {%- set exp_raw = v.get('expires', '') -%}
                      {%- set exp_dt = exp_raw | as_datetime | default(none, true) if exp_raw != '' else none -%}
                      {%- set active = now() < exp_dt if exp_dt is not none else false -%}
                      {%- set ns.out = ns.out + [v | combine({'provider_id': pid, 'active': active})] -%}
                    {%- endfor -%}
                    {{ ns.out | tojson }}
                  _priority_state: "{{ states('sensor.zen_priority_context') | default('clear') }}"

              - variables:
                  _response: >-
                    {%- set al = _enriched if _enriched is not string else (_enriched | from_json) -%}
                    {%- set inj = _inject_active if _inject_active is not string else (_inject_active | from_json) -%}
                    {{ {'mode': 'list', 'active_alerts': al, 'alert_count': al | length,
                        'priority_context_state': _priority_state,
                        'priority_inject': inj,
                        'caller_token': _caller_token} | tojson }}

          # ── fire ──────────────────────────────────────────────────────────────
          - conditions: "{{ _mode == 'fire' }}"
            sequence:
              - variables:
                  _key:   "{{ alert_key | default('') | trim }}"
                  _msg:   "{{ message | default('') | trim }}"
                  _sev:   "{{ severity | default('warn') | trim }}"
                  _ntgt:  "{{ notify_target | default('persistent') | trim }}"
                  _ch:    "{{ channel_hint | default('', true) | string | trim }}"
                  _img:   "{{ image_entity | default('', true) | string | trim }}"
                  _rtype: "{{ response_type | default('', true) | string | trim }}"
                  _cam:   "{{ clear_after_minutes | default(none, true) }}"
                  _disp:  "{{ display | default('prompt', true) | string | trim | lower }}"
                  # This `fire` action must read `breakthrough` from its own
                  # caller input and include it in the
                  # event it emits below, matching
                  # the listener automation's `_ev.breakthrough` read and
                  # the outbound postman call -- otherwise the field never
                  # survives the round trip.
                  # HA scripts silently ignore unrecognized input data
                  # fields rather than erroring, so this failed
                  # completely silently. request_live_ack's
                  # `breakthrough: true` went nowhere.
                  _brk:   "{{ breakthrough | default(false, true) }}"
                  _droom: "{{ display_room | default('', true) | string | trim }}"
                  _also_btn: "{{ also_notify_buttons | default(false, true) }}"

              - if:
                  - condition: template
                    value_template: "{{ _key == '' or _msg == '' }}"
                then:
                  - variables:
                      result:
                        success: false
                        error: alert_key and message required
                        caller_token: "{{ _caller_token }}"
                  - stop: fire_validation_error
                    response_variable: result

              - variables:
                  _fire_ntgt_list: "{{ _ntgt.split(',') | map('trim') | reject('equalto', '') | list }}"

              # Guardrail: zen_display composed with no display_room silently
              # no-ops (zen_dojotools_display's room= resolves to zero
              # targets, continue_on_error swallows it, nothing ever
              # dispatches, no error anywhere). Caught here instead, before
              # the event even fires, with a direct fix.
              - if: "{{ 'zen_display' in _fire_ntgt_list and _droom == '' }}"
                then:
                  - variables:
                      result:
                        success: false
                        error: display_room_required
                        detail: >-
                          notify_target includes zen_display but display_room is empty --
                          this would silently dispatch nothing. Add display_room=<room>
                          (the happy path: notify_target=postman,zen_display
                          display_room=<room>).
                        caller_token: "{{ _caller_token }}"
                  - stop: fire_validation_error — display_room required
                    response_variable: result

              # Guardrail: display_room given, but does that room actually
              # HAVE a zen_display_target? "Is this room display-equipped"
              # is exactly what zen_dojotools_display mode=discover room=X
              # already answers (target_count 0 = not equipped) -- checked
              # here synchronously, same guardrail shape as the empty-room
              # case above, instead of silently dispatching to nothing.
              - if: "{{ 'zen_display' in _fire_ntgt_list and _droom != '' }}"
                then:
                  - action: script.zen_dojotools_display
                    continue_on_error: true
                    data:
                      mode: discover
                      room: "{{ _droom }}"
                    response_variable: _fire_disc_raw
                  - variables:
                      _fire_disc_count: >-
                        {{ _fire_disc_raw.get('result', {}).get('target_count', 0) if _fire_disc_raw is mapping else 0 }}
                  - if: "{{ _fire_disc_count == 0 }}"
                    then:
                      - variables:
                          result:
                            success: false
                            error: room_not_display_equipped
                            detail: >-
                              display_room={{ _droom }} has no zen_display_target entity --
                              this would silently dispatch nothing. Check
                              zen_dojotools_display mode=discover (no room= for a
                              whole-house list) to find a room that actually has one, or
                              label a media_player zen_display_target in this room first.
                            caller_token: "{{ _caller_token }}"
                      - stop: fire_validation_error — room not display equipped
                        response_variable: result

              # Guardrail: also_notify_buttons only does anything when BOTH
              # postman and zen_display are composed -- alone it's a silent
              # no-op (the code path it triggers lives entirely inside the
              # zen_display-composed branch).
              - if: "{{ _also_btn and not ('postman' in _fire_ntgt_list and 'zen_display' in _fire_ntgt_list) }}"
                then:
                  - variables:
                      result:
                        success: false
                        error: also_notify_buttons_needs_both_channels
                        detail: >-
                          also_notify_buttons=true only does anything when notify_target
                          composes BOTH postman and zen_display -- this call is missing one
                          (the happy path: notify_target=postman,zen_display
                          display_room=<room> also_notify_buttons=true).
                        caller_token: "{{ _caller_token }}"
                  - stop: fire_validation_error — also_notify_buttons needs both channels
                    response_variable: result

              - event: zen_event
                event_data:
                  event:
                    kind: alert_fire
                    alert_key:           "{{ _key }}"
                    message:             "{{ _msg }}"
                    severity:            "{{ _sev }}"
                    notify_target:       "{{ _ntgt }}"
                    channel_hint:        "{{ _ch }}"
                    image_entity:        "{{ _img }}"
                    response_type:       "{{ _rtype }}"
                    clear_after_minutes: "{{ _cam }}"
                    display:             "{{ _disp }}"
                    breakthrough:        "{{ _brk }}"
                    display_room:        "{{ _droom }}"
                    also_notify_buttons: "{{ _also_btn }}"

              - variables:
                  _ntgt_list: "{{ _ntgt.split(',') | map('trim') | reject('equalto', '') | list }}"
                  # Display Surface has no chime/badge -- if it's the ONLY
                  # channel requested, nothing actually pulls a human's
                  # attention. Not an error, just a heads-up computed here
                  # synchronously (fire's own dispatch is async, but this
                  # check needs nothing the async side produces).
                  _notify_warning: >-
                    {%- if _ntgt_list == ['zen_display'] -%}
                      zen_display alone is silent -- no chime/badge/push. Add another
                      channel too (e.g. notify_target=postman,zen_display) if this needs to
                      actually get someone's attention.
                    {%- else -%}{{ none }}{%- endif -%}
              - variables:
                  _response: >-
                    {{ {'mode': 'fire', 'alert_key': _key, 'severity': _sev,
                        'notify_target': _ntgt, 'display': _disp, 'queued': true,
                        'warning': (_notify_warning if _notify_warning not in ['', none] else none),
                        'caller_token': _caller_token} | tojson }}

          # ── clear ─────────────────────────────────────────────────────────────
          - conditions: "{{ _mode == 'clear' }}"
            sequence:
              - variables:
                  _key: "{{ alert_key | default('') | trim }}"

              - if:
                  - condition: template
                    value_template: "{{ _key == '' }}"
                then:
                  - variables:
                      result:
                        success: false
                        error: alert_key required
                        caller_token: "{{ _caller_token }}"
                  - stop: clear_validation_error
                    response_variable: result

              - event: zen_event
                event_data:
                  event:
                    kind: alert_clear
                    alert_key: "{{ _key }}"

              - variables:
                  _response: >-
                    {{ {'mode': 'clear', 'alert_key': _key, 'queued': true,
                        'caller_token': _caller_token} | tojson }}

          # ── clear_all ─────────────────────────────────────────────────────────
          - conditions: "{{ _mode == 'clear_all' }}"
            sequence:
              - action: script.zen_dojotools_filecabinet
                data:
                  action_type: read
                  volume_entity_id: "{{ _household }}"
                  key: _zen_active_alerts
                  force_action: true
                  caller_token: zen_dojotools_alertmanager
                response_variable: _fc_alerts

              - variables:
                  _alerts: >-
                    {%- set r = _fc_alerts.get('result', {}) -%}
                    {%- set r = r | from_json if r is string else (r if r is mapping else {}) -%}
                    {%- set raw = r.get('_zen_active_alerts', {}) -%}
                    {%- set raw = raw if raw is mapping else (raw | from_json if raw is string else {}) -%}
                    {%- set v = raw.get('value', raw) if raw is mapping else {} -%}
                    {{ v if v is mapping else (v | from_json if v is string else {}) }}
                  _keys: "{{ _alerts.keys() | list }}"

              - repeat:
                  for_each: "{{ _keys }}"
                  sequence:
                    - variables:
                        _ev0: "{{ repeat.item }}"
                    - event: zen_event
                      event_data:
                        event:
                          kind: alert_clear
                          alert_key: "{{ _ev0 }}"

              - variables:
                  _response: >-
                    {{ {'mode': 'clear_all', 'cleared_count': _keys | length,
                        'cleared_keys': _keys,
                        'caller_token': _caller_token} | tojson }}

          # ── get_policy ────────────────────────────────────────────────────────
          - conditions: "{{ _mode == 'get_policy' }}"
            sequence:
              - action: script.zen_dojotools_filecabinet
                data:
                  action_type: read
                  volume_entity_id: "{{ _household }}"
                  key: _alert_policy
                  caller_token: zen_dojotools_alertmanager
                response_variable: _fc_policy

              - variables:
                  _policy_raw:    "{{ _fc_policy.get('value', {}) }}"
                  _policy: >-
                    {%- set r = _policy_raw -%}
                    {{ r if r is mapping else (r | from_json if r is string else {}) }}
                  _filter_entity: "{{ target_entity | default('', true) | string | trim }}"
                  _filter_label:  "{{ label | default('', true) | string | trim }}"

              - variables:
                  _label_ents: >-
                    {%- if _filter_label != '' -%}
                      {{ label_entities(_filter_label) | list | tojson }}
                    {%- else -%}{{ '[]' }}{%- endif -%}
                  _filter_set: >-
                    {%- if _filter_entity != '' -%}
                      {{ [_filter_entity] | tojson }}
                    {%- elif _filter_label != '' -%}
                      {{ _label_ents }}
                    {%- else -%}{{ '[]' }}{%- endif -%}

              - variables:
                  _filtered: >-
                    {%- set fs = _filter_set if _filter_set is not string else (_filter_set | from_json) -%}
                    {%- if fs | length == 0 -%}
                      {{ _policy | tojson }}
                    {%- else -%}
                      {%- set ns = namespace(d={}) -%}
                      {%- for eid in fs if eid in _policy -%}
                        {%- set ns.d = dict(ns.d, **{eid: _policy[eid]}) -%}
                      {%- endfor -%}
                      {{ ns.d | tojson }}
                    {%- endif -%}
                  _response: >-
                    {{ {'mode': 'get_policy', 'filter_entity': _filter_entity,
                        'filter_label': _filter_label,
                        'policy': (_filtered if _filtered is not string else (_filtered | from_json)),
                        'caller_token': _caller_token} | tojson }}

          # ── set_policy ────────────────────────────────────────────────────────
          - conditions: "{{ _mode == 'set_policy' }}"
            sequence:
              - variables:
                  _new_policy: >-
                    {%- set raw = policy_json | default('{}', true) | string | trim -%}
                    {%- set raw = raw if raw != '' else '{}' -%}
                    {{ raw | from_json }}
                  _tgt_entity: "{{ target_entity | default('', true) | string | trim }}"
                  _tgt_label:  "{{ label | default('', true) | string | trim }}"

              - if:
                  - condition: template
                    value_template: "{{ _tgt_entity == '' and _tgt_label == '' }}"
                then:
                  - variables:
                      result:
                        success: false
                        error: target_entity or label required
                        caller_token: "{{ _caller_token }}"
                  - stop: set_policy_validation_error
                    response_variable: result

              # ── Cert-gate — alert_policy_edit (2026-09-10, #10390
              # alertmanager.yaml rollout). set_policy can set suppress_
              # minutes for any entity/label household-wide -- a high enough
              # value silently mutes future alerts for that class, a real
              # security-bypass vector. fire/clear/clear_all/list/get_policy/
              # get_response are transient one-off actions, not a standing
              # bypass, and stay ungated. ──
              - action: script.zen_dojotools_identity
                response_variable: _ap_id_raw
                continue_on_error: true
                data:
                  mode: resolve_caller_identity
                  required_cert: alert_policy_edit
                  required_cert_level: 1
                  target_entity: "{{ _tgt_entity }}"
                  caller_token: "{{ _caller_token }}"
              - variables:
                  _ap_cert_policy: "{{ _ap_id_raw.get('policy_status', 'blocked') if _ap_id_raw is mapping else 'blocked' }}"
                  _ap_cert_authorized: "{{ _ap_id_raw.get('authorized', false) if _ap_id_raw is mapping else false }}"
                  _ap_cert_level: "{{ _ap_id_raw.get('cert_level', 0) if _ap_id_raw is mapping else 0 }}"
                  _ap_cert_block_reason: "{{ _ap_id_raw.get('block_reason', '') if _ap_id_raw is mapping else '' }}"
              - if: "{{ _ap_cert_policy != 'allowed' or not _ap_cert_authorized }}"
                then:
                  - variables:
                      _ap_cd_raw: >-
                        {%- import 'zenos_ai/zen_os_1.jinja' as OS -%}
                        {{ OS.cert_denial(_ap_cert_policy, _ap_cert_authorized, _ap_cert_level, 'alert_policy_edit', 1, 'set_policy', _ap_cert_block_reason) -}}
                  - variables:
                      result: >-
                        {{ ((_ap_cd_raw | from_json) if _ap_cd_raw is string else _ap_cd_raw) | combine({'tool': 'zen_dojotools_alertmanager', 'caller_token': _caller_token}) }}
                  - stop: cert_insufficient
                    response_variable: result

              - action: script.zen_dojotools_filecabinet
                data:
                  action_type: read
                  volume_entity_id: "{{ _household }}"
                  key: _alert_policy
                  caller_token: zen_dojotools_alertmanager
                response_variable: _fc_policy

              - variables:
                  _policy_raw: "{{ _fc_policy.get('value', {}) }}"
                  _policy: >-
                    {%- set r = _policy_raw -%}
                    {{ r if r is mapping else (r | from_json if r is string else {}) }}
                  _targets: >-
                    {%- if _tgt_entity != '' -%}
                      {{ [_tgt_entity] | tojson }}
                    {%- else -%}
                      {{ label_entities(_tgt_label) | list | tojson }}
                    {%- endif -%}

              - variables:
                  _updated_policy: >-
                    {%- set ns = namespace(d={}) -%}
                    {%- for k, v in _policy.items() -%}
                      {%- set ns.d = dict(ns.d, **{k: v}) -%}
                    {%- endfor -%}
                    {%- for eid in (_targets if _targets is not string else (_targets | from_json)) -%}
                      {%- set existing = _policy.get(eid, {}) -%}
                      {%- set merged = existing | combine(_new_policy) -%}
                      {%- set ns.d = dict(ns.d, **{eid: merged}) -%}
                    {%- endfor -%}
                    {{ ns.d | tojson }}

              - action: script.zen_dojotools_filecabinet
                data:
                  action_type: update
                  force_action: true
                  volume_entity_id: "{{ _household }}"
                  key: _alert_policy
                  value: "{{ _updated_policy if _updated_policy is string else (_updated_policy | tojson) }}"
                  no_autoexpire: true
                  caller_token: zen_dojotools_alertmanager
                response_variable: _fc_policy_write

              - if:
                  - condition: template
                    value_template: "{{ _fc_policy_write.get('status', '') != 'success' }}"
                then:
                  - variables:
                      result:
                        success: false
                        mode: set_policy
                        error: cabinet_write_failed
                        detail: "{{ _fc_policy_write | tojson }}"
                        caller_token: "{{ _caller_token }}"
                  - stop: set_policy_write_failed
                    response_variable: result

              - variables:
                  _response: >-
                    {{ {'mode': 'set_policy',
                        'targets_updated': (_targets if _targets is not string else (_targets | from_json)),
                        'policy_applied': _new_policy,
                        'caller_token': _caller_token} | tojson }}

          # ── get_response ──────────────────────────────────────────────────────
          - conditions: "{{ _mode == 'get_response' }}"
            sequence:
              - variables:
                  _key:      "{{ alert_key | default('') | trim }}"
                  _kata_cab: "{{ states('sensor.zen_kata_cabinet_resolved') }}"

              - if:
                  - condition: template
                    value_template: "{{ _key == '' }}"
                then:
                  - variables:
                      result:
                        success: false
                        error: alert_key required
                        caller_token: "{{ _caller_token }}"
                  - stop: get_response_validation_error
                    response_variable: result

              - action: script.zen_dojotools_filecabinet
                data:
                  action_type: read
                  volume_entity_id: "{{ _kata_cab }}"
                  key: "alert_response_{{ _key }}"
                  caller_token: "zen_dojotools_alertmanager/get_response"
                response_variable: _fc_resp

              - variables:
                  _raw: >-
                    {%- set r = _fc_resp.get('result', {}) -%}
                    {%- set r = r | from_json if r is string else (r if r is mapping else {}) -%}
                    {%- set key = 'alert_response_' ~ _key -%}
                    {%- set raw = r.get(key, {}) -%}
                    {%- set raw = raw if raw is mapping else (raw | from_json if raw is string else {}) -%}
                    {%- set v = raw.get('value', raw) if raw is mapping else {} -%}
                    {%- set v = v | from_json if v is string else v -%}
                    {{ v if v is mapping else {} }}
                  _response: >-
                    {%- set v = _raw if _raw is mapping else {} -%}
                    {%- if v | length == 0 -%}
                      {{ {'mode': 'get_response', 'alert_key': _key,
                          'status': 'pending', 'caller_token': _caller_token} | tojson }}
                    {%- else -%}
                      {{ {'mode': 'get_response', 'alert_key': _key,
                          'status': 'captured',
                          'ack_action':    v.get('ack_action', ''),
                          'ack_timed_out': v.get('ack_timed_out', true),
                          'ack_device_id': v.get('ack_device_id', ''),
                          'caller_token':  _caller_token} | tojson }}
                    {%- endif -%}

          # ── help ──────────────────────────────────────────────────────────────
          - conditions: "{{ _mode == 'help' }}"
            sequence:
              - variables:
                  _response: >-
                    {{ {'tool': 'zen_dojotools_alertmanager', 'version': '1.0.0',
                        'notify_target_decision_guide': {
                          '_read_this_first': 'Pick your scenario below, use that exact notify_target verbatim. Do not reason from scratch.',
                          'phone_only_no_display': 'notify_target=postman. Zero display involvement -- no session, no cast, no takeover of any screen.',
                          'display_only_silent': 'notify_target=zen_display + display_room=<room>. No chime/badge -- only use this if nobody needs to be alerted (e.g. an always-on status board). Returns a warning field to tell you so.',
                          'phone_alert_plus_display_content': 'notify_target=postman,zen_display + display_room=<room>. THE DEFAULT for "notify someone AND show something richer than fits in a push." Push becomes a plain tap-to-open pointer -- no push buttons, answering happens on the display only.',
                          'phone_alert_plus_display_with_phone_buttons_too': 'Same as above + also_notify_buttons=true. Fires a SECOND push carrying real response buttons, so the person can answer from the push OR the display -- two independent notifications, not a compromise between them.',
                          'phone_viewing_the_display_session_itself': 'No new call needed. Any device (including the phone Companion app) that opens dashboard_path_override=/zenos-ai-monastery/display sees the IDENTICAL live session data as the physical display -- it is one shared sensor, not per-device state. A postman push with open_dashboard=true already does this.',
                          'waiting_for_the_human_answer': 'Never poll this tool directly. Use zen_dojotools_identity mode=request_live_ack (ack_notify_target= same values as notify_target above, comma-composable) -- it fires AND polls for you.'
                        },
                        'modes': {
                          'list': {
                            'desc': 'Read active alert roster and priority inject slot.',
                            'fields': 'none required',
                            'returns': 'active_alerts[], alert_count, priority_context_state(active|clear), priority_inject[]',
                            'alert_entry_fields': 'alert_key, fired_at, message, severity, expires_at, age_min(float min), expired(bool), in_priority_inject(bool)'
                          },
                          'fire': {
                            'desc': 'Emit alert_fire zen_event. zen_alert_manager handles dedup — already-active key is silent no-op.',
                            'required': 'alert_key (unique slug), message',
                            'optional': 'severity(info|warn|error, default:warn), notify_target(persistent|postman|zen_display|notify.<service suffix>, default:persistent — comma-separate to compose more than one channel, e.g. postman,zen_display; zen_display alone returns a warning field since it has no chime/badge on its own, compose it with another channel to actually get someone\'s attention), display_room(required when zen_display is one of the targets — room/area zen_dojotools_display resolves its own zen_display_target in), channel_hint(push|tts|teams), clear_after_minutes(0=permanent, omit=1440 auto-GC), breakthrough(bool, default:false — bypasses the quiet/sleep-hours gate for security or life-relevant human-requested actions), response_type(none|yes_no|yes_no_ignore|ok_cancel|acknowledge — when postman AND zen_display are both composed, it\'s a dash pull, full stop: the push drops its own response buttons entirely and becomes a plain tap-to-open pointer to the display, answering happens on the display only), also_notify_buttons(bool, default false, only meaningful when postman+zen_display composed — fires a SECOND independent push with real response_type buttons and no dashboard link, so you get one dash-pull pointer AND one answerable push, two real notifications each satisfying postman\'s own single-notification constraint on its own terms). DESIGN, not accidental: postman\'s own ack-capture and a display tap both write the SAME alert_response_<key> via action_type=create (never update/upsert) — whichever channel is answered FIRST wins, the second write is a harmless no-op. get_response reads back whichever landed first. Want last-answer-wins instead? That needs an explicit switch to upsert+force_action, not the default.'
                          },
                          'clear': {
                            'desc': 'Emit alert_clear. Dismisses persistent notification + clears priority inject entry. Inactive key = silent no-op.',
                            'required': 'alert_key'
                          },
                          'clear_all': {
                            'desc': 'Snapshot _zen_active_alerts keys at call time, emit alert_clear for each. Returns cleared_count and cleared_keys.',
                            'fields': 'none required'
                          },
                          'get_policy': {
                            'desc': 'Read _alert_policy dict from household cabinet.',
                            'optional': 'target_entity (single entity ID), label (HA label slug → label_entities). Omit both for full dict.'
                          },
                          'set_policy': {
                            'desc': 'Write alert routing overrides. All targets combined and written in one batched FileCabinet call.',
                            'required': 'policy_json + (target_entity or label)',
                            'policy_json_shape': '{notify_target, channel_hint, suppress_minutes}'
                          }
                        },
                        'policy_shape': {
                          'notify_target': 'persistent | postman | zen_display | notify.<service suffix> (comma-separate to compose)',
                          'channel_hint': 'push | tts | teams (postman only)',
                          'suppress_minutes': 'routing policy hint — stored in _alert_policy, not yet enforced by zen_alert_manager'
                        },
                        'severity_pipeline': {
                          'info': 'notify_target only — no priority inject write',
                          'warn': 'notify_target only — no priority inject write',
                          'error': 'notify_target + priority_inject_write (provider=alert_{key}, urgency=critical, expires=60min) → sensor.zen_priority_context active → Friday sees it in cortex'
                        },
                        'gc_notes': [
                          'clear_after_minutes omitted → expires_at = now + 1440min. dojotools_core GC sweeps at daily_midnight.',
                          'clear_after_minutes=0 → no expires_at → permanent until explicit clear or clear_all.',
                          'GC emits alert_clear for overdue entries — handles orphans from HA restarts mid-timer.'
                        ],
                        'cabinet': 'household_cabinet._zen_active_alerts | _zen_priority_inject | _alert_policy',
                        'caller_token': _caller_token} | tojson }}

        # ── default: unknown mode ─────────────────────────────────────────────
        default:
          - variables:
              result: >-
                {{ {'success': false, 'error': 'unknown_mode', 'mode': _mode,
                    'valid_modes': ['list','fire','clear','clear_all','get_policy','set_policy','help'],
                    'caller_token': _caller_token} | tojson | from_json }}
          - stop: unknown_mode
            response_variable: result

      - variables:
          result: "{{ _response if _response is not string else (_response | from_json) }}"
      - stop: done
        response_variable: result
