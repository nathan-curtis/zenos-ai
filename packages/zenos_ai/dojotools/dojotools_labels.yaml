###############################################################################
# ZenOS-AI DojoTools: Labels
# Version: 5.3.0
#
# 5.3.0 (2026-09-04) -- area_assign/area_remove: entity registry area_id
#   assignment via Spook's homeassistant.add_entity_to_area /
#   homeassistant.remove_entity_from_area (confirmed real services --
#   checked custom_components/spook/services.yaml directly). Same
#   has_service positive-runtime-probe gate as update's spook_clean_update
#   path below. No fallback path -- unlike update_label, there's no
#   pre-Spook equivalent, so this errors cleanly if the probe fails
#   rather than degrading. Scope note: this tool now covers entity/area
#   registry management generally, not just labels narrowly -- reused
#   this file's existing target_entities/target_areas fields and
#   has_service infra rather than duplicating them in a new tool. A
#   future clean split (labels vs. registry-meta) may make sense if this
#   keeps growing -- not warranted yet.
#
# 5.2.0 (2026-09-04) -- 'update' mode gained a Spook >=5.3 clean-update
#   path (homeassistant.update_label), gated behind a positive has_service
#   runtime probe (never a version-number guess) -- eliminates the delete+
#   recreate+retag dance for installs where it's actually available. Old
#   path kept unconditionally as fallback; scheduled for removal once this
#   house's minimum supported Spook version is N-2 or newer.
#
# Scripts:
#   zen_dojotools_labels — Label CRUD. Read/modify the HA label index.
#     Core primitive for label-based entity resolution across ZenOS.
#     Backbone of the label system — do not retire.
#
# MIGRATED FROM: scripts.yaml (2026-03-05)
###############################################################################

script:

  zen_dojotools_labels:
    sequence:
    # --------------------------------------------------------------
    # Always normalize User/AI inputs so we don't have to react JIT
    # --------------------------------------------------------------
    - variables:
        caller_token: "{{- caller_token | default('') -}}"
    - variables:
        action: '{{ (mode | default("", true) | trim or action_type | default("", true) | trim) | lower or "read" }}'
        label_index: '{{ labels() |sort }}'
        user_labels: '{{ label_list | default([]) }}'
        have_target_user_labels: '{{ ( user_labels | length > 0 ) }}'
        target_ent_list: '{{ target_entities | default([]) }}'
        have_target_ents: '{{ ( target_ent_list | length > 0 ) }}'
        target_area_list: '{{ target_areas | default([]) }}'
        have_target_areas: '{{ ( target_area_list | length > 0 ) }}'
        labels_by_ent: "{% if have_target_ents %}\n  {\n  {%- for ent in target_ent_list
          %}\n    \"{{ ent }}\": {{ labels(ent) }}{{ \",\" if not loop.last else \"\"
          }}\n  {%- endfor %}\n  }\n{% else %}\n  {}\n{% endif %}"
        labels_by_area: "{% if have_target_areas %}\n  {\n  {%- for aid in target_area_list
          %}\n    \"{{ aid }}\": {{ labels(aid) }}{{ \",\" if not loop.last else \"\"
          }}\n  {%- endfor %}\n  }\n{% else %}\n  {}\n{% endif %}"
        label_details_by_label: "{% if have_target_user_labels %}\n  {\n  {%- for lbl
          in user_labels %}\n    \"{{ lbl }}\": {\n      \"description\": \"{{ label_description(
          lbl ) | default('') }}\"\n    }{{ \",\" if not loop.last else \"\" }}\n  {%-
          endfor %}\n  }\n{% else %}\n  {}\n{% endif %}"
        minihelp: 'Minihelp: actions = create, read, delete, tag, untag, update, reset, install, area_assign, area_remove. tag/untag accept target_entities and/or target_areas. area_assign requires target_entities + exactly one target_areas entry (Spook homeassistant.add_entity_to_area). area_remove requires target_entities only, clears the entity-level area override (Spook homeassistant.remove_entity_from_area) -- device area, if any, still applies afterward.'
        results_list: []
        failures_list: []
    # --- tool_manifest ---
    - choose:
      - conditions:
        - condition: template
          value_template: "{{- action == 'tool_manifest' -}}"
        sequence:
        - variables:
            result: >-
              {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
              {{- MF.tool_manifest(
                tool='zen_dojotools_labels',
                display_name='Labels — HA Label CRUD',
                tier='dojotools',
                version='5.1.0',
                health={'configured': true, 'status': 'ok', 'notes': []},
                required_labels=['dojotools'],
                optional_labels=['labels'],
                consumes=['action_type', 'label_list', 'target_entities', 'target_areas'],
                returns=['label_list', 'label_details'],
                failure_policy='hard',
                modes={'read': 'read', 'create': 'create', 'delete': 'delete', 'tag': 'tag', 'untag': 'untag', 'update': 'update', 'reset': 'reset', 'install': 'install', 'manifest': 'tool_manifest'},
                icon='mdi:tag-multiple',
                color='amber',
                stripe=3,
                impact='soft',
                mcp_exposed=true,

                caller_token=caller_token | default('')
              ) | from_json -}}
        - stop: labels tool manifest
          response_variable: result

    - choose:
      - conditions:
        - condition: template
          value_template: '{{ action not in [''tag'',''untag'',''create'',''delete'',''update'',''read'',''reset'',''install'',''area_assign'',''area_remove'']
            }}'
          alias: Error - invalid Action
        sequence:
        - variables:
            response:
              status: error
              error: Invalid action_type '{{ action_type }}'. {{ minihelp }}
              index: '{{ label_index }}'
              caller_token: '{{ caller_token }}'
        - stop: response
          response_variable: response
      - conditions:
        - condition: template
          value_template: '{{ action == ''create'' }}'
          alias: CREATE
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ user_labels | length == 0 }}'
              alias: User Labels are {}
            sequence:
            - variables:
                response:
                  status: error
                  error: Create requires at least one label. {{ minihelp }}
                  index: '{{ label_index }}'
                  caller_token: '{{ caller_token }}'
            - stop: pass var scope
              response_variable: response
        - variables:
            to_create: "[{% for label in user_labels if label | slugify(separator='_') not in label_index %}\n
              \ \"{{ label }}\"{% if not loop.last %},{% endif %}\n{% endfor %}]"
            already_exists: "[{% for label in user_labels if label | slugify(separator='_') in label_index %}\n
              \ \"{{ label }}\"{% if not loop.last %},{% endif %}\n{% endfor %}]"
            target_labels: "{% if confirm %}\n  {{ to_create }}\n{% else %}\n  []\n{%
              endif %}"
        - variables:
            response:
              status: '{{ ''ok'' if target_labels | count > 0 else ''start'' }}'
              action: create
              to_create: '{{ to_create }}'
              already_exists: '{{ already_exists }}'
              confirm: '{{ confirm }}'
              target_labels: '{{ target_labels }}'
              message: "{% if target_labels | count > 0 %}\n  Started Create.\n{% else
                %}\n  Some or all labels already existed and were skipped. Confirmation
                required.\n{% endif %}"
              caller_token: '{{ caller_token }}'
        - variables:
            # homeassistant.create_label doesn't support response_variable at
            # all (confirmed: HA rejects the whole call if you ask for one),
            # so per-item success/failure can't be read from a response — we
            # detect it by comparing the live label registry before and after
            # each attempt instead. This also sidesteps a real gap: HA's
            # create_label service can reject a name as "already in use" even
            # when our own pre-check above (comparing against the labels()
            # slug index) didn't flag it as existing — HA's internal label-ID
            # normalization can collide two names our slug convention treats
            # as distinct (e.g. 'servicedesk' vs the existing 'service_desk').
            # Previously that raised uncaught, aborting the whole repeat/batch
            # partway through with no record of what happened to items still
            # queued. continue_on_error keeps the batch going regardless; the
            # before/after check then tells us honestly whether each one
            # landed, without needing to parse error text at all.
            create_succeeded: []
            create_dupe_skipped: []
            create_errors: []
        - repeat:
            for_each: '{{ target_labels }}'
            sequence:
            - variables:
                _create_pre_existing: '{{ repeat.item | slugify(separator=''_'') in (labels() | list) }}'
            - if:
              - condition: template
                value_template: '{{ new_icon | default('''', true) != '''' }}'
              then:
              - action: homeassistant.create_label
                metadata: {}
                continue_on_error: true
                data:
                  name: '{{ repeat.item }}'
                  description: '{{ new_description | default('''', true) }}'
                  icon: '{{ new_icon }}'
                  color: '{{ new_color | default(''primary'', true) }}'
              else:
              - action: homeassistant.create_label
                metadata: {}
                continue_on_error: true
                data:
                  name: '{{ repeat.item }}'
                  description: '{{ new_description | default('''', true) }}'
                  color: '{{ new_color | default(''primary'', true) }}'
            - variables:
                _create_now_exists: '{{ repeat.item | slugify(separator=''_'') in (labels() | list) }}'
            - choose:
              - conditions: '{{ _create_now_exists and not _create_pre_existing }}'
                sequence:
                - variables:
                    create_succeeded: '{{ create_succeeded + [repeat.item] }}'
              - conditions: '{{ _create_now_exists and _create_pre_existing }}'
                sequence:
                - variables:
                    create_dupe_skipped: '{{ create_dupe_skipped + [repeat.item] }}'
              default:
              - variables:
                  create_errors: '{{ create_errors + [{''label'': repeat.item, ''error'': ''create_label call did not result in the label existing — check HA logs for the exact rejection reason''}] }}'
        - variables:
            created_count: '{{ create_succeeded | count }}'
            response:
              status: '{{ ''ok'' if created_count > 0 else (''partial'' if create_dupe_skipped | count > 0 else ''error'' if create_errors | count > 0 else ''partial'') }}'
              action: create
              confirm: '{{ confirm }}'
              created_labels: '{{ create_succeeded }}'
              already_existed: '{{ already_exists + create_dupe_skipped }}'
              creation_errors: '{{ create_errors }}'
              message: "{% if created_count > 0 %}\n  Create Action Complete.\n{% elif create_dupe_skipped | count > 0 and create_errors | count == 0 %}\n  All requested labels already existed (including some HA didn't report as pre-existing) — nothing new created.\n{% else %}\n  Create requires confirmation, no labels created.\n{% endif %}"
              caller_token: '{{ caller_token }}'
        - if:
          - condition: template
            value_template: '{{ created_count > 0 }}'
          then:
          - event: zen_event
            event_data:
              event:
                kind: label_mutation
                action: "{{ action }}"
        - stop: pass var scope
          response_variable: response
      - conditions:
        - alias: READ
          condition: template
          value_template: '{{ ( action == ''read'' ) or ( not action ) }}'
        sequence:
        - choose:
          - conditions:
            - alias: Valid READ
              condition: template
              value_template: '{{ action == ''read'' and ( have_target_user_labels or
                have_target_ents ) }}'
            sequence:
            - variables:
                response: "{{\n  {\n    \"status\": \"ok\",\n    \"action\": \"read\",\n
                  \   \"label_list\": user_labels,\n    \"label_details_by_label\":
                  label_details_by_label,\n    \"target_entities\": target_ent_list,\n
                  \   \"labels_by_ent\": labels_by_ent,\n    \"target_areas\": target_area_list,\n
                  \   \"labels_by_area\": labels_by_area\n  }\n}}"
            - variables:
                response: "{{ response | combine({'caller_token': caller_token | default('')}) if response is mapping else response }}"
            - stop: Pass context
              response_variable: response
        - variables:
            response: "{{ {\n  'status': 'ok',\n  'action': 'read_index',\n  'target':
              '*',        \n  'index': label_index\n} }}"
        - variables:
            response: "{{ response | combine({'caller_token': caller_token | default('')}) if response is mapping else response }}"
        - stop: pass var scope
          response_variable: response
      - conditions:
        - alias: DELETE
          condition: template
          value_template: '{{ action == ''delete'' }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ user_labels | length == 0 }}'
              alias: User Labels are {}
            sequence:
            - variables:
                response:
                  status: error
                  error: Delete requires at least one label. {{ minihelp }}
                  index: '{{ label_index }}'
                  caller_token: '{{ caller_token }}'
            - stop: pass var scope
              response_variable: response
        - variables:
            to_delete: "[{% for label in user_labels if label | slugify(separator='_') in label_index %}\n
              \ \"{{ label }}\"{% if not loop.last %},{% endif %}\n{% endfor %}]"
            already_exists: "[{% for label in user_labels if label | slugify(separator='_') not in label_index %}\n
              \ \"{{ label }}\"{% if not loop.last %},{% endif %}\n{% endfor %}]"
            target_labels: "{% if confirm %}\n  {{ to_delete }}\n{% else %}\n  []\n{%
              endif %}"
        - variables:
            response:
              status: '{{ ''ok'' if target_labels | count > 0 else ''start'' }}'
              action: delete
              to_delete: '{{ to_delete }}'
              already_exists: '{{ already_exists }}'
              confirm: '{{ confirm }}'
              target_labels: '{{ target_labels }}'
              message: "{% if target_labels | count > 0 %}\n  Started Delete.\n{% else
                %}\n  Some or all labels were skipped. Confirmation required.\n{% endif
                %}"
              caller_token: '{{ caller_token }}'
        - repeat:
            for_each: '{{ target_labels }}'
            sequence:
            - action: homeassistant.delete_label
              data:
                label_id: '{{ repeat.item | slugify(separator=''_'') }}'
        - variables:
            deleted_count: '{{ target_labels | count }}'
            response:
              status: '{{ ''ok'' if deleted_count > 0 else ''partial'' }}'
              action: delete
              confirm: '{{ confirm }}'
              deleted_labels: '{{ target_labels }}'
              message: "{% if deleted_count > 0 %}\n  Delete Action Complete.\n{% else
                %}\n  Delete requires confirmation, no labels deleted.\n{% endif %}"
              caller_token: '{{ caller_token }}'
        - if:
          - condition: template
            value_template: '{{ deleted_count > 0 }}'
          then:
          - event: zen_event
            event_data:
              event:
                kind: label_mutation
                action: "{{ action }}"
        - stop: pass var scope
          response_variable: response
        alias: DELETE
      - conditions:
        - condition: template
          value_template: '{{ action == ''tag'' }}'
          alias: TAG
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ user_labels | length == 0 }}'
              alias: Error - No Labels
            sequence:
            - variables:
                response:
                  status: error
                  error: Tag requires at least one label. {{ minihelp }}
                  index: '{{ label_index }}'
                  caller_token: '{{ caller_token }}'
            - stop: pass var scope
              response_variable: response
          - conditions:
            - alias: Error - no Targets
              condition: template
              value_template: '{{ target_ent_list | length == 0 and target_area_list | length == 0 }}'
            sequence:
            - variables:
                response:
                  status: error
                  error: Tag requires at least one target_entities or target_areas entry. {{ minihelp }}
                  index: '{{ label_index }}'
                  caller_token: '{{ caller_token }}'
            - stop: pass var scope
              response_variable: response
        - if:
          - condition: template
            value_template: '{{ target_ent_list | length > 0 }}'
          then:
          - action: homeassistant.add_label_to_entity
            data:
              label_id: '{{ user_labels | map("slugify") | list }}'
              entity_id: '{{ target_ent_list }}'
        - if:
          - condition: template
            value_template: '{{ target_area_list | length > 0 }}'
          then:
          - action: homeassistant.add_label_to_area
            data:
              label_id: '{{ user_labels | map("slugify") | list }}'
              area_id: '{{ target_area_list }}'
        - variables:
            _tag_label_ids: '{{ user_labels | map("slugify") | list }}'
            _tag_failed_entities: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for ent in target_ent_list -%}
                {%- set present = labels(ent) | list -%}
                {%- set missing = _tag_label_ids | reject('in', present) | list -%}
                {%- if missing | length > 0 -%}
                  {%- set ns.out = ns.out + [{'entity_id': ent, 'missing_labels': missing}] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out }}
            _tag_failed_areas: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for aid in target_area_list -%}
                {%- set present = labels(aid) | list -%}
                {%- set missing = _tag_label_ids | reject('in', present) | list -%}
                {%- if missing | length > 0 -%}
                  {%- set ns.out = ns.out + [{'area_id': aid, 'missing_labels': missing}] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out }}
            response:
              status: "{{ 'warning' if (_tag_failed_entities | length > 0 or _tag_failed_areas | length > 0) else 'ok' }}"
              action: tag
              affected_labels: '{{ user_labels }}'
              affected_entities: '{{ target_ent_list }}'
              affected_areas: '{{ target_area_list }}'
              verification:
                confirmed: "{{ _tag_failed_entities | length == 0 and _tag_failed_areas | length == 0 }}"
                failed_entities: "{{ _tag_failed_entities }}"
                failed_areas: "{{ _tag_failed_areas }}"
                note: "{{ 'HA accepted the label service call but readback did not show all requested labels.' if (_tag_failed_entities | length > 0 or _tag_failed_areas | length > 0) else 'Readback confirmed requested label assignments.' }}"
              caller_token: '{{ caller_token }}'
        - event: zen_event
          event_data:
            event:
              kind: label_mutation
              action: "{{ action }}"
        - stop: pass var scope
          response_variable: response
      - conditions:
        - alias: UNTAG
          condition: template
          value_template: '{{ action == ''untag'' }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ user_labels | length == 0 }}'
              alias: Error - No Labels
            sequence:
            - variables:
                response:
                  status: error
                  error: Untag requires at least one label. {{ minihelp }}
                  index: '{{ label_index }}'
                  caller_token: '{{ caller_token }}'
            - stop: pass var scope
              response_variable: response
          - conditions:
            - alias: Error - no Targets
              condition: template
              value_template: '{{ target_ent_list | length == 0 and target_area_list | length == 0 }}'
            sequence:
            - variables:
                response:
                  status: error
                  error: Untag requires at least one target_entities or target_areas entry. {{ minihelp }}
                  index: '{{ label_index }}'
                  caller_token: '{{ caller_token }}'
            - stop: pass var scope
              response_variable: response
        - if:
          - condition: template
            value_template: '{{ target_ent_list | length > 0 }}'
          then:
          - action: homeassistant.remove_label_from_entity
            data:
              label_id: '{{ user_labels | map("slugify") | list }}'
              entity_id: '{{ target_ent_list }}'
        - if:
          - condition: template
            value_template: '{{ target_area_list | length > 0 }}'
          then:
          - action: homeassistant.remove_label_from_area
            data:
              label_id: '{{ user_labels | map("slugify") | list }}'
              area_id: '{{ target_area_list }}'
        - variables:
            _untag_label_ids: '{{ user_labels | map("slugify") | list }}'
            _untag_failed_entities: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for ent in target_ent_list -%}
                {%- set present = labels(ent) | list -%}
                {%- set still_present = _untag_label_ids | select('in', present) | list -%}
                {%- if still_present | length > 0 -%}
                  {%- set ns.out = ns.out + [{'entity_id': ent, 'still_present_labels': still_present}] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out }}
            _untag_failed_areas: >-
              {%- set ns = namespace(out=[]) -%}
              {%- for aid in target_area_list -%}
                {%- set present = labels(aid) | list -%}
                {%- set still_present = _untag_label_ids | select('in', present) | list -%}
                {%- if still_present | length > 0 -%}
                  {%- set ns.out = ns.out + [{'area_id': aid, 'still_present_labels': still_present}] -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.out }}
            response:
              status: "{{ 'warning' if (_untag_failed_entities | length > 0 or _untag_failed_areas | length > 0) else 'ok' }}"
              action: untag
              affected_labels: '{{ user_labels }}'
              affected_entities: '{{ target_ent_list }}'
              affected_areas: '{{ target_area_list }}'
              verification:
                confirmed: "{{ _untag_failed_entities | length == 0 and _untag_failed_areas | length == 0 }}"
                failed_entities: "{{ _untag_failed_entities }}"
                failed_areas: "{{ _untag_failed_areas }}"
                note: "{{ 'HA accepted the label service call but readback still showed at least one removed label.' if (_untag_failed_entities | length > 0 or _untag_failed_areas | length > 0) else 'Readback confirmed requested label removals.' }}"
              caller_token: '{{ caller_token }}'
        - event: zen_event
          event_data:
            event:
              kind: label_mutation
              action: "{{ action }}"
        - stop: pass var scope
          response_variable: response
      - conditions:
        - alias: RESET (soft)
          condition: template
          value_template: '{{ action == ''reset'' }}'
        sequence:
        - if:
          - condition: template
            value_template: '{{ not confirm }}'
          then:
          - variables:
              response:
                status: error
                error: >-
                  RESET requires confirm: true. This untags ALL entities from ALL
                  zen_ labels. Labels survive — only assignments are wiped. Use
                  when label IDs exist but assignments are wrong or missing. For
                  nuclear (delete labels too) use zen_admintools_reset_labels.
                caller_token: '{{ caller_token }}'
          - stop: confirm required
            response_variable: response
        - variables:
            zen_labels: '{{ labels() | select(''match'', ''^zen_'') | list }}'
        - repeat:
            for_each: '{{ zen_labels }}'
            sequence:
            - variables:
                lbl_entities: '{{ label_entities(repeat.item) | list }}'
            - if:
              - condition: template
                value_template: '{{ lbl_entities | length > 0 }}'
              then:
              - action: homeassistant.remove_label_from_entity
                data:
                  label_id: '{{ repeat.item }}'
                  entity_id: '{{ lbl_entities }}'
        - event: zen_resolver_refresh
        - variables:
            response:
              status: ok
              action: reset
              labels_cleared: '{{ zen_labels | length }}'
              message: >-
                Soft reset complete. {{ zen_labels | length }} zen_ label(s)
                cleared. All assignments wiped. zen_resolver_refresh fired —
                Flynn will re-assign on next label health check.
              caller_token: '{{ caller_token }}'
        - event: zen_event
          event_data:
            event:
              kind: label_mutation
              action: "{{ action }}"
        - stop: pass var scope
          response_variable: response
      - conditions:
        - alias: INSTALL
          condition: template
          value_template: '{{ action == ''install'' }}'
        sequence:
        - if:
          - condition: template
            value_template: '{{ not confirm }}'
          then:
          - variables:
              response:
                status: start
                action: install
                message: >-
                  INSTALL deletes ALL zen_ labels and recreates the canonical 16
                  with icons, colors, and descriptions. zen_resolver_refresh fires
                  on completion — Flynn will re-tag all core cabinets.
                  Requires confirm: true.
                catalog_count: 16
                caller_token: '{{ caller_token }}'
          - stop: confirm required
            response_variable: response
        - variables:
            _existing_zen: '{{ labels() | select(''match'', ''^zen_'') | list }}'
            _catalog:
              - {name: 'Zen Cabinet',                  icon: 'mdi:file-cabinet',    color: 'deep-purple', description: 'Parent label for all ZenOS cabinet sensors.'}
              - {name: 'Zen System Cabinet',            icon: 'mdi:server-security', color: 'red',         description: 'ZenOS system core and OS cabinet.'}
              - {name: 'Zen Dojo Cabinet',              icon: 'mdi:sword-cross',     color: 'orange',      description: 'ZenOS tool, automation, and DojoTools cabinet.'}
              - {name: 'Zen Kata Cabinet',              icon: 'mdi:script-text',     color: 'amber',       description: 'ZenOS KFC component catalog cabinet.'}
              - {name: 'Zen Default Household',         icon: 'mdi:home-group',      color: 'green',       description: 'Default household identity group.'}
              - {name: 'Zen Default Household Cabinet', icon: 'mdi:home',            color: 'green',       description: 'Default household cabinet.'}
              - {name: 'Zen Household Cabinet',         icon: 'mdi:home-city',       color: 'light-green', description: 'Household cabinet (any provisioned slot).'}
              - {name: 'Zen Default Family',            icon: 'mdi:account-group',   color: 'teal',        description: 'Default family identity group.'}
              - {name: 'Zen Default Family Cabinet',    icon: 'mdi:account-multiple', color: 'teal',       description: 'Default family cabinet.'}
              - {name: 'Zen Family Cabinet',            icon: 'mdi:account-child',   color: 'cyan',        description: 'Family cabinet (any provisioned slot).'}
              - {name: 'Zen Default User Cabinet',      icon: 'mdi:account',         color: 'blue',        description: 'Default user cabinet.'}
              - {name: 'Zen User Cabinet',              icon: 'mdi:account-circle',  color: 'light-blue',  description: 'User cabinet (any provisioned slot).'}
              - {name: 'Zen Default AI User Cabinet',   icon: 'mdi:robot',           color: 'indigo',      description: 'Default AI user cabinet.'}
              - {name: 'Zen AI User Cabinet',           icon: 'mdi:robot-happy',     color: 'purple',      description: 'AI user cabinet (any provisioned slot).'}
              - {name: 'Zen History Cabinet',           icon: 'mdi:history',         color: 'brown',       description: 'ZenOS history and long-term storage cabinet.'}
              - {name: 'Zen Index Cabinet',             icon: 'mdi:magnify',         color: 'blue-grey',   description: 'ZenOS index and scratchpad cabinet.'}
        - repeat:
            for_each: '{{ _existing_zen }}'
            sequence:
            - action: homeassistant.delete_label
              data:
                label_id: '{{ repeat.item }}'
        - repeat:
            for_each: '{{ _catalog }}'
            sequence:
            - action: homeassistant.create_label
              data:
                name: '{{ repeat.item.name }}'
                description: '{{ repeat.item.description }}'
                icon: '{{ repeat.item.icon }}'
                color: '{{ repeat.item.color }}'
        - event: zen_resolver_refresh
        - variables:
            response:
              status: ok
              action: install
              deleted_count: '{{ _existing_zen | length }}'
              created_count: 16
              message: >-
                Install complete. {{ _existing_zen | length }} zen_ label(s) deleted,
                16 canonical labels created with icons and colors.
                zen_resolver_refresh fired — Flynn will re-tag core cabinets.
              caller_token: '{{ caller_token }}'
        - event: zen_event
          event_data:
            event:
              kind: label_mutation
              action: "{{ action }}"
        - stop: pass var scope
          response_variable: response
        alias: INSTALL
      - conditions:
        - alias: UPDATE
          condition: template
          value_template: '{{ action == ''update'' }}'
        sequence:
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ user_labels | length == 0 }}'
              alias: No label specified
            sequence:
            - variables:
                response:
                  status: error
                  error: Update requires exactly one label. {{ minihelp }}
                  index: '{{ label_index }}'
                  caller_token: '{{ caller_token }}'
            - stop: pass var scope
              response_variable: response
          - conditions:
            - condition: template
              value_template: '{{ user_labels | length > 1 }}'
              alias: Too many labels
            sequence:
            - variables:
                response:
                  status: error
                  error: Update operates on one label at a time. {{ minihelp }}
                  index: '{{ label_index }}'
                  caller_token: '{{ caller_token }}'
            - stop: pass var scope
              response_variable: response
        - variables:
            _upd_name: '{{ user_labels[0] }}'
            _upd_id: '{{ user_labels[0] | slugify(separator=''_'') }}'
            _has_change: '{{ new_description | default('''', true) != '''' or new_icon
              | default('''', true) != '''' or new_color | default('''', true) != '''' }}'
            _force_rewrite: '{{ force_rewrite | default(false) | bool }}'
        # ── Existence guard -- shared by BOTH the clean-update
        # and delete+recreate paths below. This check never
        # existed before -- 'update' on a typo'd/nonexistent label name fell
        # through to the old path's delete_label (silent no-op on a
        # nonexistent id) + create_label (which doesn't care whether one
        # existed -- just creates a NEW label under that name). That's worse
        # than an error: a silent, wrong write. label_name() is a real
        # Jinja-only HA template global (no REST) -- resolves a label_id to
        # its display name, or None if it doesn't exist.
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ label_name(_upd_id) is none }}'
              alias: Label does not exist
            sequence:
            - variables:
                response:
                  status: error
                  error: >-
                    Label '{{ _upd_name }}' (id: {{ _upd_id }}) does not exist --
                    update refuses to silently create it. Use 'create' if you
                    meant to add a new label.
                  caller_token: '{{ caller_token }}'
            - stop: pass var scope
              response_variable: response
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ not _has_change }}'
            sequence:
            - variables:
                response:
                  status: error
                  error: Update requires at least one of new_description, new_icon, new_color.
                  caller_token: '{{ caller_token }}'
            - stop: pass var scope
              response_variable: response
        - alias: Pre-read existing label metadata via HA REST API
          if:
            - condition: template
              value_template: '{{ not _force_rewrite }}'
          then:
            - action: rest_command.ha_api_get
              data:
                path: labels
              response_variable: _labels_r
        - variables:
            _labels_ok: '{{ not _force_rewrite and (_labels_r.status | default(0) | int == 200) }}'
            _labels_all: >-
              {{ _labels_r.content if _labels_ok and _labels_r.content is iterable else [] }}
            _existing: >-
              {%- set found = _labels_all | selectattr('label_id', 'eq', _upd_id) | list -%}
              {{ found | first | default({}) }}
            _upd_desc: >-
              {{ new_description if new_description | default('', true) != ''
                 else _existing.get('description', '') | default('', true) }}
            _upd_icon: >-
              {{ new_icon if new_icon | default('', true) != ''
                 else _existing.get('icon', '') | default('', true) }}
            _upd_color: >-
              {{ new_color if new_color | default('', true) != ''
                 else _existing.get('color', 'primary') | default('primary', true) }}
        - if:
          - condition: template
            value_template: '{{ not confirm }}'
          then:
          - variables:
              response:
                status: start
                action: update
                label: '{{ _upd_name }}'
                label_id: '{{ _upd_id }}'
                new_description: '{{ _upd_desc }}'
                new_icon: '{{ _upd_icon }}'
                new_color: '{{ _upd_color }}'
                preserved_from_existing: '{{ _labels_ok }}'
                message: Confirmation required. Update will delete and recreate the
                  label then restore all entity associations.
                caller_token: '{{ caller_token }}'
          - stop: confirm required
            response_variable: response
        # ── Spook >=5.3 clean-update probe ──────────────────────────────────
        # Spook v5.3.0 added a real update-label action, eliminating the
        # delete+recreate+retag dance below. POSITIVE runtime detection only,
        # never a version-number guess. Same has_service probe pattern
        # dojotools_lights.yaml already uses for its Spook v5.2.0 gates
        # (never assume, always confirm the real service exists before
        # calling it). If found, use the one-call path and stop -- the old
        # delete+recreate path below is UNTOUCHED as the fallback for any
        # install where the probe comes back negative (Spook not installed,
        # older version, service renamed, etc.).
        # RETIREMENT NOTE: once this house's minimum supported Spook version
        # guarantees the new service (N-2 versions back), delete the old
        # delete+recreate branch below entirely and always take this path
        # unconditionally.
        - action: script.zen_sutra_ha_api
          continue_on_error: true
          data:
            mode: services
            has_service: homeassistant.update_label
          response_variable: _lbl_svc_check
        - variables:
            _lbl_clean_update_available: >-
              {{ _lbl_svc_check is mapping and _lbl_svc_check.get('found', false) == true }}
        - if:
          - condition: template
            value_template: '{{ _lbl_clean_update_available }}'
          then:
          - if:
            - condition: template
              value_template: "{{ _upd_icon != '' }}"
            then:
            - action: homeassistant.update_label
              continue_on_error: true
              data:
                label_id: '{{ _upd_id }}'
                name: '{{ _upd_name }}'
                description: '{{ _upd_desc }}'
                icon: '{{ _upd_icon }}'
                color: '{{ _upd_color }}'
            else:
            # icon field rejects empty string ("not a valid value at 'icon'")
            # -- must be omitted entirely, not passed blank, same as the old
            # delete+recreate path below already does for
            # homeassistant.create_label.
            - action: homeassistant.update_label
              continue_on_error: true
              data:
                label_id: '{{ _upd_id }}'
                name: '{{ _upd_name }}'
                description: '{{ _upd_desc }}'
                color: '{{ _upd_color }}'
            # No response_variable: homeassistant.update_label is a
            # fire-and-forget service with no response data ("Script does
            # not support 'response_variable' for service ... which does
            # not support response data").
            #
            # No REST re-read verification -- /api/labels is NOT a real HA
            # REST API endpoint (404, not an auth failure -- label registry
            # is WebSocket-only in HA core).
            # This was a PRE-EXISTING latent bug: the old delete+recreate
            # path's own pre-read below has always hit this same 404 and
            # silently degraded to "REST pre-read unavailable," just never
            # traced to root cause before now. Trusting update_label the
            # same way this file already trusts create_label/delete_label
            # elsewhere (continue_on_error, no deep verification) --
            # consistent risk level with the rest of this tool, not a new
            # gap introduced here.
          - variables:
              response:
                status: ok
                action: update
                label: '{{ _upd_name }}'
                label_id: '{{ _upd_id }}'
                method: spook_clean_update
                message: >-
                  Update complete via Spook's native update-label action --
                  no delete/recreate, no entity retagging needed, label
                  never briefly stopped existing.
                caller_token: '{{ caller_token }}'
          - stop: clean update path done
            response_variable: response
        - variables:
            _upd_entities: '{{ label_entities(_upd_id) | list }}'
        - action: homeassistant.delete_label
          data:
            label_id: '{{ _upd_id }}'
        - if:
          - condition: template
            value_template: '{{ _upd_icon != '''' }}'
          then:
          - action: homeassistant.create_label
            data:
              name: '{{ _upd_name }}'
              description: '{{ _upd_desc }}'
              icon: '{{ _upd_icon }}'
              color: '{{ _upd_color }}'
          else:
          - action: homeassistant.create_label
            data:
              name: '{{ _upd_name }}'
              description: '{{ _upd_desc }}'
              color: '{{ _upd_color }}'
        - if:
          - condition: template
            value_template: '{{ _upd_entities | length > 0 }}'
          then:
          - action: homeassistant.add_label_to_entity
            data:
              label_id: '{{ _upd_id }}'
              entity_id: '{{ _upd_entities }}'
        - variables:
            response:
              status: ok
              action: update
              label: '{{ _upd_name }}'
              label_id: '{{ _upd_id }}'
              retagged_count: '{{ _upd_entities | length }}'
              preserved_from_existing: '{{ _labels_ok }}'
              message: >-
                Update complete. {{ _upd_entities | length }} entity association(s) restored.
                {% if _labels_ok %}Icon/color/description preserved from existing where not provided.
                {% else %}REST pre-read unavailable — only caller-provided fields applied.{% endif %}
              caller_token: '{{ caller_token }}'
        - event: zen_event
          event_data:
            event:
              kind: label_mutation
              action: "{{ action }}"
        - stop: pass var scope
          response_variable: response
        alias: UPDATE

    # ── area_assign / area_remove (2026-09-04) -- entity registry
    # area_id assignment via Spook's homeassistant.add_entity_to_area /
    # homeassistant.remove_entity_from_area. Confirmed real, already-
    # installed Spook services (checked custom_components/spook/
    # services.yaml directly). Same has_service positive-runtime-probe
    # gate as update's spook_clean_update path -- never a version-number
    # guess. Distinct from labels (a many-to-many tag), area assignment
    # is the single-value entity_registry.area_id field -- a different HA
    # concept this tool didn't cover until now. No fallback path: unlike
    # update_label (which has an older delete+recreate equivalent),
    # there's no pre-Spook way to do this at all -- if the probe fails,
    # this errors cleanly rather than degrading. ──
    - if:
      - condition: template
        value_template: "{{- action == 'area_assign' -}}"
      then:
        - if:
          - condition: template
            value_template: '{{ not confirm }}'
          then:
          - variables:
              response:
                status: error
                error: confirm_required
                message: "area_assign requires confirm=true."
                caller_token: '{{ caller_token }}'
          - stop: area_assign confirm required
            response_variable: response
        - if:
          - condition: template
            value_template: '{{ target_area_list | length != 1 or not have_target_ents }}'
          then:
          - variables:
              response:
                status: error
                error: bad_targets
                message: "area_assign requires exactly one target_areas entry and at least one target_entities entry (an entity can only be in one area)."
                caller_token: '{{ caller_token }}'
          - stop: area_assign bad targets
            response_variable: response
        - if:
          - condition: template
            value_template: '{{ response is not defined }}'
          then:
          - action: script.zen_sutra_ha_api
            continue_on_error: true
            data:
              mode: services
              has_service: homeassistant.add_entity_to_area
            response_variable: _aa_svc_check
          - if:
            - condition: template
              value_template: '{{ not (_aa_svc_check is mapping and _aa_svc_check.get(''found'', false) == true) }}'
            then:
            - variables:
                response:
                  status: error
                  error: service_unavailable
                  message: "homeassistant.add_entity_to_area not found -- requires Spook. Check the Spook integration is installed and current."
                  caller_token: '{{ caller_token }}'
            else:
            - action: homeassistant.add_entity_to_area
              data:
                area_id: '{{ target_area_list[0] }}'
                entity_id: '{{ target_ent_list }}'
            - variables:
                response:
                  status: ok
                  action: area_assign
                  area_id: '{{ target_area_list[0] }}'
                  entity_id: '{{ target_ent_list }}'
                  message: "{{ target_ent_list | length }} entit{{ 'y' if target_ent_list | length == 1 else 'ies' }} assigned to area {{ target_area_list[0] }}."
                  caller_token: '{{ caller_token }}'
            - event: zen_event
              event_data:
                event:
                  kind: entity_area_mutation
                  action: area_assign
            - stop: area_assign done
              response_variable: response

    - if:
      - condition: template
        value_template: "{{- action == 'area_remove' -}}"
      then:
        - if:
          - condition: template
            value_template: '{{ not confirm }}'
          then:
          - variables:
              response:
                status: error
                error: confirm_required
                message: "area_remove requires confirm=true."
                caller_token: '{{ caller_token }}'
          - stop: area_remove confirm required
            response_variable: response
        - if:
          - condition: template
            value_template: '{{ not have_target_ents }}'
          then:
          - variables:
              response:
                status: error
                error: bad_targets
                message: "area_remove requires at least one target_entities entry. Note: this only clears an entity-level area override -- the entity will still show its DEVICE's area afterward, if the device has one (Spook's own documented behavior)."
                caller_token: '{{ caller_token }}'
          - stop: area_remove bad targets
            response_variable: response
        - if:
          - condition: template
            value_template: '{{ response is not defined }}'
          then:
          - action: script.zen_sutra_ha_api
            continue_on_error: true
            data:
              mode: services
              has_service: homeassistant.remove_entity_from_area
            response_variable: _ar_svc_check
          - if:
            - condition: template
              value_template: '{{ not (_ar_svc_check is mapping and _ar_svc_check.get(''found'', false) == true) }}'
            then:
            - variables:
                response:
                  status: error
                  error: service_unavailable
                  message: "homeassistant.remove_entity_from_area not found -- requires Spook. Check the Spook integration is installed and current."
                  caller_token: '{{ caller_token }}'
            else:
            - action: homeassistant.remove_entity_from_area
              data:
                entity_id: '{{ target_ent_list }}'
            - variables:
                response:
                  status: ok
                  action: area_remove
                  entity_id: '{{ target_ent_list }}'
                  message: "{{ target_ent_list | length }} entit{{ 'y' if target_ent_list | length == 1 else 'ies' }} cleared of entity-level area override. Device area (if any) still applies."
                  caller_token: '{{ caller_token }}'
            - event: zen_event
              event_data:
                event:
                  kind: entity_area_mutation
                  action: area_remove
            - stop: area_remove done
              response_variable: response

    - choose:
      - conditions:
        - alias: No response defined yet
          condition: template
          value_template: '{{ response is not defined or response is string }}'
        sequence:
        - variables:
            response: '{{ response | default({''status'': ''error'', ''error'': ''Unknown
              error occurred.'', ''index'': label_index, ''help'': minihelp}) }}'
        - variables:
            response: "{{ response | combine({'caller_token': caller_token | default('')}) if response is mapping else response }}"
        - stop: Return
          response_variable: response
    alias: Zen DojoTools Labels
    description: >-
      GENERAL-PURPOSE HA label + entity/area registry management tool.
      tag/untag assigns or removes any HA label on any entity_id or
      area_id via MCP — no HA UI needed. area_assign/area_remove set or
      clear an entity's registry area_id (a different axis than labels —
      single-value, not many-to-many; via Spook). Also the ZenOS scope
      primitive: labels drive KFC scan scope, alert rules, heartbeat policy, room
      topology, and bootstrap discovery (zen_kfc_provider = how KFC bootstrap
      finds provider scripts).

      FAST: read (no args) = full label index. read + target_entities = labels
      on those. tag/untag = move entities between scopes, or apply a new label
      to a new entity (e.g. tag a script with zen_kfc_provider for bootstrap
      discovery).

      MOAR: update = patch description/icon/color. create = register a label.
      install = reset all zen_ labels to canonical defs.

      EXAMPLES:
        untag label_list=[old] target_entities=[entity.id]
        tag label_list=[zen_kfc_provider] target_entities=[script.foo] confirm=true

      FOOTGUNS: delete drops ALL associations instantly, permanent. install
      clobbers zen_ customizations — never mid-session w/o asking. confirm:
      true required for all writes — safety gate, not a formality.
    fields:
      mode:
        description: '''create'', ''read'', ''delete'', ''tag'', ''untag'', ''update'',
          ''reset'', ''install'', ''area_assign'', ''area_remove'''
        required: false
        selector:
          select:
            options:
            - create
            - read
            - delete
            - tag
            - untag
            - update
            - reset
            - install
            - area_assign
            - area_remove
            - tool_manifest
        default: read
      action_type:
        description: "Deprecated alias for mode. Use mode instead."
        required: false
        selector:
          text:
      target_entities:
        description: >-
          List of entity_ids to tag or untag. Optional if target_areas
          provided for tag/untag. Required for area_assign/area_remove
          (the entities being moved).
        required: false
        selector:
          entity:
            multiple: true
      target_areas:
        description: >-
          List of area_ids to tag or untag. Optional if target_entities
          provided for tag/untag. For area_assign: required, exactly ONE
          entry — an entity can only be in one area at a time (Spook's
          own service constraint). Not used by area_remove (clearing
          needs no destination area).
        required: false
        selector:
          text:
            multiple: true
      label_list:
        description: List of labels (case-insensitive). Required for 'tag', 'untag',
          'create', 'delete', and 'update' (exactly one for update).
        required: false
        selector:
          text:
            multiple: true
      new_description:
        description: Label description. Used by 'create' and 'update'.
        required: false
        selector:
          text:
      new_icon:
        description: MDI icon slug (e.g. mdi:home). Used by 'create' and 'update'.
          Omit to use HA default. Empty string is rejected by HA.
        required: false
        selector:
          text:
      new_color:
        description: Label color. Used by 'create' (default primary) and 'update'.
        required: false
        selector:
          text:
      force_rewrite:
        description: >-
          UPDATE only. If true, skip the pre-read and overwrite — unprovided
          fields revert to HA defaults. Default false (patch semantics).
        required: false
        default: false
        selector:
          boolean:
      confirm:
        description: Required for all write and destructive actions (create, delete,
          update, reset, install). Always ask the user before passing true — this
          is a safety gate, not a formality.
        required: false
        default: false
        selector:
          boolean:
      caller_token:
        name: Caller Token
        required: false
        default: ''
        selector:
          text:
        description: 'Reserved. Governance stub — echoed in response. SP1 enforcement
          not yet active.'
    icon: mdi:label-multiple
