###############################################################################
# ZenOS-AI — zen_admintools_portainer_acl
#
# The ONLY writer of Portainer feature config: integrations_config.portainer
# (url, controllable_containers allow-list, min_cert_level). zen_dojotools_infra
# (the container-control codex) only ever reads this — it has no write path.
#
# No per-caller_id ACL exists. There is no mechanism (yet) to bind an MCP
# session to a specific persona cabinet, so any caller_id string is
# unauthenticated and untrustworthy as a security boundary. Every gated action
# is checked against the default agent's own infra_container_control
# certification instead — acting as the default agent, or denied. This tool's
# only levers are the connection, the allow-list, and the global minimum cert
# levels required for x/d actions.
#
# Every write requires confirm=true, same as this repo's other admin-plane
# writes (stacks_bulk_edit delete/split, reload_all). This is core
# infrastructure surface — defense in depth, not a formality.
#
# This is a public tool. No real names/emails/PII anywhere in this file.
###############################################################################

script:
  zen_admintools_portainer_acl:
    alias: Zen AdminTools — Portainer ACL
    description: >
      Admin-only surface for Portainer feature config: connection URL,
      controllable-containers allow-list, and global minimum certification
      levels for x/d container actions. There is no per-caller_id ACL — every
      gated action is checked against the default agent's own certification.
      zen_dojotools_infra reads what this tool writes, but cannot write it
      itself. mode=help for full reference.
    mode: queued
    max: 3
    fields:
      mode:
        name: Mode
        description: "help | config_get | config_set"
        default: help
        selector:
          select:
            options:
              - help
              - config_get
              - config_set
              - tool_manifest
      url:
        name: Portainer URL
        description: "config_set only. Direct: https://portainer.<your-domain>:9443/ (Portainer's default HTTPS port; 9000 for plain HTTP). Behind a reverse-proxy CNAME: https://<your-configured-hostname>/ — no port needed."
        default: ""
        selector:
          text:
      controllable_containers:
        name: Controllable Containers
        description: "config_set only. A real YAML/JSON list of container-name substrings/patterns, e.g. [\"wud\"] — pass as an actual list, not a quoted string. Replaces the existing allow-list. Omit to leave unchanged."
        default: []
        selector:
          object:
      min_cert_x:
        name: Min Cert Level (x)
        description: "config_set only. Global minimum infra_container_control cert level (on the default agent's cabinet) required for x-class actions (container_restart/start). Default 2. Omit to leave unchanged."
        selector:
          number:
            min: 1
            max: 4
      min_cert_d:
        name: Min Cert Level (d)
        description: "config_set only. Global minimum infra_container_control cert level required for d-class actions (container_stop/remove), on top of the household-admin acknowledgment. Default 3. Omit to leave unchanged."
        selector:
          number:
            min: 1
            max: 4
      confirm:
        name: Confirm
        description: Required true for config_set. Safety gate, not a formality.
        default: false
        selector:
          boolean:
      caller_token:
        name: Caller Token
        selector:
          text:

    sequence:
      - variables:
          _mode: "{{ mode | default('help') | string | trim | lower }}"
          _hh: "{{ states('sensor.zen_default_household_cabinet_resolved') }}"
          _confirm: "{{ confirm | default(false) | bool }}"

      - choose:
          - conditions: "{{ _mode == 'help' }}"
            sequence:
              - variables:
                  final_response:
                    status: info
                    tool: zen_admintools_portainer_acl
                    modes:
                      config_get: "Read current url, controllable_containers allow-list, and min_cert_level."
                      config_set: "Set url and/or replace controllable_containers and/or min_cert_level. confirm=true required."
                    identity_model: "No per-caller_id ACL. Every gated action in zen_dojotools_infra is checked against the default agent's own infra_container_control certification — there is no way to grant a different identity broader access than the default agent has."
                    mcp_exposed: false
                    exposure_note: "This tool must NEVER be exposed to MCP/Assist. Call it only via HA Developer Tools > Actions (script.zen_admintools_portainer_acl), direct dashboard button, or another human-operated path — never agent-callable."
                    caller_token: "{{ caller_token | default('') }}"
              - stop: help
                response_variable: final_response

      - choose:
          - conditions: "{{ _mode == 'tool_manifest' }}"
            sequence:
              - variables:
                  final_response:
                    status: ok
                    tool: zen_admintools_portainer_acl
                    tier: admintools
                    version: "2.0.0"
                    risk_class: infra_control_admin
                    mcp_exposed: false
                    writes: [integrations_config.portainer]
                    caller_token: "{{ caller_token | default('') }}"
              - stop: manifest
                response_variable: final_response

      - action: script.zen_dojotools_filecabinet
        response_variable: _cfg_raw
        continue_on_error: true
        data:
          action_type: get
          volume_entity_id: "{{ _hh }}"
          path: integrations_config
      - variables:
          _ic: >-
            {%- set r = _cfg_raw.get('value', {}) if _cfg_raw is mapping and _cfg_raw.get('status') == 'success' else {} -%}
            {{ r if r is mapping else {} }}
          _pcfg: "{{ _ic.get('portainer', {}) if _ic is mapping else {} }}"

      - choose:
          - conditions: "{{ _mode == 'config_get' }}"
            sequence:
              - variables:
                  final_response:
                    status: info
                    tool: zen_admintools_portainer_acl
                    mode: config_get
                    config:
                      url: "{{ _pcfg.get('url', '') if _pcfg is mapping else '' }}"
                      controllable_containers: "{{ _pcfg.get('controllable_containers', []) if _pcfg is mapping else [] }}"
                      min_cert_level:
                        x: "{{ (_pcfg.get('min_cert_level', {}).get('x', 2) | int(2)) if _pcfg is mapping and _pcfg.get('min_cert_level', {}) is mapping else 2 }}"
                        d: "{{ (_pcfg.get('min_cert_level', {}).get('d', 3) | int(3)) if _pcfg is mapping and _pcfg.get('min_cert_level', {}) is mapping else 3 }}"
                    hint: >-
                      {%- if (_pcfg.get('url', '') if _pcfg is mapping else '') == '' -%}
                        Not set. Direct example: config_set url="https://portainer.<your-domain>:9443/" controllable_containers='["wud"]' confirm=true — or, behind a reverse-proxy CNAME (no port needed): url="https://<your-configured-hostname>/"
                      {%- else -%}{%- endif -%}
                    caller_token: "{{ caller_token | default('') }}"
              - stop: config_get done
                response_variable: final_response

      - choose:
          - conditions: "{{ _mode == 'config_set' }}"
            sequence:
              - choose:
                  - conditions: "{{ not _confirm }}"
                    sequence:
                      - variables:
                          final_response:
                            status: confirmation_required
                            tool: zen_admintools_portainer_acl
                            mode: config_set
                            message: "Re-call with confirm=true to write Portainer config."
                            caller_token: "{{ caller_token | default('') }}"
                      - stop: confirm required
                        response_variable: final_response
              - variables:
                  _new_url: "{{ (url | default('', true) | string | trim) if url is defined and url | default('', true) | trim != '' else (_pcfg.get('url', '') if _pcfg is mapping else '') }}"
                  _new_containers: >-
                    {%- if controllable_containers is defined and controllable_containers | length > 0 -%}
                      {{ controllable_containers }}
                    {%- else -%}
                      {{ _pcfg.get('controllable_containers', []) if _pcfg is mapping else [] }}
                    {%- endif -%}
                  _existing_min_cert: "{{ _pcfg.get('min_cert_level', {}) if _pcfg is mapping and _pcfg.get('min_cert_level', {}) is mapping else {'x': 2, 'd': 3} }}"
                  _new_min_cert_x: "{{ min_cert_x | int(_existing_min_cert.get('x', 2)) if min_cert_x is defined else _existing_min_cert.get('x', 2) }}"
                  _new_min_cert_d: "{{ min_cert_d | int(_existing_min_cert.get('d', 3)) if min_cert_d is defined else _existing_min_cert.get('d', 3) }}"
                  _updated_ic: >-
                    {{ _ic | combine({'portainer': {'url': _new_url, 'controllable_containers': _new_containers, 'min_cert_level': {'x': _new_min_cert_x, 'd': _new_min_cert_d}}}) }}
              - action: script.zen_dojotools_filecabinet
                response_variable: _write_raw
                continue_on_error: true
                data:
                  action_type: update
                  force_action: true
                  volume_entity_id: "{{ _hh }}"
                  key: integrations_config
                  value: "{{ _updated_ic }}"
              - action: script.zen_dojotools_event_emitter
                continue_on_error: true
                data:
                  component: portainer
                  severity: info
                  kind: config_set
                  summary: "Portainer config updated (url set: {{ _new_url != '' }}, {{ _new_containers | length }} allow-listed containers, min_cert x={{ _new_min_cert_x }}/d={{ _new_min_cert_d }})."
                  metadata:
                    caller_token: "{{ caller_token | default('') }}"
              - variables:
                  final_response:
                    status: "{{ 'success' if _write_raw is mapping and _write_raw.get('status') == 'success' else 'error' }}"
                    tool: zen_admintools_portainer_acl
                    mode: config_set
                    config:
                      url: "{{ _new_url }}"
                      controllable_containers: "{{ _new_containers }}"
                      min_cert_level:
                        x: "{{ _new_min_cert_x }}"
                        d: "{{ _new_min_cert_d }}"
                    caller_token: "{{ caller_token | default('') }}"
              - stop: config_set done
                response_variable: final_response

      - variables:
          final_response:
            status: error
            tool: zen_admintools_portainer_acl
            message: "Unknown mode '{{ _mode }}'."
            caller_token: "{{ caller_token | default('') }}"
      - stop: unknown mode
        response_variable: final_response
