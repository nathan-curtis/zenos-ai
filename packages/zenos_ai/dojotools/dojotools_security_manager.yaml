###############################################################################
# ZenOS-AI DojoTools: Security Manager
# Version: 5.24.0
# v5.24.0: the appliance sentry (#10703). appliance_sentry_enabled (default off) tells the
#   household when an appliance labeled appliance AND appliance_sentry has been on
#   appliance_sentry_minutes (default 10) with nobody home: zone.home at 0, the same rule
#   auto-arm uses (unknown never counts as empty). Inform only: a notice, a ledger line,
#   and a Priority Inject line (security_appliance_away) until it is off or someone is
#   home. Two template triggers on the Auto-Arm Watcher (appliance_away, its clear edge).
# v5.23.1: a cover question that reached nobody (Postman no_channel: no phone took it)
#   never closes the cover under ask_then_close; only a real five-minute timeout does.
#   The Zen Security Sentry is found by its automation id (zen_security_sentry),
#   not its entity name, wherever its state is read (the Spook capability gate, lens
#   and auto_arm_config sentry_state). A renamed Sentry entity read as not running, so
#   overrides were refused with "install or update Spook". Messages name it by title.
# v5.23.0: exterior covers (the garage family from the reference house, by label).
#   Watched: covers labeled secure_on_arm, and covers labeled exterior with device class
#   garage, gate or door. Settings, all default off: cover_watch_enabled with
#   cover_left_open_minutes (15) and cover_day_policy (ask: close only on a Yes; or
#   ask_then_close, close, notify); cover_night_close_enabled (close quietly when the house
#   goes to sleep, note on waking); cover_wind_close_enabled with cover_wind_policy
#   (ask_then_close) on damaging wind for five minutes, from a binary_sensor or wind_speed
#   sensor labeled cover_wind (cover_wind_threshold), else the weather entity. A question
#   goes out through the dispatcher without waiting (the watcher is queued) and its answer
#   comes back as postman_ack (cover_ack). Every close is in the ledger; a Priority Inject
#   line (security_cover_open) while one is left open, cleared when all are closed. Quiet
#   while the house sleeps (Postman's sleep rule).
# v5.22.0: the agent knows while an override is in force. override_set writes one
#   Priority Inject line (provider security_override_<kind>, urgency urgent, expiring with
#   the override: "Security is armed home instead of armed away for vacuum sync ...,
#   since 10:02. It goes back by about 10:45."), rewritten on an extension; override_end
#   and the sweep clear it. Nothing else changes.
# v5.21.0: arrival lights. Settings arrival_lights_enabled (default off),
#   arrival_lights_minutes (default 10) and arrival_lights_residents (optional list; empty
#   means every resident), read under arrival_settings. A resident's phone (a
#   device_tracker labeled arrival_tracker) entering zone.home after dark (sun at or below
#   arrival_lights_dark_elevation, default -6 degrees) turns on the lights labeled landing_lights that are off; just those go off
#   again after the minutes, from a record in the household cabinet key _security_arrival.
#   A resident is a human user on the household cabinet or in a family that belongs to it
#   (two levels, as identity membership walks them) whose cabinet names a person entity.
#   Triggers on the Auto-Arm Watcher: zone.entered (arrival_home), a template trigger on
#   the record (arrival_lights_off) and a start trigger (arrival_lights_resolve). Each
#   change writes a ledger line. The panel is never touched; presence never disarms.
# v5.20.0: security lighting at dusk and dawn. Settings dusk_lights_enabled (default off),
#   dusk_offset_min and dawn_offset_min (either sign), in auto_arm_config; the read shows
#   them under lighting_settings. Every light or switch labeled dusk_to_dawn is turned on
#   at civil dusk plus the offset and off at civil dawn plus the offset, from two template
#   triggers on the Auto-Arm Watcher (dusk_lights_on, dusk_lights_off: sun.sun next_dusk
#   and next_dawn, evaluated every minute) and a start trigger (dusk_lights_resolve) that
#   sets the lights from the time of day after a restart. Each change writes a ledger line.
#   The panel is never touched, and auto_arm_enabled does not apply.
# v5.19.1: auto_arm_config accepts a patch made only of numbers or booleans that Home
#   Assistant has already turned into a mapping (for example {"dusk_offset_min": -30}).
#   from_json on a mapping failed with a template error, so a numeric-only patch was
#   refused; the patch is used as it is when it is already a mapping.
# v5.19.0: optional notice when a room reads occupied while the panel is armed Away.
#   New setting notify_occupied_while_away (auto_arm_config, default off). A template
#   trigger on the Auto-Arm Watcher (room_occupied_away: panel armed Away and a
#   zen_room_state room occupied, engaged or asleep for two minutes) calls auto_arm_check,
#   which, only when the setting is on, no override is in force and the panel is still
#   armed Away, writes a ledger line and sends one push naming the rooms. The panel is
#   never changed, and it works with auto_arm_enabled off. The read shows it under
#   notice_settings.
# v5.18.0: the vacuum downgrade runs on the override record.
#   When the vacuum starts while armed Away and vac_arm_override_enabled is on, the
#   person gets the Cancel notice; unless they cancel, the panel goes to Home and a
#   vacuum_sync override is recorded (the old vacuum_alarm_mode_active flag is no
#   longer written; the dashboard sensor reads the override). Cancel now stops the
#   run through Autovac (mode=stop) and keeps the downgrade until the vacuum is
#   docked, instead of a raw return_to_base that left Away armed under a moving
#   vacuum. The dock is read from Autovac's autovac_docked event (which says whether
#   the run was cancelled): after the dock wait (5 min, 1 min for a cancelled run)
#   and a recheck that Autovac is idle, the override ends and Away returns if the house
#   is empty. A mop-wash re-dock does not end it; a run starting again only extends it.
#   security_override_expired puts Away back if the Sentry had to time the override out.
#   A hand disarm or re-arm Away during the run ends the override. If the override
#   cannot be recorded (no Sentry), the panel is not downgraded at all. An alarm that
#   triggers during the override stops the run (Autovac stop), ends the override, writes a
#   ledger line and tells the person; the panel itself is never touched. The Sentry also
#   reconciles every minute (vac_reconcile): an override whose dock was never reported
#   (reload or restart) is ended once the vacuum has been docked past the dock wait
#   plus two minutes with Autovac idle, and Away returns if the house is empty.
# v5.17.0: three findings fixed. (1) auto_arm_config with no auto_arm_patch is now a
#   read: it returns the stored settings and the Sentry's state, no cert, nothing
#   changed, instead of answering missing_auto_arm_patch while the help promised
#   "read or write" (a house agent could not see what was turned on). (2) The
#   tool_manifest version moves with the modes: it still said 5.9.0 after eight modes
#   were added; it now says 5.17.0 and carries a modes map for every action, read,
#   cert-gated and internal. (3) The cert gates now list auto_arm_config with a patch
#   and spell out both checks for disarm (cert and a live ack). The KFC manifest
#   version (5.4.0) is the component contract version and is unchanged: no component
#   definition changed.
# v5.16.0: readiness also reads the panel's own zones. A house whose doors and windows
#   are panel zones, with nothing labeled zen_door, had 0 perimeter sensors checked and
#   would have said "ready" with a window open. It now calls read_state and adds every open or faulted zone that is not
#   bypassed, plus the panel's own "not ready" flag, as blockers (de-duplicated against
#   labeled sensors); bypassed zones are notes. checked carries panel_zones, and when
#   nothing visible was checked (no panel zones, nothing labeled zen_door) the answer
#   carries blind: true and says so in the summary instead of a bare "ready".
# v5.15.0: Spook is required to make temporary overrides, and that is checked, not
#   assumed. The Zen Security Sentry ends overrides and only runs when Spook's trigger
#   platforms work, so its own state is the capability probe (no version read).
#   override_set answers spook_required when the Sentry is not on; auto_arm_config
#   refuses to turn on vac_arm_override_enabled for the same reason (turning it off
#   is always allowed). So no override can exist without a Sentry able to end it, and
#   no fallback sweep outside Spook is needed. lens carries sentry_state and
#   stuck_overrides: an override that outlived its time without being ended is said
#   plainly in the line instead of silently disappearing from the answer.
# v5.14.0: the Zen Security Sentry and its first job, the override sweep. The Sentry
#   is a second automation, kept apart from the Auto-Arm Watcher on purpose: it holds
#   the behaviors that use Spook trigger platforms, because Home Assistant disables a
#   whole automation when any one of its triggers is invalid, and a missing or changed
#   Spook must not take the core watcher down with it. Its first trigger is
#   spook.cron every minute, with the work gated on an override existing (spook.while
#   was tried first and dropped: it does not fire for a condition already true at
#   start, so a restart left a stale override unswept). override_sweep is the
#   new internal action it calls: every override whose time has passed is removed,
#   one ledger line each (override_expired), and a zen_event security_override_expired
#   carries the record so the behavior that owns the override can put the panel back.
#   The sweep never touches the panel.
# v5.13.0: new read action lens: the security answer other tools use instead of
#   reading the panel themselves. Home level: the panel and its state, whether the
#   house can arm now (readiness) with the blocker count and one-line summary, the
#   temporary override in force (kind, what it left and moved to, when it ends) as a
#   plain sentence, and the last ledger line, plus one plain `line` for a home
#   overview. It calls readiness, override_list and activity, so there is one source
#   for each. Read, no cert. It never calls Room Manager (one-way dependency).
# v5.12.0: the activity ledger. What the system did on its own, and what it declined
#   to do, is a short list in the household cabinet (key _security_ledger, hidden like
#   Alert Manager's _zen_active_alerts), at most 150 entries and at most 7 days old.
#   activity reads it (no cert): newest first, last 24 hours by default, so the agent
#   can say what security has been doing without being asked. ledger_add is internal
#   (refused from any user or agent session) and is what behaviors call; override_set
#   and override_end now write their own entries (begin, extend, clamp, end). All
#   FileCabinet calls in this file moved to mode / write_mode (the legacy action_type
#   and mode: replace forms are gone).
# v5.11.0: the temporary override record. A temporary change the system makes to
#   the panel (for example Away to Home while the vacuum runs) is a record in the
#   household security_manager drawer (_overrides, one per kind): what it left,
#   what it moved to, why, when it began, when it expires, and a hard ceiling from
#   its start (default 180 min) that its expiry never passes. override_list reads
#   them (no cert, with minutes left); override_set and override_end are internal
#   (refused from any user or agent session, like auto_arm_check) and are what the
#   automation that owns a behavior calls. override_set moves the expiry of an
#   existing override and clamps a longer ask at the ceiling.
# v5.10.0: new read action readiness: can the house arm now, and if not, what
#   blocks it. Read from labels only (alarm_panel, zen_door, ext_lock): a panel
#   that is pending, triggered or unreadable, a labeled door, window or garage
#   door that is open or unreadable, an exterior lock that is jammed or
#   unreadable. An unlocked exterior lock is listed as fixable (lock it), not
#   as a blocker. Ungated, like query. It is the one check auto-arm, the night
#   and departure sequences and the agent share.
# v5.9.2: zone.home going unknown or unavailable no longer reads as an
#   empty house. The watcher ignores a change to unknown/unavailable, and
#   auto-arm reads an unreadable count as -1, so it neither arms Away nor
#   runs the arrival path (HALMark FG-43). The Night-Late and Away
#   triggers ignore zen_home_mode coming back from unknown/unavailable, so
#   a template reload no longer re-runs night arm or mode-away arm.
# v5.9.1: auto_arm_check is refused from a user or agent session. Only
#   the auto-arm automations (no user in context) may call it; a caller
#   could name auto_arm_trigger lock_unlocked and disarm an armed_home
#   panel without the disarm cert or live ack.
# v5.9.0: security_perimeter, security_panel and security_cameras are cache
#   slots (role: cache, no triggers): a trigger pack writes their kata keys
#   and the security_manager rollup reads them (panel_cache, perimeter_cache,
#   camera_cache). They subscribed to self-named triggers that nothing fires.
#   The Ninja does not run a cache component, so a run cannot overwrite the
#   cache. Without a pack, security_manager runs on what it has.
# v5.8.0: the security_manager KFC drops its master_switch (it named an
#   input_boolean that is not shipped) and the MASTER SWITCH instruction. On
#   and off is the component's meta.enabled (Scribe mode=enable / disable).
# v5.7.0: HA naming (2026.11): name outputs carry entity_name and device_name
#   next to the legacy friendly_name (kept while HA still sets it), and
#   composed names are built from those parts, so they survive HA dropping
#   friendly_name. entity_name() is used only where HA has it (2026.4+). The
#   panel's zone walk includes the panel's child devices (HA 2026.9+).
# v5.6.1: each cert this tool declares gets a short plain description for
#   the approval prompt (the old text moves to detail) and its real max_level.
# v5.6.0: cert names moved to the zenos.* namespace (2026.11). An old flat
#   grant still satisfies the new name for one release (reissue pending).
# v5.5.1 (#10649): the envelope names the mode from mode or action (default
#   read_state). An action= call answered before dispatch (the onboarding
#   gate) reported mode "".
# v5.5.0: onboarding gate (zen_os_1 entry_gate). An agent without
#   zenos.agent.basic gets help, tool_manifest and kfc_manifest; anything else
#   (a bare call is read_state) answers onboarding_required with next_step
#   zen_flynn_oobe.
# v5.4.1: security_manager KFC also runs on ha_start and home_mode_updates, with a
#   60 s settle; a restart-time reading no longer sits in the summary until midnight.
#
# v5.3.4: prompt guidance for triggers outside panel/perimeter/camera: check
#   Alert Manager for an active alert on the entity instead of reading meaning
#   from its name or raw state.
#
# v5.3.3: Auto-Arm Watcher's lock_unlocked trigger hardcoded three
#   household lock entities. Purpose-trigger target supports label_id
#   directly -- labeled to ext_lock, no entity hardcode.
# v5.3.2: generic vacuum wording in user-facing notification text, no
#   behavior change.
#
# v5.3.1 (#10553): Auto-Arm Watcher automation hardcoded the vacuum entity
#   and the alarm panel entity in its own triggers. Purpose-trigger target
#   supports label_id directly -- vacuum now labeled to autovac, alarm
#   panel switched from a plain state trigger to the armed_away/disarmed
#   purpose triggers, labeled to alarm_panel. No entity hardcode.
#
# Scripts:
#   zen_dojotools_security_manager — Alarm panel query + control + policy
#
# Discovery: label:alarm_panel + alarm_control_panel domain (no hardcoding).
# Device tree: device_entities(device_id) walks all zone and system entities.
# Zone pairing: _fault / _bypass object_id suffix convention.
#
# Installation: alarm_control_panel.home_alarm — Envisalink 4 + DSC panel
#   12 zones: 3 doors, 8 windows, 1 motion detector
#   Dispatcher arm: zen_dojotool_tool_router in dojotools_dispatcher.yaml
#
# Actions:
#   read_state  — Full panel snapshot (default): state, zones, system health,
#                 cameras_by_area (security_camera label grouped by area_id)
#   query       — List all alarm_control_panel entities tagged alarm_panel
#   get_policy  — Read _alert_policy
#   arm         — Arm with mode: away / home / night / vacation
#   set_alert_policy — Merge policy_patch into _alert_policy
#   disarm      — Disarm
#
# Lens pattern (v5.1.0):
#   Security Manager = zone/panel lens. Camera = visual analysis lens.
#   RM +security slice = per-room spatial bridge.
#   read_state.lens field describes handoff to the other tools.
#
# v5.3.0 — full SESE + envelope() migration + gated actuation. Arm/disarm
# and lock/unlock are the same risk class, so security_manager gets the
# same identity-gate treatment as zen_dojotools_locks.
#   - Tier R (read): read_state, query, get_policy -- unchanged, open.
#   - Tier X (act): arm, set_alert_policy -- require the security_control
#     cert (same zen_dojotools_identity resolve_caller_identity chokepoint
#     locks uses for lock_control), fail-closed. Arming only increases
#     security (parallel to lock); set_alert_policy governs what the
#     household even gets notified about, a real risk if silently
#     weakened, so it's gated at the same tier as arm, not left open like
#     get_policy.
#   - Tier D (disarm): disarm -- cert AND a FRESH live household-admin ack
#     every single call via zen_dojotools_identity mode=request_live_ack,
#     never reusable across calls, same as locks' exterior-unlock gate
#     (disarming is the direct security analog of unlocking an exterior
#     door -- reduces security, must be asked for every time).
#   - Every action now builds a domain `result` and falls through to ONE
#     shared stop wrapping it in OS.envelope() (zen_os_1.jinja, #10297).
#     tool_manifest/kfc_manifest keep their own early exits -- self-
#     description/registry, not domain results, same precedent as every
#     other DojoTools tool.
#   - All zone/system-health/camera device-tree-walk logic (read_state) is
#     UNCHANGED byte-for-byte in substance -- only the response envelope
#     and control-flow shape moved, not the classification rules.
###############################################################################

script:
  zen_dojotools_security_manager:
    alias: Zen DojoTools Security Manager
    mode: parallel
    max: 10
    description: >-
      Alarm panel lens: zone/panel state, arm/disarm, alert-routing policy.
      Use for alarm panel status or control. For camera visual analysis use
      zen_dojotools_camera; for a room's zone+camera spatial context use
      room_manager mode=get context_slices=+security. Read (read_state, query,
      readiness, override_list, activity, lens, get_policy, and auto_arm_config with
      no patch) is always open; arm/set_alert_policy/auto_arm_config with a patch
      require the zenos.actuation.security_control cert; disarm additionally requires a
      fresh live household-admin ack every call. action=help for the full
      reference.

    icon: mdi:shield-home
    fields:
      action:
        name: Action
        description: read_state (default) | query | readiness | override_list | activity | lens | arm | disarm | get_policy | set_alert_policy | auto_arm_check | auto_arm_config | override_set | override_end | override_sweep | ledger_add | help
        required: false
        selector:
          select:
            options: [read_state, query, readiness, override_list, activity, lens, arm, disarm, get_policy, set_alert_policy, auto_arm_check, auto_arm_config, override_set, override_end, override_sweep, ledger_add, help]
        default: read_state

      auto_arm_trigger:
        name: Auto-Arm Trigger Source
        description: >-
          Internal: which event fired auto_arm_check: occupancy (default,
          zone.home changed) | vac_started | vac_docked. Set by the companion
          automation, not intended for direct agent calls. Also vac_docked
          (Autovac reported the vacuum docked) and override_expired (an
          override's time ran out; override_kind names which).
        required: false
        selector:
          text:

      auto_arm_vac_cancelled:
        name: Auto-Arm Vacuum Run Cancelled
        description: "Internal: true when the dock event says the run was cancelled (Autovac mode=stop). Set by the companion automation with auto_arm_trigger vac_docked."
        required: false
        selector:
          boolean:

      auto_arm_entity:
        name: Auto-Arm Trigger Entity
        description: "Internal: the entity that fired the trigger (the tracker that entered zone.home for arrival_home). Set by the companion automation, not for direct agent calls."
        required: false
        selector:
          text:

      auto_arm_patch:
        name: Auto-Arm Config Patch
        description: >-
          JSON string for auto_arm_config. Partial update: only provided keys
          are merged. Keys: auto_arm_enabled (bool, default false),
          vac_arm_override_enabled (bool, default false),
          vac_downgrade_dock_wait_min (int, default 5: minutes to wait after
          a dock event, then recheck the vacuum is truly done (not mid-run
          mop-wash), before re-arming Away), night_arm_enabled (bool, default
          false: arm to Home when zen_home_mode enters Night-Late, only if
          currently disarmed; deliberately no matching auto-disarm, that's
          wired to a door-unlock event elsewhere), mode_away_arm_enabled
          (bool, default false: arm Away when zen_home_mode enters Away,
          only if currently disarmed; distinct from and independent of the
          existing occupancy-based zone.home==0 arm-away path),
          entertaining_blocks_night_arm (bool, default false: when true,
          Night-Late auto-arm is skipped entirely while
          input_boolean.zen_entertaining is on; optional, off means
          entertaining mode has no effect on night_arm_enabled),
          alarm_drives_home_mode_enabled (bool, default false: reverse
          sync: panel armed_away sets zen_home_mode to Away, panel disarmed
          while home_mode was Away calls zen_home_mode_release; parity-
          matched against legacy NR's Main Mode Sync group),
          disarm_occupies_arrival_area_enabled (bool, default false: any
          real disarm fires a synthetic occupied signal for every area
          tagged label:arrival_area via room_signal_fire, independent of
          alarm_drives_home_mode_enabled; tag any entity in the room(s) you
          want treated as an arrival point, no hardcoded room),
          lock_disarm_enabled (bool, default false: an exterior lock
          unlocking while armed_home auto-disarms; never auto-disarms from
          armed_away, see the lock_unlocked branch's own comment for why),
          cover_watch_enabled (bool, default false), cover_left_open_minutes
          (int, default 15), cover_day_policy (ask | ask_then_close | close |
          notify, default ask), cover_night_close_enabled (bool, default
          false), cover_wind_close_enabled (bool, default false),
          cover_wind_policy (default ask_then_close), cover_wind_threshold
          (number, for a wind_speed sensor labeled cover_wind), appliance_sentry_enabled
          (bool, default false: tell the household when an appliance labeled appliance
          AND appliance_sentry is on appliance_sentry_minutes with nobody home),
          appliance_sentry_minutes (int, default 10).
          All default off/unset: auto_arm_enabled stays off until
          Node-RED's equivalent flows are decommissioned.
        required: false
        selector:
          text:

      override_kind:
        name: Override Kind
        description: >-
          Internal: which kind of temporary override override_set or
          override_end names (for example vacuum_sync). One active override
          per kind; the kind is the record id. Set by the automation that
          owns the behavior, not intended for direct agent calls.
        required: false
        selector:
          text:

      override_from:
        name: Override From
        description: "Internal: the panel mode the override left (for example armed_away). Used by override_set."
        required: false
        selector:
          text:

      override_to:
        name: Override To
        description: "Internal: the panel mode the override moved to (for example armed_home). Used by override_set."
        required: false
        selector:
          text:

      override_reason:
        name: Override Reason
        description: "Internal: one plain sentence saying why, shown to the agent and the person. Used by override_set."
        required: false
        selector:
          text:

      override_minutes:
        name: Override Minutes
        description: >-
          Internal: minutes from now until the override expires (default 30).
          For an existing override this moves the expiry; the result is never
          later than the override's start plus its ceiling.
        required: false
        selector:
          number:
            min: 1
            max: 1440
            mode: box

      override_max_minutes:
        name: Override Ceiling Minutes
        description: >-
          Internal: hard ceiling in minutes from the override's start that
          its expiry can never pass (default 180). Set when the override
          begins; a later call can only lower it, never raise it. An
          override_minutes past it is clamped and recorded.
        required: false
        selector:
          number:
            min: 1
            max: 1440
            mode: box

      override_consent:
        name: Override Consent
        description: "Internal: how the person agreed (for example standing, or asked_yes). Recorded as given; used by override_set."
        required: false
        selector:
          text:

      ledger_kind:
        name: Ledger Entry Kind
        description: "Internal: a short snake_case label for what happened (for example override_begin, declined_arm). Used by ledger_add."
        required: false
        selector:
          text:

      ledger_summary:
        name: Ledger Entry Summary
        description: "Internal: one plain sentence the agent can repeat to a person (what the system did or declined, and why). Used by ledger_add."
        required: false
        selector:
          text:

      ledger_source:
        name: Ledger Entry Source
        description: "Internal: which behavior wrote it (for example vacuum_sync, night_arm). Used by ledger_add."
        required: false
        selector:
          text:

      ledger_detail:
        name: Ledger Entry Detail
        description: "Internal: optional short extra text (an entity name, a count). Used by ledger_add."
        required: false
        selector:
          text:

      activity_hours:
        name: Activity Window Hours
        description: "How far back activity looks (default 24, at most 168)."
        required: false
        selector:
          number:
            min: 1
            max: 168
            mode: box

      activity_limit:
        name: Activity Entry Limit
        description: "The most entries activity returns, newest first (default 50, at most 150)."
        required: false
        selector:
          number:
            min: 1
            max: 150
            mode: box

      policy_patch:
        name: Policy Patch
        description: >-
          JSON string of event_type to policy overrides. Required for set_alert_policy.
          Partial update: only provided keys are merged. Existing keys not in patch
          are preserved. Event types: alarm_triggered, alarm_pending, alarm_arm_away,
          alarm_arm_home, alarm_arm_night, alarm_disarm, panel_fault, smoke_co,
          door_open_armed, door_open_night, garage_open_armed, lock_unlocked_armed,
          lock_unlocked_night, lock_changed, person_detected_armed.
          Per-entry keys: urgency (1-10), notify (bool), channel_hint, title.
        required: false
        selector:
          text:

      arm_mode:
        name: Arm Mode
        description: Arming mode - required when action is arm
        required: false
        selector:
          select:
            options: [away, home, night, vacation]

      panel:
        name: Panel Entity
        description: >-
          alarm_control_panel entity_id override. Omit to auto-discover via
          label:alarm_panel.
        required: false
        selector:
          entity:
            domain: alarm_control_panel

      mode:
        description: "Pass tool_manifest to get self-description, or help for a usage reference."
        required: false
        selector:
          select:
            options:
              - tool_manifest
              - kfc_manifest
              - help

      caller_token:
        name: Caller Token
        description: Opaque audit token echoed in response.
        required: false
        selector:
          text:

    sequence:

      - variables:
          _tm_check: "{{ mode | default('') | lower }}"
      # Onboarding gate (zen_os_1 entry_gate): an agent without
      # zenos.agent.basic gets help, tool_manifest and kfc_manifest only. A
      # bare call is read_state. Calls no user started pass.
      - variables:
          _sm_gate_mode: "{{ (mode | default(action | default('read_state', true), true)) | string | lower | trim }}"
      - variables:
          _sm_gate: >-
            {%- import 'zenos_ai/zen_os_1.jinja' as OS -%}
            {{ OS.entry_gate((context.user_id if context is defined else '') or '', 'zen_dojotools_security_manager', _sm_gate_mode) | from_json({'pass': false, 'reason': 'guarded: the onboarding gate could not be read'}) }}
      - if: "{{ not _sm_gate.get('pass', false) }}"
        then:
          - variables:
              result:
                status: error
                mode: "{{ _sm_gate_mode }}"
                reason: "{{ _sm_gate.reason }}"
                next_step: "{{ _sm_gate.next_step }}"
                caller_token: "{{ caller_token | default('') }}"
          - action: system_log.write
            data:
              level: warning
              logger: zen_entry_gate
              message: "{{ _sm_gate.get('log') or 'onboarding gate refused a call (gate result unreadable)' }}"
      - choose:
        - conditions: "{{ result is not defined and _tm_check == 'tool_manifest' }}"
          sequence:
          - variables:
              result: >-
                {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
                {{ MF.tool_manifest(
                    tool='zen_dojotools_security_manager',
                    summary='Alarm panel, perimeter, and auto-arm',
                    display_name='Security Manager',
                    tier='dojotools',
                    version='5.24.0',
                    health={'configured': true, 'status': 'ok', 'notes': []},
                    required_labels=['dojotools', 'zen_kfc_provider'],
                    optional_labels=['security_manager', 'alarm', 'secure_on_arm', 'exterior', 'cover_wind', 'appliance', 'appliance_sentry'],
                    consumes=['lock_or_alarm'],
                    returns=['security_state'],
                    icon='mdi:shield-lock',
                    color='red',
                    stripe=3,
                    impact='soft',
                    mcp_exposed=true,
                    modes={
                      'read_state': 'default: panel snapshot, zones, system health (read, no cert)',
                      'query': 'list the labeled alarm panels (read, no cert)',
                      'readiness': 'can the house arm now, and what blocks it (read, no cert)',
                      'override_list': 'temporary overrides in force (read, no cert)',
                      'activity': 'what security did on its own, newest first (read, no cert)',
                      'lens': 'one security answer for other tools (read, no cert)',
                      'get_policy': 'alert policy (read, no cert)',
                      'arm': 'arm the panel (cert)',
                      'disarm': 'disarm the panel (cert and a live ack every call)',
                      'set_alert_policy': 'change the alert policy (cert)',
                      'auto_arm_config': 'no auto_arm_patch reads the settings (no cert); a patch writes them (cert)',
                      'auto_arm_check': 'internal: the auto-arm watcher only',
                      'override_set': 'internal: the behavior that owns an override only',
                      'override_end': 'internal: the behavior that owns an override only',
                      'override_sweep': 'internal: the Zen Security Sentry only',
                      'ledger_add': 'internal: the behavior that acted only',
                      'help': 'this reference'
                    },

                    caller_token=caller_token | default('')
                ) | from_json | combine({
                    'kfc_manifest': true,
                    'kfc_components': ['security_manager', 'security_perimeter', 'security_panel', 'security_cameras'],
                    'certs_required': [{
                      'cert': 'zenos.actuation.security_control',
                      'bundle': ['zenos_agent_advanced'],
                      'display_name': 'Security Control',
                      'description': "Arm the alarm and change alarm alerts", 'detail': 'Alarm panel arm/disarm and alert-policy changes via zen_dojotools_security_manager.',
                      'max_level': 1,
                      'gates': ['action=arm (cert only)', 'action=set_alert_policy (cert only)', 'action=auto_arm_config with an auto_arm_patch (cert only; no patch is a read)', 'action=disarm (cert, and a live ack every call)'],
                      'live_ack_required_for': ['action=disarm -- every call, cert alone is never sufficient'],
                      'grant_via': "persona_editor mode=cert_req_grant cert_component=zenos.actuation.security_control (or zen_dojotools_identity mode=cert_list to see current status)"
                    }]
                  }) }}
        - conditions: "{{ result is not defined and _tm_check == 'kfc_manifest' }}"
          sequence:
          - variables:
              _kfc_filter: "{{ component | default('') | string | trim | lower if component is defined else '' }}"
              _kfc_defs:
              - kata_key: security_manager
                friendly_name: Security Manager
                label: security_manager
                component_summary: ""
                component_instructions: >-
                  Synthesize unified home security picture. RM spatial snapshot is your ground truth — open with it, then layer events on top.
                  SEED OUTPUT (zen_dojotools_room_manager, mode=home_overview):
                    Spatial foundation: who is home, which rooms are occupied, which entry/exit
                    points (portals, doors, garage) are open or secured. Read this before
                    interpreting any event stream.
                    Each entry in signal.active_rooms[] also carries v3_occupancy — Room Manager
                    v3's live per-room state (emergency/paused/automation/cleaning/asleep/engaged/
                    hold/occupied/vacant, or null if that room has no v3 sensor deployed).
                    This is a SHARPER signal than the coarse "lights on or motion recently"
                    heuristic that drives active_rooms[] membership itself — prefer v3_occupancy
                    over inferring occupancy from lights/media when a room has it. See SPATIAL
                    COMPOUND INFERENCE below for how to weight it.

                  INPUT (supplemental context from coalescer — read these fields from event data):
                    panel_cache      — security_panel kata: panel_state, arming_mode, zones, system_health, urgency
                    perimeter_cache  — security_perimeter kata: door/lock/garage state transitions, urgency
                    camera_cache     — security_cameras kata: which cameras triggered, detected_subjects, activity_type, urgency
                    camera_analysis  — camera_manager kata: full LLM vision analysis (ready ~15-30s after trigger). May be absent — degrade gracefully.

                  STATE FIELD READING RULES — read state verbatim before assigning urgency:
                    perimeter_cache.state: locked   = door/lock is SECURED. Not a breach. Not open.
                    perimeter_cache.state: unlocked = door/lock is UNSECURED. May be noteworthy if armed.
                    perimeter_cache.state: on       = contact sensor OPEN (door/window physically open).
                    perimeter_cache.state: off      = contact sensor CLOSED (door/window physically closed/secured).
                    perimeter_cache.state: open     = cover (garage door) physically open.
                    perimeter_cache.state: closed   = cover (garage door) physically closed/secured.
                    NEVER infer open/breach from entity name or event type alone. Always read state field first.

                  EVENT DIRECTION — last_event tells you what HAPPENED, state tells you what IS:
                    last_event: lock_*_locked   = lock transitioned TO locked = SECURING action. Urgency 0 unless other signals.
                    last_event: lock_*_unlocked = lock transitioned TO unlocked = OPENING action. Noteworthy if armed.
                    last_event: door_*_on       = door opened.
                    last_event: door_*_off      = door closed.
                    last_event: garage_open     = garage door opened.
                    last_event: garage_closed   = garage door closed/secured.
                    A securing event (locked, closed, off) while armed = panel doing its job. Not an alert.

                  SPATIAL COMPOUND INFERENCE:
                    Cross-reference RM state with event streams before assigning urgency.
                    Person outside + house occupied: lower urgency than person outside + house vacant.
                    Door opened + occupant in adjacent room: likely known; door opened + vacant house: suspicious.
                    Alarm triggered + RM shows occupant in that zone + known time of day: likely false trigger.
                    Alarm triggered + zone vacant + camera_analysis confirms presence: high-confidence real event.

                  ROOM MANAGER v3 STATE WEIGHTING (v3_occupancy per room, when present — see SEED
                  OUTPUT above; a room with v3_occupancy=null has no v3 sensor, fall back to the
                  coarse rules above for that room only):
                    v3_occupancy=emergency in the triggered zone: near-certain real event — REFLEX's
                      own emergency latch (smoke/CO/moisture/siren) already independently confirmed
                      something is wrong there. Corroborating signal, do not re-derive from scratch.
                    v3_occupancy=asleep in the triggered zone: an alarm/motion trip here is LESS
                      likely a false trigger than in a merely "occupied" room — asleep occupants
                      don't casually wander and re-trigger sensors the way someone actively occupied
                      does; treat asleep-zone triggers with the same weight as vacant-zone triggers,
                      not as automatic "probably just the occupant."
                    v3_occupancy=engaged in the triggered zone: near-certain false trigger if the
                      engagement predates the alarm event (someone is actively using the room, e.g.
                      media playing) — cross-check timing, not just presence.
                    v3_occupancy=paused or automation: room control is overridden by a human or
                      agent for an unrelated reason — do not let this suppress or inflate urgency by
                      itself, it says nothing about physical presence.
                    v3_occupancy=vacant is a STRONGER "nobody should be here" signal than RoomReg's
                      generic "no lights, no motion recently" — REFLEX already resolved the full
                      cascade (including any decay-timer grace period), so trust it over re-deriving
                      vacancy from raw lights/media state.

                  CAMERA ABSENT MODE:
                    If camera_cache and camera_analysis are both empty or missing: proceed with RM + panel + perimeter.
                    Explicitly note "Assessing from spatial state + panel + perimeter (cameras unavailable)."
                    Flag ambiguous events as "unable to visually confirm" — confidence is lower, say so.

                  TRIGGERS OUTSIDE PANEL/PERIMETER/CAMERA (infrastructure, environmental, mechanical --
                  e.g. water heater valves, leak sensors, breakers): this component has no domain
                  knowledge for them and general world-knowledge pattern-matching on entity name/
                  state will often be backwards (e.g. a shutoff valve labeled alert_when_off is
                  NOMINAL when open/on -- the opposite of the naive "open valve = leak" assumption).
                  Do not re-derive significance from the raw triggering entity's name or state.
                  Check zen_dojotools_alertmanager mode=list for an active alert on that entity first
                  -- no active alert there means nominal, full stop, regardless of what the entity
                  name or raw state suggests. Only escalate urgency for one of these if Alert Manager
                  itself shows it active.

                  SYNTHESIS RULES:
                    Open with RM spatial snapshot: who is home, what is open or secured.
                    Highest urgency from any sub-component drives rollup urgency after cross-domain adjustment.
                    Safety-class events (triggered, unknown intruder) always override all other signals.
                    If a sub-component cache is missing or stale (>15 min): note it, proceed with available data.

                  ALERT POLICY: household cabinet -> security_manager drawer -> _alert_policy.
                    If unavailable: apply default escalation rules below.

                  DOOR OPEN POLICY:
                    If panel_armed=false AND door has been open < 2 min: urgency 0, not message-worthy. Drop.
                    If panel_armed=false AND door open >= 2 min: urgency 3 (climate/animals/weather). Note only.
                    If panel_armed=true AND any door/contact OPEN (state=on): urgency 7+. Treat as perimeter breach.
                    If panel_armed=true AND lock UNLOCKED (state=unlocked): urgency 5. Unsecured entry point.
                    If panel_armed=true AND lock LOCKED (state=locked): urgency 0. Securing event — not an alert.
                    garage_entry_door lock state=locked while armed = normal. urgency 0.

                  ESCALATION:
                    Panel triggered: urgency 10. action_required. suggested_act_event: zen_dojotools_postman.
                    Unknown person + armed_away: urgency 8. suggested_act_event: zen_dojotools_postman.
                    Perimeter breach while armed (door/contact open): urgency 7. suggested_act_event: zen_dojotools_postman.
                    Lock unlocked while armed: urgency 5. note, no postman unless camera confirms presence.
                    Door open >= 2 min while disarmed: urgency 3. note only, no postman.
                    urgency < 5: suggested_act_event: null.

                  OUTPUT: spatial_context, panel_state, perimeter_summary, camera_summary, combined_urgency, suggested_act_event.
                  NOMINAL: "Security nominal. [who is home]. Panel disarmed. Perimeter secure. Cameras clear."
                  ALERT: "Security [warn|critical]: [specific issue]. [spatial context]. [sub-component detail]."
                # ha_start + home_mode_updates: a reading taken during a restart
                # (or before the panel follows a mode change) otherwise sat at the
                # top of the agent's summary until midnight. The 60 s settle lets
                # the panel and locks report real state before the run.
                trigger_subscriptions:
                - force_summary
                - daily_midnight
                - ha_start
                - home_mode_updates
                drift_threshold: 5
                emission_cooldown_minutes: 60
                delay_seconds: 60
                suggested_act_event: null
                seed:
                  tool: zen_dojotools_room_manager
                  params:
                    mode: home_overview
                master_switch: ""
                index_call:
                  domain_inspect_domains: []
                  domain_inspect_limit: 25
                  expand_entities: false
                  filter_json: {}
                  label_1: security_manager
                  label_2: ""
                  operator: AND
                  output_fields: ""
                meta:
                  enabled: true
                  requires:
                    cert: ""
                    level: 0

              - kata_key: security_perimeter
                component_key: security_perimeter
                parent_component_key: security_manager
                primary_index_key: security_perimeter
                friendly_name: Security Perimeter
                label: security_manager
                version: "1.0.1"
                component_summary: >-
                  Monitors perimeter entry points — doors (front/back), locks (front/back/garage entry),
                  and garage covers — with security-context filtering (panel armed or Night mode).
                component_instructions: >-
                  Synthesize perimeter entry point state in security context.

                  DATA ACCESS (label: security_manager, filter for door/lock/cover domains):
                    Doors: front, back — open/closed
                    Locks: front door, back door, garage entry — locked/unlocked
                    Garage covers: main garage, secondary — open/closed
                    Context: panel arm state, home mode from review_data

                  SECURITY CONTEXT RULES:
                    armed_away: any unlocked lock or open door → deviation, urgency ≥ 6.
                    armed_home: garage entry unlocked or cover open → deviation.
                    night/sleep mode: front/back unlocked → flag at urgency 4.
                    disarmed, occupant home: garage entry unlocked → informational only (urgency 1).

                  URGENCY:
                    Door physically open while armed_away → 8.
                    Lock unlocked while armed_away → 6.
                    Garage cover open at night or armed → 5.
                    Unlocked entry, disarmed, no occupancy context → 2.
                    All entry points secure → 0.

                  OUTPUT: door_states {open/closed}, lock_states {locked/unlocked}, garage_state, security_context, urgency.
                  NOMINAL: "Perimeter secure. All doors locked. Garage closed."
                tool: ""
                # A cache slot, not a summary: a trigger pack writes this kata
                # key and the security_manager rollup reads it. The Ninja
                # never runs it, so it subscribes to nothing.
                role: cache
                trigger_subscriptions: []
                drift_threshold: 5
                emission_cooldown_minutes: 60
                delay_seconds: 0
                suggested_act_event: null
                master_switch: ""
                more_info: ""
                schedules: []
                custom_trigger_override: []
                component_group:
                  component_key: security_perimeter
                  parent_component_key: security_manager
                  primary_index_key: security_perimeter
                  shared_delay_seconds: 0
                  shared_labelset: []
                  shared_schedule_group: ""
                  shared_trigger_subscriptions: []
                index_call:
                  label_1: security_manager
                  label_2: ""
                  operator: AND
                  domain_inspect_domains: []
                  domain_inspect_limit: 25
                  expand_entities: false
                  filter_json: {}
                  output_fields: ""
                meta:
                  enabled: true
                  published_from: security_perimeter
                  requires:
                    cert: ""
                    level: 0

              - kata_key: security_panel
                component_key: security_panel
                parent_component_key: security_manager
                primary_index_key: security_panel
                friendly_name: Security Panel
                label: security_manager
                version: "1.0.1"
                component_summary: >-
                  Monitors DSC alarm panel state — arm/disarm transitions, triggered/pending states,
                  zone faults, and system health (AC, battery, fire).
                component_instructions: >-
                  Synthesize DSC alarm panel state for the home security subsystem.

                  DATA ACCESS (label: security_manager, filter for alarm/panel domain):
                    alarm_control_panel.home_alarm: disarmed / armed_home / armed_away / triggered / pending
                    Panel zones: individual zone open/fault sensors
                    System health: AC power, battery, fire zone states

                  STATES:
                    disarmed — nominal occupancy. Not a deviation unless zones faulted.
                    armed_home — perimeter + interior excluded. Occupants inside.
                    armed_away — full arm, no occupants expected. Any zone fault = deviation.
                    triggered — CRITICAL. Immediate escalation regardless of mode.
                    pending — entry delay countdown. Escalate if countdown completes without disarm.

                  URGENCY:
                    triggered → 10. Always action_required.
                    pending → 8.
                    armed_away + zone fault → 7.
                    armed_home + interior zone fault → 6.
                    AC loss or battery fault → 4.
                    disarmed + zone fault → 2.
                    All nominal → 0.

                  OUTPUT: panel_state, arm_mode, active_zones (any faulted), system_health {ac, battery, fire}, urgency.
                  NOMINAL: "Panel disarmed. All zones clear. System health nominal."
                tool: ""
                # A cache slot, not a summary: a trigger pack writes this kata
                # key and the security_manager rollup reads it. The Ninja
                # never runs it, so it subscribes to nothing.
                role: cache
                trigger_subscriptions: []
                drift_threshold: 5
                emission_cooldown_minutes: 60
                delay_seconds: 0
                suggested_act_event: null
                master_switch: ""
                more_info: ""
                schedules: []
                custom_trigger_override: []
                component_group:
                  component_key: security_panel
                  parent_component_key: security_manager
                  primary_index_key: security_panel
                  shared_delay_seconds: 0
                  shared_labelset: []
                  shared_schedule_group: ""
                  shared_trigger_subscriptions: []
                index_call:
                  label_1: security_manager
                  label_2: ""
                  operator: AND
                  domain_inspect_domains: []
                  domain_inspect_limit: 25
                  expand_entities: false
                  filter_json: {}
                  output_fields: ""
                meta:
                  enabled: true
                  published_from: security_panel
                  requires:
                    cert: ""
                    level: 0

              - kata_key: security_cameras
                component_key: security_cameras
                parent_component_key: security_manager
                primary_index_key: security_cameras
                friendly_name: Security Cameras
                label: security_manager
                version: "1.0.1"
                component_summary: >-
                  Synthesizes camera activity from the camera_manager pipeline — receives
                  camera_scan_complete events and produces a security-context camera status summary.
                component_instructions: >-
                  Synthesize camera activity scan results in security context.

                  DATA SOURCE: camera_cache supplemental context (passed by trigger coalescer).
                    Fields: last_event, label, cameras (list), panel_state, home_mode, ts.
                    Camera scene detail: cross-reference camera_manager kata from sensor.zenos_kata_cabinet.

                  ACTIVITY CLASSIFICATION (from camera_cache label field):
                    cadence — routine scan, no event trigger. Urgency 0 unless anomaly found.
                    motion_trigger — motion detected. Classify subject from camera_manager kata.
                    person_detected — identify: known resident, delivery, unknown person.

                  SECURITY ESCALATION:
                    Unknown person at entry point, panel armed_away → urgency 8.
                    Unknown person after hours (22:00–06:00) → urgency 6.
                    Person at garage/back entry, home occupied → urgency 3 (verify).
                    Known resident activity, any mode → urgency 1.
                    Cadence scan, no subjects → urgency 0.

                  Cross-reference panel_state and home_mode for mode-aware escalation.
                  If camera_manager kata unavailable: use camera_cache label/cameras as best effort.

                  OUTPUT: cameras_scanned [], detected_subjects [], activity_type, threat_assessment, urgency.
                  NOMINAL: "Cameras clear. Routine scan. No subjects detected."
                tool: ""
                # A cache slot, not a summary: a trigger pack writes this kata
                # key and the security_manager rollup reads it. The Ninja
                # never runs it, so it subscribes to nothing.
                role: cache
                trigger_subscriptions: []
                drift_threshold: 5
                emission_cooldown_minutes: 60
                delay_seconds: 0
                suggested_act_event: null
                master_switch: ""
                more_info: ""
                schedules: []
                custom_trigger_override: []
                component_group:
                  component_key: security_cameras
                  parent_component_key: security_manager
                  primary_index_key: security_cameras
                  shared_delay_seconds: 0
                  shared_labelset: []
                  shared_schedule_group: ""
                  shared_trigger_subscriptions: []
                index_call:
                  label_1: security_manager
                  label_2: ""
                  operator: AND
                  domain_inspect_domains: []
                  domain_inspect_limit: 25
                  expand_entities: false
                  filter_json: {}
                  output_fields: ""
                meta:
                  enabled: true
                  published_from: security_cameras
                  requires:
                    cert: ""
                    level: 0

          - variables:
              _kfc_out: >-
                {%- if _kfc_filter == '' -%}
                  {{ _kfc_defs }}
                {%- else -%}
                  {{ _kfc_defs | selectattr('kata_key', 'equalto', _kfc_filter) | list }}
                {%- endif -%}
              result:
                status: ok
                tool: zen_dojotools_security_manager
                version: "5.24.0"
                mode: kfc_manifest
                kfc: "{{ _kfc_out }}"
                count: "{{ _kfc_out | length }}"
                caller_token: "{{ caller_token | default('') }}"

      - if: "{{ result is not defined }}"
        then:
        # ── Normalize inputs ──────────────────────────────────────────────────
        - variables:
            _action: "{{ mode | default(action | default('read_state', true)) | lower | trim }}"
            _token: "{{ caller_token | default('', true) }}"
            _panel_input: "{{ panel | default('', true) | trim }}"
            _arm_mode: "{{ arm_mode | default('', true) | lower | trim }}"
            _policy_patch: "{{ policy_patch | default('', true) | trim }}"
            _auto_arm_trigger: "{{ auto_arm_trigger | default('occupancy', true) | lower | trim }}"
            _auto_arm_patch: "{{ auto_arm_patch | default('', true) | trim }}"
            _ov_kind: "{{ override_kind | default('', true) | lower | trim }}"
            _ov_from: "{{ override_from | default('', true) | lower | trim }}"
            _ov_to: "{{ override_to | default('', true) | lower | trim }}"
            _ov_reason: "{{ override_reason | default('', true) | trim }}"
            _ov_minutes: "{{ override_minutes | default(30, true) | int(30) }}"
            _ov_max_in: "{{ override_max_minutes | default(0, true) | int(0) }}"
            _ov_consent: "{{ override_consent | default('', true) | trim }}"
            _auto_arm_vac_cancelled: "{{ auto_arm_vac_cancelled | default(false, true) | bool(false) }}"
            _auto_arm_entity: "{{ auto_arm_entity | default('', true) | string | trim }}"
            # Spook capability gate: overrides are ended by the Zen Security Sentry,
            # which only runs when Spook's trigger platforms work (Home Assistant
            # disables an automation whose triggers are invalid). So the Sentry's own
            # state is the capability probe, no version read. No Sentry, no override.
            _sp_ok: "{{ (states.automation | selectattr('attributes.id', 'eq', 'zen_security_sentry') | map(attribute='state') | list | first | default('missing', true)) == 'on' }}"
            # Vacuum capability: the vacuum behaviors only make sense when a vacuum
            # is labeled to Autovac, the Autovac tool is installed and switched on.
            # no_vacuum | autovac_missing | autovac_disabled | vacuum_unavailable | ready.
            _vc_ent: "{{ label_entities('autovac') | select('match', 'vacuum\\.') | list | first | default('') }}"
            _vc_state: >-
              {%- set hh = states('sensor.zen_default_household_cabinet_resolved') -%}
              {%- set hv = state_attr(hh, 'variables') if hh not in ['', 'unknown', 'unavailable'] else none -%}
              {%- set a = hv.get('autovac', {}) if hv is mapping else {} -%}
              {%- set av = a.get('value', a) if a is mapping else {} -%}
              {%- set av = (av | from_json({})) if av is string else av -%}
              {%- set en = (av.get('system', {}) if av is mapping else {}).get('enabled', true) -%}
              {%- if _vc_ent == '' -%}no_vacuum
              {%- elif states('script.zen_dojotools_autovac') not in ['on', 'off'] -%}autovac_missing
              {%- elif not (en | bool(true)) -%}autovac_disabled
              {%- elif states(_vc_ent) in ['unavailable', 'unknown'] -%}vacuum_unavailable
              {%- else -%}ready{%- endif -%}
            _lg_kind: "{{ ledger_kind | default('', true) | lower | trim }}"
            _lg_summary: "{{ ledger_summary | default('', true) | trim }}"
            _lg_source: "{{ ledger_source | default('', true) | lower | trim }}"
            _lg_detail: "{{ ledger_detail | default('', true) | trim }}"
            _ac_hours: "{{ [[activity_hours | default(24, true) | int(24), 1] | max, 168] | min }}"
            _ac_limit: "{{ [[activity_limit | default(50, true) | int(50), 1] | max, 150] | min }}"

        # ═══════════════════════════════════════════════════════════════════════
        # Single-entry/single-exit: every branch below builds `result` and falls
        # through. ONE stop point at the bottom wraps it in OS.envelope().
        # ═══════════════════════════════════════════════════════════════════════
        - choose:
            # ── QUERY (r) — list all labeled panels ──────────────────────────────
            - conditions: "{{ _action == 'query' }}"
              sequence:
                - variables:
                    _panels: >-
                      {%- set ns = namespace(panels=[]) -%}
                      {%- for eid in label_entities('alarm_panel') -%}
                        {%- if eid.startswith('alarm_control_panel.') -%}
                          {%- set ns.panels = ns.panels + [{
                            "entity_id": eid,
                            "name": ((([device_name(eid) if device_id(eid) else '', entity_name(eid)] | select | unique | join(' ')) if entity_name is defined else '') or (state_attr(eid, 'friendly_name') | default(eid, true))),
                            "state": states(eid)
                          }] -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {{ ns.panels }}
                - variables:
                    result:
                      status: ok
                      action: query
                      panels: "{{ _panels }}"
                      count: "{{ _panels | length }}"

            # ── READINESS (r) — can the house arm now, and if not, what blocks it.
            # Labels only: alarm_panel, zen_door (door, window and garage-door
            # sensors and covers), ext_lock (exterior locks). A blocker is
            # something a person must resolve or that cannot be read; an
            # unlocked exterior lock is fixable (lock it) and is listed apart.
            # Read, no cert (same tier as query). Shared by auto-arm, the night
            # and departure sequences and the agent's own "can I arm now?".
            - conditions: "{{ _action == 'readiness' }}"
              sequence:
                - variables:
                    _rd_panels: >-
                      {{ label_entities('alarm_panel') | select('match', 'alarm_control_panel\\.') | list }}
                    _rd_perimeter: >-
                      {{ label_entities('zen_door') | select('match', '(binary_sensor|cover)\\.') | list }}
                    _rd_locks: >-
                      {{ label_entities('ext_lock') | select('match', 'lock\\.') | list }}
                # The panel knows its own zones (doors, windows, motion) and whether it
                # says it is ready. read_state walks them; readiness reuses that so a
                # house whose doors and windows are panel zones, not labeled zen_door,
                # is still checked.
                - action: script.zen_dojotools_security_manager
                  continue_on_error: true
                  data:
                    action: read_state
                  response_variable: _rd_rs_raw
                - variables:
                    _rd_rs: "{{ (_rd_rs_raw.get('result', {})) if _rd_rs_raw is mapping else {} }}"
                - variables:
                    _rd_zones: "{{ _rd_rs.get('zones', []) if _rd_rs is mapping else [] }}"
                    _rd_sys: "{{ _rd_rs.get('system', []) if _rd_rs is mapping else [] }}"
                - variables:
                    _rd_blockers: >-
                      {%- set ns = namespace(out=[]) -%}
                      {%- if _rd_panels | count == 0 -%}
                        {%- set ns.out = ns.out + [{'kind': 'no_panel', 'entity_id': '', 'name': '', 'state': '', 'since': '', 'detail': 'no alarm panel is labeled alarm_panel'}] -%}
                      {%- endif -%}
                      {%- for eid in _rd_panels -%}
                        {%- set st = states(eid) -%}
                        {%- if st in ['pending', 'triggered', 'arming', 'unavailable', 'unknown'] -%}
                          {%- set ex = expand(eid) | list -%}
                          {%- set ns.out = ns.out + [{'kind': 'panel_' ~ st, 'entity_id': eid, 'name': state_attr(eid, 'friendly_name') | default(eid, true), 'state': st, 'since': (ex[0].last_changed.isoformat() if ex | count > 0 else ''), 'detail': 'panel is ' ~ st}] -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {%- for eid in _rd_perimeter -%}
                        {%- set st = states(eid) -%}
                        {%- set dc = state_attr(eid, 'device_class') | default('sensor', true) -%}
                        {%- set is_open = (st == 'on') if eid.startswith('binary_sensor.') else (st in ['open', 'opening', 'closing']) -%}
                        {%- if is_open or st in ['unavailable', 'unknown'] -%}
                          {%- set ex = expand(eid) | list -%}
                          {%- set ns.out = ns.out + [{'kind': ('open_' ~ dc) if is_open else ('unreadable_' ~ dc), 'entity_id': eid, 'name': state_attr(eid, 'friendly_name') | default(eid, true), 'state': st, 'since': (ex[0].last_changed.isoformat() if ex | count > 0 else ''), 'detail': 'open' if is_open else 'cannot be read'}] -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {%- for z in (_rd_zones if _rd_zones is iterable and _rd_zones is not string else []) -%}
                        {%- set zid = z.get('entity_id', '') if z is mapping else '' -%}
                        {%- if zid != '' and zid not in (ns.out | map(attribute='entity_id') | list) and not z.get('bypassed', false) and (z.get('open', false) or z.get('fault', false)) -%}
                          {%- set ex = expand(zid) | list -%}
                          {%- set ns.out = ns.out + [{'kind': ('zone_open_' ~ z.get('type', 'zone')) if z.get('open', false) else 'zone_fault', 'entity_id': zid, 'name': z.get('name', zid), 'state': 'open' if z.get('open', false) else 'fault', 'since': (ex[0].last_changed.isoformat() if ex | count > 0 else ''), 'detail': 'open' if z.get('open', false) else 'has a fault'}] -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {%- for s in (_rd_sys if _rd_sys is iterable and _rd_sys is not string else []) -%}
                        {%- if s is mapping and s.get('interpretation', '') == 'panel ready' and not s.get('ok', true) -%}
                          {%- set ns.out = ns.out + [{'kind': 'panel_not_ready', 'entity_id': s.get('entity_id', ''), 'name': s.get('name', 'Alarm panel'), 'state': s.get('state', ''), 'since': '', 'detail': 'the panel itself says it is not ready'}] -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {%- for eid in _rd_locks -%}
                        {%- set st = states(eid) -%}
                        {%- if st in ['jammed', 'unavailable', 'unknown'] -%}
                          {%- set ex = expand(eid) | list -%}
                          {%- set ns.out = ns.out + [{'kind': 'lock_jammed' if st == 'jammed' else 'lock_unreadable', 'entity_id': eid, 'name': state_attr(eid, 'friendly_name') | default(eid, true), 'state': st, 'since': (ex[0].last_changed.isoformat() if ex | count > 0 else ''), 'detail': 'jammed' if st == 'jammed' else 'cannot be read'}] -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {{ ns.out }}
                    _rd_fixable: >-
                      {%- set ns = namespace(out=[]) -%}
                      {%- for eid in _rd_locks -%}
                        {%- if states(eid) in ['unlocked', 'open', 'opening', 'unlocking'] -%}
                          {%- set ex = expand(eid) | list -%}
                          {%- set ns.out = ns.out + [{'kind': 'lock_unlocked', 'entity_id': eid, 'name': state_attr(eid, 'friendly_name') | default(eid, true), 'state': states(eid), 'since': (ex[0].last_changed.isoformat() if ex | count > 0 else ''), 'fix': 'lock'}] -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {{ ns.out }}
                - variables:
                    _rd_zone_count: "{{ (_rd_zones | count) if (_rd_zones is iterable and _rd_zones is not string) else 0 }}"
                    _rd_notes: >-
                      {%- set ns = namespace(out=[]) -%}
                      {%- for z in (_rd_zones if (_rd_zones is iterable and _rd_zones is not string) else []) -%}
                        {%- if z is mapping and z.get('bypassed', false) -%}
                          {%- set ns.out = ns.out + [z.get('name', z.get('entity_id', 'A zone')) ~ ' is bypassed'] -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {{ ns.out }}
                - variables:
                    # Blind: nothing the system can see was checked, so "ready" would
                    # mean nothing. Said plainly, never a bare "ready".
                    _rd_blind: "{{ (_rd_zone_count | int(0)) == 0 and (_rd_perimeter | count) == 0 }}"
                - variables:
                    _rd_summary: >-
                      {%- set ns = namespace(parts=[], fx=[]) -%}
                      {%- for b in _rd_blockers -%}
                        {%- set ns.parts = ns.parts + [(b.name ~ ': ' ~ b.detail) if b.name != '' else b.detail] -%}
                      {%- endfor -%}
                      {%- for f in _rd_fixable -%}
                        {%- set ns.fx = ns.fx + [f.name] -%}
                      {%- endfor -%}
                      {%- set _m = 'Ready to arm: nothing the system can see is open, faulted, jammed or unlocked.' if (ns.parts | count == 0 and ns.fx | count == 0) else (('Not ready: ' ~ (ns.parts | join('; ')) ~ '.') if ns.parts | count > 0 else 'Not ready yet.') -%}
                      {%- set _f = (' Can be fixed by locking: ' ~ (ns.fx | join(', ')) ~ '.') if ns.fx | count > 0 else '' -%}
                      {%- set _n = (' Note: ' ~ (_rd_notes | join('; ')) ~ '.') if _rd_notes | count > 0 else '' -%}
                      {%- set _w = ' No door or window sensors are visible to check (no panel zones read, nothing labeled zen_door), so an open door would not be noticed.' if _rd_blind else '' -%}
                      {{ _m ~ _f ~ _n ~ _w }}
                - variables:
                    result:
                      status: ok
                      action: readiness
                      ready: "{{ _rd_blockers | count == 0 and _rd_fixable | count == 0 }}"
                      arm_possible_after_fixes: "{{ _rd_blockers | count == 0 }}"
                      blockers: "{{ _rd_blockers }}"
                      fixable: "{{ _rd_fixable }}"
                      notes: "{{ _rd_notes }}"
                      blind: "{{ _rd_blind }}"
                      checked:
                        panels: "{{ _rd_panels | count }}"
                        panel_zones: "{{ _rd_zone_count }}"
                        perimeter_sensors: "{{ _rd_perimeter | count }}"
                        exterior_locks: "{{ _rd_locks | count }}"
                      summary: "{{ _rd_summary | trim }}"

            # ── LENS (r) — the security answer for other tools (Room Manager's
            # home overview first). One call, one place for each fact: readiness,
            # override_list and activity answer it, this only composes them. Never
            # calls Room Manager back (a loop). Read, no cert.
            - conditions: "{{ _action == 'lens' }}"
              sequence:
                - variables:
                    _ln_panel: >-
                      {%- set ns = namespace(found='') -%}
                      {%- for eid in label_entities('alarm_panel') -%}
                        {%- if ns.found == '' and eid.startswith('alarm_control_panel.') -%}
                          {%- set ns.found = eid -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {{ ns.found }}
                - action: script.zen_dojotools_security_manager
                  continue_on_error: true
                  data:
                    action: readiness
                  response_variable: _ln_rd_raw
                - action: script.zen_dojotools_security_manager
                  continue_on_error: true
                  data:
                    action: override_list
                  response_variable: _ln_ov_raw
                - action: script.zen_dojotools_security_manager
                  continue_on_error: true
                  data:
                    action: activity
                    activity_limit: 1
                    activity_hours: 168
                  response_variable: _ln_ac_raw
                - variables:
                    _ln_rd: "{{ (_ln_rd_raw.get('result', {})) if _ln_rd_raw is mapping else {} }}"
                    _ln_ov: "{{ (_ln_ov_raw.get('result', {})) if _ln_ov_raw is mapping else {} }}"
                    _ln_ac: "{{ (_ln_ac_raw.get('result', {})) if _ln_ac_raw is mapping else {} }}"
                - variables:
                    _ln_active: >-
                      {{ (_ln_ov.get('overrides', []) | selectattr('expired', 'equalto', false) | list) if _ln_ov is mapping else [] }}
                    _ln_stuck: >-
                      {{ (_ln_ov.get('overrides', []) | selectattr('expired', 'equalto', true) | list) if _ln_ov is mapping else [] }}
                    _ln_last: "{{ (_ln_ac.get('entries', []) | first) if (_ln_ac.get('entries', []) | count) > 0 else {} }}"
                    _ln_state: "{{ states(_ln_panel) if _ln_panel != '' else '' }}"
                - variables:
                    _ln_ov_line: >-
                      {%- if _ln_active | count > 0 -%}
                        {%- set o = _ln_active[0] -%}
                        Security is temporarily {{ o.get('to', '') | replace('_', ' ') }}{{ (' instead of ' ~ (o.get('from', '') | replace('_', ' '))) if o.get('from', '') != '' else '' }}{{ (' (' ~ o.get('reason', '') ~ ')') if o.get('reason', '') != '' else '' }}; it should return about {{ o.get('expires_at', '')[11:16] }}.
                      {%- endif -%}
                - variables:
                    result:
                      status: ok
                      action: lens
                      available: "{{ _ln_panel != '' }}"
                      panel:
                        entity_id: "{{ _ln_panel }}"
                        state: "{{ _ln_state }}"
                      ready: "{{ _ln_rd.get('ready', false) if _ln_rd is mapping else false }}"
                      blocker_count: "{{ (_ln_rd.get('blockers', []) | count) if _ln_rd is mapping else 0 }}"
                      readiness_summary: "{{ _ln_rd.get('summary', '') if _ln_rd is mapping else '' }}"
                      temporary_override: "{{ _ln_active[0] if _ln_active | count > 0 else none }}"
                      stuck_overrides: "{{ _ln_stuck }}"
                      sentry_state: "{{ states.automation | selectattr('attributes.id', 'eq', 'zen_security_sentry') | map(attribute='state') | list | first | default('missing', true) }}"
                      last_activity: "{{ _ln_last if _ln_last != {} else none }}"
                      line: >-
                        {%- if _ln_panel == '' -%}
                          No alarm panel is set up.
                        {%- else -%}
                          Alarm panel is {{ _ln_state | replace('_', ' ') }}.{{ (' ' ~ _ln_ov_line) if _ln_ov_line != '' else '' }}{{ ' A temporary override has outlived its time and has not been ended: security may still be changed. The Zen Security Sentry is ' ~ ('running' if _sp_ok else 'not running (it needs Spook)') ~ '.' if _ln_stuck | count > 0 else '' }}
                        {%- endif -%}

            # ── ACTIVITY (r) — what security has done on its own, and declined ──
            # The ledger the agent reads so the system never acts behind her back.
            # Newest first, last 24 hours by default (at most 168), at most 150
            # entries. Read, no cert. Lives in the household cabinet key
            # _security_ledger (hidden, like Alert Manager's _zen_active_alerts).
            - conditions: "{{ _action == 'activity' }}"
              sequence:
                - variables:
                    _hh_cab: "{{ states('sensor.zen_default_household_cabinet_resolved') }}"
                - action: script.zen_sutra_filecabinet
                  continue_on_error: true
                  data:
                    mode: get
                    volume_entity_id: "{{ _hh_cab }}"
                    key: _security_ledger
                    force_action: true
                    caller_token: "{{ _token }}/security_manager_activity"
                  response_variable: _lg_read
                - variables:
                    _lg_entries: >-
                      {%- set r = _lg_read.get('value') if _lg_read is mapping else none -%}
                      {%- set r = (r | from_json({})) if r is string else (r if r is mapping else {}) -%}
                      {%- set v = r.get('value', r) if r is mapping else {} -%}
                      {%- set v = (v | from_json({})) if v is string else v -%}
                      {%- set e = v.get('entries', []) if v is mapping else [] -%}
                      {{ e if e is iterable and e is not string else [] }}
                    _ac_now_ts: "{{ now().timestamp() }}"
                - variables:
                    _ac_rows: >-
                      {%- set since = (_ac_now_ts | float(0)) - (_ac_hours | int(24)) * 3600 -%}
                      {%- set inwin = _lg_entries | selectattr('ts', 'defined') | selectattr('ts', 'ge', since) | list -%}
                      {{ (inwin | reverse | list)[:(_ac_limit | int(50))] }}
                - variables:
                    result:
                      status: ok
                      action: activity
                      window_hours: "{{ _ac_hours }}"
                      entries: "{{ _ac_rows }}"
                      count: "{{ _ac_rows | count }}"
                      total_in_ledger: "{{ _lg_entries | count }}"
                      newest_at: "{{ _ac_rows[0].get('at', '') if _ac_rows | count > 0 else '' }}"
                      note: "{{ '' if _ac_rows | count > 0 else 'Nothing recorded in this window: security has not acted on its own, or has not been set up to.' }}"

            # ── LEDGER_ADD (internal) — record what the system did or declined ──
            # Only the automations and actions that own a behavior call this (no
            # user in their context). Keeps at most 150 entries and drops any
            # older than 7 days on every write. Read-modify-write of one hidden
            # key: two writers in the same instant can lose one line, which is the
            # accepted cost of a plain list (the ledger is an aid, not a record of
            # legal weight; overrides carry their own state).
            - conditions: "{{ _action == 'ledger_add' }}"
              sequence:
                - variables:
                    _hh_cab: "{{ states('sensor.zen_default_household_cabinet_resolved') }}"
                    _lg_user: "{{ (context.user_id if context is defined else '') or '' }}"
                - choose:
                    - conditions: "{{ _lg_user != '' }}"
                      sequence:
                        - variables:
                            result:
                              status: error
                              action: ledger_add
                              reason: "guarded: ledger_add is internal; only the behavior that acted writes it. Use activity to read the ledger."
                    - conditions: "{{ _lg_kind == '' or _lg_summary == '' }}"
                      sequence:
                        - variables:
                            result:
                              status: error
                              action: ledger_add
                              error: missing_ledger_fields
                              detail: "ledger_kind and ledger_summary are required."
                  default:
                    - action: script.zen_sutra_filecabinet
                      continue_on_error: true
                      data:
                        mode: get
                        volume_entity_id: "{{ _hh_cab }}"
                        key: _security_ledger
                        force_action: true
                        caller_token: "{{ _token }}/security_manager_ledger_add"
                      response_variable: _lg_read
                    - variables:
                        _lg_entries: >-
                          {%- set r = _lg_read.get('value') if _lg_read is mapping else none -%}
                          {%- set r = (r | from_json({})) if r is string else (r if r is mapping else {}) -%}
                          {%- set v = r.get('value', r) if r is mapping else {} -%}
                          {%- set v = (v | from_json({})) if v is string else v -%}
                          {%- set e = v.get('entries', []) if v is mapping else [] -%}
                          {{ e if e is iterable and e is not string else [] }}
                        _lg_now_ts: "{{ now().timestamp() }}"
                    - variables:
                        _lg_entry:
                          ts: "{{ _lg_now_ts }}"
                          at: "{{ _lg_now_ts | timestamp_custom('%Y-%m-%dT%H:%M:%S%z') }}"
                          kind: "{{ _lg_kind }}"
                          source: "{{ _lg_source }}"
                          summary: "{{ _lg_summary | truncate(300, true, '') }}"
                          detail: "{{ _lg_detail | truncate(200, true, '') }}"
                    - variables:
                        _lg_new: >-
                          {%- set cutoff = (_lg_now_ts | float(0)) - 604800 -%}
                          {%- set kept = _lg_entries | selectattr('ts', 'defined') | selectattr('ts', 'ge', cutoff) | list -%}
                          {{ (kept + [_lg_entry])[-150:] }}
                    - action: script.zen_sutra_filecabinet
                      data:
                        mode: update
                        write_mode: replace
                        force_action: true
                        volume_entity_id: ["{{ _hh_cab }}"]
                        key: _security_ledger
                        value: "{{ {'entries': _lg_new} | tojson }}"
                        no_autoexpire: true
                        caller_token: "{{ _token }}/security_manager_ledger_add"
                      response_variable: _lg_fc_result
                    - variables:
                        result:
                          status: ok
                          action: ledger_add
                          entry: "{{ _lg_entry }}"
                          entries_kept: "{{ _lg_new | count }}"

            # ── OVERRIDE_LIST (r) — the temporary overrides in force ─────────────
            # A temporary override is a record, not a flag: what the panel left,
            # what it moved to, why, when it began and when it expires, and a hard
            # ceiling from its start that nothing may pass. Read, no cert. The agent
            # sees these in the answer to "what is security doing" so the system
            # never acts behind her back.
            - conditions: "{{ _action == 'override_list' }}"
              sequence:
                - variables:
                    _hh_cab: "{{ states('sensor.zen_default_household_cabinet_resolved') }}"
                    _hh_vars: >-
                      {{ state_attr(_hh_cab, 'variables') | default({}, true) }}
                    _sm_drawer: "{{ _hh_vars.get('security_manager', {}) }}"
                - variables:
                    _sm_val: >-
                      {%- set d = _sm_drawer -%}
                      {{ d.get('value', d) if d is mapping else {} }}
                    _ov_now_ts: "{{ now().timestamp() }}"
                - variables:
                    _ov_all: "{{ _sm_val.get('_overrides', {}) }}"
                - variables:
                    _ov_rows: >-
                      {%- set ns = namespace(out=[]) -%}
                      {%- for k, r in (_ov_all.items() if _ov_all is mapping else []) -%}
                        {%- set left = ((r.get('expires_ts', 0) | float(0)) - (_ov_now_ts | float(0))) / 60 -%}
                        {%- set ns.out = ns.out + [r | combine({'minutes_left': (left | round(1)) if left > 0 else 0, 'expired': left <= 0})] -%}
                      {%- endfor -%}
                      {{ ns.out }}
                - variables:
                    result:
                      status: ok
                      action: override_list
                      overrides: "{{ _ov_rows }}"
                      active_count: "{{ _ov_rows | selectattr('expired', 'equalto', false) | list | count }}"
                      expired_count: "{{ _ov_rows | selectattr('expired', 'equalto', true) | list | count }}"

            # ── OVERRIDE_SET (internal) — begin or extend a temporary override ───
            # Only the automations that own a behavior call this (no user in
            # their context). One override per kind; calling again for the same
            # kind moves the expiry. The expiry can never pass the override's start
            # plus its ceiling (default 180 min): a longer ask is clamped and
            # counted. A running override's ceiling is fixed at its start and can
            # only be lowered, never raised, by a later call.
            - conditions: "{{ _action == 'override_set' }}"
              sequence:
                - variables:
                    _hh_cab: "{{ states('sensor.zen_default_household_cabinet_resolved') }}"
                    _hh_vars: >-
                      {{ state_attr(_hh_cab, 'variables') | default({}, true) }}
                    _sm_drawer: "{{ _hh_vars.get('security_manager', {}) }}"
                    _ov_user: "{{ (context.user_id if context is defined else '') or '' }}"
                - variables:
                    _sm_val: >-
                      {%- set d = _sm_drawer -%}
                      {{ d.get('value', d) if d is mapping else {} }}
                - variables:
                    _ov_all: "{{ _sm_val.get('_overrides', {}) }}"
                - choose:
                    - conditions: "{{ _ov_user != '' }}"
                      sequence:
                        - variables:
                            result:
                              status: error
                              action: override_set
                              reason: "guarded: override_set is internal; only the automation that owns a behavior calls it. Use override_list to read the overrides in force."
                    - conditions: "{{ _ov_kind == '' }}"
                      sequence:
                        - variables:
                            result:
                              status: error
                              action: override_set
                              error: missing_override_kind
                              detail: "override_kind is required (for example vacuum_sync)."
                    - conditions: "{{ not _sp_ok }}"
                      sequence:
                        - variables:
                            result:
                              status: error
                              action: override_set
                              error: spook_required
                              detail: "A temporary override needs the Zen Security Sentry to end it, and the Sentry needs Spook's trigger platforms. The Sentry is not running (the Zen Security Sentry automation is not on, or is missing), so no override was made. Install or update Spook, then check security_manager readiness again."
                  default:
                    - variables:
                        _ov_prev: "{{ _ov_all.get(_ov_kind, {}) if _ov_all is mapping else {} }}"
                        _ov_now_ts: "{{ now().timestamp() }}"
                    - variables:
                        _ov_since_ts: "{{ _ov_prev.get('since_ts', _ov_now_ts) | float(_ov_now_ts) }}"
                        _ov_ceiling_min: >-
                          {%- set prev_max = _ov_prev.get('max_total_min', 0) | int(0) -%}
                          {%- if prev_max > 0 -%}
                            {{ [prev_max, _ov_max_in] | min if _ov_max_in > 0 else prev_max }}
                          {%- else -%}
                            {{ _ov_max_in if _ov_max_in > 0 else 180 }}
                          {%- endif -%}
                    - variables:
                        _ov_req_ts: "{{ (_ov_now_ts | float(0)) + (_ov_minutes | int(30)) * 60 }}"
                        _ov_cap_ts: "{{ (_ov_since_ts | float(0)) + (_ov_ceiling_min | int(180)) * 60 }}"
                    - variables:
                        _ov_clamped: "{{ _ov_req_ts > _ov_cap_ts }}"
                        _ov_exp_ts: "{{ [_ov_req_ts, _ov_cap_ts] | min }}"
                    - variables:
                        _ov_record:
                          id: "{{ _ov_kind }}"
                          kind: "{{ _ov_kind }}"
                          from: "{{ _ov_from if _ov_from != '' else _ov_prev.get('from', '') }}"
                          to: "{{ _ov_to if _ov_to != '' else _ov_prev.get('to', '') }}"
                          reason: "{{ _ov_reason if _ov_reason != '' else _ov_prev.get('reason', '') }}"
                          consent: "{{ _ov_consent if _ov_consent != '' else _ov_prev.get('consent', '') }}"
                          since_ts: "{{ _ov_since_ts }}"
                          since: "{{ _ov_since_ts | timestamp_custom('%Y-%m-%dT%H:%M:%S%z') }}"
                          expires_ts: "{{ _ov_exp_ts }}"
                          expires_at: "{{ _ov_exp_ts | timestamp_custom('%Y-%m-%dT%H:%M:%S%z') }}"
                          max_total_min: "{{ _ov_ceiling_min }}"
                          extensions: "{{ (_ov_prev.get('extensions', 0) | int(0) + 1) if _ov_prev != {} else 0 }}"
                          clamped_count: "{{ (_ov_prev.get('clamped_count', 0) | int(0)) + (1 if _ov_clamped else 0) }}"
                    - variables:
                        _new_sm_val: "{{ _sm_val | combine({'_overrides': (_ov_all | combine({_ov_kind: _ov_record}))}) }}"
                    - action: script.zen_sutra_filecabinet
                      data:
                        mode: update
                        write_mode: replace
                        force_action: true
                        volume_entity_id: ["{{ _hh_cab }}"]
                        key: security_manager
                        value: "{{ _new_sm_val | tojson }}"
                        caller_token: "{{ _token }}/security_manager_override_set"
                      response_variable: _ov_fc_result
                    - action: script.zen_dojotools_security_manager
                      continue_on_error: true
                      data:
                        action: ledger_add
                        ledger_kind: "{{ 'override_begin' if _ov_prev == {} else 'override_extend' }}"
                        ledger_source: "{{ _ov_kind }}"
                        ledger_summary: >-
                          {%- if _ov_prev == {} -%}
                            Security moved from {{ _ov_record.get('from', '') | replace('_', ' ') }} to {{ _ov_record.get('to', '') | replace('_', ' ') }} for {{ _ov_kind | replace('_', ' ') }}{{ (': ' ~ _ov_record.get('reason', '')) if _ov_record.get('reason', '') != '' else '' }}. It ends about {{ _ov_exp_ts | timestamp_custom('%H:%M') }}.
                          {%- else -%}
                            The {{ _ov_kind | replace('_', ' ') }} override was extended to about {{ _ov_exp_ts | timestamp_custom('%H:%M') }}.
                          {%- endif -%}
                    # One line in the agent's active context while the override is in
                    # force (urgent, not critical: a deliberate house state), so "why is the
                    # alarm in Home" is answered knowing why. It expires with the override
                    # and is cleared when the override ends or is swept.
                    - event: zen_event
                      event_data:
                        event:
                          kind: priority_inject_write
                          provider_id: "security_override_{{ _ov_kind }}"
                          summary: >-
                            Security is {{ _ov_record.get('to', '') | replace('_', ' ') }} instead of {{ _ov_record.get('from', '') | replace('_', ' ') }} for {{ _ov_kind | replace('_', ' ') }}{{ (' (' ~ _ov_record.get('reason', '') ~ ')') if _ov_record.get('reason', '') != '' else '' }}, since {{ _ov_since_ts | float(0) | timestamp_custom('%H:%M') }}. It goes back by about {{ _ov_exp_ts | timestamp_custom('%H:%M') }}.
                          urgency: urgent
                          expires_minutes: "{{ [(((_ov_exp_ts | float(0)) - now().timestamp()) / 60) | round(0, 'ceil') | int, 1] | max }}"
                          display: prompt
                    - if: "{{ _ov_clamped }}"
                      then:
                        - action: script.zen_dojotools_security_manager
                          continue_on_error: true
                          data:
                            action: ledger_add
                            ledger_kind: override_clamped
                            ledger_source: "{{ _ov_kind }}"
                            ledger_summary: "The {{ _ov_kind | replace('_', ' ') }} override was asked to run past its {{ _ov_ceiling_min }}-minute limit and was held at {{ _ov_exp_ts | timestamp_custom('%H:%M') }}."
                    - variables:
                        result:
                          status: ok
                          action: override_set
                          created: "{{ _ov_prev == {} }}"
                          clamped: "{{ _ov_clamped }}"
                          override: "{{ _ov_record }}"

            # ── OVERRIDE_SWEEP (internal) — end every override whose time is up ──
            # The Zen Security Sentry calls this once a minute while any override
            # exists. For each expired override: it is removed (one write for all),
            # a ledger line says so, and a zen_event security_override_expired
            # carries the record so the behavior that owns it can put the panel
            # back (this action never touches the panel itself). Same internal-only
            # guard as override_set. A sweep and an override_set in the same instant
            # can race on the one drawer value (the accepted cost, as for the
            # ledger): the sweep only removes records whose time had already passed.
            - conditions: "{{ _action == 'override_sweep' }}"
              sequence:
                - variables:
                    _hh_cab: "{{ states('sensor.zen_default_household_cabinet_resolved') }}"
                    _hh_vars: >-
                      {{ state_attr(_hh_cab, 'variables') | default({}, true) }}
                    _sm_drawer: "{{ _hh_vars.get('security_manager', {}) }}"
                    _sw_user: "{{ (context.user_id if context is defined else '') or '' }}"
                - variables:
                    _sm_val: >-
                      {%- set d = _sm_drawer -%}
                      {{ d.get('value', d) if d is mapping else {} }}
                    _sw_now_ts: "{{ now().timestamp() }}"
                - variables:
                    _ov_all: "{{ _sm_val.get('_overrides', {}) }}"
                - choose:
                    - conditions: "{{ _sw_user != '' }}"
                      sequence:
                        - variables:
                            result:
                              status: error
                              action: override_sweep
                              reason: "guarded: override_sweep is internal; only the Zen Security Sentry calls it. Use override_list to read the overrides in force."
                  default:
                    - variables:
                        _sw_expired: >-
                          {%- set ns = namespace(out=[]) -%}
                          {%- for k, r in (_ov_all.items() if _ov_all is mapping else []) -%}
                            {%- if (r.get('expires_ts', 0) | float(0)) <= (_sw_now_ts | float(0)) -%}
                              {%- set ns.out = ns.out + [r] -%}
                            {%- endif -%}
                          {%- endfor -%}
                          {{ ns.out }}
                        _sw_rest: >-
                          {%- set ns = namespace(d={}) -%}
                          {%- for k, r in (_ov_all.items() if _ov_all is mapping else []) -%}
                            {%- if (r.get('expires_ts', 0) | float(0)) > (_sw_now_ts | float(0)) -%}
                              {%- set ns.d = ns.d | combine({k: r}) -%}
                            {%- endif -%}
                          {%- endfor -%}
                          {{ ns.d }}
                    - if: "{{ _sw_expired | count > 0 }}"
                      then:
                        - variables:
                            _new_sm_val: "{{ _sm_val | combine({'_overrides': _sw_rest}) }}"
                        - action: script.zen_sutra_filecabinet
                          data:
                            mode: update
                            write_mode: replace
                            force_action: true
                            volume_entity_id: ["{{ _hh_cab }}"]
                            key: security_manager
                            value: "{{ _new_sm_val | tojson }}"
                            caller_token: "{{ _token }}/security_manager_override_sweep"
                          response_variable: _sw_fc_result
                        - repeat:
                            for_each: "{{ _sw_expired }}"
                            sequence:
                              - action: script.zen_dojotools_security_manager
                                continue_on_error: true
                                data:
                                  action: ledger_add
                                  ledger_kind: override_expired
                                  ledger_source: "{{ repeat.item.get('kind', '') }}"
                                  ledger_summary: "The {{ repeat.item.get('kind', '') | replace('_', ' ') }} override reached its end time and was ended. Whatever started it is told to put security back{{ (' to ' ~ (repeat.item.get('from', '') | replace('_', ' '))) if repeat.item.get('from', '') != '' else '' }}."
                              - event: zen_event
                                event_data:
                                  event:
                                    kind: security_override_expired
                                    override: "{{ repeat.item }}"
                              - event: zen_event
                                event_data:
                                  event:
                                    kind: priority_inject_clear
                                    provider_id: "security_override_{{ repeat.item.get('kind', '') }}"
                    - variables:
                        result:
                          status: ok
                          action: override_sweep
                          swept_count: "{{ _sw_expired | count }}"
                          swept: "{{ _sw_expired }}"
                          remaining_count: "{{ _sw_rest | count }}"

            # ── OVERRIDE_END (internal) — remove a temporary override ────────────
            # Returns the record that was in force so the caller can revert what it
            # changed. Same internal-only guard as override_set.
            - conditions: "{{ _action == 'override_end' }}"
              sequence:
                - variables:
                    _hh_cab: "{{ states('sensor.zen_default_household_cabinet_resolved') }}"
                    _hh_vars: >-
                      {{ state_attr(_hh_cab, 'variables') | default({}, true) }}
                    _sm_drawer: "{{ _hh_vars.get('security_manager', {}) }}"
                    _ov_user: "{{ (context.user_id if context is defined else '') or '' }}"
                - variables:
                    _sm_val: >-
                      {%- set d = _sm_drawer -%}
                      {{ d.get('value', d) if d is mapping else {} }}
                - variables:
                    _ov_all: "{{ _sm_val.get('_overrides', {}) }}"
                - choose:
                    - conditions: "{{ _ov_user != '' }}"
                      sequence:
                        - variables:
                            result:
                              status: error
                              action: override_end
                              reason: "guarded: override_end is internal; only the automation that owns a behavior calls it."
                    - conditions: "{{ _ov_kind == '' }}"
                      sequence:
                        - variables:
                            result:
                              status: error
                              action: override_end
                              error: missing_override_kind
                              detail: "override_kind is required (for example vacuum_sync)."
                    - conditions: "{{ _ov_all is not mapping or _ov_kind not in _ov_all }}"
                      sequence:
                        - variables:
                            result:
                              status: ok
                              action: override_end
                              found: false
                              note: "No override of that kind is in force."
                  default:
                    - variables:
                        _ov_ended: "{{ _ov_all.get(_ov_kind, {}) }}"
                        _ov_rest: >-
                          {%- set ns = namespace(d={}) -%}
                          {%- for k, r in _ov_all.items() -%}
                            {%- if k != _ov_kind -%}
                              {%- set ns.d = ns.d | combine({k: r}) -%}
                            {%- endif -%}
                          {%- endfor -%}
                          {{ ns.d }}
                    - variables:
                        _new_sm_val: "{{ _sm_val | combine({'_overrides': _ov_rest}) }}"
                    - action: script.zen_sutra_filecabinet
                      data:
                        mode: update
                        write_mode: replace
                        force_action: true
                        volume_entity_id: ["{{ _hh_cab }}"]
                        key: security_manager
                        value: "{{ _new_sm_val | tojson }}"
                        caller_token: "{{ _token }}/security_manager_override_end"
                      response_variable: _ov_fc_result
                    - event: zen_event
                      event_data:
                        event:
                          kind: priority_inject_clear
                          provider_id: "security_override_{{ _ov_kind }}"
                    - action: script.zen_dojotools_security_manager
                      continue_on_error: true
                      data:
                        action: ledger_add
                        ledger_kind: override_end
                        ledger_source: "{{ _ov_kind }}"
                        ledger_summary: "The {{ _ov_kind | replace('_', ' ') }} override ended{{ (' (it had moved security from ' ~ (_ov_ended.get('from', '') | replace('_', ' ')) ~ ' to ' ~ (_ov_ended.get('to', '') | replace('_', ' ')) ~ ')') if _ov_ended.get('from', '') != '' else '' }}."
                    - variables:
                        result:
                          status: ok
                          action: override_end
                          found: true
                          ended: "{{ _ov_ended }}"

            # ── GET_POLICY (r) — read _alert_policy from household cabinet ──────
            - conditions: "{{ _action == 'get_policy' }}"
              sequence:
                - variables:
                    _hh_cab: "{{ states('sensor.zen_default_household_cabinet_resolved') }}"
                    _hh_vars: >-
                      {{ state_attr(_hh_cab, 'variables') | default({}, true) }}
                    _sm_drawer: "{{ _hh_vars.get('security_manager', {}) }}"
                    _policy_val: >-
                      {%- set d = _sm_drawer -%}
                      {%- set d = d.get('value', d) if d is mapping else {} -%}
                      {{ d.get('_alert_policy', {}) }}
                - variables:
                    result:
                      status: ok
                      action: get_policy
                      policy: "{{ _policy_val }}"
                      source: household_cabinet/security_manager/_alert_policy

            # ── SET_ALERT_POLICY (x) — merge patch into _alert_policy ───────────
            # Tier X: same security_control cert as arm. Governs what the
            # household even gets notified about -- silently weakening it
            # (e.g. dropping alarm_triggered urgency) is a real risk, not left
            # open like get_policy. ──
            - conditions: "{{ _action == 'set_alert_policy' }}"
              sequence:
                - choose:
                    - conditions: "{{ _policy_patch == '' }}"
                      sequence:
                        - variables:
                            result:
                              status: error
                              error: missing_policy_patch
                              detail: "policy_patch (JSON string) is required for set_alert_policy."
                  default:
                    - action: script.zen_dojotools_identity
                      response_variable: _sap_id_raw
                      continue_on_error: true
                      data:
                        mode: resolve_caller_identity
                        required_cert: zenos.actuation.security_control
                        required_cert_level: 1
                        caller_token: "{{ _token }}"
                    - variables:
                        _sap_id_fields: >-
                          {%- import 'zenos_ai/zen_os_1.jinja' as OS -%}
                          {%- set _raw = OS.resolve_identity_fields(_sap_id_raw) -%}
                          {{- (_raw | from_json) if _raw is string else _raw -}}
                        _sap_policy_status: "{{ _sap_id_fields.policy_status }}"
                        _sap_authorized: "{{ _sap_id_fields.authorized }}"
                        _sap_cert_level: "{{ _sap_id_fields.cert_level }}"
                    - choose:
                        - conditions: "{{ _sap_policy_status != 'allowed' or not _sap_authorized }}"
                          sequence:
                            - variables:
                                result:
                                  status: error
                                  error: "{{ 'identity_policy_blocked' if _sap_policy_status != 'allowed' else 'cert_insufficient' }}"
                                  detail: >-
                                    {%- if _sap_policy_status != 'allowed' -%}
                                      resolve_caller_identity did not return an allowed identity -- action denied.
                                    {%- else -%}
                                      zenos.actuation.security_control cert level {{ _sap_cert_level }} is below the required minimum (1). Certify the default agent via persona_editor to enable alert-policy changes.
                                    {%- endif -%}
                      default:
                        - variables:
                            _hh_cab: "{{ states('sensor.zen_default_household_cabinet_resolved') }}"
                            _hh_vars: >-
                              {{ state_attr(_hh_cab, 'variables') | default({}, true) }}
                            _sm_drawer: "{{ _hh_vars.get('security_manager', {}) }}"
                        - variables:
                            _sm_val: >-
                              {%- set d = _sm_drawer -%}
                              {{ d.get('value', d) if d is mapping else {} }}
                            _current_policy: "{{ _sm_val.get('_alert_policy', {}) }}"
                            _patch: "{{ _policy_patch | from_json }}"
                        - variables:
                            _new_policy: "{{ _current_policy | combine(_patch, recursive=true) }}"
                            _new_val: "{{ _sm_val | combine({'_alert_policy': _new_policy}) }}"
                        - action: script.zen_sutra_filecabinet
                          data:
                            mode: update
                            write_mode: replace
                            force_action: true
                            volume_entity_id: ["{{ _hh_cab }}"]
                            key: security_manager
                            value: "{{ _new_val | tojson }}"
                            caller_token: "{{ _token }}/security_manager_set_policy"
                          response_variable: _fc_result
                        - variables:
                            result:
                              status: ok
                              action: set_alert_policy
                              policy: "{{ _new_policy }}"
                              event_types_patched: "{{ _patch | list }}"

            # ── AUTO_ARM_CONFIG (x) — write auto_arm_enabled/vac_arm_override_enabled.
            # Same security_control cert as arm/set_alert_policy -- this toggle IS
            # the human-authorized gate; auto_arm_check itself (below) does not
            # re-ask per fire, same as Room Manager's wasp/reflex automations don't
            # re-cert on every trigger once their master switch is on. ──
            - conditions: "{{ _action == 'auto_arm_config' }}"
              sequence:
                - choose:
                    # No patch is a read: return the stored settings, no cert, nothing
                    # changed (the help says "read or write"; this used to answer
                    # missing_auto_arm_patch, so an agent could not see what was on).
                    - conditions: "{{ _auto_arm_patch == '' }}"
                      sequence:
                        - variables:
                            _hh_cab: "{{ states('sensor.zen_default_household_cabinet_resolved') }}"
                            _hh_vars: >-
                              {{ state_attr(_hh_cab, 'variables') | default({}, true) }}
                            _sm_drawer: "{{ _hh_vars.get('security_manager', {}) }}"
                        - variables:
                            _sm_val: >-
                              {%- set d = _sm_drawer -%}
                              {{ d.get('value', d) if d is mapping else {} }}
                        - variables:
                            result:
                              status: ok
                              action: auto_arm_config
                              read_only: true
                              config: "{{ _sm_val.get('_auto_arm_config', {}) }}"
                              sentry_state: "{{ states.automation | selectattr('attributes.id', 'eq', 'zen_security_sentry') | map(attribute='state') | list | first | default('missing', true) }}"
                              vacuum:
                                state: "{{ _vc_state }}"
                                entity: "{{ _vc_ent }}"
                                applies: "{{ _vc_state == 'ready' }}"
                                detail: >-
                                  {%- if _vc_state == 'ready' -%}A vacuum is installed and Autovac is on, so the vacuum settings apply.
                                  {%- elif _vc_state == 'no_vacuum' -%}No vacuum is labeled to Autovac (label autovac), so the vacuum settings do not apply and cannot be turned on.
                                  {%- elif _vc_state == 'autovac_missing' -%}The Autovac tool is not installed, so the vacuum settings do not apply and cannot be turned on.
                                  {%- elif _vc_state == 'autovac_disabled' -%}Autovac is switched off (zen_dojotools_autovac mode=configure config={"enabled":true} turns it on), so the vacuum settings are inactive and cannot be turned on.
                                  {%- else -%}The vacuum is unavailable right now. The settings stay as they are and apply again when it returns.
                                  {%- endif -%}
                              vacuum_settings:
                                vac_arm_override_enabled:
                                  value: "{{ _sm_val.get('_auto_arm_config', {}).get('vac_arm_override_enabled', false) | bool(false) }}"
                                  active: "{{ (_sm_val.get('_auto_arm_config', {}).get('vac_arm_override_enabled', false) | bool(false)) and _vc_state in ['ready', 'vacuum_unavailable'] and _sp_ok }}"
                                  means: "While the vacuum cleans with the panel armed Away, move the panel to Home for the run and put Away back when the vacuum is docked (Cancel in the notice stops the run)."
                                vac_downgrade_dock_wait_min:
                                  value: "{{ _sm_val.get('_auto_arm_config', {}).get('vac_downgrade_dock_wait_min', 5) | int(5) }}"
                                  means: "Minutes to wait after the dock before putting Away back (a mop wash docks mid-run; one minute after a cancelled run)."
                              notice_settings:
                                notify_occupied_while_away:
                                  value: "{{ _sm_val.get('_auto_arm_config', {}).get('notify_occupied_while_away', false) | bool(false) }}"
                                  means: "While the panel is armed Away, send one notice (and a ledger line) when a room reads occupied, engaged or asleep for two minutes. Default off: a pet or a visitor can set it off. The panel is never changed."
                              lighting_settings:
                                dusk_lights_enabled:
                                  value: "{{ _sm_val.get('_auto_arm_config', {}).get('dusk_lights_enabled', false) | bool(false) }}"
                                  means: "Turn every light or switch labeled dusk_to_dawn on at civil dusk and off at civil dawn. Default off. Nothing happens while nothing carries the label."
                                dusk_offset_min:
                                  value: "{{ _sm_val.get('_auto_arm_config', {}).get('dusk_offset_min', 0) | int(0) }}"
                                  means: "Minutes after civil dusk to turn the lights on; negative is before dusk. Default 0."
                                dawn_offset_min:
                                  value: "{{ _sm_val.get('_auto_arm_config', {}).get('dawn_offset_min', 0) | int(0) }}"
                                  means: "Minutes after civil dawn to turn the lights off; negative is before dawn. Default 0."
                                labeled_entities: "{{ label_entities('dusk_to_dawn') | list }}"
                              arrival_settings:
                                arrival_lights_enabled:
                                  value: "{{ _sm_val.get('_auto_arm_config', {}).get('arrival_lights_enabled', false) | bool(false) }}"
                                  means: "When a resident's phone (a device_tracker labeled arrival_tracker) enters zone.home after dark, turn on the lights labeled landing_lights that are off, and turn just those off again after arrival_lights_minutes. Default off. Never touches the alarm panel."
                                arrival_lights_minutes:
                                  value: "{{ _sm_val.get('_auto_arm_config', {}).get('arrival_lights_minutes', 10) | int(10) }}"
                                  means: "Minutes the landing lights stay on (1 to 60, default 10)."
                                arrival_lights_dark_elevation:
                                  value: "{{ _sm_val.get('_auto_arm_config', {}).get('arrival_lights_dark_elevation', -6) | float(-6) }}"
                                  means: "How dark it must be: the sun's elevation in degrees at or below which an arrival counts as after dark. Default -6 (civil dusk). A higher number, such as -3 or 0, brings the lights on earlier."
                                arrival_lights_residents:
                                  value: "{{ _sm_val.get('_auto_arm_config', {}).get('arrival_lights_residents', []) }}"
                                  means: "Optional list of person entities or names that trigger it. Empty means every resident: the human users on the household cabinet or in a family that belongs to it, with a person entity."
                                landing_lights: "{{ label_entities('landing_lights') | list }}"
                                trackers: "{{ label_entities('arrival_tracker') | list }}"
                              cover_settings:
                                cover_watch_enabled:
                                  value: "{{ _sm_val.get('_auto_arm_config', {}).get('cover_watch_enabled', false) | bool(false) }}"
                                  means: "Watch the exterior covers (labeled secure_on_arm, or labeled exterior with device class garage, gate or door) and act when one is left open cover_left_open_minutes. Default off."
                                cover_left_open_minutes:
                                  value: "{{ _sm_val.get('_auto_arm_config', {}).get('cover_left_open_minutes', 15) | int(15) }}"
                                  means: "Minutes a watched cover may stay open before the house acts. Default 15. A change applies from the next time a cover opens."
                                cover_day_policy:
                                  value: "{{ _sm_val.get('_auto_arm_config', {}).get('cover_day_policy', 'ask') }}"
                                  means: "What happens while the house is awake: ask (announce and ask on the phone, close only on a Yes; default), ask_then_close (close unless someone says No within five minutes; the door's own obstruction sensing is its job), close (close and say so), notify (only say so)."
                                cover_night_close_enabled:
                                  value: "{{ _sm_val.get('_auto_arm_config', {}).get('cover_night_close_enabled', false) | bool(false) }}"
                                  means: "Close watched covers quietly when the home mode turns Night, or when one is left open while the house sleeps; a note goes out when the house wakes. Default off."
                                cover_wind_close_enabled:
                                  value: "{{ _sm_val.get('_auto_arm_config', {}).get('cover_wind_close_enabled', false) | bool(false) }}"
                                  means: "Act when damaging wind lasts five minutes with a watched cover open. Default off."
                                cover_wind_policy:
                                  value: "{{ _sm_val.get('_auto_arm_config', {}).get('cover_wind_policy', 'ask_then_close') }}"
                                  means: "ask, ask_then_close (default: wind is damage prevention), close or notify. While the house sleeps, ask_then_close and close close quietly; ask does nothing."
                                cover_wind_threshold:
                                  value: "{{ _sm_val.get('_auto_arm_config', {}).get('cover_wind_threshold', none) }}"
                                  means: "For a wind_speed sensor labeled cover_wind: the speed, in that sensor's unit, that counts as damaging (default 50 for mph, 80 otherwise)."
                                wind_source: >-
                                  {%- set wb = label_entities('cover_wind') | select('match', 'binary_sensor\\.') | list -%}
                                  {%- set ws = label_entities('cover_wind') | select('match', 'sensor\\.') | list -%}
                                  {{ ('binary sensor ' ~ wb[0]) if wb | count > 0 else (('wind speed sensor ' ~ ws[0]) if ws | count > 0 else 'the weather entity (damaging gust or wind speed for its unit)') }}
                                watched_covers: >-
                                  {%- set sa = label_entities('secure_on_arm') -%}
                                  {%- set ns = namespace(o=[]) -%}
                                  {%- for s in expand(sa + label_entities('exterior')) if s.domain == 'cover' and (s.entity_id in sa or s.attributes.get('device_class') in ['garage', 'gate', 'door']) and s.entity_id not in ns.o -%}{%- set ns.o = ns.o + [s.entity_id] -%}{%- endfor -%}
                                  {{ ns.o }}
                              appliance_settings:
                                appliance_sentry_enabled:
                                  value: "{{ _sm_val.get('_auto_arm_config', {}).get('appliance_sentry_enabled', false) | bool(false) }}"
                                  means: "Tell the household when an appliance labeled both appliance and appliance_sentry has been on appliance_sentry_minutes with nobody home (zone.home at 0, the same rule auto-arm uses). Inform only: the house does not switch it off. Default off."
                                appliance_sentry_minutes:
                                  value: "{{ _sm_val.get('_auto_arm_config', {}).get('appliance_sentry_minutes', 10) | int(10) }}"
                                  means: "Minutes an appliance may stay on with nobody home before the household is told. Default 10."
                                watched_appliances: "{{ label_entities('appliance') | select('in', label_entities('appliance_sentry')) | list }}"
                              note: "Settings not listed are at their default, which is off. Pass auto_arm_patch (JSON) to change them; that needs the zenos.actuation.security_control cert. vac_arm_override_enabled also needs the Zen Security Sentry running (sentry_state on), which needs Spook."
                  default:
                    - action: script.zen_dojotools_identity
                      response_variable: _aac_id_raw
                      continue_on_error: true
                      data:
                        mode: resolve_caller_identity
                        required_cert: zenos.actuation.security_control
                        required_cert_level: 1
                        caller_token: "{{ _token }}"
                    - variables:
                        _aac_id_fields: >-
                          {%- import 'zenos_ai/zen_os_1.jinja' as OS -%}
                          {%- set _raw = OS.resolve_identity_fields(_aac_id_raw) -%}
                          {{- (_raw | from_json) if _raw is string else _raw -}}
                        _aac_policy_status: "{{ _aac_id_fields.policy_status }}"
                        _aac_authorized: "{{ _aac_id_fields.authorized }}"
                        _aac_cert_level: "{{ _aac_id_fields.cert_level }}"
                    - choose:
                        - conditions: "{{ _aac_policy_status != 'allowed' or not _aac_authorized }}"
                          sequence:
                            - variables:
                                result:
                                  status: error
                                  error: "{{ 'identity_policy_blocked' if _aac_policy_status != 'allowed' else 'cert_insufficient' }}"
                                  detail: >-
                                    {%- if _aac_policy_status != 'allowed' -%}
                                      resolve_caller_identity did not return an allowed identity -- action denied.
                                    {%- else -%}
                                      zenos.actuation.security_control cert level {{ _aac_cert_level }} is below the required minimum (1). Certify the default agent via persona_editor to enable auto-arm config changes.
                                    {%- endif -%}
                        # The vacuum setting cannot be turned on without a vacuum: none
                        # labeled to Autovac, no Autovac tool, or Autovac switched off.
                        # (A vacuum that is only unavailable right now is allowed.)
                        # Turning it off is always allowed.
                        - conditions: "{{ _vc_state in ['no_vacuum', 'autovac_missing', 'autovac_disabled'] and (((_auto_arm_patch if _auto_arm_patch is mapping else (_auto_arm_patch | from_json({})))).get('vac_arm_override_enabled', false) | bool(false)) }}"
                          sequence:
                            - variables:
                                result:
                                  status: error
                                  action: auto_arm_config
                                  error: vacuum_required
                                  vacuum_state: "{{ _vc_state }}"
                                  detail: >-
                                    {%- if _vc_state == 'no_vacuum' -%}vac_arm_override_enabled is about the robot vacuum, and no vacuum is labeled to Autovac (label autovac), so nothing was changed.
                                    {%- elif _vc_state == 'autovac_missing' -%}vac_arm_override_enabled is about the robot vacuum, and the Autovac tool is not installed, so nothing was changed.
                                    {%- else -%}vac_arm_override_enabled is about the robot vacuum, and Autovac is switched off, so nothing was changed. Turn Autovac on first (zen_dojotools_autovac mode=configure config={"enabled":true}).
                                    {%- endif -%}
                        # A behavior that makes temporary overrides cannot be turned on
                        # without Spook: the Zen Security Sentry ends overrides and only
                        # runs when Spook's trigger platforms work (see _sp_ok above).
                        # Turning one off is always allowed.
                        - conditions: "{{ not _sp_ok and (((_auto_arm_patch if _auto_arm_patch is mapping else (_auto_arm_patch | from_json({})))).get('vac_arm_override_enabled', false) | bool(false)) }}"
                          sequence:
                            - variables:
                                result:
                                  status: error
                                  action: auto_arm_config
                                  error: spook_required
                                  detail: "vac_arm_override_enabled makes temporary overrides, and an override needs the Zen Security Sentry to end it. The Sentry needs Spook's trigger platforms and is not running (the Zen Security Sentry automation is not on, or is missing), so nothing was changed. Install or update Spook first. Turning the setting off is always allowed."
                      default:
                        - variables:
                            _hh_cab: "{{ states('sensor.zen_default_household_cabinet_resolved') }}"
                            _hh_vars: >-
                              {{ state_attr(_hh_cab, 'variables') | default({}, true) }}
                            _sm_drawer: "{{ _hh_vars.get('security_manager', {}) }}"
                        - variables:
                            _sm_val: >-
                              {%- set d = _sm_drawer -%}
                              {{ d.get('value', d) if d is mapping else {} }}
                            _current_aa_cfg: "{{ _sm_val.get('_auto_arm_config', {}) }}"
                            _aac_patch: "{{ _auto_arm_patch if _auto_arm_patch is mapping else (_auto_arm_patch | from_json({})) }}"
                        - variables:
                            _new_aa_cfg: "{{ _current_aa_cfg | combine(_aac_patch, recursive=true) }}"
                            _new_sm_val: "{{ _sm_val | combine({'_auto_arm_config': _new_aa_cfg}) }}"
                        - action: script.zen_sutra_filecabinet
                          data:
                            mode: update
                            write_mode: replace
                            force_action: true
                            volume_entity_id: ["{{ _hh_cab }}"]
                            key: security_manager
                            value: "{{ _new_sm_val | tojson }}"
                            caller_token: "{{ _token }}/security_manager_auto_arm_config"
                          response_variable: _aac_fc_result
                        - variables:
                            result:
                              status: ok
                              action: auto_arm_config
                              config: "{{ _new_aa_cfg }}"

            # ── AUTO_ARM_CHECK — fired by the companion automation below on
            # zone.home changes / vacuum start / vacuum dock. Ungated (system-
            # invoked, not a human action) -- auto_arm_enabled itself is the
            # human-authorized gate, set via the cert-gated auto_arm_config
            # action above. Derives occupancy purely from zone.home's own person
            # count (no bespoke per-person AND/OR/XOR logic). Both master gates
            # (auto_arm_enabled, vac_arm_override_enabled) default OFF. ──
            - conditions: "{{ _action == 'auto_arm_check' }}"
              sequence:
                - variables:
                    _hh_cab: "{{ states('sensor.zen_default_household_cabinet_resolved') }}"
                    _hh_vars: >-
                      {{ state_attr(_hh_cab, 'variables') | default({}, true) }}
                    _sm_drawer: "{{ _hh_vars.get('security_manager', {}) }}"
                - variables:
                    _sm_val: >-
                      {%- set d = _sm_drawer -%}
                      {{ d.get('value', d) if d is mapping else {} }}
                    _aa_cfg: "{{ _sm_val.get('_auto_arm_config', {}) }}"
                    _aa_enabled: "{{ _aa_cfg.get('auto_arm_enabled', false) | bool(false) }}"
                    _aa_vac_override: "{{ _aa_cfg.get('vac_arm_override_enabled', false) | bool(false) }}"
                    _aa_trigger: "{{ _auto_arm_trigger | default('occupancy', true) | lower | trim }}"
                    _aa_user: "{{ (context.user_id if context is defined else '') or '' }}"
                - choose:
                    # Internal only: the auto-arm automations call this with no
                    # user in their context. A user or agent session (MCP,
                    # conversation) could otherwise name any auto_arm_trigger,
                    # e.g. lock_unlocked, and disarm without the disarm checks.
                    - conditions: "{{ _aa_user != '' }}"
                      sequence:
                        - variables:
                            result:
                              status: error
                              action: auto_arm_check
                              reason: "guarded: auto_arm_check is internal; only the auto-arm automations call it. Use mode=arm or mode=disarm."
                    # A room reads occupied while the panel is armed Away: tell the
                    # person, only when notify_occupied_while_away is on (default off).
                    # It is a notice, not an arm or disarm, so it does not need
                    # auto_arm_enabled. The panel is never touched. A vacuum downgrade
                    # (any override) is not Away, and an override in force is skipped.
                    - conditions: "{{ _aa_trigger == 'room_occupied_away' }}"
                      sequence:
                        - variables:
                            _ro_on: "{{ _aa_cfg.get('notify_occupied_while_away', false) | bool(false) }}"
                            _ro_panel: >-
                              {%- set ns = namespace(found='') -%}
                              {%- for eid in label_entities('alarm_panel') -%}
                                {%- if ns.found == '' and eid.startswith('alarm_control_panel.') -%}{%- set ns.found = eid -%}{%- endif -%}
                              {%- endfor -%}
                              {{ ns.found }}
                            _ro_rooms: >-
                              {%- set ns = namespace(o=[]) -%}
                              {%- for e in expand(label_entities('zen_room_state')) if e.state in ['occupied', 'engaged', 'asleep'] -%}
                                {%- set ns.o = ns.o + [(area_name(e.entity_id) or e.name) ~ ' (' ~ e.state ~ ')'] -%}
                              {%- endfor -%}
                              {{ ns.o }}
                            _ro_override: "{{ (_sm_val.get('_overrides', {}) | count) > 0 }}"
                        - variables:
                            _ro_go: "{{ _ro_on and _ro_panel != '' and states(_ro_panel) == 'armed_away' and (_ro_rooms | count) > 0 and not _ro_override }}"
                        - if: "{{ _ro_go }}"
                          then:
                            - action: script.zen_dojotools_security_manager
                              continue_on_error: true
                              data:
                                action: ledger_add
                                ledger_kind: occupied_while_away
                                ledger_source: room_state
                                ledger_summary: "The alarm is armed Away but a room reads occupied: {{ _ro_rooms | join(', ') }}. You were notified. The panel was left as it is."
                            - action: script.zen_dojotools_postman
                              continue_on_error: true
                              data:
                                mode: resolve_and_dispatch
                                title: "Someone may be home"
                                message: >-
                                  The alarm is armed Away, but a room reads occupied:
                                  {{ _ro_rooms | join(', ') }}. The alarm panel was not changed.
                                urgency: 7
                                channel_hint: push
                                response_type: ok
                                tag: "pm_occupied_while_away_{{ now().timestamp() | int }}"
                                ack_owner: security_manager
                        - variables:
                            result:
                              status: ok
                              action: auto_arm_check
                              result: "{{ 'notified' if _ro_go else ('option_off' if not _ro_on else 'not_applicable') }}"
                              rooms: "{{ _ro_rooms }}"
                    # Appliance sentry (#10703): inform only. A labeled appliance (appliance
                    # AND appliance_sentry) has been on appliance_sentry_minutes with nobody
                    # home. Notice, ledger line, and the agent's line until it is off or
                    # someone is home (appliance_away_clear).
                    - conditions: "{{ _aa_trigger in ['appliance_away', 'appliance_away_clear'] }}"
                      sequence:
                        - variables:
                            _ap_on_setting: "{{ _aa_cfg.get('appliance_sentry_enabled', false) | bool(false) }}"
                            _ap_running: >-
                              {%- set ns = namespace(o=[]) -%}
                              {%- for s in expand(label_entities('appliance')) if s.state == 'on' and s.entity_id in label_entities('appliance_sentry') -%}{%- set ns.o = ns.o + [s.entity_id] -%}{%- endfor -%}
                              {{ ns.o }}
                            _ap_empty: "{{ (states('zone.home') | int(-1)) == 0 }}"
                            _ap_minutes: "{{ [_aa_cfg.get('appliance_sentry_minutes', 10) | int(10), 1] | max }}"
                        - variables:
                            _ap_names: >-
                              {%- set n = expand(_ap_running) | map(attribute='name') | list -%}
                              {{ (n[:-1] | join(', ') ~ ' and ' ~ n[-1]) if n | count > 1 else (n | first | default('')) }}
                            _ap_go: "{{ _aa_trigger == 'appliance_away' and _ap_on_setting and _ap_empty and (_ap_running | count) > 0 }}"
                        - if: "{{ _ap_go }}"
                          then:
                            - action: script.zen_dojotools_security_manager
                              continue_on_error: true
                              data:
                                action: ledger_add
                                ledger_kind: appliance_away
                                ledger_source: appliance_sentry
                                ledger_summary: "{{ _ap_names }} {{ 'has' if (_ap_running | count) == 1 else 'have' }} been on for {{ _ap_minutes }} minute{{ '' if (_ap_minutes | int) == 1 else 's' }} with nobody home. The household was told."
                            - action: script.zen_dojotools_postman
                              continue_on_error: true
                              data:
                                mode: resolve_and_dispatch
                                title: "On with nobody home: {{ _ap_names }}"
                                message: "{{ _ap_names }} {{ 'has' if (_ap_running | count) == 1 else 'have' }} been on for {{ _ap_minutes }} minute{{ '' if (_ap_minutes | int) == 1 else 's' }} and nobody is home."
                                urgency: 7
                                channel_hint: push
                                caller_token: security_manager_appliance_sentry
                            - event: zen_event
                              event_data:
                                event:
                                  kind: priority_inject_write
                                  provider_id: security_appliance_away
                                  summary: "{{ _ap_names }} {{ 'has' if (_ap_running | count) == 1 else 'have' }} been on since at least {{ (now() - timedelta(minutes=_ap_minutes | int)).strftime('%H:%M') }} with nobody home. The household was told; the house cannot switch it off."
                                  urgency: urgent
                                  expires_minutes: 1440
                                  entities: "{{ _ap_running[:3] }}"
                                  display: prompt
                        - if: "{{ _aa_trigger == 'appliance_away_clear' }}"
                          then:
                            - event: zen_event
                              event_data:
                                event:
                                  kind: priority_inject_clear
                                  provider_id: security_appliance_away
                        - variables:
                            result:
                              status: ok
                              action: auto_arm_check
                              trigger: "{{ _aa_trigger }}"
                              result: "{{ 'told' if _ap_go else ('cleared' if _aa_trigger == 'appliance_away_clear' else ('option_off' if not _ap_on_setting else 'not_applicable')) }}"
                              appliances: "{{ _ap_running }}"
                    # Exterior covers (cover_watch_enabled, cover_night_close_enabled,
                    # cover_wind_close_enabled: all default off). Watched: every cover
                    # labeled secure_on_arm, and every cover labeled exterior with device
                    # class garage, gate or door. A plan per trigger: close, ask, tell or
                    # nothing. A question is sent through the dispatcher without waiting
                    # (this automation is queued) and its answer comes back as cover_ack.
                    # Quiet while the house sleeps (Postman's sleep rule): nothing is asked;
                    # a close made then is logged and told when the house wakes. A cover's
                    # own obstruction sensing is the door's job; cover_day_policy
                    # ask_then_close (close unless someone says no) is the household's call.
                    - conditions: "{{ _aa_trigger in ['cover_left_open', 'cover_closed', 'cover_night', 'cover_wake', 'cover_wind', 'cover_ack'] }}"
                      sequence:
                        - variables:
                            _cv_ids: >-
                              {%- set sa = label_entities('secure_on_arm') -%}
                              {%- set ns = namespace(o=[]) -%}
                              {%- for s in expand(sa + label_entities('exterior')) if s.domain == 'cover' and (s.entity_id in sa or s.attributes.get('device_class') in ['garage', 'gate', 'door']) and s.entity_id not in ns.o -%}{%- set ns.o = ns.o + [s.entity_id] -%}{%- endfor -%}
                              {{ ns.o }}
                            _cv_sleep: >-
                              {{ is_state(label_entities('zen_quiet_hours') | select('match', 'binary_sensor\\.') | list | first | default('none', true), 'on')
                                 or is_state(label_entities('zen_home_mode') | select('match', 'input_select\\.') | list | first | default('none', true), 'Night')
                                 or is_state(label_entities('zen_home_mode') | select('match', 'input_select\\.') | list | first | default('none', true), 'Night-Late') }}
                            _cv_watch: "{{ _aa_cfg.get('cover_watch_enabled', false) | bool(false) }}"
                            _cv_night_on: "{{ _aa_cfg.get('cover_night_close_enabled', false) | bool(false) }}"
                            _cv_wind_on: "{{ _aa_cfg.get('cover_wind_close_enabled', false) | bool(false) }}"
                            _cv_minutes: "{{ [_aa_cfg.get('cover_left_open_minutes', 15) | int(15), 1] | max }}"
                            _cv_day: "{{ _aa_cfg.get('cover_day_policy', 'ask') if _aa_cfg.get('cover_day_policy', 'ask') in ['ask', 'ask_then_close', 'close', 'notify'] else 'ask' }}"
                            _cv_wind_pol: "{{ _aa_cfg.get('cover_wind_policy', 'ask_then_close') if _aa_cfg.get('cover_wind_policy', 'ask_then_close') in ['ask', 'ask_then_close', 'close', 'notify'] else 'ask_then_close' }}"
                            _cv_ack: "{{ cover_ack if (cover_ack is defined and cover_ack is mapping) else {} }}"
                        - variables:
                            _cv_open: "{{ expand(_cv_ids) | selectattr('state', 'in', ['open', 'opening']) | map(attribute='entity_id') | list }}"
                            _cv_ctx: "{{ _cv_ack.get('ack_context', '') | string }}"
                        - variables:
                            _cv_names: >-
                              {%- set n = expand(_cv_open) | map(attribute='name') | list -%}
                              {{ (n[:-1] | join(', ') ~ ' and ' ~ n[-1]) if n | count > 1 else (n | first | default('')) }}
                            _cv_since: >-
                              {%- set t = expand(_cv_open) | map(attribute='last_changed') | list -%}
                              {{ (t | min | as_local).strftime('%H:%M') if t | count > 0 else '' }}
                            # What the trigger asks for: close, ask (a policy rides in the
                            # question's context), tell, or nothing.
                            _cv_plan: >-
                              {%- set m = {'ask': 'ask', 'ask_then_close': 'ask', 'close': 'close', 'notify': 'tell'} -%}
                              {%- set t = _aa_trigger -%}
                              {%- if t == 'cover_left_open' -%}
                                {%- if not _cv_watch or (_cv_open | count) == 0 -%}none
                                {%- elif _cv_sleep -%}{{ 'close' if _cv_night_on else 'none' }}
                                {%- else -%}{{ m.get(_cv_day, 'ask') }}{%- endif -%}
                              {%- elif t == 'cover_wind' -%}
                                {%- if not _cv_wind_on or (_cv_open | count) == 0 -%}none
                                {%- elif _cv_sleep -%}{{ 'close' if _cv_wind_pol in ['ask_then_close', 'close'] else 'none' }}
                                {%- else -%}{{ m.get(_cv_wind_pol, 'ask') }}{%- endif -%}
                              {%- elif t == 'cover_night' -%}{{ 'close' if (_cv_night_on and (_cv_open | count) > 0) else 'none' }}
                              {%- elif t == 'cover_ack' and _cv_ctx.startswith('cover_') and (_cv_open | count) > 0 -%}
                                {%- set a = _cv_ack.get('ack_action', '') | string | lower -%}
                                {{ 'close' if (a == 'yes' or (a == '' and (_cv_ack.get('ack_timed_out', false) | bool(false)) and not (_cv_ack.get('no_channel', false) | bool(false)) and _cv_ctx.endswith(':ask_then_close'))) else 'none' }}
                              {%- else -%}none{%- endif -%}
                            _cv_why: >-
                              {{ 'wind' if (_aa_trigger == 'cover_wind' or _cv_ctx.startswith('cover_wind')) else ('night' if (_aa_trigger == 'cover_night' or _cv_sleep) else 'left_open') }}
                            _cv_policy: "{{ _cv_wind_pol if (_aa_trigger == 'cover_wind') else _cv_day }}"
                        - variables:
                            _cv_say: >-
                              {%- if _cv_why == 'wind' -%}{{ _cv_names }} {{ 'is' if (_cv_open | count) == 1 else 'are' }} open in damaging wind
                              {%- else -%}{{ _cv_names }} {{ 'has' if (_cv_open | count) == 1 else 'have' }} been open since {{ _cv_since }}{%- endif -%}

                        # Close: the covers still open, then the ledger, the agent's line
                        # cleared, and a word to the house (saved for the morning while it sleeps).
                        - if: "{{ _cv_plan == 'close' }}"
                          then:
                            - action: cover.close_cover
                              continue_on_error: true
                              target:
                                entity_id: "{{ _cv_open }}"
                            - action: script.zen_dojotools_security_manager
                              continue_on_error: true
                              data:
                                action: ledger_add
                                ledger_kind: cover_closed
                                ledger_source: "{{ 'cover_' ~ _cv_why }}"
                                ledger_summary: >-
                                  Closed {{ _cv_names }} ({{ {'wind': 'damaging wind', 'night': 'the house went to sleep with it open', 'left_open': 'left open since ' ~ _cv_since}.get(_cv_why) }}{{ '; the household said yes' if _aa_trigger == 'cover_ack' and (_cv_ack.get('ack_action', '') | lower) == 'yes' else ('; nobody answered and the setting closes then' if _aa_trigger == 'cover_ack' else '') }}).
                            - event: zen_event
                              event_data:
                                event:
                                  kind: priority_inject_clear
                                  provider_id: security_cover_open
                            - if: "{{ _cv_sleep }}"
                              then:
                                - action: script.zen_sutra_filecabinet
                                  continue_on_error: true
                                  data:
                                    mode: update
                                    write_mode: replace
                                    force_action: true
                                    volume_entity_id: ["{{ _hh_cab }}"]
                                    key: security_manager
                                    value: >-
                                      {%- set prev = _sm_val.get('_cover_note', '') or '' -%}
                                      {{ _sm_val | combine({'_cover_note': ((prev ~ ' ') if prev != '' else '') ~ 'Overnight I closed ' ~ _cv_names ~ ' (' ~ ('damaging wind' if _cv_why == 'wind' else 'it was open when the house went to sleep') ~ ').'}) | tojson }}
                                    caller_token: "{{ _token }}/security_manager_cover_note"
                              else:
                                - action: script.zen_dojotools_announce
                                  continue_on_error: true
                                  data:
                                    message: "Closing {{ _cv_names }}{{ ' because of the wind' if _cv_why == 'wind' else '' }}."
                                    urgency: 4
                                    caller_token: security_manager_cover

                        # Ask: say it in the house and send the Yes/No through the
                        # dispatcher (no wait here). The answer comes back as cover_ack;
                        # the policy rides in ack_context.
                        - if: "{{ _cv_plan == 'ask' }}"
                          then:
                            - action: script.zen_dojotools_announce
                              continue_on_error: true
                              data:
                                message: "{{ _cv_say }}. I sent a question to your phone about closing {{ 'it' if (_cv_open | count) == 1 else 'them' }}."
                                urgency: 5
                                caller_token: security_manager_cover
                            - event: zen_event
                              event_data:
                                event:
                                  kind: dojotool_call
                                  tool: zen_dojotools_postman
                                  version: "1"
                                  correlation_id: "{{ context.id }}_cover"
                                  payload:
                                    mode: resolve_and_dispatch
                                    title: "{{ 'Wind: close ' if _cv_why == 'wind' else 'Close ' }}{{ _cv_names }}?"
                                    message: >-
                                      {{ _cv_say }}. Close {{ 'it' if (_cv_open | count) == 1 else 'them' }}?{{ ' If nobody answers in five minutes I will close it.' if _cv_policy == 'ask_then_close' else '' }}
                                    urgency: 6
                                    channel_hint: push
                                    response_type: yes_no
                                    response_timeout_s: 300
                                    tag: "pm_cover_{{ (now().timestamp() // 60) | int }}"
                                    ack_owner: security_manager
                                    ack_context: "{{ 'cover_wind' if _cv_why == 'wind' else 'cover_left_open' }}:{{ _cv_policy }}"
                                    caller_token: security_manager_cover

                        # Tell: say it and send a plain notice.
                        - if: "{{ _cv_plan == 'tell' }}"
                          then:
                            - action: script.zen_dojotools_announce
                              continue_on_error: true
                              data:
                                message: "{{ _cv_say }}."
                                urgency: 5
                                caller_token: security_manager_cover
                            - action: script.zen_dojotools_postman
                              continue_on_error: true
                              data:
                                mode: resolve_and_dispatch
                                title: "Open: {{ _cv_names }}"
                                message: "{{ _cv_say }}."
                                urgency: 5
                                channel_hint: push
                                caller_token: security_manager_cover

                        # The agent's line while a watched cover stays open past its time
                        # (asked, told, said no, or nobody answered), cleared when every
                        # watched cover is closed.
                        - if: "{{ _cv_plan in ['ask', 'tell'] or (_aa_trigger == 'cover_ack' and _cv_plan == 'none' and (_cv_open | count) > 0 and _cv_ctx.startswith('cover_')) }}"
                          then:
                            - event: zen_event
                              event_data:
                                event:
                                  kind: priority_inject_write
                                  provider_id: security_cover_open
                                  summary: >-
                                    {{ _cv_say }}{{ ' (damaging wind)' if _cv_why == 'wind' and 'wind' not in _cv_say else '' }}. {{ {'ask': 'The household was asked whether to close it.', 'tell': 'The household was told.'}.get(_cv_plan, ('The household said to leave it open.' if (_cv_ack.get('ack_action', '') | lower) == 'no' else ('Nobody could be asked (no phone took the question); it was left open.' if (_cv_ack.get('no_channel', false) | bool(false)) else 'Nobody answered; it was left open.'))) }}
                                  urgency: urgent
                                  expires_minutes: 1440
                                  entities: "{{ _cv_open[:3] }}"
                                  display: prompt
                        - if: "{{ _aa_trigger == 'cover_closed' }}"
                          then:
                            - event: zen_event
                              event_data:
                                event:
                                  kind: priority_inject_clear
                                  provider_id: security_cover_open

                        # The house woke: send the note saved by a close made while it slept.
                        - if: "{{ _aa_trigger == 'cover_wake' and not _cv_sleep and (_sm_val.get('_cover_note', '') or '') != '' }}"
                          then:
                            - action: script.zen_dojotools_postman
                              continue_on_error: true
                              data:
                                mode: resolve_and_dispatch
                                title: "Closed overnight"
                                message: "{{ _sm_val.get('_cover_note') }}"
                                urgency: 3
                                channel_hint: push
                                caller_token: security_manager_cover_note
                            - action: script.zen_sutra_filecabinet
                              continue_on_error: true
                              data:
                                mode: update
                                write_mode: replace
                                force_action: true
                                volume_entity_id: ["{{ _hh_cab }}"]
                                key: security_manager
                                value: "{{ _sm_val | combine({'_cover_note': ''}) | tojson }}"
                                caller_token: "{{ _token }}/security_manager_cover_note"
                        - variables:
                            result:
                              status: ok
                              action: auto_arm_check
                              trigger: "{{ _aa_trigger }}"
                              result: >-
                                {{ {'close': 'closed', 'ask': 'asked', 'tell': 'told'}.get(_cv_plan,
                                   ('note_sent' if (_aa_trigger == 'cover_wake' and (_sm_val.get('_cover_note', '') or '') != '' and not _cv_sleep)
                                    else ('cleared' if _aa_trigger == 'cover_closed' else 'nothing'))) }}
                              covers: "{{ _cv_open }}"
                              reason: "{{ _cv_why }}"
                    # Security lighting at dusk and dawn (dusk_lights_enabled, default off):
                    # every light or switch labeled dusk_to_dawn. The panel is never touched
                    # and auto_arm_enabled does not apply. dusk_lights_on and dusk_lights_off
                    # are the template-trigger edges; dusk_lights_resolve runs at a Home
                    # Assistant start and sets the lights from the time of day.
                    - conditions: "{{ _aa_trigger in ['dusk_lights_on', 'dusk_lights_off', 'dusk_lights_resolve'] }}"
                      sequence:
                        - variables:
                            _dl_on: "{{ _aa_cfg.get('dusk_lights_enabled', false) | bool(false) }}"
                            _dl_doff: "{{ (_aa_cfg.get('dusk_offset_min', 0) | int(0)) * 60 }}"
                            _dl_woff: "{{ (_aa_cfg.get('dawn_offset_min', 0) | int(0)) * 60 }}"
                            _dl_ents: "{{ label_entities('dusk_to_dawn') | list }}"
                            _dl_D: "{{ as_timestamp(state_attr('sun.sun', 'next_dusk'), 0) }}"
                            _dl_W: "{{ as_timestamp(state_attr('sun.sun', 'next_dawn'), 0) }}"
                        - variables:
                            _dl_night: "{{ _dl_W < _dl_D }}"
                        - variables:
                            _dl_lit: >-
                              {{ _dl_D > 0 and _dl_W > 0 and ((now().timestamp() >= _dl_D - 86400 + _dl_doff and now().timestamp() < (_dl_W if _dl_night else _dl_W - 86400) + _dl_woff) or (now().timestamp() >= _dl_D + _dl_doff and now().timestamp() < (_dl_W + 86400 if _dl_night else _dl_W) + _dl_woff)) }}
                            _dl_want: >-
                              {{ true if _aa_trigger == 'dusk_lights_on' else (false if _aa_trigger == 'dusk_lights_off' else _dl_lit) }}
                            _dl_go: "{{ _dl_on and (_dl_ents | count) > 0 and _dl_D > 0 and _dl_W > 0 }}"
                        - if: "{{ _dl_go and _dl_want }}"
                          then:
                            - action: homeassistant.turn_on
                              target:
                                label_id: dusk_to_dawn
                        - if: "{{ _dl_go and not _dl_want }}"
                          then:
                            - action: homeassistant.turn_off
                              target:
                                label_id: dusk_to_dawn
                        - if: "{{ _dl_go }}"
                          then:
                            - action: script.zen_dojotools_security_manager
                              continue_on_error: true
                              data:
                                action: ledger_add
                                ledger_kind: security_lights
                                ledger_source: dusk_lights
                                ledger_summary: "Security lights turned {{ 'on' if _dl_want else 'off' }} ({{ 'dusk' if _aa_trigger == 'dusk_lights_on' else ('dawn' if _aa_trigger == 'dusk_lights_off' else 'a restart, from the time of day') }}): {{ _dl_ents | count }} labeled {{ 'light' if (_dl_ents | count) == 1 else 'lights' }}."
                        - variables:
                            result:
                              status: ok
                              action: auto_arm_check
                              result: "{{ ('lights_on' if _dl_want else 'lights_off') if _dl_go else ('option_off' if not _dl_on else 'nothing_labeled') }}"
                              lights: "{{ _dl_ents | count }}"
                    # Arrival lights (arrival_lights_enabled, default off). arrival_home: a
                    # resident's tracker (label arrival_tracker) entered zone.home. A
                    # resident is a human user on the household cabinet or in a family that
                    # is a member of it (two levels, as identity membership walks them)
                    # whose cabinet names a person entity. When it is dark, turn on the
                    # landing_lights that are off, remember exactly those, and turn just
                    # those off again after arrival_lights_minutes. The off path
                    # (arrival_lights_off, and arrival_lights_resolve at a start) acts on
                    # any record that has run out, whatever the setting. The panel is never
                    # touched; presence never disarms.
                    - conditions: "{{ _aa_trigger in ['arrival_home', 'arrival_lights_off', 'arrival_lights_resolve'] }}"
                      sequence:
                        - variables:
                            _ar_hh: "{{ states('sensor.zen_default_household_cabinet_resolved') }}"
                            _ar_on: "{{ _aa_cfg.get('arrival_lights_enabled', false) | bool(false) }}"
                            _ar_min: "{{ [[(_aa_cfg.get('arrival_lights_minutes', 10) | int(10)), 1] | max, 60] | min }}"
                            _ar_ents: "{{ label_entities('landing_lights') | list }}"
                            _ar_now: "{{ now().timestamp() }}"
                        - action: script.zen_sutra_filecabinet
                          continue_on_error: true
                          data:
                            mode: get
                            volume_entity_id: "{{ _ar_hh }}"
                            key: _security_arrival
                            force_action: true
                            caller_token: "{{ _token }}/security_manager_arrival"
                          response_variable: _ar_read
                        - variables:
                            _ar_rec: >-
                              {%- set r = _ar_read.get('value') if _ar_read is mapping else none -%}
                              {%- set r = (r | from_json({})) if r is string else (r if r is mapping else {}) -%}
                              {%- set v = r.get('value', r) if r is mapping else {} -%}
                              {%- set v = (v | from_json({})) if v is string else v -%}
                              {{ v if v is mapping else {} }}
                        - choose:
                            # ---- the lights' time is up ----
                            - conditions: "{{ _aa_trigger in ['arrival_lights_off', 'arrival_lights_resolve'] }}"
                              sequence:
                                - variables:
                                    _ar_until: "{{ _ar_rec.get('until_ts', 0) | float(0) }}"
                                    _ar_held: "{{ _ar_rec.get('entities', []) if _ar_rec.get('entities') is sequence and _ar_rec.get('entities') is not string else [] }}"
                                - variables:
                                    _ar_due: "{{ _ar_until > 0 and _ar_now >= _ar_until }}"
                                    _ar_to_off: "{{ _ar_held | select('is_state', 'on') | list }}"
                                - if: "{{ _ar_due }}"
                                  then:
                                    - if: "{{ _ar_to_off | count > 0 }}"
                                      then:
                                        - action: homeassistant.turn_off
                                          target:
                                            entity_id: "{{ _ar_to_off }}"
                                    - action: script.zen_sutra_filecabinet
                                      data:
                                        mode: update
                                        write_mode: replace
                                        force_action: true
                                        volume_entity_id: ["{{ _ar_hh }}"]
                                        key: _security_arrival
                                        value: "{{ {'until_ts': 0, 'entities': []} | tojson }}"
                                        no_autoexpire: true
                                        caller_token: "{{ _token }}/security_manager_arrival"
                                    - action: script.zen_dojotools_security_manager
                                      continue_on_error: true
                                      data:
                                        action: ledger_add
                                        ledger_kind: arrival_lights
                                        ledger_source: arrival
                                        ledger_summary: "The landing lights that came on for an arrival were turned off ({{ _ar_to_off | count }} of {{ _ar_held | count }} were still on)."
                                - variables:
                                    result:
                                      status: ok
                                      action: auto_arm_check
                                      result: "{{ 'lights_off' if _ar_due else 'not_due' }}"
                                      turned_off: "{{ _ar_to_off | count if _ar_due else 0 }}"
                          default:
                            # ---- a tracker entered zone.home ----
                            - action: script.zen_dojotools_identity
                              continue_on_error: true
                              data:
                                mode: membership
                              response_variable: _ar_mem_raw
                            - variables:
                                _ar_person: >-
                                  {%- set e = _auto_arm_entity -%}
                                  {%- if e.startswith('person.') -%}{{ e }}
                                  {%- else -%}
                                    {%- set ns = namespace(p='') -%}
                                    {%- for p in states.person -%}
                                      {%- if ns.p == '' and e != '' and e in (p.attributes.get('device_trackers', []) or []) -%}{%- set ns.p = p.entity_id -%}{%- endif -%}
                                    {%- endfor -%}
                                    {{ ns.p }}
                                  {%- endif -%}
                                _ar_residents: >-
                                  {%- set r = _ar_mem_raw.get('result', _ar_mem_raw) if _ar_mem_raw is mapping else {} -%}
                                  {%- set t = r.get('tree', {}) if r is mapping else {} -%}
                                  {%- set t = (t | from_json({})) if t is string else t -%}
                                  {%- set m = t.get('members', {}) if t is mapping else {} -%}
                                  {%- set ns = namespace(p=[]) -%}
                                  {%- for u in (m.get('users', []) if m is mapping else []) if u is mapping and u.get('person_entity_id') -%}
                                    {%- set ns.p = ns.p + [u.get('person_entity_id')] -%}
                                  {%- endfor -%}
                                  {%- for f in (m.get('families', []) if m is mapping else []) if f is mapping -%}
                                    {%- for u in (f.get('members', {}).get('users', []) if f.get('members') is mapping else []) if u is mapping and u.get('person_entity_id') -%}
                                      {%- set ns.p = ns.p + [u.get('person_entity_id')] -%}
                                    {%- endfor -%}
                                  {%- endfor -%}
                                  {{ ns.p | unique | list }}
                                _ar_filter: >-
                                  {%- set f = _aa_cfg.get('arrival_lights_residents', []) -%}
                                  {%- set f = (f | from_json([])) if f is string else f -%}
                                  {{ (f if f is sequence and f is not string else []) | map('lower') | list }}
                            - variables:
                                _ar_name: "{{ state_attr(_ar_person, 'friendly_name') or _ar_person }}"
                                _ar_is_res: "{{ _ar_person != '' and _ar_person in _ar_residents }}"
                                _ar_in_filter: "{{ (_ar_filter | count) == 0 or _ar_person | lower in _ar_filter or _ar_person[7:] | lower in _ar_filter or (state_attr(_ar_person, 'friendly_name') | string | lower) in _ar_filter }}"
                                _ar_dark: "{{ (state_attr('sun.sun', 'elevation') | float(90)) <= (_aa_cfg.get('arrival_lights_dark_elevation', -6) | float(-6)) }}"
                            - variables:
                                _ar_off_ents: "{{ _ar_ents | select('is_state', 'off') | list }}"
                                _ar_go: "{{ _ar_on and _ar_is_res and _ar_in_filter and _ar_dark and (_ar_ents | count) > 0 }}"
                            # Acts when some landing light was off, or when a record is still
                            # running (a second arrival inside the window extends the time).
                            - variables:
                                _ar_active: "{{ (_ar_rec.get('until_ts', 0) | float(0)) > _ar_now }}"
                            - if: "{{ _ar_go and ((_ar_off_ents | count) > 0 or _ar_active) }}"
                              then:
                                - if: "{{ (_ar_off_ents | count) > 0 }}"
                                  then:
                                    - action: homeassistant.turn_on
                                      target:
                                        entity_id: "{{ _ar_off_ents }}"
                                - variables:
                                    _ar_held_prev: "{{ _ar_rec.get('entities', []) if _ar_rec.get('entities') is sequence and _ar_rec.get('entities') is not string else [] }}"
                                    _ar_until_new: "{{ _ar_now + (_ar_min | int(10)) * 60 }}"
                                - action: script.zen_sutra_filecabinet
                                  data:
                                    mode: update
                                    write_mode: replace
                                    force_action: true
                                    volume_entity_id: ["{{ _ar_hh }}"]
                                    key: _security_arrival
                                    value: "{{ {'until_ts': _ar_until_new, 'entities': (_ar_held_prev + _ar_off_ents) | unique | list, 'person': _ar_person, 'since_ts': _ar_now} | tojson }}"
                                    no_autoexpire: true
                                    caller_token: "{{ _token }}/security_manager_arrival"
                                - action: script.zen_dojotools_security_manager
                                  continue_on_error: true
                                  data:
                                    action: ledger_add
                                    ledger_kind: arrival_lights
                                    ledger_source: arrival
                                    ledger_summary: >-
                                      {%- if (_ar_off_ents | count) > 0 -%}
                                        {{ _ar_name }} arrived home after dark. The landing lights that were off came on ({{ _ar_off_ents | count }}) and go off about {{ _ar_until_new | timestamp_custom('%H:%M') }}. The panel was left as it is.
                                      {%- else -%}
                                        {{ _ar_name }} arrived home after dark while the landing lights were still on from an earlier arrival; they now stay on until about {{ _ar_until_new | timestamp_custom('%H:%M') }}. The panel was left as it is.
                                      {%- endif -%}
                            - variables:
                                result:
                                  status: ok
                                  action: auto_arm_check
                                  result: >-
                                    {%- if not _ar_on -%}option_off
                                    {%- elif _ar_person == '' -%}no_person
                                    {%- elif not _ar_is_res -%}not_a_resident
                                    {%- elif not _ar_in_filter -%}not_named
                                    {%- elif not _ar_dark -%}not_dark
                                    {%- elif (_ar_ents | count) == 0 -%}nothing_labeled
                                    {%- elif (_ar_off_ents | count) == 0 and not _ar_active -%}already_on
                                    {%- elif (_ar_off_ents | count) == 0 -%}lights_extended
                                    {%- else -%}lights_on
                                    {%- endif -%}
                                  person: "{{ _ar_person }}"
                                  entity: "{{ _auto_arm_entity }}"
                    - conditions: "{{ not _aa_enabled }}"
                      sequence:
                        - variables:
                            result:
                              status: ok
                              action: auto_arm_check
                              result: disabled
                              note: "auto_arm_enabled is off — no-op. Enable via action=auto_arm_config once Node-RED's equivalent flows are decommissioned."
                  default:
                    - variables:
                        _aa_panel_entity: >-
                          {%- set ns = namespace(found='') -%}
                          {%- for eid in label_entities('alarm_panel') -%}
                            {%- if ns.found == '' and eid.startswith('alarm_control_panel.') -%}
                              {%- set ns.found = eid -%}
                            {%- endif -%}
                          {%- endfor -%}
                          {{ ns.found }}
                        _aa_vac_ent: "{{ label_entities('autovac') | select('match', 'vacuum\\.') | list | first | default('') }}"
                        # zone.home that is unknown or unavailable reads -1, not 0:
                        # a count nobody can read is never "the house is empty"
                        # (arm) or "someone came home" (arrival). Every recheck
                        # below reads it the same way.
                        _aa_home_count: "{{ states('zone.home') | int(-1) }}"
                    - choose:
                        # -- vacuum docked (Autovac's autovac_docked event, which says
                        # whether the run was cancelled). Only an override this
                        # behavior began is ended here. Roborock ejects/washes the mop
                        # and re-docks mid-run before the real run continues, so an
                        # immediate revert would flip Away back on under a still-active
                        # session: wait (vac_downgrade_dock_wait_min, default 5; one
                        # minute when the run was cancelled, since it is not coming
                        # back), then recheck live state. Cleaning again, returning, or
                        # rooms still queued: do nothing and let the next dock event
                        # re-arm this same wait. The override's own ceiling and the
                        # Sentry's expiry revert (override_expired below) are the
                        # backstops if no further dock event ever comes. --
                        - conditions: "{{ _aa_trigger == 'vac_docked' }}"
                          sequence:
                            - variables:
                                _aa_ov_have: "{{ 'vacuum_sync' in _sm_val.get('_overrides', {}) }}"
                            - if: "{{ _aa_ov_have }}"
                              then:
                                - delay:
                                    minutes: "{{ 1 if _auto_arm_vac_cancelled else (_aa_cfg.get('vac_downgrade_dock_wait_min', 5) | int(5)) }}"
                                - action: script.zen_dojotools_autovac
                                  enabled: "{{ states('script.zen_dojotools_autovac') in ['on', 'off'] }}"
                                  continue_on_error: true
                                  data:
                                    mode: run_state
                                  response_variable: _aa_rs_raw
                                - variables:
                                    _aa_rs: "{{ _aa_rs_raw.get('result', {}) if _aa_rs_raw is defined and _aa_rs_raw is mapping else {} }}"
                                    _aa_vac_state_recheck: "{{ states(_aa_vac_ent) if _aa_vac_ent != '' else '' }}"
                                    _aa_home_recheck: "{{ states('zone.home') | int(-1) }}"
                                - variables:
                                    _aa_busy: >-
                                      {{ _aa_vac_state_recheck in ['cleaning', 'returning']
                                         or (_aa_rs.get('run_state', 'idle') if _aa_rs is mapping else 'idle') != 'idle' }}
                                - if: "{{ not _aa_busy }}"
                                  then:
                                    - action: script.zen_dojotools_security_manager
                                      continue_on_error: true
                                      data:
                                        action: override_end
                                        override_kind: vacuum_sync
                                    - variables:
                                        _aa_will_rearm: "{{ _aa_home_recheck == 0 and _aa_panel_entity != '' and states(_aa_panel_entity) == 'armed_home' }}"
                                    - if: "{{ _aa_will_rearm }}"
                                      then:
                                        - action: alarm_control_panel.alarm_arm_away
                                          target: { entity_id: "{{ _aa_panel_entity }}" }
                                        # FYI only: the person already had their say on
                                        # the downgrade notice.
                                        - action: script.zen_dojotools_postman
                                          data:
                                            mode: resolve_and_dispatch
                                            title: "Vacuum done — re-arming Away"
                                            message: >-
                                              The vacuum's {{ 'run was cancelled and it is back on the dock' if _auto_arm_vac_cancelled else 'cleaning run finished' }}.
                                              Re-arming Away now that the house is clear.
                                            response_type: ok
                                            tag: "pm_auto_arm_vac_rearmed_{{ now().timestamp() | int }}"
                                            ack_owner: security_manager
                                          continue_on_error: true
                            - variables:
                                result:
                                  status: ok
                                  action: auto_arm_check
                                  result: vac_docked_handled
                                  had_override: "{{ _aa_ov_have }}"
                                  busy: "{{ _aa_busy | default(false, true) }}"
                                  cancelled: "{{ _auto_arm_vac_cancelled }}"
                                  re_armed_away: "{{ _aa_will_rearm | default(false, true) }}"

                        # -- vacuum starts while already Armed Away: notify with a
                        # cancel option. Not cancelled (or no answer): downgrade to
                        # Home for the run and record a vacuum_sync override (the
                        # Sentry ends it by its ceiling if the dock event never
                        # comes). Cancel: the run is stopped through Autovac
                        # (mode=stop) and the downgrade is held until the vacuum is
                        # docked, because a vacuum still rolling home would set off
                        # the very motion alarm this handler exists to prevent.
                        # The run starting again while the override exists (a mop
                        # wash) only extends it. --
                        - conditions: "{{ _aa_trigger == 'vac_started' }}"
                          sequence:
                            - variables:
                                _aa_ov_have: "{{ 'vacuum_sync' in _sm_val.get('_overrides', {}) }}"
                            - choose:
                                - conditions: "{{ _aa_vac_override and _aa_ov_have }}"
                                  sequence:
                                    - action: script.zen_dojotools_security_manager
                                      continue_on_error: true
                                      data:
                                        action: override_set
                                        override_kind: vacuum_sync
                                        override_minutes: 120
                                        override_max_minutes: 180
                                - conditions: "{{ _aa_vac_override and _aa_panel_entity != '' and states(_aa_panel_entity) == 'armed_away' }}"
                                  sequence:
                                    - action: script.zen_dojotools_postman
                                      data:
                                        mode: resolve_and_dispatch
                                        title: "Vacuum starting — downgrading Away"
                                        message: >-
                                          The vacuum is starting a cleaning run while armed
                                          Away. Downgrading to Home for the run to avoid a
                                          false motion alarm. Cancel to stop the run; Away
                                          comes back once the vacuum is docked.
                                        response_type: ok_cancel
                                        response_timeout_s: 60
                                        tag: "pm_vac_downgrade_{{ now().timestamp() | int }}"
                                        ack_owner: security_manager
                                      response_variable: _aa_vac_notify
                                      continue_on_error: true
                                    - variables:
                                        _aa_vac_notify: "{{ _aa_vac_notify.get('result', _aa_vac_notify) if _aa_vac_notify is mapping else _aa_vac_notify }}"
                                    - variables:
                                        _aa_vac_cancel: "{{ _aa_vac_notify is mapping and _aa_vac_notify.get('ack_action', '') == 'cancel' }}"
                                    - action: script.zen_dojotools_security_manager
                                      continue_on_error: true
                                      data:
                                        action: override_set
                                        override_kind: vacuum_sync
                                        override_from: armed_away
                                        override_to: armed_home
                                        override_reason: "{{ 'the vacuum run was cancelled and it is going home' if _aa_vac_cancel else 'the vacuum is cleaning' }}"
                                        override_minutes: 120
                                        override_max_minutes: 180
                                        override_consent: "{{ 'asked_cancel_stop' if _aa_vac_cancel else 'standing' }}"
                                      response_variable: _aa_ov_raw
                                    - variables:
                                        _aa_ov_ok: "{{ (_aa_ov_raw.get('result', {}) if _aa_ov_raw is defined and _aa_ov_raw is mapping else {}).get('status', '') == 'ok' }}"
                                    # No override recorded (override_set refused, for
                                    # example no Sentry): do not downgrade, because
                                    # nothing would ever put Away back.
                                    - if: "{{ _aa_ov_ok }}"
                                      then:
                                        - action: alarm_control_panel.alarm_arm_home
                                          target: { entity_id: "{{ _aa_panel_entity }}" }
                                    - if: "{{ _aa_vac_cancel }}"
                                      then:
                                        - action: script.zen_dojotools_autovac
                                          enabled: "{{ states('script.zen_dojotools_autovac') in ['on', 'off'] }}"
                                          continue_on_error: true
                                          data:
                                            mode: stop
                                          response_variable: _aa_stop_raw
                                        - variables:
                                            _aa_stop: "{{ _aa_stop_raw.get('result', {}) if _aa_stop_raw is defined and _aa_stop_raw is mapping else {} }}"
                                        # Autovac refused or is absent: the vacuum still
                                        # has to go home, so send it directly.
                                        - if: "{{ (_aa_stop.get('result', '') if _aa_stop is mapping else '') not in ['ok', 'nothing_to_stop'] and _aa_vac_ent != '' }}"
                                          then:
                                            - action: vacuum.return_to_base
                                              target: { entity_id: "{{ _aa_vac_ent }}" }
                                              continue_on_error: true
                            - variables:
                                result:
                                  status: ok
                                  action: auto_arm_check
                                  result: vac_started_handled
                                  extended: "{{ _aa_vac_override and _aa_ov_have }}"
                                  downgraded: "{{ _aa_ov_ok | default(false, true) }}"
                                  cancelled: "{{ _aa_vac_cancel | default(false, true) }}"
                                  stop_result: "{{ (_aa_stop.get('result', '') if _aa_stop is defined and _aa_stop is mapping else '') }}"

                        # -- reconcile (the Sentry calls this every minute while an
                        # override exists). The dock event can be missed: a reload or
                        # restart that kills the dock wait, or a dock during downtime.
                        # Without this the downgrade would last until the override's
                        # ceiling. If a vacuum_sync override exists, the vacuum has been
                        # docked for longer than the dock wait plus two minutes (so the
                        # normal dock path always gets there first) and Autovac is
                        # idle, treat it as a dock: end the override and put Away back
                        # if the house is empty and the panel is still at Home. A
                        # vacuum that is cleaning, returning, paused, in error or
                        # unavailable is never reconciled. --
                        - conditions: "{{ _aa_trigger == 'vac_reconcile' }}"
                          sequence:
                            - variables:
                                _aa_ov_have: "{{ 'vacuum_sync' in _sm_val.get('_overrides', {}) }}"
                                _aa_rc_docked_s: >-
                                  {{ (now() - states[_aa_vac_ent].last_changed).total_seconds()
                                     if _aa_vac_ent != '' and states(_aa_vac_ent) == 'docked' else -1 }}
                                _aa_rc_need_s: "{{ ((_aa_cfg.get('vac_downgrade_dock_wait_min', 5) | int(5)) + 2) * 60 }}"
                            - if: "{{ _aa_ov_have and (_aa_rc_docked_s | float(-1)) >= (_aa_rc_need_s | float(0)) }}"
                              then:
                                - action: script.zen_dojotools_autovac
                                  enabled: "{{ states('script.zen_dojotools_autovac') in ['on', 'off'] }}"
                                  continue_on_error: true
                                  data:
                                    mode: run_state
                                  response_variable: _aa_rc_rs_raw
                                - variables:
                                    _aa_rc_rs: "{{ _aa_rc_rs_raw.get('result', {}) if _aa_rc_rs_raw is defined and _aa_rc_rs_raw is mapping else {} }}"
                                    _aa_rc_idle: "{{ (_aa_rc_rs.get('run_state', 'idle') if _aa_rc_rs is mapping else 'idle') == 'idle' }}"
                                - if: "{{ _aa_rc_idle }}"
                                  then:
                                    - action: script.zen_dojotools_security_manager
                                      continue_on_error: true
                                      data:
                                        action: override_end
                                        override_kind: vacuum_sync
                                    - variables:
                                        _aa_rc_rearm: "{{ states('zone.home') | int(-1) == 0 and _aa_panel_entity != '' and states(_aa_panel_entity) == 'armed_home' }}"
                                    - if: "{{ _aa_rc_rearm }}"
                                      then:
                                        - action: alarm_control_panel.alarm_arm_away
                                          target: { entity_id: "{{ _aa_panel_entity }}" }
                                    - action: script.zen_dojotools_security_manager
                                      continue_on_error: true
                                      data:
                                        action: ledger_add
                                        ledger_kind: override_reconciled
                                        ledger_source: vacuum_sync
                                        ledger_summary: "The vacuum had been docked for {{ (_aa_rc_docked_s | float(0) / 60) | round(0) | int }} minutes and the dock was never reported (a reload or restart, most likely), so the vacuum override was ended{{ ' and security went back to away' if _aa_rc_rearm else '' }}."
                            - variables:
                                result:
                                  status: ok
                                  action: auto_arm_check
                                  result: vac_reconcile_handled
                                  had_override: "{{ _aa_ov_have }}"
                                  docked_seconds: "{{ _aa_rc_docked_s }}"
                                  reconciled: "{{ _aa_rc_idle | default(false, true) }}"

                        # -- the alarm went off (triggered) while a vacuum downgrade is
                        # in force: the vacuum must not keep roaming through an
                        # incident, and the override record must not hide it. Stop the
                        # run (Autovac mode=stop sends it home), end the override, say
                        # so in the ledger and tell the person. The panel itself is
                        # never touched: it is in alarm and stays there until a person
                        # disarms it. --
                        - conditions: "{{ _aa_trigger == 'alarm_triggered' }}"
                          sequence:
                            - variables:
                                _aa_ov_have: "{{ 'vacuum_sync' in _sm_val.get('_overrides', {}) }}"
                            - if: "{{ _aa_ov_have }}"
                              then:
                                - action: script.zen_dojotools_autovac
                                  enabled: "{{ states('script.zen_dojotools_autovac') in ['on', 'off'] }}"
                                  continue_on_error: true
                                  data:
                                    mode: stop
                                  response_variable: _aa_trig_stop_raw
                                - variables:
                                    _aa_trig_stop: "{{ _aa_trig_stop_raw.get('result', {}) if _aa_trig_stop_raw is defined and _aa_trig_stop_raw is mapping else {} }}"
                                - if: "{{ (_aa_trig_stop.get('result', '') if _aa_trig_stop is mapping else '') not in ['ok', 'nothing_to_stop'] and _aa_vac_ent != '' }}"
                                  then:
                                    - action: vacuum.return_to_base
                                      target: { entity_id: "{{ _aa_vac_ent }}" }
                                      continue_on_error: true
                                - action: script.zen_dojotools_security_manager
                                  continue_on_error: true
                                  data:
                                    action: override_end
                                    override_kind: vacuum_sync
                                - action: script.zen_dojotools_security_manager
                                  continue_on_error: true
                                  data:
                                    action: ledger_add
                                    ledger_kind: alarm_during_override
                                    ledger_source: vacuum_sync
                                    ledger_summary: "The alarm went off during a vacuum run. The vacuum was sent home and the vacuum override was ended. The panel was left as it is."
                                - action: script.zen_dojotools_postman
                                  continue_on_error: true
                                  data:
                                    mode: resolve_and_dispatch
                                    title: "Alarm while the vacuum was running"
                                    message: >-
                                      The alarm went off while the vacuum was running under a
                                      temporary Home setting. The vacuum was sent home and
                                      the temporary setting was ended. The alarm panel was
                                      not changed.
                                    response_type: ok
                                    tag: "pm_vac_alarm_triggered_{{ now().timestamp() | int }}"
                                    ack_owner: security_manager
                            - variables:
                                result:
                                  status: ok
                                  action: auto_arm_check
                                  result: alarm_triggered_handled
                                  had_override: "{{ _aa_ov_have }}"

                        # -- an override's time ran out (the Sentry's sweep already
                        # removed the record and wrote the ledger line; it never
                        # touches the panel). For the vacuum downgrade, put Away back
                        # if the panel is still at Home and the house is still empty.
                        # Anyone home, or a panel someone changed, is left alone. --
                        - conditions: "{{ _aa_trigger == 'override_expired' }}"
                          sequence:
                            - variables:
                                _aa_exp_will_rearm: "{{ _ov_kind == 'vacuum_sync' and _aa_panel_entity != '' and states(_aa_panel_entity) == 'armed_home' and states('zone.home') | int(-1) == 0 }}"
                            - if: "{{ _aa_exp_will_rearm }}"
                              then:
                                - action: alarm_control_panel.alarm_arm_away
                                  target: { entity_id: "{{ _aa_panel_entity }}" }
                                - action: script.zen_dojotools_security_manager
                                  continue_on_error: true
                                  data:
                                    action: ledger_add
                                    ledger_kind: override_reverted
                                    ledger_source: vacuum_sync
                                    ledger_summary: "The vacuum override timed out with the house still empty, so security went back to away."
                            - variables:
                                result:
                                  status: ok
                                  action: auto_arm_check
                                  result: override_expired_handled
                                  override_kind: "{{ _ov_kind }}"
                                  re_armed_away: "{{ _aa_exp_will_rearm }}"

                        # -- Night-Late: arm to Home (stay), only if currently disarmed --
                        # Auto-arm only, no auto-disarm (that's handled separately
                        # via a door unlock event). Own sub-flag
                        # (night_arm_enabled), default off, independent of the
                        # vac override flag -- gated the same off-by-default
                        # pattern as everything else in this action. Never
                        # touches an already-armed panel (Away/Night/Vacation
                        # left alone), only arms from a genuine disarmed state.
                        - conditions: "{{ _aa_trigger == 'night_late' }}"
                          sequence:
                            - variables:
                                _aa_night_entertaining_blocked: "{{ _aa_cfg.get('entertaining_blocks_night_arm', false) | bool(false) and states('input_boolean.zen_entertaining') == 'on' }}"
                            - variables:
                                _aa_night_will_arm: "{{ _aa_cfg.get('night_arm_enabled', false) | bool(false) and not _aa_night_entertaining_blocked and _aa_panel_entity != '' and states(_aa_panel_entity) == 'disarmed' }}"
                            - if: "{{ _aa_night_will_arm }}"
                              then:
                                - action: alarm_control_panel.alarm_arm_home
                                  target: { entity_id: "{{ _aa_panel_entity }}" }
                            - variables:
                                result:
                                  status: ok
                                  action: auto_arm_check
                                  result: night_late_handled
                                  armed: "{{ _aa_night_will_arm }}"
                                  entertaining_blocked: "{{ _aa_night_entertaining_blocked }}"

                        # -- Away home_mode: arm Away, only if currently disarmed --
                        # Distinct from the occupancy path below (which already
                        # arms Away off zone.home==0 after its own 5-min
                        # recheck) -- this fires off zen_home_mode itself
                        # entering Away, a real if rarer path (mode set
                        # directly/by schedule without zone.home necessarily
                        # having settled to 0 yet). Own sub-flag
                        # (mode_away_arm_enabled), default off, same
                        # never-touch-an-already-armed-panel guard as Night-Late.
                        - conditions: "{{ _aa_trigger == 'mode_away' }}"
                          sequence:
                            - variables:
                                _aa_mode_away_will_arm: "{{ _aa_cfg.get('mode_away_arm_enabled', false) | bool(false) and _aa_panel_entity != '' and states(_aa_panel_entity) in ['disarmed', 'armed_home'] }}"
                            - if: "{{ _aa_mode_away_will_arm }}"
                              then:
                                - action: alarm_control_panel.alarm_arm_away
                                  target: { entity_id: "{{ _aa_panel_entity }}" }
                            - variables:
                                result:
                                  status: ok
                                  action: auto_arm_check
                                  result: mode_away_handled
                                  armed: "{{ _aa_mode_away_will_arm }}"

                        # -- Alarm drives home_mode (reverse of the above -- panel
                        # changed directly, e.g. via keypad/app, not through our
                        # own automation). Parity-matched against legacy NR's
                        # "Security:Main Mode Sync" group, traced via flows.json
                        # armed_away -> set home_mode Away (only that
                        # one state; armed_home/pending/other do nothing to
                        # home_mode in the real legacy flow either). Own
                        # sub-flag, default off. --
                        - conditions: "{{ _aa_trigger == 'alarm_armed_away' }}"
                          sequence:
                            # Someone put the panel back to Away by hand: the vacuum
                            # downgrade is over, whatever the vacuum is doing.
                            - if: "{{ 'vacuum_sync' in _sm_val.get('_overrides', {}) }}"
                              then:
                                - action: script.zen_dojotools_security_manager
                                  continue_on_error: true
                                  data:
                                    action: override_end
                                    override_kind: vacuum_sync
                            - variables:
                                _aa_a2hm_will_set: "{{ _aa_cfg.get('alarm_drives_home_mode_enabled', false) | bool(false) and states('sensor.zen_home_mode') != 'Away' }}"
                            - if: "{{ _aa_a2hm_will_set }}"
                              then:
                                - action: input_select.select_option
                                  target: { entity_id: input_select.zen_home_mode }
                                  data: { option: Away }
                            - variables:
                                result:
                                  status: ok
                                  action: auto_arm_check
                                  result: alarm_armed_away_handled
                                  home_mode_set: "{{ _aa_a2hm_will_set }}"

                        # -- Alarm disarmed: release home_mode from Away back to
                        # the normal schedule (only if it WAS Away -- matches
                        # legacy exactly, a routine disarm while already Home
                        # does nothing here). Same sub-flag as armed_away above.
                        # Also: disarm_occupies_arrival_area_enabled (separate
                        # flag, fires unconditionally on ANY real disarm
                        # regardless of cause) -- fires a synthetic occupied
                        # signal for every area tagged label:arrival_area via
                        # room_signal_fire, the v3-idiomatic equivalent of
                        # legacy's blunt input_select override (v3 state is
                        # derived from presence signals, never force-set
                        # directly; lets whatever that room already does on
                        # occupancy -- REFLEX scene, timers, etc. -- happen
                        # naturally, no separate lighting mechanism needed).
                        # Not hardcoded to any specific room -- installs vary
                        # in which room serves as their arrival point. Tag any entity in the room you want
                        # treated as an arrival point (e.g. that room's own
                        # zen_room_state sensor) with label arrival_area;
                        # area_id(entity) resolves the area, same entity-
                        # label-driven convention as everywhere else in this
                        # codebase (deliberately not label_areas() --
                        # unverified on this HA version, entity labels are the
                        # proven pattern here). Supports multiple arrival
                        # areas, fires for each. --
                        - conditions: "{{ _aa_trigger == 'alarm_disarmed' }}"
                          sequence:
                            # Disarmed by hand during a vacuum downgrade: nothing is
                            # left to put back, so the override is over.
                            - if: "{{ 'vacuum_sync' in _sm_val.get('_overrides', {}) }}"
                              then:
                                - action: script.zen_dojotools_security_manager
                                  continue_on_error: true
                                  data:
                                    action: override_end
                                    override_kind: vacuum_sync
                            - variables:
                                _aa_a2hm_release: "{{ _aa_cfg.get('alarm_drives_home_mode_enabled', false) | bool(false) and states('sensor.zen_home_mode') == 'Away' }}"
                                _aa_arrival_occupy: "{{ _aa_cfg.get('disarm_occupies_arrival_area_enabled', false) | bool(false) }}"
                            - if: "{{ _aa_a2hm_release }}"
                              then:
                                - action: script.zen_home_mode_release
                            - if: "{{ _aa_arrival_occupy }}"
                              then:
                                - variables:
                                    _aa_arrival_areas: >-
                                      {{ label_entities('arrival_area') | map('area_id') | reject('none') | unique | list }}
                                - repeat:
                                    for_each: "{{ _aa_arrival_areas }}"
                                    sequence:
                                      - action: script.zen_dojotools_room_manager
                                        continue_on_error: true
                                        data:
                                          mode: room_signal_fire
                                          area: "{{ repeat.item }}"
                                          signal_class: occupied
                            - variables:
                                result:
                                  status: ok
                                  action: auto_arm_check
                                  result: alarm_disarmed_handled
                                  home_mode_released: "{{ _aa_a2hm_release }}"
                                  arrival_areas_occupied: "{{ _aa_arrival_areas | default([], true) if _aa_arrival_occupy else [] }}"

                        # -- Lock unlock -> auto-disarm. Parity-matched against
                        # legacy NR's "Security: Disarm on Unlock Action":
                        # real distinction there was keypad-unlock (a valid
                        # code IS the credential, always trusted to disarm,
                        # even from Away) vs manual/physical unlock (not
                        # itself a credential, only trusted from armed_home,
                        # never armed_away). This build covers the SAFE core
                        # only -- any real unlock while armed_home disarms;
                        # never auto-disarms from armed_away regardless of
                        # unlock method, since reliably distinguishing keypad
                        # vs manual needs raw zwave_js event data / a
                        # changed_by attribute this install's lock integration
                        # may not expose the same way. Own sub-flag, default
                        # off. --
                        - conditions: "{{ _aa_trigger == 'lock_unlocked' }}"
                          sequence:
                            - variables:
                                _aa_lock_will_disarm: "{{ _aa_cfg.get('lock_disarm_enabled', false) | bool(false) and _aa_panel_entity != '' and states(_aa_panel_entity) == 'armed_home' }}"
                            - if: "{{ _aa_lock_will_disarm }}"
                              then:
                                - action: alarm_control_panel.alarm_disarm
                                  target: { entity_id: "{{ _aa_panel_entity }}" }
                            - variables:
                                result:
                                  status: ok
                                  action: auto_arm_check
                                  result: lock_unlocked_handled
                                  disarmed: "{{ _aa_lock_will_disarm }}"

                        # -- occupancy path (zone.home changed) --
                        # Departure sequence: 1min after zone.home hits 0, notify
                        # admin with a waive-off window covering the remaining time
                        # to the 5min mark (ok_cancel, response_timeout_s=240 --
                        # same postman pattern as vac_started below). If not waived
                        # and still empty, a second short-window notice (30s) fires
                        # right before the actual arm, giving one more chance to
                        # cancel. Either cancel aborts the whole cycle -- a later
                        # genuine departure re-triggers this path fresh.
                        - conditions: "{{ _aa_trigger == 'occupancy' }}"
                          sequence:
                            - choose:
                                - conditions: "{{ _aa_home_count == 0 }}"
                                  sequence:
                                    - delay:
                                        minutes: 1
                                    - variables:
                                        _aa_recheck1: "{{ states('zone.home') | int(-1) }}"
                                    - if: "{{ _aa_recheck1 == 0 and _aa_panel_entity != '' }}"
                                      then:
                                        - action: script.zen_dojotools_postman
                                          data:
                                            mode: resolve_and_dispatch
                                            title: "House is empty — auto-arm in ~4 min"
                                            message: >-
                                              Looks like everyone's left.
                                              Arming Away in about 4 minutes
                                              unless you cancel.
                                            response_type: ok_cancel
                                            response_timeout_s: 240
                                            tag: "pm_auto_arm_departure_{{ now().timestamp() | int }}"
                                            ack_owner: security_manager
                                          response_variable: _aa_departure_notify
                                          continue_on_error: true
                                    - variables:
                                        _aa_departure_notify: "{{ _aa_departure_notify.get('result', _aa_departure_notify) if _aa_departure_notify is mapping else _aa_departure_notify }}"
                                    - variables:
                                        _aa_departure_cancelled: >-
                                          {{ _aa_departure_notify is defined and _aa_departure_notify is mapping
                                             and _aa_departure_notify.get('ack_action', '') == 'cancel' }}
                                        _aa_recheck2: "{{ states('zone.home') | int(-1) }}"
                                    - if: "{{ not _aa_departure_cancelled and _aa_recheck1 == 0 and _aa_recheck2 == 0 and _aa_panel_entity != '' }}"
                                      then:
                                        - action: script.zen_dojotools_postman
                                          data:
                                            mode: resolve_and_dispatch
                                            title: "Auto-arming Away now"
                                            message: >-
                                              Arming Away in 30 seconds. Tap
                                              Cancel to stop it.
                                            response_type: ok_cancel
                                            response_timeout_s: 30
                                            tag: "pm_auto_arm_final_{{ now().timestamp() | int }}"
                                            ack_owner: security_manager
                                          response_variable: _aa_final_notify
                                          continue_on_error: true
                                        - variables:
                                            _aa_final_notify: "{{ _aa_final_notify.get('result', _aa_final_notify) if _aa_final_notify is mapping else _aa_final_notify }}"
                                        - variables:
                                            _aa_final_cancelled: >-
                                              {{ _aa_final_notify is defined and _aa_final_notify is mapping
                                                 and _aa_final_notify.get('ack_action', '') == 'cancel' }}
                                            _aa_recheck3: "{{ states('zone.home') | int(-1) }}"
                                        # LOCAL PRESENCE OVERRIDE: the whole
                                        # departure/arm cancellation path above
                                        # depends entirely on zone.home --
                                        # GPS/geofence presence, which lags real
                                        # arrival by 30-90+ seconds walking
                                        # straight indoors. Room Manager's own
                                        # live per-room state is local and
                                        # instant (motion, no GPS involved) --
                                        # check it as a second, independent gate
                                        # right here, immediately before the
                                        # actual arm, not just at the two
                                        # earlier notification rechecks (which
                                        # share the same zone.home blind spot).
                                        # Anything other than
                                        # vacant/automation/cleaning counts as
                                        # "someone might actually be here" --
                                        # deliberately conservative, false
                                        # negatives here mean an unwanted
                                        # Away-arm around a person; false
                                        # positives just mean one skipped arm
                                        # cycle, corrected next real departure.
                                        - variables:
                                            _aa_local_presence_hi: >-
                                              {{ (label_entities('zen_room_state') | map('states')
                                                 | reject('in', ['vacant', 'automation', 'cleaning', 'unknown', 'unavailable'])
                                                 | list | count) > 0 }}
                                        - if: "{{ not _aa_final_cancelled and _aa_recheck3 == 0 and not _aa_local_presence_hi }}"
                                          then:
                                            - if: "{{ _aa_vac_override and _aa_vac_ent != '' and states(_aa_vac_ent) in ['cleaning', 'returning'] }}"
                                              then:
                                                # The house emptied while the vacuum is running: Home
                                                # for the run, as a vacuum_sync override so the dock
                                                # event (or the Sentry's expiry) puts Away back. If
                                                # the override cannot be recorded, arm Away: Home
                                                # that nothing would ever end is worse.
                                                - action: script.zen_dojotools_security_manager
                                                  continue_on_error: true
                                                  data:
                                                    action: override_set
                                                    override_kind: vacuum_sync
                                                    override_from: armed_away
                                                    override_to: armed_home
                                                    override_reason: "the house emptied while the vacuum was cleaning"
                                                    override_minutes: 120
                                                    override_max_minutes: 180
                                                    override_consent: standing
                                                  response_variable: _aa_ov_raw_occ
                                                - variables:
                                                    _aa_ov_ok_occ: "{{ (_aa_ov_raw_occ.get('result', {}) if _aa_ov_raw_occ is defined and _aa_ov_raw_occ is mapping else {}).get('status', '') == 'ok' }}"
                                                - action: "{{ 'alarm_control_panel.alarm_arm_home' if _aa_ov_ok_occ else 'alarm_control_panel.alarm_arm_away' }}"
                                                  target: { entity_id: "{{ _aa_panel_entity }}" }
                                              else:
                                                - action: alarm_control_panel.alarm_arm_away
                                                  target: { entity_id: "{{ _aa_panel_entity }}" }
                                            # Lock-it-up (best-effort, skipped while entertaining) — ports
                                            # Node-RED's Security: Secure Home closure list via labels
                                            # rather than hardcoded per-room entities.
                                            - if: "{{ states('input_boolean.zen_entertaining') != 'on' }}"
                                              then:
                                                - action: lock.lock
                                                  target: { entity_id: "{{ label_entities('lock') | select('match', 'lock\\.') | list }}" }
                                                  continue_on_error: true
                                                - action: cover.close_cover
                                                  target: { entity_id: "{{ label_entities('secure_on_arm') | select('match', 'cover\\.') | list }}" }
                                                  continue_on_error: true
                                    - variables:
                                        _aa_armed_final: >-
                                          {{ not (_aa_departure_cancelled | default(false)) and not (_aa_final_cancelled | default(false))
                                             and _aa_recheck1 == 0 and _aa_recheck2 == 0 and (_aa_recheck3 | default(0)) == 0
                                             and not (_aa_local_presence_hi | default(false))
                                             and _aa_panel_entity != '' }}
                                        result:
                                          status: ok
                                          action: auto_arm_check
                                          result: >-
                                            {{ 'waived_off_departure' if (_aa_departure_cancelled | default(false))
                                               else 'waived_off_final' if (_aa_final_cancelled | default(false))
                                               else 'armed_away' if _aa_armed_final
                                               else 'aborted_local_presence_detected' if (_aa_local_presence_hi | default(false))
                                               else 'aborted_recheck_failed' }}
                                          home_count_at_recheck: "{{ _aa_recheck3 | default(_aa_recheck2) }}"
                                          local_presence_detected: "{{ _aa_local_presence_hi | default(false) }}"
                                - conditions: "{{ _aa_home_count > 0 }}"
                                  sequence:
                                    - if: "{{ _aa_panel_entity != '' and states(_aa_panel_entity) == 'armed_away' }}"
                                      then:
                                        - action: alarm_control_panel.alarm_disarm
                                          target: { entity_id: "{{ _aa_panel_entity }}" }
                                    - variables:
                                        result:
                                          status: ok
                                          action: auto_arm_check
                                          result: return_sync
                                          home_count: "{{ _aa_home_count }}"

            # ── ARM (x) — requires security_control cert ─────────────────────────
            - conditions: "{{ _action == 'arm' }}"
              sequence:
                - choose:
                    - conditions: "{{ _arm_mode not in ['away','home','night','vacation'] }}"
                      sequence:
                        - variables:
                            result:
                              status: error
                              error: invalid_arm_mode
                              detail: "arm_mode must be away, home, night, or vacation."
                              received: "{{ _arm_mode }}"
                  default:
                    - variables:
                        _arm_panel_entity: >-
                          {%- if _panel_input != '' -%}
                            {{ _panel_input }}
                          {%- else -%}
                            {%- set ns = namespace(found='') -%}
                            {%- for eid in label_entities('alarm_panel') -%}
                              {%- if ns.found == '' and eid.startswith('alarm_control_panel.') -%}
                                {%- set ns.found = eid -%}
                              {%- endif -%}
                            {%- endfor -%}
                            {{ ns.found }}
                          {%- endif -%}
                    - choose:
                        - conditions: "{{ _arm_panel_entity == '' }}"
                          sequence:
                            - variables:
                                result:
                                  status: error
                                  error: no_panel_found
                                  detail: "No alarm_control_panel entity found with label:alarm_panel. Apply the label or pass a panel entity_id directly."
                        - conditions: "{{ states(_arm_panel_entity) in ['unknown', 'unavailable'] }}"
                          sequence:
                            - variables:
                                result:
                                  status: error
                                  error: panel_unavailable
                                  entity_id: "{{ _arm_panel_entity }}"
                                  state: "{{ states(_arm_panel_entity) }}"
                      default:
                        - action: script.zen_dojotools_identity
                          response_variable: _arm_id_raw
                          continue_on_error: true
                          data:
                            mode: resolve_caller_identity
                            required_cert: zenos.actuation.security_control
                            required_cert_level: 1
                            caller_token: "{{ _token }}"
                        - variables:
                            _arm_id_fields: >-
                              {%- import 'zenos_ai/zen_os_1.jinja' as OS -%}
                              {%- set _raw = OS.resolve_identity_fields(_arm_id_raw) -%}
                              {{- (_raw | from_json) if _raw is string else _raw -}}
                            _arm_policy_status: "{{ _arm_id_fields.policy_status }}"
                            _arm_authorized: "{{ _arm_id_fields.authorized }}"
                            _arm_cert_level: "{{ _arm_id_fields.cert_level }}"
                        - choose:
                            - conditions: "{{ _arm_policy_status != 'allowed' or not _arm_authorized }}"
                              sequence:
                                - variables:
                                    result:
                                      status: error
                                      error: "{{ 'identity_policy_blocked' if _arm_policy_status != 'allowed' else 'cert_insufficient' }}"
                                      detail: >-
                                        {%- if _arm_policy_status != 'allowed' -%}
                                          resolve_caller_identity did not return an allowed identity -- action denied.
                                        {%- else -%}
                                          zenos.actuation.security_control cert level {{ _arm_cert_level }} is below the required minimum (1). Certify the default agent via persona_editor to enable arm/disarm.
                                        {%- endif -%}
                          default:
                            - choose:
                                - conditions: "{{ _arm_mode == 'away' }}"
                                  sequence:
                                    - action: alarm_control_panel.alarm_arm_away
                                      target: { entity_id: "{{ _arm_panel_entity }}" }
                                - conditions: "{{ _arm_mode == 'home' }}"
                                  sequence:
                                    - action: alarm_control_panel.alarm_arm_home
                                      target: { entity_id: "{{ _arm_panel_entity }}" }
                                - conditions: "{{ _arm_mode == 'night' }}"
                                  sequence:
                                    - action: alarm_control_panel.alarm_arm_night
                                      target: { entity_id: "{{ _arm_panel_entity }}" }
                                - conditions: "{{ _arm_mode == 'vacation' }}"
                                  sequence:
                                    - action: alarm_control_panel.alarm_arm_vacation
                                      target: { entity_id: "{{ _arm_panel_entity }}" }
                            - action: script.zen_dojotools_event_emitter
                              continue_on_error: true
                              data:
                                mode: emit
                                component: security_manager
                                kind: panel_armed
                                severity: info
                                summary: "Panel armed ({{ _arm_mode }}) via zen_dojotools_security_manager."
                                metadata:
                                  arm_mode: "{{ _arm_mode }}"
                                  entity_id: "{{ _arm_panel_entity }}"
                                  caller_token: "{{ _token }}"
                            - variables:
                                result:
                                  status: ok
                                  action: arm
                                  arm_mode: "{{ _arm_mode }}"
                                  entity_id: "{{ _arm_panel_entity }}"
                                  state: "{{ states(_arm_panel_entity) }}"

            # ── DISARM (d) — security_control cert AND a fresh live ack, ALWAYS ──
            # Direct security analog of locks' exterior-unlock gate: disarming
            # reduces security, so cert alone is never enough, no matter how
            # recently it was granted -- every disarm call asks the household
            # admin live, same zen_dojotools_identity mode=request_live_ack
            # chokepoint, same non-reusable one-shot semantics. ──
            - conditions: "{{ _action == 'disarm' }}"
              sequence:
                - variables:
                    _disarm_panel_entity: >-
                      {%- if _panel_input != '' -%}
                        {{ _panel_input }}
                      {%- else -%}
                        {%- set ns = namespace(found='') -%}
                        {%- for eid in label_entities('alarm_panel') -%}
                          {%- if ns.found == '' and eid.startswith('alarm_control_panel.') -%}
                            {%- set ns.found = eid -%}
                          {%- endif -%}
                        {%- endfor -%}
                        {{ ns.found }}
                      {%- endif -%}
                - choose:
                    - conditions: "{{ _disarm_panel_entity == '' }}"
                      sequence:
                        - variables:
                            result:
                              status: error
                              error: no_panel_found
                              detail: "No alarm_control_panel entity found with label:alarm_panel. Apply the label or pass a panel entity_id directly."
                    - conditions: "{{ states(_disarm_panel_entity) in ['unknown', 'unavailable'] }}"
                      sequence:
                        - variables:
                            result:
                              status: error
                              error: panel_unavailable
                              entity_id: "{{ _disarm_panel_entity }}"
                              state: "{{ states(_disarm_panel_entity) }}"
                  default:
                    # target_entity='disarm' resolves scope_decision inside
                    # identity itself via the shared cert_scope_check macro --
                    # single chokepoint -- anything touching ACLs goes through
                    # identity. Panel is singular so the scope token is
                    # the literal action name, not an entity_id.
                    - action: script.zen_dojotools_identity
                      response_variable: _disarm_id_raw
                      continue_on_error: true
                      data:
                        mode: resolve_caller_identity
                        required_cert: zenos.actuation.security_control
                        required_cert_level: 1
                        target_entity: disarm
                        caller_token: "{{ _token }}"
                    - variables:
                        _disarm_id_fields: >-
                          {%- import 'zenos_ai/zen_os_1.jinja' as OS -%}
                          {%- set _raw = OS.resolve_identity_fields(_disarm_id_raw) -%}
                          {{- (_raw | from_json) if _raw is string else _raw -}}
                        _disarm_policy_status: "{{ _disarm_id_fields.policy_status }}"
                        _disarm_authorized: "{{ _disarm_id_fields.authorized }}"
                        _disarm_cert_level: "{{ _disarm_id_fields.cert_level }}"
                        _disarm_cert_scope: "{{ _disarm_id_fields.cert_scope }}"
                        _disarm_scope_decision: "{{ _disarm_id_fields.scope_decision }}"
                    - choose:
                        - conditions: "{{ _disarm_policy_status != 'allowed' or not _disarm_authorized }}"
                          sequence:
                            - variables:
                                result:
                                  status: error
                                  error: "{{ 'identity_policy_blocked' if _disarm_policy_status != 'allowed' else 'cert_insufficient' }}"
                                  detail: >-
                                    {%- if _disarm_policy_status != 'allowed' -%}
                                      resolve_caller_identity did not return an allowed identity -- action denied.
                                    {%- else -%}
                                      zenos.actuation.security_control cert level {{ _disarm_cert_level }} is below the required minimum (1) to disarm the panel.
                                    {%- endif -%}
                                  can_request: "{{ _disarm_policy_status == 'allowed' }}"
                                  request_via:
                                    tool: zen_dojotools_persona_editor
                                    mode: cert_req_grant
                                    cert_component: zenos.actuation.security_control
                                    cert_level: 1
                                    note: "Fires a live household-admin approval push -- see zen_dojotools_identity mode=cert_list for current status."
                      default:
                        # ── Scoped override: admin can grant security_control
                        # with cert_scope=["disarm"] to stop the every-call ask
                        # entirely (same "begrudging override" mechanism as
                        # locks' per-door scope). Panel is singular
                        # so the scope token is the literal action name, not an
                        # entity_id. scope_decision comes straight from identity's
                        # own resolution (target_entity='disarm' above), not a
                        # local containment check. 'deny' is a hard
                        # block, never offered the ack path -- distinct from
                        # 'default' (still asks every time). ──
                        - if: "{{ _disarm_scope_decision == 'deny' }}"
                          then:
                            - variables:
                                result:
                                  status: denied
                                  action: disarm
                                  error: cert_scope_denied
                                  detail: >-
                                    zenos.actuation.security_control cert_scope explicitly denies disarm --
                                    an admin has scoped this action out via cert_req_grant. No ack
                                    is offered; removing the denial requires cert_req_grant
                                    cert_scope=[{"entity":"disarm","acl":"remove"}].
                        - if: "{{ result is not defined and _disarm_scope_decision != 'allow' }}"
                          then:
                            - action: script.zen_dojotools_identity
                              response_variable: _disarm_ack_raw
                              continue_on_error: true
                              data:
                                mode: request_live_ack
                                ack_message: >-
                                  Disarm request: {{ ((([device_name(_disarm_panel_entity) if device_id(_disarm_panel_entity) else '', entity_name(_disarm_panel_entity)] | select | unique | join(' ')) if entity_name is defined else '') or (state_attr(_disarm_panel_entity, 'friendly_name') | default(_disarm_panel_entity, true))) }}
                                  (panel currently {{ states(_disarm_panel_entity) }}). Disarming reduces home
                                  security. No standing override on file, so asking every time
                                  as designed. Approve this one disarm? (Tip: grant cert_req_grant
                                  cert_component=zenos.actuation.security_control cert_scope=["disarm"] via
                                  persona_editor if you want disarm to stop asking.)
                                caller_token: "{{ _token }}"
                            - variables:
                                _disarm_ack_approved: "{{ _disarm_ack_raw.get('approved', false) if _disarm_ack_raw is mapping else false }}"
                                _disarm_ack_reason: "{{ _disarm_ack_raw.get('reason', 'dispatch_failed') if _disarm_ack_raw is mapping else 'dispatch_failed' }}"
                            - if: "{{ not _disarm_ack_approved }}"
                              then:
                                - variables:
                                    result:
                                      status: denied
                                      action: disarm
                                      reason: "{{ _disarm_ack_reason }}"
                                      detail: "Disarm requires a fresh live household-admin ack every time -- not granted."
                        - if: "{{ result is not defined and _disarm_scope_decision == 'allow' }}"
                          then:
                            - action: script.zen_dojotools_event_emitter
                              continue_on_error: true
                              data:
                                mode: emit
                                component: security_manager
                                kind: disarm_ack_skipped_scoped_override
                                severity: info
                                summary: "Disarm ack skipped -- admin-granted scope override covers disarm."
                                metadata:
                                  entity_id: "{{ _disarm_panel_entity }}"
                                  caller_token: "{{ _token }}"
                        - if: "{{ result is not defined }}"
                          then:
                            - action: alarm_control_panel.alarm_disarm
                              target: { entity_id: "{{ _disarm_panel_entity }}" }
                            - action: script.zen_dojotools_event_emitter
                              continue_on_error: true
                              data:
                                mode: emit
                                component: security_manager
                                kind: panel_disarmed
                                severity: warn
                                summary: >-
                                  Panel disarmed via zen_dojotools_security_manager
                                  ({{ 'scoped override, no ack asked' if _disarm_scope_decision == 'allow' else 'live ack approved' }}).
                                metadata:
                                  entity_id: "{{ _disarm_panel_entity }}"
                                  caller_token: "{{ _token }}"
                            - variables:
                                result:
                                  status: ok
                                  action: disarm
                                  entity_id: "{{ _disarm_panel_entity }}"
                                  state: "{{ states(_disarm_panel_entity) }}"

            # ── HELP (r) — full action/field reference ───────────────────────────
            - conditions: "{{ _action == 'help' }}"
              sequence:
                - variables:
                    _sm_actions:
                      read_state: "Default. Full panel snapshot: state, zones (open/fault/bypass), system health, keypad, chime, panic buttons, cameras_by_area. Read, no cert."
                      query: "List every alarm_control_panel entity tagged label:alarm_panel with its live state. Read, no cert."
                      readiness: "Can the house arm now? Returns ready, blockers (a pending or triggered panel, the panel saying it is not ready, an open or faulted panel zone that is not bypassed, an open or unreadable labeled door, window or garage door, a jammed or unreadable exterior lock), fixable (unlocked exterior locks), notes (bypassed zones), blind (nothing visible was checked) and a one-line summary. Reads the panel's own zones and labels alarm_panel, zen_door, ext_lock. Read, no cert."
                      override_list: "The temporary overrides in force (a change the system made to the panel on its own, for example Away to Home while the vacuum runs): kind, from, to, why, since, expires_at, minutes_left, ceiling. Read, no cert. Say so when asked about security."
                      override_set: "Internal -- the automation that owns a behavior begins or extends an override (override_kind, override_from, override_to, override_reason, override_minutes, override_max_minutes, override_consent). Refused from any user or agent session."
                      override_end: "Internal -- remove an override (override_kind) and return the record so the caller can revert. Refused from any user or agent session."
                      override_sweep: "Internal -- the Zen Security Sentry ends every override whose time has passed: one ledger line each and a zen_event security_override_expired so the owning behavior can restore the panel. Never touches the panel. Refused from any user or agent session."
                      activity: "What security has done on its own, and declined to do: the activity ledger, newest first. activity_hours (default 24, at most 168) and activity_limit (default 50, at most 150). Read, no cert. Say what it shows when asked about security."
                      lens: "The security answer other tools use (Room Manager's home overview): the panel and its state, ready and blocker count, any temporary override as a plain sentence, the last ledger line, and one plain line. Calls readiness, override_list and activity. Read, no cert."
                      ledger_add: "Internal -- a behavior records what it did or declined (ledger_kind, ledger_summary, ledger_source, ledger_detail). Keeps at most 150 entries, at most 7 days old. Refused from any user or agent session."
                      get_policy: "Read _alert_policy from the household cabinet security_manager drawer, optionally scoped. Read, no cert."
                      arm: "Arm the panel. Requires arm_mode= (away|home|night|vacation). Requires zenos.actuation.security_control cert."
                      set_alert_policy: "Merge policy_patch (JSON) into _alert_policy. Requires zenos.actuation.security_control cert."
                      disarm: "Disarm the panel. Requires zenos.actuation.security_control cert PLUS a fresh live household-admin acknowledgment every call."
                      auto_arm_config: "Read the auto-arm settings (no auto_arm_patch: returns the stored config, no cert) or write them (auto_arm_patch JSON, partial merge: requires zenos.actuation.security_control cert)."
                      help: "This reference."
                - variables:
                    _sm_help_message: >-
                      {%- set ns = namespace(out='Zone/panel security lens + arm control. mode= is the same field as action= (alias, mode wins if both given). ') -%}
                      {%- for k, v in _sm_actions.items() -%}
                        {%- set ns.out = ns.out ~ 'mode=' ~ k ~ ' -- ' ~ v ~ ' ' -%}
                      {%- endfor -%}
                      {{ ns.out | trim }}
                - variables:
                    result:
                      status: help
                      message: "{{ _sm_help_message }}"
                      action: help
                      lens: "Security Manager = zone/panel lens. Camera = visual analysis lens. RM +security context_slice = per-room spatial bridge."
                      actions:
                        read_state: "Default. Full panel snapshot: state, zones (open/fault/bypass), system health, keypad, chime, panic buttons, cameras_by_area. Read, no cert."
                        query: "List every alarm_control_panel entity tagged label:alarm_panel with its live state. Read, no cert."
                        readiness: "Can the house arm now? Returns ready, blockers (a pending or triggered panel, the panel saying it is not ready, an open or faulted panel zone that is not bypassed, an open or unreadable labeled door, window or garage door, a jammed or unreadable exterior lock), fixable (unlocked exterior locks), notes (bypassed zones), blind (nothing visible was checked), checked counts and a one-line summary. Reads the panel's own zones and labels alarm_panel, zen_door, ext_lock. Read, no cert."
                        override_list: "The temporary overrides in force (a change the system made to the panel on its own, for example Away to Home while the vacuum runs): kind, from, to, why, since, expires_at, minutes_left, ceiling. Read, no cert. Say so when asked about security."
                        override_set: "Internal -- the automation that owns a behavior begins or extends an override. The expiry never passes the override's start plus its ceiling (default 180 min); a longer ask is clamped and counted. Refused from any user or agent session."
                        override_end: "Internal -- remove an override and return the record so the caller can revert. Refused from any user or agent session."
                        override_sweep: "Internal -- the Zen Security Sentry ends every override whose time has passed: one ledger line each and a zen_event security_override_expired so the owning behavior can restore the panel. Never touches the panel. Refused from any user or agent session."
                        activity: "What security has done on its own, and declined to do: the activity ledger, newest first. activity_hours (default 24, at most 168) and activity_limit (default 50, at most 150). Read, no cert. Say what it shows when asked about security."
                        lens: "The security answer other tools use (Room Manager's home overview): the panel and its state, ready and blocker count, any temporary override as a plain sentence, the last ledger line, and one plain line. Calls readiness, override_list and activity, and never calls Room Manager. Read, no cert."
                        ledger_add: "Internal -- a behavior records what it did or declined (ledger_kind, ledger_summary, ledger_source, ledger_detail). Keeps at most 150 entries, at most 7 days old. Refused from any user or agent session."
                        get_policy: "Read _alert_policy from the household cabinet security_manager drawer, optionally scoped. Read, no cert."
                        arm: "Arm the panel. Requires arm_mode= (away|home|night|vacation). Requires zenos.actuation.security_control cert."
                        set_alert_policy: "Merge policy_patch (JSON) into _alert_policy -- partial update, existing keys not in the patch are preserved. Requires zenos.actuation.security_control cert."
                        disarm: "Disarm the panel. Requires zenos.actuation.security_control cert PLUS a fresh live household-admin acknowledgment every single call -- never reusable across calls."
                        auto_arm_check: "Internal -- fired by the companion automation on occupancy/vacuum-cycle triggers, not intended for direct agent calls. Evaluates the auto-arm config against auto_arm_trigger and arms/disarms accordingly."
                        auto_arm_config: "Read the auto-arm settings (no auto_arm_patch: returns the stored config and the Sentry's state, no cert, nothing changed) or write them (auto_arm_patch JSON, partial merge -- auto_arm_enabled, vac_arm_override_enabled, night_arm_enabled, mode_away_arm_enabled, and related flags; see the auto_arm_patch field description for the full key list; requires zenos.actuation.security_control cert)."
                        help: "This reference."
                      fields:
                        arm_mode: "away | home | night | vacation. Required for action=arm."
                        panel: "alarm_control_panel entity_id override. Omit to auto-discover via label:alarm_panel."
                        policy_patch: "JSON string, event_type -> policy overrides. Required for set_alert_policy. Event types: alarm_triggered, alarm_pending, alarm_arm_away, alarm_arm_home, alarm_arm_night, alarm_disarm, panel_fault, smoke_co, door_open_armed, door_open_night, garage_open_armed, lock_unlocked_armed, lock_unlocked_night, lock_changed, person_detected_armed. Per-entry keys: urgency (1-10), notify (bool), channel_hint, title."
                        auto_arm_patch: "JSON string for auto_arm_config, partial merge. See auto_arm_config field docs for the full key list (auto_arm_enabled, vac_arm_override_enabled, notify_occupied_while_away, dusk_lights_enabled, dusk_offset_min, dawn_offset_min, arrival_lights_enabled, arrival_lights_minutes, arrival_lights_dark_elevation, arrival_lights_residents, night_arm_enabled, mode_away_arm_enabled, entertaining_blocks_night_arm, alarm_drives_home_mode_enabled, disarm_occupies_arrival_area_enabled, lock_disarm_enabled, cover_watch_enabled, cover_left_open_minutes, cover_day_policy, cover_night_close_enabled, cover_wind_close_enabled, cover_wind_policy, cover_wind_threshold, appliance_sentry_enabled, appliance_sentry_minutes)."
                        auto_arm_trigger: "Internal -- which event fired auto_arm_check (occupancy|vac_started|vac_docked|override_expired|and the panel, lock and home-mode triggers). Set by the companion automation, not for direct agent calls."
                      cert_gates:
                        read_tier: "read_state, query, readiness, override_list, activity, lens, get_policy -- always open, no cert."
                        internal_tier: "auto_arm_check, override_set, override_end, override_sweep, ledger_add -- refused from any session that has a user; only the automations that own a behavior call them."
                        act_tier: "arm, set_alert_policy, and auto_arm_config with an auto_arm_patch -- require the zenos.actuation.security_control cert (same resolve_caller_identity chokepoint as locks' zenos.actuation.lock_control). auto_arm_config with no patch is a read and needs no cert."
                        disarm_tier: "disarm -- zenos.actuation.security_control cert PLUS a fresh live household-admin ack every single call, never reusable."
          default:
            # ── READ_STATE (r, default) — device tree walk ───────────────────────
            # Byte-for-byte the same classification logic as before this pass --
            # only the exit shape changed (falls through to result, doesn't
            # stop: directly). ──
            - variables:
                _rs_panel_entity: >-
                  {%- if _panel_input != '' -%}
                    {{ _panel_input }}
                  {%- else -%}
                    {%- set ns = namespace(found='') -%}
                    {%- for eid in label_entities('alarm_panel') -%}
                      {%- if ns.found == '' and eid.startswith('alarm_control_panel.') -%}
                        {%- set ns.found = eid -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {{ ns.found }}
                  {%- endif -%}
            - choose:
                - conditions: "{{ _rs_panel_entity == '' }}"
                  sequence:
                    - variables:
                        result:
                          status: error
                          error: no_panel_found
                          detail: "No alarm_control_panel entity found with label:alarm_panel. Apply the label or pass a panel entity_id directly."
                - conditions: "{{ states(_rs_panel_entity) in ['unknown', 'unavailable'] }}"
                  sequence:
                    - variables:
                        result:
                          status: error
                          error: panel_unavailable
                          entity_id: "{{ _rs_panel_entity }}"
                          state: "{{ states(_rs_panel_entity) }}"
              default:
                - variables:
                    _panel_state: "{{ states(_rs_panel_entity) }}"
                    _panel_name: "{{ ((([device_name(_rs_panel_entity) if device_id(_rs_panel_entity) else '', entity_name(_rs_panel_entity)] | select | unique | join(' ')) if entity_name is defined else '') or (state_attr(_rs_panel_entity, 'friendly_name') | default(_rs_panel_entity, true))) }}"
                    _device_id: "{{ device_id(_rs_panel_entity) }}"

                - variables:
                    _all: "{%- import 'zenos_ai/zen_target_resolve.jinja' as TARGET -%}{{ TARGET.device_entities_all(_device_id) | from_json }}"

                # ── Zone contacts — classified by device_class, fault suffix excluded ─
                - variables:
                    _zones: >-
                      {%- set _zdc = ['door','window','motion','opening','vibration','gas','heat','smoke','moisture','presence'] -%}
                      {%- set ns = namespace(zones=[]) -%}
                      {%- for eid in _all -%}
                        {%- if eid.startswith('binary_sensor.') and not eid.endswith('_fault') -%}
                          {%- set _dc = state_attr(eid, 'device_class') | default('', true) -%}
                          {%- if _dc in _zdc -%}
                            {%- set _base = eid.split('.')[1] -%}
                            {%- set _f = 'binary_sensor.' ~ _base ~ '_fault' -%}
                            {%- set _b = 'switch.' ~ _base ~ '_bypass' -%}
                            {%- set _s = states(eid) -%}
                            {%- set ns.zones = ns.zones + [{
                              "entity_id": eid,
                              "name": ((([device_name(eid) if device_id(eid) else '', entity_name(eid)] | select | unique | join(' ')) if entity_name is defined else '') or (state_attr(eid, 'friendly_name') | default(_base | replace('_',' ') | title, true))),
                              "type": _dc,
                              "state": _s,
                              "open": _s == 'on',
                              "fault": states(_f) == 'on' if _f in _all else false,
                              "bypassed": states(_b) == 'on' if _b in _all else false,
                              "fault_entity": _f if _f in _all else none,
                              "bypass_entity": _b if _b in _all else none
                            }] -%}
                          {%- endif -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {{ ns.zones }}

                # ── System health binary sensors (not zone contacts, not fault suffix) ─
                - variables:
                    _sys: >-
                      {%- set _zdc = ['door','window','motion','opening','vibration','gas','heat','smoke','moisture','presence'] -%}
                      {%- set ns = namespace(sys=[]) -%}
                      {%- for eid in _all -%}
                        {%- if eid.startswith('binary_sensor.') and not eid.endswith('_fault') -%}
                          {%- set _dc = state_attr(eid, 'device_class') | default('', true) -%}
                          {%- if _dc not in _zdc -%}
                            {%- set _st = states(eid) -%}
                            {%- set _nm = ((([device_name(eid) if device_id(eid) else '', entity_name(eid)] | select | unique | join(' ')) if entity_name is defined else '') or (state_attr(eid, 'friendly_name') | default(eid, true))) -%}
                            {%- if _dc == 'power' -%}
                              {%- set _ok = _st == 'on' -%}
                              {%- set _interp = 'AC power present' if _ok else 'AC power lost' -%}
                            {%- elif _dc == 'battery' -%}
                              {%- set _ok = _st == 'off' -%}
                              {%- set _interp = 'battery OK' if _ok else 'battery low' -%}
                            {%- elif _dc == 'problem' -%}
                              {%- set _ok = _st == 'off' -%}
                              {%- set _interp = 'no problem' if _ok else 'problem detected' -%}
                            {%- elif 'ready' in eid -%}
                              {%- set _ok = _st == 'on' -%}
                              {%- set _interp = 'panel ready' if _ok else 'panel not ready' -%}
                            {%- elif 'alarm' in eid and 'panel' not in eid -%}
                              {%- set _ok = _st == 'off' -%}
                              {%- set _interp = 'no alarm active' if _ok else 'alarm active' -%}
                            {%- else -%}
                              {%- set _ok = true -%}
                              {%- set _interp = _st -%}
                            {%- endif -%}
                            {%- set ns.sys = ns.sys + [{
                              "entity_id": eid,
                              "name": _nm,
                              "state": _st,
                              "device_class": _dc,
                              "ok": _ok,
                              "interpretation": _interp
                            }] -%}
                          {%- endif -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {{ ns.sys }}

                # ── Chime, keypad, panic buttons ──────────────────────────────────
                - variables:
                    _chime: >-
                      {%- set ns = namespace(v='') -%}
                      {%- for eid in _all -%}
                        {%- if ns.v == '' and eid.startswith('switch.') and '_chime' in eid -%}
                          {%- set ns.v = eid -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {{ ns.v }}
                    _keypad: >-
                      {%- set ns = namespace(v='') -%}
                      {%- for eid in _all -%}
                        {%- if ns.v == '' and eid.startswith('sensor.') -%}
                          {%- set ns.v = eid -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {{ ns.v }}
                    _panic: >-
                      {%- set ns = namespace(b=[]) -%}
                      {%- for eid in _all -%}
                        {%- if eid.startswith('button.') -%}
                          {%- set ns.b = ns.b + [eid] -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {{ ns.b }}

                # ── Derive open / fault / bypass summaries ────────────────────────
                - variables:
                    _open: >-
                      {%- set ns = namespace(r=[]) -%}
                      {%- for z in _zones -%}
                        {%- if z.open -%}{%- set ns.r = ns.r + [z.name] -%}{%- endif -%}
                      {%- endfor -%}
                      {{ ns.r }}
                    _faulted: >-
                      {%- set ns = namespace(r=[]) -%}
                      {%- for z in _zones -%}
                        {%- if z.fault -%}{%- set ns.r = ns.r + [z.name] -%}{%- endif -%}
                      {%- endfor -%}
                      {{ ns.r }}
                    _bypassed: >-
                      {%- set ns = namespace(r=[]) -%}
                      {%- for z in _zones -%}
                        {%- if z.bypassed -%}{%- set ns.r = ns.r + [z.name] -%}{%- endif -%}
                      {%- endfor -%}
                      {{ ns.r }}

                # ── Camera discovery (by area) ────────────────────────────────────
                - variables:
                    _cameras_by_area: >-
                      {%- set _all_cams = label_entities('security_camera') -%}
                      {%- set ns = namespace(r={}) -%}
                      {%- for eid in _all_cams -%}
                        {%- set _aid = area_id(eid) | default('', true) -%}
                        {%- if _aid != '' -%}
                          {%- set _existing = ns.r.get(_aid, []) -%}
                          {%- set ns.r = ns.r | combine({_aid: _existing + [eid]}) -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {{ ns.r }}

                # ── Assemble result ───────────────────────────────────────────────
                - variables:
                    result:
                      status: ok
                      action: read_state
                      panel:
                        entity_id: "{{ _rs_panel_entity }}"
                        name: "{{ _panel_name }}"
                        state: "{{ _panel_state }}"
                      summary:
                        zone_count: "{{ _zones | length }}"
                        open_zones: "{{ _open }}"
                        faulted_zones: "{{ _faulted }}"
                        bypassed_zones: "{{ _bypassed }}"
                        system_ok: "{{ (_sys | selectattr('ok', 'eq', false) | list | length) == 0 }}"
                        system_issues: "{{ _sys | selectattr('ok', 'eq', false) | map(attribute='name') | list }}"
                      zones: "{{ _zones }}"
                      system: "{{ _sys }}"
                      chime:
                        entity_id: "{{ _chime if _chime != '' else none }}"
                        state: "{{ states(_chime) if _chime != '' else 'n/a' }}"
                      keypad:
                        entity_id: "{{ _keypad if _keypad != '' else none }}"
                        state: "{{ states(_keypad) if _keypad != '' else 'n/a' }}"
                      panic_buttons: "{{ _panic }}"
                      cameras_by_area: "{{ _cameras_by_area }}"
                      lens: "Security Manager lens — zone/panel state. zen_dojotools_camera for visual analysis per camera entity (camera lens). zen_dojotools_room_manager +security slice for per-room spatial context."

      # ═══════════════════════════════════════════════════════════════════════
      # SINGLE EXIT — envelope() wrap
      # ═══════════════════════════════════════════════════════════════════════
      - variables:
          _envelope: >-
            {%- import 'zenos_ai/zen_os_1.jinja' as OS -%}
            {{- OS.envelope(
              status='error' if (result.get('status') == 'error' if result is mapping else false) else 'success',
              mode=_action | default(_sm_gate_mode, true),
              result=result,
              tool='zen_dojotools_security_manager',
              caller_token=_token | default(caller_token | default(''), true)
            ) | from_json -}}
      - stop: security_manager response
        response_variable: _envelope

###############################################################################
# Companion automation — fires the script's auto_arm_check action directly.
# NOT the Dojo/KFC trigger_subscriptions dispatch loop (that pipeline routes
# to the Ninja Summarizer for AI-narrated context, not a deterministic
# arm/disarm call) -- this needs its own real triggers. Dormant by default:
# the script's own auto_arm_check reads auto_arm_enabled (off by default,
# written via action=auto_arm_config, security_control cert) and no-ops
# immediately if it's off, so this automation firing costs nothing until
# an admin explicitly turns the feature on post-Node-RED.
###############################################################################
automation:
  - id: '1755840000001'
    alias: Zen Security Auto-Arm Watcher
    description: >-
      Fires zen_dojotools_security_manager action=auto_arm_check on zone.home
      occupancy changes, vacuum start/dock events, home_mode Night-Late/Away
      transitions, alarm panel arm-away/disarm events, and exterior lock
      unlocks. No-ops unless auto_arm_enabled is on (security_manager
      cabinet drawer, cert-gated) -- each sub-behavior also has its own
      off-by-default sub-flag under _auto_arm_config.
    triggers:
      - trigger: state
        entity_id:
        - zone.home
        not_from:
        - unknown
        - unavailable
        not_to:
        - unknown
        - unavailable
        id: occupancy
      # target is REQUIRED by this trigger platform. Purpose-trigger
      # target supports label_id directly -- labeled to autovac, no
      # entity hardcode.
      - trigger: vacuum.started_cleaning
        target:
          label_id: autovac
        id: vac_started
      # The dock is read from Autovac's own autovac_docked event, not the raw
      # vacuum.returned_to_dock: the event is sent after Autovac has decided whether
      # the run was cancelled, and carries that answer.
      - trigger: event
        event_type: zen_event
        event_data:
          event:
            kind: autovac_docked
        id: vac_docked
      # An override ran out of time (the Sentry's sweep sends this). Put back what
      # the behavior that owns the override changed.
      - trigger: event
        event_type: zen_event
        event_data:
          event:
            kind: security_override_expired
        id: override_expired
      # zen_home_mode is a singleton global sensor (no label to intersect
      # against, same category as zone.home above) -- literal entity_id here
      # matches that existing precedent, not a new hardcoding pattern.
      - trigger: state
        entity_id: sensor.zen_home_mode
        to: "Night-Late"
        # A template reload re-creates zen_home_mode (unavailable, then its
        # state again); that is not entering Night-Late or Away.
        not_from:
        - unknown
        - unavailable
        id: night_late
      - trigger: state
        entity_id: sensor.zen_home_mode
        to: "Away"
        not_from:
        - unknown
        - unavailable
        id: mode_away
      # Purpose triggers for the alarm panel -- target supports label_id
      # directly (every alarm_control_panel entity sharing the alarm_panel
      # label), no entity hardcode, same mechanism as the vacuum pair above.
      - trigger: alarm_control_panel.armed_away
        target:
          label_id: alarm_panel
        id: alarm_armed_away
      - trigger: alarm_control_panel.disarmed
        target:
          label_id: alarm_panel
        id: alarm_disarmed
      - trigger: alarm_control_panel.triggered
        target:
          label_id: alarm_panel
        id: alarm_triggered
      # Exterior locks only. Purpose-trigger target supports label_id
      # directly -- every lock carrying ext_lock, no entity hardcode,
      # interior locks correctly excluded by the label itself.
      - trigger: lock.unlocked
        target:
          label_id: ext_lock
        id: lock_unlocked
      # A room reads occupied, engaged or asleep for two minutes while the panel is
      # armed Away. The handler only acts when notify_occupied_while_away is on (default
      # off). expand(label_entities(...)) is used, not states() over a label result:
      # that chain does not track reliably in a template trigger.
      - trigger: template
        value_template: >-
          {{ (expand(label_entities('alarm_panel')) | selectattr('state', 'eq', 'armed_away') | list | count > 0)
             and (expand(label_entities('zen_room_state')) | selectattr('state', 'in', ['occupied', 'engaged', 'asleep']) | list | count > 0) }}
        for: "00:02:00"
        id: room_occupied_away
      # Security lighting (dusk_lights_enabled, default off) for every light or switch
      # carrying the dusk_to_dawn label. A template trigger per edge, not sun.dusk and
      # sun.dawn: those take their offset in the trigger's own options, and the offsets
      # here are settings (dusk_offset_min, dawn_offset_min, either sign). The template
      # reads sun.sun's next_dusk and next_dawn (direct references, and now() makes it
      # re-evaluate every minute), so each edge fires within a minute of its time.
      # lit = between dusk plus its offset and dawn plus its offset.
      - trigger: template
        value_template: >-
          {%- set sm = (state_attr(states('sensor.zen_default_household_cabinet_resolved'), 'variables') or {}).get('security_manager', {}) -%}
          {%- set c = ((sm.get('value', sm) if sm is mapping else {}).get('_auto_arm_config', {})) -%}
          {%- set doff = (c.get('dusk_offset_min', 0) | int(0)) * 60 -%}
          {%- set woff = (c.get('dawn_offset_min', 0) | int(0)) * 60 -%}
          {%- set D = as_timestamp(state_attr('sun.sun', 'next_dusk'), 0) -%}
          {%- set W = as_timestamp(state_attr('sun.sun', 'next_dawn'), 0) -%}
          {%- set N = now().timestamp() -%}
          {%- set night = W < D -%}
          {{ D > 0 and W > 0 and ((N >= D - 86400 + doff and N < (W if night else W - 86400) + woff) or (N >= D + doff and N < (W + 86400 if night else W) + woff)) }}
        id: dusk_lights_on
      - trigger: template
        value_template: >-
          {%- set sm = (state_attr(states('sensor.zen_default_household_cabinet_resolved'), 'variables') or {}).get('security_manager', {}) -%}
          {%- set c = ((sm.get('value', sm) if sm is mapping else {}).get('_auto_arm_config', {})) -%}
          {%- set doff = (c.get('dusk_offset_min', 0) | int(0)) * 60 -%}
          {%- set woff = (c.get('dawn_offset_min', 0) | int(0)) * 60 -%}
          {%- set D = as_timestamp(state_attr('sun.sun', 'next_dusk'), 0) -%}
          {%- set W = as_timestamp(state_attr('sun.sun', 'next_dawn'), 0) -%}
          {%- set N = now().timestamp() -%}
          {%- set night = W < D -%}
          {{ D > 0 and W > 0 and not ((N >= D - 86400 + doff and N < (W if night else W - 86400) + woff) or (N >= D + doff and N < (W + 86400 if night else W) + woff)) }}
        id: dusk_lights_off
      # A start or restart: the edges above only fire on a change, so resolve the lights
      # from the current time.
      - trigger: homeassistant
        event: start
        id: dusk_lights_resolve
      # Arrival lights (arrival_lights_enabled, default off): a resident's tracker
      # (label arrival_tracker) enters zone.home. The handler checks it is a resident,
      # that it is dark, and turns on the lights labeled landing_lights that are off.
      - trigger: zone.entered
        target:
          label_id: arrival_tracker
        options:
          zone: zone.home
        id: arrival_home
      # The landing lights' time is up (the record in the household cabinet key
      # _security_arrival carries until_ts). Always acts when a record has run out,
      # whatever the setting, so lights this behavior turned on are never stranded.
      - trigger: template
        value_template: >-
          {%- set r = (state_attr(states('sensor.zen_default_household_cabinet_resolved'), 'variables') or {}).get('_security_arrival', {}) -%}
          {%- set v = r.get('value', r) if r is mapping else {} -%}
          {%- set v = (v | from_json({})) if v is string else v -%}
          {{ (v.get('until_ts', 0) | float(0)) > 0 and now().timestamp() >= (v.get('until_ts', 0) | float(0)) }}
        id: arrival_lights_off
      - trigger: homeassistant
        event: start
        id: arrival_lights_resolve
      # Exterior covers (cover_watch_enabled, default off): every cover labeled
      # secure_on_arm, and every cover labeled exterior with device class garage, gate
      # or door. Left open cover_left_open_minutes (default 15): ask, close or tell, by
      # cover_day_policy. The handler does nothing while the setting is off. Like every
      # label template trigger here, a cover labeled after this automation starts is
      # seen once it is turned off and on, or after a restart (#10716).
      - trigger: template
        value_template: >-
          {%- set sa = label_entities('secure_on_arm') -%}
          {%- set ns = namespace(n=0) -%}
          {%- for s in expand(sa + label_entities('exterior')) if s.domain == 'cover' and s.state in ['open', 'opening'] and (s.entity_id in sa or s.attributes.get('device_class') in ['garage', 'gate', 'door']) -%}{%- set ns.n = ns.n + 1 -%}{%- endfor -%}
          {{ ns.n > 0 }}
        for:
          minutes: >-
            {%- set sm = (state_attr(states('sensor.zen_default_household_cabinet_resolved'), 'variables') or {}).get('security_manager', {}) -%}
            {%- set c = ((sm.get('value', sm) if sm is mapping else {}).get('_auto_arm_config', {})) -%}
            {{ [c.get('cover_left_open_minutes', 15) | int(15), 1] | max }}
        id: cover_left_open
      # Every watched cover closed: clears the "left open" line in the agent's context.
      - trigger: template
        value_template: >-
          {%- set sa = label_entities('secure_on_arm') -%}
          {%- set ns = namespace(n=0, all=0) -%}
          {%- for s in expand(sa + label_entities('exterior')) if s.domain == 'cover' and (s.entity_id in sa or s.attributes.get('device_class') in ['garage', 'gate', 'door']) -%}
            {%- set ns.all = ns.all + 1 -%}{%- if s.state in ['open', 'opening'] -%}{%- set ns.n = ns.n + 1 -%}{%- endif -%}
          {%- endfor -%}
          {{ ns.all > 0 and ns.n == 0 }}
        id: cover_closed
      # cover_night_close_enabled: close silently when the home mode turns Night.
      - trigger: state
        entity_id: sensor.zen_home_mode
        to: "Night"
        not_from:
        - unknown
        - unavailable
        id: cover_night
      # The house woke (home mode left Night or Night-Late, or quiet hours ended): send
      # the note saved by a close made while it slept.
      - trigger: state
        entity_id: sensor.zen_home_mode
        from:
        - Night
        - Night-Late
        not_to:
        - Night
        - Night-Late
        - unknown
        - unavailable
        id: cover_wake
      - trigger: template
        value_template: >-
          {{ is_state(label_entities('zen_quiet_hours') | select('match', 'binary_sensor\\.') | list | first | default('none', true), 'off') }}
        id: cover_wake
      # Damaging wind for five minutes with a watched cover open (cover_wind_close_enabled).
      # The source, in order: a binary_sensor labeled cover_wind (on means close); a
      # wind_speed sensor labeled cover_wind against cover_wind_threshold (default 50 in
      # mph, else 80); else the weather entity's gust or wind speed against the damaging
      # threshold for its unit (main_weather, then zen_weather, then the first weather.*).
      - trigger: template
        value_template: >-
          {%- set sa = label_entities('secure_on_arm') -%}
          {%- set ns = namespace(n=0) -%}
          {%- for s in expand(sa + label_entities('exterior')) if s.domain == 'cover' and s.state in ['open', 'opening'] and (s.entity_id in sa or s.attributes.get('device_class') in ['garage', 'gate', 'door']) -%}{%- set ns.n = ns.n + 1 -%}{%- endfor -%}
          {%- set sm = (state_attr(states('sensor.zen_default_household_cabinet_resolved'), 'variables') or {}).get('security_manager', {}) -%}
          {%- set c = ((sm.get('value', sm) if sm is mapping else {}).get('_auto_arm_config', {})) -%}
          {%- set wb = label_entities('cover_wind') | select('match', 'binary_sensor\\.') | list -%}
          {%- set ws = label_entities('cover_wind') | select('match', 'sensor\\.') | list -%}
          {%- if wb | count > 0 -%}
            {%- set windy = expand(wb) | selectattr('state', 'eq', 'on') | list | count > 0 -%}
          {%- elif ws | count > 0 -%}
            {%- set u = state_attr(ws[0], 'unit_of_measurement') or 'mph' -%}
            {%- set thr = c.get('cover_wind_threshold', 50 if u == 'mph' else 80) | float(50) -%}
            {%- set windy = (expand(ws) | map(attribute='state') | map('float', 0) | max) >= thr -%}
          {%- else -%}
            {%- set we = ((label_entities('main_weather') + label_entities('zen_weather')) | select('match', 'weather\\.') | list | first) or (states.weather | map(attribute='entity_id') | list | first | default('')) -%}
            {%- set u = state_attr(we, 'wind_speed_unit') or 'mph' -%}
            {%- set thr = {'mph': 50, 'km/h': 80, 'm/s': 22, 'kn': 43, 'ft/s': 73}.get(u, 80) -%}
            {%- set w = [state_attr(we, 'wind_gust_speed') | float(0), state_attr(we, 'wind_speed') | float(0)] | max if we != '' else 0 -%}
            {%- set windy = w >= thr -%}
          {%- endif -%}
          {{ ns.n > 0 and windy }}
        for: "00:05:00"
        id: cover_wind
      # Appliance sentry (appliance_sentry_enabled, default off, #10703): an appliance
      # labeled appliance AND appliance_sentry is on while nobody is home (zone.home at
      # 0, the same rule auto-arm uses; unknown never counts as empty), for
      # appliance_sentry_minutes (default 10). Inform only: the house cannot switch a
      # range off. The clear edge removes the agent's line.
      - trigger: template
        value_template: >-
          {%- set ns = namespace(n=0) -%}
          {%- for s in expand(label_entities('appliance')) if s.state == 'on' and s.entity_id in label_entities('appliance_sentry') -%}{%- set ns.n = ns.n + 1 -%}{%- endfor -%}
          {{ ns.n > 0 and (states('zone.home') | int(-1)) == 0 }}
        for:
          minutes: >-
            {%- set sm = (state_attr(states('sensor.zen_default_household_cabinet_resolved'), 'variables') or {}).get('security_manager', {}) -%}
            {%- set c = ((sm.get('value', sm) if sm is mapping else {}).get('_auto_arm_config', {})) -%}
            {{ [c.get('appliance_sentry_minutes', 10) | int(10), 1] | max }}
        id: appliance_away
      - trigger: template
        value_template: >-
          {%- set ns = namespace(n=0) -%}
          {%- for s in expand(label_entities('appliance')) if s.state == 'on' and s.entity_id in label_entities('appliance_sentry') -%}{%- set ns.n = ns.n + 1 -%}{%- endfor -%}
          {{ ns.n == 0 or (states('zone.home') | int(0)) > 0 }}
        id: appliance_away_clear
      # The answer to a cover question (sent without waiting: this automation is
      # queued and must not hold a security event behind a five-minute question).
      - trigger: event
        event_type: zen_event
        event_data:
          event:
            kind: postman_ack
            ack_owner: security_manager
        id: cover_ack
    conditions: []
    actions:
      - action: script.zen_dojotools_security_manager
        data:
          action: auto_arm_check
          auto_arm_trigger: "{{ trigger.id }}"
          cover_ack: "{{ trigger.event.data.event if trigger.id == 'cover_ack' else {} }}"
          auto_arm_entity: "{{ ((trigger.entity_id | default('', true)) | string) if trigger.id == 'arrival_home' else '' }}"
          auto_arm_vac_cancelled: "{{ (trigger.event.data.event.get('cancelled', false) | bool(false)) if trigger.id == 'vac_docked' else false }}"
          override_kind: "{{ (trigger.event.data.event.get('override', {}).get('kind', '')) if trigger.id == 'override_expired' else '' }}"
    mode: queued
    max: 10

  # The Sentry holds the behaviors that need Spook trigger platforms. It is a
  # separate automation from the Auto-Arm Watcher above on purpose: Home Assistant
  # disables a whole automation when any one trigger is invalid, so a missing or
  # changed Spook would switch off everything in the automation that names it. Here
  # that costs only the Sentry; the watcher keeps running on core triggers alone.
  - id: zen_security_sentry
    alias: Zen Security Sentry
    description: >-
      Spook-trigger behaviors for Security Manager. First job: every minute, if an
      override exists in the security_manager drawer, call action=override_sweep to
      end any whose time has passed (ledger line and zen_event each; the panel
      itself is left to the behavior that owns the override). A cron trigger, not
      spook.while: while fires when its condition arrives and then on its interval,
      but not for a condition already true when the automation starts, so an
      override left over from before a restart or re-enable would never be swept.
    triggers:
      - trigger: spook.cron
        id: override_sweep
        options:
          schedule: "* * * * *"
    conditions:
      - condition: template
        value_template: >-
          {% set cab = states('sensor.zen_default_household_cabinet_resolved') %}
          {% set v = state_attr(cab, 'variables') if cab not in ['', 'unknown', 'unavailable'] else none %}
          {% set d = v.get('security_manager', {}) if v is mapping else {} %}
          {% set val = d.get('value', d) if d is mapping else {} %}
          {% set val = (val | from_json({})) if val is string else val %}
          {{ (val.get('_overrides', {}) | count) > 0 if val is mapping else false }}
    actions:
      - action: script.zen_dojotools_security_manager
        data:
          action: override_sweep
      # Heals a missed dock (reload or restart during a run): see the
      # vac_reconcile branch of auto_arm_check.
      - action: script.zen_dojotools_security_manager
        data:
          action: auto_arm_check
          auto_arm_trigger: vac_reconcile
    mode: single
    max_exceeded: silent
