###############################################################################
# ZenOS-AI DojoTools: Security Manager
# Version: 5.2.0
#
# Scripts:
#   zen_dojotools_security_manager — Alarm panel query + control + policy
#
# Discovery: label:alarm_panel + alarm_control_panel domain (no hardcoding).
# Device tree: device_entities(device_id) walks all zone and system entities.
# Zone pairing: _fault / _bypass object_id suffix convention.
#
# Installation: alarm_control_panel.home_alarm — Envisalink 4 + DSC panel
#   12 zones: 3 doors, 8 windows, 1 motion detector
#   Dispatcher arm: zen_dojotool_tool_router in dojotools_dispatcher.yaml
#
# Actions:
#   read_state  — Full panel snapshot (default): state, zones, system health,
#                 cameras_by_area (security_camera label grouped by area_id)
#   query       — List all alarm_control_panel entities tagged alarm_panel
#   arm         — Arm with mode: away / home / night / vacation
#   disarm      — Disarm
#
# Lens pattern (v5.1.0):
#   Security Manager = zone/panel lens. Camera = visual analysis lens.
#   RM +security slice = per-room spatial bridge.
#   read_state.lens field describes handoff to the other tools.
###############################################################################

script:
  zen_dojotools_security_manager:
    alias: Zen DojoTools Security Manager
    mode: parallel
    max: 10
    description: >-
      zen_dojotools_security_manager (v5.2.0)
      CANONICAL alarm_control_panel domain tool. Security Manager lens — zone/panel
      state. Discovers panel via label:alarm_panel. Device tree walk (device_entities)
      finds all zones, system sensors, bypasses, chime — no hardcoded entity IDs.
      Zone contacts classified by device_class; fault+bypass paired by _fault/_bypass suffix.

      LENS PATTERN: You are in the security lens. read_state.cameras_by_area surfaces
      security_camera entities grouped by area_id — for visual analysis of any listed
      camera, use zen_dojotools_camera (camera lens). For per-room zone+camera spatial
      context use zen_dojotools_room_manager mode=get context_slices=+security.

      ACTIONS:
        read_state   (default) — Full snapshot: panel state, zones (open/fault/bypass),
          system health (AC, battery, fire, alarm, bell), keypad, chime, panic buttons,
          cameras_by_area (security_camera entities grouped by area_id), lens handoff note.
        query        — List all labeled panels with state.
        arm          — Arm the panel. arm_mode: away/home/night/vacation required.
        disarm       — Disarm the panel.
        get_policy   — Read _alert_policy from household cabinet security_manager drawer.
        set_alert_policy — Merge policy_patch (JSON) into _alert_policy. Partial update OK.

      Examples:
        Read:           {}
        Query:          { "action": "query" }
        Arm:            { "action": "arm", "arm_mode": "away" }
        Disarm:         { "action": "disarm" }
        Get policy:     { "action": "get_policy" }
        Set policy:     { "action": "set_alert_policy", "policy_patch": "{\"alarm_triggered\": {\"urgency\": 10}}" }

    icon: mdi:shield-home
    fields:
      action:
        name: Action
        description: read_state (default) | query | arm | disarm | get_policy | set_alert_policy
        required: false
        selector:
          select:
            options: [read_state, query, arm, disarm, get_policy, set_alert_policy]
        default: read_state

      policy_patch:
        name: Policy Patch
        description: >-
          JSON string of event_type → policy overrides. Required for set_alert_policy.
          Partial update — only provided keys are merged. Existing keys not in patch
          are preserved. Event types: alarm_triggered, alarm_pending, alarm_arm_away,
          alarm_arm_home, alarm_arm_night, alarm_disarm, panel_fault, smoke_co,
          door_open_armed, door_open_night, garage_open_armed, lock_unlocked_armed,
          lock_unlocked_night, lock_changed, person_detected_armed.
          Per-entry keys: urgency (1-10), notify (bool), channel_hint, title.
        required: false
        selector:
          text:

      arm_mode:
        name: Arm Mode
        description: Arming mode — required when action is arm
        required: false
        selector:
          select:
            options: [away, home, night, vacation]

      panel:
        name: Panel Entity
        description: >-
          alarm_control_panel entity_id override. Omit to auto-discover via
          label:alarm_panel.
        required: false
        selector:
          entity:
            domain: alarm_control_panel

      mode:
        description: "Pass tool_manifest to get self-description."
        required: false
        selector:
          select:
            options:
              - tool_manifest
              - kfc_manifest

      caller_token:
        name: Caller Token
        description: Opaque audit token echoed in response.
        required: false
        selector:
          text:

    sequence:

      - variables:
          _tm_check: "{{ mode | default('') | lower }}"
      - choose:
        - conditions: "{{ _tm_check == 'tool_manifest' }}"
          sequence:
          - variables:
              result: >-
                {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
                {{ MF.tool_manifest(
                    tool='zen_dojotools_security_manager',
                    display_name='Security Manager',
                    tier='dojotools',
                    version='1.0.0',
                    health={'configured': true, 'status': 'ok', 'notes': []},
                    required_labels=['dojotools', 'zen_kfc_provider'],
                    optional_labels=['security_manager', 'alarm'],
                    consumes=['lock_or_alarm'],
                    returns=['security_state'],
                    icon='mdi:shield-lock',
                    color='red',
                    stripe=3,
                    impact='soft',
                    mcp_exposed=true,

                    caller_token=caller_token | default('')
                ) | from_json | combine({'kfc_manifest': true, 'kfc_components': ['security_manager', 'security_perimeter', 'security_panel', 'security_cameras']}) }}
          - stop: tool_manifest
            response_variable: result
        - conditions: "{{ _tm_check == 'kfc_manifest' }}"
          sequence:
          - variables:
              _kfc_filter: "{{ component | default('') | string | trim | lower if component is defined else '' }}"
              _kfc_defs:
              - kata_key: security_manager
                friendly_name: Security Manager
                label: security_manager
                component_summary: ""
                component_instructions: >-
                  Synthesize unified home security picture. RM spatial snapshot is your ground truth — open with it, then layer events on top.
                  SEED OUTPUT (zen_dojotools_room_manager, mode=home_overview):
                    Spatial foundation: who is home, which rooms are occupied, which entry/exit
                    points (portals, doors, garage) are open or secured. Read this before
                    interpreting any event stream.

                  INPUT (supplemental context from coalescer — read these fields from event data):
                    panel_cache      — security_panel kata: panel_state, arming_mode, zones, system_health, urgency
                    perimeter_cache  — security_perimeter kata: door/lock/garage state transitions, urgency
                    camera_cache     — security_cameras kata: which cameras triggered, detected_subjects, activity_type, urgency
                    camera_analysis  — camera_manager kata: full LLM vision analysis (ready ~15-30s after trigger). May be absent — degrade gracefully.

                  STATE FIELD READING RULES — read state verbatim before assigning urgency:
                    perimeter_cache.state: locked   = door/lock is SECURED. Not a breach. Not open.
                    perimeter_cache.state: unlocked = door/lock is UNSECURED. May be noteworthy if armed.
                    perimeter_cache.state: on       = contact sensor OPEN (door/window physically open).
                    perimeter_cache.state: off      = contact sensor CLOSED (door/window physically closed/secured).
                    perimeter_cache.state: open     = cover (garage door) physically open.
                    perimeter_cache.state: closed   = cover (garage door) physically closed/secured.
                    NEVER infer open/breach from entity name or event type alone. Always read state field first.

                  EVENT DIRECTION — last_event tells you what HAPPENED, state tells you what IS:
                    last_event: lock_*_locked   = lock transitioned TO locked = SECURING action. Urgency 0 unless other signals.
                    last_event: lock_*_unlocked = lock transitioned TO unlocked = OPENING action. Noteworthy if armed.
                    last_event: door_*_on       = door opened.
                    last_event: door_*_off      = door closed.
                    last_event: garage_open     = garage door opened.
                    last_event: garage_closed   = garage door closed/secured.
                    A securing event (locked, closed, off) while armed = panel doing its job. Not an alert.

                  SPATIAL COMPOUND INFERENCE:
                    Cross-reference RM state with event streams before assigning urgency.
                    Person outside + house occupied: lower urgency than person outside + house vacant.
                    Door opened + occupant in adjacent room: likely known; door opened + vacant house: suspicious.
                    Alarm triggered + RM shows occupant in that zone + known time of day: likely false trigger.
                    Alarm triggered + zone vacant + camera_analysis confirms presence: high-confidence real event.

                  CAMERA ABSENT MODE:
                    If camera_cache and camera_analysis are both empty or missing: proceed with RM + panel + perimeter.
                    Explicitly note "Assessing from spatial state + panel + perimeter (cameras unavailable)."
                    Flag ambiguous events as "unable to visually confirm" — confidence is lower, say so.

                  SYNTHESIS RULES:
                    Open with RM spatial snapshot: who is home, what is open or secured.
                    Highest urgency from any sub-component drives rollup urgency after cross-domain adjustment.
                    Safety-class events (triggered, unknown intruder) always override all other signals.
                    If a sub-component cache is missing or stale (>15 min): note it, proceed with available data.

                  ALERT POLICY: household cabinet -> security_manager drawer -> _alert_policy.
                    If unavailable: apply default escalation rules below.

                  DOOR OPEN POLICY:
                    If panel_armed=false AND door has been open < 2 min: urgency 0, not message-worthy. Drop.
                    If panel_armed=false AND door open >= 2 min: urgency 3 (climate/animals/weather). Note only.
                    If panel_armed=true AND any door/contact OPEN (state=on): urgency 7+. Treat as perimeter breach.
                    If panel_armed=true AND lock UNLOCKED (state=unlocked): urgency 5. Unsecured entry point.
                    If panel_armed=true AND lock LOCKED (state=locked): urgency 0. Securing event — not an alert.
                    garage_entry_door lock state=locked while armed = normal. urgency 0.

                  ESCALATION:
                    Panel triggered: urgency 10. action_required. suggested_act_event: zen_dojotools_postman.
                    Unknown person + armed_away: urgency 8. suggested_act_event: zen_dojotools_postman.
                    Perimeter breach while armed (door/contact open): urgency 7. suggested_act_event: zen_dojotools_postman.
                    Lock unlocked while armed: urgency 5. note, no postman unless camera confirms presence.
                    Door open >= 2 min while disarmed: urgency 3. note only, no postman.
                    urgency < 5: suggested_act_event: null.

                  MASTER SWITCH: input_boolean.security_manager. If OFF: urgency 0, no escalation, no postman.
                  OUTPUT: spatial_context, panel_state, perimeter_summary, camera_summary, combined_urgency, suggested_act_event.
                  NOMINAL: "Security nominal. [who is home]. Panel disarmed. Perimeter secure. Cameras clear."
                  ALERT: "Security [warn|critical]: [specific issue]. [spatial context]. [sub-component detail]."
                trigger_subscriptions:
                - force_summary
                - daily_midnight
                drift_threshold: 5
                emission_cooldown_minutes: 60
                delay_seconds: 0
                suggested_act_event: null
                seed:
                  tool: zen_dojotools_room_manager
                  params:
                    mode: home_overview
                master_switch: input_boolean.security_manager
                index_call:
                  domain_inspect_domains: []
                  domain_inspect_limit: 25
                  expand_entities: false
                  filter_json: {}
                  label_1: security_manager
                  label_2: ""
                  operator: AND
                  output_fields: ""
                meta:
                  enabled: true
                  requires:
                    cert: ""
                    level: 0

              - kata_key: security_perimeter
                component_key: security_perimeter
                parent_component_key: security_manager
                primary_index_key: security_perimeter
                friendly_name: Security Perimeter
                label: security_manager
                version: "1.0.1"
                component_summary: >-
                  Monitors perimeter entry points — doors (front/back), locks (front/back/garage entry),
                  and garage covers — with security-context filtering (panel armed or Night mode).
                component_instructions: >-
                  Synthesize perimeter entry point state in security context.

                  DATA ACCESS (label: security_manager, filter for door/lock/cover domains):
                    Doors: front, back — open/closed
                    Locks: front door, back door, garage entry — locked/unlocked
                    Garage covers: main garage, secondary — open/closed
                    Context: panel arm state, home mode from review_data

                  SECURITY CONTEXT RULES:
                    armed_away: any unlocked lock or open door → deviation, urgency ≥ 6.
                    armed_home: garage entry unlocked or cover open → deviation.
                    night/sleep mode: front/back unlocked → flag at urgency 4.
                    disarmed, occupant home: garage entry unlocked → informational only (urgency 1).

                  URGENCY:
                    Door physically open while armed_away → 8.
                    Lock unlocked while armed_away → 6.
                    Garage cover open at night or armed → 5.
                    Unlocked entry, disarmed, no occupancy context → 2.
                    All entry points secure → 0.

                  OUTPUT: door_states {open/closed}, lock_states {locked/unlocked}, garage_state, security_context, urgency.
                  NOMINAL: "Perimeter secure. All doors locked. Garage closed."
                tool: ""
                trigger_subscriptions:
                - security_perimeter
                drift_threshold: 5
                emission_cooldown_minutes: 60
                delay_seconds: 0
                suggested_act_event: null
                master_switch: ""
                more_info: ""
                schedules: []
                custom_trigger_override: []
                component_group:
                  component_key: security_perimeter
                  parent_component_key: security_manager
                  primary_index_key: security_perimeter
                  shared_delay_seconds: 0
                  shared_labelset: []
                  shared_schedule_group: ""
                  shared_trigger_subscriptions: []
                index_call:
                  label_1: security_manager
                  label_2: ""
                  operator: AND
                  domain_inspect_domains: []
                  domain_inspect_limit: 25
                  expand_entities: false
                  filter_json: {}
                  output_fields: ""
                meta:
                  enabled: true
                  published_from: security_perimeter
                  requires:
                    cert: ""
                    level: 0

              - kata_key: security_panel
                component_key: security_panel
                parent_component_key: security_manager
                primary_index_key: security_panel
                friendly_name: Security Panel
                label: security_manager
                version: "1.0.1"
                component_summary: >-
                  Monitors DSC alarm panel state — arm/disarm transitions, triggered/pending states,
                  zone faults, and system health (AC, battery, fire).
                component_instructions: >-
                  Synthesize DSC alarm panel state for the home security subsystem.

                  DATA ACCESS (label: security_manager, filter for alarm/panel domain):
                    alarm_control_panel.home_alarm: disarmed / armed_home / armed_away / triggered / pending
                    Panel zones: individual zone open/fault sensors
                    System health: AC power, battery, fire zone states

                  STATES:
                    disarmed — nominal occupancy. Not a deviation unless zones faulted.
                    armed_home — perimeter + interior excluded. Occupants inside.
                    armed_away — full arm, no occupants expected. Any zone fault = deviation.
                    triggered — CRITICAL. Immediate escalation regardless of mode.
                    pending — entry delay countdown. Escalate if countdown completes without disarm.

                  URGENCY:
                    triggered → 10. Always action_required.
                    pending → 8.
                    armed_away + zone fault → 7.
                    armed_home + interior zone fault → 6.
                    AC loss or battery fault → 4.
                    disarmed + zone fault → 2.
                    All nominal → 0.

                  OUTPUT: panel_state, arm_mode, active_zones (any faulted), system_health {ac, battery, fire}, urgency.
                  NOMINAL: "Panel disarmed. All zones clear. System health nominal."
                tool: ""
                trigger_subscriptions:
                - security_panel
                drift_threshold: 5
                emission_cooldown_minutes: 60
                delay_seconds: 0
                suggested_act_event: null
                master_switch: ""
                more_info: ""
                schedules: []
                custom_trigger_override: []
                component_group:
                  component_key: security_panel
                  parent_component_key: security_manager
                  primary_index_key: security_panel
                  shared_delay_seconds: 0
                  shared_labelset: []
                  shared_schedule_group: ""
                  shared_trigger_subscriptions: []
                index_call:
                  label_1: security_manager
                  label_2: ""
                  operator: AND
                  domain_inspect_domains: []
                  domain_inspect_limit: 25
                  expand_entities: false
                  filter_json: {}
                  output_fields: ""
                meta:
                  enabled: true
                  published_from: security_panel
                  requires:
                    cert: ""
                    level: 0

              - kata_key: security_cameras
                component_key: security_cameras
                parent_component_key: security_manager
                primary_index_key: security_cameras
                friendly_name: Security Cameras
                label: security_manager
                version: "1.0.1"
                component_summary: >-
                  Synthesizes camera activity from the camera_manager pipeline — receives
                  camera_scan_complete events and produces a security-context camera status summary.
                component_instructions: >-
                  Synthesize camera activity scan results in security context.

                  DATA SOURCE: camera_cache supplemental context (passed by trigger coalescer).
                    Fields: last_event, label, cameras (list), panel_state, home_mode, ts.
                    Camera scene detail: cross-reference camera_manager kata from sensor.zenos_kata_cabinet.

                  ACTIVITY CLASSIFICATION (from camera_cache label field):
                    cadence — routine scan, no event trigger. Urgency 0 unless anomaly found.
                    motion_trigger — motion detected. Classify subject from camera_manager kata.
                    person_detected — identify: known resident, delivery, unknown person.

                  SECURITY ESCALATION:
                    Unknown person at entry point, panel armed_away → urgency 8.
                    Unknown person after hours (22:00–06:00) → urgency 6.
                    Person at garage/back entry, home occupied → urgency 3 (verify).
                    Known resident activity, any mode → urgency 1.
                    Cadence scan, no subjects → urgency 0.

                  Cross-reference panel_state and home_mode for mode-aware escalation.
                  If camera_manager kata unavailable: use camera_cache label/cameras as best effort.

                  OUTPUT: cameras_scanned [], detected_subjects [], activity_type, threat_assessment, urgency.
                  NOMINAL: "Cameras clear. Routine scan. No subjects detected."
                tool: ""
                trigger_subscriptions:
                - security_cameras
                drift_threshold: 5
                emission_cooldown_minutes: 60
                delay_seconds: 0
                suggested_act_event: null
                master_switch: ""
                more_info: ""
                schedules: []
                custom_trigger_override: []
                component_group:
                  component_key: security_cameras
                  parent_component_key: security_manager
                  primary_index_key: security_cameras
                  shared_delay_seconds: 0
                  shared_labelset: []
                  shared_schedule_group: ""
                  shared_trigger_subscriptions: []
                index_call:
                  label_1: security_manager
                  label_2: ""
                  operator: AND
                  domain_inspect_domains: []
                  domain_inspect_limit: 25
                  expand_entities: false
                  filter_json: {}
                  output_fields: ""
                meta:
                  enabled: true
                  published_from: security_cameras
                  requires:
                    cert: ""
                    level: 0

          - variables:
              _kfc_out: >-
                {%- if _kfc_filter == '' -%}
                  {{ _kfc_defs }}
                {%- else -%}
                  {{ _kfc_defs | selectattr('kata_key', 'equalto', _kfc_filter) | list }}
                {%- endif -%}
              result:
                status: ok
                tool: zen_dojotools_security_manager
                version: "5.2.0"
                mode: kfc_manifest
                kfc: "{{ _kfc_out }}"
                count: "{{ _kfc_out | length }}"
                caller_token: "{{ caller_token | default('') }}"
          - stop: kfc_manifest
            response_variable: result
      # ── Normalize inputs ──────────────────────────────────────────────────
      - variables:
          _action: "{{ action | default('read_state', true) | lower | trim }}"
          _token: "{{ caller_token | default('', true) }}"
          _panel_input: "{{ panel | default('', true) | trim }}"
          _arm_mode: "{{ arm_mode | default('', true) | lower | trim }}"
          _policy_patch: "{{ policy_patch | default('', true) | trim }}"

      # ── QUERY — list all labeled panels ──────────────────────────────────
      - if:
          - condition: template
            value_template: "{{ _action == 'query' }}"
        then:
          - variables:
              _panels: >-
                {%- set ns = namespace(panels=[]) -%}
                {%- for eid in label_entities('alarm_panel') -%}
                  {%- if eid.startswith('alarm_control_panel.') -%}
                    {%- set ns.panels = ns.panels + [{
                      "entity_id": eid,
                      "name": state_attr(eid, 'friendly_name') | default(eid, true),
                      "state": states(eid)
                    }] -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.panels }}
          - variables:
              result:
                ok: true
                tool: zen_dojotools_security_manager
                caller_token: "{{ _token }}"
                action: query
                panels: "{{ _panels }}"
                count: "{{ _panels | length }}"
          - stop: query
            response_variable: result

      # ── GET_POLICY — read _alert_policy from household cabinet ────────────
      - if:
          - condition: template
            value_template: "{{ _action == 'get_policy' }}"
        then:
          - variables:
              _hh_cab: "{{ states('sensor.zen_default_household_cabinet_resolved') }}"
              _hh_vars: >-
                {{ state_attr(_hh_cab, 'variables') | default({}, true) }}
              _sm_drawer: "{{ _hh_vars.get('security_manager', {}) }}"
              _policy_val: >-
                {%- set d = _sm_drawer -%}
                {%- set d = d.get('value', d) if d is mapping else {} -%}
                {{ d.get('_alert_policy', {}) }}
          - variables:
              result:
                ok: true
                tool: zen_dojotools_security_manager
                caller_token: "{{ _token }}"
                action: get_policy
                policy: "{{ _policy_val }}"
                source: household_cabinet/security_manager/_alert_policy
          - stop: get_policy
            response_variable: result

      # ── SET_ALERT_POLICY — merge patch into _alert_policy ─────────────────
      - if:
          - condition: template
            value_template: "{{ _action == 'set_alert_policy' }}"
        then:
          - if:
              - condition: template
                value_template: "{{ _policy_patch == '' }}"
            then:
              - variables:
                  result:
                    ok: false
                    tool: zen_dojotools_security_manager
                    caller_token: "{{ _token }}"
                    error: missing_policy_patch
                    message: policy_patch (JSON string) is required for set_alert_policy.
              - stop: error
                response_variable: result
          - variables:
              _hh_cab: "{{ states('sensor.zen_default_household_cabinet_resolved') }}"
              _hh_vars: >-
                {{ state_attr(_hh_cab, 'variables') | default({}, true) }}
              _sm_drawer: "{{ _hh_vars.get('security_manager', {}) }}"
          - variables:
              _sm_val: >-
                {%- set d = _sm_drawer -%}
                {{ d.get('value', d) if d is mapping else {} }}
              _current_policy: "{{ _sm_val.get('_alert_policy', {}) }}"
              _patch: "{{ _policy_patch | from_json }}"
          - variables:
              _new_policy: "{{ _current_policy | combine(_patch, recursive=true) }}"
              _new_val: "{{ _sm_val | combine({'_alert_policy': _new_policy}) }}"
          - action: script.zen_dojotools_filecabinet
            data:
              action_type: update
              volume_entity_id: ["{{ _hh_cab }}"]
              key: security_manager
              value: "{{ _new_val | tojson }}"
              caller_token: "{{ _token }}/security_manager_set_policy"
            response_variable: _fc_result
          - variables:
              result:
                ok: true
                tool: zen_dojotools_security_manager
                caller_token: "{{ _token }}"
                action: set_alert_policy
                policy: "{{ _new_policy }}"
                event_types_patched: "{{ _patch | list }}"
          - stop: set_alert_policy
            response_variable: result

      # ── Discover panel entity ─────────────────────────────────────────────
      - variables:
          _panel_entity: >-
            {%- if _panel_input != '' -%}
              {{ _panel_input }}
            {%- else -%}
              {%- set ns = namespace(found='') -%}
              {%- for eid in label_entities('alarm_panel') -%}
                {%- if ns.found == '' and eid.startswith('alarm_control_panel.') -%}
                  {%- set ns.found = eid -%}
                {%- endif -%}
              {%- endfor -%}
              {{ ns.found }}
            {%- endif -%}

      # ── Validate panel ────────────────────────────────────────────────────
      - if:
          - condition: template
            value_template: "{{ _panel_entity == '' }}"
        then:
          - variables:
              result:
                ok: false
                tool: zen_dojotools_security_manager
                caller_token: "{{ _token }}"
                error: no_panel_found
                message: >-
                  No alarm_control_panel entity found with label:alarm_panel.
                  Apply the label or pass a panel entity_id directly.
          - stop: error
            response_variable: result

      - if:
          - condition: template
            value_template: "{{ states(_panel_entity) in ['unknown', 'unavailable'] }}"
        then:
          - variables:
              result:
                ok: false
                tool: zen_dojotools_security_manager
                caller_token: "{{ _token }}"
                error: panel_unavailable
                entity_id: "{{ _panel_entity }}"
                state: "{{ states(_panel_entity) }}"
          - stop: error
            response_variable: result

      # ── ARM ───────────────────────────────────────────────────────────────
      - if:
          - condition: template
            value_template: "{{ _action == 'arm' }}"
        then:
          - if:
              - condition: template
                value_template: "{{ _arm_mode not in ['away','home','night','vacation'] }}"
            then:
              - variables:
                  result:
                    ok: false
                    tool: zen_dojotools_security_manager
                    caller_token: "{{ _token }}"
                    error: invalid_arm_mode
                    message: arm_mode must be away, home, night, or vacation.
                    received: "{{ _arm_mode }}"
              - stop: error
                response_variable: result
          - choose:
              - conditions: "{{ _arm_mode == 'away' }}"
                sequence:
                  - action: alarm_control_panel.alarm_arm_away
                    target: { entity_id: "{{ _panel_entity }}" }
              - conditions: "{{ _arm_mode == 'home' }}"
                sequence:
                  - action: alarm_control_panel.alarm_arm_home
                    target: { entity_id: "{{ _panel_entity }}" }
              - conditions: "{{ _arm_mode == 'night' }}"
                sequence:
                  - action: alarm_control_panel.alarm_arm_night
                    target: { entity_id: "{{ _panel_entity }}" }
              - conditions: "{{ _arm_mode == 'vacation' }}"
                sequence:
                  - action: alarm_control_panel.alarm_arm_vacation
                    target: { entity_id: "{{ _panel_entity }}" }
          - variables:
              result:
                ok: true
                tool: zen_dojotools_security_manager
                caller_token: "{{ _token }}"
                action: arm
                arm_mode: "{{ _arm_mode }}"
                entity_id: "{{ _panel_entity }}"
                state: "{{ states(_panel_entity) }}"
          - stop: armed
            response_variable: result

      # ── DISARM ────────────────────────────────────────────────────────────
      - if:
          - condition: template
            value_template: "{{ _action == 'disarm' }}"
        then:
          - action: alarm_control_panel.alarm_disarm
            target: { entity_id: "{{ _panel_entity }}" }
          - variables:
              result:
                ok: true
                tool: zen_dojotools_security_manager
                caller_token: "{{ _token }}"
                action: disarm
                entity_id: "{{ _panel_entity }}"
                state: "{{ states(_panel_entity) }}"
          - stop: disarmed
            response_variable: result

      # ── READ_STATE — device tree walk ─────────────────────────────────────
      - variables:
          _panel_state: "{{ states(_panel_entity) }}"
          _panel_name: "{{ state_attr(_panel_entity, 'friendly_name') | default(_panel_entity, true) }}"
          _device_id: "{{ device_id(_panel_entity) }}"

      - variables:
          _all: "{{ device_entities(_device_id) | list }}"

      # ── Zone contacts — classified by device_class, fault suffix excluded ─
      - variables:
          _zones: >-
            {%- set _zdc = ['door','window','motion','opening','vibration','gas','heat','smoke','moisture','presence'] -%}
            {%- set ns = namespace(zones=[]) -%}
            {%- for eid in _all -%}
              {%- if eid.startswith('binary_sensor.') and not eid.endswith('_fault') -%}
                {%- set _dc = state_attr(eid, 'device_class') | default('', true) -%}
                {%- if _dc in _zdc -%}
                  {%- set _base = eid.split('.')[1] -%}
                  {%- set _f = 'binary_sensor.' ~ _base ~ '_fault' -%}
                  {%- set _b = 'switch.' ~ _base ~ '_bypass' -%}
                  {%- set _s = states(eid) -%}
                  {%- set ns.zones = ns.zones + [{
                    "entity_id": eid,
                    "name": state_attr(eid, 'friendly_name') | default(_base | replace('_',' ') | title, true),
                    "type": _dc,
                    "state": _s,
                    "open": _s == 'on',
                    "fault": states(_f) == 'on' if _f in _all else false,
                    "bypassed": states(_b) == 'on' if _b in _all else false,
                    "fault_entity": _f if _f in _all else none,
                    "bypass_entity": _b if _b in _all else none
                  }] -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.zones }}

      # ── System health binary sensors (not zone contacts, not fault suffix) ─
      - variables:
          _sys: >-
            {%- set _zdc = ['door','window','motion','opening','vibration','gas','heat','smoke','moisture','presence'] -%}
            {%- set ns = namespace(sys=[]) -%}
            {%- for eid in _all -%}
              {%- if eid.startswith('binary_sensor.') and not eid.endswith('_fault') -%}
                {%- set _dc = state_attr(eid, 'device_class') | default('', true) -%}
                {%- if _dc not in _zdc -%}
                  {%- set _st = states(eid) -%}
                  {%- set _nm = state_attr(eid, 'friendly_name') | default(eid, true) -%}
                  {%- if _dc == 'power' -%}
                    {%- set _ok = _st == 'on' -%}
                    {%- set _interp = 'AC power present' if _ok else 'AC power lost' -%}
                  {%- elif _dc == 'battery' -%}
                    {%- set _ok = _st == 'off' -%}
                    {%- set _interp = 'battery OK' if _ok else 'battery low' -%}
                  {%- elif _dc == 'problem' -%}
                    {%- set _ok = _st == 'off' -%}
                    {%- set _interp = 'no problem' if _ok else 'problem detected' -%}
                  {%- elif 'ready' in eid -%}
                    {%- set _ok = _st == 'on' -%}
                    {%- set _interp = 'panel ready' if _ok else 'panel not ready' -%}
                  {%- elif 'alarm' in eid and 'panel' not in eid -%}
                    {%- set _ok = _st == 'off' -%}
                    {%- set _interp = 'no alarm active' if _ok else 'alarm active' -%}
                  {%- else -%}
                    {%- set _ok = true -%}
                    {%- set _interp = _st -%}
                  {%- endif -%}
                  {%- set ns.sys = ns.sys + [{
                    "entity_id": eid,
                    "name": _nm,
                    "state": _st,
                    "device_class": _dc,
                    "ok": _ok,
                    "interpretation": _interp
                  }] -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.sys }}

      # ── Chime, keypad, panic buttons ──────────────────────────────────────
      - variables:
          _chime: >-
            {%- set ns = namespace(v='') -%}
            {%- for eid in _all -%}
              {%- if ns.v == '' and eid.startswith('switch.') and '_chime' in eid -%}
                {%- set ns.v = eid -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.v }}
          _keypad: >-
            {%- set ns = namespace(v='') -%}
            {%- for eid in _all -%}
              {%- if ns.v == '' and eid.startswith('sensor.') -%}
                {%- set ns.v = eid -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.v }}
          _panic: >-
            {%- set ns = namespace(b=[]) -%}
            {%- for eid in _all -%}
              {%- if eid.startswith('button.') -%}
                {%- set ns.b = ns.b + [eid] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.b }}

      # ── Derive open / fault / bypass summaries ────────────────────────────
      - variables:
          _open: >-
            {%- set ns = namespace(r=[]) -%}
            {%- for z in _zones -%}
              {%- if z.open -%}{%- set ns.r = ns.r + [z.name] -%}{%- endif -%}
            {%- endfor -%}
            {{ ns.r }}
          _faulted: >-
            {%- set ns = namespace(r=[]) -%}
            {%- for z in _zones -%}
              {%- if z.fault -%}{%- set ns.r = ns.r + [z.name] -%}{%- endif -%}
            {%- endfor -%}
            {{ ns.r }}
          _bypassed: >-
            {%- set ns = namespace(r=[]) -%}
            {%- for z in _zones -%}
              {%- if z.bypassed -%}{%- set ns.r = ns.r + [z.name] -%}{%- endif -%}
            {%- endfor -%}
            {{ ns.r }}

      # ── Camera discovery (by area) ────────────────────────────────────────
      - variables:
          _cameras_by_area: >-
            {%- set _all_cams = label_entities('security_camera') -%}
            {%- set ns = namespace(r={}) -%}
            {%- for eid in _all_cams -%}
              {%- set _aid = area_id(eid) | default('', true) -%}
              {%- if _aid != '' -%}
                {%- set _existing = ns.r.get(_aid, []) -%}
                {%- set ns.r = ns.r | combine({_aid: _existing + [eid]}) -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.r }}

      # ── Assemble result ───────────────────────────────────────────────────
      - variables:
          result: >-
            {{
              {
                "ok": true,
                "tool": "zen_dojotools_security_manager",
                "caller_token": _token,
                "action": "read_state",
                "panel": {
                  "entity_id": _panel_entity,
                  "name": _panel_name,
                  "state": _panel_state
                },
                "summary": {
                  "zone_count": _zones | length,
                  "open_zones": _open,
                  "faulted_zones": _faulted,
                  "bypassed_zones": _bypassed,
                  "system_ok": (_sys | selectattr('ok', 'eq', false) | list | length) == 0,
                  "system_issues": _sys | selectattr('ok', 'eq', false) | map(attribute='name') | list
                },
                "zones": _zones,
                "system": _sys,
                "chime": {
                  "entity_id": _chime if _chime != '' else none,
                  "state": states(_chime) if _chime != '' else 'n/a'
                },
                "keypad": {
                  "entity_id": _keypad if _keypad != '' else none,
                  "state": states(_keypad) if _keypad != '' else 'n/a'
                },
                "panic_buttons": _panic,
                "cameras_by_area": _cameras_by_area,
                "lens": "Security Manager lens — zone/panel state. zen_dojotools_camera for visual analysis per camera entity (camera lens). zen_dojotools_room_manager +security slice for per-room spatial context."
              }
            }}
      - stop: read_state
        response_variable: result
