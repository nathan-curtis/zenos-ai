###############################################################################
# ZenOS-AI DojoTools: Scheduler
# Version: 5.7.1
# v5.7.1: the core trigger pack's version is 5.7.1 (it was still 5.4.0, so the registry
#   never re-registered), and its force_summary entry says force is maintenance only;
#   summary_request and supersummary_request are targeted events, not subscriptions, so
#   they are not in the pack.
# v5.7.0: SuperSummary cadence and the cold start (force is maintenance only).
#   - The rollup runs on quarter_hour (hourly, noon and midnight land on one), ha_start and
#     a component's supersummary_request (new trigger; the Ninja sends it when urgency
#     reaches drift_threshold). A run no longer starts it just because it dispatched a
#     component, which piled several launches onto every :00 and :30.
#   - A request skips the launcher's burst wait (its kata is already written). The gap
#     between rollups is SuperSummary's own governor (super_burnout_seconds, default 300);
#     a request inside it is dropped and the next tick picks the change up.
#   - Cold start: on ha_start, an enabled, non-cache component with no kata at all is
#     admitted with the subscribers (same gates and spacing). Replaces Flynn's boot force.
#   - A targeted summary_request runs without the component's declared delay, as the
#     forced refresh it replaces did (trigger packs move to summary_request).
# v5.6.4: reverts 5.6.3. force_summary is special-purpose maintenance; a targeted force
#   again admits only a component that subscribes to it. New trigger summary_request
#   (zen_event kind summary_request, component named): a routine request that admits the
#   named component through the normal gates (tier shed, depth gate, its own delay), with
#   no force bypass. The drain router uses it (Dispatcher 5.6.6).
# v5.6.3: a targeted force_summary (component named) admits that component whether or
#   not it subscribes to force_summary. The subscription check is for the untargeted
#   broadcast; applied to a targeted force it silently dropped the request, so the drain
#   router (and any tool) could never recover a component without the subscription.
# v5.6.2: each heartbeat run records pressure (at admission), shed_tier (dropped by the
#   per-tier rule) and shed_depth (dropped by the depth gate) next to dispatched. Record
#   only; no behavior change.
# v5.6.1: ha_start launches are spaced 30 s apart (the larger of a component's declared
#   delay and its slot). After the 5.6.0 split a boot filled the Ninja (5/5, 8 more pending)
#   and launches past max were dropped. Paired with Ninja max 10 (Ninja 5.9.2).
# v5.6.0 (#10732 item 5, the Abbot split): the Scheduler is admission only. It decides who
#   runs (subscriptions, tiers, shed rules, depth gate) and hands each admitted component
#   to zen_abbot_launch (new, parallel, not MCP-exposed), which sleeps the component's
#   delay, reads its prior kata and starts the Ninja. SuperSummary's wait for the Ninja
#   burst and the heartbeat's wait for an idle FileCabinet moved there too. A scheduler
#   run no longer holds its queue slot through delays, kata reads or those waits. The
#   force_identity_manifest trigger is gone: it had no branch here (Dispatcher handles
#   identity_manifest_rebuild) and woke the queue for nothing, four times a second at times.
# v5.5.0 (#10732): the scheduler is the cognitive queue only.
#   Housekeeping (deferred reloads, Manifest, Identity Manifest, Compact Index, GC,
#   display expiry, resolver refresh, Rolodex scans) moves to its own automation, Zen
#   DojoTools Housekeeping. Leak / alarm / smoke-CO-gas triggers move to Zen Safety Admit
#   (parallel, no depth gate, no delay), which launches their subscribed components'
#   Ninja runs at once. The depth gate sheds only keeper/ambient subscribers: system and
#   super are never shed by depth (it used to stop the whole pass). max_exceeded is
#   declared on all three (drops log a warning; recovery stays self-calculated).
# v5.4.2: housekeeping jobs are independent (#10732). They shared one first-match choose, so
#   ha_start / daily_midnight ran only the Manifest (Identity Manifest, Compact Index and the
#   resolver refresh never ran from here) and quarter_hour only FileCabinet GC (display session
#   expiry, the resolver refresh and both Rolodex stay checks never ran; display expiry and the
#   stay checks have no other caller). Each job is now its own if, started as its own run.
# v5.4.1: the core trigger pack registers inline, in the run that wants it, not through
#   an event the queued scheduler could only handle after that run. The quarter-hour
#   run that dispatches Ninja and SuperSummary takes minutes, so the self-heal landed
#   about 3 minutes after the tick. The registration branch
#   now runs for the trigger_pack_register event (other packs) or for the core pack in
#   the same run; only the event run stops after it.
# v5.4.0: print_done. A 3D print ends: the Bambu Lab integration fires
#   bambu_lab_event with type event_print_finished or event_print_failed, and
#   either one is the trigger id print_done (registered in the core pack, idle
#   until a KFC subscribes; Print Shop subscribes when its job_end_summary
#   setting is on). The dispatch loop is unchanged.
# v5.3.3: the quarter-hour self-heal also re-registers the core pack when the
#   registry holds an older zenos_core version, not only when it holds none.
#   A start-time registration that does not land after an upgrade no longer
#   leaves new triggers missing from the registry until
#   the next automation reload. The pack version is set once.
# v5.3.2: label trigger alarm_panel: an alarm panel labeled alarm_panel (the
#   label Security Manager already finds panels by) goes to triggered. Alert
#   Manager subscribed to alarm_panel, but no stock trigger carried that id,
#   so it never fired. Only triggered fires it, not arming or disarming.
# v5.3.1: the trigger registry heals itself. The core pack also registers
#   on the quarter-hour tick when the registry has no zenos_core entry: a
#   fresh install registers at start before Flynn has built the system
#   cabinet, and a cabinet reset empties it, and either one left the
#   registry empty until the next restart. A registration that arrives
#   while the system cabinet is not resolved is logged, not written.
# v5.3.0: trigger registry (C). The system cabinet drawer zen_trigger_registry
#   lists every trigger a KFC can subscribe to: {packs, triggers: {id: {pack,
#   fires, frequency, labels, dispatch}}}. A pack registers by firing zen_event
#   kind trigger_pack_register {pack, version, triggers}; this scheduler merges
#   it (a pack's registration replaces its own entries) and only accepts it
#   from automation context, never from a user or agent call. The core pack
#   registers at start and after an automation reload. New standard
#   label-driven triggers (purpose triggers, target label_id): zen_leak
#   (moisture.detected), zen_smoke (air_quality smoke/co/gas detected),
#   zen_door (door/window opened/closed), zen_power (power below 1 W for 30 s:
#   a fed circuit went dead), zen_appliance (power above 10 W, or below 3 W
#   for 2 min: started / finished). Each is idle until an entity carries its
#   label.
# v5.2.7: the deferred script reload and reload_all rebuild the cert catalog
#   cache (identity cert_cache_refresh, forced) once the reload is done.
# v5.2.6: each subscriber sleeps only the gap since the previous one
#   (delay_seconds is an offset from the trigger and the list is sorted by
#   it). The loop slept every delay in turn, so a home_mode_updates pass with
#   7 subscribers held the queued scheduler about 6 minutes and everything
#   behind it waited, the deferred script reload included.
#
# v5.2.5: the cabinets and gc calls name their mode explicitly.
# v5.2.4: stuck-run guard stops a summarizer that has run over 15 minutes so the
#   next dispatch can start; the daily anchors bypass the queue-depth gate.
# v5.2.3: the 24h events[] prune compares timestamps, so a stored time
#   without a UTC offset no longer fails the comparison against now().
# v5.2.2 (#10553): the vacuum purpose triggers target label_id: autovac
#   instead of a specific entity.
# v5.2.1: events[] entries older than 24h are dropped from a kata's prior-run
#   context before it is fed forward as last_kata_summary. GC expires whole
#   drawers only, so without this a self-authored event could be echoed
#   forward indefinitely. A template-level filter on each event's timestamp,
#   not a prompt instruction.
#
# Automations:
#   Zen DojoTools Scheduler — time/event orchestrator for the Dojo system
#
# MIGRATED FROM: automations.yaml (2026-03-05)
# REFACTORED (4.1.0, 2026-03-10):
#   - Ninja Summarizer dispatch is now Dojo-driven (loop replaces 10 hardcoded
#     choose branches). Components register trigger_subscriptions + delay_seconds
#     in their Dojo drawer via zen_dojotools_scribe.
#   - Manifest, SuperSummary, FileCabinet GC remain as explicit choose branches.
#   - Custom triggers: copy zenos_ai/docs/examples/zen_dojotools_scheduler_custom.yaml
#     to your HA config, fill in your entity IDs, and subscribe components via
#     trigger_subscriptions in their KFC drawer — no changes to this file needed.
#
# DEPENDS ON:
#   script.zen_dojotools_inspect      (dojotools_index.yaml)
#   script.zen_dojotools_ninja_summarizer (dojotools_summarizers.yaml)
#   Zen Dojo Cabinet                  (label: Zen Dojo Cabinet)
#   Zen Kata Cabinet                  (label: Zen Kata Cabinet)
###############################################################################

automation:

  - id: '1758324323797'
    alias: Zen DojoTools Scheduler
    description: >-
      Zen DojoTools Scheduler (4.3.0). Handles activation of time, custom event,
      and state event triggers for the ZenOS-AI system. Ninja Summarizer dispatch
      is Dojo-driven: add trigger_subscriptions to a KFC drawer to subscribe.
      Manifest, SuperSummary, FileCabinet GC, Guest Arrival Prep Scan, and
      Guest Checkout Nudge Scan (2026-08-19, Steel Magnolia hospitality)
      remain explicit branches.
    triggers:
    - trigger: time
      # Offset 60s past exact midnight (2026-09-17, #10458) -- quarter_hour,
      # hourly_trigger, and every_10_minutes all land at exactly 00:00:00 too
      # (time_pattern triggers with no seconds field default to :00 seconds).
      # Colliding with this trigger's own heavy upstream branches (Manifest,
      # Identity Manifest, Compact Index) pushed queue_depth to 5-6 for
      # ~3.5min, starving the queue_depth<5 Ninja dispatch gate. Offsetting
      # gives the three ambient triggers time to clear the queue first.
      at: '00:01:00'
      weekday:
      - sat
      - fri
      - thu
      - wed
      - tue
      - mon
      - sun
      id: daily_midnight
    - trigger: time_pattern
      minutes: /15
      id: quarter_hour
    - trigger: homeassistant
      event: start
      id: ha_start
    - trigger: time_pattern
      hours: /1
      id: hourly_trigger
    - trigger: state
      entity_id:
      - sensor.zen_home_mode
      not_from:
      - unavailable
      - unknown
      to:
      for:
        seconds: 5
      id: home_mode_updates
    - alias: When zone.home count changes
      trigger: state
      entity_id:
      - zone.home
      id: home_occupancy_change
      to:
      not_from:
      - unknown
      - unavailable
    # Purpose-trigger pair for the vacuum's cleaning lifecycle. target
    # supports label_id directly (HA purpose-specific triggers accept
    # entity/device/area/floor/label targets) -- labeled to autovac, no
    # entity hardcode, portable to any install/vacuum count. Dormant until
    # something actually subscribes: the dispatch loop below only acts on
    # trigger IDs present in a KFC drawer's trigger_subscriptions list, so
    # these are currently harmless no-ops.
    - trigger: vacuum.started_cleaning
      target:
        label_id: autovac
      id: vacuum_started
    - trigger: vacuum.returned_to_dock
      target:
        label_id: autovac
      id: vacuum_docked
    - trigger: persistent_notification
      update_type:
      - added
      - removed
      - updated
      notification_id: persistent_notification_updated
      id: persistent_notification
    - trigger: state
      entity_id:
      - group.all_doors
      not_to:
      - unknown
      - unavailable
      not_from:
      - unknown
      - unavailable
      for:
        seconds: 15
      id: door_opens_or_closes
    - trigger: state
      entity_id:
      - group.all_locks
      not_to:
      - unknown
      - unavailable
      not_from:
      - unknown
      - unavailable
      for:
        seconds: 15
      id: lock_changes
    - trigger: state
      entity_id:
      - input_select.zen_home_mode
      to: Home-Wake
      id: start_home_wake
    - trigger: state
      entity_id:
      - input_select.zen_home_mode
      to: Home-Evening
      id: start_home_evening
    - trigger: time
      at: '12:00:00'
      weekday:
      - sat
      - fri
      - thu
      - wed
      - tue
      - mon
      - sun
      id: daily_noon
    - trigger: state
      entity_id:
      - group.all_windows
      not_to:
      - unknown
      - unavailable
      not_from:
      - unknown
      - unavailable
      id: window_opens_or_closes
    - trigger: state
      entity_id:
      - group.garage_doors
      not_to:
      - unknown
      - unavailable
      not_from:
      - unknown
      - unavailable
      id: garage_door
    - trigger: time_pattern
      minutes: /10
      id: every_10_minutes
      enabled: true
    - trigger: event
      event_type: zen_event
      id: force_summary
      event_data:
        event:
          kind: summary_force
      alias: 'Zen Event: Force Summary (component)'
    # Routine request (5.6.4): run the named component through the normal gates (tier
    # shed, depth gate, its own delay). force_summary is special-purpose maintenance
    # and keeps its bypasses; routine callers (the drain router) send this instead.
    - trigger: event
      event_type: zen_event
      id: summary_request
      event_data:
        event:
          kind: summary_request
      alias: 'Zen Event: Summary Request (component)'
    # A component asks for the rollup (5.7.0): the Ninja sends it when a run's urgency
    # reaches the component's drift_threshold. SuperSummary's own minimum gap
    # (super_burnout_seconds) drops it if a rollup ran recently; the next quarter-hour
    # tick picks the change up.
    - trigger: event
      event_type: zen_event
      id: supersummary_request
      event_data:
        event:
          kind: supersummary_request
      alias: 'Zen Event: SuperSummary Request (component decided)'
    - trigger: event
      event_type: zen_event
      id: force_ninja
      event_data:
        event:
          kind: ninja_force
      alias: 'Zen Event: Force Ninja Summarizer (all KFCs, skip SuperSummary)'
    - trigger: event
      event_type: zen_event
      id: force_supersummary
      event_data:
        event:
          kind: supersummary_force
      alias: 'Zen Event: Force SuperSummary only (skip Ninja dispatch)'
    - trigger: event
      event_type: zen_event
      id: trigger_pack_register
      event_data:
        event:
          kind: trigger_pack_register
      alias: 'Zen Event: a trigger pack registers its triggers'
    - trigger: event
      event_type: automation_reloaded
      id: trigger_registry_refresh
      alias: 'Automations reloaded: register the core triggers again'
    # ── Standard label-driven triggers: idle until an entity carries the label
    - trigger: door.opened
      target:
        label_id: zen_door
      id: zen_door
      alias: 'zen_door: a door opens'
    - trigger: door.closed
      target:
        label_id: zen_door
      id: zen_door
      alias: 'zen_door: a door closes'
    - trigger: window.opened
      target:
        label_id: zen_door
      id: zen_door
      alias: 'zen_door: a window opens'
    - trigger: window.closed
      target:
        label_id: zen_door
      id: zen_door
      alias: 'zen_door: a window closes'
    - trigger: power.crossed_threshold
      target:
        label_id: zen_power
      options:
        threshold:
          type: below
          value:
            number: 1
            unit_of_measurement: "W"
        for: "00:00:30"
      id: zen_power
      alias: 'zen_power: a fed circuit went dead (below 1 W for 30 s)'
    - trigger: power.crossed_threshold
      target:
        label_id: zen_appliance
      options:
        threshold:
          type: above
          value:
            number: 10
            unit_of_measurement: "W"
      id: zen_appliance
      alias: 'zen_appliance: an appliance started (above 10 W)'
    - trigger: power.crossed_threshold
      target:
        label_id: zen_appliance
      options:
        threshold:
          type: below
          value:
            number: 3
            unit_of_measurement: "W"
        for: "00:02:00"
      id: zen_appliance
      alias: 'zen_appliance: an appliance finished (below 3 W for 2 min)'
    # A 3D print ends. HA has no purpose trigger for printers, so this listens
    # for the Bambu Lab integration's own event. Idle until a KFC subscribes.
    - trigger: event
      event_type: bambu_lab_event
      event_data:
        type: event_print_finished
      id: print_done
      alias: 'print_done: a Bambu Lab print finished'
    - trigger: event
      event_type: bambu_lab_event
      event_data:
        type: event_print_failed
      id: print_done
      alias: 'print_done: a Bambu Lab print failed'
    actions:

    # ── Capture run start time for duration tracking ─────────────────────────
    - variables:
        _run_start_ts: "{{ now().isoformat() }}"

    # ── Trigger registry (C) ─────────────────────────────────────────────────
    # The core pack registers at start and after an automation reload, and
    # on the quarter-hour tick whenever the registry has no zenos_core entry
    # (fresh install, cabinet reset) or holds an older zenos_core version
    # (an upgrade whose start-time registration did not land). The list sits
    # here, next to the triggers it describes.
    - variables:
        _core_pack_version: "5.7.1"
    - variables:
        _core_register_raw: >-
            {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
            {%- if trigger.id in ['ha_start', 'trigger_registry_refresh'] -%}true
            {%- elif trigger.id == 'quarter_hour' -%}
              {%- set _sc = states('sensor.zen_system_cabinet_resolved') -%}
              {%- set r = CABS.cabinet_drawer_value(_sc, 'zen_trigger_registry', {}) | from_json({}) if _sc.startswith('sensor.') else {} -%}
              {%- set packs = r.get('packs', {}) if r is mapping and r.get('packs') is mapping else {} -%}
              {%- set _core = packs.get('zenos_core') if packs.get('zenos_core') is mapping else {} -%}
              {{- _sc.startswith('sensor.') and ('zenos_core' not in packs or ((_core.get('version') or '') | string) != _core_pack_version) -}}
            {%- else -%}false{%- endif -%}
        _core_pack_triggers:
          daily_midnight: {fires: "every day at 00:01", frequency: daily}
          daily_noon: {fires: "every day at 12:00", frequency: daily}
          hourly_trigger: {fires: "every hour", frequency: hourly}
          quarter_hour: {fires: "every 15 minutes", frequency: minutes}
          every_10_minutes: {fires: "every 10 minutes", frequency: minutes}
          ha_start: {fires: "when Home Assistant starts", frequency: event}
          home_mode_updates: {fires: "when the home mode changes", frequency: event}
          home_occupancy_change: {fires: "when the number of people home changes", frequency: event}
          start_home_wake: {fires: "when the home mode becomes Home-Wake", frequency: daily}
          start_home_evening: {fires: "when the home mode becomes Home-Evening", frequency: daily}
          vacuum_started: {fires: "when an autovac-labeled vacuum starts cleaning", frequency: event, labels: [autovac]}
          vacuum_docked: {fires: "when an autovac-labeled vacuum returns to its dock", frequency: event, labels: [autovac]}
          persistent_notification: {fires: "when a persistent notification is updated", frequency: event}
          door_opens_or_closes: {fires: "when group.all_doors changes (legacy; prefer zen_door)", frequency: event}
          window_opens_or_closes: {fires: "when group.all_windows changes (legacy; prefer zen_door)", frequency: event}
          lock_changes: {fires: "when group.all_locks changes", frequency: event}
          garage_door: {fires: "when group.garage_doors changes", frequency: event}
          force_summary: {fires: "maintenance only (zen_event summary_force): runs its subscribers past the normal gates. Routine refreshes use summary_request (targeted at one component, not a subscription)", frequency: event}
          zen_leak: {fires: "when a leak sensor labeled zen_leak detects water", frequency: event, labels: [zen_leak]}
          alarm_panel: {fires: "when an alarm panel labeled alarm_panel is triggered", frequency: event, labels: [alarm_panel]}
          zen_smoke: {fires: "when a sensor labeled zen_smoke detects smoke, carbon monoxide or gas", frequency: event, labels: [zen_smoke]}
          zen_door: {fires: "when a door or window labeled zen_door opens or closes", frequency: event, labels: [zen_door]}
          zen_power: {fires: "when a power sensor labeled zen_power drops below 1 W for 30 s (a fed circuit went dead)", frequency: event, labels: [zen_power]}
          zen_appliance: {fires: "when a power sensor labeled zen_appliance goes above 10 W (started) or below 3 W for 2 min (finished)", frequency: event, labels: [zen_appliance]}
          print_done: {fires: "when a Bambu Lab print finishes or fails (the integration's bambu_lab_event)", frequency: event}
    - variables:
        _core_register: "{{ (_core_register_raw | string | trim | lower) == 'true' }}"

    # A pack's registration replaces its own entries. Accepted only from
    # automation context: a user or agent call (context.user_id set) cannot
    # write the registry.
    - if: "{{ trigger.id == 'trigger_pack_register' or _core_register }}"
      then:
        - variables:
            # The core pack is written inline, in this run: an event fired here would
            # queue behind this run (the scheduler is queued) and land minutes late.
            _tr_ev: >-
              {{ {'pack': 'zenos_core', 'version': _core_pack_version, 'triggers': _core_pack_triggers}
                 if trigger.id != 'trigger_pack_register'
                 else (trigger.event.data.get('event', {}) if trigger.event.data is mapping else {}) }}
            _tr_from_automation: "{{ true if trigger.id != 'trigger_pack_register' else ((trigger.event.context.user_id | default(none)) is none) }}"
            _tr_cab: "{{ states('sensor.zen_system_cabinet_resolved') }}"
        - variables:
            _tr_pack: "{{ (_tr_ev.get('pack') or '') | string | slugify }}"
            _tr_new: >-
              {%- set t = _tr_ev.get('triggers', {}) -%}
              {{ t if t is mapping else {} }}
        - if: "{{ _tr_from_automation and _tr_pack != '' and _tr_new | count > 0 and _tr_cab.startswith('sensor.') }}"
          then:
            - variables:
                _tr_reg: >-
                  {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}
                  {%- set r = CABS.cabinet_drawer_value(states('sensor.zen_system_cabinet_resolved'), 'zen_trigger_registry', {}) | from_json({}) -%}
                  {%- set r = r if r is mapping else {} -%}
                  {%- set packs = r.get('packs', {}) if r.get('packs') is mapping else {} -%}
                  {%- set trig = r.get('triggers', {}) if r.get('triggers') is mapping else {} -%}
                  {%- set ns = namespace(t={}) -%}
                  {%- for k, v in trig.items() if (v.get('pack') if v is mapping else '') != _tr_pack -%}
                    {%- set ns.t = ns.t | combine({k: v}) -%}
                  {%- endfor -%}
                  {%- for k, v in _tr_new.items() -%}
                    {%- set e = v if v is mapping else {} -%}
                    {%- set ns.t = ns.t | combine({(k | string | slugify): {
                        'pack': _tr_pack,
                        'fires': (e.get('fires') or '') | string,
                        'frequency': ((e.get('frequency') or 'event') | string | lower) if ((e.get('frequency') or 'event') | string | lower) in ['continuous', 'minutes', 'hourly', 'daily', 'event'] else 'event',
                        'labels': (e.get('labels') if (e.get('labels') is sequence and e.get('labels') is not string) else []),
                        'dispatch': ((e.get('dispatch') or 'subscribe') | string | lower)}}) -%}
                  {%- endfor -%}
                  {{ {'packs': packs | combine({_tr_pack: {'version': (_tr_ev.get('version') or '') | string, 'registered_at': now().isoformat()}}),
                      'triggers': ns.t,
                      'note': 'Every trigger a KFC can subscribe to. Packs register themselves (zen_event trigger_pack_register); the scheduler writes this drawer.'} }}
            - action: script.zen_admintools_cabinet_writer
              continue_on_error: true
              data:
                mode: set
                volume_entity: "{{ states('sensor.zen_system_cabinet_resolved') }}"
                key: zen_trigger_registry
                value: "{{ _tr_reg }}"
                caller: zen_dojotools_scheduler
                reason: "trigger pack {{ _tr_pack }} registered"
          else:
            - action: system_log.write
              data:
                level: warning
                logger: zen_dojotools_scheduler
                message: >-
                  Trigger registry: ignored a registration (pack '{{ _tr_pack }}',
                  {{ _tr_new | count }} triggers): {{ 'not from automation context' if not _tr_from_automation
                  else ('the system cabinet is not resolved yet; the quarter-hour tick retries' if not _tr_cab.startswith('sensor.')
                  else 'no pack name or no triggers') }}.
        - if: "{{ trigger.id == 'trigger_pack_register' }}"
          then:
            - stop: trigger_pack_registered

    - if: "{{ trigger.id == 'trigger_registry_refresh' }}"
      then:
        - stop: trigger_registry_refresh_queued

    # Stuck-run guard: a model backend that stops answering mid-call leaves
    # ai_task waiting forever, and the summarizer never takes another run.
    # Normal runs take seconds (cloud) to a few minutes (local), so a run
    # older than 15 minutes is stuck: stop it so the next dispatch can start.
    - repeat:
        for_each:
          - script.zen_dojotools_supersummary
          - script.zen_dojotools_ninja_summarizer
        sequence:
          - if: >-
              {%- set _lt = state_attr(repeat.item, 'last_triggered') -%}
              {{ is_state(repeat.item, 'on') and _lt is not none
                 and (now() - _lt).total_seconds() > 900 }}
            then:
              - action: script.turn_off
                target:
                  entity_id: "{{ repeat.item }}"
              - action: system_log.write
                data:
                  level: warning
                  logger: zen_dojotools_scheduler
                  message: "Stuck-run guard stopped {{ repeat.item }} (running since {{ state_attr(repeat.item, 'last_triggered') }})"

    # ── Pre-fetch home overview ──────────────────────────────────────────────
    - action: script.zen_dojotools_inspect
      metadata: {}
      data:
        entity_id:
        - sensor.home_overview
        timeout: 30
      response_variable: home_overview

    # ── Extract zen_event component + schedule (for targeted force_summary) ──
    # NOTE: trigger.event is a raw HA Event object, not a Mapping — it has no
    # .get() method. Its .data attribute IS a plain dict. Bug fixed 2026-07-25:
    # the old code guarded on `ev is mapping` (always false for a real Event),
    # so data always fell through to None and force_c was ALWAYS '' — every
    # scoped summary_force (component: room_manager, etc.) silently dispatched
    # the full component fleet instead of just the intended one.
    - variables:
        zen_event_component: >-
          {%- set ev   = trigger.get('event') if trigger is mapping else None -%}
          {%- set data = ev.data if ev is not none else None -%}
          {%- set comp = data.get('event', {}).get('component') if data is mapping else None -%}
          {{ comp | default('', true) }}
        zen_event_schedule: >-
          {%- set ev   = trigger.get('event') if trigger is mapping else None -%}
          {%- set data = ev.data if ev is not none else None -%}
          {%- set sched = data.get('event', {}).get('schedule') if data is mapping else None -%}
          {{ sched | default('', true) | slugify }}

    # ── Dojo-driven Ninja Summarizer dispatch ────────────────────────────────
    # Reads all KFC drawers from the Dojo cabinet. Filters to those whose
    # trigger_subscriptions include the current trigger.id. For force_summary
    # with a zen_event_component set, only that component runs.
    # delay_seconds is skipped for force_summary / force_ninja (urgent path).
    # force_ninja remaps to ha_start scope — runs only boot-sequence KFCs.
    # force_supersummary skips this block entirely (gated by if above).
    # Pipeline tier filtering: ambient blocked on fast triggers; under pressure,
    # keeper/ambient shed according to zen_scheduler_config thresholds. super and
    # system tiers never shed and always dispatch with zero delay -- system carries
    # core platform health, the signal most needed when the queue is already under
    # pressure, so it gets the same priority treatment as super.
    - variables:
        _household_cab: "{{ states('sensor.zen_default_household_cabinet_resolved') }}"
        _queue_depth: "{{ states('sensor.zen_scheduler_queue_depth') | int(0) }}"
    - variables:
        _shed_ambient_at: >-
          {%- set _hv = state_attr(_household_cab, 'variables') | default({}, true) -%}
          {%- set _r  = _hv.get('zen_scheduler_config', {}) if _hv is mapping else {} -%}
          {%- set _v  = _r.get('value', _r) if _r is mapping else {} -%}
          {%- set _v  = (_v | from_json) if _v is string else _v -%}
          {{ (_v.get('shed_ambient_at', 4) if _v is mapping else 4) | int(4) }}
        _shed_keeper_at: >-
          {%- set _hv = state_attr(_household_cab, 'variables') | default({}, true) -%}
          {%- set _r  = _hv.get('zen_scheduler_config', {}) if _hv is mapping else {} -%}
          {%- set _v  = _r.get('value', _r) if _r is mapping else {} -%}
          {%- set _v  = (_v | from_json) if _v is string else _v -%}
          {{ (_v.get('shed_keeper_at', 8) if _v is mapping else 8) | int(8) }}
    - variables:
        _dojo_cab: "{{ states('sensor.zen_dojo_cabinet_resolved') }}"
        _kata_cab: "{{ states('sensor.zen_kata_cabinet_resolved') }}"
        _force_component: "{{ zen_event_component | default('', true) | slugify }}"
        _protected: "['AI_Cabinet_VolumeInfo', 'kfc_template', 'zen_library_manifest', 'zen_identity_manifest', '_context']"
        _subscribers: >-
          {%- set dojo_vars = state_attr(_dojo_cab, 'variables') | default({}, true) -%}
          {%- if _dojo_cab in ['unknown', 'unavailable'] or _kata_cab in ['unknown', 'unavailable'] -%}
            {{ [] }}
          {%- else -%}
            {%- set _raw_trig = trigger.id | default('') -%}
            {%- set trig_id   = 'ha_start' if _raw_trig == 'force_ninja' else _raw_trig -%}
            {%- set force_c   = zen_event_component | default('', true) | slugify -%}
            {%- set force_s   = zen_event_schedule   | default('', true) | slugify -%}
            {%- set protected = ['AI_Cabinet_VolumeInfo', 'kfc_template', 'zen_library_manifest', 'zen_identity_manifest', '_context'] -%}
            {%- set kata_vars = state_attr(_kata_cab, 'variables') | default({}, true) -%}
            {%- set ns = namespace(subs=[]) -%}
            {%- for key, drawer in dojo_vars.items() -%}
              {%- if not key.startswith('_') and key not in protected -%}
                {%- set val = drawer.get('value', drawer) if drawer is mapping else {} -%}
                {%- if val is mapping -%}
                  {%- set sub_list  = val.get('trigger_subscriptions', []) -%}
                  {#- summary_request names one component and admits it whether or not it
                      subscribes, through the normal gates below (5.6.4). -#}
                  {#- Cold start (5.7.0): on ha_start, an enabled component drawer that is not a
                      cache slot and has no kata at all (fresh install, reset, wiped kata) is
                      admitted too, through the same gates and spacing as the subscribers. -#}
                  {%- set _cold = trig_id == 'ha_start'
                        and ('kata_key' in val or 'trigger_subscriptions' in val)
                        and (val.get('role', '') | string | lower) != 'cache'
                        and ((val.get('meta') if val.get('meta') is mapping else {}).get('enabled', true) | string | lower) not in ['false', 'off', '0']
                        and kata_vars.get(val.get('kata_key') or key) is none -%}
                  {%- set subscribed = trig_id in sub_list or (trig_id == 'summary_request' and force_c != '' and force_c == key) or _cold -%}
                  {%- set targeted   = force_c == '' or force_c == key -%}
                  {%- set _tier      = val.get('pipeline_tier', 'keeper') | lower -%}
                  {%- set _eff_delay = 0 if _tier in ['super', 'system'] else val.get('delay_seconds', 0) | int(0) -%}
                  {%- set _forced    = trig_id == 'force_summary' and force_c != '' -%}
                  {%- set _shed = not _forced and (
                      (_tier == 'ambient' and (trig_id in ['quarter_hour', 'every_10_minutes'] or _queue_depth | int(0) >= _shed_ambient_at | int(4)))
                      or
                      (_tier not in ['super', 'system', 'ambient'] and _queue_depth | int(0) >= _shed_keeper_at | int(8))
                  ) -%}
                  {%- if subscribed and targeted and not _shed -%}
                    {%- set schedules = val.get('schedules', []) -%}
                    {%- if schedules | length > 0 and force_s != '' -%}
                      {# targeted sub-schedule run — expand matching schedule only #}
                      {%- for sched in schedules -%}
                        {%- set sched_key = sched.get('kata_key', '') | slugify -%}
                        {%- if force_s == sched_key -%}
                          {%- set ns.subs = ns.subs + [val | combine({
                            '_drawer_key':          key,
                            'kata_key':             sched_key,
                            '_index_call_override': sched.get('index_call', {}),
                            '_parent_component':    key,
                            'delay_seconds':        _eff_delay
                          })] -%}
                        {%- endif -%}
                      {%- endfor -%}
                    {%- elif schedules | length > 0 and force_s == '' and force_c == '' -%}
                      {# time-based trigger — expand all schedules #}
                      {%- for sched in schedules -%}
                        {%- set sched_key = sched.get('kata_key', '') | slugify -%}
                        {%- set ns.subs = ns.subs + [val | combine({
                          '_drawer_key':          key,
                          'kata_key':             sched_key,
                          '_index_call_override': sched.get('index_call', {}),
                          '_parent_component':    key,
                          'delay_seconds':        _eff_delay
                        })] -%}
                      {%- endfor -%}
                    {%- elif schedules | length > 0 and force_c == key and force_s == '' -%}
                      {# force_summary on parent with no schedule — run top-level component #}
                      {%- set ns.subs = ns.subs + [val | combine({'_drawer_key': key, 'delay_seconds': _eff_delay})] -%}
                    {%- else -%}
                      {# no schedules — normal single subscriber #}
                      {%- set ns.subs = ns.subs + [val | combine({'_drawer_key': key, 'delay_seconds': _eff_delay})] -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.subs | sort(attribute='delay_seconds') }}
          {%- endif -%}

    # ── Compute per-call timeout from recent run history ────────────────────
    # Reads zen_scheduler kata recent_runs, derives avg seconds/component.
    # Timeout = max(2 * avg, 120). Falls back to 240s until history exists.
    - variables:
        _sched_prev_runs: >-
          {%- set cab = state_attr(_kata_cab, 'variables') | default({}, true) -%}
          {%- set drawer = cab.get('zen_scheduler', {}) if cab is mapping else {} -%}
          {%- set val = drawer.get('value', drawer) if drawer is mapping else {} -%}
          {%- set parsed = (val | from_json(none)) if val is string and val | trim not in ['', 'null'] else (val if val is mapping else none) -%}
          {{ (parsed.get('recent_runs', []) if parsed is mapping else []) | list }}
        _ninja_timeout: >-
          {%- set hist = _sched_prev_runs if _sched_prev_runs is iterable and _sched_prev_runs is not string else [] -%}
          {%- set ns = namespace(total=0, n=0) -%}
          {%- for r in hist -%}
            {%- if r is mapping and (r.get('duration_seconds', 0) | int(0)) > 0 and (r.get('count', 0) | int(0)) > 0 -%}
              {%- set ns.total = ns.total + (r.duration_seconds | int) / (r.count | int(1)) -%}
              {%- set ns.n = ns.n + 1 -%}
            {%- endif -%}
          {%- endfor -%}
          {%- set _raw = [((ns.total / ns.n) if ns.n > 0 else 120) * 2, 60] | max -%}
          {{ [_raw, 120] | min | int }}

    # The depth gate sheds frequent ticks when the queue backs up. The daily
    # anchors fire once with no retry (and midnight always lands in a burst),
    # so they always dispatch; shedding them leaves a component a day stale.
    # system and super subscribers are never shed by depth (5.5.0): the gate
    # used to stop the whole pass, their tier's no-shed rule included.
    # Who the per-tier shed rule dropped this run (record only, 5.6.2): the same
    # rule the subscriber build applies, kept for the heartbeat.
    - variables:
        _tier_shed: >-
          {%- set dojo_vars = state_attr(_dojo_cab, 'variables') | default({}, true) -%}
          {%- set trig_id = 'ha_start' if trigger.id == 'force_ninja' else trigger.id | default('') -%}
          {%- set force_c = zen_event_component | default('', true) | slugify -%}
          {%- set ns = namespace(k=[]) -%}
          {%- if trig_id != 'force_summary' or force_c == '' -%}
            {%- for key, drawer in (dojo_vars if dojo_vars is mapping else {}).items() if not key.startswith('_') -%}
              {%- set val = drawer.get('value', drawer) if drawer is mapping else {} -%}
              {%- if val is mapping and (trig_id in (val.get('trigger_subscriptions', []) or []) or (trig_id == 'summary_request' and force_c != '' and force_c == key)) and (force_c == '' or force_c == key) -%}
                {%- set _tier = val.get('pipeline_tier', 'keeper') | lower -%}
                {%- if (_tier == 'ambient' and (trig_id in ['quarter_hour', 'every_10_minutes'] or _queue_depth | int(0) >= _shed_ambient_at | int(4)))
                       or (_tier not in ['super', 'system', 'ambient'] and _queue_depth | int(0) >= _shed_keeper_at | int(8)) -%}
                  {%- set ns.k = ns.k + [val.get('kata_key') or key] -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endif -%}
          {{ ns.k }}
    - variables:
        _admitted: >-
          {%- if _queue_depth | int(0) < 5 or trigger.id in ['daily_midnight', 'daily_noon'] -%}
            {{ _subscribers }}
          {%- else -%}
            {{ _subscribers | selectattr('pipeline_tier', 'defined') | selectattr('pipeline_tier', 'in', ['super', 'system', 'SUPER', 'SYSTEM']) | list }}
          {%- endif -%}
    - if: >-
        {{ trigger.id != 'force_supersummary' and _admitted | count > 0 }}
      then:
        # Admission only (5.6.0, the Abbot): each admitted component goes to its own
        # zen_abbot_launch run, which sleeps the component's delay, reads its prior
        # kata and starts the Ninja. The queue slot is free in seconds instead of
        # being held through every delay gap and kata read.
        - repeat:
            for_each: "{{ _admitted }}"
            sequence:
              - action: script.turn_on
                continue_on_error: true
                target:
                  entity_id: script.zen_abbot_launch
                data:
                  variables:
                    job: ninja
                    component: "{{ repeat.item.kata_key | default(repeat.item._drawer_key) }}"
                    # ha_start: every component wakes at once and the Ninja runs one at a
                    # time, so a boot burst overflowed its queue. Space them 30 s apart
                    # (the larger of the declared delay and the slot) (5.6.1).
                    delay_seconds: >-
                      {%- set _d = repeat.item.delay_seconds | default(0) | int(0) -%}
                      {#- A targeted request runs one component now, like an event-driven
                          refresh should; the declared delay spaces broadcast bursts (5.7.0). -#}
                      {%- if trigger.id in ['force_summary', 'force_ninja', 'summary_request'] -%}0
                      {%- elif trigger.id == 'ha_start' -%}{{ [_d, (repeat.index - 1) * 30] | max }}
                      {%- else -%}{{ _d }}{%- endif -%}
                    trigger_id: "{{ trigger.id | default('') }}"
                    trigger_platform: "{{ trigger.platform | default('') }}"
                    index_call_override: >-
                      {%- set _ov = repeat.item._index_call_override | default({}) -%}
                      {{ _ov | tojson if _ov else '' }}
                    parent_component: "{{ repeat.item._parent_component | default('', true) }}"

    # ── Conditional SuperSummary — fires after ninjas, not before ────────────
    - variables:
        # Cadence (5.7.0): the rollup runs every quarter hour (hourly, noon and midnight
        # land on one), at boot, and when a component asks (supersummary_request).
        # A run no longer starts it just because it dispatched something.
        _always_super: >-
          {{ trigger.id in ['force_supersummary', 'ha_start', 'quarter_hour', 'supersummary_request'] }}
        _should_super: "{{ _always_super }}"
    - if: "{{ _should_super }}"
      then:
        - variables:
            supplemental_prompt: >-
              {{
                {
                  "source": {"id": trigger.id | default(''), "platform": trigger.platform | default('')},
                  "home_overview": home_overview | default({}),
                  "notes": "Don't comment about the state of the component's master switch or script. Comment only on the items the component manages. Please ignore when you perform summarization."
                } | tojson
              }}
        # The launcher waits for the Ninja burst (current < 2, 30 s ceiling) outside
        # this queue, then starts SuperSummary.
        - action: script.turn_on
          continue_on_error: true
          target:
            entity_id: script.zen_abbot_launch
          data:
            variables:
              job: supersummary
              payload: '{{ supplemental_prompt }}'
              # A component's request comes after its kata is written: no burst wait.
              wait_burst: "{{ trigger.id != 'supersummary_request' }}"

    # ── Scheduler heartbeat ─────────────────────────────────────────────────
    # Built here; the launcher waits for FileCabinet to be idle (parallel Ninja
    # kata writes can race it) and writes it, outside this queue.
    - variables:
        trigger_entity_id: >-
          {%- if 'from_state' in trigger and trigger.from_state -%}
            {{ trigger.from_state.entity_id }}
          {%- elif 'to_state' in trigger and trigger.to_state -%}
            {{ trigger.to_state.entity_id }}
          {%- elif 'entity_id' in trigger -%}
            {{ trigger.entity_id }}
          {%- endif -%}
        this_trigger: >-
          {{
            {
              "id":        trigger.id | default('unknown'),
              "platform":  trigger.platform | default('manual'),
              "entity_id": trigger_entity_id
            }
          }}
        _dispatched_keys: >-
          {{ _admitted | default([]) | map(attribute='kata_key') | list }}
        _this_run: >-
          {{
            {
              "ts":               now().isoformat(),
              "trigger":          this_trigger | default({}),
              "dispatched":       _dispatched_keys,
              "count":            _dispatched_keys | length,
              "super":            _should_super | default(false) | bool,
              "duration_seconds": (now() - (_run_start_ts | as_datetime)).total_seconds() | int,
              "pressure":         _queue_depth | int(0),
              "shed_tier":        _tier_shed | default([]),
              "shed_depth":       ((_subscribers | default([])) | map(attribute='kata_key') | reject('in', (_admitted | default([])) | map(attribute='kata_key') | list) | list) if trigger.id != 'force_supersummary' else []
            }
          }}
        _prev_runs: >-
          {%- set raw = states(_kata_cab) -%}
          {%- set cab = state_attr(_kata_cab, 'variables') | default({}) -%}
          {%- set drawer = cab.get('zen_scheduler', {}) -%}
          {%- set val = drawer.get('value', drawer) if drawer is mapping else {} -%}
          {%- set parsed = (val | from_json(none)) if val is string and val | trim not in ['', 'null'] else (val if val is mapping else none) -%}
          {%- set hist = parsed.get('recent_runs', []) if parsed is mapping else [] -%}
          {{ hist | list }}
        _recent_runs: >-
          {%- set prev = _prev_runs if _prev_runs is iterable and _prev_runs is not string else [] -%}
          {{ ([_this_run] + prev)[:5] }}
        final_response: >-
          {{
            {
              "status":       "success",
              "trigger":      this_trigger | default({}),
              "dispatched":   _dispatched_keys,
              "recent_runs":  _recent_runs | default([])
            } | tojson
          }}
    - action: script.turn_on
      continue_on_error: true
      target:
        entity_id: script.zen_abbot_launch
      data:
        variables:
          job: heartbeat
          payload: '{{ final_response }}'

    # ── Fire health tick — unblocks trigger-based health sensors ────────────
    - event: zen_health_tick

    mode: queued
    max: 15
    # Past max, HA drops the new run and logs a warning. Declared, not implied
    # (#10732): recovery is self-calculated (drain router, kata age).
    max_exceeded: warning

  # ===========================================================================
  # Zen DojoTools Housekeeping (5.5.0, #10732)
  # Maintenance jobs off the cognitive queue: deferred reloads (a script reload
  # no longer waits behind Ninja dispatch), Manifest, Identity Manifest, Compact
  # Index, FileCabinet GC, display session expiry, the resolver refresh and the
  # Rolodex stay scans. Each job starts as its own run.
  # ===========================================================================
  - id: zen_dojotools_housekeeping
    alias: Zen DojoTools Housekeeping
    description: >-
      Maintenance jobs on their own queue: deferred script / reload-all, Manifest,
      Identity Manifest, Compact Index, FileCabinet GC, display session expiry,
      resolver refresh, Rolodex stay scans. Moved out of the Scheduler (5.5.0).
    mode: queued
    max: 10
    max_exceeded: warning
    triggers:
    - trigger: time
      at: '00:01:00'
      id: daily_midnight
    - trigger: time_pattern
      minutes: /15
      id: quarter_hour
    - trigger: homeassistant
      event: start
      id: ha_start
    - trigger: event
      event_type: zen_event
      id: force_gc
      event_data:
        event:
          kind: gc_force
      alias: 'Zen Event: Force FileCabinet GC'
    - trigger: event
      event_type: zen_event
      id: deferred_script_reload
      event_data:
        event:
          kind: deferred_script_reload
      alias: 'Zen Event: Deferred Script Reload'
    - trigger: event
      event_type: zen_event
      id: deferred_reload_all
      event_data:
        event:
          kind: deferred_reload_all
      alias: 'Zen Event: Deferred Reload All'
    # ── Trigger registry (C) ───────────────────────────────────────────────
    actions:
    # ── Deferred reloads ──────────────────────────────────────────
    - choose:

      - conditions:
        - condition: trigger
          id: deferred_script_reload
        sequence:
        - action: script.reload
          data: {}
        # Tool manifests may have changed: rebuild the cert catalog cache.
        - action: script.turn_on
          target:
            entity_id: script.zen_dojotools_identity
          data:
            variables:
              mode: cert_cache_refresh
              force_refresh: true
        - stop: deferred_script_reload_complete
        alias: Deferred Script Reload

      - conditions:
        - condition: trigger
          id: deferred_reload_all
        sequence:
        - action: homeassistant.reload_all
          data: {}
        - action: script.turn_on
          target:
            entity_id: script.zen_dojotools_identity
          data:
            variables:
              mode: cert_cache_refresh
              force_refresh: true
        - stop: deferred_reload_all_complete
        alias: Deferred Reload All

    # ── Housekeeping (5.4.2) ─────────────────────────────────────────────────
    # Each job is its own `if`, started as its own run (script.turn_on): they used
    # to share one first-match choose, so ha_start / daily_midnight ran only the
    # Manifest and quarter_hour only FileCabinet GC; display session expiry, the
    # resolver refresh and the Rolodex stay checks never ran (#10732). A job that
    # fails or runs long holds up neither the others nor the Ninja dispatch below.
    - alias: Run the Manifest
      if:
      - condition: trigger
        id:
        - ha_start
        - daily_midnight
      then:
      - action: script.turn_on
        continue_on_error: true
        target:
          entity_id: script.zen_dojotools_manifest
        data:
          variables:
            mode: cabinets

    - alias: Run the Identity Manifest
      if:
      - condition: trigger
        id:
        - ha_start
        - daily_midnight
      then:
      - action: script.turn_on
        continue_on_error: true
        target:
          entity_id: script.zen_dojotools_identity
        data:
          variables:
            mode: build_identity_manifest

    - alias: Build Compact Index
      if:
      - condition: trigger
        id:
        - ha_start
        - daily_midnight
      then:
      - action: script.turn_on
        continue_on_error: true
        target:
          entity_id: script.zen_dojotools_index
        data:
          variables:
            mode: build_compact_index

    - alias: FileCabinet GC
      if:
      - condition: trigger
        id:
        - daily_midnight
        - quarter_hour
        - force_gc
      then:
      - action: script.turn_on
        continue_on_error: true
        target:
          entity_id: script.zen_dojotools_filecabinet_gc
        data:
          variables:
            mode: gc
            dry_run: false

    # Clears any display_session_* cabinet key idle 5+ minutes; see
    # dojotools_display.yaml mode=expire_sessions for the logic.
    - alias: Display Surface Session Expiry
      if:
      - condition: trigger
        id:
        - quarter_hour
      then:
      - action: script.turn_on
        continue_on_error: true
        target:
          entity_id: script.zen_dojotools_display
        data:
          variables:
            mode: expire_sessions

    - alias: Health Sensor Retrigger
      if:
      - condition: trigger
        id:
        - quarter_hour
        - ha_start
      then:
      - event: zen_resolver_refresh

    - alias: Guest Arrival Prep Scan
      if:
      - condition: trigger
        id:
        - quarter_hour
      then:
      - action: script.turn_on
        enabled: "{{ states('script.zen_dojotools_rolodex') in ['on', 'off'] }}"
        continue_on_error: true
        target:
          entity_id: script.zen_dojotools_rolodex
        data:
          variables:
            mode: stay_prep_check

    - alias: Guest Checkout Nudge Scan
      if:
      - condition: trigger
        id:
        - quarter_hour
      then:
      - action: script.turn_on
        enabled: "{{ states('script.zen_dojotools_rolodex') in ['on', 'off'] }}"
        continue_on_error: true
        target:
          entity_id: script.zen_dojotools_rolodex
        data:
          variables:
            mode: stay_checkout_check

  # ===========================================================================
  # Zen Safety Admit (5.5.0, #10732)
  # Leak, alarm and smoke/CO/gas events start the Ninja runs of the components
  # that subscribe to them straight away: no queue behind routine work, no depth
  # gate, no delay. The deterministic responders (leak watch, the panel,
  # Security) are separate automations; this is the agent's awareness of them.
  # ===========================================================================
  - id: zen_safety_admit
    alias: Zen Safety Admit
    description: >-
      Always-admit path for safety triggers (zen_leak, alarm_panel, zen_smoke):
      launches the Ninja for every KFC subscribed to the trigger id, with no
      depth gate and no delay.
    mode: parallel
    max: 10
    max_exceeded: warning
    triggers:
    - trigger: moisture.detected
      target:
        label_id: zen_leak
      id: zen_leak
      alias: 'zen_leak: a leak sensor detects water'
    - trigger: alarm_control_panel.triggered
      target:
        label_id: alarm_panel
      id: alarm_panel
      alias: 'alarm_panel: an alarm panel labeled alarm_panel is triggered'
    - trigger: air_quality.smoke_detected
      target:
        label_id: zen_smoke
      id: zen_smoke
      alias: 'zen_smoke: smoke detected'
    - trigger: air_quality.co_detected
      target:
        label_id: zen_smoke
      id: zen_smoke
      alias: 'zen_smoke: carbon monoxide detected'
    - trigger: air_quality.gas_detected
      target:
        label_id: zen_smoke
      id: zen_smoke
      alias: 'zen_smoke: gas detected'
    actions:
    - variables:
        _sa_dojo: "{{ states('sensor.zen_dojo_cabinet_resolved') }}"
        _sa_subs: >-
          {%- set dv = state_attr(_sa_dojo, 'variables') | default({}, true) if _sa_dojo not in ['', 'unknown', 'unavailable'] else {} -%}
          {%- set ns = namespace(s=[]) -%}
          {%- for key, drawer in dv.items() if not key.startswith('_') and key not in ['AI_Cabinet_VolumeInfo', 'kfc_template', 'zen_library_manifest', 'zen_identity_manifest'] -%}
            {%- set val = drawer.get('value', drawer) if drawer is mapping else {} -%}
            {%- if val is mapping and trigger.id in (val.get('trigger_subscriptions', []) or []) -%}{%- set ns.s = ns.s + [key] -%}{%- endif -%}
          {%- endfor -%}
          {{ ns.s }}
    - repeat:
        for_each: "{{ _sa_subs }}"
        sequence:
        - action: script.turn_on
          continue_on_error: true
          target:
            entity_id: script.zen_dojotools_ninja_summarizer
          data:
            variables:
              kung_fu_component_id: "{{ repeat.item }}"
              post_to_kata_cabinet: true
              supplemental_prompt: >-
                {{ {'source': {'id': trigger.id, 'platform': trigger.platform | default(''), 'entity_id': trigger.entity_id | default('')},
                    'current_local_time': now().strftime('%Y-%m-%d %H:%M %Z'), 'safety_event': true} | tojson }}

# =============================================================================
# zen_abbot_launch (Scheduler 5.6.0, #10732 item 5). NOT MCP-exposed.
# The Abbot (Zen DojoTools Scheduler) decides who runs; this starts the work so
# the scheduler's queue slot is free in seconds. One parallel run per job:
#   ninja         sleep the component's delay (an offset from the trigger), read
#                 its prior kata (24 h events pruned), start the Ninja
#   supersummary  wait for the Ninja burst (current < 2, 30 s ceiling), start it
#   heartbeat     wait for FileCabinet to be idle (60 s ceiling), write zen_scheduler
# =============================================================================
script:
  zen_abbot_launch:
    alias: Zen Abbot Launch
    description: >-
      Internal: started by the Zen DojoTools Scheduler (the Abbot) for each admitted
      component (job ninja), for SuperSummary (job supersummary) and for its
      heartbeat (job heartbeat). Not for direct calls.
    mode: parallel
    max: 40
    max_exceeded: warning
    fields:
      job:
        selector:
          text:
      component:
        selector:
          text:
      delay_seconds:
        selector:
          number:
            min: 0
            max: 3600
      trigger_id:
        selector:
          text:
      trigger_platform:
        selector:
          text:
      index_call_override:
        selector:
          text:
      parent_component:
        selector:
          text:
      payload:
        selector:
          text:
      wait_burst:
        selector:
          boolean:
    sequence:
    - variables:
        _al_job: "{{ job | default('', true) | string | lower | trim }}"
        _al_component: "{{ component | default('', true) | string | trim }}"
        _kata_cab: "{{ states('sensor.zen_kata_cabinet_resolved') }}"
    - if: "{{ _al_job == 'ninja' and _al_component != '' }}"
      then:
      - if: "{{ (delay_seconds | default(0) | int(0)) > 0 }}"
        then:
        - delay:
            seconds: "{{ delay_seconds | int(0) }}"
      - action: script.zen_sutra_filecabinet
        continue_on_error: true
        data:
          action_type: get
          show_hidden_volumes: false
          volume_entity_id:
          - "{{ _kata_cab }}"
          key: "{{ _al_component }}"
        response_variable: _iter_last_kata
      - variables:
          _iter_last_kata_pruned: >-
            {%- set _fc = _iter_last_kata if _iter_last_kata is mapping else (_iter_last_kata | from_json({}) if _iter_last_kata is string else {}) -%}
            {%- set _r = (_fc or {}).get('result', {}) -%}
            {%- set _r = _r if _r is mapping else (_r | from_json({}) if _r is string else {}) -%}
            {%- set _kkey = _al_component -%}
            {%- set _raw = _r.get(_kkey, _fc) -%}
            {%- set _raw = _raw if _raw is mapping else (_raw | from_json({}) if _raw is string else {}) -%}
            {%- set _val = _raw.get('value', _raw) -%}
            {%- set _val = _val if _val is mapping else (_val | from_json({}) if _val is string else {}) -%}
            {%- set _events = _val.get('events', []) -%}
            {%- set _events = _events if _events is sequence and _events is not string else [] -%}
            {%- set _cutoff_ts = (now() - timedelta(hours=24)).timestamp() -%}
            {%- set _ns = namespace(kept=[]) -%}
            {%- for _e in _events -%}
              {%- set _ts_raw = (_e.get('timestamp', '') if _e is mapping else '') -%}
              {%- set _ts = as_datetime(_ts_raw) if _ts_raw else none -%}
              {#- as_datetime() returns naive when _ts_raw lacks a tz
                 offset, which crashes the aware/naive compare below --
                 compare via .timestamp() instead, same fix as the
                 _zen_priority_inject expiry check (dojotools_core.yaml). -#}
              {%- if _ts is not none and _ts.timestamp() >= _cutoff_ts -%}
                {%- set _ns.kept = _ns.kept + [_e] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ _raw | combine({'value': _val | combine({'events': _ns.kept})}) }}
      - action: script.turn_on
        continue_on_error: true
        target:
          entity_id: script.zen_dojotools_ninja_summarizer
        data:
          variables:
            kung_fu_component_id: "{{ _al_component }}"
            post_to_kata_cabinet: true
            supplemental_prompt: >-
              {%- set _p = {
                "source":             {"id": trigger_id | default(''), "platform": trigger_platform | default('')},
                "current_local_time": now().strftime('%Y-%m-%d %H:%M %Z'),
                "last_kata_summary":  _iter_last_kata_pruned | default({})
              } | tojson -%}
              {{ _p[:50000] }}
            index_call_override: "{{ index_call_override | default('', true) }}"
            parent_component_id: "{{ parent_component | default('', true) }}"
    - if: "{{ _al_job == 'supersummary' }}"
      then:
      - if: "{{ wait_burst | default(true) | bool(true) }}"
        then:
        - wait_template: "{{ state_attr('script.zen_dojotools_ninja_summarizer', 'current') | int(0) < 2 }}"
          timeout:
            seconds: 30
          continue_on_timeout: true
      - action: script.turn_on
        continue_on_error: true
        target:
          entity_id: script.zen_dojotools_supersummary
        data:
          variables:
            post_to_kata_cabinet: true
            supplemental_prompt: "{{ payload | default('', true) }}"
    - if: "{{ _al_job == 'heartbeat' }}"
      then:
      - wait_template: "{{ not is_state('script.zen_dojotools_filecabinet', 'on') }}"
        timeout:
          seconds: 60
        continue_on_timeout: true
      - action: script.zen_sutra_filecabinet
        continue_on_error: true
        data:
          action_type: upsert
          mode: replace
          set_timestamp: true
          show_hidden_volumes: false
          volume_entity_id:
          - "{{ _kata_cab }}"
          path: zen_scheduler
          value: "{{ payload | default('', true) }}"
