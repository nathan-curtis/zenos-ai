#####################################################################
# zen_dojotool_dispatcher — Event-driven dojotool dispatch layer
# Version: 5.4.1
#
# v5.4.1 (2026-08-20)
#   + zen_dojotools_urgency_handler dedup fix. Friday's own diagnosis
#     (filed same-day) caught the v1 cut spawning a fresh
#     ticket on every firing -- a persistently-flagged component refires
#     roughly hourly as its cooldown window resets, and each firing
#     created a NEW ticket instead of touching the existing one. ~10
#     duplicate tickets per component before caught. Fixed: every ticket
#     this handler creates gets tagged with a stable per-component tag;
#     before creating, search for an already-open ticket carrying that
#     tag first. Found -> add a recurrence note to it. Not found ->
#     create, then tag the result so the next occurrence finds it.
#
# v5.4.0 (2026-08-19)
#   + zen_dojotools_urgency_handler v1 real implementation, replacing the
#     stub. Traced its actual role: the catch-all triage lane for
#     action_required=true events that fall through both summary_force
#     (needs urgency >= drift_threshold, unrelated condition) and the
#     four-layer autonomous-remediation gate (needs urgency >= push_floor
#     AND a non-empty suggested_act_event) -- low-urgency, no-suggested-
#     action "needs a human" signals were being silently dropped. Now
#     routes to Taskmaster as a real task (priority scaled from urgency,
#     no Postman push -- push-worthy events already went through the
#     four-layer gate upstream).
#
# v5.3.0 (2026-07-04)
#   + Removed zen_dojotools_notification_router v1 compat shim. Retired tool
#     had no backing script; a few KFC components still named it as their
#     suggested_act_event. Callers repointed to zen_dojotools_postman directly
#     (existing v1 case, mode=resolve_and_dispatch) — no shim.
#
# v5.2.0 (ZenOS-AI 2026.6.0)
#   + Merged zen_dojotool_tool_router into dispatcher — one automation,
#     one routing table. dojotool_route event eliminated. #10194
#
# v5.1.0 / v1.2.0 (ZenOS-AI 2026.6.0)
#   + zen_dojotools_autovac v1 registered
#
# v1.1.0 (ZenOS-AI 4.5.7)
#
# Listens for zen_event(kind: dojotool_call), routes to the registered
# script, fires correlated zen_event(kind: dojotool_return).
#
# WHY:
#   Direct script calls (action: script.foo) hard-fault if the script
#   doesn't exist — sequence dies, no recovery. Through the dispatcher,
#   unknown tools return a structured error on the event bus. Nothing
#   explodes. Caller handles it.
#
#   Additionally: callers reference tool names, not script entity IDs.
#   Version routing means tools can migrate without touching callers.
#   All inter-tool calls flow through one place — free observability.
#
# CALLER PATTERN:
#   1. Generate a correlation_id (UUID).
#   2. Arm wait_for_trigger on dojotool_return filtered by correlation_id.
#   3. Fire dojotool_call event.
#   4. Receive correlated return.
#
#   event: zen_event
#   event_data:
#     event:
#       kind: dojotool_call
#       tool: zen_dojotools_provisioner
#       version: "1"           # optional, defaults to "1"
#       correlation_id: <uuid>
#       payload:
#         mode: provision
#         target_cabinet: sensor.zenos_expansion_cabinet_1
#         cab_type: ai_user
#         caller_token: "{{ caller_token }}"
#
#   wait_for_trigger:
#     - trigger: event
#       event_type: zen_event
#       event_data:
#         event:
#           kind: dojotool_return
#           correlation_id: <same uuid>
#   timeout: '00:00:30'
#
# NON-BREAKING: existing direct action: script.* calls are unaffected.
#
# REGISTRY: add a choose arm per tool. That's the entire API surface.
# Tools do NOT need to change — dispatcher adapts to their contracts.
#####################################################################

automation:

  - id: zen_dojotool_dispatcher
    alias: Zen DojoTool Dispatcher
    description: >-
      Zen DojoTool Dispatcher 1.0.0. Event-driven dispatch layer for dojotool
      inter-tool communication. Listens for zen_event(kind: dojotool_call),
      routes to registered scripts, fires correlated dojotool_return events.

      Fault isolation: unknown tools return structured error — no hard fault.
      Version routing: tool + version resolves to specific script entity.
      Observability: all inter-tool calls visible on the event bus.
      Non-breaking: direct script calls unaffected. Migrate opportunistically.
    mode: parallel
    max: 20

    triggers:
      - trigger: event
        event_type: zen_event
        event_data:
          event:
            kind: dojotool_call

    actions:
      - variables:
          _ev:              "{{ trigger.event.data.event }}"
          _tool:            "{{ _ev.tool | default('') | trim }}"
          _ver:             "{{ _ev.version | default('1') | string | trim }}"
          _cid:             "{{ _ev.correlation_id | default('') | trim }}"
          _payload:         "{{ _ev.payload | default({}) }}"
          _result:          {}

      # ── Gate: correlation_id required ──────────────────────────────────────
      - if:
        - condition: template
          value_template: "{{ _cid == '' }}"
        then:
        - event: zen_event
          event_data:
            event:
              kind: dojotool_dispatch_error
              tool: "{{ _tool }}"
              version: "{{ _ver }}"
              correlation_id: ''
              error: missing_correlation_id
              message: "dojotool_call missing correlation_id — cannot route return."
        - stop: missing correlation_id

      # ── Registry ───────────────────────────────────────────────────────────
      - choose:

          # ── zen_dojotools_provisioner v1 ─────────────────────────────────
          - conditions: "{{ _tool == 'zen_dojotools_provisioner' and _ver | string == '1' }}"
            sequence:
              - action: script.zen_dojotools_provisioner
                data:
                  mode:            "{{ _payload.get('mode', 'provision') }}"
                  cab_type:        "{{ _payload.get('cab_type', '') }}"
                  target_cabinet:  "{{ _payload.get('target_cabinet', '') }}"
                  replace_cabinet: "{{ _payload.get('replace_cabinet', '') }}"
                  person_entity:   "{{ _payload.get('person_entity', '') }}"
                  profile_payload: "{{ _payload.get('profile_payload', '') }}"
                  caller_token:    "{{ _payload.get('caller_token', '') }}"
                response_variable: _result

          # ── zen_admintools_cabinetadmin_factory v1 ─────────────────────────
          - conditions: "{{ _tool == 'zen_admintools_cabinetadmin_factory' and _ver | string == '1' }}"
            sequence:
              - action: script.zen_admintools_cabinetadmin_factory
                data:
                  cabinet_entity: "{{ _payload.get('cabinet_entity', '') }}"
                  cabinet_type:   "{{ _payload.get('cabinet_type', '') }}"
                  confirm_action: "{{ _payload.get('confirm_action', false) }}"
                  caller_token:   "{{ _payload.get('caller_token', '') }}"
                response_variable: _result

          # ── zen_admintools_cabinetadmin v1 ───────────────────────────────
          - conditions: "{{ _tool == 'zen_admintools_cabinetadmin' and _ver | string == '1' }}"
            sequence:
              - action: script.zen_admintools_cabinetadmin
                data:
                  mode:           "{{ _payload.get('mode', 'inspect') }}"
                  cabinet_entity: "{{ _payload.get('cabinet_entity', '') }}"
                  schema_version: "{{ _payload.get('schema_version', none) }}"
                  caller_token:   "{{ _payload.get('caller_token', '') }}"
                response_variable: _result

          # ── zen_dojotools_filecabinet v1 ─────────────────────────────────
          - conditions: "{{ _tool == 'zen_dojotools_filecabinet' and _ver | string == '1' }}"
            sequence:
              - action: script.zen_dojotools_filecabinet
                data:
                  action_type:         "{{ _payload.get('action_type', 'read') }}"
                  volume_entity_id:    "{{ _payload.get('volume_entity_id', '') }}"
                  key:                 "{{ _payload.get('key', '') }}"
                  value:               "{{ _payload.get('value', '') }}"
                  set_timestamp:       "{{ _payload.get('set_timestamp', false) }}"
                  label_input:         "{{ _payload.get('label_input', '') }}"
                  expires_after:       "{{ _payload.get('expires_after', '') }}"
                  no_autoexpire:       "{{ _payload.get('no_autoexpire', false) }}"
                  no_autorecycle:      "{{ _payload.get('no_autorecycle', false) }}"
                  acl:                 "{{ _payload.get('acl', '') }}"
                  description:         "{{ _payload.get('description', '') }}"
                  label_targets:       "{{ _payload.get('label_targets', '') }}"
                  show_hidden_volumes: "{{ _payload.get('show_hidden_volumes', false) }}"
                  show_stacks:         "{{ _payload.get('show_stacks', false) }}"
                  start:               "{{ _payload.get('start', '') }}"
                  end:                 "{{ _payload.get('end', '') }}"
                  filter_domain:       "{{ _payload.get('filter_domain', '') }}"
                  filter_state_operand: "{{ _payload.get('filter_state_operand', '') }}"
                  filter_op:           "{{ _payload.get('filter_op', '') }}"
                  force_action:        "{{ _payload.get('force_action', false) }}"
                  destination_cabinet: "{{ _payload.get('destination_cabinet', '') }}"
                  destination_drawer:  "{{ _payload.get('destination_drawer', '') }}"
                  transfer_guid:       "{{ _payload.get('transfer_guid', '') }}"
                  target_guid:         "{{ _payload.get('target_guid', '') }}"
                  caller_token:        "{{ _payload.get('caller_token', '') }}"
                response_variable: _result

          # ── zen_dojotools_inspect v1 ─────────────────────────────────────
          - conditions: "{{ _tool == 'zen_dojotools_inspect' and _ver | string == '1' }}"
            sequence:
              - action: script.zen_dojotools_inspect
                data:
                  entity_id:     "{{ _payload.get('entity_id', []) }}"
                  extended:      "{{ _payload.get('extended', false) }}"
                  output_fields: "{{ _payload.get('output_fields', []) }}"
                  label_targets: "{{ _payload.get('label_targets', []) }}"
                  infer:         "{{ _payload.get('infer', false) }}"
                  drawer_key:    "{{ _payload.get('drawer_key', '') }}"
                  timeout:       "{{ _payload.get('timeout', 60) }}"
                  caller_token:  "{{ _payload.get('caller_token', '') }}"
                response_variable: _result

          # ── zen_dojotools_query v1 ───────────────────────────────────────
          - conditions: "{{ _tool == 'zen_dojotools_query' and _ver | string == '1' }}"
            sequence:
              - action: script.zen_dojotools_query
                data:
                  mode:            "{{ _payload.get('mode', 'query') }}"
                  log_result:      "{{ _payload.get('log_result', false) }}"
                  emit_event:      "{{ _payload.get('emit_event', false) }}"
                  target_entities: "{{ _payload.get('target_entities', []) }}"
                  filter_json:     "{{ _payload.get('filter_json', '{}') }}"
                  output_fields:   "{{ _payload.get('output_fields', []) }}"
                  dry_run:         "{{ _payload.get('dry_run', false) }}"
                  caller_token:    "{{ _payload.get('caller_token', '') }}"
                response_variable: _result

          # ── zen_dojotools_index v1 ───────────────────────────────────────
          - conditions: "{{ _tool == 'zen_dojotools_index' and _ver | string == '1' }}"
            sequence:
              - action: script.zen_dojotools_index
                data:
                  mode:            "{{ _payload.get('mode', 'normal') }}"
                  index_command: >-
                    {%- set _v = _payload.get('index_command', {}) -%}
                    {{- _v | from_json if _v is string else (_v if _v is mapping else {}) -}}
                  entities_1:      "{{ _payload.get('entities_1', []) }}"
                  label_1:         "{{ _payload.get('label_1', '') }}"
                  entities_2:      "{{ _payload.get('entities_2', []) }}"
                  label_2:         "{{ _payload.get('label_2', '') }}"
                  operator:        "{{ _payload.get('operator', 'AND') }}"
                  timeout:         "{{ _payload.get('timeout', 2) }}"
                  filter_json: >-
                    {%- set _v = _payload.get('filter_json', {}) -%}
                    {{- _v | from_json if _v is string else (_v if _v is mapping else {}) -}}
                  strict:          "{{ _payload.get('strict', false) }}"
                  expand_entities: "{{ _payload.get('expand_entities', false) }}"
                  output_fields:   "{{ _payload.get('output_fields', []) }}"
                  dry_run:         "{{ _payload.get('dry_run', false) }}"
                  caller_token:    "{{ _payload.get('caller_token', '') }}"
                response_variable: _result

          # ── zen_dojotools_manifest v1 ────────────────────────────────────
          - conditions: "{{ _tool == 'zen_dojotools_manifest' and _ver | string == '1' }}"
            sequence:
              - action: script.zen_dojotools_manifest
                data:
                  mode:         "{{ _payload.get('mode', 'cabinets') }}"
                  show_hidden:  "{{ _payload.get('show_hidden', false) }}"
                  show_stacks:  "{{ _payload.get('show_stacks', false) }}"
                  extended:     "{{ _payload.get('extended', false) }}"
                  name:         "{{ _payload.get('name', '') }}"
                  tier:         "{{ _payload.get('tier', '') }}"
                  force_refresh: "{{ _payload.get('force_refresh', false) }}"
                  mcp_tool_list: "{{ _payload.get('mcp_tool_list', '') }}"
                  caller_token: "{{ _payload.get('caller_token', '') }}"
                response_variable: _result

          # ── zen_stack_firefly v1 ──────────────────────────────────────────
          - conditions: "{{ _tool == 'zen_stack_firefly' and _ver | string == '1' }}"
            sequence:
              - action: script.zen_stack_firefly
                data:
                  mode:         "{{ _payload.get('mode', 'help') }}"
                  anchor_type:  "{{ _payload.get('anchor_type', '') }}"
                  anchor_ids:   "{{ _payload.get('anchor_ids', '[]') }}"
                  caller_token: "{{ _payload.get('caller_token', '') }}"
                response_variable: _result

          # ── zen_stack_battery v1 ──────────────────────────────────────────
          - conditions: "{{ _tool == 'zen_stack_battery' and _ver | string == '1' }}"
            sequence:
              - action: script.zen_stack_battery
                data:
                  mode:         "{{ _payload.get('mode', 'help') }}"
                  anchor_type:  "{{ _payload.get('anchor_type', '') }}"
                  anchor_ids:   "{{ _payload.get('anchor_ids', '[]') }}"
                  caller_token: "{{ _payload.get('caller_token', '') }}"
                response_variable: _result

          # ── zen_admintools_summarizer_act v1 (→ prompt_loader mode=whitelist) ──
          - conditions: "{{ _tool == 'zen_admintools_summarizer_act' and _ver | string == '1' }}"
            sequence:
              - action: script.zen_admintools_prompt_loader
                data:
                  mode:           whitelist
                  whitelist_type: act
                  action_type:    "{{ _payload.get('action_type', 'list') }}"
                  item:           "{{ _payload.get('event', '') }}"
                  caller_token:   "{{ _payload.get('caller_token', '') }}"
                response_variable: _result

          # ── zen_dojotools_urgency_handler v1 (2026-08-19, dedup fix 2026-08-20) ──
          # Catch-all triage lane for action_required=true events that fall
          # through the other two paths: summary_force needs urgency >=
          # drift_threshold (unrelated condition), and the four-layer
          # autonomous-remediation gate needs BOTH urgency >= push_floor AND
          # a non-empty suggested_act_event. A component that says "this
          # needs a human's judgment" at low urgency with no automatable
          # suggested action was landing here and getting silently dropped
          # -- this was a real stub, not dead scaffolding superseded by
          # those two mechanisms. Routes to Taskmaster as a real (non-chore,
          # non-Radar-forced) task so a human sees it -- no Postman push,
          # since anything push-worthy already went through the four-layer
          # gate's own urgency check upstream.
          #
          # 2026-08-20 BUG (Friday's own diagnosis): the v1
          # cut spawned a brand-new ticket on EVERY firing with no
          # deduplication -- a persistently-flagged component (one whose
          # condition hasn't actually changed) refires roughly hourly as its
          # cooldown window resets, and each firing created a fresh ticket
          # instead of updating the existing one. ~10 duplicate tickets per
          # component before caught. Fixed: tag every ticket this handler
          # creates with a stable per-component tag; before creating,
          # search for an already-open ticket carrying that tag. Found ->
          # add a note to it instead (repeat occurrence, still visible,
          # still timestamped, not a new ticket). Not found -> create, then
          # tag the result so the NEXT occurrence finds it.
          - conditions: "{{ _tool == 'zen_dojotools_urgency_handler' and _ver | string == '1' }}"
            sequence:
              - variables:
                  _uh_component: "{{ _payload.get('component_slug', '') | string | trim if _payload.get('component_slug', '') else _payload.get('kata_key', '') | string | trim }}"
                  _uh_urgency: "{{ _payload.get('urgency', 1) | int(1) }}"
                  _uh_suggested: "{{ _payload.get('suggested_act_event', '') | string | trim }}"
                  _uh_priority: "{{ 3 if _uh_urgency >= 6 else (2 if _uh_urgency >= 3 else 1) }}"
                  _uh_dedup_tag: >-
                    {{ 'urgency_component_' ~ (_uh_component if _uh_component != '' else 'unknown') | lower | regex_replace('[^a-z0-9]+', '_') }}
                  _uh_note: >-
                    urgency={{ _uh_urgency }}{{ ' suggested_act_event=' ~ _uh_suggested if _uh_suggested != '' else ' (no suggested action -- human judgment needed)' }}
                    kata_key={{ _payload.get('kata_key', '') }} correlation_id={{ _cid }}
              - action: script.zen_dojotools_servicedesk
                continue_on_error: true
                data:
                  mode: ticket_search
                  input_json: >-
                    {{ {'tags': [_uh_dedup_tag], 'states': ['new', 'open']} | tojson }}
                response_variable: _uh_existing
              - variables:
                  _uh_existing_ids: "{{ _uh_existing.get('ticket_ids', []) if _uh_existing is mapping else [] }}"
              - choose:
                - conditions: "{{ _uh_existing_ids | length > 0 }}"
                  sequence:
                  - action: script.zen_dojotools_servicedesk
                    continue_on_error: true
                    data:
                      mode: article_add
                      input_json: >-
                        {{ {'ticket_id': _uh_existing_ids[0], 'body': 'Recurred at ' ~ now().isoformat() ~ '. ' ~ _uh_note, 'subject': 'Recurrence', 'internal': true} | tojson }}
                    response_variable: _uh_note_result
                  - variables:
                      _result:
                        status: deduplicated
                        ticket_id: "{{ _uh_existing_ids[0] }}"
                        note_added: "{{ _uh_note_result is mapping and _uh_note_result.get('status', '') == 'success' }}"
                default:
                - action: script.zen_dojotools_taskmaster
                  data:
                    mode: task_create
                    item: "Action required — {{ _uh_component if _uh_component != '' else 'unknown component' }}"
                    chore: false
                    priority: "{{ _uh_priority }}"
                    note: "{{ _uh_note }}"
                    caller_token: "{{ _payload.get('caller_token', '') }}"
                  response_variable: _result
                - if: "{{ _result is mapping and _result.get('backend', '') == 'radar' and _result.get('ticket_number', '') != '' }}"
                  then:
                  - action: script.zen_dojotools_servicedesk
                    continue_on_error: true
                    data:
                      mode: ticket_tag
                      input_json: >-
                        {{ {'ticket_id': _result.get('ticket_number', ''), 'tag': _uh_dedup_tag} | tojson }}

          # ── zen_dojotools_todo v1 ────────────────────────────────────────
          - conditions: "{{ _tool == 'zen_dojotools_todo' and _ver | string == '1' }}"
            sequence:
              - action: script.zen_dojotools_todo
                data:
                  action_type:      "{{ _payload.get('action_type', 'read') }}"
                  list_name:        "{{ _payload.get('list_name', '') }}"
                  entity_ids:       "{{ _payload.get('entity_ids', '') }}"
                  include_task_ids: "{{ _payload.get('include_task_ids', false) }}"
                  items:            "{{ _payload.get('items', []) }}"
                  status:           "{{ _payload.get('status', 'needs_action') }}"
                  due_date:         "{{ _payload.get('due_date', '') }}"
                  description:      "{{ _payload.get('description', '') }}"
                  label_targets:    "{{ _payload.get('label_targets', []) }}"
                  caller_token:     "{{ _payload.get('caller_token', '') }}"
                response_variable: _result

          # ── zen_dojotools_calendar v1 ────────────────────────────────────
          - conditions: "{{ _tool == 'zen_dojotools_calendar' and _ver | string == '1' }}"
            sequence:
              - action: script.zen_dojotools_calendar
                data:
                  action_type:   "{{ _payload.get('action_type', 'read') }}"
                  calendar_name: "{{ _payload.get('calendar_name', '') }}"
                  start:         "{{ _payload.get('start', '') }}"
                  end:           "{{ _payload.get('end', '') }}"
                  event_id:      "{{ _payload.get('event_id', '') }}"
                  label_targets: "{{ _payload.get('label_targets', []) }}"
                  caller_token:  "{{ _payload.get('caller_token', '') }}"
                response_variable: _result

          # ── zen_dojotools_security_manager v1 ───────────────────────────
          - conditions: "{{ _tool == 'zen_dojotools_security_manager' and _ver | string == '1' }}"
            sequence:
              - action: script.zen_dojotools_security_manager
                data:
                  action:       "{{ _payload.get('action', 'read_state') }}"
                  arm_mode:     "{{ _payload.get('arm_mode', '') }}"
                  panel:        "{{ _payload.get('panel', '') }}"
                  caller_token: "{{ _payload.get('caller_token', '') }}"
                response_variable: _result

          # ── zen_dojotools_postman v1 ─────────────────────────────────────
          - conditions: "{{ _tool == 'zen_dojotools_postman' and _ver | string == '1' }}"
            sequence:
              - action: script.zen_dojotools_postman
                data:
                  mode:               "{{ _payload.get('mode', 'resolve_and_dispatch') }}"
                  target:             "{{ _payload.get('target', '') }}"
                  urgency: >-
                    {%- set _kata = _payload.get('kata_input', {}) -%}
                    {{ _payload.get('urgency', _kata.get('urgency', 1) if _kata is mapping else 1) }}
                  message:            "{{ _payload.get('message', '') }}"
                  title:              "{{ _payload.get('title', '') }}"
                  channel_hint:       "{{ _payload.get('channel_hint', '') }}"
                  response_required:  "{{ _payload.get('response_required', false) }}"
                  image_entity:       "{{ _payload.get('image_entity', '') }}"
                  image_url:          "{{ _payload.get('image_url', '') }}"
                  audio_url:          "{{ _payload.get('audio_url', '') }}"
                  tag:                "{{ _payload.get('tag', '') }}"
                  response_type:      "{{ _payload.get('response_type', 'none') }}"
                  response_timeout_s: "{{ _payload.get('response_timeout_s', 60) }}"
                  force_audio:        "{{ _payload.get('force_audio', false) }}"
                  open_dashboard:     "{{ _payload.get('open_dashboard', false) }}"
                  notification_data:  "{{ _payload.get('notification_data', {}) }}"
                  kata_input:         "{{ _payload.get('kata_input', {}) }}"
                  breakthrough:       "{{ _payload.get('breakthrough', false) }}"
                  scope_id:           "{{ _payload.get('scope_id', '') }}"
                  policy_key:         "{{ _payload.get('policy_key', 'postman_profile') }}"
                  policy_type:        "{{ _payload.get('policy_type', 'new_channel') }}"
                  channel_definition: "{{ _payload.get('channel_definition', {}) }}"
                  caller_token:       "{{ _payload.get('caller_token', '') }}"
                response_variable: _result

          # ── zen_dojotools_room_manager v1 ────────────────────────────────
          - conditions: "{{ _tool == 'zen_dojotools_room_manager' and _ver | string == '1' }}"
            sequence:
              - action: script.zen_dojotools_room_manager
                data:
                  mode:                      "{{ _payload.get('mode', 'help') }}"
                  area:                      "{{ _payload.get('area', '') }}"
                  area_b:                    "{{ _payload.get('area_b', '') }}"
                  walls:                     "{{ _payload.get('walls', none) }}"
                  portals:                   "{{ _payload.get('portals', none) }}"
                  windows:                   "{{ _payload.get('windows', none) }}"
                  clear_portals:             "{{ _payload.get('clear_portals', false) }}"
                  clear_windows:             "{{ _payload.get('clear_windows', false) }}"
                  portal_type:               "{{ _payload.get('portal_type', 'door') }}"
                  portal_normally:           "{{ _payload.get('portal_normally', 'closed') }}"
                  occupant:                  "{{ _payload.get('occupant', '') }}"
                  clear_occupants:           "{{ _payload.get('clear_occupants', false) }}"
                  link_sound_tx:             "{{ _payload.get('link_sound_tx', none) }}"
                  link_light_tx:             "{{ _payload.get('link_light_tx', none) }}"
                  boundary_link_sound_tx:    "{{ _payload.get('boundary_link_sound_tx', none) }}"
                  boundary_link_light_tx:    "{{ _payload.get('boundary_link_light_tx', none) }}"
                  boundary_link_note:        "{{ _payload.get('boundary_link_note', '') }}"
                  clear_boundary_links:      "{{ _payload.get('clear_boundary_links', false) }}"
                  description:               "{{ _payload.get('description', '') }}"
                  length:                    "{{ _payload.get('length', none) }}"
                  width:                     "{{ _payload.get('width', none) }}"
                  unit:                      "{{ _payload.get('unit', none) }}"
                  area_override:             "{{ _payload.get('area_override', none) }}"
                  area_override_reason:      "{{ _payload.get('area_override_reason', '') }}"
                  home_office_claimed:       "{{ _payload.get('home_office_claimed', none) }}"
                  tol_mm:                    "{{ _payload.get('tol_mm', 200) }}"
                  dry_run:                   "{{ _payload.get('dry_run', false) }}"
                  caller_token:              "{{ _payload.get('caller_token', '') }}"
                response_variable: _result

          # ── zen_dojotools_labels v1 ──────────────────────────────────────
          - conditions: "{{ _tool == 'zen_dojotools_labels' and _ver | string == '1' }}"
            sequence:
              - action: script.zen_dojotools_labels
                data:
                  action_type:     "{{ _payload.get('action_type', 'read') }}"
                  target_entities: >-
                    {%- set _v = _payload.get('target_entities', []) -%}
                    {{- _v | from_json if _v is string else (_v if _v is iterable and _v is not string else []) -}}
                  label_list: >-
                    {%- set _v = _payload.get('label_list', []) -%}
                    {{- _v | from_json if _v is string else (_v if _v is iterable and _v is not string else []) -}}
                  new_description: "{{ _payload.get('new_description', '') }}"
                  new_icon:        "{{ _payload.get('new_icon', '') }}"
                  new_color:       "{{ _payload.get('new_color', '') }}"
                  force_rewrite:   "{{ _payload.get('force_rewrite', false) }}"
                  confirm:         "{{ _payload.get('confirm', false) }}"
                  caller_token:    "{{ _payload.get('caller_token', '') }}"
                response_variable: _result

          # ── zen_dojotools_covers v1 ──────────────────────────────────────
          - conditions: "{{ _tool == 'zen_dojotools_covers' and _ver | string == '1' }}"
            sequence:
              - action: script.zen_dojotools_covers
                data:
                  mode:           "{{ _payload.get('mode', 'discover') }}"
                  room:           "{{ _payload.get('room', '') }}"
                  entity_id:      "{{ _payload.get('entity_id', '') }}"
                  target_role:    "{{ _payload.get('target_role', '') }}"
                  position:       "{{ _payload.get('position', -1) }}"
                  tilt_position:  "{{ _payload.get('tilt_position', -1) }}"
                  scene:          "{{ _payload.get('scene', '') }}"
                  include_vents:  "{{ _payload.get('include_vents', false) }}"
                  dry_run:        "{{ _payload.get('dry_run', false) }}"
                  caller_token:   "{{ _payload.get('caller_token', '') }}"
                response_variable: _result

          # ── zen_dojotools_climate v1 ─────────────────────────────────────
          - conditions: "{{ _tool == 'zen_dojotools_climate' and _ver | string == '1' }}"
            sequence:
              - action: script.zen_dojotools_climate
                data:
                  name:         "{{ _payload.get('name', '') }}"
                  room:         "{{ _payload.get('room', none) }}"
                  temperature:  "{{ _payload.get('temperature', none) }}"
                  target_low:   "{{ _payload.get('target_low', none) }}"
                  target_high:  "{{ _payload.get('target_high', none) }}"
                  hvac_mode:    "{{ _payload.get('hvac_mode', none) }}"
                  fan_mode:     "{{ _payload.get('fan_mode', none) }}"
                  swing_mode:   "{{ _payload.get('swing_mode', none) }}"
                  preset:       "{{ _payload.get('preset', none) }}"
                  humidity:     "{{ _payload.get('humidity', none) }}"
                  aux_heat:     "{{ _payload.get('aux_heat', none) }}"
                  power:        "{{ _payload.get('power', none) }}"
                  get:          "{{ _payload.get('get', none) }}"
                  caller_token: "{{ _payload.get('caller_token', '') }}"
                response_variable: _result

          # ── zen_dojotools_spamaster v1 ───────────────────────────────────
          - conditions: "{{ _tool == 'zen_dojotools_spamaster' and _ver | string == '1' }}"
            sequence:
              - action: script.zen_dojotools_spamaster
                data:
                  mode:               "{{ _payload.get('mode', 'status') }}"
                  anchor:             "{{ _payload.get('anchor', '') }}"
                  verbose:            "{{ _payload.get('verbose', false) }}"
                  model_preset:       "{{ _payload.get('model_preset', '') }}"
                  chem_preset:        "{{ _payload.get('chem_preset', '') }}"
                  chem_profile:       "{{ _payload.get('chem_profile', '') }}"
                  config_json:        "{{ _payload.get('config_json', '') }}"
                  reset:              "{{ _payload.get('reset', false) }}"
                  confirm:            "{{ _payload.get('confirm', false) }}"
                  log_notes:          "{{ _payload.get('log_notes', '') }}"
                  boost_chlorine:     "{{ _payload.get('boost_chlorine', false) }}"
                  close_cover:        "{{ _payload.get('close_cover', false) }}"
                  set_hold_temp:      "{{ _payload.get('set_hold_temp', none) }}"
                  soak_persons:       "{{ _payload.get('soak_persons', none) }}"
                  soak_duration_hours: "{{ _payload.get('soak_duration_hours', none) }}"
                  add_supplies:       "{{ _payload.get('add_supplies', false) }}"
                  help_topic:         "{{ _payload.get('help_topic', 'index') }}"
                  mood:               "{{ _payload.get('mood', '') }}"
                  save_scene:         "{{ _payload.get('save_scene', false) }}"
                  delete_scene:       "{{ _payload.get('delete_scene', false) }}"
                  scene_entity:       "{{ _payload.get('scene_entity', '') }}"
                  scene_note:         "{{ _payload.get('scene_note', '') }}"
                  open_cover:         "{{ _payload.get('open_cover', false) }}"
                  light_state:        "{{ _payload.get('light_state', '') }}"
                  light_color:        "{{ _payload.get('light_color', '') }}"
                  light_zone:         "{{ _payload.get('light_zone', 'all') }}"
                  light_brightness:   "{{ _payload.get('light_brightness', none) }}"
                  cycle_speed:        "{{ _payload.get('cycle_speed', '') }}"
                  jets_state:         "{{ _payload.get('jets_state', '') }}"
                  jets_zone:          "{{ _payload.get('jets_zone', 'all') }}"
                  jets_speed:         "{{ _payload.get('jets_speed', '') }}"
                  audio_state:        "{{ _payload.get('audio_state', '') }}"
                  audio_volume:       "{{ _payload.get('audio_volume', none) }}"
                  audio_source:       "{{ _payload.get('audio_source', '') }}"
                  treble:             "{{ _payload.get('treble', none) }}"
                  bass:               "{{ _payload.get('bass', none) }}"
                  balance:            "{{ _payload.get('balance', none) }}"
                  subwoofer:          "{{ _payload.get('subwoofer', none) }}"
                  target_temperature: "{{ _payload.get('target_temperature', none) }}"
                  cover_action:       "{{ _payload.get('cover_action', '') }}"
                  salt_ppm:           "{{ _payload.get('salt_ppm', none) }}"
                  free_chlorine_ppm:  "{{ _payload.get('free_chlorine_ppm', none) }}"
                  ph:                 "{{ _payload.get('ph', none) }}"
                  alkalinity_ppm:     "{{ _payload.get('alkalinity_ppm', none) }}"
                  hardness_ppm:       "{{ _payload.get('hardness_ppm', none) }}"
                  hours_since_mps:    "{{ _payload.get('hours_since_mps', none) }}"
                  caller_token:       "{{ _payload.get('caller_token', '') }}"
                response_variable: _result

          # ── zen_dojotools_announce v1 ────────────────────────────────────
          - conditions: "{{ _tool == 'zen_dojotools_announce' and _ver | string == '1' }}"
            sequence:
              - action: script.zen_dojotools_announce
                data:
                  message:          "{{ _payload.get('message', '') }}"
                  urgency:          "{{ _payload.get('urgency', 1) }}"
                  target_area:      "{{ _payload.get('target_area', '') }}"
                  duck_media:       "{{ _payload.get('duck_media', true) }}"
                  satellite_entity: "{{ _payload.get('satellite_entity', '') }}"
                  response_type:    "{{ _payload.get('response_type', 'none') }}"
                  voice_answers:    "{{ _payload.get('voice_answers', '[]') }}"
                  caller_token:     "{{ _payload.get('caller_token', '') }}"
                response_variable: _result

          # ── zen_dojotools_autovac v1 ─────────────────────────────────────
          - conditions: "{{ _tool == 'zen_dojotools_autovac' and _ver | string == '1' }}"
            sequence:
              - action: script.zen_dojotools_autovac
                data:
                  mode:               "{{ _payload.get('mode', 'status') }}"
                  caller_token:       "{{ _payload.get('caller_token', '') }}"
                  room:               "{{ _payload.get('room', '') }}"
                  config:             "{{ _payload.get('config', none) }}"
                  rooms:              "{{ _payload.get('rooms', none) }}"
                  dry_run:            "{{ _payload.get('dry_run', false) }}"
                  action:             "{{ _payload.get('action', '') }}"
                  part:               "{{ _payload.get('part', '') }}"
                  amount:             "{{ _payload.get('amount', none) }}"
                  wear_entity:        "{{ _payload.get('wear_entity', '') }}"
                  preset:             "{{ _payload.get('preset', '') }}"
                  model_preset:       "{{ _payload.get('model_preset', '') }}"
                  schedule_entity_id: "{{ _payload.get('schedule_entity_id', '') }}"
                  trigger_id:         "{{ _payload.get('trigger_id', '') }}"
                  ack_action:         "{{ _payload.get('ack_action', '') }}"
                  ack_context:        "{{ _payload.get('ack_context', '') }}"
                  pm_tag:             "{{ _payload.get('pm_tag', '') }}"
                response_variable: _result

        # ── Unknown tool — structured fault, NOT a hard crash ─────────────
        default:
          - variables:
              _result:
                status: error
                error: unknown_tool
                message: "Dispatcher: unknown tool '{{ _tool }}' v{{ _ver }}. Not in registry."
                tool: "{{ _tool }}"
                version: "{{ _ver }}"
                correlation_id: "{{ _cid }}"
          - event: zen_event
            event_data:
              event:
                kind: dojotool_dispatch_error
                tool: "{{ _tool }}"
                version: "{{ _ver }}"
                correlation_id: "{{ _cid }}"
                error: unknown_tool
                message: "Dispatcher: unknown tool '{{ _tool }}' v{{ _ver }}. Not in registry."

      # ── Fire correlated return ────────────────────────────────────────────
      - event: zen_event
        event_data:
          event:
            kind: dojotool_return
            correlation_id: "{{ _cid }}"
            tool: "{{ _tool }}"
            version: "{{ _ver }}"
            result: "{{ _result }}"


  #####################################################################
  # zen_identity_manifest_router — Manifest rebuild on cabinet change
  #
  # v1.0.0 (ZenOS-AI 4.5.8)
  #
  # Listens for zen_event(kind: identity_manifest_rebuild) fired by:
  #   - zen_dojotools_provisioner (provision + deprovision)
  #   - zen_admintools_cabinetadmin (repair_mount + repair_dismount)
  # Routes to zen_dojotools_manifest to rebuild zen_library_manifest in
  # the household cabinet.
  #
  # Fire-and-forget. Queued — provision → deprovision flows serialize.
  #####################################################################

  - id: zen_identity_manifest_router
    alias: Zen Identity Manifest Router
    description: >-
      Zen Identity Manifest Router 1.0.0. Listens for
      zen_event(kind: identity_manifest_rebuild) and calls
      zen_dojotools_manifest to rebuild zen_library_manifest.
      Queued — provision/deprovision sequences serialize cleanly.
    mode: queued
    max: 20

    triggers:
      - trigger: event
        event_type: zen_event
        event_data:
          event:
            kind: identity_manifest_rebuild

    actions:
      - action: script.zen_dojotools_manifest
        data:
          show_hidden: false
          show_stacks: false
          extended: false
          caller_token: identity_manifest_router
        response_variable: _result


  #####################################################################
  # zen_label_mutation_router — Compact index rebuild on label change
  #
  # v1.0.0 (ZenOS-AI 4.5.8)
  #
  # Listens for zen_event(kind: label_mutation) fired by zen_dojotools_labels
  # on any successful write (create/delete/tag/untag/update/reset/install).
  # Routes to zen_dojotools_index (mode: build_compact_index) to rebuild
  # _compact_index in the household cabinet.
  #
  # Fire-and-forget — no correlation_id or return event.
  # mode: queued so rapid multi-label ops serialize, not storm the cabinet.
  #####################################################################

  - id: zen_label_mutation_router
    alias: Zen Label Mutation — Compact Index Router
    description: >-
      Zen Label Mutation Router 1.0.0. Listens for zen_event(kind: label_mutation)
      and triggers zen_dojotools_index (mode: build_compact_index) to rebuild
      _compact_index. Fire-and-forget. Queued so burst label ops don't race each other.
    mode: queued
    max: 20

    triggers:
      - trigger: event
        event_type: zen_event
        event_data:
          event:
            kind: label_mutation
      - trigger: homeassistant
        event: start
        id: ha_start
      - trigger: time
        at: "06:00:00"
        id: scheduled_rebuild
      - trigger: time
        at: "12:00:00"
        id: scheduled_rebuild
      - trigger: time
        at: "18:00:00"
        id: scheduled_rebuild
      - trigger: time
        at: "00:00:00"
        id: scheduled_rebuild

    actions:
      - action: script.zen_dojotools_index
        data:
          mode: build_compact_index
          caller_token: label_mutation_router


  #####################################################################
  # zen_scheduler_drain_router — Trickle recovery for shed components
  #
  # v1.0.0 (ZenOS-AI 4.5.x)
  #
  # When scheduler queue depth stays below drain_below for s_min_minutes,
  # fires force_summary for the most stale shed-eligible component
  # (keeper before ambient, oldest kata timestamp first).
  #
  # Starvation guard (time_pattern /10): if any component's kata is older
  # than s_max_minutes, forces a recovery regardless of queue depth.
  #
  # mode: single — one drain recovery dispatch at a time; scheduler
  # handles execution. Config lives in zen_scheduler_config drawer
  # of the household root cabinet.
  #####################################################################

  - id: zen_scheduler_drain_router
    alias: Zen Scheduler — Drain Router
    description: >-
      Zen Scheduler Drain Router 1.0.0. When queue depth is sustained
      below drain_below for s_min_minutes, trickles shed components back
      into the pipeline — keeper tier first, oldest kata first.
      Starvation guard fires at s_max_minutes regardless of depth.
      Config in zen_scheduler_config drawer of household root cabinet.
    mode: single

    triggers:
      - trigger: numeric_state
        entity_id: sensor.zen_scheduler_queue_depth
        below: 4
        for:
          minutes: 3
        id: drain_quiet
      - trigger: time_pattern
        minutes: /10
        id: drain_starvation_check

    actions:
      # ── Resolve cabinets + read scheduler config ─────────────────────
      - variables:
          _household_cab: "{{ states('sensor.zen_default_household_cabinet_resolved') }}"
          _dojo_cab:      "{{ states('sensor.zen_dojo_cabinet_resolved') }}"
          _kata_cab:      "{{ states('sensor.zen_kata_cabinet_resolved') }}"
          _queue_depth:   "{{ states('sensor.zen_scheduler_queue_depth') | int(0) }}"
      - variables:
          _drain_below: >-
            {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}{%- set _v = CABS.cabinet_drawer_value_mounted(_household_cab, 'zen_scheduler_config') | from_json -%}
            {{ (_v.get('drain_below', 3) if _v is mapping else 3) | int(3) }}
          _s_max_minutes: >-
            {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}{%- set _v = CABS.cabinet_drawer_value_mounted(_household_cab, 'zen_scheduler_config') | from_json -%}
            {{ (_v.get('s_max_minutes', 60) if _v is mapping else 60) | int(60) }}

      # ── Gate: quiet trigger re-validates depth; starvation bypasses ──
      - if: >-
          {{ trigger.id == 'drain_starvation_check' or _queue_depth | int(0) < _drain_below | int(3) }}
        then:
          # ── Build candidate list from dojo drawers + kata timestamps ──
          - variables:
              _now_ts: "{{ now().timestamp() | int(0) }}"
              _candidates: >-
                {%- set protected = ['AI_Cabinet_VolumeInfo', 'kfc_template', 'zen_library_manifest', 'zen_identity_manifest', '_context'] -%}
                {%- set dojo_v = state_attr(_dojo_cab, 'variables') | default({}, true) -%}
                {%- set kata_v = state_attr(_kata_cab, 'variables') | default({}, true) -%}
                {%- set ns = namespace(cands=[]) -%}
                {%- if _dojo_cab not in ['unknown', 'unavailable'] and _kata_cab not in ['unknown', 'unavailable'] -%}
                  {%- for key, drawer in (dojo_v if dojo_v is mapping else {}).items() -%}
                    {%- if key[:1] != '_' and key not in protected -%}
                      {%- set val = drawer.get('value', drawer) if drawer is mapping else {} -%}
                      {%- if val is mapping -%}
                        {%- set tier = val.get('pipeline_tier', 'keeper') | lower -%}
                        {%- if tier in ['keeper', 'ambient', 'direct'] -%}
                          {%- set kata_raw = (kata_v if kata_v is mapping else {}).get(key, {}) -%}
                          {%- set kata_val = kata_raw.get('value', kata_raw) if kata_raw is mapping else {} -%}
                          {%- set kata_val = (kata_val | from_json) if kata_val is string else kata_val -%}
                          {%- set gen_str  = (kata_val.get('generated', '') if kata_val is mapping else '') | default('', true) | string -%}
                          {%- set gen_ts   = as_timestamp(gen_str, 0) | int(0) -%}
                          {%- set age_min  = ((_now_ts - gen_ts) / 60) | int(9999) if gen_ts > 0 else 9999 -%}
                          {%- set tier_sort = 0 if tier in ['keeper', 'direct'] else 1 -%}
                          {%- set staleness = val.get('staleness_minutes', 1440) | int(1440) -%}
                          {%- set ns.cands = ns.cands + [{'key': key, 'tier': tier, 'tier_sort': tier_sort, 'age_min': age_min, 'staleness_minutes': staleness}] -%}
                        {%- endif -%}
                      {%- endif -%}
                    {%- endif -%}
                  {%- endfor -%}
                {%- endif -%}
                {{ ns.cands | sort(attribute='age_min', reverse=true) | sort(attribute='tier_sort') }}

          # ── Select target: starvation = must exceed s_max; drain = most stale ──
          - variables:
              _target_component: >-
                {%- set cands = _candidates if _candidates is iterable and _candidates is not string else [] -%}
                {%- if trigger.id == 'drain_starvation_check' -%}
                  {%- set ns2 = namespace(target='') -%}
                  {%- for cand in cands -%}
                    {%- if ns2.target == '' and cand.age_min >= cand.staleness_minutes -%}
                      {%- set ns2.target = cand.key -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ ns2.target }}
                {%- else -%}
                  {{ cands[0].key if cands | length > 0 else '' }}
                {%- endif -%}

          # ── Fire force_summary for target (if found) ────────────────
          - if: "{{ _target_component | trim != '' }}"
            then:
              - event: zen_event
                event_data:
                  event:
                    kind: summary_force
                    component: "{{ _target_component }}"


  #####################################################################
  # zen_flynn_health_resummarize — Resummarize zen_system on Flynn state change
  #
  # v1.0.0
  #
  # Flynn health state changes reflect real infrastructure shifts. The
  # supersummary cycle is too slow to capture a recovery — kata stays
  # stale and the agent sees a lie. This automation fires summary_force
  # for zen_system on any state change, debounced 30s against burst.
  #####################################################################

  - id: zen_flynn_health_resummarize
    alias: Zen Flynn Health — Resummarize zen_system on state change
    description: >-
      zen_flynn_health_resummarize 1.0.0. Fires summary_force for zen_system
      whenever sensor.zen_flynn_health changes state, debounced 30s.
      Ensures kata reflects recovery (or degradation) without waiting
      for the next scheduler cycle.
    mode: single

    triggers:
      - trigger: state
        entity_id: sensor.zen_flynn_health
        for: "00:00:30"

    actions:
      - event: zen_event
        event_data:
          event:
            kind: summary_force
            component: zen_system
            reason: flynn_health_state_change
            from_state: "{{ trigger.from_state.state }}"
            to_state: "{{ trigger.to_state.state }}"


  #####################################################################
  # cabinet_vi_degraded autorepair — fires when Inspect detects a
  # cabinet whose VolumeInfo is a JSON string instead of a mapping.
  # Calls cabinetadmin repair_volumeinfo on the offending cabinet.
  # Emits cabinet_vi_repaired on success, cabinet_vi_repair_failed on error.
  #####################################################################
  - id: zen_cabinet_vi_autorepair
    alias: Zen Cabinet — VolumeInfo Autorepair
    description: >-
      zen_cabinet_vi_autorepair 1.0.0. Catches cabinet_vi_degraded zen_events
      emitted by Inspect when a cabinet VolumeInfo is stored as a JSON string.
      Calls zen_admintools_cabinetadmin mode=repair_volumeinfo on the entity,
      then emits cabinet_vi_repaired or cabinet_vi_repair_failed.
    mode: queued
    max: 5

    triggers:
      - trigger: event
        event_type: zen_event
        event_data:
          event:
            kind: cabinet_vi_degraded

    action:
      - variables:
          _cab: "{{ trigger.event.data['event']['metadata']['entity_id'] | default('') }}"
      - if:
        - condition: template
          value_template: "{{ _cab == '' }}"
        then:
        - stop: cabinet_vi_degraded — no entity_id in metadata
      - action: script.zen_admintools_cabinetadmin
        continue_on_error: true
        data:
          mode: repair_volumeinfo
          target_cabinet: "{{ _cab }}"
          caller_token: cabinet_vi_autorepair
        response_variable: _repair_result
      - choose:
        - conditions:
          - condition: template
            value_template: "{{ _repair_result is mapping and _repair_result.get('status') == 'success' }}"
          sequence:
          - event: zen_event
            event_data:
              event:
                kind: cabinet_vi_repaired
                component: cabinet_vi_autorepair
                severity: info
                summary: "VolumeInfo autorepaired on {{ _cab }}"
                metadata:
                  entity_id: "{{ _cab }}"
        default:
        - event: zen_event
          event_data:
            event:
              kind: cabinet_vi_repair_failed
              component: cabinet_vi_autorepair
              severity: error
              summary: "VolumeInfo autorepair FAILED on {{ _cab }}"
              metadata:
                entity_id: "{{ _cab }}"
                result: "{{ _repair_result }}"

script:
  zen_dojotools_lens_dispatch:
    alias: Zen DojoTools Lens Dispatch
    description: >-
      Generic lens provider dispatcher. Consumers pass typed anchors
      (label/person/area_id/zone/transaction/product); registered providers return
      optional enrichment. Provider failures are soft.
    mode: parallel
    max: 10
    fields:
      anchors_json:
        name: Anchors JSON
        description: 'JSON list of anchors: [{"type":"label","id":"foo"}].'
        selector:
          text:
            multiline: true
      consumer:
        name: Consumer
        description: Calling consumer name, e.g. inspect.
        selector:
          text:
      timeout_ms:
        name: Timeout MS
        description: Advisory timeout budget for providers.
        default: 1200
        selector:
          number:
            min: 100
            max: 10000
      mode:
        description: "Pass tool_manifest to get self-description."
        required: false
        selector:
          select:
            options:
              - tool_manifest

      caller_token:
        name: Caller Token
        selector:
          text:
    sequence:
      - variables:
          _tm_check: "{{ mode | default('') | lower }}"
      - choose:
        - conditions: "{{ _tm_check == 'tool_manifest' }}"
          sequence:
          - variables:
              result: >-
                {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
                {{ MF.tool_manifest(
                    tool='zen_dojotools_lens_dispatch',
                    display_name='Lens Dispatch',
                    tier='dojotools',
                    version='1.0.0',
                    health={'configured': true, 'status': 'ok', 'notes': []},
                    required_labels=['sutra'],
                    optional_labels=[],
                    consumes=['lens_consumer','lens_anchors'],
                    returns=['lens_evidence'],
                    icon='mdi:transit-connection-variant',
                    color='purple',
                    stripe=3,
                    impact='soft',
                    mcp_exposed=false,
                    caller_token=caller_token | default('')
                ) | from_json }}
          - stop: tool_manifest
            response_variable: result
      - variables:
          _consumer: "{{ consumer | default('unknown') | string | trim }}"
          _anchors_raw: "{{ anchors_json | default([]) }}"
          _lr_household: >-
            {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}{%- set _se = CABS.cabinet_drawer_value_mounted('sensor.zenos_system_cabinet', 'cab_schema_version') | from_json -%}
            {%- set _ma = (_se | int(0)) >= 1 -%}
            {%- set _cands = label_entities('zen_default_household_cabinet') | select('match', 'sensor\.') | list -%}
            {%- if _ma -%}
              {%- set ns = namespace(r='unavailable') -%}
              {%- for e in _cands -%}
                {%- if ns.r == 'unavailable' and states(e) == 'online_mounted' -%}{%- set ns.r = e -%}{%- endif -%}
              {%- endfor -%}
              {{ ns.r }}
            {%- else -%}
              {{ _cands | first | default('unavailable') }}
            {%- endif -%}

      - variables:
          _anchors: >-
            {%- if _anchors_raw is sequence and _anchors_raw is not string -%}
              {%- set a = _anchors_raw -%}
            {%- elif _anchors_raw is string and (_anchors_raw | trim)[:1] == '[' -%}
              {%- set a = _anchors_raw | trim | from_json -%}
            {%- elif _anchors_raw is string and (_anchors_raw | trim)[:1] == '"' -%}
              {%- set inner = _anchors_raw | trim | from_json -%}
              {%- set a = inner | from_json if inner is string and (inner | trim)[:1] == '[' else [] -%}
            {%- else -%}
              {%- set a = [] -%}
            {%- endif -%}
            {{ a if a is sequence and a is not string else [] }}
      - variables:
          _label_ids: >-
            {%- set ns = namespace(ids=[]) -%}
            {%- for a in _anchors if a is mapping and a.get('type', '') == 'label' -%}
              {%- set x = a.get('id', '') | string | trim | lower -%}
              {%- if x != '' -%}{%- set ns.ids = ns.ids + [x] -%}{%- endif -%}
            {%- endfor -%}
            {{ ns.ids | unique | list }}
          _person_ids: >-
            {%- set ns = namespace(ids=[]) -%}
            {%- for a in _anchors if a is mapping and a.get('type', '') == 'person' -%}
              {%- set x = a.get('id', '') | string | trim | lower -%}
              {%- if x != '' -%}{%- set ns.ids = ns.ids + [x] -%}{%- endif -%}
            {%- endfor -%}
            {{ ns.ids | unique | list }}
          _area_ids: >-
            {%- set ns = namespace(ids=[]) -%}
            {%- for a in _anchors if a is mapping and a.get('type', '') == 'area_id' -%}
              {%- set x = a.get('id', '') | string | trim | lower -%}
              {%- if x != '' -%}{%- set ns.ids = ns.ids + [x] -%}{%- endif -%}
            {%- endfor -%}
            {{ ns.ids | unique | list }}
          _zone_ids: >-
            {%- set ns = namespace(ids=[]) -%}
            {%- for a in _anchors if a is mapping and a.get('type', '') == 'zone' -%}
              {%- set x = a.get('id', '') | string | trim | lower -%}
              {%- if x != '' -%}{%- set ns.ids = ns.ids + [x] -%}{%- endif -%}
            {%- endfor -%}
            {{ ns.ids | unique | list }}
          _company_ids: >-
            {%- set ns = namespace(ids=[]) -%}
            {%- for a in _anchors if a is mapping and a.get('type', '') == 'company' -%}
              {%- set x = a.get('id', '') | string | trim -%}
              {%- if x != '' -%}{%- set ns.ids = ns.ids + [x] -%}{%- endif -%}
            {%- endfor -%}
            {{ ns.ids | unique | list }}
          _family_ids: >-
            {%- set ns = namespace(ids=[]) -%}
            {%- for a in _anchors if a is mapping and a.get('type', '') == 'family' -%}
              {%- set x = a.get('id', '') | string | trim -%}
              {%- if x != '' -%}{%- set ns.ids = ns.ids + [x] -%}{%- endif -%}
            {%- endfor -%}
            {{ ns.ids | unique | list }}
          _household_ids: >-
            {%- set ns = namespace(ids=[]) -%}
            {%- for a in _anchors if a is mapping and a.get('type', '') == 'household' -%}
              {%- set x = a.get('id', '') | string | trim -%}
              {%- if x != '' -%}{%- set ns.ids = ns.ids + [x] -%}{%- endif -%}
            {%- endfor -%}
            {{ ns.ids | unique | list }}
          _transaction_ids: >-
            {%- set ns = namespace(ids=[]) -%}
            {%- for a in _anchors if a is mapping and a.get('type', '') == 'transaction' -%}
              {%- set x = a.get('id', '') | string | trim -%}
              {%- if x != '' -%}{%- set ns.ids = ns.ids + [x] -%}{%- endif -%}
            {%- endfor -%}
            {{ ns.ids | unique | list }}
          _product_ids: >-
            {%- set ns = namespace(ids=[]) -%}
            {%- for a in _anchors if a is mapping and a.get('type', '') == 'product' -%}
              {%- set x = a.get('id', '') | string | trim -%}
              {%- if x != '' -%}{%- set ns.ids = ns.ids + [x] -%}{%- endif -%}
            {%- endfor -%}
            {{ ns.ids | unique | list }}
      - variables:
          _anchor_groups:
            - anchor_type: label
              anchor_ids: "{{ _label_ids }}"
            - anchor_type: person
              anchor_ids: "{{ _person_ids }}"
            - anchor_type: area_id
              anchor_ids: "{{ _area_ids }}"
            - anchor_type: zone
              anchor_ids: "{{ _zone_ids }}"
            - anchor_type: company
              anchor_ids: "{{ _company_ids }}"
            - anchor_type: family
              anchor_ids: "{{ _family_ids }}"
            - anchor_type: household
              anchor_ids: "{{ _household_ids }}"
            - anchor_type: transaction
              anchor_ids: "{{ _transaction_ids }}"
            - anchor_type: product
              anchor_ids: "{{ _product_ids }}"

      - action: script.zen_dojotools_filecabinet
        continue_on_error: true
        response_variable: _lens_registry_raw
        data:
          action_type: read
          show_hidden_volumes: false
          volume_entity_id:
            - "{{ _lr_household }}"
          key: lens_registry

      - variables:
          _lens_registry: >-
            {%- set raw = _lens_registry_raw if _lens_registry_raw is mapping else {} -%}
            {%- set value = raw.get('value', {}) if raw is mapping else {} -%}
            {%- set parsed = value | from_json if value is string else value -%}
            {{ parsed if parsed is mapping else {} }}
      - variables:
          _registered_providers: >-
            {{ _lens_registry if _lens_registry is mapping else {} }}
          _provider_outputs: []

      - repeat:
          for_each: "{{ _anchor_groups }}"
          sequence:
            - variables:
                _group_type: "{{ repeat.item.get('anchor_type', '') if repeat.item is mapping else '' }}"
                _group_ids: "{{ repeat.item.get('anchor_ids', []) if repeat.item is mapping else [] }}"
            - if: "{{ _group_ids | length > 0 }}"
              then:
                - repeat:
                    for_each: "{{ _registered_providers.items() | list }}"
                    sequence:
                      - variables:
                          _provider_key: "{{ repeat.item[0] | string | trim if repeat.item is sequence else '' }}"
                          _provider_decl: "{{ repeat.item[1] if repeat.item is sequence and repeat.item[1] is mapping else {} }}"
                      - variables:
                          _provider_enabled: "{{ _provider_decl.get('enabled', true) if _provider_decl is mapping else false }}"
                          _provider_consumes: "{{ _provider_decl.get('consumes', []) if _provider_decl is mapping and _provider_decl.get('consumes', []) is sequence and _provider_decl.get('consumes', []) is not string else [] }}"
                          _provider_returns: "{{ _provider_decl.get('returns', []) if _provider_decl is mapping and _provider_decl.get('returns', []) is sequence and _provider_decl.get('returns', []) is not string else [] }}"
                          _provider_tool: "{{ _provider_decl.get('tool', '') | string | trim if _provider_decl is mapping else '' }}"
                          _provider_mode: "{{ _provider_decl.get('mode', 'stacks_by_anchor') | string | trim if _provider_decl is mapping else 'stacks_by_anchor' }}"
                      - variables:
                          _provider_action: >-
                            {%- if _provider_tool == '' -%}
                            {%- elif '.' in _provider_tool -%}{{ _provider_tool }}
                            {%- else -%}script.{{ _provider_tool }}{%- endif -%}
                      - choose:
                          - conditions:
                              - condition: template
                                value_template: "{{ _provider_enabled and _provider_decl.get('status', 'available') | lower == 'available' and _provider_action != '' and _group_type in _provider_consumes and (_provider_returns | length) > 0 }}"
                            sequence:
                              - action: "{{ _provider_action }}"
                                continue_on_error: true
                                response_variable: _provider_raw
                                data:
                                  mode: "{{ _provider_mode }}"
                                  action: "{{ _provider_mode }}"
                                  anchor_type: "{{ _group_type }}"
                                  anchor_ids: "{{ _group_ids | tojson }}"
                                  caller_token: "{{ caller_token | default('') }}"
                              - variables:
                                  _provider_outputs: >-
                                    {{ _provider_outputs + [{
                                      'provider': _provider_key,
                                      'anchor_type': _group_type,
                                      'evidence': (_provider_raw.get('evidence', []) if _provider_raw is defined and _provider_raw is mapping else []),
                                      'count': (_provider_raw.get('count', 0) if _provider_raw is defined and _provider_raw is mapping else 0)
                                    }] }}
                        default: []

      - variables:
          _providers_response: >-
            {%- set ns = namespace(providers={}) -%}
            {%- for pkey, pdecl in _registered_providers.items() if _registered_providers is mapping and pdecl is mapping -%}
              {%- set doc_ns = namespace(docs=[], seen=[], was_called=false, call_counts={'label': 0, 'person': 0, 'area_id': 0, 'zone': 0, 'company': 0, 'family': 0, 'household': 0}) -%}
              {%- for out in _provider_outputs if out is mapping and out.get('provider', '') == pkey -%}
                {%- set doc_ns.was_called = true -%}
                {%- set atype = out.get('anchor_type', '') | string | trim -%}
                {%- set cnt = out.get('count', 0) | int(0) if out is mapping else 0 -%}
                {%- if atype in doc_ns.call_counts -%}
                  {%- set doc_ns.call_counts = doc_ns.call_counts | combine({atype: cnt}) -%}
                {%- endif -%}
                {%- set docs = out.get('evidence', []) if out is mapping and out.get('evidence', []) is sequence and out.get('evidence', []) is not string else [] -%}
                {%- for d in docs if d is mapping -%}
                  {%- set eid = d.get('evidence_id', pkey ~ ':evidence:' ~ loop.index | string) -%}
                  {%- if eid not in doc_ns.seen -%}
                    {%- set doc_ns.seen = doc_ns.seen + [eid] -%}
                    {%- set doc_ns.docs = doc_ns.docs + [d] -%}
                  {%- endif -%}
                {%- endfor -%}
              {%- endfor -%}
              {%- set _p_enabled = pdecl.get('enabled', false) -%}
              {%- set _p_reg_status = pdecl.get('status', 'unavailable') | string | lower | trim -%}
              {%- set _prov_status = 'disabled' if not _p_enabled else ('unavailable' if _p_reg_status != 'available' else ('success' if doc_ns.was_called else 'empty')) -%}
              {%- set _miss_reason = 'provider_disabled' if not _p_enabled else ('provider_offline' if _p_reg_status != 'available' else ('' if doc_ns.was_called else 'anchor_type_unsupported')) -%}
              {%- set _prov_entry = {
                'status': _prov_status,
                'department': pdecl.get('department', pdecl.get('section', '')),
                'consumes': pdecl.get('consumes', []),
                'returns': pdecl.get('returns', []),
                'count': doc_ns.docs | length,
                'documents': doc_ns.docs,
                'debug': {
                  'parsed_anchor_counts': {
                    'label': _label_ids | length,
                    'person': _person_ids | length,
                    'area_id': _area_ids | length,
                    'zone': _zone_ids | length,
                    'company': _company_ids | length,
                    'family': _family_ids | length,
                    'household': _household_ids | length
                  },
                  'provider_call_counts': doc_ns.call_counts
                }
              } -%}
              {%- set _prov_entry = _prov_entry | combine({'miss_reason': _miss_reason}) if _miss_reason != '' else _prov_entry -%}
              {%- set ns.providers = ns.providers | combine({pkey: _prov_entry}, recursive=true) -%}
            {%- endfor -%}
            {{ ns.providers }}
      - variables:
          _all_documents: >-
            {%- set ns = namespace(docs=[], seen=[]) -%}
            {%- for pkey, provider in _providers_response.items() if _providers_response is mapping and provider is mapping -%}
              {%- set docs = provider.get('documents', []) if provider.get('documents', []) is sequence and provider.get('documents', []) is not string else [] -%}
              {%- for d in docs if d is mapping -%}
                {%- set eid = d.get('evidence_id', pkey ~ ':evidence:' ~ loop.index | string) -%}
                {%- if eid not in ns.seen -%}
                  {%- set ns.seen = ns.seen + [eid] -%}
                  {%- set ns.docs = ns.docs + [d] -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endfor -%}
            {{ ns.docs }}
      - variables:
          _response:
            status: success
            tool: Zen DojoTools Lens Dispatch
            consumer: "{{ _consumer }}"
            anchors: "{{ _anchors }}"
            providers: "{{ _providers_response }}"
            evidence_count: "{{ _all_documents | length }}"
            evidence: "{{ _all_documents }}"
            content_redacted: true
            caller_token: "{{ caller_token | default('') }}"
      - stop: lens dispatch complete
        response_variable: _response

