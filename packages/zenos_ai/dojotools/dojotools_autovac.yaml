###############################################################################
# DojoTools — Autovac
# zen_dojotools_autovac (v5.2.0)
#
# Full vacuum control surface. All room state stored in the household cabinet
# ('autovac' drawer). Zero hardcoded entity IDs — all discovery via HA labels.
#
# Quick-start:
#   1. Apply labels in HA Settings > Labels + Entities:
#        autovac           → vacuum entity, map camera, last-clean sensors
#        autovac_dnd           → DnD binary_sensor (optional — disables runs when on)
#        autovac_water_low     → water-low binary_sensor (optional — warns in briefing)
#        autovac_schedule      → schedule entities that trigger runs
#        autovac_current_room  → vacuum current-room sensor (optional — enables per-room timing stats)
#   2. Add rooms:
#        mode=configure room=<slug> config='{"enabled":true,"segment":<num>,"days_between":7}'
#   3. Run mode=setup — verifies label wiring, inits cabinet drawer, deploys KFC dojo entry.
#      Optional: mode=setup config='{"provision_inventory":true}' to also provision Grocy ERP.
#      Seed whitelist (for richer ninja summaries): zen_admintools_prompt_loader mode=whitelist whitelist_type=seed action_type=add item=zen_dojotools_autovac
#   4. Place triggers in your personal KFC trigger file — see mode=help for details.
#
# Cabinet drawer: 'autovac' in Zen Household Cabinet
#   system:  {enabled, pause_today, minimum_battery, water_low_action, <schedule_slug>_has_run}
#   rooms:   {<slug>: {enabled, segment, days_between, require_confirmation,
#              last_cleaned, queued, skip_next, ready_to_clean, requires_mop}}
#
# Modes: status, help, setup, queue, dequeue, clear, skip, unskip, ready,
#        unready, mark_cleaned, configure, pause, unpause, clean, run,
#        analyze, briefing, handle_ack, nightly_reset, morning_reset,
#        consumables (action=status|add_to_shopping|log_replaced|log_purchased|provision),
#        check_wear (wear_entity= optional; omit for post-dock scan-all via analyze)
###############################################################################

script:

  zen_dojotools_autovac:
    alias: "Zen DojoTools Autovac"
    description: >-
      Full autonomous vacuum surface — room election, schedule-aware runs, inventory ERP loop for consumables.
      Use mode=help for full docs, label conventions, cabinet schema, and config recipes.
      mode=status: live snapshot — vacuum state, battery, elected rooms, next schedule.
      mode=setup: verify labels, init cabinet drawer, deploy KFC dojo entry (idempotent). mode=configure: view/update room or system settings.
      mode=preset preset=<name> rooms=<csv>: apply named config bundle.
      mode=queue/dequeue/skip/unskip/ready/unready/mark_cleaned room=<slug>: room state ops.
      mode=clean rooms=<csv>: immediate clean. mode=run_elected: run elected rooms now.
      mode=pause/unpause: gate today runs.
      mode=consumables action=status: stock levels. action=add_to_shopping: queue low/out.
      action=log_replaced part=<key>: record swap. action=log_purchased part=<key> amount=<n>: log spares.
      action=provision: first-time ERP setup (idempotent).
      mode=check_wear: IoT wear alert. wear_entity= targets one part; omit for scan-all (post-dock use).
    fields:
      mode:
        name: Mode
        description: "status|help|setup|configure|consumables|check_wear|etc. Default: status."
        default: status
        selector:
          select:
            options:
              - status
              - help
              - setup
              - queue
              - dequeue
              - clear
              - skip
              - unskip
              - ready
              - unready
              - mark_cleaned
              - configure
              - preset
              - consumables
              - check_wear
              - pause
              - unpause
              - clean
              - run_elected
              - run
              - analyze
              - briefing
              - handle_ack
              - nightly_reset
              - morning_reset
              - schedule
              - schedule_blocks
              - kfc_manifest
              - stacks_by_anchor
              - register
              - unregister
              - health
              - inspect
              - tool_manifest
      caller_token:
        name: Caller Token
        description: "Optional governance token — echoed in all responses."
        selector:
          text:
      room:
        name: Room
        description: "Room slug. Required for queue/dequeue/skip/unskip/ready/unready/configure."
        selector:
          text:
      config:
        name: Config
        description: "JSON string. configure: room fields to update. setup: {create_labels:true}."
        selector:
          text:
      rooms:
        name: Rooms (clean mode)
        description: "CSV room slugs. Required for mode=clean; optional for mode=preset."
        selector:
          text:
      dry_run:
        name: Dry Run
        description: "run_elected: preview without firing vacuum. setup: preview without writing cabinet or deploying KFC."
        default: false
        selector:
          boolean:
      action:
        name: Consumables Action
        description: "Consumables sub-action. See mode=help for full details. Default: status."
        selector:
          text:
      part:
        name: Part Key
        description: "Part key for log_replaced/log_purchased. See mode=help for valid keys."
        selector:
          text:
      amount:
        name: Amount
        description: "Quantity for consumables log_purchased. Default: 1."
        default: 1
        selector:
          number:
            min: 1
            step: 1
      wear_entity:
        name: Wear Entity
        description: "HA entity_id of wear sensor for check_wear. Omit to scan all."
        selector:
          text:
      preset:
        name: Preset Name
        description: "Preset name. Omit to list all available presets."
        selector:
          text:
      model_preset:
        name: Model Preset
        description: "Model preset key for action=provision. See mode=help for available keys."
        selector:
          text:
      schedule_entity_id:
        name: Schedule Entity ID
        description: "Triggering schedule entity. Required for mode=run."
        selector:
          text:
      trigger_id:
        name: Trigger ID
        description: "Context for mode=analyze: 'docked' or 'error'."
        selector:
          text:
      ack_action:
        name: Ack Action
        description: "Action taken (cancel, timeout, etc.). Required for mode=handle_ack."
        selector:
          text:
      ack_context:
        name: Ack Context
        description: "Context string from postman ack. For mode=handle_ack."
        selector:
          text:
      pm_tag:
        name: Postman Tag
        description: "Postman log tag for cleanup. For mode=handle_ack."
        selector:
          text:
      window_start:
        name: Window Start
        description: "Briefing window lower bound in seconds. Default 1770. For mode=schedule."
        default: 1770
        selector:
          number:
            min: 0
            step: 1
      window_end:
        name: Window End
        description: "Briefing window upper bound in seconds. Default 2400. For mode=schedule."
        default: 2400
        selector:
          number:
            min: 0
            step: 1
    sequence:

      # -- 0 Normalize inputs --------------------------------------------------
      - variables:
          _mode:               "{{ mode | default('status') | lower | trim }}"
          _caller_token:       "{{ caller_token | default('') | string | trim }}"
          _room:               "{{ room | default('') | string | lower | trim | replace(' ', '_') }}"
          _rooms:              "{{ rooms | default('') | string | lower | trim }}"
          _schedule_entity_id: "{{ schedule_entity_id | default('') | string | trim }}"
          _trigger_id:         "{{ trigger_id | default('docked') | string | trim }}"
          _ack_action:         "{{ ack_action | default('') | string | lower | trim }}"
          _ack_context:        "{{ ack_context | default('') | string | trim }}"
          _pm_tag:             "{{ pm_tag | default('') | string | trim }}"
          _config:             "{{ config | default('{}') | string | trim }}"

      # -- 0.5 Entity discovery via labels ------------------------------------
      - variables:
          _hh_cabinet: >-
            {{ label_entities('Zen Household Cabinet')
               | select('match', 'sensor\.')
               | list | first | default('') }}
          _vac_ent: >-
            {{ label_entities('autovac')
               | select('match', 'vacuum\.')
               | list | first | default('') }}
          _cam_ent: >-
            {{ label_entities('autovac')
               | select('match', 'camera\.')
               | list | first | default('') }}
          _dnd_ent: >-
            {{ label_entities('autovac_dnd')
               | select('match', 'binary_sensor\.')
               | list | first | default('') }}
          _water_low_ent: >-
            {{ label_entities('autovac_water_low')
               | select('match', 'binary_sensor\.')
               | list | first | default('') }}
          _last_area_ent: >-
            {{ label_entities('autovac')
               | select('match', 'sensor\.')
               | select('search', 'last_clean_area')
               | list | first | default('') }}
          _last_dur_ent: >-
            {{ label_entities('autovac')
               | select('match', 'sensor\.')
               | select('search', 'last_clean_dur')
               | list | first | default('') }}
          _last_start_ent: >-
            {{ label_entities('autovac')
               | select('match', 'sensor\.')
               | select('search', 'last_clean_start')
               | list | first | default('') }}

      # -- help (early exit — no cabinet state needed) -------------------------
      - if: "{{ _mode == 'help' }}"
        then:
          - action: script.zen_dojotools_filecabinet
            data:
              action_type: read
              volume_entity_id: "{{ _hh_cabinet }}"
              key: autovac
            response_variable: _fc_help
          - variables:
              _h_raw: >-
                {%- set val = _fc_help.get('value', {}) -%}
                {{ (val | from_json) if val is string else val }}
              _h_sys:  "{{ _h_raw.get('system', {}) }}"
              _h_rms:  "{{ _h_raw.get('rooms', {}) }}"
          - variables:
              _help_system: >-
                {{ {
                  'enabled':          _h_sys.get('enabled', true) | bool(true),
                  'pause_today':      _h_sys.get('pause_today', false) | bool(false),
                  'water_low_action': _h_sys.get('water_low_action', 'warn'),
                  'minimum_battery':  _h_sys.get('minimum_battery', 20) | int(20)
                } }}
              _help_rooms: >-
                {%- set ns = namespace(r=[]) -%}
                {%- for slug, cfg in _h_rms.items() -%}
                  {%- set ns.r = ns.r + [{'room': slug,
                    'enabled':        cfg.get('enabled', true) | bool(true),
                    'days_between':   cfg.get('days_between', 0) | int(0),
                    'requires_ready': cfg.get('requires_ready', false) | bool(false),
                    'requires_mop':   cfg.get('requires_mop', false) | bool(false),
                    'last_cleaned':   cfg.get('last_cleaned', 'never'),
                    'is_ready':       cfg.get('is_ready', false) | bool(false),
                    'skip_next':      cfg.get('skip_next', false) | bool(false),
                    'queued':         cfg.get('queued', false) | bool(false)
                  }] -%}
                {%- endfor -%}
                {{ ns.r | sort(attribute='room') }}
              _help_labels: >-
                {{ {
                  'autovac':              _vac_ent if _vac_ent != '' else 'NOT WIRED',
                  'autovac_dnd':          _dnd_ent if _dnd_ent != '' else 'NOT WIRED (optional)',
                  'autovac_water_low':    _water_low_ent if _water_low_ent != '' else 'NOT WIRED (optional)',
                  'autovac_camera':       _cam_ent if _cam_ent != '' else 'NOT WIRED (optional)',
                  'autovac_schedule':     label_entities('autovac_schedule') | list,
                  'autovac_current_room': label_entities('autovac_current_room') | select('match', 'sensor\.') | list | first | default('NOT WIRED (optional)'),
                  'autovac_wear':         label_entities('autovac_wear') | list
                } }}
              _help_schedules: >-
                {%- set ns = namespace(s=[]) -%}
                {%- for e in label_entities('autovac_schedule') | list -%}
                  {%- set ne = state_attr(e, 'next_event') -%}
                  {%- set ne_str = as_datetime(ne).strftime('%Y-%m-%dT%H:%M:%S') if ne is not none else 'unknown' -%}
                  {%- set ns.s = ns.s + [{'entity': e, 'state': states(e), 'next_event': ne_str}] -%}
                {%- endfor -%}
                {{ ns.s }}
              _help_setup_status: >-
                {%- if _vac_ent == '' -%}not_configured — vacuum entity not labeled autovac
                {%- elif label_entities('autovac_schedule') | list | length == 0 -%}not_configured — no schedule entities labeled autovac_schedule
                {%- elif _h_rms | length == 0 -%}no_rooms — system wired but no rooms configured yet
                {%- elif not _h_sys.get('enabled', true) | bool(true) -%}disabled — system enabled=false in cabinet
                {%- else -%}ok — {{ _h_rms | length }} room(s) configured, {{ label_entities('autovac_schedule') | list | length }} schedule(s) wired
                {%- endif -%}
          - variables:
              response: >-
                {{ {
                  'mode': 'help',
                  'result': 'ok',
                  'caller_token': _caller_token,
                  'live': {
                    'setup_status':   _help_setup_status | trim,
                    'current_system': _help_system,
                    'current_rooms':  _help_rooms,
                    'current_labels': _help_labels,
                    'current_schedules': _help_schedules
                  },

                  'summary': 'Autonomous vacuum scheduler with per-room election, schedule-aware runs, consumables ERP, and IoT wear tracking. Rooms are configured once; the system elects them automatically based on days since last clean, readiness gates, and schedule availability. Runs fire from HA schedule entities. The robot does the rest.',

                  'understand': {
                    'election_flow': 'A room fires when ALL three layers pass: (1) Global gates — enabled=true, due (days_since_cleaned >= days_between OR force-queued), requires_ready=false OR is_ready=true, skip_next=false. (2) Per-room schedule — if room has an autovac_room_schedule entity, it only fires when that entity is on; otherwise it participates in global runs normally. (3) Blackout — rooms vetoed by an active autovac_blackout entity (or block data blackout_rooms key) are excluded regardless.',
                    'schedule_model': 'Schedule entities (HA schedule helper) define WHEN the vacuum runs. Label them autovac_schedule. Day scoping: label a schedule autovac_weekday, autovac_weekend, or autovac_mon/tue/wed/thu/fri/sat/sun to restrict it. No day label = fires every day. Priority order when multiple match: specific-day (1) > day-class weekday/weekend (2) > universal (3).',
                    'room_schedule_model': 'Per-room exception schedule: create a schedule helper, assign it to the room area in HA, label it autovac_room_schedule + autovac_schedule (+ day labels). Room is excluded from all global runs and only fires when its own entity is on. Existing trigger automation picks it up automatically via autovac_schedule label.',
                    'blackout_model': 'Blackout window: create a schedule helper, label it autovac_blackout. Area-assigned = vetoes only rooms in that area. No area = full house blackout while entity is on. Blackout always wins — overrides per-room schedule and block data.',
                    'requires_ready': 'Safety gate for rooms that need human confirmation before cleaning (obstacle-prone rooms, rooms with pets/guests). Set requires_ready=true. Room will not fire until mode=ready room=<slug> is called. morning_reset re-gates after each morning run.',
                    'water_low_action': 'Controls mop-room behavior when water tank is low. warn=run proceeds with a briefing warning. stop=mop rooms (requires_mop=true) are blocked entirely until tank is refilled.',
                    'integration_types': 'roborock_native: uses vacuum.clean_area with HA area names — room slug must match HA area name, or set area_id override. xiaomi_miio: uses segment IDs from the robot map — set segment= on each room via configure.'
                  },

                  'init': {
                    'step_1_labels': 'Apply HA labels to entities. Required: label vacuum entity with autovac. Optional but recommended: autovac_dnd (DnD binary_sensor), autovac_water_low (water-low binary_sensor), autovac_schedule (schedule helpers), autovac_current_room (current-room sensor for timing stats), autovac_wear (Roborock wear sensors).',
                    'step_2_setup': 'Run mode=setup — audits label wiring, reports missing entities, lists room issues. Add config={"create_labels":true} to auto-create missing label objects (still need to assign entities in HA UI afterward).',
                    'step_3_rooms': 'Add rooms: mode=configure room=<slug> config={"days_between":7}. Or apply a preset bundle: mode=preset preset=<name> rooms=<csv>. Presets: obstacle_prone, mop_room, guest_room, high_traffic, twice_weekly, weekly, disabled, standard.',
                    'step_4_schedules': 'Create HA schedule helpers and label them autovac_schedule. Scope by day with autovac_weekday / autovac_weekend / autovac_mon etc. The automation controller wires the rest automatically. Optional: per-room schedule (autovac_room_schedule + autovac_schedule, area-assigned); blackout window (autovac_blackout, area optional). See schedule_setup_guide for step-by-step instructions.',
                    'step_5_consumables': 'Optional ERP loop. Run mode=consumables action=provision model_preset=<key> to create Grocy inventory locations, products, and maintenance chores. Parts: main_brush, side_brushes, hepa_filter, dust_bags, washable_pad, disposable_pads. Model presets: roborock_s7_plus, roborock_s8_plus, roborock_s8_pro_ultra, roborock_s7_maxv_ultra, roborock_q7_max_plus (generics also available). Idempotent — safe to re-run.',
                    'roborock_area_id': 'If room slug does not match the HA area name exactly: mode=configure room=<slug> config={"area_id":"<exact_ha_area_name>"}. This overrides the slug-based lookup for vacuum.clean_area calls.',
                    'xiaomi_segments': 'For xiaomi_miio integration: mode=configure room=<slug> config={"segment":<map_id>} for each room. Segment IDs come from the robot map in the Xiaomi app.'
                  },

                  'daily_ops': {
                    'status': 'Full live snapshot. Returns: vacuum_state, battery, run_readiness (can_run_now + blockers[]), elected_rooms[], schedule_entities[], last_run, next_schedule, room_decisions[] per room. Start here for any question about what the vacuum is doing or why it is not running.',
                    'run_elected': 'Fire all currently elected rooms now. dry_run=true previews election + sends Postman notification without starting the vacuum. Use to test election logic.',
                    'clean': 'Immediate clean — bypasses election. rooms=<csv of slugs> required. Vacuum must be docked or idle.',
                    'pause': 'Block all scheduled runs for the rest of today. Postman briefings still fire.',
                    'unpause': 'Re-enable scheduled runs for today.',
                    'queue': 'Force-add a room to the next run regardless of days_between or due state. room=<slug>. Cleared after the run.',
                    'dequeue': 'Remove a room from the force queue. room=<slug>.',
                    'clear': 'Clear all force-queued rooms at once.',
                    'skip': 'Keep a room out of the next scheduled run only. room=<slug>. Auto-clears after the run.',
                    'unskip': 'Clear skip flag. room=<slug>.',
                    'ready': 'Mark a requires_ready room as confirmed OK to clean. room=<slug>.',
                    'unready': 'Revoke ready confirmation. room=<slug>.',
                    'mark_cleaned': 'Manually record today as last_cleaned for a room (e.g. hand-mopped). room=<slug>. Resets the due timer.'
                  },

                  'configure': {
                    'view_room': 'mode=configure room=<slug> — show all current settings for that room.',
                    'update_room': 'mode=configure room=<slug> config=<json> — patch room fields. Fields: enabled (bool), days_between (int), requires_ready (bool), requires_mop (bool), segment (int, xiaomi only), area_id (str, roborock override), notes (str).',
                    'view_system': 'mode=configure (no room) — show system config: enabled, water_low_action, minimum_battery.',
                    'update_system': 'mode=configure config={"enabled":false} or {"water_low_action":"stop"} — update system-level settings.',
                    'presets': 'mode=preset preset=<name> rooms=<csv> — apply a named bundle. mode=preset alone lists all presets. Available: obstacle_prone (requires_ready=true), mop_room (requires_mop=true), guest_room (days_between=14 + requires_ready), high_traffic (days_between=1), twice_weekly (days_between=3), weekly (days_between=7), disabled (enabled=false), standard (enabled=true, days_between=7, requires_ready=false).'
                  },

                  'consumables': {
                    'status': 'mode=consumables action=status — stock levels for all parts. Returns consumables[] (part/name/amount/status ok|low|out) + shopping_actions[] listing what needs ordering.',
                    'add_to_shopping': 'mode=consumables action=add_to_shopping — auto-queue all low/out parts to Grocy shopping list in one call.',
                    'log_replaced': 'mode=consumables action=log_replaced part=<key> — record installing a spare. Consumes one from stock and executes the linked maintenance chore.',
                    'log_purchased': 'mode=consumables action=log_purchased part=<key> amount=<n> — record buying spares. Adds to stock at the configured storage location.',
                    'part_keys': 'main_brush, side_brushes, hepa_filter, dust_bags, washable_pad, disposable_pads',
                    'wear_alerts': 'IoT wear loop fires automatically after each dock. If a part crosses its wear threshold: stock is checked, item is added to shopping list if out, Postman push sent. Recover: mode=consumables action=status to confirm, then action=log_replaced part=<key> after physically installing the spare. If result=not_found on check_wear — re-run action=provision to rebuild the wear_entity map.'
                  },

                  'troubleshoot': {
                    'room_not_cleaning': 'Run mode=status and check room_decisions[<slug>]. Gates in order: (1) enabled=false → mode=configure room=<slug> config={"enabled":true}. (2) not due → days_since_cleaned < days_between; use mode=queue to force one-off or mode=mark_cleaned to reset timer. (3) requires_ready + not is_ready → call mode=ready room=<slug>. (4) skip_next=true → call mode=unskip room=<slug>. (5) At run time: vacuum busy/error, low battery, or water_low blocking mop room.',
                    'vacuum_not_running': 'Check run_readiness.blockers in mode=status. Blockers: system_disabled (mode=configure config={"enabled":true}), paused_today (mode=unpause), dnd (DnD sensor is on — will resume when DnD clears), low_battery (vacuum charging — will run on next schedule), vacuum_not_ready (vacuum in error or unavailable — check HA vacuum entity), water_low_mop_required (fill tank or set water_low_action=warn), no_rooms_elected (no rooms pass election — check room_decisions).',
                    'schedule_not_firing': 'Verify: (1) schedule entity is labeled autovac_schedule. (2) Schedule has correct day scoping labels (autovac_weekday / autovac_weekend / autovac_mon etc). (3) Schedule entity is enabled in HA. (4) mode=schedule returns valid_today with this schedule listed.',
                    'room_excluded_from_global': 'Room has an autovac_room_schedule entity assigned — it opts out of global election. Check mode=schedule_blocks entity_meta for layer=room_sched. Room will only run when its own schedule entity is on or when triggered directly as schedule_entity_id.',
                    'room_schedule_not_triggering': 'Per-room schedule entity must carry autovac_schedule label (so trigger automation catches it) AND autovac_room_schedule label (so mode=run scopes to that room). Confirm both labels in mode=schedule_blocks entity_meta.',
                    'unexpected_blackout': 'A room or full run is excluded that should not be. Check mode=schedule_blocks entity_meta for any layer=blackout entities currently on. Blackout entities veto regardless of other settings.',
                    'no_briefing': 'Briefing fires ~30 min before a schedule via zen_event autovac_prerun_briefing. Check: (1) automation zen_autovac_controller is enabled. (2) mode=schedule returns in_window with an entity when tested in the 5-30 min pre-run window.',
                    'consumables_unavailable': 'Grocy catalog not provisioned. Run mode=consumables action=provision model_preset=<key> to enable ERP and wear tracking. Idempotent — safe to re-run if partially provisioned.',
                    'wear_entity_not_found': 'check_wear returned result=not_found. The wear sensor is not in the catalog wear_entity map. Re-run mode=consumables action=provision to rebuild the map from current HA entities.'
                  },

                  'disable': {
                    'pause_today': 'mode=pause — skip all scheduled runs today only. Resets at midnight. Briefings still fire.',
                    'disable_system': 'mode=configure config={"enabled":false} — halt all automated runs until re-enabled. mode=status will show system_disabled blocker. Re-enable: mode=configure config={"enabled":true}.',
                    'disable_one_room': 'mode=configure room=<slug> config={"enabled":false} — remove one room from election permanently. Room stays in cabinet but never fires. Shortcut: mode=preset preset=disabled rooms=<slug>. Re-enable: mode=preset preset=standard rooms=<slug>.',
                    'skip_one_run': 'mode=skip room=<slug> — keep a room out of the next scheduled run only. Auto-clears after that run.',
                    'disable_schedule': 'Disable the HA schedule helper entity directly in HA UI or via mode=configure config — autovac will not see it as active.',
                    'full_stop': 'To completely disable autovac: (1) mode=configure config={"enabled":false} stops all runs. (2) mode=pause as backup for today. (3) Optionally disable schedule entities in HA to prevent any triggers. System state is preserved in cabinet — re-enable at any time.'
                  },

                  'schedule_setup_guide': {
                    'docs': 'Official HA schedule integration docs: https://www.home-assistant.io/integrations/schedule/',
                    'what_is_a_schedule': 'An HA Schedule helper is a calendar-style entity that turns on and off on a weekly repeating timetable. Autovac uses it purely as a clock signal — when the schedule turns on, the run triggers. Think of it as a smart timer with day-of-week awareness.',
                    'create_global_schedule': 'Settings → Devices & Services → Helpers → + Create Helper → Schedule. Give it a name (e.g. "AutoVac Weekday Morning"). Add time blocks for each day you want it to fire (e.g. Mon–Fri 7:00–7:30 AM). Save. Then in HA Labels, assign it: autovac_schedule + autovac_weekday (or autovac_weekend, or autovac_mon etc for day-specific). That is all — autovac discovers it automatically.',
                    'create_room_schedule': 'Same as above but: (1) Assign the entity to the room area in HA (entity settings → Area). This is how autovac knows which room it governs — no config needed. (2) Label it autovac_room_schedule + autovac_schedule + a day/scope label. The room will now opt out of all global runs and only clean when this schedule is on.',
                    'create_blackout': 'Same helper creation. Label it autovac_blackout. If you assign it to an area, only rooms in that area are blocked while the schedule is on. No area = full house blackout. Does not need autovac_schedule — it is never a run trigger, only a veto.',
                    'block_data': 'Optional per-run overrides: in the schedule block editor, expand Advanced and add Data fields (key/value). Supported keys: skip_rooms (CSV of room slugs to exclude this run), rooms (CSV whitelist — only these rooms run), mode (vacuum mode string). Data only applies to the specific block it is set on.',
                    'verify': 'After creating and labeling a schedule, run mode=schedule_blocks to confirm it appears with the correct layer (global / room_sched / blackout) and mode=schedule to verify it is seen as valid_today on the right days.'
                  },

                  'labels': {
                    'autovac': 'REQUIRED. Assign to: vacuum entity, map camera (optional), last-clean area/duration/start sensors (optional).',
                    'autovac_schedule': 'REQUIRED for scheduled runs. Assign to HA schedule helper entities. All schedule types use this label — global runs, per-room schedules, and room-specific triggers.',
                    'autovac_weekday': 'Day-scope. Schedule fires Mon–Fri only. Priority p=2.',
                    'autovac_weekend': 'Day-scope. Schedule fires Sat–Sun only. Priority p=2.',
                    'autovac_mon/tue/wed/thu/fri/sat/sun': 'Day-scope. Schedule fires on that specific day only. Priority p=1 (beats weekday/weekend).',
                    'autovac_room_schedule': 'Per-room exception schedule. Assign to a schedule helper that is ALSO area-assigned in HA. Room opts out of all global runs and only fires when this entity is on. Must also carry autovac_schedule + day label so the existing trigger automation catches it.',
                    'autovac_blackout': 'Blackout window. Assign to a schedule helper. Area-assigned = vetoes rooms in that area while on. No area = full house blackout. Layer 3 — overrides everything including per-room schedules.',
                    'autovac_dnd': 'Optional. Binary sensor. Gates all runs while on.',
                    'autovac_water_low': 'Optional. Binary sensor. Triggers water_low_action behavior.',
                    'autovac_current_room': 'Optional. Current-room sensor. Enables per-room timing stats.',
                    'autovac_wear': 'Optional (auto-applied at provision). Roborock wear sensors for IoT→ERP wear loop.',
                    'Zen Household Cabinet': 'REQUIRED (system label). Cabinet sensor must exist.'
                  },

                  'automation_only_modes': 'These are called by the zen_autovac_controller automation — do not call them manually: run (schedule trigger), analyze (post-dock map), briefing (pre-run notice), handle_ack (Postman response), nightly_reset (midnight), morning_reset (post-morning-run), check_wear (IoT wear trigger).',

                  'cabinet_schema': {
                    'drawer': 'autovac (in household cabinet)',
                    'system_keys': 'enabled, pause_today, minimum_battery, water_low_action, <schedule_slug>_has_run',
                    'room_keys': 'enabled, segment, area_id, days_between, requires_ready, requires_mop, notes, last_cleaned, queued, skip_next, is_ready',
                    'grocy_catalog': 'Written by consumables action=provision. Contains robot SN, location IDs, and per-part product/chore/wear_entity data. Stored under autovac.grocy_catalog in household cabinet.'
                  }
                } | tojson }}
          - variables:
              _dom_inner: "{{ (response | from_json) | combine({'domain': 'household_ops', 'peers': {'room_manager': 'zen_dojotools_room_manager'}, 'see_also': 'zen_dojotools_manifest mode=domains name=household_ops'}) }}"
          - variables:
              response: "{{ {'status': 'help', 'help': _dom_inner} }}"
          - stop: "autovac help"
            response_variable: response

      # -- mode=schedule (early exit — no cabinet needed) ----------------------
      # Single source of truth for all schedule day-validity logic.
      # Every consumer calls this. Zero inline schedule logic elsewhere.
      - if: "{{ _mode == 'schedule' }}"
        then:
          - variables:
              _sc_win_start: "{{ window_start | default(1770) | int(1770) }}"
              _sc_win_end:   "{{ window_end   | default(2400) | int(2400) }}"
              _sc_schedules: "{{ label_entities('autovac_schedule') | list }}"
              _sc_today_abbr: "{{ ['mon','tue','wed','thu','fri','sat','sun'][now().weekday()] }}"
              _sc_is_weekend: "{{ now().weekday() >= 5 }}"
          - variables:
              _sc_l_today:   "{{ label_entities('autovac_' ~ _sc_today_abbr) | list }}"
              _sc_l_weekday: "{{ label_entities('autovac_weekday') | list }}"
              _sc_l_weekend: "{{ label_entities('autovac_weekend') | list }}"
              _sc_l_any_day: >-
                {%- set ns = namespace(all=[]) -%}
                {%- for _d in ['mon','tue','wed','thu','fri','sat','sun'] -%}
                  {%- set ns.all = ns.all + label_entities('autovac_' ~ _d) | list -%}
                {%- endfor -%}
                {{ (ns.all + _sc_l_weekday + _sc_l_weekend) | unique | list }}
          - variables:
              _sc_valid_today: >-
                {%- set ns = namespace(v=[]) -%}
                {%- for s in _sc_schedules -%}
                  {%- set np = namespace(p=99) -%}
                  {%- if s in _sc_l_today -%}{%- set np.p = 1 -%}
                  {%- elif not (s in _sc_l_any_day) -%}{%- set np.p = 3 -%}
                  {%- elif (s in _sc_l_weekday and not _sc_is_weekend) or (s in _sc_l_weekend and _sc_is_weekend) -%}{%- set np.p = 2 -%}
                  {%- endif -%}
                  {%- if np.p < 99 -%}
                    {%- set ns.v = ns.v + [{'entity': s, 'priority': np.p}] -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.v | sort(attribute='priority') }}
              _sc_active: >-
                {%- set ns = namespace(entity='', label='') -%}
                {%- set valid_eids = [] -%}
                {%- for s in _sc_schedules -%}
                  {%- set np = namespace(p=99) -%}
                  {%- if s in _sc_l_today -%}{%- set np.p = 1 -%}
                  {%- elif not (s in _sc_l_any_day) -%}{%- set np.p = 3 -%}
                  {%- elif (s in _sc_l_weekday and not _sc_is_weekend) or (s in _sc_l_weekend and _sc_is_weekend) -%}{%- set np.p = 2 -%}
                  {%- endif -%}
                  {%- if np.p < 99 and states(s) == 'on' -%}
                    {%- set ne = state_attr(s, 'next_event') -%}
                    {%- if ne is not none -%}
                      {%- set h = as_datetime(ne).hour | int -%}
                      {%- set ns.label = ('morning' if h < 12 else 'evening') ~ ' window open until ' ~ as_datetime(ne).strftime('%I:%M %p') -%}
                    {%- else -%}
                      {%- set ns.label = 'active' -%}
                    {%- endif -%}
                    {%- set ns.entity = s -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ {'entity': ns.entity, 'label': ns.label} if ns.entity != '' else none }}
          - variables:
              _sc_next: >-
                {%- set ns = namespace(entity='', secs=999999, label='', priority=99) -%}
                {%- for item in _sc_valid_today -%}
                  {%- set s = item.entity -%}
                  {%- set p = item.priority -%}
                  {%- if states(s) == 'off' -%}
                    {%- set ne = state_attr(s, 'next_event') -%}
                    {%- if ne is not none -%}
                      {%- set delta = (as_datetime(ne) - now()).total_seconds() | int(-1) -%}
                      {%- if delta > 0 and (p < ns.priority or (p == ns.priority and delta < ns.secs)) -%}
                        {%- set ns.secs = delta -%}
                        {%- set ns.priority = p -%}
                        {%- set h = as_datetime(ne).hour | int -%}
                        {%- set ns.label = ('morning' if h < 12 else 'evening') ~ ' at ' ~ as_datetime(ne).strftime('%I:%M %p') -%}
                        {%- set ns.entity = s -%}
                      {%- endif -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ {'entity': ns.entity, 'priority': ns.priority, 'in_seconds': (ns.secs if ns.secs < 999999 else -1), 'label': ns.label} if ns.entity != '' else none }}
              _sc_in_window: >-
                {%- set ns = namespace(entity='', priority=99) -%}
                {%- for item in _sc_valid_today -%}
                  {%- set s = item.entity -%}
                  {%- set p = item.priority -%}
                  {%- if states(s) == 'off' -%}
                    {%- set ne = state_attr(s, 'next_event') -%}
                    {%- if ne is not none and as_datetime(ne).date() == now().date() -%}
                      {%- set delta = (as_datetime(ne) - now()).total_seconds() | int(-1) -%}
                      {%- if delta > 0 and delta >= _sc_win_start and delta <= _sc_win_end and p < ns.priority -%}
                        {%- set ns.entity = s -%}
                        {%- set ns.priority = p -%}
                      {%- endif -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ {'entity': ns.entity, 'priority': ns.priority} if ns.entity != '' else none }}
              _sc_7day: >-
                {%- set day_abbrs = ['mon','tue','wed','thu','fri','sat','sun'] -%}
                {%- set ns = namespace(days=[]) -%}
                {%- for offset in range(7) -%}
                  {%- set target_dt = now() + timedelta(days=offset) -%}
                  {%- set target_dow = (now().weekday() + offset) % 7 -%}
                  {%- set target_abbr = day_abbrs[target_dow] -%}
                  {%- set target_is_weekend = target_dow >= 5 -%}
                  {%- set l_day = label_entities('autovac_' ~ target_abbr) | list -%}
                  {%- set l_any = (l_day + _sc_l_weekday + _sc_l_weekend) | unique | list -%}
                  {%- set nw = namespace(scheds=[]) -%}
                  {%- for s in _sc_schedules -%}
                    {%- set np = namespace(p=99) -%}
                    {%- if s in l_day -%}{%- set np.p = 1 -%}
                    {%- elif not (s in l_any) -%}
                      {%- if ('weekday' in s and not target_is_weekend) or ('weekend' in s and target_is_weekend) or ('weekday' not in s and 'weekend' not in s) -%}{%- set np.p = 3 -%}{%- endif -%}
                    {%- elif (s in _sc_l_weekday and not target_is_weekend) or (s in _sc_l_weekend and target_is_weekend) -%}{%- set np.p = 2 -%}
                    {%- endif -%}
                    {%- if np.p < 99 -%}
                      {%- set ne = state_attr(s, 'next_event') -%}
                      {%- if ne is not none -%}
                        {%- set confirmed = as_datetime(ne).date() == target_dt.date() -%}
                        {%- set nw.scheds = nw.scheds + [{'entity': s, 'fire_at': as_datetime(ne).strftime('%I:%M %p'), 'confirmed': confirmed}] -%}
                      {%- endif -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {%- set ns.days = ns.days + [{'date': target_dt.strftime('%Y-%m-%d'), 'day': target_abbr, 'schedules': nw.scheds, 'has_run': none}] -%}
                {%- endfor -%}
                {{ ns.days }}
          - variables:
              response: >-
                {{ {
                  'mode': 'schedule',
                  'result': 'ok',
                  'caller_token': _caller_token,
                  'valid_today': _sc_valid_today,
                  'next': _sc_next,
                  'in_window': _sc_in_window,
                  'active': _sc_active,
                  'schedule_7day': _sc_7day,
                  'window_start': _sc_win_start,
                  'window_end': _sc_win_end
                } }}
          - stop: "autovac schedule"
            response_variable: response

      # -- mode=schedule_blocks — raw schedule.get_schedule response ----------
      # Calls schedule.get_schedule targeting label:autovac_schedule.
      # Returns the raw block/event structure so we can see all fields
      # (area, notes, custom data) available for room-scoped scheduling.
      - if: "{{ _mode == 'schedule_blocks' }}"
        then:
          - action: schedule.get_schedule
            continue_on_error: true
            response_variable: _sb_raw
            data: {}
            target:
              label_id: autovac_schedule
          - variables:
              _sb_parsed: >-
                {%- set r = _sb_raw | string -%}
                {{ r | regex_replace("'data': \\{\\},?\\s*", "") }}
              # Enrich each schedule entity with labels, state, area, and attributes
              _sb_entity_meta: >-
                {%- set ns = namespace(items={}) -%}
                {%- for e in label_entities('autovac_schedule') -%}
                  {%- set lbl_ids = labels(e) | list -%}
                  {%- set lbl_descs = namespace(d={}) -%}
                  {%- for l in lbl_ids -%}
                    {%- set lbl_descs.d = lbl_descs.d | combine({l: label_description(l) | default('')}) -%}
                  {%- endfor -%}
                  {%- set _lyr = 'room_sched' if e in label_entities('autovac_room_schedule')
                      else 'blackout' if e in label_entities('autovac_blackout')
                      else 'global' -%}
                  {%- set meta = {
                    'state': states(e),
                    'friendly_name': state_attr(e, 'friendly_name') | default(''),
                    'icon': state_attr(e, 'icon') | default(''),
                    'next_event': state_attr(e, 'next_event') | string if state_attr(e, 'next_event') is not none else none,
                    'area': area_name(e) | default(none),
                    'labels': lbl_ids,
                    'label_descriptions': lbl_descs.d,
                    'layer': _lyr
                  } -%}
                  {%- set ns.items = ns.items | combine({e: meta}) -%}
                {%- endfor -%}
                {{ ns.items }}
          - variables:
              response: >-
                {{ {
                  'mode': 'schedule_blocks',
                  'result': 'ok',
                  'caller_token': _caller_token,
                  'hint': 'blocks: raw schedule.get_schedule per entity. entity_meta: labels, state, area, next_event per entity.',
                  'blocks': _sb_parsed,
                  'entity_meta': _sb_entity_meta
                } }}
          - stop: "autovac schedule_blocks"
            response_variable: response

      # -- 0.6 Cabinet — read autovac config drawer ----------------------------
      - action: script.zen_dojotools_filecabinet
        data:
          action_type: read
          volume_entity_id: "{{ _hh_cabinet }}"
          key: autovac
        response_variable: _fc_av
      - variables:
          _av_rooms: >-
            {%- set val = _fc_av.get('value', {}) -%}
            {%- set cfg = (val | from_json) if val is string else val -%}
            {{ cfg.get('rooms', {}) }}
          _av_system: >-
            {%- set val = _fc_av.get('value', {}) -%}
            {%- set cfg = (val | from_json) if val is string else val -%}
            {{ cfg.get('system', {}) }}
      - variables:
          _room_sched_map: >-
            {%- set ns = namespace(m={}) -%}
            {%- for ent in label_entities('autovac_room_schedule') | select('match', 'schedule\\.') | list -%}
              {%- set aid = area_id(ent) -%}
              {%- for rn, rv in _av_rooms.items() -%}
                {%- if rv.get('area_id', '') == aid and aid not in ['', none] -%}
                  {%- set ns.m = ns.m | combine({rn: ent}) -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endfor -%}
            {{ ns.m }}
          _blackout_rooms: >-
            {%- set ns = namespace(rooms=[]) -%}
            {%- for ent in label_entities('autovac_blackout') | select('match', 'schedule\\.') | list -%}
              {%- if states(ent) == 'on' -%}
                {%- set aid = area_id(ent) -%}
                {%- if aid in ['', none] -%}
                  {%- set ns.rooms = ['*'] -%}
                {%- else -%}
                  {%- for rn, rv in _av_rooms.items() -%}
                    {%- if rv.get('area_id', '') == aid -%}
                      {%- set ns.rooms = ns.rooms + [rn] -%}
                    {%- endif -%}
                  {%- endfor -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.rooms | unique | list }}

      # -- setup (after cabinet read so drawer status can be reported) ---------
      - if: "{{ _mode == 'setup' }}"
        then:
          - variables:
              _setup_cfg:            "{{ _config | from_json(default={}) }}"
              _dry_run:              "{{ dry_run | default(false) | bool(false) }}"
              _cabinet_ok:           "{{ _hh_cabinet != '' }}"
              _drawer_ok:            "{{ _av_rooms | length > 0 or _av_system | length > 0 }}"
              _vac_ok:               "{{ _vac_ent != '' }}"
              _cam_ok:               "{{ _cam_ent != '' }}"
              _dnd_ok:               "{{ _dnd_ent != '' }}"
              _water_ok:             "{{ _water_low_ent != '' }}"
              _sched_ok:             "{{ label_entities('autovac_schedule') | list | length > 0 }}"
              _setup_use_clean_area: "{{ _vac_ent != '' and _vac_ent in integration_entities('roborock') }}"
              _setup_cur_room_ent: >-
                {{ label_entities('autovac_current_room') | select('match', 'sensor\.') | list | first | default('') }}
          - variables:
              _cur_room_ok:   "{{ _setup_cur_room_ent != '' }}"
              _cur_room_live: >-
                {{ _setup_cur_room_ent != '' and states(_setup_cur_room_ent) not in ['unavailable', 'unknown', ''] }}
              _create_labels: "{{ _setup_cfg.get('create_labels', false) | bool(false) }}"
              _missing_label_names: >-
                {%- set ns = namespace(m=[]) -%}
                {%- if not _vac_ok -%}{%- set ns.m = ns.m + ['autovac'] -%}{%- endif -%}
                {%- if not _dnd_ok -%}{%- set ns.m = ns.m + ['autovac_dnd'] -%}{%- endif -%}
                {%- if not _water_ok -%}{%- set ns.m = ns.m + ['autovac_water_low'] -%}{%- endif -%}
                {%- if not _sched_ok -%}{%- set ns.m = ns.m + ['autovac_schedule'] -%}{%- endif -%}
                {%- if not _cur_room_ok -%}{%- set ns.m = ns.m + ['autovac_current_room'] -%}{%- endif -%}
                {{ ns.m }}
          - if: "{{ _create_labels and _missing_label_names | length > 0 }}"
            then:
              - action: script.zen_dojotools_labels
                data:
                  action_type: create
                  label_list: "{{ _missing_label_names }}"
          - variables:
              _room_audit: >-
                {%- set ns = namespace(audit=[]) -%}
                {%- for rn, rv in _av_rooms.items() -%}
                  {%- set iss = namespace(i=[]) -%}
                  {%- set sug = namespace(s=[]) -%}
                  {%- set seg = rv.get('segment', 0) | int(0) -%}
                  {%- set db  = rv.get('days_between', 0) | int(0) -%}
                  {%- set lc  = rv.get('last_cleaned', '') -%}
                  {%- if rv.get('enabled', true) and not _setup_use_clean_area and seg == 0 -%}
                    {%- set iss.i = iss.i + ['segment missing — room cannot be cleaned (xiaomi_miio requires segment ID)'] -%}
                    {%- set sug.s = sug.s + ['mode=configure room=' ~ rn ~ ' config={"segment": <map_id>}'] -%}
                  {%- endif -%}
                  {%- if _setup_use_clean_area and rv.get('area_id', '') == '' -%}
                    {%- set sug.s = sug.s + ['if HA area differs from slug: mode=configure room=' ~ rn ~ ' config={"area_id": "<ha_area>"}'] -%}
                  {%- endif -%}
                  {%- if rv.get('enabled', true) and db <= 0 -%}
                    {%- set iss.i = iss.i + ['days_between is 0 — room will never become due'] -%}
                    {%- set sug.s = sug.s + ['mode=configure room=' ~ rn ~ ' config={"days_between": 7}'] -%}
                  {%- endif -%}
                  {%- if lc != '' -%}
                    {%- set days_ago = ((now().timestamp() - as_timestamp(lc ~ 'T00:00:00', 0)) / 86400) | int(0) -%}
                    {%- if days_ago > 365 -%}
                      {%- set iss.i = iss.i + ['last_cleaned is ' ~ days_ago ~ ' days ago — may be stale'] -%}
                      {%- set sug.s = sug.s + ['mode=mark_cleaned room=' ~ rn ~ '  (if cleaned recently)'] -%}
                    {%- endif -%}
                  {%- endif -%}
                  {%- set is_err = rv.get('enabled', true) and not _setup_use_clean_area and seg == 0 -%}
                  {%- set status = 'error' if is_err else ('warn' if iss.i | length > 0 else 'ok') -%}
                  {%- set ns.audit = ns.audit + [{
                    'room': rn, 'enabled': rv.get('enabled', true),
                    'segment': seg, 'area_id': rv.get('area_id', ''),
                    'days_between': db, 'requires_ready': rv.get('requires_ready', false),
                    'requires_mop': rv.get('requires_mop', false),
                    'last_cleaned': lc, 'status': status,
                    'issues': iss.i, 'suggestions': sug.s}] -%}
                {%- endfor -%}
                {{ ns.audit }}
          - variables:
              _setup_action_queue: >-
                {%- set ns = namespace(q=[]) -%}
                {%- for ra in _room_audit -%}
                  {%- for s in ra.suggestions -%}
                    {%- set ns.q = ns.q + [s] -%}
                  {%- endfor -%}
                {%- endfor -%}
                {%- if not _cur_room_ok -%}
                  {%- set ns.q = ns.q + ['Optional: label vacuum current-room sensor with autovac_current_room — enables per-room timing stats'] -%}
                {%- elif not _cur_room_live -%}
                  {%- set ns.q = ns.q + ['autovac_current_room sensor is ' ~ states(_setup_cur_room_ent) ~ ' — timing stats paused'] -%}
                {%- endif -%}
                {{ ns.q }}
              _setup_has_errors: >-
                {{ _room_audit | selectattr('status', 'equalto', 'error') | list | length > 0 }}
              _setup_has_warns: >-
                {{ _room_audit | selectattr('status', 'equalto', 'warn') | list | length > 0 }}
          - variables:
              _setup_result: >-
                {%- if not _cabinet_ok or not _vac_ok or not _sched_ok -%}needs_config
                {%- elif _setup_has_errors -%}error
                {%- elif _setup_has_warns or _missing_label_names | length > 0 -%}warn
                {%- else -%}ok{%- endif -%}
              _setup_tip: >-
                {%- if _create_labels and _missing_label_names | length > 0 -%}
                  Label objects created. Assign entities in HA Settings > Labels, then run mode=setup again.
                {%- elif _missing_label_names | length > 0 -%}
                  Run mode=setup config='{"create_labels":true}' to create missing label objects, then assign entities.
                {%- elif _setup_has_errors -%}
                  One or more rooms have errors — check room_audit and action_queue for fix commands.
                {%- elif _setup_has_warns -%}
                  Setup OK with warnings — review action_queue for suggested fixes.
                {%- else -%}
                  All labels wired, all rooms valid.
                {%- endif -%}
          - variables:
              response: >-
                {{ {
                  'mode': 'setup',
                  'result': _setup_result | trim,
                  'caller_token': _caller_token,
                  'integration': 'roborock_native' if _setup_use_clean_area else 'xiaomi_miio',
                  'cabinet_entity': _hh_cabinet if _cabinet_ok else 'NOT FOUND — Zen Household Cabinet label missing',
                  'autovac_drawer': _drawer_ok,
                  'rooms_configured': _av_rooms | length,
                  'vacuum_entity': _vac_ent if _vac_ok else 'NOT FOUND — label a vacuum entity with autovac',
                  'camera_entity': _cam_ent if _cam_ok else 'not found (optional)',
                  'dnd_entity': _dnd_ent if _dnd_ok else 'not found (optional)',
                  'water_low_entity': _water_low_ent if _water_ok else 'not found (optional)',
                  'current_room_entity': _setup_cur_room_ent if _cur_room_ok else 'not found (optional)',
                  'current_room_live': _cur_room_live,
                  'schedule_entities_found': label_entities('autovac_schedule') | list | length,
                  'missing_label_objects': _missing_label_names,
                  'labels_created_this_run': (_create_labels and _missing_label_names | length > 0),
                  'room_audit': _room_audit,
                  'action_queue': _setup_action_queue,
                  'tip': _setup_tip | trim
                } }}
          # -- setup: cabinet drawer init (idempotent — skip if rooms/system present) --
          - variables:
              _drawer_initialized: false
          - if: "{{ _cabinet_ok and not _drawer_ok and not _dry_run }}"
            then:
              - action: script.zen_dojotools_filecabinet
                data:
                  action_type: write
                  volume_entity_id: "{{ _hh_cabinet }}"
                  key: autovac
                  value: >-
                    {{ {'system': {'enabled': true, 'minimum_battery': 20, 'water_low_action': 'warn'}, 'rooms': {}} | tojson }}
              - variables:
                  _drawer_initialized: true

          # -- setup: KFC dojo deploy — handled by bootstrap_kfc (mode=kfc_manifest) --
          # Removed: single hardcoded Scribe stamp replaced by three-component
          # kfc_manifest (autovac_status, autovac_run, autovac_briefing).
          # Run zen_dojotools_manifest mode=bootstrap_kfc to register all drawers.
          - variables:
              _kfc_deployed: false

          # -- setup: optional Grocy ERP provision (explicit flag only) -----------
          - variables:
              _prov_result: >-
                skipped — pass config={"provision_inventory":true} to provision Grocy ERP
          - if: "{{ _setup_cfg.get('provision_inventory', false) | bool(false) and not _dry_run }}"
            then:
              - action: script.zen_dojotools_autovac
                data:
                  mode: consumables
                  action: provision
                response_variable: _prov_raw
              - variables:
                  _prov_result: "{{ _prov_raw | default({}) }}"

          # -- setup: merge dojo/cabinet results into response --------------------
          - variables:
              response: >-
                {{ response | combine({
                  'dry_run': _dry_run,
                  'kfc_deployed': _kfc_deployed,
                  'ninja_integration': {
                    'seed_path': 'zen_admintools_prompt_loader mode=whitelist whitelist_type=seed action_type=add item=zen_dojotools_autovac — whitelist for full cabinet snapshot on each ninja run',
                    'index_path': 'label:autovac entity surface — automatic fallback when seed not whitelisted (no extra setup needed)',
                    'kfc_keys': 'autovac_status, autovac_run, autovac_briefing — registered via zen_dojotools_manifest mode=bootstrap_kfc'
                  },
                  'inventory_provision': _prov_result
                }) | combine(
                  {'drawer_initialized': true} if _drawer_initialized else {}
                ) | combine(
                  {'would_do': (
                    (['init_cabinet_drawer'] if not _drawer_ok and _cabinet_ok else []) +
                    (['deploy_kfc'] if _cabinet_ok else ['deploy_kfc_skipped_no_cabinet']) +
                    (['provision_inventory'] if _setup_cfg.get('provision_inventory', false) else [])
                  )} if _dry_run else {}
                ) }}
          - stop: "autovac setup complete"
            response_variable: response

      # -- 1 System state ------------------------------------------------------
      - variables:
          _vacuum_state: "{{ states(_vac_ent) if _vac_ent != '' else 'unavailable' }}"
          _battery:      "{{ state_attr(_vac_ent, 'battery_level') | int(0) if _vac_ent != '' else 0 }}"
          _water_low:    "{{ is_state(_water_low_ent, 'on') if _water_low_ent != '' else false }}"
          _water_low_action: "{{ _av_system.get('water_low_action', 'warn') | string | lower }}"
          _dnd:          "{{ is_state(_dnd_ent, 'on') if _dnd_ent != '' else false }}"
          _enabled:      "{{ _av_system.get('enabled', true) }}"
          _use_clean_area: "{{ _vac_ent in integration_entities('roborock') }}"
          _current_room_ent: >-
            {{ label_entities('autovac_current_room') | select('match', 'sensor\.') | list | first | default('') }}
      - variables:
          _current_room_live: >-
            {{ _current_room_ent != '' and states(_current_room_ent) not in ['unavailable', 'unknown', ''] }}

      # -- 2 Elected rooms (cabinet-computed election) -------------------------
      - variables:
          _elected: >-
            {%- set ns = namespace(rooms=[]) -%}
            {%- for room_name, room in _av_rooms.items() -%}
              {%- if room.get('enabled', false) -%}
                {%- set last = room.get('last_cleaned', '') -%}
                {%- set days_since = ((now().timestamp() - as_timestamp(last ~ 'T00:00:00', 0)) / 86400) | int(0) -%}
                {%- set autoschedule = days_since >= room.get('days_between', 7) -%}
                {%- set queued = room.get('queued', false) -%}
                {%- set skip_next = room.get('skip_next', false) -%}
                {%- set req_ready = room.get('requires_ready', room.get('require_confirmation', false)) -%}
                {%- set is_rdy = room.get('is_ready', room.get('ready_to_clean', false)) -%}
                {%- set ready_pass = (not req_ready) or is_rdy -%}
                {%- set can_schedule = (not skip_next) and ready_pass -%}
                {%- if can_schedule and (autoschedule or queued) -%}
                  {%- set ns.rooms = ns.rooms + [{'room': room_name, 'segment': room.get('segment', 0), 'requires_mop': room.get('requires_mop', false), 'blocked': false}] -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.rooms }}

      # -- 3 Queue / skip snapshots --------------------------------------------
      - variables:
          _queued_rooms: >-
            {%- set ns = namespace(rooms=[]) -%}
            {%- for room_name, room in _av_rooms.items() -%}
              {%- set ns.rooms = ns.rooms + [{'room': room_name, 'active': room.get('queued', false)}] -%}
            {%- endfor -%}
            {{ ns.rooms }}
          _skipped_rooms: >-
            {%- set ns = namespace(rooms=[]) -%}
            {%- for room_name, room in _av_rooms.items() -%}
              {%- set ns.rooms = ns.rooms + [{'room': room_name, 'active': room.get('skip_next', false)}] -%}
            {%- endfor -%}
            {{ ns.rooms }}

      # -- 4 Next schedule + active window + 7-day projection ----------------
      - action: script.zen_dojotools_autovac
        data:
          mode: schedule
        response_variable: _sched_resp
      - variables:
          _next_schedule:      "{{ _sched_resp.get('next', none) }}"
          _schedule_active:    "{{ _sched_resp.get('active', none) }}"
          _schedule_7day_raw:  "{{ _sched_resp.get('schedule_7day', []) }}"
      - variables:
          _schedule_7day: >-
            {%- set ns = namespace(days=[]) -%}
            {%- for day in _schedule_7day_raw -%}
              {%- if loop.index0 == 0 -%}
                {%- set hr = namespace(any=false) -%}
                {%- for sched in day.get('schedules', []) -%}
                  {%- set hrk = (sched.entity | replace('.','_') | replace('-','_') ~ '_has_run') -%}
                  {%- if _av_system.get(hrk, false) -%}{%- set hr.any = true -%}{%- endif -%}
                {%- endfor -%}
                {%- set ns.days = ns.days + [day | combine({'has_run': hr.any})] -%}
              {%- else -%}
                {%- set ns.days = ns.days + [day | combine({'has_run': none})] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.days }}

      # -- 5 Room lookup -------------------------------------------------------
      - variables:
          _room_exists: "{{ _room != '' and _room in _av_rooms }}"

      # -- configure: show current settings if no config= provided (early exit) --
      - if: "{{ _mode == 'configure' and _room_exists and _config == '{}' }}"
        then:
          - variables:
              response: >-
                {{ {
                  'mode': 'configure',
                  'result': 'current_settings',
                  'caller_token': _caller_token,
                  'room': _room,
                  'settings': _av_rooms[_room]
                } }}
          - stop: "autovac configure — current settings"
            response_variable: response

      # -- 6 Write / action ops ------------------------------------------------

      - if: "{{ _mode == 'queue' and _room_exists }}"
        then:
          - action: script.zen_dojotools_filecabinet
            data:
              action_type: update
              volume_entity_id: "{{ _hh_cabinet }}"
              key: autovac
              value: >-
                {{ {'rooms': _av_rooms | combine({_room: _av_rooms[_room] | combine({'queued': true})}), 'system': _av_system} | tojson }}
          - variables:
              response: >-
                {{ {'mode': 'queue', 'result': 'ok', 'caller_token': _caller_token,
                    'room': _room, 'note': _room ~ ' force-queued for next run'} }}
          - stop: "autovac queue ok"
            response_variable: response

      - if: "{{ _mode == 'dequeue' and _room_exists }}"
        then:
          - action: script.zen_dojotools_filecabinet
            data:
              action_type: update
              volume_entity_id: "{{ _hh_cabinet }}"
              key: autovac
              value: >-
                {{ {'rooms': _av_rooms | combine({_room: _av_rooms[_room] | combine({'queued': false})}), 'system': _av_system} | tojson }}
          - variables:
              response: >-
                {{ {'mode': 'dequeue', 'result': 'ok', 'caller_token': _caller_token,
                    'room': _room, 'note': _room ~ ' removed from force-queue'} }}
          - stop: "autovac dequeue ok"
            response_variable: response

      - if: "{{ _mode == 'clear' }}"
        then:
          - action: script.zen_dojotools_filecabinet
            data:
              action_type: update
              volume_entity_id: "{{ _hh_cabinet }}"
              key: autovac
              value: >-
                {%- set ns = namespace(r={}) -%}
                {%- for rn, rv in _av_rooms.items() -%}
                  {%- set ns.r = ns.r | combine({rn: rv | combine({'queued': false})}) -%}
                {%- endfor -%}
                {{ {'rooms': ns.r, 'system': _av_system} | tojson }}
          - variables:
              response: >-
                {{ {'mode': 'clear', 'result': 'ok', 'caller_token': _caller_token,
                    'note': 'all force-queued rooms cleared'} }}
          - stop: "autovac clear ok"
            response_variable: response

      - if: "{{ _mode == 'skip' and _room_exists }}"
        then:
          - action: script.zen_dojotools_filecabinet
            data:
              action_type: update
              volume_entity_id: "{{ _hh_cabinet }}"
              key: autovac
              value: >-
                {{ {'rooms': _av_rooms | combine({_room: _av_rooms[_room] | combine({'skip_next': true})}), 'system': _av_system} | tojson }}
          - variables:
              response: >-
                {{ {'mode': 'skip', 'result': 'ok', 'caller_token': _caller_token,
                    'room': _room, 'note': _room ~ ' will be skipped next run'} }}
          - stop: "autovac skip ok"
            response_variable: response

      - if: "{{ _mode == 'unskip' and _room_exists }}"
        then:
          - action: script.zen_dojotools_filecabinet
            data:
              action_type: update
              volume_entity_id: "{{ _hh_cabinet }}"
              key: autovac
              value: >-
                {{ {'rooms': _av_rooms | combine({_room: _av_rooms[_room] | combine({'skip_next': false})}), 'system': _av_system} | tojson }}
          - variables:
              response: >-
                {{ {'mode': 'unskip', 'result': 'ok', 'caller_token': _caller_token,
                    'room': _room, 'note': _room ~ ' skip flag cleared'} }}
          - stop: "autovac unskip ok"
            response_variable: response

      - if: "{{ _mode == 'ready' and _room_exists }}"
        then:
          - action: script.zen_dojotools_filecabinet
            data:
              action_type: update
              volume_entity_id: "{{ _hh_cabinet }}"
              key: autovac
              value: >-
                {{ {'rooms': _av_rooms | combine({_room: _av_rooms[_room] | combine({'is_ready': true})}), 'system': _av_system} | tojson }}
          - variables:
              response: >-
                {{ {'mode': 'ready', 'result': 'ok', 'caller_token': _caller_token,
                    'room': _room, 'note': _room ~ ' marked ready to clean'} }}
          - stop: "autovac ready ok"
            response_variable: response

      - if: "{{ _mode == 'unready' and _room_exists }}"
        then:
          - action: script.zen_dojotools_filecabinet
            data:
              action_type: update
              volume_entity_id: "{{ _hh_cabinet }}"
              key: autovac
              value: >-
                {{ {'rooms': _av_rooms | combine({_room: _av_rooms[_room] | combine({'is_ready': false})}), 'system': _av_system} | tojson }}
          - variables:
              response: >-
                {{ {'mode': 'unready', 'result': 'ok', 'caller_token': _caller_token,
                    'room': _room, 'note': _room ~ ' ready flag cleared'} }}
          - stop: "autovac unready ok"
            response_variable: response

      - if: "{{ _mode == 'mark_cleaned' and _room_exists }}"
        then:
          - action: script.zen_dojotools_filecabinet
            data:
              action_type: update
              volume_entity_id: "{{ _hh_cabinet }}"
              key: autovac
              value: >-
                {{ {'rooms': _av_rooms | combine({_room: _av_rooms[_room] | combine({'last_cleaned': now().strftime('%Y-%m-%d'), 'is_ready': false})}), 'system': _av_system} | tojson }}
          - variables:
              response: >-
                {{ {'mode': 'mark_cleaned', 'result': 'ok', 'caller_token': _caller_token,
                    'room': _room, 'note': _room ~ ' marked cleaned — last_cleaned set to today'} }}
          - stop: "autovac mark_cleaned ok"
            response_variable: response

      # ---- system configure (no room — sets water_low_action, enabled) --------
      - if: "{{ _mode == 'configure' and _room == '' }}"
        then:
          - variables:
              _sys_patch: "{{ _config | from_json(default={}) }}"
          - variables:
              _sys_filtered: >-
                {%- set allowed = ['water_low_action', 'enabled'] -%}
                {%- set ns = namespace(p={}) -%}
                {%- for k, v in _sys_patch.items() -%}
                  {%- if k in allowed -%}{%- set ns.p = ns.p | combine({k: v}) -%}{%- endif -%}
                {%- endfor -%}
                {{ ns.p }}
              _sys_ignored: >-
                {%- set allowed = ['water_low_action', 'enabled'] -%}
                {%- set ns = namespace(ign=[]) -%}
                {%- for k in _sys_patch.keys() -%}
                  {%- if k not in allowed -%}{%- set ns.ign = ns.ign + [k] -%}{%- endif -%}
                {%- endfor -%}
                {{ ns.ign }}
          - if: "{{ _sys_filtered | length > 0 }}"
            then:
              - action: script.zen_dojotools_filecabinet
                data:
                  action_type: update
                  volume_entity_id: "{{ _hh_cabinet }}"
                  key: autovac
                  value: >-
                    {{ {'rooms': _av_rooms, 'system': _av_system | combine(_sys_filtered)} | tojson }}
              - variables:
                  response: >-
                    {{ {'mode': 'configure', 'result': 'ok', 'caller_token': _caller_token,
                        'scope': 'system', 'applied': _sys_filtered, 'ignored': _sys_ignored} }}
              - stop: "autovac system configure ok"
                response_variable: response
          - variables:
              response: >-
                {{ {'mode': 'configure', 'result': 'ok', 'caller_token': _caller_token,
                    'scope': 'system', 'current_system_config': _av_system} }}
          - stop: "autovac system configure view"
            response_variable: response

      - if: "{{ _mode == 'configure' and _room != '' and _config != '{}' }}"
        then:
          - variables:
              _cfg_patch: "{{ _config | from_json(default={}) }}"
          - variables:
              _cfg_normalized: >-
                {%- set ns = namespace(p={}) -%}
                {%- for k, v in _cfg_patch.items() -%}
                  {%- set nk = 'requires_ready' if k == 'require_confirmation' else k -%}
                  {%- set ns.p = ns.p | combine({nk: v}) -%}
                {%- endfor -%}
                {{ ns.p }}
          - variables:
              _cfg_filtered: >-
                {%- set allowed = ['enabled', 'segment', 'area_id', 'days_between', 'requires_ready', 'notes', 'requires_mop'] -%}
                {%- set ns = namespace(p={}) -%}
                {%- for k, v in _cfg_normalized.items() -%}
                  {%- if k in allowed -%}{%- set ns.p = ns.p | combine({k: v}) -%}{%- endif -%}
                {%- endfor -%}
                {{ ns.p }}
              _cfg_ignored: >-
                {%- set allowed = ['enabled', 'segment', 'area_id', 'days_between', 'requires_ready', 'notes', 'requires_mop'] -%}
                {%- set ns = namespace(ign=[]) -%}
                {%- for k in _cfg_normalized.keys() -%}
                  {%- if k not in allowed -%}{%- set ns.ign = ns.ign + [k] -%}{%- endif -%}
                {%- endfor -%}
                {{ ns.ign }}
          - action: script.zen_dojotools_filecabinet
            data:
              action_type: update
              volume_entity_id: "{{ _hh_cabinet }}"
              key: autovac
              value: >-
                {{ {'rooms': _av_rooms | combine({_room: _av_rooms.get(_room, {}) | combine(_cfg_filtered)}), 'system': _av_system} | tojson }}
          - variables:
              response: >-
                {{ {'mode': 'configure', 'result': 'ok', 'caller_token': _caller_token,
                    'room': _room, 'applied': _cfg_filtered, 'ignored': _cfg_ignored} }}
          - stop: "autovac configure ok"
            response_variable: response

      - if: "{{ _mode == 'pause' }}"
        then:
          - action: script.zen_dojotools_filecabinet
            data:
              action_type: update
              volume_entity_id: "{{ _hh_cabinet }}"
              key: autovac
              value: "{{ {'rooms': _av_rooms, 'system': _av_system | combine({'pause_today': true})} | tojson }}"
          - variables:
              response: >-
                {{ {'mode': 'pause', 'result': 'ok', 'caller_token': _caller_token,
                    'note': 'scheduled runs paused for today'} }}
          - stop: "autovac pause ok"
            response_variable: response

      - if: "{{ _mode == 'unpause' }}"
        then:
          - action: script.zen_dojotools_filecabinet
            data:
              action_type: update
              volume_entity_id: "{{ _hh_cabinet }}"
              key: autovac
              value: "{{ {'rooms': _av_rooms, 'system': _av_system | combine({'pause_today': false})} | tojson }}"
          - variables:
              response: >-
                {{ {'mode': 'unpause', 'result': 'ok', 'caller_token': _caller_token,
                    'note': 'scheduled runs resumed for today'} }}
          - stop: "autovac unpause ok"
            response_variable: response

      # ---- preset ------------------------------------------------------------
      - if: "{{ _mode == 'preset' }}"
        then:
          - variables:
              _presets: >-
                {{ {
                  'obstacle_prone': {'requires_ready': true},
                  'mop_room':       {'requires_mop': true},
                  'guest_room':     {'days_between': 14, 'requires_ready': true},
                  'high_traffic':   {'days_between': 1},
                  'twice_weekly':   {'days_between': 3},
                  'weekly':         {'days_between': 7},
                  'disabled':       {'enabled': false},
                  'standard':       {'enabled': true, 'requires_ready': false, 'requires_mop': false, 'days_between': 7}
                } }}
              _preset_name: "{{ preset | default('', true) | string | lower | replace(' ', '_') }}"
              _preset_rooms: >-
                {%- set ns = namespace(r=[]) -%}
                {%- set csv = (rooms | default(room | default('', true), true)) | string -%}
                {%- for r in csv.split(',') -%}
                  {%- set slug = r | trim | lower | replace(' ', '_') -%}
                  {%- if slug != '' -%}{%- set ns.r = ns.r + [slug] -%}{%- endif -%}
                {%- endfor -%}
                {{ ns.r }}
          - if: "{{ _preset_name == '' or _preset_rooms | length == 0 }}"
            then:
              - variables:
                  response: >-
                    {{ {
                      'mode': 'preset', 'result': 'list', 'caller_token': _caller_token,
                      'available_presets': _presets,
                      'usage': 'mode=preset preset=<name> rooms=<csv>  or  room=<slug> for single room',
                      'note': 'Presets patch the specified fields only — all other room settings are preserved.'
                    } }}
              - stop: "autovac preset list"
                response_variable: response
          - if: "{{ _preset_name not in _presets }}"
            then:
              - variables:
                  response: >-
                    {{ {
                      'mode': 'preset', 'result': 'error', 'caller_token': _caller_token,
                      'note': 'Unknown preset: ' ~ _preset_name ~ '. Call mode=preset (no args) to list available presets.',
                      'available': _presets | list
                    } }}
              - stop: "autovac preset unknown"
                response_variable: response
          - variables:
              _preset_patch: "{{ _presets[_preset_name] }}"
              _preset_valid_rooms: "{{ _preset_rooms | select('in', _av_rooms) | list }}"
              _preset_unknown_rooms: "{{ _preset_rooms | reject('in', _av_rooms) | list }}"
          - if: "{{ _preset_valid_rooms | length == 0 }}"
            then:
              - variables:
                  response: >-
                    {{ {
                      'mode': 'preset', 'result': 'error', 'caller_token': _caller_token,
                      'note': 'No valid rooms found: ' ~ (_preset_rooms | join(', ')) ~ '. Run mode=status to see configured rooms.',
                      'unknown_rooms': _preset_unknown_rooms
                    } }}
              - stop: "autovac preset no valid rooms"
                response_variable: response
          - variables:
              _new_av_rooms: >-
                {%- set ns = namespace(r={}) -%}
                {%- for rn, rv in _av_rooms.items() -%}
                  {%- if rn in _preset_valid_rooms -%}
                    {%- set ns.r = ns.r | combine({rn: rv | combine(_preset_patch)}) -%}
                  {%- else -%}
                    {%- set ns.r = ns.r | combine({rn: rv}) -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.r }}
          - action: script.zen_dojotools_filecabinet
            data:
              action_type: update
              volume_entity_id: "{{ _hh_cabinet }}"
              key: autovac
              value: "{{ {'rooms': _new_av_rooms, 'system': _av_system} | tojson }}"
          - variables:
              response: >-
                {{ {
                  'mode': 'preset', 'result': 'ok', 'caller_token': _caller_token,
                  'preset': _preset_name,
                  'applied_settings': _preset_patch,
                  'rooms_updated': _preset_valid_rooms,
                  'rooms_skipped': _preset_unknown_rooms
                } }}
          - stop: "autovac preset ok"
            response_variable: response

      # ---- consumables -------------------------------------------------------
      - if: "{{ _mode == 'consumables' }}"
        then:
          - variables:
              _cons_action: "{{ action | default('status', true) | string | lower | trim }}"
              _cons_part:   "{{ part   | default('', true)       | string | lower | trim }}"
              _cons_amount: "{{ amount | default(1, true)        | int(1) }}"

          # -- Resolve catalog from cabinet (provision required) ---------------
          - variables:
              _gc:           "{{ _av_system.get('grocy_catalog', {}) }}"
              _gc_parts:     "{{ _gc.get('parts', {}) }}"
              _cons_catalog: "{{ _gc_parts if _gc_parts else {} }}"
              _cons_robot:   "{{ _gc.get('robot_name', 'vacuum') }}"
              _cons_model:   "{{ _gc.get('model', '') }}"

          # -- Gate: catalog must exist before any consumables operation -------
          - if: "{{ not _gc_parts and _cons_action != 'provision' }}"
            then:
              - variables:
                  response: >-
                    {{ {
                      'mode': 'consumables', 'status': 'not_provisioned',
                      'caller_token': _caller_token,
                      'message': 'Run mode=consumables action=provision first. Provision registers the robot as an inventory asset and creates the consumables catalog.',
                      'hint': 'Three steps: (1) Find spare part bin IDs — zen_dojotools_inventory mode=locations_get_by_area area=<room> for each room where parts are stored. (2) Find or register the robot asset — mode=catalog_find_product item=<name> for machine_product_id; if not found use mode=stock_register_asset first. (3) Call mode=consumables action=provision model_preset=<key> config={"robot_name":"<nickname>","storage_location_dock_parts":<id>,"storage_location_wear_parts":<id>,"machine_product_id":<id>}. model auto-derived from preset. Available model_preset keys: see mode=help model_presets.'
                    } }}
              - stop: "consumables not provisioned"
                response_variable: response

          # ── action=provision ────────────────────────────────────────────────
          - if: "{{ _cons_action == 'provision' }}"
            then:
              - variables:
                  _prov_cfg:        "{{ _config | from_json(default={}) if _config is string else _config | default({}, true) }}"
                  _prov_model:      "{{ _cons_model }}"
                  _prov_robot_name: "{{ _prov_cfg.get('robot_name', _cons_robot) }}"
                  _prov_existing:   "{{ _gc }}"
              - variables:
                  _prov_sn: >-
                    {{ state_attr(_vac_ent, 'sn')
                       | default(state_attr(_vac_ent, 'serial_number'), true)
                       | default(state_attr(_vac_ent, 'serialNumber'), true)
                       | default(_prov_cfg.get('serial_number'), true)
                       | default(device_id(_vac_ent), true)
                       | default(_vac_ent, true) | string }}
                  _prov_sn_source: >-
                    {%- if state_attr(_vac_ent, 'sn') is not none -%}sn_attr
                    {%- elif state_attr(_vac_ent, 'serial_number') is not none -%}serial_number_attr
                    {%- elif state_attr(_vac_ent, 'serialNumber') is not none -%}serialNumber_attr
                    {%- elif _prov_cfg.get('serial_number') is not none -%}user_supplied
                    {%- elif device_id(_vac_ent) is not none -%}ha_device_id
                    {%- else -%}entity_id{%- endif -%}
                  _prov_mpid: >-
                    {{ (_prov_cfg.get('machine_product_id')
                        | default(_gc.get('machine_product_id'), true)) | int(none) }}
              - variables:
                  _prov_sn_confidence: >-
                    {%- if _prov_sn_source in ['sn_attr', 'serial_number_attr', 'serialNumber_attr', 'user_supplied'] -%}high
                    {%- elif _prov_sn_source == 'ha_device_id' -%}medium
                    {%- else -%}low{%- endif -%}

              # Idempotency: entity_id OR SN — cross-ref survives integration swaps without stock rebuild
              # entity_id changes if integration reinstalls; SN stays. SN changes if firmware hides it; entity_id stays.
              - if: >-
                  {{ _prov_existing and not _prov_cfg.get('force', false) and (
                     _prov_existing.get('entity_id', '') == _vac_ent or (
                     _prov_sn not in ['unknown', ''] and
                     _prov_existing.get('serial_number', 'NOSN') == _prov_sn)) }}
                then:
                  - variables:
                      response: >-
                        {{ {
                          'mode': 'consumables', 'action': 'provision',
                          'result': 'already_provisioned', 'caller_token': _caller_token,
                          'serial_number': _prov_sn,
                          'sn_source': _prov_sn_source,
                          'sn_confidence': _prov_sn_confidence,
                          'note': 'Catalog already set up for SN: ' ~ _prov_sn ~ '. Pass config={"force":true} to re-provision.',
                          'catalog': _prov_existing
                        } }}
                  - stop: "autovac provision already done"
                    response_variable: response

              # Step 0: Load model preset library and resolve the requested preset
              - variables:
                  _preset_lib:
                    roborock_generic_dock: !include .autovac_presets/roborock_generic_dock.yaml
                    roborock_generic_dock_ultra: !include .autovac_presets/roborock_generic_dock_ultra.yaml
                    roborock_generic_dock_nomop: !include .autovac_presets/roborock_generic_dock_nomop.yaml
                    roborock_s7_plus: !include .autovac_presets/roborock_s7_plus.yaml
                    roborock_s7_maxv_ultra: !include .autovac_presets/roborock_s7_maxv_ultra.yaml
                    roborock_s8_plus: !include .autovac_presets/roborock_s8_plus.yaml
                    roborock_s8_pro_ultra: !include .autovac_presets/roborock_s8_pro_ultra.yaml
                    roborock_q7_max_plus: !include .autovac_presets/roborock_q7_max_plus.yaml
              - variables:
                  _model_preset_key: >-
                    {%- set _mp_direct = model_preset | default('', true) | trim -%}
                    {%- set _mp_cfg    = _prov_cfg.get('model_preset', '') | trim -%}
                    {{ (_mp_direct if _mp_direct != '' else _mp_cfg) | lower | replace(' ', '_') | replace('-', '_') | trim }}
              - variables:
                  _prov_preset:     "{{ _preset_lib.get(_model_preset_key, {}) }}"
                  _prov_has_preset: "{{ _prov_preset | length > 0 }}"
              - if: "{{ not _prov_has_preset }}"
                then:
                  - variables:
                      response: >-
                        {{ {
                          'mode': 'consumables', 'action': 'provision',
                          'result': 'error', 'caller_token': _caller_token,
                          'message': 'model_preset is required. Pass model_preset=<key> with config.',
                          'available_presets': _preset_lib.keys() | list,
                          'hint': 'Example: model_preset=roborock_s7_maxv_ultra'
                        } }}
                  - stop: "provision requires model_preset"
                    response_variable: response
              - variables:
                  _prov_parts_def: "{{ _prov_preset.get('parts', {}) }}"
              # Derive model from preset brand/series/trim if not supplied in config
              - variables:
                  _prov_model: >-
                    {%- set from_cfg = _prov_cfg.get('model', _cons_model) | trim -%}
                    {%- if from_cfg != '' -%}{{ from_cfg }}
                    {%- else -%}
                      {%- set b = _prov_preset.get('brand', '') | trim -%}
                      {%- set s = _prov_preset.get('series', '') | trim -%}
                      {%- set t = _prov_preset.get('trim', '') | trim -%}
                      {{ ([b, s, t] | reject('equalto', '') | list | join(' ')) | trim }}
                    {%- endif -%}
                  _prov_robot_name: >-
                    {%- set from_cfg = _prov_cfg.get('robot_name', '') | trim -%}
                    {%- if from_cfg != '' -%}{{ from_cfg }}
                    {%- else -%}
                      {%- set fn = state_attr(_vac_ent, 'friendly_name') | default('', true) | trim -%}
                      {{ fn if fn != '' else _cons_robot }}
                    {%- endif -%}

              # Step 1: Find dock parent location from HA area of vacuum entity
              - variables:
                  _prov_area:      "{{ area_id(_vac_ent) | default('dining_room', true) | string }}"
                  _prov_area_name: "{{ area_name(_vac_ent) | default('Dining Room', true) | string }}"
                  _prov_dock_name: "{{ _prov_area_name }} - {{ _prov_model }}"
              - action: script.zen_dojotools_inventory
                data:
                  mode: locations_find
                  item: "{{ _prov_area_name }}"
                response_variable: _prov_parent_raw
              - variables:
                  _prov_parent_lid: >-
                    {{ (_prov_parent_raw.get('result', [])
                        | selectattr('name', 'equalto', _prov_area_name)
                        | list | first | default({})).get('id', none) | int(none) }}

              # Step 2: Find or create dock location (idempotent)
              - action: script.zen_dojotools_inventory
                data:
                  mode: locations_find
                  item: "{{ _prov_dock_name }}"
                response_variable: _prov_dock_find_raw
              - variables:
                  _prov_dock_lid: >-
                    {{ (_prov_dock_find_raw.get('result', [])
                        | selectattr('name', 'equalto', _prov_dock_name)
                        | list | first | default({})).get('id', none) | int(none) }}
              - if: "{{ _prov_dock_lid is none }}"
                then:
                  - action: script.zen_dojotools_inventory
                    data:
                      mode: locations_add
                      location: "{{ _prov_dock_name }}"
                      parent_location_id: "{{ _prov_parent_lid }}"
                      homeassistant_area_id: "{{ _prov_area }}"
                      location_subclass: container
                      placement_priority: 70
                    response_variable: _prov_dock_raw
                  - variables:
                      _prov_dock_lid: >-
                        {{ (_prov_dock_raw.get('result', {}).get('created_object_id')
                            or _prov_existing.get('dock_location_id')) | int(none) }}

              # Step 2a: Find or create Bot location (child of Dock — installed bot parts live here)
              - variables:
                  _prov_bot_name: "{{ _prov_dock_name }} — Bot"
              - action: script.zen_dojotools_inventory
                data:
                  mode: locations_find
                  item: "{{ _prov_bot_name }}"
                response_variable: _prov_bot_find_raw
              - variables:
                  _prov_bot_lid: >-
                    {{ (_prov_bot_find_raw.get('result', [])
                        | selectattr('name', 'equalto', _prov_bot_name)
                        | list | first | default({})).get('id', none) | int(none) }}
              - if: "{{ _prov_bot_lid is none }}"
                then:
                  - action: script.zen_dojotools_inventory
                    data:
                      mode: locations_add
                      location: "{{ _prov_bot_name }}"
                      parent_location_id: "{{ _prov_dock_lid }}"
                      homeassistant_area_id: "{{ _prov_area }}"
                      location_subclass: container
                      placement_priority: 80
                    response_variable: _prov_bot_raw
                  - variables:
                      _prov_bot_lid: >-
                        {{ _prov_bot_raw.get('result', {}).get('created_object_id') | int(none) }}

              # Step 2b: Find or create Dock Bins location (child of Dock — installed dock parts live here)
              - variables:
                  _prov_dock_bins_name: "{{ _prov_dock_name }} — Dock Bins"
              - action: script.zen_dojotools_inventory
                data:
                  mode: locations_find
                  item: "{{ _prov_dock_bins_name }}"
                response_variable: _prov_dock_bins_find_raw
              - variables:
                  _prov_dock_bins_lid: >-
                    {{ (_prov_dock_bins_find_raw.get('result', [])
                        | selectattr('name', 'equalto', _prov_dock_bins_name)
                        | list | first | default({})).get('id', none) | int(none) }}
              - if: "{{ _prov_dock_bins_lid is none }}"
                then:
                  - action: script.zen_dojotools_inventory
                    data:
                      mode: locations_add
                      location: "{{ _prov_dock_bins_name }}"
                      parent_location_id: "{{ _prov_dock_lid }}"
                      homeassistant_area_id: "{{ _prov_area }}"
                      location_subclass: container
                      placement_priority: 75
                    response_variable: _prov_dock_bins_raw
                  - variables:
                      _prov_dock_bins_lid: >-
                        {{ _prov_dock_bins_raw.get('result', {}).get('created_object_id') | int(none) }}

              # Step 2c: Resolve spare storage location — all uninstalled spares go here
              # config key: spare_storage_location (name or ID). Omit → Dock used as spare storage.
              - variables:
                  _prov_spare_raw: "{{ _prov_cfg.get('spare_storage_location', none) }}"
              - variables:
                  _prov_spare_lid: >-
                    {%- if _prov_spare_raw is not none and _prov_spare_raw | string | int(-1) > 0 -%}
                      {{ _prov_spare_raw | int }}
                    {%- else -%}{{ none }}{%- endif -%}
                  _prov_spare_name: >-
                    {%- if _prov_spare_raw is string and _prov_spare_raw | int(-1) < 0 and _prov_spare_raw | length > 0 -%}
                      {{ _prov_spare_raw }}
                    {%- else -%}{{ '' }}{%- endif -%}
              - if: "{{ _prov_spare_lid is none and _prov_spare_name != '' }}"
                then:
                  - action: script.zen_dojotools_inventory
                    data:
                      mode: locations_find
                      item: "{{ _prov_spare_name }}"
                    response_variable: _prov_spare_find_raw
                  - variables:
                      _prov_spare_lid: >-
                        {{ (_prov_spare_find_raw.get('result', [])
                            | selectattr('name', 'equalto', _prov_spare_name)
                            | list | first | default({})).get('id', none) | int(none) }}
              - variables:
                  _prov_spare_lid: "{{ _prov_spare_lid | default(_prov_dock_lid, true) }}"
              # Per-category spare bins — dock parts vs. bot/wear parts may be stored separately
              # config: storage_location_dock_parts (ID), storage_location_wear_parts (ID). Omit → spare_lid for both.
              - variables:
                  _prov_dock_spare_lid: >-
                    {%- set v = _prov_cfg.get('storage_location_dock_parts', none) -%}
                    {{ v | int if v is not none and v | string | int(-1) > 0 else _prov_spare_lid }}
                  _prov_wear_spare_lid: >-
                    {%- set v = _prov_cfg.get('storage_location_wear_parts', none) -%}
                    {{ v | int if v is not none and v | string | int(-1) > 0 else _prov_spare_lid }}

              # Step 2d: Wire dock Grocy location_id back to Room Manager (best-effort, if dock_area provided)
              - variables:
                  _prov_dock_area: "{{ _prov_cfg.get('dock_area', '') | string | trim }}"
              - if: "{{ _prov_dock_area != '' and _prov_dock_lid is not none }}"
                then:
                  - action: script.zen_dojotools_room_manager
                    data:
                      mode: set
                      area: "{{ _prov_dock_area }}"
                      grocy_location_id: "{{ _prov_dock_lid }}"
                    response_variable: _prov_rm_raw

              # Step 2c: Write HA entity_id to Grocy machine product as userfield (best-effort)
              # Requires ha_entity_id userfield defined on products entity in Grocy settings.
              # This creates the two-way link: cabinet knows machine_product_id, Grocy knows entity_id.
              - if: "{{ _prov_mpid is not none }}"
                then:
                  - action: script.zen_sutra_grocy
                    data:
                      action_type: put
                      endpoint: "/userfields/products/{{ _prov_mpid }}"
                      payload: "{{ {'ha_entity_id': _vac_ent} | tojson }}"
                    response_variable: _prov_uf_raw

              # Step 3-6: BOM provision (product+chore+label+seed via provision_bom)
              - variables:
                  _prov_bom: >-
                    {%- set ns = namespace(parts=[]) -%}
                    {%- for pk, pd in _prov_parts_def.items() -%}
                      {%- set _cat = pd.get('category', pd.get('location_category', 'bot')) -%}
                      {%- set _spare = _prov_dock_spare_lid if _cat == 'dock' else _prov_wear_spare_lid -%}
                      {%- set _inst = _prov_bot_lid if pd.location_category == 'bot' else _prov_dock_bins_lid -%}
                      {%- set ns.parts = ns.parts + [{
                        'key':                pk,
                        'name':               _prov_model ~ ' - ' ~ pd.name_suffix,
                        'sku':                pd.sku,
                        'unit':               'each',
                        'storage_location_id': _spare,
                        'consume_location_id': _inst,
                        'min_stock':           pd.min_stock | default(1) | int(1),
                        'ha_labels':           'autovac,autovac_part',
                        'chore_name':          _prov_robot_name ~ ' - ' ~ pd.chore_name_suffix,
                        'chore_period_days':   pd.chore_period_days | default(90),
                        'chore_note':          pd.chore_note | default('')
                      }] -%}
                    {%- endfor -%}
                    {{ {
                      'robot_name':      _prov_robot_name,
                      'ha_labels':       'autovac,autovac_part',
                      'chore_ha_labels': 'autovac,autovac_chore'
                    } | combine({'parts': ns.parts}) | tojson }}
              - action: script.zen_dojotools_inventory
                data:
                  mode: provision_bom
                  bom: "{{ _prov_bom }}"
                  confirm_action: true
                response_variable: _prov_bom_raw

              # Step 4b: Resolve autovac_wear sensor entities → part key map
              - variables:
                  _prov_wear_map: >-
                    {%- set ns = namespace(m={}) -%}
                    {%- set keys = ['main_brush_left', 'side_brush_left', 'filter_remaining', 'mop_lifespan'] -%}
                    {%- for ent in label_entities('autovac_wear') -%}
                      {%- for k in keys -%}
                        {%- if k in ent -%}
                          {%- set ns.m = ns.m | combine({k: ent}) -%}
                        {%- endif -%}
                      {%- endfor -%}
                    {%- endfor -%}
                    {{ ns.m }}

              # Step 5: Merge provision_bom catalog with preset wear metadata
              # storage_location_id  = spare bin | installed_location_id = bot/dock_bins
              - variables:
                  _prov_bom_catalog: "{{ _prov_bom_raw.get('catalog', {}) }}"
              - variables:
                  _prov_catalog: >-
                    {%- set ns = namespace(parts={}) -%}
                    {%- for pk, pd in _prov_parts_def.items() -%}
                      {%- set be = _prov_bom_catalog.get(pk, {}) -%}
                      {%- set we = _prov_wear_map.get(pd.wear_sensor_key, none) if pd.get('wear_sensor_key') else none -%}
                      {%- set ns.parts = ns.parts | combine({pk: {
                        'product_id':            be.get('product_id'),
                        'unit_id':               be.get('unit_id'),
                        'name':                  be.get('name', _prov_model ~ ' - ' ~ pd.name_suffix),
                        'sku':                   pd.sku,
                        'storage_location_id':   be.get('storage_location_id'),
                        'installed_location_id': be.get('consume_location_id'),
                        'min_stock':             pd.min_stock | default(1) | int(1),
                        'chore_id':              be.get('chore_id'),
                        'category':              pd.get('category', pd.location_category),
                        'wear_sensor_key':       pd.get('wear_sensor_key'),
                        'wear_threshold':        pd.get('wear_threshold'),
                        'wear_entity':           we
                      }}) -%}
                    {%- endfor -%}
                    {{ {
                      'entity_id':              _vac_ent,
                      'serial_number':          _prov_sn,
                      'model':                  _prov_model,
                      'robot_name':             _prov_robot_name,
                      'model_preset':           _model_preset_key,
                      'dock_location_id':       _prov_dock_lid,
                      'bot_location_id':        _prov_bot_lid,
                      'dock_bins_location_id':  _prov_dock_bins_lid,
                      'spare_location_id':      _prov_spare_lid,
                      'machine_product_id':     _prov_mpid,
                      'parts':                  ns.parts
                    } }}

              # Step 7: Spares advisory — inform user what was seeded, ask about additional spares
              - variables:
                  _seed_skipped: "{{ not (_prov_bom_catalog.values() | selectattr('is_new', 'equalto', true) | list | length > 0) }}"
                  _spare_parts_list: >-
                    {{ _prov_catalog.get('parts', {}).values() | map(attribute='name') | list }}
              - action: script.zen_dojotools_postman
                data:
                  mode: resolve_and_dispatch
                  message: >-
                    {%- if not _seed_skipped -%}
                      Robot provisioned. One installed set seeded at installed locations (bot and dock bins): {{ _spare_parts_list | join(', ') }}.
                    {%- else -%}
                      Robot re-provisioned (force). Existing stock untouched.
                    {%- endif -%}
                    Do you have additional spares on hand? If yes, log them:
                    consumables action=log_purchased part=<key> amount=<n>.
                    Parts often come in packs — dust bags (5-pack), mop pads (30-pack).
                  urgency: 4
                  channel_hint: push
                  title: "Robot Provision Complete"
                  tag: autovac_provision

              - variables:
                  response: >-
                    {{ {
                      'mode': 'consumables', 'action': 'provision',
                      'result': 'provisioned', 'caller_token': _caller_token,
                      'entity_id': _vac_ent,
                      'serial_number': _prov_sn,
                      'sn_source': _prov_sn_source,
                      'sn_confidence': _prov_sn_confidence,
                      'seeded_installed_set': not _prov_cfg.get('force', false),
                      'catalog': _prov_catalog,
                      'note': 'Catalog created. Installed set seeded at installed locations. Log any spares: action=log_purchased part=<key> amount=<n>.'
                    } }}
              - stop: "autovac provision complete"
                response_variable: response

          # ── shared stock-check (status + add_to_shopping) ──────────────────
          - if: "{{ _cons_action in ['status', 'add_to_shopping'] }}"
            then:
              # Collect stock from storage locations + dock (installed units) registered in catalog
              - variables:
                  _unique_locs: >-
                    {{ (_cons_catalog.values() | map(attribute='storage_location_id') | list
                        + (_cons_catalog.values() | selectattr('installed_location_id', 'defined') | map(attribute='installed_location_id') | list)
                        + ([_gc.get('dock_location_id')] if _gc.get('dock_location_id') is not none else []))
                       | select('ne', none) | map('int') | unique | list }}
                  _all_entries: []
              - repeat:
                  for_each: "{{ _unique_locs }}"
                  sequence:
                    - action: script.zen_dojotools_inventory
                      data:
                        mode: stock_list_by_location
                        location_id: "{{ repeat.item }}"
                      response_variable: _loc_result
                    - variables:
                        # Tag each entry with the location it came from (Grocy entries have location_id but belt+suspenders)
                        _tagged: >-
                          {%- set res = _loc_result.get('result', []) | default([], true) -%}
                          {%- set ns = namespace(out=[]) -%}
                          {%- for e in res -%}
                            {%- set ns.out = ns.out + [e | combine({'_loc_id': repeat.item | int})] -%}
                          {%- endfor -%}
                          {{ ns.out }}
                    - variables:
                        _all_entries: "{{ _all_entries + _tagged }}"
              - variables:
                  # Keyed by product_id:loc_id so spare vs installed can be split
                  _stock_by_loc: >-
                    {%- set ns = namespace(idx={}) -%}
                    {%- for e in _all_entries -%}
                      {%- set k = e.product_id | string ~ ':' ~ e._loc_id | string -%}
                      {%- set cur = ns.idx.get(k, 0) | int(0) -%}
                      {%- set ns.idx = ns.idx | combine({k: cur + (e.amount | int(0))}) -%}
                    {%- endfor -%}
                    {{ ns.idx }}
              - variables:
                  _consumables_report: >-
                    {%- set ns = namespace(parts=[], shopping=[]) -%}
                    {%- for pk, pv in _cons_catalog.items() -%}
                      {%- set pid = pv.product_id | string -%}
                      {%- set spare_k    = pid ~ ':' ~ (pv.get('storage_location_id') | string) -%}
                      {%- set install_k  = pid ~ ':' ~ (pv.get('installed_location_id', '') | string) -%}
                      {%- set spare_amt  = _stock_by_loc.get(spare_k, 0) | int(0) -%}
                      {%- set install_amt = _stock_by_loc.get(install_k, 0) | int(0) -%}
                      {%- set min_s = pv.min_stock | int(1) -%}
                      {%- set status = 'ok' if spare_amt >= min_s else ('low' if spare_amt > 0 else 'out') -%}
                      {%- set ns.parts = ns.parts + [{
                        'part':      pk,
                        'name':      pv.get('name', pk),
                        'sku':       pv.sku,
                        'spare':     spare_amt,
                        'installed': install_amt,
                        'min_stock': min_s,
                        'status':    status,
                        'buy_search':'Roborock ' ~ pv.sku,
                        'chore_id':  pv.get('chore_id', none)
                      }] -%}
                      {%- if status in ['low', 'out'] -%}
                        {%- set needed = [min_s - spare_amt, 1] | max -%}
                        {%- set ns.shopping = ns.shopping + [{
                          'action':     'shopping_add_product',
                          'product_id': pv.product_id,
                          'product':    pv.get('name', pk),
                          'sku':        pv.sku,
                          'buy_search': 'Roborock ' ~ pv.sku,
                          'needed':     needed
                        }] -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {{ {'parts': ns.parts, 'shopping_actions': ns.shopping} }}
                  _cons_status_result: >-
                    {{ 'ok' if _consumables_report.get('shopping_actions', []) | length == 0 else 'needs_reorder' }}

              # action=add_to_shopping: fire shopping_add_product for each out/low item
              - if: "{{ _cons_action == 'add_to_shopping' }}"
                then:
                  - repeat:
                      for_each: "{{ _consumables_report.get('shopping_actions', []) }}"
                      sequence:
                        - action: script.zen_dojotools_inventory
                          data:
                            mode: shopping_add_product
                            product_id: "{{ repeat.item.product_id }}"
                            amount: "{{ repeat.item.needed | default(1) }}"
                          response_variable: _shop_add_raw
                  - variables:
                      response: >-
                        {{ {
                          'mode': 'consumables', 'action': 'add_to_shopping',
                          'result': 'ok' if _consumables_report.get('shopping_actions', []) | length > 0 else 'nothing_to_add',
                          'caller_token': _caller_token,
                          'added': _consumables_report.get('shopping_actions', []) | map(attribute='product') | list,
                          'consumables': _consumables_report.get('parts', [])
                        } }}
                  - stop: "autovac add_to_shopping done"
                    response_variable: response

              # action=status: return report
              - variables:
                  response: >-
                    {{ {
                      'mode': 'consumables', 'action': 'status',
                      'result': _cons_status_result,
                      'caller_token': _caller_token,
                      'robot': _cons_robot,
                      'model': _cons_model,
                      'catalog_source': 'cabinet' if _gc_parts else 'hardcoded_fallback',
                      'consumables': _consumables_report.get('parts', []),
                      'shopping_actions': _consumables_report.get('shopping_actions', []),
                      'note': 'action=add_to_shopping queues all out/low items. action=provision to set up inventory catalog from scratch.'
                    } }}
              - stop: "autovac consumables status"
                response_variable: response

          # ── action=log_replaced ─────────────────────────────────────────────
          - if: "{{ _cons_action == 'log_replaced' }}"
            then:
              - if: "{{ _cons_part == '' or _cons_part not in _cons_catalog }}"
                then:
                  - variables:
                      response: >-
                        {{ {
                          'mode': 'consumables', 'action': 'log_replaced',
                          'result': 'error', 'caller_token': _caller_token,
                          'note': 'part= required. Valid keys: ' ~ (_cons_catalog | list | join(', '))
                        } }}
                  - stop: "autovac log_replaced — part required"
                    response_variable: response
              - variables:
                  _lr_part: "{{ _cons_catalog[_cons_part] }}"
              # Two-path contract: chore execute handles maintenance logging and
              # consumes the old installed unit (via product_amount on the chore).
              # stock_consume is the fallback when no chore is registered.
              # stock_open_item always fires — opens the next spare regardless of
              # which consume path ran. These are complementary: consume old, open new.
              - if: "{{ _lr_part.get('chore_id') is not none }}"
                then:
                  - action: script.zen_dojotools_inventory
                    data:
                      mode: chores_execute
                      chore_id: "{{ _lr_part.chore_id }}"
                    response_variable: _lr_chore_raw
                else:
                  - action: script.zen_dojotools_inventory
                    data:
                      mode: stock_consume
                      product_id: "{{ _lr_part.product_id }}"
                      amount: 1
                      location_id: "{{ _lr_part.installed_location_id }}"
                    response_variable: _lr_consume_raw
              - if: "{{ _lr_part.get('product_id') is not none }}"
                then:
                  - action: script.zen_dojotools_inventory
                    data:
                      mode: stock_open_item
                      product_id: "{{ _lr_part.product_id }}"
                    response_variable: _lr_open_raw
              - variables:
                  response: >-
                    {{ {
                      'mode': 'consumables', 'action': 'log_replaced',
                      'result': 'ok', 'caller_token': _caller_token,
                      'part': _cons_part,
                      'product': _lr_part.get('name', _cons_part),
                      'sku': _lr_part.sku,
                      'chore_executed': _lr_part.get('chore_id') is not none,
                      'note': 'Installed unit consumed from slot. Next spare opened and moved to install location.'
                    } }}
              - stop: "autovac log_replaced done"
                response_variable: response

          # ── action=log_purchased ────────────────────────────────────────────
          - if: "{{ _cons_action == 'log_purchased' }}"
            then:
              - if: "{{ _cons_part == '' or _cons_part not in _cons_catalog }}"
                then:
                  - variables:
                      response: >-
                        {{ {
                          'mode': 'consumables', 'action': 'log_purchased',
                          'result': 'error', 'caller_token': _caller_token,
                          'note': 'part= required. Valid keys: ' ~ (_cons_catalog | list | join(', '))
                        } }}
                  - stop: "autovac log_purchased — part required"
                    response_variable: response
              - variables:
                  _lp_part: "{{ _cons_catalog[_cons_part] }}"
              - if: "{{ _lp_part.get('unit_id') is none }}"
                then:
                  - action: script.zen_dojotools_inventory
                    data:
                      mode: stock_get_product_details
                      product_id: "{{ _lp_part.product_id }}"
                    response_variable: _lp_details_raw
                    continue_on_error: true
                  - variables:
                      _lp_unit_id: >-
                        {{ _lp_details_raw.get('result', {}).get('product', {}).get('qu_id_stock') | int(none) }}
                else:
                  - variables:
                      _lp_unit_id: "{{ _lp_part.get('unit_id') }}"
              - action: script.zen_dojotools_inventory
                data:
                  mode: stock_buy_product
                  product_id: "{{ _lp_part.product_id }}"
                  amount: "{{ _cons_amount }}"
                  location_id: "{{ _lp_part.storage_location_id }}"
                  unit_id: "{{ _lp_unit_id | default(none, true) }}"
                response_variable: _lp_buy_raw
              - variables:
                  response: >-
                    {{ {
                      'mode': 'consumables', 'action': 'log_purchased',
                      'result': 'ok', 'caller_token': _caller_token,
                      'part': _cons_part,
                      'product': _lp_part.get('name', _cons_part),
                      'sku': _lp_part.sku,
                      'amount': _cons_amount,
                      'stored_at': _lp_part.storage_location_id
                    } }}
              - stop: "autovac log_purchased done"
                response_variable: response

          # ── unknown action fallback ─────────────────────────────────────────
          - variables:
              response: >-
                {{ {
                  'mode': 'consumables', 'result': 'error', 'caller_token': _caller_token,
                  'note': 'Unknown action: ' ~ _cons_action ~ '. Valid: status, add_to_shopping, log_replaced, log_purchased, provision.'
                } }}
          - stop: "autovac consumables unknown action"
            response_variable: response

      # ---- check_wear -----------------------------------------------------------
      - if: "{{ _mode == 'check_wear' }}"
        then:
          - variables:
              _cw_entity: "{{ wear_entity | default('', true) | string | trim }}"
              _cw_gc:     "{{ _av_system.get('grocy_catalog', {}) }}"
              _cw_parts:  "{{ _cw_gc.get('parts', {}) }}"
              _cw_robot:  "{{ _cw_gc.get('robot_name', 'vacuum') }}"

          - if: "{{ not _cw_parts }}"
            then:
              - variables:
                  response: >-
                    {{ {
                      'mode': 'check_wear', 'result': 'not_provisioned',
                      'caller_token': _caller_token,
                      'message': 'Run mode=consumables action=provision first.'
                    } }}
              - stop: "check_wear not provisioned"
                response_variable: response

          # Scan-all path: no entity provided — check every catalog part with a wear_entity
          # Used by post-dock analyze flow and direct calls without a specific entity.
          - if: "{{ _cw_entity == '' }}"
            then:
              - variables:
                  _cw_scan_worn: >-
                    {%- set ns = namespace(worn=[]) -%}
                    {%- for k, v in _cw_parts.items() -%}
                      {%- set ent = v.get('wear_entity') -%}
                      {%- if ent is not none and ent != '' -%}
                        {%- set val = states(ent) | int(-1) -%}
                        {%- set thr = v.get('wear_threshold', 20) | int(20) -%}
                        {%- if val >= 0 and val <= thr -%}
                          {%- set ns.worn = ns.worn + [{'key': k, 'part': v, 'wear_pct': val, 'threshold': thr}] -%}
                        {%- endif -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {{ ns.worn }}
              - repeat:
                  for_each: "{{ _cw_scan_worn }}"
                  sequence:
                    - variables:
                        _sw_pk:         "{{ repeat.item.key }}"
                        _sw_pv:         "{{ repeat.item.part }}"
                        _sw_wear_pct:   "{{ repeat.item.wear_pct }}"
                        _sw_product_id: "{{ repeat.item.part.product_id | int(none) }}"
                    - action: script.zen_sutra_grocy
                      data:
                        action_type: read
                        endpoint: "stock/products/{{ _sw_product_id }}"
                      response_variable: _sw_stock_raw
                    - variables:
                        _sw_stock_content: "{{ _sw_stock_raw['result']['content'] | default({}, true) }}"
                    - variables:
                        _sw_stock_amt: "{{ _sw_stock_content.get('stock_amount', 0) | int(0) }}"
                    - if: "{{ _sw_stock_amt == 0 }}"
                      then:
                        - action: script.zen_dojotools_inventory
                          data:
                            mode: shopping_add_product
                            product_id: "{{ _sw_product_id }}"
                            amount: "{{ _sw_pv.min_stock | default(1) | int(1) }}"
                          response_variable: _sw_shop_raw
                    - variables:
                        _sw_pm_msg: >-
                          {%- set name = _sw_pv.get('name', _sw_pk) -%}
                          {%- if _sw_stock_amt > 0 -%}
                            {{ name }} is worn ({{ _sw_wear_pct }}% left). Spare on hand — run
                            consumables action=log_replaced part={{ _sw_pk }} to install.
                          {%- else -%}
                            {{ name }} is worn ({{ _sw_wear_pct }}% left) and out of stock. Added to shopping list.
                          {%- endif -%}
                    - action: script.zen_dojotools_postman
                      data:
                        mode: resolve_and_dispatch
                        owner: autovac
                        tag: "wear_{{ _sw_pk }}"
                        title: "{{ _cw_robot | title }} — {{ _sw_pv.get('name', _sw_pk) }} Worn"
                        message: "{{ _sw_pm_msg }}"
                        urgency: "{{ 5 if _sw_stock_amt == 0 else 4 }}"
                        channel_hint: push
                      response_variable: _sw_pm_raw
                    - if: "{{ _sw_pv.get('chore_id') is not none }}"
                      then:
                        - action: script.zen_dojotools_inventory
                          data:
                            mode: chores_execute
                            chore_id: "{{ _sw_pv.chore_id }}"
                          response_variable: _sw_chore_raw
              - variables:
                  response: >-
                    {{ {
                      'mode': 'check_wear', 'result': 'ok' if _cw_scan_worn | length == 0 else 'alerts',
                      'caller_token': _caller_token,
                      'alerts': _cw_scan_worn | length,
                      'worn_parts': _cw_scan_worn | map(attribute='key') | list
                    } }}
              - stop: "autovac check_wear scan-all done"
                response_variable: response

          - variables:
              _cw_part_key: >-
                {%- set ns = namespace(k='') -%}
                {%- for k, v in _cw_parts.items() -%}
                  {%- if v.get('wear_entity') == _cw_entity -%}
                    {%- set ns.k = k -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.k }}

          - if: "{{ _cw_part_key == '' }}"
            then:
              - variables:
                  response: >-
                    {{ {
                      'mode': 'check_wear', 'result': 'not_found',
                      'caller_token': _caller_token,
                      'entity': _cw_entity,
                      'message': 'No catalog part mapped to ' ~ _cw_entity ~ '. Re-provision to rebuild wear map.',
                      'hint': 'Verify autovac_wear label is applied to all Roborock wear sensors.'
                    } }}
              - stop: "check_wear part not found"
                response_variable: response

          - variables:
              _cw_part:       "{{ _cw_parts[_cw_part_key] }}"
              _cw_threshold:  "{{ _cw_part.get('wear_threshold', 20) | int(20) }}"
              _cw_wear_pct:   "{{ states(_cw_entity) | int(-1) }}"
              _cw_product_id: "{{ _cw_part.get('product_id') | int(none) }}"

          - action: script.zen_sutra_grocy
            data:
              action_type: read
              endpoint: "stock/products/{{ _cw_product_id }}"
            response_variable: _cw_stock_raw

          - variables:
              _cw_stock_content: "{{ _cw_stock_raw['result']['content'] | default({}, true) }}"

          - variables:
              _cw_stock_amt: "{{ _cw_stock_content.get('stock_amount', 0) | int(0) }}"
              _cw_alert:     "{{ _cw_wear_pct >= 0 and _cw_wear_pct <= _cw_threshold }}"

          - if: "{{ _cw_alert and _cw_stock_amt == 0 }}"
            then:
              - action: script.zen_dojotools_inventory
                data:
                  mode: shopping_add_product
                  product_id: "{{ _cw_product_id }}"
                  amount: "{{ _cw_part.get('min_stock', 1) | int(1) }}"
                response_variable: _cw_shop_raw

          - if: "{{ _cw_alert }}"
            then:
              - variables:
                  _cw_pm_msg: >-
                    {%- set name = _cw_part.get('name', _cw_part_key) -%}
                    {%- if _cw_stock_amt > 0 -%}
                      {{ name }} is worn ({{ _cw_wear_pct }}% left). Spare on hand — run
                      consumables action=log_replaced part={{ _cw_part_key }} to install.
                    {%- else -%}
                      {{ name }} is worn ({{ _cw_wear_pct }}% left) and out of stock. Added to shopping list.
                    {%- endif -%}
              - action: script.zen_dojotools_postman
                data:
                  mode: resolve_and_dispatch
                  owner: autovac
                  tag: "wear_{{ _cw_part_key }}"
                  title: "{{ _cw_robot | title }} — {{ _cw_part.get('name', _cw_part_key) }} Worn"
                  message: "{{ _cw_pm_msg }}"
                  urgency: "{{ 5 if _cw_stock_amt == 0 else 4 }}"
                  channel_hint: push
                response_variable: _cw_pm_raw

              - if: "{{ _cw_part.get('chore_id') is not none }}"
                then:
                  - action: script.zen_dojotools_inventory
                    data:
                      mode: chores_execute
                      chore_id: "{{ _cw_part.chore_id }}"
                    response_variable: _cw_chore_raw

          - variables:
              response: >-
                {{ {
                  'mode': 'check_wear',
                  'result': 'alert' if _cw_alert else 'ok',
                  'caller_token': _caller_token,
                  'part': _cw_part_key,
                  'part_name': _cw_part.get('name', _cw_part_key),
                  'category': _cw_part.get('category', 'bot'),
                  'wear_pct': _cw_wear_pct,
                  'threshold': _cw_threshold,
                  'stock': _cw_stock_amt,
                  'action': 'added_to_shopping' if (_cw_alert and _cw_stock_amt == 0) else
                            'notified_spare_available' if _cw_alert else 'no_action',
                  'notified': _cw_alert
                } }}
          - stop: "autovac check_wear done"
            response_variable: response

      # ---- clean -------------------------------------------------------------
      - if: "{{ _mode == 'clean' }}"
        then:
          - if: "{{ _rooms == '' }}"
            then:
              - variables:
                  response: >-
                    {{ {'mode': 'clean', 'result': 'error', 'caller_token': _caller_token,
                        'note': 'rooms parameter required for mode=clean', 'vacuum_state': _vacuum_state} }}
              - stop: "autovac clean — rooms required"
                response_variable: response
          - if: "{{ _vac_ent == '' }}"
            then:
              - variables:
                  response: >-
                    {{ {'mode': 'clean', 'result': 'error', 'caller_token': _caller_token,
                        'note': 'No vacuum entity found — label your vacuum with autovac. Run mode=setup to verify.'} }}
              - stop: "autovac clean — no vacuum entity"
                response_variable: response
          - if: "{{ _vacuum_state not in ['docked', 'idle'] }}"
            then:
              - variables:
                  response: >-
                    {{ {'mode': 'clean', 'result': 'error', 'caller_token': _caller_token,
                        'note': 'Vacuum not available — state: ' ~ _vacuum_state, 'vacuum_state': _vacuum_state} }}
              - stop: "autovac clean — vacuum not ready"
                response_variable: response
          - variables:
              _segments: >-
                {%- set ns = namespace(segs=[]) -%}
                {%- for r in _rooms.split(',') -%}
                  {%- set slug = r | trim | lower | replace(' ', '_') -%}
                  {%- set seg = _av_rooms.get(slug, {}).get('segment', 0) | int(0) -%}
                  {%- if seg > 0 -%}{%- set ns.segs = ns.segs + [seg] -%}{%- endif -%}
                {%- endfor -%}
                {{ ns.segs }}
              _clean_rooms: >-
                {%- set ns = namespace(rooms=[]) -%}
                {%- for r in _rooms.split(',') -%}
                  {%- set slug = r | trim | lower | replace(' ', '_') -%}
                  {%- set seg_ok = _av_rooms.get(slug, {}).get('segment', 0) | int(0) > 0 -%}
                  {%- if (_use_clean_area and slug in _av_rooms) or (not _use_clean_area and seg_ok) -%}
                    {%- set ns.rooms = ns.rooms + [slug] -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.rooms }}
              _clean_areas: >-
                {%- set ns = namespace(areas=[]) -%}
                {%- for r in _rooms.split(',') -%}
                  {%- set slug = r | trim | lower | replace(' ', '_') -%}
                  {%- if slug in _av_rooms -%}
                    {%- set area = _av_rooms.get(slug, {}).get('area_id', slug) -%}
                    {%- set ns.areas = ns.areas + [area] -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.areas }}
          - if: "{{ (_use_clean_area and _clean_areas | length == 0) or (not _use_clean_area and _segments | length == 0) }}"
            then:
              - variables:
                  response: >-
                    {{ {'mode': 'clean', 'result': 'not_found', 'caller_token': _caller_token,
                        'note': 'no rooms resolved — check room slugs: ' ~ _rooms ~ '. Run mode=status to see configured rooms.',
                        'vacuum_state': _vacuum_state} }}
              - stop: "autovac clean — no rooms resolved"
                response_variable: response
          - variables:
              _vacuum_service: >-
                {{ 'xiaomi_miio.vacuum_clean_segment' }}
          - action: script.zen_dojotools_filecabinet
            data:
              action_type: update
              volume_entity_id: "{{ _hh_cabinet }}"
              key: autovac
              value: >-
                {{ {'rooms': _av_rooms, 'system': _av_system | combine({
                      'current_run': {
                        'started_at': now().isoformat(),
                        'schedule_entity_id': 'manual',
                        'rooms': _clean_rooms,
                        'segments': _segments,
                        'areas': _clean_areas
                      }
                    })} | tojson }}
          - if: "{{ _use_clean_area }}"
            then:
              - action: vacuum.clean_area
                data:
                  areas: "{{ _clean_areas }}"
                target:
                  entity_id: "{{ _vac_ent }}"
            else:
              - action: "{{ _vacuum_service }}"
                data:
                  segments: "{{ _segments }}"
                target:
                  entity_id: "{{ _vac_ent }}"
          - variables:
              response: >-
                {{ {'mode': 'clean', 'result': 'ok', 'caller_token': _caller_token,
                    'rooms': _clean_rooms, 'segments': _segments,
                    'areas': _clean_areas if _use_clean_area else none,
                    'vacuum_state': _vacuum_state} }}
          - stop: "autovac clean ok"
            response_variable: response

      # ---- run_elected -------------------------------------------------------
      - if: "{{ _mode == 'run_elected' }}"
        then:
          - if: "{{ _elected | length == 0 }}"
            then:
              - variables:
                  response: >-
                    {{ {'mode': 'run_elected', 'result': 'no_rooms_elected', 'caller_token': _caller_token,
                        'note': 'No rooms currently elected — check mode=status for election details.'} }}
              - stop: "autovac run_elected — nothing to run"
                response_variable: response
          - if: "{{ _vac_ent == '' }}"
            then:
              - variables:
                  response: >-
                    {{ {'mode': 'run_elected', 'result': 'error', 'caller_token': _caller_token,
                        'note': 'No vacuum entity found — label your vacuum with autovac. Run mode=setup to verify.'} }}
              - stop: "autovac run_elected — no vacuum entity"
                response_variable: response
          - if: "{{ _vacuum_state not in ['docked', 'idle'] }}"
            then:
              - variables:
                  response: >-
                    {{ {'mode': 'run_elected', 'result': 'error', 'caller_token': _caller_token,
                        'note': 'Vacuum not available — state: ' ~ _vacuum_state, 'vacuum_state': _vacuum_state} }}
              - stop: "autovac run_elected — vacuum not ready"
                response_variable: response
          - variables:
              _re_rooms: "{{ _elected | map(attribute='room') | list }}"
              _re_segments: "{{ _elected | map(attribute='segment') | map('int') | list }}"
              _re_mop: "{{ _elected | selectattr('requires_mop', 'equalto', true) | map(attribute='room') | list }}"
              _re_dry_run: "{{ dry_run | default(false) }}"
          - if: "{{ _re_dry_run }}"
            then:
              - variables:
                  _re_blocked_due: >-
                    {%- set ns = namespace(b=[]) -%}
                    {%- for rn, rv in _av_rooms.items() -%}
                      {%- if rv.get('enabled', false) and rv.get('requires_ready', rv.get('require_confirmation', false))
                             and not rv.get('is_ready', rv.get('ready_to_clean', false)) -%}
                        {%- set last = rv.get('last_cleaned', '') -%}
                        {%- set ds = ((now().timestamp() - as_timestamp(last ~ 'T00:00:00', 0)) / 86400) | int(0) -%}
                        {%- if ds >= rv.get('days_between', 7) or rv.get('queued', false) -%}
                          {%- set ns.b = ns.b + [rn] -%}
                        {%- endif -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {{ ns.b }}
              - variables:
                  _re_dr_msg: >-
                    {%- set msg = 'Would run now: ' ~ (_re_rooms | join(', ')) ~ '.' -%}
                    {%- set msg = msg ~ ' Waiting on your OK: ' ~ (_re_blocked_due | join(', ')) ~ '.' if _re_blocked_due | length > 0 else msg -%}
                    {%- set msg = msg ~ ' Water tank is low — top it up!' if _water_low else msg -%}
                    {{ msg }}
              - action: script.zen_dojotools_postman
                data:
                  mode: resolve_and_dispatch
                  message: "{{ _re_dr_msg }}"
                  urgency: 4
                  channel_hint: tts
                  title: "Autovac Dry Run"
                  tag: autovac_dryrun
              - variables:
                  response: >-
                    {{ {'mode': 'run_elected', 'result': 'dry_run', 'caller_token': _caller_token,
                        'would_run': _re_rooms, 'segments': _re_segments,
                        'blocked_due': _re_blocked_due,
                        'water_warning': ('water low — mop required for: ' ~ (_re_mop | join(', ')))
                                         if (_water_low and _re_mop | length > 0) else none,
                        'message_sent': _re_dr_msg} }}
              - stop: "autovac run_elected dry_run"
                response_variable: response
          - if: "{{ _water_low and _re_mop | length > 0 and _water_low_action == 'stop' }}"
            then:
              - variables:
                  response: >-
                    {{ {'mode': 'run_elected', 'result': 'error', 'caller_token': _caller_token,
                        'note': 'water tank low — run stopped (water_low_action=stop), mop required for: ' ~ (_re_mop | join(', ')),
                        'water_low': true, 'mop_required_rooms': _re_mop} }}
              - stop: "autovac run_elected — water low"
                response_variable: response
          - variables:
              _re_areas: >-
                {%- set ns = namespace(areas=[]) -%}
                {%- for r in _elected -%}
                  {%- set area = _av_rooms.get(r.room, {}).get('area_id', r.room) -%}
                  {%- set ns.areas = ns.areas + [area] -%}
                {%- endfor -%}
                {{ ns.areas }}
              _vacuum_service: "{{ 'xiaomi_miio.vacuum_clean_segment' }}"
          - action: script.zen_dojotools_filecabinet
            data:
              action_type: update
              volume_entity_id: "{{ _hh_cabinet }}"
              key: autovac
              value: >-
                {{ {'rooms': _av_rooms, 'system': _av_system | combine({
                      'current_run': {
                        'started_at': now().isoformat(),
                        'schedule_entity_id': 'run_elected',
                        'rooms': _re_rooms,
                        'segments': _re_segments,
                        'areas': _re_areas
                      }
                    })} | tojson }}
          - if: "{{ _use_clean_area }}"
            then:
              - action: vacuum.clean_area
                data:
                  areas: "{{ _re_areas }}"
                target:
                  entity_id: "{{ _vac_ent }}"
            else:
              - action: "{{ _vacuum_service }}"
                data:
                  segments: "{{ _re_segments }}"
                target:
                  entity_id: "{{ _vac_ent }}"
          - variables:
              response: >-
                {{ {'mode': 'run_elected', 'result': 'ok', 'caller_token': _caller_token,
                    'rooms': _re_rooms, 'segments': _re_segments,
                    'areas': _re_areas if _use_clean_area else none,
                    'water_warning': ('water low — mop required for: ' ~ (_re_mop | join(', ')))
                                     if (_water_low and _re_mop | length > 0) else none} }}
          - stop: "autovac run_elected ok"
            response_variable: response

      # ---- run ---------------------------------------------------------------
      - if: "{{ _mode == 'run' }}"
        then:
          - if: "{{ _schedule_entity_id == '' }}"
            then:
              - variables:
                  response: >-
                    {{ {'mode': 'run', 'result': 'error', 'caller_token': _caller_token,
                        'note': 'schedule_entity_id required'} }}
              - stop: "autovac run — missing schedule entity"
                response_variable: response
          - if: "{{ _vac_ent == '' }}"
            then:
              - variables:
                  response: >-
                    {{ {'mode': 'run', 'result': 'error', 'caller_token': _caller_token,
                        'note': 'No vacuum entity found — label your vacuum with autovac. Run mode=setup to verify.'} }}
              - stop: "autovac run — no vacuum entity"
                response_variable: response
          - variables:
              _has_run_key: >-
                {{ _schedule_entity_id | replace('.', '_') | replace('-', '_') ~ '_has_run' }}
          - if: "{{ _av_system.get(_has_run_key, false) }}"
            then:
              - variables:
                  response: >-
                    {{ {'mode': 'run', 'result': 'skipped', 'caller_token': _caller_token,
                        'note': 'already run for this slot today', 'key': _has_run_key} }}
              - stop: "autovac run — already run"
                response_variable: response
          - if: "{{ not _enabled }}"
            then:
              - variables:
                  response: >-
                    {{ {'mode': 'run', 'result': 'skipped', 'caller_token': _caller_token,
                        'note': 'autovac disabled'} }}
              - stop: "autovac run — disabled"
                response_variable: response
          - if: "{{ _av_system.get('pause_today', false) }}"
            then:
              - variables:
                  response: >-
                    {{ {'mode': 'run', 'result': 'skipped', 'caller_token': _caller_token,
                        'note': 'paused today'} }}
              - stop: "autovac run — paused"
                response_variable: response
          - if: "{{ _battery < (_av_system.get('minimum_battery', 20) | int(20)) }}"
            then:
              - variables:
                  response: >-
                    {{ {'mode': 'run', 'result': 'skipped', 'caller_token': _caller_token,
                        'note': 'battery too low: ' ~ _battery ~ '%', 'battery_pct': _battery} }}
              - stop: "autovac run — low battery"
                response_variable: response
          - if: "{{ _dnd }}"
            then:
              - variables:
                  response: >-
                    {{ {'mode': 'run', 'result': 'skipped', 'caller_token': _caller_token,
                        'note': 'DnD active'} }}
              - stop: "autovac run — DnD active"
                response_variable: response
          - if: "{{ _vacuum_state not in ['docked', 'idle'] }}"
            then:
              - variables:
                  response: >-
                    {{ {'mode': 'run', 'result': 'skipped', 'caller_token': _caller_token,
                        'note': 'vacuum not ready — state: ' ~ _vacuum_state} }}
              - stop: "autovac run — vacuum not ready"
                response_variable: response
          - alias: Apply schedule block_data overrides (skip/whitelist) to elected list
            variables:
              _run_block_data: >-
                {{ (_av_system.get('schedule_block_data') or {}) if _av_system is mapping else {} }}
              _run_skip: >-
                {{ (_run_block_data if _run_block_data is mapping else {}).get('skip_rooms', '') | regex_findall('[^,]+') | map('trim') | list }}
              _run_wl: >-
                {{ (_run_block_data if _run_block_data is mapping else {}).get('rooms', '') | regex_findall('[^,]+') | map('trim') | list }}
              _run_is_room_sched: >-
                {{ _schedule_entity_id in label_entities('autovac_room_schedule') }}
              _run_room_scope: >-
                {%- if _schedule_entity_id in label_entities('autovac_room_schedule') -%}
                  {%- set aid = area_id(_schedule_entity_id) -%}
                  {%- set ns = namespace(rooms=[]) -%}
                  {%- for rn, rv in _av_rooms.items() -%}
                    {%- if rv.get('area_id', '') == aid -%}{%- set ns.rooms = ns.rooms + [rn] -%}{%- endif -%}
                  {%- endfor -%}
                  {{ ns.rooms }}
                {%- else -%}{{ [] }}{%- endif -%}
          - variables:
              _elected: >-
                {%- set ns = namespace(e=[]) -%}
                {%- set _skip = _run_skip | default([]) -%}
                {%- set _wl   = _run_wl   | default([]) -%}
                {%- set _rsm  = _room_sched_map if _room_sched_map is mapping else {} -%}
                {%- for r in _elected -%}
                  {%- set rn = r.get('room', '') -%}
                  {%- if _run_is_room_sched -%}
                    {%- set _bo_all = '*' in (_blackout_rooms | default([])) -%}
                    {%- set _bd_pass = rn in _run_room_scope and not _bo_all and rn not in (_blackout_rooms | default([])) -%}
                  {%- else -%}
                    {%- set _rse = _rsm.get(rn, '') -%}
                    {%- set _layer2_pass = (_rse == '') or (states(_rse) == 'on') -%}
                    {%- set _bo_all = '*' in (_blackout_rooms | default([])) -%}
                    {%- set _layer3_pass = not _bo_all and rn not in (_blackout_rooms | default([])) -%}
                    {%- set _bd_pass = (rn not in _skip) and (_wl | length == 0 or rn in _wl) and _layer2_pass and _layer3_pass -%}
                  {%- endif -%}
                  {%- if _bd_pass -%}
                    {%- set ns.e = ns.e + [r] -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.e }}
          - variables:
              _elected_valid: >-
                {%- set ns = namespace(valid=[]) -%}
                {%- for r in _elected -%}
                  {%- if _use_clean_area or r.get('segment', 0) | int(0) > 0 -%}
                    {%- set ns.valid = ns.valid + [r] -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.valid }}
          - variables:
              _elected_segments: "{{ _elected_valid | map(attribute='segment') | map('int') | list }}"
              _elected_areas: >-
                {%- set ns = namespace(areas=[]) -%}
                {%- for r in _elected_valid -%}
                  {%- set area = _av_rooms.get(r.room, {}).get('area_id', r.room) -%}
                  {%- set ns.areas = ns.areas + [area] -%}
                {%- endfor -%}
                {{ ns.areas }}
              _mop_elected: "{{ _elected_valid | selectattr('requires_mop', 'equalto', true) | map(attribute='room') | list }}"
              _water_low_action: "{{ _av_system.get('water_low_action', 'warn') | string | lower }}"
              _vacuum_service: "{{ 'xiaomi_miio.vacuum_clean_segment' }}"
          - if: "{{ _water_low and _mop_elected | length > 0 and _water_low_action == 'stop' }}"
            then:
              - variables:
                  response: >-
                    {{ {'mode': 'run', 'result': 'skipped', 'caller_token': _caller_token,
                        'note': 'water tank low — run stopped (water_low_action=stop), mop required for: ' ~ (_mop_elected | join(', ')),
                        'water_low': true, 'mop_required_rooms': _mop_elected} }}
              - stop: "autovac run — water low, mop required"
                response_variable: response
          - if: "{{ (_use_clean_area and _elected_areas | length == 0) or (not _use_clean_area and _elected_segments | length == 0) }}"
            then:
              - variables:
                  response: >-
                    {{ {'mode': 'run', 'result': 'skipped', 'caller_token': _caller_token,
                        'note': 'no rooms elected for this run — check election criteria or add rooms via mode=configure'} }}
              - stop: "autovac run — no elected rooms"
                response_variable: response
          - action: script.zen_dojotools_filecabinet
            data:
              action_type: update
              volume_entity_id: "{{ _hh_cabinet }}"
              key: autovac
              value: >-
                {%- set ns = namespace(r={}) -%}
                {%- for rn, rv in _av_rooms.items() -%}
                  {%- set ns.r = ns.r | combine({rn: rv | combine({'skip_next': false})}) -%}
                {%- endfor -%}
                {{ {'rooms': ns.r, 'system': _av_system | combine({
                      _has_run_key: true,
                      'schedule_block_data': {},
                      'current_run': {
                        'started_at': now().isoformat(),
                        'schedule_entity_id': _schedule_entity_id,
                        'block_data': _run_block_data | default({}),
                        'rooms': _elected_valid | map(attribute='room') | list,
                        'segments': _elected_segments,
                        'areas': _elected_areas
                      }
                    })} | tojson }}
          - if: "{{ _use_clean_area }}"
            then:
              - action: vacuum.clean_area
                data:
                  areas: "{{ _elected_areas }}"
                target:
                  entity_id: "{{ _vac_ent }}"
            else:
              - action: "{{ _vacuum_service }}"
                data:
                  segments: "{{ _elected_segments }}"
                target:
                  entity_id: "{{ _vac_ent }}"
          - variables:
              response: >-
                {{ {'mode': 'run', 'result': 'ok', 'caller_token': _caller_token,
                    'note': 'run started', 'vacuum_state': _vacuum_state,
                    'current_run': {'rooms': _elected_valid | map(attribute='room') | list, 'segments': _elected_segments},
                    'water_warning': ('water low — mop required for: ' ~ (_mop_elected | join(', '))) if (_water_low and _mop_elected | length > 0) else none} }}
          - stop: "autovac run complete"
            response_variable: response

      # ---- analyze -----------------------------------------------------------
      - if: "{{ _mode == 'analyze' }}"
        then:
          - variables:
              camera_response: {}
          - if: "{{ _cam_ent != '' }}"
            then:
              - alias: Analyze cleaning map via camera tool
                action: script.zen_dojotools_camera
                data:
                  tool: look
                  camera_entity: "{{ _cam_ent }}"
                  context_index_call:
                    label_1: autovac
                    expand_entities: true
                  instructions: >-
                    You are presented with a coverage map from a robotic vacuum on either
                    completion of its last job or upon error.

                    Analyze the map and summarize in 255 characters or less.

                    Identify if the vacuum appears to have covered the targeted area without
                    issue. The image shows a lighter 'path' across boundary boxes (rooms).
                    Nogo zones are vivid red lines or enclosed polygons. X's denote found
                    obstacles. A thin line shows the robot's path and estimated coverage.

                    Look for: vacuum stopped or trapped without completing a room; poor or
                    missed coverage; obstacles noted during the path.

                    If only some rooms show coverage, assume only those areas were called
                    and assess coverage for those areas only.

                    Title your report AutoVac: (Success|Fail|Attention) as appropriate.

                    Your summary MUST fit within 255 characters.
                response_variable: camera_response
          - variables:
              _current_run: "{{ _av_system.get('current_run', {}) | default({}, true) }}"
          - variables:
              # Parse the LLM verdict from the analysis title prefix (contract: "AutoVac: Success|Fail|Attention").
              # FAIL suppresses last_cleaned stamp so the room re-enters election immediately.
              # ATTENTION (partial coverage) still stamps — some cleaning occurred.
              # No camera = always stamp.
              _cam_verdict: >-
                {%- set _ca = camera_response.get('analysis', '') | upper -%}
                {%- if 'AUTOVAC: FAIL' in _ca -%}fail
                {%- elif 'AUTOVAC: ATTENTION' in _ca -%}attention
                {%- elif 'AUTOVAC: SUCCESS' in _ca -%}success
                {%- else -%}unknown{%- endif -%}
              _stamp_last_cleaned: "{{ _cam_ent == '' or _cam_verdict != 'fail' }}"
          - variables:
              _run_rooms: "{{ _current_run.get('rooms', []) }}"
              _updated_rooms: >-
                {%- set ns = namespace(r=_av_rooms) -%}
                {%- for rn in _run_rooms -%}
                  {%- if rn in ns.r -%}
                    {%- if _stamp_last_cleaned -%}
                      {%- set ns.r = ns.r | combine({rn: ns.r[rn] | combine({
                          'last_cleaned': now().strftime('%Y-%m-%d'),
                          'is_ready': false,
                          'queued': false
                      })}) -%}
                    {%- else -%}
                      {%- set ns.r = ns.r | combine({rn: ns.r[rn] | combine({
                          'is_ready': false,
                          'queued': false
                      })}) -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.r }}
          - if: "{{ _run_rooms | length > 0 }}"
            then:
              - action: script.zen_dojotools_filecabinet
                data:
                  action_type: update
                  volume_entity_id: "{{ _hh_cabinet }}"
                  key: autovac
                  value: >-
                    {{ {'rooms': _updated_rooms, 'system': _av_system | combine({'current_run': {}})} | tojson }}
            else:
              - alias: Clear stale current_run when no rooms were tracked
                action: script.zen_dojotools_filecabinet
                data:
                  action_type: update
                  volume_entity_id: "{{ _hh_cabinet }}"
                  key: autovac
                  value: >-
                    {{ {'rooms': _av_rooms, 'system': _av_system | combine({'current_run': {}})} | tojson }}
              - alias: Warn — vacuum docked but run not tracked
                action: script.zen_dojotools_postman
                data:
                  mode: resolve_and_dispatch
                  message: >-
                    Autovac docked but no rooms were tracked for this run — last_cleaned stamps not updated.
                    If the vacuum was started manually, run mode=mark_cleaned room=<slug> for each cleaned room.
                  urgency: 6
                  channel_hint: push
                  title: "Autovac — Rooms Not Tracked"
                  tag: autovac_untracked_run
          - alias: Broadcast run-complete event for downstream consumers
            event: zen_event
            event_data:
              event:
                kind: autovac_run_complete
                status: "{{ 'error' if _trigger_id == 'error' else 'complete' }}"
                rooms_cleaned: "{{ _run_rooms }}"
                last_clean_area_m2: "{{ states(_last_area_ent) | float(0) if _last_area_ent != '' else 0 }}"
                last_clean_duration_s: "{{ states(_last_dur_ent) | int(0) if _last_dur_ent != '' else 0 }}"
                analysis: "{{ camera_response.get('analysis', '') }}"
                camera_verdict: "{{ _cam_verdict }}"
                last_cleaned_stamped: "{{ _stamp_last_cleaned }}"
          - variables:
              response: >-
                {{ {'mode': 'analyze', 'result': 'ok', 'caller_token': _caller_token,
                    'status': ('error' if _trigger_id == 'error' else 'complete'),
                    'rooms_cleaned': _run_rooms,
                    'camera_used': _cam_ent != '',
                    'camera_verdict': _cam_verdict,
                    'last_cleaned_stamped': _stamp_last_cleaned,
                    'analysis': camera_response.get('analysis', '')} }}
          - stop: "autovac analyze complete"
            response_variable: response

      # ---- briefing ----------------------------------------------------------
      - if: "{{ _mode == 'briefing' }}"
        then:
          - if: "{{ not _enabled or _av_system.get('pause_today', false) }}"
            then:
              - variables:
                  response: >-
                    {{ {
                      'mode': 'briefing', 'result': 'skipped',
                      'caller_token': _caller_token,
                      'reason': 'system_disabled' if not _enabled else 'paused_today'
                    } }}
              - stop: "autovac briefing skipped"
                response_variable: response
          - if: "{{ _vacuum_state in ['cleaning', 'returning', 'paused'] }}"
            then:
              - variables:
                  response: >-
                    {{ {
                      'mode': 'briefing', 'result': 'skipped',
                      'caller_token': _caller_token,
                      'reason': 'vacuum_active',
                      'vacuum_state': _vacuum_state
                    } }}
              - stop: "autovac briefing skipped — vacuum active"
                response_variable: response
          - alias: Find cascade-winning schedule firing in ~30 min
            action: script.zen_dojotools_autovac
            data:
              mode: schedule
              window_start: 1770
              window_end: 2400
            response_variable: _briefing_sched_resp
          - variables:
              _schedule_entity: "{{ (_briefing_sched_resp.get('in_window') or {}).get('entity', '') }}"
          - if: "{{ _schedule_entity == '' }}"
            then:
              - variables:
                  response: >-
                    {{ {
                      'mode': 'briefing', 'result': 'skipped',
                      'caller_token': _caller_token,
                      'reason': 'no_schedule_in_window'
                    } }}
              - stop: "autovac briefing skipped — no schedule in window"
                response_variable: response
          - alias: Calendar gate
            if: "{{ label_entities('autovac_calendar') | list | length > 0 }}"
            then:
              - action: calendar.get_events
                target:
                  entity_id: "{{ label_entities('autovac_calendar') | list }}"
                data:
                  start_date_time: "{{ now().isoformat() }}"
                  end_date_time: "{{ (now() + timedelta(hours=4)).isoformat() }}"
                response_variable: _cal_events_raw
                continue_on_error: true
          - variables:
              _cal_hold: >-
                {%- set ns = namespace(hold=false, event='') -%}
                {%- if _cal_events_raw is defined and _cal_events_raw is mapping -%}
                  {%- for eid, evts in _cal_events_raw.items() -%}
                    {%- for evt in evts | default([]) -%}
                      {%- set summ = evt.get('summary', '') | default('', true) | upper -%}
                      {%- set desc = evt.get('description', '') | default('', true) | upper -%}
                      {%- if (summ | trim == 'AUTOVAC HOLD' or summ | trim | regex_match('^AUTOVAC HOLD[: ]')) or (desc | trim == 'AUTOVAC HOLD' or desc | trim | regex_match('^AUTOVAC HOLD[: ]')) -%}
                        {%- set ns.hold = true -%}
                        {%- set ns.event = evt.get('summary', 'Calendar event') -%}
                      {%- endif -%}
                    {%- endfor -%}
                  {%- endfor -%}
                {%- endif -%}
                {{ {'hold': ns.hold, 'event': ns.event} }}
              _cal_soft: >-
                {%- set ns = namespace(events=[]) -%}
                {%- if _cal_events_raw is defined and _cal_events_raw is mapping -%}
                  {%- for eid, evts in _cal_events_raw.items() -%}
                    {%- for evt in evts | default([]) -%}
                      {%- set summ = evt.get('summary', '') | default('', true) -%}
                      {%- set is_hold = 'AUTOVAC HOLD' in summ | upper or 'AUTOVAC HOLD' in evt.get('description','') | default('',true) | upper -%}
                      {%- if not is_hold -%}{%- set ns.events = ns.events + [summ] -%}{%- endif -%}
                    {%- endfor -%}
                  {%- endfor -%}
                {%- endif -%}
                {{ ns.events }}
          - if: "{{ _cal_hold.get('hold', false) }}"
            then:
              - action: script.zen_dojotools_postman
                data:
                  mode: resolve_and_dispatch
                  message: "Autovac run blocked by calendar hold: {{ _cal_hold.get('event', 'hold event') }}. Remove AUTOVAC HOLD from the event description to resume."
                  urgency: 6
                  channel_hint: push
                  title: "Autovac — Calendar Hold"
                  tag: autovac_prerun
              - variables:
                  response: >-
                    {{ {'mode': 'briefing', 'result': 'skipped', 'caller_token': _caller_token,
                        'reason': 'calendar_hold', 'hold_event': _cal_hold.get('event', '')} }}
              - stop: "autovac briefing blocked by calendar hold"
                response_variable: response
          - alias: Extract per-block data from winning schedule entity
            action: schedule.get_schedule
            continue_on_error: true
            response_variable: _briefing_bd_raw
            data: {}
            target:
              entity_id: "{{ _schedule_entity }}"
          - variables:
              _briefing_block_data: >-
                {%- set raw = _briefing_bd_raw | string -%}
                {%- set dow = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'][now().weekday()] -%}
                {%- set day_section = raw | regex_findall("'" ~ dow ~ "':\\s*\\[([^\\[\\]]+)\\]") | first | default('') -%}
                {%- if 'data' in day_section -%}
                  {%- set data_str = day_section | regex_findall("'data':\\s*(\\{[^}]+\\})") | first | default('') -%}
                  {%- if data_str -%}
                    {{ data_str | replace("'", '"') | from_json(none) | default({}) }}
                  {%- else -%}{{ {} }}{%- endif -%}
                {%- else -%}{{ {} }}{%- endif -%}
          - variables:
              _briefing_skip:  "{{ (_briefing_block_data if _briefing_block_data is mapping else {}).get('skip_rooms', '') | regex_findall('[^,]+') | map('trim') | list }}"
              _briefing_wl:    "{{ (_briefing_block_data if _briefing_block_data is mapping else {}).get('rooms', '') | regex_findall('[^,]+') | map('trim') | list }}"
              _briefing_bmode: "{{ (_briefing_block_data if _briefing_block_data is mapping else {}).get('mode', '') | trim }}"

          - alias: Build run label from next_event
            variables:
              _run_label: >-
                {%- if _schedule_entity != '' -%}
                  {%- set ne = state_attr(_schedule_entity, 'next_event') -%}
                  {%- if ne is not none -%}
                    {%- set h = as_datetime(ne).hour | int(0) -%}
                    {{ ('morning' if h < 12 else 'evening') ~ ' run at ' ~ as_datetime(ne).strftime('%I:%M %p') }}
                  {%- else -%}
                    scheduled run
                  {%- endif -%}
                {%- else -%}
                  upcoming run
                {%- endif -%}
          - alias: Build time label
            variables:
              _time_label: >-
                {%- set _sched = _schedule_entity -%}
                {%- if _sched == '' -%}
                  {%- set _we = now().weekday() >= 5 -%}
                  {%- set _am = now().hour < 12 -%}
                  {%- set _type = ('weekend' if _we else 'weekday') ~ ('_morning' if _am else '_evening') -%}
                  {%- set _sched = label_entities('autovac_schedule') | select('search', _type) | list | first | default('') -%}
                {%- endif -%}
                {%- set ne = state_attr(_sched, 'next_event') if _sched != '' else none -%}
                {%- if ne is not none -%}
                  {%- set mins = ((as_datetime(ne) - now()).total_seconds() / 60) | round(0) | int -%}
                  {%- if mins <= 1 -%}
                    in about a minute
                  {%- elif mins < 60 -%}
                    in {{ mins }} minutes
                  {%- else -%}
                    {%- set hrs = (mins / 60) | round(0, 'floor') | int -%}
                    {%- set rem = mins - (hrs * 60) -%}
                    in {{ hrs }} hour{{ 's' if hrs != 1 else '' }}{{ ' ' ~ rem ~ ' min' if rem > 0 else '' }}
                  {%- endif -%}
                {%- else -%}
                  soon
                {%- endif -%}
          - alias: Build message and urgency
            variables:
              _message: >-
                {%- set ns = namespace(will_run=[], blocked=[], parts=[]) -%}
                {%- set _skip = _briefing_skip | default([]) -%}
                {%- set _wl   = _briefing_wl   | default([]) -%}
                {%- for rn, rv in _av_rooms.items() -%}
                  {%- set _rsm = _room_sched_map if _room_sched_map is mapping else {} -%}
                  {%- set _rse = _rsm.get(rn, '') -%}
                  {%- set _layer2_pass = (_rse == '') or (states(_rse) == 'on') -%}
                  {%- set _bo_all = '*' in (_blackout_rooms | default([])) -%}
                  {%- set _layer3_pass = not _bo_all and rn not in (_blackout_rooms | default([])) -%}
                  {%- set _bd_pass = (rn not in _skip) and (_wl | length == 0 or rn in _wl) and _layer2_pass and _layer3_pass -%}
                  {%- if rv.get('enabled', false) and not rv.get('skip_next', false) and _bd_pass -%}
                    {%- set last = rv.get('last_cleaned', '') -%}
                    {%- set ds = ((now().timestamp() - as_timestamp(last ~ 'T00:00:00', 0)) / 86400) | int(0) -%}
                    {%- set due = ds >= rv.get('days_between', 7) -%}
                    {%- set will_be_ready = rv.get('is_ready', rv.get('ready_to_clean', false)) or not rv.get('requires_ready', rv.get('require_confirmation', false)) -%}
                    {%- if will_be_ready and (due or rv.get('queued', false)) -%}
                      {%- set ns.will_run = ns.will_run + [rn] -%}
                    {%- elif rv.get('requires_ready', rv.get('require_confirmation', false)) and not rv.get('is_ready', rv.get('ready_to_clean', false)) and (due or rv.get('queued', false)) -%}
                      {%- set ns.blocked = ns.blocked + [rn] -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endfor -%}
                {%- if ns.will_run | length > 0 -%}
                  {%- set ns.parts = ns.parts + ["The " ~ _run_label ~ " starts " ~ _time_label ~ ". Rooms: " ~ (ns.will_run | join(', ')) ~ "."] -%}
                {%- else -%}
                  {%- set ns.parts = ns.parts + ["The " ~ _run_label ~ " starts " ~ _time_label ~ " but no rooms are elected yet."] -%}
                {%- endif -%}
                {%- if ns.blocked | length > 0 -%}
                  {%- set ns.parts = ns.parts + ["Waiting on your OK: " ~ (ns.blocked | join(', ')) ~ "."] -%}
                {%- endif -%}
                {%- if _water_low_ent != '' and is_state(_water_low_ent, 'on') -%}
                  {%- set ns.parts = ns.parts + ["Water tank is low — top it up!"] -%}
                {%- endif -%}
                {%- set battery = state_attr(_vac_ent, 'battery_level') | int(100) if _vac_ent != '' else 100 -%}
                {%- if battery < 50 -%}
                  {%- set ns.parts = ns.parts + ["Battery at " ~ battery ~ "% — may not finish the full run."] -%}
                {%- endif -%}
                {%- set last = states(_last_start_ent) if _last_start_ent != '' else 'unknown' -%}
                {%- if last not in ['unknown', 'unavailable', ''] -%}
                  {%- set days = ((now() - as_datetime(last)).total_seconds() / 86400) | round(1) -%}
                  {%- if days | float(0) > 3 -%}
                    {%- set ns.parts = ns.parts + ["The vacuum hasn't run in " ~ days ~ " days."] -%}
                  {%- endif -%}
                {%- endif -%}
                {%- if _cal_soft | default([]) | length > 0 -%}
                  {%- set ns.parts = ns.parts + ["Note: " ~ (_cal_soft | join(', ')) ~ " during run window."] -%}
                {%- endif -%}
                {%- if _briefing_skip | default([]) | length > 0 -%}
                  {%- set ns.parts = ns.parts + ["Schedule override: skipping " ~ (_briefing_skip | join(', ')) ~ " this run."] -%}
                {%- endif -%}
                {%- if _briefing_wl | default([]) | length > 0 -%}
                  {%- set ns.parts = ns.parts + ["Schedule override: only running " ~ (_briefing_wl | join(', ')) ~ " this run."] -%}
                {%- endif -%}
                {%- if '*' in (_blackout_rooms | default([])) -%}
                  {%- set ns.parts = ns.parts + ["Active blackout — full house excluded this run."] -%}
                {%- elif (_blackout_rooms | default([])) | length > 0 -%}
                  {%- set ns.parts = ns.parts + ["Active blackout for: " ~ (_blackout_rooms | join(', ')) ~ "."] -%}
                {%- endif -%}
                {%- set _rsm = _room_sched_map if _room_sched_map is mapping else {} -%}
                {%- set _own_excluded = _rsm.keys() | reject('in', ns.will_run) | list -%}
                {%- if _own_excluded | length > 0 -%}
                  {%- set ns.parts = ns.parts + [(_own_excluded | join(', ')) ~ " on personal schedule — skipped from global run."] -%}
                {%- endif -%}
                {{ ns.parts | join(' ') }}
              _urgency: >-
                {{ 7 if ((_water_low_ent != '' and is_state(_water_low_ent, 'on'))
                    or (_vac_ent != '' and (state_attr(_vac_ent, 'battery_level') | int(100)) < 50))
                   else 4 }}
          - alias: Auto-mark ready + stamp block_data for run to consume
            action: script.zen_dojotools_filecabinet
            data:
              action_type: update
              volume_entity_id: "{{ _hh_cabinet }}"
              key: autovac
              value: >-
                {%- set ns = namespace(r=_av_rooms) -%}
                {%- set _sys_upd = _av_system | combine({'schedule_block_data': _briefing_block_data | default({})}) -%}
                {%- for rn, rv in _av_rooms.items() -%}
                  {%- if rv.get('enabled', false) and not rv.get('requires_ready', rv.get('require_confirmation', false))
                         and not rv.get('skip_next', false) -%}
                    {%- set last = rv.get('last_cleaned', '') -%}
                    {%- set ds = ((now().timestamp() - as_timestamp(last ~ 'T00:00:00', 0)) / 86400) | int(0) -%}
                    {%- if ds >= rv.get('days_between', 7) or rv.get('queued', false) -%}
                      {%- set ns.r = ns.r | combine({rn: rv | combine({'ready_to_clean': true})}) -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ {'rooms': ns.r, 'system': _sys_upd} | tojson }}
          - alias: Dispatch via Postman
            action: script.zen_dojotools_postman
            data:
              mode: resolve_and_dispatch
              message: "{{ _message }}"
              urgency: "{{ _urgency | int }}"
              channel_hint: tts
              title: "Autovac Pre-Run Briefing"
              tag: autovac_prerun
              response_type: custom
              response_timeout_s: 1800
              ack_owner: autovac
              ack_context: >-
                prerun_{{ now().strftime('%Y%m%d') }}|{{ _schedule_entity if _schedule_entity != '' else 'none' }}
              notification_data:
                actions:
                  - action: go_now
                    title: "Go now!"
                  - action: cancel_run
                    title: "Skip this run"
                  - action: pause_day
                    title: "Pause all day"
          - variables:
              response: >-
                {{ {'mode': 'briefing', 'result': 'dispatched', 'caller_token': _caller_token,
                    'message': _message} }}
          - stop: "autovac briefing dispatched"
            response_variable: response

      # ---- handle_ack --------------------------------------------------------
      - if: "{{ _mode == 'handle_ack' }}"
        then:
          - if: "{{ _ack_context.startswith('prerun_') }}"
            then:
              - variables:
                  _prerun_sched: >-
                    {{ _ack_context.split('|', 1)[-1] if '|' in _ack_context else 'none' }}
              - variables:
                  _prerun_hrk: >-
                    {%- if _prerun_sched not in ['', 'none'] -%}
                      {{ _prerun_sched | replace('.', '_') | replace('-', '_') ~ '_has_run' }}
                    {%- else -%}{{ '' }}{%- endif -%}

              # go_now: mark slot done, fire via same logic as run_elected
              - if: "{{ _ack_action == 'go_now' }}"
                then:
                  - variables:
                      _go_segs: "{{ _elected | map(attribute='segment') | map('int') | list }}"
                      _go_areas: >-
                        {%- set ns = namespace(a=[]) -%}
                        {%- for r in _elected -%}
                          {%- set area = _av_rooms.get(r.room, {}).get('area_id', r.room) -%}
                          {%- set ns.a = ns.a + [area] -%}
                        {%- endfor -%}
                        {{ ns.a }}
                  - if: "{{ _elected | length == 0 or _vacuum_state not in ['docked', 'idle'] }}"
                    then:
                      - action: script.zen_dojotools_postman
                        data:
                          mode: resolve_and_dispatch
                          message: >-
                            {%- if _elected | length == 0 -%}
                              No rooms elected — nothing to run right now.
                            {%- else -%}
                              Vacuum is {{ _vacuum_state }} — not ready to start. Try again when docked.
                            {%- endif -%}
                          urgency: 6
                          channel_hint: push
                          title: "Autovac — Can't Start"
                          tag: autovac_cant_start
                  - if: "{{ _elected | length > 0 and _vacuum_state in ['docked', 'idle'] }}"
                    then:
                      - action: script.zen_dojotools_filecabinet
                        data:
                          action_type: update
                          volume_entity_id: "{{ _hh_cabinet }}"
                          key: autovac
                          value: >-
                            {{ {'rooms': _av_rooms, 'system': _av_system | combine(
                              ({_prerun_hrk: true} if _prerun_hrk != '' else {}),
                              {'current_run': {
                                'started_at': now().isoformat(),
                                'schedule_entity_id': _prerun_sched,
                                'rooms': _elected | map(attribute='room') | list,
                                'segments': _go_segs,
                                'areas': _go_areas
                              }}
                            )} | tojson }}
                      - if: "{{ _use_clean_area }}"
                        then:
                          - action: vacuum.clean_area
                            data:
                              areas: "{{ _go_areas }}"
                            target:
                              entity_id: "{{ _vac_ent }}"
                        else:
                          - action: xiaomi_miio.vacuum_clean_segment
                            data:
                              segments: "{{ _go_segs }}"
                            target:
                              entity_id: "{{ _vac_ent }}"
                      - action: script.zen_dojotools_postman
                        data:
                          mode: resolve_and_dispatch
                          message: "Starting now — vacuum is on its way!"
                          urgency: 5
                          channel_hint: push
                          title: "Autovac Starting"
                          tag: autovac_prerun

              # cancel_run: mark this slot done only — other scheduled runs today unaffected
              - if: "{{ _ack_action == 'cancel_run' }}"
                then:
                  - if: "{{ _prerun_hrk != '' }}"
                    then:
                      - action: script.zen_dojotools_filecabinet
                        data:
                          action_type: update
                          volume_entity_id: "{{ _hh_cabinet }}"
                          key: autovac
                          value: "{{ {'rooms': _av_rooms, 'system': _av_system | combine({_prerun_hrk: true})} | tojson }}"
                  - action: script.zen_dojotools_postman
                    data:
                      mode: resolve_and_dispatch
                      message: "This run skipped. Other scheduled runs today are not affected."
                      urgency: 4
                      channel_hint: push
                      title: "Autovac Run Skipped"
                      tag: autovac_prerun

              # pause_day (+ legacy 'cancel'): pause_today until midnight nightly_reset
              - if: "{{ _ack_action in ['pause_day', 'cancel'] }}"
                then:
                  - action: script.zen_dojotools_filecabinet
                    data:
                      action_type: update
                      volume_entity_id: "{{ _hh_cabinet }}"
                      key: autovac
                      value: "{{ {'rooms': _av_rooms, 'system': _av_system | combine({'pause_today': true})} | tojson }}"
                  - if: "{{ _vac_ent != '' and _vacuum_state in ['cleaning', 'returning', 'paused'] }}"
                    then:
                      - alias: Stop vacuum mid-run
                        action: vacuum.return_to_base
                        target:
                          entity_id: "{{ _vac_ent }}"
                  - action: script.zen_dojotools_postman
                    data:
                      mode: resolve_and_dispatch
                      message: >-
                        All runs paused for today.
                        {{ "On the way back to dock." if (_vac_ent != '' and _vacuum_state in ['cleaning', 'returning', 'paused']) else '' }}
                      urgency: 5
                      channel_hint: push
                      title: "Autovac Paused"
                      tag: autovac_prerun

          - if: "{{ _pm_tag != '' }}"
            then:
              - action: script.zen_dojotools_postman
                data:
                  mode: clear_tag
                  tag: "{{ _pm_tag }}"
                  caller_token: "{{ _caller_token }}"
          - variables:
              response: >-
                {{ {'mode': 'handle_ack', 'result': 'ok', 'caller_token': _caller_token,
                    'ack_action': _ack_action} }}
          - stop: "autovac handle_ack complete"
            response_variable: response

      # ---- nightly_reset -----------------------------------------------------
      - if: "{{ _mode == 'nightly_reset' }}"
        then:
          - action: script.zen_dojotools_filecabinet
            data:
              action_type: update
              volume_entity_id: "{{ _hh_cabinet }}"
              key: autovac
              value: >-
                {%- set ns = namespace(sys={}, r={}) -%}
                {%- for s in label_entities('autovac_schedule') -%}
                  {%- set k = s | replace('.', '_') | replace('-', '_') ~ '_has_run' -%}
                  {%- set ns.sys = ns.sys | combine({k: false}) -%}
                {%- endfor -%}
                {%- for rn, rv in _av_rooms.items() -%}
                  {%- set ns.r = ns.r | combine({rn: rv | combine({'is_ready': false})}) -%}
                {%- endfor -%}
                {{ {'rooms': ns.r, 'system': _av_system | combine(ns.sys) | combine({'pause_today': false})} | tojson }}
          - variables:
              response: >-
                {{ {'mode': 'nightly_reset', 'result': 'ok', 'caller_token': _caller_token} }}
          - stop: "autovac nightly_reset complete"
            response_variable: response

      # ---- morning_reset -----------------------------------------------------
      - if: "{{ _mode == 'morning_reset' }}"
        then:
          - delay:
              minutes: 1
          - action: script.zen_dojotools_filecabinet
            data:
              action_type: update
              volume_entity_id: "{{ _hh_cabinet }}"
              key: autovac
              value: >-
                {%- set ns = namespace(r={}) -%}
                {%- for rn, rv in _av_rooms.items() -%}
                  {%- set ns.r = ns.r | combine({rn: rv | combine({'is_ready': false})}) -%}
                {%- endfor -%}
                {{ {'rooms': ns.r, 'system': _av_system} | tojson }}
          - variables:
              response: >-
                {{ {'mode': 'morning_reset', 'result': 'ok', 'caller_token': _caller_token} }}
          - stop: "autovac morning_reset complete"
            response_variable: response

      # ---- kfc_manifest --------------------------------------------------------
      # Multi-component KFC definition. bootstrap_kfc reads this and writes one
      # live drawer per component into the dojo cabinet.
      # No component → returns full list (bootstrap). component → single dict (FC live drawer).
      #
      # Inventory unavailability note:
      #   grocy_catalog absent (mode=consumables action=provision not yet run) →
      #   consumables (action=status/add_to_shopping/log_replaced/log_purchased) and
      #   check_wear are unavailable. All other modes including status, run, briefing,
      #   schedule, and room management remain fully functional.
      - if: "{{ _mode == 'kfc_manifest' }}"
        then:
          - variables:
              _kfc_defs:
                - kata_key: autovac
                  friendly_name: Autovac
                  label: autovac
                  component_summary: >-
                    Autonomous vacuum surface — room election, schedule-aware runs,
                    consumables ERP. Consult for cleaning schedule, robot state, and part stock.
                  component_instructions: >-
                    You are reading the vacuum system state for this household.

                    SEED OUTPUT (zen_dojotools_autovac, mode=status — when whitelisted):
                      Full cabinet snapshot: system config (enabled, pause_today, min_battery,
                      water_low_action), elected rooms with days_since/days_between, schedule
                      entities with has_run_today and next_event, last_run, run_readiness,
                      consumables stock. Use this as ground truth for all vacuum questions.

                    INDEX-ONLY PATH (label:autovac entity surface — automatic fallback):
                      Vacuum entity: state (cleaning/docked/idle/error/returning), battery_level,
                      fan_speed. Schedule entities: state (on/off), next fire time.
                      Last-clean sensors: duration, area, start time.
                      Current-room sensor if live. Interpret from entity state alone — no cabinet.

                    REPORTING:
                      Active run: name state, elapsed time, current room if available.
                      Docked + battery < 50%: note charging, include battery %.
                      Error state: surface error detail and last clean time.
                      Elected rooms: list names with days_since/days_between. Note if due today.
                      Consumables: surface only worn (wear < threshold) or out-of-stock parts.
                      DnD or pause active: mention if a run was gated by it.

                    NOMINAL: "Vacuum docked. [N] rooms elected. Last cleaned [room] [X] days ago."
                    ALERT: "Vacuum [error|worn part|low water]: [specific issue]."
                  tool: zen_dojotools_autovac
                  seed:
                    tool: zen_dojotools_autovac
                    params:
                      mode: status
                  trigger_subscriptions: "daily_midnight,ha_start"
                  drift_threshold: 30
                  emission_cooldown_minutes: 120
                  meta:
                    enabled: true
                    requires:
                      cert: ''
                      level: 0
          - variables:
              _component: "{{ component | default('') | lower | trim }}"
          - variables:
              result: >-
                {%- if _component == '' -%}
                  {{ {'mode': 'kfc_manifest', 'result': 'ok', 'status': 'ok', 'caller_token': _caller_token, 'kfc': _kfc_defs} }}
                {%- else -%}
                  {%- set match = _kfc_defs | selectattr('kata_key', 'equalto', _component) | list | first | default(none) -%}
                  {%- if match is not none -%}
                    {{ {'mode': 'kfc_manifest', 'result': 'ok', 'status': 'ok', 'caller_token': _caller_token, 'kfc': match} }}
                  {%- else -%}
                    {{ {'mode': 'kfc_manifest', 'result': 'not_found', 'status': 'not_found', 'caller_token': _caller_token,
                        'error': 'component not found: ' ~ _component,
                        'available': _kfc_defs | map(attribute='kata_key') | list} }}
                  {%- endif -%}
                {%- endif -%}
          - stop: "autovac kfc manifest"
            response_variable: result

      # ---- lens: stacks_by_anchor -----------------------------------------------
      # Lens Bus provider — area_id anchor → cleaning_evidence per matched room.
      # Room slug must match the HA area_id exactly.
      - if: "{{ _mode == 'stacks_by_anchor' }}"
        then:
          - variables:
              _anchor_type:  "{{ anchor_type | default('') | lower | trim }}"
              _anchor_ids:   "{{ anchor_ids if anchor_ids is sequence and anchor_ids is not string else (anchor_ids | from_json(none) if anchor_ids is string and anchor_ids | trim != '' else []) }}"
          - if: "{{ _anchor_type != 'area_id' }}"
            then:
              - variables:
                  result: >-
                    {{ {'mode': 'stacks_by_anchor', 'result': 'ok', 'caller_token': _caller_token,
                        'provider': 'autovac', 'evidence': [],
                        'note': 'autovac only handles area_id anchors'} }}
              - stop: "autovac lens stacks_by_anchor — unsupported anchor type"
                response_variable: result
          - variables:
              _lens_evidence: >-
                {%- set ns = namespace(ev=[]) -%}
                {%- for aid in _anchor_ids -%}
                  {%- set rv = _av_rooms.get(aid, none) -%}
                  {%- if rv is not none -%}
                    {%- set last = rv.get('last_cleaned', '') -%}
                    {%- set days_since = ((now().timestamp() - as_timestamp(last ~ 'T00:00:00', 0)) / 86400) | int(0) if last != '' else -1 -%}
                    {%- set db = rv.get('days_between', 7) -%}
                    {%- set due = days_since >= db if days_since >= 0 else false -%}
                    {%- set queued = rv.get('queued', false) -%}
                    {%- set skip_next = rv.get('skip_next', false) -%}
                    {%- set req_ready = rv.get('requires_ready', rv.get('require_confirmation', false)) -%}
                    {%- set is_rdy = rv.get('is_ready', rv.get('ready_to_clean', false)) -%}
                    {%- set elected = _elected | selectattr('room', 'equalto', aid) | list | length > 0 -%}
                    {%- set wla = _av_system.get('water_low_action', 'warn') | lower -%}
                    {%- set b0 = ['disabled'] if not rv.get('enabled', true) else [] -%}
                    {%- set b1 = b0 + ['not_due'] if (not due and not queued) else b0 -%}
                    {%- set b2 = b1 + ['skip_next'] if skip_next else b1 -%}
                    {%- set b3 = b2 + ['not_ready'] if (req_ready and not is_rdy) else b2 -%}
                    {%- set blockers = b3 + ['water_low'] if (rv.get('requires_mop', false) and _water_low and wla == 'stop') else b3 -%}
                    {%- set ns.ev = ns.ev + [{
                      'id': aid,
                      'type': 'cleaning_evidence',
                      'area_id': aid,
                      'provider': 'autovac',
                      'content_redacted': false,
                      'enabled': rv.get('enabled', true),
                      'last_cleaned': last,
                      'days_since_cleaned': days_since,
                      'days_between': db,
                      'due': due,
                      'queued': queued,
                      'elected': elected,
                      'blockers': blockers,
                      'requires_mop': rv.get('requires_mop', false)
                    }] -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ ns.ev }}
          - variables:
              result: >-
                {{ {'mode': 'stacks_by_anchor', 'result': 'ok',
                    'caller_token': _caller_token, 'provider': 'autovac',
                    'evidence': _lens_evidence,
                    'matched': _lens_evidence | count,
                    'unmatched': (_anchor_ids | list | count) - (_lens_evidence | count)} }}
          - stop: "autovac lens stacks_by_anchor"
            response_variable: result

      # ---- lens: register -------------------------------------------------------
      - if: "{{ _mode == 'register' }}"
        then:
          - variables:
              _reg_entry: >-
                {{ {
                  'autovac': {
                    'provider': 'autovac',
                    'tool': 'zen_dojotools_autovac',
                    'configured_by': 'zen_dojotools_autovac',
                    'department': 'dojotools',
                    'consumes': ['area_id'],
                    'returns': ['cleaning_evidence'],
                    'failure_policy': 'soft',
                    'content_policy': 'standard',
                    'risk_class': 'read_only',
                    'enabled': true,
                    'status': 'available'
                  }
                } }}
          - action: script.zen_dojotools_filecabinet
            data:
              action_type: get
              volume_entity_id: "{{ _hh_cabinet }}"
              key: lens_registry
            response_variable: _reg_read_raw
          - variables:
              _reg_current: >-
                {%- set raw = _reg_read_raw if _reg_read_raw is mapping else {} -%}
                {%- set val = raw.get('value', {}) -%}
                {%- set parsed = val | from_json if val is string else val -%}
                {{ parsed if parsed is mapping else {} }}
          - action: script.zen_dojotools_filecabinet
            data:
              action_type: write
              volume_entity_id: "{{ _hh_cabinet }}"
              key: lens_registry
              value: "{{ (_reg_current | combine(_reg_entry)) | tojson }}"
          - variables:
              result: >-
                {{ {'mode': 'register', 'result': 'ok', 'status': 'success', 'caller_token': _caller_token,
                    'provider': 'autovac', 'registered': true} }}
          - stop: "autovac lens register"
            response_variable: result

      # ---- lens: unregister -----------------------------------------------------
      - if: "{{ _mode == 'unregister' }}"
        then:
          - action: script.zen_dojotools_filecabinet
            data:
              action_type: get
              volume_entity_id: "{{ _hh_cabinet }}"
              key: lens_registry
            response_variable: _unreg_read_raw
          - variables:
              _unreg_current: >-
                {%- set raw = _unreg_read_raw if _unreg_read_raw is mapping else {} -%}
                {%- set val = raw.get('value', {}) -%}
                {%- set parsed = val | from_json if val is string else val -%}
                {{ parsed if parsed is mapping else {} }}
              _unreg_removed: "{{ 'autovac' in _unreg_current }}"
          - variables:
              _unreg_new: >-
                {%- set ns = namespace(d={}) -%}
                {%- for k, v in _unreg_current.items() -%}
                  {%- if k != 'autovac' -%}{%- set ns.d = ns.d | combine({k: v}) -%}{%- endif -%}
                {%- endfor -%}
                {{ ns.d }}
          - action: script.zen_dojotools_filecabinet
            data:
              action_type: write
              volume_entity_id: "{{ _hh_cabinet }}"
              key: lens_registry
              value: "{{ _unreg_new | tojson }}"
          - variables:
              result: >-
                {{ {'mode': 'unregister', 'result': 'ok', 'caller_token': _caller_token,
                    'provider': 'autovac', 'was_registered': _unreg_removed} }}
          - stop: "autovac lens unregister"
            response_variable: result

      # ---- lens: health ---------------------------------------------------------
      - if: "{{ _mode == 'health' }}"
        then:
          - variables:
              _health_vac_ok: "{{ _vac_ent != '' and states(_vac_ent) not in ['unavailable', 'unknown'] }}"
              _health_cab_ok: "{{ _hh_cabinet != '' }}"
              _health_rooms_ok: "{{ _av_rooms | length > 0 }}"
              _health_gc_ok: "{{ _av_system.get('grocy_catalog', {}) | length > 0 }}"
          - variables:
              result: >-
                {{ {
                  'mode': 'health', 'result': 'ok', 'caller_token': _caller_token,
                  'provider': 'autovac',
                  'status': 'available' if (_health_vac_ok and _health_cab_ok and _health_rooms_ok) else 'degraded',
                  'checks': {
                    'vacuum_entity': _health_vac_ok,
                    'cabinet': _health_cab_ok,
                    'rooms_configured': _health_rooms_ok,
                    'inventory_provisioned': _health_gc_ok
                  },
                  'degraded_capabilities': (
                    ['consumables', 'check_wear'] if not _health_gc_ok else []
                  ) + (
                    ['stacks_by_anchor'] if not _health_rooms_ok else []
                  )
                } }}
          - stop: "autovac lens health"
            response_variable: result

      # ---- lens: inspect --------------------------------------------------------
      - if: "{{ _mode == 'inspect' }}"
        then:
          - variables:
              result: >-
                {{ {
                  'mode': 'inspect', 'result': 'ok', 'caller_token': _caller_token,
                  'provider': 'autovac',
                  'tool': 'zen_dojotools_autovac',
                  'consumes': ['area_id'],
                  'returns': ['cleaning_evidence'],
                  'anchor_match': 'area_id must match room slug (key in autovac cabinet rooms dict)',
                  'evidence_fields': ['id', 'type', 'area_id', 'last_cleaned', 'days_since_cleaned',
                    'days_between', 'due', 'queued', 'elected', 'blockers', 'requires_mop'],
                  'failure_policy': 'soft',
                  'rooms_registered': _av_rooms | list,
                  'inventory_provisioned': _av_system.get('grocy_catalog', {}) | length > 0
                } }}
          - stop: "autovac lens inspect"
            response_variable: result

      # ---- tool_manifest -------------------------------------------------------
      - if: "{{ _mode == 'tool_manifest' }}"
        then:
        - variables:
            result: >-
              {%- import 'zenos_ai/zenos_manifest.jinja' as MF -%}
              {%- set _tm = MF.tool_manifest(
                tool='zen_dojotools_autovac',
                display_name='Autovac',
                tier='dojotools',
                version='5.3.0',
                health='sensor.zen_autovac_health',
                required_labels=['autovac'],
                optional_labels=['autovac_dnd','autovac_water_low','autovac_schedule','autovac_current_room'],
                consumes=['household_cabinet:autovac'],
                returns='status|setup|configure|queue|clean|run|briefing|consumables|check_wear|cleaning_evidence results',
                failure_policy='return error shape',
                modes=['status','help','setup','queue','dequeue','clear','skip','unskip','ready','unready','mark_cleaned','configure','preset','consumables','check_wear','pause','unpause','clean','run_elected','run','analyze','briefing','handle_ack','nightly_reset','morning_reset','kfc_manifest','stacks_by_anchor','register','unregister','health','inspect','tool_manifest'],
                icon='mdi:robot-vacuum',
                color='teal',
                stripe=3,
                impact='soft',
                mcp_exposed=true,
                lens_provider=true,
                caller_token='{{ _caller_token }}'
              ) | from_json -%}
              {{- _tm | combine({'provider_key': 'autovac', 'register_mode': 'register'}) -}}
        - stop: autovac tool manifest
          response_variable: result

      # -- 7 Build status response (status + queue/dequeue/skip/unskip/clear/pause/unpause/clean/configure) --
      - variables:
          _op_result: >-
            {%- set room_modes = ['queue', 'dequeue', 'skip', 'unskip', 'ready', 'unready', 'mark_cleaned', 'configure'] -%}
            {%- if _room == '' and _mode in room_modes -%}error
            {%- elif _mode in room_modes and not _room_exists -%}not_found
            {%- elif _mode == 'status' and _av_rooms | length == 0 -%}not_configured
            {%- else -%}ok{%- endif -%}
          _op_note: >-
            {%- set room_modes = ['queue', 'dequeue', 'skip', 'unskip', 'ready', 'unready', 'mark_cleaned', 'configure'] -%}
            {%- if _room == '' and _mode in room_modes -%}
              room parameter required for mode={{ _mode }}. Run mode=status to see configured rooms.
            {%- elif _mode in room_modes and not _room_exists -%}
              room not found: {{ _room }}. Run mode=status to see configured rooms.
            {%- elif _mode == 'status' and _av_rooms | length == 0 -%}
              No rooms configured. Add rooms via mode=configure room=<slug> config={"enabled":true,"segment":<id>,"days_between":<n>}. Run mode=setup to verify label wiring.
            {%- endif -%}
      - variables:
          _room_decisions: >-
            {%- set elected_names = _elected | map(attribute='room') | list -%}
            {%- set ns = namespace(decisions=[]) -%}
            {%- for rn, rv in _av_rooms.items() -%}
              {%- set enabled = rv.get('enabled', false) -%}
              {%- set last = rv.get('last_cleaned', '') -%}
              {%- set days_since = ((now().timestamp() - as_timestamp(last ~ 'T00:00:00', 0)) / 86400) | int(0) -%}
              {%- set db = rv.get('days_between', 7) -%}
              {%- set due = days_since >= db -%}
              {%- set queued = rv.get('queued', false) -%}
              {%- set skip_next = rv.get('skip_next', false) -%}
              {%- set req_ready = rv.get('requires_ready', rv.get('require_confirmation', false)) -%}
              {%- set is_rdy = rv.get('is_ready', rv.get('ready_to_clean', false)) -%}
              {%- set elected = rn in elected_names -%}
              {%- set _wla = _av_system.get('water_low_action', 'warn') | lower -%}
              {%- set b0 = ['disabled'] if not enabled else [] -%}
              {%- set b1 = b0 + ['not_due'] if (not due and not queued) else b0 -%}
              {%- set b2 = b1 + ['skip_next'] if skip_next else b1 -%}
              {%- set b3 = b2 + ['not_ready'] if (req_ready and not is_rdy) else b2 -%}
              {%- set blockers = b3 + ['water_low'] if (rv.get('requires_mop', false) and _water_low and _wla == 'stop') else b3 -%}
              {%- set reason = (
                'Elected for next run.' if elected else
                'Disabled.' if not enabled else
                'Skipped this run.' if skip_next else
                'Not ready — call mode=ready room=' ~ rn ~ '.' if (req_ready and not is_rdy) else
                'Water low — mop room blocked (water_low_action=stop).' if ('water_low' in blockers) else
                ('Not due yet (' ~ days_since ~ '/' ~ db ~ ' days).' if (not due and not queued) else 'Not elected.')
              ) -%}
              {%- set ns.decisions = ns.decisions + [{
                'room': rn,
                'enabled': enabled,
                'days_since_cleaned': days_since,
                'days_between': db,
                'due': due,
                'queued': queued,
                'skip_next': skip_next,
                'requires_ready': req_ready,
                'is_ready': is_rdy,
                'segment': rv.get('segment', 0),
                'last_cleaned': rv.get('last_cleaned', ''),
                'requires_mop': rv.get('requires_mop', false),
                'elected': elected,
                'blockers': blockers,
                'reason': reason
              }] -%}
            {%- endfor -%}
            {{ ns.decisions }}
      - variables:
          _run_readiness: >-
            {%- set ns = namespace(b=[]) -%}
            {%- if not _enabled -%}{%- set ns.b = ns.b + ['system_disabled'] -%}{%- endif -%}
            {%- if _av_system.get('pause_today', false) -%}{%- set ns.b = ns.b + ['paused_today'] -%}{%- endif -%}
            {%- if _dnd -%}{%- set ns.b = ns.b + ['dnd'] -%}{%- endif -%}
            {%- if _battery < (_av_system.get('minimum_battery', 20) | int(20)) -%}{%- set ns.b = ns.b + ['low_battery'] -%}{%- endif -%}
            {%- if _vacuum_state not in ['docked', 'idle'] -%}{%- set ns.b = ns.b + ['vacuum_not_ready'] -%}{%- endif -%}
            {%- set _wla = _av_system.get('water_low_action', 'warn') | lower -%}
            {%- set _mop_ent = _elected | selectattr('requires_mop', 'equalto', true) | list -%}
            {%- if _water_low and _mop_ent | length > 0 and _wla == 'stop' -%}{%- set ns.b = ns.b + ['water_low_mop_required'] -%}{%- endif -%}
            {%- if _elected | length == 0 -%}{%- set ns.b = ns.b + ['no_rooms_elected'] -%}{%- endif -%}
            {%- set can_run = ns.b | length == 0 -%}
            {%- set reason = (
              'Ready to run.' if can_run else
              'System disabled.' if 'system_disabled' in ns.b else
              'Paused today.' if 'paused_today' in ns.b else
              'DnD active.' if 'dnd' in ns.b else
              ('Battery too low (' ~ _battery ~ '%).') if 'low_battery' in ns.b else
              ('Vacuum not ready — state: ' ~ _vacuum_state ~ '.') if 'vacuum_not_ready' in ns.b else
              'Water low — mop rooms blocked (water_low_action=stop).' if 'water_low_mop_required' in ns.b else
              'No rooms elected for this run.'
            ) -%}
            {{ {'can_run_now': can_run, 'blockers': ns.b, 'reason': reason} }}
      - variables:
          _schedule_report: >-
            {%- set ns = namespace(scheds=[]) -%}
            {%- for s in label_entities('autovac_schedule') -%}
              {%- set hrk = s | replace('.', '_') | replace('-', '_') ~ '_has_run' -%}
              {%- set ne  = state_attr(s, 'next_event') -%}
              {%- set ns.scheds = ns.scheds + [{
                'entity': s,
                'state': states(s),
                'has_run_today': _av_system.get(hrk, false),
                'next_event': ne | string if ne is not none else none
              }] -%}
            {%- endfor -%}
            {{ ns.scheds }}
          _system_config: >-
            {{ {
              'enabled':          _enabled,
              'pause_today':      _av_system.get('pause_today', false),
              'water_low_action': _av_system.get('water_low_action', 'warn'),
              'minimum_battery':  _av_system.get('minimum_battery', 20) | int(20)
            } }}
          _last_run: "{{ _av_system.get('current_run', none) }}"
      - if: "{{ label_entities('autovac_calendar') | list | length > 0 }}"
        then:
          - action: calendar.get_events
            target:
              entity_id: "{{ label_entities('autovac_calendar') | list }}"
            data:
              start_date_time: "{{ now().replace(hour=0,minute=0,second=0,microsecond=0).isoformat() }}"
              end_date_time: "{{ (now() + timedelta(days=7)).replace(hour=23,minute=59,second=59,microsecond=0).isoformat() }}"
            response_variable: _cal_7day_raw
            continue_on_error: true
      - variables:
          _schedule_7day: >-
            {%- set days_raw = _schedule_7day -%}
            {%- set ns = namespace(days=[]) -%}
            {%- for day in days_raw -%}
              {%- set nev = namespace(events=[], hold=false) -%}
              {%- if _cal_7day_raw is defined and _cal_7day_raw is mapping -%}
                {%- for eid, evts in _cal_7day_raw.items() -%}
                  {%- for evt in evts | default([]) -%}
                    {%- set evt_date = as_datetime(evt.get('start','')).strftime('%Y-%m-%d') if evt.get('start','') != '' else '' -%}
                    {%- if evt_date == day.get('date','') -%}
                      {%- set summ = evt.get('summary','') | default('',true) -%}
                      {%- set is_hold = 'AUTOVAC HOLD' in summ | upper or 'AUTOVAC HOLD' in evt.get('description','') | default('',true) | upper -%}
                      {%- if is_hold -%}{%- set nev.hold = true -%}{%- endif -%}
                      {%- set nev.events = nev.events + [{'summary': summ, 'hold': is_hold}] -%}
                    {%- endif -%}
                  {%- endfor -%}
                {%- endfor -%}
              {%- endif -%}
              {%- set ns.days = ns.days + [day | combine({'hold': nev.hold, 'calendar_events': nev.events})] -%}
            {%- endfor -%}
            {{ ns.days }}
      - variables:
          response: >-
            {{ {
              'mode': _mode,
              'result': _op_result | trim,
              'note': _op_note | trim,
              'caller_token': _caller_token,
              'integration': 'roborock_native' if _use_clean_area else 'xiaomi_miio',
              'vacuum_state': _vacuum_state,
              'vacuum_entity': _vac_ent,
              'battery_pct': _battery,
              'water_low': _water_low,
              'dnd': _dnd,
              'system_config': _system_config,
              'current_room': states(_current_room_ent) if _current_room_live else none,
              'elected_rooms': _elected,
              'queued_rooms': _queued_rooms,
              'skipped_rooms': _skipped_rooms,
              'last_run': _last_run,
              'schedule_entities': _schedule_report,
              'next_schedule': _next_schedule,
              'schedule_active': _schedule_active,
              'schedule_7day': _schedule_7day,
              'room_decisions': _room_decisions,
              'run_readiness': _run_readiness
            } }}

      - stop: "autovac {{ _mode }} complete"
        response_variable: response

    mode: parallel
    max: 5
    icon: mdi:robot-vacuum

###############################################################################
# Autovac — Controller Automation
#
# Single automation, all label/event/time triggers. Routes by trigger.id.
# Named-entity triggers (vacuum error state, camera blueprint) stay in the
# personal kfc_trigger_autovac.yaml.
###############################################################################

automation:

  - id: 'zen_autovac_controller'
    alias: Zen Autovac — Controller
    description: >-
      Single-entry-point controller for all autovac events. Routes by trigger.id
      to zen_dojotools_autovac modes. Named-entity triggers remain in the
      personal KFC file.
    triggers:

      - trigger: vacuum.returned_to_dock
        target:
          label_id: autovac
        options:
          behavior: each
          for: "00:00:05"
        id: dock

      - trigger: template
        value_template: >-
          {{ expand(label_entities('autovac_schedule'))
             | selectattr('state', 'equalto', 'on') | list | count > 0 }}
        id: schedule_on

      - trigger: time_pattern
        minutes: /30
        id: briefing_timer

      - trigger: event
        event_type: zen_event
        event_data:
          event:
            kind: autovac_prerun_briefing
        id: briefing_manual

      - trigger: time
        at: "00:00:00"
        id: nightly

      - trigger: event
        event_type: zen_event
        event_data:
          event:
            kind: postman_ack
            ack_owner: autovac
        id: ack

      - trigger: homeassistant
        event: start
        id: ha_start

    mode: queued
    max: 5
    actions:

      - choose:

          - conditions:
              - condition: trigger
                id: dock
            sequence:
              - action: script.zen_dojotools_autovac
                data:
                  mode: analyze
                  trigger_id: docked
              - action: script.zen_dojotools_autovac
                data:
                  mode: check_wear
              - delay: "00:01:00"
              - action: script.zen_dojotools_ninja_summarizer
                data:
                  kung_fu_component_id: autovac
                  force: true
              - event: zen_event
                event_data:
                  event:
                    kind: autovac_docked
            alias: Dock — analyze, wear check, ninja refresh, latch event

          - conditions:
              - condition: trigger
                id: schedule_on
            sequence:
              - variables:
                  _s: >-
                    {{ expand(label_entities('autovac_schedule'))
                       | selectattr('state', 'equalto', 'on')
                       | sort(attribute='last_changed', reverse=True)
                       | map(attribute='entity_id') | list | first | default('') }}
              - if: "{{ _s == '' }}"
                then:
                  - stop: "no autovac schedule currently on — race condition, skipping"
              - action: script.zen_dojotools_autovac
                data:
                  mode: schedule
                response_variable: _run_sched_resp
              - variables:
                  _sched_p: >-
                    {{ ((_run_sched_resp.get('valid_today', [])
                         | selectattr('entity', 'equalto', _s) | list | first) or {}).get('priority', 99) }}
              - if: "{{ _sched_p | int >= 99 }}"
                then:
                  - stop: "autovac schedule not valid for today"
              - variables:
                  _sched_winner: >-
                    {%- set ns = namespace(w=true) -%}
                    {%- for other in label_entities('autovac_schedule') | list -%}
                      {%- if other != _s and states(other) == 'on' -%}
                        {%- set op = ((_run_sched_resp.get('valid_today', [])
                                       | selectattr('entity', 'equalto', other) | list | first) or {}).get('priority', 99) -%}
                        {%- if op | int < _sched_p | int -%}{%- set ns.w = false -%}{%- endif -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {{ ns.w }}
              - if: "{{ not _sched_winner }}"
                then:
                  - stop: "higher-priority autovac schedule active — deferring"
              - if: "{{ label_entities('autovac_calendar') | list | length > 0 }}"
                then:
                  - action: calendar.get_events
                    target:
                      entity_id: "{{ label_entities('autovac_calendar') | list }}"
                    data:
                      start_date_time: "{{ now().isoformat() }}"
                      end_date_time: "{{ (now() + timedelta(hours=4)).isoformat() }}"
                    response_variable: _run_cal_raw
                    continue_on_error: true
              - variables:
                  _run_cal_hold: >-
                    {%- set ns = namespace(hold=false) -%}
                    {%- if _run_cal_raw is defined and _run_cal_raw is mapping -%}
                      {%- for eid, evts in _run_cal_raw.items() -%}
                        {%- for evt in evts | default([]) -%}
                          {%- set s2 = evt.get('summary','') | default('',true) | upper -%}
                          {%- set d2 = evt.get('description','') | default('',true) | upper -%}
                          {%- if (s2 | trim == 'AUTOVAC HOLD' or s2 | trim | regex_match('^AUTOVAC HOLD[: ]')) or (d2 | trim == 'AUTOVAC HOLD' or d2 | trim | regex_match('^AUTOVAC HOLD[: ]')) -%}{%- set ns.hold = true -%}{%- endif -%}
                        {%- endfor -%}
                      {%- endfor -%}
                    {%- endif -%}
                    {{ ns.hold }}
              - if: "{{ _run_cal_hold }}"
                then:
                  - stop: "autovac run blocked by AUTOVAC HOLD calendar event"
              - action: script.zen_dojotools_autovac
                data:
                  mode: run
                  schedule_entity_id: "{{ trigger.entity_id }}"
              - if: "{{ trigger.entity_id in label_entities('autovac_morning') | list }}"
                then:
                  - action: script.zen_dojotools_autovac
                    data:
                      mode: morning_reset
            alias: "Scheduled run — cascade filters: valid-today, cascade-winner, morning_reset"

          - conditions:
              - condition: trigger
                id: briefing_timer
            sequence:
              - action: script.zen_dojotools_autovac
                data:
                  mode: schedule
                  window_start: 300
                  window_end: 1800
                response_variable: _precheck_resp
              - if: "{{ (_precheck_resp.get('in_window') or {}).get('entity', '') != '' }}"
                then:
                  - event: zen_event
                    event_data:
                      event:
                        kind: autovac_prerun_briefing
            alias: Pre-run window check — fire zen_event once if valid schedule upcoming

          - conditions:
              - condition: trigger
                id: briefing_manual
            sequence:
              - action: script.zen_dojotools_autovac
                data:
                  mode: briefing
            alias: Pre-run briefing (zen_event or manual trigger)

          - conditions:
              - condition: trigger
                id: nightly
            sequence:
              - action: script.zen_dojotools_autovac
                data:
                  mode: nightly_reset
            alias: Nightly reset

          - conditions:
              - condition: trigger
                id: ack
            sequence:
              - action: script.zen_dojotools_autovac
                data:
                  mode: handle_ack
                  ack_action:  "{{ trigger.event.data.event.ack_action | lower | trim }}"
                  ack_context: "{{ trigger.event.data.event.ack_context | default('') }}"
                  pm_tag:      "{{ trigger.event.data.event.pm_tag | default('') }}"
            alias: Postman ack handler

          - conditions:
              - condition: trigger
                id: ha_start
            sequence:
              - variables:
                  _hh_cab: >-
                    {{ label_entities('Zen Household Cabinet')
                       | select('match', 'sensor\\.') | list | first | default('') }}
                  _vac: >-
                    {{ label_entities('autovac')
                       | select('match', 'vacuum\\.') | list | first | default('') }}
              - if: >-
                  {%- if _hh_cab == '' or _vac == '' -%}{{ false }}
                  {%- else -%}
                    {%- import 'zenos_ai/zenos_cabinets.jinja' as CABS -%}{%- set av_cfg = CABS.cabinet_drawer_value_mounted(_hh_cab, 'autovac') | from_json -%}
                    {{ av_cfg.get('system', {}).get('current_run', {}).get('rooms', []) | length > 0
                       and states(_vac) == 'docked' }}
                  {%- endif -%}
                then:
                  - action: script.zen_dojotools_autovac
                    data:
                      mode: analyze
                      trigger_id: docked
            alias: HA start — catch-up analyze if run completed during restart

  # ---------------------------------------------------------------------------
  # PENDING — Real-Time Wear Sensor Alert
  # Blocked: numeric_state does NOT support target: label_id: as of HA 2026.5.
  # When HA adds support, add trigger: numeric_state target: label_id: autovac_wear
  # below: 21 → mode=check_wear wear_entity={{ trigger.entity_id }} here.
  # ---------------------------------------------------------------------------
