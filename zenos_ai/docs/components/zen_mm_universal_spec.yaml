spec:
  id: zen_mm_universal
  version: "1.0.0"
  contract_owner: zen_dojotools_media_manager
  status: required_for_activity_system

  entity_requirements:
    labels:
      required:
        - zen_mm_universal
        - <room_area_slug>          # e.g. living_room
      one_per_room: true
    domain: media_player
    platform: universal            # HA built-in, or equivalent custom platform

  service_contract:
    select_source:
      description: >
        Primary ZenOS entry point. Called by activity_apply with the activity
        name as the source string. The UMP MUST translate this to a full
        multi-device sequence internally. ZenOS does not manage sequencing,
        delays, or device prerequisites.
      input:
        source: string             # activity name from the registry, verbatim
      household_responsibility:
        - map activity name to physical device commands
        - handle device power-on order
        - wait for device ready state before sending source commands
        - handle conflicts (e.g. Friday interrupts music)

    turn_on:
      description: Power on primary room device(s)
      household_responsibility:
        - define "primary" for this room
        - sequencing if multiple devices

    turn_off:
      description: Power off room gracefully
      household_responsibility:
        - define shutdown order
        - stop active playback before power-off if needed

    volume_up:
      routes_to: room volume authority (typically AVR)
    volume_down:
      routes_to: room volume authority
    volume_set:
      routes_to: room volume authority
    volume_mute:
      routes_to: room volume authority

    media_play:
      routes_to: active_child (via active_child_template)
    media_pause:
      routes_to: active_child
    media_stop:
      routes_to: active_child
    media_next_track:
      routes_to: active_child
    media_previous_track:
      routes_to: active_child

  attribute_contract:
    source:
      description: >
        Currently active activity name. Must match an activity name in the
        ZenOS registry (or be close enough for activity_snapshot to capture).
        Do NOT return raw FireTV package IDs or app bundle strings here.
      type: string
      example: "Xbox"

    source_list:
      description: >
        Enumeration of all valid activity names this UMP accepts via
        select_source. Used by discover to show available activities in a room.
        Keep in sync with your route_activity script's choose blocks.
      type: list[string]
      example: ["Xbox", "YouTube", "Netflix", "Media Player", "AV Receiver UI", "Music"]

    volume_level:
      description: Room volume 0.0–1.0. Read from volume authority (AVR).
      source: state_attr(avr_entity, 'volume_level')

    is_volume_muted:
      description: Room mute state. Read from volume authority.
      source: state_attr(avr_entity, 'is_volume_muted')

  activity_registry_schema:
    description: >
      Each activity stored in ZenOS cabinet (key: media_activities_<room_slug>)
      uses channel-based schema. The channel value is passed verbatim to
      select_source on the zen_mm_universal entity.
    schema:
      "<ActivityName>":
        channel: string            # passed to select_source — must match UMP source_list
    example:
      Xbox:
        channel: "Xbox"
      YouTube:
        channel: "YouTube (FireTV)"
      Music:
        channel: "HEOS Music"
      Media Player:
        channel: "Media Player"

  sequencing_guidance:
    principle: >
      The UMP implementation owns ALL sequencing. ZenOS sends one
      select_source call and considers the activity applied.
    recommended_pattern:
      step_1: Turn on AVR (fast, rarely needs boot wait)
      step_2: Turn on TV
      step_3: wait_template until TV state not in [off, unavailable, unknown]
      step_3_timeout: 20 seconds recommended
      step_4: select_source on TV
      step_5: select_source on AVR
    anti_patterns:
      - select_source before turn_on
      - select_source immediately after turn_on without wait_template
      - fixed sleep delays instead of wait_template (fragile, device-specific)
    ha_primitive: wait_template with timeout

  zenos_responsibility:
    - activity name registry (cabinet key media_activities_<room>)
    - activity_get / activity_set / activity_apply / activity_snapshot modes
    - label resolution (zen_mm_universal per room)
    - LLM-facing surface (Friday calls activity_apply, not select_source directly)
    - discover room topology showing registered activities

  household_responsibility:
    - UMP YAML definition (media_player: platform: universal)
    - route_activity script with choose blocks per activity
    - boot wait logic (wait_template)
    - HDMI port map
    - AVR input routing
    - conflict resolution policies
    - source_list kept in sync with registered activities

  compliance_checklist:
    - entity labeled zen_mm_universal + room area label
    - select_source routes to route_activity script
    - source attribute returns current activity name (not raw app IDs)
    - source_list enumerates valid activity names
    - volume commands route to AVR or room volume authority
    - turn_on and turn_off work
    - active_child_template returns correct child for play/pause/skip
    - activity names registered in ZenOS cabinet via activity_set

  registration:
    verify_command: "zen_dojotools_media_manager mode=discover room=<room>"
    expected_output: "role: zen_mm_universal with your entity_id in roles list"
    seed_command: "zen_dojotools_media_manager mode=activity_set room=<room> activity_name=<name> channel=<source_string>"
